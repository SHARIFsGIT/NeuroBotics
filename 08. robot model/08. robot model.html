ে, আর মাপা গেছে শূন্য command-এ +52 rad/s।"},{"label":"x50 স্কেলিং ও wheel_separation","latex":"\\[ 50 \\times 4.4525\\times10^{-5} = 2.226\\times10^{-3}, \\quad 50 \\times 7.4596\\times10^{-5} = 3.730\\times10^{-3}\\ \\mathrm{kg\\,m^{2}}; \\qquad d = 0.075-(-0.075) = 0.15\\ \\mathrm{m} \\]","text":"x50 করলেই ফাইলে লেখা মানগুলো আসে: ixx 2.226e-3 আর izz 3.730e-3, যা 2 N m-এ ত্বরণ নামায় প্রায় 536 rad/s^2-এ, অর্থাৎ step-প্রতি মাত্র 0.5 rad/s লাফ, loop সামলানো যায়। আর দুই পাশের joint origin-এর y = 0.075 বিয়োগ করলেই wheel_separation 0.15 m, Part 11-এর controller parameterের সঠিক মান।"}]},"robot":{"correct":"চারটি continuous wheel joint-ই ros2_control block-এ velocity command_interface পায়, তাই my_controllers.yaml-এর diff_cont বাম জোড়া আর ডান জোড়ায় একই command পাঠালে robot সোজা এগোয়, কারণ দুই পাশের axis-sign কনভেনশন আয়না-সম: দুই পাশেই ধনাত্মক velocity মানে সামনে। x50 inertia, 2 N m effort ছাদ আর damping-মুক্ত joint মিলিয়ে চাকা প্রতি 1 ms step-এ স্থিতিশীল থাকে, আর /joint_states-এ চার চাকার মসৃণভাবে ক্রমবর্ধমান কোণ দেখা যায়।","incorrect":"কেউ চাকাকে শক্তিশালী করতে effort 5 N m তুলে দিলে বা বাস্তব যন্ত্রের মতো damping আর friction ফিরিয়ে আনলে ODE-র 1 ms step-এ প্রতি ধাপে bang-bang overshoot শুরু হয়: চাকা শূন্য command-এও পঞ্চাশ rad/s মাত্রায় oscillate করে, robot এমনিই পিছনে গড়িয়ে যায়, আর বাগটি দেখতে wiring ভুলের মতোই লাগে। README-র fix-log স্পষ্ট বলে: effort ছাদ 2 N m-এর উপরে তোলা বা damping/friction ফেরানো নিষেধ।"},"animType":"wheelPhysics"},{"n":9,"id":"part-09","fname":"neurobotics.urdf","enTitle":"ros2_control — Fifteen Joints Wired","lang":"xml","start":1193,"end":1332,"flags":[],"explain":[{"a":1193,"b":1208,"text":"এখন আসছে এই URDF-এর শেষ link: <code>arm_base_Link<\/code> — arm-এর গোড়ার মাউন্টিং boss, chassis-এর ওপর বসানো ছোট কড়ার CAD রপ্তানি। inertial অংশে mass <code>0.00784879<\/code> kg, অর্থাৎ আট গ্রামেরও কম, আর inertia-র মান <code>3.5623e-6<\/code> ঘরে। Part 4-এর base_link-এর মতো এখানে কোনো হাতে-লেখা সংশোধন নেই — SolidWorks যা মেপেছে তাই দাঁড়িয়ে আছে, কারণ এই হালকা অনুষঙ্গ-link-এর inertia dynamics-এ কোনো পার্থক্য গড়ে দেয় না। inertial origin-এর শখের দশমিক (xyz <code>0.00204 -5.8e-05 -0.001<\/code>) CAD মডেলের mass-center অফসেট; off-diagonal ixy, ixz, iyz প্রায় শূন্য কিন্তু হুবহু শূন্য নয় — বাস্তব CAD রপ্তানির ছাপ, Part 5-এর arm joint-গুলোর tiny rpy-র মতোই।"},{"a":1209,"b":1231,"text":"visual আর collision দুটোতেই একই mesh: <code>package://neurobotics/meshes/arm_base_Link.STL<\/code>। material-এর name attribute খালি রাখা হয়েছে, কিন্তু color rgba <code>0.298 0.298 0.298 1<\/code> — গাঢ় ধূসর, arm5 আর DCW2-এর মতো একই গা-ঢালা পরিবারের রং। লোডারের চোখে এর অর্থ: robot_state_publisher এই link-টির নাম TF tree-তে বসাবে, RViz এখানে STL mesh এঁকে দেবে, আর Gazebo Classic collision-এর এই mesh থেকেই contact geometry বানাবে। রঙের দুই রাজত্বের গল্প মনে রাখুন: mesh-এর এই rgba শুধু RViz-এর জন্য, কিন্তু পরের Part-এ দেখবে Gazebo-র নিজস্ব material টেবিল এই link-কে সম্পূর্ণ অন্য রঙে — <code>Gazebo/Green<\/code> — রাঙিয়ে দেয়; সবুজটা sim-জগতের চেহারা-সিদ্ধান্ত মাত্র, বাস্তব machine-এর গায়ের রঙ নিয়ে ফাইল নীরব।"},{"a":1232,"b":1243,"text":"link বন্ধ করে এবার আসে joint-টি: <code>arm_base_Joint<\/code>, type <code>fixed<\/code>, parent <code>base_link<\/code>, child <code>arm_base_Link<\/code>, origin xyz <code>0.033617 -1.0031e-05 0.1475<\/code>, rpy <code>6.3751e-05 0 0.028395<\/code>। সংখ্যাগুলো কোথা থেকে চেনা চেনা লাগছে? Part 5-এর <code>arm1_Joint<\/code>-এর origin ছিল xyz <code>0.033617 -1.2421e-05 0.185<\/code> আর rpy হুবহু একই — একই CAD মাউন্টিং অবস্থান, শুধু z-এ 3.75 cm ফারাক: boss-এর শীর্ষ থেকে সোজা ওপরেই arm1-এর ঘূর্ণন-কেন্দ্র। আরেকটি সূক্ষ্ম তথ্য: arm1_Joint-এর parent এই arm_base_Link নয়, সরাসরি base_link — boss-টি নিছক জ্যামিতিক সংযোজন, kinematic chain-এর সদস্য নয়। fixed joint বলে Gazebo একে base_link-এ weld করে ফেলবে, আলাদা dynamics জন্মাবে না।"},{"a":1245,"b":1248,"text":"এবার এই ফাইলের সবচেয়ে গুরুত্বপূর্ণ অংশ: <code>ros2_control<\/code> ব্লক, name <code>NeuroboticsSim<\/code>, type <code>system<\/code>। এ পর্যন্ত যা পড়া হলো তা জ্যামিতি আর পদার্থবিজ্ঞানের বর্ণনা; এই ব্লকটি হলো hardware interface-এর ঘোষণাপত্র। robot_state_publisher বা xacro এটি নিয়ে কিছুই করে না — প্রয়োজন হয় spawn-এর পর, যখন <code>libgazebo_ros2_control.so<\/code> plugin ঠিক এই ব্লকটি পড়ে controller_manager-এর কাছে ১৫টি joint interface খুলে দেয়। hardware অংশের plugin <code>gazebo_ros2_control/GazeboSystem<\/code> — simulation-এর motor-driver আর encoder-এর চরিত্র একসাথে নেয়: Gazebo physics-এর joint-গুলোকে ros2_control-এর command ও state pipeline-এর সাথে জুড়ে দেয়। বাস্তব robot-এ শুধু এই plugin-টুকুই বদলাত, বাকি URDF অভিন্ন থাকত।"},{"a":1249,"b":1268,"text":"প্রথম চারটি joint হলো wheel: <code>lwheel1_Joint<\/code>, <code>lwheel2_Joint<\/code>, <code>rwheel1_Joint<\/code>, <code>rwheel2_Joint<\/code> — প্রত্যেকটিতে <code>command_interface<\/code>-এর নাম <code>velocity<\/code>, অর্থাৎ controller এদের কাছে লিখবে কৌণিক বেগ rad/s-এ, কোণ নয়। Part 8-এর পুরো সংগ্রামের সিলাকাঠি এখানে: effort 2 N m-এর velocity motor আর x50-scaled inertia মিলে যে স্থিতিশীল ঘূর্ণন দাঁড়াল, এই interface-ই তার টার্গেট রেফারেন্স বহন করবে। সঙ্গে দুটি state_interface — position আর velocity — encoder-এর মতো প্রতি cycle-এ বর্তমান অবস্থা ফেরত দেয়; Part 11-এর diff_cont আর joint_state_broadcaster দুজনেই এগুলো পড়ে। চার wheel চারটি আলাদা interface পায়, যদিও diff-drive লজিক বাম-ডান জোড়ায় একই কমান্ড পাঠায়।"},{"a":1269,"b":1293,"text":"এরপর arm-এর পাঁচটি joint — <code>arm1_Joint<\/code> থেকে <code>arm5_Joint<\/code> — প্রতিটিতে <code>command_interface<\/code>-এর নাম <code>position<\/code>। arm আর wheel-এর ভাষাই তাই আলাদা: wheel শোনে কত দ্রুত ঘুরতে হবে, arm শোনে কোন কোণে দাঁড়াতে হবে। Part 5-এ দেখা limit-গুলোর (effort 100, velocity 1, সীমা arm1-4-এ ±1.5708 আর arm5-এ -1.5708..3.1416) এখানে পুনরাবৃত্তি নেই — এই ব্লক শুধু interface-এর ধরন ঘোষণা করে; limit মান থেকে গেল URDF joint-এর কাছে, আর Gazebo plugin সেগুলোই enforce করে। state_interface জোড়া আগের মতোই position ও velocity। arm_gui-র slider ঘুরিয়ে <code>/arm_cont/commands<\/code>-এ যে মানগুলো যায়, এই পাঁচটি interface-ই সেগুলো এক এক করে গ্রহণ করে।"},{"a":1294,"b":1323,"text":"শেষ ছয়টি ব্লক gripper-এর: <code>rlink1_Joint<\/code>, <code>rlink2_Joint<\/code>, <code>llink1_Joint<\/code>, <code>llink2_Joint<\/code>, <code>rlink3_Joint<\/code>, <code>llink3_Joint<\/code> — সবগুলোতে position command_interface। Part 6-এ দেখেছিলাম যান্ত্রিকভাবে rlink1-ই একমাত্র চালিত joint, বাকি পাঁচটি <code>mimic<\/code> ট্যাগে তার জ্যামিতিক অনুকরণ করে। কিন্তু mimic ট্যাগ kinematic সম্পর্কের দলিল — hardware interface-এর নয়; simulation-এ প্রতিটি joint-কে নিজের interface লাগে। তাই Part 11-এর arm_cont একসাথে ১১টি joint-এর position কমান্ড করে — পাঁচটি arm আর এই ছয়টি — আর README-র topic টেবিলও (Part 2) বলে <code>/arm_cont/commands<\/code> বহন করে ১১টি position। মোট হিসাব: ৪টি velocity + ১১টি position = ১৫টি interface, ঠিক যে সংখ্যা এই Part-এর শিরোনামে।"},{"a":1324,"b":1332,"text":"ros2_control ব্লক বন্ধ হলো, কিন্তু ঘোষণা একা চলে না — চাই একজন লোডার। সেটিই পাশের gazebo element: plugin <code>libgazebo_ros2_control.so<\/code>, আর তার parameters-এ <code>$(find neurobotics)/config/my_controllers.yaml<\/code>। launch ফাইল (Part 13) xacro দিয়ে এই URDF প্রসেস করার সময় <code>$(find ...)<\/code> টোকেনটিকে package-এর install পাথে বদলে দেয় — এজন্যই launch ছাড়া ফাইলটি খুললে টোকেন অবিকৃত দেখায়। ইনলাইন কমেন্টের সতর্কতাটি অভিজ্ঞতার সার: পাথ অবশ্যই package-relative থাকবে, কখনো absolute machine path নয় — নইলে অন্য কারো মেশিনে plugin yaml খুঁজে পাবে না। ওই yaml (Part 11) তিনটি controller ঘোষণা করে, আর Part 13-এর event handler সেগুলো ঠিক spawn শেষ হওয়ার পরেই চালু করে — কোনো guessed sleep নেই।"}],"math":null,"robot":{"correct":"spawn-এর পর <code>libgazebo_ros2_control.so<\/code> এই ১৫টি interface খুলে দেয় — ৪টি wheel-এ velocity, ১১টি arm ও gripper-এ position; robot_state_publisher আগেই arm_base_Link-কে fixed TF frame হিসেবে বসিয়েছে। yaml-এর তিন controller চালু হলে terminal-এ ros2 control list_controllers দেখায় joint_broad, diff_cont, arm_cont সব active। <code>/diff_cont/cmd_vel_unstamped<\/code>-এ velocity গেলে wheel ঘোরে, <code>/arm_cont/commands<\/code>-এ ১১টি position গেলে arm ও gripper নড়ে।","incorrect":"যে ভুলটি সবচেয়ে বেশি হয়: <code>$(find neurobotics)<\/code>-এর জায়গায় নিজের মেশিনের absolute পাথ লিখে দেওয়া — নিজের কম্পিউটারে চলে, কিন্তু অন্য মেশিনে plugin yaml খুঁজে পায় না, controller_manager ফাঁকা থাকে, spawn শেষ হয় ঠিকই কিন্তু robot কোনো cmd_vel শোনে না। আরেকটি প্রচলিত ভ্রম: এই ব্লকটি ফাইল পড়ার সময়েই controller চালু করে ফেলে ভাবা — আসলে লোডার ছাড়া এ কেবল নীরব ঘোষণা।"},"animType":"ros2Ctrl"},{"n":10,"id":"part-10","fname":"neurobotics.urdf","enTitle":"Gazebo Layer — Materials, Friction, Sensors","lang":"xml","start":1333,"end":1442,"flags":[],"explain":[{"a":1333,"b":1342,"text":"এবার Gazebo লেয়ার — URDF-এর এই শেষ অংশ robot_state_publisher পড়ে না; এটি পড়ে Gazebo Classic, spawn-এর সময় URDF থেকে SDF-এ রূপান্তরের পর। কমেন্ট বলছে one entry per link — প্রতিটি link-এর জন্য আলাদা <code>gazebo reference<\/code> দিয়ে material। base_link পাচ্ছে <code>Gazebo/Grey<\/code>, arm1 <code>Gazebo/Silver<\/code>, arm2, arm3, arm4 <code>Gazebo/White<\/code>, arm5 <code>Gazebo/DarkGrey<\/code>, আর গোড়ার <code>arm_base_Link<\/code> পাচ্ছে <code>Gazebo/Green<\/code> — উপরের Part 9-এ mesh-এর rgba ধূসর হলেও Gazebo-তে এটি সবুজ দেখাবে। কারণটি সরল: URDF-এর রঙ RViz আঁকে, কিন্তু Gazebo Classic রূপান্তরের সময় নিজের material library থেকে রঙ নেয় — প্রতিটি link-এর চেহারা দুই জগতে দুই রকম হতে পারে।"},{"a":1343,"b":1353,"text":"এই অংশের লাইনগুলোতে <code>Gripping<\/code>, ছয়টি r ও llink (সব <code>Gazebo/White<\/code>) আর চারটি wheel (<code>Gazebo/Black<\/code> — tyre-এর পরিচয় অটুট)। আর এক ধাপ পেছনে, আগের এন্ট্রির শেষেই <code>DCW2<\/code> নামটি দুবার এসেছে — আগে <code>Gazebo/Grey<\/code>, পরে <code>Gazebo/DarkGrey<\/code>। স্পষ্ট ডুপ্লিকেট, কিন্তু ফলাফল নিরীহ: SDF রূপান্তরকারী একই reference-এর শেষ এন্ট্রিটিকে আগেরটির ওপর বসায়, তাই কার্যকর রং DarkGrey। শিক্ষাটি মূল্যবান: duplicate এন্ট্রি কোনো error ছাড়ে না, চুপচাপ last-wins হয়ে যায় — বড় ফাইলে এমন নীরব overwrite ধরাই আলাদা দক্ষতা। এরপর আসছে আসল পদার্থবিদ্যা: friction।"},{"a":1355,"b":1360,"text":"Friction অংশে মাত্র পাঁচটি লাইন, কিন্তু diff-drive-এর ট্র্যাকশনের পুরো ভিত্তি এখানে। চার wheel-এ <code>mu1<\/code> ও <code>mu2<\/code> দুটোই <code>1.2<\/code> — mu1 চলার দিকের, mu2 তার লম্ব দিকের friction সহগ; বেশি মান মানে শক্ত আঁকড়ানো grip, যাতে Part 8-এর velocity motor-এর ঘূর্ণন স্লিপ না করে মেঝেতে ধাক্কা দিতে পারে। আর <code>base_link<\/code>-এ মান <code>0.5<\/code> — wheel-এর 1.2-এর অর্ধেক নয়, তার চেয়েও কম; chassis অপেক্ষাকৃত পিচ্ছিল, যাতে শরীর মাটি ঘেঁষলে মেঝে তাকে টেনে ধরে না ফেলে। বাকি সব link-এর (arm, gripper, sensor frame) কিছুই বলা হয়নি — তারা ডিফল্ট friction-এই চলে। robot মেঝেতে পিছলে গেলে ডায়াগনোসিস শুরু হবে এই পাঁচ লাইন থেকেই।"},{"a":1362,"b":1366,"text":"Sensors অংশের ভূমিকা-কমেন্টটি নিজেই একটি design decision-এর দলিল। ray sensor বসবে <code>laser1_frame<\/code>-এ — সামনের ডান কোণের মাউন্ট, যার origin Part 7-এ দেখেছিলাম: <code>0.10766 -0.09078 0.1253<\/code>। কেন পিছনের <code>laser0_frame<\/code> নয়? কারণ সেখান থেকে ৩৬০ ডিগ্রির ঘূর্ণনশীল রশ্মি robot-এর নিজের arm ঘেঁষে যেত — নিজের দেহকেই obstacle মনে হত। সামনে-ডানে বসলে সামনের দিকের রশ্মি শরীর ছেড়ে বেরিয়ে যায় সাথে সাথে; শুধু পিছন আর বামের কিছু beam chassis-এ আছড়ায় — সেই মিথ্যা রিডিং <code>obstacle_avoid.py<\/code> filter করে ফেলে, আর fix log-এর item 3 (Part 3) এই স্থানান্তরের ইতিহাস বলে।"},{"a":1367,"b":1372,"text":"এবার sensor-টি নিজে: <code>laser1_frame<\/code>-এর ভেতরে <code>sensor<\/code> type ray, নাম <code>lidar_front<\/code>। <code>pose 0 0 0.06<\/code> বলছে sensor frame-এর origin থেকে 6 cm ওপরে বসবে — কিন্তু এখানেই সেই পুরোনো গল্প: laser1_frame fixed joint-এ base_link-এ ঝুলনো, আর Gazebo fixed link-কে parent-এ weld করার সময় welded link-এর sensor-এর ভেতরের pose নিঃশব্দে বাদ দিয়ে দেয়। নিচের camera-র কমেন্ট জানাচ্ছে lidar-এর এই 6 cm z-অফসেটও একইভাবে খেয়ে গিয়েছিল — ২D স্ক্যানে ক্ষতি তুচ্ছ বলে থেকে গেছে, কিন্তু নথিতে স্বীকারোক্তি থাকলে পরের কেউ দ্বিতীয়বার আহত হয় না। <code>always_on true<\/code> আর <code>update_rate 10<\/code> মানে সেকেন্ডে ১০টি সম্পূর্ণ স্ক্যান; <code>visualize false<\/code> বলে Gazebo ভিতরে রশ্মিরেখা আঁকবে না।"},{"a":1373,"b":1380,"text":"ray-এর ভেতরের সংখ্যাগুলোই lidar-এর চরিত্র লেখে। scan-এর horizontal অংশে <code>samples 360<\/code>, <code>resolution 1.0<\/code>, <code>min_angle -3.14159<\/code>, <code>max_angle 3.14159<\/code> — পুরো 2π রেডিয়ান, মানে প্রতি sample-এ ঠিক এক ডিগ্রি (নিচের math অংশে হিসাব)। fix log-এর শিক্ষা (Part 3) এখানেই জীবন্ত: স্ক্যান গোনা শুরু হয় -180 ডিগ্রি থেকে, তাই LaserScan array-র দুই প্রান্ত হলো robot-এর পিছন আর মাঝখানের index সামনে — উল্টো পড়লে মনে হবে obstacle সামনে, অথচ আসলে পিছনে। <code>range<\/code> min <code>0.2<\/code> মিটার, max <code>8.0<\/code> মিটার, resolution <code>0.01<\/code>; <code>noise<\/code> gaussian, mean 0, stddev <code>0.01<\/code> — বাস্তব lidar-এর মতো সামান্য কাঁপুনি, যাতে simulation-এর ডেটা অস্বাভাবিক নিখুঁত না লাগে।"},{"a":1381,"b":1387,"text":"sensor তৈরি, এবার তার ROS-দরজা: plugin <code>libgazebo_ros_ray_sensor.so<\/code>, নাম <code>lidar_plugin<\/code>। remapping <code>~/out:=/scan<\/code> — plugin-এর ডিফল্ট আউটপুটকে সরিয়ে সরাসরি <code>/scan<\/code>-এ বসানো হলো, যে নাম README-র topic টেবিল (Part 2) এবং folder 07-এর obstacle_avoid চেনে। <code>output_type sensor_msgs/LaserScan<\/code> বলছে বার্তাটি ৩৬০ মানের ranges array হয়ে বেরোবে; <code>frame_name laser1_frame<\/code> বলছে header-এর frame_id হবে laser1_frame — ফলে TF (Part 7) দিয়ে স্ক্যান পয়েন্টগুলো base_footprint বা odom frame-এ রূপান্তর করা যায়। ছোট্ট এই লাইনটিই simulation-এর lidar আর বাস্তব lidar-এর ইন্টারফেস হুবহু মিলিয়ে দেয় — স্ক্রিপ্ট বদলাতে হয় না।"},{"a":1388,"b":1403,"text":"কমেন্টটি পড়া জরুরি, এ হলো IMU-র অস্তিত্বের যুক্তি: wheel odometry yaw-এর ওই ঘূর্ণন দেখতে পায় না যা tyre scrub-এ ঘটে — skid-steer শরীরে দুই পাশের wheel সমান হারে ঘুরছে, অথচ শরীর তবু ঘুরে যাচ্ছে; encoder-এর হিসাবে সেই ঘূর্ণনের জায়গাই নেই। তাই যে স্ক্রিপ্টের বিশ্বাসযোগ্য heading দরকার — obstacle_avoid, angular calibration — তারা <code>/imu<\/code> পড়ে, ঠিক যেমন বাস্তব robot-এ IMU আর EKF একসাথে কাজ করে (fix log item 8, Part 3)। sensor নিজে base_link reference-এ: <code>update_rate 50<\/code>, plugin <code>libgazebo_ros_imu_sensor.so<\/code>, remap <code>~/out:=/imu<\/code>, frame_name base_link, আর <code>initial_orientation_as_reference false<\/code> — শুরুর ভঙ্গিকে reference না ধরে world frame-এর হিসাবে রিডিং দেওয়া।"},{"a":1404,"b":1412,"text":"ফাইলের শেষ বড় ব্লক — কমেন্টের আয়তনই বলে দেয় এখানে কতগুলো ভুল শোধরানো হয়েছে। <code>gazebo reference<\/code> এখানে arm4, আর <code>sensor<\/code> type camera, নাম <code>arm_camera<\/code> — খেয়াল করুন reference-টি DCW2 নয়, যদিও camera বাস্তবে DCW2 housing-এ বসে। কারণ কমেন্টেই লেখা: Gazebo fixed joint-এর link-কে parent-এ weld করে ফেলে, আর সেই রূপান্তরে welded-away link-এর sensor-এর ভেতরের pose পুরো বাদ পড়ে। DCW2 arm4-এর সাথে fixed (Part 7), তাই DCW2-তে sensor বসালে তার pose উড়ে গিয়ে sensor নামত ঠিক DCW2-র origin-এ, নিজের housing mesh-এর ভেতরে — ছবিতে চিরকাল ধূসর ছাড়া কিছুই দেখা যেত না। তাই sensor ঝুলিয়েছে arm4-এ, একটি সত্যিকারের articulating link-এ।"},{"a":1413,"b":1421,"text":"কমেন্টের দ্বিতীয়ার্ধ মাউন্টের দিক ব্যাখ্যা করে: optical axis arm-এর tool axis-এর সমান্তরাল — arm4-এর +Z, যে দিকে gripper তাক করে — আর sensor-কে DCW2 housing-এর পিছনে ঠেলে দেওয়া হয়েছে, যাতে কোনো mesh ভিউ না ঢেকে দেয়। এর স্বীকারোক্তিমূলক ফলাফল: arm সোজা থাকলে (সব joint শূন্য) camera সোজা ওপরে তাক করে, দেখে কেবল আকাশ — মেঝে নয়। মেঝে বা line দেখতে হলে arm-কে সামনে নুইয়ে আনতে হবে: <code>arm2=-0.70<\/code>, <code>arm3=-0.70<\/code>, <code>arm4=-0.87<\/code> rad-এ ভিউ নামে অনুভূমিকের ৪০ ডিগ্রি নিচে, মেঝে দেখা পড়ে সামনে 0.4 থেকে 1.4 মিটার — হুবহু যে pose <code>line_follow.py<\/code> কমান্ড করে, Part 2-এর টেস্টে যার ব্যবহার দেখেছি।"},{"a":1422,"b":1430,"text":"<code>pose -0.077 0.0025 0.058 0 -1.5708 0<\/code> — এক লাইনে দুটি কাজ। xyz অংশ sensor-কে arm4-এর origin থেকে পিছনে সরিয়ে DCW2-র পশ্চাতে বসায়; আর pitch <code>-1.5708<\/code>, অর্থাৎ -90 ডিগ্রি, sensor frame-কে ঘুরিয়ে দেয় যাতে camera-র optical axis arm4-এর +Z tool axis-এর সমান্তরাল হয়। <code>update_rate 20<\/code> মানে সেকেন্ডে ২০ frame (README বলে GUI মোডে তা-ই মেলে, headless-এ কম)। <code>horizontal_fov 1.085<\/code> rad, image <code>640x480<\/code> ফরম্যাট <code>R8G8B8<\/code>, clip near <code>0.02<\/code> far <code>300<\/code> — near clip এত কম রাখায় পায়ের কাছের line-ও frame-এর ভেতরে থাকে। horizontal_fov আর 640 px থেকে focal length বের করার হিসাব নিচের math অংশে।"},{"a":1431,"b":1442,"text":"শেষ plugin <code>libgazebo_ros_camera.so<\/code>, আর তার কমেন্টে আরেকটি কষ্টে-শেখা শিক্ষা: এই plugin tilde-relative remapping মানে না — তাই topicের নাম সম্পূর্ণরূপে qualified করে লেখা: <code>/arm_camera/image_raw:=/camera/image_raw<\/code> আর <code>/arm_camera/camera_info:=/camera/camera_info<\/code>; relative লিখলে topic /arm_camera-এর নিচেই আটকে থাকত, আর line_follow-এর মতো স্ক্রিপ্ট <code>/camera/image_raw<\/code> খুঁজে পেত না। <code>frame_name DCW2<\/code> — ছবির header-এ frame_id হিসেবে DCW2 যাবে, আর TF tree-র সেই frame-ই (Part 7) RViz-এ camera-র ভিউ বসিয়ে দেয়। এরপর sensor, gazebo element আর <code>robot<\/code> ট্যাগ বন্ধ — ১৪৪২ লাইনের specification শেষ, এখন লোডারের কাজ শুরু।"}],"math":{"intro":"এই Part-এর তিন sensor নিজেরাই একটি জ্যামিতির ক্লাস। lidar-এর ৩৬০ beam কীভাবে এক ডিগ্রি করে পায়, camera-র horizontal_fov আর 640 px থেকে focal length কী দাঁড়ায়, আর arm-এর তিনটি joint-মান (0.70, 0.70, 0.87 rad) কীভাবে ভিউকে ঠিক ৪০ ডিগ্রি নিচে নামায় — প্রতিটি সংখ্যা URDF-ই দিচ্ছে, একটিও বানানো নয়।","levels":[{"label":"Level 1: প্রতি beam-এ এক ডিগ্রি","latex":"\\[ \\Delta\\theta=\\frac{2\\pi}{360}=0.01745\\ \\mathrm{rad}=1^{\\circ} \\]","text":"min_angle -3.14159 আর max_angle +3.14159 — মোট 2π রেডিয়ান জুড়ে ৩৬০টি sample, ভাগ করলে প্রতিটি beam-এ 0.01745 রেডিয়ান মানে ঠিক এক ডিগ্রি। i-নম্বর beam-এর দিক θ_i = -π + iΔθ, তাই array-র শুরু আর শেষ প্রান্ত robot-এর পিছনে — fix log-এর সেই ভুল পড়ার বীজগণিত এটাই।"},{"label":"Level 2: দূরত্বে beam-এর ফাঁক","latex":"\\[ s=r\\,\\Delta\\theta=8.0\\times 0.01745\\approx 0.14\\ \\mathrm{m} \\]","text":"পাশাপাশি দুটি beam একই দূরত্বে r ব্যাসার্ধের বৃত্তচাপে s = rΔθ ফাঁকে পড়ে। max range 8 m-এ ফাঁক প্রায় 14 cm — ওই দূরত্বে সরু বস্তু দুটি beam-এর ফাঁকে হারিয়ে যেতে পারে; 1 m-এ ফাঁক 1.7 cm। range resolution 0.01 m হলেও দূরের সীমা আসলে এই কৌণিক ফাঁকই ঠিক করে।"},{"label":"Level 3: camera-র focal length","latex":"\\[ f=\\frac{W/2}{\\tan(\\mathrm{hfov}/2)}=\\frac{320}{\\tan(0.5425)}\\approx 531\\ \\mathrm{px} \\]","text":"horizontal_fov 1.085 rad আর 640 px প্রস্থ মানে অর্ধেক প্রস্থ 320 px সামলায় অর্ধ-FOV 0.5425 rad — এই অনুপাতে pinhole focal length দাঁড়ায় প্রায় 531 px। প্রতি pixel-এ কোণ 1.085/640 অর্থাৎ 0.0017 rad, মানে প্রায় 0.1 ডিগ্রি — মেঝের line সামান্য বাঁকলেই ছবিতে কয়েক pixel সরে যায়, line_follow তাতেই ভরসা করে।"},{"label":"Level 4: 40 ডিগ্রি নিচের ভিউ (ধারণাগত)","latex":"\\[ \\theta=\\frac{\\pi}{2}-(0.70+0.70+0.87)=-0.699\\ \\mathrm{rad}\\approx -40^{\\circ} \\]","text":"arm সোজা মানে camera-র elevation +90 ডিগ্রি, অর্থাৎ আকাশ। তিনটি pitch যদি সমান্তরাল অক্ষে যোগ হয়, মোট ঘূর্ণন 2.27 rad অর্থাৎ 130 ডিগ্রি; উল্লম্ব থেকে বিয়োগ করলে ভিউ অনুভূমিকের 40 ডিগ্রি নিচে। মেঝের দৃশ্যমান বিন্দুর দূরত্ব d = h/tan(-θ), যেখানে h camera-র উচ্চতা; উৎস কমেন্ট বলে এই pose-এ ফ্লোর পড়ে সামনে 0.4 থেকে 1.4 m — সঠিক জানালা arm-এর পূর্ণ kinematics আর h-এর ওপর নির্ভরশীল, তাই এই স্তরটি ধারণাগত রাখা হলো।"}]},"robot":{"correct":"Gazebo যখন URDF থেকে SDF বানায়, এই লেয়ার তখন কার্যকর হয়: material টেবিলে নথিকৃত link-রা রঙ পায় (DCW2-র ডুপ্লিকেট এন্ট্রিতে DarkGrey; কয়েকটা frame টেবিলে নেই), চার wheel-এ mu 1.2-এর ট্র্যাকশন আর chassis-এ 0.5। laser1_frame থেকে <code>/scan<\/code> আসে ১০ Hz-এ ৩৬০ beam নিয়ে, <code>/imu<\/code> ৫০ Hz-এ base_link frame-এ, আর arm4-এর ঝুঁকানো sensor থেকে <code>/camera/image_raw<\/code> 640x480। RViz-এ TF laser1_frame আর DCW2 frame দেখায়, arm সোজা রাখলে camera দেখে শুধু আকাশ।","incorrect":"কেউ যদি ভাবে camera-র sensor DCW2 link-এ বসানোই স্বাভাবিক — ও তো camera-র ঘর — তাহলে দেখবে Gazebo DCW2-কে arm4-এ weld করে ফেলে আর sensor-এর pose নিঃশব্দে বাদ পড়ে: sensor নেমে আসে DCW2-র origin-এ, নিজের housing mesh-এর ভেতরে। ফলাফল ধারাবাহিক ধূসর frame, line কোথাও নেই, line_follow অচল। lidar-ও laser1_frame-এ বসে থেকে তার 6 cm pose-অফসেট একই কারণে হারিয়েছিল — এই নীরব pose-খেয়ে রূপান্তর নিয়েই সতর্ক থাকতে হয়।"},"animType":"sensorCam"},{"n":11,"id":"part-11","fname":"my_controllers.yaml","enTitle":"Controllers YAML — Separation Bug Fix","lang":"yaml","start":1,"end":62,"flags":[],"explain":[{"a":1,"b":4,"text":"ফাইলের একদম উপরে <code>controller_manager<\/code> — পুরো yaml তিন স্তরে সাজানো: manager-এর নিজের সেটিং, তিনটি controller-এর type ঘোষণা, তারপর প্রতিটির নিজের <code>ros__parameters<\/code>। <code>update_rate: 30<\/code> মানে manager প্রতি সেকেন্ডে 30 বার লোড হওয়া প্রতিটি controller-এর update ধাপ চালায় — Part 9-এর 15টি hardware interface এই এক ঘড়িতেই পড়া-লেখা হয়। <code>use_sim_time: true<\/code> সব সময়-হিসাবকে Gazebo-র /clock-এর কাছে সঁপে দেয়; simulation বাস্তব সময়ের চেয়ে ধীরে চললে controller-এর dt তার সাথেই মেলে — নইলে timeout আর velocity হিসাব দুই ঘড়ির মাঝে ছিঁড়ে যেত। এই ফাইল URDF-এর ros2_control plugin block থেকে <code>$(find neurobotics)/config/my_controllers.yaml<\/code> পথে টানা হয় (Part 9), তাই প্রতিটি key সরাসরি simulator-এর ভেতরের controller_manager-এ পৌঁছায়।"},{"a":6,"b":11,"text":"manager-এর ভেতরেই তিনটি controller-এর নাম আর type ঘোষণা — spawn-এর সময় কী কী লোড হবে তার তালিকা। <code>diff_cont<\/code> হলো <code>diff_drive_controller/DiffDriveController<\/code> — চার চাকার robot-কে দুই-চাকার মতো চালায়: <code>/diff_cont/cmd_vel_unstamped<\/code> topic-এ Twist এলে বাঁ আর ডান পাশের চাকায় আলাদা velocity command বানায়। <code>joint_broad<\/code> হলো <code>joint_state_broadcaster/JointStateBroadcaster<\/code> — hardware interface থেকে পড়া 15টি joint-এর position আর velocity state <code>/joint_states<\/code>-এ প্রকাশ করে; RViz-এর model এই message-তেই নড়ে। <code>arm_cont<\/code> হলো <code>position_controllers/JointGroupPositionController<\/code> — 11টি arm আর gripper joint একসাথে position দিয়ে চালায়। gazebo.launch.py-এর তিনটি spawner ঠিক এই তিনটি নামই পাঠায় (Part 13)।"},{"a":13,"b":17,"text":"<code>diff_cont<\/code>-এর নিজের parameter শুরু। <code>left_wheel_names<\/code> আর <code>right_wheel_names<\/code> তালিকায় URDF-এর wheel joint-এর নাম হুবহু বসতে হয় — বাঁ পাশে <code>lwheel1_Joint<\/code>, <code>lwheel2_Joint<\/code>, ডান পাশে <code>rwheel1_Joint<\/code>, <code>rwheel2_Joint<\/code> (এই joint-গুলোর origin Part 8-এ y = +0.075 আর -0.075)। নামে এক অক্ষর বদলালে controller activate-এর সময় joint খুঁজে পায় না, terminal-এ joint not found দেখিয়ে fail করে। স্কয়ার-ব্র্যাকেটের তালিকা YAML-এ list — একই পাশের দুটি চাকা একই velocity command পায়; চার চাকার skid-steer ভাবনাটা এখানেই লুকানো। <code>use_sim_time<\/code> আবার true, যাতে dt-হিসাব Gazebo-র ঘড়ি মেনে চলে।"},{"a":18,"b":23,"text":"পুরো repo-র সবচেয়ে দামি কমেন্টটি এই ছয় লাইনে: <code>wheel_separation: 0.15<\/code>-এর পাশেই লেখা কেন এই সংখ্যা। আসল মান URDF থেকে আসে — wheel joint-গুলো base_link-এর দুই পাশে y = +0.075 আর -0.075-এ (Part 8), তাই চাকার ব্যাস্ত দূরত্ব 0.15 m। আগে এখানে ছিল 0.1955 — 30% বেশি। diff-drive হিসাবে ঘূর্ণন omega = (v_r - v_l)/s, তাই s বড় হলে হিসাব করা ঘূর্ণন সত্যিটার চেয়ে ছোট আসে: odometry প্রতি মোড় কম রিপোর্ট করে, robot বাস্তবে বেঁকে যায় অথচ <code>/diff_cont/odom<\/code> দাবি করে সে সোজা গেছে। কমেন্টের শেষ লাইন মূলমন্ত্র: 360-ডিগ্রি স্পিন কমান্ড করে বাস্তব ঘূর্ণনের সাথে তুলনা করো — আসল robot-এর calibration পদ্ধতিই এটি (Part 2-এর calib_angular, Part 3-এর fix log item 7)।"},{"a":24,"b":30,"text":"প্রতিটি key-র একটি করে কাজ আছে। <code>wheel_radius: 0.04<\/code> — Part 8-এর wheel collision cylinder-এর radius-ই; rad/s command এই radius দিয়ে রৈখিক দূরত্বে ভাঙে, ভুল মানে odometry দূরত্ব কম বা বেশি দেখায়। <code>publish_rate: 30.0<\/code> — <code>/diff_cont/odom<\/code> প্রতি সেকেন্ডে 30টি message। <code>odom_frame_id: odom<\/code> আর <code>base_frame_id: base_footprint<\/code> — TF-এ কোন frame থেকে কোন frame-এ transform যাবে তা এরাই ঠিক করে; <code>enable_odom_tf: true<\/code> সেই broadcast চালু রাখে (base_footprint Part 4-এর খালি root link)। <code>cmd_vel_timeout: 0.5<\/code> — শেষ Twist-এর পর আধা সেকেন্ড কোনো command না এলে চাকা থামিয়ে দেয়, থামা ভাঙা teleop-এর runaway আটকায়। <code>use_stamped_vel: false<\/code> বলেই topic-এর নাম <code>/diff_cont/cmd_vel_unstamped<\/code> (Part 2)।"},{"a":31,"b":42,"text":"গতির সীমা দুই স্তরে: <code>linear.x<\/code>-এ <code>max_velocity: 1.0<\/code> m/s আর <code>max_acceleration: 1.0<\/code>, <code>angular.z<\/code>-এ 2.0 আর 2.0। <code>has_velocity_limits<\/code> আর <code>has_acceleration_limits<\/code> দুটোই true — controller শুধু গতি চেপে ধরে না, গতি-বৃদ্ধিও সীমিত করে; হঠাৎ full-speed command এলে চাকা এক ধাক্কায় ছিটকে না গিয়ে মসৃণভাবে ওঠে। সংখ্যাগুলো Part 8-এর physics-এর সাথে মিলিয়ে পড়া যায়: wheel joint-এর velocity limit 20 rad/s, radius 0.04 m হলে রৈখিক সর্বোচ্চ 0.8 m/s — অর্থাৎ controller-এর 1.0 m/s সীমায় পৌঁছানোর আগেই চাকার নিজের joint সীমা ধরে ফেলে। teleop বা keyboard-এ যত জোরেই চাপা হোক, কার্যকর ছাদ এখানেই তৈরি হয়।"},{"a":44,"b":46,"text":"তিন লাইনের ছোট্ট controller, কিন্তু না থাকলে পুরো visualization মরে যায়। <code>joint_broad<\/code> শুধু <code>publish_rate: 30.0<\/code> নেয় — প্রতি সেকেন্ডে 30টি <code>/joint_states<\/code> message। 15টি joint-এর position আর velocity state hardware interface থেকে (Part 9) পড়ে JointState message বানায়, আর robot_state_publisher সেই state গুলে প্রতিটি joint-এর TF হিসাব করে — ফলে RViz-এ model-এর হাত-পা নড়ে, Gazebo-র ভেতরের নড়াচড়া বাইরে দেখা যায়। README-র topic টেবিলে (Part 2) <code>/joint_states<\/code>-এর হার এই 30 Hz-ই। joint_broad activate না হলে arm GUI-র slider সরালেও কিছু হয় না, কারণ কেউই state পাঠাচ্ছে না — gazebo.launch.py তাই এটিকে spawner তালিকায় সবার আগে রাখে (Part 13)।"},{"a":48,"b":62,"text":"শেষ block — <code>arm_cont<\/code>, 5-DOF হাত আর gripper-এর একত্র চালনা। <code>joints<\/code> তালিকায় ঠিক 11টি নাম: <code>arm1_Joint<\/code> থেকে <code>arm5_Joint<\/code> (পাঁচটি revolute, Part 5), তারপর gripper-এর ছয়টি — <code>rlink1_Joint<\/code>, <code>rlink2_Joint<\/code>, <code>llink1_Joint<\/code>, <code>llink2_Joint<\/code>, <code>rlink3_Joint<\/code>, <code>llink3_Joint<\/code> (Part 6)। ক্রম গুরুত্বপূর্ণ: <code>/arm_cont/commands<\/code>-এ যে সংখ্যার array যায়, তার index 0 থেকে 10 এই তালিকার ক্রমেই ম্যাপ হয় — arm GUI-র ছয়টি slider আর OPEN/CLOSE GRIPPER বোতাম ঠিক এই ক্রমে 11টি মান পাঠায় (Part 2-এর 4.2 টেস্ট)। প্রতিটি joint-ই URDF-এর ros2_control block-এ POSITION command interface পেয়েছে (Part 9), তাই একটি array-ই পুরো হাত-আঙুল ভাঁজ করে। <code>use_sim_time: true<\/code> এখানেও সেই একই Gazebo ঘড়ির সাথে মিল।"}],"math":null,"robot":{"correct":"gazebo.launch.py চালানোর পর spawn শেষ হলে তিনটি spawner এই ফাইলের তিনটি নাম দিয়ে controller লোড করে, terminal-এ পরপর তিনবার Configured and activated ছাপা হয়। <code>/diff_cont/odom<\/code> 30 Hz-এ প্রকাশ হয় এবং TF-এ odom থেকে base_footprint transform যোগ হয়। এখন 360-ডিগ্রি স্পিন কমান্ড করলে odometry-র হিসাব বাস্তব ঘূর্ণনের কাছাকাছি থাকে, কারণ wheel_separation এখন URDF-এর আসল জ্যামিতি 0.15 m বহন করে।","incorrect":"সবচেয়ে সহজ ভুল: কেউ মেপে বলল দুই চাকার মাঝে 19 সেমি মনে হচ্ছে, আর wheel_separation-এ 0.1955 ফিরিয়ে দেওয়া হলো। ফাইল লোড হবে, controller activate হবে, কোনো error-ও নেই — কিন্তু odometry প্রতি মোড়ে প্রায় 30% কম ঘূর্ণন রিপোর্ট করবে; robot বাস্তবে বৃত্তাকার পথে বেঁকে যাবে আর /diff_cont/odom জানিয়ে দেবে সে সোজা চলেছে। বাগটা নীরব, সেজন্যই কমেন্টে 360-ডিগ্রি স্পিন-টেস্টের কথা লেখা।"},"animType":null},{"n":12,"id":"part-12","fname":"display.launch.py","enTitle":"RViz Display — URDF Normalisation","lang":"python","start":1,"end":85,"flags":[],"explain":[{"a":1,"b":10,"text":"docstring-টি ফাইলের উদ্দেশ্য বাঁধাই করে দেয়: Gazebo ছাড়াই RViz2-তে robot-টি দেখা। ডিফল্টভাবে <code>joint_state_publisher_gui<\/code> চালু থাকে — slider টেনে প্রতিটি joint নাড়ানো যায়, simulation-এ ফেলার আগেই URDF যাচাই করা যায়। দ্বিতীয় ব্যবহার: চলমান Gazebo simulation-এর পাশে বসে live state দেখানো — তখন slider GUI বন্ধ থাকে, কারণ state তখন simulator থেকে আসছে। সতর্ক হও: docstring-এর উদাহরণ <code>sim:=true<\/code> লিখলেও ফাইলে আসলে declare করা argument-এর নাম <code>use_sim_time<\/code> — কাজ করবে <code>use_sim_time:=true<\/code>-ই। অর্থাৎ একই launch ফাইল দুই মোডে কাজ করে: standalone URDF-checker আর চলমান sim-এর দর্শক। README-র 4.7 টেস্ট (Part 2) ঠিক এই দুই মোডেরই বর্ণনা — model, TF, scan, odom arrow, camera সব RViz-এ দেখা যায়।"},{"a":12,"b":16,"text":"প্রথম import-তিনটি কাজ চেনায়: <code>os<\/code> পথ জোড়ার জন্য, <code>re<\/code> একটু পরেই আসা কমেন্ট-ছাড়ানোর regex-এর জন্য, আর <code>subprocess.check_output<\/code> বাইরের <code>xacro<\/code> প্রোগ্রাম চালিয়ে তার stdout ধরে আনার জন্য। <code>get_package_share_directory<\/code> (ament_index_python) হলো ROS 2-এর পথ-সমাধানকারী — install space-এ package-টি কোথায় বসেছে তার share ডিরেক্টরি জেনে আসে; URDF আর RViz config-এর ঠিকানা এর উপর দাঁড়ায়। এই লাইনগুলোতে এখনো কোনো ROS node তৈরি হয় না — launch description বানানোর উপকরণ মাত্র; আর launch যেহেতু নিজেই Python, সাধারণ Python ইডিয়ম এখানে সব বৈধ। Part 13-এও এই প্রথম চার লাইন হুবহু ফিরে আসবে, একই কারণে।"},{"a":18,"b":24,"text":"launch আর launch_ros থেকে যা যা লাগবে তার তালিকা: <code>LaunchDescription<\/code> ফেরত দেওয়ার বস্তু — কোন action কোন ক্রমে চলবে তার container; <code>DeclareLaunchArgument<\/code> use_sim_time-এর মতো ইনপুট ঘোষণা করে; <code>LaunchConfiguration<\/code> সেই ইনপুটের মান চলার সময় পড়ে; <code>UnlessCondition<\/code> শর্ত মিথ্যা হলে action চালু করে। launch_ros পক্ষ থেকে <code>Node<\/code> একটি ROS 2 process চালু করে আর <code>ParameterValue<\/code> কোনো parameter-এর মান আর তার type একসাথে জড়িয়ে দেয়। এই জোড়াই এই অ্যাপের launch অংশের মূল শব্দভাণ্ডার — Part 13-এ একই তালিকায় আরও পাঁচটি নাম যুক্ত হবে।"},{"a":27,"b":33,"text":"ফাংশনের docstring নিজেই একটি ইঞ্জিনিয়ারিং নোট: <code>load_urdf()<\/code> শুধু ফাইল পড়ে না — <code>xacro<\/code> চালিয়ে ফিরে আসা string-টিকে clean parameter string বানায়। Same normalisation as gazebo.launch.py কথাটির মানে: দুই launch ফাইলে হুবহু একই পরিষ্কারকরণ চলে, তাই robot_description-এর আকৃতি কোন পথে আসুক একরকম থাকে। কারণটি rcl-এর parameter override পাইপলাইন — gazebo_ros2_control-এর issue #247 অনুযায়ী XML declaration আর কমেন্টের অক্ষরগুলো ওই পাইপলাইনে আটকে যায়। লক্ষণীয় দিক: display.launch.py-তে Gazebo নেই, তবু একই normalisation — কারণ robot_description দুই ক্ষেত্রেই একই পথে যায়, আর এক জায়গায় নিরাপদ হলে সব জায়গায় নিরাপদ।"},{"a":34,"b":38,"text":"চার লাইনে চার ধাপ। লাইন 34: <code>check_output(['xacro', urdf_file], text=True)<\/code> — xacro-কে subprocess-এ চালিয়ে তার stdout string হাতে আনা; xacro এখানে URDF-এর ভেতরের <code>$(find neurobotics)<\/code> প্রকাশগুলো সমাধান করে দেয় (controller yaml-এর পথসহ, Part 9)। লাইন 35-36: string-টি <code>&lt;?xml<\/code> দিয়ে শুরু হলে <code>split('?>', 1)[1]<\/code> দিয়ে declaration-অংশ ফেলে দেওয়া হয়। লাইন 37: <code>re.sub(r'&lt;!--.*?--&gt;', ' ', xml, flags=re.DOTALL)<\/code> — DOTALL থাকায় বহু-লাইন কমেন্টও পুরোটা মুছে যায়; Part 7 আর Part 8-এর শিক্ষানবিশ নোটগুলো ফাইলে থেকে যায়, শুধু runtime string থেকে যায়। লাইন 38: <code>' '.join(xml.split())<\/code> সব whitespace এক স্পেসে মিশিয়ে এক-লাইনের string বানায়।"},{"a":41,"b":44,"text":"<code>generate_launch_description()<\/code> হলো launch ফাইলের ঢোকার দরজা — ros2 launch এই নামের ফাংশনটি খোঁজে, আর ফেরত পাওয়া LaunchDescription-ই পুরো চালানোর পরিকল্পনা। ভেতরে প্রথম তিন লাইন পথ জোগাড়: <code>pkg<\/code> = package-এর share ডিরেক্টরি, <code>urdf_file<\/code> = pkg-এর urdf ফোল্ডারের <code>neurobotics.urdf<\/code> (Part 4-এর 1442 লাইনের model), <code>rviz_config<\/code> = pkg-এর rviz ফোল্ডারের <code>neurobotics.rviz<\/code>। খেয়াল করো — কোনো absolute পথ নেই, সব pkg থেকে বানানো; workspace অন্য মেশিনে build করলেও launch ফাইল অক্ষত চলে। README (Part 1) যেমন বলে, <code>--symlink-install<\/code> থাকলে এই ফাইলগুলো এডিট করলে rebuild ছাড়াই কাজে লাগে।"},{"a":46,"b":49,"text":"URDF string-টিকে সরাসরি parameter-এ না দিয়ে <code>ParameterValue(..., value_type=str)<\/code> দিয়ে মুড়িয়ে দেওয়া হয়েছে। launch ব্যবস্থা parameter-মান পড়ার সময় নিজেই এক ধরনের YAML বিচারক — খাঁটি string-ও যদি true/false বা সংখ্যার মতো পড়ার সুযোগ পায় তবে type বদলে ফেলতে পারে; <code>value_type=str<\/code> বলে দেয় এই বিশাল এক-লাইনের XML-টি সর্বদা string-ই থাকবে। load_urdf() চলে launch description তৈরির মুহূর্তেই — মানে xacro-র খরচ যেকোনো node শুরুর আগেই শেষ। পরে এই <code>robot_description<\/code> robot_state_publisher-এর parameter হয়, আর gazebo.launch.py-তে spawn_entity একই নামের topic থেকে robot তোলে (Part 13)।"},{"a":51,"b":51,"text":"এক লাইনের নির্মাণ, কিন্তু দুই জায়গায় ব্যবহৃত: <code>use_sim_time = LaunchConfiguration('use_sim_time')<\/code> নিচে declare করা argument-টির মান পরে পড়ার একটি রেফারেন্স মাত্র — মান এখনো জানা নেই, launch চলাকালে যা দেওয়া হবে তাই বসবে। ডিফল্ট false নিচের ঘোষণায় লেখা; কাজের কমান্ড <code>ros2 launch neurobotics display.launch.py use_sim_time:=true<\/code> — docstring-এর <code>sim:=true<\/code> প্রস্তাবনা পুরনো, ওই নামে কোনো argument declare-ই হয়নি। এই একটি মানই ঠিক করে দেয় slider GUI আসবে কি না (UnlessCondition), আর robot_state_publisher সাথে RViz কোন ঘড়ি মানবে। sim time মানে Gazebo-র /clock — simulation ধীরে চললে node-গুলোও ধীরে চলে, দুই জগতের সময় মিলে থাকে।"},{"a":53,"b":61,"text":"প্রথম node: <code>robot_state_publisher<\/code>। parameter দুটি — <code>robot_description<\/code> (পরিষ্কার করা এক-লাইনের URDF string) আর <code>use_sim_time<\/code>। এই node-টিই Part 4-এর গল্পের বাস্তবায়নকারী: URDF-এর প্রতিটি link আর joint পড়ে kinematic tree বানায়, <code>/joint_states<\/code>-এ আসা মান গুলে প্রতিটি নড়ন্দা joint-এর transform হিসাব করে TF broadcast করে। RViz-এ যে নড়ন্দা model দেখা যায় তার একমাত্র উৎস এই node; fixed joint-গুলো (imu_frame, laser1_frame, DCW2 — Part 7) থেকে static transform-ও এখান থেকেই ছড়ায়। <code>output='screen'<\/code> মানে node-এর log সরাসরি terminal-এ উঠবে — launch ডিবাগ করার প্রথম জায়গা এটিই।"},{"a":63,"b":68,"text":"কমেন্টটি নকশার কারণ বলে দেয়: slider GUI তখনই অর্থবহ যখন কোনো simulator state পাঠাচ্ছে না। <code>joint_state_publisher_gui<\/code> node-টির ওপর <code>condition=UnlessCondition(use_sim_time)<\/code> — use_sim_time false হলে (ডিফল্ট) GUI চালু, true হলে বন্ধ। কারণ সরল: দুজন একসাথে <code>/joint_states<\/code>-এ লিখলে মান পাল্টা খায় — এক frame-এ slider-এর দেওয়া মান, পরের frame-এ Gazebo-র হিসাব; RViz-এর model কাঁপতে থাকে। sim:=true মোডে চলমান simulation-এর joint_broad (Part 11) আসল state পাঠায়, slider-এর দরকার নেই। ডিফল্ট মোডে এই GUI-ই URDF পরীক্ষার দ্রুততম উপায় — Part 2-এর 4.7 টেস্ট একে sliders move every joint বলে বর্ণনা করে।"},{"a":70,"b":76,"text":"শেষ node: <code>rviz2<\/code>, argument হিসেবে <code>-d rviz_config<\/code> — package-এর সাথে আসা saved config, যাতে দরকারি display (RobotModel, TF, LaserScan, Odometry, Camera) আগেই সাজানো। config ছাড়া RViz খালি জগতে খোলে — fixed frame হাতে টানতে হয়, display একটা একটা যোগ করতে হয়; প্রতিবারের এই ঝামেলা package-এ রাখা .rviz ফাইল দিয়ে এড়ানো হয়েছে। <code>parameters<\/code>-এ use_sim_time চালু — sim-এর পাশে চালালে odom arrow আর TF একই ঘড়িতে চলে। লক্ষ করো এখানে RViz-এর কোনো IfCondition নেই: এই ফাইলের মূল উদ্দেশ্যই RViz দেখানো, তাই সবসময় চালু; gazebo.launch.py-তে (Part 13) এটি ঐচ্ছিক করে rviz:=true শর্তে বাঁধা হবে।"},{"a":78,"b":85,"text":"ফেরত দেওয়া <code>LaunchDescription<\/code> তালিকাটিই চলার আদেশ: প্রথমে <code>DeclareLaunchArgument('use_sim_time', default_value='false', ...)<\/code> — ডিফল্ট false, মানে ডিফল্ট মোড standalone: slider GUI চালু, সব node wall-clock-এ। description-এ লেখা Set true when Gazebo is running simultaneously — ঠিক যা docstring-এর দ্বিতীয় ব্যবহারে বলা। এরপর তিনটি node যে ক্রমে বসানো: robot_state_publisher আগে (TF-এর উৎস), তারপর joint_state_publisher_gui (state-এর উৎস), শেষে rviz2 (সেই state-এর দর্শক) — ক্রমটা পাঠযোগ্যতার জন্য, launch নিজে নির্ভরতা মিটিয়ে সাজিয়ে নেয়। Part 13-এর তালিকা এর চেয়ে দীর্ঘ হবে: gazebo, spawn আর event handler সহ।"}],"math":null,"robot":{"correct":"একা চালালে: ros2 launch neurobotics display.launch.py — RViz2 খোলে package-এর config নিয়ে, পাশে slider GUI; arm1 থেকে arm5, gripper পর্যন্ত প্রতিটি joint টেনে নাড়ানো যায়, TF frame-গুলো সাথে সাথে সরে। use_sim_time:=true দিয়ে চলমান Gazebo-এর পাশে চালালে slider GUI আসে না, বরং চলমান simulation-এর আসল /joint_states model-টিকে নাচায় — README-র 4.7 টেস্টের ঠিক এই দুই দৃশ্যই বর্ণনা করা হয়েছে।","incorrect":"ভুল ধারণা: normalisation ঢেকে পড়া অপ্রয়োজনীয় মনে করে load_urdf()-এর জায়গায় খাঁটি ফাইল-পড়া বসানো। ফলাফল দুই রকম হতে পারে: declaration বা কমেন্টের অক্ষরে parameter ব্যবস্থা আটকে robot_description পৌঁছালো না, RViz-এ ফাঁকা Fixed Frame তালিকা; অথবা sim:=true দেওয়ার সময় UnlessCondition ভুলে যাওয়া — তখন GUI আর Gazebo দুজনেই /joint_states-এ লেখে, model এক frame slider-এর মানে আরেক frame simulator-এর মানে কেঁপে যায়।"},"animType":null},{"n":13,"id":"part-13","fname":"gazebo.launch.py","enTitle":"Gazebo Launch — Event-Driven Spawn","lang":"python","start":1,"end":144,"flags":[],"explain":[{"a":1,"b":14,"text":"docstring-টি পুরো bring-up-এর নকশা ঘোষণা করে — চার ধাপের ক্রম: 1) Gazebo Classic (gzserver আর gzclient) line-following world নিয়ে ওঠে; 2) robot_state_publisher URDF ছাপে, আর URDF আসে xacro থেকে, যাতে <code>$(find ...)<\/code> পথগুলো সমাধান হয় — Part 9-এর plugin block-এর controller yaml-পথও তখনই মেটে; 3) Gazebo প্রস্তুত হলে spawn_entity robot বসায়; 4) তিনটি controller চালু হয় ঠিক robot spawn-এর পরেই — event-driven, no guessed delays কথাটি গুরুত্বপূর্ণ: কোনো sleep নেই, যা ঘটা উচিত তা তার ট্রিগার-ঘটনা ঘটলেই ঘটে। ব্যবহারের তিন রকম লাইন: পুরো GUI, <code>gui:=false<\/code> headless (দ্রুত), <code>rviz:=true<\/code> RViz সহ।"},{"a":16,"b":20,"text":"শুরুর চার লাইন display.launch.py-এর (Part 12) সাথে হুবহু এক: <code>os<\/code>, <code>re<\/code>, <code>subprocess.check_output<\/code> এবং <code>get_package_share_directory('neurobotics')<\/code> — কারণও সেই এক: পথ জোড়া, কমেন্ট-ছাড়ানোর regex, বাইরের xacro চালানো, আর package-এর share ডিরেক্টরি খোঁজা। দুই launch ফাইলে একই কোড দুইবার লেখা হয়েছে কোনো শেয়ার করা helper ছাড়াই — প্রতিটি ফাইল নিজের ভার নিজে বহন করে, একটির import ভাঙলে অন্যটি বন্ধ হয়ে যায় না। পার্থক্য আসবে পরের import-গুচ্ছে, যেখানে এই ফাইলের ইভেন্ট-চালিত নকশার হাতিয়ার যুক্ত হবে। URDF, world, RViz config — এই ফাইলের সব ইনপুটের শিকড় ওই pkg কলটিতেই।"},{"a":22,"b":31,"text":"display.launch.py-এর (Part 12) চেয়ে বাড়তি পাঁচটি import এখানেই: <code>IncludeLaunchDescription<\/code> অন্য launch ফাইলকে নিজের ভেতরে ডেকে আনে (একটু নিচে gazebo_ros-এর নিজের launch এভাবেই বসে), <code>RegisterEventHandler<\/code> কোনো ঘটনা ঘটলে কী চলবে তা নিবন্ধন করে, <code>IfCondition<\/code> শর্ত সত্য হলে action চালু করে, <code>OnProcessExit<\/code> কোনো process বেরিয়ে গেলে সেই ঘটনা ধরে, <code>PythonLaunchDescriptionSource<\/code> অন্য Python launch ফাইলের উৎস চেনে। <code>Node<\/code> আর <code>ParameterValue<\/code> আগের মতোই। অর্থাৎ import তালিকাটাই আগে বলে দিচ্ছে: এই ফাইল শুধু node চালু করে না, অন্য launch-কে জুড়ে ঘটনার প্রতিক্রিয়ায় কাজ সাজায়।"},{"a":34,"b":43,"text":"load_urdf() এখানেও Part 12-এর মতোই, কিন্তু docstring-এ ব্যাখ্যাটা পূর্ণ: xacro ভেতরের <code>$(find neurobotics)<\/code> সমাধান করে — the controller YAML path বাক্যটি সরাসরি Part 9-এর plugin parameter-কে নির্দেশ করে। তারপর XML declaration, কমেন্ট আর নিউলাইন ফেলে দিতে হয় কারণ Humble-এর gazebo_ros2_control robot_description-কে rcl-এর argument parser-এর ভেতর দিয়ে পাঠায়, আর সেই parser <code>&lt;?xml<\/code> declaration আর XML কমেন্টের ভেতরের <code>--<\/code> সহ্য করে না (issue #247)। শেষ বাক্যটি সূক্ষ্ম: The comments stay in the URDF file itself — ছাড়ানো হয় শুধু runtime string থেকে; Part 7 আর Part 8-এর শিক্ষানবিশ নোটগুলো ফাইলে অটুট থাকে।"},{"a":44,"b":48,"text":"দেহটি display.launch.py-এর (Part 12) সাথে হুবহু এক, চার লাইনে চার ধাপ: xacro চালিয়ে URDF পাওয়া, দরকার হলে <code>&lt;?xml ... ?&gt;<\/code> অংশ ফেলা, <code>re.sub(r'&lt;!--.*?--&gt;', ' ', xml, flags=re.DOTALL)<\/code> দিয়ে সব কমেন্ট মুছে তার জায়গায় স্পেস বসানো, আর <code>' '.join(xml.split())<\/code> দিয়ে সব নিউলাইন-ট্যাব চাপা স্পেসে মিশিয়ে এক-লাইনের string বানানো। দুই ফাইলে এক কোড রাখার সুবিধা: robot_description-এর আকৃতি কোন পথে (শুধু RViz না Gazebo) যাচ্ছে তার উপর নির্ভর করে না, তাই এক পথে পাওয়া parser বাগ অন্য পথে নতুন করে ভাঙে না। Part 3-এর troubleshooting টেবিল এজন্যই বলে: parser error আগেই সামলানো আছে, হাতে এডিট করতে যেয়ো না।"},{"a":51,"b":55,"text":"generate_launch_description() এখানে পাঁচটি পথ জোগাড় করে: <code>pkg<\/code>, <code>urdf_file<\/code>, <code>rviz_config<\/code> — এ তিনটি display.launch.py-এর (Part 12) মতোই; নতুন চতুর্থটি <code>world_file<\/code> = pkg-এর worlds ফোল্ডারের <code>line.world<\/code> — line-following world, যেখানে মেঝে, পথ-রেখা আর তিনটি কমলা বাক্স থাকে (README Part 2-এর bring-up বর্ণনা)। obstacle_avoid টেস্টের (Part 2) সেই তিন বাক্সই এই world থেকে আসে। সব পথ package-এর ভেতরে, কোনো absolute পথ নেই — ঠিক যেমন Part 9-এর $(find) নিয়ম: কোথায় install হোক, পথ নিজে নিজেই মিলে যায়। <code>--symlink-install<\/code> থাকলে world বদলালেও rebuild লাগে না (Part 1)।"},{"a":57,"b":60,"text":"URDF string আগের মতোই <code>ParameterValue(load_urdf(urdf_file), value_type=str)<\/code> দিয়ে মোড়ানো — type চেপে ধরে রাখা হয়েছে যাতে launch-এর parameter বিচার একে অন্য কিছু ভেবে না নেয়। এই একটি string-ই পুরো pipeline-এর কেন্দ্রীয় জিনিস: এটি robot_state_publisher-এর <code>robot_description<\/code> parameter হয়, আর নিচের spawn_entity <code>-topic robot_description<\/code> বলে ঠিক এই parameter থেকে প্রকাশিত topic-টিই পড়ে Gazebo-তে entity বানায়। অর্থাৎ একবার পরিষ্কার করা string দুই ভোক্তার কাছে একরকম পৌঁছায় — TF-এর জগতে (RViz) আর physics-এর জগতে (Gazebo) — দুটোই একই URDF দেখে, তাই দুই জগতে robot হুবহু মিলে যায়।"},{"a":62,"b":63,"text":"দুটি LaunchConfiguration — <code>gui<\/code> আর <code>rviz<\/code> — নিচের DeclareLaunchArgument-দের সাথে যুক্ত। <code>gui<\/code> ডিফল্ট true: gzclient চালু থাকে, 3D দৃশ্য দেখা যায়; <code>gui:=false<\/code> দিলে শুধু gzserver চলে — headless মোড, simulation দ্রুত চলে কিন্তু camera প্রায় 5 Hz-এ নামে (Part 2-এর topic টেবিল দুই মোডের হার আলাদা করে দেখায়)। <code>rviz<\/code> ডিফল্ট false: চাইলে <code>rviz:=true<\/code> দিয়ে RViz2 সাথে খোলা — README-র 4.7 টেস্ট এভাবেই RViz-কে Gazebo-র পাশে আনে। display.launch.py-এর (Part 12) use_sim_time-এর মতোই এগুলো launch চালানোর মুহূর্তে মান নেয়, নিজেরা কোনো সিদ্ধান্ত নেয় না।"},{"a":65,"b":73,"text":"Gazebo-কে হাতে চালু না করে <code>IncludeLaunchDescription<\/code> দিয়ে gazebo_ros package-এর নিজের gazebo.launch.py-কে ডাকা হয়েছে — gzserver আর gzclient সঠিকভাবে চালু করার নিয়ম ওই upstream ফাইলই জানে। <code>PythonLaunchDescriptionSource<\/code> উৎসটিকে চেনায়, <code>launch_arguments<\/code>-এ ঠিক দুটি জিনিস পাঠানো হয়: <code>world<\/code> = আমাদের line.world, আর <code>gui<\/code> = ব্যবহারকারীর পছন্দ। এটি পুনর্ব্যবহারের দৃষ্টান্ত: gazebo_ros-এর launch নিজে বদলালে এই ফাইলে কিছু বদলাতে হয় না, upstream-এর সাথেই এগিয়ে যায়। মেঝে, পথ-রেখা আর তিন কমলা বাক্স — bring-up-এর প্রত্যাশিত দৃশ্য (Part 2) — এই একটি যুক্তিই simulation-এ ঢোকায়।"},{"a":75,"b":83,"text":"robot_state_publisher এখানেও, কিন্তু একটি পার্থক্য চোখে রাখো: <code>use_sim_time<\/code> এখানে LaunchConfiguration নয়, সরাসরি <code>True<\/code> হার্ডকোড করা — কারণ এই launch ফাইলের মূল শর্তই হলো Gazebo চলছে, /clock আছে; display.launch.py-তে (Part 12) এটি ছিল ব্যবহারকারীর হাতে। robot_description parameter ওই পরিষ্কার করা string-ই। node-টি URDF থেকে সব link আর joint-এর TF বানায় আর /joint_states শুনে প্রতিটি নড়ন্দা joint-এর transform হালনাগাদ করে — spawn-এর পর Gazebo-র ভেতরের নড়াচড়া RViz-এ প্রতিফলিত হওয়ার পথ এটিই। fixed mount-গুলো (Part 7) থেকে static transform এখান থেকেই ছড়ায়।"},{"a":85,"b":91,"text":"<code>spawn_entity.py<\/code> হলো URDF-কে Gazebo-র ভেতরের SDF জগতে নেওয়ার সেতু। argument-তিনটি: <code>-topic robot_description<\/code> — robot ফাইল থেকে নয়, robot_state_publisher-এর parameter থেকে তৈরি topic থেকে পড়া হবে, মানে xacro-সমাধান, কমেন্ট-পরিষ্কার string-টিই ব্যবহার হবে; <code>-entity neurobotics<\/code> — Gazebo-র ভেতরে robot-এর নাম, পরে এই নামেই খোঁজা যাবে; <code>-z 0.01<\/code> — মেঝে থেকে মাত্র 1 সেমি ওপরে বসানো, যাতে chassis-এর collision আর মেঝে জমে ঠেকে না যায়, robot নেমে স্থির হয়। spawn শেষ হলে এই process বেরিয়ে যায় — আর ঠিক সেই প্রস্থানই নিচের ইভেন্ট হ্যান্ডলারের ট্রিগার।"},{"a":93,"b":99,"text":"কমেন্টটি নকশার মূল সত্য: Controllers are loaded only after the robot exists in Gazebo। controller_manager চলে Gazebo-র ভেতরেই — libgazebo_ros2_control plugin (Part 9) ওটাকে চালু করে — আর controller-গুলো robot-এর hardware interface দাবি করে, যে interface তৈরি হয় spawn-এর সাথে। <code>spawner<\/code> হলো controller_manager-এর CLI: নাম ধরে ডেকে load, configure আর activate করে দেয়। প্রথম নাম <code>joint_broad<\/code> — my_controllers.yaml-এর (Part 11) হুবহু সেই key; এক অক্ষরের ফারাক হলে spawner controller not found বলে বসে থাকে। joint_broad-কে আগে রাখা যুক্তিসঙ্গত: state প্রকাশ না হলে robot_state_publisher-এর TF জমে থাকে, RViz-এ কিছুই নড়ে না।"},{"a":100,"b":111,"text":"বাকি দুই spawner একই ছাঁচে: <code>diff_cont<\/code> — DiffDriveController, <code>/diff_cont/cmd_vel_unstamped<\/code> থেকে Twist নিয়ে চার চাকায় velocity command বানায় (Part 11-এর wheel_separation 0.15 আর wheel_radius 0.04 সেখানেই কাজে লাগে); <code>arm_cont<\/code> — JointGroupPositionController, <code>/arm_cont/commands<\/code>-এ আসা 11টি মান পাঁচটি arm joint আর ছয়টি gripper joint-এ (Part 5, Part 6) বিতরণ করে। তিনটি Node এখানে শুধু সংজ্ঞায়িত — LaunchDescription তালিকায় সরাসরি বসানো হয়নি; ওরা ইভেন্ট হ্যান্ডলারের on_exit তালিকার ভেতরে বসে, অর্থাৎ spawn_entity প্রস্থান না করা পর্যন্ত কেউই চালু হবে না। bring-up-এর প্রত্যাশিত দৃশ্য — পরপর তিনবার Configured and activated (Part 2) — এই তিনটিরই ফল।"},{"a":113,"b":119,"text":"RViz node-টি display.launch.py-এর (Part 12) মতোই — একই <code>-d rviz_config<\/code>, একই package config — কিন্তু <code>condition=IfCondition(rviz)<\/code> বাঁধা: ডিফল্ট false বলে সাধারণ bring-up-এ খোলেই না, <code>rviz:=true<\/code> দিলেই খোলে। display.launch.py-তে ছিল উল্টো ব্যবস্থা — UnlessCondition-এ GUI চালু, RViz সবসময়; এখানে slider GUI নেই-ই (state আসছে Gazebo থেকে), RViz ঐচ্ছিক। use_sim_time এখানেও হার্ডকোড True — Gazebo-র /clock ছাড়া এই node-এর odom arrow আর TF-এর সাথে সময় মেলানো অর্থহীন। এভাবেই একই RViz config দুই ফাইলে পুনর্ব্যবহৃত: এক প্রসঙ্গে একমাত্র দর্শক, আরেক প্রসঙ্গে সম্ভাব্য সহযাত্রী।"},{"a":121,"b":130,"text":"ফাইলের হৃদয় — <code>RegisterEventHandler(OnProcessExit(target_action=spawn_robot, on_exit=[...]))<\/code>: বাইরে শুধু একটি সংজ্ঞা, কিন্তু এটিই চার ধাপের নকশার চতুর্থ ধাপকে সঠিক সময় দেয়। যখন spawn_entity process বেরিয়ে যায় (robot Gazebo-তে বিদ্যমান, hardware interface তৈরি), launch তখনই on_exit তালিকার তিনটি spawner চালু করে — কোনো অনুমান-নির্ভর অপেক্ষা নেই। ধীর মেশিনে বা ভারী world-এ spawn দেরিতে হলে? ক্রম তবু ঠিক থাকে, কারণ ট্রিগার ঘড়ি নয়, ঘটনা। বিকল্প যেটা প্রায়ই লেখা হয় — TimerAction দিয়ে কয়েক সেকেন্ড অপেক্ষা — দ্রুত মেশিনে সময় নষ্ট করে, ধীর মেশিনে আগে ছুটে গিয়ে ব্যর্থ হয়; docstring-এর no guessed delays বাক্যটি ঠিক এই পার্থক্যেরই ইঙ্গিত।"},{"a":132,"b":144,"text":"শেষ LaunchDescription তালিকাটি পুরো bring-up-এর সারণি: দুটি DeclareLaunchArgument — <code>gui<\/code> ডিফল্ট true (Start the Gazebo GUI...), <code>rviz<\/code> ডিফল্ট false — তারপর ক্রমে <code>gazebo<\/code> (world সহ), <code>robot_state_publisher<\/code> (TF-এর উৎস), <code>spawn_robot<\/code> (robot বসানো), <code>load_controllers_after_spawn<\/code> (ইভেন্ট সংযোগ), <code>rviz_node<\/code> (শর্তসাপেক্ষ)। ক্রমটি পাঠের সুবিধার; launch নিজে নির্ভরতা দেখে সাজায় — তবে ইভেন্ট হ্যান্ডলারটি তালিকায় থাকা দরকার, নইলে সংযোগটি কখনো চালু হয় না। ros2 launch neurobotics gazebo.launch.py চালালে README (Part 2)-এর প্রত্যাশিত দৃশ্য: line.world-এর মেঝে-রেখা-তিন কমলা বাক্স, robot spawn, তারপর তিন controller-এর Configured and activated।"}],"math":null,"robot":{"correct":"ros2 launch neurobotics gazebo.launch.py চালালে gzserver আর gzclient line.world নিয়ে ওঠে, robot 1 সেমি ওপর থেকে নেমে স্থির হয়, spawn_entity প্রস্থান করতেই তিনটি spawner ছুটে যায় আর terminal-এ পরপর joint_broad, diff_cont, arm_cont-এর জন্য Configured and activated ছাপা হয়। এরপর /diff_cont/cmd_vel_unstamped-এ Twist পাঠালে চার চাকা ঘোরে, /diff_cont/odom 30 Hz-এ TF broadcast করে, /scan 10 Hz-এ lidar দেয়, /camera/image_raw থেকে ছবি /* ---------------- utilities ---------------- */
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const pad2 = n => String(n).padStart(2, '0');

/* ---------------- syntax highlighting (presentation-only) --------
   A single-pass scanner over the RAW line that groups characters into
   tokens and only afterwards escapes them. The underlying text is
   never altered — spans are purely cosmetic.                        */
const PY_KW = new Set(['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield']);
const PY_BLT = new Set(['print','input','range','float','int','str','len','open','sorted','super','set','list','dict','type','abs','min','max','round','enumerate','isinstance','self']);
const SH_KW = new Set(['if','then','else','elif','fi','for','while','do','done','case','esac','function','export','return','in','local']);
const SH_CMD = new Set(['docker','ros2','gnome-terminal','bash','sh','python3','sleep','source','export','echo','cat','run','launch','pub','topic','start','stop','exec']);
function tokXml(line) {
  const toks = []; const push = (t, c) => { if (t) toks.push({ t: t, c: c }); };
  let i = 0; const n = line.length;
  while (i < n) {
    const c = line[i];
    if (c === '<') {
      let j = i + 1; if (line[j] === '/') j++;
      let k = j; while (k < n && /[A-Za-z0-9_.-]/.test(line[k])) k++;
      if (k > j) { push(line.slice(i, j), ''); push(line.slice(j, k), 'kw'); i = k; continue; }
      push('<', ''); i++; continue;
    }
    if (c === '"' || c === "'") {
      let j = i + 1; while (j < n && line[j] !== c) j++;
      const end = Math.min(j + 1, n); push(line.slice(i, end), 'str'); i = end; continue;
    }
    if (/[0-9]/.test(c) && !(i > 0 && /[A-Za-z0-9_]/.test(line[i - 1]))) {
      let j = i; while (j < n && /[0-9eE+.-]/.test(line[j])) j++;
      push(line.slice(i, j), 'num'); i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i; while (j < n && /[A-Za-z0-9_.-]/.test(line[j])) j++;
      let k = j; while (k < n && line[k] === ' ') k++;
      push(line.slice(i, j), line[k] === '=' ? 'blt' : ''); i = j; continue;
    }
    let j = i; while (j < n && !/[<"'.0-9A-Za-z_-]/.test(line[j])) j++;
    if (j === i) j = i + 1;
    push(line.slice(i, j), ''); i = j;
  }
  return toks;
}
function tokYaml(line) {
  const toks = []; const push = (t, c) => { if (t) toks.push({ t: t, c: c }); };
  const hash = line.indexOf('#');
  const head = hash >= 0 ? line.slice(0, hash) : line;
  const m = head.match(/^(\s*(?:-\s+)?)([A-Za-z_][\w.]*)(\s*:\s*)([\s\S]*)$/);
  if (m) {
    push(m[1], ''); push(m[2], 'kw'); push(m[3], '');
    const v = m[4];
    let i = 0; const n = v.length;
    while (i < n) {
      const c = v[i];
      if (c === '"' || c === "'") {
        let j = i + 1; while (j < n && v[j] !== c) j++;
        const end = Math.min(j + 1, n); push(v.slice(i, end), 'str'); i = end; continue;
      }
      if (/[0-9]/.test(c) && !(i > 0 && /[A-Za-z0-9_]/.test(v[i - 1]))) {
        let j = i; while (j < n && /[0-9eE+.-]/.test(v[j])) j++;
        push(v.slice(i, j), 'num'); i = j; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        let j = i; while (j < n && /[A-Za-z0-9_/.-]/.test(v[j])) j++;
        const w = v.slice(i, j);
        push(w, (w === 'true' || w === 'false') ? 'kw' : ''); i = j; continue;
      }
      let j = i; while (j < n && !/[["'.0-9A-Za-z_-]/.test(v[j])) j++;
      if (j === i) j = i + 1;
      push(v.slice(i, j), ''); i = j;
    }
  } else {
    push(head, '');
  }
  if (hash >= 0) push(line.slice(hash), 'com');
  return toks;
}

function tokenizeLine(line, lang) {
  if (lang === 'text') return line === '' ? [] : [{ t: line, c: '' }];
  if (lang === 'xml') return tokXml(line);
  if (lang === 'yaml') return tokYaml(line);
  const toks = [];
  const push = (t, c) => { if (t) toks.push({ t: t, c: c }); };
  let i = 0;
  const n = line.length;
  while (i < n) {
    const c = line[i];
    if (c === '#') { push(line.slice(i), 'com'); break; }
    if (c === '\'' || c === '"') {
      let j = i + 1;
      while (j < n && line[j] !== c) j++;
      const end = Math.min(j + 1, n);
      push(line.slice(i, end), 'str');
      i = end; continue;
    }
    if (/[0-9]/.test(c) && !(i > 0 && /[A-Za-z0-9_]/.test(line[i - 1]))) {
      let j = i;
      while (j < n && /[0-9a-fA-FxXoObB._]/.test(line[j])) j++;
      push(line.slice(i, j), 'num');
      i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const word = line.slice(i, j);
      if (/^[fFrRbBuU]{1,2}$/.test(word) && j < n && (line[j] === '\'' || line[j] === '"')) {
        const q = line[j];
        let k = j + 1;
        while (k < n && line[k] !== q) k++;
        const end = Math.min(k + 1, n);
        push(line.slice(i, end), 'str');
        i = end; continue;
      }
      let cls = '';
      const KW = lang === 'python' ? PY_KW : SH_KW;
      const BLT = lang === 'python' ? PY_BLT : SH_CMD;
      if (KW.has(word)) cls = 'kw';
      else if (BLT.has(word)) cls = 'blt';
      else if (lang === 'python' && j < n && line[j] === '(') cls = 'fn';
      push(word, cls);
      i = j; continue;
    }
    let j = i;
    while (j < n && !/[#'"0-9A-Za-z_]/.test(line[j])) j++;
    if (j === i) j = i + 1;
    push(line.slice(i, j), '');
    i = j;
  }
  return toks;
}
function hl(line, lang, com) {
  if (line === '') return '';
  if (com) return '<span class="tok-com">' + escHtml(line) + '</span>';
  return tokenizeLine(line, lang).map(t =>
    t.c ? '<span class="tok-' + t.c + '">' + escHtml(t.t) + '</span>' : escHtml(t.t)
  ).join('');
}
function rawLines(fname, a, b) {
  return FILEDATA[fname].slice(a - 1, b);
}

function codeCard(p) {
  const lines = rawLines(p.fname, p.start, p.end);
  const comSet = (p.lang === 'xml' && XML_COM[p.fname]) || null;
  const rows = lines.map((ln, i) => {
    const no = p.start + i;
    return '<div class="cl"><span class="cln">' + no + '</span><span class="clc">' + hl(ln, p.lang, comSet && comSet.has(no)) + '</span></div>';
  }).join('');
  const raw = lines.join('\n');
  return '' +
  '<div class="code-card" data-copy-src="' + p.id + '">' +
    '<div class="code-card-head">' +
      '<span class="dots"><i></i><i></i><i></i></span>' +
      '<span class="code-fname">' + escHtml(p.fname) + '</span>' +
      '<button class="copy-btn" data-copy="' + p.id + '">Copy</button>' +
      '<span class="code-lines-chip">L' + p.start + (p.end > p.start ? '–' + p.end : '') + '</span>' +
    '</div>' +
    '<div class="code-scroll"><pre class="code"><code>' + rows + '</code></pre></div>' +
  '</div>';
}

function explainBlock(p) {
  if (!p.explain || !p.explain.length) return '';

    const snippetLines = rawLines(p.fname, e.a, e.b);

      '<div class="ex-snippet"><span class="ex-lines">' + label + '</span>' +

      '<div class="ex-arrow">↓</div>' +

    '<div class="sec-head"><span class="badge badge-ex">EX</span><h3>Line-by-Line Explanation</h3></div>' +

function setupMathJaxWatchdog() {
  window.__mathFailed = false;
  const s = document.getElementById('Mathjax-script');

/* ================================================================
   ANIMATION SYSTEM
   Engine: cancellable, speed-scaled, pause-aware rAF scheduler.
   Every animation renders inline SVG, updates a live Bangla caption
   and a live formula bar. No animation libraries are used.
   ================================================================ */

const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBounce = t => {
  const n1 = 7.5625, d1 = 2.75;
  if (t < 1 / d1) return n1 * t * t;
  if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + .75;
  if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + .9375;
  return n1 * (t -= 2.625 / d1) * t + .984375;
};
const fmt = (v, d) => Number(v).toFixed(d === undefined ? 3 : d);

/* ---------------- small SVG string helpers ---------------- */
function rrect(x, y, w, h, rx, fill, stroke, extra) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
    '" rx="' + (rx === undefined ? 8 : rx) + '" fill="' + fill + '"' +
    (stroke ? ' stroke="' + stroke + '" stroke-width="1"' : '') +
    (extra || '') + '/>';
}
function txt(x, y, s, o) {
  o = o || {};
  return '<text' + (o.id ? ' id="' + o.id + '"' : '') + ' x="' + x + '" y="' + y + '" fill="' + (o.fill || '#c9d1d9') +
    '" font-size="' + (o.size || 13) + '"' +
    ' font-family="' + (o.mono ? "'JetBrains Mono',monospace" : "'Hind Siliguri','Inter',sans-serif") + '"' +
    (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') +
    (o.weight ? ' font-weight="' + o.weight + '"' : '') +
    (o.op !== undefined ? ' opacity="' + o.op + '"' : '') + '>' + s + '</text>';
}
function line(x1, y1, x2, y2, stroke, w, extra) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
    '" stroke="' + stroke + '" stroke-width="' + (w || 1.5) + '"' +
    (extra || '') + '/>';
}
function circ(x, y, r, fill, extra) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill + '"' + (extra || '') + '/>';
}
function arrow(x1, y1, x2, y2, color, marker, w) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
    '" stroke="' + color + '" stroke-width="' + (w || 2) +
    '" marker-end="url(#' + marker + ')"' + '/>';
}
function path(d, stroke, w, extra) {
  return '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '/>';
}

/* ---------------- host ---------------- */
function createAnimHost(part) {
  const id = part.id;
  const host = {
    part: part,
    stageEl: document.getElementById('stage-' + id),
    capEl: document.getElementById('cap-' + id),
    fxEl: document.getElementById('fx-' + id),
    stateEl: document.getElementById('state-' + id),
    secEl: document.getElementById('anim-' + id),
    speed: 1, running: false, stopFlag: false, started: false,
    staticOnly: false, inView: false, autoPaused: false, userPaused: false,
    _raf: null
  };
  host.setStage = function (inner, w, h) {
    host.stageEl.innerHTML = '<svg viewBox="0 0 ' + (w || 900) + ' ' + (h || 460) +
      '" preserveAspectRatio="xMidYMid meet" role="img">' + inner + '</svg>';
    return host.stageEl.querySelector('svg');
  };
  host.caption = t => { host.capEl.innerHTML = t; };
  host.formula = t => { host.fxEl.innerHTML = t; };
  host.setState = t => { host.stateEl.textContent = t; };
  host._sched = function (dur, onFrame) {
    return new Promise((res, rej) => {
      let elapsed = 0, last = null;
      const step = t => {
        if (host.stopFlag) { rej(new Error('anim-stopped')); return; }
        if (!host.running) { last = null; host._raf = requestAnimationFrame(step); return; }
        if (last === null) last = t;
        elapsed += t - last; last = t;
        const k = Math.min(1, elapsed / (dur / host.speed));
        try { onFrame(k, elapsed); } catch (e) { rej(e); return; }
        if (k >= 1) { res(); return; }
        host._raf = requestAnimationFrame(step);
      };
      host._raf = requestAnimationFrame(step);
    });
  };
  host.sleep = ms => host._sched(ms, () => {});
  host.tween = (dur, fn) => host._sched(dur, k => fn(k));
  host.start = function (speed) {
    if (speed) host.speed = speed;
    if (host.started) { host.stopFlag = true; }
    host.started = true; host.stopFlag = false; host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
    setTimeout(() => {
      ANIMS[part.animType](host).catch(e => {
        if (e && e.message === 'anim-stopped') host.setState('STOPPED');
        else console.error('anim error', part.id, e);
      });
    }, 30);
  };
  host.pause = function () {
    if (!host.started) return;
    host.running = false; host.userPaused = true;
    host.setState('PAUSED');
  };
  host.resume = function () {
    if (!host.started || !host.userPaused) return;
    host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
  };
  host.stop = function () {
    host.stopFlag = true; host.running = false; host.started = false; host.userPaused = false;
    if (host._raf) cancelAnimationFrame(host._raf);
    host.setState('IDLE');
    host.renderStatic();
  };
  host.renderStatic = function () {
    host.staticOnly = true;
    try { ANIMS[part.animType](host); } catch (e) { /* static render is best-effort */ }
    host.staticOnly = false;
  };
  host.setSpeed = function (s) {
    host.speed = s;
    if (!host.started) { host.start(s); return; }
    if (host.userPaused) { host.running = true; host.userPaused = false; }
    host.setState('RUN ' + s + 'x');
  };
  /* controls */
  host.secEl.querySelectorAll('.ac-btn').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.ac;
      host.secEl.querySelectorAll('.ac-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if (a === 'play') host.userPaused ? host.resume() : host.start(1);
      else if (a === 'slow') host.setSpeed(0.5);
      else if (a === 'fast') host.setSpeed(1.5);
      else if (a === 'pause') host.pause();
      else if (a === 'stop') { host.stop(); b.classList.remove('active'); }
    });
  });
  /* auto start / auto pause with visibility */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      host.inView = en.isIntersecting;
      if (en.isIntersecting) {
        if (host.autoPaused && host.started) {
          host.running = true; host.autoPaused = false; host.setState('RUN ' + host.speed + 'x');
        } else if (!host.started && !host.autoStarted && !window.__prefersReducedMotion) {
          host.autoStarted = true; host.start(1);
        }
      } else if (host.started && host.running) {
        host.running = false; host.autoPaused = true; host.setState('HOLD');
      }
    });
  }, { threshold: 0.25 });
  io.observe(host.secEl);
  return host;
}

const ANIMS = {};
const HOSTS = {};

function setupAnimations() {
  window.__prefersReducedMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  PARTS.forEach(p => {
    if (p.animType && ANIMS[p.animType]) {
      HOSTS[p.id] = createAnimHost(p);
      HOSTS[p.id].renderStatic();
    }
  });
}

  function dbgRows(rows, shadow) {
    /* BEFORE→AFTER: rows are the AFTER state of this line; when the shadow
       state already holds a different value for a key, render
       old → new so the state transition is visible (#52). */
    if (!rows || !rows.length) return '<div class="dbg-empty">— এই line-এ নতুন debug value নেই —</div>';
    return rows.map(function (r) {
      var k = r[0], v = r[1];
      var tag = r[2] === 'ill'
        ? '<span class="dbg-ill" title="illustrative — actual runtime value">illustrative</span>'
        : '';
      var cls = r[2] === 'err' ? 'dbg-v err' : 'dbg-v';
      var val;
      var before = Object.prototype.hasOwnProperty.call(shadow, k) ? shadow[k] : undefined;
      if (before !== undefined && before !== v) {
        val = '<span class="dbg-old">' + before + '</span> <span class="dbg-arrow">→</span> ' + v;
        cls += ' chg';
      } else {
        val = v;
      }
      shadow[k] = v;
      return '<div class="dbg-row"><span class="dbg-k">' + k + '</span>' +
        '<span class="' + cls + '">' + val + '</span>' + tag + '</div>';
    }).join('');
  }

        ? dbgRows(spec.dbg0.slice(), {})

      return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img">' +
        (spec.defs || '') + inner + '</svg>';
    }
    function setRob(inner) {
      if (!inner) return;
      el.rob.innerHTML = robSvg(inner);
      el.rob.classList.remove('exec-rob-fade');
      void el.rob.offsetWidth;
      el.rob.classList.add('exec-rob-fade');
    }
    setRob(spec.rob0 || (spec.steps[0] && spec.steps[0].rob) || '');

    /* ---- one coherent exec state machine ---- */
    var X = {
      started: false, running: false, paused: false, done: false,
      stopFlag: false, speed: 1, _raf: null, gen: 0
    };
    var shadow = {};   /* accumulated variable state for BEFORE→AFTER   */
    function setState(t) { el.state.textContent = t; }
    function clearCur() {
      el.code.querySelectorAll('.exl.cur,.exl.cur-g').forEach(function (n) {
        n.classList.remove('cur', 'cur-g', 'cur-struct', 'cur-event');
      });
    }
    function lineChip(st) {
      var grp = st.lns && st.lns.length > 1;
      return grp
        ? 'LINES ' + st.lns[0] + '–' + st.lns[st.lns.length - 1] + ' / ' + NL
        : 'LINE ' + st.ln + ' / ' + NL;
    }
    function applyStep(idx) {
      var st = spec.steps[idx];
      clearCur();
      var primary = el.code.querySelector('#exl-' + st.ln);
      var kcls = st.kind === 'struct' ? 'cur-struct' : (st.kind === 'event' ? 'cur-event' : '');
      (st.lns || [st.ln]).forEach(function (n) {
        var row = el.code.querySelector('#exl-' + n);
        if (!row) return;
        /* classList.add() THROWS on an empty token (exec steps have no
           kind class) — pass it conditionally, never as '' */
        var base = n === st.ln ? 'cur' : 'cur-g';
        if (kcls) { row.classList.add(base, kcls); }
        else { row.classList.add(base); }
      });
      if (primary) {
        try {
          el.code.scrollTop = primary.offsetTop - el.code.clientHeight / 2 + primary.offsetHeight / 2;
        } catch (e) { /* keep going without scroll */ }
      }
      el.live.textContent = lineChip(st);
      el.phase.textContent = KIND_BN[st.kind] || 'exec';
      el.step.textContent = 'STEP ' + (idx + 1 < 10 ? '00' : idx + 1 < 100 ? '0' : '') + (idx + 1) +
        ' / ' + N + ' · ' + lineChip(st);
      el.bar.style.width = ((idx + 1) / N * 100).toFixed(2) + '%';
      if (st.op) { el.op.hidden = false; el.op.textContent = st.op; }
      else { el.op.hidden = true; }
      el.dbg.innerHTML = dbgRows(st.dbg, shadow);
      el.cap.innerHTML = st.cap || '';
      if (st.fx) { el.fxRow.hidden = false; el.fx.innerHTML = st.fx; }
      else { el.fxRow.hidden = true; }
      if (st.rob) setRob(st.rob);
    }
    function complete() {
      X.done = true; X.running = false; X.started = false;
      clearCur();
      setState('COMPLETE');
      el.phase.textContent = 'DONE';
      el.step.textContent = 'EXECUTION COMPLETE · ' + N + ' STEPS · ' + NL + ' LINES';
      el.live.textContent = 'LINE —';
      el.bar.style.width = '100%';
      el.doneBn.innerHTML = spec.finalCap || '';
      el.done.classList.add('show');
      if (spec.finalOp) { el.op.hidden = false; el.op.textContent = spec.finalOp; }
      if (spec.finalDbg) el.dbg.innerHTML = dbgRows(spec.finalDbg, shadow);
      if (spec.finalRob) setRob(spec.finalRob);
      if (spec.finalFx !== undefined && spec.finalFx !== null) {
        el.fxRow.hidden = false; el.fx.innerHTML = spec.finalFx;
      }
      setActive(el.controls, null);
    }
    function sched(ms) {
      return new Promise(function (resolve) {
        var g = X.gen;
        var total = ms / X.speed, elapsed = 0, last = null;
        /* QA hook (#qa-vt): headless Chrome's virtual-time clock drives
           timers but never issues BeginFrames, so requestAnimationFrame
           stalls and automated runs freeze on step 1. Under the hash the
           identical accumulator runs on a 40ms interval instead. Real
           pages never carry the hash, so they always use rAF below. */
        if (/qa-vt/.test(location.hash)) {
          var iv = setInterval(function () {
            if (X.stopFlag || X.gen !== g) { clearInterval(iv); resolve('stopped'); return; }
            if (X.running) elapsed += 40;
            if (elapsed >= total) { clearInterval(iv); resolve(); }
          }, 40);
          return;
        }
        function tick(t) {
          if (X.stopFlag || X.gen !== g) { resolve('stopped'); return; }
          if (!X.running) { last = null; X._raf = requestAnimationFrame(tick); return; }
          if (last === null) last = t;
          elapsed += t - last; last = t;
          if (elapsed >= total) { resolve(); return; }
          X._raf = requestAnimationFrame(tick);
        }
        X._raf = requestAnimationFrame(tick);
      });
    }
    function resetIdle() {
      X.started = false; X.running = false; X.paused = false;
      X.stopFlag = false; X.done = false;
      if (X._raf) cancelAnimationFrame(X._raf);
      clearCur();
      shadow = {};
      setState('IDLE');
      el.phase.textContent = 'IDLE';
      el.step.textContent = 'STEP 000 / ' + N;
      el.live.textContent = 'LINE —';
      el.bar.style.width = '0%';
      el.op.hidden = true;
      el.done.classList.remove('show');
      el.cap.innerHTML = 'Play চাপলে line-by-line execution শুরু হবে।';
      el.fxRow.hidden = true; el.fx.innerHTML = '';
      el.dbg.innerHTML = dbgIdle();
      setRob(spec.rob0 || (spec.steps[0] && spec.steps[0].rob) || '');
      setActive(el.controls, null);
    }
    async function run() {
      var g = X.gen;
      for (var idx = 0; idx < N; idx++) {
        if (X.stopFlag || X.gen !== g) return;
        try { applyStep(idx); } catch (e) { console.error('exec step failed', idx, e); }
        var st = spec.steps[idx];
        var base = st.dur != null ? st.dur : (DUR[st.kind] != null ? DUR[st.kind] : (spec.stepDur || 2200));
        await sched(base);
        if (X.stopFlag || X.gen !== g) return;
      }
      if (X.gen !== g) return;
      complete();
    }
    function start(speed) {
      X.gen++;
      X.done = false;
      if (speed) X.speed = speed;
      X.started = true; X.stopFlag = false; X.running = true; X.paused = false;
      shadow = {};
      el.done.classList.remove('show');
      setState('RUN ' + X.speed + 'x');
      setTimeout(function () {
        run().catch(function (e) {
          console.error('exec run error', e);
          setState('ERROR');
        });
      }, 30);
    }
    function pause() { if (!X.started) return; X.running = false; X.paused = true; setState('PAUSED'); }
    function resume() {
      if (!X.started || !X.paused) return;
      X.running = true; X.paused = false; setState('RUN ' + X.speed + 'x');
    }
    function setSpeed(s) {
      X.speed = s;
      if (!X.started) { start(s); return; }
      if (X.paused) { X.running = true; X.paused = false; }
      setState('RUN ' + X.speed + 'x');
    }
    function stop() { X.gen++; X.stopFlag = true; resetIdle(); }

    el.controls.querySelectorAll('.ac-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.dataset.ac;
        setActive(el.controls, a === 'stop' ? null : b);
        if (a === 'play') { X.paused ? resume() : start(1); }
        else if (a === 'slow') setSpeed(0.5);
        else if (a === 'fast') setSpeed(1.5);
        else if (a === 'pause') pause();
        else if (a === 'stop') stop();
      });
    });
  }

  /* ---------- boot -------------------------------------------------- */
  function boot() {
    try { fixHero(); } catch (e) { console.error(e); }
    try { retrofitControls(); } catch (e) { console.error(e); }
    try { buildExec(); } catch (e) { console.error('exec build failed', e); }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else { boot(); }
})();

</script>
</body>
</html>
