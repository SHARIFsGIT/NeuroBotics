ল্ডারে যা করেছিলে, সেই একই — নির্দিষ্ট গতি আদেশ দাও, আসলে কী হলো মাপো, তারপর হিসাব <code>scale = commanded / measured<\/code>। Scale 1.0 মানে আদেশ আর বাস্তবতা এক; 1.05 মানে robot আদেশের চেয়ে কম ঘুরছে, কম্পেনসেট করতে মান বাড়াতে হবে। সিমুলেশনে হাতিয়ারটার দ্বিতীয় জীবন আছে: এখানে scale ভুল হলে দোষী firmware নয় — config ফাইলের কোনো ধ্রুবক; কোনটি, তা পরের দুই বুলেটে।"},{"a":197,"b":204,"text":"Angular-এর বিচারক IMU: প্রকৃত ঘূর্ণন মাপা হয় <code>/imu<\/code> থেকে (বাস্তব robot-এ এই দায়িত্ব IMU+EKF-এর)। পাশে wheel odometry-ও ছাপা হয় — আর দুই সংখ্যা স্পষ্ট অমিল দেখাবে, কারণ pivot-এ চার চাকাই skid করে, আর চাকার কাউন্টার পিছল দেখে না — সে বরং বেশি ঘূর্ণন দাবি করে। বাস্তব robot-এ ফলাফল জমা হয় firmware-এ, <code>config_robot.py<\/code>-র <code>set_ros_scale_angular<\/code> দিয়ে (তোমারটা ছিল 1.05); সিমুলেশনে ভুল scale-এর অর্থ অন্য কিছু — সন্দেহ যাবে <code>my_controllers.yaml<\/code>-এর <code>wheel_separation<\/code>-এর দিকে (Part 11: 0.1955 বনাম 0.15-এর সেই পুরোনো ভুল)। একই রোগ, দুই পৃথিবীতে দুই রোগী।"},{"a":205,"b":208,"text":"Linear-এর বিচারক Gazebo ground truth — সিমুলেটর নিজে জানে প্রতিটি বস্তু ঠিক কোথায়, তাই তার কাছ থেকে মাপা দূরত্ব সিমুলেশনের মাপ-ফিতের মতোই নির্ভুল; odometry ছাপা হয় শুধু তুলনার জন্য। বাস্তব robot-এ এই জায়গার সমকক্ষ <code>set_ros_scale_line<\/code>। আর সিমুলেশনে linear scale ভুল হলে সন্দেহের তালিকা ছোট: <code>wheel_radius<\/code> — চাকার ব্যাসার্ধ 0.04 মিটার (URDF-র collision cylinder আর yaml দুই জায়গাতেই একই মান), কারণ চাকা একবার ঘুরলে robot যতটা এগোয় তা এই ব্যাসার্ধই ঠিক করে। Angular-এ separation, linear-এ radius — দুই দিকের ভুলের দুই ঠিকানা, এই বিভাজনটাই ক্যালিব্রেশনের বিজ্ঞান।"},{"a":210,"b":211,"text":"Pass-মানদণ্ড উদার কিন্তু সুনির্দিষ্ট: দুই scale-ই 1.0-এর 2%-এর মধ্যে; সিমুলেশনে প্রত্যাশা প্রায় 0.98 থেকে 1.00। সেই সামান্য ঘাটতিরও ব্যাখ্যা লাইনেই আছে: যাত্রা-শুরু আর থামার transients একটু দূরত্ব খেয়ে ফেলে — চাকা মুহূর্তে পূর্ণ গতিতে ওঠে না, মুহূর্তে থামে না। রোগ-নির্ণয়ের ভাষায়: 0.99 মানে সুস্থ, 0.85 মানে কোথাও কোনো ধ্রুবক মিথ্যা বলছে। সীমা পেরোলে আগের বুলেটের ঠিকানাই তালিকা: angular কাত পড়লে wheel_separation, linear খর্ব হলে wheel_radius। দুই সংখ্যা আলাদা করে পড়ার শক্তিটাই ক্যালিব্রেশন-হাতিয়ারের আসল বিষয়।"},{"a":213,"b":219,"text":"সপ্তম পরীক্ষা 4.7 (ঐচ্ছিক): সবকিছুর ওপর থেকে দৃশ্য। দুই রাস্তা: <code>ros2 launch neurobotics gazebo.launch.py rviz:=true<\/code> — চলমান সিমুলেশনের পাশে RViz2 (launch-এর rviz ঝুলি true করে, Part 13); অথবা Gazebo ছাড়াই <code>ros2 launch neurobotics display.launch.py<\/code> — একা RViz, সঙ্গে joint_state_publisher_gui-র স্লাইডার: সিমুলেটর না থাকলে কেউ তো joint-এর অবস্থা প্রকাশ করছে না, তখন স্লাইডারই প্রতিটি joint নাড়ায় (Part 12-এর <code>UnlessCondition<\/code>-যুক্তি)। প্রথমটি চলমান পরীক্ষার নজরদারি, দ্বিতীয়টি URDF পরীক্ষার আয়না — Gazebo নামানোই লাগে না।"},{"a":221,"b":222,"text":"শেষ দুই লাইনে RViz-এ কী দেখবে তার তালিকা: robot model (URDF থেকে আঁকা কাঠামো), TF frame (প্রতিটি link একটি স্থানাঙ্ক-ব্যবস্থা), lidar scan (দূরত্বের বিন্দু-মেঘ), odometry তির (odom থেকে robot কোথায় পৌঁছেছে বলে ভাবছে), আর camera-র ছবি। এই পাঁচটির একত্র দর্শনই বিশ্বাস-শিক্ষা: টেলিঅপে চালালে দেখবে odom তির এগোচ্ছে আর model-এর চাকা ঘুরছে — দুই জগতের হিসাব মিলছে কি না চোখেই পড়বে। ভুল কোথায় ধরা পড়ে তারও রূপরেখা: model ঠিক কিন্তু তির বাঁকা — odometry ভুল; ছবি নেই — sensor layer। এভাবেই 4.7 আগের ছয়টির সব ফলাফলের কাচ-ঘর।"}],"math":null,"robot":{"correct":"নির্ধারিত ক্রমে চালু হলে 20 সেকেন্ডের ভেতর তিন controller active; <code>ros2 topic hz /scan<\/code> দেখায় 10 Hz, <code>/camera/image_raw<\/code> headless-এ প্রায় 5 Hz। <code>i<\/code> চাপলে robot লাইন বেয়ে সামনে যায়, arm_gui-র আঙুল একসঙ্গে খোলে-বন্ধ হয়, line_follow নিজেই arm বাঁকিয়ে camera মেঝেতে নামিয়ে ডানের বাঁক ধরে, obstacle_avoid ডান পাশের বাক্স আগে দেখে বাঁয়ে সরে — প্রতিটি ফল ওপরের নির্দেশিকার প্রতিশ্রুতির মতোই।","incorrect":"ধ্রুব ফাঁদ তিনটি। Arm HOME-এ ফেলে line_follow চালিয়ে লাইন আসার আশা — HOME-এ camera আকাশ দেখে, স্ক্রিপ্ট নিজে arm না বাঁকালে ছবিতে লাইনই নেই। Obstacle_avoid চালাতে গিয়ে arm ভাঁজ করা রাখা — সামনের arm-ই lidar-এর চোখে বাধা, robot অকারণ খোঁচাখুঁচি করবে। আর headless মোডে 20 Hz camera প্রত্যাশা — gui:=false-এ software rendering-এ rate 5 Hz-এ নামে; এটা ভাঙা নয়, নিয়ম। সবকটির সমাধান README-র নিজের লাইনেই লেখা ছিল।"},"animType":null},{"n":3,"id":"part-03","fname":"README.md","enTitle":"Troubleshooting & the Fix Log","lang":"bash","start":224,"end":314,"flags":[],"explain":[{"a":224,"b":232,"text":"সেকশন 5: গোটা workspace-এর কঙ্কাল এক নজরে। মূল অনুপাতটা বুঝে নাও: এই অ্যাপ যে পাঁচটি ফাইল বিশ্লেষণ করে, চারটিই এই গাছের ডালে — <code>urdf/neurobotics.urdf<\/code> (robot নিজে, SolidWorks export থেকে পরিষ্কার করা; Part 4 থেকে 10-এর বিষয়), <code>launch/gazebo.launch.py<\/code> (sim আর controller একসঙ্গে, event-driven spawn — Part 13), <code>launch/display.launch.py<\/code> (শুধু RViz — Part 12), <code>config/my_controllers.yaml<\/code> (তিন controller-এর জন্মসনদ — Part 11); পঞ্চম, এই README নিজে, গাছের root-এ বসে। বাকিরা পার্শ্বচরিত্র — পরের ব্লকে।"},{"a":233,"b":239,"text":"গাছের বাকি ডাল: <code>worlds/line.world<\/code> — মেঝে, লাইন-কোর্স আর তিন বাধা-বাক্স; সিমুলেশনের মঞ্চসজ্জা, robot-এর নয়। <code>rviz/neurobotics.rviz<\/code> — আগাম-সাজানো RViz2 দৃশ্য: 4.7-এর জানালা খুললেই সব বিষয় জায়গামতো সাজানো পড়ে থাকে। <code>scripts/<\/code> — সাতটি প্রোগ্রাম (teleop, arm_gui, line_follow, obstacle_avoid, calib_angular, calib_linear, lidar_view), সবাই folder 01-07-এর বিশ্লেষিত পরিচিত মুখের প্রতিলিপি; এখানে নতুন করে পাঠ করা হয় না, README-র সেকশন 4-ই তাদের ব্যবহারবিধি। <code>meshes/<\/code> — STL ভাণ্ডার; link-গুলোর visual আর অধিকাংশ collision এখান থেকেই টানে, তবে সব নয় — চার wheel-এর collision সস্তা cylinder primitive, আর sensor frame-গুলো ছোট box। কাঠামোটাই বলে দিচ্ছে: এই folder-এর নায়ক URDF, বাকি সব প্রেক্ষাপট।"},{"a":241,"b":244,"text":"সেকশন 6: সমস্যা-নির্ণয়ের টেবিল — লক্ষণ আর কারণ/প্রতিকারের জোড়া। এই এগারো সারির প্রতিটি সত্যিকারের ব্যর্থতার অভিজ্ঞতা থেকে জাত: কেউ environment-এর ভুল, কেউ ROS 2 Humble-এর নিজের আচরণ, কেউ পদার্থবিজ্ঞানের। পড়ার নিয়ম: প্রথম স্তম্ভ হুবহু terminal-এ ওঠা বাক্য বা চোখে পড়া আচরণ, দ্বিতীয়টা তার ব্যাখ্যা-সহ প্রতিকার। শিক্ষণীয় দিক — সিমুলেশন-জগতে ভুলের বেশিরভাগই code-এর বাগ নয়, বরং ভুল অবস্থা: না-sourced terminal, পুরোনো প্রসেসের ভূত, দুই সিমুলেটরের টানাটানি। টেবিল মুখস্থ কোরো না — প্যাটার্নগুলো চিনো।"},{"a":245,"b":247,"text":"প্রথম তিন সারি: environment আর toolchain-এর স্তর। <code>package 'neurobotics' not found<\/code> — ওই terminal-এ workspace-এর setup মেলানো হয়নি (Part 1-এর চিরকালের নিয়ম); প্রতিকার এক লাইনের source। <code>parser error ... robot_description:=&lt;?xml<\/code> — Humble-এর gazebo_ros2_control bug: robot_description যখন rcl-এর argument parser-এর ভেতর দিয়ে যায়, <code>&lt;?xml<\/code> ঘোষণা আর comment-এর <code>--<\/code> সে হজম করতে পারে না; সমাধান launch file-গুলোতেই বসানো (strip করে পাঠানো — Part 12, 13), তাই কেউ যেন robot_description পাস করার ধরন হাতে সাজিয়ে না বদলায়। <code>update period (0.0333 s)<\/code> warning — controller_manager-এর 30 Hz আর সিম-পদক্ষেপের হিসেবের খেলা; ক্ষতিহীন সতর্কবার্তা, ওটিকে থাকতে দাও।"},{"a":248,"b":249,"text":"পরের দুই সারি: চোখ আর ঘড়ি নিয়ে। Camera মাত্র 5 Hz — headless মোডে স্বাভাবিক; জানালা-বিহীন সিমে ছবি আঁকে software rendering, ভারী ও ধীর; <code>gui:=true<\/code> করলেই প্রায় 20 Hz-এ ফেরে। অর্থাৎ এটা ত্রুটি নয়, মোডের দাম — 4.3-এর লাইন-অনুসরণ তবু চলে, সেকেন্ডে পাঁচটি ছবিও লাইন ধরার জন্য যথেষ্ট। <code>Moved backwards in time<\/code> বা robot-এর লাফ — সিম-ঘড়ির দ্বন্দ্বের লক্ষণ: একসঙ্গে দুটি ros2 launch চলছে, দুজনেই নিজের ঘড়িকেই <code>use_sim_time<\/code>-এর একমাত্র সূত্র ভাবছে। প্রতিকার কঠোর: এক সময়ে এক launch; প্রয়োজনে <code>pkill -f \"ros2 launch\"<\/code>, তারপর <code>pkill -x gzserver<\/code>, 3 সেকেন্ড অপেক্ষা, আবার চালু।"},{"a":250,"b":251,"text":"এই দুই সারি একই রোগের দুই রূপ: পুরোনো প্রসেসের ভূত। লক্ষণ — URDF বা স্ক্রিপ্ট বদলেছ, কিন্তু robot শোনে না; বা বারবার পরীক্ষার পর robot কাত হয়ে চলছে। কারণ: আগের চালানোর background প্রসেসরা এখনো জীবিত — পুরোনো <code>ros2 launch<\/code> বাসি এক <code>robot_description<\/code> পরিবেশন করছে, পুরোনো স্ক্রিপ্ট <code>cmd_vel<\/code> লিখে যাচ্ছে; নতুনদের সঙ্গে তাদের টানাটানিতেই robot অদ্ভুত। নির্ণয় <code>pgrep -af \"ros2\"<\/code> — পুরো তালিকা দেখো, সবাইকে মারো; প্রথম পাওয়া PID মেরেই থেমে গেলে ভূত থেকে যায়। একই ঔষধের পরের রোগী: gzserver spawn-এর পরেই মরে যায় — আগের রানের বাসি আওয়াজই তার ঘাড় মটকায়; একই পরিচ্ছন্নতা, তারপর relaunch।"},{"a":252,"b":253,"text":"আরও দুই সারি, দুটিই নিরীহ। Line follower-এর জানালা নেই — দুটি debug জানালার জন্মের জায়গা চাই display; মেশিনের ডেস্কটপে চালাও, খালি SSH-র ওপর নয় — আর জানালা না থাকলেও অনুসরণ নিজে ঠিকঠাক চলে, শুধু প্রিভিউ পাওয়া যায় না। Robot অলস অবস্থায় ধীরে সরে বা ঘোরে — Gazebo solver-এর চাকা-সংযোগ হিসেবের ক্ষুদ্র আর্টিফ্যাক্ট; মজার ব্যাপার, কেউ একবার <code>cmd_vel<\/code> প্রকাশ করলেই (এই সব নিয়ন্ত্রণ-স্ক্রিপ্টই শুরুতে করে) জমাট বেঁধে যায়। ক্ষতিহীন — তবু মনে রেখো: স্ক্রিপ্টবিহীন অবস্থায় সেই ক্রমে মাপজোখ করতে যেও না, বিশ্রী ডেটা দেবে।"},{"a":254,"b":255,"text":"টেবিলের সবচেয়ে ভারী সারি: robot পিছনে গেছে / চাকা উন্মত্ত গতিতে ঘুরেছে — এটা ছিল পদার্থবিজ্ঞানের বাগ, এখন সারানো। কিন্তু সতর্কবার্তাটি জ্বলজ্বল করে: কেউ wheel joint-এ <code>damping<\/code>/<code>friction<\/code> ফিরিয়ে আনলে বা <code>effort<\/code> প্রায় 2 N·m-এর ওপরে তুললে রোগ ফেরত আসতে পারে — কারণের পূর্ণ গল্প neurobotics.urdf-র ইনলাইন comment-এ লেখা (Part 8: ক্ষুদ্র জড়তার চাকায় বেশি-টর্ক velocity মোটর প্রতি 1 ms পদক্ষেপে overshoot করে)। শেষ সারি সহজ: স্ক্রিপ্ট <code>[ERROR] Could not start ROS 2<\/code> ছাপলে আগে দুই setup মেলাও — <code>/opt/ros/humble<\/code> আর workspace।"},{"a":257,"b":259,"text":"সেকশন 7: fix log — 2026-08-এর পরিচ্ছন্নতা-কর্মসাধনের ইতিহাস, নয়টি নথিভুক্ত সংস্করণ। ভূমিকা-লাইনটি তালিকার উদ্দেশ্য বদলে দেয়: <code>For your reference — the interesting root causes<\/code> — অর্থাৎ এটা অর্জন-ফলাও করার তালিকা নয়, শিক্ষার সংগ্রহ: প্রতিটি আইটেমে আছে একটি ভুল লক্ষণ, তার ভুল প্রথম ব্যাখ্যা, সঠিক মূল কারণ, আর স্থায়ী সমাধান। আর প্রতিটির কাটাকাটি এই অ্যাপের অন্য পার্টে টানা আছে — URDF-র comment (Part 7, 8, 10), yaml-এর ব্যাখ্যা (Part 11), launch-এর কৌশল (Part 12, 13)। পড়ার সময় হাতে মনে রেখো: প্রতিটি নম্বর একটি ডিবাগ-গল্প।"},{"a":261,"b":262,"text":"আইটেম 1: <b>Camera link was missing<\/b> — এক আগের সম্পাদনায় URDF থেকে camera-র link-টাই মুছে গিয়েছিল, ফলে <code>line_follow.py<\/code>-র ছবি আসাই বন্ধ ছিল — স্ক্রিপ্ট নির্দোষ, চোখই ছিল না। সমাধান: link ফেরত আনা সঠিক <code>45°<\/code> mount-সহ। ছোট এন্ট্রিটি বড় পাঠ দেয়: ROS 2-তে sensor-স্ক্রিপ্টের ভাঙা আর model-এর ভাঙা আলাদা রোগ; topic খালি থাকলে আগে জিজ্ঞেস করো — প্রকাশকই আছে কি না। পরে এই camera-নির্মাণ আবার ভেঙে সাজানো হবে (আইটেম 6), তখন 45° মাউন্টের ধারণা আরও গভীর কারণে বদলে যাবে — সেই গল্পের খোলা বই Part 10।"},{"a":263,"b":267,"text":"আইটেম 2, তালিকার মুকুট-মণি: <b>Robot drives backward<\/b> — সবাই ভেবেছিল ওয়্যারিং বা সাইনের ভুল, আসল দোষী অস্থির wheel মোটর। যুক্তির চেইন গুনো: <code>5 N·m<\/code> টর্কের velocity মোটর বসানো হালকা চাকার ক্ষুদ্র জড়তায় — প্রতি <code>1 ms<\/code> physics পদক্ষেপে মোটর overshoot করে, আর এক চাকা শূন্য আদেশেও <code>52 rad/s<\/code>-এ ঘুরতে মাপা হয়েছিল। সমাধান তিন পদ: effort নামানো <code>2 N·m<\/code>-এ, joint থেকে <code>damping<\/code>/<code>friction<\/code> তুলে দেওয়া (velocity মোটর নিজেই ড্যাম্প করে, আর ODE-র damping পদ 1 ms ধাপে শক্তি ঢোকায়), আর চাকার জড়তা <code>x50<\/code> — ভর অপরিবর্তিত। প্রতিটি সংখ্যা URDF-র নোটে; Part 8 গল্পের জন্মস্থান।"},{"a":268,"b":271,"text":"আইটেম 3: lidar আর obstacle_avoid দুজনেই ভুল রশ্মি পড়ছিল — দুটি আলাদা ভুল একসঙ্গে। প্রথমটি সূচক-গণিতের: 360° স্ক্যান শুরু হয় <code>-180°<\/code>-তে, অর্থাৎ অ্যারের দুই মাথাই robot-এর <i>পেছন<\/i>, মাঝটা সামনে — যে প্রোগ্রাম মাথা থেকে স্লাইস কেটে সামনের রশ্মি পড়ত, সে পড়ছিল পেছন। দ্বিতীয়টি বসানোর: sensor ছিল পেছনের কোণে, নিজের arm-ই স্ক্যানে ধরা পড়ত। সমাধান দুই হাতে — sensor সরানো হলো সামনের frame-এ (laser1_frame), আর স্ক্রিপ্ট এখন রশ্মি বাছে bearing অনুযায়ী, অ্যারে-মাথার অনুমানে নয়। এই কারণেই obstacle_avoid পেছন-বাঁয়ের চ্যাসিস-ধরা রশ্মি filter করে (4.4; Part 10-এর mount comment)।"},{"a":272,"b":274,"text":"আইটেম 4: launch file-দ্বয়ের উন্নয়ন, তিনটি বদল এক সুতোয়। হার্ডকোড করা পথের বদলে <code>$(find neurobotics)<\/code> — package-সাপেক্ষ পথ, যেকোনো মেশিনে ঠিকানা নিজেই মেলানো যায়; xacro এই টোকেন URDF প্রক্রিয়া করার সময়ই মেটে (Part 13)। অনুমানের sleep-এর বদলে controller-রা এখন spawn-সম্পন্ন event-এ ওঠে — কেউ আন্দাজের ঘুমে সময় নষ্ট করে না। আর <code>robot_description<\/code> পাঠানোর আগে XML comment ছাঁটা হয় — Humble-এর parser bug এড়াতে (টেবিলের দ্বিতীয় সারির সেই প্রতিকার)। তিনটিই Part 12 আর 13-এ লাইনে-লাইনে খোলা — এই আইটেম তাদের কার্যবিবরণী মাত্র।"},{"a":275,"b":277,"text":"আইটেম 5: গৃহ-পরিচালনার সংস্কার। স্ক্রিপ্টগুলো workspace-এর এলোমেলো জায়গা থেকে তুলে package-এর ভেতরে (<code>scripts/<\/code>) আনা হলো — এখন জন্ম <code>ros2 run neurobotics ...<\/code> দিয়ে, source মাত্রই সব মেশিনে একই নিয়মে চলে। প্রতিটি স্ক্রিপ্ট নতুন করে লেখা হলো error handling আর watchdog-সহ — Ctrl+C বা topic হারালে robot থামিয়ে বেরোয় (সেকশন 4-এর সেই প্রতিশ্রুতি)। <code>package.xml<\/code>/<code>CMakeLists.txt<\/code> পূর্ণ করা হলো যেন install-তালিকা সম্পূর্ণ হয়। আর একটি সাংস্কৃতিক পদক্ষেপ: বাংলা কমেন্ট ইংরেজিতে অনূদিত — প্রকল্প এখন যে-কোনো দলের পাঠযোগ্য। বড় পদার্থবিজ্ঞান নেই এখানে; আছে নিয়ম-শৃঙ্খলা।"},{"a":278,"b":284,"text":"আইটেম 6-এর প্রথম অর্ধ, তালিকার দীর্ঘতম গল্প: robot-এ ছিল <b>দুই camera<\/b> — একটি কার্যকর, chassis-এর সামনে বোল্ট করা; অন্যটি মৃত DCW2 housing mesh, arm-এ শুধু সাজসজ্জা। বাস্তব robot-এ arm-camera ছাড়া আর কিছু নেই — তাই সেই মানদণ্ডেই বিচার: chassis-camera সরানো হলো, আর Gazebo sensor নতুন করে তৈরি <code>arm4<\/code>-এর ওপর, DCW2 housing-এর ঠিক পেছনে। দিকনির্ধারণ সবচেয়ে সুন্দর অংশ: camera এখন তাকিয়ে থাকে <b>arm-এর tool axis বরাবর<\/b> — gripper যেদিকে তাকায় সেদিকেই; ফলে দৃশ্য পদার্থবিজ্ঞানের মতোই arm অনুসরণ করে: arm সোজা মানে আকাশ, line_follow arm বাঁকিয়ে মেঝেতে নামায়। topic তবু পুরোনো <code>/camera/image_raw<\/code> — RViz-সহ সব শ্রোতা অপরিবর্তিত।"},{"a":285,"b":290,"text":"আইটেম 6-এর দ্বিতীয় অর্ধ: পথে পাওয়া gotcha-টি নিজেই এক শিক্ষা। Gazebo-র URDF থেকে SDF রূপান্তরে <b>fixed-joint link-এ ঝোলানো sensor-এর ভেতরের যেকোনো <code>&lt;pose&gt;<\/code> বর্জিত হয়ে যায়<\/b> — কারণ ওই link তার parent-এ weld হয়ে মিশে যায়, আর sensor গিয়ে পড়ে link-এর origin-এ — মাঝে মাঝে mesh-এর ঠিক ভেতরে, চিরকাল ধূসর ছাড়া কিছুই না দেখে। সমাধানের সূত্র এখান থেকেই: sensor বসাতে হবে এমন link-এ যার পেছনে একটি সত্যিকারের joint আছে — যেমন <code>arm4<\/code>। প্রমাণ হাতের কাছেই: lidar-এর 6 cm z-offset একই কারণে নিঃশব্দে গোগ্রাসে গিয়েছিল। এই পুরো comment-ব্লক Part 10-এ লাইন ধরে খোলা — এখানে তার স্মৃতিলিপি মাত্র।"},{"a":291,"b":297,"text":"আইটেম 7: <code>wheel_separation<\/code> 30% ভুল ছিল yaml-এ — লেখা <code>0.1955<\/code>, অথচ URDF-র সত্য <code>0.15<\/code> মিটার (চাকার joint-রা y = ±0.075-এ বসে)। ফল: odometry প্রতিটি ঘূর্ণন কম রিপোর্ট করত — robot বাঁক নিচ্ছে, আর <code>/diff_cont/odom<\/code> দাবি করছে সোজা; বাস্তব দুনিয়ার অ-ক্যালিব্রেটেড robot-এর সিম-যমজ। শুধরে ফেলা হয়েছে, আর মন্তব্যটি সোনার: নতুন <code>calib_angular.py<\/code> এটাই ধরে ফেলত — 360° ঘূর্ণন আদেশ দিয়ে IMU বনাম চাকা মেপে তুলনা; যদিও pivot-এ চার চাকাই skid করে বলে wheel odometry ঠিক config-এও প্রায় <code>1.9x<\/code> বেশি দাবি করে — এই ফাঁকই বাস্তব robot-কে IMU ফিউজ করতে বাধ্য করে। পুরো ব্যাখ্যা Part 11-এর সেই বিখ্যাত comment-এ।"},{"a":298,"b":303,"text":"আইটেম 8: <b>IMU sensor যোগ হলো<\/b> URDF-এ — <code>libgazebo_ros_imu_sensor<\/code> plugin, topic <code>/imu<\/code>, 50 Hz (Part 10-এর sensor-ব্লক)। কারণ আইটেম 7-ই শিখিয়েছিল: চাকার হিসাব ঘূর্ণনের সত্য নয়। তারপর <code>obstacle_avoid.py<\/code> গোড়া থেকে নতুন ইন্দ্রিয়ে সাজানো: স্টিয়ারিং এখন সামনের খাতের যে পাশে সবচেয়ে কাছের প্রতিফলন, সেই পাশ থেকে দূরে (আগে সে সবসময় বাঁয়ে মুড়াত — ডানে বাধা হলেও!), একটি heading latch যাতে ডজ-শেষে আগের গতিপথে ফেরা যায়, আর প্রথম স্ক্যান না আসা পর্যন্ত চালাতেই অস্বীকার — অন্ধ পালোয়ান নয়। 4.4-এর আচরণের সব বীজ এই তিন বদলেই।"},{"a":304,"b":306,"text":"আইটেম 9, সমাপ্তির হাতিয়ার-সংগ্রহ: <code>calib_angular.py<\/code> আর <code>calib_linear.py<\/code> — বাস্তব robot-এর সেই প্রসিদ্ধ ক্যালিব্রেশন-পদ্ধতির সিম-সংস্করণ (বিস্তারিত 4.6-এ), আর <code>lidar_view.py<\/code> — <code>/scan<\/code>-এর খাত-ভিত্তিক রাডার-দৃশ্য (4.5-এ)। লক্ষ করো তালিকার গঠন: শেষ এন্ট্রিগুলো নতুন কোনো রহস্য খুলছে না — আগের এন্ট্রিরা (ভুল wheel_separation, IMU-র অভাব) যেসব রোগ ধরিয়েছিল, এরা সেই রোগ ধরার স্থায়ী যন্ত্র। একটি প্রকল্প এভাবেই পরিণত হয়: bug থেকে শিক্ষা, শিক্ষা থেকে হাতিয়ার। নয়টি আইটেমের ছন্দ এখানেই শেষ — বাকি রইল তোমার পালা।"},{"a":308,"b":314,"text":"শেষ সেকশন 8: এগিয়ে যাওয়ার চারটি পথ, ক্রমবাহু সাহসে সাজানো। প্রথমটি নিজের প্রথম node: camera echo করে রঙ threshold করা — শুরুর কমান্ডই দেওয়া: <code>ros2 topic echo /camera/image_raw --field width<\/code>; ছবির message-এর ভেতরে কী কী আছে, এভাবেই ছুঁয়ে দেখো। দ্বিতীয়টি আরামের দর্শন: <code>rqt_image_view<\/code> দিয়ে camera-র স্রোত বসে বসে দেখা। তৃতীয়টি প্রকৃত প্রকৌশল: <code>line_follow.py<\/code>-র স্টিয়ারিং gain ঘুরিয়ে আচরণের ব্যবধান দেখা — টিউন করা শেখার একমাত্র রাস্তা নিজের হাতে ভাঙা। চতুর্থটি নিজের মঞ্চ-সাজানো: <code>worlds/line.world<\/code>-এ নতুন স্থির বাধা বসিয়ে avoider-এর পুনর্পরীক্ষা — workspace কপট নয়, তোমার পরীক্ষাগার এটাই।"}],"math":null,"robot":{"correct":"টেবিল আর fix log-কে ম্যাপ হিসেবে পড়লে প্রতিটি লক্ষণের দ্রুত সমাধান মেলে: source ভুলে গেলে package not found ওঠে, দুই launch চললে pkill-জুটি দিয়ে পরিষ্কার করলেই Moved backwards in time থামে, আর নয়-আইটেম ইতিহাসের প্রতিটি সমাধান আজ ফাইলে বসানো — চাকার ব্যাগ পেতে দেখলে মনে পড়বে ওটা ইচ্ছাকৃত (effort 2 N·m, damping নেই, জড়তা x50), যেমনটা URDF-র comment আর Part 8 বলে।","incorrect":"মারাত্মক ভুল হবে drove-backward সারিটাকে ওয়্যারিং-বাগ ভেবে উল্টো সাজানো: wheel joint-এ damping/friction ফিরিয়ে বা effort 5 N·m-এ তুললে পুরোনো অস্থিরতা ফেরে — মোটর প্রতি 1 ms ধাপে overshoot করে চাকা দৌড় দেয়। আরও দুই ফাঁদ: parser error-এর ভয়ে robot_description পাঠানোর লাইন হাতে বদলানো (launch-এর বসানো সমাধানই ভেঙে দেবে), আর pgrep-এ প্রথম পাওয়া PID মেরেই থেমে যাওয়া — বাকি ভূতরা বাসি robot_description আর cmd_vel লিখেই চলে থাকবে।"},"animType":null},{"n":4,"id":"part-04","fname":"neurobotics.urdf","enTitle":"Robot Root — M3Pro & the Base","lang":"xml","start":1,"end":57,"flags":[],"explain":[{"a":1,"b":2,"text":"এই URDF-এর একদম প্রথম element-ই <code>&lt;robot&gt;<\/code>, আর তার name attribute-এ মডেলের নাম <b>M3Pro<\/b>। পুরো document একটাই root-এর ভেতরে: নিচের প্রতিটি link, joint আর gazebo extension এই robot-এর child। loader pipeline এখান থেকেই পড়া শুরু করে — robot_state_publisher এই tree থেকে TF frame বানায়, Gazebo-র URDF-to-SDF converter একই tree-কে entity হিসেবে spawn করে। attribute দুই লাইনে ভাগ করা থাকলেও XML parser-এর কাছে এটা একটাই tag; SolidWorks export-এর এই formatting বদলানোর দরকার নেই, অর্থ শূন্য।"},{"a":4,"b":5,"text":"XML comment — loader এটি উপেক্ষা করে, কিন্তু engineer-এর জন্য এটি গোটা model-এর একটি গুরুত্বপূর্ণ design decision-এর দলিল। বক্তব্য: base_footprint হলো ground level-এ বসানো root link, আর তাতে ইচ্ছাকৃতভাবে কোনো visual, collision বা inertia নেই। কারণ Gazebo Classic fixed-joint reduction চালায় — fixed joint দিয়ে যুক্ত সব child তার parent-এ গলে merge হয়ে যায়। তাই খালি footprint link-টা physics-এ কোনো ভার বইতে পারে না; এটি শুধু navigation আর odometry-র জন্য একটি স্থির reference frame হিসেবে টিকে থাকে। Part-11-এর diff_cont-ও তার base_frame_id হিসেবে এই নামটাই চায়।"},{"a":6,"b":6,"text":"এক লাইনের self-closing <code>&lt;link/&gt;<\/code> tag-ই সম্পূর্ণ base_footprint link। ভেতরে inertial, visual, collision কিছুই নেই — আগের comment-এ বলা ইচ্ছাকৃত শূন্যতা। robot_state_publisher এই লাইন পড়ে TF tree-তে base_footprint নামে একটা frame register করে, আর যেহেতু এর কোনো geometry নেই, RViz-এ link-টা দেখাও যায় না, শুধু frame axes দেখা যায়। odometry pipeline-এ এর মূল্য বিশাল: wheel odometry ধরে নেয় মাটি স্পর্শ করে এমন একটা অচল বিন্দুতে robot-এর সব গতি জমা হয়। খুব সাধারণ ভুল হলো এখানে পরে inertia বসিয়ে দেওয়া — physics তা parent-এ merge করে ফেলে, ফল শুধু বিভ্রান্তি।"},{"a":8,"b":12,"text":"এখন tree-তে প্রথম joint: <code>link2footprint<\/code>, type <code>fixed<\/code>। parent হিসেবে base_footprint, child হিসেবে base_link বসানো, আর origin-এ xyz ও rpy দুটোই শূন্য — মানে base_link frame-টা base_footprint-এর ঠিক ওপরে, কোনো rotation ছাড়াই বসে। robot_state_publisher এই তথ্য দিয়ে বানায় একটা static transform: <code>base_footprint<\/code> থেকে <code>base_link<\/code>, যা চিরকাল অপরিবর্তিত থাকে। কিন্তু Gazebo-র জগতে গল্পটা অন্যরকম: spawn-এর সময় fixed-joint reduction এই joint-কে গুঁড়িয়ে দুই link-এর ভর একত্র করে ফেলে, তাই simulator এই joint আর আলাদা করে দেখেই না।"},{"a":14,"b":16,"text":"<code>&lt;link&gt;<\/code> tag খুলছে আসল শরীর — <b>base_link<\/b>, এই chassis-এর ওপরেই বাকি সব কিছু বসে। পরের লাইনে child হিসেবে <code>&lt;inertial&gt;<\/code> block শুরু। URDF-এ link-এর তিনটা optional section থাকে: inertial (physics-এর ভর আর জড়তা), visual (RViz আর Gazebo-র চোখে রূপ), collision (contact geometry)। কঠিন ক্রমের বাধ্যবাধকতা নেই, তবে এই file-এ convention inertial আগে। এই block-এর ভেতরের mass আর inertia tensor-ই ঠিক করে দেয় Gazebo-র ODE solver চ্যাসিসকে কতটা জোরে ঠেলবে, আর wheel-এর ঘর্ষণের বিরুদ্ধে সে কতটা দুর্বল শক্তিতে দুলবে।"},{"a":17,"b":20,"text":"আরেকটা comment, কিন্তু গোটা file-এর সবচেয়ে শিক্ষণীয় লাইনগুলোর একটা। ইতিহাস: SolidWorks export যে inertia দিয়েছিল তা ছিল অনেক হালকা একটা অংশের — ফলে simulator-এ চ্যাসিস হয়ে উঠেছিল <i>unrealistically twitchy<\/i>, একটু ছুঁলেই কেঁপে ওঠে। সমাধান: mass বসানো হয়েছে 4.0 kg, আর inertia পুরো নতুন করে হিসেব করা হয়েছে একটা uniform box ধরে, যার মাপ mesh-এর bounding box থেকে — 0.2764 x 0.2216 x 0.1725 m। ক্লাসিক lesson: CAD tool-এর দেওয়া physics value সবসময় যাচাই করতে হয়, কারণ simulator সেটাকেই আক্ষরিক অর্থে নেয়।"},{"a":21,"b":25,"text":"inertial-এর ভেতরের origin বলে দিচ্ছে এই link-এর center of mass কোথায়: xyz = -0.0231, -0.0006, 0.0924 — chassis-এর geometric center থেকে সামান্য পেছনে ও ওপরে, CAD থেকে আসা প্রকৃত মান। rpy শূন্য মানে inertia tensor যে orientation-এ লেখা সেই frame-এই প্রযোজ্য। তারপর <code>&lt;mass&gt;<\/code> element-এ value 4.0 — চার কেজি চ্যাসিস, যার ওপর বসবে চারটা wheel, পাঁচটা arm link, gripper আর sensor-ঘর। খেয়াল রাখুন: এই সংখ্যাগুলোর গন্তব্য শুধু Gazebo; robot_state_publisher mass নিয়ে ভাবেই না, ওর কাজ শুধু frame-এর জ্যামিতি।"},{"a":26,"b":33,"text":"এখানে inertia tensor-এর ছয়টা উপাদান — কিন্তু কার্যত তিনটা: ixx 0.02629, iyy 0.03539, izz 0.04184, আর তিনটা off-diagonal (ixy, ixz, iyz) সব শূন্য। মানে principal axes ঠিক এই link-এর নিজের x-y-z অক্ষের সাথে মিলে আছে। izz সবচেয়ে বড়, ixx সবচেয়ে ছোট — অর্থাৎ robot তার উল্লম্ব yaw অক্ষে সবচেয়ে জড়, তাই differential drive-এ left-right wheel-এর বিপরীত torque দিয়ে ঘোরাতে সবচেয়ে বেশি বাধা। আগের comment-এ বলা uniform box হিসেব থেকেই এই মানগুলো — bounding box-এর মাপ আর 4.0 kg mass দিয়েই উৎপন্ন।"},{"a":34,"b":41,"text":"visual block শুরু — এটা দেবে চোখে দেখা রূপ। origin-এ xyz আর rpy দুটোই শূন্য: mesh ঠিক link-এর নিজের frame-এ বসে, কোনো shift নেই। geometry হিসেবে <code>mesh<\/code>, filename হিসেবে <code>package://neurobotics/meshes/base_link.STL<\/code> — URI-টা package-relative, তাই xacro-র <code>$(find neurobotics)<\/code> resolution একে install share-এর সঠিক পথে নিয়ে যায়; launch file-গুলো (Part-12, 13) ঠিক এই কারণেই URDF-টা xacro দিয়ে প্রসেস করে। RViz আর Gazebo দুজনেই এই mesh render করে; STL ফাইল না মিললে model অদৃশ্য থাকে কিন্তু physics চলতেই থাকে।"},{"a":42,"b":47,"text":"visual-এর material block। name attribute খালি স্ট্রিং — অর্থাৎ এই color global palette-তে রাখা হয়নি, শুধু এই link-এ inline সংজ্ঞায়। rgba-র তিনটা রঙের মান সমানভাবে 0.502 আর alpha 1 — অর্ধেক-ধূসর চ্যাসিস। এই color RViz-এর default rendering-এ কাজ করে; Gazebo Classic-এর নিজস্ব material ব্যবস্থা আলাদা, তাই file-এর একেবারে নিচে (Part-10) আলাদা <code>&lt;gazebo reference&gt;<\/code> block-এ Gazebo/Grey material আবার বসানো হয়েছে — একই ধূসর রঙ দুই দুনিয়ায় দুইভাবে বলা হয়েছে, একটুও বাড়তি নয়।"},{"a":48,"b":57,"text":"শেষ section: collision। এখানেও একই <code>base_link.STL<\/code> mesh, origin শূন্য — অর্থাৎ যা দেখা যায় ঠিক তার ওপরেই contact হিসেব হয়। জটিল mesh collision হিসেবে নেওয়ায় Gazebo-র প্রতিটা physics step-এ contact point হিসেব ব্যয়বহুল হতে পারত; এই প্রজেক্টে base-এ সরলতা বেছে নেওয়া হয়েছে, আর wheel-এর বেলায় পরে (Part-8) দেখা যাবে উল্টো সিদ্ধান্ত — সেখানে mesh নয়, সস্তা cylinder primitive। চ্যাসিসের নিচের অংশ মাটি ছোঁয় না, ছোঁয় wheel; তাই এই collision মূলত বাইরের ধাক্কা আর arm ভাঁজ করলে নিজের শরীর ছোঁয় কি না তা হিসেব করে। এখানে <code>&lt;/link&gt;<\/code> দিয়ে base_link শেষ — robot-এর ভিত্তি তৈরি।"}],"math":null,"robot":{"correct":"launch হলে robot_state_publisher TF tree বানাবে যার root এই base_footprint — RViz-এ frame axes দেখা যাবে, তার ঠিক ওপরে base_link-এর ধূসর STL chassis ভেসে উঠবে, আর /joint_states এলে arm frame-গুলো নড়বে। Gazebo-তে spawn-এর সময় fixed joint-টা reduction-এ মিলিয়ে যায়, 4.0 kg mass আর recomputed inertia ODE solver-এর কাছে যায় — ফলে চ্যাসিস আর সেই পুরনো twitchy আচরণ করে না। পুরো স্থিরতাও নয়: প্রথম cmd_vel-এর আগে wheel-contact solver-এর কারণে robot ধীরে সামান্য সরতে পারে — README-র মতে harmless।","incorrect":"প্রচলিত একটি ভুল: base_footprint-কেও বাকি link-দের মতো পূর্ণাঙ্গ করার নামে তাতে visual, collision আর একটা inertia বসিয়ে দেওয়া। ফলাফল: Gazebo-র fixed-joint reduction child-এর সব কিছু parent base_link-এ merge করে ফেলে, তাই chassis-এর ভর আর inertia দুবার গণনা হয়ে অস্বাভাবিক ভারী শরীর আর মিলিয়ে যাওয়া আচরণ আসে। URDF load হবে, কোনো error বার্তা আসবে না — তবু ভুলটা হয়েই থাকবে।"},"animType":"urdfTree"},{"n":5,"id":"part-05","fname":"neurobotics.urdf","enTitle":"The 5-DOF Arm Chain","lang":"xml","start":58,"end":352,"flags":[],"explain":[{"a":58,"b":73,"text":"arm chain-এর প্রথম link <code>arm1<\/code> — base_link-এর ওপর বসা ঘূর্ণায়মান প্ল্যাটফর্ম, পুরো block জুড়ে শুধু তার inertial বিবরণ। origin-এর xyz = (2.14e-05, -2.29e-05, 0.0109) — center of mass প্রায় link-এর নিজের কেন্দ্রে, z-দিকে সামান্য ওপরে; rpy শূন্য, তাই নিচের inertia tensor ঠিক এই link-এর নিজের অক্ষেই লেখা। মানগুলো কত অতিক্ষুদ্র দশমিকে রাখা আছে খেয়াল করুন — SolidWorks export এই রেজল্যুশনেই দেয়, আর ঘুঁচিয়ে গোছানোর দরকার নেই: loader float64 নিয়ে কাজ করে, precision হারায় না।"},{"a":74,"b":87,"text":"visual block-এ arm1-এর চেহারা: <code>package://neurobotics/meshes/arm1.STL<\/code> mesh, origin শূন্য। রঙ rgba 0.776, 0.757, 0.737 — তিনটা মান প্রায় সমান কিন্তু হুবহু নয়: মৃদু উষ্ণ রুপালি টান, তাই ডকুমেন্টে এই link-কে silver বলা হয়; base_link-এর ধূসরের চেয়ে একটু উজ্জ্বল। নিচের Gazebo material তালিকায় (Part-10) এর জন্য আলাদা Gazebo/Silver এন্ট্রি আছে, তাই Gazebo-র ভেতরেও রঙ মিলবে। RViz-এ ঠিক এই রঙেই arm-এর গোড়ার টুকরোটা দেখা যাবে, আর display.launch.py-এর slider ঘোরালে এই mesh-টাই ঘুরবে।"},{"a":88,"b":97,"text":"collision block visual-এর যমজ — একই arm1.STL, একই শূন্য origin। মানে যে জ্যামিতি চোখে দেখা যায় ঠিক তার সাথেই অন্য কিছু ধাক্কা লাগলে contact হিসেব হবে। arm ভাঁজ করলে নিজের চ্যাসিস বা মাটির সাথে এই mesh-ই সংঘর্ষ পরীক্ষা করবে; obstacle_avoid চালানোর সময় README সাবধান করে যে folded arm সামনের পথে dead-ahead obstacle হিসেবে দেখা যায় — সেই পর্যবেক্ষণের ভিত্তি এই collision geometry-ই। এখানে <code>&lt;/link&gt;<\/code> দিয়ে arm1 শেষ; এরপর আসবে এর joint, যা একে base_link-এর সাথে জুড়বে।"},{"a":98,"b":103,"text":"arm chain-এর প্রথম revolute joint: <code>arm1_Joint<\/code>। <code>&lt;origin&gt;<\/code> বলছে child frame arm1 তার parent base_link frame-এর সাথে কোথায় বসে: xyz = (0.033617, -1.24e-05, 0.185) — চ্যাসিসের কেন্দ্র থেকে প্রায় 3.4 সেমি সামনে আর 18.5 সেমি ওপরে, বাম-ডান দিকে সরা নগণ্য। rpy = (6.3751e-05, 0, 0.028395): roll প্রায় শূন্য, yaw 0.0284 rad অর্থাৎ প্রায় 1.63 ডিগ্রি — CAD assembly-তে এই মাউন্ট একদম অক্ষ-বরাবর ছিল না। এই সামান্য তির্যকতাও TF-তে বরাবরের মতোই প্রবেশ করে, চুপচাপ, আর Part-5-এর math-এ সেটাই হিসেব হয়।"},{"a":104,"b":109,"text":"parent base_link, child arm1 — kinematic tree-তে নতুন একটাই প্রান্ত। axis <code>0 0 1<\/code>: joint-এর rotation ঘটে child frame-এর নিজের z-অক্ষ ঘিরে, অর্থাৎ arm1 base_link-এর ওপর বাম-ডান yaw করে — ৫-DOF chain-এর প্রথম স্বাধীনতা এটাই, base joint-এর waist rotation। position controller arm_cont (Part-9) এই joint-এর POSITION interface-এ radian মান পাঠায়, আর robot_state_publisher প্রতিটি /joint_states update-এ arm1 frame-এর নতুন transform ছাপে। খেয়াল করুন অক্ষটা একেবারে নিখুঁত 0 0 1 — মাঝের তিন joint-এ (arm2-4) CAD-অবশিষ্টাংশ ঢুকবে, কিন্তু chain-এর ডগায় arm5_Joint-ও আবার এই একই নিখুঁত 0 0 1 ফিরে পাবে।"},{"a":110,"b":116,"text":"limit block: lower -1.5708, upper 1.5708 rad — দুই দিকেই ঠিক 90 ডিগ্রি করে, waist joint বামে-ডানে এক চতুর্থাংশ বৃত্ত পর্যন্ত ঘোরতে পারে। effort 100 আর velocity 1: controller-এর পাঠানো torque 100 N m পর্যন্ত সীমাবদ্ধ, আর joint-এর গতি 1 rad/s পর্যন্ত — দুটোই Gazebo-র physics মানে, শুধু controller-এর সৌজন্য নয়। তারপর <code>&lt;dynamics damping 0.5 friction 0.5/&gt;<\/code> — এই joint-এ damping আর friction রাখা হয়েছে; মনে রাখুন wheel joint-গুলোতে (Part-8) দুটোই ইচ্ছাকৃতভাবে বাদ, কারণ ওখানে velocity motor-র সাথে ODE-র damping term শক্তি ঢোকায়। arm-এ position motor, তাই এখানে এই damping নিরাপদ।"},{"a":117,"b":132,"text":"দ্বিতীয় link <code>arm2<\/code> — কাঁধ। inertial-এর origin xyz = (-0.0006, -9.28e-05, 0.0264): center of mass প্রায় অক্ষ বরাবর, সামান্য ওপরে উঠে থাকা অংশের দিকে; rpy শূন্য। arm link-গুলোর একটা প্যাটার্ন এখানে প্রতিষ্ঠিত হয়: প্রত্যেকটার inertial origin আর mass CAD export-এর যথার্থ মাপ, কোনো rounding নেই। পরের joint-এর origin z = 0.033 এই link-এর ওপরের প্রান্তে বসবে — অর্থাৎ arm2-এর দেহ প্রায় 3.3 সেমি লম্বা, তারপরই পরের ঘূর্ণন। এভাবে প্রতিটি টুকরো নিজের frame-এ স্বয়ংসম্পূর্ণ, chain-এর অন্য কোনো link-এর ওপর নির্ভরশীল নয়।"},{"a":133,"b":146,"text":"visual: <code>arm2.STL<\/code> mesh, শূন্য origin। রঙ বদলে গেছে — rgba 0.898, 0.918, 0.929, তিনটা মানই নয়ের কাছে: প্রায়-সাদা হালকা ধূসর। arm3 আর arm4-ও একই রঙ পাবে, তাই গায়ের রঙেই chain-এর মাঝের অংশ চেনা যায়: গোড়া রুপালি, মাঝ সাদা, শেষ গাঢ়। নিচের Gazebo material তালিকায় এদের জন্য Gazebo/White। এই একই mesh পরের block-এ collision হিসেবেও ফিরবে — visual আর collision এক হলে যা দেখা যায় তা-ই ধাক্কা খায়, debugging সহজ হয়। slider টানলে এই সাদা টুকরোটাই কাঁধের কব্জায় নড়বে।"},{"a":147,"b":156,"text":"collision block আগের নিয়মেই: একই arm2.STL, origin xyz 0 0 0 আর rpy 0 0 0। arm সোজা থাকলে এই geometry চ্যাসিসের ওপর দিয়ে ওপরে উঠে যায়, কোনো contact নেই; arm2 = arm3 = -0.70 rad করে সামনের দিকে ভাঁজ দিলে — line_follow.py ঠিক এই pose-ই কমান্ড করে — এই mesh-টাই চ্যাসিসের সামনে ঝুঁকে আসে। obstacle_avoid-এর সতর্কবার্তা যে folded arm সামনের obstacle হিসেবে ধরা পড়ে, তার কারণ এই প্রসারিত collision geometry-ই। <code>&lt;/link&gt;<\/code> দিয়ে arm2 শেষ; এবার এর joint, যার origin আর axis দুটোই আলাদা গল্প বলবে।"},{"a":157,"b":162,"text":"arm2_Joint-এর origin: xyz = (-0.0021522, 6.1185e-05, 0.033), rpy = (-6.3725e-05, 0, -0.028422)। মানে arm1-এর frame থেকে 3.3 সেমি ওপরে এই joint বসেছে, আর rpy-টা লক্ষ্য করুন — arm1_Joint-এর rpy-এর প্রায় হুবহু বিপরীত (yaw 0.0284 এর জায়গায় -0.0284, roll-ও উল্টো)। CAD assembly একই সামান্য তির্যকতা দুই পাশ থেকে কাটল, ফলে দুই joint-এর মধ্যে প্রায়-বাতিল হয়ে গেল: পুরো chain-এর অভিমুখ তাই কার্যত উল্লম্বই থাকে। আসল CAD assembly-র export-এ এই ধরনের জোড়া-বিপরীত মান খুব সাধারণ ছাপ।"},{"a":163,"b":168,"text":"parent arm1, child arm2, আর axis <code>0 -1 -6.3725e-05<\/code> — chain-এর সবচেয়ে শিক্ষণীয় এক লাইন। অক্ষটা নিখুঁত -Y নয়; শেষে একটা -6.37e-05 উপাদান লেগে আছে, মানে অক্ষটা প্রায় কিন্তু হুবহু child-এর -y দিক নয়। URDF loader অক্ষটাকে normalize করে নেয়, তাই এত ছোট deviation-এ গণিত ঠিকই চলে। rotation ঘটে এই প্রায়-(-Y) অক্ষ ঘিরে — অর্থাৎ arm2 কাঁধ হিসেবে সামনে-পেছনে pitch করে। এই জাতীয় অতিক্ষুদ্র অশূন্য উপাদান CAD export-এর স্বভাব, ভুল নয়; এর মানেদারি এই Part-এর math-এ আলাদা করে দেখানো হয়েছে।"},{"a":169,"b":175,"text":"limit আগের joint-এর মতোই: -1.5708 থেকে +1.5708 rad, effort 100 N m, velocity 1 rad/s। কাঁধ joint দুই দিকে 90 ডিগ্রি করে মোড়া যায় — HOME-এ (সব শূন্য) সোজা ওঠা arm সামনে নাকি পেছনে ভাঁজ হবে, দুই দিকেই সমান জায়গা আছে। dynamics সেই পুরনো damping 0.5 friction 0.5। লক্ষণীয় যে পাঁচটা arm joint-ই effort 100 আর velocity 1 পায় — ওদের ওপর বসানো ভার কম, তাই এই সীমায় কোনো instability দেখা যায়নি; wheel-এর 2 N m সীমা একেবারে আলাদা গল্প (Part-8), ওখানে বেশি effort মানেই দুর্বার ঘূর্ণন।"},{"a":176,"b":191,"text":"তৃতীয় link <code>arm3<\/code> — কনুই। inertial-এর origin xyz = (-0.0006, -7.46e-05, 0.0258), কাঁধের মানের খুব কাছে: দুটো link প্রায় একই মাপের যমজ, কনুই সামান্য ছোট। chain ধরে ওঠা প্রতিটি নতুন link-এর center of mass তার নিজের frame-এ মাপা — কারণ URDF-তে inertia সবসময় link-এর নিজের frame-এ লিখতে হয়; joint যতবারই ঘুরুক, এই সম্পর্ক অটুট থাকে, ঘূর্ণনটা হয় পরের frame-এ transform-এর ভেতরে। এটাই joint-space model সুবিধা দেয়: প্রতিটি টুকরো সংজ্ঞায় স্বাধীন, পরিবর্তন করলে অন্য কিছু ভাঙে না।"},{"a":192,"b":205,"text":"visual: <code>arm3.STL<\/code>, রঙ arm2-এর হুবহু এক — rgba 0.898, 0.918, 0.929 প্রায়-সাদা। একই রঙ ইচ্ছাকৃত: বাইরে থেকে কাঁধ আর কনুই একই পরিবারের অংশ বলেই বোঝায়; আলাদা রঙ রিজার্ভ করা গোড়ার silver (arm1) আর হাতের গাঢ় (arm5)-এর জন্য। origin শূন্য — mesh আবার ঠিক link-এর নিজের frame-এ। Part-10-এর Gazebo material তালিকায় এই প্রায়-সাদা link-গুলোর জন্যই Gazebo/White এন্ট্রি আছে, তাই simulator-এর ভেতরেও রঙ মিলবে। RViz-এ সাদা তিন টুকরোর মাঝের এটাই দ্বিতীয়টা।"},{"a":206,"b":215,"text":"collision একই arm3.STL, শূন্য origin। কনুই ভাঁজের সময় এই geometry-ই পরীক্ষা করে যে arm নিজের অন্য অংশ ছোঁয় কি না — সীমা ±90 ডিগ্রি এমনভাবে বসানো যে self-collision সাধারণত আসে না, তবু Gazebo প্রতি step-এ pairwise contact পরীক্ষা চালায়। line_follow.py-র কমান্ড করা pose-এ (arm3 = -0.70 rad, প্রায় 40 ডিগ্রি) কনুই সামনের দিকে ভাঁজ হয়ে camera-কে মেঝের দিকে তাক করায় — সেই কোণ তৈরি করে এর নিজের joint, এই block শুধু তার শরীরের আকার দেয়। <code>&lt;/link&gt;<\/code> দিয়ে arm3 শেষ।"},{"a":216,"b":221,"text":"arm3_Joint-এর origin একদম সরল: xyz = (0, 0, 0.08285), rpy = (6.3702e-05, 0, 0.027102)। arm2-এর frame থেকে সোজা 8.285 সেমি ওপরে কনুই বসেছে — কোনো side offset নেই, তাই প্রতিবেশী দুই link-এর অক্ষ এক রেখায়। rpy-তে আবার সেই পরিচিত জোড়া: roll 6.37e-5, yaw 0.0271 — arm1_Joint-এর মানের কাছাকাছি, অর্থাৎ assembly-র একই সামান্য তির্যকতা প্রতিটি স্তরে পুনরাবৃত্ত হয়েছে। এই ধারাবাহিকতা দেখেই বোঝা যায় মানগুলো একই CAD ত্রুটি-প্রবণতা থেকে এসেছে, হাতে লেখা নয় — আর একবার শূন্য করতে গেলে সবগুলোতেই করতে হতো, কেউ করেনি।"},{"a":222,"b":227,"text":"parent arm2, child arm3, axis <code>-0.027098 -0.99963 0<\/code>। এবার অক্ষের প্রথম উপাদানটাই -0.027 — অতিক্ষুদ্র নয় এমন একটা tilt, অর্থাৎ কনুইর ঘূর্ণন অক্ষ হুবহু -Y নয়, প্রায় 1.55 ডিগ্রি ঘোরানো। কেন, তার উত্তর ওপরেই আছে: arm2_Joint-এর rpy yaw (-0.0284) child frame-কে ঘুরিয়ে রেখেছে, আর CAD এই joint-এর অক্ষ নির্দিষ্ট করেছে সেই ঘোরানো frame-এর হিসাবে — উল্লেখ্য URDF-এ axis child frame-এ ব্যাখ্যা করা হয়। arm2-র প্রায়-(-Y) অক্ষের সাথে মিলিয়ে দেখলে দুই ঘূর্ণন-অক্ষ বাস্তবে প্রায় সমান্তরাল: একটার ঢাল আরেকটার ঢাল কাটছে।"},{"a":228,"b":234,"text":"limit আবার ±1.5708, effort 100, velocity 1; dynamics damping 0.5 friction 0.5। প্যাটার্নটা এখন স্পষ্ট: পাঁচটা arm joint-ই একই effort-velocity জোড় আর একই dynamics পায়, আলাদা শুধু origin আর axis। কনুই মোটরও কাঁধের মতোই position-controlled — arm_cont (Part-9) একই /arm_cont/commands array-র পরপর উপাদান হিসেবে দুটোকেই radian পাঠায়; arm_gui-র slider-ও (Part-2) ঠিক এই ক্রমেই সাজানো। আর line_follow.py ঠিক এই দুই উপাদান -0.70 করে camera-কে মেঝের দিকে নামায় — একটা কমান্ড, দুই joint।"},{"a":235,"b":250,"text":"চতুর্থ link <code>arm4<\/code> — কবজির প্রথম অংশ। inertial-এর origin xyz = (0.00266, -5.48e-05, 0.0318): center of mass x-দিকে সামান্য সরানো, কারণ এই link-এর গায়েই বাইরের দিকে DCW2 camera-ঘর লাগে (Part-7), ভেতরের দিকে তার মাউন্ট। chain-এ এর ভূমিকা বিশেষ: camera sensor ঠিক এই link-এর ওপর বসানো হয়েছে, কারণ fixed joint-এ ঝুলানো welded link-এর sensor থেকে Gazebo pose খেয়ে ফেলে — সেই পুরো গল্প Part-10-এ। এখানে শুধু মনে রাখুন: arm4 কোনো সাধারণ টুকরো নয়, এর frame-ই camera-র দৃষ্টির ভিত্তি।"},{"a":251,"b":264,"text":"visual: <code>arm4.STL<\/code>, রঙ arm2/arm3-এর একই প্রায়-সাদা (rgba 0.898, 0.918, 0.929)। কিন্তু এই link-এর চেহারায় একটা বাড়তি জিনিস থাকবে: পরের অংশে (Part-7) DCW2 নামে আলাদা গাঢ় ঘর link হিসেবে fixed joint-এ এর গায়ে লাগানো, তাই RViz-এ arm4-কে দেখতে হবে সাদা কবজি আর তার সঙ্গী গাঢ় camera-বস্তার জোড়া হিসেবে। mesh নিজে শুধু কবজির দেহ; sensor-এর দৃশ্যমান অংশ DCW2-র STL-এ। একই রঙ-নীতি মেনে Gazebo/White এন্ট্রি এখানেও আছে, তাই দুই renderer-এ চেহারা মিলবে।"},{"a":265,"b":274,"text":"collision: একই arm4.STL, শূন্য origin। এই geometry-র একটা সূক্ষ্ম দিক আছে: camera sensor-এর pose (Part-10-এ -0.077, 0.0025, 0.058) এই link-এর frame-এ সংজ্ঞাত, আর sensor-এর নজর যেন নিজের DCW2 ঘর দিয়ে না যায় সেজন্যই তাকে পেছনের দিকে ঠেলে রাখা হয়েছে — এই collision mesh-টাই সামনের পথ পরিষ্কার রাখে কি না তার বাস্তব পরীক্ষা। কবজি ঘুরলে এই দেহও ঘোরে, তাই ধাক্কা খাওয়া পৃষ্ঠটাও camera-র সাথেই ঘোরে। <code>&lt;/link&gt;<\/code> দিয়ে arm4-র link section শেষ; এরপর এর joint।"},{"a":275,"b":280,"text":"arm4_Joint-এর origin: xyz = (0, 0, 0.08285) — arm3_Joint-এর হুবহু একই উচ্চতা, chain-এর দুই সিঁড়ি সমান ধাপে উঠেছে। rpy = (0, 0, -0.027075): এবার roll শূন্য, শুধু yaw -0.0271 — আগের joint-গুলোর ধারাবাহিকতাই, মান আবার সেই পরিচিত 0.027 মাপের কাছে। অর্থাৎ arm3 আর arm4-এর মধ্যে কোনো lateral offset নেই; কবজি সোজা ওপরের দিকে বাড়ে। সব মিলিয়ে দেখলে arm chain প্রায়-উল্লম্ব একটা স্তম্ভ, যার গা-ঘেঁষা সব তির্যকতা জোড়ায় জোড়ায় প্রায় বাতিল হয়ে গেছে — এ জন্যই HOME pose এত সরল।"},{"a":281,"b":286,"text":"parent arm3, child arm4, axis <code>-2.6392e-05 -1 0<\/code>। আবার সেই ঘটনা, কিন্তু উল্টো মাত্রায়: প্রথম উপাদান প্রায় শূন্য (-2.6e-5), দ্বিতীয়টা প্রায় নিখুঁত -1 — arm2_Joint-এর axis-এর চেয়ে এটা অনেক পরিষ্কার, কারণ এই joint-এর rpy-তে কাজ আগের ধাপে শেষ হয়ে গেছে। ঘূর্ণন কবজির pitch, একই -Y পরিবারের অক্ষ। camera-র দৃষ্টির জন্য এটাই সবচেয়ে গুরুত্বপূর্ণ joint: camera-ঝোঁকানো ভঙ্গি এক joint-এর কৃতিত্ব নয় — arm2 আর arm3-কে -0.70 করে, arm4-কে -0.87 rad করলে তিন pitch মিলে দৃষ্টি অনুভূমিক থেকে প্রায় 40 ডিগ্রি নিচে নামে, মেঝের 0.4 থেকে 1.4 মিটার অংশ দেখা যায়।"},{"a":287,"b":293,"text":"limit একই: ±1.5708 rad, effort 100 N m, velocity 1 rad/s; damping 0.5, friction 0.5। সাধারণ সীমার পেছনে অসাধারণ ব্যবহারিক ভূমিকা: line_follow.py ঠিক arm4 = -0.87-এ রেখে camera নামায়, আর HOME-এ ফিরলে সব কোণ শূন্য — camera সোজা ওপরে তাকিয়ে আকাশ ছাড়া কিছুই দেখে না। position command-গুলো arm_cont (Part-9) দিয়ে আসে, আর সীমার পাহারা দেয় physics — 90 ডিগ্রির বাইরে কোনো স্ক্রিপ্টই কবজিকে ঠেলতে পারে না। এই পর্যন্ত চারটা joint-ই ±1.5708 পেয়েছে; শেষটা অন্যরকম হবে।"},{"a":294,"b":309,"text":"পঞ্চম ও শেষ arm link <code>arm5<\/code> — হাতের তালু, এখান থেকেই gripper ছড়িয়ে যাবে (Part-6)। inertial-এর origin xyz = (0.0186, -0.0025, 0.0265): center of mass একটু সামনে সরানো — তালুর গঠন একপার্শ্বিক, আর আঙুলগুলোর ভর পরের link-গুলোতে আলাদা গণনা হবে। rpy শূন্য। chain-এর শেষ প্রান্তে দাঁড়িয়ে এই link-ই বহন করে সবচেয়ে বেশি সঞ্চালিত গতি: তালু ঘোরানোর joint-টাই DOF-এর শেষ। উল্লেখ্য README-তে 6-DOF arm লেখা থাকলেও এই chain-এ arm revolute joint ঠিক পাঁচটাই — বাকি স্বাধীন ঘূর্ণনগুলো gripper-র ভেতরে।"},{"a":310,"b":323,"text":"visual: <code>arm5.STL<\/code>, আর রঙ হঠাৎ বদলে গাঢ় — rgba 0.204, 0.204, 0.204, তিন চ্যানেল সমান গাঢ় ধূসর। chain-এ এই রঙের আরেকটাই সঙ্গী: camera-ঘর DCW2 (Part-7), তাই দূর থেকেই হাতের মাথা চেনা যায়। নিচের Gazebo material তালিকায় এর জন্য Gazebo/DarkGrey। এই রঙ-বিভাজন শুধু সাজগোজ নয়: camera-র দৃশ্যে আর RViz-এ operator দ্রুত বোঝে কোথায় কী আছে — মাঝের উজ্জ্বল সাদা টুকরোগুলো, শেষে গাঢ় গোল মাথা। যন্ত্র চিনতে দেখতে শেখানো ডিজাইনের পুরনো কৌশল।"},{"a":324,"b":333,"text":"collision একই arm5.STL, শূন্য origin। এই তালুর সামনেই gripper-র ছয়টা joint — মোটর একটাই, বাকি পাঁচটা mimic (Part-6) — আর তাদের আঙুল-জ্যামিতি; তাই তালুর এই পৃষ্ঠটাই শেষ প্রধান ঢাল: কোনো বস্তু ধরতে গেলে বা হাত উড়িয়ে কিছু ধাক্কালে প্রথম ধাক্কা এখানেই লাগতে পারে। এই প্রজেক্টের কোনো স্ক্রিপ্ট আসল grasp করে না, তাই collision মূলত চলার পথে হাত লাগলে তা ধরবে। <code>&lt;/link&gt;<\/code> দিয়ে arm5 শেষ — এবার এর joint, যা পুরো chain-এ একটা অনন্য সীমা নিয়ে আসছে।"},{"a":334,"b":339,"text":"arm5_Joint-এর origin: xyz = (0.00057305, 0, 0.074815), rpy = (0, 0, 0) — গোটা arm chain-এ একমাত্র joint যার rpy সম্পূর্ণ শূন্য, কোনো CAD তির্যকতার চিহ্ন নেই। কবজির শেষ ধাপ 7.48 সেমি। সব কোণ শূন্য অর্থাৎ HOME-এ পুরো chain-এর উচ্চতা এখন সরল যোগফল: 0.185 + 0.033 + 0.08285 + 0.08285 + 0.074815, মোট প্রায় 0.4585 মিটার base_link-এর উৎস থেকে — এই Part-এর math-এর শেষ স্তরে সেটাই গুণফল-সহিত দেখানো হয়েছে। সোজা ওঠা এই উচ্চতাতেই camera নিখুঁত ওপরে তাকিয়ে থাকে, আকাশ দেখে।"},{"a":340,"b":345,"text":"parent arm4, child arm5, axis <code>0 0 1<\/code> — নিখুঁত উল্লম্ব অক্ষ, arm1_Joint-এর axis-এর মতোই। অর্থাৎ তালু নিজের z-অক্ষ ঘিরে roll করে: ধরা বস্তু ঘুরিয়ে সাজানোর কাজের joint। বিন্যাসটা লক্ষণীয় — গোড়ার waist (arm1) আর শেষের roll (arm5) দুটোই উল্লম্ব অক্ষ, মাঝের তিনটা প্রায়-(-Y) অক্ষের pitch; ঘোরানো-ঝোঁকানো-ঘোরানো এই বিন্যাসেই পাঁচটা DOF যথেষ্ট হয়ে ওঠে। robot_state_publisher এই axis মানটাকে আলাদা করে নয়, প্রতিটি joint angle update-এ rotation হিসেবেই ব্যবহার করে।"},{"a":346,"b":352,"text":"এবার limit-এ নতুনত্ব: lower -1.5708 কিন্তু upper <b>3.1416<\/b> — পূর্ণ pi radian অর্থাৎ 180 ডিগ্রি পর্যন্ত; limit-যুক্ত joint-দের মধ্যে একমাত্র এটিই 90 ডিগ্রির ঊর্ধ্বে যায় — বাকি arm joint-রা ±1.5708-এ বাঁধা; আর continuous joint-দের (wheel, mimic আঙুল) কোনো limit-ই নেই, তারা অবাধে ঘোরে। কারণ বোধগম্য: তালু roll করে বস্তু উল্টে দিতে বা হাত ঘুরিয়ে বড় পরিসরে কাজ করতে চাইলে অর্ধেক বৃত্তের সীমা খুব সংকীর্ণ। effort 100, velocity 1 আর damping 0.5 friction 0.5 — সেই প্রতিষ্ঠিত প্যাটার্ন। arm chain এখানে সম্পূর্ণ: base_link থেকে পাঁচ ধাপে ওঠা এই স্তম্ভের ডগায় এরপর লাগবে gripper (Part-6)।"}],"math":{"intro":"URDF-এর প্রতিটি joint নিছক একজোড়া সংখ্যা নয় — &lt;origin&gt;-এর xyz আর rpy মিলে একটা ত্রিমাত্রিক transform নির্দিষ্ট করে, যেটা robot_state_publisher প্রতিটি joint angle-এর জন্য হিসেব করে TF frame হিসেবে ছাপে। এই অংশে arm chain-এর বাস্তব মান ধরে ধাপে ধাপে দেখা হবে সেই হিসেবের স্তরগুলো — শুধু সরল স্থানান্তর থেকে শুরু করে পুরো chain-এর গুণফল পর্যন্ত।","levels":[{"label":"সবচেয়ে সহজ সম্পর্ক: শুধু স্থানান্তর","latex":"\\[ {}^{\\text{base}}p_{\\text{arm1}} = \\begin{bmatrix} 0.033617 \\\\ -1.24\\times 10^{-5} \\\\ 0.185 \\end{bmatrix}\\ \\text{m} \\]","text":"HOME-এ সব joint কোণ শূন্য হলে arm1 frame-এর কেন্দ্র base_link frame থেকে ঠিক এই xyz দূরত্বে বসে: 3.36 সেমি সামনে, নগণ্য 0.0124 মিলিমিটার ডানে, 18.5 সেমি ওপরে। rotation এই ধাপে হিসেবে ধরিনি — প্রথম স্তরে শুধু সরাসরি স্থানান্তর, আর সেটাই একটা frame-এর অবস্থানের প্রাথমিক ধারণা দেয়।"},{"label":"rpy থেকে rotation matrix","latex":"\\[ R(\\text{rpy}) = R_z(\\psi)\\,R_y(\\theta)\\,R_x(\\phi), \\qquad (\\phi,\\theta,\\psi) = (6.3751\\times 10^{-5},\\ 0,\\ 0.028395) \\]","text":"fixed-axis নিয়মে আগে x-অক্ষ ঘিরে roll, তারপর y-অক্ষ ঘিরে pitch, শেষে z-অক্ষ ঘিরে yaw — গুণফল এই ক্রমেই সাজাতে হয়। arm1_Joint-এর জন্য pitch শূন্য আর roll প্রায় শূন্য, তাই R প্রায় অভেদমাত্রা (identity), সঙ্গে মাত্র 0.0284 rad অর্থাৎ প্রায় 1.63 ডিগ্রি yaw-এর একটা হালকা ঘূর্ণন — CAD assembly-র ছোঁয়া।"},{"label":"পূর্ণ transform: ঘূর্ণন আর স্থানান্তর এক ম্যাট্রিক্সে","latex":"\\[ T^{\\text{base}}_{\\text{arm1}} = \\begin{bmatrix} R(\\text{rpy}) & t \\\\ 0\\ 0\\ 0 & 1 \\end{bmatrix}, \\qquad t = \\begin{bmatrix} 0.033617 \\\\ -1.24\\times 10^{-5} \\\\ 0.185 \\end{bmatrix} \\]","text":"URDF-এর origin আসলে এই 4x4 homogeneous matrix-এর সংক্ষিপ্ত রূপ: ওপরের 3x3 ব্লকটা rpy থেকে বানানো R, ডানের কলামটা translation t। robot_state_publisher ঠিক এই T গঠন করে TF-এ পাঠায়, আর child frame-এর যেকোনো বিন্দু p parent frame-এ পেতে হলে T আর p-এর গুণফল হিসেব করলেই চলে — একটা গুণেই ঘূর্ণন আর সরাসরি সরন দুটোই মিলে যায়।"},{"label":"axis আসলে কী: প্রায়-একক দিকভেক্টর","latex":"\\[ \\lVert a \\rVert = \\sqrt{0^2 + (-1)^2 + (-6.3725\\times 10^{-5})^2} \\approx 1.000000002 \\]","text":"arm2_Joint-এর axis হলো 0, -1, -6.37e-05 — একক ভেক্টর হওয়ার কথা, আর কার্যত তাই: দৈর্ঘ্য 1 থেকে মাত্র 2e-9 বেশি — একশো কোটি ভাগের দু-এক ভাগ। loader একে normalize করেই ব্যবহার করে, তাই গণিত অক্ষত থাকে। এই অতিক্ষুদ্র অবশিষ্টাংশ আসল CAD assembly-র সামান্য তির্যকতার স্বাক্ষর — ভুল নয়, আর শূন্য করে ফেললে TF সামান্য হলেও বাস্তবিকভাবে বদলে যায়।"},{"label":"পুরো chain: পাঁচটা transform-এর গুণফল","latex":"\\[ T^{\\text{base}}_{\\text{arm5}} = T_1(q_1)\\,T_2(q_2)\\,T_3(q_3)\\,T_4(q_4)\\,T_5(q_5), \\qquad z_{\\text{HOME}} = 0.185 + 0.033 + 0.08285 + 0.08285 + 0.074815 \\approx 0.4585\\ \\text{m} \\]","text":"প্রতিটি joint তার parent frame থেকে child frame-এর transform দেয়; সবগুলোর গুণফলে পুরো chain পাওয়া যায় — এটাই forward kinematics, যা করে robot_state_publisher। সব কোণ শূন্য অর্থাৎ HOME হলে z-উপাদানগুলো সোজা যোগ হয়: তালু base_link-এর উৎস থেকে প্রায় 45.9 সেমি ওপরে। rpy-গুলোর ক্ষুদ্র তির্যকতার জন্য এটা ধারণাগত মান, কিন্তু চোখের হিসেবে যথেষ্ট — আর এই উল্লম্ব উচ্চতাতেই camera সোজা ওপরে তাকিয়ে আকাশ দেখে।"}]},"robot":{"correct":"launch হলে এই পাঁচটা revolute joint-ই TF-তে প্রকাশ পাবে — base_link থেকে arm1, তারপর arm2 থেকে arm5 পর্যন্ত ধারা, প্রতিটি /joint_states update-এ নতুন transform সহ। RViz-এ দেখা যাবে রুপালি গোড়া, তিনটা প্রায়-সাদা টুকরো আর গাঢ় তালু; arm_gui বা display.launch.py-এর slider ঘোরালে ঠিক এই frame-গুলোই নড়বে। arm_cont (Part-9) এদের POSITION interface-এ কমান্ড করে, আর arm2=arm3=-0.70, arm4=-0.87 পাঠালে camera-র দৃষ্টি 40 ডিগ্রি নিচে নেমে মেঝে দেখে।","incorrect":"প্রলোভনীয় একটি ভুল: rpy আর axis-এর অতিক্ষুদ্র মানগুলোকে (6.3751e-05, -0.0284, -6.3725e-05) টাইপো ভেবে সব শূন্য করে ফেলা। loader চলবে, কোনো error আসবে না — কিন্তু arm2-এর ঘূর্ণন অক্ষ সামান্য এদিক-সেদিক হবে, জোড়া মেশের ফাঁক চোখে পড়বে, camera-র লক্ষ্য সরে যাবে। আরেকটি ভ্রান্তি: এই file নিজে কিছু হিসেব করে — না, হিসেব করে loader; URDF শুধু মান জমা রাখে।"},"animType":"tfChain"},{"n":6,"id":"part-06","fname":"neurobotics.urdf","enTitle":"Gripper — Six Joints, One Motor","lang":"xml","start":353,"end":752,"flags":[],"explain":[{"a":353,"b":368,"text":"<b>rlink1<\/b> হলো gripper-এর ডান আঙুলের ভিত্তি link। loader pipeline-এ robot_state_publisher এই link-কে একটি TF frame হিসেবে নথিভুক্ত করে, আর Gazebo-র physics engine inertial ব্লক থেকে mass আর inertia টেনে নেয়। mass মাত্র <code>0.00469661998528202<\/code> kg অর্থাৎ প্রায় 4.7 গ্রাম, principal inertia-গুলো <code>1.02155544192725E-07<\/code> ঘরের (cross-term আরও ক্ষুদ্র, E-14 পর্যন্ত) — সত্যিকারের ছোট অংশের CAD export। খেয়াল করুন <code>ixy<\/code> আর <code>iyz<\/code> শূন্য নয়: products of inertia বাদ দেওয়া হয়নি, inertial origin-এর সংখ্যাও 15 significant figure পর্যন্ত লেখা — SolidWorks যেমন দিয়েছে তেমনই রাখা। Part 8-এর wheel-এর মতো এখানে কোনো scaling NOTE নেই; এই joint-গুলো position command পায় (Part 9), velocity motor নয়।"},{"a":369,"b":392,"text":"visual অংশে mesh হিসেবে <code>package://neurobotics/meshes/rlink1.STL<\/code> — package:// URI-টা RViz আর Gazebo-র resource system নিজেই খুঁজে দেয়, তাই URDF-এ absolute path লাগে না। material-এর name অ্যাট্রিবিউট খালি স্ট্রিং, রঙ সরাসরি rgba ভ্যালুতে: 0.898, 0.918, 0.929 — প্রায়-সাদা টিন্ট, Part 5-এর arm2-4 link-গুলোর সঙ্গে হুবহু এক (arm1-এর silver আর arm5-এর গাঢ় রং কিন্তু আলাদা)। collision-এ একই STL আবার বসানো: চোখে যা দেখা যায় ঠিক তা-ই contact geometry, তাই আঙুল যেখানে ছুঁয়ে বলে মনে হয় ঠিক সেখানেই physics contact তৈরি হয়। origin সব <code>0 0 0<\/code> — mesh আর link frame একই বিন্দুতে বসেছে। Gazebo-র রঙ পরে Part 10-এর Gazebo/White এন্ট্রি ওভাররাইড করবে।"},{"a":393,"b":411,"text":"এটাই gripper-র আসল মোটর joint: <code>rlink1_Joint<\/code>। type revolute, parent arm5, child rlink1। origin-ের <code>rpy=\"1.5708 -0.60409 -1.5708\"<\/code> — দুই প্রান্তে 90 ডিগ্রি roll আর yaw, মাঝে -0.60409 rad; এই ঘূর্ণনেই jaw-এর swing তল ঠিক হয়। xyz-এর y ভ্যালু <code>-0.012625<\/code> negative, তাই এটি ডান পাশের আঙুল। axis <code>0 0 -1<\/code>, আর limit-এ <code>lower=\"-1.0\"<\/code> ও <code>upper=\"0\"<\/code> — মানে jaw শূন্য অবস্থা থেকে শুধু negative দিকে সর্বোচ্চ 1 rad অর্থাৎ প্রায় 57.3 ডিগ্রি ঘুরতে পারে; gripper বন্ধ মানেই ঋণাত্মক কমান্ড। effort 100, velocity 1 — arm joint-গুলোর (Part 5) একই envelope। dynamics-এ damping 0.5 friction 0.5 রয়ে গেছে, Part 8-এর wheel-এর মতো বাদ দেওয়া হয়নি।"},{"a":412,"b":451,"text":"<b>rlink2<\/b> হলো ডান আঙুলের ডিস্টাল অংশ বা আঙুলের ডগা। mass <code>0.0061448729710299<\/code> kg — খেয়াল করুন বাঁ আঙুলের llink2-এর mass হুবহু একই সংখ্যা, আর izz-ও দুই পাশে <code>1.57601572788395E-06<\/code>: এটি হাতে লেখা কপি নয়, CAD-এ আয়না-জোড়া হিসেবে export হয়েছে বলেই এত খাতা-খাতি মিল। principal inertia মান E-08 থেকে E-06 ঘরে (cross-term নেমে E-21 পর্যন্ত), inertial origin-এর z প্রায় -0.005 — ভরকেন্দ্র link frame থেকে সামান্য নিচে। visual আর collision-এ নিজস্ব <code>rlink2.STL<\/code> mesh, রঙ বাকি সব gripper link-এর মতোই সেই একই প্রায়-সাদা rgba। এই link rlink1-এর উপর ঝুলে থাকে, তাই kinematic ট্রিতে arm5, rlink1, rlink2 মিলে একটি শাখা গড়ে।"},{"a":452,"b":469,"text":"rlink2_Joint-এর type <code>continuous<\/code> — কোনো limit এলিমেন্টই নেই, ঘূর্ণনের আনুষ্ঠানিক সীমা অসীম। কিন্তু আসল কথা mimic ট্যাগে: <code>joint=\"rlink1_Joint\"<\/code>, <code>multiplier=\"1\"<\/code>, <code>offset=\"0\"<\/code> — অর্থাৎ আদর্শ সম্পর্ক q(rlink2) = 1 x q(rlink1) + 0 — আসল হাতে ডগা মাস্টারের সাথেই ভাঁজ হত। কিন্তু এই sim-এ নিয়মটা আপনা-আপনি মানা হয় না: Humble-এর gazebo_ros2_control mimic follow করে না, তাই Part 9-এর block এই joint-কেও নিজস্ব position interface দেয়। origin-এর <code>rpy=\"0 0 0.9667\"<\/code> yaw-টা আগে থেকেই আঙুলের ডগাকে প্রায় 55 ডিগ্রি কোণে বসিয়ে রাখে, xyz-এর x ভ্যালু <code>0.03<\/code> মানে ভিত্তি থেকে 3 সেমি এগিয়ে। arm_gui-র OPEN/CLOSE বাটন (Part 2) তাই একটি সংখ্যা নয় — পুরো ১১-মানের তালিকা পাঠায়, যার gripper অংশ এই multiplier-চিহ্নগুলোই মেনে সাজানো।"},{"a":470,"b":509,"text":"<b>llink1<\/b> বাঁ আঙুলের ভিত্তি। mass <code>0.00426700564861881<\/code> kg — ডান পাশের rlink1-এর 0.0046966-এর খুব কাছে, কিন্তু হুবহু সমান নয়; inertial origin-ও x-এ 0.00885 বনাম 0.00809, আর y-এর চিহ্ন উল্টো। এই ক্ষুদ্র অসমতাই প্রমাণ করে ফাইলটা সত্যিকারের CAD assembly থেকে export হয়েছে — আয়না-জোড়ায় মান প্রায় মেলে, পুরোপুরি নয়। বাকি গঠন একই ছাঁচ: inertial + visual (<code>llink1.STL<\/code>) + collision, একই প্রায়-সাদা rgba, origin সব 0 0 0। loader-এর দৃষ্টিতে এটি আরেকটি নথিভুক্ত TF frame, আর Gazebo-র dynamics-এ আরেকটি বডি — ভর সামান্য হলেও আঙুলের জড়তার হিসাবে ঢুকে যায়।"},{"a":510,"b":527,"text":"llink1_Joint হলো rlink1_Joint-এর আয়না যমজ — পাশাপাশি রেখে তুলনা করুন। origin-ের y এখন <code>0.012375<\/code>, positive (rlink1-এ ছিল -0.012625): বাঁ পাশ। rpy <code>-1.5708 -0.60318 1.5708<\/code> — roll আর yaw-এর চিহ্ন ডান সংস্করণের ঠিক উল্টো। axis <code>0 0 1<\/code>, যেখানে মাস্টারে 0 0 -1। আর সবচেয়ে সূক্ষ্ম ব্যাপার: mimic-এ <code>multiplier=\"1\"<\/code> — একই চিহ্ন, অথচ আঙুল দুটো মুখোমুখি বন্ধ হয়! কারণ জ্যামিতিক: frame আয়নায় উল্টেছে, axis-ও উল্টেছে, তাই একই কমান্ড মান দুই পাশে বিপরীত দিকের ঘূর্ণনে পরিণত হয় এবং দুই jaw একে অপরের দিকে সুষমভাবে এগোয়। সমতা আসে multiplier-এর চিহ্ন থেকে নয়, frame-এর নির্মাণ থেকে।"},{"a":528,"b":567,"text":"<b>llink2<\/b> বাঁ আঙুলের ডগা। mass <code>0.0061448729710299<\/code> kg — rlink2-এর সঙ্গে অঙ্কে অঙ্কে এক, izz-ও <code>1.57601572788395E-06<\/code> একই; কিন্তু ixy-এর চিহ্ন উল্টো — এখানে <code>2.27196496174757E-07<\/code>, rlink2-এ ঋণাত্মক। inertia tensor-এ আসলে এই চিহ্ন-উল্টানোই আয়না: একই ভর, izz-ও একই, ixx/iyy শতকরা-ভগ্নাংশে কাছাকাছি — আর cross-term গুলো প্রতিফলিত। visual আর collision-ে <code>llink2.STL<\/code>, রঙ সেই একই সাদাটে। এই জোড়া-মিল শুধু দেখতে সুন্দর নয় — দুই আঙুলের dynamics প্রায় অভিন্ন থাকে বলে সমান-বিপরীত কমান্ডে দুই পাশ সমান বেগে চালু হয়, আর ধরা বস্তুর উপর দুই পাশের আচরণ সমান থাকে।"},{"a":568,"b":585,"text":"llink2_Joint আবার continuous, আবার mimic — কিন্তু এবার <code>multiplier=\"-1\"<\/code>: q(llink2) = -1 x q(rlink1)। কেন এখানে চিহ্ন উল্টো, অথচ rlink2_Joint-এ ছিল +1? কারণ এই joint-এর origin-ও আয়না: <code>rpy=\"0 0 -0.96762\"<\/code> yaw, যেখানে ডান পাশে 0.9667। চিহ্ন-উল্টানো multiplier আর চিহ্ন-উল্টানো frame মিলে ডগার ঘূর্ণনকে ঠিক সেই দিকেই ঠেলে দেয় যে দিকে ডান আঙুলের ডগা ঘুরছিল। xyz <code>0.03 0 0.00125<\/code>। এভাবেই পাঁচটি mimic joint-এ মাত্র দুটি উপাদান — চিহ্ন আর offset 0 — আসল হাতের gripper-র গতিবিদ্যা বাঁধে। এই sim-এ প্রত্যেক joint-এর নিজস্ব position interface খোলাই থাকে — sender সেখানে ঠিক এই চিহ্নগুলো মেনে মান পাঠায়।"},{"a":586,"b":625,"text":"<b>rlink3<\/b> সবচেয়ে হালকা শ্রেণির link (llink3-এর সঙ্গে হুবহু টাই): mass <code>0.00270971831665017<\/code> kg মানে 2.7 গ্রামেরও কম, principal inertia নেমে আসে <code>9.18474957109399E-09<\/code> পর্যন্ত (cross-term E-20 ঘরেও আছে)। এটি কোনো আঙুলের উপরে নয়, সোজা arm5 থেকে ঝোলানো — parent-ই arm5। ছোট্ট এই link আঙুলের linkage-এর coupler ভূমিকায়: আসল হাতে jaw-এর সাথে যুক্ত কড়া হিসেবে এটিও ঘোরে; এই sim-এ এর joint-ও নিজস্ব position কমান্ড পায়, তাই ঘোরা মানে sender-এর পাঠানো নিজস্ব কোণ। বাকি গঠন পুরোনো ছাঁচেই — inertial, visual (<code>rlink3.STL<\/code>), collision, প্রায়-সাদা rgba। এটি fixed joint-এর সন্তান নয় — নিজস্ব joint-ওয়ালা স্বতন্ত্র বডি, তাই Gazebo-তে এর ক্ষুদ্র ভরও dynamics-এর হিসাবে ঢুকে থাকে।"},{"a":626,"b":643,"text":"rlink3_Joint-এর আসল গল্প তার mimic ট্যাগে: <code>joint=\"rlink1_Joint\"<\/code>, <code>multiplier=\"-1\"<\/code>, <code>offset=\"0\"<\/code> — এই coupler মাস্টারের উল্টো দিকে ঘোরে। origin <code>xyz=\"-0.0045001 -0.0044999 0.047275\"<\/code>: arm5-এর গ্রিপার প্লেট থেকে z-এ প্রায় 47.3 mm ওপরে, y-এ সামান্য negative অর্থাৎ ডান পাশে। rpy <code>1.5708 -0.61261 -1.5708<\/code> — rlink1_Joint-এর মাঝের মান ছিল -0.60409, এখানে -0.61261: কয়েক milliradian-এর এই তফাতই CAD export-এর চিহ্ন, হাতে-গড়া গোল সংখ্যা নয়। type continuous বলে limit নেই; dynamics-এ damping 0.5 friction 0.5 বাকি সবার মতোই দাঁড়িয়ে।"},{"a":644,"b":683,"text":"<b>llink3<\/b> হলো rlink3-এর বাঁ-পাশের যমজ। mass হুবহু <code>0.00270971831665017<\/code> kg, উপরের তালিকার সঙ্গে মিলিয়ে দেখুন izz পর্যন্ত 14 ঘর মিলে যায়: rlink3-এ <code>1.63254833713142E-07<\/code>, এখানে <code>1.63254833713141E-07<\/code> — শেষ অঙ্কে ঠিক এক কম! এই এক-ঘরের তফাতই প্রমাণ, মানগুলো কপি-পেস্ট নয়; দুই দিকের mesh আলাদাভাবে export হয়েছে আর floating-point হিসাবের গভীরে তফাতটা জন্মেছে। বাকি সব একই ছাঁচ: <code>llink3.STL<\/code> mesh, প্রায়-সাদা রঙ, collision-এ একই mesh, origin সব 0 0 0। loader-এর কাছে এটি আরেকটি নথিভুক্ত link, RViz-এর TF ট্রিতে arm5-এর সন্তান হিসেবে দেখা যাবে।"},{"a":684,"b":701,"text":"llink3_Joint দিয়ে হিসাব পূর্ণ হয়: এবার mimic-এ <code>multiplier=\"1\"<\/code> — বাঁ coupler মাস্টারের একই দিকে ঘোরে (ডান coupler ছিল -1)। origin <code>xyz=\"-0.0044999 0.0045001 0.047275\"<\/code> — y এখন positive, মিরর-করা বাঁ পাশ; rpy <code>-1.5708 -0.61516 1.5708<\/code>, আবারও roll আর yaw-এর চিহ্ন-উল্টো আয়না। এখন পুরো ছবিটা গুনে দেখুন: ছয়টি joint-এর পাঁচটির প্রত্যেক mimic ট্যাগে একটিই মাস্টারকে দেখায় — rlink1_Joint; multiplier-গুলো rlink2, llink1, llink2, rlink3, llink3 ক্রমে 1, 1, -1, -1, 1। Part 9-এর ros2_control ব্লক এই নামগুলোর প্রত্যেকটিকে নিজস্ব position interface-এ যুক্ত করে (mimic-রাও সহ) — কোণ তাই মাস্টার থেকে নয়, sender-এর তালিকা থেকে নির্ধারিত; mimic ট্যাগ রইল সেই তালিকা বানানোর রেসিপি।"},{"a":702,"b":741,"text":"লিস্টের শেষ link-টির নাম <code>Gripping<\/code> — নামটাই বলে দিচ্ছে এর কাজ: এটি robot-এর tool tip। grasp প্ল্যান করা, reach মাপা, বা RViz-এ টুল কোথায় দাঁড়িয়ে তা দেখা — সবখানে এই frame-টিই রেফারেন্স। mass <code>0.0122493178431464<\/code> kg, gripper-র সব টুকরার মধ্যে সবচেয়ে ভারী; inertial origin-ের x প্রায় -0.0652 মানে ভরকেন্দ্র frame থেকে 6.5 সেমি পেছনে — STL-এর জ্যামিতি দীর্ঘ দিকে প্রসারিত। principal inertia মান E-06 ঘরে (ixy কিন্তু 2.46E-08)। visual আর collision-ে <code>Gripping.STL<\/code>, রঙ সেই একই সাদাটে। এর নিজের কোনো চালক নেই (joint-টাই fixed) — তবু নিছক চিহ্ন নয়: gripper-র সবচেয়ে ভারী এই বডির 0.0122 kg ভর আর collision dynamics-এ পুরোদস্তুর থাকে।"},{"a":742,"b":752,"text":"Gripping_Joint দিয়ে টুল-টিপ বসানো হয়। type <code>fixed<\/code> — কোনো axis, limit বা dynamics নেই, কারণ ঘোরার মতো কিছুই নেই। origin <code>xyz=\"-0.00062499 0.00023987 0.093235\"<\/code> মানে arm5-এর শেষ প্রান্ত থেকে z-এ প্রায় 9.3 সেমি ওপরে; rpy <code>-0.041648 -1.5708 0.041619<\/code> — মাঝের -1.5708 pitch frame-টিকে 90 ডিগ্রি উল্টে দেয় যাতে এর অক্ষ গ্রিপারের টুল-দিক বরাবর শুয়ে থাকে, চারপাশের সামান্য মানগুলো আবার CAD-এর সতীর্থ। লোড হলে robot_state_publisher এখানে একটি স্থির TF প্রকাশ করে, আর Gazebo Classic fixed joint-কে weld করে arm5-এ মিশিয়ে দেয় — 0.0122 kg ভর dynamics-এ থেকে যায়, স্বাধীনতা যায় না। এই weld আচরণই পরে Part 10-এর camera আলোচনার মূল সূত্র হয়ে দাঁড়ায়।"}],"math":null,"robot":{"correct":"লোড হলে robot_state_publisher এই অংশ থেকে সাতটি নতুন TF frame প্রকাশ করে — rlink1, rlink2, llink1, llink2, rlink3, llink3, Gripping — সবার উর্ধ্বতন arm5। /arm_cont/commands তালিকায় ১১টা position যায় — পাঁচটা arm joint ছাড়া বাকি ছয়টা এই gripper joint, প্রত্যেকে নিজের মান (sim-এ mimic আপনা-আপনি চলে না; arm_gui এই multiplier-চিহ্নেই তালিকা সাজায়)। -1.0 থেকে 0-এর ভেতরে বন্ধ-কমান্ডে দুই আঙুল মুখোমুখি সুষমভাবে বন্ধ হয়, Gripping টিপ ঠিক জায়গায় দাঁড়ায়।","incorrect":"বিপদী ভুল: mimic ট্যাগ দেখে ভাবা sim নিজেই সম্পর্ক মানবে — এই পরিবেশে মানে না; sender-এর ১১-মান তালিকাই একমাত্র সমলয়-রশি, ভুল চিহ্নে সাজালে দুই আঙুলে পরস্পরবিরোধী কোণ সত্যিই হয়। আর এক-মোটর ধারণায় শুধু মাস্টারকে কমান্ড দিলে বাকি পাঁচ joint জমে থাকে। আর মাস্টারের limit -1.0..0 উপেক্ষা করে ধনাত্মক কমান্ড পাঠালে axis 0 0 -1 হওয়ায় jaw ভুল দিকে ঘুরে গিয়ে মনে হবে gripper নষ্ট।"},"animType":"gripperMimic"},{"n":7,"id":"part-07","fname":"neurobotics.urdf","enTitle":"Fixed Frames — Camera, IMU, Lidar Mounts","lang":"xml","start":753,"end":964,"flags":[],"explain":[{"a":753,"b":768,"text":"DCW2 link-টি হলো robot-এর একমাত্র camera-র আবাস: arm4 wrist-এর পাশে বসানো এই dark হাউজিংয়ের ভেতরেই Gazebo camera sensor ঢুকবে, যদিও সেই sensor block ফাইলের একেবারে নিচে (Part 10)। inertial অংশে SolidWorks export-এর পূর্ণ নির্ভুলতা আছে: mass <code>0.0499<\/code> kg, center of mass প্রায় জ্যামিতিক কেন্দ্রে (xyz-এর তিন মানই 1e-3 ঘরে: -1.09e-3, -1.21e-3, -1.57e-3), off-diagonal টার্ম ixy/ixz/iyz অশূন্য কিন্তু 1e-7 থেকে 1e-8 মাত্রার তুচ্ছ। loader pipeline-এর চোখে robot_state_publisher এই link-কে TF tree-তে frame হিসেবে নথিভুক্ত করবে, কিন্তু joint যেহেতু fixed, Gazebo Classic একে parent-এ weld করে আলাদা body হিসেবে মুছে ফেলবে, ফলে এই inertia arm4-এর composite body-তে গুটিয়ে যায়। এই weld আচরণই পরে camera sensor-এর অবস্থান নিয়ে এই app-এর সবচেয়ে বড় gotcha-টি জন্ম দেয়।"},{"a":769,"b":792,"text":"visual আর collision দুটিতেই একই mesh: <code>package://neurobotics/meshes/DCW2.STL<\/code>, অর্থাৎ চোখে যা দেখা যায় তার সাথেই বাস্তব ধাক্কাও। mesh path package:// scheme-এ, যা launch file-এর xacro ধাপে <code>$(find neurobotics)<\/code> resolve করে package-এর share directory-তে পৌঁছে দেয় (Part 12, 13)। color rgba <code>0.204<\/code> প্রায়-কালো ধূসর, arm5 আর arm_base-এর মতো একই পরিবার। নজর দিন material-এর <code>name<\/code> attribute খালি স্ট্রিং, তাই RViz এই inline color-ই ব্যবহার করে; Gazebo-তে চূড়ান্ত রঙ আসবে ফাইলের শেষের Gazebo material তালিকা থেকে, যেখানে DCW2 দুইবার লেখা ছিল আর পরের entry (DarkGrey) জিতেছে (Part 10)। collision mesh ছোট হলেও gripper-এর সাথে camera হাউজিংয়ের ঠেলাঠেলি এই geometry-তেই ধরা পড়ে।"},{"a":793,"b":803,"text":"DCW2_Joint type <code>fixed<\/code>, parent <code>arm4<\/code>, child <code>DCW2<\/code>। origin-এর তিন rpy মান <code>1.8429 -1.5708 -1.8145<\/code> প্রথম নজরে এলোমেলো লাগলেও এগুলো CAD assembly থেকে আসা সৎ মান, যাদের কাজ হাউজিংটিকে এমনভাবে ঘুরিয়ে বসানো যেন এর দৃষ্টি-অক্ষ arm-এর tool অক্ষের সাথে parallel থাকে। এই joint-এর ফলে TF tree-তে DCW2 frame-টি arm4-এর একটি static transform হয়ে যায়: arm যতবারই ঘুরুক, camera housing সেই একই orientation-এ wrist-এর সাথে চলে আসে, আর robot_state_publisher এটিকে স্থির transform হিসেবে publish করে। কিন্তু Gazebo Classic-এর নিয়ম কঠোর: fixed child link-কে parent body-তে weld করে আলাদা entity হিসেবে বাদ দেয়। ঠিক এই কারণেই নিচের NOTE ইঙ্গিত করে যে camera sensor block ফাইলের নিচে অন্য জায়গায় বসেছে।"},{"a":807,"b":822,"text":"তিনটি sensor মাউন্ট frame-এর প্রথমটি <code>imu_frame<\/code>, chassis-এর ভেতরের inertial measurement unit-এর ঠিকানা। mass <code>0.0973<\/code> kg, আর inertia-র কার্যকর সংখ্যাগুলো ixx <code>4.45e-5<\/code>, iyy <code>4.45e-5<\/code>, izz <code>7.46e-5<\/code>; এই একই সেট কালে laser0 আর laser1 frame-এও হুবহু ফিরবে, কারণ তিনটিই একই আদলের 1 cm ঘন ছোট sensor body-র প্রতিনিধি। এই পুনরাবৃত্তি শুধু সুবিধে নয়, এটি পরের Part-এর পুরো x50 গল্পের ভিত্তি-সংখ্যাও: wheel block-গুলোর ixx <code>2.226e-3<\/code> আসলে এই <code>4.4525e-5<\/code>-এর ঠিক 50 গুণ (Part 8)। inertial origin-এর z <code>0.080<\/code> মানে link frame থেকে center of mass 8 cm উপরে ধরা। IMU sensor নিজে base_link-এ বসে (Part 10), এই frame মূলত TF-এ তার স্থির ঠিকানা।"},{"a":823,"b":844,"text":"এখানে mesh নেই; visual ও collision দুটোতেই primitive geometry হিসেবে 1 cm ঘন <code>box size 0.01 0.01 0.01<\/code> ব্যবহৃত হয়েছে, কারণ sensor মাউন্টের বাইরের চেহারার কোনো ভৌত গুরুত্ব নেই। material নাম পেয়েছে <code>imu_mat<\/code>, রঙ গাঢ় ধূসর rgba <code>0.298<\/code>, ফলে RViz-এ TF দেখার সময় ছোট্ট একটি কিউব চোখে পড়ে। collision-ও একই ঘন box, তাই chassis-এ ঢাকা এই body আলাদা কোনো সংঘর্ষ পরীক্ষায় সচরাচর আসে না। ছাঁচটি মনে রাখুন, কারণ এরপর একই গঠন আরও দুইবার ফিরবে: প্রতিটি sensor মাউন্টে inertial (mass ও inertia ছাড়া Gazebo body অসম্পূর্ণ), একটি সরল visual, একই collision, আর শেষে fixed joint যা ওকে মূল গাছে যুক্ত করে।"},{"a":845,"b":855,"text":"imu_frame_Joint fixed, origin <code>0.06 0 0.080<\/code> আর rpy পুরোটাই শূন্য: base_link frame থেকে 6 cm সামনে (positive x), center-line-এ (y শূন্য), মেঝে থেকে 8 cm উপরে এক আদর্শ আসন। rotation নেই, কারণ IMU-র yaw পাঠ সরাসরি base-এর heading-এর সাথে মেলাতে হয়। robot_state_publisher এই static transform-টি TF-এ <code>imu_frame<\/code> নামে পাঠায়। এই sensor-এর অস্তিত্বের কারণটাই এখানে শেখার মতো: differential drive-এর wheel odometry tyre scrub দেখতে পায় না, দুই পাশের চাকা সমান গড়লেও skid-steer তখনো ঘুরতে পারে, ফলে জমে থাকা heading ভুলে গিয়ে odometry-কে বিশ্বাসই করা যায় না; IMU সেই ঘূর্ণন স্বাধীনভাবে মাপে। তাই calib_angular /imu পড়ে (Part 2) আর obstacle_avoid heading latch করে তাতেই (Part 3 fix-log)।"},{"a":856,"b":871,"text":"laser0_frame হলো lidar-এর প্রথম মাউন্ট পয়েন্ট, chassis-এর rear-left কোণে। এখানে একটি কৌতূহলোদ্দীপক প্যাটার্ন: inertial origin-এর xyz <code>-0.11617 0.09156 0.1253<\/code> হুবহু পরের joint-এর origin-এর সমান, ঠিক যেমন একই জিনিস laser1-এও ঘটবে। ব্যাখ্যা: CAD export-এ link-এর নিজের frame মূল robot frame থেকে যেখানে ছিল সেই অফসেট inertial-এ ঢুকে গেছে, তারপর fixed joint একই সরণ আবার প্রয়োগ করে ওকে জায়গায় বসায়, ফলে সংখ্যা দুই জায়গায় মিলে যায়। mass <code>0.0973<\/code> kg আর inertia imu_frame-এর মতোই। নাম সত্ত্বেও এই frame-এ কোনো ray sensor নেই: পিছন থেকে 360 deg sweep নিজের arm-কেই আচ্ছান্ন করত, তাই সক্রিয় লিডার সামনের laser1_frame-এ (Part 10), এটি মডেলে শুধু অবশিষ্ট মাউন্ট।"},{"a":872,"b":893,"text":"visual ও collision imu_frame-এর মতোই 1 cm ঘন box, material নাম <code>laser0_mat<\/code>, রঙ একই গাঢ় ধূসর। ছোট্ট ঘনকটিই RViz-এ laser0 মাউন্টের চিহ্ন। geometry সরল রাখার সুবিধা দ্বিগুণ: mesh লোড করতে হয় না বলে হালকা, আর physics-এর collision হিসাব সস্তা, কারণ স্ক্যান করে ray sensor plugin, এই body নয়। এই frame-টি আসলে জীবন্ত ইতিহাস: fix-log বলে (Part 3) লিডার আগে ভুল ব্যাখ্যায় পড়ত, scan array-র ধারের নমুনাগুলো আসলে পিছনের দিকের beam ছিল, আর rear মাউন্ট থেকে 360 deg sweep নিজের arm-কেই বারবার বাধা হিসেবে ধরত। সমাধানে sensor সরানো হলো laser1_frame-এ, কিন্তু laser0 frame গাছে রয়ে গেল, আর Gazebo fixed-weld একে base_link-এ গুটিয়ে নেয়।"},{"a":894,"b":904,"text":"laser_frame_Joint (নামে laser0_frame_Joint নয়, ছোট্ট অমিল) fixed type, origin <code>-0.11617 0.09156 0.1253<\/code>, rpy শূন্য। চিহ্নগুলো পড়লেই অবস্থান স্পষ্ট: x ঋণাত্মক মানে base_link-এর পিছনে, y ধনাত্মক মানে বামে, z <code>0.1253<\/code> মানে মেঝে থেকে প্রায় 12.5 cm উপরে, অর্থাৎ rear-left কোণ। robot_state_publisher এটিকে TF-এ publish করে, কিন্তু এই কোণ থেকে 360 deg ray sweep চালালে বিমগুলো প্রথমেই নিজের chassis আর ঘাড় বাঁকানো arm-এ ঢাকা পড়ত, obstacle detection নিজের দেহকেই বাধা ভেবে আটকে যেত। ফাইলের নিচের sensors comment ঠিক এটাই ব্যাখ্যা করে বলে সক্রিয় lidar সামনের frame-এ (Part 10)। এখন এই joint-এর ভূমিকা কেবল গাছে একটি নিবিড় static frame রাখা।"},{"a":905,"b":920,"text":"laser1_frame-ই আসল সক্রিয় lidar মাউন্ট, chassis-এর front-right কোণে। inertial origin <code>0.10766 -0.09078 0.1253<\/code> আবারও নিচের joint origin-এর হুবহু অনুলিপি — laser0-তে দেখা একই CAD-export প্যাটার্ন; imu_frame-এ কিন্তু inertial আর joint origin আলাদা ছিল, ওটাই ব্যতিক্রম। mass <code>0.0973<\/code> kg, inertia-র মানও এক, কারণ তিনটি মাউন্টই একই আদলের sensor body ধরে নিয়েছে। এই link-টিই একমাত্র laser frame যার জন্য ফাইলের একেবারে নিচে সত্যিকারের ray sensor block বসেছে: 360 sample, -pi থেকে +pi, range 0.2 থেকে 8.0 m, update 10 Hz (Part 10)। সামনে-ডানে বসানোর কৌশল সরল: সামনের দিকের বিমগুলো শরীর ছেড়ে বেরোয় সাথে সাথেই, আর পিছন-বামের যে কয়েকটা beam এখনো chassis ছোঁয়, obstacle_avoid.py সেগুলোকে filter করে ফেলে (Part 2)।"},{"a":921,"b":942,"text":"visual ও collision আগের দুই frame-এর চেনা ছাঁচ: 1 cm ঘন box, material <code>laser1_mat<\/code>, একই গাঢ় ধূসর rgba <code>0.298<\/code>। এই সরলতার পেছনে হিসাব আছে: mesh বাদ দিলে Gazebo-র collision checking আর RViz rendering দুই-ই হালকা হয়, আর 360 deg ray sensor-এর নিজের মাউন্ট box range-এর ভেতরে পড়লেও plugin নিজের body-কে স্ক্যানে মেনে নেয়। বড় পাঠটি কাঠামোগত: URDF-এর প্রতিটি link তিন স্তরে ভাবা যায়, inertial অর্থাৎ physics-এর ওজন-জড়তা, visual অর্থাৎ চোখে যা দেখায়, আর collision অর্থাৎ যাতে ধাক্কা লাগে; sensor মাউন্টের মতো সরু ক্ষেত্রে তিনটিই এক ঘন box-এ মিটে যায়। এরপরের fixed joint-টি frame-কে গাছে জুড়বে, আর নিচের NOTE দুটি এই অংশের নীরব সিদ্ধান্তের মর্মকথা বলবে।"},{"a":943,"b":953,"text":"laser1_frame_Joint fixed, origin <code>0.10766 -0.09078 0.1253<\/code>, rpy শূন্য: front-right কোণ, x ধনাত্মক মানে প্রায় 10.8 cm সামনে, y ঋণাত্মক মানে প্রায় 9.1 cm ডানে, z <code>0.1253<\/code> উচ্চতায়। TF-তে <code>laser1_frame<\/code> নামটি base_link-এর এক static সন্তান, আর /scan message-এর header-এ এই নামই frame_id হিসেবে বসে কারণ sensor plugin-এর frame_name এখানেই নির্দেশ করে (Part 10)। RViz-এ LaserScan দেখানোর সময় ঠিক এই transform দিয়েই প্রতিটি বিম পয়েন্ট robot-এর বর্তমান pose-এ স্থানান্তরিত হয়, তাই মাউন্ট কোণ ভুল হলে পুরো রাডার ছবি ঘুরে যায়। মাউন্ট নির্বাচনের প্রকৌশল-যুক্তি আগের block-এ: সামনে থেকে বিম বেরোয় পরিষ্কার, বাকিগুলো সফ্টওয়্যারে ছাঁকা।"},{"a":954,"b":957,"text":"এই NOTE comment পুরো মডেলের এক বড় সিদ্ধান্তের সারমর্ম: robot-এর একমাত্র camera হলো arm4-এর কাছে wrist-এ বসানো DCW2 হাউজিং, আর পুরনো chassis-সামনের Camera link বাদ দেওয়া হয়েছে বাস্তব robot-এর সাথে মিল রাখতে। loader এই comment-কে উপেক্ষা করে, আর launch file-এর load_urdf runtime string থেকে সব comment মুছেও দেয় (Part 12, 13), তাই এটি একেবারে মানুষের জন্য ডকুমেন্টেশন। fix-log বলে প্রথমে দুটো camera ছিল, পরে বোঝা গেল বাস্তব M3Pro-তে arm camera ছাড়া আর কিছুই নেই (Part 3)। শেষ বাক্যটি একটি সূচক-আঙুল: Gazebo camera sensor DCW2-র জায়গা ঘিরেই, কিন্তু block-টি ফাইলের একেবারে নিচে, কারণ sensor-কে বসতে হয় সত্যিকারের joint-এর পিছনের link-এ (Part 10-এ সেই গল্প)।"},{"a":958,"b":964,"text":"দ্বিতীয় NOTE-টি Part 8-এর পুরো physics আলোচনার প্রবেশদ্বার, তাই যুক্তিটা এখানেই দাঁড় করানো যাক। SolidWorks export করা wheel inertia (প্রায় <code>4.5e-5<\/code> kg m^2) ভৌতভাবে সৎ, কিন্তু Gazebo Classic-এর ODE engine 1 ms timestep-এ চলে, আর 2 N m velocity motor এত ছোট inertia-তে প্রায় <code>26,000<\/code> rad/s^2 ত্বরণ জন্ম দেয়। ফলে প্রতি step-এ bang-bang motor লক্ষ্য ছাড়িয়ে যায়, চাকা oscillate করে বা এমনিই দৌড়ায়, আর পরীক্ষায় শূন্য command-এও <code>+52<\/code> rad/s overshoot মাপা পড়ে। সমাধান ঘোষিত: চার wheel-এর inertia x50 বাড়ানো, ছোট sim robot-এ প্রচলিত অভ্যাস, mass অপরিবর্তিত। মনে রাখুন URDF নিজে কিছু গণনা করে না, এটি loader-দের পড়া এক specification; বাড়তি মানগুলোর হিসাব আর স্থিরতার গণিত Part 8-এর math অংশে।"}],"math":null,"robot":{"correct":"gazebo.launch.py চালালে xacro এই অংশ পড়ে DCW2, imu_frame, laser0_frame, laser1_frame চারটি fixed frame গাছে যোগ করে; robot_state_publisher TF-এ প্রতিটিকে arm4 বা base_link-এর static সন্তান হিসেবে publish করে, তাই RViz-এ /scan আর /imu দেখার সময় frame_name নির্বিঘ্নে resolve হয়। Gazebo Classic অন্যদিকে fixed joint-গুলোকে parent-এ weld করে আলাদা body মুছে দেয়, ফলে chassis-এর physics চারটি ছোট mass শোষণ করে নেয় আর sensor-রা টিকে থাকে শুধু সত্যিকারের joint-এর পিছনের link-এ।","incorrect":"প্রচলিত এক ভুল: camera sensor-টি DCW2 link-এ বসানো, তখন Gazebo fixed joint weld করে DCW2-কে arm4-এ গুটিয়ে ফেলে আর sensor-এর ভেতরের pose element নিঃশব্দে ফেলে দেয়, camera যেন গায়েব; লিডারের 6 cm z-offset ঠিক এভাবেই হারিয়েছিল। আরেকটি ভ্রান্তি: এই ছোট frame-গুলোর দীর্ঘ-দশমিকের mass/inertia কারো হাতে-লেখা মনে করা — আসলে এগুলো SolidWorks export-এর হুবহু সংখ্যা; export যা দিয়েছে তাই অক্ষুণ্ণ রাখা হয়েছে।"},"animType":null},{"n":8,"id":"part-08","fname":"neurobotics.urdf","enTitle":"Four Wheels & Physics Stability","lang":"xml","start":965,"end":1192,"flags":[],"explain":[{"a":965,"b":980,"text":"চার wheel block-এর প্রথমটি <code>lwheel1<\/code>, বাম সামনের চাকা। inertial-এর সব সংখ্যাই এখন আগের NOTE-এর x50 গল্পের প্রমাণ: imu/laser মাউন্টে ixx ছিল <code>4.4525e-5<\/code>, এখানে <code>2.226e-3<\/code>, হুবহু 50 গুণ; izz ছিল <code>7.4596e-5<\/code>, এখানে <code>3.7298e-3<\/code>, আবারও 50 গুণ। mass অক্ষুণ্ণ <code>0.0973<\/code> kg, কারণ NOTE স্পষ্ট বলেছে স্কেলিং শুধু inertia-তে। inertial origin-এর z <code>0.01085<\/code> CAD-জাত মান — wheel frame-এ z মানে axle-দিক, তাই ভর-কেন্দ্র চাকার কেন্দ্র থেকে axle বরাবর সামান্য বাইরে (tire-র দিকে) সরা, আর off-diagonal ixy/ixz/iyz 1e-9 থেকে 1e-10 মাত্রার, কার্যত শূন্য। loader দৃষ্টিতে robot_state_publisher এই link-এর নাম TF-এ তোলবে, Gazebo এই inertia-ই ODE body-তে বসাবে, আর ros2_control block (Part 9) এই চাকার velocity interface-এর সাথে ওকে জুড়বে।"},{"a":981,"b":1001,"text":"visual এখানে mesh (<code>package://neurobotics/meshes/lwheel1.STL<\/code>), কিন্তু collision ইচ্ছাকৃতভাবে mesh নয়, একটি primitive <code>cylinder<\/code>: radius <code>0.04<\/code> m, length <code>0.022<\/code> m, আর চাকার কেন্দ্র থেকে z <code>0.0108<\/code> অফসেটে। এই দ্বৈততার কারণ বাস্তব: টায়ারের মেশ হাজারো ত্রিভুজ নিয়ে physics ইঞ্জিনকে ধীর করে তুলত, আর ground contact-এর জন্য মসৃণ cylinder-ই যথেষ্ট নির্ভুল। radius 0.04-ই পরে controller-এর wheel_radius parameterে যায় (Part 11)। রঙ একই গাঢ় ধূসর <code>0.298<\/code>, যদিও Gazebo-র নিজের material তালিকা চাকাকে Black করবে (Part 10)। মনে রাখুন visual মানুষের চোখের জন্য, collision physics-এর জন্য, আর দুটির আলাদা হওয়াটাই নিয়মিত প্র্যাকটিস।"},{"a":1002,"b":1015,"text":"lwheel1_Joint হলো <code>continuous<\/code> type: চাকা অসীম ঘোরে, তাই limit-এ lower/upper নেই। origin <code>0.0776 0.075 0.04<\/code>: base_link থেকে প্রায় 7.8 cm সামনে, ঠিক <code>0.075<\/code> m বামে, মেঝে থেকে 4 cm উপরে, অর্থাৎ radius 0.04 চাকা মাটি ছুঁয়ে দাঁড়ায়। rpy <code>-1.5708 0 0<\/code> চাকার নিজের z-অক্ষকে base-এর y-অক্ষ বরাবর শুইয়ে দেয়। উপরের comment-টি axis-sign গণিত পরিষ্কার করে: rpy অর্থাৎ -90 deg ঘূর্ণনের পরে <code>0 0 1<\/code> axis base frame-এ <b>+Y<\/b> হয়ে দাঁড়ায়, তাই ধনাত্মক wheel velocity মানেই সোজা সামনে। diff_drive controller-এর সব সাইন-লজিক এই এক লাইনের উপর দাঁড়িয়ে, আর বাম-ডান প্রতি পাশের y = ±0.075 জোড়া মিলেই controller-এর wheel_separation 0.15 m হয়ে ফেরে (Part 11)।"},{"a":1016,"b":1022,"text":"দ্বিতীয় comment-টি আগের NOTE-এর প্রয়োজ্য সংক্ষেপ: effort কম রাখা হয়েছে ক্ষুদ্র wheel inertia-র তুলনায়, কারণ 5 N m velocity motor <code>7.5e-5<\/code> kg m^2 চাকায় ODE-র bang-bang motor-কে প্রতি step-এ overshoot করায় আর চাকা দৌড়ে যায় (প্রায় 50 rad/s)। একই কারণে joint damping/friction সরানো: velocity motor নিজেই damping দেয়, বরং ODE-র damping টার্ম 1 ms step-এ বিপরীতভাবে শক্তি ঢোকায়। ফলাফল <code>limit effort 2.0 velocity 20<\/code>: torque ছাদ 2 N m, গতি ছাদ 20 rad/s, কোনো position limit নেই কারণ continuous। মজার খুঁটিনাটি: comment-এর শুরুতে (1 Nm) লেখা থাকলেও প্রয়োজ্য সীমা 2.0, ডকুমেন্টেশন আর কোডের চিরচেনা ফাঁক। README-র troubleshooting তাই সাবধান করে: effort বাড়ানো বা damping ফেরানো যাবে না (Part 3)।"},{"a":1023,"b":1038,"text":"দ্বিতীয় চাকা <code>lwheel2<\/code>, বাম পিছনে। inertia সংখ্যাগুলো lwheel1-এর প্রায় ক্লোন: ixx <code>2.2262e-3<\/code>, izz <code>3.7298e-3<\/code>, mass <code>0.0973<\/code> kg, শুধু দশম-শতাংশ স্তরে CAD-জাত ভিন্নতা (origin-এর x এখানে <code>+2.43e-6<\/code>, আগেরটার ছিল <code>-2.05e-6<\/code>)। এই প্রায়-সমতা নিশ্চিত করে যে x50 স্কেলিং চার চাকাতেই একই রকম প্রয়োগ হয়েছে, কোনো চাকাকে আলাদা সুবিধা দেওয়া হয়নি। differential drive-এর জন্য এই সামঞ্জস্য জরুরি: বাম-ডান চাকার inertia বা mass আলাদা হলে একই velocity command-এ দুই পাশ আলাদা হারে ত্বরান্বিত হতো, robot সোজা না গিয়ে বেঁকে যেত, আর odometry-র সাথে বাস্তব গতির অমিল জমতে শুরু করত। চার block-এর এই সামঞ্জস্যই মডেলের নীরব প্রতিশ্রুতি।"},{"a":1039,"b":1059,"text":"visual ও collision lwheel1-এর হুবহু ছাঁচ: mesh <code>lwheel2.STL<\/code>, রঙ গাঢ় ধূসর, আর collision হিসেবে <code>cylinder radius 0.04 length 0.022<\/code>, origin z <code>0.0108<\/code>। প্রতিটি চাকার নিজের STL আছে, কারণ CAD-এ প্রতিটি কোণার চাকা আলাদা part ছিল, তবে physics-এর দৃষ্টিতে চারটিই একই cylinder। এখানে একটি সূক্ষ্ম পয়েন্ট: collision origin-এর z মানে wheel frame-এর নিজের z-অক্ষ — rpy -90° ঘোরানোর পর যেটা base-এর y বরাবর axle। অফসেট 0.0108 cylinder-টাকে axle বরাবর ঠেলে tire-এর আসনে বসায়; মেঝে ছোঁয়া এর ব্যাপার নয় — সেটা joint origin-এর z 0.04 (= radius)-ই ঠিক করে। gazebo.launch.py-এর spawn_entity-ও robot-কে <code>-z 0.01<\/code> দিয়ে নামায় (Part 13), একই রকম ভূমি-সচেতন সূক্ষ্মতা। চাকার মুখ আর collision একই বৃত্তে মিলে যাওয়ায় friction হিসাবও সৎ থাকে।"},{"a":1060,"b":1078,"text":"lwheel2_Joint-এর গঠন সামনের বাম চাকার মতোই continuous, শুধু origin x চিহ্ন উল্টো: <code>-0.0814 0.075 0.04<\/code>, অর্থাৎ প্রায় 8.1 cm পিছনে, 7.5 cm বামে, একই উচ্চতায়। rpy <code>-1.5708 0 0<\/code> আর axis <code>0 0 1<\/code>, তাই সাইন-কনভেনশন একই: ধনাত্মক velocity মানে সামনে। খেয়াল করুন এখানে axis-sign comment আর নেই, কেবল effort/damping comment-টি রয়েছে, কারণ লেখক ব্যাখ্যা একবারই দিয়েছেন lwheel1-এ। সামনের চাকার x <code>0.0776<\/code> আর পিছনেরটার <code>-0.0814<\/code>, এই 3.8 mm অসমতা পুরোপুরি প্রতিসম নয় এমন বাস্তব chassis-এর সৎ প্রতিফলন; kinematics-এ এর ক্ষতি নেই কারণ diff drive হিসাব করে কেবল y-দূরত্ব (separation) আর radius দিয়ে।"},{"a":1079,"b":1094,"text":"<code>rwheel1<\/code>, ডান সামনের চাকা। inertia আবারও সেই চেনা x50 সেট: ixx <code>2.2262e-3<\/code>, iyy <code>2.2262e-3<\/code>, izz <code>3.7298e-3<\/code>, mass <code>0.0973<\/code> kg, off-diagonal টার্মগুলো 1e-9 মাত্রার শব্দ। inertial origin-এর z আবার <code>0.01085<\/code>, অর্থাৎ চার চাকার center of mass প্রায় একই জায়গায়। এই পুনরাবৃত্তি পাঠকের জন্য বিরক্তিকর নয়, বরং আশ্বাস: প্রতিটি চাকা স্বতন্ত্রভাবে export ও স্কেল করা হয়েছে, কোনো একটিতে হাত বসানো হয়নি। hardware দিক থেকে এই চারটি link-ই Part 9-এর ros2_control block-এ velocity command_interface পাবে, আর my_controllers.yaml-এর diff_cont তখন বাম আর ডান দুই গ্রুপে চারটিকে ভাগ করে চালাবে (Part 11)।"},{"a":1095,"b":1115,"text":"visual mesh <code>rwheel1.STL<\/code>, collision সেই একই <code>cylinder radius 0.04 length 0.022<\/code>, z অফসেট <code>0.0108<\/code>। চার চাকার collision সম্পূর্ণ অভিন্ন রাখা হয়েছে একটি গভীর কারণে: ground contact ব্যবহার করে friction (mu1 mu2 1.2, Part 10) চাকাভেদে আলাদা হলে একই torque-তে slip আলাদা হতো, আর skid-steer ঘূর্ণনে odometry-র ভুল আরও বাড়ত। সমান cylinder, সমান friction, সমান inertia মিলিয়ে একটি পরিচ্ছন্ন diff drive তৈরি হয় যার আচরণ বিশ্লেষণযোগ্য। visual-এর ধূসর রঙ RViz-এ চিনতে দেয়, আর Gazebo নিজের material তালিকা থেকে চাকাগুলোকে Black দেখাবে (Part 10), বাস্তব টায়ারের মতো। ছোট্ট এই জুড়িই হালকা mesh-চোখ আর সস্তা cylinder-শরীরের ভারসাম্য রক্ষা করে।"},{"a":1116,"b":1129,"text":"rwheel1_Joint-এ বাম পাশের আয়না সংস্করণ দেখা যায়: origin <code>0.0776 -0.075 0.04<\/code> (প্রায় 7.8 cm সামনে, 7.5 cm ডানে), কিন্তু rpy এখন <code>+1.5708 0 0<\/code> এবং axis <code>0 0 -1<\/code>। comment-টি গণিতটা খুলে বলে: rpy অর্থাৎ +90 deg ঘূর্ণনের পরে <code>0 0 -1<\/code> সেই একই <b>+Y<\/b> দিকে মেলে, তাই ডান চাকাতেও ধনাত্মক velocity মানে সামনে। এই দুই আয়না-কৌশল না থাকলে একই ধনাত্মক command বাম চাকাকে সামনে ডান চাকাকে পিছনে ঘুরিয়ে robot-কে জায়গায় ঘুরতে বাধ্য করত, ঠিক যেমন উল্টো সাইন বাগ করে তোলে। fix-log-এর backward-driving ঘটনাটি আসলে এই সাইন ছিল না, অস্থির motor ছিল, কিন্তু উপসর্গ একই রকম বিভ্রান্তিকর (Part 3)।"},{"a":1130,"b":1136,"text":"rwheel1-এর effort/damping comment ও <code>limit effort 2.0 velocity 20<\/code> হুবহু আগের চাকাগুলোর মতো, আর এই পুনরাবৃত্তি নিজেই বার্তা: নিয়মটি চার চাকার জন্য সমান, কোনো ব্যতিক্রম নেই। 2 N m torque ছাদ আর 20 rad/s গতি ছাদ মিলিয়ে চাকার প্রান্তীয় বেগ সর্বোচ্চ 20 x 0.04 = 0.8 m/s, যা controller-এর linear.x সর্বোচ্চ 1.0 m/s-এর (Part 11) নিচে থেকে বাস্তব সীমা দেয়। damping/friction-এর অনুপস্থিতি ইচ্ছাকৃত; README-র troubleshooting স্পষ্ট লিখেছে পুরনো physics বাগের পর এগুলো ফেরানো বা effort বাড়ানো যাবে না (Part 3)। মনে রাখুন, ছাদ খুব উঁচু হলে ODE বিস্ফোরিত হয়, খুব নিচু হলে চাকা বোঝা টানতে আটকায়; 2 N m হলো সেই সমতা-বিন্দু।"},{"a":1137,"b":1152,"text":"শেষ চাকা <code>rwheel2<\/code>, ডান পিছনে। সংখ্যাগুলো আবারও প্রায় অভিন্ন: ixx <code>2.2262e-3<\/code>, iyy <code>2.2262e-3<\/code>, izz <code>3.7298e-3<\/code>, mass <code>0.0973<\/code> kg। izz-এর মান ixx-এর চেয়ে বড় হওয়াটা প্রাকৃতিক, কারণ চাকা তার নিজের ঘূর্ণন-অক্ষ বরাবর বেশি জড়তা নিয়ে ঘোরে, ব্যাসার্ধ বরাবর তুলনায় কম। চার চাকা মিলিয়ে মোট mass প্রায় 0.39 kg, base_link-এর 4.0 kg-এর (Part 4) প্রায় দশ ভাগের এক। এই অনুপাত নিয়ে ফাইলের কোথাও কোনো মন্তব্য নেই — যে দুটি সচেতন সিদ্ধান্ত নথিবদ্ধ সেগুলো হলো চাকার inertia x50 (NOTE) আর chassis-এর inertia পুনর্গণনা (Part 4); ভারী-হালকা অনুপাত তার পার্শ্বফল মাত্র।"},{"a":1153,"b":1173,"text":"শেষ visual/collision জুড়িও ছাঁচ ভাঙেনি: mesh <code>rwheel2.STL<\/code>, ধূসর rgba <code>0.298<\/code>, collision cylinder radius <code>0.04<\/code> length <code>0.022<\/code>, z <code>0.0108<\/code>। এই শেষ চাকা দিয়ে wheel অংশ সম্পূর্ণ: চারটি mesh-চোখ, চারটি cylinder-শরীর, প্রতিটি নিজ নিজ continuous joint-এ base_link-এর চার কোণে ঝোলানো। দুটি সংখ্যা মনে রাখার মতো: cylinder radius 0.04, যেটি controller-এর wheel_radius, আর joint origin-এর y = 0.075 দুই পাশে, যেটি wheel_separation 0.15 মিটারের ভিত্তি (Part 11-এ 0.1955 ভুল মানের গল্প)। চাকার অংশ এখানে শেষ হলেও URDF এখানেই ফুরায়নি, সামনে আরও arm_base, ros2_control block আর Gazebo layer অপেক্ষা করছে (Part 9, 10)।"},{"a":1174,"b":1192,"text":"rwheel2_Joint চার চাকার শেষ জোড়া: origin <code>-0.0814 -0.075 0.04<\/code> (প্রায় 8.1 cm পিছনে, 7.5 cm ডানে), rpy <code>+1.5708 0 0<\/code>, axis <code>0 0 -1<\/code>; এখানে আলাদা axis-sign comment নেই, কিন্তু নিয়ম আগেই স্থাপিত তাই ধনাত্মক velocity এখানেও সামনে। রয়েছে সেই একই effort/damping comment আর <code>limit effort 2.0 velocity 20<\/code>। চারটি joint মিলিয়ে geometry: x <code>+0.0776<\/code> সামনের জোড়া, <code>-0.0814<\/code> পিছনের জোড়া, y <code>0.075<\/code> বামে আর <code>-0.075<\/code> ডানে, z <code>0.04<\/code> সবাই। এই স্থির চৌহদ্দির উপরেই diff drive kinematics দাঁড়ায়, আর পরের ros2_control block এই চার joint-কেই velocity interface দেবে (Part 9), যেগুলোকে diff_cont জোড়ায় জোড়ায় চালাবে (Part 11)।"}],"math":{"intro":"চাকার physics-এর পুরো গল্পটা তিনটি সমীকরণে দাঁড়িয়ে যায়: cylinder-এর inertia কেমন হয়, ODE-র 1 ms step-এ সেই inertia-র উপর torque কী করে, আর x50 স্কেলিং সংখ্যাগুলোকে কোথায় নিয়ে যায়। নিচের স্তরগুলো একে একে সেটাই গড়ে তোলে; প্রতিটি সংখ্যা হয় ফাইল থেকে, নয় তার সরাসরি হিসাব থেকে।","levels":[{"label":"torque আর inertia-র মৌলিক সম্পর্ক","latex":"\\[ \\alpha = \\frac{\\tau}{I} \\]","text":"angular acceleration হলো torque-কে inertia দিয়ে ভাগ করা। inertia যত ছোট, একই torque-তে ত্বরণ তত বিস্ফোরিত; চাকার অস্থিরতার পুরো গল্প এই এক ভগ্নাংশের হিসাবে দাঁড়িয়ে।"},{"label":"cylinder-এর inertia","latex":"\\[ I_{xx} = I_{yy} = \\frac{m\\,(3r^{2}+h^{2})}{12}, \\qquad I_{zz} = \\frac{m\\,r^{2}}{2} \\]","text":"পুরুত্ব h ব্যাসার্ধ r সমযুক্ত cylinder-এর অক্ষ বরাবর জড়তা mr^2/2, আর ব্যাস বরাবর দুই অক্ষে সমান m(3r^2+h^2)/12। চাকার collision geometry ঠিক এই cylinder, তাই এই সূত্রই মডেলের ভিত্তি।"},{"label":"M3Pro চাকার আসল সংখ্যা","latex":"\\[ m = 0.0973\\ \\mathrm{kg},\\ r = 0.04\\ \\mathrm{m},\\ h = 0.022\\ \\mathrm{m} \\;\\Rightarrow\\; I_{xx} \\approx 4.3\\times10^{-5},\\ I_{zz} \\approx 7.8\\times10^{-5}\\ \\mathrm{kg\\,m^{2}} \\]","text":"মান বসালে সূত্র দেয় Ixx প্রায় 4.3e-5 আর Izz প্রায় 7.8e-5 kg m^2, NOTE-এ লেখা SolidWorks এক্সপোর্টের প্রায় 4.5e-5 মানের সাথে একই মাত্রার; ক্ষুদ্র পার্থক্য এই যে বাস্তব চাকা নিখুঁত cylinder নয়।"},{"label":"ODE 1 ms step-এ বিস্ফোরণ","latex":"\\[ \\alpha = \\frac{2.0}{7.5\\times10^{-5}} \\approx 2.67\\times10^{4}\\ \\mathrm{rad/s^{2}}, \\qquad \\Delta\\omega = \\alpha \\cdot 0.001\\ \\mathrm{s} \\approx 26.7\\ \\mathrm{rad/s} \\]","text":"2 N m velocity motor 7.5e-5 kg m^2 চাকায় সেকেন্ডে প্রায় 26,667 rad/s বেগ যোগ করতে পারে, মানে প্রতি 1 ms step-এ 26.7 rad/s লাফ। bang-bang controller এই লাফ সামলাতে না পেরে overshoot কর
