<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08. robot model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#0a0a0a; --bg2:#111111;
  --card:#151515; --card2:#181818; --card3:#1d1d1d;
  --border:#262626; --border2:#303030; --border3:#3a3a3a;
  --text:#e8e8e8; --muted:#a0a0a0; --faint:#6e6e6e;
  --ex:#4fc3f7; --ex-dim:rgba(79,195,247,.09);
  --math:#7ee787; --math-dim:rgba(126,231,135,.08);
  --rb:#ffb454; --rb-dim:rgba(255,180,84,.08);
  --anim:#d2a8ff; --anim-dim:rgba(210,168,255,.08);
  --code-bg:#0d1117; --code-head:#161b22;
  --gutter-txt:#3d4f63; --gutter-line:#1c2530;
  --ok:#3fb950; --bad:#f85149;
  --ff-title:'Space Grotesk','Inter','Hind Siliguri',sans-serif;
  --ff-ui:'Inter','Hind Siliguri',system-ui,-apple-system,sans-serif;
  --ff-bn:'Hind Siliguri','Inter',sans-serif;
  --ff-mono:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --sb-w:292px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--ff-ui); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(79,195,247,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a}
a{color:var(--ex);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ex);outline-offset:2px;border-radius:4px}
button{font-family:var(--ff-ui)}

/* ============ APP LAYOUT ============ */
#app{display:flex;min-height:100vh}
#main{
  margin-left:var(--sb-w);
  flex:1;
  min-width:0;
  padding:52px 56px 80px;
  max-width:1180px;
}
.intro-banner{
  margin-bottom:48px;padding:30px 34px;
  background:linear-gradient(145deg,#141414,#101010);
  border:1px solid var(--border);border-radius:16px;
  position:relative;overflow:hidden;
}
.intro-banner::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(600px 180px at 12% 0%,rgba(79,195,247,.07),transparent 60%),
    radial-gradient(500px 160px at 88% 100%,rgba(210,168,255,.05),transparent 60%);
  pointer-events:none;
}
.intro-eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ex);margin-bottom:10px;
}
.intro-banner h1{
  font-family:var(--ff-title);font-size:clamp(26px,3.4vw,38px);
  font-weight:700;letter-spacing:-.01em;line-height:1.15;
}
.intro-banner h1 .path{color:var(--faint);font-weight:500}
.intro-desc{margin-top:12px;color:var(--muted);max-width:70ch;font-size:15px}
.intro-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stat-chip{
  font-family:var(--ff-mono);font-size:12px;color:#c9d1d9;
  background:#0d1117;border:1px solid var(--border2);
  padding:6px 12px;border-radius:999px;
}
.stat-chip b{color:var(--ex);font-weight:600}

/* ============ SIDEBAR ============ */
#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);
  background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;z-index:60;
  display:flex;flex-direction:column;
}
.sb-head{
  padding:26px 22px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg2);z-index:2;
}
.sb-folder{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;
  color:var(--text);letter-spacing:-.01em;line-height:1.3;
}
.sb-meta{
  margin-top:6px;font-family:var(--ff-mono);font-size:11.5px;
  color:var(--faint);letter-spacing:.08em;
}
#sb-nav{padding:14px 12px 30px;flex:1}
.sb-item{
  display:flex;align-items:baseline;gap:11px;
  padding:8px 12px;margin:1px 0;border-radius:8px;
  color:#9a9a9a;border-left:2px solid transparent;
  transition:background .18s,color .18s;
}
.sb-item .sb-num{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  min-width:20px;font-weight:500;
}
.sb-item .sb-name{
  font-size:13.2px;font-weight:500;line-height:1.35;
  font-family:var(--ff-ui);
}
.sb-item:hover{background:#181818;color:#d6d6d6;text-decoration:none}
.sb-item.active{
  background:linear-gradient(90deg,rgba(79,195,247,.10),rgba(79,195,247,.02));
  color:#eaf6fe;border-left:2px solid var(--ex);
}
.sb-item.active .sb-num{color:var(--ex)}
.sb-filesep{
  font-family:var(--ff-mono);font-size:10px;letter-spacing:.16em;
  color:#525252;text-transform:uppercase;
  padding:14px 12px 6px;margin-top:4px;
}
#menu-btn{
  display:none;position:fixed;top:14px;left:14px;z-index:80;
  width:42px;height:42px;border-radius:10px;
  background:#181818;border:1px solid var(--border2);color:var(--text);
  font-size:15px;cursor:pointer;line-height:1;
  align-items:center;justify-content:center;padding:0;
}
#sb-overlay{display:none}

/* ============ PART SECTION ============ */
.part{margin-bottom:88px;scroll-margin-top:24px}
.part-head{margin-bottom:22px}
.eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ex);margin-bottom:8px;
}
.part-title{
  font-family:var(--ff-title);font-size:clamp(23px,2.6vw,31px);
  font-weight:700;letter-spacing:-.015em;line-height:1.18;
  margin-bottom:12px;
}
.part-meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-family:var(--ff-mono);font-size:12px;color:var(--muted);
}
.meta-chip{
  background:#101418;border:1px solid var(--border2);
  padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.meta-chip.flag{color:#d8c97a;border-color:#3a3524;background:#17150d}
.meta-chip.lang{color:#8ab4f8}

/* ============ CODE CARD ============ */
.code-card{
  background:var(--code-bg);border:1px solid var(--border2);
  border-radius:13px;overflow:hidden;margin-bottom:30px;
  box-shadow:0 14px 40px rgba(0,0,0,.42);
}
.code-card-head{
  display:flex;align-items:center;gap:14px;
  background:var(--code-head);border-bottom:1px solid #20262e;
  padding:10px 16px;
}
.dots{display:flex;gap:7px;align-items:center}
.dots i{
  width:11px;height:11px;border-radius:50%;display:block;
}
.dots i:nth-child(1){background:#ff5f57}
.dots i:nth-child(2){background:#febc2e}
.dots i:nth-child(3){background:#28c840}
.code-fname{
  font-family:var(--ff-mono);font-size:12.5px;color:#9aa7b4;
  letter-spacing:.02em;
}
.code-lines-chip{
  font-family:var(--ff-mono);font-size:11px;color:#5b6875;
  margin-left:auto;white-space:nowrap;
}
.copy-btn{
  font-family:var(--ff-mono);font-size:11px;letter-spacing:.06em;
  color:#9aa7b4;background:#1c2128;border:1px solid #2d333b;
  border-radius:6px;padding:4px 11px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.copy-btn:hover{color:#e6edf3;border-color:#444c56}
.copy-btn.done{color:var(--ok);border-color:rgba(63,185,80,.4)}
.code-scroll{overflow-x:auto;max-height:640px;overflow-y:auto}
pre.code{display:inline-block;min-width:100%;padding:14px 0;font-family:var(--ff-mono)}
.cl{display:flex;white-space:pre;font-size:13.2px;line-height:1.62}
.cln{
  position:sticky;left:0;flex:0 0 auto;z-index:2;
  min-width:52px;text-align:right;padding-right:16px;
  color:var(--gutter-txt);background:var(--code-bg);
  border-right:1px solid var(--gutter-line);
  user-select:none;-webkit-user-select:none;font-size:11.5px;
  line-height:1.85;letter-spacing:.02em;
}
.cl.target .cln{
  background:#101722;color:#7ba3c9;border-right-color:#234;
}
.clc{flex:0 0 auto;padding-right:24px;tab-size:8;color:#e6edf3}
.tok-kw{color:#ff7b72}
.tok-str{color:#a5d6ff}
.tok-com{color:#8b949e;font-style:italic}
.tok-num{color:#79c0ff}
.tok-fn{color:#d2a8ff}
.tok-blt{color:#ffa657}

/* ============ SECTIONS ============ */
.sec{
  border:1px solid var(--border);border-radius:13px;
  background:var(--card);margin-bottom:26px;overflow:hidden;
}
.sec-head{
  display:flex;align-items:center;gap:12px;
  padding:15px 22px;border-bottom:1px solid var(--border);
  background:var(--card2);
}
.badge{
  font-family:var(--ff-mono);font-weight:700;font-size:12px;
  min-width:34px;height:26px;border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;
  letter-spacing:.03em;flex:0 0 auto;
}
.badge-ex{background:var(--ex-dim);color:var(--ex);border:1px solid rgba(79,195,247,.35)}
.badge-math{background:var(--math-dim);color:var(--math);border:1px solid rgba(126,231,135,.35)}
.badge-rb{background:var(--rb-dim);color:var(--rb);border:1px solid rgba(255,180,84,.35)}
.badge-anim{background:var(--anim-dim);color:var(--anim);border:1px solid rgba(210,168,255,.35)}
.sec-head h3{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;letter-spacing:-.01em;
}
.sec-head h3 .bn-inline{font-family:var(--ff-bn)}
.sec-body{padding:20px 22px 24px}

/* ============ EXPLAIN ENTRIES ============ */
.ex-entry{margin-bottom:26px}
.ex-entry:last-child{margin-bottom:6px}
.ex-snippet{
  background:#0d1117;border:1px solid var(--border2);border-left:3px solid var(--ex);
  border-radius:9px;overflow:hidden;
}
.ex-snippet pre{
  padding:10px 16px;font-family:var(--ff-mono);font-size:12.8px;
  line-height:1.62;color:#dbe4ee;overflow-x:auto;white-space:pre;
}
.ex-lines{
  display:inline-block;font-family:var(--ff-mono);font-size:10.5px;
  color:var(--ex);background:var(--ex-dim);border:1px solid rgba(79,195,247,.3);
  border-radius:5px;padding:1px 8px;margin-bottom:7px;letter-spacing:.06em;
}
.ex-arrow{
  color:#3a471f;font-family:var(--ff-mono);font-size:15px;color:var(--faint);
  padding:3px 2px 3px 12px;
}
.ex-text{
  font-family:var(--ff-bn);font-size:16px;line-height:1.95;color:#d5d5d5;
  padding:2px 4px 0 14px;border-left:2px solid #232d36;
}
.ex-text code, .bn code, .ml-text code, .map-text code, .rb-card code, .anim-caption code{
  font-family:var(--ff-mono);font-size:.86em;color:#9ecbff;
  background:rgba(110,168,254,.10);border:1px solid rgba(110,168,254,.16);
  border-radius:5px;padding:1px 6px;white-space:nowrap;
}
.ex-text ul, .ml-text ul, .rb-card ul, .anim-caption ul{
  margin:8px 0 4px 4px;padding-left:22px;
}
.ex-text li, .ml-text li, .rb-card li{margin:5px 0}

/* ============ MATH SECTION ============ */
.math-intro{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
  padding-bottom:16px;border-bottom:1px dashed var(--border2);margin-bottom:20px;
}
.math-level{
  background:var(--card2);border:1px solid var(--border2);border-radius:11px;
  padding:16px 20px;margin-bottom:14px;
}
.ml-label{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--math);margin-bottom:10px;
}
.mathy{
  font-size:17px;color:#e3ffe6;margin:8px 0 12px;
  padding:12px 16px;background:rgba(126,231,135,.05);
  border:1px solid rgba(126,231,135,.16);border-radius:9px;
  overflow-x:auto;min-height:24px;
}
.ml-text{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
}
.math-subhead{
  font-family:var(--ff-title);font-size:14.5px;font-weight:600;color:#bfe8c4;
  margin:26px 0 12px;letter-spacing:.01em;
}
.map-row{
  display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(180px,1fr) minmax(220px,1.4fr);
  gap:12px;align-items:start;
  background:var(--card2);border:1px solid var(--border2);border-radius:10px;
  padding:12px 16px;margin-bottom:10px;
}
.map-code code{
  font-family:var(--ff-mono);font-size:12.5px;color:#9ecbff;background:#0d1117;
  border:1px solid var(--border2);border-radius:6px;padding:3px 8px;display:inline-block;
}
.map-math{color:#c9f7cf;font-family:var(--ff-mono);font-size:13.5px;padding-top:2px}
.map-text{font-family:var(--ff-bn);font-size:14.5px;line-height:1.8;color:#bcbcbc}
.failure-list li{
  font-family:var(--ff-bn);font-size:15px;line-height:1.85;color:#d9c9c9;
  margin:8px 0;padding-left:6px;list-style:none;position:relative;padding-left:22px;
}
.failure-list li::before{
  content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;
  border-radius:2px;background:rgba(248,81,73,.5);border:1px solid rgba(248,81,73,.65);
}
.failure-list{padding:0}

/* ============ ROBOT SECTION ============ */
.rb-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rb-card{
  border-radius:11px;padding:16px 18px;border:1px solid var(--border2);
  font-family:var(--ff-bn);font-size:15.3px;line-height:1.9;
}
.rb-card h4{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:10px;font-weight:600;
}
.rb-ok{background:rgba(63,185,80,.05);border-color:rgba(63,185,80,.28)}
.rb-ok h4{color:var(--ok)}
.rb-bad{background:rgba(248,81,73,.05);border-color:rgba(248,81,73,.28)}
.rb-bad h4{color:var(--bad)}

/* ============ ANIMATION SECTION ============ */
.anim-stage{
  background:
    radial-gradient(500px 200px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  border-bottom:1px solid var(--border2);
  padding:10px;position:relative;
}
.anim-stage svg{width:100%;height:auto;display:block}
.anim-controls{
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--border);background:var(--card2);
}
.ac-btn{
  font-family:var(--ff-mono);font-size:12px;letter-spacing:.08em;
  color:#c9c9c9;background:#202020;border:1px solid var(--border3);
  border-radius:8px;padding:7px 18px;cursor:pointer;transition:all .15s;
}
.ac-btn:hover{background:#2a2a2a;color:#fff;border-color:#4a4a4a}
.ac-btn.active{background:rgba(210,168,255,.14);color:var(--anim);border-color:rgba(210,168,255,.45)}
.anim-caption{
  font-family:var(--ff-bn);font-size:15px;line-height:1.8;color:#d0c4dd;
  padding:13px 22px;border-bottom:1px solid var(--border);min-height:52px;
  background:rgba(210,168,255,.03);
}
.anim-formula{
  font-family:var(--ff-mono);font-size:14px;color:#e6d9f5;
  padding:12px 22px;background:#0d1117;min-height:46px;
  overflow-x:auto;white-space:nowrap;letter-spacing:.01em;
}
.anim-formula .fx-hl{color:var(--anim)}
.anim-formula .fx-ok{color:var(--math)}
.anim-formula .fx-warn{color:var(--rb)}
.anim-state{
  margin-left:auto;font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.1em;
}

/* ============ PART NAV ============ */
.part-nav{display:flex;justify-content:space-between;gap:14px;margin-top:34px}
.pn-btn{
  flex:1;max-width:340px;display:block;
  border:1px solid var(--border2);border-radius:11px;
  padding:13px 18px;color:#c9c9c9;transition:all .16s;
  background:var(--card);
}
.pn-btn:hover{border-color:rgba(79,195,247,.4);color:#fff;text-decoration:none;background:#181818}
.pn-btn .pn-dir{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.14em;display:block;margin-bottom:3px;
}
.pn-btn .pn-title{font-size:13.5px;font-weight:600}
.pn-btn.next{text-align:right}
.pn-btn.disabled{opacity:.28;pointer-events:none}

/* ============ FOOTER ============ */
.site-footer{
  margin-left:var(--sb-w);border-top:1px solid var(--border);
  padding:26px 56px;color:var(--faint);font-size:13px;
  font-family:var(--ff-mono);letter-spacing:.02em;
}

/* ============ MATHJAX FALLBACK ============ */
body.no-mathjax .mathy{
  font-family:var(--ff-mono);font-size:13.5px;color:#c9f0cd;white-space:pre;
}

/* ============ RESPONSIVE ============ */
@media (max-width:1240px){
  #main{padding:44px 34px 70px}
  .site-footer{padding:24px 34px}
}
@media (max-width:960px){
  #menu-btn{display:block}
  #sidebar{
    transform:translateX(-100%);transition:transform .26s ease;
    box-shadow:24px 0 60px rgba(0,0,0,.5);
  }
  body.sb-open #sidebar{transform:translateX(0)}
  body.sb-open #sb-overlay{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;
  }
  #main{margin-left:0;padding:74px 20px 60px}
  .site-footer{margin-left:0;padding:22px 20px}
  .rb-grid{grid-template-columns:1fr}
  .map-row{grid-template-columns:1fr;gap:6px}
  .intro-banner{padding:22px 20px}
}
@media (max-width:560px){
  body{font-size:15px}
  .ex-text{font-size:15.3px}
  .cl{font-size:12.3px}
  .anim-formula{font-size:12.5px}
  .code-lines-chip{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}
</style>


<style id="refine-style">
/* ==================================================================
   SURGICAL REFINEMENT LAYER v2 — appended (UI-UX & animation refinement)
   Does not override any existing rule except where explicitly noted;
   all original bytes above this block are untouched.

   INTENTIONAL LAYER ARCHITECTURE (documented z-index scale)
   ---------------------------------------------------------
     --z-ground  0   page ground, card backgrounds
     --z-scene  10   base SVG scene inside .anim-stage / .exec-robot
     --z-objects 20  moving SVG marks (updated in place by the engine)
     --z-labels 30   SVG text labels — halo-stroked so they can never
                     become unreadable under moving objects
     --z-panel  40   overlay panels (formula bar, debug chips)
     --z-head   50   section headers, captions
     --z-debug  60   live debug readouts
     --z-ctrl   70   control bars (always clickable, never covered)
     --z-nav    80   sidebar / menu
     --z-focus  90   focus outlines (never overlapped)
   HTML layers take these values; inside a single <svg> stacking is by
   paint order, and readability of labels is guaranteed by the
   paint-order halo rule below rather than by z-index.
   ================================================================== */
:root{
  --z-ground:0; --z-scene:10; --z-objects:20; --z-labels:30;
  --z-panel:40; --z-head:50; --z-debug:60; --z-ctrl:70; --z-nav:80; --z-focus:90;
}

/* ---- Fix: full-width application shell (#56-57).
        #main keeps its sidebar margin but drops the narrow max-width;
        prose blocks below keep a readable measure so lines never run
        wall-to-wall — only layout containers use the full width. ---- */
#main{max-width:none}
.intro-desc{max-width:none}          /* hero paragraph: full hero width */
.ex-text, .ml-text, .math-intro, .map-text, .rb-card, .exec-note,
.anim-caption{
  max-width:105ch;
}
@media (min-width:1800px){
  #main{padding-left:88px; padding-right:88px}
}

/* ---- Fix: SVG text labels stay readable over moving objects.
        Halo = stage-ground-coloured stroke painted UNDER the fill. ---- */
.anim-stage svg text,
.exec-robot svg text{
  paint-order:stroke; stroke:#0b0e13; stroke-width:3px;
  stroke-linejoin:round; stroke-linecap:round;
  pointer-events:none; user-select:none;
}
.anim-stage, .exec-robot{position:relative; z-index:var(--z-scene)}
.anim-controls{position:relative; z-index:var(--z-ctrl)}
.anim-caption{position:relative; z-index:var(--z-head)}
.anim-formula{position:relative; z-index:var(--z-panel)}
.anim-state{z-index:var(--z-debug)}

/* ---- Fix: icon control buttons (professional inline SVG, no text) ---- */
.anim-controls{gap:8px}
.ac-btn.ic{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:32px; padding:0; border-radius:8px;
}
.ac-btn.ic svg{width:16px; height:16px; display:block; fill:currentColor}
.ac-btn.ic svg *{vector-effect:non-scaling-stroke}
.ac-btn:focus-visible{
  outline:2px solid var(--anim); outline-offset:2px; z-index:var(--z-focus);
}
.ac-btn.ic[disabled]{opacity:.35; cursor:not-allowed}
.anim-controls .ac-sep{
  width:1px; height:20px; background:var(--border3); margin:0 3px; flex:0 0 auto;
}
.anim-controls .ac-step{
  font-family:var(--ff-mono); font-size:11px; color:var(--anim);
  letter-spacing:.08em; padding:6px 10px; border:1px solid rgba(210,168,255,.28);
  border-radius:7px; background:var(--anim-dim); white-space:nowrap;
}

/* ---- Complete Execution — Code → Debug → Robot (v2 row layout) ----
   Row 1: COMPLETE SOURCE CODE | LIVE DEBUG   (the two walk together)
   Row 2: ROBOT / SYSTEM STATE (full width)
   Then:  complete banner → formula → explanation → controls      */
.exec-sec{margin-top:56px}
.exec-sec .sec-head .exec-sub{
  font-family:var(--ff-mono); font-size:11px; color:var(--faint);
  letter-spacing:.06em; margin-left:auto; padding-right:18px; white-space:nowrap;
}
.exec-note{
  font-family:var(--ff-bn); font-size:14.5px; line-height:1.8; color:var(--muted);
  padding:14px 22px; border-bottom:1px solid var(--border); background:var(--card);
}
.exec-note code{
  font-family:var(--ff-mono); font-size:.86em; color:#9ecbff;
  background:rgba(110,168,254,.10); border:1px solid rgba(110,168,254,.16);
  border-radius:5px; padding:1px 6px;
}
.exec-frame{
  display:grid; gap:14px; padding:16px 18px;
  grid-template-columns:minmax(0,1.42fr) minmax(330px,.72fr);
}
.exec-col{min-width:0; display:flex; flex-direction:column; gap:14px}
.exec-col>.exec-panel{flex:1}
/* robot/system row spans the full frame width, below code+debug */
.exec-col.rob-col{grid-column:1 / -1}
.exec-panel{
  background:var(--code-bg); border:1px solid var(--border2); border-radius:12px;
  overflow:hidden; display:flex; flex-direction:column; min-height:0;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}
/* scroll affordance: right-edge fade says "more code this way" without
   covering anything interactive (head stays above it via z-index) */
.exec-col.code-col .exec-panel{position:relative}
.exec-col.code-col .exec-panel::after{
  content:""; position:absolute; top:0; right:0; bottom:0; width:26px;
  z-index:1; pointer-events:none;
  background:linear-gradient(90deg, rgba(13,17,23,0), #0d1117 92%);
}
.exec-panel-head{
  position:relative; z-index:2;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--code-head); border-bottom:1px solid #20262e; padding:9px 14px;
}
.exec-panel-head .ep-title{
  font-family:var(--ff-title); font-size:13px; font-weight:600; color:#c9d1d9;
  letter-spacing:.01em;
}
.exec-panel-head .ep-chip{
  font-family:var(--ff-mono); font-size:10px; letter-spacing:.05em;
  border-radius:999px; padding:2.5px 9px; white-space:nowrap;
}
.ep-chip.live{color:var(--anim); background:var(--anim-dim); border:1px solid rgba(210,168,255,.3)}
.ep-chip.concept{color:var(--rb); background:var(--rb-dim); border:1px solid rgba(255,180,84,.3)}
.ep-chip.src{color:var(--ex); background:var(--ex-dim); border:1px solid rgba(79,195,247,.3)}
/* kind legend in the code panel head: exec / structural / event */
.exec-legend{
  margin-left:auto; display:inline-flex; align-items:center; gap:5px;
  font-family:var(--ff-mono); font-size:9.5px; color:var(--faint); white-space:nowrap;
}
.exec-legend .lg{
  width:9px; height:9px; border-radius:3px; display:inline-block;
  margin-left:6px;
}
.exec-legend .lg-exec{background:#d2a8ff}
.exec-legend .lg-struct{background:#ffb454}
.exec-legend .lg-event{background:#4fc3f7}
.exec-code{
  position:relative; overflow:auto; flex:1; min-height:0;
  max-height:620px; margin:0; padding:10px 0 28px;
  font-family:var(--ff-mono); font-size:12.3px; line-height:1.6; color:#dbe4ee;
  background:var(--code-bg); tab-size:4;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.exec-code .exl{
  display:block; white-space:pre; min-height:1.6em;
  padding:0 12px 0 0; border-left:3px solid transparent;
  transition:background .2s, border-color .2s;
}
/* line-number gutter stays pinned when long lines scroll horizontally */
.exec-code .eln{
  position:sticky; left:0;
  display:inline-block; width:3.6em; padding-right:10px;
  text-align:right; color:#3d4f63; user-select:none;
  background:var(--code-bg);
}
/* current line, by kind: exec = purple (default), structural = amber,
   event = cyan; grouped companion lines get the tint without the edge */
.exec-code .exl.cur{
  background:rgba(210,168,255,.14); border-left-color:var(--anim);
}
.exec-code .exl.cur .eln{color:var(--anim); background:#241d38}
.exec-code .exl.cur-struct{
  background:rgba(255,180,84,.13); border-left-color:var(--rb);
}
.exec-code .exl.cur-struct .eln{color:var(--rb); background:#2e2416}
.exec-code .exl.cur-event{
  background:rgba(79,195,247,.14); border-left-color:var(--ex);
}
.exec-code .exl.cur-event .eln{color:var(--ex); background:#12283a}
.exec-code .exl.cur-g{background:rgba(210,168,255,.06)}
.exec-code .exl.cur-g.cur-struct{background:rgba(255,180,84,.07)}
.exec-code .exl.cur-g.cur-event{background:rgba(79,195,247,.07)}
/* ---- BEFORE → OPERATION → AFTER debug (#52) ---- */
.exec-op{
  margin:10px 12px 0; padding:8px 12px; border-radius:9px;
  border:1px solid rgba(126,231,135,.32); background:rgba(126,231,135,.07);
  font-family:var(--ff-mono); font-size:11.8px; line-height:1.65; color:#7ee787;
  overflow-wrap:anywhere;
}
.exec-op::before{
  content:"OPERATION";
  display:block; font-size:9px; letter-spacing:.14em; color:#58a65f;
  margin-bottom:3px;
}
.exec-dbg-body{
  padding:10px 14px 14px; overflow:auto; max-height:620px; flex:1; min-height:0;
  font-family:var(--ff-mono); font-size:12px;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.dbg-row{
  display:flex; align-items:baseline; gap:10px; padding:5.5px 8px;
  border-bottom:1px dashed #1c2530; animation:dbgIn .3s ease;
}
.dbg-row:last-child{border-bottom:none}
.dbg-k{color:var(--muted); white-space:nowrap; flex:0 0 auto}
.dbg-v{color:#9ecbff; text-align:right; flex:1; overflow-wrap:anywhere;
  padding-right:2px}
.dbg-v.n{color:#7ee787}
.dbg-v.err{color:var(--bad)}
/* value changed by this line: old (dim) → new (green) */
.dbg-row.chg .dbg-v{color:#7ee787}
.dbg-old{color:#6e7681; text-decoration:line-through;
  text-decoration-color:rgba(110,118,129,.6)}
.dbg-arrow{color:#7ee787; font-weight:600}
.dbg-ill{
  flex:0 0 auto; font-size:9.5px; letter-spacing:.05em; color:var(--rb);
  border:1px solid rgba(255,180,84,.35); border-radius:5px; padding:1px 5px;
}
.dbg-empty{color:var(--faint); font-family:var(--ff-bn); font-size:13px; padding:12px 8px}
@keyframes dbgIn{from{opacity:0; transform:translateX(-4px)}to{opacity:1}}
/* robot row: centered scene, taller than the old side column */
.exec-robot{
  background:
    radial-gradient(500px 220px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  padding:14px; overflow:auto;
  display:flex; justify-content:center;
}
.exec-robot svg{width:100%; max-width:720px; height:auto; max-height:560px;
  display:block; margin:0 auto}
.exec-rob-fade{animation:robFade .4s ease}
@keyframes robFade{from{opacity:0; transform:translateY(4px)}to{opacity:1}}
/* result zone: complete banner → formula row → explanation → controls */
.exec-complete{
  display:none; margin:0 18px 14px; padding:13px 18px; border-radius:11px;
  border:1px solid rgba(63,185,80,.4); background:rgba(63,185,80,.08);
  font-family:var(--ff-mono); font-size:12.5px; letter-spacing:.04em; color:#7ee787;
}
.exec-complete.show{display:block; animation:robFade .4s ease}
.exec-complete .bn{font-family:var(--ff-bn); font-size:14px; color:#c9d1d9;
  letter-spacing:0; margin-top:5px; line-height:1.75}
.exec-fx-row{margin:0 18px 14px; max-width:none}
.exec-sec .anim-caption{margin:0 18px 4px}
.exec-sec .anim-controls{margin:0 18px 18px}
.exec-progress{
  height:3px; margin:0 18px 22px; border-radius:2px; overflow:hidden;
  background:rgba(255,255,255,.06);
}
.exec-progress i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--anim),#7ee787);
  transition:width .3s ease;
}

/* responsive: code+debug share row 1 until 960px, robot row always full
   width; below 960px everything stacks vertically (#59 mobile order) */
@media (max-width:1240px){
  .exec-frame{grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr)}
  .exec-code{max-height:540px}
  .exec-dbg-body{max-height:540px}
}
@media (max-width:960px){
  .exec-frame{grid-template-columns:minmax(0,1fr); padding:12px}
  .exec-code{max-height:430px}
  .exec-dbg-body{max-height:300px}
  .exec-robot svg{max-height:440px}
  .exec-legend{display:none}
}
@media (max-width:560px){
  .exec-sec .sec-head .exec-sub{display:none}
  .exec-frame{padding:10px}
  .anim-controls{padding:11px 14px}
}
@media (prefers-reduced-motion:reduce){
  .exec-rob-fade, .dbg-row{animation:none}
  .exec-code .exl{transition:none}
  .exec-progress i{transition:none}
}

</style>

'use strict';
/* ================================================================
   01. arm calibration — Line-by-Line Code Analysis
   Single source of truth: FILEDATA (exact source lines from disk)
   + PARTS (authored analysis content). All rendering is generated.
   ================================================================ */

const FILEDATA = {"README.md":["# Neurobotics — Differential Robot + 5-DOF Arm (ROS 2 Humble / Gazebo Classic)","","A simulated mobile-manipulation robot: 4-wheel differential drive base,","6-DOF arm with a 2-finger gripper, a camera mounted on the arm (the DCW2","housing near the wrist) and a 360° 2D lidar. Everything runs in Gazebo","Classic with `ros2_control`.","","```","      5-DOF arm + gripper          <- camera (DCW2 housing) looks along the arm;","          |                           line_follow.py bends the arm to aim it at","          |                           the floor (arm straight = camera sees sky)","      4-wheel diff-drive base      <- lidar on the front-right corner","```","","---","","## 1. Prerequisites","","| Software | Version | Check with |","|---|---|---|","| Ubuntu | 22.04 | `lsb_release -a` |","| ROS 2 | Humble | `ros2 --help` |","| Gazebo Classic | 11.x | `gazebo --version` |","| Python OpenCV + Tk | — | `python3 -c \"import cv2, tkinter\"` |","","Install the two Python extras if the check fails:","","```bash","sudo apt install python3-opencv python3-tk","```","","## 2. Build (one time, and after editing CMakeLists.txt / package.xml)","","From the workspace root (`~/neurobotics_ws`):","","```bash","source /opt/ros/humble/setup.bash","colcon build --symlink-install","```","","Then open the workspace in EVERY new terminal (or add it to `~/.bashrc`):","","```bash","source ~/neurobotics_ws/install/setup.bash","```","","> `--symlink-install` means most edits to `scripts/`, `launch/`, `urdf/`,","> `worlds/` and `config/` are live immediately — no rebuild needed.","","## 3. Start the simulation","","```bash","ros2 launch neurobotics gazebo.launch.py","```","","You should see, in order (give it ~20 seconds):","","1. Gazebo opens with a white floor, a black line course and three orange boxes","2. The robot spawns at the start of the line","3. Terminal prints `Configured and activated ...` for **joint_broad**, **diff_cont**, **arm_cont**","","Options:","","```bash","ros2 launch neurobotics gazebo.launch.py gui:=false    # headless (faster, no window)","ros2 launch neurobotics gazebo.launch.py rviz:=true    # also open RViz2","```","","**Quick health check** (in a second terminal, workspace sourced):","","```bash","ros2 control list_controllers        # all three should be \"active\"","ros2 topic list                      # /scan, /camera/image_raw, /joint_states, ...","```","","| Topic | What it is | Expected rate |","|---|---|---|","| `/diff_cont/cmd_vel_unstamped` | drive commands (Twist) | you publish |","| `/diff_cont/odom` | wheel odometry | 30 Hz |","| `/scan` | 360° lidar | 10 Hz |","| `/camera/image_raw` | 640×480 arm camera (DCW2) | ~5 Hz headless, ~20 Hz with GUI |","| `/joint_states` | all joint angles | 30 Hz |","| `/arm_cont/commands` | 11 arm/gripper positions | you publish |","","## 4. Test everything, step by step","","Each script runs in a **second terminal** while the simulation keeps running.","Stop any script with `Ctrl+C` (all of them halt the robot on exit).","","### 4.1 Drive teleop — `teleop.py`","","```bash","ros2 run neurobotics teleop.py","```","","| Key | Action | Key | Action |","|---|---|---|---|","| `i` / `,` | forward / backward | `1`..`0` | arm joints (see its help) |","| `j` / `l` | rotate left / right | `g` / `h` | gripper close / open |","| `k` | stop base | `SPACE` | emergency stop |","| `w` / `x` | linear speed ±10% | `q` / `z` | overall speed ±10% |","","**Pass:** robot drives **forward** when you press `i` (away from where it","spawned, along the line), rotates in place with `j`/`l`.","","### 4.2 Arm GUI — `arm_gui.py`","","```bash","ros2 run neurobotics arm_gui.py","```","","Drag the six sliders (5 joints + gripper) and watch the arm follow.","`HOME` zeroes everything; `OPEN/CLOSE GRIPPER` works the fingers.","","**Pass:** the arm moves smoothly and the gripper fingers open/close together.","","### 4.3 Line follower — `line_follow.py`","","The robot must be **at the start of the line**. If you drove it away, either","drive it back with teleop or simply restart the simulation (close Gazebo,","relaunch). Then:","","```bash","ros2 run neurobotics line_follow.py","```","","> The camera looks straight out along the arm (the same direction the","> gripper points), so with the arm straight at HOME it points at the sky","> and sees no line at all — exactly like the real robot. `line_follow.py`","> handles this itself: it first holds the base still, then bends the arm","> forward (`arm2 = arm3 = −0.70`, `arm4 = −0.87` rad), which aims the","> camera about 40° down at the floor 0.4–1.4 m ahead. On Ctrl+C it halts","> the robot and returns the arm to HOME. Just make sure nothing else","> (like `arm_gui.py`) is holding the arm in another pose while it runs.","","Two debug windows show what the robot sees (the camera's ROI and the black","line mask with a red centre dot).","","**Pass:** the robot drives along the straight, follows the curve to the","right and keeps going down the second straight — staying centred on the tape.","","### 4.4 Obstacle avoidance — `obstacle_avoid.py`","","The three orange boxes beside the line are its targets.","","```bash","ros2 run neurobotics obstacle_avoid.py","```","","The script latches its heading from the **IMU** (`/imu`) at startup and","steers back to it whenever the path is clear — wheel odometry cannot see","rotation that happens through tyre scrub, so a heading lock built on it","slowly arcs away. When a box comes within **0.85 m** of the front ±45°","sector, it steers away from whichever side of the sector the box sits on","(box on the right → dodge left, and vice versa).","","**Pass:** the robot holds a straight course, visibly swerves around the","right-side box (x ≈ 3.5) and the third box (x ≈ 5), and keeps going","straight. Keep the arm at HOME while this runs — a folded-forward arm","shows up as an obstacle dead ahead. Note the lidar sits on the","**front-right corner**, so right-side boxes are seen earlier than","left-side ones; the first box (left, x ≈ 2) is usually threaded with","clearance rather than dodged.","","### 4.5 See the lidar data — `lidar_view.py`","","Three ways, from quickest to nicest:","","```bash","ros2 topic echo /scan --once    # one full 360-beam sweep, raw numbers","ros2 topic hz /scan             # sweep rate (10 Hz)","ros2 run neurobotics lidar_view.py   # live \"mini radar\" (below)","```","","`lidar_view.py` groups the 360 beams into eight 45° sectors and prints","the nearest distance in each, twice a second — e.g.","`front:0.85m  f-left: -- m ... closest 0.85m at +12.3deg` (+ = left of","dead ahead, `--` = nothing in range). Beams that cross over the robot's","own chassis are filtered out. Point the robot at a box and watch the","front number shrink — this is exactly the signal `obstacle_avoid.py`","reacts to.","","RViz can also draw the beams in 3D (see 4.7).","","### 4.6 Velocity calibration — `calib_angular.py` / `calib_linear.py`","","These run the same procedure you used on the real robot","(`04. angular velocity calibration` / `05. linear velocity calibration`","in the NeuroBotics repo): command a known motion, measure what the robot","actually did, and compute **scale = commanded / measured**.","","```bash","ros2 run neurobotics calib_angular.py   # one commanded 360° turn","ros2 run neurobotics calib_linear.py    # one commanded 1 m straight line","```","","- **Angular** measures the actual turn from the IMU (on the real robot","  that job is done by the IMU + EKF). Wheel odometry is printed too —","  during a pivot all four wheels skid, and wheel counters cannot see","  skidding, so the two numbers clearly disagree. On the real robot you","  would store the result in the firmware with","  `config_robot.py` → `set_ros_scale_angular` (yours was 1.05); in the","  simulation a wrong scale instead points at `wheel_separation` in","  `config/my_controllers.yaml`.","- **Linear** measures the actual distance travelled from Gazebo ground","  truth (the simulation's \"tape measure\"), with odometry printed for","  comparison. The real-robot equivalent is `set_ros_scale_line`; in the","  simulation a wrong scale points at `wheel_radius`.","","**Pass:** both scales within 2 % of 1.0 (the sim should read ≈ 0.98–1.00;","start/stop transients cost a little).","","### 4.7 RViz view (optional)","","```bash","ros2 launch neurobotics gazebo.launch.py rviz:=true   # alongside the sim","# or, without Gazebo:","ros2 launch neurobotics display.launch.py             # sliders move every joint","```","","RViz shows the robot model, TF frames, the lidar scan, odometry arrows and","the camera image.","","## 5. Project structure","","```","neurobotics_ws/","├── src/neurobotics/","│   ├── urdf/neurobotics.urdf      # the robot (SolidWorks export, cleaned up)","│   ├── launch/gazebo.launch.py    # sim + controllers (event-driven spawn)","│   ├── launch/display.launch.py   # RViz only","│   ├── config/my_controllers.yaml # diff_cont / joint_broad / arm_cont","│   ├── worlds/line.world          # floor, line course, 3 obstacle boxes","│   ├── rviz/neurobotics.rviz      # pre-configured RViz2 view","│   ├── scripts/                   # teleop / arm_gui / line_follow / obstacle_avoid","│   │                              # calib_angular / calib_linear / lidar_view","│   └── meshes/                    # STL files","└── README.md","```","","## 6. Troubleshooting","","| Symptom | Cause / fix |","|---|---|","| `package 'neurobotics' not found` | You forgot `source ~/neurobotics_ws/install/setup.bash` in this terminal |","| `parser error ... robot_description:=<?xml` on launch | A Humble bug with `gazebo_ros2_control` — already worked around in the launch files; don't hand-edit how `robot_description` is passed |","| `Desired controller update period (0.0333 s) is slower than the gazebo simulation period` | **Harmless warning.** Leave it |","| Camera only ~5 Hz | Normal without the Gazebo GUI (software rendering). With `gui:=true` it runs at ~20 Hz |","| `Moved backwards in time` / robot jumps | Two simulators are running. Run **one** `ros2 launch` at a time; `pkill -f \"ros2 launch\"` then `pkill -x gzserver`, wait 3 s, relaunch |","| Robot ignores a URDF/script edit, or drives crooked after many test runs | Leftover **background processes from earlier runs** still publishing (old `ros2 launch`es serve a stale `robot_description`, old scripts keep publishing `cmd_vel`). Check with `pgrep -af \"ros2\"` and kill them all — killing only the first PID you find is not enough |","| gzserver dies right after spawn | Leftover processes from a previous run — same cleanup as above, then relaunch |","| Line follower windows don't appear | The two debug windows need a display (run on the machine's desktop, not over plain SSH). Without one the follower still runs fine — you just get no preview |","| Robot slowly creeps/rotates while idle | A Gazebo solver artifact of the wheel contacts — it freezes the moment anything publishes `cmd_vel`, which every control script here does at startup. Harmless |","| Robot drove backward / wheels spun crazily | That was a physics-stability bug, now fixed. If you re-add wheel joint `damping`/`friction` or raise wheel `effort` above ~2 N·m it can come back — see the comments in `neurobotics.urdf` |","| Scripts print `[ERROR] Could not start ROS 2` | Source both setup files (`/opt/ros/humble` and the workspace) first |","","## 7. What was fixed in this cleanup (2026-08)","","For your reference — the interesting root causes:","","1. **Camera link was missing** from the URDF (deleted during an earlier edit),","   so `line_follow.py` never had images. Restored with correct 45° mount.","2. **\"Robot drives backward\"** was *unstable wheel motors*, not wrong wiring:","   a 5 N·m velocity motor on the tiny wheel inertia overshoots every 1 ms","   physics step (one wheel was measured spinning at 52 rad/s with zero","   command). Fixed with effort 2 N·m, no joint damping/friction, and ×50","   wheel inertia (all documented inline in the URDF).","3. **Lidar + obstacle_avoid looked at the wrong beams**: the 360° scan starts","   at −180°, so slicing the array's edges read the robot's *rear*; the sensor","   also sat on the rear corner and saw its own arm. Sensor moved to the front","   frame and the script now selects beams by bearing.","4. **Launch files**: hardcoded paths → `$(find neurobotics)`, guessed sleep","   delays → controllers load on a spawn-complete event, XML comments are","   stripped before passing `robot_description` (Humble parser bug).","5. Scripts moved into the package (run with `ros2 run neurobotics ...`),","   rewritten with error handling and watchdogs; package.xml/CMakeLists","   completed; Bengali comments translated.","6. **The robot had two \"cameras\"** — a working one bolted to the chassis","   front and a dead DCW2 housing mesh on the arm. The real robot only has","   the arm camera, so the chassis camera was removed and the Gazebo sensor","   rebuilt on `arm4`, just behind the DCW2 housing. It now points **along","   the arm's tool axis** (the direction the gripper points), so the view","   physically follows the arm: arm straight = camera sees sky,","   `line_follow.py` bends the arm forward to aim it at the floor. It still","   publishes on `/camera/image_raw`, so RViz and any other listeners work","   unchanged. Gotcha discovered along the way: Gazebo's URDF→SDF conversion","   **drops any `<pose>` inside a sensor that hangs on a fixed-joint link**","   (the link gets welded into its parent and the sensor lands on the link","   origin — often inside a mesh). Sensors must sit on a link behind a real","   joint, like `arm4`.","7. **`wheel_separation` was 30 % wrong** in `my_controllers.yaml` (0.1955","   vs the URDF's true 0.15 m), so odometry under-reported every turn —","   the sim equivalent of an uncalibrated real robot. Fixed, and the new","   `calib_angular.py` would have caught it: it commands a 360° turn and","   compares the IMU against the wheels (during a pivot all four wheels","   skid, so wheel odometry over-reports by ~1.9× even when configured","   correctly — that gap is why the real robot fuses an IMU).","8. **An IMU sensor was added** to the URDF (`libgazebo_ros_imu_sensor`,","   `/imu`, 50 Hz). `obstacle_avoid.py` was rebuilt around it: steering","   away from the *side of the front sector* holding the nearest return","   (it used to always turn left), a heading latch so it resumes its","   original course after a dodge, and it refuses to drive before the","   first scan arrives.","9. **Calibration + lidar tools added** — `calib_angular.py`,","   `calib_linear.py` (the real-robot procedure, see 4.6) and","   `lidar_view.py` (sector view of `/scan`, see 4.5).","","## 8. Where to go next","","- Publish your first own node: echo the camera and threshold a colour","  (`ros2 topic echo /camera/image_raw --field width`)","- Try `rqt_image_view` to watch the camera comfortably","- Tune `line_follow.py`'s steering gains and watch the behaviour change","- Add a new static obstacle in `worlds/line.world` and re-test the avoider"],"neurobotics.urdf":["<robot","  name=\"M3Pro\">","  ","  <!-- Root link at ground level. Intentionally has no visual/collision/inertia:","       it is merged into base_link by fixed-joint reduction. -->","  <link name=\"base_footprint\"/>","    ","  <joint name=\"link2footprint\" type=\"fixed\">","        <parent link=\"base_footprint\" />","        <child link=\"base_link\" />","        <origin xyz=\"0 0 0\" rpy=\"0 0 0\"/>","  <\/joint>","  ","  <link","    name=\"base_link\">","    <inertial>","      <!-- Mass was set to 4.0 kg; inertia recomputed as a uniform box over the","           mesh bounding box (0.2764 x 0.2216 x 0.1725 m). The SolidWorks export","           carried inertia values from a much lighter part, which made the","           chassis unrealistically twitchy in the simulator. -->","      <origin"," e=\"rwheel2\"><mu1>1.2<\/mu1><mu2>1.2<\/mu2><\/gazebo>","  <gazebo reference=\"base_link\"><mu1>0.5<\/mu1><mu2>0.5<\/mu2><\/gazebo>","","  <!-- ============ Sensors ============ -->","  <!-- The ray sensor sits on laser1_frame, the FRONT-right corner mount","       (laser0_frame at the rear would sweep across the robot's own arm).","       Beams leave the body immediately toward the front; rear/left beams","       partly hit the chassis - obstacle_avoid.py filters those out. -->","  <gazebo reference=\"laser1_frame\">","    <sensor type=\"ray\" name=\"lidar_front\">","      <pose>0 0 0.06 0 0 0<\/pose>","      <always_on>true<\/always_on>","      <update_rate>10<\/update_rate>","      <visualize>false<\/visualize>","      <ray>","        <scan><horizontal>","          <samples>360<\/samples><resolution>1.0<\/resolution>","          <min_angle>-3.14159<\/min_angle><max_angle>3.14159<\/max_angle>","        <\/horizontal><\/scan>","        <range><min>0.2<\/min><max>8.0<\/max><resolution>0.01<\/resolution><\/range>","        <noise><type>gaussian<\/type><mean>0.0<\/mean><stddev>0.01<\/stddev><\/noise>","      <\/ray>","      <plugin name=\"lidar_plugin\" filename=\"libgazebo_ros_ray_sensor.so\">","        <ros><remapping>~/out:=/scan<\/remapping><\/ros>","        <output_type>sensor_msgs/LaserScan<\/output_type>","        <frame_name>laser1_frame<\/frame_name>","      <\/plugin>","    <\/sensor>","  <\/gazebo>","  <!-- IMU on the chassis. Wheel odometry cannot see yaw that happens through","       tyre scrub (both wheels rolling equally while the body still rotates),","       so scripts that need a trustworthy heading (obstacle_avoid, the","       velocity calibration) read /imu instead - the same role the IMU+EKF","       play on the real robot. -->","  <gazebo reference=\"base_link\">","    <sensor name=\"imu\" type=\"imu\">","      <always_on>true<\/always_on>","      <update_rate>50<\/update_rate>","      <plugin name=\"imu_plugin\" filename=\"libgazebo_ros_imu_sensor.so\">","        <ros><remapping>~/out:=/imu<\/remapping><\/ros>","        <frame_name>base_link<\/frame_name>","        <initial_orientation_as_reference>false<\/initial_orientation_as_reference>","      <\/plugin>","    <\/sensor>","  <\/gazebo>","  <gazebo reference=\"arm4\">","    <sensor type=\"camera\" name=\"arm_camera\">","      <!-- The robot's only camera, physically the DCW2 housing on arm4 near","           the wrist. GOTCHA: the sensor is NOT attached to the DCW2 link.","           Gazebo welds fixed-joint links into their parent, and in the","           process DROPS any <pose> inside sensors on the welded-away link","           (the lidar's 6 cm z-offset was silently eaten the same way). The","           sensor would land on DCW2's origin, INSIDE its housing mesh, and","           only ever see grey. So the sensor hangs on arm4 (a real link).","           MOUNT DIRECTION: the optical axis is PARALLEL to the arm's tool","           axis (arm4's +Z - the direction the gripper points), with the","           sensor pushed out behind the DCW2 housing so no mesh blocks the","           view. Consequence, deliberately physical: with the arm straight","           (all joints 0) the camera looks straight UP and sees only sky -","           NOT the floor. To look at the floor/line, the arm must pitch","           forward: e.g. arm2=-0.70, arm3=-0.70, arm4=-0.87 rad tips the","           view 40 deg below horizontal, seeing the floor 0.4-1.4 m ahead","           of the base (line_follow.py commands exactly this pose). -->","      <pose>-0.077 0.0025 0.058 0 -1.5708 0<\/pose>","      <always_on>true<\/always_on>","      <update_rate>20<\/update_rate>","      <visualize>false<\/visualize>","      <camera>","        <horizontal_fov>1.085<\/horizontal_fov>","        <image><width>640<\/width><height>480<\/height><format>R8G8B8<\/format><\/image>","        <clip><near>0.02<\/near><far>300<\/far><\/clip>","      <\/camera>","      <plugin name=\"camera_plugin\" filename=\"libgazebo_ros_camera.so\">","        <ros>","          <!-- Fully-qualified names: '~'-relative remappings are not applied","               by this plugin, topics then stay under /arm_camera/... -->","          <remapping>/arm_camera/image_raw:=/camera/image_raw<\/remapping>","          <remapping>/arm_camera/camera_info:=/camera/camera_info<\/remapping>","        <\/ros>","        <frame_name>DCW2<\/frame_name>","      <\/plugin>","    <\/sensor>","  <\/gazebo>","<\/robot>"],"my_controllers.yaml":["controller_manager:","  ros__parameters:","    update_rate: 30","    use_sim_time: true","","    diff_cont:","      type: diff_drive_controller/DiffDriveController","    joint_broad:","      type: joint_state_broadcaster/JointStateBroadcaster","    arm_cont:","      type: position_controllers/JointGroupPositionController","","diff_cont:","  ros__parameters:","    use_sim_time: true","    left_wheel_names: [\"lwheel1_Joint\", \"lwheel2_Joint\"]","    right_wheel_names: [\"rwheel1_Joint\", \"rwheel2_Joint\"]","    wheel_separation: 0.15      # TRUE value: wheel joints sit at y = +-0.075 in","                                # the URDF. Was 0.1955 (30% too big), which made","                                # odometry under-report every turn - robots drove","                                # arcs while /diff_cont/odom claimed \"straight\".","                                # Check this like a real calibration: command a","                                # 360 deg spin and compare against reality.","    wheel_radius: 0.04","    publish_rate: 30.0","    odom_frame_id: odom","    base_frame_id: base_footprint","    enable_odom_tf: true","    cmd_vel_timeout: 0.5","    use_stamped_vel: false","    linear:","      x:","        has_velocity_limits: true","        max_velocity: 1.0","        max_acceleration: 1.0","        has_acceleration_limits: true","    angular:","      z:","        has_velocity_limits: true","        max_velocity: 2.0","        max_acceleration: 2.0","        has_acceleration_limits: true","","joint_broad:","  ros__parameters:","    publish_rate: 30.0","","arm_cont:","  ros__parameters:","    use_sim_time: true","    joints:","      - arm1_Joint","      - arm2_Joint","      - arm3_Joint","      - arm4_Joint","      - arm5_Joint","      - rlink1_Joint","      - rlink2_Joint","      - llink1_Joint","      - llink2_Joint","      - rlink3_Joint","      - llink3_Joint"],"display.launch.py":["\"\"\"Visualise the robot description in RViz2 (no Gazebo needed).","","By default the joint_state_publisher_gui lets you move every joint with","sliders - useful for checking the URDF before simulating.","","Usage:","  ros2 launch neurobotics display.launch.py            # sliders + RViz","  ros2 launch neurobotics display.launch.py sim:=true # next to a running","                                                      # Gazebo sim (live state)","\"\"\"","","import os","import re","from subprocess import check_output","","from ament_index_python.packages import get_package_share_directory","","from launch import LaunchDescription","from launch.actions import DeclareLaunchArgument","from launch.conditions import UnlessCondition","from launch.substitutions import LaunchConfiguration","","from launch_ros.actions import Node","from launch_ros.parameter_descriptions import ParameterValue","","","def load_urdf(urdf_file):","    \"\"\"Run xacro on the URDF and return it as a clean parameter string.","","    Same normalisation as gazebo.launch.py: strips the XML declaration,","    comments and newlines so the string is safe to pass through rcl","    parameter overrides (gazebo_ros2_control issue #247).","    \"\"\"","    xml = check_output(['xacro', urdf_file], text=True)","    if xml.lstrip().startswith('<?xml'):","        xml = xml.split('?>', 1)[1]","    xml = re.sub(r'<!--.*?-->', ' ', xml, flags=re.DOTALL)","    return ' '.join(xml.split())","","","def generate_launch_description():","    pkg = get_package_share_directory('neurobotics')","    urdf_file = os.path.join(pkg, 'urdf', 'neurobotics.urdf')","    rviz_config = os.path.join(pkg, 'rviz', 'neurobotics.rviz')","","    robot_description = ParameterValue(","        load_urdf(urdf_file),","        value_type=str,","    )","","    use_sim_time = LaunchConfiguration('use_sim_time')","","    robot_state_publisher = Node(","        package='robot_state_publisher',","        executable='robot_state_publisher',","        parameters=[{","            'robot_description': robot_description,","            'use_sim_time': use_sim_time,","        }],","        output='screen',","    )","","    # The slider GUI only makes sense when no simulator publishes states.","    joint_state_publisher_gui = Node(","        package='joint_state_publisher_gui',","        executable='joint_state_publisher_gui',","        condition=UnlessCondition(use_sim_time),","    )","","    rviz2 = Node(","        package='rviz2',","        executable='rviz2',","        arguments=['-d', rviz_config],","        parameters=[{'use_sim_time': use_sim_time}],","        output='screen',","    )","","    return LaunchDescription([","        DeclareLaunchArgument(","            'use_sim_time', default_value='false',","            description='Set true when Gazebo is running simultaneously'),","        robot_state_publisher,","        joint_state_publisher_gui,","        rviz2,","    ])"],"gazebo.launch.py":["\"\"\"Bring up the Neurobotics robot in Gazebo Classic with ros2_control.","","Starts:","  1. Gazebo (gzserver + gzclient) with the line-following world","  2. robot_state_publisher (URDF from xacro, so $(find ...) paths resolve)","  3. spawn_entity to insert the robot once Gazebo is ready","  4. All three controllers, but only AFTER the robot is spawned (event-driven,","     no guessed delays)","","Usage:","  ros2 launch neurobotics gazebo.launch.py                 # full GUI","  ros2 launch neurobotics gazebo.launch.py gui:=false      # headless (fast)","  ros2 launch neurobotics gazebo.launch.py rviz:=true      # also open RViz2","\"\"\"","","import os","import re","from subprocess import check_output","","from ament_index_python.packages import get_package_share_directory","","from launch import LaunchDescription","from launch.actions import DeclareLaunchArgument, IncludeLaunchDescription, \\","    RegisterEventHandler","from launch.conditions import IfCondition","from launch.event_handlers import OnProcessExit","from launch.launch_description_sources import PythonLaunchDescriptionSource","from launch.substitutions import LaunchConfiguration","","from launch_ros.actions import Node","from launch_ros.parameter_descriptions import ParameterValue","","","def load_urdf(urdf_file):","    \"\"\"Run xacro on the URDF and return it as a clean parameter string.","","    xacro resolves $(find neurobotics) inside the URDF (the controller YAML","    path). The XML declaration, comments and newlines must then be removed:","    gazebo_ros2_control on Humble forwards robot_description through rcl's","    argument parser, which rejects '<?xml' declarations and the '--' inside","    XML comments (see gazebo_ros2_control issue #247). The comments stay in","    the URDF file itself - they are only stripped from the runtime string.","    \"\"\"","    xml = check_output(['xacro', urdf_file], text=True)","    if xml.lstrip().startswith('<?xml'):","        xml = xml.split('?>', 1)[1]","    xml = re.sub(r'<!--.*?-->', ' ', xml, flags=re.DOTALL)","    return ' '.join(xml.split())","","","def generate_launch_description():","    pkg = get_package_share_directory('neurobotics')","    urdf_file = os.path.join(pkg, 'urdf', 'neurobotics.urdf')","    rviz_config = os.path.join(pkg, 'rviz', 'neurobotics.rviz')","    world_file = os.path.join(pkg, 'worlds', 'line.world')","","    robot_description = ParameterValue(","        load_urdf(urdf_file),","        value_type=str,","    )","","    gui = LaunchConfiguration('gui')","    rviz = LaunchConfiguration('rviz')","","    gazebo = IncludeLaunchDescription(","        PythonLaunchDescriptionSource(","            os.path.join(get_package_share_directory('gazebo_ros'),","                         'launch', 'gazebo.launch.py')),","        launch_arguments={","            'world': world_file,","            'gui': gui,","        }.items(),","    )","","    robot_state_publisher = Node(","        package='robot_state_publisher',","        executable='robot_state_publisher',","        parameters=[{","            'robot_description': robot_description,","            'use_sim_time': True,","        }],","        output='screen',","    )","","    spawn_robot = Node(","        package='gazebo_ros',","        executable='spawn_entity.py',","        arguments=['-topic', 'robot_description',","                   '-entity', 'neurobotics', '-z', '0.01'],","        output='screen',","    )","","    # Controllers are loaded only after the robot exists in Gazebo.","    joint_state_broadcaster = Node(","        package='controller_manager',","        executable='spawner',","        arguments=['joint_broad'],","        output='screen',","    )","    diff_drive_controller = Node(","        package='controller_manager',","        executable='spawner',","        arguments=['diff_cont'],","        output='screen',","    )","    arm_controller = Node(","        package='controller_manager',","        executable='spawner',","        arguments=['arm_cont'],","        output='screen',","    )","","    rviz_node = Node(","        package='rviz2',","        executable='rviz2',","        arguments=['-d', rviz_config],","        parameters=[{'use_sim_time': True}],","        condition=IfCondition(rviz),","    )","","    load_controllers_after_spawn = RegisterEventHandler(","        OnProcessExit(","            target_action=spawn_robot,","            on_exit=[","                joint_state_broadcaster,","                diff_drive_controller,","                arm_controller,","            ],","        )","    )","","    return LaunchDescription([","        DeclareLaunchArgument(","            'gui', default_value='true',","            description='Start the Gazebo GUI (set false for headless runs)'),","        DeclareLaunchArgument(","            'rviz', default_value='false',","            description='Also start RViz2 with the package RViz config'),","        gazebo,","        robot_state_publisher,","        spawn_robot,","        load_controllers_after_spawn,","        rviz_node,","    ])"]};
const PARTS = [{"n":1,"id":"part-01","fname":"README.md","enTitle":"Workspace Overview & Prerequisites","lang":"bash","start":1,"end":48,"flags":[],"explain":[{"a":1,"b":1,"text":"গোটা series-এর অষ্টম থামা: এবার কোনো একক প্রোগ্রাম নয়, পুরো workspace-ই আমাদের বিষয়। Title-এর প্রথম শব্দ <code>Neurobotics<\/code> — ROS 2 package-র নাম, আর workspace-এর নাম <code>neurobotics_ws<\/code>; URDF-এর ভেতরে robot-এর নিজের নাম <code>M3Pro<\/code> (Part 4-এ দেখবে)। <code>5-DOF Arm<\/code> লেখাটি খেয়াল করো, কারণ গল্পটা পরের লাইনেই মোড় নেয়: শিরোনাম বলছে 5-DOF, লাইন 4 বলবে <code>6-DOF<\/code>! বিচারক URDF-ই: arm chain-এ পাঁচটি revolute joint, arm1 থেকে arm5 (Part 5)। বন্ধনীতে জোড়া হাতিয়ার: <code>ROS 2 Humble<\/code> + <code>Gazebo Classic<\/code> — এই জুটির বুকেই <code>ros2_control<\/code> গোটা দুনিয়া দাঁড়াবে।"},{"a":3,"b":6,"text":"চার লাইনের সারসংক্ষেপ, প্রতিটি শব্দ ভারী। <code>4-wheel differential drive base<\/code> — দুই চাকা নয়, চার চাকা: controller দুটি বাম চাকাকে এক দল, দুটি ডান চাকাকে আরেক দল ধরে চালায় (Part 9, 11)। <code>6-DOF arm with a 2-finger gripper<\/code> — এই দাবিটি নিয়ে সতর্ক থাকো: URDF-তে arm-এ মাত্র পাঁচটি revolute joint (arm1_Joint থেকে arm5_Joint), ষষ্ঠ স্বাধীনতা নেই; gripper-এর ছয়টি joint থাকলেও মোটর একটিই (Part 6)। <code>camera mounted on the arm<\/code>, <code>DCW2<\/code> housing-এ — এই নামটি পরে বারবার ফিরবে (Part 7, 10)। <code>360° 2D lidar<\/code> দেখবে সব দিক। সবকিছু চলবে Gazebo Classic-এ, নিয়ন্ত্রণ <code>ros2_control<\/code>-এ।"},{"a":8,"b":13,"text":"এই ছোট্ট আঁকাটি আসলে গোটা workspace-এর ব্যবহারের নকশা। ওপরের ব্লক: <code>5-DOF arm + gripper<\/code>, আর পাশের মন্তব্য — camera (DCW2 housing) arm-এর বরাবর তাকিয়ে থাকে; সুতরাং <code>line_follow.py<\/code>-এর মেঝে দেখতে হলে arm বাঁকাতে হয়, arm সোজা থাকলে camera আকাশ ছাড়া কিছুই দেখে না। এই এক লাইনেই 4.3 নম্বর টেস্টের পুরো নাটক। নিচের ব্লক: <code>4-wheel diff-drive base<\/code>, পাশে মন্তব্য — lidar বসে <code>front-right corner<\/code>-এ (Part 10-এ দেখবে laser1_frame), কারণ পেছনে বসালে নিজের arm-ই স্ক্যানে ধরা পড়ত। দুটো নকশা-সিদ্ধান্তই পরের পার্টগুলোর কেন্দ্রবিন্দু।"},{"a":15,"b":17,"text":"Markdown-এর <code>---<\/code> রেখা README-কে ভাগ করে: এখান থেকে শুরু সংখ্যায়ন করা আটটি সেকশনের যাত্রা — Prerequisites, Build, Start, Test, Structure, Troubleshooting, Fix log, Next steps। <code>## 1. Prerequisites<\/code> মানে স্ক্রিনে যা আগে দরকার। ভাবনাটা সাধারণ কাগজের চেয়ে একটু গভীর: ROS 2 প্রজেক্ট একা চলে না — নির্দিষ্ট OS-এর ওপর নির্দিষ্ট সংস্করণের টুলচেইন লাগে, আর এই সিমুলেটরের স্ক্রিপ্টগুলোর নিজস্ব লাইব্রেরির চাহিদাও আছে। তাই প্রথম কাজ মেলানো: নিচের টেবিলের চার সারি একে একে যাচাই করা — একটিও বাদ গেলে পরের সেকশনের কমান্ড চলবে না, ভুল জায়গায় সময় হারাবে।"},{"a":19,"b":24,"text":"চার সারির যাচাই-টেবিল, প্রতিটিতে রোগ ধরার কমান্ড। <code>Ubuntu 22.04<\/code> — ROS 2 Humble আনুষ্ঠানিকভাবে এই LTS-এর জন্য বানানো, <code>lsb_release -a<\/code> বলে দেবে তুমি কোথায় আছ। <code>ROS 2 Humble<\/code> — <code>ros2 --help<\/code> চালু থাকলে বোঝা যায় underlay sourced। <code>Gazebo Classic 11.x<\/code> — খেয়াল করো নতুন gz-sim নয়, পুরনো Classic শাখা; <code>gazebo --version<\/code> মিলিয়ে নাও, কারণ এই URDF সরাসরি Classic-এর plugin (যেমন <code>libgazebo_ros2_control.so<\/code>, Part 10) ধরে বসে। শেষ সারি <code>python3 -c \"import cv2, tkinter\"<\/code> — OpenCV আর Tk, দুটোই নীরবে import হলে পাশ। কেউ ব্যর্থ হলে প্রতিকার ঠিক নিচে।"},{"a":26,"b":30,"text":"যাচাই ব্যর্থ হলে প্রতিকার এক লাইনে: <code>sudo apt install python3-opencv python3-tk<\/code>। এই দুটি Python extra কার জন্য, তা পরের সেকশনেই স্পষ্ট হবে — <code>line_follow.py<\/code> ছবি দেখাতে OpenCV (cv2) টানে — সাত স্ক্রিপ্টের মধ্যে cv2 একটিই, <code>arm_gui.py<\/code>-র স্লাইডার-জানালা বানায় Tk (tkinter) দিয়ে; <code>lidar_view.py<\/code>-সহ terminal-কেন্দ্রিক বাকি স্ক্রিপ্টের এ-ব্যাপারে কোনো দাবি নেই। <code>apt<\/code> দিয়ে ইনস্টলের মানে: সিস্টেমের Python-এর সঙ্গেই package বসে, <code>ros2 run<\/code> যে interpreter দিয়ে স্ক্রিপ্ট তোলে সেটিই এদের খুঁজে পাবে — আলাদা virtual environment গোছানোর দরকার নেই, সেই ঝামেলাও নেই। ছোট পছন্দ, কিন্তু ভিত্তি এঁকে দেয়।"},{"a":32,"b":34,"text":"<code>## 2. Build<\/code>-এর পাশের বন্ধনী পুরো কথাটা বলে দেয়: <code>one time, and after editing CMakeLists.txt / package.xml<\/code>। colcon হলো ROS 2-র বিল্ড-অর্গানাইজার — এটি <code>src/<\/code>-এর package পড়ে, <code>install/<\/code> ফোল্ডার বানায়, যেখান থেকে launch আর <code>ros2 run<\/code> জিনিস তোলে। <code>CMakeLists.txt<\/code> আর <code>package.xml<\/code> package-এর জন্মসনদ — কোন স্ক্রিপ্ট install হবে, কোন নির্ভরতা লাগবে তা এরাই লেখে; এদের বদলালে আবার build দিতে হবে। কিন্তু বাকি সব ফাইলের জন্য সেই নিয়ম নয় — README-র সবচেয়ে দামি মন্তব্যটি অপেক্ষা করছে (ln 47-48)। আপাতত ঠিকানা: <code>~/neurobotics_ws<\/code>, workspace-এর root।"},{"a":36,"b":39,"text":"দুই কমান্ডের ক্রম ভুললে চলবে না। আগে <code>source /opt/ros/humble/setup.bash<\/code> — ROS-এর নিজের টুল (colcon থেকে ros2 CLI পর্যন্ত) বসে এই underlay-তে; এটি না মেলালে shell পরের লাইনের <code>colcon<\/code>-ই চিনবে না। তারপর <code>colcon build --symlink-install<\/code> — <code>src/neurobotics<\/code> package কম্পাইল হয়ে <code>install/<\/code>-এ বসবে। আসল তারকাটি হলো <code>--symlink-install<\/code> ফ্ল্যাগ: ফাইল কপি না করে সিমlink পাতানো হয়, ফলে <code>scripts/<\/code>, <code>launch/<\/code>, <code>urdf/<\/code>, <code>worlds/<\/code>, <code>config/<\/code>-এর সম্পাদনা পরের launch-এ সরাসরি জ্বলে ওঠে — rebuild ছাড়াই। এই এক ফ্ল্যাগই folder 08-এর পরীক্ষার-চক্রকে দ্রুত করে: URDF বদলাও, সেভ করো, relaunch করো।"},{"a":41,"b":45,"text":"Build একবারই, কিন্তু environment মেলানো প্রতিটি নতুন terminal-এ: <code>source ~/neurobotics_ws/install/setup.bash<\/code>। কারণ ROS-এর স্তরবিন্যাসে: প্রতিটি terminal আলাদা shell, আর setup না চালালে সে জানেই না তার এলাকায় <code>neurobotics<\/code> নামের package আছে — তখন <code>ros2 launch neurobotics ...<\/code> রাগী উত্তর দেবে, <code>package not found<\/code> (Part 3-এর troubleshooting টেবিলের প্রথম সারি ঠিক এটাই)। বিরক্তিকর লাগলে লাইনটি <code>~/.bashrc<\/code>-এ লিখে রাখো — প্রতিটি নতুন shell খুলতেই নিজে নিজে sourced হবে; সেই সঙ্গে একটা সতর্কতাও থেকে যায়: কোন terminal কোন স্তরে আছে, সচেতন থাকো।"},{"a":47,"b":48,"text":"README-র সবচেয়ে কাজের জ্ঞান-বাক্সটি এই blockquote: <code>--symlink-install<\/code> মানে <code>scripts/<\/code>, <code>launch/<\/code>, <code>urdf/<\/code>, <code>worlds/<\/code>, <code>config/<\/code>-এর বেশিরভাগ সম্পাদনা তৎক্ষণাৎ কার্যকর — rebuild লাগে না। কেন এমন: এই ফোল্ডারের ফাইল <code>install/<\/code>-এ কপি নয়, link হয়ে বসে; source বদলালে link-ই নতুন বিষয়বস্তু দেখায়। সীমাটাও মনে রেখো: <code>CMakeLists.txt<\/code> বা <code>package.xml<\/code> বদলালে (কোন ফাইল install হবে সেই তালিকাই তখন বদলাচ্ছে) পুরো build আবার দিতে হবে — ln 32-এর বন্ধনী-কথা। Folder 08-এর অভিযান জুড়ে তুমি URDF আর launch file ঘাঁটবে বারবার; নিয়মটা জানা থাকলে প্রতিটি পরীক্ষার আগের অপেক্ষা সেকেন্দে বোঝা যাবে।"}],"math":null,"robot":{"correct":"দুই সেটআপ মিলিয়ে <code>colcon build --symlink-install<\/code> চালালে <code>install/<\/code>-এ package বসে; নতুন terminal-এ <code>source .../install/setup.bash<\/code> দিলে <code>ros2 launch neurobotics gazebo.launch.py<\/code> কাজ করে, tab-ও package-এর নাম জানে। <code>python3 -c \"import cv2, tkinter\"<\/code> নীরবে পাশ হলে arm_gui-র স্লাইডার আর line_follow-এর দুই ডিবাগ-জানালা নির্দ্বিধায় খুলবে। আর symlink-এর দরুন URDF-র সামান্য সম্পাদনাও সেভ করামাত্র পরের launch-এ সজীব — rebuild লাগে না।","incorrect":"প্রথম ফাঁদ: নতুন terminal-এ workspace source না করেই launch চালানো — <code>package 'neurobotics' not found<\/code> ভুলটা README-র দোষ নয়, তোমার terminal-এর। দ্বিতীয় ফাঁদ: <code>6-DOF arm<\/code> পড়ে URDF-এ ছয়টি arm joint খোঁজা — চেইনে পাঁচটিই (arm1..arm5); gripper-এর ছয় joint এক মোটরের অধীনে mimic। তৃতীয় ফাঁদ: প্রতিটি URDF সম্পাদনার পরেই <code>colcon build<\/code> চালানো — symlink-install থাকতে এত অপেক্ষা বৃথা; build লাগে শুধু CMakeLists বা package.xml বদলালে।"},"animType":null},{"n":2,"id":"part-02","fname":"README.md","enTitle":"Simulation Bring-up & Test Scripts","lang":"bash","start":49,"end":223,"flags":[],"explain":[{"a":50,"b":54,"text":"এবার পর্দা তোলা: <code>ros2 launch neurobotics gazebo.launch.py<\/code>। এক লাইনের পেছনে Part 13-এ বিশ্লেষণ করা launch file-টি চারটি কাজ সাজিয়ে রাখে — আগে Gazebo (gzserver + gzclient) ওঠে <code>worlds/line.world<\/code> হাতে, তারপর <code>robot_state_publisher<\/code> URDF-কে TF frame-এ ভাসায়, তারপর <code>spawn_entity<\/code> robot-কে ভেতরে ঢোকায়, শেষে তিনটি controller — আর সেই শেষ ধাপটি ঘটে শুধুই spawn শেষ হওয়ার event-এ, কোনো অনুমানের sleep ছাড়াই। <code>launch<\/code> আর <code>run<\/code>-এর পার্থক্য এখানেই: launch একটি রেসিপি-ফাইল পড়ে তার ভেতরের পুরো দলটিকে একসঙ্গে মঞ্চে তোলে; <code>neurobotics<\/code> package-র নাম, <code>gazebo.launch.py<\/code> রেসিপি।"},{"a":56,"b":60,"text":"সফল উত্থানের তিন দৃশ্য, নিজ চোখেই যাচাই করো — প্রায় 20 সেকেন্ড সময় দাও। এক, Gazebo খুলবে সাদা মেঝে, কালো লাইন-কোর্স আর তিনটি কমলা বাক্স নিয়ে — এই সাজসরঞ্জাম <code>worlds/line.world<\/code> ফাইলের দান, robot-এর নয়। দুই, robot জন্মাবে লাইনের শুরুতে — spawn_entity-র <code>-z 0.01<\/code>-এর খুঁটিনাটি Part 13-এ। তিন, terminal ছাপবে <code>Configured and activated ...<\/code> — joint_broad, diff_cont, arm_cont-এর জন্য; এই তিন নাম এসেছে <code>my_controllers.yaml<\/code> থেকে (Part 11)। ক্রমটা ভাঙা দেখলে বুঝবে event-চেইন কোথাও আটকেছে — কোথায়, তার মানচিত্র Part 3-এর troubleshooting টেবিলে।"},{"a":62,"b":67,"text":"দুটি launch-অপশন, দুটি আলাদা দরকারে। <code>gui:=false<\/code> — headless: Gazebo-র 3D জানালা না খুলে শুধু physics-server চলে, তাই দ্রুত ও হালকা; খরচ হিসেবে camera-র rate নেমে আসে প্রায় 5 Hz-এ (software rendering), সত্যটা পরের টেবিলেই লেখা। <code>rviz:=true<\/code> — সিমুলেশনের পাশে RViz2-ও খুলবে, যেখানে TF frame, lidar রশ্মি, odometry তির আলাদা স্তরে দেখা যায় (4.7 নম্বর টেস্ট)। এই gui আর rviz নামের দুটি ঝুলি launch file-এর <code>DeclareLaunchArgument<\/code>-এ গাঁথা — gui-র ডিফল্ট true, rviz-এর false; কিছু না বললে পুরো জানালা-বাহার খুলবে, শান্ত headless চাইলে স্পষ্ট বলতে হবে (Part 13)।"},{"a":69,"b":74,"text":"দ্বিতীয় terminal-এ (workspace sourced অবস্থায়) দুই কমান্ডের স্বাস্থ্য-পরীক্ষা। <code>ros2 control list_controllers<\/code> — controller_manager-এর কাছে তালিকা চাওয়া; তিনটিই <code>active<\/code> দেখালে বুঝো diff_cont, joint_broad, arm_cont প্রাণবন্ত। <code>ros2 topic list<\/code> — কথা বলার সব চ্যানেলের তালিকা; <code>/scan<\/code>, <code>/camera/image_raw<\/code>, <code>/joint_states<\/code> উঠে এলে sensor-ত্রয়ী আর state-প্রকাশক সবাই মঞ্চে। এই দুটি কমান্ডই রোগ-নির্ণয়ের প্রথম ধাপ: controller না দেখালে সন্দেহ URDF-র ros2_control block-এ (Part 9), topic না দেখালে Gazebo sensor layer-এ (Part 10)। কোন স্তরে ঢুকলে কী মিলবে, এই app-এর পরের পার্টগুলোই সেই মানচিত্র।"},{"a":76,"b":83,"text":"ছয় সারির topic-টেবিল — গোটা workspace-এর রক্তসঞ্চালনের নকশা। তুমি প্রকাশ করবে দুটি: <code>/diff_cont/cmd_vel_unstamped<\/code> (Twist চালনা-আদেশ) আর <code>/arm_cont/commands<\/code> (11টি arm/gripper position)। Robot প্রকাশ করবে বাকি চারটি: <code>/diff_cont/odom<\/code> wheel-odometry 30 Hz-এ, <code>/scan<\/code> 360° lidar 10 Hz-এ, <code>/camera/image_raw<\/code> 640x480 arm-camera — প্রায় 5 Hz headless, 20 Hz GUI-সহ, <code>/joint_states<\/code> সব joint-এর কোণ 30 Hz-এ। হার-গুলোর জবাবও আছে: sensor block-এর <code>update_rate<\/code> (Part 10) আর yaml-এর <code>publish_rate<\/code> (Part 11)। নিচের প্রতিটি টেস্ট এই টেবিলের কোনো না কোনো সারির ওপর দাঁড়িয়ে।"},{"a":85,"b":88,"text":"সেকশন 4: একে একে সাতটি পরীক্ষা। নিয়ম তিনটি। প্রতিটি স্ক্রিপ্ট চলবে <code>second terminal<\/code>-এ, সিমুলেশন চলতে চলতেই — স্ক্রিপ্টরা স্বাধীন node, ওপরের topic-টেবিলের সুতো ধরেই robot-এর সঙ্গে কথা বলে। <code>Ctrl+C<\/code> চাপলে সব স্ক্রিপ্ট robot-কে থামিয়ে বেরিয়ে যাবে — স্বয়ংক্রিয় থামানোটা নম্রতা নয়, watchdog: কীবোর্ড ছেড়ে দিলেও চলমান robot পথে রাখা যায়। আর একটি স্বীকারোক্তি শুরুতেই: এই স্ক্রিপ্টগুলো folder 01-07-এ বিশ্লেষণ করা প্রোগ্রামেরই প্রতিলিপি — teleop (02), arm_gui (01), line_follow (06), obstacle_avoid (07), calib জোড়া (04, 05); এখানে নতুন বিষয় robot model, তাই README-র এই অংশ কেবল তাদের ব্যবহারের নির্দেশিকা।"},{"a":90,"b":94,"text":"প্রথম পরীক্ষা 4.1: <code>ros2 run neurobotics teleop.py<\/code> — কীবোর্ড বসে বসে বেস আর arm দুটোই চালানোর টেলিঅপ। <code>ros2 run<\/code> মানে: এই একটি executable ধরে একটিমাত্র node চালাও — launch-এর মতো পুরো দল নয়। স্ক্রিপ্টটি terminal-কে কীবোর্ড বানিয়ে নেয়: কী চাপা মাত্রই সেই গতিটা <code>/diff_cont/cmd_vel_unstamped<\/code>-এ Twist হয়ে ল্যাচ হয়ে যায় — ছাড়লে থেমে যায় না, চলতেই থাকে; থামাতে আলাদা কী (<code>k<\/code> বা জরুরি-ব্রেক <code>SPACE<\/code>) চাপতে হয়, তাই-ই ওই স্টপ-কীগুলো টেবিলে আছে। এটিই সবচেয়ে কম নির্ভরতার পরীক্ষা — camera নয়, lidar নয়; দরকার শুধু চালনা-চ্যানেল সচল থাকা। তাই পাশের pass-মানদণ্ডও সরলতম: <code>i<\/code> চাপলে robot সামনে যাবে কি না। সেই সামনে-যাওয়ার পেছনের চাকা-চুক্তি পরের ব্লকে।"},{"a":96,"b":104,"text":"কী-টেবিলটা দুই ভাগের: বাম পাল্লায় বেস, ডান পাল্লায় arm। বেস: <code>i<\/code>/<code>,<\/code> সামনে/পিছনে, <code>j<\/code>/<code>l<\/code> বামে/ডানে ঘোরা, <code>k<\/code> থামো, <code>w<\/code>/<code>x<\/code> linear speed শতকরা দশ ধাপ, <code>q<\/code>/<code>z<\/code> সামগ্রিক গতি। Arm: <code>1<\/code>..<code>0<\/code> কীগুলো joint ধরে ধরে (স্ক্রিপ্টের help দেখো), <code>g<\/code>/<code>h<\/code> gripper বন্ধ/খোলা, <code>SPACE<\/code> জরুরি থামা। Pass-মানদণ্ড সুনির্দিষ্ট: <code>i<\/code> চাপলে robot সামনে যাবে — জন্মস্থান থেকে লাইন বেয়ে দূরে, <code>j<\/code>/<code>l<\/code>-এ জায়গায় দাঁড়িয়ে ঘুরবে। এই সরল বাক্যটিই URDF-র axis-sign চুক্তির প্রমাণ: Part 8 দেখাবে, বাম চাকার rpy -1.5708-এ axis 0 0 1 হলে ধনাত্মক চাকা-বেগ মানেই সামনে — উল্টো গেলে সাইন-চুক্তি ভাঙা।"},{"a":106,"b":110,"text":"দ্বিতীয় পরীক্ষা 4.2: <code>ros2 run neurobotics arm_gui.py<\/code> — arm-এর জন্য স্লাইডার-জানালা, বেস ছাড়া। এখানেই কাজে পড়বে Part 1-এ ইনস্টল করা <code>tkinter<\/code>: জানালা, বোতাম, স্লাইডার সব Tk-র আঁকা। GUI বলে দিলেই স্ক্রিপ্ট স্লাইডারের অবস্থান সংখ্যায় ভেঙে <code>/arm_cont/commands<\/code>-এ পাঠায় — মুখ Tk-র, হাত ওই একই topicের, যেখানে অন্য যেকোনো প্রোগ্রামও লিখতে পারে। পরীক্ষার মূল্য এখানে: টেলিঅপে তুমি অন্ধভাবে কী চেপেছিলে, এখানে চোখের সামনে স্লাইডার টেনে দেখবে প্রতিটি joint সাড়া দেয় কি না, কোন দিকে মোড়ে — URDF-র joint-এর সীমাও (Part 5-এর limit) এখানেই শরীরে অনুভূত হবে।"},{"a":112,"b":115,"text":"ছয়টি স্লাইডার — পাঁচটা arm joint, একটা gripper; ড্র্যাগ করলেই arm সে ভঙ্গিতে চলে যায়। <code>HOME<\/code> বোতাম সবকিছুকে শূন্যে ফেরায় — URDF-র সব joint-এর origin-ভঙ্গি, arm সোজা হয়ে দাঁড়ায়; মনে রেখো, ঠিক এই HOME ভঙ্গিতেই camera সোজা ওপরে তাকিয়ে থাকে (পরের পরীক্ষার মূল শর্ত)। <code>OPEN/CLOSE GRIPPER<\/code> আঙুল নাড়ায়। Pass-মানদণ্ড দুই দফার: arm মসৃণভাবে চলবে, আর gripper-র দুই আঙুল একসঙ্গে খুলবে-বন্ধ হবে। দ্বিতীয় শর্তটি আঙুল-সমলয়ের পরীক্ষা: আসল হাতে মোটর একটি (rlink1_Joint), বাকি পাঁচ joint তার জ্যামিতিক ছায়া (Part 6)। কিন্তু এই sim-এ mimic tag নিষ্ক্রিয় — ছয় joint-ই আলাদা position আদেশ পায় (Part 9); আঙুল একসঙ্গে নড়লে বুঝি sender-এর ১১-মান আদেশ ঠিক চলছে।"},{"a":117,"b":125,"text":"তৃতীয় পরীক্ষা 4.3, সবচেয়ে নাটকীয়: <code>ros2 run neurobotics line_follow.py<\/code>। আগে শর্ত: robot-কে <code>at the start of the line<\/code> থাকতে হবে। টেলিঅপে ঘুরিয়ে-ফিরিয়ে কোথায় যা গিয়েছ — ফিরিয়ে আনো টেলিঅপেই, অথবা সহজ পথ: Gazebo বন্ধ করে আবার launch; জন্মস্থানই আবার লাইনের মাথায়। স্ক্রিপ্টের কাজ একটাই: camera-র ছবিতে কালো লাইন খুঁজে তার মাঝ বেয়ে <code>/diff_cont/cmd_vel_unstamped<\/code>-এ সামনে-পাশের গতি লিখবে। কিন্তু লাইন দেখার আগেই তাকে একটা বাঁক নিতে হবে — সেই গল্প পরের blockquote-এ, এই README-র সবচেয়ে শিক্ষণীয় অনুচ্ছেদে।"},{"a":127,"b":134,"text":"এই blockquote-টি folder 08-এর হৃদয়: camera arm-এর বরাবর তাকিয়ে (gripper যেদিকে তাকিয়ে সেদিকেই), তাই arm সোজা HOME-ভঙ্গিতে camera আকাশ দেখে — লাইনের চিহ্ন নেইই, বাস্তব robot-এর মতোই। এই সত্যটা স্ক্রিপ্ট নিজেই সামলায়: প্রথমে বেসকে স্থির ধরে, তারপর arm সামনে বাঁকায় — <code>arm2 = arm3 = -0.70<\/code>, <code>arm4 = -0.87<\/code> rad — যা camera-র দৃষ্টিকে প্রায় 40° নিচু করে মেঝের 0.4 থেকে 1.4 মিটার সামনের অংশে নামায়। Ctrl+C চাপলে robot থেমে যায়, arm HOME-এ ফেরে। শেষ সতর্কতা: <code>arm_gui.py<\/code>-এর মতো আর কেউ যেন arm অন্য ভঙ্গিতে ধরে না রাখে — দুই লেখক একই topicে টানাটানি করবে।"},{"a":136,"b":140,"text":"দুটি debug জানালা স্ক্রিপ্টের সঙ্গে খোলে — OpenCV-র আশীর্বাদ, ভেতরে যা দেখছে তার সরাসরি প্রমাণ: একটিতে camera-র ROI (আগ্রহের অংশ), অন্যটিতে কালো লাইনের mask আর তার ওপর লাল কেন্দ্র-বিন্দু। এই জানালাই বলে দেবে লাইন ধরা পড়ছে কি না, কেন্দ্র কোথায় পড়ছে — অন্ধকারে টিউন করার চেয়ে চোখ দিয়ে দেখে টিউন করা হাজারগুণ সহজ। Pass-মানদণ্ড পুরো কোর্স জুড়ে: সোজা পথে এগোবে, ডানের বাঁক ধরবে, তারপর দ্বিতীয় সোজা পথে নামবে — টেপের কেন্দ্র ধরে থাকবে সবসময়। ব্যর্থ হলে আগে এই জানালাই দেখো: লাইন বাইরে গেলে সমস্যা দৃষ্টিতে, লাইন কেন্দ্রে থেকেও ঘুরলে সমস্যা স্টিয়ারিং-লাভে।"},{"a":142,"b":148,"text":"চতুর্থ পরীক্ষা 4.4: <code>ros2 run neurobotics obstacle_avoid.py<\/code>। লক্ষ্যবস্তু লাইনের পাশের সেই তিনটি কমলা বাক্সই — world ফাইলের সাজানো প্রপ। স্ক্রিপ্টের ইন্দ্রিয় দুটি: <code>/scan<\/code>, 360° lidar-এর দূরত্ব-ভাণ্ডার, আর বিশ্বাসযোগ্য মাথার দিক জানার উৎস <code>/imu<\/code>। Camera এখানে বেকার — সে লাইনের প্রোগ্রামের হাতিয়ার। টেলিঅপের মতো মানুষের হাতেও চালানো যায় না: স্ক্রিপ্ট নিজেই সিদ্ধান্ত নেয় কখন বাঁক, কোন দিকে বাঁক — তুমি শুধু চালু করো আর দেখো। কী দেখবে, তার বিধান পরের দুই অনুচ্ছেদে; আর আচরণের জন্ম-কারণ পাওয়া যাবে Part 10-এর sensor comment আর Part 3-এর fix log আইটেম 8-এ।"},{"a":150,"b":155,"text":"স্ক্রিপ্টের কৌশল তিন স্তরে। শুরুতেই সে <b>IMU<\/b> (<code>/imu<\/code>) থেকে নিজের মাথার দিক ধরে রাখে — heading latch। কেন IMU: wheel odometry tyre scrub-এর ঘূর্ণন দেখতে পায় না — চার চাকাই সমান গড়িয়ে যাচ্ছে অথচ ধড় ঘুরছে; তার ওপর দাঁড়ানো heading-lock ধীরে ধীরে বাঁকা পথে পিছলে যায় (এই সত্যের URDF-পাড়া Part 10-এর IMU comment)। তারপর প্রহরী-নিয়ম: সামনের ±45° খাতের ভেতর <code>0.85 m<\/code>-এর কাছে কোনো বাক্স এলেই ডজ শুরু। কোন দিকে? বাক্স খাতের যে পাশে বসে আছে তার উল্টো পাশে — ডানে বাক্স মানে বাঁয়ে সরা, এবং উল্টোটাও। খালি পথ পেলেই latch করা দিকে ফেরা।"},{"a":157,"b":163,"text":"Pass-দৃশ্যপট বিস্তারিত: robot সোজা পথ ধরে রাখবে, ডান পাশের বাক্সের (x প্রায় 3.5) আর তৃতীয় বাক্সের (x প্রায় 5) চারপাশে স্পষ্ট বাঁক দেখিয়ে সোজা হয়ে যাবে। তিনটি সতর্কতা এই টেস্টের নিজস্ব। এক: arm থাকবে HOME-এ — সামনে ভাঁজ করা arm lidar-এর চোখে ঠিক সামনের একটি বাধা হয়ে দাঁড়ায়। দুই: lidar বসে <code>front-right corner<\/code>-এ (laser1_frame, Part 7 আর 10), তাই ডান পাশের বাক্স বাঁ পাশের চেয়ে আগে ধরা পড়ে। তিন: প্রথম বাক্স (বাঁ পাশে, x প্রায় 2) সাধারণত বাঁক দিয়ে নয়, ফাঁক গলিয়ে পার হওয়া হয় — এতে অবাক হওয়ার কিছু নেই, সেটাই নকশা।"},{"a":165,"b":173,"text":"পঞ্চম পরীক্ষা 4.5: lidar-এর কাঁচা তথ্য নিজের চোখে দেখা, তিন উপায়ে — দ্রুত থেকে আরামদায়ক ক্রমে। <code>ros2 topic echo /scan --once<\/code>: একবারের পূর্ণ 360-রশ্মির ঝাপসা সংখ্যা-মেঘ, ranges অ্যারে হাতে হাতে; চোখে বাঁধা না থাকলেও ভাবনাটা বোঝায় — <code>/scan<\/code> আসলে শুধু দূরত্বের এক লম্বা তালিকা। <code>ros2 topic hz /scan<\/code>: স্রোতের হার মাপবে, উত্তর আসবে 10 Hz-এর কাছে — README-র topic-টেবিলের সেই সারির সত্যায়ন। <code>ros2 run neurobotics lidar_view.py<\/code>: সেই মেঘকে মানুষের ভাষায় নামানো ছোট্ট রাডার, পরের অনুচ্ছেদে। তিনটিই একই topicের তিন রকম দর্শন।"},{"a":175,"b":183,"text":"<code>lidar_view.py<\/code> 360টি রশ্মিকে আটটি 45° খাতে ভাগ করে, প্রতি খাতের সবচেয়ে কাছের দূরত্ব ছাপে — সেকেন্ডে দুবার টাটকা হয়। নমুনা লাইন README-তেই: <code>front:0.85m  f-left: -- m ... closest 0.85m at +12.3deg<\/code> — মানে সামনে 0.85 মিটারে কিছু, সামনে-বাঁয়ে সীমার ভেতর কিছু নেই (<code>--<\/code>), আর সবচেয়ে কাছের জিনিস সোজা সামনের 12.3 ডিগ্রি বাঁয়ে (<code>+<\/code> মানে dead ahead থেকে বাঁয়ে)। Robot-এর নিজের ধড় ঘেঁষে যাওয়া রশ্মিগুলো আগেই বাদ — তারা বাধা নয়, নিজের শরীর। এখন robot-কে কোনো বাক্সের দিকে ঘোরাও, front সংখ্যা ছোট হতে দেখো — <code>obstacle_avoid.py<\/code> যে সংকেতে সাড়া দেয় এটি সেটিই। আরও সুন্দর দেখতে চাইলে RViz-এর 3D আঁকা (4.7)।"},{"a":185,"b":195,"text":"ষষ্ঠ পরীক্ষা 4.6: গতি-ক্যালিব্রেশন — <code>calib_angular.py<\/code> (এক কমান্ডে 360° ঘূর্ণন) আর <code>calib_linear.py<\/code> (এক কমান্ডে 1 মিটার সরল পথ)। পদ্ধতি তোমার চেনা: বাস্তব robot-এর <code>04. angular velocity calibration<\/code> আর <code>05. linear velocity calibration<\/code> ফো
