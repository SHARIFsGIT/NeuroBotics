const PARTS = [{"n":1,"fname":"README.md","enTitle":"Launch & Observation Commands","explain":[{"a":1,"b":1,"text":"<b>Runbook-এর প্রথম ধাপ — পরিবেশ জাগানো<\/b>: এই README-টি আসলে একটি ছোট runbook — আগে পরিবেশ চালু, তারপর node চালু, শেষে তিনটি পর্যবেক্ষণ-কাচ। <code>sh start_agent.sh<\/code> রোবট-পাশের starter script: ROS 2-এর setup layer-গুলো source করে দেয়, যাতে terminal-এ <code>ros2<\/code> কমান্ডগুলো চেনা ও চালানো যায়। এই series-এর আগের joystick-controller analysis-এ <code>joy.sh<\/code> যে ভূমিকা পালন করত, এখানে ঠিক সেই ভূমিকা এই script-এর। লক্ষ করো — script-টি এই folder-এর ভেতরে নেই, রোবটের আগে-থেকে-থাকা জিনিস, তাই <code>sh<\/code> দিয়ে নাম ধরে ডাকতে হয়।"},{"a":3,"b":3,"text":"দ্বিতীয় ধাপ — মূল node ছাড়ানো: <code>ros2 run<\/code>-এর পরের দুটি শব্দ হলো package <code>yahboomcar_ctrl<\/code> আর executable <code>yahboom_keyboard<\/code>। মন দিয়ে দেখো — package-এর নামটি আগের joystick-controller analysis-এর টেলিঅপ যে package থেকে চলত, ঠিক সেটিই: কীবোর্ড-টেলিঅপ আর জয়স্টিক-টেলিঅপ একই ছাদের নিচে দুই ভাই। এই এক লাইন চালালেই Part 2-তে যে Python file শুরু হয় তার নাড়ি জেগে ওঠে, আর terminal-এ পুরো কী-মেনু ছাপা হয়ে আসে।"},{"a":5,"b":5,"text":"এবার প্রথম পর্যবেক্ষণ-কাচ: <code>rqt_graph<\/code> একটি GUI জানালা, যেটি ROS 2-এর node আর topic-দের ছবির মতো এঁকে দেখায় — কে কার সঙ্গে নল দিয়ে জুড়ে আছে। এখানে এর কাজ শুধু দেখা নয়, <b>যাচাই<\/b> করা: <code>yahboom_keyboard<\/code> node-টি গ্রাফে আসলেই দেখা যাচ্ছে কি না, আর তার তীরগুলো কোন কোন topic-এ পৌঁছেছে — node জাগেনি বা সংযোগ ভুল জায়গায়, দুটোই এই ছবিতে এক নজরে ধরা পড়ে।"},{"a":7,"b":7,"text":"দ্বিতীয় কাচ — এবার স্রোতের ভেতরে: <code>ros2 topic echo /cmd_vel<\/code> ছাপলে <code>/cmd_vel<\/code> topic-এ যাওয়া প্রতিটি <code>Twist<\/code> বার্তা terminal-এ লাইভ ছাপা হতে থাকে। এবার টেলিঅপের জানালায় কী চাপো — এই জানালায় বার্তার মানগুলো সঙ্গে সঙ্গে বদলে যেতে দেখবে; চাবির এক চাপ থেকে গতি-নির্দেশ হয়ে ওঠার পুরো যাত্রাটাই চোখের সামনে।"},{"a":9,"b":9,"text":"শেষ কাচ — গোনার কাচ: <code>ros2 topic info /cmd_vel<\/code> স্রোত দেখায় না, হিসাব দেখায় — <code>/cmd_vel<\/code>-এ ঠিক কটি publisher আর কটি subscriber ঝুলে আছে। এই লাইনটি কেন runbook-এর শেষে, তার মজাটি লুকিয়ে আছে ইতিহাসে: আগের joystick-controller analysis-এর টেলিঅপও ঠিক এই <code>/cmd_vel<\/code>-এই লেখে — দুটো টেলিঅপ একসাথে চললে দুই publisher একই নলে টানাটানিতে পড়ে (প্রতি মুহূর্তে যে বার্তা শেষে পৌঁছায়, সেটিই তখনকার আদেশ), আর সেই লুকানো দ্বন্দ্ব publisher-সংখ্যা বেড়ে গিয়ে এই এক কমান্ডেই ফাঁস হয়ে যায়।"}],"math":null,"robot":{"correct":"তাজা terminal-এ কমান্ডগুলো ক্রমানুসারে চালালে: <code>sh start_agent.sh<\/code> পরিবেশ তৈরি করে, <code>ros2 run<\/code> কীবোর্ড-টেলিঅপ জাগিয়ে terminal-এ পুরো কী-মেনু ছাপে — এরপর কী চাপলেই রোবট সাড়া দেয়, আর পাশের <code>echo<\/code> জানালায় Twist-বার্তার লাইভ স্রোত চোখের সামনে বয়ে যেতে দেখা যায়।","incorrect":"আগের folder-এর joystick-controller টেলিঅপও যদি একই সময়ে চালু থাকে, তবে <code>/cmd_vel<\/code>-এ দুই publisher খেলা করে — রোবট এক মুহূর্তে কীবোর্ডের কথা শোনে, পরের মুহূর্তে জয়স্টিকের কথায় ছোটে, ফলে ঝাঁকুনি-খাওয়া পরস্পরবিরোধী নড়াচড়া হয়; <code>ros2 topic info /cmd_vel<\/code> চালালেই সেই দ্বন্দ্ব বেড়ে যাওয়া publisher-count হিসেবে ফাঁস হয়ে যায়।"},"id":"part-01","start":1,"end":9,"lang":"text","animType":null,"flags":[]},{"n":2,"fname":"yahboom_keyboard.py","enTitle":"Header & Imports","explain":[{"a":1,"b":1,"text":"<b>প্রথম লাইনেই একটি পুরনো দাগ<\/b>: shebang <code>#!/usr/bin/env python<\/code> — interpreter-এর নাম বলছে <code>python<\/code>, <code>python3<\/code> নয়। এই series-এর আগের joystick-controller analysis (folder 02)-ও ঠিক এই একই quirk বহন করত — Python-2 আমলের হাতের ছাপ। যে আধুনিক মেশিনে <code>python<\/code> নামটি থাকেই না (শুধু <code>python3<\/code>), সেখানে file-টিকে সরাসরি <code>./yahboom_keyboard.py<\/code> লিখে চালাতে গেলে শুরুতেই হোঁচট; তবে Part 1-এর README-র পথে <code>ros2 run<\/code> দিয়ে চালালে ROS নিজস্ব Python দিয়েই file-টি চালায়, তাই বাস্তবে লাইনটি কার্যত অলংকারই।"},{"a":2,"b":2,"text":"<code># encoding: utf-8<\/code> — Python-2 আমলের ঘোষণা: তখন source file-এর টেক্সট-encoding নিজে থেকে বোঝা যেত না, বলে দিতে হতো। Python 3-এ default-ই UTF-8, তাই লাইনটি এখন ক্ষতিহীন পুরনো অভ্যাস — থাকুক বা না থাকুক, প্রোগ্রামের আচরণ এক মুহূর্তের জন্যও বদলায় না।"},{"a":4,"b":4,"text":"<code># --- IMPORTING TOOLS ---<\/code> — খাঁটি সাজানো-সাজানি comment: কোনো কাজ চালায় না, কেবল ঘোষণা করে যে নিচের নয়টি লাইন যন্ত্রপাতি-আমদানির তাক। এই Part-এ আমাদের কাজ সেই তাক চেনা — কোন যন্ত্র কোন কাজে লাগবে; আর comment-টির এই ড্যাশ-ওয়ালা ঢং চিনে রাখো, Part 3-এর menu-banner-ও একই সুরে শুরু হবে।"},{"a":5,"b":8,"text":"<b>Terminal raw-mode-এর চার সঙ্গী<\/b>: <code>sys<\/code> এনেছে <code>sys.stdin<\/code> হাতল — keyboard-র অক্ষর এই পাইপ দিয়েই পড়া হবে; <code>select<\/code> এনেছে সময়-সীমাসহ অপেক্ষার কৌশল — চাবি এসেছে কি না জেনে নেওয়া, না এলে ঘড়ি ধরে আবার ঘুরা (Part 6-এর <code>getKey<\/code>); <code>termios<\/code> terminal-এর বর্তমান সেটিংস আগে জমা রাখা আর কাজ শেষে হুবহু ফিরিয়ে দেওয়ার ভার নেবে; আর <code>tty<\/code>-র <code>tty.setraw()<\/code> terminal-কে raw মোডে ফেলবে, যাতে Enter-এর অপেক্ষা না করে প্রতিটি চাবি-চাপ সঙ্গে সঙ্গেই পড়া যায়। মন দিয়ে দেখো — চারটির কোনোটিই ROS নয়; এগুলো keyboard-কে ব্যক্তিগতভাবে পড়ার নিছক Python-যন্ত্র।"},{"a":9,"b":9,"text":"<code>import time<\/code> — <b>এই file-এর একমাত্র মৃত import<\/b>। পুরো প্রোগ্রাম উল্টে দেখো: <code>time<\/code> module-এর ডাক কোথাও পড়ে না — কোনো <code>time.sleep()<\/code> নেই, <code>time.time()<\/code> নেই। একটি ফাঁদে সাবধান: নিচের কোনো Part-এ <code>arm_msg.time = 500<\/code> দেখে ভেবো না ওই module কাজে লেগেছে — ওটি message-এর একটি <b>field<\/b>, নামের মিল নিছক কাকতালীয়। লাইনটি কোনো ক্ষতিও করছে না — শুধু অব্যবহৃত হয়েই বহন করা হয়েছে।"},{"a":11,"b":12,"text":"ROS পাল্লা খুলল: <code>import rclpy<\/code> — ROS 2-র Python client library, আর <code>from rclpy.node import Node<\/code> — সেই base class যার গা থেকে নিজের নোড জন্মাতে হয়। এই file-এর <code>YahboomKeyboard<\/code> class ঠিক এই <code>Node<\/code>-কেই পিতা করবে; <code>rclpy.init()<\/code> থেকে publisher তৈরি পর্যন্ত সব ROS-কাজের বীজ এই দুই লাইনে।"},{"a":13,"b":13,"text":"<code>from geometry_msgs.msg import Twist<\/code> — <b>চাকার ভাষা<\/b>। <code>Twist<\/code> হলো ROS-এর সর্বত্র-ব্যবহৃত গতি-বার্তা: <code>linear<\/code> ঘরে সরে-চলা, <code>angular<\/code> ঘরে ঘূর্ণন — এই file এটিকে <code>cmd_vel<\/code> topic-এ পাঠাবে। Folder 02-এর joystick-ও চাকায় ঠিক এই বার্তাই পাঠাত; অর্থাৎ দুই টেলিঅপের চাকা-প্রোটোকল হুবহু এক।"},{"a":14,"b":14,"text":"<code>from arm_msgs.msg import ArmJoint, ArmJoints<\/code> — <b>হাতের ভাষা, দুই রকম খাম<\/b>: <code>ArmJoint<\/code> একটি জয়েন্টের একক নির্দেশ (কোন জয়েন্ট, কত কোণ, কত সময়ে), <code>ArmJoints<\/code> ছয় জয়েন্টের অবস্থান একসাথে। এগুলো ঠিক সেই custom message types, যা folder 02-এর joystick ব্যবহার করত — অর্থাৎ joystick আর keyboard দুই টেলিঅপই এক আর্ম-প্রোটোকলে কথা বলে, বদলে যায় শুধু চালকের হাত। আরও একটা জিনিস লক্ষ করো: এই নোড কেবল <b>publish<\/b> করবে — কোনো topic থেকে ইনপুট নেবে না; ইনপুটের একমাত্র দরজা keyboard (Part 6)।"}],"math":null,"robot":{"correct":"প্রোগ্রাম চালু হওয়ার এই প্রথম ধাপে রোবটের শরীরে কোনো নড়াচড়া হয় না — চাকা স্থির, হাত যেখানে ছিল সেখানেই। লাইনগুলো কেবল সংবাদ-পাত্র গুছিয়ে রাখে: চাকার জন্য <code>Twist<\/code>, হাতের জন্য <code>ArmJoint<\/code>/<code>ArmJoints<\/code>, আর keyboard পড়ার terminal-যন্ত্র — পরের Part-গুলোতে ঠিক এই ভাষায় রোবট সাড়া দেবে।","incorrect":"কেউ যদি মনে করে file-টি <code>./yahboom_keyboard.py<\/code> লিখে যেকোনো মেশিনে সরাসরি চলে যাবে, সে হোঁচট খাবে — <code>python<\/code> নাম-নেই এমন সিস্টেমে shebang-এর দরুন শুরুতেই ব্যর্থ, অথচ <code>ros2 run<\/code>-এ একই file নির্বিঘ্ন চলে। আর <code>import time<\/code> দেখে সময়-নির্ভর কোনো আচরণ আশা করাও ভুল — পুরো file-এ module-টি একবারও ডাকা পড়ে না।"},"id":"part-02","start":1,"end":15,"lang":"python","animType":null,"flags":[]},{"n":3,"fname":"yahboom_keyboard.py","enTitle":"The Control Panel Menu","explain":[{"a":16,"b":17,"text":"<b>এই Part-এ জন্ম নেয় চালকের চিট-শিট<\/b>: line 16-এর comment (<code># --- PROFESSIONAL CONTROL PANEL MENU ---<\/code>) ঢালাঢালি করে জানিয়ে দিচ্ছে এবার আসছে নিয়ন্ত্রণ-প্যানেলের মেনু, আর line 17-এ <code>msg =<\/code>-এর পরে তিনটি ডাবল-কোটেশন — <b>triple-quoted string<\/b>-এর দরজা খুলল। এই দরজা বন্ধ হবে line 45-এ; মাঝের প্রতিটি অক্ষর Python-এর চোখে নিছক টেক্সট, কোনো কোড নয়। কেন আছে: চালক শুরুতেই একবার পুরো নকশা পড়ে নেবে — Part 9-এ <code>print(msg)<\/code> একবারই একে ছাপবে।"},{"a":18,"b":20,"text":"<b>মেনুর শিরোনাম-ফলক<\/b>: line 19-এ শিরোনাম <code>TELEOPERATION (Mecanum &amp; 6-DOF Arm)<\/code> — প্রথম পরিচয়েই দুই দেহ একসাথে ঘোষণা: Mecanum-চাকার ঘাঁটি আর 6-DOF (ছয়-স্বাধীনতার) হাত। উপরে-নিচে <code>====<\/code>-এর দুটি সমান রেখা — দুটিই ঠিক ৩৬ অক্ষর — শিরোনামটিকে বোর্ডের মতো ফ্রেম করেছে। মেনু-ছাপার একদম প্রথম সারি এই ফলকই (তার আগে কনস্ট্রাক্টরের ‘[SYSTEM] Arm reset to Home Position.’ লাইনটি এসে যায়)।"},{"a":22,"b":26,"text":"<b>[ BASE MOTION ] — ঘাঁটির চার-চাবির চুক্তি<\/b>: <code>i<\/code>/<code>,<\/code> সামনে/পিছনে, <code>j<\/code>/<code>l<\/code> জায়গায় দাঁড়িয়ে বামে/ডানে ঘোরা (in-place), <code>a<\/code>/<code>d<\/code> বামে/ডানে <b>পাশে সরা<\/b> — strafe। লক্ষ করো, strafe-সারিটি ব্র্যাকেটে <code>(Mecanum)<\/code> লিখে জোর দিচ্ছে — সাধারণ গোল চাকা পাশে যেতে পারে না, এই রোবটের তির্যক-রোলারের Mecanum-চাকা পারে; মেনু এই বিশেষ ক্ষমতা কার, সেটা আগেই স্বীকার করে নিচ্ছে। Line 26-এ <code>u / o / m /.<\/code> — কোণা-মুখী চারটি চাবি এক সারিতে, তবে শেষ <code>.<\/code>-এর আগে ফাঁকটা গচকে গেছে (<code>m /.<\/code> একই নিঃশ্বাসে পড়া যায়) — টাইপো-ঢঙের এই গুটানো ছাড়া সারিটি ঠিকঠাক। এই চাবিগুলোই Part 4-এর dictionary-তে গতির ট্রিপল হিসেবে বাঁধা পড়বে।"},{"a":28,"b":34,"text":"<b>[ ARM MOTION (5 deg / press) ] — হাতের ছয় জয়েন্টের নাম-তালিকা<\/b>: মন দিয়ে দেখো, এই সাত সারিতে হাতের <b>প্রকৃত ভৌত জয়েন্ট-নাম<\/b> — 1 Base (ঘাঁটি), 2 Shoulder (কাঁধ), 3 Elbow (কনুই), 4 Wrist (কবজি), 5 Wrist Rot (কবজি-ঘূর্ণন), 6 Gripper (মুখ)। প্রতিটির একজোড়া চাবি Down/Up, আর Gripper-এর জোড়া অন্যরকম শব্দে — <code>g<\/code>/<code>h<\/code> মানে Close/Open; হাতের শেষ জয়েন্ট ঘোরে না, চেপে ধরে। শিরোনামের প্রতিশ্রুতি <b>5 deg / press<\/b> — এক চাপে ঠিক পাঁচ ডিগ্রি; পরে Part 7-এর কোড হুবহু ±5 পৌঁছে দিয়ে এই প্রতিশ্রুতি রাখবে। চাবির ক্রমও বাঁধাই: 1/2, 3/4, 5/6, 7/8, 9/0, g/h — কীবোর্ডের উপরের সারি বেয়ে জয়েন্ট এক-এক করে নামে।"},{"a":36,"b":43,"text":"<b>[ SYSTEM ] — নিরাপত্তা ও গতির আইন-বাহিকা<\/b>: <code>SPACE<\/code> জরুরি-ব্রেক, ঘাঁটি ও হাত <b>দুটোই<\/b> থামবে; <code>s<\/code> সব নিয়ন্ত্রণ বন্ধ (pause), আবার <code>s<\/code> চাপলে ফের চালু; <code>r<\/code> হাতকে হোম-অবস্থানে ফেরত; <code>q<\/code>/<code>z<\/code> সামগ্রিক গতি ±10%, <code>w<\/code>/<code>x<\/code> কেবল linear, <code>e<\/code>/<code>c<\/code> কেবল angular; শেষে <code>CTRL + C<\/code> প্রস্থান। এই আট সারিই চালকের জীবন-রেখা — সমস্ত পরবর্তী Part এক এক করে এই প্রতিশ্রুতিগুলোর হিসাব নেবে, আর দেখা যাবে প্রতিটিই কোডে রক্ষিত।"},{"a":44,"b":45,"text":"<b>ফ্রেমের শেষ-রেখা, string-এর সমাপ্তি<\/b>: line 44-এ <code>====<\/code>-এর দীর্ঘ এক রেখা পুরো মেনুর নিচে দাগ টানল, আর line 45-এর দ্বিতীয় তিন-কোটেশন <code>msg<\/code>-কে চিরতরে বন্ধ করল — string-টি সম্পূর্ণ, আর ছোঁয়া হবে না। ছোট্ট একটা হাসির খবর: ওপেনিং রেখা (line 18) ৩৬ অক্ষরের, এই ক্লোজিং ৬০ — ডান প্রান্ত অনেকখানি বেরিয়ে মেনু-বাক্সটা একটু কাত। এই বেমানান আর আগের সারির গুটানো ফাঁক — কেবল চেহারার এতটুকু এলোমেলো; চুক্তির বিষয়বস্তুতে একটিও প্রতিশ্রুতি মিথ্যা নয়।"}],"math":null,"robot":{"correct":"এই লাইনগুলো নিজে কোনো মোটর নাড়ায় না — চালু হওয়া মাত্র terminal-এ একবার ছাপা হয় সম্পূর্ণ চিট-শিট, আর তারপর থেকে চালক যে চাবি ছোঁয়, এই মেনুতে লেখা চুক্তি অনুযায়ীই ঘাঁটি বা হাত সাড়া দেয় — হাতের প্রতিটি চাপে ঠিক পাঁচ ডিগ্রি।","incorrect":"কেউ যদি ভাবে মেনুটি বারবার আপডেট হয় বা গতি বাড়ালে/কমালে ছাপা শিটের কোনো সংখ্যা বদলাবে — হবে না: string-টি স্থির, একবারই ছাপা। আরেকটি ভ্রান্ত প্রত্যাশা — এই অংশ চালালেই রোবট কিছু করবে; বাস্তবে ১৬-৪৫ শুধু টেক্সট জন্ম দেয়, রোবটের প্রথম আদেশ যায় অনেক পরে, তাই এই মুহূর্তে রোবট নির্বিকার দাঁড়িয়ে থাকবে।"},"id":"part-03","start":16,"end":45,"lang":"python","animType":null,"flags":[]},{"n":4,"fname":"yahboom_keyboard.py","enTitle":"Key Bindings — Vectors & Multipliers","explain":[{"a":47,"b":47,"text":"<b>ঘর-ক্রমের চুক্তি-লাইন<\/b>: এই comment নিচের dictionary-র প্রতিটি value-র তিন সংখ্যার ক্রম বাঁধে — প্রথম ঘর <code>forward_back<\/code> (সামনে-পিছনে), দ্বিতীয় ঘর <code>strafe_left_right<\/code> (বামে-ডানে পাশ-চাল), তৃতীয় ঘর <code>rotate_left_right<\/code> (জায়গায় ঘূর্ণন)। ছোট লাইন কিন্তু পাহারার কাজ বড়: <code>(0, 1, 0)<\/code> দেখে বাইরের কেউ নিজে থেকে বলতে পারে না এটা strafe না ঘূর্ণন — চুক্তি মনে রেখেই পরের Part-গুলো গতি-হিসাব করবে; ঘর ভুল পড়লে হুকুম ভুল অক্ষে যেত।"},{"a":48,"b":50,"text":"<code>moveBindings = {<\/code> — key থেকে দিকের মানচিত্র খোলা হলো। প্রথম সারি: <code>'i': (1, 0, 0)<\/code> সামনে, <code>',': (-1, 0, 0)<\/code> পিছনে। লক্ষ করো মান কেবল ১, ০, −১ — এই টেবিল বলে দিক আর প্রবণতা, পরিমাণ পরে <code>speed<\/code>-মানের সঙ্গে গুণ হয়ে আসবে; দুই dictionary-তে দায় তাই ভাগ হয়ে আছে। প্রতিটি key-র পাশে বড়-হাতের যমজ (<code>'I'<\/code>) — caps-lock চালু থাকলেও চাল যেন বন্ধ না হয়, এটাই উদ্দেশ্য। মন দিয়ে দেখো <code>'M': (-1, 0, 0)<\/code>: বড়-হাতের M সোজা পিছনে পাঠায়, অথচ ছোট-হাতের <code>'m'<\/code> (নিচের সারিতে) পিছনে-বামে কোণা — পুরো টেবিলে একমাত্র বড়-হাতের key যার অর্থ ছোট-হাতেরটির মতো নয়; সম্ভবত ','-এর Shift-রূপ ভিন্ন অক্ষর হওয়ায় 'M'-কেই তার বিকল্প বানানো হয়েছে।"},{"a":51,"b":54,"text":"সামনে-পিছনের পরে বাকি দুই স্বাধীন অক্ষ: <code>'a': (0, 1, 0)<\/code> বামে strafe, <code>'d': (0, -1, 0)<\/code> ডানে — Mecanum চাকার পাশ-চাল অক্ষ; <code>'j': (0, 0, 1)<\/code> বামে ঘূর্ণন, <code>'l': (0, 0, -1)<\/code> ডানে — জায়গায়-ঘোরা। প্রতিটি সারিতে ঠিক একটি ঘরই অশূন্য: এগুলো বিশুদ্ধ এক-অক্ষ আদেশ, একসাথে দুই অক্ষ চাইলে অপেক্ষা করতে হবে কোণাকুণি key-এর পালায়। বড়-হাতের <code>'A'<\/code>, <code>'D'<\/code>, <code>'J'<\/code>, <code>'L'<\/code> নিখুঁত অনুলিপি — caps-lock-এ অর্থ বদলায় না (ব্যতিক্রম একমাত্র M, উপরেই দেখেছি)।"},{"a":55,"b":58,"text":"কোণাকুণি চারটি: <code>'u': (1, 1, 0)<\/code> সামনে-বামে, <code>'o': (1, -1, 0)<\/code> সামনে-ডানে, <code>'m': (-1, 1, 0)<\/code> পিছনে-বামে, <code>'.': (-1, -1, 0)<\/code> পিছনে-ডানে — এবার দুই ঘর একসাথে অশূন্য, সামনে-পিছনে আর পাশ-চাল মিলেমিশে এক হুকুম। উপরের animation-এ top-view chassis-এর উপর প্রতিটি key-র তীর আঁকা, আর কোণাকুণি তীরের গায়ে √2 ব্যাজ — কেন সেটা, math-অংশে খুলে বলব। <code>'U'<\/code>, <code>'O'<\/code>-এর যমজ আছে, কিন্তু <code>'.'<\/code>-এর কোনো বড়-হাতের সঙ্গী নেই — টেবিলের একমাত্র এতিম। শেষ <code>}<\/code> দিয়ে ১৮টি key-এর দিক-মানচিত্র সম্পূর্ণ।"},{"a":60,"b":61,"text":"দ্বিতীয় dictionary <code>speedBindings = {<\/code> — Part 3-এর menu যে কথা দিয়েছিল (q/z সব গতি, w/x linear, e/c angular), তার পূর্তি এখানে; এবার দিক নয়, <b>গুণক<\/b>: প্রতিটি value একজোড়া (linear-গুণক, angular-গুণক)। প্রথম সারিতে <code>'Q': (1.1, 1.1)<\/code> দুই গতিই ১০% বাড়ায়, <code>'Z': (.9, .9)<\/code> দুই-ই কমায়; <code>'W': (1.1, 1)<\/code> কেবল linear বাড়ায় — দ্বিতীয় ঘরের ১ মানে angular অপরিবর্তিত; <code>'X': (.9, 1)<\/code> কেবল linear কমায়। বাড়া-কমা যোগে নয়, <b>গুণে<\/b> — এক চাপে বর্তমান মান × 1.1 বা × 0.9।"},{"a":62,"b":64,"text":"শেষ অংশে <code>'E': (1, 1.1)<\/code> কেবল angular ১০% বাড়ায়, <code>'C': (1, .9)<\/code> কমায় — এবার প্রথম ঘরের ১ মানে linear অপরিবর্তিত; তারপর <code>'q'<\/code>, <code>'z'<\/code>, <code>'w'<\/code>, <code>'x'<\/code>, <code>'e'<\/code>, <code>'c'<\/code> — উপরের ছয়টির হুবহু ছোট-হাতের অনুলিপি, মোট ১২টি entry। মন দিয়ে দেখো: এই টেবিলে কোনো সীমা-প্রহরী নেই — ১০ বার <code>'q'<\/code> চাপলে গুণক জমে ≈ 2.59 হয়ে যাবে; সীমায় টেনে ধরার কাজ (clamp) মূল লুপের, Part 10-এ। <code>}<\/code> দিয়ে দ্বিতীয় মানচিত্রও সম্পূর্ণ — এবার শুধু অপেক্ষা, কে এগুলো পড়বে।"}],"math":{"intro":"এই Part-এর দুই dictionary আসলে দুই আলাদা গাণিতিক বস্তু: moveBindings একটি দিক-ফাংশন — key থেকে {−1, 0, 1}-এর তিন-ঘর tuple; speedBindings একটি গুণক-ফাংশন — key থেকে (0.9, 1, 1.1)-জাত জোড়া। প্রথমটি ঠিক করে কোথায়, দ্বিতীয়টি ঠিক করে কতটা দ্রুত — আর দুয়ের ফাঁকে লুকিয়ে বসে আছে একটা √2।","levels":[{"label":"Level 1 — দিক-মানচিত্র","latex":"\\[ \\mathrm{moveBindings}: \\; k \\mapsto (x, y, \\theta) \\in \\{-1,\\; 0,\\; 1\\}^{3} \\]","text":"প্রতিটি movement key একটি তিন-ঘরের একক-দিক tuple-এ যায়; মান বহন করে কেবল চিহ্ন (+1/−1/0), পরিমাণ নয়। পরিমাণ পরে আসবে — <code>speed<\/code>-মানের সঙ্গে গুণ হয়ে, যে মানটাকে Level 3-এর গুণকরা টেনে-টেনে বদলাবে।"},{"label":"Level 2 — কোণাকুণির √2","latex":"\\[ \\mathbf{v} = (s,\\, s) \\;\\Rightarrow\\; \\|\\mathbf{v}\\| = \\sqrt{s^{2} + s^{2}} = \\sqrt{2}\\, s \\approx 1.414\\, s \\]","text":"কোণাকুণি key দুই ঘর একসাথে ±1 করে দেয়, তাই ফল-ভেক্টরের দৈর্ঘ্য হয় √2 গুণ। কোড এই √2 দিয়ে ভাগ করে <b>না<\/b> — কোনো normalization নেই; ফলে একই speed-সেটিংয়ে কোণাকুণি চাল সোজা চালের চেয়ে প্রায় ৪১% দ্রুত — animation-এর √2 ব্যাজ সেটাই বলছে।"},{"label":"Level 3 — গুণক-মানচিত্র ও জ্যামিতিক বৃদ্ধি","latex":"\\[ (s,\\, t) \\mapsto (s \\cdot \\alpha,\\; t \\cdot \\beta), \\qquad \\alpha,\\, \\beta \\in \\{0.9,\\; 1,\\; 1.1\\} \\]","text":"speedBindings-এর প্রতিটি চাপ বর্তমান (s, t) জোড়ায় একবার করে গুণ; n বার একই key চাপলে 1.1-কে n বার গুণ হয় — বৃদ্ধি জ্যামিতিক, যোগাত্মক নয়। টেবিল নিজে কোনো সীমা জানে না; সীমায় টেনে ধরবে Part 10-এর clamp।"}],"numeric":[{"latex":"\\[ \\|\\mathbf{v}\\| = 0.2 \\times \\sqrt{2} \\approx 0.283\\ \\text{m/s} \\]","text":"একই সেটিং s = 0.2: সোজা চালে রোবট 0.2 m/s-এ, কিন্তু <code>'u'<\/code>-জাতীয় কোণায় ≈ 0.283 m/s — চালকের চোখে speed অপরিবর্তিত, রোবটের পায়ে গতি বেড়ে গেছে।"},{"latex":"\\[ 0.2 \\times 1.1 = 0.22\\ \\text{m/s}, \\qquad 1.0 \\times 1.1 = 1.1\\ \\text{rad/s} \\]","text":"এক চাপ <code>'q'<\/code>: দুই গতিতেই একই ১০% লাফ — 0.22 m/s আর 1.1 rad/s; এখানে কেবল গুণ হলো, 5.0-সীমায় টেনে ধরা পরে Part 10-এর কাজ।"},{"latex":"\\[ 0.2 \\times 1.1^{3} = 0.2662\\ \\text{m/s} \\]","text":"তিন চাপ <code>'q'<\/code> জমে 0.2662 m/s — যোগাত্মক হিসে হতো 0.26; গুণের হিস সবসময় যোগের চেয়ে একটু বেশি, আর চাপ যত বাড়বে দুই হিসের ফারাও তত বাড়বে।"}],"mapping":[{"code":"'u': (1, 1, 0)","math":"\\[ u \\mapsto (1,\\, 1,\\, 0) \\]","text":"tuple-টিই মানচিত্রের image: সামনে +1 আর বামে +1 একসাথে, ঘূর্ণন 0 — <code>'u'<\/code>-এর সংজ্ঞা এই আর কিছু নয়; পরিমাণ এখানে নেই।"},{"code":"'Q': (1.1, 1.1)","math":"\\[ (s,\\, t) \\leftarrow (1.1\\, s,\\; 1.1\\, t) \\]","text":"speedBindings-এর tuple হলো (α, β) জোড়া — Q দুই ঘরেই 1.1, তাই এক চাপে দুই গতি একই হারে বাড়ে।"}],"failure":["Caps-lock জ্বালানো থাকলে <code>'M'<\/code> চাপলে চালক back-left কোণা আশা করে, রোবট পাকা-পাকি সোজা পিছনে ঝাঁকায় — এই একমাত্র বড়-হাতের key-এই ছোট-হাতেরটির অর্থটাই বদলে যায়।","কোণাকুণি চালে √2-ভাগ (normalization) না থাকায় একই ‘ধীর’ সেটিংয়ে কোণা নিলে কার্যকর গতি প্রায় ৪১% বেশি — কর্নার ঘুরতে গিয়ে রোবট লক্ষ্যপথ ছাড়িয়ে চলে যায় (overshoot)।","বড়-হাতের যমজগুলো (<code>'I'<\/code>, <code>'A'<\/code>, <code>'D'<\/code>, <code>'J'<\/code>, <code>'L'<\/code>, <code>'U'<\/code>, <code>'O'<\/code>) বাদ থাকলে caps-lock-চালু ব্যবহারকারীর movement key-গুলোর একটিও বর্ণ-চাবি মিলত না (caps-lock যতিচিহ্ন বদলায় না, তাই <code>','<\/code> আর <code>'.'<\/code> তখনও কাজ করত) — বর্ণ-চাবির পাল্লা তার চোখে মরা মনে হতো, অথচ আসল দোষ key-এর নয়, case-এর।","দ্বিতীয় tuple-এর ঘর-ক্রম উল্টে গেলে (angular, linear) <code>'W': (1.1, 1)<\/code> linear নয় ঘূর্ণন বাড়াত — চালক চাইত সোজা দ্রুতি, রোবট জায়গায় ডিগবাজি মারত; ঘর-ক্রমের চুক্তি ভাঙলেই এই নীরব লাফ।"]},"robot":{"correct":"চাল সঠিক হলে: <code>'i'<\/code> চাপলে রোবট বর্তমান <code>speed<\/code>-এ সোজা সামনে, <code>'u'<\/code> চাপলে সামনে-বামে হেলানো কোণা-পথে (Mecanum-এর পাশ-চাল সক্ষমতা), <code>'a'<\/code> চাপলে পাশে সরে — আর <code>'q'<\/code> চাপলে পরের মুহূর্ত থেকে প্রতিটি চাল দুই অক্ষেই ১০% দ্রুত। দিক ঠিক করে moveBindings, গতির মাপ ঠিক করে speedBindings — রোবট পায় দুটোর গুণফল।","incorrect":"চালক caps-lock জ্বালিয়ে <code>'M'<\/code> চাপলে back-left কোণার বদলে রোবট হঠাৎ সোজা পিছনে ছুটবে; আর একই speed-এ কোণাকুণি key ধরলে রোবট সোজা চালের চেয়ে প্রায় ৪১% দ্রুত চলবে — ‘সেটিং এক, তাই গতি এক’ ভাবনাটাই এই কোডে ভুল।"},"id":"part-04","start":46,"end":64,"lang":"python","animType":"keyVectors","flags":[]},{"n":5,"fname":"yahboom_keyboard.py","enTitle":"Node Birth — Publishers, Limits, Home","explain":[{"a":66,"b":68,"text":"<b>নোডের জন্ম-সনদ<\/b>: <code>class YahboomKeyboard(Node)<\/code> — লক্ষ করো, নামটি সাজানো <b>CamelCase<\/b>; এই series-এর আগের joystick-controller analysis-এ (folder 02) class-নাম ছিল ছোট হাতের <code>autostart<\/code> — এই ফাইলটি টাইপো-মুক্ত, বেশ গোছানো। <code>def __init__(self, name):<\/code> — constructor নিজে নাম বানায় না, ডাকের কাছ থেকে পায়; আর <code>super().__init__(name)<\/code> সেই নামেই ROS-নোডকে জাগিয়ে তোলে: Part 9-এর <code>main()<\/code> পাঠাবে <code>\"yahboom_keyboard_ctrl\"<\/code>, আর rqt_graph-এ নোডটি ঠিক সেই নামেই ভেসে উঠবে।"},{"a":70,"b":73,"text":"<b>তিনটি প্রকাশনা-লেন, তিন রকম মেজাজ<\/b>: <code># Publishers<\/code>-এর নিচেই নোডের তিনটি মুখ। <code>self.pub_cmd_vel = self.create_publisher(Twist, 'cmd_vel', 1)<\/code> — চাকার গতি-আদেশের লেন, সারি-গভীরতা (queue depth) মাত্র <b>1<\/b>: keep-last নীতি — নতুন আদেশ এলে পুরোনোটি ছিটকে বেরিয়ে যায়, কারণ এক্ষণের গতিই একমাত্র সত্য, জমে-থাকা পুরোনো গতি-আদেশ বিপজ্জনক (আগের joystick analysis-এর Part 11-এও একই দর্শন)। কিন্তু <code>self.pub_arm_single<\/code> — ‘<code>arm_joint<\/code>’-এ ArmJoint — আর <code>self.pub_arm_all<\/code> — ‘<code>arm6_joints<\/code>’-এ ArmJoints — দুটোরই গভীরতা <b>100<\/b>: হাতের ধাপে-ধাপে অবস্থান-আদেশ প্রতিটিই মূল্যবান, একটি বাদ পড়লে সেই ধাপটুকু গতি চিরতরে হারায় — তাই লেন সেগুলোকে সারিতে জমিয়ে রাখে, ফেলে দেয় না।"},{"a":75,"b":79,"text":"<b>নিরাপত্তা-সীমা, কোডে-গাঁথা নয় — প্যারামিটারে<\/b>: <code>self.declare_parameter(\"linear_speed_limit\", 1.0)<\/code> আর <code>self.declare_parameter(\"angular_speed_limit\", 5.0)<\/code> — ডিফল্ট 1.0 m/s ও 5.0 rad/s, হুবহু joystick টেলিঅপের সেই মান। এরপর শৃঙ্খল: <code>self.get_parameter(...).get_parameter_value().double_value<\/code> — ঘোষিত মান খুঁজে এনে তার ভেতরের সংখ্যাটি (double) বের করা। এত ঘোরানোর কারণ একটাই: মান দুটি এখন <b>বাইরে থেকে ওভাররাইডযোগ্য<\/b> — launch-এ বা কমান্ড-লাইনে অন্য মান দিলে সীমা বদলে যাবে, কোডে হাত দিতে হবে না।"},{"a":81,"b":83,"text":"<b>দুটি স্মৃতি-ট্র্যাকার<\/b>: <code>self.arm_joints = [90, 90, 0, 0, 90, 90]<\/code> — হাতের <b>home ভঙ্গি<\/b>, ছয় জয়েন্টের প্রারম্ভিক অনুমান। মন দিয়ে দেখো পার্থক্যটি: folder 02-এর joystick-এর home ছিল <code>[90, 120, 10, 20, 90, 0]<\/code> — জয়েন্ট 6-এর 0 ছিল clamp-সর্বনিম্ন 30-এর নিচে, তাই শুরুতেই এক টান-টানানির লাফ। এই home-এর কোনো স্থানাঙ্কই clamp-বাক্সের বাইরে নয় — জয়েন্ট ৩, ৪-এর 0 নিচের সীমায় ঠেকা থাকলেও বাইরে নয়, আর জয়েন্ট 6-এর 90 তার <code>[30, 180]<\/code> ঘরের ভিতরে নিরাপদ দূরত্বে — নিচের দেয়াল থেকে 60°, উপরের দেয়াল থেকে 90° — তাই শুরুতে clamp কাউকে টানবে না; শুধু দুই টেলিঅপের ‘home’-এর সংজ্ঞা আজও মেলেনি। আর <code>self.settings = termios.tcgetattr(sys.stdin)<\/code> — terminal-এর বর্তমান cooked অবস্থার <b>ছবি<\/b>, তোলা হচ্ছে এখনও কোনো raw-mode ডাকার আগেই; Part 6-এর প্রতিটি <code>getKey<\/code>-এর পরে আর Part 11-এর শেষ সাফাইয়ে terminal ফেরানোর রেফারেন্স এটিই।"},{"a":85,"b":86,"text":"<b>জন্মেই ঘরে ফেরা<\/b>: কমেন্ট বলছে ‘safely’, আর ডাক <code>self.reset_arm()<\/code> — constructor-এর ভেতর থেকেই। ফল: প্রোগ্রাম শুরু হওয়া মাত্রই, একটি কী-চাপও পড়ার আগে, হাত home ভঙ্গির দিকে রওনা দেবে — Part 8-এ দেখব সেই নড়াচড়ায় সময় 2000 ms। আর আরেকটি সূক্ষ্ম ব্যাপার: <code>reset_arm<\/code> নিজে <code>self.pub_arm_all<\/code>-এ প্রকাশ করে — এজন্যই প্রকাশক তিনটি আগে, state-এর আগেই, বানানো হয়েছে; ক্রমটা এড়িয়ে গেলে জীবনের প্রথম সেকেন্ডেই খালি হাতে প্রকাশের চেষ্টা হতো।"}],"math":{"intro":"এই Part-এ দুটি গণিত পাশাপাশি বাঁধা: home ভঙ্গির ভেক্টর বনাম clamp-এর বাক্স, আর প্রকাশকের সারি-গভীরতার নিয়ম। প্রথমটি ঠিক করে দেয় রোবট জন্মার মুহূর্তে লাফাবে কি না; দ্বিতীয়টি ঠিক করে চাপ-মারা আদেশের কতটুকু সারিতে টিকে থাকবে।","levels":[{"label":"Level 1 — home ভেক্টর ও তার বাক্স","latex":"\\[ h = (90,\\; 90,\\; 0,\\; 0,\\; 90,\\; 90) \\in \\mathbb{R}^6, \\quad B = [0,180]^4 \\times [0,270] \\times [30,180] \\]","text":"ছয় জয়েন্টের home-ভঙ্গি একটি বিন্দু h, আর <code>step_arm_joint<\/code>-এর নিরাপত্তা-clamp গুলো মিলে তাকে ঘিরে রাখে একটি বাক্স B — জয়েন্ট 1–4: [0, 180], জয়েন্ট 5: [0, 270], জয়েন্ট 6: [30, 180]। চাওয়া শর্ত একটাই: h ∈ B — home বাক্সের বাইরে পড়লে প্রথম clamp-ই তাকে টেনে ভেতরে আনবে।"},{"label":"Level 2 — সারি-গভীরতার শর্ত","latex":"\\[ b \\geq \\lambda \\tau \\]","text":"প্রকাশকের সারিতে কত বার্তা জমবে: λ আগমন-হার (প্রতি সেকেন্ডে বার্তা), τ গ্রাহকের প্রতি বার্তা সামলানোর সময় — গভীরতা b গুণফলটাকে ধারণ করতে পারলে কিছুই পড়ে যায় না। চাকার লেনে λ ≈ 10 msg/s (লুপের হার, Part 6/11) কিন্তু τ নগণ্য — তাই b = 1-ই যথেষ্ট; হাতের লেনে মানুষের চাপ λ ≈ 5/s, সামলানোর সময় τ ≈ 1 s — তাই b = 100 ঢালাও নিরাপদ।"},{"label":"Level 3 — দেয়াল থেকে দূরত্ব","latex":"\\[ d(\\theta) = \\min(\\theta - \\ell,\\; u - \\theta), \\quad \\theta \\in [\\ell, u] \\iff d(\\theta) \\geq 0 \\]","text":"প্রতিটি স্থানাঙ্কের দেয়াল-দূরত্ব d — ঋণাত্মক হলেই জয়েন্টটি বাক্সের বাইরে, clamp-এর টান অবধারিত। home-এ জয়েন্ট 1, 2, 5-এর d = 90°, জয়েন্ট 6-এর d = min(60, 90) = 60°, আর জয়েন্ট 3, 4-এর 0 নিচের দেয়ালে ঠেকা — d = 0, দেয়ালে কিন্তু বাইরে নয়। সব কটির d ≥ 0, তাই জন্মমুহূর্তে clamp কাউকে স্পর্শও করে না; joystick-এর h6-এর d = −30 &lt; 0 ছিল বলেই সেখানে জন্ম-হোমিংয়েই সীমার-বাইরের মানটি ঢালাও বেরিয়ে গিয়েছিল; clamp মানটি 30-এ তোলে পরে, প্রথম ম্যানুয়াল নড়াচড়ায়।"}],"numeric":[{"latex":"\\[ h_6 = 90: \\; 30 \\leq 90 \\leq 180, \\quad d = \\min(90 - 30,\\; 180 - 90) = \\min(60, 90) = 60^{\\circ} \\]","text":"গ্রিপার-জয়েন্টের home বাক্সের ভেতরে স্বস্তিতে — নিচের দেয়াল (30) থেকে 60°, উপরের দেয়াল (180) থেকে 90° দূরে। বিপরীতে joystick home-এ h6 = 0: min(0 − 30, 180 − 0) = −30 — বাক্সের বাইরে — আর joystick-এর জন্ম-হোমিং এই 0-ই clamp ছাড়া ঢালাও পাঠিয়ে দেয়; clamp মানটি 30-এ টেনে তোলে কেবল পরে, জয়েন্ট 6 প্রথমবার নড়ানোর সময়।"},{"latex":"\\[ \\lambda \\tau = 5 \\times 1 = 5 \\;\\ll\\; 100 \\]","text":"হাতের লেনের হিসাব: সেকেন্ডে ৫টি চাপ, প্রতিটি সামলাতে প্রায় 1 s — জমা বলতে পাঁচটির বেশি নয়; 100-দৈর্ঘ্যের সারি ভরাট হওয়ার প্রশ্নই ওঠে না।"},{"latex":"\\[ \\lambda \\tau \\approx 10 \\times 0.1 = 1 \\leq b = 1 \\]","text":"চাকার লেন: Part 6-এর getKey-এর 0.1 s ছন্দে লুপ ঘোরে, সেই হারেও সারিতে জমে মাত্র একটি বার্তা — আর keep-last নীতিতে ‘ভরে যাওয়া’ মানে পুরোনোটির জায়গায় নতুনটি: পচা গতি-আদেশ কখনও জমে থাকে না।"}],"mapping":[{"code":"self.create_publisher(Twist, 'cmd_vel', 1)","math":"\\[ b = 1 \\;\\Rightarrow\\; \\text{keep-last} \\]","text":"তৃতীয় আর্গুমেন্টটিই Level 2-এর b — ছোট্ট এক অঙ্ক, অথচ এটিই ঠিক করে দেয় বার্তা সারিতে জমবে, নাকি পুরোনোটির বদলে নতুনটি বসবে।"},{"code":"self.arm_joints = [90, 90, 0, 0, 90, 90]","math":"\\[ h \\in B \\subset \\mathbb{R}^6 \\]","text":"লিস্ট-লিটারালটিই Level 1-এর home ভেক্টর h — ছয়টি সংখ্যা ছয়টি স্থানাঙ্ক, আর h ∈ B সম্পর্কটি পরীক্ষা হয় এই সংখ্যাগুলোর ঘরে ঘরে।"}],"failure":["হাতের দুই প্রকাশককে cmd_vel-এর মতো গভীরতা 1 দিলে দ্রুত-টানটান চাপে মাঝের লক্ষ্যগুলো ঝরে পড়ত — হাত কাঁপা-কাঁপা ছোট লাফে এগোত, চালকের চোখের সামনেই ধাপ হারিয়ে যেত।","settings-এর ছবি না নিলে, বা প্রথম setraw-ডাকের পরে নিলে — ফেরানোর ঠিকানাটাই ভুল জমে যেত: প্রোগ্রাম শেষে terminal অক্ষরে-বিকৃত, Enter-এ কোনো কাজ নেই — এমন ভূতুড়ে অবস্থায় shell রেখে যেত।","home-ভেক্টর বাক্সের বাইরে বসালে (joystick যেমন joint6 = 0 দিয়েছিল) জন্মের <code>reset_arm<\/code> সরাসরি সেই সীমাবহির্ভূত কোণের আদেশই পাঠাত — ওই function-এ clamp নেই, প্রাচীর কিছুই ধরত না, তাই কেউ কী না চেপেই হাত এক ঝটকায় সরে যেত; 30°-র টান লাগত প্রথম হাত-কী চাপার পরেই, যখন <code>step_arm_joint<\/code>-এর clamp জমা মানটাকে এক ঝটকায় ঘরে টেনে আনত।","declare/get-শৃঙ্খলটি বাদ দিয়ে সীমা সরাসরি সংখ্যায় গাঁথলে বাইরের ওভাররাইড নীরবে অচল হতো — কেউ linear_speed_limit কমালেও আসল সীমা 1.0-তেই আটকে থাকত, আর কেউ টেরও পেত না।"]},"robot":{"correct":"নোড জন্মায় ডাকের দেওয়া নামে, তিনটি টপিক-লেন খোলে যায়, আর constructor-এর শেষ লাইনেই হাত home ভঙ্গির উদ্দেশে রওনা দেয় — 2000 ms-এর মৃদু যাত্রা (Part 8), একটি কী-চাপও পড়ার আগেই। Terminal-এর cooked অবস্থা নিরাপদে জমা পড়ে থাকে, পরে সবকিছু অক্ষত ফেরানোর জন্য।","incorrect":"কেউ যদি ভাবে ‘কী চাপলে তবেই হাত নড়বে’ — তাকে চমকে দিয়ে প্রোগ্রাম চালু হওয়া মাত্রই হাত home-এ চলে যেতে শুরু করবে, মেনু-ও তখনো ছাপা হয়নি; rqt_graph-এ ধরা পড়বে কোনো কী-চাপ ছাড়াই arm6_joints লেনে একটি বার্তা চলে গেছে।"},"id":"part-05","start":66,"end":86,"lang":"python","animType":"pubGraph","flags":[]},{"n":6,"fname":"yahboom_keyboard.py","enTitle":"getKey — Raw Terminal Polling","explain":[{"a":88,"b":88,"text":"<code>def getKey(self):<\/code> — এই প্রোগ্রামের <b>একমাত্র ইনপুট-দ্বার<\/b>। লক্ষ করো: কোনো ROS subscription নেই, কোনো callback নেই — ইনপুট আসবে শুধু <code>stdin<\/code> থেকে, অর্থাৎ যে-টার্মিনালে প্রোগ্রাম চলছে তার কীবোর্ড থেকেই। আগের joystick-controller analysis-য় (folder 02) চালকের হাত পৌঁছত ROS বার্তা হয়ে; এখানে ব্যবস্থা আরও সরাসরি — লুপ (Part 9-এর <code>while True<\/code>, আর তার ভেতরের ইঞ্জিন Part 10) প্রতি পাসে এই ফাংশনকে ডেকে জিজ্ঞেস করবে: ‘এই মুহূর্তে কোনো কী এসেছে?’"},{"a":89,"b":89,"text":"<code>tty.setraw(sys.stdin.fileno())<\/code> — টার্মিনালকে <b>raw mode<\/b>-এ ফেলা। সাধারণ (cooked) অবস্থায় টার্মিনাল অক্ষর জমায়, Enter পেলে ব্যাচ ছাড়ে, পর্দায় প্রতিধ্বনি দেখায়; raw-তে সব বন্ধ — কী চাপা মাত্রই বাইট হয়ে প্রোগ্রামে ঢোকে, echo নেই, লাইন-এডিটিং নেই। একটি গুরুত্বপূর্ণ পার্শ্বফলও আছে: raw mode-এ <b>Ctrl+C আর SIGINT ওঠায় না<\/b> — সে আসে নিছক একটি বাইট <code>'\\x03'<\/code> হয়ে, যেটি ধরতে হবে লুপকেই (Part 10-11 ঠিক সেই কাজই করবে)।"},{"a":90,"b":90,"text":"<code>rlist, _, _ = select.select([sys.stdin], [], [], 0.1)<\/code> — মন দিয়ে দেখো, এই এক লাইনই পুরো প্রোগ্রামের <b>হৃদস্পন্দন<\/b>। <code>select<\/code> জিজ্ঞেস করে: stdin কি 0.1 সেকেন্ডের মধ্যে পড়ার যোগ্য হলো? ফেরত আসে তিন-তালিকার tuple — প্রথমটি (ready-to-read) নেওয়া হলো <code>rlist<\/code>-এ, বাকি দুটি <code>_<\/code>-এ ফেলে দেওয়া। 0.1 সেকেন্ডের এই টাইমআউটই লুপের ছন্দ গড়ে দেয়: কী না এলে তালিকা খালি, তবুও 0.1s পর ফাংশন ফেরে — প্রোগ্রামটি সেকেন্ডে প্রায় দশবার (≈10 Hz) ঘোরার কারণ এই সংখ্যাটিই।"},{"a":91,"b":94,"text":"শর্ত-শাখা দুটি: <code>rlist<\/code> ভরা মানে কী এসেছে — <code>key = sys.stdin.read(1)<\/code> দিয়ে <b>ঠিক এক অক্ষর<\/b> তোলা; খালি মানে টাইমআউট শেষ — <code>key = ''<\/code>। খালি স্ট্রিংটিও তথ্যবাহী সংকেত: ‘এই পাসে কোনো কী নেই’ — এই জন্যই লুপ থেমে না গিয়ে চলতেই থাকে। একটি কৌতূহল-জাগানো ব্যাপার: তীর-কীয়ের মতো multi-byte escape sequence বাইটে-বাইটে আসে, তাই এক চাপের শেষের অক্ষরগুলো পরের পোলে আলাদা ‘কী’ সেজে বাইন্ডিং ছুঁয়ে ফেলতে পারে — যেমন উপরের তীরের শেষ অক্ষর <code>'A'<\/code>, আর <code>'A'<\/code> আসলেই moveBindings-এর এন্ট্রি: বাঁদিকে strafe!"},{"a":95,"b":95,"text":"<code>termios.tcsetattr(sys.stdin, termios.TCSADRAIN, self.settings)<\/code> — raw-এর কাজ শেষ, Part 5-এ বাঁচিয়ে রাখা cooked সেটিংসে (<code>self.settings<\/code>) টার্মিনাল <b>ফিরিয়ে আনা<\/b> — প্রতিটি কলে, অর্থাৎ প্রতি 0.1s-এর পোলে একবার। <code>TCSADRAIN<\/code> অর্থ: সেটিংস বদলানোর আগে জমা আউটপুট নিষ্কাশন করে তবে বদলাও। কেন প্রতিবারই ফেরাতে হয় — প্রোগ্রাম যদি মাঝপথে মরে যায় আর টার্মিনাল raw-ই থেকে যায়, তবে ব্যবহারকারীর শেল ভেঙে পড়ে: টাইপ করা অদৃশ্য, Enter-এর প্রতিধ্বনি নেই, কমান্ড জঞ্জাল। প্রতি iteration-এ restore করলে ক্ষতির জানলা সর্বোচ্চ একটি পোলের সময়; Part 11-এর <code>finally<\/code> শেষ-জাল হিসেবে আরেকবার একই কাজ করে।"},{"a":96,"b":96,"text":"<code>return key<\/code> — একটি অক্ষর (বা খালি স্ট্রিং) হাতে হাতে ফেরত। এই ফেরত-মানই Part 10-এর লম্বা if/elif চেইনের প্রথম জ্বালানি: কোন কী এল, সেটাই ঠিক করবে চাকা নড়বে না হাত, নাকি গতির স্কেল বাড়বে-কমবে।"},{"a":98,"b":99,"text":"<code>def vels(self, speed, turn):<\/code> — ছোট্ট এক গতি-রিপোর্টার: f-string বানিয়ে বর্তমান রৈখিক ও কৌণিক গতি ফেরায়, <code>{speed:.2f}<\/code> আর <code>{turn:.2f}<\/code> — ঠিক দুই দশমিক, এককসহ (<code>m/s<\/code> ও <code>rad/s<\/code>)। লুপ এটি ছাপে চালু হওয়ার শুরুতে একবার এবং প্রতিবার speed-key (q/z/w/x/e/c) চাপলে (Part 10) — চালকের চোখের সামনেই গতি-স্কেল নড়ছে কি না তার সরাসরি প্রমাণ এই সারিটি।"}],"math":{"intro":"এই Part-এর পুরো গণিত একটি ছোট্ট সংখ্যাকে ঘিরে ঘোরে — select-এর 0.1 সেকেন্ড টাইমআউট। এই একটি ধ্রুবকই একসাথে লিখে দেয় লুপের হার, কী পৌঁছানোর সর্বোচ্চ বিলম্ব, আর cmd_vel হার্টবিটের ছন্দ।","levels":[{"label":"Level 1 — লুপের পর্যায়কাল ও হার","latex":"\\[ T \\approx 0.1\\,\\mathrm{s} + \\varepsilon, \\qquad f = \\frac{1}{T} \\approx \\frac{1}{0.1\\,\\mathrm{s}} = 10\\,\\mathrm{Hz} \\]","text":"প্রতিটি pass সর্বোচ্চ 0.1s অপেক্ষা করে, তার সঙ্গে যোগ হয় সামান্য ওভারহেড ε (setraw, restore, Python-এর হিসাব-নিকাশ)। বিভাজনটা মনে রাখো: 1 ভাগ 0.1 = 10 — লুপ সেকেন্ডে প্রায় দশবার ঘোরে, আর একটি কী সবচেয়ে খারাপ ক্ষেত্রে 100ms অবধি অপেক্ষা করে তবে লুপের হাতে পড়ে।"},{"label":"Level 2 — বাজেট-নিয়ন্ত্রিত অপেক্ষা","latex":"\\[ W(t) = \\min(t,\\; 0.1\\,\\mathrm{s}) \\]","text":"t হলো কী-আসার সময়; select-এর অপেক্ষা দুটোর ছোটটি — 20ms-এ কী এলে 20ms অপেক্ষা, না এলে ঠিক 100ms। এটি bounded blocking: লুপ কখনও অন্ধের মতো ঘুরবে না, আবার 0.1s-এর বেশি ঘুমাবেও না — নিয়ন্ত্রণের ছন্দ এখানেই deterministic হয়ে যায়।"},{"label":"Level 3 — হার্টবিটের সমীকরণ","latex":"\\[ f_{\\mathrm{pub}} = f_{\\mathrm{loop}} \\approx 10\\,\\mathrm{Hz} \\;\\Rightarrow\\; \\Delta t_{\\mathrm{cmd}} \\approx 0.1\\,\\mathrm{s} \\]","text":"Part 11 প্রতিটি pass-এই cmd_vel ছাড়ে — কী এসেছে বলেই বা না এসেই বলেই। তাই রোবটের ভেলোসিটি-স্ট্রিমের হার্টবিট আলাদা করে ঠিক করতে হয় না; এই Part-এর 0.1-ই সেটি লিখে দেয়: প্রতি সেকেন্ডে প্রায় দশটি টাটকা Twist।"}],"numeric":[{"latex":"\\[ \\frac{60\\,\\mathrm{s}}{0.1\\,\\mathrm{s}} = 600 \\;\\Rightarrow\\; 600\\ \\mathrm{passes} \\Rightarrow 600\\ \\mathrm{publishes} \\]","text":"এক মিনিট কেউ কিছু না চাপলেও লুপ প্রায় ছয়শো বার ঘোরে এবং খালি-হাতে (key খালি) ছয়শোটি cmd_vel ছাড়ে — হার্টবিট থামে না।"},{"latex":"\\[ \\tau \\in (0,\\, 100]\\,\\mathrm{ms}, \\qquad \\bar{\\tau} \\approx 50\\,\\mathrm{ms} \\]","text":"কী চাপার মুহূর্ত থেকে লুপের হাতে পৌঁছানো পর্যন্ত বিলম্ব τ সবসময় 100ms-এর মধ্যে; চাপার মুহূর্তটি পোল-পর্যায় জুড়ে সমান-সম্ভাবনায় ছড়ানো ধরলে গড় প্রায় অর্ধেক — 50ms।"},{"latex":"\\[ 3\\ \\mathrm{bytes} \\times 1\\ \\tfrac{\\mathrm{poll}}{\\mathrm{byte}} = 3\\ \\mathrm{polls} \\]","text":"উপরের তীর-কী (ESC [ A) তিন বাইটের sequence — read(1)-এর এক-অক্ষর কোটার কারণে তিনটিই তিন আলাদা পোলে আলাদা ‘কী’ হয়ে আসে; শেষের <code>'A'<\/code> ঢুকে যায় strafe-left বাইন্ডিংয়ে।"}],"mapping":[{"code":"select.select([sys.stdin], [], [], 0.1)","math":"\\[ W \\leq 0.1\\,\\mathrm{s} \\]","text":"কলের শেষ আর্গুমেন্ট 0.1-ই হলো সেই বাজেট W — কোডের সংখ্যাটি আর Level 2-এর অসমতার সংখ্যাটি একই অক্ষরে-অক্ষরে।"},{"code":"sys.stdin.read(1)","math":"\\[ n = 1\\ \\tfrac{\\mathrm{char}}{\\mathrm{poll}} \\]","text":"read(1)-এর সেই ‘1’ হলো প্রতি পোলের কোটা — numeric-এর শেষ হিসাবে তিন-বাইটের তীর-কী যে তিনে ভাঙে, তার বীজ এখানেই বোনা।"}],"failure":["প্রতি-কলে restore বাদ গেলে (terminal raw রেখে দিলে): প্রোগ্রাম মাঝলুপে ক্র্যাশ করামাত্র শেল raw অবস্থায় আটকে যেত — টার্মিনালে টাইপ করা দেখা যেত না, Enter-এর প্রতিধ্বনি আসত না, কমান্ডগুলো অদৃশ্য অক্ষরে জঞ্জাল হয়ে যেত; প্রতিটি iteration-এ ফেরানোয় ভাঙনের জানলা মাত্র একটি পোলের সময়ে বাঁধা থাকে।","টাইমআউট 1.0 বসালে: কী না থাকলে লুপ প্রতি পাসে পুরো এক সেকেন্ড জমে থাকত — চালকের চাপ পৌঁছাতে সেকেন্ড-পর্যন্ত দেরি, নিয়ন্ত্রণ স্পঞ্জের মতো ন্যাতা অনুভূত হতো; হার্টবিটও 10 Hz থেকে নেমে প্রায় 1 Hz-এ এসে যেত।","টাইমআউট 0 বানালে: select সঙ্গে সঙ্গেই ফিরত, আর কী না পাওয়া পর্যন্ত লুপ ঘুরতেই থাকত — ব্যস্ত-লুপ (busy-loop) CPU-র একটি কোর প্রায় পুরো খেয়ে ফেলত; এই 0.1 আসলে সেই ব্রেকেরই নাম।","লুপ যদি নিজে '\\x03' পরীক্ষা না করত: raw mode-এ Ctrl+C আর SIGINT ওঠায় না বলে চাপলেও প্রোগ্রাম বন্ধ হতো না — বাইটটি পড়া হতো, উপেক্ষা করা হতো, আর বন্ধ করার একমাত্র রাস্তাটাই মরে যেত।"]},"robot":{"correct":"প্রোগ্রাম চালু থাকলে রোবটের একমাত্র ইন্দ্রিয়-দ্বার এই ফাংশন: প্রতি ০.১ সেকেন্ডে একবার কীবোর্ডে কান পেতে ঠিক একটি অক্ষর তুলে লুপের Part 10-শাখার if/elif চেইনে পৌঁছে দেয় — কী না থাকলে খালি হাতে ফেরে, তবু ছন্দ ভাঙে না। আর প্রতিটি speed-key চাপে <code>vels()<\/code>-এর দুই-দশমিকের গতি-সারি পর্দায় ভেসে ওঠে।","incorrect":"চালক স্বাভাবিকভাবে ধরে নেয় Ctrl+C চাপলেই প্রোগ্রাম বন্ধ হবে — raw mode-এ SIGINT আসেই না; '\\x03' বাইটটি সাধারণ কী সেজে লুপের হাতে যায়, তাই বন্ধ হওয়া নির্ভর করে Part 10-11-এর নিজের পরীক্ষার উপর। আর তীর-কী চেপে রোবট হঠাৎ বাঁদিকে সরে গেলে অবাক হওয়ার কিছু নেই — সেই কীয়ের শেষ বাইট 'A' এখানে strafe-left কমান্ড হিসেবেই বাইন্ড করা।"},"id":"part-06","start":88,"end":99,"lang":"python","animType":"rawKeyPoll","flags":[]},{"n":7,"fname":"yahboom_keyboard.py","enTitle":"Arm Stepper — 5 Degrees with Clamps","explain":[{"a":101,"b":101,"text":"<code>def step_arm_joint(self, joint_id, delta):<\/code> — এই Part-এর নায়ক, আর পুরো হাত-নিয়ন্ত্রণের একমাত্র দরজা: <b>এক চাপ = এক ডাক<\/b>। Part 6-এর <code>getKey()<\/code> যে অক্ষর তুলে আনে, মূল লুপ সেটাকে এই function-এ পাঠায় দুটি তথ্য নিয়ে — কোন joint (<code>joint_id<\/code>), কোন দিকে কতটা (<code>delta<\/code>)। চাপ ছাড়ার সাথে সাথেই ডাক শেষ; চেপে-রাখা মানে বারবার ডাক — এই পার্থক্যটা মাথায় রেখো, math-এর শেষ Level-এ কাজে লাগবে।"},{"a":102,"b":102,"text":"<code>self.arm_joints[joint_id - 1] += delta<\/code> — মেনুর '5 deg / press' প্রতিশ্রুতির জন্মস্থান। মূল লুপ প্রতিটি হাত-কী থেকে <code>delta<\/code> হিসেবে ঠিক <b>±5<\/b> পাঠায়, তাই সঞ্চিত কোণ প্রতি ডাকে ঠিক ৫ ডিগ্রি এঁকে যায় — কমও না, বেশিও না। <b>লক্ষ করো<\/b> সূচকের <code>- 1<\/code>: joint-এর মানুষী গণনা 1 থেকে, Python list-এর গণনা 0 থেকে — এই একটা বিয়োগই দুই জগৎ মেলায়।"},{"a":104,"b":104,"text":"<code># Safety limits to prevent breaking the arm<\/code> — comment নিজের কাজ নিজেই বলে দিচ্ছে: নিচের ছয় লাইন একটা তালিকা-প্রাচীর, যার উদ্দেশ্য হাত থামানো <b>ভাঙার আগেই<\/b>। সীমাহীন কোণ-বাড়ানো মানে সার্ভো-মোটরকে যান্ত্রিক dead-end-এ ঠেলে দেওয়া — লেখক সেটা জানতেন, বলেও গেছেন।"},{"a":105,"b":106,"text":"<code>if joint_id == 5:<\/code> — wrist-rotation joint-এর আলাদা সদর: <code>max(0, min(270, ...))<\/code> তার কোণকে <b>[0, 270]<\/b> ঘরে আটকে রাখে। ২৭০ — ছয় joint-এর মধ্যে সবচেয়ে চওড়া সীমা; এই joint-টাই সবচেয়ে বেশি ঘুরতে পারে, তাই তার ঘর সবার বড়।"},{"a":107,"b":108,"text":"<code>elif joint_id == 6:<\/code> — gripper-এর ঘর <b>[30, 180]<\/b>: নিচের প্রান্ত ০-তে নয়, ৩০-তে থমকানো — সম্পূর্ণ বন্ধ অবস্থাতেও gripper-এর যান্ত্রিক গঠন কিছু কোণ দখল করে রাখে। <b>মন দিয়ে দেখো<\/b>, এই সীমা-টেবিলটা এই series-এর আগের joystick-controller analysis (folder 02)-এর সাথে হুবহু এক — দুই নিয়ন্ত্রক একই হাত চালায়, তাই দেয়ালও এক।"},{"a":109,"b":110,"text":"<code>else:<\/code> — বাকি সবাই, মানে joint 1-4 (base, shoulder, elbow, wrist), পায় সাধারণ ঘর <b>[0, 180]<\/b>: <code>max(0, min(180, ...))<\/code>। অর্ধ-বৃত্তের বাইরে কোনো চাপই এদের নিতে পারে না; কোণ সীমা ছুঁয়ে গেলে সেখানেই গেঁথে থাকে, আর ওদিকের বাড়তি চাপগুলো শুধু গোনা হতে থাকে — কাজে লাগে না।"},{"a":112,"b":113,"text":"<code>arm_msg = ArmJoint()<\/code> → <code>arm_msg.id = joint_id<\/code> — এক joint-এর জন্য ছোট খাম: ভেতরে আদেশ, বাইরে প্রাপকের ঠিকানা (<code>id<\/code>)। Part 8-এর <code>reset_arm()<\/code> ছয় joint-এর একসাথে বড় খাম <code>ArmJoints<\/code> ব্যবহার করবে; এখানে এক চাপে এক joint নড়ে, তাই ছোট খামই যথেষ্ট।"},{"a":114,"b":115,"text":"<code>arm_msg.joint = int(...)<\/code> — মান আসলে আগে থেকেই পূর্ণসংখ্যা (int তালিকায় ±5 যোগ হয়), তবু <code>int()<\/code> হলো belt-and-braces: ভবিষ্যতে কেউ <code>delta<\/code> ভগ্নাংশ বানালেও message-এ পূর্ণসংখ্যাই যাবে। পাশের <code>arm_msg.time = 500<\/code>-ই আসল গল্প: সার্ভো পায় ৫০০ ms — প্রতি ৫° ধাপে আদেষ্টা গতি ১০°/s। তুলনা করো folder 02-র joystick-এর সাথে: চেপে-রাখলে সে পাঠাত 1°/1000ms = 2°/s — keyboard প্রতি-আদেশে দ্রুত, কিন্তু মোট গতি তোমার আঙুলের গতিতে বাঁধা।"},{"a":116,"b":116,"text":"<code>self.pub_arm_single.publish(arm_msg)<\/code> — খামটা <code>arm_joint<\/code> topic-এ ছাড়া (Part 5-এর depth-100 সারি)। এই এক লাইনেই কাগজে-কলমের হিসাব ধাতুতে রূপ নেয়: এর আগে সব ছিল তালিকার ভেতরের সংখ্যা, এখন থেকে সার্ভো শোনে।"},{"a":118,"b":121,"text":"শেষ ছোঁয়া — চোখের জন্য: <code>delta &gt; 0<\/code> হলে <code>action = \"Opening\"<\/code>, নাহলে <code>\"Closing\"<\/code>; কিন্তু <code>if joint_id != 6:<\/code> শব্দজোড়া বদলে দেয় <code>\"Up\"<\/code>/<code>\"Down\"<\/code>-এ। অর্থাৎ Opening/Closing শুধু gripper-এর ভাষা, বাকি পাঁচ joint ওঠে-নামে। ঘূর্ণায়মান base-এর (joint 1) জন্য 'Up/Down' অবশ্য রূপক — সে ওপরে ওঠে না, ঘোরে; তবু মেনুর Down/Up শব্দের সাথে মিল রেখেই এই naming, আর ছাপা কোণটা (<code>[ARM] Joint 1 -> Up -> 95 deg<\/code>-এর মতো) সব সময়ই সত্যি বলে।"}],"math":{"intro":"এই Part-এর গণিত তিন স্তরে সাজানো: এক চাপে এক স্থির ধাপ, সেই ধাপকে joint-ভেদে ঘরে আটকানো, আর চাপের হার থেকে আদেষ্টা গতি বের করা — মানুষের আঙুল থেকে সার্ভো-মোটর পর্যন্ত পুরো শৃঙ্খলার হিসাব।","levels":[{"label":"Level 1 — ধাপ-সমীকরণ","latex":"\\[ \\theta_{k+1} = \\theta_k + d, \\quad d \\in \\{-5, +5\\} \\;\\Rightarrow\\; \\theta_k = \\theta_0 + k\\,d \\]","text":"প্রতিটি কী-চাপ ঠিক একবার function-কে ডাকে, প্রতিটি ডাকে স্থির d যোগ হয় — তাই k চাপ মানে জমা-সরণ ঠিক kd ডিগ্রি। মেনুর '5 deg / press' প্রতিশ্রুতির গাণিতিক রূপ এটাই।"},{"label":"Level 2 — ঘরে অভিক্ষেপ","latex":"\\[ \\Pi_{[\\ell,u]}(\\theta) = \\max\\{\\ell, \\min\\{u, \\theta\\}\\}, \\qquad [\\ell,u] = \\begin{cases} [0,270], & \\mathrm{id} = 5 \\\\ [30,180], & \\mathrm{id} = 6 \\\\ [0,180], & \\mathrm{id} \\in \\{1,2,3,4\\} \\end{cases} \\]","text":"ভেতরের min উপরের দেয়াল, বাইরের max নিচের — দুটো মিলে কোণকে তার ঘরের নিকটতম বিন্দুতে টেনে আনে: ঘরের ভেতরে থাকলে মান অক্ষত, বাইরে গেলে প্রান্তে গেঁথে যায়। Home 90 প্রতিটি ঘরেরই ভেতরে (Part 5) — তাই শুরু থেকে দুই দিকেই যাওয়ার জায়গা আছে।"},{"label":"Level 3 — চাপ-প্রতি আদেষ্টা গতি","latex":"\\[ v_{\\mathrm{cmd}} = \\frac{5^{\\circ}}{0.5\\,\\mathrm{s}} = 10\\;\\mathrm{deg/s}, \\qquad v_{\\mathrm{queue}} = 5r \\;\\mathrm{deg/s} \\]","text":"প্রতিটি বার্তা সার্ভোকে ৫০০ ms সময় দেয় — একটানা চাপলে আদেশের গতি ১০°/s। আঙুলের হার r চাপ/s হলে সারিতে জমে 5r °/s; সার্ভো নিজের ছন্দে পিছিয়ে পিছিয়ে সেই জমা শোধ করে।"}],"numeric":[{"latex":"\\[ \\theta_0 = 90,\\; d = +5: \\quad 90 \\to 180 \\Rightarrow k = \\frac{180 - 90}{5} = 18 \\;\\text{presses}, \\quad 18 \\times 0.5\\,\\mathrm{s} = 9\\,\\mathrm{s} \\]","text":"Joint 1-কে home 90 থেকে ঘরের ছাদ 180-এ নিতে ১৮টি চাপ — প্রতিটি চাপের আদেশ ০.৫ সেকেন্ড সার্ভো-সময় নেয়, তাই একটানা চেপে গেলে প্রায় ৯ সেকেন্ড ধরে হাত ঘুরবে।"},{"latex":"\\[ \\theta_0 = 90,\\; d = -5: \\quad 90 \\to 30 \\Rightarrow k = \\frac{90 - 30}{5} = 12 \\;\\text{presses}; \\quad \\max(30, \\min(180, 25)) = 30 \\]","text":"গ্রিপার বন্ধ করতে ('g' — প্রতিটি −5) ১২টি চাপ; ১৩তম চাপে 30 − 5 = 25 হলেও প্রাচীর তাকে ৩০-তেই ফেরত ধরে রাখে — নিচের দেয়াল অনড়।"},{"latex":"\\[ r = 8\\;\\text{presses/s}: \\quad v_{\\mathrm{queue}} = 5 \\times 8 = 40\\;\\mathrm{deg/s} \\;\\gg\\; 10\\;\\mathrm{deg/s} \\]","text":"দ্রুত আঙুলে সেকেন্ডে ৮ চাপ মানে সারিতে জমে ৪০°/s — সার্ভোর নিজের আদেষ্টা গতির চার গুণ; তালিকা আগে ছুটবে, হাত পিছিয়ে পিছিয়ে আসবে।"}],"mapping":[{"code":"self.arm_joints[joint_id - 1] += delta","math":"\\[ \\theta_{k+1} = \\theta_k + d \\]","text":"একটি += চিহ্নই সম্পূর্ণ ধাপ-গতিবিদ্যা — সূচকের −1 মানে গণিতের 1-ভিত্তিক joint-নম্বরকে কোডের 0-ভিত্তিক তালিকা-সূচকে নামানো।"},{"code":"max(0, min(270, self.arm_joints[joint_id - 1]))","math":"\\[ \\theta \\leftarrow \\Pi_{[0,\\,270]}(\\theta) \\]","text":"বাইরের max আর ভেতরের min জুড়েই ব্যবধানে অভিক্ষেপ — মান ঘরের ভেতরে হলে অক্ষত ফেরে, বাইরে হলে নিকটতম প্রান্তে বসে।"}],"failure":["প্রাচীরের এই ছয় লাইন সরিয়ে দিলে তালিকার কোণ ৩০-এর নিচে বা ২৭০-এর উপরে চলে যেত — সার্ভো যান্ত্রিক সীমায় ঠেকে ঘর্ষণের গোঁ-গোঁ শব্দে গরম হতে থাকত, ক্রমে গিয়ার-ক্ষতি।","time = 500-এর বদলে ছোট সময় (যেমন 100) বসালে প্রতি ধাপের আদেষ্টা গতি হতো ৫০°/s — প্রতিটি চাপে হাত একটা ধাক্কা মারত, জোড়া চাপে কাঁপত।","joint 6-এর ঘর ভুলে [0, 180] বসালে ৩০-এর নিচের আদেশগুলোও পাস হয়ে যেত — gripper তার নিজের যান্ত্রিক গঠনের ভেতরে ঠেলে খোলা-বন্ধ অবস্থাতেই মোটর অযথা কারেন্ট টানত।","সূচকের −1 বাদ দিলে joint 6-এর চাপ তালিকার ৭ম ঘর খুঁজত — ছয়-ঘরের তালিকায় IndexError, আর মূল লুপের try-এ সেটা ধরা পড়ে পুরো প্রোগ্রাম বন্ধ হয়ে যেত।"]},"robot":{"correct":"প্রতিটি হাত-কী চাপলে ঠিক এক joint ঠিক ৫ ডিগ্রি নড়ে — যেমন '2' চাপলে base-joint 500 ms সময় পেয়ে মসৃণভাবে 90 থেকে 95-এ যায়, আর terminal-এ ছাপা হয় [ARM] Joint 1 -> Up -> 95 deg। কোণ যখনই নিজের ঘরের প্রান্ত ছোঁয়, সেই দিকের বাড়তি চাপ নীরব হয়ে যায় — হাত আর বাড়ে না, ভাঙার ভয়ও থাকে না।","incorrect":"ধরে নিলে সেকেন্ডে ৮-১০টা চাপে গ্রিপার ছোটাচ্ছ — তালিকা আর terminal-এর কোণ তখন আগে এগিয়ে যায়, আসল হাত পিছিয়ে পিছিয়ে সারি শোধ করে; terminal যখন 150 deg দেখাবে, হাত তখনও পথে থাকতে পারে। আবার ঘরের প্রান্তে পৌঁছেও চাপতে থাকলে 'কী কাজ করছে না' ভ্রম হয় — চাপ আসলে গোনাই হচ্ছে, ক্ল্যাম্পই মানটাকে প্রান্তে আটকে রাখছে।"},"id":"part-07","start":101,"end":121,"lang":"python","animType":"armStep","flags":[]},{"n":8,"fname":"yahboom_keyboard.py","enTitle":"Home Reset & Emergency Brake","explain":[{"a":123,"b":125,"text":"<b>এই Part-এর প্রথম রুটিন — ঘরে ফেরানো<\/b>: <code>def reset_arm(self):<\/code>। মন দিয়ে দেখো লাইন 124: <code>self.arm_joints = [90, 90, 0, 0, 90, 90]<\/code> — Part 5-এর constructor যে literal দিয়ে <code>arm_joints<\/code> জন্ম দিয়েছিল, <b>ঠিক সেই একই ছয়-সংখ্যার তালিকা এখানে আবার হাতে টাইপ করা<\/b>। অর্থাৎ ‘home’-এর সংজ্ঞা file-এ দুই কপিতে বাঁচা — একটি বদলালে অন্যটিও নিজ হাতে মেলাতে হবে; ছোট্ট একটি রক্ষণাবেক্ষণ-ফাঁদ, যা এই ধরনের টেলিঅপ কোডে খুব কমন। তারপর <code>arm_msg = ArmJoints()<\/code> — ছয় জয়েন্ট একসঙ্গে পাঠানোর বার্তা তৈরি।"},{"a":126,"b":131,"text":"ছয়টি লাইনে ছয়টি ঘর ভরা: <code>arm_msg.joint1 = self.arm_joints[0]<\/code> থেকে <code>arm_msg.joint6 = self.arm_joints[5]<\/code> — তালিকার index 0-5 বার্তার <code>joint1..joint6<\/code> ঘরে এক-এক করে বসছে। Part 7-এর single-joint বার্তার (<code>ArmJoint<\/code>) বদলে এখানে <b>all-at-once<\/b> বার্তা — ছয় সার্ভোকে এক প্যাকেটে একই লক্ষ্যের দিকে ছাড়ার জন্য।"},{"a":132,"b":134,"text":"<code>arm_msg.time = 2000<\/code> — এই ভ্রমণের সময়-বাজেট পুরো <b>2 সেকেন্ড<\/b>: হাত যেখানেই থাকুক, ঘরে ফেরা হবে ধীর মসৃণ গ্লাইডে (Part 7-এর এক-কী-ধাপের 500ms-এর চেয়ে চার গুণ শান্ত)। তারপর <code>self.pub_arm_all.publish(arm_msg)<\/code> — <code>arm6_joints<\/code> topic-এ প্রকাশ, আর <code>print(\"[SYSTEM] Arm reset to Home Position.\")<\/code> — চালকের নিশ্চিত করা। এই function-কে দুই জায়গা থেকে ডাকা হয়: Part 5-এর constructor (শুরুতেই নিরাপদ হোমিং) এবং Part 10-এর <code>r<\/code> কী।"},{"a":136,"b":138,"text":"দ্বিতীয় রুটিন <code>def emergency_stop(self):<\/code> — নাম শুনে যা মনে আসে তার চেয়ে কোমল: <b>বিদ্যুৎ-কাটা নয়, ‘যেখানে আছ সেখানেই থেমে যাও’<\/b>। প্রথম ধাপ মন্তব্যেই লেখা (<code># 1. Stop Wheels<\/code>): <code>self.pub_cmd_vel.publish(Twist())<\/code> — নতুন <code>Twist()<\/code>-এর প্রতিটি ঘর ডিফল্টভাবে শূন্য, তাই এক প্রকাশেই linear ও angular — চাকার সব গতি-নির্দেশ একসঙ্গে শূন্য।"},{"a":139,"b":140,"text":"দ্বিতীয় ধাপের মন্তব্যটাই গোটা কৌশলটা বলে দেয়: <code># 2. Stop Arm (Send current positions with 100ms time to force immediate braking)<\/code> — এটাই <b>ব্রেক-ট্রিক<\/b>। তার জন্য আবার একটি <code>arm_msg = ArmJoints()<\/code> বানানো হচ্ছে — চেনা ছাঁচ, কিন্তু এবার লক্ষ্য home নয়।"},{"a":141,"b":146,"text":"লক্ষ করো ছয়টি লাইনের পার্থক্যটা: <code>arm_msg.joint1 = self.arm_joints[0]<\/code> ... <code>arm_msg.joint6 = self.arm_joints[5]<\/code> — বার্তায় বসছে <code>arm_joints<\/code>-এর <b>বর্তমান<\/b> মানগুলো, অর্থাৎ প্রোগ্রামের হিসাবে সার্ভোরা এই মুহূর্তে যে-কোণে আছে ঠিক তা-ই। <code>reset_arm<\/code> তালিকাটা নতুন করে home-এ <b>লিখত<\/b>; এখানে তালিকায় হাতই দেওয়া হচ্ছে না, শুধু পড়া হচ্ছে। কাজেই e-stop হাতের অবস্থান-স্মৃতি (এবং <code>speed<\/code>/<code>turn<\/code>) নড়ায় না — Part 9-এর কোড পরে x, y, th অতিরিক্ত শূন্য করে।"},{"a":147,"b":148,"text":"শেষ জুড়িটিই আসল কৌশল: <code>arm_msg.time = 100<\/code> + <code>self.pub_arm_all.publish(arm_msg)<\/code> — ‘তুমি এখন যে কোণে আছ, 100ms-এর ভেতর ঠিক সেই কোণেই থেকে যাও।’ মাঝ-পথে কোনো দীর্ঘ নড়াচড়া (যেমন 2000ms-এর হোমিং গ্লাইড) চলমান থাকলে নতুন এই নির্দেশ পুরনোটিকে প্রতিস্থাপন করে — লক্ষ্য যেহেতু বর্তমান অবস্থানই, সার্ভো সঙ্গে সঙ্গে সেখানেই বসে যায়। আরেকটি সূক্ষ্মতা: এই function-এ কোনো <code>print<\/code> নেই — যারা ডাকে (Part 9-এর s- আর SPACE-শাখা; শেষ ডাকটি আসে Part 11-এর finally থেকে, নিঃশব্দে), তারাই নিজেদের লাইন (PAUSED / EMERGENCY STOP ENGAGED) ছাপে।"}],"math":{"intro":"দুই রকম থামার দুই রকম গণিত: চাকার জন্য শূন্য-ভেক্টর, হাতের জন্য ‘লক্ষ্য = বর্তমান’ সমীকরণ — আর সঙ্গে গোটা file-টির তিনটি সময়-বাজেটের এক নজরে তুলনা।","levels":[{"label":"Level 1 — চাকার শূন্য-ভেক্টর","latex":"\\[ (v_x, v_y, \\omega) \\leftarrow (0, 0, 0) \\]","text":"ফাঁকা <code>Twist()<\/code> মানে গতি-ভেক্টরের তিন উপাদানই শূন্য — সামনে-পিছনে নেই, পার্শ্বে নেই, ঘূর্ণন নেই। চাকার নিম্নস্তরের নিয়ন্ত্রক বেগ-নির্দেশ মানে, তাই রোবট দাঁড়িয়ে যায়।"},{"label":"Level 2 — ব্রেক-ট্রিকের সমীকরণ","latex":"\\[ \\theta_{\\text{target}} = \\theta_{\\text{current}} \\;\\Rightarrow\\; \\Delta\\theta = 0, \\quad \\dot{\\theta}_{\\text{cmd}} = \\frac{\\Delta\\theta}{\\tau} = \\frac{0}{0.1\\,\\text{s}} = 0 \\]","text":"সার্ভোকে তার বর্তমান কোণই লক্ষ্য বানালে সরণ Δθ = 0 — আর নির্দেশিত গতি = সরণ ÷ সময়-বাজেট = শূন্য। বিপরীতে <code>reset_arm<\/code>-এ Δθ বড় হতে পারে, তাই সেখানে τ = 2000ms-এর ধীর গ্লাইড।"},{"label":"Level 3 — file-এর তিন সময়-বাজেট","latex":"\\[ \\dot{\\theta}_{\\text{cmd}} = \\frac{|\\Delta\\theta|}{\\tau}, \\quad \\tau_{\\text{step}} = 500\\,\\text{ms}, \\; \\tau_{\\text{brake}} = 100\\,\\text{ms}, \\; \\tau_{\\text{home}} = 2000\\,\\text{ms} \\]","text":"একই সরণের জন্য নির্দেশিত গতি τ-এর ব্যস্তানুপাতিক — τ ছোট মানে তীব্র সাড়া। এই file-এর তিনটি বাজেট: 100 সবচেয়ে তীব্র (ব্রেক), 500 মাঝারি (এক-কী ধাপ, Part 7), 2000 সবচেয়ে কোমল (হোমিং)।"}],"numeric":[{"latex":"\\[ \\theta_3 = 37^{\\circ} \\Rightarrow \\theta_{3,\\text{target}} = 37^{\\circ}, \\; \\Delta\\theta_3 = 0 \\Rightarrow \\dot{\\theta}_3 = 0 \\]","text":"হাত মাঝ-পথে থাকলে (যেমন joint3 = 37°) e-stop ঠিক 37°-ই পাঠায় — home-এর 0° নয়; তাই কনুই 37°-এ বাতাসে জমে যায়, নিচে নামে না।"},{"latex":"\\[ \\frac{\\tau_{\\text{home}}}{\\tau_{\\text{brake}}} = \\frac{2000}{100} = 20 \\]","text":"হোমিং-এর বাজেট ব্রেকের চেয়ে ঠিক ২০ গুণ বড় — ঘরে ফেরার গ্লাইড ২০ গুণ বেশি কোমল, ব্রেক ২০ গুণ বেশি তাৎক্ষণিক।"},{"latex":"\\[ \\Delta\\theta = 5^{\\circ}, \\; \\tau = 0.5\\,\\text{s} \\Rightarrow \\dot{\\theta} = \\frac{5}{0.5} = 10^{\\circ}/\\text{s} \\]","text":"Part 7-এর এক-কী ধাপের হিসাব: প্রতি চাপে 5° সরণ 500ms বাজেটে মানে কার্যকর গতি 10°/s — আর মাঝে ব্রেক পড়লে বাকি সরণ পুরো বাতিল।"}],"mapping":[{"code":"self.pub_cmd_vel.publish(Twist())","math":"\\[ \\mathbf{v} \\leftarrow \\mathbf{0} \\]","text":"এক লাইনেই তিন-উপাদানের শূন্য-অ্যাসাইনমেন্ট — message-এর ডিফল্ট মানগুলোই এখানে গণিতের কাজ করছে।"},{"code":"arm_msg.time = 100","math":"\\[ \\tau = 0.1\\,\\text{s}, \\; \\Delta\\theta = 0 \\Rightarrow \\dot{\\theta}_{\\text{cmd}} = 0 \\]","text":"সময়-ঘরটিই τ — বাজেট ছোট করা এবং লক্ষ্য-বর্তমান সমান রাখা: এই দুই সিদ্ধান্তের মিলিত ফল তাৎক্ষণিক থামা।"}],"failure":["e-stop যদি থামানোর বদলে ঘরে ফেরাত (<code>reset_arm<\/code>-ই ডেকে ফেলত), বিপদের মুহূর্তে হাতটা 2-সেকেন্ডের এক দীর্ঘ সুইংয়ে পুরো workspace পেরোত — থামানোর চেয়ে নড়াচড়াই বেড়ে যেত; রোগ সারাতে গিয়ে রোগী আরও অসুস্থ।","চাকার শূন্য-প্রকাশটি বাদ গেলে e-stop কেবল হাত থামাত — বেস আগের বেগেই গড়িয়ে চলত থাকত; ‘EMERGENCY STOP’ লাইনটি তখন অর্ধেক সত্য হয়ে যেত।","ব্রেক-বার্তাটি যদি <code>time = 2000<\/code> নিয়ে যেত, ‘থামা’-ও 2-সেকেন্ডের গ্লাইড হয়ে যেত — হাত স্থির হওয়ার আগেই আরও একগুচ্ছ কোণ পেরিয়ে আসত; 100ms-ই সেই শেষ লাফটা গিলে ফেলে।","ধরে নিও যদি e-stop গতিও মুছে দেয় — আসলে দেয় না, <code>speed<\/code>/<code>turn<\/code> অক্ষত থাকে — তাহলে pause তুলে প্রথম চালার কী চাপতেই রোবট আগের (সম্ভবত বেশ করে বুস্ট করা) গতিতে ঝাঁপিয়ে পড়বে; থামা মানে ভুলে যাওয়া নয়, এই নকশার ইচ্ছাকৃত সিদ্ধান্ত।"]},"robot":{"correct":"ঠিকঠাক চললে — <code>r<\/code> কী চাপলে ছয় সার্ভো একসঙ্গে 2 সেকেন্ডের মসৃণ গ্লাইডে [90, 90, 0, 0, 90, 90]-এ ফিরে আসে আর terminal-এ ‘[SYSTEM] Arm reset to Home Position.’ ছাপা হয়; SPACE (বা pause) চাপলে চাকা তাৎক্ষণিক শূন্য-বেগে দাঁড়ায় এবং হাত যে-কোণে ছিল ঠিক সেখানেই 100ms-এ জমে যায় — কোনো অবস্থান-স্মৃতি হারায় না।","incorrect":"একটি ভুল প্রত্যাশা: ‘e-stop সবকিছু মুছে দিল’ ভেবে pause তুলেই চালার কী চাপলে রোবট পুরনো <code>speed<\/code>/<code>turn<\/code>-এই ছুটতে শুরু করবে — এই function সেগুলো বদলায়ই না; আর হাতও ঘরে ফিরবে না, কনুই ঠিক যেখানে ছিল (যেমন 37°-এ) সেখানেই ঝুলন্ত থাকবে।"},"id":"part-08","start":123,"end":148,"lang":"python","animType":"estopBrake","flags":[]},{"n":9,"fname":"yahboom_keyboard.py","enTitle":"main — Slow Start, Pause & E-Stop","explain":[{"a":150,"b":152,"text":"<b>main() — প্রোগ্রামের সূচনা-দরজা<\/b>: <code>rclpy.init()<\/code> দিয়ে ROS 2-এর জগৎ জাগে — node বানানোর আগেই এই এক লাইন লাগবেই। তারপর <code>robot_teleop = YahboomKeyboard(\"yahboom_keyboard_ctrl\")<\/code> — এক লাইনে গোটা ক্লাসের জন্ম: Part 5-এ দেখা constructor ভেতর থেকেই publishers, safety-limit parameter আর <code>reset_arm()<\/code> সব সম্পন্ন করে। মন দিয়ে দেখো — এই লাইন ফেরার আগেই হাতটা home-অবস্থানে ফেরার ২-সেকেন্ডের যাত্রা ইতিমধ্যে শুরু করে দিয়েছে; পরের লাইনগুলো তখন একটা সজ্জিত, জেগে ওঠা রোবটের ওপর কাজ করছে।"},{"a":154,"b":158,"text":"<b>শুরুর অবস্থা — সবকিছু ইচ্ছাকৃত ধীর ও থিতু<\/b>: <code>speed, turn = 0.2, 1.0<\/code> — দুটি সীমার (linear 1.0 m/s, angular 5.0 rad/s) ঠিক <b>এক-পঞ্চমাংশ<\/b> করে নিয়ে যাত্রা; এই series-এর আগের joystick-controller analysis (folder 02)-এর ডিফল্ট নিচু গিয়ার যেমন ধীরে শুরু করত, এখানেও সেই একই নিরাপত্তা-দর্শন — ভুল কী চাপা পড়লেও প্রথম মুহূর্তে বিপজ্জনক গতি নেই। <code>x, y, th = 0, 0, 0<\/code> মানে রোবট দাঁড়িয়ে, <code>stop = False<\/code> মানে নিয়ন্ত্রণ চালু, <code>count = 0<\/code> একটি গণনাকারী বাক্স শূন্যে (লুপ পরে একে কাজে লাগাবে)। আর <code>twist = Twist()<\/code> — লুপের বাইরে <b>একবারই<\/b> বানানো একটিমাত্র পুনর্ব্যবহারযোগ্য বার্তা-অবজেক্ট; প্রতিটি পাসে শুধু এর ঘরগুলোর মান নতুন করে বসবে (Part 11) — প্রতি লুপে নতুন অবজেক্ট বানানোর কোনো খরচ নেই।"},{"a":160,"b":162,"text":"<code>try:<\/code> — সামনে যে অনন্ত-লুপ আসছে তার চারপাশের আশ্রয়-বেষ্টনী; এর জোড়া except/finally ফাইলের শেষে বিপদ ধরবে আর বিদায়ের আগে জোর করে থামাবে। ভেতরে ঢুকে <code>print(msg)<\/code> — উপরে সাজানো control-panel মেনুটি ছাপা হয় <b>একবারই<\/b>, লুপের ভেতরে নয়; সঙ্গে <code>print(robot_teleop.vels(speed, turn))<\/code> বর্তমান গতির স্ট্যাটাস-লাইন দেখায় — চালক প্রথম কী ছোঁয়ার আগেই জেনে নেয় রোবট 0.20 m/s / 1.00 rad/s ধাপে দাঁড়িয়ে আছে।"},{"a":164,"b":165,"text":"<code>while True:<\/code> — কার্যত অনন্ত চালনা-লুপ; ভেতরের প্রথম কাজ <code>key = robot_teleop.getKey()<\/code> — প্রতিটি পাসে কীবোর্ডের দিকে একবার তাকানো। Part 6-এ দেখা <code>getKey()<\/code>-এর select-timeout 0.1 সেকেন্ড, তাই এই লুপ প্রায় <b>10 Hz ক্যাডেন্সে<\/b> ঘোরে: কী না চাপা থাকলে খালি string ফেরে, লুপ থামে না — দাঁড়িয়ে থেকেই নজরদারি চলতে থাকে। লক্ষ করো — এই দুই লাইনই পুরো প্রোগ্রামের ইনপুট-নল: প্রতিটি পাসে ঠিক এক অক্ষর, আর পরের সব if-elif সেই এক অক্ষরের ওপর সাজানো (Part 10)।"},{"a":167,"b":173,"text":"<b>s — pause/resume টগল<\/b>: <code>if key in (\"s\", \"S\"):<\/code> ছোট-বড় দুই হাতের অক্ষরই ধরে। <code>stop = not stop<\/code> পতাকাটি উল্টে দেয় (flip-flop), <code>print(f\"[SYSTEM] ALL CONTROLS PAUSED: {stop}\")<\/code> True/False জানিয়ে দেয় — সাবধান, <code>stop<\/code>-এর মান True মানেই অবস্থা <b>PAUSED<\/b>, আর resume-এও লেখাটা 'PAUSED' থাকে, শুধু মান False হয়ে যায়। এরপর <code>if stop:<\/code> নামক সূক্ষ্ম প্রহরী: <code>robot_teleop.emergency_stop()<\/code> (Part 8 — চাকায় শূন্য Twist + হাতের তাৎক্ষণিক ব্রেক) আর <code>x, y, th = 0, 0, 0<\/code> শুধু <b>থামার দিকের রূপান্তরে<\/b> (False→True) চলে — এটি edge-action, level-action নয়। আবার চালু হতে কিছুই করা লাগে না: টগল হলেই প্রকাশ-লুপ (Part 11) আবার কমান্ড পাঠানো শুরু করে — যদিও x, y, th শূন্য থাকায় প্রথমে পাঠায় শূন্য-গতি।"},{"a":175,"b":179,"text":"<b>স্পেস-বার — এককালীন ইমার্জেন্সি স্টপ<\/b>: <code>elif key == ' ':<\/code> শাখায় তিনটি কাজ পাশাপাশি — <code>robot_teleop.emergency_stop()<\/code>, <code>x, y, th = 0, 0, 0<\/code>, তারপর <code>print(\"[SYSTEM] EMERGENCY STOP ENGAGED.\")<\/code>। s-এর সঙ্গে মূল পার্থক্য: এখানে <code>stop<\/code> পতাকায় হাতই দেওয়া হয় না — কোনো pause নেই। অর্থাৎ এটি শুধু ‘এখনই থামো’-র এক টোকা: ব্রেক নামা মাত্রই রোবট নতুন কমান্ডের জন্য প্রস্তুত — সঙ্গে সঙ্গে i চাপলে আবার এগোবে; আর s হলো freeze-mode — থামাও এবং থেকে যাও, আবার চালু করার একটাই রাস্তা আবার s।"}],"math":{"intro":"এই Part-এর গণিত তিন স্তরে: একটি দুই-অবস্থার flip-flop, তার ওপর একটি edge-শর্ত, আর শুরুর ধীর-গতির ভগ্নাংশ — সঙ্গে সংখ্যায় সেগুলির পরীক্ষা।","levels":[{"label":"Level 1 — দুই-অবস্থার flip-flop","latex":"\\[ S_{k+1} = \\lnot S_k, \\qquad S_k \\in \\{\\bot, \\top\\} \\]","text":"প্রতিটি s-চাপ অবস্থা-মেশিনকে ঠিক এক ধাপ এগোয়: True থেকে False, False থেকে True। দুটি stable অবস্থা — চালু (<code>stop<\/code> = False) আর থামা (<code>stop<\/code> = True); s না চাপা পর্যন্ত অবস্থা নিজে নিজে বদলায় না।"},{"label":"Level 2 — edge-ট্রিগার","latex":"\\[ \\text{e-stop} \\iff \\bigl( S_{k-1} = \\bot \\,\\wedge\\, S_k = \\top \\bigr) \\]","text":"গার্ড <code>if stop:<\/code> কেবল রাইজিং এজে সত্য — False থেকে True রূপান্তরের পাসে ঠিক একবার ই-স্টপ ছোড়ে। True থেকে False (resume) যাত্রায় শর্ত মিথ্যা, সেখানে কিছুই ছুটে না; কাজ হয় থাকা-অবস্থায় (level) নয়, বদলের মুহূর্তে (edge)।"},{"label":"Level 3 — ধীর-শুরুর অনুপাত","latex":"\\[ \\frac{s_0}{L_{\\mathrm{lin}}} = \\frac{0.2}{1.0} = \\frac{1}{5}, \\qquad \\frac{t_0}{L_{\\mathrm{ang}}} = \\frac{1.0}{5.0} = \\frac{1}{5} \\]","text":"শুরুর linear ও angular গতি দুটোই নিজের সীমার ঠিক এক-পঞ্চমাংশ — অর্থাৎ 20%। দুই স্তরে একই ভগ্নাংশ কাকতাল নয়, ইচ্ছা: প্রথম চাবি-চাপেই রোবট জোর করে ভদ্র থাকুক।"}],"numeric":[{"latex":"\\[ 0.2 \\times 1.1^{5} = 0.2 \\times 1.61051 \\approx 0.322\\ \\mathrm{m/s} \\]","text":"q পাঁচবার চাপলে সামগ্রিক গুণক 1.1 পাঁচবার পায়: 0.2 থেকে প্রায় 0.322 m/s — 1.0 m/s সীমার এখনও অনেক নিচে; angular তখন 1.0 × 1.61051 অর্থাৎ প্রায় 1.61 rad/s, 5.0-এর আরও নিচে।"},{"latex":"\\[ s, s, s: \\quad S: \\bot \\to \\top \\to \\bot \\to \\top \\quad \\Rightarrow \\quad N_{\\text{e-stop}} = 2 \\]","text":"থামাও → চালাও → থামাও: তিনটি s-চাপে রাইজিং এজ দুটি (প্রথম ও তৃতীয়) — ই-স্টপ ঠিক দুইবার ছোড়ে; মাঝের চাপটি কেবল পতাকা নামায়, আলাদা কিছুই করে না।"},{"latex":"\\[ f_{\\text{loop}} = \\frac{1}{0.1\\ \\text{s}} = 10\\ \\text{Hz}, \\qquad T_{\\text{react}} \\leq 0.1\\ \\text{s} \\]","text":"getKey-এর 0.1 s timeout-ই লুপের হার ঠিক করে: খালি অবস্থায় লুপ 10 Hz-এ ঘোরে, আর চাপা কী পরের পাসেই ধরা পড়ে — স্পেস-চাপের বিলম্ব আদর্শ মডেলে সর্বোচ্চ 0.1 সেকেন্ড, চালকের চোখে তা তাৎক্ষণিক।"}],"mapping":[{"code":"stop = not stop","math":"\\[ S \\leftarrow \\lnot S \\]","text":"কোডের এক লাইনই Level 1-এর রূপান্তর — প্রতিটি s-চাপ অবস্থা-মেশিনের ঠিক এক ধাপ।"},{"code":"robot_teleop.emergency_stop()","math":"\\[ \\text{e-stop} \\iff S: \\bot \\to \\top \\]","text":"টগলের ঠিক পরে বসানো গার্ড — বর্তমান পাসে পতাকা সদ্য-True হলেই কল; resume-যাত্রায় (True→False) একই দুই লাইন সম্পূর্ণ নীরব।"}],"failure":["থামার শাখা থেকে <code>emergency_stop()<\/code> কলটি বাদ পড়লে: চাকা তবু সঙ্গে সঙ্গেই থেমে যেত — একই পাসেই লুপের else-শাখা (Part 11) টাটকা শূন্য-Twist ছাড়ে, পুরোনো গতি-আদেশ জমে থাকার সুযোগই নেই; আসল ক্ষতি হাতে পড়ত — 100ms-এর ব্রেক-নির্দেশটি আর যেত না, চলমান 500ms/2000ms-এর শেষ হাত-আদেশ পুরোটা শেষ হয়ে তবেই হাত থামত।","স্পেস-বারও যদি <code>stop<\/code> উল্টে pause করত: প্রতিটি থামানোর পর আবার চালাতে দুটি কী লাগত — আগে থামার কী, তারপর s — বিপদ-মুহূর্তের ‘এক চাপে থামো, এক চাপে চালাও’-র সরলতাটাই হারিয়ে যেত।","যদি শুধু ছোট হাতের ‘s’ মেলানো হতো: Caps Lock-চালু চালকের কী-চাপ ‘S’ হয়ে এসে কোনো শাখাতেই মেলত না — সে থামাতেও পারত না, ছাড়ার প্রশ্নই তখন ওঠে না; (\"s\", \"S\") দুই হাতই ধরায় এই ফাঁদ নেই।","স্পেস-চাপের পরে x, y, th শূন্য না করলে: ই-স্টপ বার্তা যাওয়ার পরেই Part 11-এর লুপ পুরোনো মান দিয়ে পরের Twist ছেড়ে দিত — রোবট এক নিঃশ্বাস থেমেই আবার আগের গতিতে ফিরত; শূন্য-করাটাই থামাকে টিকিয়ে রাখে।"]},"robot":{"correct":"কোড ঠিক চললে: চালু হওয়ার সঙ্গে হাত home-এ যায়, পর্দায় মেনু আর 0.20 m/s / 1.00 rad/s স্ট্যাটাস-লাইন ছাপা হয়, রোবট এক-পঞ্চমাংশ গতির থিতু অবস্থায় কী-চাপের অপেক্ষায় থাকে। s চাপলে চাকা-হাত সব সঙ্গে সঙ্গে জমে যায় আর সব নিয়ন্ত্রণ স্থগিত; আবার s দিলে নিয়ন্ত্রণ ফেরে। স্পেস চাপলে তাৎক্ষণিক ব্রেক নামে কিন্তু নিয়ন্ত্রণ খোলা থাকে — পরের চালানোর কী-ই রোবটকে আবার নাড়ায়।","incorrect":"সহজে যে প্রত্যাশা ভুল হয়: s দিয়ে pause করে আবার চালু করলে রোবট আগের গতিতে ফিরে যাবে ভাবা — আসলে pause-এর মুহূর্তেই x, y, th শূন্য করে দেওয়া হয়, resume-এ রোবট থেমেই থাকে, নতুন করে চালানোর কী না চাপলে নড়ে না। আর স্পেসকে ‘থামা-মোড’ ভাবলে চালক অবাক হবে: থামার পরেই i চাপলে রোবট সঙ্গে সঙ্গে এগিয়ে যাবে, কারণ stop-পতাকা বদলায়নি।"},"id":"part-09","start":150,"end":179,"lang":"python","animType":"pauseToggle","flags":[]},{"n":10,"fname":"yahboom_keyboard.py","enTitle":"The Movement Engine — Latch & Gears","explain":[{"a":181,"b":185,"text":"<b>পজের প্রহরী, তারপর চাকার চাবি<\/b>: comment <code># If NOT paused, process movement<\/code> নিয়মটা ঘোষণা করে — <code>elif not stop:<\/code> মানে <code>stop<\/code> পতাকা উঠে থাকলে (Part 9-এর 's') নিচের <b>সবকিছু<\/b> লাফিয়ে পার হয়ে যায়; পজ এখানে সম্পূর্ণ — হাতের চাবিও ব্যতিক্রম নয়। পতাকা নামা থাকলে প্রথম পরীক্ষা <code>if key in moveBindings.keys():<\/code>; মিললে <code>x, y, th = moveBindings[key]<\/code> দিক-ত্রয় এক লাইনে বসে যায়, আর <code>count = 0<\/code> ল্যাচ-ঘড়ি শূন্যে ভরে দেয়। <b>মন দিয়ে দেখো<\/b> — এই Part-এর সবচেয়ে গুরুত্বপূর্ণ আচরণ এখানেই লুকানো: গতি <b>ল্যাচ (latch)<\/b> হয়ে যায়। 'i' একবার টোকা দিলেই রোবট চলতে থাকবে, চাবি ধরে রাখার দরকার নেই; ধরে রাখলে terminal/OS নিজেই বারবার সেই byte পাঠায় (auto-repeat) বলে প্রতিটি পোলে <code>count<\/code> শূন্যেই ফিরে আসে। আর একটা অদৃশ্য স্মারক: line 185-এর <code>count = 0<\/code>-এর শেষে সোর্সে হুবহু একটা TAB অক্ষর লেগে আছে — কারো উপকারে আসে না, কারো ক্ষতিও করে না, শুধু টিকে আছে।"},{"a":186,"b":192,"text":"<b>গিয়ার-সিঁড়ি<\/b>: <code>elif key in speedBindings.keys():<\/code> — q/z/w/x/e/c পরিবার। <code>speed = speed * speedBindings[key][0]<\/code> ও <code>turn = turn * speedBindings[key][1]<\/code>: প্রতি চাপে নিজের গুণিতক (ওঠার চাবিতে 1.1, নামানোরটায় 0.9) লাগে, সঙ্গে <code>count = 0<\/code> — গিয়ার-চাপও 'চেনা' key, তাই ল্যাচ-ঘড়িও টেনে দেয়। এরপর সতর্কতা-ছাদ: <code>speed = min(speed, robot_teleop.linear_speed_limit)<\/code> ও <code>turn = min(turn, robot_teleop.angular_speed_limit)<\/code> (parameter-দের ডিফল্ট 1.0 ও 5.0)। <b>লক্ষ করো<\/b>: clamp দুটি চলে <b>শুধু speed-চাবির চাপে<\/b>, প্রতি লুপে নয় — তাই ছাদে পৌঁছে গেলে আর নড়ে না: 1.0 × 1.1 = 1.1 হয়ে <code>min<\/code>-এ আবার 1.0-ই ফেরে, খালি q চেপে লাভ নেই। শেষ লাইন <code>print(robot_teleop.vels(speed, turn))<\/code> — প্রতি চাপের পর বর্তমান গিয়ার terminal-এ দেখা যায়, চালক অন্ধ থাকে না।"},{"a":194,"b":204,"text":"<b>হাতের key-প্যাঁচ<\/b>: <code># Arm Controls<\/code>-এর নিচে দশটা এক-লাইন <code>elif<\/code> — digit 1..0 জোড়ায় জোড়ায় পাঁচটা joint চালায়: বিজোড় digit নামায় (−5°), জোড় digit তোলে (+5°) — 1/2 জোড়া joint 1, 3/4 joint 2, 5/6 joint 3, 7/8 joint 4, 9/0 joint 5। প্রতিটা চাপ <b>একবারের (one-shot)<\/b> কল — Part 7-এর <code>step_arm_joint<\/code>-এর ভেতরেই ডিগ্রি-হিসাব, সীমা-ছাদ আর প্রকাশনা সামলানো। আরেকটা সূক্ষ্ম তথ্য: এই শাখাগুলো <code>count<\/code> ছুঁয়ে দেখেই না — চাকা ল্যাচ-হয়ে চলছে অবস্থায় হাত সরাতে ব্যস্ত থাকলে মাঝের ফাঁকা পোল-গুলোই count বাড়িয়ে চাকার গতি ~0.5s নীরবতায় নিজে থেকেই মেয়াদ-শেষ করে দিতে পারে।"},{"a":206,"b":208,"text":"<b>গ্রিপার<\/b>: comment-টা ডকুমেন্টের মতোই পরিষ্কার — <code># NEW Gripper Controls (g to close, h to open)<\/code>; <code>elif key in ('g', 'G'): robot_teleop.step_arm_joint(6, -5)<\/code> ধরায় −5° (Close), <code>('h', 'H')<\/code> খোলে +5° (Open) — joint 6-এর নিজস্ব সীমা-ছাদ Part 7-এর ভেতরেই পাহারা দেওয়া। ছোট্ট স্টাইল-তফাত: digit-দের একক <code>==<\/code>-এর বদলে এখানে টুপল-সদস্যপনা পরীক্ষা — ছোট-বড় দুই রূপই এক লাইনে ধরা পড়ে, কাজে কোনো ফল বদলায় না।"},{"a":210,"b":214,"text":"<b>রিসেট, তারপর বাকি-সবের ঝুড়ি<\/b>: <code>elif key in ('r', 'R'): robot_teleop.reset_arm()<\/code> — ছোট-বড় যেকোনো r-এ হাত home-অবস্থানে ফেরে (Part 8)। এরপর <code>else:<\/code> — বাকি সব key, আর সবচেয়ে জরুরি: <b>ফাঁকা পোল-ও<\/b> (key = '', Part 6-এর select timeout) এখানেই পড়ে। <code>count = count + 1<\/code> প্রতি অচেনা/ফাঁকা মুহূর্তে গণনা বাড়ায়, আর <code>if count &gt; 4:<\/code> প্রথম সত্য হয় ৫ম খালি পোলে — তখনই <code>x, y, th = 0, 0, 0<\/code>। এটাই ল্যাচের মেয়াদ: শেষ চেনা key-এর পর ~৫টি ফাঁকা পোল × 0.1s ≈ 0.5s নীরবতা, তারপরই গতি শূন্য। অর্থাৎ 'i' ছেড়ে দেওয়ার আধা সেকেন্ডের মধ্যেই রোবট নিজে থেমে যায় — ল্যাচ আছে, কিন্তু চিরকালের নয়।"},{"a":215,"b":216,"text":"<code>if key == '\\x03':  # Ctrl+C<\/code> — Part 6-এ raw mode যে প্রতিশ্রুতি দিয়েছিল তার পূর্তি এখানে: raw terminal Ctrl+C-কে signal বানায় না, সোজা একটা byte হিসেবে পাঠায় — তাই সেটা এই else-শাখার সাধারণ 'অচেনা key'-দের ভিড়েই আসে, আর বেরোনোর রাস্তাটা হাতে গড়তে হয়েছে: <code>break<\/code> কোনো exception-এর অপেক্ষা না করেই <code>while<\/code>-লুপ ভেঙে দেয়, যাতে Part 11-এর বিদায়-ক্রমে (শাটডাউন) পরিষ্কারভাবে পৌঁছানো যায়।"}],"math":{"intro":"এই Part-এই ফাইলের সবচেয়ে বড় গণিত: একটানা চলা ল্যাচ করা গতি, 1.1-গুণিতক গিয়ারের জ্যামিতিক সিঁড়ি আর তার ছাদ, এবং ল্যাচের আধা-সেকেন্ডের মেয়াদ — তিনটি স্তরে সাজানো।","levels":[{"label":"Level 1 — ল্যাচ করা গতি","latex":"\\[ (v_x, v_y) = s \\cdot (x, y), \\quad \\omega = a \\cdot \\theta, \\quad \\text{held while } c \\leq 4 \\]","text":"s মানে <code>speed<\/code>, a মানে <code>turn<\/code>, c মানে <code>count<\/code>; দিক-ত্রয় (x, y, θ) কেবল চিহ্ন বহন করে। কোনো চেনা move-key চাপলে ত্রয়টি বসে যায় ও c ← 0; c ≤ 4 থাকা পর্যন্ত তা বদলায় না — পরের Part-এর গুণ-ও-প্রকাশ প্রতি লুপে একই গতি পাঠাতে থাকে। যেকোনো চেনা key c-কে শূন্যে টানে, তাই চাবি চেপে ধরে রাখা মানে auto-repeat-এ গতি বারবার নবায়ন — অবিরাম চলন।"},{"label":"Level 2 — জ্যামিতিক সিঁড়ি ও ছাদ","latex":"\\[ s_k = \\min \\left( s_0 \\cdot 1.1^{k},\\; L \\right), \\qquad a_k = \\min \\left( a_0 \\cdot 1.1^{k},\\; A \\right) \\]","text":"প্রতিটি ওঠার চাপে গুণিতক 1.1 (নামানোর চাবিতে 0.9), আর <b>প্রতি চাপেই<\/b> তার পরে ছাদ-প্রয়োগ: L = 1.0 m/s (<code>linear_speed_limit<\/code>), A = 5.0 rad/s (<code>angular_speed_limit<\/code>)। যেহেতু ছাদ প্রতি ধাপে লাগে, s = L-এ পৌঁছে গেলে পরের 1.1-গুণও <code>min<\/code>-এ গিলে যায় — সিঁড়ি ছাদ ভাঙতে পারে না, ওপরে উঠে সমতল হয়ে যায়।"},{"label":"Level 3 — ল্যাচের মেয়াদ-উত্তীর্ণ","latex":"\\[ t_{\\mathrm{stop}} \\approx N \\cdot T = 5 \\times 0.1\\,\\mathrm{s} = 0.5\\,\\mathrm{s} \\]","text":"প্রতিটি ফাঁকা পোল (T = 0.1s, Part 6-এর select timeout) c-কে এক করে বাড়ায়; N = 5-তে c &gt; 4 সত্য হয়ে (x, y, θ) শূন্য হয়। কাজেই শেষ চেনা key থেকে প্রায় আধা সেকেন্ড নীরবতা গেলেই গতি মরে — চাকার নিরাপত্তা-জাল এই ছোট্ট গুণফলটুকুই।"}],"numeric":[{"latex":"\\[ 0.2 \\times 1.1^{16} \\approx 0.919, \\quad 0.919 \\times 1.1 = 1.011 \\rightarrow \\min(1.011,\\, 1.0) = 1.0 \\]","text":"ছাদে ওঠা: ১৬টি q-র পর 0.919 m/s, ১৭-তম চাপে 1.011 — <code>min<\/code>-এ গিলে ঠিক 1.0। কারণটাও সুন্দর: 1.1^k ≥ 5 লাগবে (0.2 × 5 = 1.0), যার মানে k ≥ ln 5 / ln 1.1 ≈ 16.9 — তাই 0.2 → 1.0 m/s পেতে ঠিক ১৭টি চাপ; turn-এর 1.0 → 5.0 rad/s-ও একই হিসাবে ১৭টি চাপ।"},{"latex":"\\[ k \\geq \\frac{\\ln 0.2}{\\ln 0.9} \\approx 15.3 \\;\\Rightarrow\\; k = 16: \\quad 1.0 \\times 0.9^{16} \\approx 0.185\\;\\mathrm{m/s} \\]","text":"নামার সিঁড়ি: ছাদের 1.0 থেকে শুরুর 0.2-এ ফিরতে z-এর লাগে ≈১৬টি চাপ (0.9^16 ≈ 0.185)। নামার পথে min-ছাদ জাল ধরে না — মান সীমার নিচে থাকে — তাই অবতরণটা খাঁটি জ্যামিতিক, কোনো প্রান্ত-ছোঁয়া ছাড়া।"},{"latex":"\\[ c = 5: \\quad t_{\\mathrm{stop}} = 5 \\times 0.1\\,\\mathrm{s} = 0.5\\,\\mathrm{s} \\]","text":"ল্যাচের মেয়াদ: 'i' ছাড়ার ঠিক পর থেকে প্রতি 0.1s-এ একটি ফাঁকা পোল count বাড়ায় — পাঁচ পাল্লাতেই গতি শূন্য। মানে চেপে ছাড়ার প্রায় আধা সেকেন্ডের মধ্যেই চাকা থেমে যায়; রোবট ঠিক কতটা এগোবে তা এই সময় আর গিয়ারের গুণফল — দুই-ই চালকের হাতে।"}],"mapping":[{"code":"x, y, th = moveBindings[key]","math":"\\[ (x, y, \\theta) \\leftarrow \\mathrm{moveBindings}[k] \\]","text":"dictionary-র lookup-ই সমীকরণের ডান-হাত: key একটি প্রতীক, মান তিন-মাত্রিক দিক — এক লাইনে গতির দিক নির্ধারণ, সঙ্গে অদৃশ্য সহ-ফলাফল c ← 0, অর্থাৎ ল্যাচ নতুন করে জ্বালানো।"},{"code":"if count > 4:","math":"\\[ c \\geq 5 \\;\\Rightarrow\\; (x, y, \\theta) \\leftarrow (0, 0, 0) \\;\\Rightarrow\\; v = 0 \\]","text":"৫ম ফাঁকা পোলে শর্তটি প্রথম সত্য হয় (পূর্ণসংখ্যায় c &gt; 4 মানেই c ≥ 5) — এই একটাই তুলনা ল্যাচের মেয়াদ-শেষের পুরো গণিত; ঘড়ি-ভিত্তিক timeout-এর সস্তা বিকল্প, যেখানে সময় মাপে select-এর 0.1s টাইমআউট।"}],"failure":["থ্রেশোল্ড <code>count &gt; 4<\/code>-এর জায়গায় <code>count &gt; 40<\/code> হলে মেয়াদ হতো 40 × 0.1s = ৪ সেকেন্ড — 'i' ছেড়ে দিয়ে চালক অন্যদিকে তাকালেও রোবট আরও চার সেকেন্ড এগিয়ে টেবিল-প্রান্ত বা দেয়ালে ধাক্কা মারত।","min-ছাদ দুটো সরিয়ে দিলে ৩০টি q-তেই 0.2 × 1.1^30 ≈ 3.49 m/s — বাস্তব চাকার যেকোনো নিরাপদ সীমা ছাড়িয়ে যাওয়া আদেশ সোজা motor-এ চলে যেত; রোবট প্রায় ছুটে পালাত।","arm key-গুলো যদি <code>elif not stop:<\/code>-এর বাইরে পজ-পরীক্ষার আগে থাকত, তাহলে পজ করা অবস্থাতেও হাত নড়ত — menu-র 'PAUSE ALL CONTROLS' প্রতিশ্রুতিটাই মিথ্যা হয়ে যেত; এই কোড তাদের ঠিক প্রহরীর পেছনেই রেখেছে।","চেনা key যদি <code>count<\/code> শূন্যে না টানত, key ধরে রাখাও আর অবিরাম চলন দিত না — auto-repeat শুরুর আগের ফাঁকা পোল-গুলোতেই count পাঁচ ছাড়াত, রোবট চলন্ত-থেমে-চলন্ত করে কেঁপে কেঁপে এগোত।"]},"robot":{"correct":"চালু অবস্থায় 'i' চাপলেই রোবট 0.2 m/s-এ সামনে যেতে থাকে — key ছেড়ে দিলেও প্রায় আধা সেকেন্ড চলে, তারপর নিজে থেমে যায়; q/w/e চাপায় গিয়ার ১০% করে উঠে 1.0 m/s ও 5.0 rad/s ছাদে আটকে যায় (প্রতি চাপে terminal-এ বর্তমান গতি ছাপা হয়), digit/g/h চাপায় হাত ৫° করে নড়ে, r ছুঁলে হাত home-এ ফেরে। পজ থাকলে এসবের কিচ্ছু হয় না।","incorrect":"গেমপ্যাডের অভ্যাসে যদি ভাবো key ছাড়ার সাথে সাথেই রোবট থেমে যাবে, সেই আশা এই কোডে ভঙ্গ হয় — ল্যাচ থাকায় 'i' এক টোকাতেই রোবট আধা সেকেন্ড পর্যন্ত এগোতেই থাকে, ফাঁকা জায়গায় সে-ই দূরত্ব বাড়িয়ে দেয়। আবার ছাদে পৌঁছানোর পরও q চেপে আর গতি বাড়বে ভাবা ভুল — 1.0 × 1.1 টুক করে min-এ গিলে যায়, আর vels-এর রিপোর্ট আগের মানতেই থেকে যায়।"},"id":"part-10","start":180,"end":216,"lang":"python","animType":"speedLadder","flags":[]},{"n":11,"fname":"yahboom_keyboard.py","enTitle":"Heartbeat Publish & Graceful Shutdown","explain":[{"a":218,"b":223,"text":"<b>থামা-অবস্থার ঘর<\/b> — উপরের <code>elif not stop:<\/code> শাখার <code>else<\/code>: লুপ pause-এ থাকলে প্রতিটি কী-এর গন্তব্য এখানেই। নিয়ম মাত্র দুটি: <code>if key == '\\x03': break<\/code> — এই ঘর থেকে বেরোনোর একমাত্র দরজা, Ctrl+C-র সেই বাইট; আর <code>elif key != '':<\/code> — খালি স্ট্রিং মানে টাইমআউট-পাস (কেউ কিছু চাপেনি), তখন কিছুই ছাপা হয় না, নাহলে <code>print(\"[SYSTEM] System paused. Press 's' to resume.\")<\/code>। মন দিয়ে দেখো — <code>i<\/code>, <code>1<\/code>, <code>q<\/code> সব সমানভাবে নিষ্ক্রিয় থাকে — কোনো কাজে লাগে না, কেবল উপরের ‘System paused’ প্রিন্ট-লাইনটাই ওঠে। pause মানে চাকা-হাত সহ সম্পূর্ণ হিম-অবস্থাই ডিজাইনের উদ্দেশ্য, আর আবার জাগানোর একমাত্র চাবি 's' — Part 9-এর toggle।"},{"a":225,"b":228,"text":"<b>প্রতি পাসে হিসাব, শাখাহীন<\/b>: <code>twist.linear.x = speed * x<\/code>, <code>twist.linear.y = speed * y<\/code>, <code>twist.angular.z = turn * th<\/code> — এই তিন লাইন কোনো if-এর ভেতরে নয়; pause হোক বা চালু, লুপের প্রতিটি পাসেই চলে। Part 9-এ একবার বানানো <b>সেই একই<\/b> <code>twist<\/code> object-এর তিনটি ঘর নতুন করে লেখা হয় — নতুন <code>Twist()<\/code> বানানো হয় না, তাই চালু-পাসে এখানকার allocation শূন্য — নতুন অবজেক্ট জন্মায় শুধু নিচের pause-শাখার <code>publish(Twist())<\/code>-এ। Pause-এ এই হিসাবটা অবান্তর ঠিকই (x, y, th তখন 0, আর নিচের ফটক সেই মান ব্যবহারও করে না) — কিন্তু চালু অবস্থায় কী ছাড়ার পর Part 10-এর auto-zero (কাউন্ট 4 পার হলে x, y, th শূন্য) যেন সাথে সাথে প্রকাশিত বার্তায় প্রতিফলিত হয়, সে জন্যই প্রতিটি পাসে নতুন করে গুণ।"},{"a":230,"b":233,"text":"<b>প্রকাশের ফটক — হার্টবিটের জন্মস্থান<\/b>: <code>if not stop:<\/code> হলে <code>robot_teleop.pub_cmd_vel.publish(twist)<\/code> — গতি (চাবি ছাড়ার পরও ল্যাচ-উইন্ডোর প্রথম ৪টি ফাঁকা পোল পর্যন্ত আগের গতিই যায়, count &gt; 4 হলে শূন্য); <code>else:<\/code> হলে <code>robot_teleop.pub_cmd_vel.publish(Twist())<\/code> — <b>টাটকা<\/b> শূন্য-Twist। লক্ষ করো ফাঁকটা: দুই শাখাতেই publish আছে, তাই <code>/cmd_vel<\/code> প্রতি পাসে — getKey-র 0.1s পোল-ছন্দে প্রায় 10 Hz — <b>সবসময়<\/b> বার্তা পায়। Pause-এ এই শূন্যের ধারাই হার্টবিট: মোটর-কন্ট্রোলারকে সক্রিয়ভাবে 'থামো' বলা হয়, আর টেলিঅপের প্রাণ-সংকেত প্রমাণিত থাকে — বহু base driver পুরনো (stale) cmd_vel-এ watchdog চালায়, নীরবতা দেখলে টেলিঅপকেই মৃত ভেবে ভরসা হারায়। Part 1-এর README-observation <code>ros2 topic echo /cmd_vel<\/code> দিয়ে এই ধারা সরাসরি চোখে দেখা যায়।"},{"a":235,"b":236,"text":"<code>except Exception as e:<\/code> → <code>print(f\"[ERROR] {e}\")<\/code> — try-block-এর (কার্যত পুরো চালানোর) ভেতরের যেকোনো ব্যতিক্রম এখানে এসে terminal-এ এক লাইনে ছাপা হয়। এর আসল দায়িত্ব ভদ্র রিপোর্টিং নয় — ভাঙন যে পথেই আসুক, নিচের <code>finally<\/code>-কে সক্রিয় রাখা। আর স্বাভাবিক প্রস্থানে এই লাইন নিজে থেকেই চুপ: কাঁচা (raw) মোডে Ctrl+C কোনো SIGINT জন্মায় না — লুপ বাইট <code>\\x03<\/code> দেখে নিজেই ভেঙে গেছে (Part 10) — তাই ব্যতিক্রমের পথটা মূলত অন্য ভুলের জন্যই খোলা রাখা।"},{"a":237,"b":238,"text":"<code>finally:<\/code> — Python-এর কঠিন চুক্তি: <code>try<\/code> স্বাভাবিকভাবে শেষ হোক, <code>break<\/code>-এ ভাঙুক বা ব্যতিক্রমে ফেটুক — এই ঘর <b>নিশ্চিতভাবেই<\/b> চলবে। পাশের comment নিজেই নীতিবাক্য বলে দেয়: graceful shutdown — বেরোনোর আগে সবকিছু থামানো। এই প্রোগ্রামের সবচেয়ে দায়িত্বশীল চারটি লাইন এর ঠিক নিচেই।"},{"a":239,"b":242,"text":"বিদায়ের চার ধাপ, ক্রমটি অভেদ্য: (১) <code>robot_teleop.emergency_stop()<\/code> — Part 8-এর চূড়ান্ত হিম-কমান্ড: চাকায় শূন্য-Twist, হাতে বর্তমান অবস্থানে 100 ms-এর brake-নির্দেশ; (২) <code>termios.tcsetattr(sys.stdin, termios.TCSADRAIN, robot_teleop.settings)<\/code> — শুরুতে তুলে রাখা টার্মিনাল-সেটিংস ফেরত বসানো; এটি না চললে বন্ধ করার পরেও shell কাঁচা মোডে পড়ে থাকত — টাইপ করা অক্ষর পর্দায় আর ফিরত না; (৩) <code>robot_teleop.destroy_node()<\/code> — publisher-সহ নোডের চিরতরে বিদায়; (৪) <code>rclpy.shutdown()<\/code> — rclpy-র context বন্ধ। বাইট <code>\\x03<\/code> থেকে সম্পূর্ণ shutdown-এর পুরো দূরত্ব এই চার লাইনই মেটিয়ে দেয়।"}],"math":{"intro":"শেষ Part-এর গণিত সময়ের গণিত: লুপ কোন ছন্দে হার্টবিট পাঠায়, থামানোর আদেশ কত দ্রুত রোবটে পৌঁছায়, আর চলার মেয়াদে কত বার্তা জমে — তিনটি ছোট হিসাবেই নিরাপত্তার মেরুদণ্ড।","levels":[{"label":"Level 1 — হার্টবিট ক্যাডেন্স","latex":"\\[ f = \\frac{1}{T} = \\frac{1}{0.1\\,\\text{s}} = 10\\ \\text{Hz}, \\qquad v_k = s \\cdot x_k \\ \\text{or}\\ 0 \\]","text":"getKey-র select-timeout T = 0.1s লুপের ছন্দ ঠিক করে দিয়েছে — প্রতি পাসে ঠিক একটি publish; চালু পাসে বার্তার মান s·x, pause-এ শূন্য — কিন্তু স্রোত কখনও শুকিয়ে যায় না।"},{"label":"Level 2 — ই-স্টপ বিলম্বের ঊর্ধসীম","latex":"\\[ t_{\\text{freeze}} \\leq T = 0.1\\ \\text{s} \\]","text":"কী-চাপ পরবর্তী পোলেই ধরা পড়ে — তাই SPACE-এর emergency_stop, pause-এর লক, বা শেষের হিম-কমান্ড রওনা হতে সর্বোচ্চ এক পিরিয়ড দেরি; মানুষের প্রতিক্রিয়া-সময়ের অনেক নিচে।"},{"label":"Level 3 — বার্তা-গণনা","latex":"\\[ N \\approx f \\cdot t = \\frac{t}{T} \\]","text":"t সময়ে /cmd_vel-এ মোট বার্তা প্রায় 10t; pause কেবল প্রতিটি বার্তার <b>মান<\/b> শূন্য করে, <b>গণনা<\/b> বন্ধ করে না — নীরব-দেখানো pause-ও হিসাবের খাতায় সশব্দ।"}],"numeric":[{"latex":"\\[ t = 60\\ \\text{s (paused)} \\;\\Rightarrow\\; N \\approx 10 \\times 60 = 600\\ \\text{zero-Twist} \\]","text":"এক মিনিট সম্পূর্ণ pause-এও /cmd_vel পেয়েছে প্রায় ছয়শো শূন্য-বার্তা — Part 1-এর <code>ros2 topic echo /cmd_vel<\/code> চালু রাখলে এই ধারা নিজেই চোখে পড়বে।"},{"latex":"\\[ t_{\\text{quit}} \\leq T + \\varepsilon \\approx 0.1\\ \\text{s} \\]","text":"Ctrl+C (বাইট <code>\\x03<\/code>) চাপা থেকে সম্পূর্ণ shutdown: সর্বোচ্চ এক পোল-বিরতি অপেক্ষা, তারপর finally-র চার ধাপ কার্যত তাৎক্ষণিক — মোট ব্যয় 0.1 সেকেন্ডের ঘরেই।"},{"latex":"\\[ \\bar{t}_{\\text{freeze}} = \\frac{T}{2} = 0.05\\ \\text{s} = 50\\ \\text{ms} \\]","text":"'s' বা SPACE-এর টোকা পিরিয়ডের যেকোনো মুহূর্তে পড়তে পারে — গড়ে অর্ধেক পিরিয়ড অপেক্ষা, মানে পঞ্চাশ মিলিসেকেন্ড; থামা এত দ্রুত যে চালকের চোখে বিলম্ব ধরাই পড়ে না।"}],"mapping":[{"code":"robot_teleop.pub_cmd_vel.publish(Twist())","math":"\\[ v(t) = 0 \\quad \\forall\\, t \\ \\text{in pause} \\]","text":"pause-এর পুরো সময়রেখা জুড়ে বার্তার মান ধ্রুব শূন্য-ফাংশন — তবু প্রেরণ প্রতি পাসে ঘটে: 'থামো' আর 'আমি সক্রিয়' একই বার্তায় চলে যায়।"},{"code":"robot_teleop.emergency_stop()","math":"\\[ \\forall\\ \\text{exit paths}: \\quad v_{\\text{final}} = 0 \\]","text":"লুপ যে পথেই ছাড়ুক — break হোক বা ব্যতিক্রম — চূড়ান্ত অবস্থা একটাই: চাকার গতি শূন্য; finally-র এই for-all চুক্তিটাই কোডে গাণিতিক রূপ পেয়েছে।"}],"failure":["Pause-এ শূন্য-প্রকাশ (হার্টবিট) বাদ দিলে: শেষ আদেশ ধরে রাখা-প্রকৃতির driver রোবটকে অবিরাম হামাগুড়িতে রাখত — চালক ভাবছে 'থামিয়েছি', চাকা ভাবছে 'চালিয়ে যাচ্ছি'; আর watchdog-ভিত্তিক driver নীরব cmd_vel-কে টেলিঅপের মৃত্যু ধরে ভরসা ছেড়ে দিত।","finally থেকে tcsetattr-রিস্টোর উঠে গেলে: প্রোগ্রাম চলে যাওয়ার পরেও shell কাঁচা মোডে পড়ে থাকত — টাইপ করা অক্ষর পর্দায় আসত না, Enter-ও সাড়া দিত না; কাঁচা-মোডের এই অদৃশ্য-লেখা আঘাতই termi
