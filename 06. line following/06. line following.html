<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06. line following</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#0a0a0a; --bg2:#111111;
  --card:#151515; --card2:#181818; --card3:#1d1d1d;
  --border:#262626; --border2:#303030; --border3:#3a3a3a;
  --text:#e8e8e8; --muted:#a0a0a0; --faint:#6e6e6e;
  --ex:#4fc3f7; --ex-dim:rgba(79,195,247,.09);
  --math:#7ee787; --math-dim:rgba(126,231,135,.08);
  --rb:#ffb454; --rb-dim:rgba(255,180,84,.08);
  --anim:#d2a8ff; --anim-dim:rgba(210,168,255,.08);
  --code-bg:#0d1117; --code-head:#161b22;
  --gutter-txt:#3d4f63; --gutter-line:#1c2530;
  --ok:#3fb950; --bad:#f85149;
  --ff-title:'Space Grotesk','Inter','Hind Siliguri',sans-serif;
  --ff-ui:'Inter','Hind Siliguri',system-ui,-apple-system,sans-serif;
  --ff-bn:'Hind Siliguri','Inter',sans-serif;
  --ff-mono:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --sb-w:292px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--ff-ui); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(79,195,247,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a}
a{color:var(--ex);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ex);outline-offset:2px;border-radius:4px}
button{font-family:var(--ff-ui)}

/* ============ APP LAYOUT ============ */
#app{display:flex;min-height:100vh}
#main{
  margin-left:var(--sb-w);
  flex:1;
  min-width:0;
  padding:52px 56px 80px;
  max-width:1180px;
}
.intro-banner{
  margin-bottom:48px;padding:30px 34px;
  background:linear-gradient(145deg,#141414,#101010);
  border:1px solid var(--border);border-radius:16px;
  position:relative;overflow:hidden;
}
.intro-banner::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(600px 180px at 12% 0%,rgba(79,195,247,.07),transparent 60%),
    radial-gradient(500px 160px at 88% 100%,rgba(210,168,255,.05),transparent 60%);
  pointer-events:none;
}
.intro-eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ex);margin-bottom:10px;
}
.intro-banner h1{
  font-family:var(--ff-title);font-size:clamp(26px,3.4vw,38px);
  font-weight:700;letter-spacing:-.01em;line-height:1.15;
}
.intro-banner h1 .path{color:var(--faint);font-weight:500}
.intro-desc{margin-top:12px;color:var(--muted);max-width:70ch;font-size:15px}
.intro-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stat-chip{
  font-family:var(--ff-mono);font-size:12px;color:#c9d1d9;
  background:#0d1117;border:1px solid var(--border2);
  padding:6px 12px;border-radius:999px;
}
.stat-chip b{color:var(--ex);font-weight:600}

/* ============ SIDEBAR ============ */
#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);
  background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;z-index:60;
  display:flex;flex-direction:column;
}
.sb-head{
  padding:26px 22px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg2);z-index:2;
}
.sb-folder{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;
  color:var(--text);letter-spacing:-.01em;line-height:1.3;
}
.sb-meta{
  margin-top:6px;font-family:var(--ff-mono);font-size:11.5px;
  color:var(--faint);letter-spacing:.08em;
}
#sb-nav{padding:14px 12px 30px;flex:1}
.sb-item{
  display:flex;align-items:baseline;gap:11px;
  padding:8px 12px;margin:1px 0;border-radius:8px;
  color:#9a9a9a;border-left:2px solid transparent;
  transition:background .18s,color .18s;
}
.sb-item .sb-num{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  min-width:20px;font-weight:500;
}
.sb-item .sb-name{
  font-size:13.2px;font-weight:500;line-height:1.35;
  font-family:var(--ff-ui);
}
.sb-item:hover{background:#181818;color:#d6d6d6;text-decoration:none}
.sb-item.active{
  background:linear-gradient(90deg,rgba(79,195,247,.10),rgba(79,195,247,.02));
  color:#eaf6fe;border-left:2px solid var(--ex);
}
.sb-item.active .sb-num{color:var(--ex)}
.sb-filesep{
  font-family:var(--ff-mono);font-size:10px;letter-spacing:.16em;
  color:#525252;text-transform:uppercase;
  padding:14px 12px 6px;margin-top:4px;
}
#menu-btn{
  display:none;position:fixed;top:14px;left:14px;z-index:80;
  width:42px;height:42px;border-radius:10px;
  background:#181818;border:1px solid var(--border2);color:var(--text);
  font-size:15px;cursor:pointer;line-height:1;
  align-items:center;justify-content:center;padding:0;
}
#sb-overlay{display:none}

/* ============ PART SECTION ============ */
.part{margin-bottom:88px;scroll-margin-top:24px}
.part-head{margin-bottom:22px}
.eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ex);margin-bottom:8px;
}
.part-title{
  font-family:var(--ff-title);font-size:clamp(23px,2.6vw,31px);
  font-weight:700;letter-spacing:-.015em;line-height:1.18;
  margin-bottom:12px;
}
.part-meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-family:var(--ff-mono);font-size:12px;color:var(--muted);
}
.meta-chip{
  background:#101418;border:1px solid var(--border2);
  padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.meta-chip.flag{color:#d8c97a;border-color:#3a3524;background:#17150d}
.meta-chip.lang{color:#8ab4f8}

/* ============ CODE CARD ============ */
.code-card{
  background:var(--code-bg);border:1px solid var(--border2);
  border-radius:13px;overflow:hidden;margin-bottom:30px;
  box-shadow:0 14px 40px rgba(0,0,0,.42);
}
.code-card-head{
  display:flex;align-items:center;gap:14px;
  background:var(--code-head);border-bottom:1px solid #20262e;
  padding:10px 16px;
}
.dots{display:flex;gap:7px;align-items:center}
.dots i{
  width:11px;height:11px;border-radius:50%;display:block;
}
.dots i:nth-child(1){background:#ff5f57}
.dots i:nth-child(2){background:#febc2e}
.dots i:nth-child(3){background:#28c840}
.code-fname{
  font-family:var(--ff-mono);font-size:12.5px;color:#9aa7b4;
  letter-spacing:.02em;
}
.code-lines-chip{
  font-family:var(--ff-mono);font-size:11px;color:#5b6875;
  margin-left:auto;white-space:nowrap;
}
.copy-btn{
  font-family:var(--ff-mono);font-size:11px;letter-spacing:.06em;
  color:#9aa7b4;background:#1c2128;border:1px solid #2d333b;
  border-radius:6px;padding:4px 11px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.copy-btn:hover{color:#e6edf3;border-color:#444c56}
.copy-btn.done{color:var(--ok);border-color:rgba(63,185,80,.4)}
.code-scroll{overflow-x:auto;max-height:640px;overflow-y:auto}
pre.code{display:inline-block;min-width:100%;padding:14px 0;font-family:var(--ff-mono)}
.cl{display:flex;white-space:pre;font-size:13.2px;line-height:1.62}
.cln{
  position:sticky;left:0;flex:0 0 auto;z-index:2;
  min-width:52px;text-align:right;padding-right:16px;
  color:var(--gutter-txt);background:var(--code-bg);
  border-right:1px solid var(--gutter-line);
  user-select:none;-webkit-user-select:none;font-size:11.5px;
  line-height:1.85;letter-spacing:.02em;
}
.cl.target .cln{
  background:#101722;color:#7ba3c9;border-right-color:#234;
}
.clc{flex:0 0 auto;padding-right:24px;tab-size:8;color:#e6edf3}
.tok-kw{color:#ff7b72}
.tok-str{color:#a5d6ff}
.tok-com{color:#8b949e;font-style:italic}
.tok-num{color:#79c0ff}
.tok-fn{color:#d2a8ff}
.tok-blt{color:#ffa657}

/* ============ SECTIONS ============ */
.sec{
  border:1px solid var(--border);border-radius:13px;
  background:var(--card);margin-bottom:26px;overflow:hidden;
}
.sec-head{
  display:flex;align-items:center;gap:12px;
  padding:15px 22px;border-bottom:1px solid var(--border);
  background:var(--card2);
}
.badge{
  font-family:var(--ff-mono);font-weight:700;font-size:12px;
  min-width:34px;height:26px;border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;
  letter-spacing:.03em;flex:0 0 auto;
}
.badge-ex{background:var(--ex-dim);color:var(--ex);border:1px solid rgba(79,195,247,.35)}
.badge-math{background:var(--math-dim);color:var(--math);border:1px solid rgba(126,231,135,.35)}
.badge-rb{background:var(--rb-dim);color:var(--rb);border:1px solid rgba(255,180,84,.35)}
.badge-anim{background:var(--anim-dim);color:var(--anim);border:1px solid rgba(210,168,255,.35)}
.sec-head h3{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;letter-spacing:-.01em;
}
.sec-head h3 .bn-inline{font-family:var(--ff-bn)}
.sec-body{padding:20px 22px 24px}

/* ============ EXPLAIN ENTRIES ============ */
.ex-entry{margin-bottom:26px}
.ex-entry:last-child{margin-bottom:6px}
.ex-snippet{
  background:#0d1117;border:1px solid var(--border2);border-left:3px solid var(--ex);
  border-radius:9px;overflow:hidden;
}
.ex-snippet pre{
  padding:10px 16px;font-family:var(--ff-mono);font-size:12.8px;
  line-height:1.62;color:#dbe4ee;overflow-x:auto;white-space:pre;
}
.ex-lines{
  display:inline-block;font-family:var(--ff-mono);font-size:10.5px;
  color:var(--ex);background:var(--ex-dim);border:1px solid rgba(79,195,247,.3);
  border-radius:5px;padding:1px 8px;margin-bottom:7px;letter-spacing:.06em;
}
.ex-arrow{
  color:#3a471f;font-family:var(--ff-mono);font-size:15px;color:var(--faint);
  padding:3px 2px 3px 12px;
}
.ex-text{
  font-family:var(--ff-bn);font-size:16px;line-height:1.95;color:#d5d5d5;
  padding:2px 4px 0 14px;border-left:2px solid #232d36;
}
.ex-text code, .bn code, .ml-text code, .map-text code, .rb-card code, .anim-caption code{
  font-family:var(--ff-mono);font-size:.86em;color:#9ecbff;
  background:rgba(110,168,254,.10);border:1px solid rgba(110,168,254,.16);
  border-radius:5px;padding:1px 6px;white-space:nowrap;
}
.ex-text ul, .ml-text ul, .rb-card ul, .anim-caption ul{
  margin:8px 0 4px 4px;padding-left:22px;
}
.ex-text li, .ml-text li, .rb-card li{margin:5px 0}

/* ============ MATH SECTION ============ */
.math-intro{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
  padding-bottom:16px;border-bottom:1px dashed var(--border2);margin-bottom:20px;
}
.math-level{
  background:var(--card2);border:1px solid var(--border2);border-radius:11px;
  padding:16px 20px;margin-bottom:14px;
}
.ml-label{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--math);margin-bottom:10px;
}
.mathy{
  font-size:17px;color:#e3ffe6;margin:8px 0 12px;
  padding:12px 16px;background:rgba(126,231,135,.05);
  border:1px solid rgba(126,231,135,.16);border-radius:9px;
  overflow-x:auto;min-height:24px;
}
.ml-text{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
}
.math-subhead{
  font-family:var(--ff-title);font-size:14.5px;font-weight:600;color:#bfe8c4;
  margin:26px 0 12px;letter-spacing:.01em;
}
.map-row{
  display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(180px,1fr) minmax(220px,1.4fr);
  gap:12px;align-items:start;
  background:var(--card2);border:1px solid var(--border2);border-radius:10px;
  padding:12px 16px;margin-bottom:10px;
}
.map-code code{
  font-family:var(--ff-mono);font-size:12.5px;color:#9ecbff;background:#0d1117;
  border:1px solid var(--border2);border-radius:6px;padding:3px 8px;display:inline-block;
}
.map-math{color:#c9f7cf;font-family:var(--ff-mono);font-size:13.5px;padding-top:2px}
.map-text{font-family:var(--ff-bn);font-size:14.5px;line-height:1.8;color:#bcbcbc}
.failure-list li{
  font-family:var(--ff-bn);font-size:15px;line-height:1.85;color:#d9c9c9;
  margin:8px 0;padding-left:6px;list-style:none;position:relative;padding-left:22px;
}
.failure-list li::before{
  content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;
  border-radius:2px;background:rgba(248,81,73,.5);border:1px solid rgba(248,81,73,.65);
}
.failure-list{padding:0}

/* ============ ROBOT SECTION ============ */
.rb-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rb-card{
  border-radius:11px;padding:16px 18px;border:1px solid var(--border2);
  font-family:var(--ff-bn);font-size:15.3px;line-height:1.9;
}
.rb-card h4{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:10px;font-weight:600;
}
.rb-ok{background:rgba(63,185,80,.05);border-color:rgba(63,185,80,.28)}
.rb-ok h4{color:var(--ok)}
.rb-bad{background:rgba(248,81,73,.05);border-color:rgba(248,81,73,.28)}
.rb-bad h4{color:var(--bad)}

/* ============ ANIMATION SECTION ============ */
.anim-stage{
  background:
    radial-gradient(500px 200px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  border-bottom:1px solid var(--border2);
  padding:10px;position:relative;
}
.anim-stage svg{width:100%;height:auto;display:block}
.anim-controls{
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--border);background:var(--card2);
}
.ac-btn{
  font-family:var(--ff-mono);font-size:12px;letter-spacing:.08em;
  color:#c9c9c9;background:#202020;border:1px solid var(--border3);
  border-radius:8px;padding:7px 18px;cursor:pointer;transition:all .15s;
}
.ac-btn:hover{background:#2a2a2a;color:#fff;border-color:#4a4a4a}
.ac-btn.active{background:rgba(210,168,255,.14);color:var(--anim);border-color:rgba(210,168,255,.45)}
.anim-caption{
  font-family:var(--ff-bn);font-size:15px;line-height:1.8;color:#d0c4dd;
  padding:13px 22px;border-bottom:1px solid var(--border);min-height:52px;
  background:rgba(210,168,255,.03);
}
.anim-formula{
  font-family:var(--ff-mono);font-size:14px;color:#e6d9f5;
  padding:12px 22px;background:#0d1117;min-height:46px;
  overflow-x:auto;white-space:nowrap;letter-spacing:.01em;
}
.anim-formula .fx-hl{color:var(--anim)}
.anim-formula .fx-ok{color:var(--math)}
.anim-formula .fx-warn{color:var(--rb)}
.anim-state{
  margin-left:auto;font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.1em;
}

/* ============ PART NAV ============ */
.part-nav{display:flex;justify-content:space-between;gap:14px;margin-top:34px}
.pn-btn{
  flex:1;max-width:340px;display:block;
  border:1px solid var(--border2);border-radius:11px;
  padding:13px 18px;color:#c9c9c9;transition:all .16s;
  background:var(--card);
}
.pn-btn:hover{border-color:rgba(79,195,247,.4);color:#fff;text-decoration:none;background:#181818}
.pn-btn .pn-dir{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.14em;display:block;margin-bottom:3px;
}
.pn-btn .pn-title{font-size:13.5px;font-weight:600}
.pn-btn.next{text-align:right}
.pn-btn.disabled{opacity:.28;pointer-events:none}

/* ============ FOOTER ============ */
.site-footer{
  margin-left:var(--sb-w);border-top:1px solid var(--border);
  padding:26px 56px;color:var(--faint);font-size:13px;
  font-family:var(--ff-mono);letter-spacing:.02em;
}

/* ============ MATHJAX FALLBACK ============ */
body.no-mathjax .mathy{
  font-family:var(--ff-mono);font-size:13.5px;color:#c9f0cd;white-space:pre;
}

/* ============ RESPONSIVE ============ */
@media (max-width:1240px){
  #main{padding:44px 34px 70px}
  .site-footer{padding:24px 34px}
}
@media (max-width:960px){
  #menu-btn{display:block}
  #sidebar{
    transform:translateX(-100%);transition:transform .26s ease;
    box-shadow:24px 0 60px rgba(0,0,0,.5);
  }
  body.sb-open #sidebar{transform:translateX(0)}
  body.sb-open #sb-overlay{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;
  }
  #main{margin-left:0;padding:74px 20px 60px}
  .site-footer{margin-left:0;padding:22px 20px}
  .rb-grid{grid-template-columns:1fr}
  .map-row{grid-template-columns:1fr;gap:6px}
  .intro-banner{padding:22px 20px}
}
@media (max-width:560px){
  body{font-size:15px}
  .ex-text{font-size:15.3px}
  .cl{font-size:12.3px}
  .anim-formula{font-size:12.5px}
  .code-lines-chip{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}
</style>


<style id="refine-style">
/* ==================================================================
   SURGICAL REFINEMENT LAYER v2 — appended (UI-UX & animation refinement)
   Does not override any existing rule except where explicitly noted;
   all original bytes above this block are untouched.

   INTENTIONAL LAYER ARCHITECTURE (documented z-index scale)
   ---------------------------------------------------------
     --z-ground  0   page ground, card backgrounds
     --z-scene  10   base SVG scene inside .anim-stage / .exec-robot
     --z-objects 20  moving SVG marks (updated in place by the engine)
     --z-labels 30   SVG text labels — halo-stroked so they can never
                     become unreadable under moving objects
     --z-panel  40   overlay panels (formula bar, debug chips)
     --z-head   50   section headers, captions
     --z-debug  60   live debug readouts
     --z-ctrl   70   control bars (always clickable, never covered)
     --z-nav    80   sidebar / menu
     --z-focus  90   focus outlines (never overlapped)
   HTML layers take these values; inside a single <svg> stacking is by
   paint order, and readability of labels is guaranteed by the
   paint-order halo rule below rather than by z-index.
   ================================================================== */
:root{
  --z-ground:0; --z-scene:10; --z-objects:20; --z-labels:30;
  --z-panel:40; --z-head:50; --z-debug:60; --z-ctrl:70; --z-nav:80; --z-focus:90;
}

/* ---- Fix: full-width application shell (#56-57).
        #main keeps its sidebar margin but drops the narrow max-width;
        prose blocks below keep a readable measure so lines never run
        wall-to-wall — only layout containers use the full width. ---- */
#main{max-width:none}
.intro-desc{max-width:none}          /* hero paragraph: full hero width */
.ex-text, .ml-text, .math-intro, .map-text, .rb-card, .exec-note,
.anim-caption{
  max-width:105ch;
}
@media (min-width:1800px){
  #main{padding-left:88px; padding-right:88px}
}

/* ---- Fix: SVG text labels stay readable over moving objects.
        Halo = stage-ground-coloured stroke painted UNDER the fill. ---- */
.anim-stage svg text,
.exec-robot svg text{
  paint-order:stroke; stroke:#0b0e13; stroke-width:3px;
  stroke-linejoin:round; stroke-linecap:round;
  pointer-events:none; user-select:none;
}
.anim-stage, .exec-robot{position:relative; z-index:var(--z-scene)}
.anim-controls{position:relative; z-index:var(--z-ctrl)}
.anim-caption{position:relative; z-index:var(--z-head)}
.anim-formula{position:relative; z-index:var(--z-panel)}
.anim-state{z-index:var(--z-debug)}

/* ---- Fix: icon control buttons (professional inline SVG, no text) ---- */
.anim-controls{gap:8px}
.ac-btn.ic{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:32px; padding:0; border-radius:8px;
}
.ac-btn.ic svg{width:16px; height:16px; display:block; fill:currentColor}
.ac-btn.ic svg *{vector-effect:non-scaling-stroke}
.ac-btn:focus-visible{
  outline:2px solid var(--anim); outline-offset:2px; z-index:var(--z-focus);
}
.ac-btn.ic[disabled]{opacity:.35; cursor:not-allowed}
.anim-controls .ac-sep{
  width:1px; height:20px; background:var(--border3); margin:0 3px; flex:0 0 auto;
}
.anim-controls .ac-step{
  font-family:var(--ff-mono); font-size:11px; color:var(--anim);
  letter-spacing:.08em; padding:6px 10px; border:1px solid rgba(210,168,255,.28);
  border-radius:7px; background:var(--anim-dim); white-space:nowrap;
}

/* ---- Complete Execution — Code → Debug → Robot (v2 row layout) ----
   Row 1: COMPLETE SOURCE CODE | LIVE DEBUG   (the two walk together)
   Row 2: ROBOT / SYSTEM STATE (full width)
   Then:  complete banner → formula → explanation → controls      */
.exec-sec{margin-top:56px}
.exec-sec .sec-head .exec-sub{
  font-family:var(--ff-mono); font-size:11px; color:var(--faint);
  letter-spacing:.06em; margin-left:auto; padding-right:18px; white-space:nowrap;
}
.exec-note{
  font-family:var(--ff-bn); font-size:14.5px; line-height:1.8; color:var(--muted);
  padding:14px 22px; border-bottom:1px solid var(--border); background:var(--card);
}
.exec-note code{
  font-family:var(--ff-mono); font-size:.86em; color:#9ecbff;
  background:rgba(110,168,254,.10); border:1px solid rgba(110,168,254,.16);
  border-radius:5px; padding:1px 6px;
}
.exec-frame{
  display:grid; gap:14px; padding:16px 18px;
  grid-template-columns:minmax(0,1.42fr) minmax(330px,.72fr);
}
.exec-col{min-width:0; display:flex; flex-direction:column; gap:14px}
.exec-col>.exec-panel{flex:1}
/* robot/system row spans the full frame width, below code+debug */
.exec-col.rob-col{grid-column:1 / -1}
.exec-panel{
  background:var(--code-bg); border:1px solid var(--border2); border-radius:12px;
  overflow:hidden; display:flex; flex-direction:column; min-height:0;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}
/* scroll affordance: right-edge fade says "more code this way" without
   covering anything interactive (head stays above it via z-index) */
.exec-col.code-col .exec-panel{position:relative}
.exec-col.code-col .exec-panel::after{
  content:""; position:absolute; top:0; right:0; bottom:0; width:26px;
  z-index:1; pointer-events:none;
  background:linear-gradient(90deg, rgba(13,17,23,0), #0d1117 92%);
}
.exec-panel-head{
  position:relative; z-index:2;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--code-head); border-bottom:1px solid #20262e; padding:9px 14px;
}
.exec-panel-head .ep-title{
  font-family:var(--ff-title); font-size:13px; font-weight:600; color:#c9d1d9;
  letter-spacing:.01em;
}
.exec-panel-head .ep-chip{
  font-family:var(--ff-mono); font-size:10px; letter-spacing:.05em;
  border-radius:999px; padding:2.5px 9px; white-space:nowrap;
}
.ep-chip.live{color:var(--anim); background:var(--anim-dim); border:1px solid rgba(210,168,255,.3)}
.ep-chip.concept{color:var(--rb); background:var(--rb-dim); border:1px solid rgba(255,180,84,.3)}
.ep-chip.src{color:var(--ex); background:var(--ex-dim); border:1px solid rgba(79,195,247,.3)}
/* kind legend in the code panel head: exec / structural / event */
.exec-legend{
  margin-left:auto; display:inline-flex; align-items:center; gap:5px;
  font-family:var(--ff-mono); font-size:9.5px; color:var(--faint); white-space:nowrap;
}
.exec-legend .lg{
  width:9px; height:9px; border-radius:3px; display:inline-block;
  margin-left:6px;
}
.exec-legend .lg-exec{background:#d2a8ff}
.exec-legend .lg-struct{background:#ffb454}
.exec-legend .lg-event{background:#4fc3f7}
.exec-code{
  position:relative; overflow:auto; flex:1; min-height:0;
  max-height:620px; margin:0; padding:10px 0 28px;
  font-family:var(--ff-mono); font-size:12.3px; line-height:1.6; color:#dbe4ee;
  background:var(--code-bg); tab-size:4;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.exec-code .exl{
  display:block; white-space:pre; min-height:1.6em;
  padding:0 12px 0 0; border-left:3px solid transparent;
  transition:background .2s, border-color .2s;
}
/* line-number gutter stays pinned when long lines scroll horizontally */
.exec-code .eln{
  position:sticky; left:0;
  display:inline-block; width:3.6em; padding-right:10px;
  text-align:right; color:#3d4f63; user-select:none;
  background:var(--code-bg);
}
/* current line, by kind: exec = purple (default), structural = amber,
   event = cyan; grouped companion lines get the tint without the edge */
.exec-code .exl.cur{
  background:rgba(210,168,255,.14); border-left-color:var(--anim);
}
.exec-code .exl.cur .eln{color:var(--anim); background:#241d38}
.exec-code .exl.cur-struct{
  background:rgba(255,180,84,.13); border-left-color:var(--rb);
}
.exec-code .exl.cur-struct .eln{color:var(--rb); background:#2e2416}
.exec-code .exl.cur-event{
  background:rgba(79,195,247,.14); border-left-color:var(--ex);
}
.exec-code .exl.cur-event .eln{color:var(--ex); background:#12283a}
.exec-code .exl.cur-g{background:rgba(210,168,255,.06)}
.exec-code .exl.cur-g.cur-struct{background:rgba(255,180,84,.07)}
.exec-code .exl.cur-g.cur-event{background:rgba(79,195,247,.07)}
/* ---- BEFORE → OPERATION → AFTER debug (#52) ---- */
.exec-op{
  margin:10px 12px 0; padding:8px 12px; border-radius:9px;
  border:1px solid rgba(126,231,135,.32); background:rgba(126,231,135,.07);
  font-family:var(--ff-mono); font-size:11.8px; line-height:1.65; color:#7ee787;
  overflow-wrap:anywhere;
}
.exec-op::before{
  content:"OPERATION";
  display:block; font-size:9px; letter-spacing:.14em; color:#58a65f;
  margin-bottom:3px;
}
.exec-dbg-body{
  padding:10px 14px 14px; overflow:auto; max-height:620px; flex:1; min-height:0;
  font-family:var(--ff-mono); font-size:12px;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.dbg-row{
  display:flex; align-items:baseline; gap:10px; padding:5.5px 8px;
  border-bottom:1px dashed #1c2530; animation:dbgIn .3s ease;
}
.dbg-row:last-child{border-bottom:none}
.dbg-k{color:var(--muted); white-space:nowrap; flex:0 0 auto}
.dbg-v{color:#9ecbff; text-align:right; flex:1; overflow-wrap:anywhere;
  padding-right:2px}
.dbg-v.n{color:#7ee787}
.dbg-v.err{color:var(--bad)}
/* value changed by this line: old (dim) → new (green) */
.dbg-row.chg .dbg-v{color:#7ee787}
.dbg-old{color:#6e7681; text-decoration:line-through;
  text-decoration-color:rgba(110,118,129,.6)}
.dbg-arrow{color:#7ee787; font-weight:600}
.dbg-ill{
  flex:0 0 auto; font-size:9.5px; letter-spacing:.05em; color:var(--rb);
  border:1px solid rgba(255,180,84,.35); border-radius:5px; padding:1px 5px;
}
.dbg-empty{color:var(--faint); font-family:var(--ff-bn); font-size:13px; padding:12px 8px}
@keyframes dbgIn{from{opacity:0; transform:translateX(-4px)}to{opacity:1}}
/* robot row: centered scene, taller than the old side column */
.exec-robot{
  background:
    radial-gradient(500px 220px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  padding:14px; overflow:auto;
  display:flex; justify-content:center;
}
.exec-robot svg{width:100%; max-width:720px; height:auto; max-height:560px;
  display:block; margin:0 auto}
.exec-rob-fade{animation:robFade .4s ease}
@keyframes robFade{from{opacity:0; transform:translateY(4px)}to{opacity:1}}
/* result zone: complete banner → formula row → explanation → controls */
.exec-complete{
  display:none; margin:0 18px 14px; padding:13px 18px; border-radius:11px;
  border:1px solid rgba(63,185,80,.4); background:rgba(63,185,80,.08);
  font-family:var(--ff-mono); font-size:12.5px; letter-spacing:.04em; color:#7ee787;
}
.exec-complete.show{display:block; animation:robFade .4s ease}
.exec-complete .bn{font-family:var(--ff-bn); font-size:14px; color:#c9d1d9;
  letter-spacing:0; margin-top:5px; line-height:1.75}
.exec-fx-row{margin:0 18px 14px; max-width:none}
.exec-sec .anim-caption{margin:0 18px 4px}
.exec-sec .anim-controls{margin:0 18px 18px}
.exec-progress{
  height:3px; margin:0 18px 22px; border-radius:2px; overflow:hidden;
  background:rgba(255,255,255,.06);
}
.exec-progress i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--anim),#7ee787);
  transition:width .3s ease;
}

/* responsive: code+debug share row 1 until 960px, robot row always full
   width; below 960px everything stacks vertically (#59 mobile order) */
@media (max-width:1240px){
  .exec-frame{grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr)}
  .exec-code{max-height:540px}
  .exec-dbg-body{max-height:540px}
}
@media (max-width:960px){
  .exec-frame{grid-template-columns:minmax(0,1fr); padding:12px}
  .exec-code{max-height:430px}
  .exec-dbg-body{max-height:300px}
  .exec-robot svg{max-height:440px}
  .exec-legend{display:none}
}
@media (max-width:560px){
  .exec-sec .sec-head .exec-sub{display:none}
  .exec-frame{padding:10px}
  .anim-controls{padding:11px 14px}
}
@media (prefers-reduced-motion:reduce){
  .exec-rob-fade, .dbg-row{animation:none}
  .exec-code .exl{transition:none}
  .exec-progress i{transition:none}
}

 = self.get_parameter('Vmin').get_parameter_value().integer_value","\t\tself.Hmax = self.get_parameter('Hmax').get_parameter_value().integer_value","\t\tself.Smax = self.get_parameter('Smax').get_parameter_value().integer_value","\t\tself.Vmax = self.get_parameter('Vmax').get_parameter_value().integer_value","\t\t#kpi","\t\tself.Kd = self.get_parameter('Kd').get_parameter_value().integer_value","\t\tself.Ki = self.get_parameter('Ki').get_parameter_value().integer_value","\t\tself.Kp = self.get_parameter('Kp').get_parameter_value().integer_value","\t\tself.FollowLinePID = (self.Kp,self.Ki,self.Kd)","\t\t#","\t\tself.scale = self.get_parameter('scale').get_parameter_value().integer_value","\t\tself.LaserAngle = self.get_parameter('LaserAngle').get_parameter_value().integer_value","\t\tself.linear = self.get_parameter('linear').get_parameter_value().double_value","\t\tself.ResponseDist = self.get_parameter('ResponseDist').get_parameter_value().double_value","\t\tself.refresh = self.get_parameter('refresh').get_parameter_value().bool_value","","\t\t","def main():","\t# ================================================================","\t#  BEGINNER STARTUP SCREEN","\t#  Only display messages are added here; robot logic is unchanged.","\t# ================================================================","\tprint()","\tprint(\"=\" * 64)","\tprint(\"        M3Pro ROBOT - LINE FOLLOW + APRILTAG\")","\tprint(\"=\" * 64)","\tprint(\"  Starting ROS 2 node...\")","\tprint()","\tprint(\"  What this program does:\")","\tprint(\"    [1] Detects and follows a line\")","\tprint(\"    [2] Detects AprilTags\")","\tprint(\"    [3] Uses the laser scanner for obstacle safety\")","\tprint(\"    [4] Controls the robot arm when an AprilTag is found\")","\tprint()","\tprint(\"  Keyboard controls:\")","\tprint(\"    SPACE  -> Start / tracking mode\")","\tprint(\"    I      -> Identify/load HSV settings\")","\tprint(\"    R      -> Reset\")","\tprint(\"    Q      -> Quit\")","\tprint()","\tprint(\"  Important:\")","\tprint(\"    Keep the robot area clear before starting.\")","\tprint(\"    The robot will stop when an obstacle is detected.\")","\tprint(\"-\" * 64)","","\trclpy.init()","\tlinedetect = LineDetect(\"follow_line\")","\tprint(\"  [OK] ROS 2 node started: follow_line\")","\tprint(\"  [OK] Camera / depth processing initialized\")","\tprint(\"  [OK] Line-following system ready\")","\tprint(\"  [OK] AprilTag detection ready\")","\tprint()","\tprint(\"  >>> System is RUNNING. <<<\")","\tprint(\"=\" * 64)","\tprint()","\ttry:","\t\trclpy.spin(linedetect)","\texcept KeyboardInterrupt:","\t\tpass","\tfinally:","\t\tprint()","\t\tprint(\"=\" * 64)","\t\tprint(\"  Stopping robot safely...\")","\t\tprint(\"  [OK] Zero velocity command sent\")","\t\tprint(\"  [OK] ROS 2 node stopped\")","\t\tprint(\"  Goodbye!\")","\t\tprint(\"=\" * 64)","\t\tlinedetect.pub_cmdVel.publish(Twist())","\t\tlinedetect.destroy_node()","\t\trclpy.shutdown()"]};
const PARTS = [{"n":1,"id":"part-01","fname":"README.md","enTitle":"Launch & Observation Commands","lang":"bash","start":1,"end":9,"flags":[],"explain":[{"a":1,"b":1,"text":"<b>সিঁড়ির প্রথম ধাপ<\/b>: <code>sh start_agent.sh<\/code> — README-র পাঁচ কমান্ডের একদম নিচের তাক। <code>sh<\/code> মানে shell-কে দিয়ে script চালানো; নাম বলছে এটা robot-এর agent চালু করে — কিন্তু script-টি নিজে এই folder-এ নেই (এখানে শুধু follow_line.py আর README.md), তাই ভেতরের কাজ আমাদের দৃষ্টির বাইরে। ক্রমটা এখানে অলংকার নয়, চুক্তি: আগে নিচের স্তরের সেবা দাঁড়াবে, তারপর camera-হাতের node-দল (পরের line), সবশেষে মূল node। বাকি চার কমান্ডের প্রতিটি <code>ros2<\/code> দিয়ে শুরু — এই প্রথমটিই একমাত্র খাঁটি shell আদেশ; agent এই পুরো থিয়েটারের মঞ্চ-পর্দা, তার ওঠার আগে কেউ প্রবেশ করে না।"},{"a":3,"b":3,"text":"<code>ros2 launch M3Pro_demo camera_arm_kin.launch.py<\/code> — একটি launch file দিয়ে পুরো node-দল এক টানে তোলা। নামের তিন শব্দই ইঙ্গিত বহন করে: camera, arm, kinematics — camera চালানো আর হাত শোনার node-গুলো এই এক কমান্ডেই জন্মায় বলে পড়ে। এটা এই app-এর জীবন-রেখা, কারণ follow_line.py-এর <code>__init__<\/code> একটি while-loop-এ আটকে থাকে (Part 4-এর ln 52) যেটা ভাঙে কেউ <code>arm6_joints<\/code> topic-এ subscribe করলে — সেই শ্রোতার আসার পথ এই launch-ই। আবার camera-র <code>/camera/color/image_raw<\/code> আর <code>/camera/depth/image_raw<\/code> frame-জোড়াও (Part 4-এর ln 42-43) এই দল থেকেই আসার কথা। launch ছাড়া follow_line জন্মাতেই পারবে না পুরোপুরি — কেন, তা Part 4-এ চোখে দেখবে।"},{"a":5,"b":5,"text":"<code>ros2 run M3Pro_demo follow_line<\/code> — মূল চরিত্র মঞ্চে। <code>ros2 run<\/code> একটি package-র ভিতরের executable চালায়; এই executable-টি setup.py-র console_script entry point, যেটা সরাসরি <code>main()<\/code>-কে ডাকে — file-টিতে <code>if __name__ == '__main__'<\/code> guard নেই-ই (Part 16)। Node-এর নাম হবে <code>follow_line<\/code>, কারণ main() ঠিক ওই নামটিই পাঠায়। Terminal-এর নাট্যক্রম: আগে <code>import finish<\/code> আর <code>cv_edition<\/code> (Part 2-এর module-level ছাপা), launch-এর arm-শ্রোতা মিললে <code>Init Done.<\/code> (Part 6), আর প্রায় ৩ সেকেন্ড পরে auto-start গেট খুলে ট্র্যাকিংয়ের পথ তৈরি হয় (Part 8)। বাকি পনেরোটি Part হলো ঠিক এই এক কমান্ডের ভেতরের জীবন।"},{"a":7,"b":7,"text":"README-র সবচেয়ে কৌতূহল-জাগানো line, হুবহু: <code>ros2 topic pub /arm6_joints arm_msgs/msg/ArmJoints {\"joint1: 90, joint2: 90, joint3: 20, joint4: 0, joint5: 90, joint6: 180, time: 1500\"} --once<\/code> — একটি ArmJoints message ম্যানুয়ালি পাঠানোর কমান্ড। Topic (<code>arm6_joints<\/code>) আর type দুটোই Part 4-এর publisher-এর সঙ্গে মেলে; <code>--once<\/code> মানে একবার পাঠিয়েই থামা। মান লক্ষ করো — <code>joint3: 20, joint4: 0, joint5: 90, joint6: 180<\/code>, অথচ code-এর init_joints <code>[90, 90, 12, 20, 90, 0]<\/code> (Part 4, ln 51), আর <code>time: 1500<\/code> pubSixArm-এর ডিফল্ট 2000 ms-এর (Part 9) চেয়ে তাড়াহুড়োর — README চায় আলাদা ভঙ্গি। আসল কেরামতি quote-এর জায়গায়: ডাবল-quote-যুগল বসেছে <i>ব্রেসের ভিতরে<\/i>, পুরো blob জড়িয়ে নয়; shell ভেতরের quote খসিয়ে ros2-এর হাতে পৌঁছে দেয় <code>{joint1: 90, ..., time: 1500}<\/code> আকারটি — YAML flow mapping, যেটাই topic pub আশা করে।"},{"a":9,"b":9,"text":"শেষ line <code>ros2 run rqt_graph rqt_graph<\/code> — চোখের জন্য সবচেয়ে দরকারি কমান্ড। rqt_graph চালু ROS graph-এর মানচিত্র আঁকে: কোন node কোন topic-এ publisher, কে subscriber। Part 4-এর topicMap animation-টা আসলে এই মানচিত্রেরই শিক্ষানবিশ সংস্করণ — কমান্ডটি চালালে নিজের চোখেই দেখবে <code>follow_line<\/code> node-টির সংযোগ-জাল — কোন topic-এ publisher, কোনটায় subscriber; Part 4-এ জন্ম নেওয়া নয়টি publisher আর camera-র দুই topic মিলিয়ে পাঁচটি subscription-topic-এর বাস্তব মানচিত্র। একটা সূক্ষ্ম তথ্য: Part 4-এ <code>/JoyState<\/code> subscription দু'বার তৈরি হয়েছে (ln 38 আর ln 40), কিন্তু rqt_graph-এ তা দেখা যাবে একটিই ধারায় — graph আঁকে node-to-topic সম্পর্ক দিয়ে, একই topic-এর দুটো subscription এক রেখায় মিশে যায়। ভুলটা কোডে আছে, মানচিত্রে ঢাকা পড়ে।"}],"math":null,"robot":{"correct":"সঠিক ক্রমে চালালে (agent, তারপর launch, তারপর run): launch-এর arm node-টি <code>arm6_joints<\/code>-এ subscribe করে রাখায় follow_line-এর handshake এক নিমেষে ছাড়ে, হাত গড়িয়ে <code>[90, 90, 12, 20, 90, 0]<\/code> ভঙ্গিতে বসে, camera-র color-depth জোড়া callback-এ ঢুকতে শুরু করে। ln 7-এর কমান্ড দিলে হাত ১৫০০ ms সময় পেয়ে <code>[90, 90, 20, 0, 90, 180]<\/code> ভঙ্গিতে সরে, আর rqt_graph খুললে follow_line node-টিকে তার topic-সংযোগের জালে ঝুলতে দেখা যায়।","incorrect":"ক্রম উল্টে আগে <code>ros2 run<\/code> দিলে node <code>__init__<\/code>-এর while-loop-এ আটকে যাবে — <code>arm6_joints<\/code>-এ শ্রোতা নেই, তাই প্রতি ০.১ সেকেন্ডে খালি আকাশে init ভঙ্গি পাঠিয়েই থাকবে; terminal-এ cv_edition-এর ছাপ দেখে মনে হবে প্রোগ্রাম ঝুলে গেছে, অথচ <code>Init Done.<\/code> কখনো আসবে না — সে ভাঙেনি, অপেক্ষা করছে; এই পার্থক্য না বুঝলে ভুল করে Ctrl+C চেপে বসবে।"},"animType":null},{"n":2,"id":"part-02","fname":"follow_line.py","enTitle":"Imports I — ROS 2 Stack & the cv Trick","lang":"python","start":1,"end":15,"flags":[],"explain":[{"a":1,"b":2,"text":"<code>#ros lib<\/code> — comment-টা জায়গার সাইনবোর্ড: নিচের line-গুলো ROS 2-এর নিজস্ব মালামাল। <code>import rclpy<\/code> হলো ভিত্তি-ইট — rclpy মানে ROS 2-এর Python client library; Node বানানো, publisher/subscriber খোলা, spin করা, সব ক্ষমতা এই এক line থেকে নামবে। মনে রেখো এই line-গুলো <i>module-level<\/i> — file-টি load হওয়ার মুহূর্তেই চলে যায়, class-এর ভেতরে ঢুকতে হয় না; ROS 2-র entry point file-টিকে import করামাত্রই এই কাজগুলো সেরে ফেলে, Part 16-এর main() ডাকা পড়ার আগেই। তাই terminal-এ প্রথম ছাপ আসবে এই অংশ থেকেই, node জন্মানোর আগে।"},{"a":3,"b":4,"text":"<code>from rclpy.node import Node<\/code> — Part 4-এর <code>class LineDetect(Node)<\/code> এই নামটাই উত্তরাধিকার পাবে; Node মানে ROS 2-এর মূল শ্রেণি: logger, parameter, topic-সুবিধা সব ওখান থেকে। পরের line-এ std_msgs-এর চার রকম ছোট message এক ঝাঁকে: <code>Bool<\/code> (<code>/JoyState<\/code> আর <code>grasp_done<\/code> — on/off সংকেত), <code>Int16<\/code> (<code>set_joint5<\/code>/<code>set_joint6<\/code> — কোণের সংখ্যা), <code>UInt16<\/code> (<code>/beep<\/code> — buzzer), <code>String<\/code> (<code>/action_feedback<\/code>)। চারটিই Part 4-এ topic খুলতে কাজে নামবে — import এখানে, খরচ ওখানে।"},{"a":5,"b":6,"text":"<code>Twist<\/code> geometry_msgs থেকে — চাকার হুকুমনামা: linear আর angular দুই পকেটে গতি-ভেক্টর। প্রাণ-topic <code>/cmd_vel<\/code> (Part 4, ln 34) এই মানেই বয়ে নেবে; আর <code>Twist()<\/code> বানালেই সব ঘর শূন্য — থামার আদেশ হিসেবে এই শূন্য-খাম পুরো file-এ বারবার ফেরত আসবে। পরের line-এ sensor_msgs-এর তিনটির মধ্যে <code>LaserScan<\/code> (<code>/scan1<\/code>, Part 7-এর laser cone) আর <code>Image<\/code> (camera-র color-depth জোড়া) খেলবে; কিন্তু <code>CompressedImage<\/code>-কে পুরো ৪৮৫ line-এ আর কোথাও পাওয়া যায় না — নিঃশব্দে বসে থাকা এক যাত্রী-import, ক্ষতি নেই, কাজও নেই।"},{"a":7,"b":10,"text":"<code>#common lib<\/code> — ROS-বাইরের সাধারণ জিনিসপত্রের তাক। <code>os<\/code> পুরো file-এ একবারই কাজে লাগবে: ln 317-এ <code>os.path.exists<\/code> দিয়ে HSV ফাইল আছে কিনা দেখা (Part 13)। <code>threading<\/code>-ও একবারই: ln 336-এ <code>threading.Thread<\/code> দিয়ে steering-loop-কে আলাদা সুতোয় ছাড়া (Part 14)। <code>math<\/code> শুধু দুই line নিচে <code>math.pi<\/code> জোগাবে। অর্থাৎ তিনটির প্রতিটিই ঠিক একটি করে কাজের জন্য ডাকা — এই file-এর লেখক স্পষ্টই সংক্ষিপ্ত-প্রিয়; আর সেটা পরের line-এর star import-এর ঠিক উল্টো মেজাজ, যেখানে কী পাওয়া যাবে তার কোনো হিসাব খাতায় রাখা হয়নি।"},{"a":11,"b":12,"text":"এই file-এর সবচেয়ে ক্ষমতাধর line: <code>from M3Pro_demo.follow_common import *<\/code> — তারা মানে 'সব দাও'। কিন্তু <b>follow_common এই folder-এ নেই<\/b>; এই এক lineই file-টিকে বড় ঋণ দেয়: <code>cv<\/code> (ঠিক নিচের line-এই ব্যবহার হবে!), <code>time<\/code> (এই file-এ <code>import time<\/code> লেখাই নেই, অথচ ln 54 আর 356-এ sleep হবে), <code>color_follow<\/code>, <code>simplePID<\/code>, <code>read_HSV<\/code>, <code>write_HSV<\/code>, <code>ManyImgs<\/code>, আর <code>cancel<\/code> — সব এই ধারের। পাশের line <code>RAD2DEG = 180 / math.pi<\/code> — রেডিয়ান থেকে ডিগ্রি ওঠার সিঁড়ি, মান ≈ 57.29578; Part 7-এ laser-এর প্রতিটি beam-angle এই গুণকে ডিগ্রিতে উঠবে।"},{"a":13,"b":15,"text":"তিন line-এর ছোট্ট নাটক। <code>print (\"import finish\")<\/code> — খেয়াল করো print আর বন্ধনীর মাঝে এক ফাঁকা ঘর; Python ক্ষমা করে, চোখ সামান্য আটকায়। মাঝের lineটাই আসল চমক: <code>cv_edition = cv.__version__<\/code> — এখানে <code>cv<\/code> ব্যবহার হচ্ছে, অথচ <code>import cv2<\/code> লেখা হয়েছে তিন line <i>পরে<\/i> (ln 17, Part 3)! NameError হওয়ার কথা — হয় না, কারণ এক line আগের star import-ই ভেতরে <code>cv<\/code> নামটা আগেই বেঁধে রেখেছে; নিজের পয়সায় নয়, ধারের সুতায় প্রাণ। শেষে <code>print(\"cv_edition: \",cv_edition)<\/code> Jetson-এ বসানো OpenCV-র আসল সংস্করণ ছাপে — developer-এর চোখে এটাই প্রথম নিশ্চয়তা যে vision-stack জায়গামতো আছে।"}],"math":null,"robot":{"correct":"file-টি load হওয়ার সঙ্গে সঙ্গেই এই line-গুলো দৌড়ায় — node জন্মানোর আগেই terminal-এ দেখা যায় <code>import finish<\/code>, তার ঠিক পরে <code>cv_edition: <\/code> ছাপার পাশের সংখ্যাটি — Jetson-এ বসানো OpenCV-র আসল সংস্করণ। RAD2DEG-ও তৈরি হয়ে বসে থাকে, পরে laser-এর প্রতিটি beam-angle ডিগ্রিতে তুলবে। robot-এর শরীরে এখনও কোনো নড়াচড়া নেই — এ পর্যন্ত সব সাজ-সরঞ্জাম গোছানো মাত্র।","incorrect":"follow_common-এর নাগাল না থাকলে (M3Pro_demo package ছাড়া অন্য পরিবেশে) ln 11-এই <code>ModuleNotFoundError<\/code> — পুরো প্রোগ্রাম মারা যাবে <code>import finish<\/code> ছাপা হওয়ার আগেই। আর অনেকে ln 14-এর <code>cv<\/code> দেখে বলেন 'এ তো ভাঙা কোড, cv2 তো পরে import হচ্ছে' — NameError হবে না-ই, star import নামটা আগেই বেঁধে দিয়েছে; 'import নেই বলে নাম অচেনা' এই অনুমানটাই এখানে ভুল।"},"animType":null},{"n":3,"id":"part-03","fname":"follow_line.py","enTitle":"Imports II — Vision, Tags & the Arm Toolkit","lang":"python","start":17,"end":26,"flags":[],"explain":[{"a":17,"b":18,"text":"এবার <code>import cv2<\/code> — বিখ্যাত যাত্রী অবশেষে নিজের নামে হাজির; কিন্তু ততক্ষণে উপরে ln 14-এ <code>cv.__version__<\/code> কাজ সেরে ফেলেছে star import-এর ধার-করা নাম দিয়ে (Part 2) — আগে-পরের এই উল্টো সাজ কোনো ভুল নয় বরং দুই দলের মেশানো দাগ। এই file-এ OpenCV-র সরাসরি কাজ — depth frame-এর <code>cv2.resize<\/code>, tag-খোঁজার <code>cv2.cvtColor<\/code>, <code>cv2.waitKey<\/code> — সবই ঘটবে Part 8-এ; এখানে শুধু নাম-দরজায় তালা কেটে রাখা। পরের line-এ <code>from arm_msgs.msg import ArmJoints<\/code> — হাতের ছয় joint-এর একসাথে ভঙ্গির খাম; README ln 7-এর কমান্ডে যে type-এর নাম লেখা ছিল এটাই তার Python-রূপ, আর Part 4-এর <code>arm6_joints<\/code> publisher ও Part 9-এর pubSixArm এই খামেই চিঠি দেবে।"},{"a":19,"b":20,"text":"<code>message_filters<\/code> থেকে তিনটি নাম আসছে, কাজে লাগবে দুটি। <code>Subscriber<\/code> — message_filters-নির্মিত subscription, Part 4-এর ln 42-43-এ color আর depth camera-র জন্য বাঁধা হবে; <code>ApproximateTimeSynchronizer<\/code> — দুই camera-র frame জোড়া মেলানোর আসল যন্ত্র (ln 56)। আর <code>TimeSynchronizer<\/code> — নিখুঁত সময়-মিল চাওয়া ভাইটি সংস্করণ; পুরো file-এ তাকে আর কেউ ডাকেনি — import হয়ে বসে আছে, কাজের ভাগ পায়নি। পাশে <code>from cv_bridge import CvBridge<\/code> — ROS Image আর OpenCV frame-এর ভাষা-অনুবাদক; Part 5-এ দুটি আলাদা bridge (rgb ও depth-র জন্য) বানানো হবে।"},{"a":21,"b":21,"text":"এক line-এর তালিকা: <code>encoding = ['16UC1', '32FC1']<\/code> — depth image-র pixel কীভাবে সংখ্যায় বাঁধা, তার দুটি সম্ভাবনা। <code>16UC1<\/code> মানে ১৬-বিট unsigned পূর্ণসংখ্যা এক channel-এ; <code>32FC1<\/code> মানে ৩২-বিট float এক channel-এ। এই app-জুড়ে কাজে নামবে কেবল দ্বিতীয়টি — Part 8-এ ln 152 আর ln 162, দুই জায়গাতেই পড়া হবে <code>encoding[1]<\/code>; সূচক ০-এর <code>16UC1<\/code> পুরো file-এ কেউ ছুঁয়েও দেখবে না। তালিকার প্রথম সদস্য জন্মান্তেই অব্যবহৃত — কেন রাখা হলো, কোড নিজে থেকে সে কথা বলবে না; সম্ভবত অন্য কোনো সংস্করণের রেহাই-পত্র।"},{"a":22,"b":23,"text":"দুই line-এ AprilTag-জগতের প্রবেশ। <code>from dt_apriltags import Detector<\/code> — AprilTag শনাক্তকারী ইঞ্জিন; তার আসল কনফিগারেশন (family <code>tag36h11<\/code>, nthreads 8, quad_decimate 2.0) Part 5-এর ln 62-69-এ বসবে — এখানে শুধু নাম-কেনা। পাশে <code>from M3Pro_demo.vutils import draw_tags<\/code> — শনাক্ত হওয়া tag-এর চারকোণা আর কেন্দ্র frame-এর গায়ে এঁকে দেওয়ার রং-তুলি; কাজে নামবে Part 8-এর ln 159-এ, corners লাল <code>(0, 0, 255)<\/code> আর center সবুজ <code>(0, 255, 0)<\/code> রঙে। খেয়াল করো vutils-ও M3Pro_demo package-এর ভেতরের মডিউল — follow_common-এর মতো বাইরের ভাড়া, কিন্তু এবার নির্দিষ্ট নামে, তারা নয়।"},{"a":24,"b":25,"text":"<code>import numpy as np<\/code> — সংখ্যার বাক্স ধরার হাত; laser-এর <code>np.array(scan_data.ranges)<\/code> (Part 7) থেকে depth frame-এর <code>np.copy<\/code> আর <code>astype(np.float32)<\/code> (Part 8) — সব সংক্ষেপ <code>np<\/code> দিয়েই। পরের line-এ <code>from arm_interface.msg import AprilTagInfo,CurJoints<\/code> — মন দিয়ে দেখো, arm_interface আর arm_msgs (এই Part-এরই ln 18) দুটি <b>ভিন্ন<\/b> package! <code>AprilTagInfo<\/code> tag-এর id-x-y-z পাঠানোর খাম (Part 4-এর <code>PosInfo<\/code> publisher, Part 14-এর handoff), <code>CurJoints<\/code> হাতের বর্তমান ভঙ্গির খবর (Part 7-এর <code>Curjoints<\/code> topic)। দুই package-এর দায় গুলিয়ে ফেললে import-ই মরবে — জোড়াটা মনে রাখো।"},{"a":26,"b":26,"text":"এই file-এর দ্বিতীয় star import: <code>from M3Pro_demo.compute_joint5 import *<\/code> — ln 11-এর পর দ্বিতীয়বার 'সব দাও' ডাক। আসল চাওয়া একটি নাম: <code>compute_joint5<\/code> — tag-এর গায়ের ধার থেকে তোলা (vx, vy) জোড়িকে হাতের কবজি-joint-৫-এর কোণ বানিয়ে দেওয়ার যন্ত্র; Part 14-এর ln 368-এ ঠিক এই নামটিই কাজে নামবে। compute_joint5-ও এই folder-এর বাইরের মানুষ — ভেতরের হিসাব আমাদের দেখার নয়, call site থেকে যতটুকু বোঝা যায় ততটুকুই বলব। দুটি star import একসাথে থাকার মানে: file-টি আসলে এক বড় দলের সামনের মুখ — পেছনে follow_common আর compute_joint5-র মতো সহযোগীরা দাঁড়িয়ে।"}],"math":null,"robot":{"correct":"এই দশ line-এ কোনো হার্ডওয়্যার নড়ে না, terminal-ও চুপ — দুটি ছাপা তো Part 2-তেই হয়ে গেছে। কিন্তু গুছিয়ে যায় পুরো vision-হাতের টুলবক্স: OpenCV line-মাস্কের জন্য, CvBridge দুই camera-র ভাষা বদলাবে, Detector tag36h11 পরিবার চিনবে, ArmJoints-AprilTagInfo-CurJoints তিন রকম খাম হাতের যোগাযোগের জন্য। পরের Part-এ class-এর জন্ম-আচার শুরু হতেই এগুলো একে একে কাজে নামবে।","incorrect":"arm_msgs আর arm_interface-এর দায় গুলিয়ে ArmJoints-কে arm_interface থেকে আনতে গেলেই workspace-এ <code>ImportError<\/code> — প্রোগ্রাম শুরু হওয়ার আগেই শেষ। আরেকটি প্রচলিত ভুল ধারণা: frame-জোড়া না-মেলার দায় <code>TimeSynchronizer<\/code>-এর ঘাড়ে চাপানো — আসলে সে কোনোদিনই ব্যবহৃত হয়নি; জোড়া মেলায় <code>ApproximateTimeSynchronizer<\/code>, ০.৫ সেকেন্ডের শিথিলতায় (Part 4, ln 56)।"},"animType":null},{"n":4,"id":"part-04","fname":"follow_line.py","enTitle":"Node Birth I — Topics & the Duplicate Sub","lang":"python","start":28,"end":57,"flags":[],"explain":[{"a":28,"b":30,"text":"<code>class LineDetect(Node)<\/code> — একটিই class, আর পুরো file-টাই তার শরীর: ln 28 থেকে 430, তারপর main()। Node থেকে উত্তরাধিকার মানে ROS 2-এর সব সুবিধা পকেটে। <code>def __init__(self,name)<\/code> — নাম বাইরে থেকে আসবে; main() পাঠাবে <code>\"follow_line\"<\/code>, আর <code>super().__init__(name)<\/code> সেই নামেই node-কে ROS graph-এ নথিভুক্ত করবে (Part 16)। এর পরের প্রায় ৮৫ line এক দীর্ঘ জন্ম-আচার — publisher, subscriber, bridge, detector, PID সব এই <code>__init__<\/code>-এর ভেতরে সাজবে; তাই-ই Part 4, 5, 6 তিন পর্বে ভাগ করে পড়া হচ্ছে।"},{"a":33,"b":36,"text":"<code>#create a publisher<\/code> — সাইনবোর্ডের নিচে তিন প্রাণ-ধমনী। <code>pub_cmdVel<\/code>: <code>/cmd_vel<\/code>-এ Twist, queue 1 — চাকার সঙ্গে বাঁধা একমাত্র তার; steering-এর প্রতিটি রায় (Part 12) এখান দিয়েই নামবে। <code>pub_rgb<\/code>: <code>/linefollow/rgb<\/code>-তে Image — কিন্তু ৪৮৫ line উল্টেও এই publisher-কে আর publish করতে দেখা যায় না; দালান কিনে দরজা খোলা হয়নি এমন সম্পত্তি। তৃতীয়টি <code>pub_Buzzer<\/code>: <code>/beep<\/code>-এ UInt16 — বাধা পেলে ১, ছাড়লে ০; প্রতিটি প্রকাশ Part 12-এর ln 275 আর 279 থেকে আসবে, এবং সেই ০ ছাপা হবে পরপর তিনবার — বিপ থামার তিন প্রহর।"},{"a":37,"b":40,"text":"<code>#create a subscriber<\/code> — আর এই চার line-এ লুকিয়ে একটি আসল রহস্য। ln 38: <code>/JoyState<\/code>-এ Bool, callback <code>JoyStateCallback<\/code>, নাম বাঁধা <code>self.sub_JoyState<\/code>-এ। ln 39: <code>/scan1<\/code>-এ LaserScan, callback <code>registerScan<\/code> (Part 7) — খেয়াল করো topic-এর নাম <i>/scan1<\/i>, /scan নয়; ভুল নাম ধরলে laser-কাহিনী পুরো নীরব থাকবে। তারপর ln 40 — আবার সেই <code>/JoyState<\/code>, আবার সেই callback, শুধু quote-এর ধরন বদলে, আর আবারও বাঁধা <code>self.sub_JoyState<\/code>-এ! দ্বিতীয় line-এ প্রথম subscription-object-এর নাম-টিকেট মুছে যায় — একই কাজ দু'বার লেখা এই file-এর স্বাক্ষর-ভুলগুলোর প্রথমটি; কাজের ক্ষতি নেই (callback এক, topic এক), কিন্তু কপি-পেস্টের দাগ স্পষ্ট।"},{"a":42,"b":43,"text":"দুই line-এ camera-র দুই চোখ: <code>Subscriber(self, Image, '/camera/color/image_raw')<\/code> আর <code>Subscriber(self, Image, '/camera/depth/image_raw')<\/code> — message_filters-এর নিজস্ব subscription, সাধারণ create_subscription নয় (Part 3-এ import হয়েছিল)। কেন আলাদা? কারণ দুই চোখের দৃশ্য <i>জোড়া হয়ে<\/i> লাগবে — রঙের frame-এ line বা tag খোঁজা হবে, depth frame-এ সেই pixel-এর দূরত্ব মাপা (Part 8, Part 14)। এই দুই স্রোত নিজেরা কোনো callback ডাকে না; ওরা শুধু ln 56-এর synchronizer-এর হাতে জমা হয়ে অপেক্ষা করছে — দুই line নিচেই সেই মিলন-যন্ত্র বসছে।"},{"a":44,"b":47,"text":"চারটি publisher-এর পরোয়ানা। <code>pub_SixTargetAngle<\/code>: <code>arm6_joints<\/code>-এ ArmJoints, depth 10 — হাতের প্রধান তার; Part 9-এর pubSixArm এখানেই চিঠি দেবে, আর ঠিক নিচেই (ln 52) এই publisher-এর শ্রোতা-অপেক্ষার মহা-নাটক। <code>pos_info_pub<\/code>: <code>PosInfo<\/code>-তে AprilTagInfo, depth 1 — Part 14-এর tag-handoff-এর ডাকঘর। <code>TargetJoint5_pub<\/code>: <code>set_joint5<\/code>-এ Int16, depth 10 — কবজির একক কোণ। আর <code>TargetJoint6_pub<\/code>: <code>set_joint6<\/code>-এ Int16, depth 10 — কিন্তু এই শেষ তারে পুরো file-এ একটিও publish হবে না; Part 6-এর ln 103-104 এর message-এ মান (120) ভরে রাখবে, পাঠানোর কেউ নেই — লেখা হয়ে রইল অব্যবহৃত।"},{"a":48,"b":50,"text":"শেষ তিন সংযোগ পাশের দলের সঙ্গে কথা বলার পথ। <code>pub_cur_joints<\/code>: <code>Curjoints<\/code>-এ CurJoints, depth 1 — হাত এখন কোন ভঙ্গিতে আছে তার স্টেশন, Part 7-এর pubCurrentJoints থেকে খবর যাবে। <code>sub_grasp_status<\/code>: <code>grasp_done<\/code> topic-এ Bool, callback <code>get_graspStatusCallBack<\/code> (Part 8), আর queue depth হলো <b>100<\/b> — চারপাশের ১ আর ১০-এর মধ্যে এই একটিই বিশাল সংখ্যা; grasp-শেষের সংকেত কোনোভাবেই যেন ভেসে না যায়। <code>largemodel_arm_done_pub<\/code>: <code>/action_feedback<\/code>-এ String, depth 1 — বড় অভিভাবক agent-কে 'কাজ শেষ' জানানোর তার; Part 12-এর ln 255-এ <code>follow_line_clear_future_done<\/code> বার্তাটি এখানেই যাবে।"},{"a":51,"b":55,"text":"জন্ম-অধ্যায়ের প্রধান দৃশ্য। ln 51: <code>self.init_joints = [90, 90, 12, 20, 90, 0]<\/code> — ছয় joint-এর শুরুর ভঙ্গি। ln 52: <code>while not ... get_subscription_count():<\/code> — <code>arm6_joints<\/code>-এ একজনও subscriber না দেখা পেলে প্রতি লুপে <code>pubSixArm(self.init_joints)<\/code> আর <code>time.sleep(0.1)<\/code>; অর্থাৎ প্রতি ০.১ সেকেন্ডে খালি আকাশে হাত নাড়ানো। দুটো গোপন তথ্য: <code>time<\/code> এই file-এ import-ই হয়নি — star import-এর ধার (Part 2); আর pubSixArm class-এ অনেক নিচে (ln 176, Part 9) লেখা, তবু ডাকা যায় — কারণ ডাক পড়ে অবেলায়, ততক্ষণে পুরো class তৈরি হয়ে গেছে। Subscriber পাওয়ামাত্র loop ভেঙে ln 55-এ শেষবারের মতো নিঃশর্ত একটি pubSixArm — 'হাত নিয়ে এসেছি, এবার শুরু করা যাক'।"},{"a":56,"b":57,"text":"মিলন-যন্ত্রের স্থাপনা: <code>ApproximateTimeSynchronizer([self.rgb_image_sub, self.depth_image_sub], 1, 0.5)<\/code> — দুই চোখের স্রোত জোড়া লাগানোর যন্ত্র, queue 1, slop 0.5। slop মানে সহনশীলতা: রঙ আর depth frame-এর timestamp ০.৫ সেকেন্ডের মধ্যে হলে জোড়া বলে মেনে নেওয়া হবে — দুই camera একই মুহূর্তে ট্রিগার হয় না বলেই এই শিথিলতা; কাঠখোট্টা TimeSynchronizer (Part 3-এ import-হয়ে-অলস সেই নাম) চাইত হুবহু এক মুহূর্তের stamp-মিল — এই শিথিলতাই তার বিপরীত। তারপর <code>registerCallback(self.callback)<\/code> — প্রতিটি মিলে-যাওয়া জোড়া একবার ডাকবে <code>self.callback<\/code>-কে — আসল সই <code>def callback(self,color_frame,depth_frame)<\/code> (Part 8); সেই ফাংশনই Part 8-এর দরজা, যেখানে দেখার আসল কাজ শুরু।"}],"math":null,"robot":{"correct":"launch আগে চালানো থাকলে ছবিটা এমন: arm node-টি <code>arm6_joints<\/code>-এ subscribe করে রাখছে, তাই ln 52-র অপেক্ষা এক নিমেষেই ফুরোয় — হাত গড়িয়ে <code>[90, 90, 12, 20, 90, 0]<\/code> ভঙ্গিতে বসে, camera-র রঙ-depth জোড়া callback-এ ঢুকতে শুরু করে, আর rqt_graph-এ <code>follow_line<\/code> node-টির সংযোগ-জাল ফুটে ওঠে। এরপরই Part 6-এর শেষে <code>Init Done.<\/code> ছাপা হবে।","incorrect":"launch না চালিয়ে সরাসরি run করলে node-টি <code>__init__<\/code>-এই আটকে থাকবে: <code>arm6_joints<\/code>-এ শ্রোতা নেই, তাই প্রতি ০.১ সেকেন্ডে pubSixArm খালি আকাশে init ভঙ্গি পাঠাতেই থাকবে, camera-synchronizer পর্যন্ত পৌঁছাবেই না; terminal-এ cv_edition-এর ছাপ দেখে অনেকে ভাববেন প্রোগ্রাম ঝুলে গেছে — আসলে সে ভাঙেনি, অপেক্ষা করছে। আরেকটি ফাঁদ: laser topic-এর নাম /scan ভেবে নেওয়া — তাহলে registerScan চিরকাল নীরব, সামনে বাধা এলেও robot থামবে না।"},"animType":"topicMap"},{"n":5,"id":"part-05","fname":"follow_line.py","enTitle":"Node Birth II — Frame Sync & the Tag Detector","lang":"python","start":59,"end":75,"flags":[],"explain":[{"a":59,"b":60,"text":"দুটি আলাদা <code>CvBridge()<\/code> — একটি <code>self.rgb_bridge<\/code> রঙিন frame-এর জন্য, আরেকটি <code>self.depth_bridge<\/code> depth frame-এর জন্য। Part 4-এর <code>ApproximateTimeSynchronizer<\/code> যে দুই camera topic-এর বার্তা জোড়া লাগায়, সেই ROS <code>Image<\/code> message দুটি পরে (Part 8-এর callback-এ) এই সেতু দিয়েই OpenCV-র numpy array-তে রূপান্তরিত হবে। দুই stream-এর encoding আলাদা — রঙিনটি 'rgb8', depth-টি '32FC1' — তাই দুই সেতু রাখা নিরাপদ সংযোজন; একটিই ভাগ করলেও চলত, কিন্তু লেখক জোড় রেখে প্রতিটি conversion-কে দিয়েছেন নিজের নাম, পরে পড়লে সহজে বোঝা যায় কোন সেতু কোন ছবি বইয়ে নিয়ে যায়।"},{"a":62,"b":69,"text":"<code>self.at_detector = Detector(searchpath=['apriltags'],<\/code> — AprilTag শিকারির জন্ম, আটটি keyword দিয়ে কনফিগার করা। <code>families='tag36h11'<\/code> — এই পরিবারের tag-ই খোঁজা হবে; <code>nthreads=8<\/code> — আট thread-এ সমান্তরাল খোঁজ; <code>quad_decimate=2.0<\/code> প্রথমে ছবির নমুনা ঝেড়ে গতি বাড়ায়, <code>quad_sigma=0.0<\/code> আগে থেকে ঝাপসা করে না, <code>refine_edges=1<\/code> কোণগুলো sub-pixel নিখুঁত করে, <code>decode_sharpening=0.25<\/code> ID-পাঠের ধার, <code>debug=0<\/code> নীরব রাখে। <b>লক্ষ করো<\/b>: পরে Part 8-এর ln 157-এ ডাকটি আসবে শেষ তিন আর্গুমেন্ট <code>False, None, 0.025<\/code> নিয়ে — প্রথমটি <code>False<\/code> মানে pose estimation বন্ধ, তাই শেষের <code>0.025<\/code> (2.5 cm tag-এর বাহু) ফলাফলে কোনো দিন কাজে লাগবে না — চুপচাপ বহন হয়ে যায়।"},{"a":70,"b":71,"text":"দুটি গেট জন্মের সময়ই খোলা রাখা হলো। <code>self.move_flag = True<\/code> — এটি Part 14-এর Remove-align লুপের প্রবেশপথ: ln 350-এ <code>move_flag == True<\/code> হলেই robot tag-এর সামনে সরে যেতে পারে; আর <code>self.pubPos_flag = True<\/code> — handoff message পাঠানোর অনুমতি (ln 358)। AprilTag handoff সম্পন্ন হলে দুজনকেই <code>False<\/code> করে দেওয়া হয় (ln 359-360) — robot থামে, বাহুর পালা শুরু। তারপর বাহু কাজ শেষ করে <code>grasp_done<\/code> topic-এ সংকেত পাঠালে Part 8-এর <code>get_graspStatusCallBack<\/code> দুজনকে আবার <code>True<\/code> করে দেবে — পুরো চক্রটা তখন আবার শুরুর জন্য প্রস্তুত।"},{"a":73,"b":75,"text":"<code>self.declare_param()<\/code> — এখনই ডেকে নেওয়া হলো, যদিও সংজ্ঞাটি অনেক নিচে (Part 10, ln 187-218) বসে আছে। কাজটা ফাঁকি-অযোগ্য: এই ডাকের পরেই <code>self.LaserAngle<\/code> (default 60), <code>self.ResponseDist<\/code> (default 0.25), HSV-র সীমাগুলো — সব attribute জন্মায়; ডাক না হলে ln 113-114-এর ছাপাগুলোই AttributeError-এ আটকে যেত। তারপর <code>self.Joy_active = False<\/code> — joystick এখনো চুপ, robot নিজের ইচ্ছায় চলবে; আর <code>self.img = None<\/code> — খালি ছবির আসন, কোনো frame আসার আগে পর্যন্ত ফাঁকা থাকবে; <b>মজার তথ্য<\/b>, এই <code>self.img<\/code> পুরো file-তে আর কোথাও পড়াই হয় না — শুধু আসন দখল করে বসে থাকে।"}],"math":null,"robot":{"correct":"ঠিকঠাক চালু হলে এই lineগুলো নীরবে কাজ সেরে ফেলে: দুই CvBridge তৈরি, at_detector আট thread-সহ প্রস্তুত, declare_param() থেকে LaserAngle=60 আর ResponseDist=0.25 attribute হয়ে বসে — যা পরের Part-এর ছাপায় (Init Done.-এর নিচে) দেখা যাবে। এখনই কোনো topic-এ নতুন বার্তা যায় না, কোনো মোটর নড়ে না — এটা শুধু যন্ত্রপাতি সাজানোর ধাপ।","incorrect":"প্রচলিত এক ভুল: Detector-এর কনফিগ থেকেই tag-এর দূরত্ব বের হয় ভাবা। আসলে detect()-কে False দিয়ে ডাকা হয় — pose estimation বন্ধ, তাই at_detector কখনোই দূরত্ব বা কোণ দেবে না, দেবে শুধু ছবিতে tag-এর চার কোণের pixel-জ্যামিতি; দূরত্বের কাজ পরে depth camera-র (Part 14)। 0.025-জাত tag_size তাই চিরকাল অব্যবহৃত।"},"animType":null},{"n":6,"id":"part-06","fname":"follow_line.py","enTitle":"Node Birth III — PID Tuples, State & Prints","lang":"python","start":76,"end":114,"flags":[],"explain":[{"a":76,"b":78,"text":"তিনটি খালি tuple — তিনটি ফাঁকা আসন, যাদের যাত্রী পরে আসবে। <code>self.circle<\/code> পাবে <code>color_follow<\/code>-ইঞ্জিনের <code>line_follow<\/code>-এর ফল (ln 320, Part 13) — line-এর কেন্দ্র আর ব্যাসার্ধের হিসাব; <code>self.hsv_range<\/code> পাবে হয় ROI-টানার সময় <code>Roi_hsv<\/code>-এর হিসাব (ln 309), নয়তো <code>.text<\/code> file থেকে <code>read_HSV<\/code>-এর পড়া ছক (ln 317); আর <code>self.Roi_init<\/code> পাবে mouse-এ টেনে আঁকা বাক্সের চার সীমানা (ln 243, Part 11)। জন্মে খালি রাখার সুবিধা টনকে দেখা যায় পরে: <code>len(self.hsv_range) != 0<\/code>-জাতীয় পরীক্ষায় খালি tuple নিরাপদে 'শূন্য' জবাব দিতে পারে।"},{"a":79,"b":83,"text":"পাঁচটি state-flag-এর সারি। <code>self.warning = 1<\/code> — <b>মন দিয়ে দেখো<\/b>, এটা সত্যিকারের বিপদ-সংকেত নয় (সেটা <code>front_warning<\/code>, ln 109); এই <code>warning<\/code> পুরো file-এ আর কোথাও পড়াই হয় না — জন্ম নিয়েই নীরব। <code>Start_state = True<\/code> execute()-র joystick-ঢালা পথে প্রথম ডাকে PID নতুন করে সাজাবে (Part 12); <code>dyn_update = False<\/code> — HSV ছক বদলালে তা ROS parameter-এ লেখার পথ (ln 321, Part 13) এখনো বন্ধ; <code>Buzzer_state<\/code> বাজছে-না-বাজছে স্মৃতি বহন করবে Part 12-এর ln 273-280-তে; <code>select_flags<\/code> mouse-ড্র্যাগের পালা টগল করবে Part 11-এর onMouse-এ।"},{"a":84,"b":87,"text":"<code>self.Track_state = 'identify'<\/code> — অবস্থা-মেশিনের জন্মমানটা একটু অবাক করা: 'init' নয়, সরাসরি 'identify'। মানে প্রথম <code>process<\/code> ডাক থেকেই node ধরে নেয় HSV-র জন্য <code>.text<\/code> file-টাই সত্যের উৎস — file থাকলে পড়ে নেবে, না থাকলে 'init'-এ ফিরে mouse-এর অপেক্ষা করবে; আর node-জন্মের ৩ সেকেন্ড পরে ln 167-170 (Part 8) একে একবারই 'tracking'-এ ফিরিয়ে দেবে। <code>windows_name = 'frame'<\/code> — OpenCV জানালার নাম, যার গায়ে Part 13-এর <code>namedWindow<\/code> আর <code>setMouseCallback<\/code> বসবে; <code>self.cols, self.rows = 0, 0<\/code> আর <code>Mouse_XY = (0, 0)<\/code> — mouse-জ্যামিতির শূন্য-সূচনা।"},{"a":88,"b":90,"text":"<code>self.hsv_text<\/code> — HSV ছক সঞ্চয়ের ঠিকানা: <code>/home/jetson/yahboomcar_ws/src/M3Pro_demo/M3Pro_demo/LineFollowHSV.text<\/code>। <b>লক্ষ করো এক্সটেনশনটা<\/b>: <code>.text<\/code> — <i>.txt<\/i> নয়! file-টা আসলে plain text হলেও নামের এই বাঁকা বানান পুরো কোডজুড়ে হুবহু বজায় থাকবে — <code>os.path.exists<\/code> (ln 317), <code>read_HSV<\/code>, <code>write_HSV<\/code> (ln 322) সবাই এই স্ট্রিংটাই চিনবে; এক অক্ষর বদলালেই সঞ্চয়-পড়া দুই-ই ভেঙে পড়বে, তাই এটাকে যত্নে হুবহু বাঁচিয়ে রাখতে হবে। পাশে <code>self.color = color_follow()<\/code> — star import থেকে আসা vision-ইঞ্জিনের একটি নিজস্ব অনুলিপি, আর <code>self.scale = 1000<\/code> — PID-লাভের ভাগক, যার হিসাব-নিকাশ Part 10-এ।"},{"a":91,"b":93,"text":"দুটি PID-জোড়া আর একটি মর্যাদাহীন গতি। <code>FollowLinePID = (50, 0, 10)<\/code> — line-ধরার Kp, Ki, Kd; <code>RemovePID = (40, 0, 15.0)<\/code> — AprilTag-এর সামনে সরানোর। নিচের ln 95-এর <code>PID_init()<\/code> ডাক (দেহ Part 10-এ) এই দুই জোড়াকেই <code>self.scale<\/code> দিয়ে ভাগ করে আসল controller-এ বসাবে — declare_param-এর 60/0/20 কখনোই এখানে পৌঁছাবে না, সে গল্প Part 10-এ। আর <code>self.linear = 0.2<\/code>? <b>এ এক লেখা-হয়ে-কিন্তু-না-পড়ার গল্প<\/b>: declare_param-এর default 0.18-কে এখানে 0.2 করে মাটি করা হলো, কিন্তু execute() চলে আসলে hardcode করা <code>twist.linear.x = 0.1<\/code> নিয়ে (ln 269) — 0.2 কখনোই চাকায় পৌঁছায় না।"},{"a":94,"b":97,"text":"চার line-এর মিশ্র থালা। <code>#self.LaserAngle = 60<\/code> — মন্তব্যে কাটা পড়া পুরনো সংজ্ঞা: একসময় এই মান এখানেই লেখা থাকত, এখন তা declare_param-এর default হয়ে গেছে (Part 10); ln 108-এর <code>#self.ResponseDist<\/code>-ও একই জাতের জীবাশ্ম। <code>self.PID_init()<\/code> — ওপরের দুই tuple-কে এখনই দুটি সত্যিকারের <code>simplePID<\/code> controller-এ রূপ দেওয়া হলো (star import-এর শ্রেণি)। <code>self.img_flip = False<\/code> — ছবি আয়নায়ন হবে না, তাই execute()-র else-পথ <code>twist.angular.z = +z_Pid<\/code> (ln 265) সক্রিয় থাকবে; <code>self.refresh<\/code> — declare_param (Part 10) যে-নামের parameter পড়ে, সেই পতাকা; এখন False।"},{"a":99,"b":101,"text":"<code>self.pubCurrentJoints()<\/code> — অনেক নিচে (ln 134-137, Part 7) সংজ্ঞাত প্রেরক-মেথডের এখনকার ডাক: 'Curjoints' topic-এ বাহুর বর্তমান ছয় কোণ <code>[90, 90, 12, 20, 90, 0]<\/code> (Part 4-এর init_joints) পাঠিয়ে দেওয়া — শুরুতেই যেন বাইরের কেউ জানতে পারে হাত কোথায় দাঁড়িয়ে আছে। পাশে আরও দুটি খালি শুরু: <code>self.tags = []<\/code> — এখনো কোনো AprilTag চোখে পড়েনি, আর <code>self.depth_image_info = []<\/code> — এখনো কোনো depth frame রূপান্তরিত হয়নি; দুজনেরই আসল ভরাই হবে প্রথম synced camera frame-এ (Part 8)।"},{"a":102,"b":104,"text":"বাহুর দুটি message-খাম তৈরি, কিন্তু একটির ঠিকানা কোনোদিন লেখা হবে না। <code>self.joint5 = Int16()<\/code> — এটি পরে খুব জীবন্ত: Part 14-এ AprilTag-এর কোণ থেকে <code>compute_joint5<\/code>-এর ফল এতে বসে <code>TargetJoint5_pub<\/code>-এ পাঠানো হবে, একবার নয় দুবার। কিন্তু <code>self.joint6 = Int16()<\/code> আর <code>self.joint6.data = 120<\/code>? Part 4-এ <code>TargetJoint6_pub<\/code> প্রকাশক সত্যিই তৈরি হয়েছে, খামে 120-ডিগ্রির আদেশও বসানো হলো — অথচ পুরো file-এ <code>TargetJoint6_pub<\/code>-এর publish একবারও ডাকা হয় না। joint6 লেখা হয়, পাঠানো হয় না — write-only খাম, চিরকাল ড্রয়ারে পড়ে থাকবে।"},{"a":105,"b":110,"text":"স্বয়ংক্রিয়-শুরুর ঘড়ি জোড়া লাগানো হলো। <code>self.Start_ = True<\/code> আর <code>self.count = True<\/code> — দুই পালা, পরে Part 8-এর গেটে দুই-ই সত্য থাকতে হবে; <code>self.start_time = time.time()<\/code> — node-জন্মের মুহূর্ত টুকে রাখা (<code>time<\/code> star import-এর দান — এই file-এ <code>time<\/code> module-এর কোনো import-line নেই (Part 2))। জন্মের ৩ সেকেন্ড পরে ln 167-170 এই ঘড়ি দেখে Track_state-কে একবারই 'tracking'-এ ফেলে <code>count<\/code>-কে False করে দেবে — চিরদিনের জন্য। <code>#self.ResponseDist = 0.25<\/code> — আরেকটি জীবাশ্ম মন্তব্য। <code>self.front_warning = 0<\/code> — laser-প্রহরীর কাউন্টার শূন্যে; আর <code>self.Joy_active = False<\/code> — <b>দ্বিতীয়বার<\/b> লেখা (ln 74-এও ছিল), ক্ষতি নেই, একই মান।"},{"a":111,"b":114,"text":"চার line-এর উদ্বোধনী ছাপা। <code>Init Done.<\/code> — সব কনস্ট্রাকশন শেষ; তারপর ড্যাশ-দণ্ড দিয়ে সীমানা টানা। শেষের দুই ছাপা আসলে স্বাস্থ্য-পরীক্ষা: <code>print(\"self.LaserAngle: \",self.LaserAngle)<\/code> আর ResponseDist-এর ছাপা terminal-এ দেখিয়ে দেবে 60 আর 0.25 — মান দুটি declare_param() থেকে এসেছে (Part 10), ln 94/108-এর মন্তব্য-কাটা হার্ডকোড থেকে নয়। চালানোর সময় এই দুই সংখ্যা চোখে পড়লেই বোঝা যাবে laser-পর্দা আর দূরত্ব-দুয়ার কতটা খোলা বসে আছে — Part 7-এর কোণ-গণিত ঠিক এই দুই মানকেই ব্যবহার করবে।"}],"math":null,"robot":{"correct":"ঠিকঠাক চালু হলে terminal-এ ছাপা হয় Init Done., তারপর ড্যাশ-দণ্ড, তারপর self.LaserAngle: 60 আর self.ResponseDist: 0.25 — অর্থাৎ __init__ শেষ পর্যন্ত বিনা ত্রুটিতে পৌঁছেছে। এই মুহূর্তে robot নড়ে না, buzzer-ও নীরব — কেবল একটি খালি 'Curjoints' বার্তা বেরিয়ে যায়; সব প্রস্তুতি দাঁড়িয়ে প্রথম synced camera frame আর প্রথম /scan1 বার্তার অপেক্ষায়।","incorrect":"সাধারণ ভুল ধারণা: self.linear = 0.2 মানেই robot 0.2 m/s গতিতে line ধরবে। বাস্তবে চাকা কখনোই 0.2 দেখবে না — execute() প্রতি frameে hardcode করা twist.linear.x = 0.1 পাঠায়; 0.18-ও না, 0.2-ও না। PID-ও অনুরূপ: declare করা 60/0/20 নয়, এই Part-এর (50, 0, 10)-ই controller-এ বসে — সংখ্যা যাচাইয়ে ভুল জায়গায় তাকালে ডায়াগনোসিস পথ হারায়।"},"animType":null},{"n":7,"id":"part-07","fname":"follow_line.py","enTitle":"Laser Cone — registerScan & Joint Broadcast","lang":"python","start":118,"end":137,"flags":[],"explain":[{"a":118,"b":120,"text":"<code>JoyStateCallback<\/code>-এর <b>প্রথম<\/b> সংজ্ঞা — আর এখানেই এক সূক্ষ্ম ফাঁদ: Python class-দেহ উপর থেকে নিচে সম্পাদিত হয়, তাই ln 397-এ (Part 15) একই নামের দ্বিতীয় সংজ্ঞা এটিকে সরিয়ে নিজেই বসে যাবে — চলার সময়ে কাজ করবে সেটাই। দেহটা সংক্ষিপ্ত: <code>isinstance(msg, Bool)<\/code> পরীক্ষায় ভুল ধরনের বার্তা এলেই নীরব প্রস্থান, নাহলে <code>self.Joy_active = msg.data<\/code> — /JoyState topic-এর সত্য-মিথ্যা ঢেউ এখানে ঢুকে execute()-র (Part 12) গতি-পথ বদলে দেয়: joystick সত্য হলে robot নিজের line-তাড়া থামিয়ে চালকের হাতে সঁপে দেয়।"},{"a":122,"b":125,"text":"<code>registerScan<\/code> — laser-প্রহরীর কেন্দ্র; Part 4-এর subscriber একে ডাকবে প্রতিটি <code>LaserScan<\/code> বার্তায়, আর খেয়াল রাখো topic-এর নাম <code>/scan1<\/code> — <code>/scan<\/code> নয়। প্রথম কাজটাই সবচেয়ে গুরুত্বপূর্ণ: <code>self.front_warning = 0<\/code> — প্রতিটি নতুন স্ক্যানে কাউন্টার <b>শূন্য থেকে শুরু<\/b>, আগের স্ক্যানের ভয় সঙ্গে বহন করে না। তারপর <code>isinstance<\/code> পাহারা, আর <code>np.array(scan_data.ranges)<\/code> — ROS-এর দীর্ঘ দূরত্ব-তালিকাকে numpy array-তে তোলা, যাতে নিচের লুপ সূচক <code>i<\/code> দিয়ে প্রতিটি beam আলাদা করে ধরা যায়।"},{"a":126,"b":127,"text":"প্রতিটি beam-এর জন্য প্রথম প্রশ্ন: তুমি কোথায় দাঁড়িয়ে? <code>angle = (scan_data.angle_min + scan_data.angle_increment * i) * RAD2DEG<\/code> — LaserScan-এর কোণ থাকে radian-এ: <code>angle_min<\/code> প্রথম beam-এর কোণ, প্রতি ধাপে <code>angle_increment<\/code> যোগ হয়, আর <code>RAD2DEG = 180 / math.pi<\/code> ≈ 57.29578 (ln 12, Part 2) ফলাফলটাকে degree-তে নামায়। সূচক <code>i<\/code> এভাবেই কোণে পরিণত হয় — ঘূর্ণায়মান laser-মানচিত্রে প্রতিটি beam পায় নিজের দিগন্ত, যেখানে 0° মানে robot-এর সোজা সামনে, আর মান ঋণাত্মক দিকে গেলে সেটা বাম বা ডান পাশের কথা।"},{"a":128,"b":128,"text":"এবার দুয়ার-পরীক্ষা: এই beam কি সামনের কোণায়? প্রথম শর্ত <code>abs(angle) &lt; self.LaserAngle*0.5<\/code> — LaserAngle=60 (Part 10) হলে <b>|angle| &lt; 30°<\/b>: সামনের দিক ঘিরে ±30°-র পর্দা। পাশের <code>or abs(angle) &gt; 360 - self.LaserAngle*0.5<\/code> — <b>|angle| &gt; 330°<\/b>: কোণ-মান যদি 0-360 জাতের হিসাবে ঘোরে, তবে 330°-র ওপারের beam-রাও আসলে সামনেরই (−30°-র সমতুল্য) — দুই শর্ত মিলে সামনের জানালাকে দুই দিক থেকে বন্ধ করে। তৃতীয় শর্ত <code>ranges[i] !=0.0<\/code>: lidar-এর রীতিতে 0 মানে কোনো প্রতিফলনই নেই — সেই শূন্য-beam-কে বস্তু ভেবে গোনা নিষেধ।"},{"a":129,"b":131,"text":"দ্বিতীয় দুয়ার: কতটা কাছে? <code>ranges[i] &lt;= self.ResponseDist * 1.5<\/code> — ResponseDist=0.25 (Part 10), তাই সীমা <b>0.25 × 1.5 = 0.375 m<\/b>: সামনের 30°-জানালার ভেতর 37.5 সেমি বা তার কাছাকাছি কোনো বস্তু থাকলেই সেই beam অপরাধী হিসেবে গণ্য। মাঝের মন্তব্য-কাটা <code>print<\/code> (<code>-+-+-+-+-+-+-+-+-<\/code>) ডিবাগের ভূতুড়ে চিহ্ন — এক সময় প্রতিটি অপরাধী beam ছাপত, এখন নীরব। শেষ line <code>self.front_warning += 1<\/code> — প্রতিটি অপরাধী beam কাউন্টারে এক ফোঁড় কাটে; এই কাউন্টারই execute()-তে (ln 270, Part 12) <code>&gt; 10<\/code> হলে robot থামিয়ে /beep-এ বিপদ বাজাবে — হিসাবটা math-অংশে ধাপে ধাপে।"},{"a":134,"b":137,"text":"<code>pubCurrentJoints<\/code> — ছোট্ট কিন্তু সৎ প্রেষক। <code>CurJoints()<\/code> খাম তৈরি, <code>cur_joints.joints = self.init_joints<\/code> — খামে বসল Part 4-এর সেই শুরুর ছয় কোণ <code>[90, 90, 12, 20, 90, 0]<\/code>, আর <code>self.pub_cur_joints.publish(cur_joints)<\/code> খামটা 'Curjoints' topic-এ (queue 1, Part 4) ছেড়ে দেয়। একে ডাকা হয় মাত্র একবার — __init__-এর ln 99-এ (Part 6); মানে এটি node-জন্মের বিজ্ঞপ্তি: 'হাত এই ভঙ্গিতে দাঁড়িয়ে আছে'। বাহু নাড়ায় না, শুধু জানায় — নড়াচড়ার দায় pubSixArm-এর (Part 9), সে যাবে অন্য পথে।"}],"math":{"intro":"registerScan-এর পুরো কাজ এক line-এ বলা যায়: 360°-র beam-সমুদ্রকে একটি পূর্ণসংখ্যাতে — <code>front_warning<\/code>-এ — নামিয়ে আনা। চার ধাপের সিঁডি: সূচক থেকে কোণ, কোণ থেকে সামনের-পর্দা, পর্দা থেকে দূরত্ব-ছাঁকনি, আর গণনা থেকে থামানোর সিদ্ধান্ত। প্রতিটি সংখ্যা follow_line.py-এর কোড থেকেই এসেছে।","levels":[{"label":"Level 1 — সূচক থেকে কোণ","latex":"\\[ \\theta_i = \\left(\\theta_{\\min} + i\\,\\Delta\\theta\\right)\\cdot\\frac{180}{\\pi}, \\qquad \\frac{180}{\\pi} \\approx 57.29578 \\]","text":"সূচক i নম্বর beam-এর কোণ = প্রথম beam-এর কোণ যোগ ধাপ-প্রতি বৃদ্ধি, সবটাই RAD2DEG গুণে degree-তে। ln 127-এর হুবহু গাণিতিক রূপ।"},{"label":"Level 2 — সামনের 30°-পর্দা","latex":"\\[ \\mathrm{front}(\\theta) \\;\\Longleftrightarrow\\; |\\theta| \\lt \\tfrac{60}{2} = 30^{\\circ} \\;\\;\\lor\\;\\; |\\theta| \\gt 360 - 30 = 330^{\\circ} \\]","text":"LaserAngle=60 (declare_param-এর default) অর্ধেক করে 30° — সামনে 0°-কে ঘিরে ±30°-র জানালা; আর 360−30=330°-র ওপারের কোণেরাও একই জানালার অপর নাম (−30°-র সমতুল্য)। ln 128-এর দুই শর্ত এক line-এ।"},{"label":"Level 3 — দূরত্ব-ছাঁকনি","latex":"\\[ 0 \\lt r_i \\le 0.25 \\times 1.5 = 0.375\\ \\mathrm{m} \\]","text":"শূন্য দূরত্ব (প্রতিফলন নেই) বাদ, আর সীমা ResponseDist-এর দেড় গুণ — 0.25 m-এর বদলে 0.375 m: থামার দূরত্বের আগেই সতর্কতার মার্জিন রাখা। ln 128-129 মিলিয়ে এক শর্ত।"},{"label":"Level 4 — কাউন্টার ও থামানোর সিদ্ধান্ত","latex":"\\[ N = \\sum_{i} \\mathbf{1}\\big[\\,\\mathrm{front}(\\theta_i) \\wedge (0 \\lt r_i \\le 0.375)\\,\\big], \\qquad N \\gets 0 \\;\\text{each scan}, \\qquad N \\gt 10 \\Rightarrow \\text{stop} \\]","text":"প্রতিটি স্ক্যানে N শূন্য থেকে গোনা হয় (ln 123), আর execute()-র ln 270 (Part 12) দেখে N &gt; 10 কিনা — এগারোতম অপরাধী beam-ই robot-কে থামিয়ে buzzer জ্বালায়; পথ পরিষ্কার হলে N শূন্যে ফিরে চলা আবার শুরু।"}]},"robot":{"correct":"প্রতিটি /scan1 বার্তায় কাউন্টার শূন্য থেকে গোনা হয়; সামনের ±30° জানালায় (বা 330°-র ওপারে) 0.375 m-র মধ্যে ১১টির বেশি beam পড়লেই execute() শূন্য Twist পাঠিয়ে robot থামে, /beep-এ 1 যায় — buzzer বাজে, terminal-এ Obstacles ahead !!! ছাপা হয়। পথ খোলা হলে /beep-এ 0 যায় পরপর তিনবার, line-অনুসরণ আবার চলে।","incorrect":"সবচেয়ে সহজ ভুল: lidar-এর topic /scan ভাবা — এই node শোনে /scan1-কে, তাই /scan-এ ডেটা ঢাললে registerScan একবারও ডাকা পাবে না, front_warning চিরশূন্য, robot দেয়াল ঘেঁষেও থামবে না। আরেকটি ভ্রম: কাউন্টার স্ক্যান-জুড়ে জমে — আসলে প্রতি বার্তায় শূন্য থেকে শুরু, পুরোনো ভয় মুছে যায়।"},"animType":"laserCone"},{"n":8,"id":"part-08","fname":"follow_line.py","enTitle":"Grasp Signal & the Synced Camera Callback","lang":"python","start":140,"end":174,"flags":[],"explain":[{"a":140,"b":145,"text":"<code>get_graspStatusCallBack<\/code> — বাহুর 'কাজ শেষ' সংকেতের শ্রোতা; Part 4-এর <code>grasp_done<\/code> subscriber (Bool, queue 100) বার্তা পৌঁছায় ঠিক এখানে। <code>msg.data == True<\/code> হলে তিনটি কাজ: <code>move_flag<\/code> আর <code>pubPos_flag<\/code> দুই-ই আবার True — Part 5-এ যে দুই গেট tag-handoff-এর পর বন্ধ হয়ে গিয়েছিল, তার মানে tag-সরানো ও পাঠানোর অনুমতি ফিরে এলো; আর <code>len(self.tags) == 0<\/code> হলে <code>Track_state = 'tracking'<\/code> — চোখের সামনে আর কোনো tag নেই, তাই নজর আবার line-এ ফেরে। Remove-চক্রের (Part 14) শেষ কড়া এটিই: বাহু নামল, robot রাস্তায় উঠল।"},{"a":147,"b":148,"text":"<code>callback<\/code> — পুরো node-এর হৃৎস্পন্দন; Part 4-এর <code>ApproximateTimeSynchronizer<\/code> (slop 0.5) যখন রঙ+depth দুই frame-এর টাইমস্ট্যাম্প জুড়ে দেয়, তখনই এই দ্বৈত-আর্গুমেন্ট ফাংশন ডাকা হয়। ln 148-এর মন্তব্যটা চোখ টানে: <code># 将画面转为 opencv 格式<\/code> — চীনা ভাষায়, অর্থ <b>'convert the frame to opencv format'<\/b> (画面 = ছবি/frame, 转为 = রূপান্তর করা, 格式 = ফরম্যাট)। পুরো English file-এর বুকে এক line-এর চীনা দাগ — Yahboom-এর মূল চীনা কোডবেস থেকে রয়ে যাওয়া উত্তরাধিকার; নিচের lineটাই (imgmsg_to_cv2) এই মন্তব্যের কোড-রূপ।"},{"a":149,"b":150,"text":"<code>self.rgb_bridge.imgmsg_to_cv2(color_frame,'rgb8')<\/code> — ROS Image message থেকে numpy array, channel-ক্রম RGB (cv2-এর দেশীয় BGR নয় — তাই শেষে ln 172-তে আবার ঘুরিয়ে নিতে হবে)। পরের line <code>rgb_image = np.copy(rgb_image)<\/code> — ছবিটাকে নিজের কপিতে তুলে নেওয়া: এর পরে draw_tags-এর দাগ, ROI-র বাক্স, HSV-র মাস্ক — সব এই কপিতেই বসবে, আর কারও ভাগাভাগি-করা মূল ডেটা নষ্ট হবে না। ছোট্ট line, কিন্তু নিরাপদ অভ্যাস — শেয়ারড buffer-এর ওপর আঁকাজোখার ঝুঁকি এড়িয়ে যাওয়া।"},{"a":152,"b":155,"text":"depth-এর রূপান্তর, ধাপে ধাপে। <code>imgmsg_to_cv2(depth_frame, encoding[1])<\/code> — encoding list-টা Part 3-এর: <code>['16UC1', '32FC1']<\/code>; ব্যবহৃত হয় কেবল দ্বিতীয়টি, '32FC1' — 32-bit float, প্রতি pixel-এ মিলিমিটার-জাত দূরত্ব, তাইই Part 14-এর ln 357-তে 1000 দিয়ে ভাগ করে মিটারে নামানো হবে (encoding[0] চিরকাল অব্যবহৃত)। তারপর <code>cv2.resize(depth_image, (640, 480))<\/code> — depth-কে রঙিন frame-এর 640×480 জালে মেলানো, যাতে একই (y, x)-ঠিকানায় দুই ছবিতে একই বিন্দু পড়ে; শেষে <code>astype(np.float32)<\/code> করে <code>self.depth_image_info<\/code>-তে সঞ্চয় — Part 14-এর tag-দূরত্ব পাঠ এই ভাণ্ডার থেকেই হবে।"},{"a":157,"b":159,"text":"এবার AprilTag-শিকার। <code>cv2.cvtColor(rgb_image, cv2.COLOR_RGB2GRAY)<\/code> — detector কাজ করে ধূসর ছবিতে; শেষ তিন আর্গুমেন্টের ভাগ্য আগেই জানা (Part 5): <code>False, None, 0.025<\/code> — pose off, camera_params None, তাই 0.025 চুপচাপ অচল। ফল <code>self.tags<\/code>-এ জমে, তারপর <code>self.tags = sorted(self.tags, key=lambda tag: tag.tag_id)<\/code> — tag-id অনুযায়ী ক্রম, ফলে Part 14 যখন <code>self.tags[0]<\/code> ধরে তখন পায় সবচেয়ে ছোট id-ধারী tag-কেই — ফল নির্ধারিত থাকে। <code>draw_tags<\/code> (Part 3-এর import-তালিকা থেকে) rgb_image-র গায়ে corner আর center আঁকে — (0,0,255) আর (0,255,0) tuple-দুটি ঠিকানা হিসেবে গেছে, চূড়ান্ত রং কী দেখাবে তা draw_tags-এর ভেতরের ব্যাপার।"},{"a":161,"b":165,"text":"<b>এবার আসল কৌতূহল<\/b>: ln 161-এর মন্তব্য <code>#depth_image<\/code>-এর নিচে হুবহু আগের কাজটাই আবার — একই <code>depth_frame<\/code>, একই <code>self.depth_bridge.imgmsg_to_cv2(depth_frame, encoding[1])<\/code>, একই <code>cv2.resize(depth_image, (640, 480))<\/code>, একই <code>astype(np.float32)<\/code>। পার্থক্য শুধু গন্তব্যে: <code>depth_image_info = frame.astype(np.float32)<\/code> — <code>self.<\/code> ছাড়া, অর্থাৎ <b>local<\/b> চলক; আর এই local কপিটির পরে আর কোথাও নাম নেই। ওপরের self-সংস্করণ (ln 152-155) যেহেতু জমা হয়েই আছে, দ্বিতীয় রূপান্তরটি প্রতিটি synced frame-এ বিনা ফলে CPU খরচ করে — কপি-পেস্টের প্রেতাত্মা; মুছে দিলে আচরণ বদলানোর কথাও নয়।"},{"a":166,"b":170,"text":"<code>action = cv2.waitKey(1)<\/code> — 'frame' জানালায় 1 ms অপেক্ষা করে চাপা key (থাকলে) তোলা; এই action পরে <code>process<\/code>-কে গিয়ে অবস্থা-মেশিন ঘুরিয়ে দেবে (space মানে tracking, i মানে identify, r মানে Reset, q মানে cancel — Part 13)। এরপর স্বয়ংক্রিয়-শুরুর একলাভ ফাঁদ: <code>count<\/code> আর <code>Start_<\/code> দুই-ই True থাকলে এবং জন্মের মুহূর্ত (ln 106, Part 6) থেকে <code>(time.time() - self.start_time)&gt;3<\/code> হলে — <code>Track_state = 'tracking'<\/code>, সঙ্গে <code>count = False<\/code>: ফ্লিপটা ঠিক একবারই ঘটবে, দ্বিতীয়বার কখনো নয়। ৩ সেকেন্ড পরে node নিজে থেকেই line-তাড়া শুরু করে।"},{"a":171,"b":174,"text":"সমাপ্তি-মঞ্চ। <code>self.process(rgb_image,action)<\/code> — ছবি আর key-চাপা একসাথে পাঠিয়ে দেওয়া হলো Part 13-14-এর লম্বা পাইপline-এ; ফেরত আসে জোড়া: <code>result_img<\/code> (HSV-মাস্ক আর ROI-দাগ মাখা ছবি) আর <code>bin_img<\/code> (সাদা-কালো binary মাস্ক)। <code>cv2.cvtColor(result_img, cv2.COLOR_RGB2BGR)<\/code> — শুরুতে RGB ক্রমে নিয়েছিলাম, cv2.imshow-এর দেশ BGR, তাই ফেরানো। <code>len(bin_img) != 0<\/code> হলে <code>ManyImgs(1, ([result_img, bin_img]))<\/code> — star import-এর যোগাই — দুই ছবি পাশাপাশি জুড়ে 'frame' জানালায় দেখায়; নাহলে একাই। প্রতিটি synced জোড়ায় এই চক্র বারবার ঘোরে।"}],"math":null,"robot":{"correct":"camera চালু থাকলে প্রতি synced জোড়ায় 'frame' জানালায় দুই ছবি পাশাপাশি দেখা যায় — বাঁয়ে রঙিন ছবিতে tag-এর কোণার দাগ আর ROI, ডানে সাদা-কালো binary মাস্ক; tag না থাকলে দাগও নেই। node চালুর ঠিক ৩ সেকেন্ড পরে robot নিজে থেকেই line ধরতে শুরু করে — Track_state 'tracking'-এ ওঠে, আর জানালায় key চাপলে অবস্থা বদলায়।","incorrect":"ভুল ধারণা দুই প্রকার। এক, depth-এর দ্বিতীয় রূপান্তরটাকে (ln 162-165) কাজের অংশ ভাবা — আসলে ওটি local চলকেই মরে যায়, কাজের ভাণ্ডার ln 152-155-এর self.depth_image_info। দুই, 640×480 resize-কে সাজসজ্জা ভাবা — resize না থাকলে depth আর color ছবির pixel-জাল আলাদা হয়ে যেত, আর tag-এর (y, x)-ঠিকানায় ভুল ঘর পড়ে দূরত্ব এলোমেলো হতো।"},"animType":null},{"n":9,"id":"part-09","fname":"follow_line.py","enTitle":"pubSixArm — the Mirrored Arm Messenger","lang":"python","start":176,"end":185,"flags":[],"explain":[{"a":176,"b":176,"text":"<b>ছয় joint-এর একমাত্র ডাক-ঘর<\/b>: এই function-ই <code>arm6_joints<\/code> topic-এ বার্তা পাঠায়। চারটি আর্গুমেন্টের মধ্যে আসলে দুটিই কাজে লাগে — <code>joints<\/code> (ছয়টি কোণের list) আর <code>runtime<\/code> (default 2000)। <code>id=6<\/code> আর <code>angle=180.0<\/code> দুটোই শুধু signature-র নাম-ফলকে বসে আছে; নিচের ন-লাইনের body-তে এদের নামগন্ধও নেই — কোনো কাজে লাগে না। অন্য কোনো স্ক্রিপ্ট থেকে আসার পথে পুরনো দরজার ফলক ঝুলে রইল শুধু; এই file-এর কোথাও এই দুই ঘরে মান দিয়ে ডাকা হয় না।"},{"a":177,"b":178,"text":"<code>ArmJoints()<\/code> দিয়ে খালি ছয়-সদস্যের খাম তৈরি, তারপরই এই file-এর সবচেয়ে গুরুত্বপূর্ণ এক লাইনের কৌশল: <code>arm_joints.joint1 = 180 - joints[0]<\/code> — base-joint-এর কোণ ১৮০ থেকে বিয়োগ হয়ে যায়, মানে <b>আয়না-প্রতিফলন<\/b>: দিক-সংখ্যা উলটে যায়। ৯০ চাইলে ৯০-ই পায় (Home ভঙ্গি অপরিবর্তিত), কিন্তু ৬০ চাইলে সার্ভো পায় ১২০, ১২০ চাইলে পায় ৬০। সার্ভোর শূন্য-দিক আর কোডের সংখ্যা-দিক সম্ভবত উলটো বসানো, আর এই একটি বিয়োগই দুই জগতের হিসাব মিটিয়ে দেয় — বাকি পাঁচ joint-কে এর দরকার পড়েই না।"},{"a":179,"b":183,"text":"পরের পাঁচ লাইন সরল সেতু: <code>joint2 = joints[1]<\/code> থেকে <code>joint6 = joints[5]<\/code> — joint 2 থেকে 6 প্রতিটি কোণ <b>হুবহু<\/b> যায়; কোনো আয়না নেই, কোনো clamp নেই, সীমা-যাচাই নেই। আয়না শুধু joint1-এর একার; joint6-ও ছয়জনের দলেই যায়, কোনো বিশেষ চিকিৎসা নেই। খেয়াল রেখো: Part 14-এর AprilTag handoff যে <code>set_joint5<\/code> single-joint topic ব্যবহার করবে সে একদম অন্য রাস্তা — ওখানে এক সময়ে এক joint, এখানে সব ছয়টি একসাথে এক বার্তায়।"},{"a":184,"b":185,"text":"<code>arm_joints.time = runtime<\/code> — সার্ভোকে দেওয়া সময়ের খাম, একক millisecond; default 2000 মানে ছয় joint-কে বলা হচ্ছে লক্ষ্য-কোণে পৌঁছতে ২ সেকেন্ড নিতে। একই <code>runtime<\/code> সবাই ভাগ করে নেয়, joint-ভেদে আলাদা গতির ব্যবস্থা নেই। শেষ লাইনে <code>self.pub_SixTargetAngle.publish(arm_joints)<\/code> — Part 4 (ln 44) যে publisher <code>arm6_joints<\/code> topic-এ queue 10 নিয়ে বানিয়েছিল, এখানে সে-ই খাম ছাড়ে। আর Part 4-এর startup handshake (ln 52-55) ঠিক এই function-কেই ০.১ সেকেন্ড পরপর ডেকে arm-পাশের subscriber-এর অপেক্ষা করে।"}],"math":null,"robot":{"correct":"node চালু হলে Part 4-এর handshake এই function-কে বারবার ডাকে — subscriber না আসা পর্যন্ত প্রতি ০.১ s-এ <code>[90, 90, 12, 20, 90, 0]<\/code> যায়; joint1 = 180 - 90 = 90 তাই Home ভঙ্গি অক্ষত। subscriber একবার এলেই শেষ একটি বার্তা ছুটে যায়, আর পরে প্রতিটি ডাকে ছয় joint 2000 ms সময় পেয়ে একসাথে লক্ষ্য-কোণে যায় — কোনো কোণের সীমা-যাচাই ছাড়াই।","incorrect":"<code>joints[0]=60<\/code> পাঠালে base-joint ৬০-এ যাবে ভাবা — আসলে 180 - 60 = 120-এ যায়; আয়না-বিয়োগ শুধু joint1-এ, বাকি পাঁচজন সরাসরি যায়। আবার <code>id<\/code> বা <code>angle<\/code> আর্গুমেন্ট বদলালে কিছু ঘটবে ভাবাও ভুল — body ওই দুই নাম স্পর্শই করে না, default ফলক শুধু ঝুলে আছে।"},"animType":null},{"n":10,"id":"part-10","fname":"follow_line.py","enTitle":"declare_param & PID_init — 60 Becomes 50","lang":"python","start":187,"end":230,"flags":[],"explain":[{"a":187,"b":188,"text":"<code>def declare_param(self):<\/code> — Part 6-এর <b>ln 73<\/b>-এ একবারই ডাকা হয়, আর এখানে এক নিঃশ্বাসে এই node-এর ১৪টি ROS 2 parameter জন্মায়। প্রতিটির জন্য দুই লাইনের ছাঁচ: <code>declare_parameter(name, default)<\/code> দিয়ে default-সহ নিবন্ধন, তারপরই <code>get_parameter(name).get_parameter_value()<\/code> দিয়ে মানটি attribute-এ তোলা — launch-এ কেউ override করেনি, তাই ফেরত আসে সবসময় default-ই। <code>#HSV<\/code> comment নিচের ছয়টির থিম জানিয়ে দেয়: রঙ-চেনার সীমা-দেয়াল।"},{"a":189,"b":194,"text":"HSV-র নিচের সীমা তিনটি: <code>Hmin=0<\/code>, <code>Smin=85<\/code>, <code>Vmin=126<\/code>। প্রতিটি পড়ার লাইনের শেষে <code>.integer_value<\/code> — default যেহেতু পূর্ণসংখ্যা, accessor-ও তাই; জোড়া না মিললে None ফেরত আসত, তাই এই মিল বাধ্যতামূলক। তিনটি মান আসলে রঙ-ছাঁকনির নিচের দেয়াল: Hue ০ থেকে শুরু, Saturation ৮৫ থেকে (ফ্যাকাশে নয় এমন পিক্সেল চাই), Value ১২৬ থেকে (অন্ধকার পিক্সেল বাদ) — এগুলো Part
