 13-এ <code>line_follow<\/code>-এর ভেতরে রঙ-মাস্ক বানাতে কাজে লাগবে।"},{"a":195,"b":200,"text":"উপরের সীমাও তিনটি: <code>Hmax=9<\/code>, <code>Smax=253<\/code>, <code>Vmax=253<\/code>। দুই সীমা মিলিয়ে Hue-র ঘর <b>০ থেকে ৯<\/b> — hue-চাকার একদম লাল প্রান্তের সরু ফালি; এই default দিয়েই file-টির জন্ম লাল line ধরার জন্য। কিন্তু ছয়টি মান চিরস্থির নয় — Part 11-এর ROI টানলে Part 13-এর <code>dyn_update<\/code> পথ (ln 321-333) নতুন HSV <code>write_HSV<\/code> দিয়ে file-এ লিখে <code>set_parameters<\/code> দিয়ে এই নিবন্ধিত নামগুলোকেই বদলে দেয়। declare করার আসল মূল্য এই খোলা দরজায় — নিজের রঙ নিজে শেখার সুযোগ।"},{"a":201,"b":207,"text":"আগে একটা ছোট রহস্য: <code>#PID<\/code> comment-এর আগের ফাঁকা অংশ ৮টি <b>space<\/b> — declare_param-এর body-র বাকি সব লাইন যেখানে TAB দিয়ে শুরু, শুধু এই comment-লাইনটি স্পেসে বসে (নিরীহ; Python-এর ইন্ডেন্ট-হিসাবে comment-এর দাম নেই)। নিচে তিনটি declare: <code>Kp=60<\/code>, <code>Ki=0<\/code>, <code>Kd=20<\/code> — <b>এই Part-এর নাটকের কেন্দ্র<\/b>। মানগুলো <code>self.Kp<\/code>-জাতীয় attribute-এ ঠিকই ওঠে, কিন্তু নিচের <code>PID_init<\/code> এদিকে তাকায়ই না — সে পড়ে <code>FollowLinePID<\/code>, যেটা Part 6-এর <b>ln 91<\/b>-এ হার্ডকোড (50, 0, 10)। declared 60 কখনো controller-এ পৌঁছায় না।"},{"a":208,"b":218,"text":"শেষ পাঁচটি। <code>scale=1000<\/code> — একই নামের attribute Part 6-এর ln 90-এ আবার 1000 বসায় (দ্বিগুণ কাজ, একই ফল); এর কাজ PID_init-এর ভাগ-অঙ্কে। <code>LaserAngle=60<\/code> আর <code>ResponseDist=0.25<\/code> যায় Part 7-এর laser-cone গণিতে (কোণ-খোলা ৬০°, দূরত্ব-দেয়াল 0.25 × 1.5 = 0.375 m)। <code>linear=0.18<\/code> — <b>.double_value<\/b> পড়া গতি-সদস্য, কিন্তু কপাল খারাপ: Part 6-এর ln 93 সরাসরি 0.2 বসিয়ে দেয়, আর Part 12-এর execute চাকায় পাঠায় হার্ডকোড 0.1 — এই 0.18 কোনোদিন চলার গতিতে পৌঁছায় না। <code>refresh=False<\/code> (<b>.bool_value<\/b>) দিয়ে নিবন্ধন-তালিকা শেষ।"},{"a":220,"b":225,"text":"<code>PID_init<\/code> দুটি controller বানায়, দুটোই star import-এর <code>simplePID<\/code> (Part 2, follow_common)। প্রথমজন <code>PID_controller<\/code> — line-ধরার স্টিয়ারিং PID। call-এর চেহারাই আর্গুমেন্টের ভূমিকা বলে: চারটি list — লক্ষ্য <code>[0, 0]<\/code>, তারপর P-, I-, D-গেইনের list। প্রতিটি গেইন <code>FollowLinePID[...] / 1.0 / (self.scale)<\/code> ভাগে নামে: 50/1000, 0/1000, 10/1000 — আর প্রতিটি list-এর দ্বিতীয় ঘর ০, মানে দ্বিতীয় channel-এর গেইন শূন্য। কার্যকর গেইন তাই 0.05, 0, 0.01 — declared 60/20 নয়, tuple-এর 50/10। এই function ডাকা হয় Part 6-এর ln 95-এ, Part 12-এর ln 249-এ joystick-দখলের মুহূর্তে, আর Part 15-এর Reset-এও (ln 404)।"},{"a":226,"b":230,"text":"দ্বিতীয় জন <code>Remove_PID_controller<\/code> — AprilTag-সরানোর অ্যালাইনমেন্ট PID, ব্যবহার করবে Part 15-এর <code>remove_obstacle<\/code>। পার্থক্য লক্ষ করো: এখানে <b>দুই channel-ই<\/b> <code>RemovePID<\/code> (Part 6-এর ln 92: (40, 0, 15.0)) থেকে গেইন পায় — প্রতিটি list-এ একই মান দুবার দুই ঘরে — কারণ এই controller-কে x আর y দুই অক্ষেই সমান হারে ঠেলতে হয়। হিসাব: 40/1000 = 0.04, 0, 15.0/1000 = 0.015। লক্ষ্য আবার <code>[0, 0]<\/code> — কারণ Part 15-এ ভুলটা আগেই কেন্দ্র-দূরত্বে রূপ নিয়ে আসে, (point_x - 320)/10 আর (point_y - 400)/10 হয়ে; controller শুধু সেই বিয়োগ-ফল শূন্যে নামায়।"}],"math":{"intro":"declare_param-এর 60/0/20 আর PID_init-এর (50, 0, 10) — একই file-এ পাশাপাশি দুই সেট PID সংখ্যা, কিন্তু তাদের মধ্যে কোনো তার নেই। নিচের স্তরগুলো দেখায় কীভাবে নাম-নিবন্ধন আর কার্যকর গেইন একে অন্যকে না ছুঁয়ে বাস করে, আর scale=1000 ভাগ কীভাবে tuple-এর বড় সংখ্যাগুলোকে ছোট, ব্যবহার্য গুণকে নামায় — animation-এর pidScale এই খাঁজিই ঘোরায়।","levels":[{"label":"Level 1 — declared বনাম ব্যবহৃত","latex":"\\[ K_p^{\\mathrm{param}} = 60, \\quad K_i^{\\mathrm{param}} = 0, \\quad K_d^{\\mathrm{param}} = 20 \\]","text":"declare করা তিন সংখ্যা parameter-তাকে সুন্দর করে বসে থাকে — <code>ros2 param get<\/code>-এ মিলবে। কিন্তু controller বানায় অন্য উৎস থেকে: Part 6-এর ln 91-এর হার্ডকোড tuple। 60 আর 50-এর এই ফাঁকটাই এই Part-এর শিরোনাম — declared মান কেবল শোভা নয়, বিভ্রান্তিও।"},{"label":"Level 2 — scale-ভাগের রূপান্তর","latex":"\\[ K_p^{\\mathrm{eff}} = \\frac{\\mathrm{FollowLinePID}[0]}{1.0 \\times \\mathrm{scale}} = \\frac{50}{1000} = 0.05 \\]","text":"<code>/ 1.0<\/code> গুণটি ভাগকে float করে রাখে; আসল কাজ scale=1000-এর — tuple-এর সংখ্যা ১০০০ দিয়ে ভাগ হয়ে ছোট গুণক হয়। 50 তাই 0.05, 10 তাই 0.01। গেইন একক rad/s প্রতি ভুল-একক — ছোট সংখ্যা নয়, মাপা মান।"},{"label":"Level 3 — দুই controller-এর কার্যকর তালিকা","latex":"\\[ \\mathrm{Follow}: (K_p, K_i, K_d) = (0.05,\\; 0,\\; 0.01) \\qquad \\mathrm{Remove}: (0.04,\\; 0,\\; 0.015) \\]","text":"FollowLinePID=(50, 0, 10) আর RemovePID=(40, 0, 15.0) — উভয়ের চূড়ান্ত রূপ। Follow-এরটা এক-চ্যানেল (দ্বিতীয় ঘর ০), Remove-এরটা দুই-চ্যানেলে সমান গেইন। দুটিতেই Ki=0 — জমা-পদহীন PD-স্বভাব।"},{"label":"Level 4 — যদি declared-ই কাজে লাগত","latex":"\\[ \\frac{60}{1000} = 0.06 \\; (\\text{vs } 0.05), \\qquad \\frac{20}{1000} = 0.02 \\; (\\text{vs } 0.01) \\]","text":"Part 15-এর <code>get_param<\/code> (ln 424) ডাকা হলে parameter থেকে tuple আবার গড়াত — Kp ২০% বেশি, Kd দ্বিগুণ হয়ে স্টিয়ারিং হয়তো অস্থির হতো। সেই ডাক এই file-এ কোথাও আসে না — তাই 0.05-ই রাজা, 0.06 কখনো জন্মায়ই না।"},{"label":"Level 5 — Remove-এর দুই-চ্যানেল সাম্য","latex":"\\[ \\mathbf{g} = (g,\\, g), \\quad g \\in \\{0.04,\\; 0,\\; 0.015\\} \\]","text":"Remove_PID_controller-এর প্রতিটি গেইন-list হাতে-লেখা দুই সমান ঘর — x-অক্ষ (বাম-ডান) আর y-অক্ষ (সামনে-পিছনে) একই শক্তিতে সাড়া দেয়। Follow-PID-এর দ্বিতীয় ঘর ০ রাখার বিপরীত এই দুই-সমান বিন্যাসই Remove-এর চাহিদা: tag-কে দুই অক্ষেই ঠেলে আনতে হবে।"}]},"robot":{"correct":"চালু হওয়ার পর <code>ros2 param list<\/code> চালালে এই node-এর তালিকায় Hmin থেকে refresh পর্যন্ত ১৪টি নাম দেখা যাবে, <code>ros2 param get<\/code> Kp বলবে 60 — অথচ robot-এর স্টিয়ারিং চলবে 0.05/0/0.01 গেইনে, কারণ controller tuple থেকে একবারই তৈরি হয়ে যায়। বিপরীতে HSV-র ছয়টি নাম সত্যিই কাজে আসে — ROI শেখালে ওই নামগুলোতেই নতুন মান বসে।","incorrect":"<code>ros2 param set<\/code> দিয়ে Kp বদলালেই line-ধরা চাল বদলাবে ভাবা — এই কোডে ভুল; set সফল হবে, নিবন্ধনে নতুন মান বসবে, কিন্তু controller আগের দিনেই 0.05-এ বাঁধা, স্টিয়ারিং অক্ষরও বদলাবে না। আবার linear parameter-কে সত্যি ভেবে 0.5 করলে চাকার গতি বাড়বে না — execute-এর ভেতরে 0.1 হার্ডকোড করা।"},"animType":"pidScale"},{"n":11,"id":"part-11","fname":"follow_line.py","enTitle":"onMouse — Drawing the HSV ROI Box","lang":"python","start":232,"end":243,"flags":[],"explain":[{"a":232,"b":232,"text":"<code>def onMouse(self, event, x, y, flags, param):<\/code> — OpenCV মাউস-callback-এর নির্ধারিত পাঁচ-আর্গুমেন্ট ছাঁচ; ROS 2-এর কোনো topic এখানে নেই, ডাক আসে OpenCV window-এর event-লুপ থেকে। নিবন্ধন হয় Part 13-এর <b>ln 304<\/b>-এ, <code>cv.setMouseCallback(self.windows_name, self.onMouse, 0)<\/code> দিয়ে — ঠিক তখনই যখন <code>Track_state == 'init'<\/code>, আর window-এর নাম <code>frame<\/code> (Part 6-এর ln 85)। মাউসের প্রতিটি ঘটনায় OpenCV বর্তমান <code>x, y<\/code> আর event-নম্বর পাঠিয়ে এই function-কে ডাকে — আলাদা কোনো thread-নিয়ন্ত্রণ ছাড়াই।"},{"a":233,"b":236,"text":"<code>if event == 1:<\/code> — OpenCV-র চুক্তিতে ১ মানে বাম বোতাম নামলো (নামধারী constant <code>EVENT_LBUTTONDOWN<\/code>-এর সংখ্যা-রূপ; কোড সরাসরি খাঁটি সংখ্যাটাই লিখেছে)। প্রতিক্রিয়া তিনটি: <code>Track_state = 'init'<\/code> (window-নিবন্ধনের পথ টিকিয়ে রাখা), <code>select_flags = True<\/code> (টেনে-আনা শুরুর পতাকা), আর <code>Mouse_XY = (x,y)<\/code> — যে বিন্দুতে বোতাম নামল সেটিই বাক্সের <b>নোঙর-কোণা<\/b>। এরপর মাউস যেদিকেই টানো, প্রতিটি হিসাব এই নোঙরের সাথেই হবে — শুরুর বিন্দু মনে রাখাই এই তিন লাইনের কাজ।"},{"a":237,"b":239,"text":"<code>if event == 4:<\/code> — বাম বোতাম ছাড়া হলো (<code>EVENT_LBUTTONUP<\/code>-এর সংখ্যা)। দুটি কাজ: <code>select_flags = False<\/code> — টেনে-আনা শেষ, আর <code>Track_state = 'mouse'<\/code> — state machine-কে ঘোষণা যে ROI-আঁকা সম্পূর্ণ। এই নাম-বদলের ভার বইতে হবে Part 13-এর গল্পে: টানার প্রতিটি frame-এ বাক্সের ভেতরের পিক্সেল থেকে HSV বের হয়, ছাড়ার পরে ধাপ এগোয়। মনে রেখো — এই callback নিজে কিছু আঁকে না, ছবিতে হাতও দেয় না; সে শুধু <b>ঘোষণা জমা রাখে<\/b>, আঁকা আর ব্যবহার দুটোই Part 13-এর।"},{"a":240,"b":243,"text":"টেনে-আনার পুরো সময় <code>select_flags<\/code> সত্য থাকে, তাই মাউসের প্রতিটি নড়াচড়ায় এই চার লাইন চলে। নাম দেখে বোকা বনো না — <code>cols<\/code> আসলে নোঙর আর বর্তমান মাউসের <b>ছোট-কোণা<\/b>-জোড়া, <code>rows<\/code> <b>বড়-কোণা<\/b>-জোড়া: min-জোড়া আর max-জোড়া। ফলে ডান থেকে বামে টানলেও, নিচ থেকে ওপরে টানলেও বাক্স সুসংগত থাকে — min/max-এর জুড়িই দিক-নিরপেক্ষ করে দেয়। শেষ লাইনে <code>Roi_init = (x1, y1, x2, y2)<\/code> রূপে সেই বাক্স জমা; Part 13 এটাকেই আঁকতে (ln 306-307) আর <code>Roi_hsv<\/code>-তে রঙ-নমুনা কাটতে (ln 308-310) ব্যবহার করবে।"}],"math":null,"robot":{"correct":"<code>frame<\/code> window-তে মাউস চেপে line-এর ওপর টেনে বাক্স করলে টানার সময় কর্ণ-রেখা আর আয়তক্ষেত্র সঙ্গে সঙ্গে আঁকা হয় (আঁকে Part 13), ছাড়ার সাথে সাথে বাক্সের ভেতরের HSV থেকে line-এর রঙ শেখা শুরু হয়। এতে robot-এর চাকা সরে না — পুরো ঘটনা ভিডিও-লুপের ভেতরে, চলার অনুমতি আসে অনেক পরে 'tracking' অবস্থায়।","incorrect":"ROI টানলেই robot সঙ্গে সঙ্গে line ধরে চলতে শুরু করবে ভাবা — ভুল; onMouse কেবল জ্যামিতি জমা রাখে, HSV শেখা আর 'tracking'-এ ওঠা পরের ধাপ (space-key বা ৩ সেকেন্ড অটো)। আবার ডান থেকে বামে টানলে বাক্স উলটে যাবে বা কাজ করবে না ভাবাও ভুল — min/max জোড়া যেকোনো দিকের টান স্বাভাবিক করে নেয়।"},"animType":"roiBox"},{"n":12,"id":"part-12","fname":"follow_line.py","enTitle":"execute — The Steering Core","lang":"python","start":245,"end":289,"flags":[],"explain":[{"a":245,"b":245,"text":"<code>def execute(self, point_x, color_radius):<\/code> — স্টিয়ারিংয়ের হৃৎপিণ্ড। ডাক আসে Part 14-এর <b>ln 336<\/b> থেকে, আর প্রতিটি ডাক নিজের নতুন <code>threading.Thread<\/code>-এ জন্মায়: <code>args=(self.circle[0], self.circle[2])<\/code> — star import-এর <code>color_follow<\/code>-জাত <code>circle<\/code>-এর ঘর ০ আর ঘর ২, যাদের নতুন নাম <code>point_x<\/code> (line-বিন্দুর x) আর <code>color_radius<\/code>। ছবি Part 13-এর ln 294-এ (640, 480)-এ resize হয়, তাই x-এর জগৎ ০ থেকে ৬৩৯, আর সব হিসাবের মধ্যমণি কেন্দ্র 320 (640-এর অর্ধেক)। radius শূন্য মানে line ধরা পড়েনি।"},{"a":247,"b":252,"text":"প্রথম দুয়াল: <code>if self.Joy_active == True:<\/code> — joystick node দখলে নিলে (Part 4-এর <code>/JoyState<\/code> subscriber পতাকা ওঠালে) line-ধরা নিজেকে সরিয়ে নেয়। ভেতরের <code>if self.Start_state == True:<\/code> একবারি-চলা যন্ত্র: দখলের প্রথম ডাকেই <code>PID_init()<\/code> (Part 10) আবার চালু হয় — controller-এর জমা অবস্থা মুছে তাজা হয়, যাতে ছুটির আগের পুরনো ভুল-হিসাব ফেরার পর জ্বালাতে না পারে — তারপর <code>Start_state = False<\/code>, <code>return<\/code>। joystick না থাকলে <code>Start_state = True<\/code> আবার প্রাইম হয়ে পরের দখলের জন্য তৈরি।"},{"a":253,"b":258,"text":"line হারালে (<code>color_radius == 0<\/code>) এই if-শাখায় তিন কাজ পাশাপাশি: terminal-এ <code>Not Found<\/code> ছাপা; <code>/action_feedback<\/code> topic-এ (Part 4-এর ln 50-এর <code>largemodel_arm_done_pub<\/code>) <code>follow_line_clear_future_done<\/code> নামের String বার্তা — ওপরের অর্কেস্ট্রেটরকে 'line-মিশন শেষ' সংকেত; আর <code>self.pub_cmdVel.publish(Twist())<\/code> — একেবারে শূন্য-ভরা Twist, মানে চাকা স্থির। শেষ লাইনের <code>else:<\/code> (ln 258) দরজা খুলে দেয় বাকি গল্পের — line পাওয়া গেলে স্টিয়ারিং-হিসাব ওপারে। থামার সিদ্ধান্তটা এখানে ডিফল্ট — line নেই মানেই থামো; line খোঁজার কোনো ঘুরপাক, কোনো অপেক্ষা-লুপ নেই।"},{"a":259,"b":261,"text":"দুটি খালি খাম তৈরি — <code>twist = Twist()<\/code> (চাল-বার্তা) আর <code>b = UInt16()<\/code> (বিপার-বার্তা)। তারপরই এই Part-এর প্রাণ: <code>[z_Pid, _] = self.PID_controller.update([(point_x - 320)*1.0/16, 0])<\/code>। ভেতরের list হলো ভুল-মাপ: line-এর বিন্দু কেন্দ্র 320 থেকে কত পিক্সেল দূরে, সেটি ১৬ দিয়ে ভাগ — ১.০ গুণ পূর্ণসংখ্যা-ভাগ ঠেকায়। দ্বিতীয় ঘরের ০ পদ-রক্ষক: Part 10-এ ওই channel-এর গেইনই শূন্য। <code>update<\/code> দুই ফল ফেরায়, <code>_<\/code>-এ দ্বিতীয়টা ফেলে কেবল <code>z_Pid<\/code> রাখা হয় — এই একটিই angular-গতির বীজ।"},{"a":262,"b":267,"text":"ছয় লাইনের মধ্যে দুটি জীবিত, বাকিটা মৃত কমেন্ট-ভাণ্ডার। জীবিত: <code>img_flip<\/code> সত্য হলে <code>twist.angular.z = -z_Pid<\/code> — camera আয়না-বসানো থাকলে (Part 13-এর ln 296 ছবিও ফ্লিপ করে) ঘোরার চিহ্ন উলটে দিতে হয়; নাহলে <code>else: twist.angular.z = +z_Pid<\/code> — default <code>img_flip = False<\/code> (Part 6-এর ln 96) তাই বাস্তবে এই <b>ধনাত্মক<\/b> পথই চলে। মৃতদের পড়ে দেখো: ln 262-তে পুরনো কেন্দ্র 10-এর যুগ, ln 264-এ মসৃণকারী <code>*0.2<\/code>-জাতীয় পরীক্ষা, ln 267-এ PID ছাড়া সরাসরি <code>-(point_x-320)*1.0/128.0<\/code> — লেখকের পরীক্ষাগারের খুচরো, মুছতে না পেরে কমেন্ট করা।"},{"a":269,"b":275,"text":"<code>twist.linear.x = 0.1<\/code> — সামনের গতি <b>কাচামালে গেঁথে<\/b> 0.1 m/s; Part 10-এ দেখা 0.18 (parameter) বা 0.2 (Part 6-এর ln 93) এখানে পৌঁছায়ই না। এরপর সেফটি-দুয়াল: <code>if self.front_warning &gt; 10:<\/code> — Part 7-এর laser-cone গুনতি সামনের ০.৩৭৫ m-এর ভেতরে ১০টির বেশি beam-এ বাধা খুঁজে পেলে: <code>Obstacles ahead !!!<\/code> ছাপা হয়, শূন্য Twist প্রকাশ (থামো), <code>Buzzer_state = True<\/code> উঠে, <code>b.data = 1<\/code> হয়ে <code>/beep<\/code>-এ বিপ বাজে — চোখে line, কানে সতর্কধ্বনি।"},{"a":276,"b":280,"text":"পথ পরিষ্কার হলে বিপ-বন্ধের পালা, তবে শর্তসাপেক্ষে: <code>if self.Buzzer_state == True:<\/code> — বিপ কেবল তখনই ভোলে যায় যখন সে সত্যিই বাজছিল। বন্ধ-সংকেত <code>b.data = 0<\/code> একবার নয়, <code>for i in range(3)<\/code> — <b>তিনবার<\/b> পরপর <code>/beep<\/code>-এ যায়, তারপর পতাকা নামে। depth-1 topic-এ একটা বার্তা হারালে বিপ আটকে থাকতে পারত; তিন চাপে সেই ঝুঁকি প্রায় শূন্যে নামে। লক্ষ করো এই শাখায় চাকার Twist এখনো পাঠানো হয়নি — সে কাজ আরো পরে, ডেডব্যান্ড পেরিয়ে।"},{"a":282,"b":284,"text":"<code>if abs(point_x-320)&lt;40:<\/code> — <b>ডেডব্যান্ড<\/b>: line-এর বিন্দু কেন্দ্রের ৪০ পিক্সেলের ভেতরে থাকলে <code>twist.angular.z=0.0<\/code> — PID যা বলুক, ঘোরা বাতিল। কেন্দ্রের খুব কাছে ছোট-ছোট ভুল নিয়ে বাঁয়ে-ডানে কাঁপা বন্ধ করাই উদ্দেশ্য; ৪০-এর ভেতরের line মানেই 'যথেষ্ট সোজা'। ln 283-এর মৃত কমেন্ট (<code>abs(point_x-30)&gt;40<\/code>) পুরনো কেন্দ্র-দশকের জমানো যুগের নিদর্শন। মনে রাখো: শূন্য হয় শুধু <b>ঘোরা<\/b> — সামনে-চলা 0.1 m/s থেকেই যায়।"},{"a":285,"b":288,"text":"শেষ দুয়াল: <code>if self.Joy_active == False:<\/code> হলে <code>self.pub_cmdVel.publish(twist)<\/code> — এই লাইনেই সব হিসাব ধাতুতে নামে; PID-জাত <code>twist<\/code> এখন <code>/cmd_vel<\/code>-এর বার্তা। <code>else<\/code>-শাখাটি কৌতূহল-জাগানো: <code>twist.angular.z=0.0<\/code> লিখেই থেমে যায় — <b>কোনো publish নেই<\/b>। সাধারণত এখানে পৌঁছানোর পথই নেই, কারণ শুরুর <code>return<\/code> (ln 251) joystick-দখল আগেই ফেরত পাঠায়; পৌঁছালে তা মাঝপথে পতাকা-বদলের দৌড়-প্রতিযোগিতায় — thread-এর জগতের বিরল সেই জানালায় চাকাকে কিছুই বলা হয় না, আগের আদেশই শেষ কথা থেকে যায়।"}],"math":{"intro":"execute-এর পুরো গণিত একটি লুপে বাঁধা: পিক্সেল-দূরত্ব ভুলে পরিণত হয়, ভুল PID-গুণক দিয়ে হয়ে ওঠে angular গতি (rad/s)। ডেডব্যান্ড আর চিহ্ন-নিয়ম তার ওপর দুটি সংশোধনী, শেষে একটি বাস্তব উদাহরণ — steerCore animation-এ এই চক্রই ঘোরে।","levels":[{"label":"Level 1 — ভুলের সংজ্ঞা","latex":"\\[ e = \\frac{(\\mathit{point\\_x} - 320) \\times 1.0}{16} \\]","text":"320 = 640/2, ছবির কেন্দ্র। ১৬ দিয়ে ভাগ মানে ১৬ পিক্সেল দূরত্ব = ১ একক ভুল — pixel-জগৎ থেকে PID-জগতে স্কেল-বদল। <code>point_x = 336<\/code> হলে e = 1, <code>point_x = 480<\/code> হলে e = +10; বাম দিকে সরলে ঋণাত্মক।"},{"label":"Level 2 — PID নিয়ম","latex":"\\[ z_{Pid} = K_p\\, e + K_i \\!\\int e\\, dt + K_d\\, \\frac{de}{dt}, \\qquad (K_p, K_i, K_d) = (0.05,\\; 0,\\; 0.01) \\]","text":"গেইন এসেছে Part 10-এর scale-ভাগ থেকে। Ki = 0, তাই জমা-পদ নেই — এটি আসলে PD নিয়ন্ত্রক। D-পদ ভুলের পরিবর্তনের ওপর বসে, তাই line হঠাৎ লাফালে সে বেশি জোরে ধরে; শান্ত line-এ P-পদ-ই মূল চালিকা।"},{"label":"Level 3 — চিহ্ন ও ডেডব্যান্ড","latex":"\\[ z = \\begin{cases} 0, & |\\mathit{point\\_x} - 320| \\lt 40 \\\\ +z_{Pid}, & \\text{বাইরে, } \\mathit{img\\_flip} = \\text{False} \\\\ -z_{Pid}, & \\text{বাইরে, } \\mathit{img\\_flip} = \\text{True} \\end{cases} \\]","text":"ROS চুক্তিতে ধনাত্মক angular.z মানে বামে-ঘোরা। line ডানে সরলে (point_x &gt; 320) e ধনাত্মক, z ধনাত্মক — robot বামে ঘুরে কেন্দ্রে ফেরে; img_flip ছবি উলটলে চিহ্নও উলটে দেয়। ৪০ px-এর ভেতরে সব শূন্য।"},{"label":"Level 4 — বাস্তব উদাহরণ","latex":"\\[ \\mathit{point\\_x} = 480: \\; e = \\frac{160}{16} = 10, \\; P = 0.05 \\times 10 = 0.5\\ \\mathrm{rad/s}, \\; |480 - 320| = 160 \\geq 40 \\]","text":"line কেন্দ্র থেকে ১৬০ পিক্সেল ডানে — ভুল +10, P-পদ একাই 0.5 rad/s (Ki নেই, D শান্ত line-এ চুপ)। ডেডব্যান্ডের বাইরে, তাই robot 0.1 m/s সামনে-গতিতে বামে কাত হয় — সেকেন্ডে প্রায় ২৯° ঘোরা (0.5 rad)।"},{"label":"Level 5 — ডেডব্যান্ডের কিনারায়","latex":"\\[ \\mathit{point\\_x} = 350: \\; e = \\frac{30}{16} \\approx 1.88, \\; P \\approx 0.094\\ \\mathrm{rad/s} \\; \\text{but final } z = 0 \\; (|350-320| = 30 \\lt 40) \\]","text":"ভেতরের শক্ত হিসাব P-পদে প্রায় 0.094 rad/s চাইত, কিন্তু ৩০ পিক্সেল দূরত্ব ডেডব্যান্ডের ভেতরে — চাপা পড়ে শূন্য। ছোট সংশোধনী নয়-ই, বরং কাঁপা এড়ানোই এখানে জয়; বাইরের ৪১তম পিক্সেল থেকে আবার PID জেগে ওঠে।"}]},"robot":{"correct":"line কেন্দ্রে থাকলে robot 0.1 m/s-এ সোজা চলে; line ডানে সরলে মসৃণভাবে বামে কাত হয় — 480-এর মতো দূরে হলে P-পদ একাই 0.5 rad/s পর্যন্ত ঘোরানো। সামনে ০.৩৭৫ m-এর ভেতর ১০টির বেশি laser beam বাধা পেলে robot থেমে যায় আর বিপ বাজে, পথ খুললে বিপ-বন্ধ তিনবার যায়; line হারালে Not Found ছাপা হয় আর /action_feedback-এ follow_line_clear_future_done বার্তা ছোটে।","incorrect":"ডেডব্যান্ডকে 'robot থামার জোন' ভাবা — ভুল; ±40 px-এর ভেতরে শুধু ঘোরা শূন্য, সামনে-চলা 0.1 m/s অটুট। আরেকটি ভ্রম: line ডানে গেলে robot ডানে ঘুরবে — আসলে ধনাত্মক z_Pid বাম-ঘোরায় কেন্দ্রে টানে; সাইনটা উলটে ভাবলে robot line থেকে আরো দূরে ছুটে পালাবে।"},"animType":"steerCore"},{"n":13,"id":"part-13","fname":"follow_line.py","enTitle":"process I — Keys, ROI & line_follow","lang":"python","start":291,"end":333,"flags":[],"explain":[{"a":291,"b":294,"text":"<b>প্রতি সিঙ্ক-করা frame-এর হৃৎস্পন্দন<\/b> — Part 8-এর <code>callback<\/code> ln 171 থেকে ডাক আসে দুটো জিনিস নিয়ে: camera-র RGB frame আর <code>cv2.waitKey(1)<\/code>-এর key-কোড (<code>action<\/code>)। <code>binary = []<\/code> দিয়ে খালি list তৈরি — এখনো কোনো mask নেই, ফাংশনের শেষে callback এটাকে ফেরত পাবে; Part 8-এর শর্ত <code>len(bin_img) != 0<\/code> (ln 173) সত্য হলেই <code>ManyImgs<\/code> দুই-ছবির সারি দেখায়। এরপর <code>cv.resize(rgb_img, (640, 480))<\/code> — frame-কে জোর করে 640x480 করা হয়; এই রেজোলিউশনই এই পুরো file-এর মাপকাঠি, কারণ পরের Part-গুলোর সব ধ্রুবক (কলাম-কেন্দ্র 320, arm-এর সারি 400) এই ক্যানভাসের অংক ধরে বসানো।"},{"a":295,"b":296,"text":"<code>img_flip<\/code> হলো camera লাগানোর দিক সামলানোর সুইচ — Part 6-এর ln 96-এ এর মান <code>False<\/code> বসেছে, তাই সাধারণভাবে এই লাইনটি কাজই করে না। camera উলটো করে লাগালে (ছবির বাঁ-ডান লেগে যায়) মান <code>True<\/code> করলে <code>cv.flip(rgb_img, 1)<\/code> frame-কে উল্লম্ব অক্ষ ঘিরে আয়না-বিন্দুতে ফেরায় — flip-এর দ্বিতীয় আর্গুমেন্ট 1 মানেই সেই অনুভূমিক উলটানো। মনে রেখো: এই একই পতাকা Part 12-এর <code>execute<\/code>-এ steering-এর চিহ্নও উলটে দেয় (ln 263) — এক সুইচ, দুই জায়গায় প্রভাব, ছবি আর চাল একসাথে সোজা থাকে।"},{"a":297,"b":297,"text":"Key-প্রাচীরের প্রথম দরজা: <code>action == 32<\/code> — 32 হলো space bar-এর ASCII কোড, আর এই এক সংখ্যাই ম্যানুয়াল স্টার্টের হুকুম। চাপ পড়লেই <code>self.Track_state = 'tracking'<\/code> — state machine-এর ইঞ্জিন চালু। Part 16-এর banner-এর keyboard-তালিকার SPACE-লাইনের কথা এখানেই সত্য হয়। তবে মনে রেখো auto-start পথটাও জীবিত: Part 8-এর <code>callback<\/code> (ln 167-170) node শুরুর ৩ সেকেন্ড পর নিজেই একবার <code>'tracking'<\/code> বসিয়ে দেয় — অর্থাৎ space চাপা ঐচ্ছিক, ৩ সেকেন্ড অপেক্ষাও একই ফল দেয়; দুই দরজাই এক ঘরে নামে।"},{"a":299,"b":301,"text":"বাকি তিন দরজার চাবি-জোড়া: <code>ord('i') or action == 105<\/code> — মজার ব্যাপার, <code>ord('i')<\/code>-এর মানই 105, তাই শর্তটি একই সংখ্যাকে দুই বানানে লিখে রেখেছে; ফল এক: state <code>'identify'<\/code>। <code>action == ord('r') or action == 114<\/code> ডাকে <code>self.Reset()<\/code> — Part 15-এর সব-মুছে-ফেলার ফাংশন। আর <code>action == ord('q') or action == 113<\/code> ডাকে <code>self.cancel()<\/code> — এই নামটি এই file-এর কোথাও define করা নেই; এটি ln 11-এর star import থেকে আসা, তাই এর ভেতরের কাজ এই folder-এর বাইরের গল্প। চারটি চাবিই Part 16-এর terminal banner-এ আগেই ঘোষণা করা আছে — ঘোষণা আর বাস্তবায়নের খাতা মিলে যায়।"},{"a":302,"b":304,"text":"State machine-এর প্রথম ঘর <code>'init'<\/code>: রং শেখানোর স্টেজ। <code>cv.namedWindow<\/code> দিয়ে <code>self.windows_name<\/code> (Part 6-এ ln 85-এ বসানো 'frame') নামের ছবি-জানালা খোলা হয় <code>WINDOW_AUTOSIZE<\/code> মোডে — মাপ টেনে বদলানো যাবে না। এরপরই আসল কাজ: <code>cv.setMouseCallback(self.windows_name, self.onMouse, 0)<\/code> — সেই জানালার মাউস-ঘটনা এখন থেকে Part 11-এর <code>onMouse<\/code>-এ পৌঁছাবে। লক্ষ করো, এই নিবন্ধন <code>'init'<\/code> state-এ ঢুকলেই প্রতি frame-এ বারবার হয় — একবার নিবন্ধিত callback আবার নিবন্ধিত হয়; ক্ষতি নেই, শুধু অতিরিক্ত ডাক।"},{"a":305,"b":307,"text":"<code>select_flags<\/code> মানে মাউস-বোতাম চেপে টেনে-মারা চলছে (Part 11-এর ln 235-এ চাপলে True, ln 238-এ ছাড়লে False)। টানা অবস্থায় প্রতি frame-এ দুই আঁকিজোকা: <code>cv.line<\/code> বোতাম-চাপা বিন্দু আর বর্তমান cursor-এর সংযোগরেখা আঁকে নীল <code>(255, 0, 0)<\/code> রঙে, আর <code>cv.rectangle<\/code> Part 11-এ হিসাব করা <code>self.cols<\/code>/<code>self.rows<\/code> কোণা ধরে সবুজ <code>(0, 255, 0)<\/code> বাক্স টানে — দুটোই ২ পিক্সেল মোটা। এগুলো চোখের সান্ত্বনা মাত্র: screen-এ ROI-র আকার দেখায়, HSV হিসাবে কিছু যোগ করে না।"},{"a":308,"b":310,"text":"ROI তখনই বিশ্বাসযোগ্য যখন দুই কোণা আলাদা — <code>self.Roi_init[0]!=self.Roi_init[2] and self.Roi_init[1]!=self.Roi_init[3]<\/code> শর্তটি শূন্য-আকার বাক্স (শুধু ক্লিক, টান নেই) বাদ দেয়। শর্ত সত্য হলে <code>self.color.Roi_hsv(rgb_img, self.Roi_init)<\/code> — <code>color_follow<\/code> object-এর (Part 6, ln 89) এই method টানা বাক্সের ভেতরের রঙ পরীক্ষা করে HSV-র নিম্ন-ঊর্ধ্ব সীমা বের করে, আর চিহ্নিত frame সঙ্গে ফেরত দেয়। ফল দুই জায়গায় জমে: <code>self.hsv_range<\/code> (পরের line-খোঁজার জ্বালানি) আর <code>self.dyn_update = True<\/code> পতাকা — নিচে দেখব এই পতাকাই file-এ সংরক্ষণ আর parameter-হালনাগাদের ট্রিগার।"},{"a":313,"b":314,"text":"<code>else:<\/code> মানে এই frame-এ কোনো টানা-মারা চলছে না (<code>select_flags<\/code> মিথ্যা) — তখন <code>self.Track_state = 'init'<\/code> আবার বসানো হয়। কিন্তু বাইরের <code>if self.Track_state == 'init'<\/code> (ln 302) থেকেই এখানে ঢুকেছি, তাই এটি নিজেকে-নিজে বসানো: মান আগেও 'init', পরেও 'init' — কার্যত শূন্য-কাজ। আসল লাফটা ঘটে পাশের Part 11-এ: বোতাম ছাড়ার মুহূর্তে (event 4) <code>onMouse<\/code> নিজেই state বদলে <code>'mouse'<\/code> করে দেয় (ln 239), ফলে পরের frame থেকে এই 'init'-ঘর আর পড়াই হয় না। রং-শেখা পেরোল, state machine নিজে এগিয়ে গেল।"},{"a":315,"b":318,"text":"<code>'identify'<\/code> ঘরের একমাত্র কাজ সংরক্ষিত রং-শিক্ষা ফিরিয়ে আনা: file থাকলে <code>read_HSV(self.hsv_text)<\/code> পড়ে <code>self.hsv_range<\/code> ভরে দেয়। <code>read_HSV<\/code> star import থেকে আসা; আর <code>hsv_text<\/code> হলো Part 6-এর ln 88-এর পথ — <code>LineFollowHSV.text<\/code>, লক্ষ করো extension-টি <code>.txt<\/code> নয়, <code>.text<\/code>। File না থাকলে <code>else: self.Track_state = 'init'<\/code> — রং-শিক্ষা ছাড়া এগোনোর উপায় নেই, আবার ROI টানতে হবে। সূক্ষ্ম তথ্য: node-এর জন্ম-state-ই (ln 84) ছিল 'identify', তাই আগের run-এর সংরক্ষিত HSV নিয়েই বুট হয়।"},{"a":319,"b":320,"text":"দুই-শর্তের মেইন-গেট: state <code>'init'<\/code> নয়, আর <code>hsv_range<\/code> খালি নয় — দুটোই সত্য হলেই আসল কাজ: <code>self.color.line_follow(rgb_img, self.hsv_range)<\/code>। <code>color_follow<\/code>-র এই method frame-এ HSV সীমা মিলিয়ে line খোঁজে আর তিনটো জিনিস ফেরত দেয়: চিহ্নিত <code>rgb_img<\/code>, সাদা-কালো <code>binary<\/code> mask, আর <code>self.circle<\/code> — পাওয়া line-কেন্দ্রের তথ্য। এই <code>circle<\/code>-ই পরের Part-এর নায়ক: <code>circle[0]<\/code> হবে execute-এর <code>point_x<\/code>, <code>circle[2]<\/code> হবে <code>color_radius<\/code> (Part 14, ln 336)। binary এখন আর খালি নেই — ফলে Part 8-এর শেষ লাইন দুই-ছবির সারি দেখাবে।"},{"a":321,"b":322,"text":"<code>dyn_update<\/code> সত্য মানে এই frame-এ নতুন HSV শেখা হয়েছে (ROI টানা সদ্য-শেষ)। প্রথম দায়: <code>write_HSV(self.hsv_text, self.hsv_range)<\/code> — শেখা রং সেই <code>.text<\/code> file-এ লেখা, যাতে পরের বুটে 'identify' ঘর সঙ্গে সঙ্গে এটি তুলে নিতে পারে। Robot বন্ধ হলেও শিক্ষা হারায় না — এই এক লাইনেই স্মৃতি। <code>write_HSV<\/code>-ও star import-এর সদস্য; এই file শুধু ডাক দেয়, ভেতরের বিন্যাস তার জানার বাইরে। এরপরের ছয় লাইন ROS 2-পক্ষের হিসাব — আসছে নিচেই।"},{"a":323,"b":328,"text":"ছয়টি <code>rclpy.parameter.Parameter<\/code> object বানানো হয় — Hmin, Smin, Vmin, Hmax, Smax, Vmax — প্রতিটিতে তিনটি জিনিস: নাম, ধরন (<code>Parameter.Type.INTEGER<\/code>), আর মান <code>self.hsv_range<\/code> থেকে: নিম্ন-ত্রয়ী <code>self.hsv_range[0][0]<\/code> থেকে <code>[0][2]<\/code>, ঊর্ধ্ব-ত্রয়ী <code>self.hsv_range[1][0]<\/code> থেকে <code>[1][2]<\/code>। Part 10-এর <code>declare_param<\/code> এই নামগুলোই আগে ঘোষণা করেছিল (ডিফল্ট H 0-9, S 85-253, V 126-253 — লাল line-এর পোশাক); এখন ROI-শেখা মান সেই আসনে বসবে। ফলে <code>ros2 param<\/code>-এর বাইরের দুনিয়া ROS 2-ভাষায় পড়তে পারবে robot এখন কোন রং খুঁজছে।"},{"a":329,"b":333,"text":"ছয়টি Parameter এক list-এ <code>all_new_parameters<\/code> গাঁথা হয়, তারপর <code>self.set_parameters(all_new_parameters)<\/code> — এক ডাকে ছয়টিই node-এর parameter-সংগ্রহে বসে যায়। Node-এর নিজের চোখে এটি শুধু বই-রাখার খাতা: <code>line_follow<\/code> পড়ে সরাসরি <code>self.hsv_range<\/code>, parameter নয় — খাতাটি বাইরের পর্যবেক্ষকের জন্য। শেষে <code>self.dyn_update = False<\/code> — ট্রিগার নিভে যায়, যাতে পরের frame-গুলোতে (HSV বদলায়নি) বারবার file-লেখা আর parameter-হালনাগাদ না ঘটে। এক শেখা, এক সংরক্ষণ — এই হিসাবেই দামি কাজ একবারই হয়।"}],"math":null,"robot":{"correct":"প্রতিটি synced camera-frame-এ এই function চলে: বুটের ৩ সেকেন্ড পর auto-start অথবা space চেপে <code>'tracking'<\/code>-এ ঢুকলে <code>line_follow<\/code> লাল line ধরে <code>circle<\/code> ভরে, আর 'frame' জানালায় চিহ্নিত ছবি আর binary mask দুই-সারি দেখা যায়। প্রথমবার ROI টেনে ছাড়লে নতুন HSV <code>LineFollowHSV.text<\/code> file-এ সংরক্ষিত হয়, আর <code>ros2 param get<\/code> দিয়ে Hmin থেকে Vmax ছয়টি মানই ROI-র রং ধরে ফেরত আসে।","incorrect":"ভ্রম হলো ভাবা <code>ros2 param set /follow_line Hmin 5<\/code> চাইলে চলতে-চলতে রং-শিক্ষা বদলে যাবে — এই দিকে যাওয়ার কোনো তার নেই: <code>line_follow<\/code> পড়ে সরাসরি <code>self.hsv_range<\/code>, parameter-কে চোখেও দেখে না; <code>set_parameters<\/code> শুধু বাইরের দুনিয়ার খাতা লেখে, বিপরীত দিকের রাস্তা এই file-এ নেই। আর <code>.text<\/code> file-টি মুছে দিলে পরের বুট 'identify' ঘরে file-খুঁজে-না-পেয়ে 'init'-এ পড়ে আবার ROI টানতে বসবে।"},"animType":"stateMachine"},{"n":14,"id":"part-14","fname":"follow_line.py","enTitle":"process II — Tracking Thread & Tag Handoff","lang":"python","start":334,"end":380,"flags":[],"explain":[{"a":334,"b":336,"text":"<code>'tracking'<\/code> state-এ line পাওয়া গেলেই (<code>len(self.circle) != 0<\/code>) নতুন এক <code>threading.Thread<\/code> জন্মায়: <code>target=self.execute, args=(self.circle[0], self.circle[2])<\/code> — মানে Part 12-এর steering core-কে আলাদা সুতোয় ছেড়ে দেওয়া, হাতে দুটো মাল: <code>circle[0]<\/code> line-কেন্দ্রের তথ্য (execute-এর <code>point_x<\/code>), <code>circle[2]<\/code> (execute-এর <code>color_radius<\/code>)। <code>.start()<\/code> সুতো ছেড়ে দেয়, process অপেক্ষা করে না — ফলে প্রতিটি frame যেখানে line আছে, সেখানেই একটি করে নতুন thread; vision-লুপ আর নিয়ন্ত্রণ-লুপ আলাদা ছন্দে চলে।"},{"a":337,"b":340,"text":"tracking-ঘরে ঢুকেও line না পেলে (<code>len(self.circle) != 0<\/code> মিথ্যা) else-এ এই ঘর: <code>Start_state<\/code> সত্য থাকলে তাকে <code>False<\/code> করা হয় — কার্যত একবার-ব্যবহারের পতাকা নামানো। কমেন্ট-হয়ে-যাওয়া লাইনটি দেখায় লেখক এখানে একসময় থামার আদেশ (<code>publish(Twist())<\/code>) রেখেছিলেন, পরে নিষ্ক্রিয় করেছেন। পতাকাটির আসল ভোক্তা Part 12: <code>execute<\/code>-এর ভেতরে (ln 248-250) <code>Joy_active<\/code> চালু থাকলে আর <code>Start_state<\/code> সত্য থাকলে একবার <code>PID_init()<\/code> চালিয়ে পতাকা নামানো হয় — joystick ফিরে এলে PID-স্মৃতি শূন্য থেকে শুরু পায়।"},{"a":341,"b":345,"text":"এই file-এর নাটকীয় মোড়: camera-frame-এ কোনো AprilTag ধরা পড়লে (<code>len(self.tags)<\/code> শূন্যের বেশি, list-টি Part 8-এর ln 157-158 থেকে ভর্তি) আর state এখনো <code>\"Remove\"<\/code> না হলে তিন ধাপের অভ্যুত্থান: <code>publish(Twist())<\/code> দিয়ে চাকা তৎক্ষণাৎ থামে, terminal-এ <code>Find the apriltag.<\/code> ছাপা হয়, আর state বদলে <code>\"Remove\"<\/code>। লক্ষ করো ln 342 আগে <code>'identify'<\/code> বসায়, পরেই ln 345 তাকে মুছে <code>\"Remove\"<\/code> লেখে — মাঝের মানটি একই ডাকের ভেতরেই মরে যায়, পরের কোনো পরীক্ষাই তা দেখবে না; বেঁচে থাকে শুধু <code>\"Remove\"<\/code>।"},{"a":346,"b":349,"text":"<code>\"Remove\"<\/code> ঘরে ঢুকে প্রথম কাজ terminal-এ গণনা-ছাপা <code>print(\"len(tags) = \",len(self.tags))<\/code> — কয়টি tag ধরা পড়ছে তার লাইভ সংখ্যা, প্রতি frame-এ। <code>len(self.tags)<\/code> শূন্যের বেশি হলে প্রথম tag-টিই বাছা হয়: <code>center_x, center_y = self.tags[0].center<\/code> — Part 8-এর ln 158-এ <code>tag_id<\/code> ধরে sort করা list-এর শীর্ষে যেটি বসে, তার কেন্দ্রের pixel-স্থান দুই চলকে খোলা। এই দুই সংখ্যাই এরপরের সব অংকের বিষয়: 320 আর 400 — এই দুই লক্ষ্য-বিন্দুর সাথে তুলনা হবে, মিললে arm-হস্তান্তর, না মিললে সামঞ্জস্য-চাল।"},{"a":350,"b":352,"text":"সামঞ্জস্য-শর্ত: <code>abs(center_x-320)<\/code> বা <code>abs(center_y-400)<\/code> যেকোনো একটিই ১০ pixel ছাড়ালে এবং <code>move_flag<\/code> সত্য থাকলে terminal-এ <code>adjusting.<\/code> ছাপা হয় আর <code>self.remove_obstacle(center_x, center_y)<\/code> ডাক পড়ে — Part 15-এর সেই ফাংশন, যেটি PID-চালিত ধীর চালে tag-কে কেন্দ্রে আনে। <code>move_flag<\/code> পতাকাটি গুরুত্বপূর্ণ: হস্তান্তরের মুহূর্তে এটি False হয়ে যাবে (ln 359), ফলে arm-এর কাজ চলাকালীন এই ঘর আর চাল ছাড়ে না — সামঞ্জস্য-চাল একমুখী রাস্তা।"},{"a":353,"b":356,"text":"উভয় অক্ষেই দূরত্ব ১০ pixel-এর নিচে নামলে প্রস্তুতি-নেওয়ার পালা: <code>self.pubVel(0.0, 0.0)<\/code> দিয়ে চাকা পুরো থামানো (Part 15-এর wrapper, দুই শূন্য রফতানি), terminal-এ <code>start crawling.<\/code> — শব্দটি ধীরে-এগোনোর ইঙ্গিত হলেও আসল কাজ বিরতি: <code>time.sleep(3)<\/code>। পুরো vision-লুপ ৩ সেকেন্ড জমে থাকে — এই ডাক callback-সুতোতেই চলছে, তাই camera-প্রক্রিয়াও স্থবির; এদিকে <code>time<\/code> module-টি নিজে star import থেকে আসা — এই file-এ <code>import time<\/code> লেখাই নেই।"},{"a":357,"b":358,"text":"৩ সেকেন্ডের ঠিক পরেই দূরত্ব-মাপ: <code>c_dist = self.depth_image_info[int(center_y),int(center_x)]/1000<\/code>। Part 8-এ (ln 154-155) depth-camera-র frame এই 640x480 <code>float32<\/code> বিন্যাসে <code>self.depth_image_info<\/code>-তে জমা ছিল; এখন tag-কেন্দ্রের ঠিক সেই pixel-টির মান তোলা হয় — সূচক-ক্রমে আগে row (<code>center_y<\/code>), পরে column (<code>center_x<\/code>)। ভাগ ১০০০ মানে মিলিমিটার থেকে মিটার। পরের শর্ত দুটো যাচাই: <code>c_dist!=0<\/code> (depth-sensor যেখানে মান পায়নি সেখানে ০ বসায় — শূন্য মানে অমাপ) এবং <code>pubPos_flag<\/code> (হস্তান্তর এখনো হয়নি)।"},{"a":359,"b":365,"text":"দুই পতাকা নামানো হয় — <code>move_flag = False<\/code> (robot আর সামঞ্জস্য-চাল চালাবে না), <code>pubPos_flag = False<\/code> (হস্তান্তর একবারই হবে)। এদের ফের ওঠা Part 8-এর <code>get_graspStatusCallBack<\/code>-এর হাতে: arm কাজ শেষ করে <code>grasp_done<\/code> topic-এ True পাঠালে দুটোই আবার True। তারপর খাম তৈরি: <code>pos = AprilTagInfo()<\/code>, ভর্তি চার ঘরে — <code>id<\/code> tag-এর <code>tag_id<\/code>, <code>x<\/code> আর <code>y<\/code> pixel-কেন্দ্র, <code>z<\/code> মিটারে দূরত্ব <code>c_dist<\/code>। এই message-type Part 3-এ import হয়েছিল; পাঠক ভাবী কেউ arm-পরিকল্পনার node, যে pixel-স্থান আর মিটার-দূরত্ব একসাথে পায়।"},{"a":366,"b":370,"text":"Arm-এর wrist (joint5) কোন কোণে ঘুরবে তার হিসাব tag-এর ঘূর্ণন থেকে: <code>vx = int(self.tags[0].corners[0][0]) - int(self.tags[0].corners[1][0])<\/code>, <code>vy = int(self.tags[0].corners[0][1]) - int(self.tags[0].corners[1][1])<\/code> — detector-দেওয়া চার কোণার প্রথম দুটির পার্থক্য, মানে tag-এর এক ধারের ভেক্টর pixel-এ; tag কাত হলে এই ভেক্টরও কাত হয়। তারপর <code>target_joint5 = compute_joint5(vx,vy)<\/code> — Part 3-এ import হওয়া function, ভেতরের হিসাব এই file-এর দৃশ্যপটের বাইরে; আমরা জানি শুধু ইনপুট-আউটপুট: ধার-ভেক্টর ঢুকল, কোণ বেরোলো। <code>self.joint5.data = int(target_joint5)<\/code> সেই কোণ Int16 খামে ভরে — ভগ্নাংশ ছেঁটে পূর্ণসংখ্যা।"},{"a":371,"b":376,"text":"চারটি ছাপা লাইন ডিবাগের সোনার খনি: <code>target_joint5<\/code>-এর মান, <code>tag_id<\/code>, <code>center_x, center_y<\/code> জোড়া, আর মিটারে <code>depth<\/code>। তারপর প্রকাশনার পালা: <code>self.pos_info_pub.publish(pos)<\/code> — PosInfo topic-এ খামটি ঠিক একবার যায়। কিন্তু তারপরই বিখ্যাত জোড়া-লাইন: <code>self.TargetJoint5_pub.publish(self.joint5)<\/code> পরপর দুইবার (ln 375, 376) — একই খাম, একই মান, কোনো বদল ছাড়াই দ্বিতীয়বার ছাড়া। দ্বিতীয়টি নিরর্থক পুনরাবৃত্তি, ক্ষতিও করে না; এই series-এর নিয়ম এটিকে সেভাবেই শেখানো — ব্যাখ্যা নয়, সংশোধনও নয়। Subscribers দুইবারই একই আদেশ পায়।"},{"a":377,"b":380,"text":"<code>else:<\/code> ঘরটি তখন যখন <code>c_dist!=0<\/code>-যাচাই ফলশূন্য (depth-pixel অমাপ) বা <code>pubPos_flag<\/code> নেই — terminal-এ শুধু <code>Invalid distance.<\/code> ছাপা হয়; হস্তান্তর নেই, আলাদা কোনো retry-নির্দেশও নেই — পরের frame এই একই পথ আরেকবার হেঁটে আবার পরীক্ষা করবে। সবশেষে <code>return rgb_img, binary<\/code> — Part 8-এর callback-এর কাছে (ln 171) চিহ্নিত frame আর mask ফেরত; সেখানে RGB-থেকে-BGR রূপান্তর (ln 172) হয়ে <code>ManyImgs<\/code> দুই-সারি প্রদর্শনীতে যাবে। মনে রেখো: 'Remove' state থাকতে থাকতেও প্রতি frame এই function পুরো চলে — থামা মানে শর্ত-ঘরে না-ঢোকা, ফাংশন-বন্ধ নয়।"}],"math":{"intro":"Remove-পথের গণিত তিন ধাপের শিকল: প্রথমে depth-জগতে মিলিমিটার থেকে মিটারে দূরত্ব, তারপর তার বৈধতার যাচাই, সবশেষে tag-এর ধার-ভেক্টর থেকে joint5-এর কোণ। প্রতিটি ধাপের সংখ্যা এই file-এর নিজের লাইন থেকে উঠে আসে — কোনো বাইরের অনুমান নয়।","levels":[{"label":"Level 1 — দূরত্ব: pixel থেকে মিটার","latex":"\\[ c = \\frac{D\\big[\\mathrm{int}(c_y),\\; \\mathrm{int}(c_x)\\big]}{1000} \\;\\;[\\mathrm{m}] \\]","text":"depth-camera প্রতি pixel-এ মিলিমিটার-মান জমা রাখে; ১০০০ দিয়ে ভাগ করেই মিটার। সূচক-ক্রম মনে রেখো: আগে row মানে y (<code>center_y<\/code>), পরে column মানে x — numpy বিন্যাসের চিরাচরিত নিয়মেই এই লাইন লেখা।"},{"label":"Level 2 — বৈধতার শর্ত","latex":"\\[ c \\ne 0 \\;\\wedge\\; \\mathrm{pubPos\\_flag} \\;\\Rightarrow\\; \\mathrm{handoff} \\]","text":"শূন্য মানে sensor-এর 'মাপা-হয়নি' — তাই শূন্য দূরত্বকে দূরত্ব মানা হয় না; সাথে pubPos_flag নিশ্চিত করে হস্তান্তর একবারই। শূন্য হলে <code>Invalid distance.<\/code> ছাপা ছাড়া আর কিছু হয় না, robot অপেক্ষায় থাকে।"},{"label":"Level 3 — ধার-ভেক্টর","latex":"\\[ \\vec{e} = p_0 - p_1 = \\big(\\mathrm{int}(x_0)-\\mathrm{int}(x_1),\\; \\mathrm{int}(y_0)-\\mathrm{int}(y_1)\\big) = (v_x,\\, v_y) \\]","text":"চার কোণার প্রথম দুটির বিয়োগফল — tag-এর এক ধার pixel-এ; এর দিকই tag-এর ছবির-ভেতরের ঘূর্ণন। এখানে কোনো pose-অনুমান নেই: Part 8-এর detector-ডাকের দ্বিতীয় argument False (API-ঘরের নাম <code>estimate_tag_pose<\/code>, ln 157) — 3D পোজ নয়, শুধু 2D কোণা।"},{"label":"Level 4 — কোণ-হস্তান্তর","latex":"\\[ \\theta_5 = \\mathrm{int}\\big(\\mathrm{compute\\_joint5}(v_x,\\, v_y)\\big) \\]","text":"import করা compute_joint5 ধার-ভেক্টরকে joint5-এর লক্ষ্য-কোণে বদলায় — এই file শুধু ফল নেয়, ভেতরের সূত্র দেখে না; <code>int()<\/code> ভগ্নাংশ ছেঁটে দেয়, তারপর সেই কোণ Int16 হয়ে <code>set_joint5<\/code> topic-এ দুইবার যায়।"}],"numeric":[{"latex":"\\[ D[c_y, c_x] = 355\\;\\mathrm{mm} \\;\\Rightarrow\\; c = 0.355\\;\\mathrm{m} \\]","text":"tag-কেন্দ্রের depth-pixel-এ 355 জমা থাকলে <code>pos.z<\/code> হয় 0.355 মিটার — arm-পরিকল্পক জানে ট্যাগ প্রায় ৩৫.৫ সেন্টিমিটার দূরে।"},{"latex":"\\[ D[c_y, c_x] = 0 \\;\\Rightarrow\\; c = 0 \\;\\Rightarrow\\; \\text{Invalid distance.} \\]","text":"শূন্য-pixel সাধারণত মানে sensor-এর পরিসর ছাড়ানো বা প্রতিফলন-হারানো — হস্তান্তর হয় না, robot থেমে থাকে আর পরের frame-এর আশায় বসে।"},{"latex":"\\[ p_0 = (342, 296),\\; p_1 = (318, 304) \\;\\Rightarrow\\; (v_x, v_y) = (24, -8),\\;\\; \\|\\vec{e}\\| = \\sqrt{24^2 + (-8)^2} \\approx 25.3\\;\\mathrm{px} \\]","text":"এই উদাহরণ-কোণায় ধার-ভেক্টর প্রায় আনুভূমিক হেলা — tag খাড়া বসে আছে; ভেক্টর যত কাত হবে, compute_joint5-এর ইনপুট তত ঘুরবে, আর wrist-লক্ষ্যও সেই অনুযায়ী।"}],"mapping":[{"code":"c_dist = self.depth_image_info[int(center_y),int(center_x)]/1000","math":"\\[ c = \\frac{D[y,\\,x]}{1000} \\]","text":"mm-জমা depth-বিন্যাসে row-আগে সূচক, তারপর ১০০০-ভাগ — এক লাইনে দুই কাজ: স্থান নির্বাচন আর একক-বদল।"},{"code":"vx = int(self.tags[0].corners[0][0]) - int(self.tags[0].corners[1][0])","math":"\\[ v_x = x_0 - x_1 \\]","text":"কোণা-জোড়ার বিয়োগই ধার-ভেক্টরের x-অংশ; y-অংশ একই ছাঁচে পরের লাইনে — এরাই compute_joint5-এর খাবার।"}],"failure":["সূচক উলটে <code>depth_image_info[int(center_x), int(center_y)]<\/code> লিখলে 640x480 বিন্যাসে row-সীমা 479 — center_x যদি 480-এর ওপরে হয় IndexError গিলে ফেলত callback-সুতোকে, নাহলে ভুল pixel-এর দূরত্ব নিয়ে arm ভুল পরিকল্পনা বানাত।","<code>c_dist!=0<\/code> যাচাই বাদ দিলে অমাপ pixel-এর শূন্য সরাসরি <code>pos.z = c_dist<\/code>-এ বসত — পাঠক node ভাবত ট্যাগ ঠিক গলার কাছে, arm শূন্য-দূরত্বের অসম্ভব পরিকল্পনায় ঠেলে বিপদ ডেকে আনত।","ভেবে বসা যায় joint5-এর কোণ tag-এর 3D pose থেকে আসছে — আসলে detector-ডাকের দ্বিতীয় argument False (Part 8, ln 157) — API-ঘর <code>estimate_tag_pose<\/code> বন্ধ, তাই <code>tag_size=0.025<\/code> কাজেই লাগেনি; ঘূর্ণন-তথ্যের একমাত্র উৎস 2D কোণার এই ধার-ভেক্টর।","দুইবার publish-কে দুই আলাদা আদেশ ভাবা ভুল — ln 375 আর 376 একই <code>self.joint5<\/code> খাম, মান বদল ছাড়াই; দ্বিতীয়টি নিরর্থক পুনরাবৃত্তি মাত্র, দুই ভিন্ন কোণ নয়।"]},"robot":{"correct":"line অনুসরণ চলতে চলতে camera-তে AprilTag ঢুকলে robot তৎক্ষণাৎ থামে, terminal-এ <code>Find the apriltag.<\/code> আসে; এরপর <code>adjusting.<\/code> ছাপতে ছাপতে ধীরে tag-কেন্দ্রকে (320, 400)-এর ১০ pixel ঘরে আনা হয়। তারপর <code>start crawling.<\/code>, ৩ সেকেন্ড স্থবিরতা, আর terminal-এ চার লাইন তথ্য: target_joint5, tag_id, center জোড়া, depth। PosInfo topic-এ একবার message যায়, set_joint5-এ একই কোণ-আদেশ দুইবার — arm-এর wrist ঘুরে যায়।","incorrect":"ভ্রান্তি: ভাবা যে হস্তান্তরের পরও প্রতি frame-এ নতুন করে PosInfo যাবে — আসলে <code>pubPos_flag<\/code> False হয়ে গেছে, arm কাজ শেষ করে <code>grasp_done<\/code> topic-এ True না পাঠালে (Part 8-এর callback) পতাকা আর ওঠে না, হস্তান্তরও আর হয় না। আর depth অমাপ হলে robot কিছুই না-করে পড়ে থাকে — retry বলে কিছু নেই, শুধু <code>Invalid distance.<\/code> ছাপা হয়।"},"animType":"tagHandoff"},{"n":15,"id":"part-15","fname":"follow_line.py","enTitle":"Clamp, Reset & the Never-Called get_param","lang":"python","start":382,"end":430,"flags":[],"explain":[{"a":382,"b":385,"text":"<code>pubVel(self,vx,vy)<\/code> — দুই লাইনের ডাকবাক্স: নতুন <code>Twist()<\/code> খামে দুই ঘর ভরা হয়, <code>vel.linear.x = vx<\/code> আর <code>vel.linear.y = vy<\/code> — সামনে-পিছনে আর বামে-ডানে পাশ-চাল। <code>angular.z<\/code>-এ আঙুল পড়েই না, তাই সে খালি-জন্মের শূন্যই থাকে — এই ফাংশন দিয়ে কখনো ঘূর্ণন-আদেশ যায় না। নাম দুটি আবার বিপজ্জনক রকমের সাধারণ (<code>vx<\/code>, <code>vy<\/code>) — কে কী পাঠাচ্ছে তার ওপর নির্ভর করে এরা robot-এর কোন অক্ষ নাড়াবে; নিচের <code>remove_obstacle<\/code>-এ সেই নাম-নিয়েই আসল খেলা দেখবে।"},{"a":387,"b":387,"text":"ভরা খাম <code>/cmd_vel<\/code> topic-এ ছাড়া হয় — Part 4-এ জন্মানো <code>pub_cmdVel<\/code>, queue depth 1। Base-র controller এই velocity পেয়ে চাকা ঘোরায়। লক্ষ করো এই wrapper-এ কোনো সীমা-যাচাই নেই: argument-এ যা এসেছে তাই যায়; clamp-এর দায় ডাকের আগেই, নিচের চার লাইনে। Part 14 এই ফাংশনকে ডেকেছে থামাতে — <code>pubVel(0.0, 0.0)<\/code> (ln 354) — আর চালানোর ডাকও এখান থেকেই নিচে পড়বে। ছোট ফাংশন, কিন্তু Remove-অবস্থার প্রতিটি নড়ার একমাত্র দরজা।"},{"a":389,"b":390,"text":"এই file-এর সবচেয়ে কুখ্যাত লাইন: <code>[y, x] = self.Remove_PID_controller.update([(point_x - 320) / 10.0, (point_y - 400) / 10.0])<\/code>। ইনপুট-জোড়া সোজা: আনুভূমিক error <code>(point_x - 320) / 10.0<\/code>, উল্লম্ব error <code>(point_y - 400) / 10.0<\/code> — 320 হলো 640-প্রস্থ frame-এর কলাম-কেন্দ্র, আর 400 কেন্দ্র-সারির (240) অনেক নিচের এক সারি, arm-এর নাগালের বিন্দু। কিন্তু unpack-এর নাম-জোড়া উলটে বসানো: <b>channel 0-এর ফল<\/b> (যা point_x থেকে এসেছে) <code>y<\/code> চলকে বসে, <b>channel 1<\/b> (point_y-জাত) <code>x<\/code>-এ। PID-টি Part 10-এর <code>Remove_PID_controller<\/code> — gain তুলে আনা <code>(40, 0, 15.0)<\/code>, ভাজক 1000।"},{"a":391,"b":392,"text":"Saturation-প্রাচীরের প্রথম অর্ধেক, <code>x<\/code> চ্যানেল: <code>if x &gt;= 0.10: x = 0.10<\/code>, <code>elif x &lt;= -0.10: x = -0.10<\/code> — উভয় দিকেই সীমা ঠিক ০.১০ মিটার/সেকেন্ড, আর <code>&gt;=<\/code>/<code>&lt;=<\/code> ব্যবহার বলে সীমা-মানটি নিজেই বৈধ। মনে করো এটা অংকের গুঁড়ানো নয়, যান্ত্রিক নিরাপত্তা: সরিয়ে-ফেলার চাল যত বড় error থেকেই আসুক, robot এর বেশি বেগ পাবে না। পাশের কমেন্টে <code>#0.10<\/code> — লেখক নিজেই সীমার সংখ্যাটি মনে করিয়ে রেখেছেন; 0.1 লিখলেও একই হতো, দুই দশমিক স্পষ্টতার পছন্দ।"},{"a":393,"b":394,"text":"একই প্রাচীরের দ্বিতীয় অর্ধেক, <code>y<\/code> চ্যানেলে — ছাঁচ হুবহু এক: <code>&gt;= 0.10<\/code> হলে 0.10, <code>&lt;= -0.10<\/code> হলে −0.10। দুই চ্যানেলের সীমা সমান, তাই কোনো দিকেই 'দ্রুত পালানোর' সুবিধা নেই — tag যত দূরেই থাকুক, কাছে আসার গতি ছাদে গিঁথে যায়। এখানে <code>y<\/code> মানে (swap-এর খেলা মনে করো) আনুভূমিক pixel-error-জাত ফল, যেটি একদম নিচে <code>pubVel(x, y)<\/code>-এ যাবে <code>linear.y<\/code> হয়ে — মানে বামে-ডানে পাশ-চাল।"},{"a":395,"b":395,"text":"শেষ ডাক: <code>self.pubVel(x, y)<\/code> — আর এখানেই swap-এর ফল চূড়ান্ত রূপ পায়। pubVel-এর ঘর-ক্রম <code>(vx,vy)<\/code>, তাই <code>x<\/code> বসে <code>linear.x<\/code>-এ (সামনে-পিছনে) আর <code>y<\/code> বসে <code>linear.y<\/code>-এ (পাশ-চাল)। খুলে বললে: <b>tag ডানে-বামে সরে থাকলে robot পাশে চলে<\/b> (point_x-তথ্য, y হয়ে গিয়ে linear.y), <b>tag উপরে-নিচে সরে থাকলে robot এগোয়-পিছোয়<\/b> (point_y-তথ্য, x হয়ে গিয়ে linear.x)। নাম উলটে হলেও কাজ শেষমেশ সঠিক অক্ষে — বিভ্রান্তিটা পড়ার, চালের নয়।"},{"a":397,"b":400,"text":"এই file-এর সবচেয়ে শিক্ষণীয় নকল: <code>JoyStateCallback<\/code> <b>দ্বিতীয়বার<\/b> define হচ্ছে — প্রথম জন্ম Part 7-এ (ln 118)। Python class-দেহ ওপর থেকে নিচে পড়ে, পরের definition আগেরটিকে মুছে দেয় — তাই চলতে-চলতে কাজ করে <b>এই<\/b> ln-397-র সংস্করণটিই; ln 118-টি মৃত অক্ষর। দেহে পার্থক্য প্রায় শূন্য: <code>isinstance(msg, Bool)<\/code> যাচাই, না হলে ফেরৎ; হলে <code>self.Joy_active = msg.data<\/code> — joystick-এর দখল-পতাকা। একমাত্র বাড়তি ln 400-এর কমেন্ট-হয়ে-যাওয়া publish-লাইন। /JoyState-র (দুইবার-নিবন্ধিত, Part 4-এর নকল) প্রতিটি message এখানেই আছাড় খায়।"},{"a":403,"b":406,"text":"<code>Reset<\/code> — r চাবির (Part 13, ln 300) সমস্ত-মুছে-ফেলা: প্রথম তিন ঘর <code>self.PID_init()<\/code> (Part 10 — দুই controller-এর জমা-স্মৃতি শূন্য), <code>self.Track_state = 'init'<\/code> (ROI টানার স্টেজে ফেরৎ — রং নতুন করে শেখাতে হবে), <code>self.hsv_range = ()<\/code> (শেখা রং-সীমা মুছে ফেলা — কিন্তু মনে রেখো <code>.text<\/code> file-এর লেখা থেকেই যায়, পরের 'identify' সেটাই তুলবে)। এক ডাকে node তার শেখা-স্মৃতি হারায়, বই-গহনার স্মৃতি নয়।"},{"a":407,"b":410,"text":"বাকি ঘরগুলো: <code>self.Joy_active = False<\/code> (joystick-এর দখল ছেড়ে দেওয়া), <code>self.Mouse_XY = (0, 0)<\/code> (Part 11-এর মাউস-বিন্দু শূন্যে), আর নিরাপত্তার খাতা <code>self.pub_cmdVel.publish(Twist())<\/code> — খালি Twist মানে তিন অক্ষেই শূন্য, চাকা যেন পুরো থেমে থাকে। শেষ লাইনটি এই file-এর একটি বিখ্যাত টাইপো: <code>print(\"Reset succes!!!\")<\/code> — 'success'-এর দ্বিতীয় s নেই, আর বিস্ময়ের দাগ তিনটি। বানান যা-ই হোক, কাজ সত্যি: এই লাইন terminal-এ দেখলেই জেনে নিও robot থেমেছে, state শুরুতে ফিরেছে।"},{"a":412,"b":414,"text":"<code>def get_param(self):<\/code> — দেখতে গুরুত্বপূর্ণ, ভাগ্যে অদৃশ্য: এই পুরো file-এ <code>get_param<\/code>-কে ডাকা হয়নি একবারও (main-ও নয়, callback-ও নয়) — একেবারে অব্যবহৃত কোড। কাজটা বুঝলে ক্ষতিটাও বুঝবে: প্রতিটি লাইন <code>self.get_parameter('Hmin').get_parameter_value().integer_value<\/code> প্যাটার্নে ROS 2 parameter থেকে মান তুলে চলকে বসায় — অর্থাৎ বাইরে থেকে <code>ros2 param set<\/code> করা মান চালু-অবস্থায় ঢোকার একমাত্র সেতু এটাই হতে পারত। সেতু আছে, পথ নেই।"},{"a":415,"b":419,"text":"একই ছাঁচে আরও পাঁচটি: Smin, Vmin, Hmax, Smax, Vmax — ছয়টি মিলে HSV-র নিম্ন-ঊর্ধ্ব দুই ত্রয়ী। প্রতিটিতে লাগাম এক: নাম দিয়ে খোঁজা, <code>.get_parameter_value()<\/code> দিয়ে মোড় খোলা, <code>.integer_value<\/code> দিয়ে সংখ্যা বের করা। এই ছয়টি নামই Part 10-এ declare হয়েছিল, আর Part 13-এর ROI-পথ সেগুলোতে মান বসাত — সে যাত্রা ভেতর থেকে বাইরের দিকে ছিল। এই পাঁচ লাইন চালু হলে তবেই বিপরীত যাত্রা হতো — কিন্তু কলার নেই।"},{"a":420,"b":424,"text":"কমেন্টে <code>#kpi<\/code> লেখা (আসলে PID-ই বোঝানো), Kd, Ki, Kp তিনটিই একই integer-ছাঁচে তোলা হয়। তারপর সবচেয়ে নির্মম লাইন: <code>self.FollowLinePID = (self.Kp,self.Ki,self.Kd)<\/code> — declared গুলি (60, 0, 20) থেকে বানানো tuple-কে আসল controller-এ পৌঁছানোর শেষ ধাপ হতে পারত। কিন্তু controller জন্মেছিলই Part 6-এর ln 91-এর হার্ডকোড <code>(50, 0, 10)<\/code> নিয়ে (Part 10-এর PID_init), আর এই rebuild চলবেই না — কাজেই 60 কোনোদিন 50-কে ছুঁতে পারবে না। ব্যবধানটা চিরকালের।"},{"a":425,"b":427,"text":"নিঃসঙ্গ <code>#<\/code> কমেন্টের পরে মিশ্র-ধাতুর তোলা: <code>scale<\/code> (integer ছাঁচে — Part 6-এর ln 90-এ এর মান 1000 বসে) হলো PID-gain-এর ভাজক, <code>LaserAngle<\/code> (Part 10-এ declared 60) laser-শঙ্কুর পুরো পাটো, দুটিই এখানে integer_value ছাঁচে। চালু হলে <code>ros2 param set<\/code> দিয়ে শঙ্কু চিকনানো-মোটা করা যেত চলতে-চলতে — registerScan (Part 7) পরের scan-message থেকেই নতুন কোণ নিত। হয়নি কিছুই: এই লাইনগুলোর কোনো ডাক নেই, তাই declared 60-ই চিরকালের 60।"},{"a":428,"b":430,"text":"শেষ তিন তোলা: <code>linear<\/code> (<code>double_value<\/code> — এই এক লাইনেই <code>self.linear<\/code>-এর লিখিত-মাত্র জীবনের তৃতীয় অধ্যায়: Part 10 declared 0.18, Part 6-এর ln 93 হার্ডকোড 0.2 দিয়ে মুছে দিল, আর এখানে পুনরায় পড়ার কল্পনা), <code>ResponseDist<\/code> (laser-র দূরত্ব-দোররা, declared 0.25), <code>refresh<\/code> (<code>bool_value<\/code>)। কেউই ডাকেনি বলে চালের জগতে এদের কোনো ছায়া নেই — <code>execute<\/code> চলে হার্ডকোড <code>twist.linear.x = 0.1<\/code> নিয়েই (Part 12, ln 269)। Function-টি এখানেই শেষ, শেষ Part-এর দরজায় দাঁড়ালাম।"}],"math":{"intro":"remove_obstacle-এর চার লাইনে লুকানো একটি সম্পূর্ণ নিয়ন্ত্রণ-শিকল: pixel-দূরত্ব ভাগ-করে error, PID-লাভ গুণ করে বেগ, নাম-বদলে অক্ষ-বদল, আর শেষে ±0.10 মিটার/সেকেন্ডের saturation-প্রাচীর। প্রতিটি সংখ্যা — 320, 400, 10, 0.10 — source-এর নিজের লাইন থেকে উঠে আসে।","levels":[{"label":"Level 1 — লক্ষ্য আর error","latex":"\\[ e_x = \\frac{p_x - 320}{10}, \\qquad e_y = \\frac{p_y - 400}{10} \\]","text":"320 হলো 640-প্রস্থ frame-এর কলাম-কেন্দ্র, আর 400 কেন্দ্র-সারি 240-এর গভীরে নিচের এক সারি — যেখানে থেমে থাকলে tag arm-এর নাগালে। ভাগ ১০-এর কাজ স্কেল-নামানো: pixel-দূরত্বকে PID-র স্বাভাবিক ঘরে আনা।"},{"label":"Level 2 — PID থেকে বেগ","latex":"\\[ \\mathrm{out}_i = K_p\\, e_i + K_d\\, \\dot{e}_i, \\qquad K_p = \\frac{40}{1000} = 0.04, \\;\\; K_d = \\frac{15}{1000} = 0.015 \\]","text":"RemovePID <code>(40, 0, 15.0)<\/code> (Part 6, ln 92), আর Part 10-এ জন্মের সময় scale=1000 দিয়ে ভাগ — তাই কার্যকর gain 0.04 আর 0.015; I-পদ শূন্য, জমা-অসীমতার ভয় নেই। প্রতি চ্যানেল নিজের error নিজেই হজম করে।"},{"label":"Level 3 — নাম-বদলে অক্ষ-বদল","latex":"\\[ [y, x] = \\mathrm{update}([e_x,\\, e_y]) \\;\\Rightarrow\\; y = \\mathrm{out}_0(e_x), \\quad x = \\mathrm{out}_1(e_y) \\]","text":"channel 0-এর ইনপুট e_x (আনুভূমিক pixel-error) কিন্তু তার ফল বসে y-তে — আর <code>pubVel(x, y)<\/code>-এ তা হয় linear.y, পাশ-চাল; e_y-জাত ফল x-এ বসে linear.x, এগোনো। নাম উলটে, কাজ সোজা: আনুভূমিক error পাশে টানে, উল্লম্ব error সামনে-পিছনে।"},{"label":"Level 4 — saturation","latex":"\\[ v \\leftarrow \\Pi_{[-0.10,\\, +0.10]}(v) = \\max(-0.10,\\, \\min(0.10,\\, v)) \\]","text":"দুই চ্যানেলেই একই ব্যবধানে অভিক্ষেপ — বাইরে গেলে নিকটতম প্রান্তে গাঁথা। কোডে চার লাইনের if/elif, গণিতে এক clip; 0.10 m/s চূড়ান্ত, এর বেশি বেগ এই পথে জন্মাতেই পারে না।"}],"numeric":[{"latex":"\\[ p_x = 420, \\; p_y = 400: \\; e_x = 10, \\; e_y = 0 \\Rightarrow \\mathrm{out}_0 = 0.04 \\times 10 = 0.40 \\Rightarrow \\Pi(v) = 0.10\\;\\mathrm{m/s} \\]","text":"tag ডানে ১০০ pixel: P-পদ একা 0.40 চায়, প্রাচীর 0.10-এ গেঁথে দেয় — robot পূর্ণ পাশ-গতিতে সরে, গতি আর বাড়ে না।"},{"latex":"\\[ p_y = 430: \\; e_y = 3 \\Rightarrow \\mathrm{out}_1 = 0.04 \\times 3 = 0.12 \\Rightarrow 0.10\\;\\mathrm{m/s} \\]","text":"মাত্র ৩০ pixel দূরত্বেই P-পদ 0.12 — এই গুণক-জোড়ায় (ভাগ ১০ ছোট, gain তুলনায় বড়) সামান্য দূরেই ছাদ: P-পদ ০.১০-এ পৌঁছায় মাত্র ২৫ pixel দূরত্বে, তার বাইরে সব ছাদ-মান।"},{"latex":"\\[ |p_x - 320| \\le 10 \\;\\Rightarrow\\; |e_x| \\le 1 \\;\\Rightarrow\\; |\\mathrm{out}_0| \\le 0.04 \\;\\;(< 0.10) \\]","text":"সহন-বলয়ের ভেতরে (Part 14-এর ±10 pixel শর্ত) P-পদের সর্বোচ্চ 0.04 — প্রাচীর সেখানে কখনোই কামড়ায় না; clamp কাজ করে শুধু দূরের যাত্রায়।"}],"mapping":[{"code":"[(point_x - 320) / 10.0, (point_y - 400) / 10.0]","math":"\\[ [e_x,\\, e_y] = \\left[\\frac{p_x-320}{10},\\; \\frac{p_y-400}{10}\\right] \\]","text":"লক্ষ্য-জোড়া (320, 400) আর ভাজক ১০ — তিনটি সংখ্যাই এই লাইনের নিজস্ব; error-এর ঘর pixel-দশকে।"},{"code":"[y, x] = self.Remove_PID_controller.update([(point_x - 320) / 10.0, (point_y - 400) / 10.0])","math":"\\[ y \\leftarrow \\mathrm{out}_0, \\quad x \\leftarrow \\mathrm{out}_1 \\]","text":"unpack-এর ক্রমই অক্ষ-নির্ধারক: ডান দিকের প্রথম ফল y-তে, দ্বিতীয়টি x-এ — নাম দুটি মনে রাখার ফাঁদ, অক্ষ ঠিকই আছে।"}],"failure":["swap না-দেখা পাঠক <code>[y, x]<\/code>-কে সাধারণ নাম-জোড়া ভেবে x-কে আনুভূমিক ভাবে — তখন তার চোখে robot 'উলটো' নড়ে: tag ডানে থাকলে পাশে নয়, এগিয়ে যায়; দোষ চালের নয়, পাঠের।","clamp-চার লাইন বাদ দিলে e_x = 10 জাতীয় দূরত্বে 0.40 m/s সোজা চাকায় যেত — সেকেন্ডে ৪০ সেন্টিমিটারের ধাক্কা, সরু জায়গায় tag-এর গায়ে হুড়ম; প্রাচীরটাই সরিয়ে-ফেলার ভদ্রতা।","লক্ষ্য-সারিকে image-কেন্দ্র (240) ভাবা মারাত্মক — 400 হলো নিচের সারি, arm-এর নাগাল-বিন্দু; 240 ধরলে robot tag-কে camera-র মাঝ-বরাবর আনতে গিয়ে arm-এর পাল্লার বাইরে থামত।","<code>ros2 param set /follow_line Kp 60<\/code> চালু-অবস্থায় গুণ বদলাবে ভাবা — পথটাই নেই: parameter থেকে controller-এ মান আনে একমাত্র get_param, আর তাকে কেউ ডাকেনি; follow-গুলি আটকে থাকে (50, 0, 10)-এ, remove-গুলি (40, 0, 15.0)-এ।"]},"robot":{"correct":"AprilTag সরিয়ে-ফেলার সময় robot এই ফাংশনের নিয়মে নড়ে: tag-কেন্দ্র যে দিকে যত দূরে, সেদিকে সরতে থাকে, কিন্তু বেগ কখনো ০.১০ মিটার/সেকেন্ড ছাড়ায় না — terminal-এ <code>adjusting.<\/code> ছাপতে ছাপতে ধীরে পাশে-সামনে এসে (320, 400)-এর ১০ pixel ঘরে ঢোকে। আর terminal-এ r চাপলে robot থেমে যায়, ROI টানার 'init' অবস্থায় ফেরে, ছাপা হয় <code>Reset succes!!!<\/code> — বানান নিয়ে দুশ্চিন্তা নেই, কাজ হয়েছে।","incorrect":"নিয়ন্ত্রণ-কক্ষ থেকে চলতে-চলতে গুণ বদলানোর চেষ্টা ব্যর্থ: <code>ros2 param set /follow_line linear 0.3<\/code> করলে parameter-খাতায় মান বসবে, কিন্তু ডাক না-পড়া get_param-এর জন্য চাকায় কিছুই পৌঁছাবে না — robot 0.1 m/s-ই চলবে (Part 12-এর হার্ডকোড)। আর কেউ যদি ভাবে সরিয়ে-ফেলার চাল 'ধীর PID' বলেই ধীর — আসল কারণ এই ±0.10 প্রাচীর; gain বাড়িয়ে লাভ নেই, প্রাচীরই ছাদ।"},"animType":"clampVel"},{"n":16,"id":"part-16","fname":"follow_line.py","enTitle":"main — Banner, Spin & Safe Shutdown","lang":"python","start":433,"end":485,"flags":[],"explain":[{"a":433,"b":437,"text":"<code>def main():<\/code> — এই file-এর একমাত্র প্রবেশদ্বার-ফাংশন, আর তার ওপরেই এক বিরাট কমেন্ট-তোরণ: <code>BEGINNER STARTUP SCREEN<\/code>, স্পষ্ট ভাষায় বলা — এখানে শুধু দেখানোর বার্তা যোগ হয়েছে, robot-এর লজিক অপরিবর্তিত। কথাটা সত্য: এই পুরো function-এ robot-আচরণ বদলানো কিছু নেই — চোখের জন্য ছাপা ছাড়া সব কাজ constructor আর callback-দের। আর মনে রেখো: এই file-এ <code>if __name__ == '__main__'<\/code> জাতীয় কোনো পাহারা নেই — main()-কে ডাকে ROS 2-এর entry point, সেই গল্প এই Part-এর শেষে।"},{"a":438,"b":441,"text":"ছাপার তোরণ শুরু: খালি লাইন, তারপর <code>print(\"=\" * 64)<\/code> — Python-এর string-গুণ ৬৪টা সমান-চিহ্নের দণ্ড আঁকে, তার ওপরে শিরোনাম <code>M3Pro ROBOT - LINE FOLLOW + APRILTAG<\/code>, তারপর আরেক দণ্ড। Terminal পুরো প্রোগ্রামের আগেই পরিষ্কার নাম-ফলক পায় — কোন কাজ চালু হচ্ছে তা প্রথম চাহনিতেই পড়া যায়। এই দণ্ড-জোড়া আবার ফিরবে নিচে — শুরু আর শেষের মিল-ছক; সংখ্যা ৬৪ নিজে কোনো গাণিতিক তাৎপর্য বহন করে না, terminal-এর সাধারণ প্রস্থের খেলা।"},{"a":442,"b":449,"text":"<code>Starting ROS 2 node...<\/code>-এর পরে সারণি: <code>[1]<\/code> line শনাক্ত করে অনুসরণ, <code>[2]<\/code> AprilTag শনাক্ত, <code>[3]<\/code> বাধা-নিরাপত্তার জন্য laser scanner, <code>[4]<\/code> AprilTag পেলে arm নিয়ন্ত্রণ — চার বাক্যে পুরো পূর্বসূরি: Part 13-এর line-অনুসরণ, Part 14-এর হস্তান্তর, Part 7-এর laser-শঙ্কু, Part 9-এর arm-বার্তাবাহ। কৌতূহলী ব্যাপার: এই ঘোষণাগুলো node চালু হওয়ার <b>আগেই<\/b> ছাপা হয় — অর্থাৎ এগুলো প্রতিশ্রুতি, প্রতিবেদন নয়; প্রতিবেদন আসবে পরের [OK]-দলে।"},{"a":450,"b":455,"text":"Keyboard-তালিকা: SPACE tracking চালু, I হলো HSV identify, R হলো Reset, Q হলো বন্ধ — চারটিই Part 13-এর dispatch-টেবিলের (ln 297-301) হুবহু প্রতিধ্বনি: 32, i/105, r/114, q/113। মানে এই banner আসলে পরে-লেখা সত্য ব্যবহার-নির্দেশিকা — কোডের চাবি-দরজার মানচিত্র। মনে রাখো SPACE-এর বিকল্পও আছে: node শুরুর ৩ সেকেন্ড পর auto-start (Part 8, ln 167-170) নিজেই tracking-এ নামবে — তালিকায় সে-কথা লেখা নেই, নীরব বিকল্প মাত্র।"},{"a":456,"b":459,"text":"শেষ উপদেশ-জোড়া: শুরুর আগে robot-এর চারপাশ পরিষ্কার রাখো, আর বাধা পেলে robot থেমে যাবে — দ্বিতীয় বাক্যটি Part 12-এর <code>front_warning &gt; 10<\/code> শর্তের (ln 270) জনপ্রিয় অনুবাদ: laser-শঙ্কুতে (Part 7) যথেষ্ট beam দূরত্ব-সীমার ভেতরে পড়লে চাকা থামে, বাজারও বাজে। <code>print(\"-\" * 64)<\/code> দিয়ে বিদায়ী দণ্ড — সমান-চিহ্নের বদলে হাইফেন, চোখ বলে দেয় এই পর্দা-অধ্যায় শেষ। এরপরই আসল ডাক: rclpy-র জন্ম।"},{"a":461,"b":462,"text":"দুই লাইনে আসল জন্ম: <code>rclpy.init()<\/code> ROS 2-এর runtime-জগৎ জাগায় (একবারই — দ্বিতীয়বার ডাকলে ভুল), আর <code>linedetect = LineDetect(\"follow_line\")<\/code> — Part 4 থেকে Part 6-এর পুরো জন্ম-দৃশ্যপট এক ডাকে চলে যায়: নয়টি publisher, দুইবার-নিবন্ধিত /JoyState, /scan1 subscriber, camera-sync জোড়া, parameter ঘোষণা, PID-জন্ম, arm-হ্যান্ডশেক লুপ (arm6_joints-এ কেউ না যোগ দেওয়া পর্যন্ত প্রতি ০.১ সেকেন্ডে init_joints পাঠানো), আর terminal-এ <code>Init Done.<\/code>-জাতীয় ছাপা।"},{"a":463,"b":466,"text":"চারটি [OK]-লাইন একটানা: node চালু, camera/depth প্রক্রিয়া শুরু, line-অনুসরণ প্রস্তুত, AprilTag শনাক্তকরণ প্রস্তুত। মার্জিত পড়াশোনা মনে রেখো: এগুলো constructor-এর <b>পরে<\/b> ছাপা হয়, আর কোনো যাচাই-শর্ত ছাড়াই — কোথাও কোনো return-code দেখা হয়নি। Camera-driver node বন্ধ থাকলেও constructor ব্যর্থ হয় না — subscriber-রা কেবল চুপ থাকে, তাই [OK]-লাইনগুলো তখনও অবিকল ছাপা হয় — নিশ্চয়তার ভঙ্গি, পরীক্ষার প্রমাণ নয়।"},{"a":467,"b":470,"text":"<code>&gt;&gt;&gt; System is RUNNING. &lt;&lt;&lt;<\/code> — সমান-চিহ্নের দণ্ডে বেষ্টিত এই ঘোষণাই terminal-এর চালু-অবস্থার শেষ কথা; তারপর থেকে screen প্রায় নীরব (ROS 2-র নিজস্ব লগ ছাড়া), আসল খবর এখন 'frame' জানালার ছবিতে আর Part 14-এর ছাপাগুলোতে। লক্ষ করো এই পর্দা-অংশের নীরবতা-চুক্তি: main() নিজে আর কোনো কাজ করবে না — পরের লাইনেই সে সব শক্তি হস্তান্তর করছে spin-কে, callback-দের প্রজাতন্ত্রের হাতে।"},{"a":471,"b":474,"text":"<code>rclpy.spin(linedetect)<\/code> (<code>try:<\/code>-ঘরে) — এখানেই main() দীর্ঘশ্বাস ফেলে বসে থাকে: spin হলো ঘটনা-লুপ, callback-দের সুযোগ দেওয়ার অপেক্ষা-কক্ষ; sync-করা camera-জোড়া Part 8-কে ডাকবে, /scan1 Part 7-কে, /JoyState এখন Part 15-এর জয়ী definition-কে — জীবনের বাকি সব এদের হাতে। <code>except KeyboardInterrupt:<\/code> আর তার নিচে <code>pass<\/code> — terminal-এ Ctrl+C চাপলে এই লুপ ভেঙে ব্যতিক্রম ওঠে, আর এখানে তা নিঃশব্দে গিলে নেওয়া হয়: pass, কোনো ভুল-ছাপা নয় — দাপটের সাথে বিদায়ের পথে নামা হবে finally-তে।"},{"a":475,"b":478,"text":"<code>finally:<\/code> — যে-অবস্থাতেই বেরোক (Ctrl+C, স্বাভাবিক শেষ, বা ভুল), এই ঘর অবশ্যই চলবে। আগে খালি লাইন আর সমান-চিহ্নের দণ্ড, তারপর <code>Stopping robot safely...<\/code> — শুরুর তোরণের জোড়া-প্রতিধ্বনি। সবচেয়ে গুরুত্বপূর্ণ পাঠ ক্রম: <code>[OK] Zero velocity command sent<\/code> ছাপা হয় এখানেই, অথচ আসল publish কয়েক লাইন পরে (ln 483) — বিলম্ব মুহূর্তের, কিন্তু সত্য-কথাটি এটাই: প্রথমে ঘোষণা, পরে কাজ; banner-এর সব [OK] এই একই আশ্বাস-ভঙ্গি।"},{"a":479,"b":482,"text":"বিদায়-পর্দার বাকি লাইন: node বন্ধ হলো, আর <code>Goodbye!<\/code> — তারপর শেষ দণ্ড। এই চার ছাপা আসল বিদায়ের <b>আগে<\/b>, <code>pub_cmdVel.publish(Twist())<\/code>-এর আগেই — অর্থাৎ terminal-পাঠক দেখবে শূন্য-বেগ পাঠানো হয়েছে, আর তার এক মুহূর্ত পরেই তা সত্যি হবে। নাটকীয়তা নয়, নিরাপত্তাই মূল কথা: বিদায়ের প্রতিটি লাইন স্থির-robot-এর অনুমানের ওপর দাঁড়িয়ে, আর পরের তিন লাইন সেই অনুমান বাস্তব করবে।"},{"a":483,"b":485,"text":"তিন লাইনের বিদায়-নীতি: <code>linedetect.pub_cmdVel.publish(Twist())<\/code> — খালি /* ---------------- utilities ---------------- */
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const pad2 = n => String(n).padStart(2, '0');

/* ---------------- syntax highlighting (presentation-only) --------
   A single-pass scanner over the RAW line that groups characters into
   tokens and only afterwards escapes them. The underlying text is
   never altered — spans are purely cosmetic.                        */
const PY_KW = new Set(['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield']);
const PY_BLT = new Set(['print','input','range','float','int','str','len','open','sorted','super','set','list','dict','type','abs','min','max','round','enumerate','isinstance','self']);
const SH_KW = new Set(['if','then','else','elif','fi','for','while','do','done','case','esac','function','export','return','in','local']);
const SH_CMD = new Set(['docker','ros2','gnome-terminal','bash','sh','python3','sleep','source','export','echo','cat','run','launch','pub','topic','start','stop','exec']);

function tokenizeLine(line, lang) {
  if (lang === 'text') return line === '' ? [] : [{ t: line, c: '' }];
  const toks = [];
  const push = (t, c) => { if (t) toks.push({ t: t, c: c }); };
  let i = 0;
  const n = line.length;
  while (i < n) {
    const c = line[i];
    if (c === '#') { push(line.slice(i), 'com'); break; }
    if (c === '\'' || c === '"') {
      let j = i + 1;
      while (j < n && line[j] !== c) j++;
      const end = Math.min(j + 1, n);
      push(line.slice(i, end), 'str');
      i = end; continue;
    }
    if (/[0-9]/.test(c) && !(i > 0 && /[A-Za-z0-9_]/.test(line[i - 1]))) {
      let j = i;
      while (j < n && /[0-9a-fA-FxXoObB._]/.test(line[j])) j++;
      push(line.slice(i, j), 'num');
      i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const word = line.slice(i, j);
      if (/^[fFrRbBuU]{1,2}$/.test(word) && j < n && (line[j] === '\'' || line[j] === '"')) {
        const q = line[j];
        let k = j + 1;
        while (k < n && line[k] !== q) k++;
        const end = Math.min(k + 1, n);
        push(line.slice(i, end), 'str');
        i = end; continue;
      }
      let cls = '';
      const KW = lang === 'python' ? PY_KW : SH_KW;
      const BLT = lang === 'python' ? PY_BLT : SH_CMD;
      if (KW.has(word)) cls = 'kw';
      else if (BLT.has(word)) cls = 'blt';
      else if (lang === 'python' && j < n && line[j] === '(') cls = 'fn';
      push(word, cls);
      i = j; continue;
    }
    let j = i;
    while (j < n && !/[#'"0-9A-Za-z_]/.test(line[j])) j++;
    if (j === i) j = i + 1;
    push(line.slice(i, j), '');
    i = j;
  }
  return toks;
}
function hl(line, lang) {
  if (line === '') return '';
  return tokenizeLine(line, lang).map(t =>
    t.c ? '<span class="tok-' + t.c + '">' + escHtml(t.t) + '</span>' : escHtml(t.t)
  ).join('');
}
function rawLines(fname, a, b) {
  return FILEDATA[fname].slice(a - 1, b);
}

/* ---------------- sidebar ---------------- */
function renderSidebar() {
  const total = PARTS.length;
  const files = Object.keys(FILEDATA).length;
  document.getElementById('sb-meta').textContent = files + ' files · ' + total + ' Parts';
  const nav = document.getElementById('sb-nav');
  nav.innerHTML = PARTS.map(p =>
    '<a class="sb-item" href="#' + p.id + '" data-target="' + p.id + '">' +
      '<span class="sb-num">' + pad2(p.n) + '</span>' +
      '<span class="sb-name">' + escHtml(p.enTitle) + '</span>' +
    '</a>'
  ).join('');
}

/* ---------------- part sections ---------------- */
function codeCard(p) {
  const lines = rawLines(p.fname, p.start, p.end);
  const rows = lines.map((ln, i) => {
    const no = p.start + i;
    return '<div class="cl"><span class="cln">' + no + '</span><span class="clc">' + hl(ln, p.lang) + '</span></div>';
  }).join('');
  const raw = lines.join('\n');
  return '' +
  '<div class="code-card" data-copy-src="' + p.id + '">' +
    '<div class="code-card-head">' +
      '<span class="dots"><i></i><i></i><i></i></span>' +
      '<span class="code-fname">' + escHtml(p.fname) + '</span>' +
      '<button class="copy-btn" data-copy="' + p.id + '">Copy</button>' +
      '<span class="code-lines-chip">L' + p.start + (p.end > p.start ? '–' + p.end : '') + '</span>' +
    '</div>' +
    '<div class="code-scroll"><pre class="code"><code>' + rows + '</code></pre></div>' +
  '</div>';
}

function explainBlock(p) {
  if (!p.explain || !p.explain.length) return '';
  const entries = p.explain.map(e => {
    const snippetLines = rawLines(p.fname, e.a, e.b);
    const rendered = snippetLines.map(ln => hl(ln, p.lang)).join('\n');
    const label = e.a === e.b ? ('L ' + e.a) : ('L ' + e.a + '–' + e.b);
    return '' +
    '<div class="ex-entry">' +
      '<div class="ex-snippet"><span class="ex-lines">' + label + '</span>' +
        '<pre>' + rendered + '</pre></div>' +
      '<div class="ex-arrow">↓</div>' +
      '<div class="ex-text bn">' + e.text + '</div>' +
    '</div>';
  }).join('');
  return '' +
  '<div class="sec sec-ex">' +
    '<div class="sec-head"><span class="badge badge-ex">EX</span><h3>Line-by-Line Explanation</h3></div>' +
    '<div class="sec-body">' + entries + '</div>' +
  '</div>';
}

function mathBlock(p) {
  const m = p.math;
  if (!m) return '';
  const levels = (m.levels || []).map(v =>
    '<div class="math-level">' +
      '<div class="ml-label">' + v.label + '</div>' +
      '<div class="mathy">' + v.latex + '</div>' +
      '<div class="ml-text bn">' + v.text + '</div>' +
    '</div>'
  ).join('');
  const numeric = (m.numeric || []).map(v =>
    '<div class="math-level">' +
      '<div class="mathy">' + v.latex + '</div>' +
      '<div class="ml-text bn">' + v.text + '</div>' +
    '</div>'
  ).join('');
  const mapping = (m.mapping || []).map(v =>
    '<div class="map-row">' +
      '<div class="map-code"><code>' + escHtml(v.code) + '</code></div>' +
      '<div class="map-math mathy">' + v.math + '</div>' +
      '<div class="map-text bn">' + v.text + '</div>' +
    '</div>'
  ).join('');
  const failure = (m.failure || []).map(v => '<li>' + v + '</li>').join('');
  let html = '<div class="sec sec-math">' +
    '<div class="sec-head"><span class="badge badge-math">Σ</span><h3>Math Behind This Code</h3></div>' +
    '<div class="sec-body">';
  if (m.intro) html += '<div class="math-intro bn">' + m.intro + '</div>';
  if (levels) html += levels;
  if (numeric) html += '<div class="math-subhead">Numerical Example — ধাপে ধাপে হিসাব</div>' + numeric;
  if (mapping) html += '<div class="math-subhead">Code → Math Mapping</div>' + mapping;
  if (failure) html += '<div class="math-subhead">Failure Intuition — ভুল হলে কী হবে</div><ul class="failure-list">' + failure + '</ul>';
  html += '</div></div>';
  return html;
}

function robotBlock(p) {
  if (!p.robot) return '';
  return '' +
  '<div class="sec sec-rb">' +
    '<div class="sec-head"><span class="badge badge-rb">RB</span><h3><span class="bn-inline">Real Robot/System এই code অনুযায়ী কী করবে</span></h3></div>' +
    '<div class="sec-body"><div class="rb-grid">' +
      '<div class="rb-card rb-ok"><h4>Correct behavior</h4><div class="bn">' + p.robot.correct + '</div></div>' +
      '<div class="rb-card rb-bad"><h4>Incorrect behavior</h4><div class="bn">' + p.robot.incorrect + '</div></div>' +
    '</div></div>' +
  '</div>';
}

function animBlock(p) {
  if (!p.animType) return '';
  return '' +
  '<div class="sec sec-anim" id="anim-' + p.id + '">' +
    '<div class="sec-head"><span class="badge badge-anim">AN</span><h3>Interactive Animation</h3></div>' +
    '<div class="anim-stage" id="stage-' + p.id + '"></div>' +

function mathFallback() {

function setupMathJaxWatchdog() {
  window.__mathFailed = false;
  const s = document.getElementById('Mathjax-script');

/* ================================================================
   ANIMATION SYSTEM
   Engine: cancellable, speed-scaled, pause-aware rAF scheduler.
   Every animation renders inline SVG, updates a live Bangla caption
   and a live formula bar. No animation libraries are used.
   ================================================================ */

const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBounce = t => {
  const n1 = 7.5625, d1 = 2.75;
  if (t < 1 / d1) return n1 * t * t;
  if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + .75;
  if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + .9375;
  return n1 * (t -= 2.625 / d1) * t + .984375;
};
const fmt = (v, d) => Number(v).toFixed(d === undefined ? 3 : d);

/* ---------------- small SVG string helpers ---------------- */
function rrect(x, y, w, h, rx, fill, stroke, extra) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
    '" rx="' + (rx === undefined ? 8 : rx) + '" fill="' + fill + '"' +
    (stroke ? ' stroke="' + stroke + '" stroke-width="1"' : '') +
    (extra || '') + '/>';
}
function txt(x, y, s, o) {
  o = o || {};
  return '<text' + (o.id ? ' id="' + o.id + '"' : '') + ' x="' + x + '" y="' + y + '" fill="' + (o.fill || '#c9d1d9') +
    '" font-size="' + (o.size || 13) + '"' +
    ' font-family="' + (o.mono ? "'JetBrains Mono',monospace" : "'Hind Siliguri','Inter',sans-serif") + '"' +
    (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') +
    (o.weight ? ' font-weight="' + o.weight + '"' : '') +
    (o.op !== undefined ? ' opacity="' + o.op + '"' : '') + '>' + s + '</text>';
}
function line(x1, y1, x2, y2, stroke, w, extra) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
    '" stroke="' + stroke + '" stroke-width="' + (w || 1.5) + '"' +
    (extra || '') + '/>';
}
function circ(x, y, r, fill, extra) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill + '"' + (extra || '') + '/>';
}
function arrow(x1, y1, x2, y2, color, marker, w) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
    '" stroke="' + color + '" stroke-width="' + (w || 2) +
    '" marker-end="url(#' + marker + ')"' + '/>';
}
function path(d, stroke, w, extra) {
  return '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '/>';
}

/* ---------------- host ---------------- */
function createAnimHost(part) {
  const id = part.id;
  const host = {
    part: part,
    stageEl: document.getElementById('stage-' + id),
    capEl: document.getElementById('cap-' + id),
    fxEl: document.getElementById('fx-' + id),
    stateEl: document.getElementById('state-' + id),
    secEl: document.getElementById('anim-' + id),
    speed: 1, running: false, stopFlag: false, started: false,
    staticOnly: false, inView: false, autoPaused: false, userPaused: false,
    _raf: null
  };
  host.setStage = function (inner, w, h) {
    host.stageEl.innerHTML = '<svg viewBox="0 0 ' + (w || 900) + ' ' + (h || 460) +
      '" preserveAspectRatio="xMidYMid meet" role="img">' + inner + '</svg>';
    return host.stageEl.querySelector('svg');
  };
  host.caption = t => { host.capEl.innerHTML = t; };
  host.formula = t => { host.fxEl.innerHTML = t; };
  host.setState = t => { host.stateEl.textContent = t; };
  host._sched = function (dur, onFrame) {
    return new Promise((res, rej) => {
      let elapsed = 0, last = null;
      const step = t => {
        if (host.stopFlag) { rej(new Error('anim-stopped')); return; }
        if (!host.running) { last = null; host._raf = requestAnimationFrame(step); return; }
        if (last === null) last = t;
        elapsed += t - last; last = t;
        const k = Math.min(1, elapsed / (dur / host.speed));
        try { onFrame(k, elapsed); } catch (e) { rej(e); return; }
        if (k >= 1) { res(); return; }
        host._raf = requestAnimationFrame(step);
      };
      host._raf = requestAnimationFrame(step);
    });
  };
  host.sleep = ms => host._sched(ms, () => {});
  host.tween = (dur, fn) => host._sched(dur, k => fn(k));
  host.start = function (speed) {
    if (speed) host.speed = speed;
    if (host.started) { host.stopFlag = true; }
    host.started = true; host.stopFlag = false; host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
    setTimeout(() => {
      ANIMS[part.animType](host).catch(e => {
        if (e && e.message === 'anim-stopped') host.setState('STOPPED');
        else console.error('anim error', part.id, e);
      });
    }, 30);
  };
  host.pause = function () {
    if (!host.started) return;
    host.running = false; host.userPaused = true;
    host.setState('PAUSED');
  };
  host.resume = function () {
    if (!host.started || !host.userPaused) return;
    host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
  };
  host.stop = function () {
    host.stopFlag = true; host.running = false; host.started = false; host.userPaused = false;
    if (host._raf) cancelAnimationFrame(host._raf);
    host.setState('IDLE');
    host.renderStatic();
  };
  host.renderStatic = function () {
    host.staticOnly = true;
    try { ANIMS[part.animType](host); } catch (e) { /* static render is best-effort */ }
    host.staticOnly = false;
  };
  host.setSpeed = function (s) {
    host.speed = s;
    if (!host.started) { host.start(s); return; }
    if (host.userPaused) { host.running = true; host.userPaused = false; }
    host.setState('RUN ' + s + 'x');
  };
  /* controls */
  host.secEl.querySelectorAll('.ac-btn').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.ac;
      host.secEl.querySelectorAll('.ac-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if (a === 'play') host.userPaused ? host.resume() : host.start(1);
      else if (a === 'slow') host.setSpeed(0.5);
      else if (a === 'fast') host.setSpeed(1.5);
      else if (a === 'pause') host.pause();
      else if (a === 'stop') { host.stop(); b.classList.remove('active'); }
    });
  });
  /* auto start / auto pause with visibility */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      host.inView = en.isIntersecting;
      if (en.isIntersecting) {
        if (host.autoPaused && host.started) {
          host.running = true; host.autoPaused = false; host.setState('RUN ' + host.speed + 'x');
        } else if (!host.started && !host.autoStarted && !window.__prefersReducedMotion) {
          host.autoStarted = true; host.start(1);
        }
      } else if (host.started && host.running) {
        host.running = false; host.autoPaused = true; host.setState('HOLD');
      }
    });
  }, { threshold: 0.25 });
  io.observe(host.secEl);
  return host;
}

(function () {

    /* speed family: all triangles point forward; SIZE/COUNT encodes magnitude
       (1 large = 1x, 1 small = 0.5x, 2 medium = 1.5x) so the glyphs stay
       distinguishable at 15px where mirrored needles were not */
    slow: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.7 8.6v6.8l5.6-3.4z"/></svg>',
    fast: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.9 7.4v9.2L11.4 12zM12.6 7.4v9.2L19.1 12z"/></svg>',

    stop: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="2.2"/></svg>'
  };
  var AC_TIP = {
    play: 'Play (1× speed)', slow: 'Slow (0.5× speed)',
    fast: 'Fast (1.5× speed)', pause: 'Pause', stop: 'Stop'
  };
  function iconBtn(ac) {
    return '<button type="button" class="ac-btn ic" data-ac="' + ac + '" ' +
      'title="' + AC_TIP[ac] + '" aria-label="' + AC_TIP[ac] + '" aria-pressed="false">' +
      IC[ac] + '</button>';
  }
  function iconRow() {
    return iconBtn('play') + iconBtn('slow') + iconBtn('fast') +
      '<span class="ac-sep" aria-hidden="true"></span>' +
      iconBtn('pause') + iconBtn('stop');
  }
  function setActive(bar, btn) {
    bar.querySelectorAll('.ac-btn').forEach(function (x) {
      x.classList.remove('active');

  }

  }

  function retrofitControls() {
    if (typeof HOSTS === 'undefined') return;
    document.querySelectorAll('.anim-controls').forEach(function (bar) {
      try {
        var sec = bar.closest('.sec-anim');
        if (!sec || !sec.id) return;
        var pid = sec.id.replace(/^anim-/, '');
        var host = HOSTS[pid];
        if (!host) return;
        bar.querySelectorAll('.ac-btn').forEach(function (n) { n.remove(); });
        bar.insertAdjacentHTML('afterbegin', iconRow());
        bar.querySelectorAll('.ac-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            var a = b.dataset.ac;
            setActive(bar, a === 'stop' ? null : b);
            if (a === 'play') { host.userPaused ? host.resume() : host.start(1); }
            else if (a === 'slow') { host.setSpeed(0.5); }
            else if (a === 'fast') { host.setSpeed(1.5); }
            else if (a === 'pause') { host.pause(); }
            else if (a === 'stop') { host.stop(); }
          });
        });
      } catch (e) { console.error('control retrofit failed', e); }
    });
  }

  /* ---------- 2. hero title: English primary only ------------------- */
  function fixHero() {

      var sub = document.querySelector('.intro-banner h1 .path');

    } catch (e) { /* cosmetic only */ }

      X.speed = s;
      if (!X.started) { start(s); return; }
      if (X.paused) { X.running = true; X.paused = false; }
      setState('RUN ' + X.speed + 'x');
    }
    function stop() { X.gen++; X.stopFlag = true; resetIdle(); }

    el.controls.querySelectorAll('.ac-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.dataset.ac;
        setActive(el.controls, a === 'stop' ? null : b);
        if (a === 'play') { X.paused ? resume() : start(1); }
        else if (a === 'slow') setSpeed(0.5);
        else if (a === 'fast') setSpeed(1.5);
        else if (a === 'pause') pause();
        else if (a === 'stop') stop();
      });
    });
  }

  /* ---------- boot -------------------------------------------------- */
  function boot() {
    try { fixHero(); } catch (e) { console.error(e); }
    try { retrofitControls(); } catch (e) { console.error(e); }
    try { buildExec(); } catch (e) { console.error('exec build failed', e); }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else { boot(); }
})();

</script>
</body>
</html>
