# =====================================================================
# E-AIRA waypoint database (frame: map)
# ---------------------------------------------------------------------
# Named poses used by the `navigate` action of the task planner.
# Record real values from your mapped environment:
#   1. ros2 launch ... slam (folder 16) → build the map
#   2. RViz "Publish Point" / "2D Goal Pose" on the map
#   3. read x, y, yaw from the /goal_pose echo or Nav2 goal feedback
# yaw is in radians; the planner builds the quaternion for Nav2.
# =====================================================================

frame: "map"

waypoints:
  home:
    x: 0.0
    y: 0.0
    yaw: 0.0

  # --- examples: replace with measured poses of your arena ---
  kitchen:
    x: 2.0
    y: 0.0
    yaw: 1.5708

  desk:
    x: 0.0
    y: 2.0
    yaw: 3.1416

  table1:
    x: -2.0
    y: -1.0
    yaw: -1.5708
