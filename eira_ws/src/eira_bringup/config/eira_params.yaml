# =====================================================================
# E-AIRA node parameters
# ---------------------------------------------------------------------
# Every default traces to a value audited from the working course code
# (folders 22/23/31/32/33 of the NeuroBotics workspace). Change on the
# robot only after re-verifying with the corresponding course experiment.
# =====================================================================

/**:
  llm_task_planner:
    ros__parameters:
      # --- local LLM (fully on-edge) --------------------------------
      ollama_url: "http://localhost:11434"
      llm_model: "phi3"                 # ollama pull phi3
      llm_timeout_s: 20.0
      # --- task database ---------------------------------------------
      waypoints_file: ""                # empty → use installed default
      map_frame: "map"
      # --- action timeouts (s) ----------------------------------------
      nav_timeout_s: 300.0
      find_timeout_s: 25.0
      grasp_timeout_s: 90.0
      misc_timeout_s: 15.0
      action_retries: 1
      # --- mission queue ------------------------------------------------
      # Commands arriving while a task is busy are queued (FIFO) instead of
      # being rejected; 'stop' always preempts and drains the queue.
      mission_queue_len: 4
      # --- active scan (find behaviour when nothing is in view) -----------
      scan_enabled: true                # rotate the base to search
      scan_arc_deg: 60.0                # total rotation per sweep [deg]
      scan_speed_radps: 0.4             # gentle sweep, mecanum-safe
      scan_max_sweeps: 3                # alternating direction, then FAIL
      # --- speech output --------------------------------------------------
      # Phrases are always published on /eira/speech; when espeak is on
      # PATH they are additionally spoken through the robot speakers.
      tts_enabled: true

  safety_monitor:
    ros__parameters:
      # Watchdog: if the brain heartbeat (/eira/heartbeat, 2 Hz) goes stale
      # while motion commands are still flowing, pin cmd_vel to zero.
      heartbeat_timeout_s: 5.0
      startup_grace_s: 10.0             # no intervention before this
      motion_window_s: 2.0              # 'recent motion' definition
      intervene_rate_hz: 5.0            # zero-Twist rate while intervening

  vision_manager:
    ros__parameters:
      # Model exactly as used by the working folder-31 node.
      model_path: "/home/jetson/yahboomcar_ws/src/yahboom_yolov8/yahboom_yolov8/yolov8/weights/yolov8n.pt"
      target_class: "cup"               # default hunt; /eira/vision_target overrides
      confidence: 0.4                   # folder-31/32 working threshold
      target_frame: "base_link"
      camera_optical_frame: "camera_color_optical_frame"
      depth_roi_half: 3
      min_depth_m: 0.10
      max_depth_m: 3.0
      find_timeout_s: 20.0
      lost_after_s: 1.5
      tf_timeout_s: 0.15

  grasp_executor:
    ros__parameters:
      # --- base alignment (SI rescale of folder-32 PID tuning) ---------
      standoff_dist: 0.19               # pre-grasp range to the target [m]
      dist_tol: 0.03
      yaw_tol: 0.06                     # rad ≈ 3.4°
      max_lin_vel: 0.15
      max_rev_vel: 0.08
      max_ang_vel: 1.2
      lin_kp: 0.5
      lin_kd: 0.1
      ang_kp: 1.2
      ang_kd: 0.05
      settle_ticks: 3
      align_timeout_s: 45.0
      target_timeout_s: 1.5             # pose-gap tolerance (Jetson fps dips)
      stale_grace_ticks: 3              # consecutive stale ticks before abort
      service_wait_s: 5.0               # IK service availability wait
      control_hz: 20.0
      # --- arm frame --------------------------------------------------
      # Preferred: name of the arm base frame in the live TF tree
      # (verify with `ros2 run tf2_tools view_frames`). Empty → the static
      # mount offset below is used instead.
      arm_base_frame: ""
      arm_mount_x: 0.0                  # arm origin in base_link [m]
      arm_mount_y: 0.0
      arm_mount_z: 0.0
      arm_mount_yaw: 0.0
      # --- grasp (folder-23 conventions) --------------------------------
      grasp_x_compensation: -0.015
      grasp_pitch: 1.3962614348313127   # ≈ 80°, audited value
      grasp_joint5: 90
      gripper_open: 90
      gripper_close: 30
      gripper_carry: 115
      arm_runtime_ms: 2000
      init_joints: [90, 140, 20, 10, 90, 180]   # user-set default home pose
      transport_joints: [90, 150, 12, 20, 90, 120]  # folder-23 verbatim
