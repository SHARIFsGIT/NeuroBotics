      tts_enabled: true
      tts_voice: en-us
      tts_timeout_s: 15.0
      sound_feedback: true
      sound_short_ms: 100
      sound_long_ms: 600
      sound_gap_s: 0.15
      sound_queue_size: 32
      tick_hz: 10.0
      heartbeat_hz: 2.0
      scan_min_speed_radps: 0.05
      target_republish_s: 1.0
      grasp_target_refresh_s: 0.5
      max_plan_steps: 64
      nav_server_wait_s: 5.0
      known_object_classes:
