      arm_mount_yaw: 0.0
      static_mount_calibrated: false
      grasp_x_compensation: -0.015
      grasp_pitch: 1.3962614348313127
      grasp_joint5: 90
      gripper_open: 90
      gripper_close: 30
      gripper_carry: 115
      arm_runtime_ms: 2000
      hold_runtime_ms: 100
