# E-AIRA Humble / Python 3.10 / Jetson Orin NX parameters.
# Author: E-AIRA maintainers. Servo angles: degrees; other geometry: SI.
# Evaluation and recording are opt-in launch components.
/**:
  llm_task_planner:
    ros__parameters:
      ollama_url: http://localhost:11434
      llm_model: phi3
      llm_timeout_s: 30.0
      llm_log_raw_response: true
      llm_retries: 1
      llm_retry_backoff_s: 0.25
      llm_temperature: 0.1
      llm_max_tokens: 256
      waypoints_file: ''
      waypoints_file_default: ''
      map_frame: map
      base_frame: base_link
      start_pose_max_age_s: 2.0
      nav_timeout_s: 300.0
      find_timeout_s: 75.0  # Outer budget: cold model startup plus bounded search.
      grasp_timeout_s: 90.0
      misc_timeout_s: 15.0
      action_retries: 1
      nav_retries: 2
      nav_settle_s: 3.0
      nav_retry_delay_s: 10.0
      amcl_check_enabled: true
      amcl_xy_variance_max: 0.5
      amcl_yaw_variance_max: 0.4
