      - hair drier
      - toothbrush
      supported_target_colors:
      - red
      - blue
      - green
      - yellow
      - orange
      - white
      - black
  vision_manager:
    ros__parameters:
      model_path: /home/jetson/yahboomcar_ws/src/yahboom_yolov8/yahboom_yolov8/yolov8/weights/yolov8n.pt
      # Empty: use installed Ultralytics, or infer the bundled source from model_path.
      yolo_source_dir: ''
      # Missions select the object from the user's request; idle has no target.
      target_class: ''
      confidence: 0.4
      color_topic: /camera/color/image_raw
      depth_topic: /camera/depth/image_raw
      camera_info_topic: /camera/color/camera_info
      depth_camera_info_topic: /camera/depth/camera_info
      target_frame: base_link
      camera_optical_frame: camera_color_optical_frame
      sync_slop_s: 2.0  # Maximum color/depth capture-time skew; RGB never waits for depth.
      depth_roi_half: 10
      min_depth_m: 0.1
      max_depth_m: 3.0
      find_timeout_s: 20.0
      lost_after_s: 1.5
      tf_timeout_s: 0.15
      camera_stale_s: 1.5
      max_image_age_s: 5.0
      image_freshness_s: 5.0
      # Use measured RGB-D range for arbitrary requested object classes.
      bbox_depth_enabled: false
      bbox_depth_class: ''  # Optional class with a measured object-height prior.
      real_object_height_m: 0.1
      uint8_depth_scale_m: 0.0
      depth_debug: false
      depth_debug_every_n: 10
      camera_info_max_age_s: 60.0
      depth_registered: true
      max_fps: 8.0
      idle_fps: 2.0
      continuous_mode: false
      request_cache_size: 256
      imgsz: 416
      device: ''
      inference_timeout_s: 5.0
      model_load_timeout_s: 45.0
      model_retries: 2
      retry_backoff_s: 2.0
      smoothing_alpha: 0.65
      smoothing_max_jump_m: 0.3
      track_min_iou: 0.3
      color_min_fraction: 0.25
      tracking_backend: yolo
      tracker_factory: ''
      transformer_model_path: ~/MODELS/tracker/super_track_sim.onnx
      transformer_refresh_frames: 15
      volume_thickness_m: 0.0
      volume_shape: cuboid
      publish_depth_image: false
      depth_view_fps: 2.0
      depth_probe_u: -1
      depth_probe_v: -1
