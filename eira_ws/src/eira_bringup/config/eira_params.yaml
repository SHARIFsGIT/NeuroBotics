      - 0.0
      - 0.0
      - 0.0
      - 0.0
      joint_upper_limits:
      - 180.0
      - 180.0
      - 180.0
      - 180.0
      - 180.0
      - 180.0
      ik_timeout_s: 5.0
      ik_retries: 1
      tf_timeout_s: 0.2
      joint_feedback_timeout_s: 1.0
      joint_tolerance_deg: 5.0
      joint_feedback_is_measured: false
      require_joint_feedback: true
      arm_step_timeout_s: 6.0
      sequence_settle_s: 0.5
      max_pose_age_s: 1.5
      pose_future_tolerance_s: 0.1
      rotation_only_bearing: 0.35
      require_gesture_confirmation: false
      gesture_timeout_s: 15.0
      gripper_mode: fixed
