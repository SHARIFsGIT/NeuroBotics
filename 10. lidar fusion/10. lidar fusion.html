<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10. lidar fusion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#0a0a0a; --bg2:#111111;
  --card:#151515; --card2:#181818; --card3:#1d1d1d;
  --border:#262626; --border2:#303030; --border3:#3a3a3a;
  --text:#e8e8e8; --muted:#a0a0a0; --faint:#6e6e6e;
  --ex:#4fc3f7; --ex-dim:rgba(79,195,247,.09);
  --math:#7ee787; --math-dim:rgba(126,231,135,.08);
  --rb:#ffb454; --rb-dim:rgba(255,180,84,.08);
  --anim:#d2a8ff; --anim-dim:rgba(210,168,255,.08);
  --code-bg:#0d1117; --code-head:#161b22;
  --gutter-txt:#3d4f63; --gutter-line:#1c2530;
  --ok:#3fb950; --bad:#f85149;
  --ff-title:'Space Grotesk','Inter','Hind Siliguri',sans-serif;
  --ff-ui:'Inter','Hind Siliguri',system-ui,-apple-system,sans-serif;
  --ff-bn:'Hind Siliguri','Inter',sans-serif;
  --ff-mono:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --sb-w:292px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--ff-ui); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(79,195,247,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a}
a{color:var(--ex);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ex);outline-offset:2px;border-radius:4px}
button{font-family:var(--ff-ui)}

/* ============ APP LAYOUT ============ */
#app{display:flex;min-height:100vh}
#main{
  margin-left:var(--sb-w);
  flex:1;
  min-width:0;
  padding:52px 56px 80px;
  max-width:1180px;
}
.intro-banner{
  margin-bottom:48px;padding:30px 34px;
  background:linear-gradient(145deg,#141414,#101010);
  border:1px solid var(--border);border-radius:16px;
  position:relative;overflow:hidden;
}
.intro-banner::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(600px 180px at 12% 0%,rgba(79,195,247,.07),transparent 60%),
    radial-gradient(500px 160px at 88% 100%,rgba(210,168,255,.05),transparent 60%);
  pointer-events:none;
}
.intro-eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ex);margin-bottom:10px;
}
.intro-banner h1{
  font-family:var(--ff-title);font-size:clamp(26px,3.4vw,38px);
  font-weight:700;letter-spacing:-.01em;line-height:1.15;
}
.intro-banner h1 .path{color:var(--faint);font-weight:500}
.intro-desc{margin-top:12px;color:var(--muted);max-width:70ch;font-size:15px}
.intro-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stat-chip{
  font-family:var(--ff-mono);font-size:12px;color:#c9d1d9;
  background:#0d1117;border:1px solid var(--border2);
  padding:6px 12px;border-radius:999px;
}
.stat-chip b{color:var(--ex);font-weight:600}

/* ============ SIDEBAR ============ */
#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);
  background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;z-index:60;
  display:flex;flex-direction:column;
}
.sb-head{
  padding:26px 22px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg2);z-index:2;
}
.sb-folder{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;
  color:var(--text);letter-spacing:-.01em;line-height:1.3;
}
.sb-meta{
  margin-top:6px;font-family:var(--ff-mono);font-size:11.5px;
  color:var(--faint);letter-spacing:.08em;
}
#sb-nav{padding:14px 12px 30px;flex:1}
.sb-item{
  display:flex;align-items:baseline;gap:11px;
  padding:8px 12px;margin:1px 0;border-radius:8px;
  color:#9a9a9a;border-left:2px solid transparent;
  transition:background .18s,color .18s;
}
.sb-item .sb-num{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  min-width:20px;font-weight:500;
}
.sb-item .sb-name{
  font-size:13.2px;font-weight:500;line-height:1.35;
  font-family:var(--ff-ui);
}
.sb-item:hover{background:#181818;color:#d6d6d6;text-decoration:none}
.sb-item.active{
  background:linear-gradient(90deg,rgba(79,195,247,.10),rgba(79,195,247,.02));
  color:#eaf6fe;border-left:2px solid var(--ex);
}
.sb-item.active .sb-num{color:var(--ex)}
.sb-filesep{
  font-family:var(--ff-mono);font-size:10px;letter-spacing:.16em;
  color:#525252;text-transform:uppercase;
  padding:14px 12px 6px;margin-top:4px;
}
#menu-btn{
  display:none;position:fixed;top:14px;left:14px;z-index:80;
  width:42px;height:42px;border-radius:10px;
  background:#181818;border:1px solid var(--border2);color:var(--text);
  font-size:15px;cursor:pointer;line-height:1;
  align-items:center;justify-content:center;padding:0;
}
#sb-overlay{display:none}

/* ============ PART SECTION ============ */
.part{margin-bottom:88px;scroll-margin-top:24px}
.part-head{margin-bottom:22px}
.eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ex);margin-bottom:8px;
}
.part-title{
  font-family:var(--ff-title);font-size:clamp(23px,2.6vw,31px);
  font-weight:700;letter-spacing:-.015em;line-height:1.18;
  margin-bottom:12px;
}
.part-meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-family:var(--ff-mono);font-size:12px;color:var(--muted);
}
.meta-chip{
  background:#101418;border:1px solid var(--border2);
  padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.meta-chip.flag{color:#d8c97a;border-color:#3a3524;background:#17150d}
.meta-chip.lang{color:#8ab4f8}

/* ============ CODE CARD ============ */
.code-card{
  background:var(--code-bg);border:1px solid var(--border2);
  border-radius:13px;overflow:hidden;margin-bottom:30px;
  box-shadow:0 14px 40px rgba(0,0,0,.42);
}
.code-card-head{
  display:flex;align-items:center;gap:14px;
  background:var(--code-head);border-bottom:1px solid #20262e;
  padding:10px 16px;
}
.dots{display:flex;gap:7px;align-items:center}
.dots i{
  width:11px;height:11px;border-radius:50%;display:block;
}
.dots i:nth-child(1){background:#ff5f57}
.dots i:nth-child(2){background:#febc2e}
.dots i:nth-child(3){background:#28c840}
.code-fname{
  font-family:var(--ff-mono);font-size:12.5px;color:#9aa7b4;
  letter-spacing:.02em;
}
.code-lines-chip{
  font-family:var(--ff-mono);font-size:11px;color:#5b6875;
  margin-left:auto;white-space:nowrap;
}
.copy-btn{
  font-family:var(--ff-mono);font-size:11px;letter-spacing:.06em;
  color:#9aa7b4;background:#1c2128;border:1px solid #2d333b;
  border-radius:6px;padding:4px 11px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.copy-btn:hover{color:#e6edf3;border-color:#444c56}
.copy-btn.done{color:var(--ok);border-color:rgba(63,185,80,.4)}
.code-scroll{overflow-x:auto;max-height:640px;overflow-y:auto}
pre.code{display:inline-block;min-width:100%;padding:14px 0;font-family:var(--ff-mono)}
.cl{display:flex;white-space:pre;font-size:13.2px;line-height:1.62}
.cln{
  position:sticky;left:0;flex:0 0 auto;z-index:2;
  min-width:52px;text-align:right;padding-right:16px;
  color:var(--gutter-txt);background:var(--code-bg);
  border-right:1px solid var(--gutter-line);
  user-select:none;-webkit-user-select:none;font-size:11.5px;
  line-height:1.85;letter-spacing:.02em;
}
.cl.target .cln{
  background:#101722;color:#7ba3c9;border-right-color:#234;
}
.clc{flex:0 0 auto;padding-right:24px;tab-size:8;color:#e6edf3}
.tok-kw{color:#ff7b72}
.tok-str{color:#a5d6ff}
.tok-com{color:#8b949e;font-style:italic}
.tok-num{color:#79c0ff}
.tok-fn{color:#d2a8ff}
.tok-blt{color:#ffa657}

/* ============ SECTIONS ============ */
.sec{
  border:1px solid var(--border);border-radius:13px;
  background:var(--card);margin-bottom:26px;overflow:hidden;
}
.sec-head{
  display:flex;align-items:center;gap:12px;
  padding:15px 22px;border-bottom:1px solid var(--border);
  background:var(--card2);
}
.badge{
  font-family:var(--ff-mono);font-weight:700;font-size:12px;
  min-width:34px;height:26px;border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;
  letter-spacing:.03em;flex:0 0 auto;
}
.badge-ex{background:var(--ex-dim);color:var(--ex);border:1px solid rgba(79,195,247,.35)}
.badge-math{background:var(--math-dim);color:var(--math);border:1px solid rgba(126,231,135,.35)}
.badge-rb{background:var(--rb-dim);color:var(--rb);border:1px solid rgba(255,180,84,.35)}
.badge-anim{background:var(--anim-dim);color:var(--anim);border:1px solid rgba(210,168,255,.35)}
.sec-head h3{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;letter-spacing:-.01em;
}
.sec-head h3 .bn-inline{font-family:var(--ff-bn)}
.sec-body{padding:20px 22px 24px}

/* ============ EXPLAIN ENTRIES ============ */
.ex-entry{margin-bottom:26px}
.ex-entry:last-child{margin-bottom:6px}
.ex-snippet{
  background:#0d1117;border:1px solid var(--border2);border-left:3px solid var(--ex);
  border-radius:9px;overflow:hidden;
}
.ex-snippet pre{
  padding:10px 16px;font-family:var(--ff-mono);font-size:12.8px;
  line-height:1.62;color:#dbe4ee;overflow-x:auto;white-space:pre;
}
.ex-lines{
  display:inline-block;font-family:var(--ff-mono);font-size:10.5px;
  color:var(--ex);background:var(--ex-dim);border:1px solid rgba(79,195,247,.3);
  border-radius:5px;padding:1px 8px;margin-bottom:7px;letter-spacing:.06em;
}
.ex-arrow{
  color:#3a471f;font-family:var(--ff-mono);font-size:15px;color:var(--faint);
  padding:3px 2px 3px 12px;
}
.ex-text{
  font-family:var(--ff-bn);font-size:16px;line-height:1.95;color:#d5d5d5;
  padding:2px 4px 0 14px;border-left:2px solid #232d36;
}
.ex-text code, .bn code, .ml-text code, .map-text code, .rb-card code, .anim-caption code{
  font-family:var(--ff-mono);font-size:.86em;color:#9ecbff;
  background:rgba(110,168,254,.10);border:1px solid rgba(110,168,254,.16);
  border-radius:5px;padding:1px 6px;white-space:nowrap;
}
.ex-text ul, .ml-text ul, .rb-card ul, .anim-caption ul{
  margin:8px 0 4px 4px;padding-left:22px;
}
.ex-text li, .ml-text li, .rb-card li{margin:5px 0}

/* ============ MATH SECTION ============ */
.math-intro{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
  padding-bottom:16px;border-bottom:1px dashed var(--border2);margin-bottom:20px;
}
.math-level{
  background:var(--card2);border:1px solid var(--border2);border-radius:11px;
  padding:16px 20px;margin-bottom:14px;
}
.ml-label{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--math);margin-bottom:10px;
}
.mathy{
  font-size:17px;color:#e3ffe6;margin:8px 0 12px;
  padding:12px 16px;background:rgba(126,231,135,.05);
  border:1px solid rgba(126,231,135,.16);border-radius:9px;
  overflow-x:auto;min-height:24px;
}
.ml-text{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
}
.math-subhead{
  font-family:var(--ff-title);font-size:14.5px;font-weight:600;color:#bfe8c4;
  margin:26px 0 12px;letter-spacing:.01em;
}
.map-row{
  display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(180px,1fr) minmax(220px,1.4fr);
  gap:12px;align-items:start;
  background:var(--card2);border:1px solid var(--border2);border-radius:10px;
  padding:12px 16px;margin-bottom:10px;
}
.map-code code{
  font-family:var(--ff-mono);font-size:12.5px;color:#9ecbff;background:#0d1117;
  border:1px solid var(--border2);border-radius:6px;padding:3px 8px;display:inline-block;
}
.map-math{color:#c9f7cf;font-family:var(--ff-mono);font-size:13.5px;padding-top:2px}
.map-text{font-family:var(--ff-bn);font-size:14.5px;line-height:1.8;color:#bcbcbc}
.failure-list li{
  font-family:var(--ff-bn);font-size:15px;line-height:1.85;color:#d9c9c9;
  margin:8px 0;padding-left:6px;list-style:none;position:relative;padding-left:22px;
}
.failure-list li::before{
  content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;
  border-radius:2px;background:rgba(248,81,73,.5);border:1px solid rgba(248,81,73,.65);
}
.failure-list{padding:0}

/* ============ ROBOT SECTION ============ */
.rb-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rb-card{
  border-radius:11px;padding:16px 18px;border:1px solid var(--border2);
  font-family:var(--ff-bn);font-size:15.3px;line-height:1.9;
}
.rb-card h4{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:10px;font-weight:600;
}
.rb-ok{background:rgba(63,185,80,.05);border-color:rgba(63,185,80,.28)}
.rb-ok h4{color:var(--ok)}
.rb-bad{background:rgba(248,81,73,.05);border-color:rgba(248,81,73,.28)}
.rb-bad h4{color:var(--bad)}

/* ============ ANIMATION SECTION ============ */
.anim-stage{
  background:
    radial-gradient(500px 200px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  border-bottom:1px solid var(--border2);
  padding:10px;position:relative;
}
.anim-stage svg{width:100%;height:auto;display:block}
.anim-controls{
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--border);background:var(--card2);
}
.ac-btn{
  font-family:var(--ff-mono);font-size:12px;letter-spacing:.08em;
  color:#c9c9c9;background:#202020;border:1px solid var(--border3);
  border-radius:8px;padding:7px 18px;cursor:pointer;transition:all .15s;
}
.ac-btn:hover{background:#2a2a2a;color:#fff;border-color:#4a4a4a}
.ac-btn.active{background:rgba(210,168,255,.14);color:var(--anim);border-color:rgba(210,168,255,.45)}
.anim-caption{
  font-family:var(--ff-bn);font-size:15px;line-height:1.8;color:#d0c4dd;
  padding:13px 22px;border-bottom:1px solid var(--border);min-height:52px;
  background:rgba(210,168,255,.03);
}
.anim-formula{
  font-family:var(--ff-mono);font-size:14px;color:#e6d9f5;
  padding:12px 22px;background:#0d1117;min-height:46px;
  overflow-x:auto;white-space:nowrap;letter-spacing:.01em;
}
.anim-formula .fx-hl{color:var(--anim)}
.anim-formula .fx-ok{color:var(--math)}
.anim-formula .fx-warn{color:var(--rb)}
.anim-state{
  margin-left:auto;font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.1em;
}

/* ============ PART NAV ============ */
.part-nav{display:flex;justify-content:space-between;gap:14px;margin-top:34px}
.pn-btn{
  flex:1;max-width:340px;display:block;
  border:1px solid var(--border2);border-radius:11px;
  padding:13px 18px;color:#c9c9c9;transition:all .16s;
  background:var(--card);
}
.pn-btn:hover{border-color:rgba(79,195,247,.4);color:#fff;text-decoration:none;background:#181818}
.pn-btn .pn-dir{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.14em;display:block;margin-bottom:3px;
}
.pn-btn .pn-title{font-size:13.5px;font-weight:600}
.pn-btn.next{text-align:right}
.pn-btn.disabled{opacity:.28;pointer-events:none}

/* ============ FOOTER ============ */
.site-footer{
  margin-left:var(--sb-w);border-top:1px solid var(--border);
  padding:26px 56px;color:var(--faint);font-size:13px;
  font-family:var(--ff-mono);letter-spacing:.02em;
}

/* ============ MATHJAX FALLBACK ============ */
body.no-mathjax .mathy{
  font-family:var(--ff-mono);font-size:13.5px;color:#c9f0cd;white-space:pre;
}

/* ============ RESPONSIVE ============ */
@media (max-width:1240px){
  #main{padding:44px 34px 70px}
  .site-footer{padding:24px 34px}
}
@media (max-width:960px){
  #menu-btn{display:block}
  #sidebar{
    transform:translateX(-100%);transition:transform .26s ease;
    box-shadow:24px 0 60px rgba(0,0,0,.5);
  }
  body.sb-open #sidebar{transform:translateX(0)}
  body.sb-open #sb-overlay{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;
  }
  #main{margin-left:0;padding:74px 20px 60px}
  .site-footer{margin-left:0;padding:22px 20px}
  .rb-grid{grid-template-columns:1fr}
  .map-row{grid-template-columns:1fr;gap:6px}
  .intro-banner{padding:22px 20px}
}
@media (max-width:560px){
  body{font-size:15px}
  .ex-text{font-size:15.3px}
  .cl{font-size:12.3px}
  .anim-formula{font-size:12.5px}
  .code-lines-chip{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}
</style>


<style id="refine-style">
/* ==================================================================
   SURGICAL REFINEMENT LAYER v2 — appended (UI-UX & animation refinement)
   Does not override any existing rule except where explicitly noted;
   all original bytes above this block are untouched.

   INTENTIONAL LAYER ARCHITECTURE (documented z-index scale)
   ---------------------------------------------------------
     --z-ground  0   page ground, card backgrounds
     --z-scene  10   base SVG scene inside .anim-stage / .exec-robot
     --z-objects 20  moving SVG marks (updated in place by the engine)
     --z-labels 30   SVG text labels — halo-stroked so they can never
                     become unreadable under moving objects
     --z-panel  40   overlay panels (formula bar, debug chips)
     --z-head   50   section headers, captions
     --z-debug  60   live debug readouts
     --z-ctrl   70   control bars (always clickable, never covered)
     --z-nav    80   sidebar / menu
     --z-focus  90   focus outlines (never overlapped)
   HTML layers take these values; inside a single <svg> stacking is by
   paint order, and readability of labels is guaranteed by the
   paint-order halo rule below rather than by z-index.
   ================================================================== */
:root{
  --z-ground:0; --z-scene:10; --z-objects:20; --z-labels:30;
  --z-panel:40; --z-head:50; --z-debug:60; --z-ctrl:70; --z-nav:80; --z-focus:90;
}

/* ---- Fix: full-width application shell (#56-57).
        #main keeps its sidebar margin but drops the narrow max-width;
        prose blocks below keep a readable measure so lines never run
        wall-to-wall — only layout containers use the full width. ---- */
#main{max-width:none}
.intro-desc{max-width:none}          /* hero paragraph: full hero width */
.ex-text, .ml-text, .math-intro, .map-text, .rb-card, .exec-note,
.anim-caption{
  max-width:105ch;
}
@media (min-width:1800px){
  #main{padding-left:88px; padding-right:88px}
}

/* ---- Fix: SVG text labels stay readable over moving objects.
        Halo = stage-ground-coloured stroke painted UNDER the fill. ---- */
.anim-stage svg text,
.exec-robot svg text{
  paint-order:stroke; stroke:#0b0e13; stroke-width:3px;
  stroke-linejoin:round; stroke-linecap:round;
  pointer-events:none; user-select:none;
}
.anim-stage, .exec-robot{position:relative; z-index:var(--z-scene)}
.anim-controls{position:relative; z-index:var(--z-ctrl)}
.anim-caption{position:relative; z-index:var(--z-head)}
.anim-formula{position:relative; z-index:var(--z-panel)}
.anim-state{z-index:var(--z-debug)}

/* ---- Fix: icon control buttons (professional inline SVG, no text) ---- */
.anim-controls{gap:8px}
.ac-btn.ic{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:32px; padding:0; border-radius:8px;
}
.ac-btn.ic svg{width:16px; height:16px; display:block; fill:currentColor}
.ac-btn.ic svg *{vector-effect:non-scaling-stroke}
.ac-btn:focus-visible{
  outline:2px solid var(--anim); outline-offset:2px; z-index:var(--z-focus);
}
.ac-btn.ic[disabled]{opacity:.35; cursor:not-allowed}
.anim-controls .ac-sep{
  width:1px; height:20px; background:var(--border3); margin:0 3px; flex:0 0 auto;
}
.anim-controls .ac-step{
  font-family:var(--ff-mono); font-size:11px; color:var(--anim);
  letter-spacing:.08em; padding:6px 10px; border:1px solid rgba(210,168,255,.28);
  border-radius:7px; background:var(--anim-dim); white-space:nowrap;
}

/* ---- Complete Execution — Code → Debug → Robot (v2 row layout) ----
   Row 1: COMPLETE SOURCE CODE | LIVE DEBUG   (the two walk together)
   Row 2: ROBOT / SYSTEM STATE (full width)
   Then:  complete banner → formula → explanation → controls      */
.exec-sec{margin-top:56px}
.exec-sec .sec-head .exec-sub{
  font-family:var(--ff-mono); font-size:11px; color:var(--faint);
  letter-spacing:.06em; margin-left:auto; padding-right:18px; white-space:nowrap;
}
.exec-note{
  font-family:var(--ff-bn); font-size:14.5px; line-height:1.8; color:var(--muted);
  padding:14px 22px; border-bottom:1px solid var(--border); background:var(--card);
}
.exec-note code{
  font-family:var(--ff-mono); font-size:.86em; color:#9ecbff;
  background:rgba(110,168,254,.10); border:1px solid rgba(110,168,254,.16);
  border-radius:5px; padding:1px 6px;
}
.exec-frame{
  display:grid; gap:14px; padding:16px 18px;
  grid-template-columns:minmax(0,1.42fr) minmax(330px,.72fr);
}
.exec-col{min-width:0; display:flex; flex-direction:column; gap:14px}
.exec-col>.exec-panel{flex:1}
/* robot/system row spans the full frame width, below code+debug */
.exec-col.rob-col{grid-column:1 / -1}
.exec-panel{
  background:var(--code-bg); border:1px solid var(--border2); border-radius:12px;
  overflow:hidden; display:flex; flex-direction:column; min-height:0;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}
/* scroll affordance: right-edge fade says "more code this way" without
   covering anything interactive (head stays above it via z-index) */
.exec-col.code-col .exec-panel{position:relative}
.exec-col.code-col .exec-panel::after{
  content:""; position:absolute; top:0; right:0; bottom:0; width:26px;
  z-index:1; pointer-events:none;
  background:linear-gradient(90deg, rgba(13,17,23,0), #0d1117 92%);
}
.exec-panel-head{
  position:relative; z-index:2;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--code-head); border-bottom:1px solid #20262e; padding:9px 14px;
}
.exec-panel-head .ep-title{
  font-family:var(--ff-title); font-size:13px; font-weight:600; color:#c9d1d9;
  letter-spacing:.01em;
}
.exec-panel-head .ep-chip{
  font-family:var(--ff-mono); font-size:10px; letter-spacing:.05em;
  border-radius:999px; padding:2.5px 9px; white-space:nowrap;
}
.ep-chip.live{color:var(--anim); background:var(--anim-dim); border:1px solid rgba(210,168,255,.3)}
.ep-chip.concept{color:var(--rb); background:var(--rb-dim); border:1px solid rgba(255,180,84,.3)}
.ep-chip.src{color:var(--ex); background:var(--ex-dim); border:1px solid rgba(79,195,247,.3)}
/* kind legend in the code panel head: exec / structural / event */
.exec-legend{
  margin-left:auto; display:inline-flex; align-items:center; gap:5px;
  font-family:var(--ff-mono); font-size:9.5px; color:var(--faint); white-space:nowrap;
}
.exec-legend .lg{
  width:9px; height:9px; border-radius:3px; display:inline-block;
  margin-left:6px;
}
.exec-legend .lg-exec{background:#d2a8ff}
.exec-legend .lg-struct{background:#ffb454}
.exec-legend .lg-event{background:#4fc3f7}
.exec-code{
  position:relative; overflow:auto; flex:1; min-height:0;
  max-height:620px; margin:0; padding:10px 0 28px;
  font-family:var(--ff-mono); font-size:12.3px; line-height:1.6; color:#dbe4ee;
  background:var(--code-bg); tab-size:4;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.exec-code .exl{
  display:block; white-space:pre; min-height:1.6em;
  padding:0 12px 0 0; border-left:3px solid transparent;
  transition:background .2s, border-color .2s;
}
/* line-number gutter stays pinned when long lines scroll horizontally */
.exec-code .eln{
  position:sticky; left:0;
  display:inline-block; width:3.6em; padding-right:10px;
  text-align:right; color:#3d4f63; user-select:none;
  background:var(--code-bg);
}
/* current line, by kind: exec = purple (default), structural = amber,
   event = cyan; grouped companion lines get the tint without the edge */
.exec-code .exl.cur{
  background:rgba(210,168,255,.14); border-left-color:var(--anim);
}
.exec-code .exl.cur .eln{color:var(--anim); background:#241d38}
.exec-code .exl.cur-struct{
  background:rgba(255,180,84,.13); border-left-color:var(--rb);
}
.exec-code .exl.cur-struct .eln{color:var(--rb); background:#2e2416}
.exec-code .exl.cur-event{
  background:rgba(79,195,247,.14); border-left-color:var(--ex);
}
.exec-code .exl.cur-event .eln{color:var(--ex); background:#12283a}
.exec-code .exl.cur-g{background:rgba(210,168,255,.06)}
.exec-code .exl.cur-g.cur-struct{background:rgba(255,180,84,.07)}
.exec-code .exl.cur-g.cur-event{background:rgba(79,195,247,.07)}
/* ---- BEFORE → OPERATION → AFTER debug (#52) ---- */
.exec-op{
  margin:10px 12px 0; padding:8px 12px; border-radius:9px;
  border:1px solid rgba(126,231,135,.32); background:rgba(126,231,135,.07);
  font-family:var(--ff-mono); font-size:11.8px; line-height:1.65; color:#7ee787;
  overflow-wrap:anywhere;
}
.exec-op::before{
  content:"OPERATION";
  display:block; font-size:9px; letter-spacing:.14em; color:#58a65f;
  margin-bottom:3px;
}
.exec-dbg-body{
  padding:10px 14px 14px; overflow:auto; max-height:620px; flex:1; min-height:0;
  font-family:var(--ff-mono); font-size:12px;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.dbg-row{
  display:flex; align-items:baseline; gap:10px; padding:5.5px 8px;
  border-bottom:1px dashed #1c2530; animation:dbgIn .3s ease;
}
.dbg-row:last-child{border-bottom:none}
.dbg-k{color:var(--muted); white-space:nowrap; flex:0 0 auto}
.dbg-v{color:#9ecbff; text-align:right; flex:1; overflow-wrap:anywhere;
  padding-right:2px}
.dbg-v.n{color:#7ee787}
.dbg-v.err{color:var(--bad)}
/* value changed by this line: old (dim) → new (green) */
.dbg-row.chg .dbg-v{color:#7ee787}
.dbg-old{color:#6e7681; text-decoration:line-through;
  text-decoration-color:rgba(110,118,129,.6)}
.dbg-arrow{color:#7ee787; font-weight:600}
.dbg-ill{
  flex:0 0 auto; font-size:9.5px; letter-spacing:.05em; color:var(--rb);
  border:1px solid rgba(255,180,84,.35); border-radius:5px; padding:1px 5px;
}
.dbg-empty{color:var(--faint); font-family:var(--ff-bn); font-size:13px; padding:12px 8px}
@keyframes dbgIn{from{opacity:0; transform:translateX(-4px)}to{opacity:1}}
/* robot row: centered scene, taller than the old side column */
.exec-robot{
  background:
    radial-gradient(500px 220px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  padding:14px; overflow:auto;
  display:flex; justify-content:center;
}
.exec-robot svg{width:100%; max-width:720px; height:auto; max-height:560px;
  display:block; margin:0 auto}
.exec-rob-fade{animation:robFade .4s ease}
@keyframes robFade{from{opacity:0; transform:translateY(4px)}to{opacity:1}}
/* result zone: complete banner → formula row → explanation → controls */
.exec-complete{
  display:none; margin:0 18px 14px; padding:13px 18px; border-radius:11px;
  border:1px solid rgba(63,185,80,.4); background:rgba(63,185,80,.08);
  font-family:var(--ff-mono); font-size:12.5px; letter-spacing:.04em; color:#7ee787;
}
.exec-complete.show{display:block; animation:robFade .4s ease}
.exec-complete .bn{font-family:var(--ff-bn); font-size:14px; color:#c9d1d9;
  letter-spacing:0; margin-top:5px; line-height:1.75}
.exec-fx-row{margin:0 18px 14px; max-width:none}
.exec-sec .anim-caption{margin:0 18px 4px}
.exec-sec .anim-controls{margin:0 18px 18px}
.exec-progress{
  height:3px; margin:0 18px 22px; border-radius:2px; overflow:hidden;
  background:rgba(255,255,255,.06);
}
.exec-progress i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--anim),#7ee787);
  transition:width .3s ease;
}

/* responsive: code+debug share row 1 until 960px, robot row always full
   width; below 960px everything stacks vertically (#59 mobile order) */
@media (max-width:1240px){
  .exec-frame{grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr)}
  .exec-code{max-height:540px}
  .exec-dbg-body{max-height:540px}
}
@media (max-width:960px){
  .exec-frame{grid-template-columns:minmax(0,1fr); padding:12px}
  .exec-code{max-height:430px}
  .exec-dbg-body{max-height:300px}
  .exec-robot svg{max-height:440px}
  .exec-legend{display:none}
}
@media (max-width:560px){
  .exec-sec .sec-head .exec-sub{display:none}
  .exec-frame{padding:10px}
  .anim-controls{padding:11px 14px}
}
@media (prefers-reduced-motion:reduce){
  .exec-rob-fade, .dbg-row{animation:none}
  .exec-code .exl{transition:none}
  .exec-progress i{transition:none}
}

cription():","    # These lists will hold extra settings we want to pass to ROS 2","    declared_arguments = []","    declared_env_vars = []","    declared_parameters = []","","    # --- 1. SETTING UP A LAUNCH ARGUMENT ---","    # We want to tell the robot where to find its configuration file (a YAML file).","    # We create a variable called 'params_file' to hold this path.","    params_file = LaunchConfiguration(\"params_file\")","","    # Declare that 'params_file' is a valid argument someone can type in the terminal.","    declared_arguments.append(","        DeclareLaunchArgument(","            \"params_file\",","            # If the user doesn't provide a file, use this default one:","            default_value=os.path.join(","                get_package_share_directory(\"ira_laser_tools\"), # Look in the ira_laser_tools package","                \"config\",                                        # Go into the config folder","                \"laserscan_merge.yaml\",                           # Find this file","            ),","            description=\"Path to param config in yaml format\",","        )","    )","    ","","    # --- 2. THE LASER MERGER NODE ---","    # This is the program that takes multiple laser scans and merges them into one!","    laser_merge = Node(","        package=\"ira_laser_tools\",                  # The package containing the merger","        executable=\"laserscan_multi_merger\",        # The program that does the merging","        name=\"laserscan_multi_merger\",              # Give it this name in the ROS 2 network","        parameters=[params_file],                   # Feed it the YAML config file we set up above!","    )","","    # --- 3. THE VISUAL DISPLAY (RVIZ) ---","    # Find the path to another launch file called 'display.launch.py' inside the 'M3Pro' package.","    display_launch_file = os.path.join(","        get_package_share_directory('M3Pro'),","        'launch',","        'display.launch.py'","    )","","    ","    # --- 4. THE FINAL LIST ---","    # Put everything we want to launch into one big list.","    # 1. IncludeLaunchDescription starts the display file (usually opens RViz, the 3D visualizer).","    # 2. laser_merge starts the radar stitching program.","    nodes = [ IncludeLaunchDescription(PythonLaunchDescriptionSource(display_launch_file)), laser_merge]","    ","","    # Hand the list back to ROS 2 to start everything at once.","    # We combine the arguments, parameters, env vars, and nodes into one final LaunchDescription.","    return LaunchDescription(","        declared_parameters + declared_arguments + declared_env_vars + nodes","    )"]};
const PARTS = [{"n":1,"id":"part-01","fname":"README.md","enTitle":"Runbook — Six Commands","lang":"bash","start":1,"end":11,"flags":[],"explain":[{"a":1,"b":1,"text":"Runbook-এর প্রথম command: <code>sh start_agent.sh<\/code>। <code>sh<\/code> হলো shell — এর পরের নামটা যে script file চালাবে, সেটা বর্তমান directory-র <code>start_agent.sh<\/code>। এই scriptটি কোনো folder-এর ভেতরে নেই — vendor-এর agent bringup, তাই এর ভেতরের কাজ এখানে <i>illustrative<\/i>: base-এর driver, দুটি lidar-এর driver ইত্যাদি একসাথে উঠে যায় আর hardware-এর raw scan topic-গুলো প্রবাহিত হতে শুরু করে। এই ধাপ ছাড়া পরের <code>ros2 launch<\/code>-গুলো দৌড়াবে ঠিকই, কিন্তু merger-এর পাওয়ার কাছে কোনো input scan-ই থাকবে না — fusion-এর কাঁচামালই জম্ম হয় এখানে। ফোল্ডার 11-এর README-ও একই script দিয়ে শুরু হয় — এটাই এই stack-এর \"robot জাগাও\" ধাপ।"},{"a":3,"b":3,"text":"দ্বিতীয় command এই folder-এর মূল খেলা: <code>ros2 launch ira_laser_tools merge_multi.launch.py<\/code>। <code>ros2 launch<\/code> হলো launch-file runner — প্রথম token-এ package-এর নাম <code>ira_laser_tools<\/code>, দ্বিতীয়টা সেই package-র share directory-র ভেতরের launch file-এর নাম। এই এক command-এর ভেতরে দুইটি phase লুকিয়ে আছে: প্রথমে launch machinery file-টাকে import করে <code>generate_launch_description()<\/code> কে ডাকে (constructor phase — lineগুলো উপর-নিচে ক্রমে চলে), তারপর ফেরত-পাওয়া action list-টা একে একে execute করে (run phase)। Part 4-9 ওই দ্বিতীয় source file-টাকেই line-by-line খোলে।"},{"a":5,"b":5,"text":"তৃতীয় command: <code>rviz2<\/code> — কোনো argument ছাড়া bare invocation। প্রথম rviz2-এর কাজ হলো merge-এর ফল চোখে দেখা: LaserScan display যোগ করে merged topic-টি বসাতে হবে (topic-এর নাম merger-এর yaml config-এ থাকে — এই folder-এ নেই), আর Fixed Frame হবে yaml-এর destination frame। সব ঠিক থাকলে viewport-এ ভেসে উঠবে পূর্ণ 360-degree point ring — দুই lidar-এর আলাদা আলাদা অর্ধবৃত্ত জুড়ে একটাই বৃত্ত। rviz2 নিজে passive listener: subscribe ছাড়া আর কিছু করে না, robot-এর কোনো state বদলায় না।"},{"a":7,"b":7,"text":"চতুর্থ command: <code>ros2 launch yahboom_laser_filter laser_filter_node.launch.py<\/code> — এই folder-এর প্রথম source file-টা এবার চালু হলো (Part 2-3)। কাজ: angle-window filter। parameter হিসেবে <code>angle_min<\/code> আর <code>angle_max<\/code> পায়, আর merged scan-এর প্রতিটি beam-কে রাখে কেবল সেই কোণ-জানালার ভেতরে। এখানে জানালাটা পুরো বৃত্ত, তাই আসলে কিছুই বাদ পড়ে না — filter-টা pass-through। এই launch file-টা ছোট হলেও গঠনগত ভাবে বড় file-টারই ছায়া: একই entry point, একই <code>Node(...)<\/code> pattern, শুধু parameter inline dict-এ।"},{"a":9,"b":9,"text":"পঞ্চম command আবার <code>rviz2<\/code> — এবার filter-এর পরের দৃশ্য দেখতে। প্রথম rviz2-এর সাথে তুলনা করাই আসল শিক্ষা: window পুরো বৃত্ত থাকায় দুই viewport-এ ring হুবহু এক — এটাই প্রত্যাশিত, bug নয়। কিন্তু যেদিন robot-এর নিজের arm পেছনের beam ছুঁয়ে ফেলবে বা rear lidar খারাপ হবে, সেদিন <code>{'angle_min': -90.0, 'angle_max': 90.0}<\/code> করলে এই দ্বিতীয় rviz2-তেই পেছনের অংশ কেটে যাওয়া ring দেখা যাবে। Runbook-এ একই tool দুবার রাখার কারণ: merge-এর পরে আর filter-করার পরে — দুই স্তরে আলাদা ভাবে যাচাই।"},{"a":11,"b":11,"text":"শেষ command: <code>ros2 run rqt_graph rqt_graph<\/code>। লক্ষ করুন এটা <code>ros2 launch<\/code> নয় — <code>ros2 run<\/code> সরাসরি একটা executable তুলে আনে, launch file ছাড়াই; প্রথম token-টা package (<code>rqt_graph<\/code>), দ্বিতীয়টা সেই package-র executable (নাম দুটো এখানে এক)। এই ধাপ পুরো runbook-এর যাচাই-কেন্দ্র: graph-এ দেখা কথা — দুটি raw scan topic ঢুকছে <code>laserscan_multi_merger<\/code>-এ, তার merged output ঢুকছে <code>laser_filter_node<\/code>-এ, তার পরের output খাচ্ছে পরের node-রা (folder 11-এর avoidance এই শেষ ধাপের ভোক্তা)। Edge কোনোটা না দেখলে বোঝা যায় yaml বা নাম-মিলানো কোথাও ভেঙে আছে — এটাই debugging-এর দরজা।"}],"math":null,"robot":{"correct":"Runbook ক্রমে চললে: <code>sh start_agent.sh<\/code>-এ দুই lidar-এর driver ওঠে, raw scan দুটি স্রোত হয়ে বয়ে যায়; <code>merge_multi.launch.py<\/code> merger আর display তোলে; প্রথম <code>rviz2<\/code>-তে পূর্ণ 360-degree ring ভেসে ওঠে; filter launch-এর পরে দ্বিতীয় <code>rviz2<\/code>-তে সেই একই ring (window পুরো বৃত্ত); শেষে <code>rqt_graph<\/code> দেখায় raw-topic দুটি থেকে merger, তার থেকে filter — পুরো chain এক নজরে।","incorrect":"ক্রম ভাঙলে বিপদ নীরব: agent ছাড়া launch দিলে merger উঠেও কোনো scan পায় না — graph-এ সে একা দাঁড়িয়ে, rviz2-তে ফাঁকা viewport; merge-এর আগে filter চালালে সে পড়বে এখনো-না-বানানো topic, rqt_graph-এ কাটা পাইপ; rqt_graph বাদ দিলে yaml-এর ভুল topic-নাম কেউ ধরতেই পারে না — প্রতিটি ধাপ তার পরের ধাপের ভোক্তা, তাই ক্রম এই runbook-এর মেরুদণ্ড।"},"animType":"runbookFlow"},{"n":2,"id":"part-02","fname":"laser_filter_node.launch.py","enTitle":"Filter Launch — Imports & Entry Point","lang":"python","start":1,"end":7,"flags":[],"explain":[{"a":1,"b":3,"text":"প্রথম line-টা comment (<code># --- IMPORTING ROS 2 LAUNCH TOOLS ---<\/code>) — এখানে শুধু সাজানোর শিরোনাম নয়, একটা ঘোষণা: নিচের import-গুলো কার ভাগের। তারপর দুটি import: <code>from launch import LaunchDescription<\/code> — container class, যার ভেতরে সব action-এর list জমা হয়ে যাবে; আর <code>from launch_ros.actions import Node<\/code> — একটা ROS process তোলার action। খেয়াল রাখুন ভাগ দুটো আলাদা package-এ: <code>launch<\/code> হলো সাধারণ framework (file পড়া, action চালানো), <code>launch_ros<\/code> হলো ROS-নির্দিষ্ট অংশ (node প্রসেস)। এই ভাগের সুবিধা: একই framework অন্য middleware-ও চালাতে পারে। File-টা ছোট হলেও এই দুই নামই পরের সব লাইনের আকার ঠিক করে দেয়।"},{"a":5,"b":5,"text":"<code>def generate_launch_description():<\/code> — ROS 2 launch-এর সাথে এই file-এর চুক্তির নাম। <code>ros2 launch<\/code> যখন এই file-টা খোলে, তখন সে (১) file-টাকে Python module হিসেবে import করে, (২) ঠিক এই নামের function-টা খুঁজে ডাকে, (৩) ফেরত-পাওয়া object-টাকে নিয়ে চলে যায়। নামটা বদলালে বা বাদ দিলে launch দাঁড়িয়ে যাবে — error বলবে function-টা পাচ্ছে না। Function-এর ভেতরের code তখনই চলে যখন ডাকা হয় — মানে ফাইল import হওয়া মাত্রই কিছু চালু হয়ে যায় না; <code>ros2 launch<\/code> ছাড়া এই file-টা নিছক একটা definition। বড় file-টাতেও (merge_multi) ঠিক এই একই চুক্তি।"},{"a":6,"b":7,"text":"L6-এর comment বলে দিচ্ছে উদ্দেশ্য: \"list-টা ROS 2-কে ফিরিয়ে দিচ্ছি শুরু করার জন্য\" — আর L7 সেটাই করে: <code>return LaunchDescription([...])<\/code>। এই <code>return<\/code>-এর মুহূর্তটা মনে রাখার মতো: এখানে কোনো lidar, কোনো process, কোনো subscription — কিছুই চালু হয়নি। তৈরি হলো শুধু একটা বিবরণ-object, যার ভেতরে বলা আছে \"পরে যখন চালাবে, এই কাজগুলো করো\"। List-এর ভেতরে এখন একটাই action (পরের Part-এর <code>Node(...)<\/code>) — তবু বন্ধনীর গঠন এখনই শেখা দরকার, কারণ বড় launch file-গুলোতে এই একই গঠনে দশটা action বসে যায়।"}],"math":null,"robot":{"correct":"এই তিন-ইম্পোর্ট কাঠামোতে <code>ros2 launch yahboom_laser_filter laser_filter_node.launch.py<\/code> চাপলে launch machinery file-টাকে module হিসেবে মেলে <code>generate_launch_description()<\/code> ডাকে; function-টা <code>LaunchDescription([...])<\/code> ফেরত দেয়, আর framework সেই এক action (filter process) তোলে। Filter উঠে merged scan-এর ওপর window বসায় আর ফলটা পরের node-দের ছেড়ে দেয় — folder 11-এর avoidance সেটাই পায়।","incorrect":"Import বা entry point ভুল হলে: <code>Node<\/code> import বাদ গেলে file import-ই হবে না — launch শুরুতেই error থেমে যায়; function-এর নাম বদলালে launch বলবে এই নামে কিছু পাচ্ছে না; <code>return<\/code> ভুলে গেলে function ফেরত দেয় <code>None<\/code> — framework-এর হাতে চালানোর তালিকাই থাকে না। সবই আওয়াজহীন ভাবে শুরুতে ধরা পড়ে, কিন্তু ভুল জায়গার file ধরলে (ভুল package-এর নাম) error-এর ভাষা বোঝা কঠিন হয়।"},"animType":null},{"n":3,"id":"part-03","fname":"laser_filter_node.launch.py","enTitle":"Filter Node & the Angle Window","lang":"python","start":8,"end":24,"flags":[],"explain":[{"a":9,"b":10,"text":"L8-এর শূন্য-দেখতে line-টি আসলে ছয়টা space-এ ভরা (source-এ যেমন, তেমনই রাখা) — শুধুই নিঃশ্বাস-ফেলা ফাঁক। L9-এর comment আসল ঘোষণা: <code># --- THE LASER FILTER NODE ---<\/code>; তারপর L10-এ <code>Node(<\/code> — এই file-এর একমাত্র action শুরু। <code>Node<\/code> হলো launch_ros-এর action class: এর কাজ একটা ROS 2 process তোলা এবং তার উপর নজর রাখা। Constructor-এ যা argument দেওয়া যায় — package, executable, নাম, parameter — সবই সেই ভবিষ্যৎ process-এর বিবরণ। এখনো কিছু চালু নয়; object-টা তৈরি হচ্ছে মাত্র। পরের পাঁচটা line এই object-এর পরিচয়পত্র লিখবে।"},{"a":11,"b":13,"text":"তিনটা পরিচয়-সূত্র, তিনটা ভিন্ন প্রশ্নের উত্তর। <code>package='yahboom_laser_filter'<\/code> — কোন package-র ভান্ডার খুঁজবে (Yahboom-এর নিজস্ব filter package; ament index এই নামেই share directory খুঁজে দেয়)। <code>executable='laser_filter_node'<\/code> — সেই package-র ভেতরের কোন program — এই নামটাই <code>install/&lt;package&gt;/lib/<\/code>-এর file-এর নামের সাথে মিলতে হয়। আর <code>name='laser_filter_node'<\/code> — process উঠে বাদের দুনিয়ায় এই নাম নেবে; rqt_graph-এ node-এর গায়ে এই নামই দেখাবে, /rosout-এর log-ও এই নামে আসবে। তিনটাই এক নাম হলেও (এখানে শেষ দুটি এক) তিনটার কাজ আলাদা — ভুল করে executable-এর জায়গায় package-র নাম বসালে launch বলবে executable পাচ্ছে না।"},{"a":15,"b":19,"text":"পাঁচ-line-এর comment block-টা এই ছোট file-এর সবচেয়ে দামি অংশ — parameter-এর ধারণা এখানেই শেখানো। ভেতরের কথা: <code>angle_min<\/code>/<code>angle_max<\/code> মানে \"কোণ-জানালা\" — এই জানালার ভেতরের beam-ই filter রাখবে। মন্তব্য বলছে <code>-180<\/code> থেকে <code>+180<\/code> মানে পুরো 360-degree বৃত্ত; আরও বলছে \"-180 পেছনে, 0 ডানে, 180 আবার পেছনে\" — এটা এই robot-এর lidar-এর নিজস্ব zero-beam মাউন্টিং-এর বর্ণনা; সাধারণ ROS রীতিতে (REP-103) কোণ 0 মানে +x অর্থাৎ সামনে। দুই ব্যাখ্যাতেই জানালা [-180, 180] পুরো বৃত্তটাই জুড়ে থাকে — কোনো beam-ই বাদ পড়ে না। শেষ দুই line-এ ব্যবহারিক উদাহরণ: arm পেছন ঢেকে দিলে <code>{'angle_min': -90.0, 'angle_max': 90.0}<\/code> — শুধু সামনের অর্ধেক রাখা। অর্থাৎ comment block-টা আসলে একটা tunable knob-এর ব্যবহারবিধি।"},{"a":20,"b":21,"text":"<code>parameters=[<\/code> — এই লাইনটা process-কে সেটিংস-বাক্স হাতে তুলে দেয়। List হওয়াটা ইচ্ছাকৃত: চাইলে একাধিক উৎস পাশাপাশি দেওয়া যায় — yaml file-এর path, আর এর মতো inline dictionary। এখানে একটাই উপাদান: <code>{'angle_min': -180.0, 'angle_max': 180.0}<\/code> — key দুটি ঠিক সেই নাম, যা <code>laser_filter_node<\/code> program-টা পড়তে জানে; বানান একটু এদিক-ওদিক হলে process উঠেই যাবে, কিন্তু নীরবে — window default-এ থেকে যাবে, আর ভুলটা ধরা পড়বে অনেক পরে। আর খেয়াল করুন সংখ্যাগুলোর পরে <code>.0<\/code> — এগুলো float; degree-এ মাপা (math section-এ দেখব, message-এর angle field-গুলো কিন্তু radian-এ)। বড় file-টার merger এই একই জায়গায় পায় নিজের yaml-এর path — তুলনা করলেই launch-এর parameter-ব্যবস্থার দুই মুখ বোঝা যায়।"},{"a":22,"b":24,"text":"তিনটা বন্ধনীর ধাপে ফাইল শেষ: L22 <code>]<\/code> বন্ধ করে <code>parameters<\/code> list-টা — dictionary-টা এখন সেটিংস-বাক্সের ভেতরে; L23-এর <code>)<\/code> বন্ধ করে <code>Node(...)<\/code> — action-object পূর্ণ, তার নাম-ঠিকানা-সেটিংস সব বাঁধা; আর L24-এর <code>])<\/code> একসাথে বন্ধ করে list আর <code>LaunchDescription(...)<\/code> — মোড়া মোড়কসুদ্ধ ফিরে যাবে <code>ros2 launch<\/code>-এর কাছে। খোলার ক্রম ছিল LaunchDescription, Node, parameters, dict; বন্ধের ক্রম ঠিক উল্টো — dictionary, parameters, Node, LaunchDescription। Python-এর এই nesting-চিত্রটাই launch file-এর আসল কঙ্কাল: বড় file-গুলোকে পড়তে গেলে চোখ এই বন্ধনী-সিঁড়ি ধরেই নামতে হয়।"}],"math":{"blocks":[{"latex":"\\[ a_{\\min} \\le \\theta_{\\deg} \\le a_{\\max} \\]","text":"Filter-এর মূল নিয়ম। <code>a_min<\/code>, <code>a_max<\/code> হলো window-এর দুই ধার (degree-এ, source-এর <code>-180.0<\/code> আর <code>180.0<\/code>), আর <code>theta_deg<\/code> হলো কোনো একটা beam-এর কোণ। নিয়মটা একটাই: beam-এর কোণ জানালার ভেতরে পড়লে beam-টা থাকবে, বাইরে হলে বাদ।"},{"latex":"\\[ \\theta_{\\text{rad}} = \\theta_{\\deg} \\cdot \\frac{\\pi}{180} \\]","text":"একক-বদল (conversion)। Source-এর parameter দুটি degree-এ, কিন্তু LaserScan message-এর angle field-গুলো radian-এ (folder 09-এর echo দেখিয়েছিল <code>angle_min: -3.14159<\/code>, <code>angle_increment: 0.0174533<\/code>)। তাই filter-কে তুলনার আগে এই গুণোত্তর দিয়ে রূপান্তর করতে হয়: <code>-180<\/code> degree হয় <code>-pi<\/code>, <code>+180<\/code> হয় <code>+pi<\/code>, আর <code>1<\/code> degree হয় <code>0.0174533<\/code> rad — ঠিক folder 09-এর increment-এর মান।"},{"latex":"\\[ W = a_{\\max} - a_{\\min}, \\qquad W_{\\text{rad}} = W \\cdot \\frac{\\pi}{180} \\]","text":"জানালার প্রস্থ। <code>W<\/code> মানে কতটুকু কোণ-অংশ জানালার ভেতরে। এই source-এ <code>W = 180 - (-180) = 360<\/code> degree = <code>2*pi<\/code> rad — পুরো বৃত্ত। Comment block-এর ব্যবহারিক উদাহরণে <code>W = 90 - (-90) = 180<\/code> degree = <code>pi<\/code> rad — অর্ধেক বৃত্ত (শুধু সামনে)।"},{"latex":"\\[ \\theta_i = \\theta_{\\min} + i \\cdot \\Delta\\theta \\;\\;\\Rightarrow\\;\\; i = \\frac{\\theta - \\theta_{\\min}}{\\Delta\\theta} \\]","text":"কোণ থেকে array-র index (folder 09-এর শিক্ষা এখানে কাজে লাগে)। Merged scan-এ 360 beam থাকলে আর প্রতি beam-এর ফাঁক <code>1<\/code> degree হলে, কোণ <code>theta<\/code>-র beam-এর index হয় <code>i = (theta - (-180)) / 1<\/code>। উদাহরণ: <code>theta = -90<\/code> হলে <code>i = 90<\/code>; <code>theta = +90<\/code> হলে <code>i = 270<\/code>।"},{"latex":"\\[ N_{\\text{kept}} = \\left\\lfloor \\frac{W}{360} \\cdot N_{\\text{total}} \\right\\rfloor \\]","text":"কতটা beam থাকবে — window-প্রস্থ আর মোট beam-সংখ্যার ভাগের অংশ। সংখ্যায় বসাই: <code>N_total = 360<\/code>, পুরো জানালায় <code>N_kept = 360/360 * 360 = 360<\/code> — সব beam (pass-through); <code>-90..90<\/code> জানালায় <code>N_kept = 180/360 * 360 = 180<\/code> — অর্ধেক, index <code>90<\/code> থেকে <code>269<\/code> পর্যন্ত 180-টা beam।"},{"latex":"\\[ \\text{out.angle\\_min} = a_{\\min} \\cdot \\frac{\\pi}{180}, \\qquad \\text{out.angle\\_max} = a_{\\max} \\cdot \\frac{\\pi}{180} \\]","text":"Output message-এ ফের রেডিয়ান। Filter যে নতুন LaserScan বের করবে তার <code>angle_min<\/code>/<code>angle_max<\/code> field-এ জানানার সীমা রেডিয়ানে লিখে দেবে — <code>-pi..+pi<\/code>। অর্থাৎ ভেতরে তুলনা degree-এ, বাইরের message-জগতে radian: এই দুই এককের যাত্রাই parameter দুটির আসল গল্প। ভুল হলে কী হয়: degree-কে radian ভেবে চালালে (<code>-180..180<\/code> rad) জানালা অর্থহীন হয়ে যায় — কোনো beam-ই মিলবে না বা সব মিলে যাবে, ভেতরের implementation-এর ওপর নির্ভর করে; আর সীমা দুটি উল্টে দিলে (<code>a_min<\/code> বড়) খালি output আসে — চোখে পড়বে ring নয়, শূন্য viewport।"}]},"robot":{"correct":"Robot-এ এর মানে: <code>yahboom_laser_filter<\/code> package-র <code>laser_filter_node<\/code> নামের process ওঠে, নাম নেয় <code>laser_filter_node<\/code> (rqt_graph-এ এই নামেই দেখা), আর হাতে পায় window <code>-180..180<\/code> degree। Window পুরো বৃত্ত বলে merged ring অপরিবর্তিত ভাবেই বয়ে যায় — এটাই প্রত্যাশিত; যেদিন arm পেছন ঢাকবে, window <code>-90..90<\/code> করলে পেছনের কাটা ring পরিষ্কার হয়ে যাবে।","incorrect":"Parameter ভুল হলে: key-এর বানান <code>angle_min<\/code>-এর বদলে অন্য কিছু হলে process উঠে যাবে কিন্তু window default-এ থেকে যাবে — নীরব ভুল, ধরা পড়বে অনেক পরে; মান দুটি উল্টে দিলে খালি output — পরের node ফাঁকা scan পেয়ে থেমে যাবে বা ভুল সিদ্ধান্ত নেবে; আর degree/radian গুলিয়ে ফেললে window-এর অর্থই বদলে যায় — কোণের জানালা হয় সব-গিলে-ফেলা, নয় সব-ফেলে-দেওয়া।"},"animType":"angleWindow"},{"n":4,"id":"part-04","fname":"merge_multi.launch.py","enTitle":"Imports — Actions, Substitutions, Ament","lang":"python","start":1,"end":10,"flags":[],"explain":[{"a":1,"b":3,"text":"বড় file-টা শুরু ছোট file-টার মতোই: একই banner comment, একই <code>from launch import LaunchDescription<\/code>, একই <code>from launch_ros.actions import Node<\/code>। কিন্তু একই শুরু নয় একই গল্প — ছোট file-টা একটা filter তোলে, এটা তুলবে merger-কে, আর সাথে নিয়ে যাবে আরও চারটা import-এর সামগ্রী। যেটা এখনই চোখে পড়ে: দুই file-এর মিল আসলে এই stack-এর launch file-গুলোর সাধারণ কাঠামো — প্রথম তিন line-কে বলা যায় প্রায় boilerplate, যার পরের জিনিসগুলোই একেকটা file-এর আসল পরিচয়। merge_multi-র পরিচয় শুরু হয় পরের line-এর substitution-দিয়ে।"},{"a":4,"b":4,"text":"<code>from launch.substitutions import LaunchConfiguration<\/code> — এই এক line-এর ভেতরে পুরো launch পদ্ধতির সবচেয়ে সূক্ষ্ম ধারণাটা ঢুকছে, আর inline comment-টা তার সারমর্ম বলে দিচ্ছে: \"terminal-এ লেখা variable পড়ার রাস্তা\"। <code>LaunchConfiguration<\/code> কোনো value নয় — একটা promise: \"launch যখন সত্যিই চালবে, তখন এই নামের argument-এর তখনকার মান খুঁজে আনব।\" মানে user চাইলে <code>ros2 launch ira_laser_tools merge_multi.launch.py params_file:=/আমার.yaml<\/code> লিখে ওই নামের যেকোনো জায়গায় মান বদলে দিতে পারবে — code আগে থেকেই খোলা রেখেছে সেই দরজা। Constructor phase-এ এর কোনো মান নেই; run phase-এ যাওয়ার আগে পর্যন্ত এটা শুধু নাম-টাই বহন করে।"},{"a":5,"b":6,"text":"পরের দুই import দুটো বড় কেন্দ্র থেকে: <code>from launch.actions import DeclareLaunchArgument, IncludeLaunchDescription<\/code> — প্রথমটা ওপরের দরজাটার নাম-ফলক লাগায় (এই argument-টা বৈধ, এর একটা default-ও আছে), দ্বিতীয়টা অন্য একটা launch file-কে পুরোটা ডেকে আনে — যেন এক file-এর ভেতরে আরেক file-এর দুনিয়া খুলে দেয়। আর <code>from launch.launch_description_sources import PythonLaunchDescriptionSource<\/code> — সেই ডাকা-আসা file-টা Python launch file, এই পরিচয়টা দেয়। এই তিনটা নাম মিলে এই folder-এর সবচেয়ে সুন্দর প্যাটার্নটা তৈরি করবে L59-এ: এক launch file-এর ভেতরে আরেকটাকে include করা — ঠিক যেভাবে folder 11-এর laser_driver এই file-টাকেই ডেকেছে।"},{"a":7,"b":8,"text":"শেষ দুই import framework-এর বাইরের জগৎ থেকে: <code>import os<\/code> — path জোড়া লাগানোর সাধারণ যন্ত্র; আর <code>from ament_index_python.packages import get_package_share_directory<\/code> — ROS 2-র package-খোঁজার দালান। ইনস্টল হওয়া প্রতিটা package-র একটা share directory থাকে (<code>install/&lt;pkg&gt;/share/&lt;pkg&gt;<\/code> ধাঁচের), যেখানে থাকে config, launch file, model — সব \"ডেটা\" জিনিস। এই function-টার কাজ নাম দিলে সেই directory-র পুরো path ফেরত দেওয়া। আর এখানেই ছোট file-টার সাথে বড়টার আসল পার্থক্য: ছোট file-টা সব কিছু inline লিখেছে; বড় file-টা বাইরের দুই package-এর (<code>ira_laser_tools<\/code>, <code>M3Pro<\/code>) ভান্ডার থেকে জিনিস ধরে আনবে — আর সেই ধরে-আনার ভিত্তি এই দুই line-এ বাঁধা।"}],"math":null,"robot":{"correct":"এই ছয় import বড় file-টার সম্পূর্ণ শক্তি-সরঞ্জাম: <code>Node<\/code> দিয়ে merger তোলা হবে, <code>LaunchConfiguration<\/code> দিয়ে terminal-নিয়ন্ত্রিত দরজা, <code>DeclareLaunchArgument<\/code> দিয়ে তার নথি, <code>IncludeLaunchDescription<\/code> দিয়ে M3Pro-র display file-কে ডেকে আনা, আর <code>get_package_share_directory<\/code> দিয়ে দুই package-এর ভান্ডারের ঠিকানা। চালানোর সময় এই নামগুলোই ঠিক করে কোন কাজ কোন দালানে গিয়ে হবে।","incorrect":"ভুল হলে: <code>os<\/code> import বাদ গেলে পরের যেকোনো <code>os.path.join<\/code> লাইনেই file চালানো শেষ — <code>NameError<\/code>; <code>get_package_share_directory<\/code> না আনলে ঠিকানা-হিসেব চালুর আগেই ভেঙে পড়ে; আর <code>IncludeLaunchDescription<\/code> import না করে ব্যবহার করলে constructor phase-এর শেষ দিকে (L59) এসে পুরো কাজ মাটি — সব ক্ষেত্রেই error terminal-এ স্পষ্ট, কিন্তু প্রতিটাই একেকটা তালিকার নাম মনে না রাখলে ধরা কঠিন।"},"animType":null},{"n":5,"id":"part-05","fname":"merge_multi.launch.py","enTitle":"Entry Point & the Three Empty Lists","lang":"python","start":11,"end":16,"flags":[],"explain":[{"a":11,"b":11,"text":"<code>def generate_launch_description():<\/code> — চুক্তির নাম ছোট file-টার মতোই, কিন্তু এবার ভেতরের কাজ অনেক বড়। <code>ros2 launch<\/code> file-টাকে import করে ঠিক এই function-টাই ডাকবে; ডাক পড়ার সাথে সাথে L13 থেকে L66 পর্যন্ত উপর-নিচে ক্রমে চলবে (constructor phase) — প্রতিটা সম্পূর্ণ line-এর কাণ্ডকাহিনি v2 execution section-এ step-by-step আছে। ফাংশনের নাম যে ঠিক এই রকম হতেই হবে, তার প্রমাণ: নাম বদলালে launch file-টা আর পাওয়াই যাবে না — error আসবে function-এর প্রত্যাশা নিয়ে। অর্থাৎ দুই file-মিলিয়ে এই এক নাম-ই সেতু: runbook-এর <code>ros2 launch<\/code> command থেকে এই def পর্যন্ত।"},{"a":12,"b":15,"text":"L12-এর comment ঘোষণা করে প্যাটার্নটা: \"এই list-গুলো ROS 2-কে দেওয়া বাড়তি সেটিংস ধরে রাখবে।\" তারপর পাশাপাশি তিনটা খালি list: <code>declared_arguments = []<\/code>, <code>declared_env_vars = []<\/code>, <code>declared_parameters = []<\/code>। এদের বলা যায় তিনটা জমাখরচার ঝুড়ি — নাম-ই বলে দিচ্ছে কার কী যাবে: argument (terminal থেকে আসা দরজা), environment variable, আর বাড়তি parameter। এই file-এ সত্যিই ভরবে কেবল প্রথমটা (L23-এ একটা argument), বাকি দুটি খালিই থাকবে — কিন্তু কাঠামোটা তৈরি থাকায় দরকার হলে বাড়ানো সহজ। শেষে L65-এ এই তিনটে ঝুড়ি আর node-list জোড়া লাগিয়ে একটাই LaunchDescription হবে — সেই জোড়ার ক্রমও এখানকার ঘোষণার ক্রমই। খালি list-ও এই নির্মাণে ইট: <code>[] + [x]<\/code> আর <code>[x]<\/code> একই ফল দেয়।"}],"math":null,"robot":{"correct":"Constructor চলার সময় এই তিন খালি list + পরের ভরাট মিলে একটাই LaunchDescription গড়ে: <code>declared_arguments<\/code> ভরবে params_file-নথি দিয়ে, বাকি দুটি খালিই থাকবে (এই file-এ দরকার নেই), আর node-তালিকায় থাকবে display-include আর merger। Robot-এর দৃষ্টিতে: launch চালু হলে প্রথমে নথি নামে, তারপর rviz2-ভরা display আর merger process ওঠে — এই কাঠামোই পরের প্রতিটা vendor launch file-এ বারবার ফিরে আসে।","incorrect":"List-গুলোর নাম বা ক্রম নিয়ে গোলমাল হলে: শেষ লাইনে <code>declared_parameters + declared_arguments<\/code>-এর জায়গায় অস্তিত্বহীন নাম লিখলে constructor phase-ই ব্যর্থ; নাম থাকলেও ভুল ক্রমে জোড়া দিলে argument-নথি merger-এর পরে নামতে পারে — substitution খুঁজে পায় না, launch দাঁড়িয়ে যায়; আর কেউ যদি list-এর জায়গায় সরাসরি string জুড়ে দেয়, তাহলে জোড়া-লাগানোর মুহূর্তেই স্পষ্ট ভাঙন — কিন্তু ততক্ষণে অর্ধেক কাজ হয়ে গেছে।"},"animType":null},{"n":6,"id":"part-06","fname":"merge_multi.launch.py","enTitle":"params_file — Argument & Default Path","lang":"python","start":17,"end":35,"flags":[],"explain":[{"a":17,"b":20,"text":"তিনটা comment (L17-19) ধাপটা বুঝিয়ে দেয়: configuration file-এর (YAML) ঠিকানা ধরার জন্য <code>params_file<\/code> নামে একটা variable বানানো হবে। L20-এ সেই কাজ: <code>params_file = LaunchConfiguration(\"params_file\")<\/code> — মানে প্রথম <code>params_file<\/code> হলো এই Python file-এর নিজের একটা local variable, আর তার ভেতরের string <code>\"params_file\"<\/code> হলো launch-world-এর একটা argument-এর নাম — দুটো এক নাম রাখা হয়েছে পড়তে সুবিধার জন্য, কিন্তু এরা এক নয়। যা ফিরে এল সেটা path-ও নয়, string-ও নয় — একটা substitution object: শুধু এই অঙ্গীকার, \"run phase-এ গিয়ে এই নামে যা মিলবে তাই আমার মান।\" এখনই যদি তাকে ছাপতে চান, path-এর বদলে পাবেন এক ধরনের অপেক্ষার প্রতীক — lazy evaluation এই জায়গাতেই চোখে আঙুল দিয়ে দেখানো যায়।"},{"a":21,"b":24,"text":"L22-এর comment পরের কাজের নাম দেয়: <code>params_file<\/code>-কে বৈধ terminal-argument হিসেবে নথিভুক্ত করা। L23-24 সেটাই করে: <code>declared_arguments.append(<\/code> দিয়ে ঝুড়ির ভেতরে ঢোকানো শুরু, আর ভেতরে <code>DeclareLaunchArgument(<\/code> — নথির জন্ম। মনে রাখুন কে কাকে ডাকছে: variable <code>params_file<\/code> (L20) শুধু নামটা জানে; এই <code>DeclareLaunchArgument<\/code>-ই সেই নামের মান-এর উৎস নথিবদ্ধ করবে (default কী, বর্ণনা কী)। নাম দুটো এক অক্ষরেও আলাদা হলে run phase-এ খোঁজ মিলবে না — substitution বলবে এই নামে কোনো declared argument নেই, আর launch থেমে যাবে। ছোট কাজ, কিন্তু পুরো চেইনের এই নাম-মিলানোই সবচেয়ে প্রচলিত ভুলের আসন।"},{"a":25,"b":26,"text":"L25: প্রথম argument হলো নাম — <code>\"params_file\"<\/code>, আর L26-এর comment পরের ধাপের ইঙ্গিত দেয়: default কী হবে। এই string-টাই পুরো ব্যবস্থার চাবি-কাটি: L20-এর <code>LaunchConfiguration(\"params_file\")<\/code> এই একই string-কে খুঁজবে; <code>ros2 launch ira_laser_tools merge_multi.launch.py params_file:=/নতুন.yaml<\/code> লিখলে launch এই একই নামে override-টা বসিয়ে দেবে; <code>ros2 launch --show-args<\/code> এই নাম-ই তালিকায় দেখাবে। একটা launch file-এ যতগুলো substitution থাকে, প্রত্যেকের জন্য এমন একটাই নাম-সূত্র থাকে — নাম হলো সেই দড়ি যার এক মাথা terminal-এ, অন্য মাথা এই নথিতে।"},{"a":27,"b":28,"text":"এবার launch-জগতের সবচেয়ে কাজের জুটি: <code>default_value=os.path.join(<\/code> আর তার প্রথম উপাদান <code>get_package_share_directory(\"ira_laser_tools\")<\/code>। এখানে ছোট file-টার তুলনায় গভীর একটা পার্থক্য লুকিয়ে: L20-এর <code>LaunchConfiguration<\/code> ছিল lazy (মান আসবে পরে); কিন্তু <code>get_package_share_directory<\/code> হলো সাধারণ function call — constructor phase-এই, মানে এই লাইন চলার মুহূর্তেই, সে আসল directory-র path এনে দেয় (install কোথায় হয়েছে তার ওপর নির্ভর করে মান বদলায় — তাই এখানে দেখানো path illustrative)। অর্থাৎ default-এর ভেতরের এই অংশ এখনই হিসেব হয়ে যায়; lazy শুধু বাইরের খোলস।"},{"a":29,"b":31,"text":"join-এর বাকি দুই টুকরো: <code>\"config\"<\/code> — share directory-র ভেতরের folder-এর নাম, আর <code>\"laserscan_merge.yaml\"<\/code> — সেই folder-এর ভেতরের আসল config file। তিনটা টুকরো জোড়া লেগে তৈরি হলো default path: share-directory/config/laserscan_merge.yaml। এই yaml-টাই merger-এর আসল নিয়ামক — কোন কোন raw topic মিলাবে, মিলানোর পর কোন frame-এ ফলটা বসবে, সব লেখা ওখানে; আর file-টা এই folder-এর অংশ নয় — এটা থাকে install হয়া ira_laser_tools package-এর ভান্ডারে। inline comment-গুলো (L28-30) প্রতিটা টুকরোর পাশে ঠিক এই ব্যাখ্যাই সাজিয়ে রেখেছে — কম্পিউটারের চোখে ওরা শুধু comment, মানুষের চোখে পথের সাইনবোর্ড।"},{"a":32,"b":34,"text":"L32: <code>description=\"Path to param config in yaml format\"<\/code> — ডকুমেন্টেশন-স্ট্রিং; কোনো আচরণ বদলায় না, কিন্তু <code>ros2 launch --show-args<\/code> চাপলে ব্যবহারকারী এই বাক্যটাই দেখবে — তাই এটা লেখা মানে ভবিষ্যৎ ব্যবহারকারীর হয়ে সাহায্য লিখে রাখা। তারপর দুই স্তরের বন্ধনী (L33-34): প্রথমে <code>DeclareLaunchArgument(...)<\/code> পূর্ণ হলো — নাম, default, বর্ণনা সহ একটা সম্পূর্ণ নথি-object; তারপর <code>)<\/code> দিয়ে <code>append(...)<\/code> কলটা শেষ — নথিটা ঝুড়িতে নামল। এই মুহূর্তে <code>declared_arguments<\/code>-এর দৈর্ঘ্য এক; নীরব কিন্তু নির্ণায়ক অবস্থা — run phase-এ substitution যখন নাম ধরে খুঁজবে, তখন এই একটা জিনিসই তার ভরসা।"}],"math":null,"robot":{"correct":"Robot-এ এই অংশের ফল: merger-এর জন্য একটা খোলা দরজা তৈরি হয় — ডিফল্ট ভাবে সে পাবে <code>ira_laser_tools<\/code>-এর ভান্ডারের <code>config/laserscan_merge.yaml<\/code> (কোন raw topic, কোন frame — সব ওখানে), আর দরকার হলে <code>params_file:=<\/code> দিয়ে একই দরজা দিয়ে অন্য yaml-ও ঢোকানো যায় — কোড ছোঁয়া ছাড়াই ভিন্ন lidar-বিন্যাস পরীক্ষার রাস্তা। Launch-এর ভাষায় এটাই launch file-কে configuration-প্রথম করে তোলে।","incorrect":"নাম-মিলানো ভাঙলে: <code>LaunchConfiguration(\"params_file\")<\/code> আর <code>DeclareLaunchArgument(\"params_file\", ...)<\/code>-এর string দুটি আলাদা হলে run phase-এ substitution নাম-খুঁজে পায় না — launch দাঁড়ায়, merger ওঠে না; default path-এর কোনো টুকরো ভুল হলে (যেমন yaml-এর নাম) merger উঠেও নিজের config পড়তে ব্যর্থ হয় — process বেঁচে থাকে কিন্তু কোনো topic-ই মেলে না; rqt_graph-এ merger-কে একা দাঁড়িয়ে থাকতে দেখা যায়।"},"animType":"paramsPath"},{"n":7,"id":"part-07","fname":"merge_multi.launch.py","enTitle":"laser_merge — the Merger Node","lang":"python","start":36,"end":45,"flags":[],"explain":[{"a":37,"b":38,"text":"দুইটা comment এই file-এর মিশন-বাক্য বহন করে: \"এই program-টাই একাধিক laser scan নিয়ে সেগুলোকে একটাতে মিলিয়ে দেয়!\" আর মিলানোর কাঁচামাল কী, তা এই folder-এর বাইরের সূত্র থেকে পরিষ্কার: folder 11-এর laser_driver comment বলে এটা \"সামনের আর পেছনের laser-কে একটা 360-degree মানচিত্রে জোড়ে\"। অর্থাৎ M3Pro-র দুই lidar — সামনে একটা, পেছনে একটা — প্রত্যেকে নিজের raw scan topic-এ publish করে (folder 09-এর <code>/scan0<\/code> ছিল এদেরই একজনের ডাকনাম-ধাঁচের উদাহরণ), আর এই node সেই দুই স্রোত এক বৃত্তে গেঁথে দেবে। কোন topic-গুলো, কোন frame-এ — এসব সিদ্ধান্ত yaml-এ; এই লাইনগুলো শুধু ইচ্ছার ঘোষণা।"},{"a":39,"b":43,"text":"এখানে ছোট file-টার চেয়ে একটাই বড় পার্থক্য, আর সেটাই পুরো পাঠের মর্ম: <code>parameters=[params_file]<\/code> — মানে সেটিংস-বাক্সে গেল কোনো dictionary নয়, ওই substitution object-টাই (L20)। বাকি তিনটা পরিচয় আগের মতোই: <code>package=\"ira_laser_tools\"<\/code> — merger-এর বাড়ি; <code>executable=\"laserscan_multi_merger\"<\/code> — বাড়ির ভেতরের সেই program যেটা মিলানোর কাজ জানে; <code>name=\"laserscan_multi_merger\"<\/code> — process-টা graph-এ এই নামে দেখা দেবে (runbook-এর শেষ ধাপ rqt_graph-এ এই নামটাই খুঁজবেন)। আর substitution-পাঠানোর মানে: launch run phase-এ যখন এই node-কে তোলবে, তখন তার আগে নাম খুঁজে মান বসিয়ে নেবে — মানে node-টা তার জন্মের মুহূর্তেই হাতে পাবে সঠিক yaml-এর path, আর নিজে গিয়ে সেই file পড়বে। কনস্ট্রাকশনে কেউ কোনো file খোলেনি; শুধু প্রতিশ্রুতি বাঁধা হলো।"},{"a":44,"b":44,"text":"একটা বন্ধনী, দুইটা ফল: <code>)<\/code> বন্ধ করল <code>Node(...)<\/code>-কে — action-object পূর্ণ; আর assignment-এর (<code>=<\/code>) কারণে সেই object এখন <code>laser_merge<\/code> নামে এই function-এর একটা local variable-এ বাঁধা। এই নাম দেওয়াটা অলঙ্কার নয় — L59-এ এই একই নাম ধরে node-list-এ ডাক হবে; নাম না থাকলে সরাসরি list-এর ভেতরে লিখতে হত, নাম থাকায় file-টা পড়ছে গল্পের মতো: আগে চরিত্রের পরিচয় (এই লাইন), পরে মঞ্চাভিনয়ে তার প্রবেশ (L59)। মনে রাখার কথা: এখনো কোনো process চালু হয়নি — এই object-টা পুরো LaunchDescription-এর সাথে ফিরে যাবে, আর run phase-এ গিয়েই কেবল সত্যিকারের জন্ম পাবে।"}],"math":{"blocks":[{"latex":"\\[ x = r\\cos\\theta, \\qquad y = r\\sin\\theta \\]","text":"মিলানোর প্রথম ধাপ — প্রত্যেক sensor-এর নিজের ভাষা থেকে সাধারণ জ্যামিতি। প্রতিটি beam হলো একজোড়া <code>(r, theta)<\/code> — দূরত্ব আর কোণ (folder 09-এর polar পাঠ)। ওই sensor-এর নিজের frame-এ beam-এর বিন্দু হয় <code>(r cos theta, r sin theta)<\/code>। দুই lidar দুই জায়গায় বসা, তাই একই দেয়ালও তাদের কাছে দুইরকম <code>(r, theta)<\/code> হয়ে দেখা দেয়।"},{"latex":"\\[ X = x\\cos\\psi - y\\sin\\psi + x_m, \\qquad Y = x\\sin\\psi + y\\cos\\psi + y_m \\]","text":"দ্বিতীয় ধাপ — নিজের frame থেকে মিলন-কেন্দ্র frame-এ যাওয়া। <code>(x_m, y_m)<\/code> হলো sensor-টা robot-এর শরীরে কোথায় বসানো, আর <code>psi<\/code> হলো তার মুখ কোন দিকে ঘুরিয়ে (yaw)। বাঁকানো (rotation) আগে, সরানো (translation) পরে — স্থানাঙ্ক-রূপান্তরের সর্বজনীন নিয়ম। এই সব মান merger yaml-এর destination frame-এর সাথে মিলিয়ে থাকে।"},{"latex":"\\[ \\theta_{\\text{out}} = \\operatorname{atan2}(Y, X), \\qquad j = \\left\\lfloor \\frac{\\theta_{\\text{out}} - \\theta_{\\text{out,min}}}{\\Delta\\theta_{\\text{out}}} \\right\\rfloor \\bmod N \\]","text":"তৃতীয় ধাপ — বিন্দুকে নতুন array-র ঘরে ফেলা। মিলন-কেন্দ্র frame-এ বিন্দুর প্রকৃত কোণ <code>atan2(Y, X)<\/code> দিয়ে বের হয়, তারপর সেই কোণকে output scan-এর কোণ-জানালার ঘর-সংখ্যা দিয়ে ভাগ করে index <code>j<\/code> পাওয়া যায় (ভাগশেষ <code>mod N<\/code> কারণ বৃত্ত ঘোরে)। দুই sensor-এর সব beam এভাবে একই রিং-এর ঘরগুলোতে ঝরে।"},{"latex":"\\[ \\text{ranges}_{\\text{out}}[j] = \\min\\bigl(\\{\\,r_{\\text{valid}} \\mid j_{\\text{beam}} = j\\,\\}\\bigr) \\]","text":"চতুর্থ ধাপ — একই ঘরে একাধিক beam পড়লে। সামনের আর পেছনের lidar-এর দৃষ্টি জায়গায় জায়গায় একই কোণ জুড়ে থাকে; সেই ঘরে সবচেয়ে কাছের সত্যিকারের বাধাটাই রাখা উচিত, তাই নিয়ম <code>min<\/code> — কাছের জিনিসই আগে আটকাবে। খালি ঘর (কোনো sensor-ই দেখেনি) থাকে <code>inf<\/code>; দুই sensor-এর নিজের শরীরে ঢাকা কোণগুলো ছাড়া বৃত্তটা এভাবে প্রায় পূর্ণ হয়।"},{"latex":"\\[ \\text{উদাহরণ}: \\; r = 2.0,\\; \\theta = 0,\\; (x_m, y_m) = (-0.26, 0),\\; \\psi = \\pi \\;\\Rightarrow\\; X = -2.26,\\; Y = 0 \\]","text":"সংখ্যায় এক বিন্দু: পেছনের lidar-র নিজের সামনের দিক (<code>theta = 0<\/code>) মানে robot-এর পেছন দিক; তার মাউন্ট-অফসেট ধরি <code>(-0.26, 0)<\/code> মিটার আর মুখ ঘোরানো <code>psi = pi<\/code>। তাহলে <code>x = 2.0, y = 0<\/code> থেকে <code>X = 2.0 * (-1) + (-0.26) = -2.26<\/code>, <code>Y = 0<\/code> — মিলন-কেন্দ্র frame-এ বিন্দুটা robot-এর ঠিক পেছনে, <code>atan2(0, -2.26) = pi<\/code> কোণে। অর্থাৎ পেছন-দিকের সব beam রিং-এর পেছন-অর্ধে বসে যায় — সামনের lidar-র অন্ধ জায়গা এরাই ভরাট করে।"},{"latex":"\\[ \\text{ব্যর্থতার ছবি}: \\; \\psi_{\\text{ভুল}} = \\psi + \\delta \\;\\Rightarrow\\; \\text{রিং-এর সন্ধি সরে যায়} \\; (\\delta \\cdot r \\text{ মিটার সরে) \\]","text":"ভুল হলে কী হয় — সংখ্যায়: <code>psi<\/code>-তে <code>delta<\/code> গরমিল হলে প্রতিটি বিন্দু চাপ-বরাবর <code>delta * r<\/code> মিটার সরে যায়; <code>delta = 0.05<\/code> rad (প্রায় 3 degree) আর <code>r = 3<\/code> মি হলে সরা <code>0.15<\/code> মি — দেয়াল মোটা বা দুই টুকরো দেখাবে, সন্ধিতে (দুই sensor-এর মিলন-রেখায়) বারবার ভাঙা রেখা। অফসেটের চিহ্ন উল্টালে দুই অর্ধবৃত্ত পরস্পরের জায়গায় ঢুকে যায়; আর frame-এর নাম TF-তে না মিললে merger রূপান্তরই করতে পারে না — scan ঝরে পড়ে, output ফাঁকা। এই কারণেই fusion-এর আগে-পরে runbook-এ দুইবার rviz2: সন্ধি চোখে দেখা যায় কি না, সেটাই মাউন্ট-মান ঠিক কি না-র প্রথম পরীক্ষা।"}]},"robot":{"correct":"এই পাঁচ লাইনেই fusion-এর হৃদয়: <code>laserscan_multi_merger<\/code> নামের process ওঠে (graph-এ এই নামেই দেখা), যন্ত্রটা পায় দুই raw scan স্রোত আর তাদের সামনের-পেছনের দৃষ্টিকে এক 360-degree ring-এ গেঁথে merged scan প্রকাশ করে। Parameter হিসেবে সে substitution-এর হাত ধরে yaml-এর ঠিকানা পায় — জন্মের মুহূর্তেই সেটি পড়ে নিজের কাজের তালিকা (কোন topic, কোন frame) জেনে নেয়; folder 11-এর avoidance পরে এই ফলই খায়।","incorrect":"যদি ভুল হয়: <code>executable<\/code>-এর নাম এক অক্ষর এদিক-ওদিক হলে launch বলে package-র ভেতরে এই program নেই — process-ই ওঠে না; yaml-এ দেওয়া raw topic-গুলো যদি ঠিক না থাকে, merger উঠেও চুপচাপ অপেক্ষা করে — কোনো error নেই, শুধু ফাঁকা output; আর parameter-এ পথের বদলে অন্য কিছু গেলে merger default মেনে নেয় — ভুল বিন্যাসে মেশানো ring তৈরি হয়, যেটা পরের node-গুলো স্বীকার করেই নেয়।"},"animType":"dualRingMerge"},{"n":8,"id":"part-08","fname":"merge_multi.launch.py","enTitle":"Display Include & the Node List","lang":"python","start":46,"end":59,"flags":[],"explain":[{"a":46,"b":47,"text":"দুইটা comment পরের অধ্যায়ের শিরোনাম: M3Pro package-র ভেতরের <code>display.launch.py<\/code> নামের আরেকটা launch file-এর পথ ধরা। M3Pro হলো এই robot-এর নিজস্ব model-ধারী package — folder 08-এ যে URDF দিয়ে পুরো robot গড়া হয়েছিল, এইখানেই তার বাস; আর display-জাতীয় launch file-এর সাধারণ কাজ model-টাকে rviz2-তে তুলে ধরা (এই folder-এর ভেতরে file-টা নেই, তাই তার ভেতরের তালিকা illustrative — folder 08-এর pipeline-ই সেখায়)। লক্ষণীয়: merger-এর পরের দরকারি জিনিস আরেকটা node নয় — একটা <i>দৃশ্য<\/i>; fusion-এর ফল যেখানে চোখে দেখা যাবে, runbook-এর rviz2-ধাপগুলোর সাথে এখানকার display include একই উদ্দেশ্য পূরণ করে।"},{"a":48,"b":52,"text":"ছোট file-টার সাথে এখানে মজার মিল: সেখানে parameter-এর মান সরাসরি লেখা হয়েছিল; এখানেও display-এর ঠিকানা একই ভাষায় সরাসরি বাঁধা — <code>display_launch_file = os.path.join(get_package_share_directory('M3Pro'), 'launch', 'display.launch.py')<\/code>। তিনটা টুকরো: M3Pro-র share directory, তার ভেতরের <code>launch<\/code> folder, তার ভেতরের file-এর নাম। আগের বারের মতোই <code>get_package_share_directory<\/code> এখানেও constructor phase-এই সত্যি পথ   };
  host.stop = function () {
    host.stopFlag = true; host.running = false; host.started = false; host.userPaused = false;
    if (host._raf) cancelAnimationFrame(host._raf);
    host.setState('IDLE');
    host.renderStatic();
  };
  host.renderStatic = function () {
    host.staticOnly = true;
    try { ANIMS[part.animType](host); } catch (e) { /* static render is best-effort */ }
    host.staticOnly = false;
  };
  host.setSpeed = function (s) {
    host.speed = s;
    if (!host.started) { host.start(s); return; }
    if (host.userPaused) { host.running = true; host.userPaused = false; }
    host.setState('RUN ' + s + 'x');
  };
  /* controls */
  host.secEl.querySelectorAll('.ac-btn').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.ac;
      host.secEl.querySelectorAll('.ac-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if (a === 'play') host.userPaused ? host.resume() : host.start(1);
      else if (a === 'slow') host.setSpeed(0.5);
      else if (a === 'fast') host.setSpeed(1.5);
      else if (a === 'pause') host.pause();
      else if (a === 'stop') { host.stop(); b.classList.remove('active'); }
    });
  });
  /* auto start / auto pause with visibility */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      host.inView = en.isIntersecting;
      if (en.isIntersecting) {
        if (host.autoPaused && host.started) {
          host.running = true; host.autoPaused = false; host.setState('RUN ' + host.speed + 'x');
        } else if (!host.started && !host.autoStarted && !window.__prefersReducedMotion) {
          host.autoStarted = true; host.start(1);
        }
      } else if (host.started && host.running) {
        host.running = false; host.autoPaused = true; host.setState('HOLD');
      }
    });
  }, { threshold: 0.25 });
  io.observe(host.secEl);
  return host;
}

const ANIMS = {};
const HOSTS = {};

function setupAnimations() {
  window.__prefersReducedMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  PARTS.forEach(p => {
    if (p.animType && ANIMS[p.animType]) {
      HOSTS[p.id] = createAnimHost(p);
      HOSTS[p.id].renderStatic();
    }
  });
}

/* ---------- shared deterministic ring builders ---------------------- */
/* beam length in metres for a demo world (NOT the real sensor): rear
   arcs read own chassis, front-right has a box, rest = wall ring */
function f10Beam(deg) {
  const a = (deg + 180) % 360 - 180;
  if (Math.abs(a) > 150) return 0.30;          /* behind: own chassis */
  if (a > 20 && a < 55) return 1.35;           /* obstacle box */
  if (a > 60 && a < 78) return null;           /* open gap */
  return 2.6 + 0.05 * Math.sin(6 * a * Math.PI / 180);
}
/* deg: 0 = up (robot front), +90 = screen left (robot left) */
function f10XY(cx, cy, pxm, deg, r) {
  const th = deg * Math.PI / 180;
  return [cx - r * pxm * Math.sin(th), cy - r * pxm * Math.cos(th)];
}
/* tiny square dots for a beam range; bags keyed by class */
function f10Dots(cx, cy, pxm, step, idp, a0, a1, fill) {
  let d = '';
  for (let i = 0; i < 360; i += step) {
    const deg = i - 180;
    if (deg < a0 || deg > a1) continue;
    const r = f10Beam(deg);
    if (r === null) continue;
    const p = f10XY(cx, cy, pxm, deg, r);
    d += 'M' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + 'h2.3v2.3h-2.3z';
  }
  return '<path id="' + idp + '" d="' + d + '" fill="' + fill + '" opacity="0"/>';
}

const XML_COM = {};
function buildCommentLines() {
  Object.keys(FILEDATA).forEach(fn => {

    FILEDATA[fn].forEach((ln, i) => {
      const hasOpen = ln.indexOf('<!--') >= 0;
      const hasClose = ln.indexOf('-->') >= 0;
      if (inC || hasOpen) set.add(i + 1);
      if (hasOpen && !hasClose) inC = true;
      else if (hasClose) inC = false;
    });
    XML_COM[fn] = set;
  });
}
function init() {
  buildCommentLines();

  renderParts();

  setupNavigation();
  setupAnimations();
  setupMathJaxWatchdog();
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {

}

<script id="refine-script">
/* ==================================================================
   SURGICAL REFINEMENT LAYER — engine v2 (line-by-line, multi-file)
   Appended; the original application script above is untouched.
   Drives the SAME per-animation state machine created by the original
   harness (HOSTS[...]) — no second loop, no duplicates. Adds:
     1. Icon control bars (inline SVG, aria-labelled, focusable)
     2. Hero title cleanup (English primary title only)
     3. "Complete Execution — Code → Debug → Robot" final section,
        v2: TRUE line-by-line stepping (73 steps over the real 3-file
        source, runbook-driven multi-file debugger), Code+Debug as the
        first row and the robot/system row below it, BEFORE→OPERATION→
        AFTER debug diff, structural/exec/event line kinds — and the
        folder-10 feature: PER-STEP FILE SWITCHING. All three files are
        stacked in one code panel; every step carries its own file, the
        panel chip + LINE n / NL denominator follow it, inactive files
        dim, and ros2 launch constructor/run phases revisit lines like
        breakpoints. Line ids are exl-<fidx>-<ln> (collision-free).
   ================================================================== */
(function () {
  'use strict';

  /* ---------- shared inline SVG icons (self-contained, no text) ---- */
  var IC = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.5 4.8v14.4L20 12z"/></svg>',
    /* speed family: all triangles point forward; SIZE/COUNT encodes magnitude
       (1 large = 1x, 1 small = 0.5x, 2 medium = 1.5x) so the glyphs stay
       distinguishable at 15px where mirrored needles were not */
    slow: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.7 8.6v6.8l5.6-3.4z"/></svg>',
    fast: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.9 7.4v9.2L11.4 12zM12.6 7.4v9.2L19.1 12z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 4.8h4.1v14.4H6.6zM13.3 4.8h4.1v14.4h-4.1z"/></svg>',
    stop: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="2.2"/></svg>'
  };
  var AC_TIP = {
    play: 'Play (1× speed)', slow: 'Slow (0.5× speed)',
    fast: 'Fast (1.5× speed)', pause: 'Pause', stop: 'Stop'
  };
  function iconBtn(ac) {
    return '<button type="button" class="ac-btn ic" data-ac="' + ac + '" ' +
      'title="' + AC_TIP[ac] + '" aria-label="' + AC_TIP[ac] + '" aria-pressed="false">' +
      IC[ac] + '</button>';
  }
  function iconRow() {
    return iconBtn('play') + iconBtn('slow') + iconBtn('fast') +
      '<span class="ac-sep" aria-hidden="true"></span>' +
      iconBtn('pause') + iconBtn('stop');
  }
  function setActive(bar, btn) {
    bar.querySelectorAll('.ac-btn').forEach(function (x) {
      x.classList.remove('active');
      x.setAttribute('aria-pressed', 'false');
    });
    if (btn) { btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); }
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- 1. retrofit existing animation control bars ---------- */
  function retrofitControls() {
    if (typeof HOSTS === 'undefined') return;
    document.querySelectorAll('.anim-controls').forEach(function (bar) {
      try {
        var sec = bar.closest('.sec-anim');
        if (!sec || !sec.id) return;
        var pid = sec.id.replace(/^anim-/, '');
        var host = HOSTS[pid];
        if (!host) return;
        bar.querySelectorAll('.ac-btn').forEach(function (n) { n.remove(); });
        bar.insertAdjacentHTML('afterbegin', iconRow());
        bar.querySelectorAll('.ac-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            var a = b.dataset.ac;
            setActive(bar, a === 'stop' ? null : b);
            if (a === 'play') { host.userPaused ? host.resume() : host.start(1); }
            else if (a === 'slow') { host.setSpeed(0.5); }
            else if (a === 'fast') { host.setSpeed(1.5); }
            else if (a === 'pause') { host.pause(); }
            else if (a === 'stop') { host.stop(); }
          });
        });
      } catch (e) { console.error('control retrofit failed', e); }
    });

  function dbgRows(rows, shadow) {
    /* BEFORE→AFTER: rows are the AFTER state of this line; when the shadow
       state already holds a different value for a key, render
       old → new so the state transition is visible (#52). */
    if (!rows || !rows.length) return '<div class="dbg-empty">— এই line-এ নতুন debug value নেই —</div>';
    return rows.map(function (r) {
      var k = r[0], v = r[1];
      var tag = r[2] === 'ill'
        ? '<span class="dbg-ill" title="illustrative — actual runtime value">illustrative</span>'
        : '';
      var cls = r[2] === 'err' ? 'dbg-v err' : 'dbg-v';
      var val;
      var before = Object.prototype.hasOwnProperty.call(shadow, k) ? shadow[k] : undefined;
      if (before !== undefined && before !== v) {
        val = '<span class="dbg-old">' + before + '</span> <span class="dbg-arrow">→</span> ' + v;
        cls += ' chg';
      } else {
        val = v;
      }
      shadow[k] = v;
      return '<div class="dbg-row"><span class="dbg-k">' + k + '</span>' +
        '<span class="' + cls + '">' + val + '</span>' + tag + '</div>';
    }).join('');
  }
