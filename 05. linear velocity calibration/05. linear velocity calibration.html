const PY_KW = new Set(['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield']);
const PY_BLT = new Set(['print','input','range','float','int','str','len','open','sorted','super','set','list','dict','type','abs','min','max','round','enumerate','isinstance','self']);
const SH_KW = new Set(['if','then','else','elif','fi','for','while','do','done','case','esac','function','export','return','in','local']);
const SH_CMD = new Set(['docker','ros2','gnome-terminal','bash','sh','python3','sleep','source','export','echo','cat','run','launch','pub','topic','start','stop','exec']);

function tokenizeLine(line, lang) {
  if (lang === 'text') return line === '' ? [] : [{ t: line, c: '' }];
  const toks = [];
  const push = (t, c) => { if (t) toks.push({ t: t, c: c }); };
  let i = 0;
  const n = line.length;
  while (i < n) {
    const c = line[i];
    if (c === '#') { push(line.slice(i), 'com'); break; }
    if (c === '\'' || c === '"') {
      let j = i + 1;
      while (j < n && line[j] !== c) j++;
      const end = Math.min(j + 1, n);
      push(line.slice(i, end), 'str');
      i = end; continue;
    }
    if (/[0-9]/.test(c) && !(i > 0 && /[A-Za-z0-9_]/.test(line[i - 1]))) {
      let j = i;
      while (j < n && /[0-9a-fA-FxXoObB._]/.test(line[j])) j++;
      push(line.slice(i, j), 'num');
      i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const word = line.slice(i, j);
      if (/^[fFrRbBuU]{1,2}$/.test(word) && j < n && (line[j] === '\'' || line[j] === '"')) {
        const q = line[j];
        let k = j + 1;
        while (k < n && line[k] !== q) k++;
        const end = Math.min(k + 1, n);
        push(line.slice(i, end), 'str');
        i = end; continue;
      }
      let cls = '';
      const KW = lang === 'python' ? PY_KW : SH_KW;
      const BLT = lang === 'python' ? PY_BLT : SH_CMD;
      if (KW.has(word)) cls = 'kw';
      else if (BLT.has(word)) cls = 'blt';
      else if (lang === 'python' && j < n && line[j] === '(') cls = 'fn';
      push(word, cls);
      i = j; continue;
    }
    let j = i;
    while (j < n && !/[#'"0-9A-Za-z_]/.test(line[j])) j++;
    if (j === i) j = i + 1;
    push(line.slice(i, j), '');
    i = j;
  }
  return toks;
}
function hl(line, lang) {
  if (line === '') return '';
  return tokenizeLine(line, lang).map(t =>
    t.c ? '<span class="tok-' + t.c + '">' + escHtml(t.t) + '</span>' : escHtml(t.t)
  ).join('');
}
function rawLines(fname, a, b) {
  return FILEDATA[fname].slice(a - 1, b);
}

/* ================================================================
   ANIMATION SYSTEM
   Engine: cancellable, speed-scaled, pause-aware rAF scheduler.
   Every animation renders inline SVG, updates a live Bangla caption
   and a live formula bar. No animation libraries are used.

const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBounce = t => {
  const n1 = 7.5625, d1 = 2.75;
  if (t < 1 / d1) return n1 * t * t;
  if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + .75;
  if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + .9375;
  return n1 * (t -= 2.625 / d1) * t + .984375;
};
const fmt = (v, d) => Number(v).toFixed(d === undefined ? 3 : d);

/* ---------------- host ---------------- */
function createAnimHost(part) {
  const id = part.id;
  const host = {
    part: part,
    stageEl: document.getElementById('stage-' + id),
    capEl: document.getElementById('cap-' + id),
    fxEl: document.getElementById('fx-' + id),
    stateEl: document.getElementById('state-' + id),
    secEl: document.getElementById('anim-' + id),
    speed: 1, running: false, stopFlag: false, started: false,
    staticOnly: false, inView: false, autoPaused: false, userPaused: false,
    _raf: null
  };
  host.setStage = function (inner, w, h) {
    host.stageEl.innerHTML = '<svg viewBox="0 0 ' + (w || 900) + ' ' + (h || 460) +
      '" preserveAspectRatio="xMidYMid meet" role="img">' + inner + '</svg>';
    return host.stageEl.querySelector('svg');
  };
  host.caption = t => { host.capEl.innerHTML = t; };
  host.formula = t => { host.fxEl.innerHTML = t; };
  host.setState = t => { host.stateEl.textContent = t; };
  host._sched = function (dur, onFrame) {
    return new Promise((res, rej) => {
      let elapsed = 0, last = null;
      const step = t => {
        if (host.stopFlag) { rej(new Error('anim-stopped')); return; }
        if (!host.running) { last = null; host._raf = requestAnimationFrame(step); return; }
        if (last === null) last = t;
        elapsed += t - last; last = t;
        const k = Math.min(1, elapsed / (dur / host.speed));
        try { onFrame(k, elapsed); } catch (e) { rej(e); return; }
        if (k >= 1) { res(); return; }
        host._raf = requestAnimationFrame(step);
      };
      host._raf = requestAnimationFrame(step);
    });
  };
  host.sleep = ms => host._sched(ms, () => {});
  host.tween = (dur, fn) => host._sched(dur, k => fn(k));
  host.start = function (speed) {
    if (speed) host.speed = speed;
    if (host.started) { host.stopFlag = true; }
    host.started = true; host.stopFlag = false; host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
    setTimeout(() => {
      ANIMS[part.animType](host).catch(e => {
        if (e && e.message === 'anim-stopped') host.setState('STOPPED');
        else console.error('anim error', part.id, e);
      });
    }, 30);
  };
  host.pause = function () {
    if (!host.started) return;
    host.running = false; host.userPaused = true;
    host.setState('PAUSED');
  };
  host.resume = function () {
    if (!host.started || !host.userPaused) return;
    host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
  };
  host.stop = function () {
    host.stopFlag = true; host.running = false; host.started = false; host.userPaused = false;
    if (host._raf) cancelAnimationFrame(host._raf);
    host.setState('IDLE');
    host.renderStatic();
  };
  host.renderStatic = function () {
    host.staticOnly = true;
    try { ANIMS[part.animType](host); } catch (e) { /* static render is best-effort */ }
    host.staticOnly = false;
  };
  host.setSpeed = function (s) {
    host.speed = s;
    if (!host.started) { host.start(s); return; }
    if (host.userPaused) { host.running = true; host.userPaused = false; }
    host.setState('RUN ' + s + 'x');
  };
  /* controls */
  host.secEl.querySelectorAll('.ac-btn').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.ac;
      host.secEl.querySelectorAll('.ac-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if (a === 'play') host.userPaused ? host.resume() : host.start(1);
      else if (a === 'slow') host.setSpeed(0.5);
      else if (a === 'fast') host.setSpeed(1.5);
      else if (a === 'pause') host.pause();
      else if (a === 'stop') { host.stop(); b.classList.remove('active'); }
    });
  });
  /* auto start / auto pause with visibility */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      host.inView = en.isIntersecting;
      if (en.isIntersecting) {
        if (host.autoPaused && host.started) {
          host.running = true; host.autoPaused = false; host.setState('RUN ' + host.speed + 'x');
        } else if (!host.started && !host.autoStarted && !window.__prefersReducedMotion) {
          host.autoStarted = true; host.start(1);
        }
      } else if (host.started && host.running) {
        host.running = false; host.autoPaused = true; host.setState('HOLD');
      }
    });
  }, { threshold: 0.25 });
  io.observe(host.secEl);
  return host;
}

const ANIMS = {};
const HOSTS = {};

function setupAnimations() {
  window.__prefersReducedMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  PARTS.forEach(p => {
    if (p.animType && ANIMS[p.animType]) {
      HOSTS[p.id] = createAnimHost(p);
      HOSTS[p.id].renderStatic();
    }
  });
}

<script id="refine-script">
/* ==================================================================
   SURGICAL REFINEMENT LAYER — engine v2 (line-by-line edition)
   Appended; the original application script above is untouched.

(function () {
  'use strict';

  /* ---------- shared inline SVG icons (self-contained, no text) ---- */
  var IC = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.5 4.8v14.4L20 12z"/></svg>',
    /* speed family: all triangles point forward; SIZE/COUNT encodes magnitude
       (1 large = 1x, 1 small = 0.5x, 2 medium = 1.5x) so the glyphs stay
       distinguishable at 15px where mirrored needles were not */
    slow: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.7 8.6v6.8l5.6-3.4z"/></svg>',
    fast: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.9 7.4v9.2L11.4 12zM12.6 7.4v9.2L19.1 12z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 4.8h4.1v14.4H6.6zM13.3 4.8h4.1v14.4h-4.1z"/></svg>',
    stop: '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="2.2"/></svg>'
  };
  var AC_TIP = {
    play: 'Play (1× speed)', slow: 'Slow (0.5× speed)',
    fast: 'Fast (1.5× speed)', pause: 'Pause', stop: 'Stop'
  };
  function iconBtn(ac) {
    return '<button type="button" class="ac-btn ic" data-ac="' + ac + '" ' +
      'title="' + AC_TIP[ac] + '" aria-label="' + AC_TIP[ac] + '" aria-pressed="false">' +
      IC[ac] + '</button>';
  }
  function iconRow() {
    return iconBtn('play') + iconBtn('slow') + iconBtn('fast') +
      '<span class="ac-sep" aria-hidden="true"></span>' +
      iconBtn('pause') + iconBtn('stop');
  }
  function setActive(bar, btn) {
    bar.querySelectorAll('.ac-btn').forEach(function (x) {
      x.classList.remove('active');
      x.setAttribute('aria-pressed', 'false');

    if (btn) { btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); }
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- 1. retrofit existing animation control bars ---------- */
  function retrofitControls() {
    if (typeof HOSTS === 'undefined') return;
    document.querySelectorAll('.anim-controls').forEach(function (bar) {
      try {
        var sec = bar.closest('.sec-anim');
        if (!sec || !sec.id) return;
        var pid = sec.id.replace(/^anim-/, '');
        var host = HOSTS[pid];
        if (!host) return;
        bar.querySelectorAll('.ac-btn').forEach(function (n) { n.remove(); });
        bar.insertAdjacentHTML('afterbegin', iconRow());
        bar.querySelectorAll('.ac-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            var a = b.dataset.ac;
            setActive(bar, a === 'stop' ? null : b);
            if (a === 'play') { host.userPaused ? host.resume() : host.start(1); }
            else if (a === 'slow') { host.setSpeed(0.5); }
            else if (a === 'fast') { host.setSpeed(1.5); }
            else if (a === 'pause') { host.pause(); }
            else if (a === 'stop') { host.stop(); }
          });
        });
      } catch (e) { console.error('control retrofit failed', e); }
    });
  }

  /* ---------- 2. hero title: English primary only ------------------- */
  function fixHero() {
    try {
      var sub = document.querySelector('.intro-banner h1 .path');
      if (sub) sub.remove();
    } catch (e) { /* cosmetic only */ }

ist-এর শেষে, আর চলমান <code>value_sum<\/code>-এ। শুরু 5 থেকে ক্রমে হয় <b>5 + 232 + 3 + 0 = 240<\/b> — কারণ <code>0xE8<\/code> = 232, <code>0x03<\/code> = 3, আর শেষ slot শূন্য। <code>len<\/code> যত বড় loop ততবার ঘুরবে; এখানে ঠিক তিনবার।","op":"for i in range(0, 3): value.append(ORDER[key][1 + i]); value_sum = value_sum + ORDER[key][1 + i]   # value = [0xE8, 0x03, 0x00]","dbg":[["value_sum","240"]],"fx":"value_sum = 5 + 232 + 3 + 0 = <b>240<\/b>"},{"ln":72,"lns":[70,71,72,73],"kind":"exec","cap":"Checksum মেলানোর মোটহিসাব: মাথার দুই সংখ্যা (255 + 252), length থেকে আসা <code>len + 3 = 6<\/code>, order 67, আর জমাকৃত value_sum 240 — সব মিলিয়ে <b>820<\/b>, শেষে <code>% 256<\/code> টানা হয়ে দাঁড়ায় <b>52 = 0x34<\/b>। খেয়াল রাখুন tx-সূত্রে header আর COMPLEMENT দুটোই গোনা হয়, অথচ MCU-র উত্তরের rx-সূত্রে ঢোকে LEN আর ADDR — দুই দিক ইচ্ছা করেই আলাদা।","op":"sum_data = (self.__HEAD + self.__DEVICE_ID + (len + 0x03) + order + value_sum) % 256   # (255 + 252 + 6 + 67 + 240) % 256 = 52 = 0x34","dbg":[["sum_data","0x34 = 52"]],"fx":"sum_data = (HEAD + DEVICE_ID + (len+3) + order + value_sum) % 256 = (255 + 252 + 6 + 67 + 240) % 256 = 820 % 256 = <b>52 = 0x34<\/b>"},{"ln":75,"lns":[74,75],"kind":"exec","cap":"Envelope-এর মাথা তৈরি: <code>tx = [HEAD, DEVICE_ID, (len + 3), order]<\/code> মানে <b>[0xFF, 0xFC, 0x06, 0x43]<\/b>। তৃতীয় ঘরের 6-ই frame-এর LEN — 3টা data-র সঙ্গে তিনটা হিসাবি ঘর (HEAD, DEVICE_ID, order) মিলিয়ে মোট দৈর্ঘ্য; MCU পরে ঠিক এই সংখ্যা দেখেই ঠাহর করবে কোথায় থামতে হবে।","op":"tx = [self.__HEAD, self.__DEVICE_ID, (len + 0x03), order]   # [0xFF, 0xFC, 0x06, 0x43]","dbg":[["tx","[0xFF, 0xFC, 0x06, 0x43]"]]},{"ln":76,"lns":[76],"kind":"exec","cap":"<code>tx.extend(value)<\/code> মাথার পিছনে জুড়ে দেয় data-র তিনটা সংখ্যা: <code>0xE8, 0x03, 0x00<\/code> — list দাঁড়াল <b>[FF FC 06 43 E8 03 00]<\/b>। append নয় এক্ষেত্রে extend, কারণ এক কোপে গোটা list-এর সদস্যগুলো শেষে ঢোকাতে হচ্ছে; checksum ছাড়া বাকি সব এখন frame-এর বুকে।","op":"tx.extend(value)   # -> [0xFF, 0xF       b.addEventListener('click', function () {
        var a = b.dataset.ac;
        setActive(el.controls, a === 'stop' ? null : b);
        if (a === 'play') { X.paused ? resume() : start(1); }
        else if (a === 'slow') setSpeed(0.5);
        else if (a === 'fast') setSpeed(1.5);
        else if (a === 'pause') pause();
        else if (a === 'stop') stop();
      });
    });
  }

  /* ---------- boot -------------------------------------------------- */
  function boot() {
    try { fixHero(); } catch (e) { console.error(e); }
    try { retrofitControls(); } catch (e) { console.error(e); }
    try { buildExec(); } catch (e) { console.error('exec build failed', e); }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else { boot(); }
})();

</script>
</body>
</html>
