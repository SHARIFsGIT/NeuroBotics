 269-এর <code>return state<\/code> সেই আদ্যিকালের <code>-1<\/code>-ই ফেরত দেয় — timeout, নিঃশব্দে।"},{"a":271,"b":272,"text":"<b>ছয় servo-র সারি-মোড়ক<\/b>: <code># Calibrate all 6 servos one by one<\/code> — <code>def set_arm_calib_offset_all(self):<\/code> উপরের অনুষ্ঠানটাকেই ছয়বার করার সুবিধার আস্তরণ। <b>লক্ষ করো<\/b> নকশাটা: এখানে একটি বান্টিবাহী কমান্ড নেই — প্রতিটি servo পায় নিজের নিজের চিঠি, নিজের নিজের উত্তর-অপেক্ষা, নিজের নিজের নিশ্চিত ফল; one by one শব্দজোড়টা comment-এ যেমন, কাজেও তেমন। নামের শেষে <code>_all<\/code> — একাডেমিক নামকরণ নয়, হাতে-কলমের নামকরণ।"},{"a":273,"b":276,"text":"<b>লুপ, আর সত্যিকারের একটা ভুল<\/b>: <code>for i in range(6):<\/code> — i = 0..5, তাই <code>i+1<\/code> পাঠায় servo আইডি ১, ২, ৩, ৪, ৫, ৬ ক্রমে। <b>মন দিয়ে দেখো<\/b> line 274-এর ডাকটা: <code>state = robot.set_arm_calib_offset(i+1)<\/code> — <code>self.set_arm_calib_offset(...)<\/code> নয়, সোজা <b>গ্লোবাল নাম <code>robot<\/code><\/b>! সেই নামের অবজেক্ট এই file-এর <code>__main__<\/code> ব্লকেই তৈরি হয় (Part 19)। ফল: script সরাসরি চালালে সব ঠিকঠাক — গ্লোবালটা তখন মজুত; কিন্তু class-টা অন্য প্রোগ্রামে import করে নিজের instance-এ <code>set_arm_calib_offset_all<\/code> ডাকলে <code>robot<\/code> নামের অস্তিত্বই নেই — <code>NameError<\/code>; আর ডাকের প্রোগ্রামে ভিন্ন কোনো <code>robot<\/code> বাঁধা থাকলে ব্যাপারটা আরও ভয়ের — ক্যালিব্রেশন চলে যাবে <b>অন্য এক অবজেক্টের<\/b> ওপর। এরপর <code>print(\"state:\", i+1, state)<\/code> প্রতিটি servo-র ফল (1/0/−1) ছাপে, আর <code>time.sleep(.5)<\/code> দুই servo-র মাঝে আধা সেকেন্ডের বিরতি দেয় — controller যেন এক কাজ সেরে শান্ত হয়ে পরেরটা নেয়। সোর্স যেমন আছে তেমনই রাখা হয়েছে — ভুলটা চিহ্নিত, সংশোধন নয়।"}],"math":{"intro":"এই Part-এর গণিত ছোট কিন্তু কঠোর: প্রতিটি servo-র জন্য উত্তর-অপেক্ষার জানালা, ফলাফলের তিন-মানের state-স্থান, আর সুস্থ controller থাকলে প্রত্যাশিত অপেক্ষা — তিনটি স্তরে সাজানো।","levels":[{"label":"Level 1 — অপেক্ষা-জানালা","latex":"\\[ T_{\\max} = N \\cdot \\Delta = 6 \\times 0.5\\,\\mathrm{s} = 3.0\\,\\mathrm{s} \\]","text":"N = 6 টিক (<code>for k in range(6)<\/code>), প্রতিটি Δ = 0.5 s (<code>time.sleep(.5)<\/code>)। sleep টিকের শুরুতে বসে থাকায় উত্তর যত দ্রুতই আসুক, প্রথম পরীক্ষা ঠিক ০.৫ সেকেন্ড পরেই হয়; আর কোনো গ্রহণযোগ্য উত্তর না এলে পুরো জানালাটা — ৩.০ সেকেন্ড — খরচ হয়ে তবে ফাংশন ফেরে।"},{"label":"Level 2 — state-স্থান","latex":"\\[ s \\in \\{-1,\\, 0,\\, +1\\} = \\{\\text{timeout},\\; \\text{failed},\\; \\text{success}\\} \\]","text":"s মানে <code>state<\/code>। −1 হলো আদ্য-নির্ধারিত মান (line 262) — ৩ সেকেন্ডেও কোনো গ্রহণযোগ্য উত্তর আসেনি (line 269)। ০ ও ১ আসে উত্তরের দ্বিতীয় data-byte থেকে (<code>__rx_DATA[1]<\/code>); মন্তব্য অনুযায়ী পড়া ১ = \"Success!\", ০ = \"Failed!\" — কোড কাঁচা byte-টাই ফেরত দেয়, ব্যাখ্যা ছাড়া।"},{"label":"Level 3 — সুস্থ পথের প্রত্যাশিত অপেক্ষা","latex":"\\[ \\mathbb{E}[t_{\\mathrm{wait}}] \\approx \\Delta = 0.5\\,\\mathrm{s} \\]","text":"controller সুস্থ থাকলে উত্তর প্রথম টিকের মধ্যেই নলে এসে পড়ে, আর পরীক্ষা হয় টিকের শেষে — তাই স্বাভাবিক ক্ষেত্রে প্রতিটি servo-র ফল জানতে লাগে মাত্র এক টিক। সারি-মোড়কে প্রতিটি servo-র পরে <code>sleep(.5)<\/code> বিরতিটাও ধরলে ছয় servo-র সুস্থ সারি পুরোটা মোটামুটি 6 × (0.5 + 0.5) = ৬ সেকেন্ডেই ফুরিয়ে যায়।"}],"numeric":[{"latex":"\\[ 6 \\times \\left( 3.0\\,\\mathrm{s} + 0.5\\,\\mathrm{s} \\right) = 6 \\times 3.5\\,\\mathrm{s} = 21\\,\\mathrm{s} \\]","text":"সবচেয়ে খারাপ দিন: controller একটাও উত্তর দেয় না — প্রতিটি servo পুরো ৩.০ সেকেন্ডের জানালা পুড়িয়ে −1 ফেরে, তারপর সারির <code>sleep(.5)<\/code> আরেক আধা সেকেন্ড যোগ করে; ছয় servo মিলিয়ে ২১ সেকেন্ডের টানা নীরবতা।"},{"latex":"\\[ k = 0: \\quad t = (0+1) \\times 0.5\\,\\mathrm{s} = 0.5\\,\\mathrm{s} \\]","text":"উত্তর প্রথম টিকেই এলে (k = 0) sleep-এর পরের প্রথম <code>__unpack()<\/code>-ই তা ধরে ফেলে — মাত্র ০.৫ সেকেন্ডে <code>state<\/code> জানা; বাকি পাঁচটি টিক খরচই হয় না।"},{"latex":"\\[ i \\in \\{0, 1, 2, 3, 4, 5\\} \\;\\Rightarrow\\; \\mathrm{arm\\_id} = i + 1 \\in \\{1, 2, 3, 4, 5, 6\\} \\]","text":"সারি-লুপের i-এর ছয়টি মান থেকে <code>i+1<\/code> — ঠিক ছয়টি servo আইডি, রক্ষীর ১..৬ সীমার ভেতরেই প্রতিটি; তাই এই পথে line 246-এর নিঃশব্দ রক্ষী কখনোই সক্রিয় হয় না।"}],"mapping":[{"code":"for k in range(6):","math":"\\[ T \\leq N \\cdot \\Delta, \\quad N = 6, \\; \\Delta = 0.5\\,\\mathrm{s} \\;\\Rightarrow\\; T \\leq 3.0\\,\\mathrm{s} \\]","text":"লুপ-সীমাটাই জানালার পুরো গণিত — ৬ টিক গুণ আধা সেকেন্ড। ভেতরের <code>return state<\/code> জানালা ফুরোনোর আগেই ফাংশন বন্ধ করলে T আরও ছোট হয়, কখনো বড় নয় — <code>range(6)<\/code> এ-ই দুটোই একসাথে ঠিক করে দেয়।"},{"code":"if self.__rx_DATA[0] == arm_id:","math":"\\[ d_0 = \\mathrm{arm\\_id} \\;\\Rightarrow\\; \\mathrm{accept}; \\qquad d_0 \\neq \\mathrm{arm\\_id} \\;\\Rightarrow\\; \\mathrm{reject},\\; \\text{burn one tick} \\]","text":"উত্তরের প্রথম data-byte d₀ নিজেই কোন servo-র উত্তর তা প্রতিধ্বনি করে; সমীকরণটি মিললেই দ্বিতীয় byte d₁ ফলাফল হিসেবে গৃহীত — না মিললে উত্তরটা অগ্রাহ্য, আর একটি টিক পুড়ে যায়।"}],"failure":["এই class কোনো নিজস্ব প্রোগ্রামে import করে নিজের instance-এ <code>set_arm_calib_offset_all<\/code> ডাকলে লুপের ভেতরেই <code>NameError: name 'robot' is not defined<\/code> — গ্লোবাল <code>robot<\/code> নামটা শুধু এই file-এর <code>__main__<\/code> ব্লকে বাঁধা; library হিসেবে পুনর্ব্যবহারের ঠিক এটাই ফাঁদ, আর এখানে সেটাই ঘটে।","controller কোনো উত্তর না দিলে প্রতিটি servo ছয় টিকে ৩ সেকেন্ড পুড়িয়ে −1 ফেরে — সারিটা তবুও থামে না, 'শেষ' হয়ে ছাপে ছয়টি −1; ক্যালিব্রেশন নীরবে ব্যর্থ হয়ে যায়, কেউ বাধা দেয় না।","উত্তর ভিন্ন servo আইডি নিয়ে এলে সেটা ঠিকঠাকই বাতিল হয় — কিন্তু প্রতিটি বাতিল উত্তর একটা করে টিক খরচ করে; ভুল-ঠিকানা উত্তরের ভিড় জানালাটা আগেই ফুরিয়ে −1 এনে দিতে পারে, যদিও আসল উত্তরটা পথেই ছিল।","1..6-এর রক্ষীটা না থাকলে <code>arm_id = 0<\/code>-এর মতো ভুল ডাকও খাম হয়ে বেরিয়ে যেত — controller-এর কাছে অস্তিত্বহীন servo-র 'শূন্য সেভ করো' চিঠি পৌঁছে অগোছালো উত্তর বা শুধু নীরবতা আনত; বর্তমান সংস্করণ সেটা আটকায় ঠিকই, কিন্তু নিঃশব্দে — ডাকের দিক ফেরত পায় <code>None<\/code>, 'কেন কিছুই হলো না'-র কোনো চিহ্ন ছাড়াই।"]},"robot":{"correct":"কোড ঠিকঠাক চললে প্রতিটি servo-র <b>বর্তমান ভৌত পোজ<\/b>-ই তার নতুন শূন্য-বিন্দু হয়ে যায় — controller প্রতিটি আদেশের উত্তর দেয়, প্রতিটি servo প্রায় আধা সেকেন্ডেই ১ (Success) ফেরে, আর <code>_all<\/code> মোড়ক ছয়টি servo একে একে সেরে terminal-এ ফল ছেপে দেয়; folder 01-এর arm-calibration অ্যাপে হাতে-ধরে করা সেই অনুষ্ঠানটাই factory tool এক নিঃশ্বাসে করে দেয়।","incorrect":"ধরে নিও <code>set_arm_calib_offset_all<\/code> নিরাপদ library-মেথড — যেকোনো import-করা প্রোগ্রাম থেকে নিজের instance-এ ডাকা যাবে; সেই আশা এই কোডে ভেঙে পড়ে: লুপের ভেতরের ডাক <code>self<\/code>-এর বদলে গ্লোবাল <code>robot<\/code>-কে করে, যে নাম শুধু এই script নিজে চলার সময়েই বাঁধা — অন্য প্রোগ্রাম থেকে ডাকলে <code>NameError<\/code>-এ ক্যালিব্রেশন শুরু হওয়ার আগেই থেমে যায়, একটি servo-ও শূন্য হয় না।"},"id":"part-12","start":244,"end":276,"lang":"python","animType":"offsetWait","flags":[]},{"n":13,"fname":"config_robot.py","enTitle":"ROS Domain & Namespace","explain":[{"a":278,"b":279,"text":"<b>নেটওয়ার্ক-পরিচয়ের প্রথম দরজা — চ্যানেল<\/b>: teacher-comment-টা রূপকে পরিষ্কার — <code># Change the ROS 2 Walkie-Talkie Channel!<\/code>; এই series-এর folder 02-এর joystick analysis-এ আমরা <code>ROS_DOMAIN_ID<\/code>-কে walkie-talkie চ্যানেল বলেছিলাম — একই নম্বরের চ্যানেলে থাকা যন্ত্ররা একে অপরের কথা শোনে, ভিন্ন চ্যানেলের কথা বাতাসেই হারিয়ে যায়। <code>def set_ros_domain_id(self, domain_id):<\/code> — সেই চ্যানেল-নম্বরটাই এখন terminal-প্যারামিটার হিসেবে নয়, সোজা ফার্মওয়্যারে লিখে দেওয়ার পথ। পাশের <code>set_ros_namespace<\/code>-এর সঙ্গে মিলে এই জোড়াটাই রোবটের ROS-পরিচয় গড়ে — কোন চ্যানেলে, কোন নামে।"},{"a":280,"b":281,"text":"<b>চ্যানেলের বৈধতা-রেল<\/b>: <code>if domain_id &lt; 0 or domain_id &gt; 101:<\/code> — ROS 2-এর domain ID বৈধ 0 থেকে 101, দুই সীমাই অন্তর্ভুক্ত; guard ঠিক এই রেলের বাইরের মানগুলো ফেলে দেয়, আর <code>return<\/code> সম্পূর্ণ নীরব — কোনো ছাপা নেই, কোনো exception নেই। মন দিয়ে দেখো এই ফাইলের সাধারণ সুরটা: ভুল ইনপুট মানেই নীরবে কিছুই-না-হওয়া, সাবধান থাকতে হবে ডাকার দিককে। ঋণাত্মক চ্যানেল বলে কোনো জিনিস নেই-ই, আর 101-এর ওপরের নম্বর ROS 2 নিজে চ্যানেল হিসেবে গোনে না — রেলটা সেই বিভ্রান্তিই আটকে দেয়।"},{"a":282,"b":284,"text":"<code>ORDER[\"DOMAIN_ID\"][1] = int(domain_id) &amp; 0xFF<\/code> — দুই স্তরের সুরক্ষা এক লাইনে: <code>int()<\/code> সংখ্যা-জাতীয় ইনপুটকে পূর্ণসংখ্যায় নামিয়ে আনে, আর <code>&amp; 0xFF<\/code> মানটাকে এক বাইটে (0..255) সেঁটে দেয়। লক্ষ করো — guard-এর ঠিক পরে দাঁড়িয়ে থাকায় এই মাস্কটা কার্যত বেল্ট-অ্যান্ড-সাসপেন্ডার: 101-এর নিচের বৈধ মানের চেহারাই বদলায় না, তবু সীমা-পরীক্ষাটা কখনো ঢিলা হলে বাইটের সীমা তখনও পাহারা দিচ্ছে। এরপর <code>[2] = 0<\/code> — দ্বিতীয় ডেটা-স্লট খালি রাখা, আর <code>self.__send(\"DOMAIN_ID\", len=2)<\/code> Part 4-এর envelope-মোড়কে ঠিক দুটি ডেটা-বাইট তুলে দেয়: চ্যানেল-নম্বরটা আর একটি 0।"},{"a":286,"b":288,"text":"<b>দ্বিতীয় দরজা — নাম<\/b>: <code># Give the robot a name (Namespace) so you can run multiple robots in the same room<\/code> — একই ঘরে একাধিক রোবট চালানোর সূত্রটা comment-এই লেখা: namespace রোবটের প্রতিটি topic-নামের সামনে উপসর্গ হয়ে বসে, ফলে দুই রোবটের <code>/cmd_vel<\/code>-জাতীয় নল আলাদা পথে চলে যায় — একই চ্যানেলে বসেও একে অপরের আদেশে গুলিয়ে যায় না। <code>name_len = len(ros_namespace)<\/code> — নামটা আগে মেপে রাখা হয়, কারণ এই সংখ্যাটাই একটু পরে ফ্রেমের প্রথম ডেটা-বাইটের ভূমিকা নেবে।"},{"a":289,"b":290,"text":"<b>দশ অক্ষরের সীমা, আর দুটো কৌতুক<\/b>: <code>if name_len &gt; 10 or name_len &lt; 0: return<\/code> — নাম দশ অক্ষর পর্যন্ত গ্রহণযোগ্য। প্রথম কৌতুক: <code>len()<\/code> কখনোই ঋণাত্মক ফেরায় না, তাই <code>name_len &lt; 0<\/code> অর্ধেকটা সত্যিকারের <b>dead code<\/b> — সম্ভবত অন্য কোনো guard থেকে হুবহু নকল হয়ে আসা এক রক্ষণাবেক্ষণ-দাগ; ক্ষতি করে না, কাজও দেয় না, শুধু পড়ে আছে — আমরা শুধু প্রত্যক্ষ করি, ছুঁয়ে দেব না। দ্বিতীয় কৌতুকটা বেশি কড়া: একই ফাইলের আগের <code>set_arm_mid_value<\/code> ভুল মান পেলে <code>print(\"mid_value input error!\")<\/code> দিয়ে জানিয়ে দিত — এখানে সেরকম কিছুই নেই। এগারো অক্ষরের নাম নীরবে বাতিল: ফ্রেমও যায় না, ডাকার দিকে কোনো খবরও পৌঁছায় না।"},{"a":291,"b":292,"text":"<code>name_buf = [0 for i in range(10)]<\/code> — ফিক্সড দশ-স্লটের বাফার, জন্মের মুহূর্তেই পুরোটা শূন্যে ভরা: zero padding-এর পুরো কাজটা আসলে এই এক লাইনেই সেরে যায়। <code>name_bytes = bytes(str(ros_namespace), \"utf-8\")<\/code> — <code>str()<\/code> জামাটা ছোট করে (নাম-জাতীয় object এলেও আগে স্ট্রিং বানিয়ে নেয়), আর utf-8 এনকোডিং অক্ষরগুলোকে বাইটে ভাঙে। একটা সূক্ষ্ম খেয়াল রেখো: <code>len()<\/code> গোনে <b>অক্ষর<\/b>, কিন্তু utf-8-এ ASCII-র বাইরের অক্ষর একাধিক বাইট নিতে পারে — তেমন নামে অক্ষর-সংখ্যা আর বাইট-সংখ্যার মাঝে ফাঁক তৈরি হয়; এই যন্ত্রের ধারার ছোট ASCII নামে (\"rosc\"-জাতীয়) দুটো সংখ্যা একই।"},{"a":293,"b":295,"text":"<b>কপি-লুপ: শুধু নামের অংশটুকুই ঢোকে<\/b>: <code>for i in range(10):<\/code> পুরো ফিল্ড-প্রস্থ ঘোরে, ভেতরে <code>if i &lt; len(ros_namespace):<\/code> শর্ত মেলেলেই <code>name_buf[i] = name_bytes[i]<\/code> — মানে বাফারের প্রথম <code>name_len<\/code>টি স্লটে অক্ষর-বাইট বসে, বাকি স্লটগুলো শুরুর সেই শূন্যতাতেই থেকে যায়; নাম ছোট হলে ফিল্ডের শেষপ্রান্ত নিজে থেকেই প্যাডেড। ছোট্ট স্টাইল-পর্যবেক্ষণ: সীমার শর্তটা লুপের ভেতরে রাখা — <code>range(name_len)<\/code> ঘুরিয়ে লিখলেও ফল একই আসত; লেখক স্থির-প্রস্থের ফিল্ডটাকেই কাঠামোর মূল ধরেছেন।"},{"a":296,"b":296,"text":"<b>এই Part-এর তারকা-কৌতুক — বাড়তে থাকা টেমপ্লেট<\/b>: <code>ORDER[\"ROS_NAMESPACE\"].extend(name_buf)<\/code> — এখানে স্লট [1], [2] ... লেখার বদলে পুরো দশ-বাইট বাফারটাই লিস্টের <b>শেষে জুড়ে<\/b> দেওয়া হয়, প্রতি কলে। ফলে Part 4-এ পরিচিত টেমপ্লেটটা ক্রমাগত লম্বা হতে থাকে: শুরু <code>[0x42, 0, 0]<\/code> (দৈর্ঘ্য ৩) → প্রথম কলের পর ১৩ → ২৩ → ৩৩... মন দিয়ে দেখো কীভাবে সব তবু টিকে থাকে: <code>__send<\/code> (line 299) কেবল স্লট [1..12] পড়ে, তাই ফ্রেমের প্রস্থ প্রতিটি কলে ঠিক ১২ বাইট, আর একই নামে বারবার ডাকলে পাঠানো বাইটগুলোও হুবহু এক — বৃদ্ধিটা নিছক Python লিস্টে, তারে কিছুই যায় আসে না। কিন্তু ভিন্ন নামে পরের কল করলে নতুন অক্ষরগুলো স্লট ১৩ থেকে জমে — ফ্রেমের ভেতরের [3..12] তখনও প্রথম নামের অক্ষরেই ভরা, বদলায় শুধু দৈর্ঘ্য-বাইট। মেমরির হিসাবে ক্ষতি নগণ্য, কিন্তু ORDER-এন্ট্রি আর তার ছোট্ট মেনু-আকাশের মিল এক কলে এক কলে নীরবে ভাঙতে থাকে।"},{"a":297,"b":299,"text":"<b>দৈর্ঘ্য-প্রিফিক্স, তারপর পাঠানো<\/b>: <code>ORDER[\"ROS_NAMESPACE\"][1] = name_len<\/code> — ফিক্সড দশ-বাইট ফিল্ডের ঠিক আগে নামের আসল দৈর্ঘ্য বসে যায়; controller প্রথম বাইটটি পড়েই জানে ওই দশ স্লটের কতটুকু নাম, কতটুকু প্যাডিং — Pascal-ঘরানার স্ট্রিং-বিন্যাস। <code>[2] = 0<\/code> দ্বিতীয় স্লটটা খালি রাখে (DOMAIN_ID-র ছাঁচেই), আর <code>self.__send(\"ROS_NAMESPACE\", len=12)<\/code> তুলে নেয় দৈর্ঘ্য-বাইট, একটি 0, আর দশটি ফিল্ড-বাইট — মোট ১২ ডেটা-বাইটের বার্তা Part 4-এর envelope-এ মুড়ে তারে ছাড়ে।"}],"math":{"intro":"এই Part-এর গণিত দুই প্রশ্নে ভাগ করা: স্থির-প্রস্থের দশ-বাইট ফিল্ডে নাম কীভাবে বসে ও পড়া হয় (দৈর্ঘ্য-প্রিফিক্স + zero padding), আর <code>extend<\/code> প্রতি কলে টেমপ্লেট-লিস্টের দৈর্ঘ্য কোন সূত্রে বাড়ায় — তিনটি স্তরে সাজানো।","levels":[{"label":"Level 1 — স্থির ফিল্ড ও দৈর্ঘ্য-প্রিফিক্স","latex":"\\[ [\\,L,\\; b_0,\\; b_1,\\; \\dots,\\; b_9\\,], \\qquad b_i = 0 \\;\\; \\text{for } i \\geq L, \\qquad \\text{vs. C string: } [\\,b_0,\\, \\dots,\\, b_{L-1},\\, \\texttt{0x00}\\,] \\]","text":"নামটি নিজের শেষ-চিহ্ন বহন করে না — বহন করে তার দৈর্ঘ্য L, ফিল্ডের ঠিক আগে। Pascal-ঘরানার এই বিন্যাসে controller প্রথম বাইট পড়েই জানে দশ স্লটের কতটুকু নাম, কতটুকু শূন্য-প্যাড। C-string উল্টো পথে হাঁটে: শেষে একটি <code>0x00<\/code> টার্মিনেটর, শুরুতে দৈর্ঘ্যের কোনো খবর নেই — নির্দিষ্ট-প্রস্থের তারে পাঠানোর জন্য দৈর্ঘ্য-প্রিফিক্সই ঝকঝকে সমাধান।"},{"label":"Level 2 — ফ্রেমের ডেটা-সেগমেন্ট","latex":"\\[ \\mathrm{data} = [\\,L,\\; 0,\\; c_0,\\; c_1,\\; \\dots,\\; c_9\\,], \\qquad c_i = \\mathrm{utf8}(s)_i \\;\\; (i < L), \\qquad c_i = 0 \\;\\; (i \\geq L) \\]","text":"<code>len=12<\/code> মানে <code>__send<\/code> স্লট [1..12] থেকে ঠিক ১২টি বাইট তোলে: দৈর্ঘ্য L, একটি 0, আর দশটি অক্ষর-স্লট c₀..c₉ (ASCII নামে প্রতি অক্ষর এক বাইট) — যেখানে i ≥ L হলে cᵢ = 0। নাম যত ছোটই হোক, বার্তার প্রস্থ সদা-স্থির ১২ — আর স্থির প্রস্থ মানেই controller-এর চোখে নির্দিষ্ট অফসেটে নির্দিষ্ট অর্থ, পার্সিং অনুমান-মুক্ত।"},{"label":"Level 3 — extend-এর বৃদ্ধি-সূত্র","latex":"\\[ \\left| S_n \\right| = 3 + 10\\,n, \\qquad n = \\text{call count}, \\qquad \\left| S_0 \\right| = 3 \\]","text":"Sₙ হলো n-তম কল শেষে <code>ORDER[\"ROS_NAMESPACE\"]<\/code>-এর দৈর্ঘ্য: প্রতি কলে <code>extend<\/code> ঠিক ১০টি স্লট জুড়ে দেয়, তাই 3 → 13 → 23 → 33 — সমান্তর ধারা। তারে যাওয়া ফ্রেম সবসময় স্লট [1..12] থেকেই তোলে, তাই এই বৃদ্ধি তারের ওপর অদৃশ্য; দৃশ্যমান ক্ষতি শুধু Python-দুনিয়ায় — টেমপ্লেট আর তার মেনু-আকারের মিল ভাঙতে ভাঙতে।"}],"numeric":[{"latex":"\\[ s = \\text{\"rosc\"}: \\quad L = 4, \\; (c_0, \\dots, c_3) = (114,\\, 111,\\, 115,\\, 99) \\;\\Rightarrow\\; \\mathrm{data} = [4,\\, 0,\\, 114,\\, 111,\\, 115,\\, 99,\\, 0,\\, 0,\\, 0,\\, 0,\\, 0,\\, 0] \\]","text":"ASCII-তে r = 114, o = 111, s = 115, c = 99 — প্রথম চার স্লটে অক্ষর-বাইট, শেষ ছয় স্লট জন্মের শূন্যতাতেই; আর দৈর্ঘ্য-প্রিফিক্স 4 বলে দিচ্ছে প্রথম চারটিই নাম, বাকিটা প্যাডিং।"},{"latex":"\\[ s = \\text{\"my\\_robot\\_2026\"}: \\quad L = 13 > 10 \\;\\Rightarrow\\; \\mathrm{return} \\;\\; (\\text{no frame, no print}) \\]","text":"১৩ অক্ষরের নাম guard ছুঁয়েই নিঃশব্দে ফিরে আসে — কোনো বাইট তারে যায় না, কোনো ভুলের ছাপাও নেই; ডাকার দিকের ধারণা থেকে যায় 'নাম বসে গেছে', অথচ রোবট জানেই না তার জন্য একটা নাম এসেছিল।"},{"latex":"\\[ n = 100: \\quad \\left| S_{100} \\right| = 3 + 10 \\times 100 = 1003 \\]","text":"একশো কলে লিস্টে ১০০৩টি এন্ট্রি — প্রতিটি কল শুধু নিজের দশটা জুড়ে দেয়, আগেরগুলো মুছে না; ফ্রেম তবুও ১২ বাইটই, তাই রোবট কিছু টের পায় না — টের পাবে শুধু সেই কোড, যে একদিন ORDER-এন্ট্রির আকার নিয়ে কিছু ধরে নেবে।"}],"mapping":[{"code":"name_buf = [0 for i in range(10)]","math":"\\[ b_i = 0, \\quad i = 0, 1, \\dots, 9 \\]","text":"সৃষ্টির লাইনটাই প্যাডিং-এর সমীকরণ: দশটি স্লট শূন্য দিয়ে শুরু, কপি-লুপ শুধু প্রথম Lটিতে অক্ষর বসায় — বাকি i ≥ L স্লট স্বয়ংক্রিয়ভাবেই সমীকরণের ডানপক্ষ হয়ে থেকে যায়।"},{"code":"ORDER[\"ROS_NAMESPACE\"].extend(name_buf)","math":"\\[ \\left| S_n \\right| = \\left| S_{n-1} \\right| + 10 \\]","text":"প্রতি কলে +১০: <code>extend<\/code> লেখে না, জোড়ে — তাই আগের দশটা স্লট পড়ে থাকে আর লিস্ট সমান্তর ধারায় লম্বা হতে থাকে; Level 3-এর বৃদ্ধি-সূত্রটা এই এক লাইন থেকেই জন্মায়।"}],"failure":["নাম এগারো অক্ষরের হলে সেটা কোনো ফাঁস-কথা ছাড়াই উধাও হয়ে যায় — <code>set_arm_mid_value<\/code>-র <code>print(\"mid_value input error!\")<\/code>-এর মতো সতর্কতা এখানে নেই, তাই caller-এর বিশ্বাস থেকে যায় নাম বসে গেছে, অথচ রোবট namespace-ছাড়াই আগের মতো ঘুরে বেড়ায়।","দৈর্ঘ্য-প্রিফিক্স <code>[1] = name_len<\/code> না থাকলে controller দশ বাইটের ভেতরে নামের শেষ কোথায় তা পার করতে পারত না — নামের শেষের শূন্য-প্যাড আর ফিল্ডের খালি জায়গার শূন্য তার চোখে অভিন্ন দেখাত, নাম কোথায় শেষ আর কোথায় ফিল্ড শেষ বোঝার রাস্তাই থাকত না।","একশো কলে লিস্টে ১০০৩টি এন্ট্রি জমে — আজ নিরীহ, কিন্তু যে পরে ধরে নেবে ORDER-এন্ট্রি সবসময় ছোট্ট মেনু-আকারেই আছে (Part 4-এ যে ছবি আমরা দেখেছি), সে সেই আকার নিয়ে লুপ বা ইনডেক্স লিখতে গিয়ে হোঁচট খাবে।","<code>extend<\/code> যদি শেষে না জুড়ে স্লট [3..12] সরাসরি ওভাররাইট করত, তাহলে ভিন্ন নামে দ্বিতীয় কলেই নতুন নাম তারে চলে যেত; এখন ওভাররাইট হয় শুধু দৈর্ঘ্য-বাইট [1] — অক্ষরগুলো প্রথম নামেরই থেকে যায়, রোবট নতুন নামে ডাক শুনতে পায় না।"]},"robot":{"correct":"চ্যানেল-নম্বর ঠিক করে দিলে সেটা ফার্মওয়্যারে লেখা হয়ে যায় — রোবট ওই walkie-talkie চ্যানেলের ভেতরেই কথা বলে ও শোনে; আর দশ-অক্ষরের মধ্যে namespace দিলে রোবটের topic-গুলো সেই নামের ছাতার নিচে সরে যায়, তাই একই ঘরে দ্বিতীয় রোবট চালু করলেও দুজনের আদেশ-স্রোত একে অপরের সঙ্গে গুলিয়ে যায় না।","incorrect":"লম্বা namespace দশ অক্ষরে কেটে নেওয়া হবে ভেবে বসে থাকলে ধোঁকায় পড়বে — এগারো অক্ষরের নাম কাটা পড়ে না, পুরোটাই নীরবে বাদ যায়: কোনো বাইট তারে যায় না, কোনো ভুলের ছাপাও নেই। একই কারণে ভিন্ন নামে দ্বিতীয়বার ডাকাও কাজের কথা নয় — তারে তখনও যায় প্রথম নামের অক্ষরগুলোই।"},"id":"part-13","start":278,"end":299,"lang":"python","animType":null,"flags":[]},{"n":14,"fname":"config_robot.py","enTitle":"The Speed Scales — Where 1.05 Lives","explain":[{"a":301,"b":302,"text":"<b>যেখানে পুরো folder-এর শিরোনাম সংখ্যা হয়ে ওঠে<\/b>: comment <code># Make the robot drive faster or slower (Linear)<\/code> জানিয়ে দেয় এখন কী শুরু হচ্ছে, আর <code>def set_ros_scale_line(self, scale=1.0):<\/code> হলো linear (সোজা-পথের) স্কেল পাঠানোর ফাংশন — default <code>1.0<\/code> মানে 'যা বলা হলো তা-ই, কোনো সংশোধন নেই'। এই Part-টাই এই app-এর হৃদয়: folder-এর নাম linear velocity calibration, আর calibration-এর চূড়ান্ত ফল এই দুটি ছোট ফাংশনেই firmware-এ গাঁথা হয়। পুরো series-এর ধাপগুলো একসঙ্গে মনে রেখো — launch file (Part 1-3) রোবটকে সামনে এগিয়ে মাপ নেয়, আর এই টুল মানটাকে স্থায়ীভাবে গেঁথে দেয়।"},{"a":303,"b":304,"text":"<b>দুই প্রান্তের গার্ড, একদম নীরব<\/b>: <code>if scale &gt; 2 or scale &lt; 0: return<\/code> — গ্রহণযোগ্য রেঞ্জ [0, 2]: 2-এর বড় মান (যেমন 2.5) বাতিল, ঋণাত্মক মানও বাতিল; 2 নিজে বৈধ। দুটো ব্যাপারে লক্ষ করো। প্রথমত, এই <code>return<\/code> সম্পূর্ণ নীরব — কোনো ভুল-বার্তা নেই, caller টেরও পায় না তার ডাক নিমে গেছে; এই file-এর আগের setter <code>set_arm_mid_value<\/code> খারাপ মান পেলে terminal-এ বকুনি দিলেও এই জোড়া এখানে এক শব্দও করে না। দ্বিতীয়ত, <code>scale = 0<\/code> গার্ড পেরিয়ে যায় — শূন্য এখানে 'বৈধ' মান, অথচ তার অর্থ হলো firmware সেই দিকের প্রতিটি আদেশ শূন্য দিয়ে গুণবে: রোবট চালু, কিন্তু সে দিকে আর নড়বে না।"},{"a":305,"b":305,"text":"<b>দশমিক থেকে পূর্ণসংখ্যায় — fixed-point এনকোডিং<\/b>: <code>bytearray_scale = bytearray(struct.pack('h', int(scale*1000)))<\/code> — আসল রসায়ন এই এক লাইনেই। microcontroller-এর জগতে ভগ্নসংখ্যার জায়গা নেই, তাই স্কেলকে হাজার গুণ করে পূর্ণসংখ্যায় ভাঁজা হয়: 1.05 হয়ে ওঠে 1050 — তিন দশমিক ঘরের নির্ভুলতা একটি পূর্ণসংখ্যার ভেতরে আটকে থাকে। <code>int()<\/code> ভগ্নাংশ ফেলে দেয় (truncation), আর <code>struct.pack('h', ...)<\/code> পূর্ণসংখ্যাটাকে signed 16-bit দুই বাইটে সাজায়। ভাগ্য ভালো যে Part 20 ঠিক 1.05 পাঠায়: binary floating point-এ 1.05 × 1000 ঠিক 1050.0-ই ফেরায়, তাই এই মানে কোনো truncation-ক্ষতি নেই; কিন্তু 1.0005-এর মতো মান এই পথে 1000.5 থেকে 1000-এ নেমে আসে — সেই সৎ সতর্কতাটা Math-এর তৃতীয় উদাহরণে।"},{"a":306,"b":308,"text":"<b>খামের ফাঁকা ঘরে বাইট বসানো<\/b>: <code>ORDER[\"ROS_SCALE_LINE\"][1] = bytearray_scale[0]<\/code> — file-এর ওপরে সংজ্ঞাত <code>ORDER<\/code> dictionary-র <code>\"ROS_SCALE_LINE\": [0x43, 0, 0, 0]<\/code> এন্ট্রির শেষ তিনটি শূন্য-ঘর এই তিন লাইনে পূরণ হয়: ঘর 1-এ প্রথম বাইট, ঘর 2-এ দ্বিতীয়টি, ঘর 3 চিরকাল শূন্য থাকে (padding)। মন দিয়ে দেখো কোন বাইট আগে বসে: <code>'h'<\/code> native byte order-এ প্যাক করে, আর Jetson-এর processor little-endian — তাই ছোট-মানের বাইট আগে। 1050 = 0x041A হলে <code>bytearray_scale<\/code> দাঁড়ায় [0x1A, 0x04]: ঘরে বসে প্রথমে 1A, তারপর 04 — মানুষের পড়ার ক্রমের ঠিক উল্টো, যন্ত্রের পড়ার ক্রমে।"},{"a":309,"b":309,"text":"<code>self.__send(\"ROS_SCALE_LINE\", len=3)<\/code> — ভরা খামটা এবার Part 6-এর <code>__send<\/code>-এর হাতে: সে address 0x43 ধরে চূড়ান্ত ফ্রেম গাঁথে — HEAD 0xFF, DEVICE_ID 0xFC, দৈর্ঘ্য-বাইট 3+3 = 6, তারপর তিন ডেটা-বাইট, শেষে checksum — আর USB তারে লিখে দেয়। ভেতরে আরেকটা অদৃশ্য কাজও ঘটে: <code>__send<\/code> ঢুকতেই <code>self.__data_changed = True<\/code> জ্বালিয়ে দেয়, যাতে পরে <code>update_config_data()<\/code> সেই সংকেত দেখে মান firmware-এর স্থায়ী স্মৃতিতে লেখার নির্দেশ দিতে পারে — সেভ হলে reboot-এর পরও স্কেল হারায় না। এইভাবেই একদিনের মাপ হয়ে ওঠে চিরদিনের গাঁথা।"},{"a":311,"b":312,"text":"<b>এবার ঘূর্ণনের জমজ — পাশের folder-এর নায়ক<\/b>: comment <code># Make the robot turn faster or slower (Angular)<\/code>, আর <code>def set_ros_scale_angular(self, scale=1.0):<\/code> — ঘূর্ণনের স্কেল, আগের folder-এর নাম যার গায়ে লেখা ছিল। আগের ফাংশনের হুবহু যমজ, পার্থক্য একটাই: গন্তব্য <code>ROS_SCALE_ANGULAR<\/code>, ঠিকানা 0x44। Part 20-এর কারখানা-স্ক্রিপ্ট এই ফাংশনকেই ডেকে ঠিক <code>1.05<\/code> পাঠায় — অর্থাৎ angular মানটাও একই স্ক্রিপ্ট থেকে এই লাইন দিয়েই firmware-এ যায়। পরের সাত লাইন তাই আগের আটটির আয়না — দ্রুত হেঁটে পার করা যায়, কিন্তু চোখ খোলা রেখে।"},{"a":313,"b":315,"text":"<b>যমজের আয়না-পথ<\/b>: <code>if scale &gt; 2 or scale &lt; 0: return<\/code> — একই [0, 2] গার্ড, একই নীরব <code>return<\/code>; scale = 0 এখানেও গার্ড পেরিয়ে বৈধ। তারপর সেই এনকোডিং-লাইন: <code>bytearray_scale = bytearray(struct.pack('h', int(scale*1000)))<\/code> — ×1000, <code>int()<\/code>-এর truncation, int16-প্যাক; সবই হুবহু আগের ফাংশনের মতো। লক্ষ করো, দুই ফাংশনের মধ্যে কোনো ভাগাভাগি নেই — প্রত্যেকটি নিজের গার্ড আর নিজের প্যাকিং নিজে বহন করে; ফলে দুটোই স্বয়ংসম্পূর্ণ, আলাদা করে যেকোনো একটিও ডাকা যায়।"},{"a":316,"b":319,"text":"<b>গন্তব্য 0x44 — খামে বাঁধাই হয়ে যাওয়া 1.05<\/b>: <code>ORDER[\"ROS_SCALE_ANGULAR\"][1] = bytearray_scale[0]<\/code> থেকে শুরু করে [2]-এ দ্বিতীয় বাইট, [3]-এ শূন্য padding — এরপর <code>self.__send(\"ROS_SCALE_ANGULAR\", len=3)<\/code>। 1.05-এর জন্য সম্পূর্ণ ফ্রেমটি দাঁড়ায়: <code>FF FC 06 44 1A 04 00 68<\/code> — Part 6-এ হাতে-গুণে যে ফ্রেম দেখেছিলাম, সঙ্গে হুবহু মিলে যায়। ফেরার পথের গল্পও সুন্দর: Part 17-এর <code>read_ros_scale_angular<\/code> এই দুই বাইট পড়ে 1050/1000.0 করে <code>%.3f<\/code>-এ ছাপে, পর্দায় ফেরে <code>1.050<\/code> — লেখা আর পড়া দুই দিকেই একই গণিত, তাই-ই বিশ্বাস।"}],"math":{"intro":"এই Part-এর গণিত পুরো series-এর চূড়া: মাপা ঘূর্ণন-সংশোধন কীভাবে একটা অনুপাত থেকে পূর্ণসংখ্যায়, পূর্ণসংখ্যা থেকে দুই বাইটে, আর দুই বাইট থেকে firmware-এর প্রতিদিনের গুণফলে রূপ নেয় — তিন স্তরে সাজানো।","levels":[{"label":"Level 1 — স্কেল মানে সংশোধন-অনুপাত","latex":"\\[ s = \\frac{\\theta_{\\mathrm{told}}}{\\theta_{\\mathrm{measured}}}, \\qquad s > 1 \\;\\Rightarrow\\; \\text{robot turns } \\tfrac{1}{s} \\text{ of what is told} \\]","text":"s হলো সংশোধন-অনুপাত — 'কত ঘুরতে বলা হলো' ভাগ 'কত ঘুরল সত্যিই'। s &gt; 1 মানে রোবট কথা মতো ঘোরে না: প্রতি আদেশে বলার 1/s ভাগই ঘোরে, ঘাটতি 1 − 1/s। এই ঘাটতি এই রোবটে আসলেই আছে কি না — 1 − 1/1.05 ≈ 4.76% — সেটাই launch file-এর node (Part 1-3) ঘুরিয়ে ঘুরিয়ে মাপার কাজ; এই ফাংশন শুধু মাপার ফল গাঁথে।"},{"label":"Level 2 — fixed-point এনকোডিং, int16-তে","latex":"\\[ v = \\lfloor 1000\\,s \\rfloor, \\qquad (b_0, b_1) = \\bigl(v \\bmod 256,\\; \\lfloor v/256 \\rfloor\\bigr) \\]","text":"microcontroller ভগ্নসংখ্যা বোঝে না, তাই ×1000 করে s-কে পূর্ণসংখ্যা v-তে ভাঁজা হয় — তিন দশমিক ঘরের নির্ভুলতা। <code>'h'<\/code> মানে signed 16-bit (সীমা −32768..32767), আর গার্ডের রেঞ্জ s ≤ 2-এর কারণে v সর্বোচ্চ 2000 — স্বাচ্ছন্দ্যে আঁটে। little-endian সাজানোর নিয়মে b₀ হলো v-এর এককের ঘর, b₁ উঁচু ঘর: তাই-ই 1050 ভেঙে যায় (26, 4)-এ, কারণ 26 + 256×4 = 1050।"},{"label":"Level 3 — স্কেল থেকে চাকা: পুরো যাত্রা","latex":"\\[ s \\;\\to\\; v = \\lfloor 1000\\,s \\rfloor \\;\\to\\; (b_0, b_1) \\;\\to\\; \\texttt{FF FC 06 44}\\; b_0\\; b_1\\; \\texttt{00}\\; c \\;\\to\\; \\omega_{\\mathrm{wheel}} = s \\cdot \\omega_{\\mathrm{cmd}} \\]","text":"চূড়ান্ত ছবিটা এক শিকলে: Part 20 থেকে আসা স্কেল পূর্ণসংখ্যায় ভাঁজ হয়, ভাঁজ দুই বাইটে ভাঙে, বাইট Part 6-এর খামে FF FC 06 44 হেডার আর checksum c-সহ বাঁধা পড়ে — আর firmware-এর কাছে তার মানে একটাই নির্দেশ: আজ থেকে প্রতিটি ঘূর্ণন-আদেশকে s দিয়ে গুণে চাকায় পাঠাবে। calibration এরপর আর Python-এর হাতে নেই — ধাতুর ভেতরে স্থায়ী।"}],"numeric":[{"latex":"\\[ 1.05 \\times 1000 = 1050.0 \\;\\to\\; 1050, \\qquad b_0 = 26\\ (\\texttt{0x1A}),\\; b_1 = 4\\ (\\texttt{0x04}): \\; 26 + 256 \\times 4 = 1050 \\]","text":"Part 20-এর <code>set_ros_scale_angular(1.05)<\/code>-এর পথ: binary floating point-এ 1.05 নিজে যতটুকুই অসম্পূর্ণ হোক, 1.05 × 1000 ঠিক 1050.0-ই ফেরায় — তাই <code>int()<\/code> নির্ভুল, কোনো truncation নেই। বাইটে ভেঙে ফ্রেম হয় <code>FF FC 06 44 1A 04 00 68<\/code>; আর Part 17-এ ফেরত পড়ে 1050/1000.0 → <code>%.3f<\/code> → <code>1.050<\/code>।"},{"latex":"\\[ s = \\frac{360^\\circ}{342.9^\\circ} \\approx 1.0499 \\approx 1.05, \\qquad 1 - \\frac{1}{1.05} \\approx 0.0476 \\]","text":"কল্পিত উদাহরণ — এই রোবটের নিজের মাপ নয়, শুধু স্কেল যেভাবে জন্মায় তার ছবি: 360° ঘুরতে বলা হলো, মাপা গেল 342.9°, তাহলে s = 360/342.9 ≈ 1.05 — আর সংশোধন ছাড়া রোবট প্রতিবার বলার মাত্র ~4.76% কম ঘুরছিল। launch file-এর node (Part 1-3) ঠিক এই ভাগফলটাই মেপে বের করে।"},{"latex":"\\[ 1.0005 \\times 1000 = 1000.5 \\;\\xrightarrow{\\;\\lfloor \\cdot \\rfloor\\;}\\; 1000, \\qquad s = 2.5 > 2 \\;\\Rightarrow\\; \\text{silent return} \\]","text":"truncation-এর সৎ স্বীকারোক্তি: ×1000 প্রত্যেক দশমিক মানকে ধরে রাখে না — 1.0005 সাজাতে চাইলেও জমা পড়ে 1.000, আর মাপা মান 1.0495 হলে 1049.5 থেকে নেমে 1049 (স্কেল 1.049) — হাজারে-এক-ভাগের স্থায়ী বায়াস। রেঞ্জের বাইরের 2.5 আবার গার্ডেই নীরবে বাতিল — কোনো বার্তা নেই, কোনো এনকোডিংও নেই।"}],"mapping":[{"code":"int(scale*1000)","math":"\\[ v = \\lfloor 1000\\,s \\rfloor \\]","text":"এই ছোট্ট অংশটুকুই Level 2-এর পুরো সমীকরণ — গুণফল দশমিক-স্কেলকে পূর্ণসংখ্যার মহলে টেনে তোলে, <code>int()<\/code> ভগ্নাংশটুকু মাটিতে ফেলে দেয়; 1.05-এর জন্য ফল নির্ভুল 1050, অন্য মানের জন্য সর্বোচ্চ হাজারে-এক ভাগের ক্ষতি।"},{"code":"if scale > 2 or scale < 0:","math":"\\[ s \\in [0,\\, 2] \\Leftrightarrow \\text{accepted}, \\qquad s \\notin [0,\\, 2] \\Rightarrow \\text{silent return} \\]","text":"গার্ডের দুই তুলনা মিলে গ্রহণযোগ্য ডোমেইন সংজ্ঞা দেয় — বদ্ধ ব্যবধি [0, 2]: 0 গৃহীত (সব গতি শূন্য হওয়ার অনুমতিসহ), 2 নিজেও গৃহীত, কিন্তু 2.0001 নয়। খেয়াল করো — int16 গাণিতিকভাবে ±32.7-ও ধরত (32768/1000 ≈ 32.7), গার্ডটি তার চেয়ে অনেক কঠিন: এটা গাণিতিক সীমা নয়, নিরাপত্তার সীমা।"}],"failure":["firmware যদি 1.05 দিয়ে গুণ না করে ভাগ করত, তাহলে সংশোধন উল্টে যেত: আদেশ ছাঁটা পড়ত ×0.952, আর রোবটের নিজের ঘাটতির সঙ্গে মিলে ঘূর্ণন নামত 0.952 × 0.952 ≈ 0.907-এ — প্রায় 9.3% কম, মানে আগের ঘাটতি প্রায় দ্বিগুণ; 'এক পাক ঘুরো' বললে রোবট থেমে যেত ~327°-এ।","বাইট-জোড়া যদি উল্টে পড়ত — firmware বড়-বাইট-আগে (big-endian) বুঝত — তাহলে 1A 04-এর বদলে 04 1A পড়ে মান হতো 0x1A04 = 6660, অর্থাৎ স্কেল 6.66: 'আধা পাক'-এর নির্দেশে রোবট প্রায় 1200° — তিন পাকেরও বেশি — এমন হিংস্র ঘূর্ণিতে ঢুকে যেত, ধরে রাখা যেত না।","truncation যদি কারও চোখেই না পড়ত, তাহলে 1.0005-এর মতো সূক্ষ্ম ইচ্ছা চিরকাল 1.000 হিসেবেই জমে থাকত — হাজারে-এক ভাগের স্থায়ী বায়াস, প্রতি পূর্ণ পাকে প্রায় 0.18° করে বিচ্যুতি, প্রতিটি মোড়ে জমতে জমতে navigation-এর হিসাব ধীরে ধীরে আলাদা হয়ে যেত।","কারও টাইপো করা scale = 0 যদি একবার এই পথে firmware-এ গাঁথা হয়ে যেত, তাহলে রোবট সামনে-পেছনে দৌড়ত, কিন্তু আর কোনো মোড় নিত না — steering-হারানো গাড়ি; আর কারণ খুঁজতে বসলে প্রথমেই যে জায়গায় চোখ পড়ার কথা, সেই নীরব return-এ কোনো চিহ্নই থাকত না।"]},"robot":{"correct":"এই দুই ফাংশন ঠিকঠাক চালালে (Part 20-এ linear-এ 1.0, angular-এ 1.05) firmware সেই দিন থেকে প্রতিটি linear/angular আদেশকে সেই স্কেল দিয়ে গুণে চাকায় পাঠায় — যে রোবট নিজে থেকে কম বা বেশি এগোত, তার প্রতিটি সোজা-দূরত্বের আদেশ এবার বলা-লক্ষ্যের কাছাকাছি বসে; <code>update_config_data()<\/code>-এ একবার সেভ হলে মানটা reboot-এর পরও টিকে থাকে — মাপা হলো একবার, গাঁথা হলো চিরদিনের জন্য।","incorrect":"ভেবো না স্কেল-সংখ্যা বড় লিখলেই রোবট দ্রুত ছুটবে — স্কেল গতি বাড়ায় না, ঘাটতিপূর্ণ দূরত্বকে বলা-লক্ষ্যের দিকে টেনে আনে; আরও বড় ভুল আশা: এই Python কোড ড্রাইভিংয়ের সময় চলতে থাকে — আসলে এটি কনফিগ-টুল, কারখানায়/সেটআপের দিন একবারই চেয়েছিল; এরপর প্রতিদিনের গুণফলটা firmware নিজে করে, Python তখন অনুপস্থিত।"},"id":"part-14","start":301,"end":319,"lang":"python","animType":"scaleCalib","flags":[]},{"n":15,"fname":"config_robot.py","enTitle":"Motor & IMU PID Parameters","explain":[{"a":321,"b":322,"text":"<b>চালনার স্বভাব বদলানোর প্রথম নাব — Motor PID<\/b>: comment <code># Set Motor PID tuning (Proportional, Integral, Derivative) for smooth driving<\/code> জানিয়ে দিচ্ছে এর কাজ গতি বাড়ানো-কমানো নয় — Part 14-এর scale-রা ছিল গতির থাম্ব-রুলার, আর এখানকার তিনটি সংখ্যা নিয়ন্ত্রণ-চক্রের (control loop) স্বভাব: <code>pid_p<\/code> (Proportional — ভুল যত বড়, টান তত জোরালো), <code>pid_i<\/code> (Integral — জমা-ভুলের হিসাব), <code>pid_d<\/code> (Derivative — ভুল কত দ্রুত বদলাচ্ছে তার ব্রেক)। <code>def set_motor_pid_parm(self, pid_p, pid_i, pid_d):<\/code> — তিনটি float-ই argument, কোনো ডিফল্ট মান নেই: ডাকতে হলে তিনটিই দিতে হবে।"},{"a":323,"b":325,"text":"<b>×100 ফিক্সড-পয়েন্টে ভাঁজ, তিনবার<\/b>: তিনটি লাইন একই ছাঁচে কাটা — <code>pid_p_s = bytearray(struct.pack('h', int(pid_p*100)))<\/code>, তারপর I আর D-র জন্য হুবহু একই। PID gain সাধারণত 1-এর কাছাকাছি থাকে, তাই দুই দশমিক ঘরই যথেষ্ট: <code>int()<\/code> ভগ্নাংশ ছেঁটে দেয়, আর <code>'h'<\/code> সেই পূর্ণসংখ্যাটাকে signed 16-bit (int16)-এর দুই byte-এ ভাঁজ করে। <b>মন দিয়ে দেখো<\/b> — একই প্রোটোকলে দুই রকম স্কেল একসাথে বেঁচে আছে: Part 14-এর scale-setter-রা গুণ করত ×1000, এই PID-setter-রা গুণ করছে ×100। আর উপরের scale-setter-দের সীমা-পরীক্ষার বিপরীতে এখানে কোনো পাহারাই নেই — int16-এ যা আঁটে, সবই তারে পাড় হয়ে যায়।"},{"a":326,"b":331,"text":"<b>ছয় byte-এর বিছানা<\/b>: <code>ORDER[\"MOTOR_PID\"][1] = pid_p_s[0]<\/code> থেকে শুরু করে ছয়টি নিয়োগ দুই-দুই byte করে সাজায় — slot 1–2-তে P-র জোড়া, slot 3–4-এ I-র জোড়া, slot 5–6-এ D-র জোড়া। প্রতিটি জোড়ার প্রথম byte আগের ঘরে, দ্বিতীয়টা পরের ঘরে — <code>struct.pack<\/code> যে ক্রমে দুই byte ধরিয়ে দেয়, ঠিক সেই ক্রমেই বিছানো, কোনো উল্টানো-পেটানো নেই। তিন গুণ দুই সমান ছয় — gain-ত্রয়ের পুরো বিছানা এই ছয় নিয়োগেই তৈরি।"},{"a":332,"b":333,"text":"<b>শেষ ঘরের শূন্য, তারপর চিঠি রওনা<\/b>: <code>ORDER[\"MOTOR_PID\"][7] = 0<\/code> — সাত ঘরের ডাটা-বিছানার শেষ ঘরটি সবসময় শূন্য রাখা হয়, এই প্রোটোকলের setter-দের চেনা চিঠি-শেষের রীতি (Parts 11 ও 15-এর setter-রাও একই করে)। তারপর <code>self.__send(\"MOTOR_PID\", len=7)<\/code> — সাতটি ঘর নিয়ে চিঠি বেরোয়; এই ফাইলের শুরুর <code>__send<\/code> খামের LEN ঘরে বসায় <code>len + 0x03<\/code>, তাই এখানে 7 + 3 = 10 = 0x0A, আর ঠিকানা-ঘরে বসে ORDER টেবিলে <code>MOTOR_PID<\/code>-এর জন্য লেখা মান 0x13।"},{"a":335,"b":336,"text":"<b>দ্বিতীয় নাব — IMU yaw PID<\/b>: comment <code># Set IMU PID tuning (keeps the robot driving straight without drifting)<\/code> — মোটরের স্বভাবের পাশে আরেকটা চক্র: IMU-র yaw-পাঠ ধরে রাখার লুপ, যার কাজ রোবটকে সোজা রাস্তায় এক পাশে গড়িয়ে যাওয়া থেকে বাঁচানো। <code>def set_imu_yaw_pid_parm(self, pid_p, pid_i, pid_d):<\/code> — signature-ও আগেরটার মতোই: একই তিন সদস্যের PID পরিবার, শুধু গন্তব্য অন্য লুপ।"},{"a":337,"b":346,"text":"<b>হুবহু আয়না<\/b>: লাইন 337–346 আগের ফাংশনের শরীর অক্ষরে-অক্ষরে কপি — একমাত্র বদল <code>MOTOR_PID<\/code> নামটির জায়গায় <code>IMU_YAW_PID<\/code> (ঠিকানা 0x14, মোটরের 0x13-এর ঠিক পরের ঘর)। তিন gain একই ×100-এ ভাঁজ হয়, slot 1–6-এ একই বিছানা, slot 7-এ একই শূন্য। <b>লক্ষ করো<\/b> — দুই লেখকই লিখছে ×100 গুণ করে, অথচ Part 17-এর দুই পাঠক ফেরত পড়বে ÷1000 ভাগ করে; লেখক-পাঠকের এই দশ-গুণের ফারাক নিয়ে নিচের math-অংশে বিস্তারিত হিসাব আছে।"},{"a":347,"b":347,"text":"<code>self.__send(\"IMU_YAW_PID\", len=7)<\/code> — চিঠির আকারও আগেরটার মতোই: LEN ঘরে 0x0A, সাতটি data-ঘর, একই খাম। দুই চিঠির একমাত্র প্রভাবক পার্থক্য ঠিকানা-byte — 0x13 গেলে মোটর-লুপের স্বভাব বদলায়, 0x14 গেলে yaw-ধরার লুপের। একই ডাকের ছাঁচ, দুই গন্তব্য।"}],"math":{"intro":"এই Part-এর হিসাব তিন স্তরে: gain-কে ×100-এ তারের ভাষার সংখ্যায় ভাঁজ করা, তিনটি int16 এক LEN-10 চিঠিতে তোলা, আর লেখক-পাঠকের দুই স্কেলের মাঝের দশ-গুণ অমিল — শেষেরটা সবচেয়ে স্বচ্ছ নয়, তাই সবচেয়ে জরুরি।","levels":[{"label":"Level 1 — ×100 ফিক্সড-পয়েন্ট","latex":"\\[ v = \\lfloor 100\\,p \\rfloor, \\qquad -32768 \\leq v \\leq 32767 \\]","text":"p যেকোনো একটি gain (P, I বা D); <code>int()<\/code> দশমিক ছেঁটে পূর্ণসংখ্যা বানায়, <code>struct.pack('h', ...)<\/code> সেটাকে int16-এর দুই byte-এ ভাঁজ করে। PID gain ঘড়ির কাঁটার মতো 1-এর কাছাকাছি ঘোরে, তাই দুই দশমিক ঘরের রেজোলিউশনই কাজ চালানোর জন্য যথেষ্ট ধরা হয়েছে — Part 14-এর scale-দের জন্য একই ফাংশন বেছেছিল ×1000, সেই তুলনাই দুই স্কেলের সহাবস্থান।"},{"label":"Level 2 — এক চিঠিতে তিন int16","latex":"\\[ 3 \\times 16\\,\\mathrm{bit} = 6\\ \\mathrm{bytes}, \\quad \\text{data} = 6 + 1 = 7, \\quad \\mathrm{LEN} = 7 + 3 = 10 = 0x0A \\]","text":"তিন gain × দুই byte = ছয় byte, সঙ্গে slot 7-এর শূন্য মিলিয়ে সাত ঘরের ডাটা। <code>__send<\/code> খামের LEN ঘরে লেখে <code>len + 0x03<\/code>, তাই LEN = 10 = 0x0A — একটাই চিঠিতে গোটা PID-ত্রয় পাড়ি দেয়; gain আলাদা করে তিনবার পাঠানোর দরকার হয় না।"},{"label":"Level 3 — লেখক ×100, পাঠক ÷1000","latex":"\\[ \\text{write: } v = \\lfloor 100\\,p \\rfloor \\qquad \\text{vs.} \\qquad \\text{read: } p' = \\frac{v}{1000} \\;\\Rightarrow\\; p' \\approx \\frac{p}{10} \\]","text":"এই দুই ফাংশন (এবং Part 17-এর দুই পাঠক) জোড়ায় জোড়া কাজ করে বলে ধরা যায়, কিন্তু লেখকের গুণ ×100 আর পাঠকের ভাগ ÷1000 — স্কেলিং-এ দুই ফাংশন দশ গুণে দ্বিমত করছে। ফার্মওয়্যার মাঝপথে মানটা রিস্কেল করে কি না, তা এই ফাইলের ভেতর থেকে দেখা যায় না — যা দেখা যায় তা হলো Python-এর এই জোড়া নিজেই, হাতে-হাতে দশ-গুণের ফারাক নিয়ে।"}],"numeric":[{"latex":"\\[ \\lfloor 100 \\times 0.8 \\rfloor = 80 = 0x50, \\quad \\lfloor 100 \\times 0.06 \\rfloor = 6 = 0x06, \\quad \\lfloor 100 \\times 0.5 \\rfloor = 50 = 0x32 \\]","text":"Part 20-এর commented উদাহরণ <code># robot.set_motor_pid_parm(0.8, 0.06, 0.5)<\/code> ধরে হিসাব: ত্রয়টি ভাঁজ হয়ে যায় 80, 6, 50 — int16-এ দুই byte করে, ক্রমে 50 00, 06 00, 32 00। অর্থাৎ ORDER-এর slot 1–6-এ ঠিক এই ছয়টি byte শুয়ে পড়ে: <code>50 00 06 00 32 00<\/code>।"},{"latex":"\\[ 0.8 \\;\\xrightarrow{\\;\\times 100\\;}\\; 80 \\;\\xrightarrow{\\;\\div 1000\\;}\\; 0.080 \\]","text":"রাউন্ড-ট্রিপের নিরীক্ষা: এই ফাংশনে 0.8 লিখলে তারে জমা হয় 80; Part 17-এর পাঠক ফেরত আসা সেই 80-কে 80/1000.0 করে <code>%.3f<\/code> ফরম্যাটে ছাপে <code>0.080<\/code> — লেখা সংখ্যার দশ ভাগের এক ভাগ। কোন দিকটা ভুল তা এই ফাইল নিজে বলে না; দুই ফাংশনের দ্বিমতটুকুই এখানে হাতে-হাতে দেখা যায়।"},{"latex":"\\[ p_{\\max} = \\frac{32767}{100} = 327.67, \\qquad p = 400 \\Rightarrow 40000 \\gt 32767 \\Rightarrow \\text{struct.error} \\]","text":"int16-এর ছাদ-হিসাব: সবচেয়ে বড় এনকোডযোগ্য gain 327.67। p = 400 পাঠালে <code>int(400 × 100) = 40000<\/code> ছাদ ভেদ করে, আর <code>struct.pack<\/code> সঙ্গে সঙ্গে <code>struct.error<\/code> ছুড়ে দেয় — থামানোর জন্য এই ফাংশনে কোনো সীমা-পরীক্ষা বসানোই নেই।"}],"mapping":[{"code":"pid_p_s = bytearray(struct.pack('h', int(pid_p*100)))","math":"\\[ v = \\lfloor 100\\,p \\rfloor \\in [-32768,\\ 32767] \\]","text":"float gain থেকে তারের ভাষার দুই byte — এই এক এক্সপ্রেশনেই তিনটি কাজ একসাথে: স্কেল (×100), ছাঁটাই (<code>int<\/code>), ভাঁজ (<code>struct.pack 'h'<\/code>)। মাঝে কোনো সীমা-পরীক্ষা নেই — int16-এ যা আঁটে, এই লাইন তাই পাড় করে দেয়।"},{"code":"ORDER[\"MOTOR_PID\"][7] = 0","math":"\\[ \\mathrm{slot}_7 \\leftarrow 0 \\quad \\text{(trailing zero slot)} \\]","text":"শেষ ঘরটি প্রতিবার নিজে থেকেই শূন্য করে দেওয়া — এই প্রোটোকলের চিঠি-শেষের রীতি, যা Parts 11 ও 15-এর setter-দের গায়েও একইভাবে লেগেছে; সাত ঘরের ডাটা-বিছানা এই এক নিয়োগেই পূর্ণ ও বন্ধ।"}],"failure":["কোনো guard নেই বলেই p = 400-এর মতো মান এখানে এসে <code>struct.error<\/code> দিয়ে পুরো কল ভেঙে দেয় — Part 11-এর সীমা-জানালার মতো পাহারা থাকলে ভুল মানটা চুপচাপ ফিরিয়ে দিত, tuning-স্ক্রিপ্টটা হঠাৎ করে মাঝপথে মরে পড়ত না।","লেখকের ×100 আর পাঠকের ÷1000 — এই অমিলের মধ্যেই টেকনিশিয়ান 0.8 লিখে ফেরে, আর Part 17-এর পাঠকের ছাপা <code>0.080<\/code> দেখে দিশেহারা: রোবটে আসলে কোন সংখ্যাটা বসে আছে, এই জোড়া দিয়ে ঠিক করে বলার উপায় নেই, tuning শুরুর আগেই হিসাব ভরসাহীন হয়ে যায়।","দুই ঠিকানা কোথাও বদলে গিয়ে যদি IMU লুপে motor-gain-এর চিঠি পৌঁছে যেত, yaw-ধরার লুপ ভুল স্বভাবে টানত — রোবট প্রতিটি সোজা দৌড়েই এক পাশে হেলে যেত; দুই চিঠির পার্থক্য মাত্র একটি ঠিকানা-byte (0x13 বনাম 0x14), তাই এই ভুল চোখে ধরাও কঠিন।","কোনো জোড়ায় byte-এর ক্রম বদলে গিয়ে <code>pid_p_s[0]<\/code>-এর জায়গায় <code>pid_p_s[1]<\/code> বসলে 80 (= 50 00) যেত 00 50 হয়ে — Part 17-এর পাঠক সেই জোড়াকে 0x5000 = 20480 হিসেবে পড়ে ছাপত <code>20.480<\/code>: দুই দশমিকের সামান্য গোলমাল হঠাৎ দুই শতাধিক গুণের লাফে দাঁড়িয়ে যেত।"]},"robot":{"correct":"কোড ঠিকঠাক চললে তিনটি gain কন্ট্রোলারের নিজস্ব নিয়ন্ত্রণ-চক্রে গিয়ে বসে — নিচের বোর্ডে উঁচু হারে চলতে থাকা মোটর-লুপ আর yaw-ধরার লুপ নিজেরাই প্রতি মুহূর্তে এই সংখ্যাগুলো দিয়ে হিসাব চালায়, ফলে রোবট মসৃণভাবে চলে আর সোজা পথে গড়িয়ে পড়ে না; Jetson-পাশের এই Python ফাইল শুধু সংখ্যাগুলো পৌঁছে দেওয়ার ডাকই দেয়।","incorrect":"মনে করে বসো না Jetson প্রতি সাইকেলে PID হিসাব করছে — এই ফাংশন একবার 12-byte চিঠি পাঠিয়েই কাজ শেষ করে সরে দাঁড়ায়; সোজা রাস্তায় রোবটকে নিজে নিজে ভুল শুধরে চলতে দেখে মনে হতে পারে এই ফাইলই প্রতি মুহূর্তে সেই হিসাব করছে, অথচ সে-হিসাব নিচের বোর্ডের — Python তিনটি সংখ্যা একবারের জন্য পৌঁছে দিয়ে অন্য কাজে চলে গেছে।"},"id":"part-15","start":321,"end":347,"lang":"python","animType":null,"flags":[]},{"n":16,"fname":"config_robot.py","enTitle":"Read Functions I — Identity & Name","explain":[{"a":350,"b":351,"text":"<b>নতুন অধ্যায়ের দুয়ার — এবার পড়ার পালা<\/b>: banner <code># --- READING FUNCTIONS ---<\/code> ঘোষণা করে, Part 15-এ সমাপ্ত setter-পরিবারের ঠিক উল্টো দিক শুরু হলো। তার নিচের মন্তব্যটা গোটা পরিবারের কাজের বিবরণ এক লাইনে: <code># (These ask the microcontroller a question, wait for a reply, and translate it back to Python)<\/code> — প্রশ্ন করো, উত্তরের জন্য দাঁড়াও, Python-এর ভাষায় অনুবাদ করো। মন দিয়ে দেখো দিক-বদলটা: setter-রা ছিল একমুখো আদেশ-চিঠি — Jetson লিখে দিত, নিচের বোর্ড মানত; এই পরিবার প্রশ্নবাক্য, ভেতরে কোথাও <code>__send<\/code> নেই, তাই রোবটে কিছুই বদলায় না। এই Part-এ চারজন পরিচয়-পাঠক — car type, arm-এর মিড-মান, domain ID, namespace; Part 17-এ আসবে সংখ্যা-নির্ণয়ী বাকিরা।"},{"a":353,"b":361,"text":"<b>কঙ্কাল একবার শিখো — <code>read_car_type<\/code><\/b>: docstring <code>'''Read what kind of robot chassis this is.'''<\/code> মিশন বলে দেয় — চ্যাসিস কোন ধরনের। লাইন 355 <code>self.__request(ORDER[\"CAR_TYPE\"][0])<\/code>: মেনু থেকে ঠিকানা 0x15 নিয়ে আগে দেখা <code>__request<\/code>-এর প্রশ্ন-চিঠি ছোটে — প্রশ্নের আগে ওটা wire-এর পুরনো জঞ্জাল ঝেড়ে 40-বাইটের inbox শূন্য করে নেয়। তারপর <code>time.sleep(self.__read_delay)<\/code> — __init__-এ বসানো 0.01 সেকেন্ড, চিপকে ভাবার সময়। <code>str_data = None<\/code> খালি হাতে শুরুর প্রতিজ্ঞা, আর <code>if self.__unpack():<\/code> — state machine উত্তর-চিঠি জোড়া দিয়ে checksum পাস করালে তবেই ভেতরে: <code>struct.unpack('h', bytearray(self.__rx_DATA[0:2]))[0]<\/code> প্রথম দুই বাইট থেকে int16, <code>str(car_type)<\/code> তাকে স্ট্রিং করে। checksum ব্যর্থ বা উত্তর না এলে <code>return str_data<\/code> ফেরত দেয় None-ই — তাই caller-কে পরীক্ষা করতে হয়; Part 20 ঠিক তা-ই করে: <code>if car_type is not None<\/code>। এই ছয় ধাপ — request, sleep, None, unpack, decode, return — পরিবারের প্রতিটি সদস্যের ভেতরে হুবহু বসে; বদল শুধু ডিকোড-লাইনে।"},{"a":363,"b":368,"text":"<b>একই কঙ্কাল, নতুন ঠিকানা — <code>read_arm_mid_value<\/code><\/b>: docstring <code>'''Read the saved middle positions of the arm servos.'''<\/code>। লাইন 365 <code>self.__request(ORDER[\"ARM_MID_VALUE\"][0])<\/code> — ঠিকানা 0x25; পরের তিনটা লাইন কঙ্কালের হুবহু পুনরাবৃত্তি: সেই 0.01s ভাবার অপেক্ষা, সেই <code>str_data = None<\/code>, সেই <code>if self.__unpack():<\/code> পাহারা। ঠিকানাটাই আসল সূত্র — 0x25 সেই মেনু-নম্বর, যেখানে Part 11-এর setter ছয়টা মিড-মান লিখে রেখেছিল: একই দরজায় একবার লেখা, আরেকবার পড়া। শুধু উত্তরের মাপ বদলায় — car_type-এর দুই বাইটের জায়গায় এখানে বারো বাইটের উত্তর; সেই কাচ পরের এন্ট্রিতে।"},{"a":369,"b":376,"text":"<b>ছয়টা জানালা, বারো বাইটের ওপর<\/b>: ভেতরে পরপর ছয়টা <code>struct.unpack('h', ...)<\/code>, জানালাগুলো <code>[0:2]<\/code>, <code>[2:4]<\/code>, <code>[4:6]<\/code>, <code>[6:8]<\/code>, <code>[8:10]<\/code>, <code>[10:12]<\/code> — inbox-এর প্রথম বারো বাইট ধারাবাহিক ছয়টা দুই-বাইটা টুকরোয় কাটা, প্রতিটা <code>value_s1<\/code> থেকে <code>value_s6<\/code> নামে বসে। লাইন 375 ছয়জনকে এক সারিতে বাঁধে: <code>\"%d,%d,%d,%d,%d,%d\"<\/code> — যেমন <code>2000,2000,2000,2000,1486,3100<\/code>। মন দিয়ে দেখো আয়না-মজাটা: Part 11-এর setter ঠিক উল্টো কাজটাই করেছিল — একই নামের <code>value_s1<\/code>...<code>value_s6<\/code> ছয়টা int16 <code>struct.pack<\/code> দিয়ে ভেঙে ORDER-এর slot 1 থেকে 12-এ বিছিয়ে দিয়েছিল; reader সেই বিছানো বারো বাইট উল্টো দিক থেকে আবার জুড়ে সংখ্যায় ফেরায়। পরিবারের আয়না-জোড়া: লেখক যে বিন্যাসে রাখে, পাঠক ঠিক সেই বিন্যাসেই তোলে।"},{"a":378,"b":386,"text":"<b>এক বাইটের সরু কাচ — <code>read_ros_domain_id<\/code><\/b>: docstring <code>'''Read the current ROS 2 Walkie-Talkie channel.'''<\/code>। কঙ্কাল অপরিবর্তিত — ঠিকানা 0x41-এ প্রশ্ন (<code>ORDER[\"DOMAIN_ID\"][0]<\/code>), 0.01s অপেক্ষা, <code>str_data = None<\/code>, <code>if self.__unpack():<\/code>। বদল শুধু ডিকোডে, আর সেটাই সবচেয়ে সরল: <code>domain_id = self.__rx_DATA[0]<\/code> — কোনো <code>struct.unpack<\/code> নেই, কারণ দরকারই নেই; চ্যানেল নম্বর এক বাইটের মান (0 থেকে 255), একটাই বাইট, একটাই সংখ্যা — জোড়া বাঁধার মতো কিছু নেই। <code>\"%d\" % (domain_id)<\/code> সংখ্যাটাকে স্ট্রিং করে — চ্যানেল 30 হলে <code>\"30\"<\/code>। setter-ভাইও এই মান এক বাইটেই লিখে রাখে, তাই লেখা আর পড়া দুই দিকই এক বাইটের জগতে মিলে আছে।"},{"a":388,"b":395,"text":"<b>নাম পড়া, আর প্রথম বাইট বাদ দেওয়ার রীতি — <code>read_ros_namespace<\/code><\/b>: docstring <code>'''Read the robot's name.'''<\/code>। কঙ্কাল সেইটাই: ঠিকানা 0x42 (<code>ORDER[\"ROS_NAMESPACE\"][0]<\/code>), 0.01s, <code>str_data = None<\/code>, <code>if self.__unpack():<\/code> — কিন্তু ডিকোড-লাইনটা এবার স্ট্রিং-জগতে: <code>self.__rx_DATA[1:].decode('utf-8')<\/code>। স্লাইস <code>[1:]<\/code> — প্রথম বাইট ইচ্ছাকৃত বাদ: namespace-এর উত্তরে byte 0-তে বসে নামের দৈর্ঘ্যের প্রতিধ্বনি, ঠিক যে মানটা Part 13-এর setter নিজের ORDER-এর <code>[1]<\/code> ঘরে <code>name_len<\/code> হিসেবে রেখেছিল; আসল নাম শুরু হয় বাইট 1 থেকে। এবার একটা সূক্ষ্ম পর্যবেক্ষণ: এই স্লাইস inbox-এর একেবারে শেষ (byte 39) পর্যন্ত চলে — কোনো strip নেই, দৈর্ঘ্য-সীমাও নেই। <code>__request<\/code> প্রশ্নের আগে গোটা inbox শূন্য করে রাখে, তাই উত্তর যতটুকু ছুঁয়েছে তার পরের বাইটগুলোতে 0-ই থেকে যায় — decode সেই শূন্যগুলোকে NUL অক্ষর বানিয়ে স্ট্রিংয়ের লেজে টেনে নেয়। terminal-এ ছাপলে NUL আঁকা হয় না, তাই নাম ঝকঝকে দেখায় — কিন্তু ফেরত-আসা স্ট্রিংটা নামের চেয়ে লম্বা। কোড যা করে: প্রথম বাইট ফেলে বাক্সের একেবারে শেষ পর্যন্ত সবকিছু অনুবাদ করে।"}],"math":{"intro":"এই Part-এর গণিত তিনটে ছোট যন্ত্রের জমা: int16 ডিকোডের দুই-বাইটা সূত্র (Part 11-এর এনকোডের হুবহু আয়না), একই 40-বাইট inbox-এর ওপর চার পাঠকের চার রকম কাচ, আর namespace-এর skip-byte রীতি — কোন জানালা দিয়ে তাকালে কী দেখা যায়, তিন স্তরে সাজানো।","levels":[{"label":"Level 1 — int16 ডিকোডের সূত্র","latex":"\\[ v = d_0 + 256\\,d_1, \\qquad d_0, d_1 \\in [0, 255] \\]","text":"<code>struct.unpack('h', ...)<\/code>-এর ভেতরে বসে ঠিক এই হিসাব — প্রথম বাইট নিজের মান নিয়ে বসে, দ্বিতীয়টা 256-গুণে ওঠে। Part 11-এর setter <code>struct.pack('h', v)<\/code> দিয়ে v-কে এই দুই বাইটে ভেঙেছিল; এই পাঠকেরা সেই ভাঙার ঠিক উল্টো রাস্তায় আবার v-তে ফেরে। car_type-এর এক জোড়া থেকে arm-এর ছয় জোড়া — সবাই একই সূত্রের ছাত্র।"},{"label":"Level 2 — এক বাক্সে, চার রকম কাচ","latex":"\\[ \\mathrm{lens} = \\begin{cases} d[0{:}2] & \\text{int16} \\\\ d[0] & \\text{domain} \\\\ d[1{:}] & \\text{namespace} \\end{cases} \\]","text":"নিচে সবার একই 40-বাইটের inbox (<code>__rx_DATA<\/code>), কিন্তু প্রত্যেক পাঠক নিজের মাপের কাচ বসায় — int16 পড়ার দুই-বাইটা জানালা, domain-এর এক-বাইটা সরু ফুটো, namespace-এর প্রথম-বাইট-বাদ-দেওয়া লম্বা টান। লক্ষ করো, কেউ উত্তরের ঠিকানা-বাইট আর মিলিয়ে দেখে না — <code>__unpack<\/code>-এর True মানেই checksum পাস; কোন প্রশ্নের উত্তর ফিরল, সেই নিশ্চয়তা প্রশ্ন-পাঠানোর টাইমিং থেকেই আসে।"},{"label":"Level 3 — namespace-এর skip-byte রীতি","latex":"\\[ s^{\\ast} = \\mathrm{dec}(d_1, \\ldots, d_L), \\qquad s_{\\mathrm{code}} = \\mathrm{dec}(d_1, \\ldots, d_{39}) \\]","text":"namespace-এর উত্তরে byte 0-তে সম্ভবত নামের দৈর্ঘ্য L-এর প্রতিধ্বনি (Part 13-এর <code>[1] = name_len<\/code>-এর উল্টো পথ), নাম শুরু হয় 1 নম্বর ঘর থেকে। আদর্শ জানালা হতো নাম-পর্যন্তই — বাঁয়ের s-অ্যাস্টারিস্ক; কিন্তু কোডের স্লাইস বাক্সের শেষ বাইট 39 পর্যন্ত। L-এর পরের ঘরগুলোয় উত্তর না ছুঁলে শূন্য থাকে, আর শূন্য-বাইট decode-এ হয়ে ওঠে NUL অক্ষর — চোখে না দেখা, কিন্তু স্ট্রিংয়ে সত্যি করে বিদ্যমান লেজ।"}],"numeric":[{"latex":"\\[ d = (07, 00): \\quad v = 7 + 256 \\cdot 0 = 7 \\]","text":"Part 9-এ যে payload 07 00 দিয়ে উত্তর-চিঠির গড়াপথ দেখানো হয়েছিল, সেটাই এখানে ডিকোড-লাইনে পৌঁছায়: প্রথম বাইট 7 নিজের জায়গায়, দ্বিতীয়টা 0 — তাই 256-গুণের অংশ শূন্য, v = 7, <code>str_data = \"7\"<\/code>। Part 20-এ মূল স্ক্রিপ্ট ঠিক এই স্ট্রিং <code>int()<\/code> করে নিজের জানা <code>CAR_TYPE<\/code> মানের সঙ্গে মেলাবে।"},{"latex":"\\[ d = (1\\mathrm{C}, 0\\mathrm{C}): \\quad v = 28 + 256 \\cdot 12 = 3100 \\]","text":"arm-এর ষষ্ঠ জানালা <code>[10:12]<\/code> থেকে value_s6: 0x1C = 28 আর 0x0C = 12, তাই 28 + 256×12 = 28 + 3072 = 3100। মানটা চেনা — Part 11-এর setter-ডিফল্ট তালিকার <code>[2000, 2000, 2000, 2000, 1486, 3100]<\/code> শেষ সদস্য; লেখক যা রেখে গিয়েছিল, পাঠক হুবহু তা-ই ফেরত পড়ল।"},{"latex":"\\[ L = 5: \\quad \\mathrm{len}(s) = 5 + 34 = 39 \\;\\; (34\\,\\text{NUL}) \\]","text":"ধরো নাম ৫ অক্ষরের, আর উত্তর-চিঠি সেটাকে বাইট 1–5-এ বসিয়ে দিল। তখন <code>[1:]<\/code> ধরবে 39টা বাইট — ৫টা নামের অক্ষর, তারপর 39 − 5 = 34টা অস্পৃশ্য শূন্য, decode-এ 34টা NUL। terminal-এ ছাপা মাত্র নামটাই দেখা যায় (NUL আঁকে না), কিন্তু স্ট্রিংয়ের আসল দৈর্ঘ্য 39 — slicing-এর এই আচরণ কোডে যেমন, তেমনই থাকে।"}],"mapping":[{"code":"struct.unpack('h', bytearray(self.__rx_DATA[0:2]))[0]","math":"\\[ v = d_0 + 256\\,d_1 \\]","text":"জানালা <code>[0:2]<\/code> কেটে দুই বাইট, <code>'h'<\/code> সূত্রটা মানায়, শেষের <code>[0]<\/code> unpack-এর tuple থেকে একমাত্র সদস্যটা তুলে নেয় — car_type-এর পুরো ডিকোড এই তিন নড়ের জোড়।"},{"code":"self.__rx_DATA[1:].decode('utf-8')","math":"\\[ s = \\mathrm{dec}(d_1, d_2, \\ldots, d_{39}) \\]","text":"প্রথম বাইট বাদ (সম্ভবত দৈর্ঘ্য-প্রতিধ্বনি), তারপর বাক্সের শেষ বাইট 39 পর্যন্ত টানা অনুবাদ — namespace-এর কাচ; সমীকরণের ডান প্রান্ত খোলা, তাই অস্পৃশ্য শূন্য-বাইটগুলোও স্ট্রিংয়ের সঙ্গী হয়ে যাত্রা করে।"}],"failure":["wire খোলা বা controller নীরব থাকলে <code>__unpack<\/code> কখনো True দেয় না, ফলে প্রতিটি পাঠক চুপচাপ <code>None<\/code> ফেরত দেয় — যে caller স্ট্রিং-ই পাবে ধরে নিয়েছে, সে <code>int(None)<\/code>-এ TypeError খেয়ে থেমে যায়; Part 20 তাই <code>if car_type is not None<\/code> পাহারা বসিয়ে রেখেছে।","বাইট-ক্রম উল্টো পড়লে (আগে 256-গুণের বাইট) 07 00-এর বদলে 00 07 দেখত: v = 0 + 256×7 = 1792 — car_type \"7\"-এর বদলে \"1792\", আর মূল স্ক্রিপ্টের মিল-পরীক্ষা কোনোদিন সফল হতো না, অপেক্ষার লুপটা অসীম ঘুরত।","namespace-এর <code>.decode('utf-8')<\/code> কোনো try/except-এ মোড়া নেই — উত্তরের বাইটগুলো valid UTF-8 না হলে UnicodeDecodeError ধরা না পড়ে উপরে উঠে পুরো config-প্রোগ্রাম ভেঙে দেয়; checksum শুধু যোগফল মেলায়, অক্ষর-বৈধতার দায় কারো ওপরে নেই।","<code>[1:]<\/code>-এর জায়গায় <code>[0:]<\/code> লেখা হলে দৈর্ঘ্য-প্রতিধ্বনি বাইটটাই নামের প্রথম অক্ষর হয়ে যেত — ৫-অক্ষরের নামের আগে একটা অদৃশ্য কন্ট্রোল-অক্ষর বসে সব ROS 2 নাম বাঁকা হয়ে যেত, আর সেই নামে তৈরি কোনো topic আর কারো সঙ্গে মিলত না।"]},"robot":{"correct":"চালু করলে প্রত্যেক পাঠক একই ছন্দে চলে — একটা প্রশ্ন-চিঠি wire-এ নামে, 0.01 সেকেন্ড চিপটা ভাবে, একটা উত্তর ফেরে: Jetson চাইলেই জেনে নিতে পারে রোবটের চ্যাসিস-নম্বর, হাতের ছয়টা সেভ-করা মিড-মান, Walkie-Talkie চ্যানেল আর নাম — সব তথ্য অন-ডিমান্ড, এদের চলায় রোবটের নড়াচড়া বা আচরণে কোনো বদল আসে না।","incorrect":"যদি ভাবো নিচের controller-বোর্ড চালু হলেই নিজে থেকে নিজের পরিচয় ঘোষণা করে — সেই আশা এই কোডে ভঙ্গ হয়: বোর্ড কখনো ঠেলে কথা বলে না, Jetson যা জানে সবই জিজ্ঞাসা করে পেয়েছে; wire-এ একটা প্রশ্ন হারিয়ে গেলে সেই ডাকের উত্তরও চিরতরে হারায় — পাঠক শুধু None ফেরত দিয়ে চুপ করে থাকে।"},"id":"part-16","start":350,"end":395,"lang":"python","animType":null,"flags":[]},{"n":17,"fname":"config_robot.py","enTitle":"Read Functions II — Numbers & the param Byte","explain":[{"a":397,"b":405,"text":"<b>প্রথম সংখ্যা-পাঠক: সামনের গতির স্কেল ফেরানো<\/b>: docstring-টা ইংরেজি শিক্ষক-ভাষায় কাজ বলে দেয় — <code>'''Read the forward speed scaling.'''<\/code>। <code>self.__request(ORDER[\"ROS_SCALE_LINE\"][0])<\/code> অর্থাৎ 0x43 ঠিকানায় প্রশ্ন গেল; এরপর <code>time.sleep(self.__read_delay)<\/code> — Part 16-এর মতোই নিচের বোর্ডকে উত্তর লেখার সময়। <code>str_data = None<\/code> দিয়ে শুরু, কারণ উত্তর না এলে ফাংশন সত্যিই <code>None<\/code> ফেরত দেবে; আর <code>if self.__unpack():<\/code> সেই চেনা প্রহরী — doorbell থেকে checksum পর্যন্ত চিঠিটা অক্ষত জোড়া দিতে পারলেই ভেতরে ঢোকা যায়। ভেতরের এক লাইনেই এই Part-এর আসল গল্প: <code>scale = struct.unpack('h', bytearray(self.__rx_DATA[0:2]))[0]/1000.0<\/code> — inbox-এর প্রথম দুই byte জুড়ে int16, তারপর <b>1000 দিয়ে ভাগ<\/b>। Part 14-এ লেখার সময় <code>int(scale*1000)<\/code>-এর গুণ হয়েছিল; পড়ার এই ভাগ ঠিক তার উল্টো মুখ — encode-এর decode। <code>str_data = \"%.3f\" % scale<\/code> মানটাকে ঠিক তিন দশমিকে ছেনে। আর একটা চাপা পর্যবেক্ষণ: <code>self.__rx_DATA<\/code> নিজেই bytearray, slice-ও তাই bytearray — বাইরের <code>bytearray(...)<\/code> মোড়কটা বাড়তি; ক্ষতি নেই, শুধু বাড়তি সতর্কতার দাগ।"},{"a":407,"b":415,"text":"<b>যমজ ভাই — ঘোরার স্কেল, আর round trip-এর পূর্তি<\/b>: <code>read_ros_scale_angular<\/code> উপরের ফাংশনের হুবহু যমজ — তফাত শুধু ঠিকানায়: <code>ORDER[\"ROS_SCALE_ANGULAR\"][0]<\/code> মানে 0x44, docstring <code>'''Read the turning speed scaling.'''<\/code>। বাকি সব — অপেক্ষা, <code>None<\/code>, <code>__unpack()<\/code> প্রহরী, <code>[0:2]<\/code> জোড়া, ÷1000, <code>\"%.3f\"<\/code> — হুবহু এক। আর এখানেই Part 14-এর লেখার উত্তর ফেরে: <code>set_ros_scale_angular<\/code> তখন 1.05 পাঠিয়েছিল <code>int(scale*1000)<\/code> হয়ে 1050 — দুই byte-এ সাজানো (ছোট প্রান্তের byte 26, বড়টি 4)। আজ পড়তে গিয়ে সেই দুই byte আবার জোড়া লাগল: 26 + 256×4 = 1050, তারপর 1050/1000.0 = 1.05, আর <code>\"%.3f\"<\/code> ছাপল <code>\"1.050\"<\/code> — লেখা আর পড়া মুখোমুখি দাঁড়িয়ে এক গোল যাত্রা সম্পূর্ণ হলো। ছোট্ট অদৃশ্য স্মারক: দুই ফাংশনের মাঝের line 406 ফাঁকা দেখালেও ভেতরে চারটে space লুকানো — কারো উপকারে আসে না, কারো ক্ষতিও করে না, শুধু টিকে আছে।"},{"a":417,"b":422,"text":"<b>লুকিয়ে থাকা param-এর আত্মপ্রকাশ<\/b>: docstring <code>'''Read the Motor PID tuning numbers.'''<\/code> — কিন্তু <b>মন দিয়ে দেখো<\/b> প্রথম লাইনটাই: <code>self.__request(ORDER[\"MOTOR_PID\"][0], 1)<\/code>। ঠিকানার পাশে হঠাৎ একটা <b>দ্বিতীয় argument — 1<\/b>। Part 7-এ <code>__request<\/code>-এর সইয়ে এই ঘরটা শুরু থেকেই ছিল (ডিফল্ট <code>param=0<\/code>), অথচ এই পর্যন্ত কোনো পাঠক বা লেখক সেটি ভরে দেয়নি — সব প্রশ্ন চলেছে চুপচাপ 0 নিয়ে; আজ প্রথম সেই খালি ঘরে মান বসল। পর্যবেক্ষণ থেকে নিয়মটা স্পষ্ট: motor PID-র প্রশ্নে param = 1, একটু পরে IMU-তে দেখবে param = 5, আর বাকি সব প্রশ্ন 0 — অর্থাৎ এই মানটিই ঠিক করে দেয় নিচের বোর্ড কোন সংগ্রহ-ড্রয়ার (কোন bank) থেকে উত্তর তুলে দেবে। পরের তিন লাইন চেনাই: অপেক্ষা, <code>str_data = None<\/code>, <code>if self.__unpack():<\/code> — প্রহরী পাস করলেই নিচে সংখ্যা-তোলা।"},{"a":423,"b":427,"text":"<b>এক ঘর ডানে সরানো জানালা, আর ×100/÷1000 গল্প<\/b>: scale-পাঠক যেখানে <code>[0:2]<\/code> থেকে শুরু করেছিল, PID-র তিন মান সেখান থেকে <b>এক byte পরে<\/b>: <code>pid_p<\/code>-র জোড়া <code>[1:3]<\/code>, <code>pid_i<\/code>-র <code>[3:5]<\/code>, <code>pid_d<\/code>-র <code>[5:7]<\/code> — প্রতিটি int16, প্রতিটির শেষে <code>/1000.0<\/code>, আর <code>\"%.3f, %.3f, %.3f\"<\/code> এক লাইনে তিনটাই ছাপে। তাহলে byte 0-এ কী? কোড যা দেখাচ্ছে: সেই ঘরের বিষয়বস্তু তিন জোড়ার কোনোটারই ভেতরে নেই — লেখক সেটিকে ছাড়িয়ে গেছেন; echo বা bank-চিহ্নের মতো ভাবা যায়, যদিও কোড নিজে কিছু দাবি করে না — নিশ্চিত শুধু পর্যবেক্ষণ: জানালা এক ঘর ডানে। এবার <b>এই Part-এর সবচেয়ে কৌতূহল-জাগানো অসমতা<\/b>: Part 15-এ লেখার সময় প্রতিটি PID মান যেত <code>int(pid_p*100)<\/code> হয়ে — 0.8 গিয়ে 80, 0.06 গিয়ে 6, 0.5 গিয়ে 50 — অথচ এই পড়ার রাস্তায় ভাগ 1000। <i>ধরে নিলে<\/i> বোর্ড সঞ্চিত byte-গুলোই যথারীতি ফেরায়, ফল দাঁড়ায় 80/1000 = 0.08, 6/1000 = 0.006, 50/1000 = 0.05 — ছাপা হয় <code>\"0.080, 0.006, 0.050\"<\/code>। লেখার ×100 আর পড়ার ÷1000-এর এই দশগুণ ফারাক কোডে কোথাও ব্যাখ্যা করা নেই; বোর্ডের ভেতরে হয়তো মেলানোর কিছু আছে, তবে সেটা অনুমান — আমাদের চোখের সামনে শুধু দুই প্রান্তের সংখ্যা।"},{"a":429,"b":439,"text":"<b>IMU-র PID — একই কাঠামো, অন্য চাবি<\/b>: <code>'''Read the IMU PID tuning numbers.'''<\/code> — গঠন motor-সংস্করণের হুবহু প্রতিলিপি: একই অপেক্ষা, একই <code>None<\/code>, একই <code>__unpack()<\/code> প্রহরী, একই সরানো জানালা <code>[1:3]<\/code>, <code>[3:5]<\/code>, <code>[5:7]<\/code>, একই <code>/1000.0<\/code> আর একই তিন-দশমিকের ছাপ। তফাত দুটোই অর্থবহ: ঠিকানা <code>ORDER[\"IMU_YAW_PID\"][0]<\/code>, আর param = <b>5<\/b> — motor-এর 1-এর বদলে। দুই প্রশ্ন একই ভাষায় লেখা, কিন্তু বোর্ডকে আলাদা করে জানানো হচ্ছে কোন সংগ্রহ থেকে উত্তর চাই। এই জোড়ায় জোড়া param-ই (1 আর 5, বাকি সব 0) এই পরিবারের লুকানো ঠিকানা-ব্যবস্থা — একটামাত্র সংখ্যার তফাতে পুরো ডেটা-উৎস বদলে যায়। <b>লক্ষ করো<\/b>, এই নিয়মটা কোনো comment-এ লেখা নেই — দুই লাইনের তুলনা থেকেই বেরিয়ে আসা পর্যবেক্ষণ।"},{"a":441,"b":448,"text":"<b>সংস্করণ-পাঠক: যেখানে কোনো unpack নেই<\/b>: <code>'''Read the microcontroller's software version.'''<\/code> — প্রশ্ন যায় <code>ORDER[\"FIRMWARE_VERSION\"][0]<\/code> অর্থাৎ 0x51 ঠিকানায়, param ছাড়া: Part 4-এর টেবিলে একমাত্র এই এন্ট্রি, যার পেছনে লেখার কোনো খালি স্লটই নেই — নিছক একটি বিশুদ্ধ প্রশ্ন। প্রহরী-অংশ আগের মতোই, শুধু ভেরিয়েবলের নাম এবার <code>str_version<\/code> — <code>str_data<\/code> নয়; ছোট্ট নাম-বদল, অর্থ পরিষ্কার করে। আসল তফাত ভেতরের এক লাইনে: <code>str_version = \"%d.%d.%d\" % (self.__rx_DATA[0], self.__rx_DATA[1], self.__rx_DATA[2])<\/code> — কোনো <code>struct.unpack<\/code> নেই, কোনো জোড়া নেই, কোনো ভাগ নেই। তিনটি <b>কাঁচা byte<\/b>, প্রতিটি নিজেই একেকটি পূর্ণসংখ্যা — 1, 2, 5 ফিরলে ছাপা হয় <code>\"1.2.5\"<\/code>। কারণ স্বাভাবিক: সংস্করণ-সংখ্যার প্রতিটি অংশ ছোট, এক byte-ই যথেষ্ট — int16-এর দুই-byte ভাষা এখানে অপ্রয়োজনীয়।"}],"math":{"intro":"এই Part-এর গণিত তিন সিঁড়িতে: প্রথমে ÷1000 decode-এর সঙ্গে Part 14-এর ×1000 encode-এর হুবহু আয়না-সম্পর্ক, তারপর PID-জানালার এক-byte সরে-যাওয়া, শেষে সংস্করণের কাঁচা byte-বনাম-int16 পথনির্বাচন — সঙ্গে তিনটি হাতে-গোনা উদাহরণ।","levels":[{"label":"Level 1 — decode: ভাগ যা গুণের আয়না","latex":"\\[ v = b_0 + 256\\,b_1, \\qquad s = \\frac{v}{1000} \\]","text":"প্রথম byte b_0, দ্বিতীয়টি b_1 — little-endian int16 মানে v = b_0 + 256·b_1 (<code>'h'<\/code> ফরম্যাট, Part 14-এর pack-এর ঠিক উল্টো পথ)। তারপর s = v/1000: লেখার দিকে v = int(s·1000), পড়ার দিকে এই ভাগ — একই সিঁড়ির দুই দিক, আর <code>%.3f<\/code> নিচে নামার দরজার শেষ ছোঁয়া।"},{"label":"Level 2 — এক-ঘর সরানো জানালা","latex":"\\[ P = \\frac{\\mathrm{int16}(d_1, d_2)}{1000}, \\quad I = \\frac{\\mathrm{int16}(d_3, d_4)}{1000}, \\quad D = \\frac{\\mathrm{int16}(d_5, d_6)}{1000} \\]","text":"একই inbox, কিন্তু লেন্স এক ঘর ডানে — scale-পাঠকের <code>[0:2]<\/code>-এর জায়গায় এখানে <code>[1:3]<\/code> থেকে শুরু, তারপর পাশাপাশি তিন জোড়া। byte d_0 তিন জোড়ার কোনোটারই ভেতরে পড়ে না; কোড সরে-যাওয়াটা দেখায়, ব্যাখ্যা করে না। প্রতিটি জোড়ার ভেতরের নিয়ম অবিকল Level 1-এর মতোই।"},{"label":"Level 3 — কাঁচা byte বনাম int16","latex":"\\[ \\mathrm{version} = d_0 \\, . \\, d_1 \\, . \\, d_2, \\qquad 0 \\leq d_i \\leq 255 \\]","text":"সংস্করণ-পাঠক কোনো জোড়া লাগায় না — প্রতিটি byte নিজেই একটি অংশ। একই byte-দ্বয়কে int16 পথে নিলে d_0 আর d_1 মিশে যেত একটিমাত্র বড় সংখ্যায় (1 + 256·2 = 513) — তিন অংশের পরিচয় মুহূর্তে হারিয়ে যেত। ছোট সংখ্যার জন্য ছোট পাত্র: এখানে byte-ই সঠিক আকার।"}],"numeric":[{"latex":"\\[ \\frac{26 + 256 \\cdot 4}{1000} = \\frac{1050}{1000} = 1.05 \\;\\Rightarrow\\; \\text{print: } 1.050 \\]","text":"Part 14-এ 1.05 লেখার সময় সঞ্চিত হয়েছিল 1050 = 26 + 256·4 — দুই byte, ছোট প্রান্ত আগে। আজকের পাঠক সেই দুই byte আবার জুড়ে 1000 দিয়ে ভাগ করল: 1.05 ফেরত, ছাপা হলো <code>\"1.050\"<\/code> — লেখা আর পড়া মুখোমুখি দাঁড়িয়ে round trip সম্পূর্ণ।"},{"latex":"\\[ 0.8 \\to 80, \\; 0.06 \\to 6, \\; 0.5 \\to 50 \\;(\\times 100); \\qquad \\frac{80}{1000} = 0.080, \\quad \\frac{6}{1000} = 0.006, \\quad \\frac{50}{1000} = 0.050 \\]","text":"লেখার ×100, পড়ার ÷1000 — <i>বোর্ড সঞ্চিত byte-ই ফেরায়<\/i> ধরে নিলে প্রতিটি মান দশ ভাগের এক হয়ে ফেরে: 0.8 লিখে <code>\"0.080\"<\/code> পড়া। Part 15-এর এই অসমতাই চোখে দেখা রূপ নিল এই তিন জোড়া সংখ্যায় — ধারণাটা স্পষ্ট করে লেবেল করা, কারণ কোড বোর্ডের ভেতরের ব্যবহার নিয়ে কিছু বলে না।"},{"latex":"\\[ (d_0, d_1, d_2) = (1, 2, 5) \\;\\Rightarrow\\; \\text{print: } 1.2.5 \\]","text":"সংস্করণ byte তিনটি সোজা তিন অংশ হয়ে ছাপা হয় — ভাগ নেই, জোড়া নেই। একই (1, 2) জোড়াকে int16 করলে হত 1 + 256·2 = 513: চেনা স্বাক্ষর <code>\"1.2.5\"<\/code>-এর জায়গায় অচেনা <code>\"513...\"<\/code>-জাতীয় কিছু।"}],"mapping":[{"code":"scale = struct.unpack('h', bytearray(self.__rx_DATA[0:2]))[0]/1000.0","math":"\\[ s = \\frac{v}{1000}, \\qquad v = \\mathrm{int16}\\big( \\mathrm{rx\\_DATA}[0:2] \\big) \\]","text":"লাইনের শেষ জোড়া — unpack-এর জোড়া আর <code>/1000.0<\/code> — সমীকরণের হুবহু দুই হাত: আগে দুই byte মিলিয়ে v, তারপর হাজারে ভাগ করে s। Part 14-এর গুণের উল্টো রাস্তা এক লাইনেই decode হয়ে যায়।"},{"code":"self.__request(ORDER[\"MOTOR_PID\"][0], 1)","math":"\\[ \\mathrm{query}(\\mathrm{addr}, \\; \\mathrm{bank} = 1) \\]","text":"দ্বিতীয় argument-টিই bank-চাবি: addr বলে কী জিজ্ঞেস করতে হবে, bank বলে কোন সংগ্রহ থেকে উত্তর আসবে — motor-এর চাবি 1, IMU-রটি 5, আর না বললে ডিফল্ট 0। সারা পরিবারে একমাত্র এই জোড়া লাইনই সেই চাবি ঘুরিয়ে দেয়।"}],"failure":["সহজ ভুলে <code>/1000.0<\/code>-এর জায়গায় <code>/100.0<\/code> লেখা হলে 1050/100 = 10.5 — ছাপা হতো <code>\"10.500\"<\/code>; Part 14-এর 2-ছাদের ওপরে এমন মান অসম্ভব জেনেও কোনো সতর্কবার্তা ছাড়াই দশগুণ স্কেল-ভুল নীরবে বসে থাকত।","প্রশ্নটা সবার মতো param ছাড়া <code>self.__request(ORDER[\"MOTOR_PID\"][0])<\/code> পাঠালে বোর্ড ডিফল্ট 0-ই দেখত — ভুল বা খালি bank থেকে উত্তর: হয় অর্থহীন PID সংখ্যা, নয় মিলবে এমন চিঠিই আসত না।","সংস্করণ byte-দের সোজা int16 পথে নামালে d_0 = 1 আর d_1 = 2 মিশে 1 + 256·2 = 513 — <code>\"1.2.5\"<\/code>-এর জায়গায় <code>\"513...\"<\/code>-জাতীয় অর্থহীন স্ট্রিং, আর তৃতীয় অংশ একেবারে হাওয়ায় মিলিয়ে যেত।","PID-র জানালা যদি scale-পাঠকের মতো <code>[0:2]<\/code> থেকে শুরু হতো, byte 0-এর অজানা মান <code>pid_p<\/code>-র জোড়ায় ঢুকে পড়ত — তিনটি মানই এক ঘর করে সরে ভুল জোড়া বানাত, অথচ ছাপার আকার ঠিক থাকত বলে চোখে ধরাই পড়ত না।"]},"robot":{"correct":"মূল script-এর ফ্যাক্টরি-যাচাই ছক্কা এদের দিয়েই ঘোরে: লিখো (Part 14/16-এর set), এই পাঠকে পড়ে দেখো, save করো, reboot করো, আবার পড়ো — readback-এ যা দেখা যায় রিবুটের পর firmware ঠিক সেটাই ব্যবহার করে; 1.05 লেখার পর <code>\"1.050\"<\/code> ফিরে আসাই প্রমাণ যে স্কেল বোর্ডের স্মৃতিতে ঠিকঠাক বসেছে।","incorrect":"এই পাঠকগুলোকে লাইভ সেন্সর-মাপ ভেবে বসলে ধোঁকা খাবে — এরা wheel বা IMU-র তাজা পাঠ ফেরায় না, ফেরায় বোর্ডে জমা রাখা configuration-সংখ্যা, যা কেউ নতুন করে না লিখলে আজও কালও একই মান দেয়; রোবট ঘুরুক বা থামুক, এই পাঠে কিছু বদলায় না — বদল আসে শুধু নতুন write-এ।"},"id":"part-17","start":397,"end":448,"lang":"python","animType":null,"flags":[]},{"n":18,"fname":"config_robot.py","enTitle":"print_all_firmware_parm — The Report Card","explain":[{"a":450,"b":451,"text":"<b>রিপোর্ট কার্ডের দেয়াল-লেখা<\/b>: <code># --- PRINT ALL INFO ---<\/code> নতুন অধ্যায়ের ব্যানার, আর তার সঙ্গী <code># Asks the microcontroller for every single setting and prints it nicely to the screen<\/code> পুরো পরিকল্পনাটা এক লাইনে বলে দেয় — microcontroller-কে প্রতিটি setting-এর জন্য আলাদা করে জিজ্ঞেস করা হবে, উত্তরগুলো সাজিয়ে পর্দায় ছাপা হবে। এই Part সিরিজের একটা শ্বাস-ফেলার পর্ব: নতুন কোনো protocol-নিয়ম নেই, নতুন কোনো setter নেই — Part 16–17-এ একে একে বানানো reader-দের মধ্যে আটটিকে এখানে পরপর ডাকা হবে, আর তাদের উত্তর মিলেই রোবটের পূর্ণাঙ্গ firmware-অডিট।"},{"a":452,"b":455,"text":"<b>ফাংশনের জন্ম, তারপর প্রথম প্রশ্ন<\/b>: <code>def print_all_firmware_parm(self):<\/code> — নামেই কাজের সারাংশ; কোনো parameter নেই, ফেরানোর কিছুও নেই, কাজ শুধু ছাপা। ভেতরের ছাঁদ প্রথম জোড়াতেই স্পষ্ট — <code>version = self.read_version()<\/code> reader-টাকে ডাকে; সে Part 16–17-এর সেই চেনা কঙ্কালই চালায়: request, ঠিক 0.01 s অপেক্ষা (চিপের ভাবনার সময়), তারপর unpack — সফল হলে firmware-এর সংস্করণ-স্ট্রিং, ব্যর্থ হলে <code>None<\/code>। তারপর <code>print(\"version:\", version)<\/code>। <b>মন দিয়ে দেখো<\/b> — লেবেলটা বাহুল্য নয়: আটটা মান নাম-ছাড়া পরপর ছাপলে কোনটা কী তা আন্দাজ করতে হতো; লেবেলই সংখ্যার স্তূপটাকে পড়ার যোগ্য রিপোর্ট কার্ড করে তোলে। জোড়ার পরের ফাঁকা লাইন (এখানে 455) প্রতিটি প্রশ্নকে নিজস্ব ব্লকে সাজিয়ে রাখে।"},{"a":456,"b":460,"text":"<b>দ্বিতীয় ও তৃতীয় প্রশ্ন — নলের নাম-পরিচয়<\/b>: <code>domain_id = self.read_ros_domain_id()<\/code> ROS 2-এর বার্তা-আদান-প্রদানের চ্যানেল-নম্বর জেনে আনে, <code>print(\"domain_id:\", domain_id)<\/code> তা ছাপে; এক ফাঁক (line 458) পেরিয়ে <code>ros_namespace = self.read_ros_namespace()<\/code> রোবটের নিজের নাম-স্ট্রিং ফেরায়, <code>print(\"ros_namespace:\", ros_namespace)<\/code> তা বসায়। <b>লক্ষ করো<\/b> — কোনো নতুন যন্ত্রপাতি নেই; reader আলাদা হলেও কঙ্কাল এক, ফলে প্রতিটি লাইন-জোড়ার দামও একই — একটি করে পূর্ণ round trip। লেবেল আর ফাংশন-নামের মিলটা সচেতন, তাই রিপোর্ট পড়তে গিয়ে কিছুই অনুমান করতে হয় না।"},{"a":462,"b":466,"text":"<b>চতুর্থ ও পঞ্চম প্রশ্ন — calibration-এর হৃদয়<\/b>: <code>ros_scale_line = self.read_ros_scale_line()<\/code> সোজা-গতির scaling, <code>ros_scale_angular = self.read_ros_scale_angular()<\/code> ঘোরার গতির scaling — report card-এ দুই মাপকাঠি পাশাপাশি দুই লাইনে, আর ফোল্ডারের নাম linear velocity calibration হওয়ায় মূল দর্পণ সেই প্রথম লাইনটিই — সোজা-গতির scaling। <b>মন দিয়ে দেখো<\/b> সময়ের খেলাটা: Part 20-এর main save করার ঠিক পরেই এই ফাংশন ডাকে, তাই ছাপা সংখ্যাগুলো flash-এ সদ্য-লেখা সত্যেরই প্রতিধ্বনি — লিখে ফিরে পড়ে নিশ্চিত হওয়া, যত্নশীল শিক্ষকের অভ্যাস। ছাপার আগে এখানে কোনো গণিত বা রূপান্তর নেই — reader-দের ভেতরেই মান সাজানো; এই ফাংশন শুধু প্রদর্শনীর মঞ্চ। মাঝের ফাঁকা লাইন 464 scale-পরিবারকে আগের পরিচয়-পরিবার থেকে আলাদা করে।"},{"a":468,"b":472,"text":"<b>ষষ্ঠ ও সপ্তম প্রশ্ন — টিউনিং-সংখ্যার খাতা<\/b>: <code>motor_pid_parm = self.read_motor_pid_parm()<\/code> মোটরের টিউনিং-সংখ্যা, <code>imu_pid_parm = self.read_imu_yaw_pid_parm()<\/code> IMU-র yaw-টিউনিং-এর সংখ্যা — ফাংশনের নামেই <code>imu_yaw<\/code> শব্দটি বহন করছে। ছোট্ট স্টাইল-তফাত চোখ এড়ায় না: বাকি সব লেবেল underscore-এ বাঁধা (<code>\"ros_scale_line:\"<\/code>), কিন্তু <code>print(\"motor pid parm:\", motor_pid_parm)<\/code> আর <code>print(\"imu pid parm:\", imu_pid_parm)<\/code> ফাঁকা-জায়গাওয়ালা নামে — ছাপা রিপোর্টের চেহারায় সামান্য বদল, কাজে শূন্য প্রভাব। আরেকটা অদৃশ্য স্মারক: line 467 পুরো ফাঁকা নয় — একটা মাত্র space অক্ষর লেগে আছে; কারো উপকারে আসে না, কারো ক্ষতিও করে না, শুধু বাকি ফাঁকাগুলোর সঙ্গে তফাত করে টিকে আছে।"},{"a":474,"b":475,"text":"<b>অষ্টম ও শেষ প্রশ্ন, তারপর পুরো হিসাব<\/b>: <code>arm_mid = self.read_arm_mid_value()<\/code> আর্ম servo-দের সংরক্ষিত মাঝ-অবস্থান এনে দেয়, <code>print(\"arm_mid:\", arm_mid)<\/code> দিয়ে report card-এর পর্দা নামে — লেবেল সংক্ষিপ্ত, ফাংশন-নামের <code>value<\/code> শব্দটি পর্দায় নেই। আট প্রশ্নের প্রতিটির দাম একই: একটি request, 0.01 s অপেক্ষা, তারপর unpack-ডিকোড — অতএব পুরো রিপোর্টের খরচ আটটি পূর্ণ round trip: শুধু ঘুমেই 8 × 0.01 s = 0.08 s, তার ওপর প্রতিটি উত্তরের decode-সময়। আর <b>সবচেয়ে বড় নিশ্চয়তা<\/b>: প্রতিটি ডাক READ-ONLY — request-পথ কখনোই Part 7-এর <code>data_changed<\/code> পতাকা ওঠায় না, তাই এই পুরো অডিট চালানোর পরেও রোবটের flash-এ এক বিট-ও বদলায় না, কোনো save-এর দরজাও খোলে না। রিপোর্ট কার্ড পড়া মানে খাতা নোংরা করা নয়।"}],"math":null,"robot":{"correct":"কোড ঠিকঠাক চললে টেকনিশিয়ান এক নজরে রোবটের পুরো configuration দেখে পায় — <code>version<\/code> থেকে <code>arm_mid<\/code> পর্যন্ত আটটি লেবেল-যুক্ত লাইন terminal-এ পরপর ছাপা হয়; Part 20-এর main ঠিক save-এর পরেই এটি ডাকে, তাই ছাপা সংখ্যাগুলো flash-এ সদ্য-লেখা সত্য — সেটিং আসলেই বসেছে কি না তার চোখে-দেখা প্রমাণ।","incorrect":"যদি ভাবো এই function রোবটে কিছু বদলে দেবে, সেই আশা এই কোডে ভঙ্গ হয় — এটি নিছক অডিট, একটি সংখ্যাও লেখে না, তাই এর চালানোর পর রোবটের আচরণের কিছুই বদলায় না; এমনকি কোনো read ব্যর্থ হলেও error ওঠে না — সেই লাইনে শুধু <code>None<\/code> ছাপা হয়, রিপোর্টে ফাঁকা ঘর, কোনো সতর্কধ্বনি নেই।"},"id":"part-18","start":450,"end":475,"lang":"python","animType":null,"flags":[]},{"n":19,"fname":"config_robot.py","enTitle":"Main I — Platform Detective & COM Scan","explain":[{"a":478,"b":480,"text":"<b>কারখানার চিঠি, তারপর শুরুর ঘোষণা<\/b>: তিন সারির comment — <code># --- THE MAIN SCRIPT ---<\/code> জানিয়ে দেয় এখান থেকেই ফাইলের চালানোর-অংশ, <code># This part only runs if you click \"Play\" on this specific file.<\/code> আগাম সতর্ক করে যে নিচের ব্লক শুধু এই ফাইলটা নিজে চাললেই কাজ করবে, আর <code># It is a test/config script used by the Yahboom team to configure the robot before shipping it to you.<\/code> — এই লাইনটাই পুরো ফাইলের জন্মসনদ: রোবট তোমার হাতে পৌঁছানোর <i>আগে<\/i> Yahboom-এর দল ঠিক এই script দিয়েই তার কারখানার কনফিগারেশন করেছিল। তুমি যে রোবট নিয়ে ঘুরছ, তার প্রথম দিনের সেটিং-আপের দরজা এই পাতাতেই খোলা — এই Part থেকেই শুরু হচ্ছে সেই কনফিগারেশন-আচার।"},{"a":481,"b":486,"text":"<b>মাস্টার-সুইচ, তারপর পরিবেশ-জরিপ<\/b>: <code>if __name__ == '__main__':<\/code> (481) — Python-এর চিরকারী প্রশ্ন: এই ফাইল কি নিজেই চলছে, নাকি অন্য কেউ একে import করেছে? <code>python3 config_robot.py<\/code> লিখে সরাসরি চালালে <code>__name__<\/code>-এর মান ঠিক <code>'__main__'<\/code> হয় আর এই ব্লক জেগে ওঠে; কেউ ফাইলটাকে module হিসেবে টেনে নিলে ব্লকটা একদম চুপ — factory script-টার নিজস্ব চালু/বন্ধ সুইচ এটাই। ভেতরে <code>import platform<\/code> (483) ব্লকের মধ্যেই বসানো — দরকার পড়ার মুহূর্তে import, আগে থেকে নয়; <code>debug = False<\/code> (484) মানে এই দৌড়ে debug-ছাপা বন্ধ থাকবে; <code>device = platform.system()<\/code> (485) OS-এর নাম জোগাড় করে, আর <code>print(\"Read device:\", device)<\/code> (486) সেই উত্তর terminal-এ দেখিয়ে দেয়। <b>মন দিয়ে দেখো<\/b> — এই ব্লকের ভেতরেই একটু পরে গ্লোবাল <code>robot<\/code> জন্ম নেবে, ঠিক যেটার ওপর Part 12-এর <code>set_arm_calib_offset_all<\/code> অজান্তেই ভরসা করে বসে আছে (ওর ভেতরের কল <code>self<\/code>-কে নয়, এই গ্লোবাল <code>robot<\/code>-কেই খোঁজে) — সেই গল্পের শেষ কড়াটা এই লাইনগুলোতেই পূরণ হয়।"},{"a":488,"b":489,"text":"<b>দুই পথের চৌরাস্তা<\/b>: comment <code># Check if we are on Windows or Linux (Jetson)<\/code> ম্যাপটা এঁকে দেয় — এবার ফর্ক। <code>if device == 'Windows':<\/code> — এই এক লাইনেই পুরো script-এর গতিপথ ঠিক হয়ে যায়: <code>platform.system()<\/code>-এর উত্তর <code>'Windows'<\/code> হলে পড়তে হবে কারখানার ল্যাপটপের পথে (নিচের COM-স্ক্যান), অন্য যেকোনো উত্তর — Jetson-এর Linux-এ <code>'Linux'<\/code> — যাবে অন্য শাখায়। লক্ষ করো, পরীক্ষাটা একদিকের: শুধু Windows-কে চেনা হয়, বাকি সবাই এক ঝুড়িতে 'Windows নয়'।"},{"a":490,"b":491,"text":"<b>স্ক্যানের কাউন্টার-বীজ<\/b>: comment <code># Search for a COM port to connect to<\/code> লক্ষ্য ঘোষণা করে — চাই একটা খোলা COM port। <code>com_index = 1<\/code> (491) — কাউন্টারের বীজ ১, কিন্তু সত্যিকারের প্রথম প্রোব হবে <b>COM2<\/b>: কারণ পরের লাইনের লুপ প্রতি ঘুরের শুরুতেই, চেষ্টার <i>আগেই<\/i>, কাউন্টার এক করে বাড়িয়ে নেয়। তার মানে এই স্ক্যান কোনোদিন COM1 পরীক্ষা করে দেখে না — সোর্স কেন-এর ব্যাখ্যা দেয় না, শুধু ফলটা লক্ষণীয় রেখে দেয়।"},{"a":492,"b":503,"text":"<b>COM-শিকারের অফুরান লুপ<\/b>: <code>while True:<\/code> (492) জ্বলে ওঠে, আর প্রথম কাজই <code>com_index = com_index + 1<\/code> (493) — আগে-বাড়ানো, তাই চেষ্টার সিঁড়ি COM2 থেকে উঠতে থাকে। <code>com = 'COM%d' % com_index<\/code> (495) পুরোনো %-স্টাইলের ফরম্যাটে নামটা বানায়, <code>robot = MicroROS_Robot(com, debug=debug)<\/code> (496) সেই port খুলে ফাইলের শুরুতে (line 27) সংজ্ঞাত class-টার একটা বস্তু তৈরি করে — খোলা গেলেই <code>break<\/code> (497): শিকার মিলেছে, লুপ ফেল। না খুললে <code>except:<\/code> (498) — <b>খালি হাতের bare except<\/b>, যেটা শুধু serial-এরর বলে আলাদা করে না, এই মুহূর্তে ওঠা যেকোনো exception-ই গিলে ফেলে; এমনকি স্ক্যানের মাঝে Ctrl+C চাপলে সেটাও এখানেই 'এই port নেই' সাজে হারিয়ে যায় — এই over-catchই এর সবচেয়ে লক্ষণীয় স্বভাব। ভেতরে <code>if com_index &gt; 256:<\/code> (499): কাউন্টার ২৫৬ পেরোলেই <code>print(\"-----------------------No COM Open--------------------------\")<\/code> (500) ছেপে <code>exit(0)<\/code> (501) — দুটো সূক্ষ্মতা মন দিয়ে দেখো: শর্তটা পরীক্ষিত হয় ব্যর্থতার <i>পরে<\/i>, তাই COM256-ও ব্যর্থ হলে তার পরের নম্বরটুকুতেও একটা চেষ্টা হয়ে যায়, আর বিদায়-কোড 0 প্রথাগত অর্থে 'সাফল্য' — অথচ ঘটনা ছিল সম্পূর্ণ ব্যর্থতা। <code>continue<\/code> (502) কার্যত শোভাবর্ধন মাত্র — লুপ এমনিতেই ঘুরত। সফল হলে <code>print(\"--------------------Open %s---------------------\" % com)<\/code> (503) কোন দরজায় ঢুকলাম সেটা ছেপে জানিয়ে দেয়।"},{"a":504,"b":506,"text":"<b>Jetson-পথ: ঠিকানা জানা, তাই খোঁজ নেই<\/b>: <code>else:<\/code> (504) — Windows নয়, অর্থাৎ Jetson-এর Linux। comment <code># On the Jetson (Linux), connect to this specific USB port name<\/code> যে প্রতিশ্রুতি দিচ্ছে, কোড হুবহু তা-ই রাখে: <code>robot = MicroROS_Robot(port=\"/dev/myserial\", debug=debug)<\/code> (506) — কোনো স্ক্যান নেই, কোনো চেষ্টা-ভুল নেই; সোজা Part 5-এর সেই udev alias <code>/dev/myserial<\/code>-এ জুড়ে যাওয়া — USB adapter যতবার খুলে আবার লাগানো হোক না কেন, নাম বদলায় না, তাই ঠিকানা আগেই জানা। ছোট্ট অসমতাও লক্ষ করো: Windows-শাখায় port-নামটা ছিল positional আর্গুমেন্ট (<code>com<\/code>), এখানে <code>port=<\/code> keyword — দুই রাস্তাই একই class-দরজায় পৌঁছায়, আর দুই শাখাতেই জন্ম নেয় সেই একই গ্লোবাল <code>robot<\/code>, যার ডাক পরের Part-গুলোতে বারবার শুনতে পাবে।"}],"math":null,"robot":{"correct":"কারখানার Windows ল্যাপটপে চালালে script নিজেই COM2 থেকে একটা একটা port খুলতে চেষ্টা করে, প্রথম খোলা port পেয়েই তার নাম (যেমন Open COM5) ছেপে রোবটের controller-এর সঙ্গে যুক্ত হয়ে পড়ে; একই script Jetson-এ চালালে কোনো স্ক্যান ছাড়াই সোজা <code>/dev/myserial<\/code>-এ জুড়ে যায় — রোবট-পাশের কোড এক চুলও বদলায় না, বদলায় শুধু কম্পিউটার-পাশের সন্ধান-পথ।","incorrect":"যদি ভাবো রোবট নিজেই ঠিক করে কোন কম্পিউটারের সঙ্গে জুড়বে — তবে ভুল দিকে তাকিয়ে আছে: সন্ধানটা পুরোপুরি কম্পিউটারের পক্ষ থেকে চালে, controller শুধু serial-এর ওপারে চুপ করে অপেক্ষা করে। Windows ল্যাপটপে কোনো controller যুক্ত না থাকলে এই দৌড় শেষ পর্যন্ত 'No COM Open' ছেপে বন্ধ হয়ে যায় — রোবট-পাশে তখন কিছুই ঘটেনি, ঘটেছে শুধু ল্যাপটপের ২৫০-র বেশি ফাঁকা দরজায় পরপর কড়া নাড়া।"},"id":"part-19","start":478,"end":506,"lang":"python","animType":null,"flags":[]},{"n":20,"fname":"config_robot.py","enTitle":"Main II — Verify, Configure, Save, Reboot","explain":[{"a":508,"b":511,"text":"<b>কারখানা-আচারের প্রথম ধাপ — পরিচয়-যাচাই<\/b>: <code>print(\"Waiting to read the car type\")<\/code> terminal-এ ঘোষণা করে দেয় যে স্ক্রিপ্ট এখন শুধু একটাই জিনিসের অপেক্ষায় — রোবটের পরিচয়-চিঠি। <code>while True:<\/code> মানে এই অপেক্ষার কোনো মেয়াদ নেই; প্রতি পাকে <code>car_type = robot.read_car_type()<\/code> সিরিয়াল নল দিয়ে জিজ্ঞেস করে 'তুমি কোন গাড়ি?', আর <code>if car_type is not None:<\/code> খালি-উত্তর ছেঁকে ফেলে — নলে কোনো ডেটা না এলে বা তারে ভুল জায়গায় গুঁজে দিলে <code>read_car_type()<\/code> <code>None<\/code> ফেরায়, আর তখন নিচের ছাপা-পরীক্ষার কিছুই চলে না, লুপটা নিঃশব্দে আবার শুরু হয়। ধৈর্যই এখানকার নীতি — সঠিক উত্তর না আসা পর্যন্ত কেউ হাল ছাড়ে না।"},{"a":512,"b":515,"text":"<b>মিল পেলেই দরজা খোলে<\/b>: <code>print(\"car_type:\", car_type)<\/code> প্রতিটি খালি-না-উত্তরে পাওয়া নম্বরটি terminal-এ দেখিয়ে দেয় — চোখে দেখে যাচাইয়ের সুযোগ। তারপর আসল তুলনা: <code>if int(car_type) == robot.CAR_TYPE:<\/code> — Part 5-এ দেখেছি এই driver ক্লাসের <code>CAR_TYPE<\/code> মান 7; <code>int()<\/code>-এ মুড়ে নেওয়ার কারণ, সিরিয়াল থেকে আসা উত্তর string/byte হিসেবে আসে — আকার নয়, অর্থ মেলাতে হয়। মিললেই <code>break<\/code>, আর সোর্সের comment নিজেই কারণ বলে দেয়: <code># Verify we are talking to the right robot<\/code> — ভুল রোবটের সঙ্গে কথা বলে সেটিং লিখতে বসা বিপদের পথ। মিল না হলে <code>time.sleep(.5)<\/code> আধা সেকেন্ড অপেক্ষা করে আবার জিজ্ঞাসা — অর্থাৎ কোনো ভিন্ন গাড়ি-নম্বরের যন্ত্র তারে জুড়ে থাকলেও সে উত্তর দিতে থাকবে, এই লুপ কিন্তু কখনোই <code>break<\/code> করাবে না।"},{"a":518,"b":519,"text":"<b>কমেন্ট-হয়ে-যাওয়া টুলবক্স — প্রথম জোড়া<\/b>: <code># robot.set_ros_domain_id(30) # You could change the domain ID here!<\/code> আর <code># robot.set_motor_pid_parm(0.8, 0.06, 0.5) # You could tune the motor speeds here!<\/code> — দুটোই পুরোদস্তুর কল, শুধু শুরুতে <code>#<\/code> বসানো বলে মৃত। teacher-comment-গুলো ইংরেজিতেই ইশারা করে কী করা যেত: চাইলে ROS 2-এর domain ID 30-এ সরানো, চাইলে motor-এর PID-এর তিনটি মান (0.8, 0.06, 0.5) দিয়ে স্পিড টিউন করা। কারিগরের ঐচ্ছিক লিভার — হাতের নাগালেই রাখা, কিন্তু বন্ধ করেই পাঠানো, যাতে রোবট ডিফল্ট আচরণ নিয়েই কারখানা ছাড়ে; দুর্ঘটনার পথে কেউ ঢুকতে পারে না।"},{"a":520,"b":521,"text":"<b>দুই লাইনের সিদ্ধান্ত — গোটা ক্যালিব্রেশনের ফসল<\/b>: <code>robot.set_ros_scale_line(1.0)<\/code> লেগে-চলার scale হিসেবে 1.0 লিখে দেয় (কোনো সংশোধন নেই — এই folder-এর launch node-এ মাপা দূরত্ব-সংখ্যাটি বসার ঘর ঠিক এটাই), আর <code>robot.set_ros_scale_angular(1.05)<\/code> ঘোরার scale হিসেবে 1.05 — আগের folder-এর ঘূর্ণন-মাপার পুরো আচারের চূড়ান্ত ফল এই একটি সংখ্যা, এখন একই স্ক্রিপ্টে পাশাপাশি কারখানায় পাকা হচ্ছে। মন দিয়ে দেখো — এই স্ক্রিপ্ট নিজে মাপ নেয় না; Parts 1-3-এর calibrate_linear node মানটি <b>মেপেছিল<\/b>, এখানে সেটি firmware-এ <b>বসে যায়<\/b>। আর Part 6-এর নিয়ম মনে করো: এই ধরনের প্রতিটি setter-পাঠ <code>data_changed<\/code> পতাকাটিকে <code>True<\/code> করে দেয় — দুটি কল মানে পতাকা উঠে গেছে, কিন্তু এখনো কিছুই সেভ হয়নি; রোবট-পাশের ডেটা হালনাগাদ হয়েছে, ফ্ল্যাশে লেখা এখনো বাকি।"},{"a":522,"b":523,"text":"<b>টুলবক্সের শেষ জোড়া — হাতের মাঝ-অবস্থান<\/b>: <code># arm_mid_value = [2000, 2000, 2000, 2000, 1486, 3100]<\/code> ছয়-সদস্যের একটি list — প্রথম চারটি মান একই 2000, শেষ দুটি আলাদা: 1486 ও 3100 — আর <code># robot.set_arm_mid_value(arm_mid_value)<\/code> সেই list রোবটের কাছে পাঠানোর কল। দুই লাইনের শুরুতেই <code>#<\/code> — ড্রয়ারটা এঁটে আছে, টানা হয়নি। এভাবেই টুলবক্সের তিনটি অস্ত্র (domain ID, motor PID, arm mid value) পাশাপাশি শুয়ে আছে, আর মাঝখানের দুই সক্রিয় লাইন একা দাঁড়িয়ে — স্ক্রিপ্টের আসল উদ্দেশ্য এক নজরেই পরিষ্কার।"},{"a":525,"b":526,"text":"<b>খাতায় কলম চালানো — ঠিক একবার<\/b>: comment <code># Save any changes to the microcontroller<\/code> কাজটির নাম বলে দেয়। <code>robot.update_config_data()<\/code> — Part 10-এ দেখেছিলাম, এই কল রোবট-পাশে গিয়ে <code>if data_changed:<\/code> শর্তের অপেক্ষায় থাকে; আর 520-521-এর দুটি setter-পাঠ সেই পতাকাকে <code>True<\/code> করেই রেখেছে। তাই এবার সেই <code>if<\/code> প্রথমবার সত্য হয়, আর ফ্ল্যাশে লেখার জন্য হুবহু <b>একটি<\/b> save-চিঠি বেরোয় — দুটি পরিবর্তন হলেও চিঠি একটাই, কারণ পতাকা অ্যাকুমুলেট করে, গোনে না। Part 6 পতাকা তুলেছিল, Part 10-এর শর্ত এসে সেই পতাকার দাম শোধ করল — লেজার বন্ধ।"},{"a":528,"b":530,"text":"<b>রিপোর্ট কার্ড<\/b>: comment <code># Print everything currently saved on the robot<\/code>। আগে <code>time.sleep(1)<\/code> — এক সেকেন্ডের বিরতি, save-চিঠি রোবট-পাশে পৌঁছে নিজের কাজ সেরে নেওয়ার সময় পায়; তারপর <code>robot.print_all_firmware_parm()<\/code> — Part 18-এ দেখা সেই ফার্মওয়্যার-প্যারামিটারের ছাপাখানা: firmware-এ ওই মুহূর্তে সেভ-হয়ে-থাকা সব মান terminal-এ নেমে আসে। <b>লক্ষ করো<\/b> অবস্থানটা — save-এর পরে, কিন্তু reboot-এর আগে: নতুন 1.05 ঠিকঠাক বসেছে কি না, রিবুটের আগেই চোখের সামনে প্রমাণ।"},{"a":532,"b":534,"text":"<b>রিবুট — নতুন সেটিং জেগে ওঠার মুহূর্ত<\/b>: <code># Reboot the microcontroller so the new settings take effect<\/code> — comment-টাই পুরো ব্যাখ্যা। আগের মতোই <code>time.sleep(1)<\/code> এক সেকেন্ড অপেক্ষা, তারপর <code>robot.reboot_device()<\/code> — microcontroller নিজেকে রিস্টার্ট করে; Part 10-এ দেখেছিলাম রিবুটের পর রোবট-পাশ প্রায় ২ সেকেন্ডে ফিরে আসে। ফ্ল্যাশে লেখা scale-মানগুলো নতুন করে চালু হয়ে কাজে লাগে রিবুটের পরেই — তাই এই কলটা না হলে লেখাপড়া সত্ত্বেও নতুন সেটিং কার্যত অচলই থেকে যেত।"},{"a":536,"b":542,"text":"<b>সৎ মৃত লুপ<\/b>: comment <code># Keep it running<\/code> কানে শোনায় 'চলতে থাকো', কিন্তু নিচের চিত্রটা মন দিয়ে দেখো — <code>try:<\/code>-এর ভেতর <code>while False:<\/code>: শর্তটি আক্ষরিক অর্থেই <code>False<\/code>, তাই লুপ-দেহ <b>একবারও চলে না<\/b>; ভেতরের <code>time.sleep(1)<\/code> অবিরাম-চলার ঘুম হতে পারত, কিন্তু <code># robot.beep(100)<\/code> — হার্টবিট-বিপটিও কমেন্টে বন্ধ করা। ফলে <code>except:<\/code> + <code>pass<\/code> শাখাটিও ধরার মতো কোনো exception কখনো পায় না। পুরো কাঠামোটা তাই একটি নিষ্ক্রিয় placeholder — 'চালু রাখো'-র খোলস, যার হৃদস্পন্দন খুলে সরানো। এখানে কোনো ভুল নেই যে ঠিক করতে হবে; <code>while False<\/code>-এর সততাটাই আসল — নিজের মৃত্যু লুকায় না, ঘোষণা করে দেয়।"},{"a":543,"b":544,"text":"<b>বিদায়-সালাম<\/b>: <code>time.sleep(.1)<\/code> — শেষ আদেশের পরে ছোট্ট এক দশমাংশ-সেকেন্ডের বিরতি, সম্ভবত নল বন্ধ করার আগে সময়টুকু দেওয়ার সতর্কতা; তারপর <code>del robot # Cleanly close the USB port<\/code> — <code>robot<\/code> নামটি মুছে দিলে বানানো <code>MicroROS_Robot<\/code> object-এর শেষ reference-টিও খসে যায়, Python-এর garbage collector সেটিকে সরিয়ে নেয়, আর object-এর ভেতরের pyserial বন্দর তখন বন্ধ হয়ে যায় — comment-এর ভাষায় 'Cleanly close the USB port'। যে সিরিয়াল দরজা দিয়ে এতক্ষণ চিঠি চালাচালি চলছিল, গোটা কারখানা-আচারের শেষ কাজটি সেই দরজা মৃদু হাতে লাগানো।"}],"math":null,"robot":{"correct":"স্ক্রিপ্টটি প্রথমে সঠিক রোবটের সঙ্গে কথা বলছে কি না যাচাই করে (car_type মিললেই এগোয়), তারপর লেগে-চলার scale 1.0 আর ঘোরার scale 1.05 লিখে দেয়, <code>update_config_data()<\/code> দিয়ে ফ্ল্যাশে সেভ করে, <code>print_all_firmware_parm()<\/code> দিয়ে প্রমাণ ছাপে, রিবুট করে নতুন সেটিং চালু করে, শেষে সিরিয়াল বন্ধ করে বিদায় নেয় — রোবট কারখানা ছাড়ে তার firmware-এ 1.05 বেঁচে থাকা অবস্থায়।","incorrect":"এই স্ক্রিপ্ট চালালেই ভাবা যে দূরত্ব-ক্যালিব্রেশন-মাপ (Parts 1-3-এর calibrate_linear node) এখানে চলবে — সেই আশা এই কোড ভঙ্গ করে: সেই node মানটি মেপেছিল, এই স্ক্রিপ্ট মাপা-মানটি firmware-এ বসিয়ে দেয় মাত্র। আর শেষের <code>while False:<\/code> লুপটিকে 'ভাঙা অপেক্ষা' ভাবাটাও ভুল প্রত্যাশা — লুপটি ইচ্ছাকৃতভাবে মৃত, স্ক্রিপ্ট সেখানে এক মুহূর্তও আটকে থাকে না, সোজা বিদায়-লাইনে চলে যায়।"},"id":"part-20","start":508,"end":544,"lang":"python","animType":"bootSeq","flags":[]}];

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const pad2 = n => String(n).padStart(2, '0');
