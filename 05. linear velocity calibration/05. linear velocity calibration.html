শব্দভাণ্ডার এই তালিকায় সেঁটে আছে, আর ফাইলের বাকি অংশ ঠিক এই খাতাটাই ঘুরে ঘুরে ব্যবহার করবে।"}],"math":{"intro":"মেনুর প্রতিটা ঠিকানা একেকটা হেক্সাডেসিমাল সংখ্যা — 0x13 থেকে 0x81। আজকের গণিত-অংশে সেই সংখ্যা-পদ্ধতিটাই তিন তলায় খোলা হলো: ষোল-ভিত্তির স্থানীয় হিসাব, এক byte-এর ধারণক্ষমতার সীমা, আর ঠিকানাগুলোর ছড়ানো-সাজানো টেবিল।","levels":[{"label":"Level 1 — ষোল-ভিত্তির স্থানীয় মান","latex":"\\[ n = d_1 \\cdot 16 + d_0, \\qquad 0x44 = 4 \\cdot 16 + 4 = 68 \\]","text":"হেক্সাডেসিমাল মানে base-16: ডান দিকের digit এককের জায়গায়, বাঁ দিকের digit ষোলের জায়গায়; digit হিসেবে 0-9-এর পরে A = 10, B = 11, ... F = 15। যেকোনো দুই-digit ঠিকানা তাই এক লাইনের হিসাব — <code>ROS_SCALE_ANGULAR<\/code>-এর 0x44 মানে 4×16+4 = 68 দশমিক।"},{"label":"Level 2 — এক byte-এর ঝুড়ি","latex":"\\[ 8\\ \\text{bits} \\;\\Rightarrow\\; 0 \\le n \\le 2^8 - 1 = 255, \\qquad 0x00 \\le n \\le 0xFF \\]","text":"মেনুর ঠিকানাও, ঘরে বসানো প্রতিটা মানও — সবাইকে একেকটা byte হয়ে তারে চড়তে হয়, আর এক byte মানেই মাত্র 256টা আলাদা মান (0x00 থেকে 0xFF)। এই ছোট্ট ঝুড়ির সীমাই বলে দেয় ঠিকানাগুলো কেন এত ছোট সংখ্যা, আর কেন 0xFF-এর ওপরে ওঠার প্রশ্নই ওঠে না।"},{"label":"Level 3 — ছড়ানো ঠিকানা-টেবিল","latex":"\\[ 0x13 \\le \\mathrm{addr} \\le 0x81 \\;\\Leftrightarrow\\; 19 \\le \\mathrm{addr} \\le 129, \\qquad 14 \\ll 256 \\]","text":"মেনুর চৌদ্দটি ঠিকানা 0x13 (19) থেকে 0x81 (129) — এক byte-এর মান-জগতের মাঝামাঝি একটা ফাঁকা-ফাঁকা সারি: 0x13-0x25 মোটর-হাতের গুচ্ছ, 0x41-0x44 ROS গুচ্ছ, 0x50-0x51 প্রশ্নের গুচ্ছ, 0x80-0x81 অ্যাডমিনের গুচ্ছ। 256টা সম্ভাব্য ঘরের মধ্যে মাত্র 14টা নেওয়া — ফাঁকগুলো এই টুলের অজানা নয়, বোর্ডের অন্য কমান্ডের জন্য রাখা ঘর।"}],"numeric":[{"latex":"\\[ 0x2A = 2 \\cdot 16 + 10 = 42 \\]","text":"A মানে 10 — হাতে-কলমে একটা অনুশীলন: 0x2A-কে দশমিকে খুললে 42। মেনুর ঠিকানা নয় এটা, কিন্তু নিয়মটা একই: বাঁ digit-কে 16 দিয়ে গুণ, ডান digit যোগ।"},{"latex":"\\[ 0xFF = 15 \\cdot 16 + 15 = 255, \\qquad 0xFC = 15 \\cdot 16 + 12 = 252 \\]","text":"255 হলো এক byte-এর সর্বোচ্চ মান — এই সংখ্যাটাই Part 5-এ প্রোটোকলের দরজার ঘণ্টা (HEAD) হিসেবে ফিরে আসবে; আর 252 (0xFC) সেই DEVICE_ID, যেটাকে চিঠির খামে লেখা থাকবে — দুটোই পরের Part-এর চেনা মুখ।"},{"latex":"\\[ 0x5F = 5 \\cdot 16 + 15 = 95 \\]","text":"95 — এই ফাইলের 'ম্যাজিক কোড': Part 10-এ reboot আর factory-reset-এর মতো ভারী আদেশের খামায় ঠিক এই সংখ্যাটাই বসবে, কমেন্টে যার নাম secret reboot code।"}],"mapping":[{"code":"\"MOTOR_PID\": [0x13, 0, 0, 0, 0, 0, 0, 0],","math":"\\[ 0x13 = 1 \\cdot 16 + 3 = 19 \\]","text":"তালিকার প্রথম ঘরের মানটাই ঠিকানা: 0x13 লেখার ধরনটা Python-এর সাজসজ্জা মাত্র — তারের ওপারে পৌঁছায় ছোট্ট সংখ্যা 19; বোর্ড ওই নম্বরটাকেই চেনে, নাম বা ফরম্যাট নয়।"},{"code":"\"FIRMWARE_VERSION\": [0x51],","math":"\\[ \\left| [\\,0x51\\,] \\right| = 1 \\;\\Rightarrow\\; \\mathrm{payload} = 0, \\qquad 0x51 = 5 \\cdot 16 + 1 = 81 \\]","text":"দৈর্ঘ্যই বলে দেয় চরিত্র: তালিকার দৈর্ঘ্য 1 মানে payload-এর ঘর শূন্য — এ কোনো নির্দেশ নয়, খালি প্রশ্ন; ভেতরে পাঠানোর কিছু নেই বলেই বোর্ডের কাজ শুধু উত্তর দেওয়া।"}],"failure":["কেউ যদি 0x15-কে 'পনেরো' পড়ে (দশমিক ভেবে) ঠিকানা 15-এ চিঠি পাঠাত, বোর্ড আসলে 0x15 = 21 নম্বর আইটেমের (CAR_TYPE) বদলে 15 নম্বর শুনত — মেনুতে এমন নম্বরই নেই, তাই চ্যাসিস-প্রশ্ন হয় নিঃশব্দে হারিয়ে যেত, নয়তো ভুল রেজিস্টার সাড়া দিত।","কোনো ঠিকানা যদি 0xFF-এর ওপরে লেখা হতো (যেমন 0x100), এক byte-এর ঝুড়িতে সে আর খেলে না — 256-র বেশি দিতে নয়টা bit লাগে; খামার ঠিকানা-ঘর মানটাকে কেটে-ছিঁড়ে ভুল বাড়িতে পৌঁছে দিত, প্রতিবার।","তারের ওপারে নাম ধরে ডাকা যায় ভেবে যদি কেউ <code>\"MOTOR_PID\"<\/code> শব্দটাই text হিসেবে পাঠাত, বোর্ড শুনত শুধু ASCII byte-এর এক ঝাঁকি (M একা মানে 77) — কোনো আইটেম-নম্বরের সঙ্গেই মেলে না, তাই ঘুরে আসত শুধু নীরবতা।","দুটো আইটেমের ঠিকানা যদি এক হয়ে যেত (ধরো ROS_SCALE_LINE আর ROS_SCALE_ANGULAR দুজনেরই 0x43), বোর্ডের চোখে দুই নির্দেশ একাকার হয়ে যেত — সামনে-চলার scaling বদলাতে গিয়ে হঠাৎ ঘূর্ণনের scaling উল্টে যেত; আলাদা আলাদা নম্বর রাখাটাই এই মেনুর নীরব শর্ত।"]},"robot":{"correct":"এই অংশটা নিজে কোনো চাকা ঘোরায় না — এ হলো শব্দভাণ্ডারের খাতা: ফাইলটা চালু হলে মেনুটা মেমরিতে তৈরি হয়ে প্রস্তুত হয়ে বসে থাকে, আর পরের Part-গুলো যখন এই তালিকাগুলোর ফাঁকা ঘর ভরে খামা পাঠায়, তখন রোবটের নিচের বোর্ড ঠিক সেই ছোট্ট নম্বরগুলো চিনে সাড়া দেয় — হাত নড়ে, ROS সেটিং বদলায়, ভার্সন-প্রশ্নের উত্তর ফেরে।","incorrect":"যদি ভাবো Python-এর সুন্দর নামগুলো (<code>\"MOTOR_PID\"<\/code>, <code>\"ROBOT_REBOOT\"<\/code>) নিজেরাই তার পেরিয়ে বোর্ডে পৌঁছায়, সেই আশা এই কোড মেনে নেয় না — খাতার নামগুলো Python-এর ভেতরেই থেকে যায়, তারে চড়ে যায় কেবল ছোট্ট বাইনারি সংখ্যা (19, 68, 129); USB তার ধরে ট্র্যাফিক শুনলে কোথাও কোনো নাম পাওয়া যাবে না, শুধু খালি সংখ্যার খামা।"},"id":"part-04","start":1,"end":24,"lang":"python","animType":null,"flags":[]},{"n":5,"fname":"config_robot.py","enTitle":"MicroROS_Robot — Opening the Wire & Magic Numbers","explain":[{"a":27,"b":28,"text":"<b>দোভাষীর জন্ম<\/b>: <code>class MicroROS_Robot():<\/code> — Part 4-এর ORDER menu যেন রেস্টুরেন্টের মেনু-কার্ড, আর এই ক্লাস সেই কার্ড হাতে নেওয়া ওয়েটার। পরের লাইনের comment-ই তার পরিচয়পত্র: <code># This class is the \"Translator\" between the Jetson (Python) and the bottom board (Microcontroller)<\/code> — Jetson ওপরের বড় কম্পিউটার, কথা বলে Python আর ROS 2-এর ভাষায়; নিচের ছোট্ট microcontroller শোনে শুধু তারে-বোয়া কাঁচা byte। দুই জগতের মাঝখানের পুরো দোভাষী এই একটি ক্লাস — <b>মন দিয়ে দেখো<\/b>, ORDER menu-র পরে এই ফাইলের প্রায় সবকিছু (Part 6-এর <code>__send<\/code> থেকে শুরু করে Part 18-এর রিপোর্ট-ছাপা পর্যন্ত) এই ক্লাসের ভেতরেই বাস করে।"},{"a":30,"b":32,"text":"<b>জন্মের মুহূর্তেই তার খোলা<\/b>: <code>def __init__(self, port=\"/dev/myserial\", debug=False):<\/code> — ডিফল্ট argument দুটিই বাস্তব-বুদ্ধি: কেউ নাম না বললেও অবজেক্ট তৈরি হলেই সে Jetson-এর প্রস্তুত পোর্টে গিয়ে বসে। <code>/dev/myserial<\/code> কোনো অস্থায়ী নাম নয় — <code>ttyUSB0<\/code>-এর মতো প্রতিবার বদলে-যেতে-পারে এমন নামের বদলে controller-এর USB পোর্টের স্থায়ী udev alias। comment ঘোষণা করে <code># Open the serial wire! 2,000,000 bits per second is VERY fast.<\/code>, আর ঠিক পরের লাইনেই সেটা কাজে খাটে: <code>self.__ser = serial.Serial(port, 2000000, timeout=0.05)<\/code> — সেকেন্ডে ২০ লাখ bit-এর নলকূপ, দুই প্রান্তকে এই গতিতেই সেট থাকতে হয়; <code>timeout=0.05<\/code> মানে প্রতিটি read সর্বোচ্চ 0.05 সেকেন্ড অপেক্ষা করে — চিঠি না এলে খালি হাতে ফেরার বৈধ অনুমতি। অর্থাৎ অবজেক্ট জন্মানো মাত্রই তারটা খোলা, কিন্তু এই মুহূর্তে একটা byte-ও পাঠানো হয়নি — চিঠি লেখা পরের Part-দের কাজ।"},{"a":34,"b":40,"text":"<b>পাঠের state machine-এর হিসাব-খাতা আর খালি inbox<\/b>: <code># Variables for the \"State Machine\" (reading data byte by byte)<\/code> — বোর্ডের জবাব-চিঠি তারে দিয়ে এক byte এক byte করে আসে, তাই 'এখন কোথায় আছি' মনে রাখার চারটি খাতা লাগে: <code>self.__rx_FLAG = 0<\/code> — পড়ার সিঁড়ির কোন ধাপে আছি (0 থেকে 5: দরজার ঘণ্টা খোঁজা থেকে checksum মেলানো পর্যন্ত), <code>self.__rx_COUNT = 0<\/code> — এ পর্যন্ত কটি byte পড়া হলো, <code>self.__rx_ADDR = 0<\/code> — চিঠিটা কোন address-এর বার্তা, <code>self.__rx_LEN = 0<\/code> — চিঠিটা কত লম্বা হওয়ার কথা। তারপর গুদাম-সাজানো: <code>self.__RX_BUF_LEN_MAX = 40<\/code> দিয়ে inbox-এর সাইজ ঠুঁকে <code>self.__rx_DATA = bytearray(self.__RX_BUF_LEN_MAX)<\/code> দিয়ে ৪০টি শূন্য byte-এর ট্রে বানানো — আসা data জমা হবে এখানেই। constructor-এ এই একবারই বরাদ্দ; তারপর পুরো জীবন একই ট্রেতে লেখা-মোছা-আবার লেখা। <b>লক্ষ করো<\/b> — নামগুলোর গায়ে দুটি underscore (<code>__rx_FLAG<\/code>) Python-এর privacy-রীতি (name mangling): এগুলো ক্লাসের ভেতরের হিসাব, বাইরে থেকে নাড়ার নয়।"},{"a":42,"b":45,"text":"<b>দুই বিলম্ব, দুটি পতাকা<\/b>: <code>self.__send_delay = 0.01<\/code> — চিঠি পাঠানোর পর 0.01 সেকেন্ড থামা, comment-এর ভাষায় <code># Pause after sending so we don't overwhelm the wire<\/code> — একটার পিঠে আরেকটা চিঠি চেপে তারটাকে ভাসানো চলবে না। <code>self.__read_delay = 0.01<\/code> — প্রশ্ন করার পরের ছোট্ট অপেক্ষা, <code># Pause after asking a question so the chip has time to think<\/code> — ওপারের চিপের ভাবার সময়। <code>self.__debug = debug<\/code> — constructor-এর দ্বিতীয় argument এসে এখানে বসল; True করলে পরের Part-গুলোতে তারের কাঁচা 1-আর-0 ছাপা শুরু হবে। আর <code>self.__data_changed = False<\/code> — নীরব দারোগানি: কোনো setting বদলে পাঠালেই Part 6-এর <code>__send<\/code> এটাকে True করে দেবে, আর Part 10 তখন বুঝবে বোর্ডের স্থায়ী স্মৃতিতে save করার মতো অসংরক্ষিত পরিবর্তন জমে আছে — জন্মে খাতা পরিষ্কার, তাই শুরু হয় False দিয়ে।"},{"a":47,"b":52,"text":"<b>ভাষার ব্যাকরণ — পাঁচটি magic number<\/b>: comment বলেই দিচ্ছে <code># Protocol \"Magic Numbers\" (The rules of the language)<\/code>। <code>self.__HEAD = 0xFF<\/code> — প্রতিটি চিঠির প্রথম byte, comment-এর উপমায় দরজার ঘণ্টা (<code># Every message MUST start with 0xFF (Like ringing a doorbell)<\/code>); পরে যে state machine জবাব পার্স করবে, সে এই ঘণ্টা শুনেই পড়া শুরু করে। <code>self.__DEVICE_ID = 0xFC<\/code> — যার সঙ্গে কথা বলছি তার নাম। এবার এই Part-এর সবচেয়ে সূক্ষ্ম দুই লাইন। <code>self.__RETURN_ID = self.__DEVICE_ID - 1<\/code> — বোর্ড জবাব দেওয়ার সময় নিজের নামের ঠিক এক ঘর কম নম্বর (0xFB) ব্যবহার করে; <b>লক্ষ করো<\/b>, 0xFB কোথাও হাতে লেখা নেই — মানটা <code>DEVICE_ID<\/code> থেকে উৎপন্ন, তাই নতুন বোর্ডে ID বদলালে জবাব-নামও সঙ্গে সঙ্গে বদলে যাবে। <code>self.__COMPLEMENT = 257 - self.__DEVICE_ID<\/code> = 5 — checksum-এর আগে-থেকে-বসানো জমা, Part 6-এর <code>__send<\/code> ঠিক এটাকে খাটাবে; এটাও একই উৎস থেকে জন্মায়। শেষে <code>self.__READ_DATA = 0x50<\/code> — 'data পড়তে চাই'-এর সংকেত; <b>মন দিয়ে দেখো<\/b>, Part 4-এর ORDER menu-র <code>REQUEST_DATA<\/code> item-এর নম্বরও এই 0x50 — মেনু-কার্ড আর প্রোটোকল-ব্যাকরণ একই শব্দ মুখস্থ করে রেখেছে।"},{"a":54,"b":54,"text":"<b>প্রকাশ্য একটি নাম, আর একটা স্বীকৃত অনুমান<\/b>: <code>self.CAR_TYPE = 7<\/code> — constructor-এর ভেতরে বাইরে থেকে পড়ার মতো একমাত্র নাম (বাকি সবার গায়ে দুটো underscore-এর পর্দা), কারণ ফাইলের শেষে মূল script বোর্ড থেকে পড়ে-আনা car type-এর সঙ্গে ঠিক এই 7-ই মিলিয়ে নিশ্চিত করে যে সঠিক রোবটের সঙ্গেই কথা হচ্ছে। কিন্তু comment-টা শব্দ বেছে চলেছে: <code># What type of robot is this? (7 likely means Mecanum wheels)<\/code> — 'likely' শব্দটাই স্বীকারোক্তি যে মেকানাম-দাবিটা লেখকের অনুমান, এই ফাইলের কোথাও প্রমাণিত সত্য নয়; আমরাও 7-কে 'প্রত্যাশিত মান' হিসেবেই থাকব, চ্যাসিস-তত্ত্বটা অনুমানের তাকেই থাকতে দেব।"}],"math":{"intro":"এই Part-এর গণিত ছোট কিন্তু ফন্দিযুক্ত: দুটি গুরুত্বপূর্ণ ধ্রুবক কেউ হাতে-লেখা নয় — দুটোই <code>DEVICE_ID<\/code> থেকে অঙ্কে জন্মায়, আর তৃতীয় স্তরে দেখা যাবে সেই জন্মের কারণ: খামের byte-গুলো checksum থেকে নিজে থেকেই মুছে যায় — একটা সুনিয়োজিত বাতিলকরণ (cancellation)।","levels":[{"label":"Level 1 — জবাব-নামের অঙ্ক","latex":"\\[ R = D - 1, \\qquad D = \\mathrm{0xFC} = 252 \\;\\Rightarrow\\; R = 251 = \\mathrm{0xFB} \\]","text":"D মানে <code>DEVICE_ID<\/code> — আমরা যার কাছে চিঠি পাঠাই; R মানে <code>RETURN_ID<\/code> — বোর্ড জবাবের খামে যে নাম লেখে। সম্পর্কটা সরল: ঠিক এক ঘর পিছিয়ে থাকা। নাম হার্ডকোড না করে সম্পর্ক লেখাটাই নকশার জয় — D বদলালে R আপনিই বদলে যায়, এই লাইনে আর আঙুল দিতে হয় না।"},{"label":"Level 2 — checksum-এর প্রি-চার্জ","latex":"\\[ c = 257 - D = 257 - 252 = 5 \\]","text":"c মানে <code>COMPLEMENT<\/code>। Part 6-এর <code>__send<\/code> তার যোগফল শুরু করবে ঠিক এই c দিয়ে, তারপর বার্তার byte-গুলো যোগ হবে — অর্থাৎ checksum আসলে c দিয়ে চার্জ-হয়ে-শুরু হওয়া একটা রানিং total। 257 = 256 + 1 সংখ্যাটা এলোমেলো নয় — 256 হলো সেই ভাঁজ-সংখ্যা যাতে checksum শেষে ভাঁজ হয় (<code>% 256<\/code>); বাড়তি 1-এর কাজ পরের স্তরে ফাঁস হবে।"},{"label":"Level 3 — সুনিয়োজিত বাতিলকরণ","latex":"\\[ 255 + 252 + 5 = 512 = 2 \\times 256 \\;\\equiv\\; 0 \\pmod{256} \\]","text":"চিঠির খামের তিনটি নির্দিষ্ট সংখ্যা — HEAD (255), DEVICE_ID (252) আর প্রি-চার্জ c (5) — যোগ করলে ঠিক 256-এর দুই গুণ, আর checksum শেষে <code>% 256<\/code>-এ ভাঁজ হয়; কাজেই এই তিনটি খাম-সংখ্যা যোগফলে কোনো চিহ্নই রাখে না — নিজে থেকেই শূন্য হয়ে মুছে যায়। ফল: checksum শুধু বার্তার প্রাণ (দৈর্ঘ্য, order, data) মাপে, খাম মাপে না। ফন্দিটা আরও গভীর — c = 257 − D ধরলে 255 + D + c = 255 + 257 = 512, D যা-ই হোক না কেন; বাতিলকরণটা D-নিরপেক্ষ। এর পুরো ফল Part 6-এ ধরা যাবে।"}],"numeric":[{"latex":"\\[ D = \\mathrm{0xFC} = 252, \\qquad R = D - 1 = 251 = \\mathrm{0xFB} \\]","text":"ষোলো-ভিত্তি থেকে দশমিকে হাতে-গোনা: 0xFC = 15×16 + 12 = 240 + 12 = 252; এক ঘর পিছিয়ে 251, আর 251 = 0xFB (15×16 + 11)। বোর্ডের প্রতিটি জবাব-চিঠি এই নামেই আসবে — একটাই বিয়োগ, তবু পুরো প্রোটোকলের পরিচয়-পত্র।"},{"latex":"\\[ 255 + 252 = 507, \\qquad 507 + 5 = 512 = 2 \\times 256 \\]","text":"খাম-বাতিলকরণ হাতে ধরে দেখা: HEAD আর DEVICE_ID মিলে 507 — 256-এর পরের গুণিতক 512 থেকে ঠিক ৫ কম; প্রি-চার্জ c = 5 সেই ফাঁকটাই ভরে 512 বানায়, আর <code>% 256<\/code>-এ ভাঁজ করলে ভাগশেষ শূন্য। 5 তাই কাকতাল নয় — 257 − 252 হিসেবে বের করা একটা সংখ্যা।"},{"latex":"\\[ 7 \\;(\\text{value}) \\qquad \\text{vs.} \\quad \\mathrm{0x15} = 21 \\;(\\text{address}) \\]","text":"একই নামের দুই ভিন্ন ভূমিকা: Part 4-এর ORDER menu-তে <code>CAR_TYPE<\/code> item-এর নম্বর 0x15 = 1×16 + 5 = 21 — সেটা জিজ্ঞাসার ঠিকানা; আর এই লাইনের 7 — সেটা প্রত্যাশিত উত্তরের মান। একটা চিঠির খামে লেখে, অন্যটা চিঠির ভেতরের কথা — দুটোকে এক করে ফেললে তুলনাই অর্থহীন হয়।"}],"mapping":[{"code":"self.__RETURN_ID = self.__DEVICE_ID - 1","math":"\\[ R = D - 1 \\]","text":"কোডটি হুবহু সমীকরণ — ডান পাশে একমাত্র উৎস D, বাম পাশের R তার ছায়া। এক লাইনে 'জবাব-নাম পাঠানো-নামের সন্তান' নীতিটা লেখা, তাই D বদলালে এই লাইনে হাত দিতে হয় না — সম্পর্ক নিজেই খাতা মেলায়।"},{"code":"self.__COMPLEMENT = 257 - self.__DEVICE_ID","math":"\\[ c = 257 - D \\;\\Rightarrow\\; 255 + D + c = 512 \\]","text":"257 = 256 + 1 — ভাঁজ-সংখ্যার চেয়ে ঠিক এক বেশি। তাই D যা-ই হোক না কেন, HEAD-এর 255-এর সঙ্গে c মিলে মোট সর্বদা 512, অর্থাৎ <code>% 256<\/code>-এ সর্বদা শূন্য — একটি বিয়োগে খাম-বাতিলকরণের পুরো ফন্দি লেখা।"}],"failure":["<code>__COMPLEMENT<\/code> যদি হাতে-লেখা 5 হতো (আর কেউ নতুন বোর্ডের জন্য <code>DEVICE_ID<\/code> বদলাত), তাহলে 255 + নতুন D + 5 আর 256-এর গুণিতক হতো না — Part 6-এর প্রতিটি checksum জন্মের মুহূর্তেই ভুল চার্জ নিয়ে বেরোত, বোর্ড প্রতিটি চিঠি নষ্ট ভেবে ফেলে দিত; দুটোই D থেকে জন্মানোয় এই বিপদ সেখানেই নেই — দুটো সবসময় একসঙ্গে নড়ে।","<code>timeout=0.05<\/code>-এর জায়গায় 0 বসালে প্রশ্ন পাঠানোর পর চিপের উত্তর-লেখার আগেই প্রতিটি read খালি হাতে ফিরত — প্রতিটি জবাবকেই 'আসেনি' বলে রায় দিতে হতো, প্রশ্নোত্তরের খেলাই আর জমত না; এই 50 মিলিসেকেন্ডের ধৈর্যই তারের ওপারের সময় কেনে।","inbox যদি 12 byte-এর চিঠি ধরার মতো বড় না হতো — যেমন কেউ <code>RX_BUF_LEN_MAX<\/code> 8 করে দিত — তাহলে Part 16-এর arm-mid পাঠের শেষ byte-গুলোর জায়গাই থাকত না: ট্রের সীমা ছাড়িয়ে লিখতে গিয়ে Python-এর bytearray সরাসরি ভুল ধরাত (IndexError), পুরো পাঠ ভেঙে পড়ত।","দুই প্রান্ত যদি 2,000,000-এর গতিতে না মিটত — এক পাশে পুরনো ধীর মান বসানো থাকত — তারে আসা সংকেত এলোমেলো byte-এ ভেঙে যেত: লাখ শব্দের কোলাহলে দরজার ঘণ্টা 0xFF আর খুঁজে পাওয়া যেত না, কথা শুরু হওয়ার আগেই শেষ। দুই দোভাষীর এক গতিতে সেট থাকাটাই এই ভাষার প্রথম শর্ত।"]},"robot":{"correct":"ঠিকমতো চালু হলে এই constructor শুধু USB তারটা খুলে ২০ লাখ বাট-এ সেট করে, ৪০ বাইটের খালি inbox আর পড়া-পাঠানোর সব হিসাব-খাতা গুছিয়ে বসে থাকে — এই মুহূর্ত পর্যন্ত রোবটে কিচ্ছু পাঠানো হয়নি, কোনো চাকা বা servo নড়েনি; পরের Part-দের <code>__send<\/code> আর <code>__request<\/code> তখন এই খোলা তার ধরেই কথা শুরু করবে।","incorrect":"এই ধ্রুবকগুলোকে যদি 'রোবট কনফিগার করার সুইচ' ভাবো — যেমন <code>CAR_TYPE = 7<\/code> বদলালেই চ্যাসিস বদলে যাবে, বা <code>DEVICE_ID<\/code> ঘষে অন্য বোর্ডে ঢুকে পড়া যাবে — সেই আশা এই কোডে ভঙ্গ হয়: এরা কিছুই কনফিগার করে না, শুধু দুই পক্ষের আগে-থেকে-চলা ভাষার বানান মুখস্থ করে রাখে; Python-পক্ষে ভুল বানান বসালে রোবটের চরিত্র বদলাবে না — বরং দোভাষী নিজেই বোর্ডের চিঠি আর বুঝতে পারবে না।"},"id":"part-05","start":27,"end":55,"lang":"python","animType":null,"flags":[]},{"n":6,"fname":"config_robot.py","enTitle":"__send — Building the Envelope & Checksum","explain":[{"a":57,"b":58,"text":"<b>পাঠানোর দপ্তরের দরজা<\/b>: <code># --- SENDING DATA ---<\/code> — সেকশন-দরজা খুলে দিল; Part 5-এ জন্ম নেওয়া সিরিয়াল-তার, <code>__HEAD<\/code>, <code>__DEVICE_ID<\/code>, <code>__COMPLEMENT<\/code> — সব 'magic number' এখানে এসে কাজে লাগবে। পরের comment-টা পুরো পরিকল্পনা এক নিঃশ্বাসে বলে দেয়: <code># This builds the \"envelope\" and mails it.<\/code> — খাম বানাও, তারপর ডাকে দাও। <b>মন দিয়ে দেখো<\/b>, এই একটি মেথডই এই ফাইলের <b>send primitive<\/b>: Parts 11-14-এর প্রতিটি কনফিগার-বোতাম নিজে কিছুই পাঠায় না — সবাই এসে এই এক মেথডের কাঁধে চিঠি তুলে দেয়। তাই এই Part-এর প্রতিটি লাইন বোঝা মানে এক লাইনে পুরো প্রোটোকলটা বুঝে ফেলা।"},{"a":59,"b":63,"text":"<b>নাম-লুকানো মেথড, আর চিঠির প্রস্তুতি-তিন<\/b>: <code>def __send(self, key, len=1):<\/code> — নামের শুরুতে দুই আন্ডারস্কোর থাকায় Python-এর name mangling জেগে ওঠে: ক্লাসের বাইরে থেকে এই নাম সরাসরি ডাকা যায় না, দোকানের খাতায় তা <code>_MicroROS_Robot__send<\/code> ছদ্মনামে লেখা থাকে — অর্থাৎ 'এটা এই ক্লাসের ঘরোয়া হাতিয়ার'। এই প্রাইভেসির দামও আছে: কেউ ভবিষ্যতে <code>MicroROS_Robot<\/code>-কে subclass করে নিজের <code>__send<\/code> লিখলে দুটো আলাদা ম্যাঙ্গলড-নামে ছড়িয়ে যাবে, একটা আরেকটাকে override-ও করবে না। Parameter দুটি: <code>key<\/code> — ORDER-মেনুর কোন আইটেম, আর <code>len=1<\/code> — কতটি ডেটা-বাইট যাবে (default ১)। এবার ভেতরের তিনটি প্রস্তুতি, ক্রমটা নিয়ে ভাবো: <code>self.__data_changed = True<\/code> <b>সবার আগে<\/b> — যেকোনো চিঠি পাঠালেই কনফিগ 'অসংরক্ষিত' দাগিয়ে যায়, যাতে <code>update_config_data()<\/code> জেনে যায় সেভ দরকার, আবার Parts 11-12-এর কতিপয় কলার জেনেশুনে এই দাগ ফেরতও নেয়; <code>order = ORDER[key][0]<\/code> — comment-এর ভাষায় <code># Grab the \"menu item number\" (e.g., 0x22 for ARM_TORQUE)<\/code>, মেনু-তালিকার প্রথম ঘর থেকে আদেশ-সংখ্যা তোলা; আর <code>value = []<\/code> খালি payload-বাক্সের পাশে <code>value_sum = self.__COMPLEMENT<\/code> — চলমান যোগফলটা শূন্য নয়, <b>আগে-থেকেই ৫-এ ভরা<\/b> ছাড়া হয় (Part 5-এর <code>257 - 0xFC<\/code>)। কেন ঠিক ৫, সেটাই নিচের গণিতের সবচেয়ে সুন্দর ফাঁদ।"},{"a":65,"b":68,"text":"<b>payload ভরার লুপ<\/b>: <code># Pack up the data values we want to send<\/code> — <code>for i in range(0, len):<\/code> প্রতিটি পাল্লায় দুটো কাজ একসাথে: <code>value.append(ORDER[key][1 + i])<\/code> মেনু-তালিকার 1, 2, 3... ঘর থেকে (0-ঘরে তো মেনু-নম্বর বসে আছে) ডেটা-বাইট তুলে বাক্সে রাখে, আর <code>value_sum = value_sum + ORDER[key][1 + i]<\/code> সেই বাইটটিই চলমান যোগফলে জমা করে। লুপ শেষে <code>value<\/code> হলো চিঠির ডেটা-অংশ, <code>value_sum<\/code> হলো 5 + সব ডেটা-বাইটের যোগফল — চেকসামের কাঁচামাল এক জায়গায় গুছিয়ে ফেলা। <b>লক্ষ করো<\/b>, একটা চুপচাপ ফাঁদও এখানে লুকিয়ে: parameter-এর নাম <code>len<\/code> — Python-এর built-in <code>len()<\/code> ফাংশনের নাম-দুপ্পি এই মেথডের ভেতরে ঢুকে সেটাকে ঢেকে (shadow) ফেলেছে। ভাগ্য ভালো, এই মেথডের ভেতরে কোথাও built-in <code>len()<\/code> আর ডাকা পড়ে না বলে সব নিশ্চিন্তে চলে; কিন্তু কাল কেউ এখানে <code>len(tx)<\/code>-এর মতো কিছু লিখতে গেলে সে আসলে integer parameter-টাকেই ফাংশনের মতো ডাকছে — নামটা একটা টিকে-থাকা মাইন; আমরা দেখে গেলাম, ধরতে গেলাম না, সোর্স যেমন আছে তেমনই থাকবে।"},{"a":70,"b":72,"text":"<b>চেকসাম — চিঠির শেষে অঙ্কের সীল<\/b>: আগে comment-জোড়াটা পড়ে নাও: <code># Calculate a Checksum. This is a math formula added to the end of the letter.<\/code> আর <code># The microcontroller does the same math. If the numbers don't match, it means the wire glitched!<\/code> — অর্থাৎ দুই পাড়ে একই হিসাব: প্রাপক-পক্ষ নিজেও সীলটা হিসাব করে মিলিয়ে দেখবে, না-মিললে চিঠিটাকে তার-গণ্ডগোল-খাওয়া ডাক ভেবে ফেলে দেবে। মূল লাইন: <code>sum_data = (self.__HEAD + self.__DEVICE_ID + (len + 0x03) + order + value_sum) % 256<\/code> — খামের পাঁচ উপাদান (255, 252, LEN-মান, মেনু-নম্বর, payload-ভরা যোগফল) এক পাত্রে মিশিয়ে <code>% 256<\/code> দিয়ে এক বাইটের (0-255) ঘরে ভাঁজ করা। আর লুকানো নিয়মটা এখানেই ঘোষিত: LEN-ঘরে বসে <code>len + 0x03<\/code> — অর্থাৎ LEN নিজেকেও গুনে রাখে LEN + order + সব payload + checksum-এর মোট; পুরো হিসাবটা math-অংশে খোলা হবে।"},{"a":74,"b":75,"text":"<b>খাম সাজানো শুরু<\/b>: <code># Build the final envelope: [Doorbell, Device ID, Length, Command, Data..., Checksum]<\/code> — খামের ছক নিজেই নিজের ম্যানুয়াল বয়ে আনে: দরজার ঘণ্টি, ঠিকানা, দৈর্ঘ্য, আদেশ, তারপর ডেটা, শেষে সীল। <code>tx = [self.__HEAD, self.__DEVICE_ID, (len + 0x03), order]<\/code> — প্রথম চার ঘর এক লাইনে দাঁড়িয়ে গেল: 0xFF, 0xFC, LEN-মান, মেনু-নম্বর। <b>মন দিয়ে দেখো<\/b> — LEN-ঘরে যে রাশি বসেছে (<code>len + 0x03<\/code>), চেকসামের সূত্রেও ঠিক সেই রাশিটাই গেছে: দুই জায়গায় একই অঙ্ক, তাই সীলের হিসাব আর খামের হিসাব কখনো আলাদা হয়ে যেতে পারে না।"},{"a":76,"b":77,"text":"<b>খামের শেষ জোড়া<\/b>: <code>tx.extend(value)<\/code> — লুপে জমানো সব payload-বাইট খামের ঠিক মাঝ-বরাবর জুড়ে দেয়, আর <code>tx.append(sum_data)<\/code> সবার শেষে অঙ্কের সীলটি আটকায়। দুই লাইনেই চিঠি পূর্ণ: [HEAD, DEVICE_ID, LEN, order, value..., sum_data] — 1+1+1+1+len+1 = <b>len+5 বাইটের<\/b> একটি সম্পূর্ণ বাইনারি খাম; Part 14-এর উদাহরণে len=3 হলে মোট ৮ বাইট।"},{"a":79,"b":84,"text":"<b>ডাকে দেওয়া, এক নিঃশ্বাস বিরতি, তারপর দর্শন-জানালা<\/b>: <code># Mail the letter! Write the binary data to the USB wire.<\/code> — <code>self.__ser.write(tx)<\/code> খামটা তারে লিখে দেয়; খেয়াল করো <code>tx<\/code> এখানে int-এর একটি list, তবু pyserial সেটাকেই বাইট-সারি ধরে নেয় — আলাদা করে <code>bytes()<\/code> বানাতে হয় না। এরপর <code>if self.__send_delay &gt; 0:<\/code> সত্য হলে <code>time.sleep(self.__send_delay)<\/code> — Part 5-এ ঠিক করা 0.01 সেকেন্ডের এই ছোট্ট নিঃশ্বাস পরপর দুই চিঠিকে তারে গলা-গলি করতে দেয় না। শেষ জোড়া: <code>if self.__debug:<\/code> হলে <code>print (\"Send: [0x\" + ', 0x'.join('{:02X}'.format(x) for x in tx) + \"]\")<\/code> — <code>'{:02X}'.format(x)<\/code> প্রতিটি বাইটকে দুই-অঙ্কের hex-এ লেখে (দশমিক 26 হয়ে ওঠে 1A), <code>', 0x'.join(...)<\/code> ফাঁকে ফাঁকে সেপারেটর জুড়ে terminal-এ হুবহু সেই সারিটাই দেখায় যা তারে গিয়েছে — Part 14-এর 1.05-চিঠিতে ছাপা পড়ত <code>Send: [0xFF, 0xFC, 0x06, 0x44, 0x1A, 0x04, 0x00, 0x68]<\/code>; debug বন্ধ থাকলে চিঠি চোখের আড়ালেই চলে যায়। আর একটা কৌতূহল-দোলা দেওয়া ছাপ: <code>print (<\/code> — print আর বন্ধনীর মাঝে ফাঁকা জায়গা, Python 2 আমলের হাতের লেখার রেশ; Python 3-এ একেবারে নিরীহ, কিন্তু সোর্সে যেমন আছে তেমনই টিকে আছে।"}],"math":{"intro":"এই Part-টি এই analysis-এর সবচেয়ে গাণিতিক Part: চেকসাম কীভাবে একটি বাইটে পুরো চিঠির হিসাব বয়ে বেড়ায়, mod-256-এর ঘড়ি কীভাবে যেকোনো বড় যোগফলকে এক বাইটে ভাঁজ করে, আর গোড়ার ৫-এর প্রি-চার্জ কীভাবে হেডার-জোড়াকে নিঃশব্দে বাতিল করে দেয় — তিন স্তরে সাজানো, সঙ্গে বাস্তব চিঠির পূর্ণ হিসাব।","levels":[{"label":"Level 1 — সীল: শেষ বাইট = আগের সবার যোগফলের ছায়া","latex":"\\[ k = \\big( H + D + L + o + S \\big) \\bmod 256, \\qquad S = c + \\sum_{i=1}^{\\ell} v_i \\]","text":"k মানে <code>sum_data<\/code> — চিঠির একেবারে শেষ বাইট। H = 255 (<code>__HEAD<\/code>), D = 252 (<code>__DEVICE_ID<\/code>), L = ℓ+3 (LEN-ঘর), o = order (মেনু-নম্বর), আর S মানে <code>value_sum<\/code> — payload-বাইটগুলির যোগফল তার গায়ে ৫-এর প্রি-চার্জ (c) নিয়ে। অর্থাৎ শেষ বাইটটা আসলে তার আগের <b>সব<\/b> বাইটের যোগফলের ছায়া: একটি বাইটও বদলালে ছায়াটা বদলে যায়, আর অন্যপাড়ার microcontroller ঠিক এই হিসাবটাই করে মিলিয়ে দেখে — না-মিললে চিঠি ত্রুটি-ডাক।"},{"label":"Level 2 — mod-256 ঘড়ি: পাক গুনে ভাঁদের-অবশিষ্ট বের করা","latex":"\\[ 616 = 2 \\times 256 + 104 \\;\\;\\Longrightarrow\\;\\; 616 \\bmod 256 = 104 \\]","text":"একটি বাইটের ঘর ০ থেকে ২৫৫ — মাত্র ২৫৬টি ঠাঁই, কারণ 256 = 2^8, ঠিক আট বিটের সমতল। যোগফল 616 হলে ঘড়িটা দুই পুরো পাক (2 × 256 = 512) ঘুরে 616 − 512 = 104-এ থামে। <code>% 256<\/code> অপারেটর ঠিক এই কাজটাই করে: পাকগুলোকে ফেলে দেয়, শুধু ভাঁদের-অবশিষ্ট (0-255) রাখে — তাই যত বড় যোগফলই হোক, সীল সবসময় এক বাইটেই আঁটে।"},{"label":"Level 3 — COMPLEMENT-এর নিঃশব্দ বাতিল","latex":"\\[ H + D + c = 255 + 252 + 5 = 512 \\equiv 0 \\pmod{256} \\;\\;\\Longrightarrow\\;\\; k \\equiv L + o + \\sum_{i=1}^{\\ell} v_i \\pmod{256} \\]","text":"গোড়ার সেই ৫ (Part 5-এর <code>self.__COMPLEMENT = 257 - self.__DEVICE_ID<\/code>) আসলে এক গোপন কারসাজি: H + D + c = 255 + 252 + 5 = 512 = 2 × 256 — mod-256 জগতে একেবারে শূন্য। ফলে চেকসাম কার্যত LEN + order + payload-এর খাঁটি যোগফল: Part 14-এর চিঠিতে 6 + 68 + 26 + 4 + 0 = 104 — হেডার-দুটিকে না ছুঁয়েও সেই একই 0x68। প্রি-চার্জের ৫টা তাই আনাড়ি ভরাট নয়, নির্মাতার দুই পাড়ের হিসাব মেলানোর সাঁকো।"}],"numeric":[{"latex":"\\[ (255 + 252 + 6 + 68 + 35) \\bmod 256 = 616 \\bmod 256 = 104 = \\mathrm{0x68} \\]","text":"Part 14-এর <code>set_ros_scale_angular(1.05)<\/code>: 1.05 × 1000 = 1050 = 0x041A, বাইট-জোড়া [0x1A, 0x04] আর শেষ শূন্য-বাইট — payload [26, 4, 0]; প্রি-চার্জ ৫ নিয়ে value_sum = 5 + 26 + 4 + 0 = 35; order = 0x44 = 68; LEN = 3 + 3 = 6। যোগফল 616 → 616 − 512 = 104 = 0x68। তারে যাওয়া পুরো চিঠি: <code>FF FC 06 44 1A 04 00 68<\/code> — ৮ বাইট, যার মধ্যে ৬টিই LEN-এর হিসাবে গোনা।"},{"latex":"\\[ (255 + 252 + 6 + 67 + 240) \\bmod 256 = 820 \\bmod 256 = 52 = \\mathrm{0x34} \\]","text":"ভাই-উদাহরণ <code>set_ros_scale_line(1.0)<\/code>: 1000 = 0x03E8 → payload [232, 3, 0], value_sum = 5 + 232 + 3 = 240, order = 0x43 = 67 → 820 − 768 = 52 = 0x34; চিঠি <code>FF FC 06 43 E8 03 00 34<\/code>। শুধু order আর payload বদলালেই সীল একেবারে নতুন (0x68 → 0x34) — প্রতিটি চিঠির নিজস্ব আঙ্গুলের ছাপ।"},{"latex":"\\[ L = 1 + 1 + \\ell + 1 = \\ell + 3 = 6, \\qquad \\text{total} = 2 + L = \\ell + 5 = 8 \\]","text":"LEN-ঘরের গণনা-নিয়ম: LEN নিজেকেও গোনে — LEN (1) + order (1) + ℓ-টি payload + checksum (1) = ℓ + 3; ℓ = 3-এ তা 6। মোট চিঠি = HEAD + DEVICE_ID + বাকি সব = 2 + 6 = 8 বাইট, অর্থাৎ <b>len+5<\/b> — ৩-ডেটা কনফিগার-চিঠির চিরন্তন দৈর্ঘ্য আট।"}],"mapping":[{"code":"value_sum = value_sum + ORDER[key][1 + i]","math":"\\[ S = c + \\sum_{i=1}^{\\ell} v_i, \\qquad c = 257 - D = 5 \\]","text":"চলমান যোগফল S যাত্রা শুরু করে c = 5 (<code>__COMPLEMENT<\/code>) থেকে, আর লুপের প্রতিটি পাল্লায় ঠিক একটি বাইট তুলে তাতে জোড়ে — এই এক লাইনই সূত্রের Σ-চিহ্নটাকে বাস্তবে ঘুরিয়ে দেখায়; পাশের <code>value.append(...)<\/code>-এ একই বাইট খামেও উঠতে থাকে।"},{"code":"sum_data = (self.__HEAD + self.__DEVICE_ID + (len + 0x03) + order + value_sum) % 256","math":"\\[ k = (H + D + L + o + S) \\bmod 256 \\]","text":"সূত্রের পাঁচ রাশি এই এক লাইনের পাঁচ operand: <code>self.__HEAD<\/code> → H, <code>self.__DEVICE_ID<\/code> → D, <code>(len + 0x03)<\/code> → L, <code>order<\/code> → o, <code>value_sum<\/code> → S; শেষের <code>% 256<\/code> → mod-256 ভাঁদ। ভেতরের যোগ আর বাইরের ভাঁদ — এই দুইয়ের মিলটুকুই পুরো চেকসাম-বীজগণিত।"}],"failure":["চিঠির শেষে চেকসাম-সীলটাই যদি না থাকত, তারে একটি বিট উল্টে গেলে তা ধরার আর কোনো উপায় থাকত না — payload-এর 26 (0x1A) বদলে 27 (0x1B) হলে scale চুপিচুপি 1.051 হয়ে বসত, আর রোবট সেই সামান্য বাঁক নিয়েই সারাজীবন বৃত্ত আঁকত — কেউ জানতেও পারত না কোথায় গণ্ডগোল।","<code>% 256<\/code>-এর ভাঁদটাই যদি বাদ পড়ত, 616-এর মতো যোগফল এক বাইটে আর আঁটত না — সংখ্যাটা দুই বাইট জায়গা দাবি করত, খামের নির্দিষ্ট আকৃতি (শেষে মাত্র এক সীল-বাইট) ভেঙে পড়ত, আর 0-255-এর বাইরের মান তারে পাঠাতে গেলে pyserial-এর কাছে সে একরকম error-ই হয়ে ফেরত।","<code>value_sum<\/code>-কে যদি প্রথাগত মতে ০ থেকে শুরু করা হতো (COMPLEMENT-এর প্রি-চার্জ ছাড়া), প্রতিটি চিঠির সীল ঠিক ৫ কম হতো — অন্যপাড়ার microcontroller মূল সূত্রেই হিসাব করে বলে পাঠানো আর প্রত্যাশিত সীল কোনোদিন মিলত না; line 71-এর comment-এর ভাষায় <code>If the numbers don't match, it means the wire glitched!<\/code> — প্রতিটি কনফিগার-চিঠি ত্রুটি-ডাক ভেবে ফেলে দেওয়া হতো, কনফিগারেশন-সংযোগ জন্মাতই মরা।","লেখার পরের 0.01 সেকেন্ডের নিঃশ্বাস-বিরতিটাই যদি না থাকত, পরপর ডাকা দুই চিঠি তারে প্রায় গলা-গলি করে ঢুকে যেত — প্রাপকের চোখে দুটি চিঠি জোড়া-লাগা এক বাইট-স্রোত মনে হতো, আর দ্বিতীয় চিঠির দরজার ঘণ্টি (0xFF) প্রথমটার ভিড়ে হারিয়ে গিয়ে তার ছক থেকেই পড়ত; কনফিগার-করার সময় এমন পরপর-ডাক নিত্যনৈমিত্তিক, তাই এই ছোট্ট ঘুমটা শোনার চেয়ে বড় নিরাপত্তা।"]},"robot":{"correct":"চালু অবস্থায় প্রতিটি কনফিগারেশন ডাক একেবারে নিখুঁত ছোট্ট বাইনারি চিঠি হয়ে তারে নামে — যেমন <code>set_ros_scale_angular(1.05)<\/code> মানেই ঠিক ৮টি বাইট: FF FC 06 44 1A 04 00 68; অন্যপাড়ার microcontroller সেই সীল মিলিয়ে মানটি গ্রহণ করে। এই স্তরে ডাক দিয়েই কাজ শেষ — কোনো জবাবের অপেক্ষা নেই (fire-and-forget); জবাব-নির্ভর ভিন্ন পথ পরে Part 12-এ দেখা যাবে। debug=True হলে প্রতিটি চিঠি terminal-এ hex-সারি হয়ে ছাপা পড়ে।","incorrect":"কেউ যদি ভাবে Python তারের ওপর পাঠাচ্ছে পড়ার-মতো লেখা — যেমন <code>scale=1.05<\/code> — সেই আশা এই কোডে সম্পূর্ণ ভঙ্গ: তারে যায় নিছক ৮টি সংখ্যা-বাইট, মানুষের চোখে যার কোনো অর্থ নেই। আবার 'চিঠি পাঠিয়েছি, রোবট ঠিকই পেয়েছে' — এই নিশ্চয়তাও এই স্তরে নেই: <code>__send<\/code> কোনো acknowledgement-এর জন্য দাঁড়ায় না, তার খারাপ হলে বা প্রাপক-পক্ষ ব্যস্ত থাকলে চিঠিটা নীরবে হারাতে পারে — পাঠানোর কোডের কাছে তার কোনো খবর কখনো আসবে না।"},"id":"part-06","start":57,"end":85,"lang":"python","animType":"txFrame","flags":[]},{"n":7,"fname":"config_robot.py","enTitle":"__request — Asking a Question","explain":[{"a":87,"b":88,"text":"<b>নতুন অধ্যায়ের ফলক — এবার চিঠি নয়, প্রশ্ন<\/b>: <code># --- REQUESTING DATA ---<\/code> banner-টা Part 6-এর <code># --- SENDING DATA ---<\/code>-এর ঠিক জোড়া — ওই দিকটা <b>আদেশ<\/b> লিখে পাঠায়, এই দিকটা <b>প্রশ্ন<\/b> করে উত্তর চায়। শিক্ষক-comment-টাও রূপকটা বহন করে: <code># This sends a letter saying \"Hey, please send me the data for address X\"<\/code> — অর্থাৎ খামে কোনো নতুন মান ভরা নেই, আছে শুধু একটা ঠিকানা আর একটা অনুরোধ: এই address-এর ডেটা আমাকে পাঠাও। Part 6 যে চিঠি-খাম গড়া শিখিয়েছিল, এই Part সেই একই ডাক-ব্যবস্থায় উল্টো মুখী বার্তা — আর Parts 8-9 (unpack) মিলে তিনজন সবাই মিলে দাঁড় করায় ask→wait→answer হ্যান্ডশেক।"},{"a":89,"b":89,"text":"<b>নাম-স্বাক্ষর, দুটি ঘরে দুই ভূমিকা<\/b>: <code>def __request(self, addr, param=0):<\/code>। <code>addr<\/code> হলো কোন মিনু-আইটেমের কথা জানতে চাইছি — প্রতিটা read_ ফাংশন ORDER dictionary থেকে ঠিকানাটা তুলে দেয়, যেমন কার-টাইপের প্রশ্নে যায় addr = 0x15। আর <code>param=0<\/code> — ডিফল্ট শূন্য। <b>লক্ষ করো<\/b>, পুরো file-এ এই ঘরে শূন্য-ছাড়া মান পাঠায় শুধু দুজন PID-পাঠক: motor-PID পাঠায় 1, IMU-PID পাঠায় 5 (Part 17) — একই ঠিকানার ভেতরে কোন উপ-দলের (bank) ডেটা লাগবে, সেটা বোঝানোর মতো। বাকি সব প্রশ্নে param নীরবে শূন্য থাকে।"},{"a":90,"b":91,"text":"<b>ধ্রুবক দুটি — প্রশ্নের ডাকযোগ<\/b>: <code>order = self.__READ_DATA<\/code> মানে 0x50 — __init__-এ সাজানো magic number, যার বার্তা একটাই: আমি পড়তে চাই। Part 6-এর প্রতিটা চিঠি যেমন নিজের menu-item number বয়ে আনত, এখানে উল্টোটা — সব প্রশ্নই বয়ে আনে এই একটাই order। আর <code>buf_len = 5<\/code> একেবারে হার্ড-কোডেড: চাই ভার্সন-প্রশ্ন, চাই PID-প্রশ্ন — দৈর্ঘ্য কখনো বদলায় না। এই অনড়ত্বই প্রশ্ন-পক্ষকে এত সরল রাখে: দৈর্ঘ্য নিয়ে কোনো হিসাব রাখার দরকারই পড়ে না, কারণ বদলানোর মতো কিছু নেই।"},{"a":92,"b":92,"text":"<b>চেকসাম — একই কাজ, কিন্তু আলাদা রেসিপি<\/b>: <code>sum_data = (buf_len + order + addr + param) % 256<\/code>। <b>মন দিয়ে দেখো<\/b> — Part 6-এর চেকসামের সঙ্গে পাশাপাশি রাখলেই ব্যাপারটা চোখে লাগে: ওই রেসিপিতে HEAD, DEVICE_ID আর COMPLEMENT তিনটাই যোগে ছিল; এখানে <b>কোনোটাই নেই<\/b> — যোগ হয় শুধু চারটি পদ (5, 0x50, addr, param), যাদের মধ্যে সত্যিই বদলায় শুধু <code>addr<\/code> আর <code>param<\/code>। এই অসমমিতি ভুল নয়, প্রোটোকলের নিজস্ব রীতি — প্রতিটি দিক ঠিক যে হিসাব পরীক্ষা করার জন্য বানানো, সেটাই পরীক্ষা করে; আমাদের কাজ বোর্ড যেমন হিসাব আশা করে ঠিক তেমনটাই পাঠানো। শেষের <code>% 256<\/code> অবশ্য চেনা — যোগফলকে এক বাইটে গুটিয়ে ফ্রেমের ল্যাজে বসানোর পুরোনো কেলাস।"},{"a":93,"b":93,"text":"<b>খাম সাজানো — সাত বাইট, চিরকাল<\/b>: <code>tx = [self.__HEAD, self.__DEVICE_ID, buf_len, order, addr, param, sum_data]<\/code> — অর্থাৎ [0xFF, 0xFC, 0x05, 0x50, addr, param, sum]। দুটো জিনিস খেয়াল করো। প্রথমত, ফ্রেমটা <b>সবসময় ঠিক ৭ বাইট<\/b> — addr আর param যা-ই হোক, দৈর্ঘ্যে কোনো চলক নেই। দ্বিতীয়ত, দৈর্ঘ্য-ঘরে লেখা 5, অথচ ফ্রেম ৭ বাইটের — কারণ গণনা চলে HEAD আর DEVICE_ID-কে বাদ দিয়ে: তাদের পরে যে পাঁচটা বাইট (buf_len, order, addr, param, sum) তারাই 5। Part 6-এর <code>(len + 0x03)<\/code> ঘরও ঠিক এই রীতিতেই গোনে — দুই দিকের খাম-লেখা এক স্কুলে পড়ে এসেছে।"},{"a":95,"b":97,"text":"<b>তার ধোয়া — দুই দিকেই<\/b>: শিক্ষক-comment কারণটা সরাসরি বলে দেয়: <code># Clear out any old junk sitting in the wire<\/code>। <code>self.__ser.flushInput()<\/code> জমে-থাকা পুরোনো গৃহীত বাইট ফেলে দেয়, <code>self.__ser.flushOutput()<\/code> পাঠানোর লাইনে আটকে-থাকা বাইট — দুই দিকেই ঝাড়াদ। কেন এত খাতির: দ্রুতগতির তারে আগের উত্তরের লেজ এখনও বসে থাকতে পারে; flush না করলে সেই পুরোনো লেজ-ই নতুন প্রশ্নের উত্তর সেজে বসতে পারত — বাইটগুলো একসময় সঠিক ছিল বলে checksum-ও তাদের ধরত না। খালি তার মানে নিশ্চয়তা: এবার যে বাইট আসবে, সে এই প্রশ্নেরই উত্তর।"},{"a":98,"b":99,"text":"<b>ইনবক্স শূন্য করা — Part 9-এর জন্য আগেই রেখে দেওয়া উপহার<\/b>: <code>for i in range(self.__RX_BUF_LEN_MAX):<\/code> লুপটা ৪০ ঘরের <code>self.__rx_DATA<\/code> bytearray-এর প্রতিটা ঘরে <code>self.__rx_DATA[i] = 0<\/code> বসায়। প্রশ্ন উঠতে পারে — নতুন উত্তর তো হয়তো মাত্র কয়েক বাইট লিখবে, তবু ৪০-টাতেই শূন্য কেন? উত্তরটা এই Part-এর সবচেয়ে সূক্ষ্ম সংযোগ: Part 9-এর checksum <b>পুরো ৪০ ঘরই<\/b> যোগ করে — নতুন উত্তর যত ঘর লিখুক, বাকি ঘরগুলোর পুরোনো মানও হিসাবে ঢোকে। এই শূন্য-করাই সেই যোগফলকে নিরাপদ করে: আগের লম্বা উত্তরের অবশিষ্ট বাইট রীতিমতো checksum-এ বিষ ঢালত। ছোট্ট এই লুপটা আসলে Parts 8-9-এর ভবিষ্যৎ পাকা করে রাখা।"},{"a":101,"b":104,"text":"<b>ডাক ছাড়া, তারপর স্বাক্ষর<\/b>: <code># Send the request<\/code> — আর <code>self.__ser.write(tx)<\/code> সাত বাইটের প্রশ্ন তারে ছেড়ে দেয়। এরপর <code>if self.__debug:<\/code> সত্য হলে <code>\"Read: [0x\" + ...<\/code> ছাঁচে পুরো ফ্রেমটা hex-এ ছাপা হয় — Part 6-এর <code>Send:<\/code> লেবেলের ঠিক জোড়া এই <code>Read:<\/code> লেবেল, debug খোলা থাকলে প্রশ্ন-উত্তর দুটোই terminal-এ পাশাপাশি চোখের সামনে বোঝা যায়। শেষে <b>দুটো জিনিস যা এখানে নেই<\/b>, দুটোই ইচ্ছাকৃত। এক — ভেতরে কোনো <code>time.sleep<\/code> নেই; বিরতিটা (read_delay = 0.01s) ডাকার দিকের read_ ফাংশনগুলোই দেয় (Part 16-এর ছাঁচ)। দুই — <code>__data_changed<\/code> ছোঁয়া হয় না; Part 6 শুরুতেই পতাকাটা তুলে দিত (line 60), কিন্তু প্রশ্ন করা কোনো setting বদলায় না — তাই সেই খাতাও নোংরা হয় না।"}],"math":{"intro":"এই Part-এর গণিত যত ছোট, তত সূক্ষ্ম: প্রশ্ন-ফ্রেমের চার-বাইটের চেকসাম, Part 6-এর command-রেসিপির সঙ্গে তার তফাত, আর স্থায়ী-দৈর্ঘ্য প্রশ্ন বনাম চলক-দৈর্ঘ্য উত্তরের জোড়া — তিন স্তরে সাজানো।","levels":[{"label":"Level 1 — প্রশ্নের চেকসাম","latex":"\\[ k \\;=\\; \\bigl( L + o + a + p \\bigr) \\bmod 256 \\]","text":"L মানে <code>buf_len<\/code> = 5, o মানে <code>order<\/code> = 0x50, a মানে <code>addr<\/code>, p মানে <code>param<\/code>; k-ই ফ্রেমের শেষ বাইট। মূল ধারণা Part 6-এর সঙ্গে একইই — যে বাইটগুলো বদলাতে পারে তাদের যোগ করে 256 দিয়ে ভাগশেষ নেওয়া — শুধু এখানে যোগ্য উপাদানের তালিকা আলাদা: ঠিক চারটি বাইট, ব্যস।"},{"label":"Level 2 — command বনাম question রেসিপি","latex":"\\[ k_{\\mathrm{cmd}} = \\bigl( H + D + (\\ell + 3) + o + C + \\sum v_i \\bigr) \\bmod 256, \\qquad k_{\\mathrm{q}} = \\bigl( L + o + a + p \\bigr) \\bmod 256 \\]","text":"H = HEAD, D = DEVICE_ID, ℓ = value-সংখ্যা, C = COMPLEMENT = 257 − D = 5, Σv_i = পাঠানো value-দের যোগফল — এ হলো Part 6-এর command-রেসিপি। প্রশ্নের রেসিপিতে এই স্থির উপাদানগুলোর <b>কেউই নেই<\/b> — HEAD নেই, DEVICE_ID নেই, COMPLEMENT-ও নেই; আছে শুধু চারটি চলক। দুটো রেসিপি আলাদা, কিন্তু দুটোই নিজের দিকের সঙ্গে মিলে যায় — প্রোটোকল যাকে যে হিসাব করতে বলেছে, সে তা-ই করে।"},{"label":"Level 3 — স্থির প্রশ্ন, নমনীয় উত্তর","latex":"\\[ |Q| = 7 \\;\\text{(fixed)}, \\qquad \\text{answer: payload} = \\mathrm{LEN} - 3 \\;\\text{bytes (variable)} \\]","text":"প্রশ্নের দিকে দৈর্ঘ্য নিয়ে ভাবার কিছু নেই — সব প্রশ্ন ঠিক ৭ বাইট। উত্তরের দিকে দৈর্ঘ্য আসে তার নিজের LEN ঘর থেকে: Part 8 সেই ঘরটা পড়ে রাখে, Part 9 তা থেকে payload = LEN − 3 বাইট কেটে নেয়। হ্যান্ডশেকের এক পক্ষ স্থির, অন্য পক্ষ নমনীয় — প্রশ্ন গোটাটাই জানা, উত্তর খুলে দেখতে হয়।"}],"numeric":[{"latex":"\\[ k = (5 + 80 + 81 + 0) \\bmod 256 = 166 = \\mathrm{0xA6} \\]","text":"ভার্সন-প্রশ্ন: Part 17-এর <code>read_version<\/code> পাঠায় addr = 0x51 = 81, param = 0; তাই সম্পূর্ণ ফ্রেম [0xFF, 0xFC, 0x05, 0x50, 0x51, 0x00, 0xA6] — debug খোলা থাকলে terminal-এ <code>Read: [0x...]<\/code> হিসেবে ঠিক এটাই ছাপা হয়।"},{"latex":"\\[ k = (5 + 80 + 21 + 0) \\bmod 256 = 106 = \\mathrm{0x6A} \\]","text":"কার-টাইপ প্রশ্ন: addr = 0x15 = 21, param = 0 → ফ্রেম [0xFF, 0xFC, 0x05, 0x50, 0x15, 0x00, 0x6A]। একই ছাঁচ, শুধু addr বদলেছে — আর চেকসাম সেই বদলটা শুধরে নিয়েছে; চার বাইটের রেসিপির সুবিধা এখানেই, প্রতিটা প্রশ্নের হিসাব এক লাইনে শেষ।"},{"latex":"\\[ k = (5 + 80 + 19 + 1) \\bmod 256 = 105 = \\mathrm{0x69} \\]","text":"মোটর-PID প্রশ্ন: addr = 0x13 = 19, param = 1 — যে একমাত্র পরিবারে param শূন্য নয় (motor = 1, IMU = 5, Part 17)। চেকসামও সেই পরিবর্তনটা টের পায়: param বাদ দিলেই যোগফল 104 = 0x68 হয়ে যেত — বোর্ডের হিসাবের সঙ্গে মিলত না, উত্তরও আসত না।"}],"mapping":[{"code":"sum_data = (buf_len + order + addr + param) % 256","math":"\\[ k = (L + o + a + p) \\bmod 256 \\]","text":"চারটি যোগ-পদ ঠিক ফ্রেমের চারটি পরিবর্তনশীল বাইট — দরজার ঘণ্টা (HEAD) আর ঠিকানা-ফলক (DEVICE_ID) স্থির, তাই খাতায় ঢোকেই না; শেষের <code>% 256<\/code> যোগফলকে এক বাইটে আটকে দেয়।"},{"code":"self.__ser.flushInput()","math":"\\[ \\mathrm{inbox} \\leftarrow \\varnothing \\]","text":"flush মানেই গোড়া থেকে খালি ইনবক্স — এরপর যে বাইট আসবে সে নিশ্চিতভাবে নতুন উত্তরের প্রথম বাইট, তাই Parts 8-9-এর state machine সামনে পড়া প্রথম 0xFF-কে নির্দ্বিধায় বিশ্বাস করতে পারে।"}],"failure":["দুটো flush বাদ গেলে আগের উত্তরের অবশিষ্ট লেজ নতুন প্রশ্নের উত্তর সেজে বসত — Parts 8-9 সেই পুরোনো বাইট দিয়েই ফ্রেম সাজিয়ে ফেলত; বাইটগুলো একদিন সঠিক ছিল বলে checksum-ও ধরত না, ফলে ভুল ডেটা চুপচাপ ঢুকে যেত।","এই ফাংশনের ভেতরে sleep ঢুকিয়ে দিলে প্রতিটা পড়ায় বিরতি দুবার দিতে হতো — Part 16-এর read_ ফাংশনরা ডাকার পর নিজেরাই read_delay = 0.01s অপেক্ষা করে; ডিজাইনটা ইচ্ছে করেই ঘুমটাকে ডাকার দিকে রেখেছে, তাই <code>__request<\/code> নিজে নীরব।","addr আর param-এর ঘর গুলিয়ে গেলে বোর্ড পড়ত ভুল ব্যাংক — Part 17-এ motor-PID-র প্রশ্ন param = 1 নিয়ে যায়; সেই 1 যদি ঠিকানার ঘরে ঢুকে যেত, চেকসাম মিলিয়ে নিলেও উত্তর আসত অন্য কোনো সেটিং-এর, আর PID টিউনিংয়ের পুরো ভাবনাটাই ভুল ভিত্তির ওপর দাঁড়িয়ে যেত।","98-99-এর শূন্য-করা লুপটা না থাকলে Part 9-এর চেকসাম — যেটা পুরো ৪০ ঘরের ইনবকসই যোগ করে — আগের লম্বা উত্তরের পুরোনো বাইটে বিষাক্ত হয়ে যেত; তখন সার্থক উত্তরও বারবার \"check error\" খেয়ে ফেলে নষ্ট হত।"]},"robot":{"correct":"প্রশ্ন যাওয়ার পর রোবটের নিচের বোর্ড ঠিক চাওয়া address-এর ডেটা নিয়ে উত্তর লিখে পাঠায় — flush-করা ফাঁকা তারে সাত বাইটের প্রশ্ন, তারপর 0.01s-এর নিঃশ্বাস, তারপর Parts 8-9-এর unpack উত্তর খুলে ফেলে; ভার্সন থেকে PID পর্যন্ত পুরো read-পরিবার এই একই ask→wait→answer হ্যান্ডশেকে চলে।","incorrect":"যদি ভাবো বোর্ড নিজে থেকেই মাঝে মাঝে ডেটা ঠেলে দেয়, সেই আশা এই কোডে ভঙ্গ হয় — বোর্ড কখনো নিজে থেকে কথা বলে না, প্রতিটা বাইট আসে কোনো না কোনো প্রশ্নের উত্তর হয়ে; প্রশ্ন না পাঠিয়ে শুধু unpack ডাকলে ইনবক্স চিরকাল ফাঁকা থাকে, unpack False ফেরত দেয়, আর read_ ফাংশনের ফল হয় None।"},"id":"part-07","start":87,"end":105,"lang":"python","animType":null,"flags":[]},{"n":8,"fname":"config_robot.py","enTitle":"__unpack — The Byte State Machine (Steps 1-2)","explain":[{"a":107,"b":108,"text":"<b>জবাব-জোড়া লাগানোর অধ্যায় শুরু<\/b>: banner <code># --- RECEIVING &amp; PARSING DATA ---<\/code> ঘোষণা করছে — Part 7-এ আমরা প্রশ্নের খাম ডাকে দিয়েছি (<code>__request<\/code>-এর <code>flushInput()<\/code> থেকে <code>__ser.write(tx)<\/code>), এবার সেই প্রশ্নের জবাব <b>পড়ার<\/b> পালা। পরের comment-টিই পুরো অধ্যায়ের মূলমন্ত্র: <code># This is the \"State Machine\". It reads bytes one by one and pieces the letter back together.<\/code> — serial তার কখনো গোটা চিঠি সাজিয়ে দেয় না, দেয় একের-পর-এক byte-এর স্রোত; এই মেশিনের কাজ সেই টুকরোগুলো ক্রম মেনে জুড়ে চিঠি আবার দাঁড় করানো। এই Part-এর animation <code>rxState<\/code> ঠিক এই খেলাটাই দেখায় — প্রতিটি byte এক এক পদাঙ্ক, মেশিন হয় এগোয়, নয় শুরুতে ফেরে।"},{"a":109,"b":113,"text":"<b>আগে ডাক-বাক্সের হিসাব<\/b>: <code>def __unpack(self):<\/code>-এর চুক্তি সরল — একটা বৈধ চিঠি সম্পূর্ণ পেলে <code>True<\/code>, নয়তো <code>False<\/code>; ফাইলের পরের পাঠক-ফাংশনগুলো <code>if self.__unpack():<\/code> দিয়ে ঠিক এই রায়ের জন্যই অপেক্ষা করে। <code>n = self.__ser.inWaiting()<\/code> জানে ওই মুহূর্তে buffer-এ কটি byte জমা আছে — পড়তে শুরু করার আগেই গোনা হয়ে যায়। তারপর <code>rx_CHECK = 0<\/code>: checksum-এর জমাখরচার খাতা টাটকা শূন্যে খোলে — মন দিয়ে দেখো, এটি <code>self.__<\/code>-prefixed নয়, অর্থাৎ প্রতি কলে নতুন করে শূন্য, আর এই খাতায় যোগ জমাবে Part 9-এর Step 6। এবার প্রথম রায়: <code>if n &lt;= 0:<\/code> — বাক্স একেবারে খালি, তাই <code>return False<\/code>, comment-সহ ভদ্র না-উত্তর <code># Nothing in the inbox<\/code>; মাইক্রোকন্ট্রোলার হয়তো এখনো ভাবছে, জবাব এখনো রাস্তায়।"},{"a":115,"b":117,"text":"<b>যা জমেছে সব এক ঝাঁকিতে<\/b>: খালি-নয় জেনে <code>data_array = self.__ser.read_all()<\/code> buffer-এ তখন যা আছে সবকটা byte একবারে তুলে নেয় — হয়তো গোটা চিঠি, হয়তো চিঠির প্রথম অর্ধেক; এখানে কোনো নিশ্চয়তা নেই, নিশ্চয়তা দেবে পরের লুপ। <code>if self.__debug:<\/code> খোলা থাকলে 117 নম্বর লাইন স্রোতের hex-ছবি ছাপে — <code>rx_data: [0x.., 0x..]<\/code>; কারিগরি হুবহু Part 7-এর <code>Send:<\/code>/<code>Read:<\/code> ছাপার মতো (<code>', 0x'.join('{:02X}'.format(x) for x in data_array)<\/code>), শুধু এবার বাইরে-যাওয়া নয়, ভেতরে-আসা ডাক। state machine কোথায় আটকে গেল তা এই ডাম্প ছাড়া ধরা প্রায় অসম্ভব — debug-চোখের এটাই আসল মূল্য।"},{"a":119,"b":125,"text":"<b>এক byte, এক পদাঙ্ক — Step 1: দরজার ঘণ্টা<\/b>: <code>for data in data_array:<\/code> প্রতি পুনরাবৃত্তিতে ঠিক <b>একটি<\/b> byte হাতে নেয় — স্রোত এখানেই ধাপে ধাপে ভাঙে, আর <code>rxState<\/code> animation-এর হাঁটাচলার প্রতিটি ধাপ এই এক-বাইটই। নির্বাচক <code>self.__rx_FLAG<\/code> কোনো লোকাল চলক নয় — Part 5-এর <code>__init__<\/code>-এ জন্মানো persistent field, তাই প্রতিটি <code>__unpack<\/code> কল আগের কল যেখানে থেমেছিল ঠিক সেখান থেকেই হাঁটা চালিয়ে যায়; মাঝপথে থেমে-যাওয়া চিঠিও এতে হারায় না। comment পথ দেখায়: <code># Step 1: Look for the doorbell (0xFF)<\/code>। <code>if self.__rx_FLAG == 0:<\/code> মানে এখনো কোনো খামের মুখ পাইনি; <code>if data == self.__HEAD:<\/code> (0xFF) মিললে <code>self.__rx_FLAG = 1<\/code> — comment-এর উল্লাস: <code># Found the start of a message!<\/code>। <code>else: self.__rx_FLAG = 0<\/code> জাংক byte-গুলো <b>নিঃশব্দে শোষণ<\/b> করে — কোনো ভুল নয়, কোনো বিরক্তি নয়, FLAG শূন্যেই থাকে। ছোট্ট এক কৌতুকও লক্ষ করো: এই else এমন register-এ শূন্য বসায় যার মান আগে থেকেই শূন্য — কার্যত অকেজো নির্দেশ, কিন্তু কোডলেখকের ঘোষণা যেন 'জাংক জেনেশুনে গিলছি'; এটাই এই মেশিনের resync-কব্জা।"},{"a":127,"b":132,"text":"<b>Step 2: খামটা আমার নামে কি না<\/b>: comment <code># Step 2: Check if it's meant for us (0xFB)<\/code>; <code>elif self.__rx_FLAG == 1:<\/code> — ঘণ্টি বেজে গেছে, এবার খামের উপরের ঠিকানা মেলানোর পালা। <code>if data == self.__RETURN_ID:<\/code> — Part 5-এ <code>__DEVICE_ID = 0xFC<\/code> থেকে হিসাব হয়েছে <code>0xFC - 1 = 0xFB<\/code> (251), মাইক্রোকন্ট্রোলার জবাব-চিঠিতে যে পরিচয়-সংখ্যা ব্যবহার করে। মিললে <code>self.__rx_FLAG = 2<\/code>, comment: <code># Yes, it's for me!<\/code> — খাম নিজের নামে। <code>else: self.__rx_FLAG = 0<\/code> এখানে সত্যিকারের লাফ-পালটা: 0xFF ঠিক ছিল অর্থাৎ খাম সুগঠিত, কিন্তু ঠিকানা <b>অন্য কারো<\/b> — সম্পূর্ণ চিঠিটাই নিঃশব্দে বাদ, FLAG শূন্যে ফেরে; নিজের নয় এমন ডাক পড়া পর্যন্ত এই মেশিন করে না। এই Part এখানেই থামে: FLAG এখন 2, আর ধাপ 3-6 — দৈর্ঘ্য, ঠিকানা-কোড, আসল ডেটা আর checksum — সব পরের Part 9-এ; সেখানেই মেশিন FLAG 2 থেকে 5 অবধি হেঁটে <code>return True<\/code>-র মুখ দেখবে।"}],"math":{"intro":"এই Part-এর গণিত একটাই, কিন্তু গা-ছাড়া গভীর — state machine: ছয়টি অবস্থার একটানা করিডোর, যেখানে প্রতিটি byte হয় পাল্লা এগোয়, নয়তো পুরো শুরুতে ছুড়ে ফেরে; তিন স্তরে সাজানো, সঙ্গে সত্যিকারের ধারায় তিনটি হাঁটা আর কোড-সমীকরণের জোড়।","levels":[{"label":"Level 1 — করিডোরের নিয়ম","latex":"\\[ S_{k+1} = \\begin{cases} S_k + 1, & \\text{expected byte} \\\\ S_0, & \\text{any other byte} \\end{cases} \\qquad S_k \\in \\{0,1,2,3,4,5\\} \\]","text":"প্রতিটি byte-এর জন্য মেশিনের কাছে মাত্র দুটি বিকল্প — প্রত্যাশিত ব্যাজ পেলে এক পাল্লা ওপরে (S_k + 1), না পেলে সোজা S_0। 'পাশে সরে দাঁড়ানো' বলে কিছু নেই: এগোনো নয় তো সম্পূর্ণ রিসেট। কোলাহলপূর্ণ serial লাইনে সিঙ্ক ধরে রাখার রহস্য এই নির্মম সরলতাতেই।"},{"label":"Level 2 — রূপান্তর-সূত্র","latex":"\\[ (S_0,\\, b) \\to S_1 \\iff b = \\text{0xFF}, \\;\\; \\text{else } S_0; \\qquad (S_1,\\, b) \\to S_2 \\iff b = \\text{0xFB}, \\;\\; \\text{else } S_0 \\]","text":"এই Part-এর দুই ধাপের আনুষ্ঠানিক রূপ। S_0-এ থাকাকালীন একমাত্র <code>0xFF<\/code> (<code>__HEAD<\/code>, দরজার ঘণ্টা) পাল্লা খোলে; S_1-এ একমাত্র <code>0xFB<\/code> (<code>__RETURN_ID<\/code> = 0xFC − 1 = 251, উত্তর-প্রেরকের ঠিকানা) এগোয়। বাকি সব মান — যতই কাছাকাছি হোক — S_0-তে ফেরত; 0xFA আর 0xFB-র এই এক-সংখ্যার তফাতই গোটা চিঠির ভাগ্য ঠিক করে দেয়।"},{"label":"Level 3 — accepting run","latex":"\\[ S_0 \\xrightarrow{\\,\\text{0xFF}\\,} S_1 \\xrightarrow{\\,\\text{0xFB}\\,} S_2 \\longrightarrow \\cdots \\longrightarrow S_5, \\qquad (\\text{reach } S_5) \\wedge (\\text{checksum match}) \\Rightarrow \\text{return True} \\]","text":"মেশিন 'গৃহীত' (accepted) তখনই, যখন একটানা হাঁটায় S_5-এ পৌঁছে সঙ্গে checksum-ও মেলে — দুটোই Part 9-এর ধাপ 3-6-এর কাজ। মাঝপথে ছেঁড়া, ঠিকানা-না-মেলা বা checksum-ফেল করা কোনো হাঁটাই শেষ পর্যন্ত <code>False<\/code>-ই ফেরত দেয়; এই কঠোরতাই নিশ্চিত করে যে উপরে ওঠা মানটা সত্যিই একটা অক্ষত চিঠি।"}],"numeric":[{"latex":"\\[ \\text{0x7A}: \\; S_0 \\to S_0, \\qquad \\text{0xFF}: \\; S_0 \\to S_1, \\qquad \\text{0xFB}: \\; S_1 \\to S_2 \\]","text":"ধারার শুরুতে একটা জাংক byte 0x7A — S_0-তেই নিঃশব্দে শোষিত, FLAG-এর নড়ন নেই। তার ঠিক পরের 0xFF দরজার ঘণ্টা বাজিয়ে S_0 → S_1, আর তার পরের 0xFB ঠিকানা মেলিয়ে S_1 → S_2। তিন byte-এর এই ছোট্ট নাটকেই মেশিনের পুরো স্বভাব — গিলে ফেলা, পাল্লা খোলা, মেলানো।"},{"latex":"\\[ \\text{0xFF}: \\; S_0 \\to S_1, \\qquad \\text{0xFA} \\neq \\text{0xFB}: \\; S_1 \\to S_0 \\]","text":"প্রথম দুই byte 0xFF, 0xFA হলে: ঘণ্টি সঠিক, কিন্তু প্রেরকের ঠিকানা 0xFA — আমাদের প্রত্যাশা 0xFB (251) নয়, অন্য কারো নাম। ফল S_1 → S_0 পুরো রিসেট, 'not for me' — সুগঠিত চিঠিও ঠিকানা না মিললে একটি লাইনও পড়া হয় না; FLAG শূন্যে ফিরে পরের খামের অপেক্ষায় দাঁড়ায়।"},{"latex":"\\[ F_1 \\; \\text{accepted} \\Rightarrow S = S_0, \\qquad F_2: \\; \\text{0xFF} \\Rightarrow S_0 \\to S_1 \\; \\text{again} \\]","text":"পরপর দুটি চিঠি একই buffer-এ জমলেও গোলমাল হয় না: Part 9-এর Step 6 সফল-চিঠির শেষে FLAG-কে শূন্যে নামিয়ে দেয়, তাই F_1 শেষ হওয়ার মুহূর্তেই মেশিন আবার শুরুর দশায় — F_2-এর প্রথম 0xFF নতুন করে পাল্লা খোলে। একই করিডোর বারবার ব্যবহার হয়, নতুন করে কিছু ভাগ করে নেওয়ার দরকার হয় না।"}],"mapping":[{"code":"if self.__rx_FLAG == 0:","math":"\\[ S = \\mathrm{rx\\_FLAG} \\in \\{0, 1, 2, 3, 4, 5\\} \\]","text":"এই তুলনাটাই state register পড়া: S-এর বর্তমান মানই নির্ধারণ করে আগত byte কোন দরজার সামনে দাঁড়িয়েছে। লুপের প্রতিটি পুনরাবৃত্তি এই এক সংখ্যার প্রশ্ন দিয়েই শুরু হয়, আর সংখ্যাটি কল জুড়ে বেঁচে থাকাতেই মাঝপথে-থামা চিঠি হারায় না।"},{"code":"return False","math":"\\[ \\text{no accepting run in this call} \\;\\Rightarrow\\; \\text{return False} \\]","text":"খালি বাক্স (<code>n &lt;= 0<\/code>) কিংবা এই কলে কোনো পুরো চিঠি জোড়া না লাগা — দুই ক্ষেত্রেই এই নির্দেশ কলকার্তাকে জানায় 'এবার পাইনি'। কলকার্তারা (যেমন পরে আসা <code>set_arm_calib_offset<\/code>-এর ৬-বারের পুনর্চেষ্টা-লুপ) ঠিক এই False দেখে ঘুমিয়ে আবার ডাক-বাক্স খোলে — True/False-এর সরল চুক্তিই পুনর্চেষ্টার ছন্দ।"}],"failure":["এই state machine না থাকলে প্রতিটি জবাব এক আস্ত <code>read<\/code>-এ গোটা এসেছে ধরে নিতে হতো — serial লাইন এমন কোনো প্রতিশ্রুতি দেয় না; দুই টুকরোয় আসা চিঠি চিরকাল অপঠিত থাকত, আর রোবট নিজের প্রশ্নের জবাবে চিরকাল খালি-হাত ফিরত।","চিঠির আগে-পরে জাংক byte শোষণ না হলে — FLAG 0-এর else-টুকু না থাকলে — একটা শব্দ-বিট এলেই মেশিন ভুল ঘরানায় আটকে যেত: পরের সত্যিকারের 0xFF-ও আর চিনত না, একবার desync মানেই স্থায়ীভাবে বধির ডাক-পোত।","<code>RETURN_ID<\/code> যাচাইটা বাদ দিলে লাইনে অন্য যন্ত্রের ঠিকানার চিঠি এলে সেটাকেই আমাদের জবাব ভেবে পার্স হতে শুরু করত — অন্যের ডেটা রোবটের কনফিগ-খাতায় বসে যেত, আর সেই ভুল মান দিয়েই ক্যালিব্রেশনের হিসাব চলত।","প্রতি কলে <code>rx_CHECK = 0<\/code> না করে পুরোনো জমা সঙ্গে টানলে Step 6-এর checksum-যোগ আগের বাকি নিয়ে শুরু হতো — পরের প্রতিটি নিখুঁত চিঠিও ভুল যোগফলে ব্যর্থ হয়ে <code>check error<\/code> খেত, অথচ তার নিজের কোনো দোষ ছিল না।"]},"robot":{"correct":"ক্যালিব্রেশন-কাজ চলাকালে মাইক্রোকন্ট্রোলারের জবাব তার বেয়ে byte byte করে ফিরে আসে, প্রায়ই দু-তিন টুকরোয় — এই কোড সেই কাঁচা স্রোত থেকে গোটা চিঠি জোড়া দেয়: দুই খামের ফাঁকের শব্দ-byte চুপচাপ গিলে দেয়, অন্যের নামের খাম ফেলে দেয়, আর নিজের নামের খামের মুখ পেলে FLAG বাড়িয়ে পরের ধাপের (Part 9) জন্য জায়গা করে রাখে; বাক্স খালি থাকলে শুধু ভদ্র <code>False<\/code> ফেরে।","incorrect":"যদি ভাবো <code>ser.read()<\/code> এক কলে গোটা উত্তর-ফ্রেম সাজিয়ে হাতে তুলে দেবে, সেই আশা এই তারে ভেঙে পড়ে — তারে ফ্রেমের কোনো সীমানা-দাগ নেই, আছে শুধু byte-এর স্রোত; জবাব এক কলে আসতে পারে, ভাঙা দুই কলেও আসতে পারে, আর ঠিক সে-ক্ষেত্রে FLAG মনে না রাখলে কোড প্রথম টুকরোতেই বসে থাকত — এই কোড কিন্তু মাঝপথ মনে রেখেই হাঁটা চালিয়ে যায়।"},"id":"part-08","start":107,"end":133,"lang":"python","animType":"rxState","flags":[]},{"n":9,"fname":"config_robot.py","enTitle":"Steps 3-6 — Payload & Checksum Verify","explain":[{"a":134,"b":137,"text":"<b>ধাপ ৩ — চিঠির মাপ নেওয়া<\/b>: comment-টা রাস্তা দেখিয়ে দেয় — <code># Step 3: Read the Length of the message<\/code>। Part 8 আমাদের ঠিক এখানেই ফেলে এসেছে: FLAG 2, মানে HEAD (0xFF) আর RETURN_ID (0xFB) দুটোই মিলে গেছে, উত্তর-চিঠিটা আমারই। এবার <code>elif self.__rx_FLAG == 2:<\/code> শাখায় <code>self.__rx_LEN = data<\/code> — চিঠির নিজের LEN byte তুলে রাখা হয়, তারপর <code>self.__rx_FLAG = 3<\/code>। কেন এখনই LEN? কারণ পরের ধাপ থেকে মেশিনকে জানতে হবে ঠিক কত byte পড়ে থেমে checksum-এ পৌঁছাতে হবে — LEN ছাড়া payload-এর শেষ কোথায়, তার কোনো ঠিকানা নেই। নিয়মটাও চেনা: Part 6-এর tx-envelope-এর মতোই LEN গোনে DEVICE_ID-এর পরের byte-গুলো, নিজেকেও সহ — এই একই নিয়ম একটু পরে <code>LEN - 3<\/code> হয়ে ফিরে আসবে।"},{"a":139,"b":143,"text":"<b>ধাপ ৪ — ঠিকানা, আর কলম শূন্যে<\/b>: <code># Step 4: Read the Address (What is this data about?)<\/code> — <code>elif self.__rx_FLAG == 3:<\/code> শাখায় <code>self.__rx_ADDR = data<\/code> জানিয়ে দেয় উত্তরটা কোন বিষয়ের (যেমন 0x24 মানে ARM_OFFSET, 0x15 মানে CAR_TYPE), তারপর <code>self.__rx_FLAG = 4<\/code>। আর সঙ্গে এই ভাগের সবচেয়ে নীরব কিন্তু জরুরি লাইনটা: <code>self.__rx_COUNT = 0<\/code> — payload-লেখার কলম শূন্য ঘর থেকে শুরু। <b>মন দিয়ে দেখো<\/b>, রিসেটটা ঠিক এখানেই, ADDR পড়ার মুহূর্তে হওয়া দরকার: আগের চিঠির আধা-পড়া COUNT পড়ে থাকলে নতুন payload-টা inbox-এর ভুল ঘর থেকে লেখা শুরু করত — তারপর যাচাইয়ের সময় সব এলোমেলো হয়ে যেত।"},{"a":145,"b":151,"text":"<b>ধাপ ৫ — payload, এক byte করে<\/b>: <code>elif self.__rx_FLAG == 4:<\/code> — এই অবস্থায় আসা প্রতিটি byte দুটি <b>পাশাপাশি<\/b> <code>if<\/code>-এর ভেতর দিয়ে যায়; লক্ষ করো, <code>elif<\/code> নয় — দুটো স্বাধীন পরীক্ষা। প্রথমটা: <code>if self.__rx_COUNT &lt; self.__rx_LEN - 3:<\/code> সত্য হলে <code>self.__rx_DATA[self.__rx_COUNT] = data<\/code> বাইটটা inbox-এর COUNT-তম ঘরে বসে, আর <code>self.__rx_COUNT = self.__rx_COUNT + 1<\/code> ঘর এক এগোয়। দ্বিতীয়টা আলাদাভাবে দেখে: <code>if self.__rx_COUNT &gt;= (self.__rx_LEN - 3):<\/code> — ভরা হয়ে গেছে, তাই <code>self.__rx_FLAG = 5<\/code>। এই <code>LEN - 3<\/code>-ই payload-এর দৈর্ঘ্য: LEN নিজেকে (1), ADDR-কে (1) আর checksum-কে (1) গুনে রাখে, বাকিটাই খাঁটি payload। আর দুই <code>if<\/code> জোড়া না হওয়ার একটা সুন্দর ফল আছে: শেষ payload byte-টা বসানোর সেই একই পাসেই COUNT <code>LEN - 3<\/code> ছুঁয়ে FLAG 5-এ উঠে যায় — তার পরের byte-টাই সরাসরি checksum হিসেবে ধরা পড়ে।"},{"a":153,"b":157,"text":"<b>ধাপ ৬ — যাচাইয়ের উপাদান মেশানো<\/b>: <code># Step 6: Check the Checksum to ensure no data was corrupted over the wire.<\/code> — এখন <code>elif self.__rx_FLAG == 5:<\/code>, হাতের byte চিঠির শেষ অক্ষর। প্রথম কাজ <code>for value in self.__rx_DATA:<\/code> দিয়ে <code>rx_CHECK = rx_CHECK + value<\/code> — <b>পুরো 40 ঘরের inbox-এর যোগফল<\/b>, শুধু payload-টুকু নয়! এটা চলতে পারে শুধু এই কারণে যে inbox আগেই ধুয়ে রাখা: Part 7-এর <code>__request<\/code> চিঠি পাঠানোর আগে 98-99 নম্বর লাইনে, আর <code>set_arm_calib_offset<\/code> 252-253 নম্বর লাইনে পুরো <code>__rx_DATA<\/code> শূন্য করে — 0 যোগফলে কিছুই বাড়ায় না। তারপর <code>rx_CHECK = (self.__rx_LEN + self.__rx_ADDR + rx_CHECK) % 256<\/code> — রেসিপিটা চেনা লাগবে: Part 7-এর request-checksum <code>(buf_len + order + addr + param) % 256<\/code>-এর হুবহু প্রতিধ্বনি, এখানেও HEAD, DEVICE_ID বা COMPLEMENT নেই — পাঠানোর দিকে যে আসমেট্রি দেখেছি, সেটাই এবার রিসিভ-দিকে ফিরে এসেছে।"},{"a":158,"b":162,"text":"<b>মিললে — চিঠি গৃহীত<\/b>: <code>if data == rx_CHECK:<\/code> — নিজের হিসাবের সঙ্গে চিঠির শেষ byte-এর লেখা মিলে গেলে comment-টা উল্লাসে ফেটে পড়ে: <code># Yay! We successfully received a valid data packet!<\/code>। তখন <code>self.__rx_FLAG = 0<\/code> আর <code>self.__rx_COUNT = 0<\/code> — মেশিন দরজায় ফিরে দাঁড়ায় পরের চিঠির অপেক্ষায় — আর <code>return True<\/code> সঙ্গে সঙ্গে for-loop-এর মাঝপথ থেকেই পুরো function ছেড়ে বেরিয়ে যায়। ছোট্ট একটা অসম আচরণও দেখে নাও: এই শাখায় ADDR আর LEN রিসেট হয় না — নিচের ব্যর্থ-শাখার মতো সব মুছে ফেলার বদলে শেষ-পড়া চিঠির ঠিকানা-মাপ পড়ে থেকে যায়।"},{"a":163,"b":170,"text":"<b>না-মিললে — পুরো চিঠি বর্জন<\/b>: <code>else:<\/code> শাখার comment-ই ব্যাপারটা বলে দেয়: <code># Uh oh. Checksum failed. The wire must have glitched. Throw away the data.<\/code> — হিসাব করা <code>rx_CHECK<\/code> আর আসল <code>data<\/code> আলাদা। <code>if self.__debug:<\/code> খোলা থাকলে <code>print(\"check error:\", rx_CHECK, data)<\/code> প্রত্যাশিত বনাম পাওয়া মান terminal-এ ছাপে; বন্ধ থাকলে একটাও শব্দ নেই। তারপর চার লাইনে <code>self.__rx_FLAG = 0<\/code>, <code>self.__rx_COUNT = 0<\/code>, <code>self.__rx_ADDR = 0<\/code>, <code>self.__rx_LEN = 0<\/code> — গ্রহণ-শাখার চেয়ে বেশি জিনিস মুছে পুরো চিঠিটা নীরবে ফেলে দেওয়া হয়। আর <b>লক্ষ করো<\/b>, এই শাখায় কোনো <code>return<\/code> নেই: লেখা অনুযায়ী for-loop বাকি থাকা byte-গুলোও খেয়ে নিয়ে এগোয়, তৎক্ষণাৎ ফেরে না (উত্তর-frame সাধারণত ওখানেই শেষ বলে ব্যাপারটা প্রায়ই অর্থহীন)। তবে দামটা আছে: <code>rx_CHECK<\/code> শূন্য করা হয় লুপের আগে একবারই, তাই একই কলে সামনে আরেকটা পূর্ণ চিঠি থাকলে তার যোগফল এই বিষে ভেজা মানের ওপর জমত — মিল ভেঙে যেত।"},{"a":171,"b":171,"text":"লুপ ফুরিয়ে গেলে পৌঁছানোর জায়গা এটাই: <code>return False<\/code> — এই কলে কোনো checksum-বৈধ চিঠি পাওয়া যায়নি। চিঠিটা হারিয়ে গেল, কিন্তু গল্প সেখানেই শেষ নয় — আবার চেষ্টার ধৈর্য কলারের হাতে: Part 12-এর ছয়-টিকের লুপ ঘুমিয়ে-উঠে বারবার <code>__unpack<\/code>-কে ডেকে চেষ্টা চালিয়ে যায়।"}],"math":{"intro":"এই Part-এর গণিত একটাই প্রশ্নের তিন স্তর: চিঠিতে payload ঠিক কতটুকু, checksum k-এর ভেতর কী কী ঢোকে, আর কোন শর্তে চিঠি গৃহীত হয় — প্রতিটি স্তর আগেরটার ওপর দাঁড়িয়ে থাকে।","levels":[{"label":"Level 1 — payload-এর দৈর্ঘ্য","latex":"\\[ L = \\underbrace{1}_{\\text{LEN itself}} + \\underbrace{1}_{\\text{ADDR}} + p + \\underbrace{1}_{\\text{checksum}} \\;\\Longrightarrow\\; p = L - 3 \\]","text":"L মানে <code>__rx_LEN<\/code>, p মানে payload-দৈর্ঘ্য। LEN গোনে DEVICE_ID-এর পরের byte-গুলো নিজেকে সহ — Part 6-এর tx-envelope-এর একই হিসাব; নিজে 1, ঠিকানা 1, checksum 1 — এই তিনটা বাদ দিলেই যা থাকে সেটাই খাঁটি payload, আর সেটাই <code>LEN - 3<\/code> হয়ে Step 5-এর দুই পরীক্ষাতেই বসে।"},{"label":"Level 2 — পুরো inbox-এর যোগফল আর k","latex":"\\[ k = \\left( L + A + \\sum_{i=0}^{39} d_i \\right) \\bmod 256, \\qquad \\sum_{i=0}^{39} d_i = \\sum_{i=0}^{p-1} d_i \\]","text":"A মানে <code>__rx_ADDR<\/code>, d_i মানে inbox-এর i-তম byte। Step 6 শুধু payload নয়, <b>চল্লিশ ঘরের পুরো যোগফল<\/b> নেয় — কিন্তু ভরা-ঘরের পরের সব ঘর 0 থাকে (Part 7-এর 98-99 আর <code>set_arm_calib_offset<\/code>-এর 252-253 লাইনের ধোয়া), তাই বড় যোগফলটা আসলে ছোট যোগফলটাই: 0 কিছু যোগ করে না। শেষে 256-এ ভাগের রেস্ট — পুরো হিসাবটা একটাই byte-এর মধ্যে সামানো।"},{"label":"Level 3 — গ্রহণ বনাম বর্জন","latex":"\\[ d_{\\text{last}} = k \\;\\Rightarrow\\; \\text{FLAG} \\leftarrow 0,\\ \\text{return True}; \\qquad d_{\\text{last}} \\neq k \\;\\Rightarrow\\; \\text{reset all},\\ \\text{return False} \\]","text":"চিঠির শেষ byte ঠিক k হলেই চিঠি গৃহীত — অন্য কিছু হলে FLAG, COUNT, ADDR, LEN সব শূন্যে ফেলে পুরো চিঠি বর্জন। এই স্তরে resend বলে কিছু নেই — আবার চেষ্টার দায় কলারের (Part 12-এর ছয়-টিক লুপ)। checksum তাই এক দরজার পাহারা: ভেতরে ঢুকতে দেরি হতে পারে, নোংরা কিছু ঢুকতে পারে না।"}],"numeric":[{"latex":"\\[ \\Sigma = 3 + 1 = 4, \\qquad k = (5 + 36 + 4) \\bmod 256 = 45 = \\mathrm{0x2D} \\]","text":"উদাহরণ — reply-format-টা <code>__unpack<\/code>-এর নিজের নিয়ম থেকেই উল্টে বানানো (RETURN_ID 0xFB, p = LEN − 3, payload <code>__rx_DATA<\/code>-তে): ARM_OFFSET (0x24)-এর উত্তরে payload [arm_id = 3, state = 1] হলে চিঠি <code>FF FB 05 24 03 01 2D<\/code> — LEN = 5 (1 + 1 + 2 + 1), p = 2; ধোয়া inbox-এর যোগফল 3 + 1 = 4, আর k = 5 + 0x24 + 4 = 45 = 0x2D — শেষ byte তাই-ই।"},{"latex":"\\[ \\Sigma = 7 + 0 = 7, \\qquad k = (5 + 21 + 7) \\bmod 256 = 33 = \\mathrm{0x21} \\]","text":"দ্বিতীয় উদাহরণ (Part 16-এর <code>read_car_type<\/code>-এর জগৎ থেকে): car_type = 7-এর উত্তর payload <code>07 00<\/code> নিয়ে আসে — চিঠি <code>FF FB 05 15 07 00 21<\/code>; Σ = 7 + 0 = 7, k = 5 + 0x15 + 7 = 33 = 0x21। পরে <code>struct.unpack('h', ...)<\/code> ওই <code>07 00<\/code>-কে little-endian জোড়া হিসেবে 7-ই পড়বে।"},{"latex":"\\[ \\Sigma' = 4 + 16 = 20, \\qquad k' = (5 + 36 + 20) \\bmod 256 = 61 \\neq 45 \\]","text":"ধোয়া inbox কেন এত জরুরি, এক নজরে: <code>__rx_DATA<\/code>-র 5 নম্বর ঘরে আগের চিঠির পচা byte 0x10 (16) পড়ে থাকলে Σ = 4 + 16 = 20, k = 61 — নিখুঁত চিঠির শেষ byte 0x2D-এর সঙ্গে মিলবে না, বৈধ উত্তরও বর্জিত হত।"}],"mapping":[{"code":"self.__rx_DATA[self.__rx_COUNT] = data","math":"\\[ d_c \\leftarrow \\text{byte}, \\qquad c \\leftarrow c + 1 \\]","text":"সমীকরণের বাম-হাত কোডের এই এক লাইনেই: c-তম ঘরে সদ্য-আসা byte বসে, পরের লাইনে c এক বাড়ে — এই জোড়াই Σ-র উপাদান তৈরি করে; আর c ঠিক L − 3 ছুঁলেই দরজা FLAG 5-এ উঠে যায়।"},{"code":"rx_CHECK = (self.__rx_LEN + self.__rx_ADDR + rx_CHECK) % 256","math":"\\[ k = (L + A + \\Sigma) \\bmod 256 \\]","text":"মেশিনের এই এক লাইনেই Level 2 সম্পূর্ণ: LEN, ADDR আর পুরো-inbox যোগফল একসঙ্গে গেঁথে 256-এর নিচে নামানো — Part 7-এর request-রেসিপির হুবহু আয়না, HEAD/DEVICE_ID/COMPLEMENT ছাড়াই।"}],"failure":["inbox ধোয়ার লুপগুলো (Part 7-এর 98-99, <code>set_arm_calib_offset<\/code>-এর 252-253) বাদ গেলে আগের চিঠির পচা tail প্রতি হিসাবে Σ-তে ঢুকত — মাইক্রোকন্ট্রোলার যতই নিখুঁত উত্তর পাঠাক, সব চিঠি চিরকাল <code>check error<\/code>-এ বর্জিত, কোনো কনফিগারেশনই আর পড়া যেত না।","<code>LEN - 3<\/code>-এর হিসাবে এক এদিক-ওদিক হলে সীমানা পিছলে যায় — এক দিকে সরলে শেষ payload byte-টাই checksum-এর আসনে বসে, অন্য দিকে সরলে আসল checksum-টা payload-এর ভেতর ঢুকে যায়; দুই ক্ষেত্রেই কোন byte-এর সঙ্গে k মেলানো হচ্ছে, সেটাই এলোমেলো হয়ে পড়ে।","checksum না-মিললে এই স্তর নিজে কিছু আবার চায় না — চিঠিটা নীরবে ফেলে <code>return False<\/code>; আবার-চেষ্টার ভার পুরোটা কলারের (Part 12-এর ছয়-টিক লুপ)। সেই ধৈর্যের জালটাও বাইরে না থাকলে একটা wire-glitch-ই কনফিগারেশন-পড়া অনন্তকালের জন্য আটকে দিত।","Step 6-এর রেসিপি নিয়ে সৃজনশীল হলে বিপদ: শূন্য-ঘর বাদ দিলে ক্ষতি নেই (0 কিছু যোগ করে না), কিন্তু Part 6-এর tx-রেসিপির মতো HEAD বা DEVICE_ID ঢুকিয়ে দিলে — বা LEN/ADDR বাদ দিলে — k-ই বদলে যায়; মাইক্রোকন্ট্রোলার তার নিজের রেসিপিতে শেষ byte লেখে, দুই পাশের রান্না না মিললে প্রতিটি চিঠি বর্জিত — Part 7-এর সেই আসমেট্রির শিক্ষাই আবার।"]},"robot":{"correct":"এই কোড ঠিকমতো চললে রিডিং-ফাংশনগুলোর হাতে কেবল checksum-বৈধ চিঠিই পৌঁছায় — তারে লাইনে সামান্য নয়েজ এলে কনফিগারেশন-পড়া দেরি হয় (কলার আবার চেষ্টা করে), কিন্তু বিকৃত চিঠি কোনোদিন ভেতরে ঢুকতে পারে না।","incorrect":"checksum ফেল করলে এই স্তরেই নতুন করে চিঠি চাওয়া হবে ভেবে বসলে সেই আশা ভঙ্গ হয় — কোডটা শুধু চিঠিটা নীরবে ফেলে দিয়ে <code>return False<\/code> করে; আবার-পাঠানোর বুদ্ধি এখানে নেই, সেই ইঞ্জিন জাগে কেবল কলারের ছয়-টিক লুপে (Part 12)।"},"id":"part-09","start":134,"end":171,"lang":"python","animType":"rxVerify","flags":[]},{"n":10,"fname":"config_robot.py","enTitle":"Reboot, Factory Reset & Save","explain":[{"a":174,"b":175,"text":"<b>নতুন অধ্যায়ের ফলক<\/b>: <code># --- CONFIGURATION FUNCTIONS ---<\/code> আর তার ব্যাখ্যা <code># (These are the \"User-Friendly\" buttons you press. They format the data and call __send() or __request())<\/code> — comment-জুড়িটা ঘোষণা করে, ফাইলের চেহারা এখানে বদলাচ্ছে। Part 6-9 পর্যন্ত আমরা গুছিয়েছি প্রটোকলের কাঁচামাল — <code>__send<\/code>-এর খামগাথা, <code>__request<\/code>-এর প্রশ্নপত্র, <code>__unpack<\/code>-এর state machine; এবার শুরু সেই স্তর, যেখানে প্রতিটি ফাংশন একটি সুস্পষ্ট <b>বোতাম<\/b> — নাম ধরে ডাকলেই নির্দিষ্ট একটা কাজ ঘটে। বোতামদের ছাঁচও একই: ওপরের <code>ORDER<\/code> menu-র নিজের সারিতে payload বসানো, তারপর <code>__send()<\/code> বা <code>__request()<\/code>-কে ডেকে চিঠি হাওয়া করা। এই Part-এ তিনটি maintenance-বোতাম — reboot, factory reset আর save; Part 11 থেকে শুরু হবে arm-এর মাপজোখের বোতাম।"},{"a":177,"b":180,"text":"<b>প্রথম বোতাম আর তার গোপন চাবি<\/b>: <code># Reboot the microcontroller<\/code> বলে কাজের পরিচয় দিয়ে <code>def reboot_device(self):<\/code> শুরু। তারপর দুই লাইনে <code>ORDER[\"ROBOT_REBOOT\"]<\/code> সারিটি (ঠিকানা 0x80) ভরাট হয়: <code>ORDER[\"ROBOT_REBOOT\"][1] = 0x5F  # Secret reboot code<\/code> এবং <code>ORDER[\"ROBOT_REBOOT\"][2] = 0x5F<\/code>। মন দিয়ে দেখো — \"secret code\" আসলে একটাই byte, 0x5F (দশমিকে 95), পরপর <b>দুইবার<\/b>: কার্যত 0x5F5F জোড়া। চাবি কেন লাগে? reboot এমন এক আদেশ যার তারে বাজলে বিপদ — তাই payload-র দুই ঘরে ঠিক 95-95 বসানো এক ধরনের ইচ্ছার-স্বাক্ষর: দুর্ঘটনাবশত রওনা হওয়া কোনো চিঠি এই জোড়া হুবহু মিলিয়ে ফেলবে না, আর controller দেখেই বুঝে নেয় reboot-টা সত্যিই ইচ্ছে করা।"},{"a":181,"b":182,"text":"<b>চিঠি রওনা, তারপর দীর্ঘ নৈঃশব্দ্য<\/b>: <code>self.__send(\"ROBOT_REBOOT\", len=2)<\/code> — আগের Part-এ বানানো খাম-ছাঁচ এবার কাজে নামে: দরজার ঘণ্টা 0xFF, প্রাপক 0xFC, দৈর্ঘ্য len+3 = 5, order 0x80, তারপর payload-র দুটি 0x5F, শেষে checksum — মোট ৭টি byte-এর ছোট্ট চিঠি। এরপরই <code>time.sleep(2)<\/code>, আর এখানেই এই Part-এর সবচেয়ে জোরালো ইঙ্গিতটি: <code>__send<\/code>-এর ভেতরের চিঠি-বিরতি মাত্র 0.01 সেকেন্ড, অথচ এই বোতাম দাঁড়িয়ে থাকে ঠিক ২ সেকেন্ড — চিঠি-বিরতির ২০০ গুণ। কারণ সরল: চিঠি পেয়ে controller সত্যিই পুনরায় চালু হচ্ছে, আর রিস্টার্টের সময় সে আর কোনো কথা শোনে না — Python ভদ্রতা করে সে-সময়টা দেয়। ছোট্ট একটা স্মারকও থাকুক নজরে: 183-নম্বর লাইনটি সম্পূর্ণ ফাঁকা নয়, শুধুই কয়েকটা space — দুই বোতামের মাঝের নীরব ফাঁক।"},{"a":184,"b":187,"text":"<b>দ্বিতীয় বোতাম — নামটাই ভারী: factory reset<\/b>: <code># Wipe all custom settings back to factory defaults<\/code> comment নিজেই বলে দিচ্ছে ক্ষমতাটা কতটা; <code>def reset_factory_config(self):<\/code>। এবার menu-র অন্য সারি — <code>ORDER[\"ROBOT_CONFIG\"][1] = 0<\/code> আর <code>ORDER[\"ROBOT_CONFIG\"][2] = 0x5F<\/code>, ঠিকানা 0x81। এই Part-এর সবচেয়ে সুন্দর পর্যবেক্ষণ এখানে: <b>একই ঠিকানা, দুই ক্রিয়া<\/b>। 0x81-এ যাওয়া চিঠির প্রথম payload byte-ই ঠিক করে দেয় কাজটা কী — 1 মানে <b>save<\/b>, 0 মানে <b>wipe<\/b>; আর দ্বিতীয় ঘরের 0x5F সেই একই পাহারাওয়ালা byte, যাতে 0x81-এ পৌঁছানো কোনো দুর্ঘটনা-চিঠি হঠাৎ সব সেটিং মুছে না দেয়। লক্ষ করো, <code>[1] = 0<\/code> লেখাটা মোটেই বৃথা নয়: একটু পরের <code>update_config_data<\/code> চলে গেলে ওই ঘরে 1 বসিয়ে রেখে যায় — dictionary মনে রাখে; সেই পুরনো 1-কে হারাতেই প্রতিবার স্পষ্ট করে শূন্য বসানো হয়।"},{"a":188,"b":189,"text":"<b>মোছার আদেশ, তারপর আবার সেই ২ সেকেন্ড<\/b>: <code>self.__send(\"ROBOT_CONFIG\", len=2)<\/code> — একই ৭-byte খাম, শুধু order এবার 0x81, payload <code>[0, 0x5F]<\/code>। তারপর <code>time.sleep(2)<\/code>: flash মোছাও এই প্রটোকলের ভারী কাজ — controller তার permanent memory-র জমানো সেটিং মুছে কারখানা-চেহারায় ফিরছে; সাধারণ চিঠির 0.01 সেকেন্ডের বিরতির পাশে এই ২ সেকেন্ড অপেক্ষাই বোতামটিকে আলাদা ওজন দেয়। আর মন দিয়ে দেখো — এই বোতাম <code>if self.__data_changed:<\/code> জাতীয় কোনো পরীক্ষাই করে না, <b>সবসময়<\/b> পাঠায়; পাশাপাশি Python-পাশের dirty পতাকাটিও নামায় না — উল্টো ভেতরের <code>__send<\/code> নিজেই পতাকাটি তুলে দেয়। ফলে factory reset চালানোর পরেও হিসাবের খাতায় \"কিছু বদলেছে\" দাগটা থেকে যায় — এই কুইর্কের ফল একটু পরেই ধরা পড়বে।"},{"a":191,"b":193,"text":"<b>তৃতীয় বোতাম — একমাত্র যে দরজায় তালা চায়<\/b>: <code># Save changes to the microcontroller's permanent memory<\/code> আর <code>def update_config_data(self):<\/code>; কিন্তু আসল কথা তৃতীয় লাইনে — <code>if self.__data_changed:<\/code>। class যে হিসাবের খাতা জন্মের দিনই খুলে রেখেছিল (<code>self.__data_changed = False<\/code>), এই প্রথম সেই খাতা পড়া হলো। প্রতিটি <code>__send<\/code> ডাক পতাকাটি তুলে দেয় বলে খাতাটা আসলে একটাই প্রশ্নের উত্তর জমিয়ে রাখে — \"শেষ save-এর পরে কিছু বদলেছে কি?\"। উত্তর না হলে পুরো শরীরটাই লাফিয়ে যায়: কোনো চিঠি নেই, ২ সেকেন্ডের অপেক্ষা নেই — ফাংশন নীরবে ফিরে আসে; হ্যাঁ হলেই কেবল permanent memory-তে লেখার অনুমতি। এই dirty-flag খাতার হিসাব Part 20-এ এসে সবচেয়ে কাজে লাগবে।"},{"a":194,"b":198,"text":"<b>save-এর পাঁচ ধাপ<\/b>: <code>ORDER[\"ROBOT_CONFIG\"][1] = 1<\/code> — 0x81-এর দ্বিতীয় ক্রিয়া, 1 মানে <b>save<\/b>; <code>ORDER[\"ROBOT_CONFIG\"][2] = 0x5F<\/code> — চেনা পাহারাওয়ালা byte-ই। তারপর <code>self.__send(\"ROBOT_CONFIG\", len=2)<\/code>, এবং ঠিক তার পরেই <code>self.__data_changed = False<\/code> — খাতার হিসাব শূন্যে ফেরে: পরের বদল না ঘটা পর্যন্ত এই বোতাম আর কিছু লিখবে না। ক্রমটা মন দিয়ে দেখো — পতাকা নামানো <b>চিঠি পাঠানোর পরে<\/b> বসানো, কারণ <code>__send<\/code>-এর ভেতরেই পতাকা আবার ওঠে; আগে নামালে সেই উত্তোলনই খাতায় নতুন দাগ বসিয়ে দিত। শেষে <code>time.sleep(2)<\/code> — flash-এ লেখাও রিস্টার্টের মতোই ভারী কাজ। আর আগের কুইর্কটা এখানে পূর্ণতা পায়: reboot বা reset পতাকা নামায় না বলে factory reset-এর পরেও এই ফাংশন একবার save পাঠাতে পারে — কোড যা বলে ঠিক তা-ই ঘটে; সোর্স যেমন আছে তেমনই থাকবে, আমরা শুধু পর্যবেক্ষণ করছি, ঠিকাতে যাচ্ছি না।"}],"math":null,"robot":{"correct":"বোতাম-তিনের আসল জীবন এমন: আগের বোতামের setter-রা controller-এর সাময়িক (RAM) সেটিংসে বদল বসায়, <code>update_config_data<\/code> সেই বদলগুলিকে permanent memory-তে লিখে রাখে, আর <code>reboot_device<\/code> controller-কে পুনরায় চালু করে নতুন সেটিংস কার্যকর করে — প্রতিটি configuration session-এর এই তিন-ধাপের আচারই চলে; প্রতিটি ভারী কাজের পরে Python-পক্ষ ঠিক ২ সেকেন্ড অপেক্ষা করে, যাতে রিস্টার্ট বা লেখার কাজ শান্তভাবে শেষ হয়।","incorrect":"যদি ভাবো প্রতিটা setter ডাকামাত্রই সেটিং সেভ হয়ে যায়, এই কোড সেই আশা ভঙ্গ করে — persist করে কেবল <code>update_config_data<\/code>, তাও আবার পতাকা উঠে থাকলে; আর এর পরের Part-গুলোর arm-torque/offset বোতাম তো ইচ্ছে করেই <code>data_changed<\/code> পতাকাটি উত্তোলনই করে না (send-এর আগের অবস্থায় ফিরিয়ে রাখে), ফলে সেই বদল কখনো save-এর দাবিতে ওঠেই না — পাওয়ার হারালে বদলটা সমেত হারিয়ে যায়।"},"id":"part-10","start":174,"end":198,"lang":"python","animType":null,"flags":[]},{"n":11,"fname":"config_robot.py","enTitle":"Arm Middle Values & Torque","explain":[{"a":201,"b":205,"text":"<b>হাতের ছয় সার্ভোর মাঝ-বাড়ি, আর তার পাহারা-জানালা<\/b>: comment-টা পরিষ্কার — <code># Set the middle position of the arm servos (raw servo units)<\/code>; <code>def set_arm_mid_value(self, mid_value=[2000, 2000, 2000, 2000, 1486, 3100])<\/code> — ডিফল্ট তালিকার ছয়টা মান <b>ডিগ্রি নয়<\/b>, সার্ভোর নিজস্ব কাঁচা একক (raw units): প্রথম চার জয়েন্টের কেন্দ্র 2000, পঞ্চমটার 1486, ষষ্ঠটার 3100। এই series-এর প্রথম analysis — folder 01-এর arm calibration — যে ছয়টা সার্ভো নিয়ে সারাক্ষণ কাজ করেছিল, এখানে ঠিক তাদেরই ঘর-অবস্থান পাঠানো হচ্ছে। তারপর সতর্কতা-দরজা (line 203-এর comment <code># Check if the values are within a safe range so we don't break the servos<\/code>): শর্তটা দুই লাইনে <code>\\<\/code> দিয়ে বাঁধা — <code>if 1600 &lt;= mid_value[0] &lt;= 2400 and ...<\/code>; অর্থাৎ s1–s4 প্রত্যেকে <code>1600 &lt;= v &lt;= 2400<\/code>, s5-এর জানালা <code>1186 &lt;= v &lt;= 1786<\/code>, s6-এরটা <code>2700 &lt;= v &lt;= 3500<\/code>, ছয়টা জানালাই <code>and<\/code>-এ জোড়া। <b>মন দিয়ে দেখো<\/b> — ডিফল্ট মানগুলো হুবহু প্রতিটি জানালার কেন্দ্রবিন্দু: (1600+2400)/2 = 2000, (1186+1786)/2 = 1486, (2700+3500)/2 = 3100।"},{"a":207,"b":213,"text":"<b>সংখ্যাকে বাইটে ভাঁজা<\/b>: comment <code># struct.pack turns normal Python numbers into binary bytes the servo understands<\/code>; তারপর ছয়টা একই ছাঁচের লাইন — <code>value_s1 = bytearray(struct.pack('h', int(mid_value[0])))<\/code> থেকে <code>value_s6<\/code> পর্যন্ত, শুধু সূচি আর নাম বদলায়। <code>'h'<\/code> মানে 16-bit <b>signed<\/b> short — আর <b>লক্ষ করো<\/b>, তার সামনে কোনো <code>'&lt;'<\/code> বা <code>'&gt;'<\/code> নেই, অর্থাৎ byte order নেওয়া হয়েছে <b>native<\/b>: কোডটা ধরেই নিয়েছে যন্ত্রটা little-endian — Jetson-এর x86/ARM-এ অনুমানটা সত্য, তাই কাজ চলে যায়। ভেতরের <code>int()<\/code>-ও দরকারি খোলস: মান float হয়ে এলেও struct পূর্ণসংখ্যাই দেখে। ফল যা দাঁড়ায়: <code>2000 → 0x07D0 → [0xD0, 0x07]<\/code>, <code>1486 → 0x05CE → [0xCE, 0x05]<\/code>, <code>3100 → 0x0C1C → [0x1C, 0x0C]<\/code> — ছোট অংশ (low byte) আগে, বড় অংশ (high byte) পরে।"},{"a":215,"b":229,"text":"<b>খাম-ভরাট, তারপর এক চিঠি<\/b>: comment <code># Pack all 6 values into our ORDER array to be sent<\/code>; file-এর উপরের ORDER মেনুতে <code>ARM_MID_VALUE<\/code> এন্ট্রি (ঠিকানা <code>0x25<\/code>) জন্ম থেকেই ১৩টা শূন্য-স্লট নিয়ে বসেছিল — এখন <code>[1]..[12]<\/code> ঘরে বারোটা বাইট পরপর ঢোকে: প্রতিটা জোড়ায় আগে low (<code>value_s1[0]<\/code>), পরে high (<code>value_s1[1]<\/code>) — little-endian বিন্যাসটা খামেও অটুট থাকে। <code>ORDER[\"ARM_MID_VALUE\"][13] = 0<\/code> শেষ স্লটে শূন্য-প্যাড রেখে দেয়, তারপর <code>self.__send(\"ARM_MID_VALUE\", len=13)<\/code>। Part 6-এর পাঠানোর ইঞ্জিন তখন LEN-ঘড়ি ঘোরায়: 13 + 3 = 16 = <code>0x10<\/code>, আর তারে চিঠির কঙ্কাল দাঁড়িয়ে যায় — <code>FF FC 10 25<\/code>, তারপর মান-স্লটগুলো, শেষে checksum।"},{"a":230,"b":231,"text":"<b>নিরাপত্তা-জাল ধরলে যা হয়<\/b>: <code>else:<\/code> শাখায় মাত্র এক লাইন — <code>print(\"mid_value input error!\")<\/code>। কোনো exception নেই, কোনো শাস্তিও নেই: জানালার বাইরের মান চুপচাপ বাতিল — তারে কিছু যায় না, <code>ORDER<\/code>-এর স্লটে আঙুলও পড়ে না, <code>__send<\/code> ডাকাই হয় না, ফাংশন <code>None<\/code> ফিরে এসে প্রোগ্রাম তার মতো চলতেই থাকে। নরম-প্রত্যাখ্যানটা নকশার জিনিস: ভুল মান দিয়ে সার্ভো ভাঙার বদলে ব্যবহারকারীকে terminal-এ এক লাইনের ইঙ্গিত দিয়ে থেমে যাওয়া — তবে <b>লক্ষ করো<\/b>, চিঠিটা যে যায়ইনি তার ছাড়া আর কোনো স্পষ্ট চিহ্ন রইল না।"},{"a":233,"b":239,"text":"<b>টর্কের সুইচ<\/b>: comment <code># Turn arm motor power ON (1) or OFF (0)<\/code>; <code>def set_arm_torque(self, enable):<\/code> — প্রথমেই সেই খুলে-খুলে লেখা if/else: <code>if enable &gt; 0: on = 1<\/code>, অন্যথায় <code>on = 0<\/code>। Python-এ এটা এক লাইনে <code>on = 1 if enable &gt; 0 else 0<\/code> লেখার মতোই, কিন্তু শিক্ষক-কোড ধাপগুলো দেখিয়ে রেখেছে — যেকোনো ধনাত্মক মান 1-এ মিলিয়ে যায়, শূন্য বা ঋণাত্মক 0-তে। তারপর <code>ORDER[\"ARM_TORQUE\"][1] = on<\/code> — ঠিকানা <code>0x22<\/code>-এর প্রথম স্লটে একটাই বাইট: 1 মানে সার্ভোগুলোয় পাওয়ার জ্বলে, 0 মানে হাত নিজের ভারে ঝুলে পড়ে।"},{"a":240,"b":242,"text":"<b>পতাকা-ট্রিক — দাগ রাখা, তারপর মুছে ফেলা<\/b>: <code>temp = self.__data_changed<\/code>, তারপর <code>self.__send(\"ARM_TORQUE\", len=1)<\/code>, শেষে <code>self.__data_changed = temp<\/code>। কেন এই ঘুরপথ — উত্তর Part 6-এ: <code>__send<\/code> ঢুকেই প্রথম কাজ হিসেবে <code>self.__data_changed = True<\/code> করে দেয় (line 60), যাতে Part 10-এর <code>update_config_data()<\/code> জানতে পারে 'কিছু বদলেছে, সেভ করো'। এই মেথড send-এর <b>আগের<\/b> পতাকার মান তুলে রেখে কাজ শেষে তা <b>ফিরিয়ে বসিয়ে দেয়<\/b> — অর্থাৎ টর্ক-টগল ইচ্ছা করেই সেভ-তালিকায় নাম লেখায় না। কারণ সরল: টর্ক অন/অফ হলো <b>ক্ষণস্থায়ী (transient)<\/b> রানটাইম অবস্থা — রোবট বন্ধ হলে তার মরে যাওয়াই স্বাভাবিক, তাই এই চিঠি কখনো flash-মুখী হয় না।"}],"math":{"intro":"এই Part-এর গণিত তিন তলায় সাজানো: সার্ভোর কাঁচা একক আর তার নিরাপত্তা-জানালা, সংখ্যা থেকে বাইট-জোড়ার little-endian সূত্র, আর ছয়টা মান থেকে একটা চিঠির LEN-অঙ্ক — নিচে প্রতিটার হাতে-গরম হিসাব।","levels":[{"label":"Level 1 — কাঁচা একক ও নিরাপত্তা-জানালা","latex":"\\[ v_i \\in \\mathbb{Z} \\;\\text{(raw servo unit, not degree)}, \\quad 1600 \\leq v_{1,2,3,4} \\leq 2400, \\;\\; 1186 \\leq v_5 \\leq 1786, \\;\\; 2700 \\leq v_6 \\leq 3500 \\]","text":"প্রতিটি v সার্ভোর ভেতরের কাঁচা গণনা (raw int16 count) — ডিগ্রি বা রেডিয়ান নয়; জানালার ভেতরে থাকা মানেই সেটা যান্ত্রিকভাবে সম্ভব অঞ্চলে আটকে আছে। ডিফল্ট <code>[2000, 2000, 2000, 2000, 1486, 3100]<\/code> প্রতিটি জানালার ঠিক মধ্যবিন্দু — নিরাপদ জায়গা থেকে দুই দিকেই সমান যাত্রার জায়গা।"},{"label":"Level 2 — little-endian বাইট-জোড়া","latex":"\\[ v = b_{\\mathrm{lo}} + 256 \\cdot b_{\\mathrm{hi}}, \\qquad (b_{\\mathrm{lo}},\\, b_{\\mathrm{hi}}) = \\left( v \\bmod 256, \\; \\left\\lfloor v / 256 \\right\\rfloor \\right) \\]","text":"<code>struct.pack('h', v)<\/code> প্রথমে ছোট অংশ b_lo বসায়, পরে বড় অংশ b_hi — native byte order; ORDER-এর স্লটেও একই ক্রম ([1] = lo, [2] = hi)। মাইক্রোকন্ট্রোলার খাম খুলে ঠিক এই সূত্রটা ঘুরিয়েই সংখ্যা ফিরে পায় — পাঠানো আর পড়া একই ভাষার দুই মুখ।"},{"label":"Level 3 — ছয় মান → বারো বাইট → এক চিঠি","latex":"\\[ 6 \\times 2 = 12 \\;\\text{data bytes} + 1\\;\\text{pad} = 13, \\qquad \\mathrm{LEN} = 13 + 3 = 16 = 0\\mathrm{x}10 \\]","text":"<code>len=13<\/code> মানে <code>__send<\/code> ORDER-এর স্লট [1]..[13] তুলে পাঠায়; Part 6 চিঠির মাথায় LEN লেখে <code>len + 0x03<\/code> — তাই 0x10, আর তারের ওপর কঙ্কাল দাঁড়ায় <code>FF FC 10 25<\/code>, মান-স্লট, checksum।"}],"numeric":[{"latex":"\\[ 2000 = 7 \\times 256 + 208 = 0x07D0 \\;\\Rightarrow\\; (b_{\\mathrm{lo}},\\, b_{\\mathrm{hi}}) = (0xD0,\\; 0x07) \\]","text":"s1–s4-এর ডিফল্ট 2000-এর ভাঁজ: 208 + 256·7 = 2000, বাইট-জোড়া <code>D0 07<\/code>; রাস্তার ওপারে unpack একই সূত্রে ঘুরিয়ে ঠিক 2000-ই ফেরায়।"},{"latex":"\\[ 3100 = 12 \\times 256 + 28 = 0x0C1C \\;\\Rightarrow\\; (b_{\\mathrm{lo}},\\, b_{\\mathrm{hi}}) = (0x1C,\\; 0x0C) \\]","text":"s6-এর ডিফল্ট 3100: 28 + 256·12 = 3100, বাইট-জোড়া <code>1C 0C<\/code>; আর s5-এর 1486 একই নিয়মে <code>CE 05<\/code> (5×256 + 206 = 1486)।"},{"latex":"\\[ 1600 \\leq 2400 \\leq 2400 \\;\\;(\\text{pass}), \\qquad 1500 < 1600 \\;\\;(\\text{fail}) \\]","text":"জানালা-পরীক্ষার দুই মুখ: 2400 কিনারায় দাঁড়িয়েও s1 পাস করে (chained comparison সীমানা-সমেত), কিন্তু 1500 প্রথম ধাপেই আটকায় — else-শাখায় গিয়ে terminal-এ ছাপা হয় <code>mid_value input error!<\/code>।"}],"mapping":[{"code":"value_s1 = bytearray(struct.pack('h', int(mid_value[0])))","math":"\\[ v \\mapsto (b_0, b_1), \\qquad v = b_0 + 256\\, b_1 \\]","text":"এই এক লাইনই সংখ্যা→বাইট রূপান্তরের পুরো সেতু: <code>int()<\/code> মানকে পূর্ণসংখ্যা করে, <code>'h'<\/code> তাকে দুই বাইটে ভাঁজে, <code>bytearray<\/code> ভাঁজটাকে সূচি-ধরা কাঁচায় বদলে দেয় — পরের লাইনগুলো শুধু [0]/[1] তুলে খামে বসায়।"},{"code":"1600 <= mid_value[0] <= 2400","math":"\\[ 1600 \\leq v_1 \\leq 2400 \\]","text":"Python-এর chained comparison আসলে দুই তুলনার সংক্ষিপ্ত রূপ — <code>1600 &lt;= v<\/code> এবং <code>v &lt;= 2400<\/code>; আর ছয়টা জানালা <code>and<\/code>-এ বাঁধা, তাই একটি ভাঙলেই পুরো শর্ত মিথ্যা হয়ে যায়।"}],"failure":["নিরাপত্তা-জানালাটা তুলে দিলে <code>mid_value<\/code>-র ভেতরের 4000-এর মতো একটা মান হুবহু তারে বসে যেত — সার্ভো নিজের যান্ত্রিক শেষ-সীমা পেরোনোর চেষ্টায় গিয়ারে অস্বাভাবিক চাপ নিত, দীর্ঘে স্ট্রেইন, দাঁত-কাটা গিয়ার, এমনকি জয়েন্ট ছিঁড়ে যাওয়া পর্যন্ত আসতে পারত।","<code>int()<\/code>-এর খোলসটা বাদ পড়লে float মান এলেই <code>struct.pack('h', ...)<\/code> <code>struct.error<\/code> ছুঁড়ে মারত — <code>\"required argument is not an integer\"<\/code> — আর পুরো কনফিগারেশন-স্ক্রিপ্ট সেই লাইনেই থেমে যেত, পরের কোনো সেটিং আর পৌঁছাত না।","অন্য কোনো প্ল্যাটফর্মে বাইটগুলো big-endian ধরে পড়লে <code>0xD0 0x07<\/code> জোড়া হয়ে যেত <code>0xD007<\/code> = 53255 — সার্ভোর জগতে এই 'অবস্থান'-এর কিছুই অর্থ নেই; আদেশ পৌঁছালেই হাত এলোমেলো এক ঝাঁকি মারত।","পতাকা-কারসাজি (line 240–242) না থাকলে প্রতিটি টর্ক-টগল <code>__data_changed<\/code>-কে True রেখে যেত, আর পরে <code>update_config_data()<\/code> ডাকা হলে সেই ক্ষণস্থায়ী অবস্থা flash-এ গেঁথে যেত — একবার টর্ক বন্ধ করা মানেই রিবুটের পরেও হাত ঝুলে থাকত।"]},"robot":{"correct":"এই কোড ঠিকমতো চললে ছয় সার্ভোর কেন্দ্র-অবস্থান কাঁচা এককে (raw unit) মাইক্রোকন্ট্রোলারের হাতে পৌঁছে যায় — সেভ করা হলে রোবট জাগার সঙ্গে সঙ্গে হাত ঠিক এই মাঝ-অবস্থানে ফিরে আসে; আর টর্কের চিঠি তাৎক্ষণিকভাবে কাজ করে (হাত শক্তি পায় বা হারায়) কিন্তু কোনো স্থায়ী দাগ রাখে না।","incorrect":"দুটো ভুল আশা এই কোডে ভেঙে পড়ে: mid-value গুলোকে ডিগ্রি ভাবা (2000° মানে কিছুই না — এগুলো raw গণনা), আর ধরে নেওয়া যে এখানে টর্ক বন্ধ করলে সেটা রিবুটের পরেও বন্ধ থাকবে — আসলে কিছুই সেভ হয়নি, পতাকা-ট্রিক ইচ্ছা করেই চিঠিটাকে সেভ-তালিকার বাইরে রেখেছে।"},"id":"part-11","start":201,"end":243,"lang":"python","animType":"midPack","flags":[]},{"n":12,"fname":"config_robot.py","enTitle":"Arm Zero-Offset & the robot Bug","explain":[{"a":244,"b":245,"text":"<b>শূন্য-বিন্দুর অনুষ্ঠান শুরু<\/b>: comment-টাই পুরো ভাবনাটা বলে দেয় — <code># Tell a specific servo to save its current physical position as its new \"Zero\"<\/code>; <code>def set_arm_calib_offset(self, arm_id):<\/code> নেয় একটাই যুক্তি: কোন servo। এই series-এর প্রথম analysis — folder 01-এর arm-calibration অ্যাপ — ঠিক এই কাজটাই ইন্টারঅ্যাক্টিভভাবে করত: হাত সরিয়ে-সরিয়ে মনমতো পোজ বসিয়ে 'এখনকার অবস্থাকেই শূন্য ধরো' বলা; এখানে সেই একই অনুষ্ঠান factory-tool রূপে — এক servo, এক কমান্ড। Part 11 এর আত্মীয়: ওখানে প্রতিটি servo-র <i>মাঝ-অবস্থার<\/i> (mid value) সংখ্যা পাঠানো হতো, এখানে সংখ্যা নেই — শুধু 'বর্তমান ভঙ্গিই নতুন শূন্য' নির্দেশ।"},{"a":246,"b":247,"text":"<b>নিঃশব্দ রক্ষী<\/b>: <code>if arm_id &lt; 1 or arm_id &gt; 6:<\/code> — ১ থেকে ৬-এর বাইরের যেকোনো আইডি ধরা পড়ে <code>return<\/code>-এ, আর ফাংশন <code>None<\/code> ফেরত দেয়। <b>লক্ষ করো<\/b> — এই return একেবারে নিঃশব্দ: কোনো error-ছাপ নেই, কোনো বার্তা নেই; অথচ একই file-এর mid-value ফাংশন (Part 11) ভুল ইনপুটে অন্তত <code>mid_value input error!<\/code> ছেপে জানিয়ে দিত। ডাকের দিকের জন্য এই নীরবতা একটা ফাঁদ — ভুল আইডি দিলে কমান্ড রওনা-ই হয় না, জানার উপায়ও থাকে না। তবে নিচের সারি-লুপ (line 273-274) সবসময় <code>i+1<\/code> অর্থাৎ ১..৬ পাঠায় বলে ওই পথে রক্ষীটা কখনোই লাগে না।"},{"a":248,"b":249,"text":"<b>খামে আইডি ভরা<\/b>: <code>ORDER[\"ARM_OFFSET\"][1] = int(arm_id) &amp; 0xFF<\/code> — file-এর শুরুর ORDER টেবিলের <code>ARM_OFFSET<\/code> ঘরের প্রথম data-byte-এ servo-র আইডি বসে; <code>&amp; 0xFF<\/code> হলো এক-বাইট মাস্ক — মানটা ০..২৫৫-এর মধ্যে জোর করে আটকে দেওয়া। উপরের রক্ষী এমনিতেই ১..৬ ছাড়া কিছু ঢুকতে দেয় না, তাই মাস্কটা এখানে বাড়তি নিরাপত্তা-বেল্ট — ক্ষতি নেই, খাম কখনো এক byte-এর বেশি দাবি করবে না। পরের লাইনে <code>ORDER[\"ARM_OFFSET\"][2] = 0<\/code> — ফ্রেমটা দুটি data-byte চায় (line 258-এ <code>len=2<\/code>), তাই দ্বিতীয় ঘর শূন্য রেখে প্যাড; আসল কথা পুরোটা প্রথম byte-এ।"},{"a":251,"b":254,"text":"<b>উত্তরের জন্য টেবিল পরিষ্কার<\/b>: <code># Clear inbox<\/code> — সাফ-সুতরো হচ্ছে দুই স্তরে। প্রথমে <code>for i in range(self.__RX_BUF_LEN_MAX): self.__rx_DATA[i] = 0<\/code> — নিজের ৪০-ঘরের inbox-array-টার (<code>__RX_BUF_LEN_MAX<\/code> = 40) প্রতিটি byte শূন্য; তারপর <code>self.__ser.flushInput()<\/code> — serial driver-এর ভেতরে জমে থাকা কাঁচা byte-গুলো ফেলে দেওয়া। দুইবার কেন? কারণ বাসি ডেটা দুই জায়গায় লুকোতে পারে — আমাদের array-তে আর OS-এর নলে। Part 7-এর মতোই একই স্বাস্থ্যবিধি: একটু পরে যে উত্তর পড়ব সেটা যেন এই কমান্ডেরই উত্তর হয়, আগের কোনো কথকতার অবশিষ্টাংশ নয়।"},{"a":256,"b":259,"text":"<b>পাঠানো, কিন্তু খাতা নষ্ট না করে<\/b>: <code># Send the command<\/code> — এখানে Part 11-এর সেই পরিচিত কৌশল আবার: <code>temp = self.__data_changed<\/code> পতাকা তুলে রাখা, <code>self.__send(\"ARM_OFFSET\", len=2)<\/code> খাম পাঠানো, তারপর <code>self.__data_changed = temp<\/code> ফিরিয়ে বসানো। কারণ <code>__send<\/code>-এর ভেতরে লুকানো — প্রতিটি পাঠানো খামে সে নিঃশর্ত <code>__data_changed = True<\/code> করে দেয়, অথচ পতাকাটার মানে 'config বদলেছে, <code>update_config_data<\/code>-এ সেভ করার দরকার'। Zero-calibration আদেশ নিজে নিজেই কাজ সামলায় বলে তাকে 'অসেভ পরিবর্তন'-এর খাতায় লিখে রাখা চলবে না — save/restore জুটি ঠিক সেই ভুল হিসাবটাই বাতিল করে দেয়।"},{"a":261,"b":264,"text":"<b>উত্তরের প্রতীক্ষা শুরু<\/b>: comment-টা চুক্তিটা ঘোষণা করে — <code># Wait for the microcontroller to reply saying \"Success!\" or \"Failed!\"<\/code>; অর্থাৎ এই চিঠি একতরফা নয়, controller উত্তর দেবে। <code>state = -1<\/code> দিয়ে শুরু — 'কোনো গ্রহণযোগ্য উত্তর এখনো নেই'-ই ডিফল্ট অবস্থা। তারপর <code>for k in range(6):<\/code> আর <code>time.sleep(.5)<\/code> — সর্বোচ্চ ৬টি টিক, প্রতিটি আধা সেকেন্ড, মোট ৩.০ সেকেন্ডের অপেক্ষা-জানালা। <b>মন দিয়ে দেখো<\/b> — sleep টিকের <i>শুরুতে<\/i>, তাই প্রথম পরীক্ষাও ০.৫ সেকেন্ড পরে হয়; উত্তর তার আগে এলেও কোড তা জানতে পারে না, প্রথম টিক পর্যন্ত অন্তত অপেক্ষা করতেই হয়।"},{"a":265,"b":269,"text":"<b>উত্তর যাচাই, তারপর ফেরত<\/b>: প্রতিটি টিকে <code>if self.__unpack():<\/code> — inbox-এ গোটা একটা ঠিক ফ্রেম পাওয়া গেলে তা ভেঙে <code>__rx_DATA<\/code>-তে বসে (Parts 8-9-এর unpack)। এরপর ভেতরের পরীক্ষা: <code>if self.__rx_DATA[0] == arm_id:<\/code> — উত্তরের প্রথম payload-byte প্রতিধ্বনি হিসেবে বলে কোন servo-র কথা; মিললে <code>state = self.__rx_DATA[1]<\/code> — দ্বিতীয় byte-টাই ফলাফল — আর সঙ্গে সঙ্গে <code>return state<\/code>। মন্তব্য অনুযায়ী পড়া যায়: ১ মানে \"Success!\", ০ মানে \"Failed!\"। ভিন্ন servo-র আইডি-নিয়ে আসা উত্তর চুপচাপ উপেক্ষা হয়ে লুপ অপেক্ষা করতেই থাকে — প্রতিরক্ষামূলক ব্যবস্থা, কিন্তু প্রতিটি বাতিল উত্তর একটা করে টিক পুড়িয়ে নেয়। আর ৬টি টিকেও গ্রহণযোগ্য উত্তর না এলে লুপ ফুরিয়ে line
