<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05. linear velocity calibration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#0a0a0a; --bg2:#111111;
  --card:#151515; --card2:#181818; --card3:#1d1d1d;
  --border:#262626; --border2:#303030; --border3:#3a3a3a;
  --text:#e8e8e8; --muted:#a0a0a0; --faint:#6e6e6e;
  --ex:#4fc3f7; --ex-dim:rgba(79,195,247,.09);
  --math:#7ee787; --math-dim:rgba(126,231,135,.08);
  --rb:#ffb454; --rb-dim:rgba(255,180,84,.08);
  --anim:#d2a8ff; --anim-dim:rgba(210,168,255,.08);
  --code-bg:#0d1117; --code-head:#161b22;
  --gutter-txt:#3d4f63; --gutter-line:#1c2530;
  --ok:#3fb950; --bad:#f85149;
  --ff-title:'Space Grotesk','Inter','Hind Siliguri',sans-serif;
  --ff-ui:'Inter','Hind Siliguri',system-ui,-apple-system,sans-serif;
  --ff-bn:'Hind Siliguri','Inter',sans-serif;
  --ff-mono:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --sb-w:292px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--ff-ui); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(79,195,247,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a}
a{color:var(--ex);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ex);outline-offset:2px;border-radius:4px}
button{font-family:var(--ff-ui)}

/* ============ APP LAYOUT ============ */
#app{display:flex;min-height:100vh}
#main{
  margin-left:var(--sb-w);
  flex:1;
  min-width:0;
  padding:52px 56px 80px;
  max-width:1180px;
}
.intro-banner{
  margin-bottom:48px;padding:30px 34px;
  background:linear-gradient(145deg,#141414,#101010);
  border:1px solid var(--border);border-radius:16px;
  position:relative;overflow:hidden;
}
.intro-banner::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(600px 180px at 12% 0%,rgba(79,195,247,.07),transparent 60%),
    radial-gradient(500px 160px at 88% 100%,rgba(210,168,255,.05),transparent 60%);
  pointer-events:none;
}
.intro-eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ex);margin-bottom:10px;
}
.intro-banner h1{
  font-family:var(--ff-title);font-size:clamp(26px,3.4vw,38px);
  font-weight:700;letter-spacing:-.01em;line-height:1.15;
}
.intro-banner h1 .path{color:var(--faint);font-weight:500}
.intro-desc{margin-top:12px;color:var(--muted);max-width:70ch;font-size:15px}
.intro-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stat-chip{
  font-family:var(--ff-mono);font-size:12px;color:#c9d1d9;
  background:#0d1117;border:1px solid var(--border2);
  padding:6px 12px;border-radius:999px;
}
.stat-chip b{color:var(--ex);font-weight:600}

/* ============ SIDEBAR ============ */
#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);
  background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;z-index:60;
  display:flex;flex-direction:column;
}
.sb-head{
  padding:26px 22px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg2);z-index:2;
}
.sb-folder{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;
  color:var(--text);letter-spacing:-.01em;line-height:1.3;
}
.sb-meta{
  margin-top:6px;font-family:var(--ff-mono);font-size:11.5px;
  color:var(--faint);letter-spacing:.08em;
}
#sb-nav{padding:14px 12px 30px;flex:1}
.sb-item{
  display:flex;align-items:baseline;gap:11px;
  padding:8px 12px;margin:1px 0;border-radius:8px;
  color:#9a9a9a;border-left:2px solid transparent;
  transition:background .18s,color .18s;
}
.sb-item .sb-num{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  min-width:20px;font-weight:500;
}
.sb-item .sb-name{
  font-size:13.2px;font-weight:500;line-height:1.35;
  font-family:var(--ff-ui);
}
.sb-item:hover{background:#181818;color:#d6d6d6;text-decoration:none}
.sb-item.active{
  background:linear-gradient(90deg,rgba(79,195,247,.10),rgba(79,195,247,.02));
  color:#eaf6fe;border-left:2px solid var(--ex);
}
.sb-item.active .sb-num{color:var(--ex)}
.sb-filesep{
  font-family:var(--ff-mono);font-size:10px;letter-spacing:.16em;
  color:#525252;text-transform:uppercase;
  padding:14px 12px 6px;margin-top:4px;
}
#menu-btn{
  display:none;position:fixed;top:14px;left:14px;z-index:80;
  width:42px;height:42px;border-radius:10px;
  background:#181818;border:1px solid var(--border2);color:var(--text);
  font-size:15px;cursor:pointer;line-height:1;
  align-items:center;justify-content:center;padding:0;
}
#sb-overlay{display:none}

/* ============ PART SECTION ============ */
.part{margin-bottom:88px;scroll-margin-top:24px}
.part-head{margin-bottom:22px}
.eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ex);margin-bottom:8px;
}
.part-title{
  font-family:var(--ff-title);font-size:clamp(23px,2.6vw,31px);
  font-weight:700;letter-spacing:-.015em;line-height:1.18;
  margin-bottom:12px;
}
.part-meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-family:var(--ff-mono);font-size:12px;color:var(--muted);
}
.meta-chip{
  background:#101418;border:1px solid var(--border2);
  padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.meta-chip.flag{color:#d8c97a;border-color:#3a3524;background:#17150d}
.meta-chip.lang{color:#8ab4f8}

/* ============ CODE CARD ============ */
.code-card{
  background:var(--code-bg);border:1px solid var(--border2);
  border-radius:13px;overflow:hidden;margin-bottom:30px;
  box-shadow:0 14px 40px rgba(0,0,0,.42);
}
.code-card-head{
  display:flex;align-items:center;gap:14px;
  background:var(--code-head);border-bottom:1px solid #20262e;
  padding:10px 16px;
}
.dots{display:flex;gap:7px;align-items:center}
.dots i{
  width:11px;height:11px;border-radius:50%;display:block;
}
.dots i:nth-child(1){background:#ff5f57}
.dots i:nth-child(2){background:#febc2e}
.dots i:nth-child(3){background:#28c840}
.code-fname{
  font-family:var(--ff-mono);font-size:12.5px;color:#9aa7b4;
  letter-spacing:.02em;
}
.code-lines-chip{
  font-family:var(--ff-mono);font-size:11px;color:#5b6875;
  margin-left:auto;white-space:nowrap;
}
.copy-btn{
  font-family:var(--ff-mono);font-size:11px;letter-spacing:.06em;
  color:#9aa7b4;background:#1c2128;border:1px solid #2d333b;
  border-radius:6px;padding:4px 11px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.copy-btn:hover{color:#e6edf3;border-color:#444c56}
.copy-btn.done{color:var(--ok);border-color:rgba(63,185,80,.4)}
.code-scroll{overflow-x:auto;max-height:640px;overflow-y:auto}
pre.code{display:inline-block;min-width:100%;padding:14px 0;font-family:var(--ff-mono)}
.cl{display:flex;white-space:pre;font-size:13.2px;line-height:1.62}
.cln{
  position:sticky;left:0;flex:0 0 auto;z-index:2;
  min-width:52px;text-align:right;padding-right:16px;
  color:var(--gutter-txt);background:var(--code-bg);
  border-right:1px solid var(--gutter-line);
  user-select:none;-webkit-user-select:none;font-size:11.5px;
  line-height:1.85;letter-spacing:.02em;
}
.cl.target .cln{
  background:#101722;color:#7ba3c9;border-right-color:#234;
}
.clc{flex:0 0 auto;padding-right:24px;tab-size:8;color:#e6edf3}
.tok-kw{color:#ff7b72}
.tok-str{color:#a5d6ff}
.tok-com{color:#8b949e;font-style:italic}
.tok-num{color:#79c0ff}
.tok-fn{color:#d2a8ff}
.tok-blt{color:#ffa657}

/* ============ SECTIONS ============ */
.sec{
  border:1px solid var(--border);border-radius:13px;
  background:var(--card);margin-bottom:26px;overflow:hidden;
}
.sec-head{
  display:flex;align-items:center;gap:12px;
  padding:15px 22px;border-bottom:1px solid var(--border);
  background:var(--card2);
}
.badge{
  font-family:var(--ff-mono);font-weight:700;font-size:12px;
  min-width:34px;height:26px;border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;
  letter-spacing:.03em;flex:0 0 auto;
}
.badge-ex{background:var(--ex-dim);color:var(--ex);border:1px solid rgba(79,195,247,.35)}
.badge-math{background:var(--math-dim);color:var(--math);border:1px solid rgba(126,231,135,.35)}
.badge-rb{background:var(--rb-dim);color:var(--rb);border:1px solid rgba(255,180,84,.35)}
.badge-anim{background:var(--anim-dim);color:var(--anim);border:1px solid rgba(210,168,255,.35)}
.sec-head h3{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;letter-spacing:-.01em;
}
.sec-head h3 .bn-inline{font-family:var(--ff-bn)}
.sec-body{padding:20px 22px 24px}

/* ============ EXPLAIN ENTRIES ============ */
.ex-entry{margin-bottom:26px}
.ex-entry:last-child{margin-bottom:6px}
.ex-snippet{
  background:#0d1117;border:1px solid var(--border2);border-left:3px solid var(--ex);
  border-radius:9px;overflow:hidden;
}
.ex-snippet pre{
  padding:10px 16px;font-family:var(--ff-mono);font-size:12.8px;
  line-height:1.62;color:#dbe4ee;overflow-x:auto;white-space:pre;
}
.ex-lines{
  display:inline-block;font-family:var(--ff-mono);font-size:10.5px;
  color:var(--ex);background:var(--ex-dim);border:1px solid rgba(79,195,247,.3);
  border-radius:5px;padding:1px 8px;margin-bottom:7px;letter-spacing:.06em;
}
.ex-arrow{
  color:#3a471f;font-family:var(--ff-mono);font-size:15px;color:var(--faint);
  padding:3px 2px 3px 12px;
}
.ex-text{
  font-family:var(--ff-bn);font-size:16px;line-height:1.95;color:#d5d5d5;
  padding:2px 4px 0 14px;border-left:2px solid #232d36;
}
.ex-text code, .bn code, .ml-text code, .map-text code, .rb-card code, .anim-caption code{
  font-family:var(--ff-mono);font-size:.86em;color:#9ecbff;
  background:rgba(110,168,254,.10);border:1px solid rgba(110,168,254,.16);
  border-radius:5px;padding:1px 6px;white-space:nowrap;
}
.ex-text ul, .ml-text ul, .rb-card ul, .anim-caption ul{
  margin:8px 0 4px 4px;padding-left:22px;
}
.ex-text li, .ml-text li, .rb-card li{margin:5px 0}

/* ============ MATH SECTION ============ */
.math-intro{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
  padding-bottom:16px;border-bottom:1px dashed var(--border2);margin-bottom:20px;
}
.math-level{
  background:var(--card2);border:1px solid var(--border2);border-radius:11px;
  padding:16px 20px;margin-bottom:14px;
}
.ml-label{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--math);margin-bottom:10px;
}
.mathy{
  font-size:17px;color:#e3ffe6;margin:8px 0 12px;
  padding:12px 16px;background:rgba(126,231,135,.05);
  border:1px solid rgba(126,231,135,.16);border-radius:9px;
  overflow-x:auto;min-height:24px;
}
.ml-text{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
}
.math-subhead{
  font-family:var(--ff-title);font-size:14.5px;font-weight:600;color:#bfe8c4;
  margin:26px 0 12px;letter-spacing:.01em;
}
.map-row{
  display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(180px,1fr) minmax(220px,1.4fr);
  gap:12px;align-items:start;
  background:var(--card2);border:1px solid var(--border2);border-radius:10px;
  padding:12px 16px;margin-bottom:10px;
}
.map-code code{
  font-family:var(--ff-mono);font-size:12.5px;color:#9ecbff;background:#0d1117;
  border:1px solid var(--border2);border-radius:6px;padding:3px 8px;display:inline-block;
}
.map-math{color:#c9f7cf;font-family:var(--ff-mono);font-size:13.5px;padding-top:2px}
.map-text{font-family:var(--ff-bn);font-size:14.5px;line-height:1.8;color:#bcbcbc}
.failure-list li{
  font-family:var(--ff-bn);font-size:15px;line-height:1.85;color:#d9c9c9;
  margin:8px 0;padding-left:6px;list-style:none;position:relative;padding-left:22px;
}
.failure-list li::before{
  content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;
  border-radius:2px;background:rgba(248,81,73,.5);border:1px solid rgba(248,81,73,.65);
}
.failure-list{padding:0}

/* ============ ROBOT SECTION ============ */
.rb-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rb-card{
  border-radius:11px;padding:16px 18px;border:1px solid var(--border2);
  font-family:var(--ff-bn);font-size:15.3px;line-height:1.9;
}
.rb-card h4{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:10px;font-weight:600;
}
.rb-ok{background:rgba(63,185,80,.05);border-color:rgba(63,185,80,.28)}
.rb-ok h4{color:var(--ok)}
.rb-bad{background:rgba(248,81,73,.05);border-color:rgba(248,81,73,.28)}
.rb-bad h4{color:var(--bad)}

/* ============ ANIMATION SECTION ============ */
.anim-stage{
  background:
    radial-gradient(500px 200px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  border-bottom:1px solid var(--border2);
  padding:10px;position:relative;
}
.anim-stage svg{width:100%;height:auto;display:block}
.anim-controls{
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--border);background:var(--card2);
}
.ac-btn{
  font-family:var(--ff-mono);font-size:12px;letter-spacing:.08em;
  color:#c9c9c9;background:#202020;border:1px solid var(--border3);
  border-radius:8px;padding:7px 18px;cursor:pointer;transition:all .15s;
}
.ac-btn:hover{background:#2a2a2a;color:#fff;border-color:#4a4a4a}
.ac-btn.active{background:rgba(210,168,255,.14);color:var(--anim);border-color:rgba(210,168,255,.45)}
.anim-caption{
  font-family:var(--ff-bn);font-size:15px;line-height:1.8;color:#d0c4dd;
  padding:13px 22px;border-bottom:1px solid var(--border);min-height:52px;
  background:rgba(210,168,255,.03);
}
.anim-formula{
  font-family:var(--ff-mono);font-size:14px;color:#e6d9f5;
  padding:12px 22px;background:#0d1117;min-height:46px;
  overflow-x:auto;white-space:nowrap;letter-spacing:.01em;
}
.anim-formula .fx-hl{color:var(--anim)}
.anim-formula .fx-ok{color:var(--math)}
.anim-formula .fx-warn{color:var(--rb)}
.anim-state{
  margin-left:auto;font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.1em;
}

/* ============ PART NAV ============ */
.part-nav{display:flex;justify-content:space-between;gap:14px;margin-top:34px}
.pn-btn{
  flex:1;max-width:340px;display:block;
  border:1px solid var(--border2);border-radius:11px;
  padding:13px 18px;color:#c9c9c9;transition:all .16s;
  background:var(--card);
}
.pn-btn:hover{border-color:rgba(79,195,247,.4);color:#fff;text-decoration:none;background:#181818}
.pn-btn .pn-dir{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.14em;display:block;margin-bottom:3px;
}
.pn-btn .pn-title{font-size:13.5px;font-weight:600}
.pn-btn.next{text-align:right}
.pn-btn.disabled{opacity:.28;pointer-events:none}

/* ============ FOOTER ============ */
.site-footer{
  margin-left:var(--sb-w);border-top:1px solid var(--border);
  padding:26px 56px;color:var(--faint);font-size:13px;
  font-family:var(--ff-mono);letter-spacing:.02em;
}

/* ============ MATHJAX FALLBACK ============ */
body.no-mathjax .mathy{
  font-family:var(--ff-mono);font-size:13.5px;color:#c9f0cd;white-space:pre;
}

/* ============ RESPONSIVE ============ */
@media (max-width:1240px){
  #main{padding:44px 34px 70px}
  .site-footer{padding:24px 34px}
}
@media (max-width:960px){
  #menu-btn{display:block}
  #sidebar{
    transform:translateX(-100%);transition:transform .26s ease;
    box-shadow:24px 0 60px rgba(0,0,0,.5);
  }
  body.sb-open #sidebar{transform:translateX(0)}
  body.sb-open #sb-overlay{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;
  }
  #main{margin-left:0;padding:74px 20px 60px}
  .site-footer{margin-left:0;padding:22px 20px}
  .rb-grid{grid-template-columns:1fr}
  .map-row{grid-template-columns:1fr;gap:6px}
  .intro-banner{padding:22px 20px}
}
@media (max-width:560px){
  body{font-size:15px}
  .ex-text{font-size:15.3px}
  .cl{font-size:12.3px}
  .anim-formula{font-size:12.5px}
  .code-lines-chip{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}
</style>


<style id="refine-style">
/* ==================================================================
   SURGICAL REFINEMENT LAYER v2 — appended (UI-UX & animation refinement)
   Does not override any existing rule except where explicitly noted;
   all original bytes above this block are untouched.

   INTENTIONAL LAYER ARCHITECTURE (documented z-index scale)
   ---------------------------------------------------------
     --z-ground  0   page ground, card backgrounds
     --z-scene  10   base SVG scene inside .anim-stage / .exec-robot
     --z-objects 20  moving SVG marks (updated in place by the engine)
     --z-labels 30   SVG text labels — halo-stroked so they can never
                     become unreadable under moving objects
     --z-panel  40   overlay panels (formula bar, debug chips)
     --z-head   50   section headers, captions
     --z-debug  60   live debug readouts
     --z-ctrl   70   control bars (always clickable, never covered)
     --z-nav    80   sidebar / menu
     --z-focus  90   focus outlines (never overlapped)
   HTML layers take these values; inside a single <svg> stacking is by
   paint order, and readability of labels is guaranteed by the
   paint-order halo rule below rather than by z-index.
   ================================================================== */
:root{
  --z-ground:0; --z-scene:10; --z-objects:20; --z-labels:30;
  --z-panel:40; --z-head:50; --z-debug:60; --z-ctrl:70; --z-nav:80; --z-focus:90;
}

/* ---- Fix: full-width application shell (#56-57).
        #main keeps its sidebar margin but drops the narrow max-width;
        prose blocks below keep a readable measure so lines never run
        wall-to-wall — only layout containers use the full width. ---- */
#main{max-width:none}
.intro-desc{max-width:none}          /* hero paragraph: full hero width */
.ex-text, .ml-text, .math-intro, .map-text, .rb-card, .exec-note,
.anim-caption{
  max-width:105ch;
}
@media (min-width:1800px){
  #main{padding-left:88px; padding-right:88px}
}

/* ---- Fix: SVG text labels stay readable over moving objects.
        Halo = stage-ground-coloured stroke painted UNDER the fill. ---- */
.anim-stage svg text,
.exec-robot svg text{
  paint-order:stroke; stroke:#0b0e13; stroke-width:3px;
  stroke-linejoin:round; stroke-linecap:round;
  pointer-events:none; user-select:none;
}
.anim-stage, .exec-robot{position:relative; z-index:var(--z-scene)}
.anim-controls{position:relative; z-index:var(--z-ctrl)}
.anim-caption{position:relative; z-index:var(--z-head)}
.anim-formula{position:relative; z-index:var(--z-panel)}
.anim-state{z-index:var(--z-debug)}

/* ---- Fix: icon control buttons (professional inline SVG, no text) ---- */
.anim-controls{gap:8px}
.ac-btn.ic{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:32px; padding:0; border-radius:8px;
}
.ac-btn.ic svg{width:16px; height:16px; display:block; fill:currentColor}
.ac-btn.ic svg *{vector-effect:non-scaling-stroke}
.ac-btn:focus-visible{
  outline:2px solid var(--anim); outline-offset:2px; z-index:var(--z-focus);
}
.ac-btn.ic[disabled]{opacity:.35; cursor:not-allowed}
.anim-controls .ac-sep{
  width:1px; height:20px; background:var(--border3); margin:0 3px; flex:0 0 auto;
}
.anim-controls .ac-step{
  font-family:var(--ff-mono); font-size:11px; color:var(--anim);
  letter-spacing:.08em; padding:6px 10px; border:1px solid rgba(210,168,255,.28);
  border-radius:7px; background:var(--anim-dim); white-space:nowrap;
}

/* ---- Complete Execution — Code → Debug → Robot (v2 row layout) ----
   Row 1: COMPLETE SOURCE CODE | LIVE DEBUG   (the two walk together)
   Row 2: ROBOT / SYSTEM STATE (full width)
   Then:  complete banner → formula → explanation → controls      */
.exec-sec{margin-top:56px}
.exec-sec .sec-head .exec-sub{
  font-family:var(--ff-mono); font-size:11px; color:var(--faint);
  letter-spacing:.06em; margin-left:auto; padding-right:18px; white-space:nowrap;
}
.exec-note{
  font-family:var(--ff-bn); font-size:14.5px; line-height:1.8; color:var(--muted);
  padding:14px 22px; border-bottom:1px solid var(--border); background:var(--card);
}
.exec-note code{
  font-family:var(--ff-mono); font-size:.86em; color:#9ecbff;
  background:rgba(110,168,254,.10); border:1px solid rgba(110,168,254,.16);
  border-radius:5px; padding:1px 6px;
}
.exec-frame{
  display:grid; gap:14px; padding:16px 18px;
  grid-template-columns:minmax(0,1.42fr) minmax(330px,.72fr);
}
.exec-col{min-width:0; display:flex; flex-direction:column; gap:14px}
.exec-col>.exec-panel{flex:1}
/* robot/system row spans the full frame width, below code+debug */
.exec-col.rob-col{grid-column:1 / -1}
.exec-panel{
  background:var(--code-bg); border:1px solid var(--border2); border-radius:12px;
  overflow:hidden; display:flex; flex-direction:column; min-height:0;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}
/* scroll affordance: right-edge fade says "more code this way" without
   covering anything interactive (head stays above it via z-index) */
.exec-col.code-col .exec-panel{position:relative}
.exec-col.code-col .exec-panel::after{
  content:""; position:absolute; top:0; right:0; bottom:0; width:26px;
  z-index:1; pointer-events:none;
  background:linear-gradient(90deg, rgba(13,17,23,0), #0d1117 92%);
}
.exec-panel-head{
  position:relative; z-index:2;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--code-head); border-bottom:1px solid #20262e; padding:9px 14px;
}
.exec-panel-head .ep-title{
  font-family:var(--ff-title); font-size:13px; font-weight:600; color:#c9d1d9;
  letter-spacing:.01em;
}
.exec-panel-head .ep-chip{
  font-family:var(--ff-mono); font-size:10px; letter-spacing:.05em;
  border-radius:999px; padding:2.5px 9px; white-space:nowrap;
}
.ep-chip.live{color:var(--anim); background:var(--anim-dim); border:1px solid rgba(210,168,255,.3)}
.ep-chip.concept{color:var(--rb); background:var(--rb-dim); border:1px solid rgba(255,180,84,.3)}
.ep-chip.src{color:var(--ex); background:var(--ex-dim); border:1px solid rgba(79,195,247,.3)}
/* kind legend in the code panel head: exec / structural / event */
.exec-legend{
  margin-left:auto; display:inline-flex; align-items:center; gap:5px;
  font-family:var(--ff-mono); font-size:9.5px; color:var(--faint); white-space:nowrap;
}
.exec-legend .lg{
  width:9px; height:9px; border-radius:3px; display:inline-block;
  margin-left:6px;
}
.exec-legend .lg-exec{background:#d2a8ff}
.exec-legend .lg-struct{background:#ffb454}
.exec-legend .lg-event{background:#4fc3f7}
.exec-code{
  position:relative; overflow:auto; flex:1; min-height:0;
  max-height:620px; margin:0; padding:10px 0 28px;
  font-family:var(--ff-mono); font-size:12.3px; line-height:1.6; color:#dbe4ee;
  background:var(--code-bg); tab-size:4;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.exec-code .exl{
  display:block; white-space:pre; min-height:1.6em;
  padding:0 12px 0 0; border-left:3px solid transparent;
  transition:background .2s, border-color .2s;
}
/* line-number gutter stays pinned when long lines scroll horizontally */
.exec-code .eln{
  position:sticky; left:0;
  display:inline-block; width:3.6em; padding-right:10px;
  text-align:right; color:#3d4f63; user-select:none;
  background:var(--code-bg);
}
/* current line, by kind: exec = purple (default), structural = amber,
   event = cyan; grouped companion lines get the tint without the edge */
.exec-code .exl.cur{
  background:rgba(210,168,255,.14); border-left-color:var(--anim);
}
.exec-code .exl.cur .eln{color:var(--anim); background:#241d38}
.exec-code .exl.cur-struct{
  background:rgba(255,180,84,.13); border-left-color:var(--rb);
}
.exec-code .exl.cur-struct .eln{color:var(--rb); background:#2e2416}
.exec-code .exl.cur-event{
  background:rgba(79,195,247,.14); border-left-color:var(--ex);
}
.exec-code .exl.cur-event .eln{color:var(--ex); background:#12283a}
.exec-code .exl.cur-g{background:rgba(210,168,255,.06)}
.exec-code .exl.cur-g.cur-struct{background:rgba(255,180,84,.07)}
.exec-code .exl.cur-g.cur-event{background:rgba(79,195,247,.07)}
/* ---- BEFORE → OPERATION → AFTER debug (#52) ---- */
.exec-op{
  margin:10px 12px 0; padding:8px 12px; border-radius:9px;
  border:1px solid rgba(126,231,135,.32); background:rgba(126,231,135,.07);
  font-family:var(--ff-mono); font-size:11.8px; line-height:1.65; color:#7ee787;
  overflow-wrap:anywhere;
}
.exec-op::before{
  content:"OPERATION";
  display:block; font-size:9px; letter-spacing:.14em; color:#58a65f;
  margin-bottom:3px;
}
.exec-dbg-body{
  padding:10px 14px 14px; overflow:auto; max-height:620px; flex:1; min-height:0;
  font-family:var(--ff-mono); font-size:12px;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.dbg-row{
  display:flex; align-items:baseline; gap:10px; padding:5.5px 8px;
  border-bottom:1px dashed #1c2530; animation:dbgIn .3s ease;
}
.dbg-row:last-child{border-bottom:none}
.dbg-k{color:var(--muted); white-space:nowrap; flex:0 0 auto}
.dbg-v{color:#9ecbff; text-align:right; flex:1; overflow-wrap:anywhere;
  padding-right:2px}
.dbg-v.n{color:#7ee787}
.dbg-v.err{color:var(--bad)}
/* value changed by this line: old (dim) → new (green) */
.dbg-row.chg .dbg-v{color:#7ee787}
.dbg-old{color:#6e7681; text-decoration:line-through;
  text-decoration-color:rgba(110,118,129,.6)}
.dbg-arrow{color:#7ee787; font-weight:600}
.dbg-ill{
  flex:0 0 auto; font-size:9.5px; letter-spacing:.05em; color:var(--rb);
  border:1px solid rgba(255,180,84,.35); border-radius:5px; padding:1px 5px;
}
.dbg-empty{color:var(--faint); font-family:var(--ff-bn); font-size:13px; padding:12px 8px}
@keyframes dbgIn{from{opacity:0; transform:translateX(-4px)}to{opacity:1}}
/* robot row: centered scene, taller than the old side column */
.exec-robot{
  background:
    radial-gradient(500px 220px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  padding:14px; overflow:auto;
  display:flex; justify-content:center;
}
.exec-robot svg{width:100%; max-width:720px; height:auto; max-height:560px;
  display:block; margin:0 auto}
.exec-rob-fade{animation:robFade .4s ease}
@keyframes robFade{from{opacity:0; transform:translateY(4px)}to{opacity:1}}
/* result zone: complete banner → formula row → explanation → controls */
.exec-complete{
  display:none; margin:0 18px 14px; padding:13px 18px; border-radius:11px;
  border:1px solid rgba(63,185,80,.4); background:rgba(63,185,80,.08);
  font-family:var(--ff-mono); font-size:12.5px; letter-spacing:.04em; color:#7ee787;
}
.exec-complete.show{display:block; animation:robFade .4s ease}
.exec-complete .bn{font-family:var(--ff-bn); font-size:14px; color:#c9d1d9;
  letter-spacing:0; margin-top:5px; line-height:1.75}
.exec-fx-row{margin:0 18px 14px; max-width:none}
.exec-sec .anim-caption{margin:0 18px 4px}
.exec-sec .anim-controls{margin:0 18px 18px}
.exec-progress{
  height:3px; margin:0 18px 22px; border-radius:2px; overflow:hidden;
  background:rgba(255,255,255,.06);
}
.exec-progress i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--anim),#7ee787);
  transition:width .3s ease;
}

/* responsive: code+debug share row 1 until 960px, robot row always full
   width; below 960px everything stacks vertically (#59 mobile order) */
@media (max-width:1240px){
  .exec-frame{grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr)}
  .exec-code{max-height:540px}
  .exec-dbg-body{max-height:540px}
}
@media (max-width:960px){
  .exec-frame{grid-template-columns:minmax(0,1fr); padding:12px}
  .exec-code{max-height:430px}
  .exec-dbg-body{max-height:300px}
  .exec-robot svg{max-height:440px}
  .exec-legend{display:none}
}
@media (max-width:560px){
  .exec-sec .sec-head .exec-sub{display:none}
  .exec-frame{padding:10px}
  .anim-controls{padding:11px 14px}
}
@media (prefers-reduced-motion:reduce){
  .exec-rob-fade, .dbg-row{animation:none}
  .exec-code .exl{transition:none}
  .exec-progress i{transition:none}
}

</style>

const FILEDATA = {"calibrate_linear.launch.py":["# --- IMPORTING ROS 2 LAUNCH TOOLS ---","import os","from launch import LaunchDescription","from launch_ros.actions import Node","from launch.actions import IncludeLaunchDescription","from ament_index_python.packages import get_package_share_directory","from launch.launch_description_sources import PythonLaunchDescriptionSource","","def generate_launch_description():","    ","    # --- PROGRAM 1: THE IMU FILTER ---","    # Find the path to the 'imu_filter_madgwick' package.","    imu_filter_madgwick_launch_file = os.path.join(","        get_package_share_directory('imu_filter_madgwick'),","        'launch',","        'imu_filter.launch.py'","    )","","    # --- PROGRAM 2: THE EXTENDED KALMAN FILTER (EKF) ---","    # Find the path to the 'ekf_bringup' package.","    ekf_odom_launch_file = os.path.join(","        get_package_share_directory('ekf_bringup'),","        'launch',","        'ekf.launch.py'","    )","    ","    # --- PROGRAM 3: THE LINEAR CALIBRATION NODE ---","    # Start a single Node directly instead of using a launch file.","    calibrate_linear = Node(","        package='calibration',               # Look in the 'calibration' package","        executable='calibrate_linear',       # Find the program named 'calibrate_linear'","        name='calibrate_linear',             # Give it this name in the ROS 2 network","        parameters=[","            # Tell the calibration tool what parts of the robot to measure.","            # 'base_frame' is the center of the robot (base_footprint).","            # 'odom_frame' is the starting point of the world (odom).","            {'base_frame': 'base_footprint'},","            {'odom_frame': 'odom'}","        ],","        output='screen'  # Print the output directly to our terminal screen so we can see the math results","    )","","    # --- THE FINAL LIST ---","    # Hand the list of programs back to ROS 2 to start them all at once.","    return LaunchDescription([","        ","        # 1. Start the IMU filter (/imu)","        # This cleans up the noisy, jittery data coming from the physical IMU chip ","        # so the robot doesn't think it's shaking when it's standing still.","        IncludeLaunchDescription(","            PythonLaunchDescriptionSource(imu_filter_madgwick_launch_file)","        ),","","        # 2. Start the EKF Localization (ekf，odom-base_rootpringt tf)","        # EKF stands for Extended Kalman Filter. This is the \"Math Brain\".","        # It takes the wheel data AND the IMU data and mixes them together to guess where the robot is.","        IncludeLaunchDescription(","            PythonLaunchDescriptionSource(ekf_odom_launch_file)","        ),","        ","        # 3. Start the linear calibration tool","        # This program tells the robot to drive forward exactly 1 meter.","        # It then measures how far the robot *actually* drove. If the robot only drove 0.9 meters, ","        # it calculates a \"correction factor\" to put in the robot's config files so it drives accurately next time!","        calibrate_linear,","","    ])"],"config_robot.py":["import serial   # The tool that lets Python talk over a USB/Serial wire","import struct   # Packs normal numbers into raw binary data (1s and 0s) the microcontroller can understand","import time     # Lets Python pause and wait","","# --- THE COMMAND DICTIONARY ---","# Think of this like a menu at a restaurant. ","# The first number (like 0x22) is the \"Item Number\" the microcontroller understands.","# The rest are empty slots waiting to be filled with data (like how many orders you want).","ORDER = {","    \"MOTOR_PID\": [0x13, 0, 0, 0, 0, 0, 0, 0],       # Address for Motor PID tuning","    \"IMU_YAW_PID\": [0x14, 0, 0, 0, 0, 0, 0, 0],    # Address for IMU turning PID tuning","    \"CAR_TYPE\": [0x15, 0],                          # Address to ask what kind of robot chassis this is","    \"ARM_TORQUE\": [0x22, 0],                        # Address to question so the chip has time to think","        self.__debug = debug     # If True, print all the raw 1s and 0s to the screen","        self.__data_changed = False # Keeps track of if we need to save changes","","        # Protocol \"Magic Numbers\" (The rules of the language)","        self.__HEAD = 0xFF       # Every message MUST start with 0xFF (Like ringing a doorbell)","        self.__DEVICE_ID = 0xFC # The ID of the microcontroller we are talking to","        self.__RETURN_ID = self.__DEVICE_ID - 1 # The ID the microcontroller uses when it replies back","        self.__COMPLEMENT = 257 - self.__DEVICE_ID # Math used for the checksum","        self.__READ_DATA = 0x50 # The code that means \"I want to read data\"","","        self.CAR_TYPE = 7       # What type of robot is this? (7 likely means Mecanum wheels)","","","    # --- SENDING DATA ---","    # This builds the \"envelope\" and mails it.","    def __send(self, key, len=1):","        self.__data_changed = True","        order = ORDER[key][0] # Grab the \"menu item number\" (e.g., 0x22 for ARM_TORQUE)","        value = []","        value_sum = self.__COMPLEMENT","        ","        # Pack up the data values we want to send","        for i in range(0, len):","            value.append(ORDER[key][1 + i])","            value_sum = value_sum + ORDER[key][1 + i]","            ","        # Calculate a Checksum. This is a math formula added to the end of the letter.","        # The microcontroller does the same math. If the numbers don't match, it means the wire glitched!","        sum_data = (self.__HEAD + self.__DEVICE_ID + (len + 0x03) + order + value_sum) % 256","        ","        # Build the final envelope: [Doorbell, Device ID, Length, Command, Data..., Checksum]","        tx = [self.__HEAD, self.__DEVICE_ID, (len + 0x03), order]","        tx.extend(value)","        tx.append(sum_data)","        ","        # Mail the letter! Write the binary data to the USB wire.","        self.__ser.write(tx)","        if self.__send_delay > 0:","            time.sleep(self.__send_delay)","        if self.__debug:","            print (\"Send: [0x\" + ', 0x'.join('{:02X}'.format(x) for x in tx) + \"]\")","","","    # --- REQUESTING DATA ---","    # This sends a letter saying \"Hey, please send me the data for address X\"","    def __request(self, addr, param=0):","        order = self.__READ_DATA","        buf_len = 5","        sum_data = (buf_len + order + addr + param) % 256","        tx = [self.__HEAD, self.__DEVICE_ID, buf_len, order, addr, param, sum_data]","        ","        # Clear out any old junk sitting in the wire","        self.__ser.flushInput()","        self.__ser.flushOutput()","        for i in range(self.__RX_BUF_LEN_MAX):","            self.__rx_DATA[i] = 0","        ","        # Send the request","        self.__ser.write(tx)","        if self.__debug:","            print (\"Read: [0x\" + ', 0x'.join('{:02X}'.format(x) for x in tx) + \"]\")","","","    # --- RECEIVING & PARSING DATA ---","    # This is the \"State Machine\". It reads bytes one by one and pieces the letter back together.","    def __unpack(self):","        n = self.__ser.inWaiting()","        rx_CHECK = 0","        if n <= 0:","            return False # Nothing in the inbox","        ","        data_array = self.__ser.read_all()","        if self.__debug:","            print (\"rx_data: [0x\" + ', 0x'.join('{:02X}'.format(x) for x in data_array) + \"]\")","            ","        for data in data_array:","            # Step 1: Look for the doorbell (0xFF)","            if self.__rx_FLAG == 0:","                if data == self.__HEAD:","                    self.__rx_FLAG = 1 # Found the start of a message!","                else:","                    self.__rx_FLAG = 0","","            # Step 2: Check if it's meant for us (0xFB)","            elif self.__rx_FLAG == 1:","                if data == self.__RETURN_ID:","                    self.__rx_FLAG = 2 # Yes, it's for me!","                else:","                    self.__rx_FLAG = 0","","            # Step 3: Read the Length of the message","            elif self.__rx_FLAG == 2:","                self.__rx_LEN = data","                self.__rx_FLAG = 3","","            # Step 4: Read the Address (What is this data about?)","            elif self.__rx_FLAG == 3:","                self.__rx_ADDR = data","                self.__rx_FLAG = 4","                self.__rx_COUNT = 0","","            # Step 5: Read the actual Data payload","            elif self.__rx_FLAG == 4:","                if self.__rx_COUNT < self.__rx_LEN - 3:","                    self.__rx_DATA[self.__rx_COUNT] = data","                    self.__rx_COUNT = self.__rx_COUNT + 1","                if self.__rx_COUNT >= (self.__rx_LEN - 3):","                    self.__rx_FLAG = 5","","            # Step 6: Check the Checksum to ensure no data was corrupted over the wire.","            elif self.__rx_FLAG == 5:","                for value in self.__rx_DATA:","                    rx_CHECK = rx_CHECK + value","                rx_CHECK = (self.__rx_LEN + self.__rx_ADDR + rx_CHECK) % 256","                if data == rx_CHECK:","                    # Yay! We successfully received a valid data packet!","                    self.__rx_FLAG = 0","                    self.__rx_COUNT = 0","                    return True","                else:","                    # Uh oh. Checksum failed. The wire must have glitched. Throw away the data.","                    if self.__debug:","                        print(\"check error:\", rx_CHECK, data)","                    self.__rx_FLAG = 0","                    self.__rx_COUNT = 0","                    self.__rx_ADDR = 0","                    self.__rx_LEN = 0","        return False","","","    # --- CONFIGURATION FUNCTIONS ---","    # (These are the \"User-Friendly\" buttons you press. They format the data and call __send() or __request())","","    # Reboot the microcontroller","    def reboot_device(self):","        ORDER[\"ROBOT_REBOOT\"][1] = 0x5F  # Secret reboot code","        ORDER[\"ROBOT_REBOOT\"][2] = 0x5F","        self.__send(\"ROBOT_REBOOT\", len=2)","        time.sleep(2)","    ","    # Wipe all custom settings back to factory defaults","    def reset_factory_config(self):","        ORDER[\"ROBOT_CONFIG\"][1] = 0","        ORDER[\"ROBOT_CONFIG\"][2] = 0x5F","        self.__send(\"ROBOT_CONFIG\", len=2)","        time.sleep(2)","","    # Save changes to the microcontroller's permanent memory","    def update_config_data(self):","        if self.__data_changed:","            ORDER[\"ROBOT_CONFIG\"][1] = 1","            ORDER[\"ROBOT_CONFIG\"][2] = 0x5F","            self.__send(\"ROBOT_CONFIG\", len=2)","            self.__data_changed = False","            time.sleep(2)","","","    # Set the middle position of the arm servos (raw servo units)","    def set_arm_mid_value(self, mid_value=[2000, 2000, 2000, 2000, 1486, 3100]):","        # Check if the values are within a safe range so we don't break the servos","        if 1600 <= mid_value[0] <= 2400 and 1600 <= mid_value[1] <= 2400 and 1600 <= mid_value[2] <= 2400 and \\","            1600 <= mid_value[3] <= 2400 and 1186 <= mid_value[4] <= 1786 and 2700 <= mid_value[5] <= 3500:","            ","            # struct.pack turns normal Python numbers into binary bytes the servo understands","            value_s1 = bytearray(struct.pack('h', int(mid_value[0])))","            value_s2 = bytearray(struct.pack('h', int(mid_value[1])))","            value_s3 = bytearray(struct.pack('h', int(mid_value[2])))","            value_s4 = bytearray(struct.pack('h', int(mid_value[3])))","            value_s5 = bytearray(struct.pack('h', int(mid_value[4])))","            value_s6 = bytearray(struct.pack('h', int(mid_value[5])))","","            # Pack all 6 values into our ORDER array to be sent","            ORDER[\"ARM_MID_VALUE\"][1] = value_s1[0]","            ORDER[\"ARM_MID_VALUE\"][2] = value_s1[1]","            ORDER[\"ARM_MID_VALUE\"][3] = value_s2[0]","            ORDER[\"ARM_MID_VALUE\"][4] = value_s2[1]","            ORDER[\"ARM_MID_VALUE\"][5] = value_s3[0]","            ORDER[\"ARM_MID_VALUE\"][6] = value_s3[1]","            ORDER[\"ARM_MID_VALUE\"][7] = value_s4[0]","            ORDER[\"ARM_MID_VALUE\"][8] = value_s4[1]","            ORDER[\"ARM_MID_VALUE\"][9] = value_s5[0]","            ORDER[\"ARM_MID_VALUE\"][10] = value_s5[1]","            ORDER[\"ARM_MID_VALUE\"][11] = value_s6[0]","            ORDER[\"ARM_MID_VALUE\"][12] = value_s6[1]","            ORDER[\"ARM_MID_VALUE\"][13] = 0","            self.__send(\"ARM_MID_VALUE\", len=13)","        else:","            print(\"mid_value input error!\")","","    # Turn arm motor power ON (1) or OFF (0)","    def set_arm_torque(self, enable):","        if enable > 0:","            on = 1","        else:","            on = 0","        ORDER[\"ARM_TORQUE\"][1] = on","        temp = self.__data_changed","        self.__send(\"ARM_TORQUE\", len=1)","        self.__data_changed = temp","    ","    # Tell a specific servo to save its current physical position as its new \"Zero\"","    def set_arm_calib_offset(self, arm_id):","        if arm_id < 1 or arm_id > 6:","            return","        ORDER[\"ARM_OFFSET\"][1] = int(arm_id) & 0xFF","        ORDER[\"ARM_OFFSET\"][2] = 0","        ","        # Clear inbox","        for i in range(self.__RX_BUF_LEN_MAX):","            self.__rx_DATA[i] = 0","        self.__ser.flushInput()","        ","        # Send the command","        temp = self.__data_changed","        self.__send(\"ARM_OFFSET\", len=2)","        self.__data_changed = temp","        ","        # Wait for the microcontroller to reply saying \"Success!\" or \"Failed!\"","        state = -1","        for k in range(6):","            time.sleep(.5)","            if self.__unpack():","                if self.__rx_DATA[0] == arm_id:","                    state = self.__rx_DATA[1]","                    return state","        return state","","    # Calibrate all 6 servos one by one","    def set_arm_calib_offset_all(self):","        for i in range(6):","            state = robot.set_arm_calib_offset(i+1)","            print(\"state:\", i+1, state)","            time.sleep(.5)","","    # Change the ROS 2 Walkie-Talkie Channel!","    def set_ros_domain_id(self, domain_id):","        if domain_id < 0 or domain_id > 101:","            return","        ORDER[\"DOMAIN_ID\"][1] = int(domain_id) & 0xFF","        ORDER[\"DOMAIN_ID\"][2] = 0","        self.__send(\"DOMAIN_ID\", len=2)","","    # Give the robot a name (Namespace) so you can run multiple robots in the same room","    def set_ros_namespace(self, ros_namespace):","        name_len = len(ros_namespace)","        if name_len > 10 or name_len < 0:","            return","        name_buf = [0 for i in range(10)]","        name_bytes = bytes(str(ros_namespace), \"utf-8\")","        for i in range(10):","            if i < len(ros_namespace):","                name_buf[i] = name_bytes[i]","        ORDER[\"ROS_NAMESPACE\"].extend(name_buf)","        ORDER[\"ROS_NAMESPACE\"][1] = name_len","        ORDER[\"ROS_NAMESPACE\"][2] = 0","        self.__send(\"ROS_NAMESPACE\", len=12)","","    # Make the robot drive faster or slower (Linear)","    def set_ros_scale_line(self, scale=1.0):","        if scale > 2 or scale < 0:","            return","        bytearray_scale = bytearray(struct.pack('h', int(scale*1000)))","        ORDER[\"ROS_SCALE_LINE\"][1] = bytearray_scale[0]","        ORDER[\"ROS_SCALE_LINE\"][2] = bytearray_scale[1]","        ORDER[\"ROS_SCALE_LINE\"][3] = 0","        self.__send(\"ROS_SCALE_LINE\", len=3)","","    # Make the robot turn faster or slower (Angular)","    def set_ros_scale_angular(self, scale=1.0):","        if scale > 2 or scale < 0:","            return","        bytearray_scale = bytearray(struct.pack('h', int(scale*1000)))","        ORDER[\"ROS_SCALE_ANGULAR\"][1] = bytearray_scale[0]","        ORDER[\"ROS_SCALE_ANGULAR\"][2] = bytearray_scale[1]","        ORDER[\"ROS_SCALE_ANGULAR\"][3] = 0","        self.__send(\"ROS_SCALE_ANGULAR\", len=3)","","    # Set Motor PID tuning (Proportional, Integral, Derivative) for smooth driving","    def set_motor_pid_parm(self, pid_p, pid_i, pid_d):","        pid_p_s = bytearray(struct.pack('h', int(pid_p*100)))","        pid_i_s = bytearray(struct.pack('h', int(pid_i*100)))","        pid_d_s = bytearray(struct.pack('h', int(pid_d*100)))","        ORDER[\"MOTOR_PID\"][1] = pid_p_s[0]","        ORDER[\"MOTOR_PID\"][2] = pid_p_s[1]","        ORDER[\"MOTOR_PID\"][3] = pid_i_s[0]","        ORDER[\"MOTOR_PID\"][4] = pid_i_s[1]","        ORDER[\"MOTOR_PID\"][5] = pid_d_s[0]","        ORDER[\"MOTOR_PID\"][6] = pid_d_s[1]","        ORDER[\"MOTOR_PID\"][7] = 0","        self.__send(\"MOTOR_PID\", len=7)","","    # Set IMU PID tuning (keeps the robot driving straight without drifting)","    def set_imu_yaw_pid_parm(self, pid_p, pid_i, pid_d):","        pid_p_s = bytearray(struct.pack('h', int(pid_p*100)))","        pid_i_s = bytearray(struct.pack('h', int(pid_i*100)))","        pid_d_s = bytearray(struct.pack('h', int(pid_d*100)))","        ORDER[\"IMU_YAW_PID\"][1] = pid_p_s[0]","        ORDER[\"IMU_YAW_PID\"][2] = pid_p_s[1]","        ORDER[\"IMU_YAW_PID\"][3] = pid_i_s[0]","        ORDER[\"IMU_YAW_PID\"][4] = pid_i_s[1]","        ORDER[\"IMU_YAW_PID\"][5] = pid_d_s[0]","        ORDER[\"IMU_YAW_PID\"][6] = pid_d_s[1]","        ORDER[\"IMU_YAW_PID\"][7] = 0","        self.__send(\"IMU_YAW_PID\", len=7)","    ","","    # --- READING FUNCTIONS ---","    # (These ask the microcontroller a question, wait for a reply, and translate it back to Python)","","    def read_car_type(self):","        '''Read what kind of robot chassis this is.'''","        self.__request(ORDER[\"CAR_TYPE\"][0])","        time.sleep(self.__read_delay)","        str_data = None","        if self.__unpack():","            car_type = struct.unpack('h', bytearray(self.__rx_DATA[0:2]))[0]","            str_data = str(car_type)","        return str_data","","    def read_arm_mid_value(self):","        '''Read the saved middle positions of the arm servos.'''","        self.__request(ORDER[\"ARM_MID_VALUE\"][0])","        time.sleep(self.__read_delay)","        str_data = None","        if self.__unpack():","            value_s1 = struct.unpack('h', bytearray(self.__rx_DATA[0:2]))[0]","            value_s2 = struct.unpack('h', bytearray(self.__rx_DATA[2:4]))[0]","            value_s3 = struct.unpack('h', bytearray(self.__rx_DATA[4:6]))[0]","            value_s4 = struct.unpack('h', bytearray(self.__rx_DATA[6:8]))[0]","            value_s5 = struct.unpack('h', bytearray(self.__rx_DATA[8:10]))[0]","            value_s6 = struct.unpack('h', bytearray(self.__rx_DATA[10:12]))[0]","            str_data = \"%d,%d,%d,%d,%d,%d\" % (value_s1, value_s2, value_s3, value_s4, value_s5, value_s6)","        return str_data","","    def read_ros_domain_id(self):","        '''Read the current ROS 2 Walkie-Talkie channel.'''","        self.__request(ORDER[\"DOMAIN_ID\"][0])","        time.sleep(self.__read_delay)","        str_data = None","        if self.__unpack():","            domain_id = self.__rx_DATA[0]","            str_data = \"%d\" % (domain_id)","        return str_data","","    def read_ros_namespace(self):","        '''Read the robot's name.'''","        self.__request(ORDER[\"ROS_NAMESPACE\"][0])","        time.sleep(self.__read_delay)","        str_data = None","        if self.__unpack():","            str_data = self.__rx_DATA[1:].decode('utf-8')","        return str_data","","    def read_ros_scale_line(self):","        '''Read the forward speed scaling.'''","        self.__request(ORDER[\"ROS_SCALE_LINE\"][0])","        time.sleep(self.__read_delay)","        str_data = None","        if self.__unpack():","            scale = struct.unpack('h', bytearray(self.__rx_DATA[0:2]))[0]/1000.0","            str_data = \"%.3f\" % scale","        return str_data","    ","    def read_ros_scale_angular(self):","        '''Read the turning speed scaling.'''","        self.__request(ORDER[\"ROS_SCALE_ANGULAR\"][0])","        time.sleep(self.__read_delay)","        str_data = None","        if self.__unpack():","            scale = struct.unpack('h', bytearray(self.__rx_DATA[0:2]))[0]/1000.0","            str_data = \"%.3f\" % scale","        return str_data","","    def read_motor_pid_parm(self):","        '''Read the Motor PID tuning numbers.'''","        self.__request(ORDER[\"MOTOR_PID\"][0], 1)","        time.sleep(self.__read_delay)","        str_data = None","        if self.__unpack():","            pid_p = struct.unpack('h', bytearray(self.__rx_DATA[1:3]))[0]/1000.0","            pid_i = struct.unpack('h', bytearray(self.__rx_DATA[3:5]))[0]/1000.0","            pid_d = struct.unpack('h', bytearray(self.__rx_DATA[5:7]))[0]/1000.0","            str_data = \"%.3f, %.3f, %.3f\" % (pid_p, pid_i, pid_d)","        return str_data","","    def read_imu_yaw_pid_parm(self):","        '''Read the IMU PID tuning numbers.'''","        self.__request(ORDER[\"IMU_YAW_PID\"][0], 5)","        time.sleep(self.__read_delay)","        str_data = None","        if self.__unpack():","            pid_p = struct.unpack('h', bytearray(self.__rx_DATA[1:3]))[0]/1000.0","            pid_i = struct.unpack('h', bytearray(self.__rx_DATA[3:5]))[0]/1000.0","            pid_d = struct.unpack('h', bytearray(self.__rx_DATA[5:7]))[0]/1000.0","            str_data = \"%.3f, %.3f, %.3f\" % (pid_p, pid_i, pid_d)","        return str_data","","    def read_version(self):","        '''Read the microcontroller's software version.'''","        self.__request(ORDER[\"FIRMWARE_VERSION\"][0])","        time.sleep(self.__read_delay)","        str_version = None","        if self.__unpack():","            str_version = \"%d.%d.%d\" % (self.__rx_DATA[0], self.__rx_DATA[1], self.__rx_DATA[2])","        return str_version","","    # --- PRINT ALL INFO ---","    # Asks the microcontroller for every single setting and prints it nicely to the screen","    def print_all_firmware_parm(self):","        version = self.read_version()","        print(\"version:\", version)","","        domain_id = self.read_ros_domain_id()","        print(\"domain_id:\", domain_id)","","        ros_namespace = self.read_ros_namespace()","        print(\"ros_namespace:\", ros_namespace)","","        ros_scale_line = self.read_ros_scale_line()","        print(\"ros_scale_line:\", ros_scale_line)","","        ros_scale_angular = self.read_ros_scale_angular()","        print(\"ros_scale_angular:\", ros_scale_angular)"," ","        motor_pid_parm = self.read_motor_pid_parm()","        print(\"motor pid parm:\", motor_pid_parm)","","        imu_pid_parm = self.read_imu_yaw_pid_parm()","        print(\"imu pid parm:\", imu_pid_parm)","","        arm_mid = self.read_arm_mid_value()","        print(\"arm_mid:\", arm_mid)","","","# --- THE MAIN SCRIPT ---","# This part only runs if you click \"Play\" on this specific file. ","# It is a test/config script used by the Yahboom team to configure the robot before shipping it to you.","if __name__ == '__main__':","","    import platform","    debug = False","    device = platform.system()","    print(\"Read device:\", device)","    ","    # Check if we are on Windows or Linux (Jetson)","    if device == 'Windows':","        # Search for a COM port to connect to","        com_index = 1","        while True:","            com_index = com_index + 1","            try:","                com = 'COM%d' % com_index","                robot = MicroROS_Robot(com, debug=debug)","                break","            except:","                if com_index > 256:","                    print(\"-----------------------No COM Open--------------------------\")","                    exit(0)","                continue","        print(\"--------------------Open %s---------------------\" % com)","    else:","        # On the Jetson (Linux), connect to this specific USB port name","        robot = MicroROS_Robot(port=\"/dev/myserial\", debug=debug)","    ","    print(\"Waiting to read the car type\")","    while True:","        car_type = robot.read_car_type()","        if car_type is not None:","            print(\"car_type:\", car_type)","            if int(car_type) == robot.CAR_TYPE:","                break # Verify we are talking to the right robot","        time.sleep(.5)","","    ","    # robot.set_ros_domain_id(30) # You could change the domain ID here!","    # robot.set_motor_pid_parm(0.8, 0.06, 0.5) # You could tune the motor speeds here!","    robot.set_ros_scale_line(1.0)","    robot.set_ros_scale_angular(1.05)","    # arm_mid_value = [2000, 2000, 2000, 2000, 1486, 3100]","    # robot.set_arm_mid_value(arm_mid_value)","    ","    # Save any changes to the microcontroller","    robot.update_config_data()","","    # Print everything currently saved on the robot","    time.sleep(1)","    robot.print_all_firmware_parm()","","    # Reboot the microcontroller so the new settings take effect","    time.sleep(1)","    robot.reboot_device()","","    # Keep it running","    try:","        while False:","            # robot.beep(100)","            time.sleep(1)","    except:","        pass","    time.sleep(.1)","    del robot # Cleanly close the USB port"]};
const PARTS = [{"n":1,"id":"part-01","fname":"calibrate_linear.launch.py","enTitle":"Launch File — Six Live Imports & Two Filter Paths","lang":"python","start":1,"end":25,"flags":[],"explain":[{"a":1,"b":1,"text":"<b>Launch file-এর সূচনা-ফলক<\/b>: প্রথম লাইনটি নিজেই একটি banner — <code># --- IMPORTING ROS 2 LAUNCH TOOLS ---<\/code>। এটি জানিয়ে দেয়, আমরা এবার একটি ROS 2 <b>launch file<\/b>-এর ভেতরে ঢুকেছি: নাম Python হলেও এর কাজ নিজে হিসাব-নিকাশ করা নয় — বরং কোন কোন program চালু হবে, তার তালিকা সাজিয়ে ROS 2-এর হাতে তুলে দেওয়া। <code>ros2 launch calibration calibrate_linear.launch.py<\/code> কমান্ড যে file-টিকে টেনে তোলে, এটি সেটি। আর এই folder-এর লক্ষ্য মনে রেখো — robot-কে ঠিক ১ মিটার সোজা এগিয়ে দিয়ে আসল দূরত্ব মেপে শুধরানো; মেপে পাওয়া শোধরানো-গুণটি শেষে config_robot.py-র scale setter-এ (Part 14, ORDER 0x43 ROS_SCALE_LINE) গিয়ে বসবে। সোর্সের শিক্ষক-comment-গুলো ইংরেজিতে লেখা — উদ্ধৃতি হুবহু ইংরেজিতেই থাকবে, ব্যাখ্যা বাংলায়।"},{"a":2,"b":2,"text":"<b>Path-গণিতের টুলবাক্স<\/b>: <code>import os<\/code> — Python-এর সাধারণ operating-system module, এতে ROS-এর কিছু নেই। এর দরকার এখানে একটাই: <code>os.path.join<\/code>, যা কয়েকটি folder আর ফাইল-নামের টুকরো জুড়ে একটি বৈধ path-string বানিয়ে দেয়। এই Part-এর নিচেই ঠিক এই ফাংশন দিয়ে দুটি program-এর ঠিকানা গাঁথা হবে — line 13 ও line 21-এ — তাই import-টি গোড়ায় বসে আছে। খেয়াল করো, এটি নিছক অভ্যাস নয়: নিচের একটি ঠিকানাও বানানোর আগে টুলটি হাতের কাছে চাই-ই।"},{"a":3,"b":4,"text":"<b>ফেরত-দেওয়ার ঝুড়ি, আর সরাসরি-চালুর হাতিয়ার<\/b>: <code>from launch import LaunchDescription<\/code> — গোটা file-এর চূড়ান্ত ফল এই ধরনের একটি বস্তু: <code>generate_launch_description()<\/code> শেষে একটি <code>LaunchDescription<\/code>-ই ফেরত যায় (Part 3, line 45), আর তার ভেতরের তালিকা থেকেই ROS 2 একে একে সব চালু করে। আর <code>from launch_ros.actions import Node<\/code> — <code>Node<\/code> হলো একটি <b>একক executable সরাসরি চালু<\/b> করার action; এই file-এ তার ব্যবহার মাত্র একবার, line 29-এ (Part 2), যেখানে এই folder-এর নায়ক — মাপার <code>calibrate_linear<\/code> node-টি — তৈরি হয়।"},{"a":5,"b":5,"text":"<b>অন্যের launch file ডাকার নিমন্ত্রণপত্র<\/b>: <code>from launch.actions import IncludeLaunchDescription<\/code> — এই action-এর কাজ একটাই: <b>আরেকটি সম্পূর্ণ launch file<\/b>-কে আমাদের launch-এর ভেতর থেকে ডেকে আনা। এই file-এ তাকে দুবার ডাকা হবে — Part 3-এর তালিকায় line 50 ও line 57-এ — দুটি filter তখনই জেগে উঠবে। একটু ভাবো: নিজে না লিখে অন্যের লেখা গোটা setup এক লাইনে ধার নেওয়া — launch-জগতে পুনর্ব্যবহারের এটাই রাস্তা, আর এই file-এর দুই সদস্য ঠিক এই রাস্তাতেই দাঁড়িয়ে।"},{"a":6,"b":7,"text":"<b>ঠিকানা-খোঁজার চাবি, আর চেনার পরিচয়পত্র<\/b>: <code>from ament_index_python.packages import get_package_share_directory<\/code> — ইনস্টল হয়ে থাকা একটি package-এর share/ folder-এর পূর্ণ ঠিকানা এটি খুঁজে দেয়; নিচে line 14 ও 22-এ দুবার কাজে নামবে। সঙ্গে <code>from launch.launch_description_sources import PythonLaunchDescriptionSource<\/code> — ডাকা বাইরের file-টি Python launch file বলে চিনিয়ে দেওয়াই তার কাজ (Part 3, line 51 ও 58)। এখানেই হিসাব মিলিয়ে নাও: <b>ছটি import, প্রত্যেকেই ব্যবহৃত<\/b> — os যাবে 13 ও 21-এ, LaunchDescription 45-এ, Node 29-এ, IncludeLaunchDescription 50 ও 57-এ, package-খোঁজা 14 ও 22-এ, চেনার কার্ড 51 ও 58-এ। Folder 04-এর launch file এমন ছিল না — তার <code>DeclareLaunchArgument<\/code> আর <code>LaunchConfiguration<\/code> নামের দুজন অতিথির ডাক গোটা file-এ কেউ পড়েনি; এই file সেই মৃদু খচাখচানি থেকে মুক্ত, template-এর খোলসটুকু ছেঁটেই লেখা।"},{"a":9,"b":10,"text":"<b>নির্দিষ্ট প্রবেশদ্বার<\/b>: <code>def generate_launch_description():<\/code> — ROS 2 launch-এর সঙ্গে এই নামে একটি অলিখিত চুক্তি। <code>ros2 launch<\/code> এই file-কে module হিসেবে নিয়ে ঠিক এই নামের function-টিকে খোঁজে ও ডাকে — argument নেয় না, ফেরত দিতে হয় একটি <code>LaunchDescription<\/code> (Part 3)। নামটি ইচ্ছেমতো বদলালে কমান্ড function-খুঁজে না পেয়ে থেমে যেত — এ নিছক রীতি নয়, দরজার তালা। আর line 10-এ আছে কেবল চারটি space — সত্যিকারের খালি লাইনও নয়, whitespace-only; file-এ আরও আছে এমন (26, 46, 60, 66)। Python এদের উপেক্ষা করে, আমরা প্রতিবেশীর ভাঁজে গুটিয়ে রাখি — line 8-এর ফাঁকা লাইনটিও তেমনই ভাঁজে।"},{"a":11,"b":12,"text":"<b>Program 1-এর ঘোষণা, কাজ এখনও দূরে<\/b>: শিক্ষক-comment দুটি পরিষ্কার ইংরেজিতে লক্ষ্য বলে দিচ্ছে — <code># --- PROGRAM 1: THE IMU FILTER ---<\/code> এবং <code># Find the path to the 'imu_filter_madgwick' package.<\/code>। অর্থাৎ প্রথম program হলো IMU filter, আর এই অংশের কাজ কেবল তার package-এর পথ খোঁজা। <b>মন দিয়ে দেখো<\/b> — comment-গুলোতে 'start' বা চালু করার কথা নেই; চালু করার দায়িত্ব এই অংশের ওপর পড়েইনি। এই filter-ই পরে IMU-র কাঁপুনি ছেঁকে দেবে — দাঁড়িয়ে-থাকা robot যেন নিজেকে কাঁপতে দেখে না; সে গল্প Part 3-এর তালিকায়।"},{"a":13,"b":17,"text":"<b>প্রথম ঠিকানা-মালা<\/b>: <code>imu_filter_madgwick_launch_file = os.path.join(...)<\/code> — একটিমাত্র expression, বন্ধনীর ভাঙনে পাঁচ লাইনে (13-17) সাজানো। ভেতরে তিনটি টুকরো: <code>get_package_share_directory('imu_filter_madgwick')<\/code> ইনস্টল-করা package-টির share/ folder-এর পূর্ণ path দেয়; তার সঙ্গে <code>'launch'<\/code> subfolder আর <code>'imu_filter.launch.py'<\/code> ফাইলের নাম — <code>os.path.join<\/code> তিনটিকে জুড়ে একটি বৈধ path বানায়। ফল বসে যায় <code>imu_filter_madgwick_launch_file<\/code> নামের একটি সাধারণ <b>string<\/b> ভেরিয়েবলে। এই মুহূর্তে বাইরে আর কিছু ঘটেনি — কোনো program চালু হয়নি; ঠিকানাটি কাজে লাগবে কেবল Part 3-এ (line 51), যেখানে <code>IncludeLaunchDescription<\/code> এই path-এর launch file-টি চালু করবে।"},{"a":19,"b":20,"text":"<b>Program 2-এর ঘোষণা<\/b>: একই ছাঁচের comment-জোড়া — <code># --- PROGRAM 2: THE EXTENDED KALMAN FILTER (EKF) ---<\/code> ও <code># Find the path to the 'ekf_bringup' package.<\/code>। দ্বিতীয় program-টি EKF; পূর্ণরূপটিও comment-এই লেখা — Extended Kalman Filter, যাকে পরের তালিকার comment ডাকবে \"Math Brain\"। কাজ আগের block-এর মতোই: শুধু path খোঁজা। দুই block-এর গঠন হুবহু এক রাখা — পাঠক দ্বিতীয়বার একই রেসিপি চিনে নিলেই চলে; নতুন কিছু শিখতে হয় না, শুধু নাম বদলায়।"},{"a":21,"b":25,"text":"<b>দ্বিতীয় ঠিকানা-মালা, একই রেসিপি<\/b>: <code>ekf_odom_launch_file = os.path.join(...)<\/code> — এবার <code>get_package_share_directory('ekf_bringup')<\/code>-এর সঙ্গে <code>'launch'<\/code> আর <code>'ekf.launch.py'<\/code> জুড়ে দ্বিতীয় path-string তৈরি (line 21-25)। ভেরিয়েবলের নামে একটি সূক্ষ্ম তফাত: প্রথমটির নাম package-অনুসারে <code>imu_filter_madgwick_launch_file<\/code>, দ্বিতীয়টি <code>ekf_odom_launch_file<\/code> — নামের মধ্যে 'odom' শব্দটি উঠে এসেছে, যেন EKF-এর কাজ odom-জগতের সঙ্গে যুক্ত বলে ইঙ্গিতটুকু নামেই রাখা হয়েছে; আসলে Part 2-এর node ঠিক সেই <code>odom<\/code> frame-কেই মাপের শুরু-বিন্দু বলে পাবে। এই Part-এর শেষ এখানে: file-এর হাতে এখন দুটি নিছক string-path, একটি program-ও চালু হয়নি — সব চালু হবে একসঙ্গে Part 3-এর ফেরত-দেওয়া তালিকায়।"}],"math":null,"robot":{"correct":"launch চালানোর মুহূর্তে এই অংশটি ডিস্কে ইনস্টল থাকা <code>imu_filter_madgwick<\/code> ও <code>ekf_bringup<\/code> package-দের share/ folder খুঁজে দুটি launch file-এর পূর্ণ path বানিয়ে ফেলে; ঠিকানা দুটি পরে Part 3-এর তালিকায় গিয়ে IMU filter আর EKF চালু করবে — যে চেইনের ওপর দাঁড়িয়ে এই folder-এর ১-মিটার মাপ হবে। কোনো package ইনস্টল না থাকলে path-খোঁজাই ব্যর্থ হয়: launch যেকোনো program চালু হওয়ার আগেই থেমে যায়, robot-এ তখন এতটুকু নড়াচড়াও হয়নি।","incorrect":"সহজ ভুল প্রত্যাশা: এই ২৫ লাইন চলতেই দুটি filter 'চালু হয়ে গেল' বা robot এখনই ১ মিটার হাঁটতে শুরু করবে ভেবে বসা — আসলে এখানে তৈরি হয় কেবল দুটি string-path; চালু হওয়া ঘটে শুধু Part 3-এর return-করা LaunchDescription তালিকা থেকে, আর robot নড়বে কেবল তালিকার শেষ সদস্য calibrate_linear node চালু হওয়ার পরে। এই অংশ শেষেও robot সম্পূর্ণ নীরব — এটা বিকল নয়, ডিজাইন; বিকল ভেবে কোড ঘাঁটালে সময় যাবে ভুল জায়গায়।"},"animType":null,"hasAnim":false},{"n":2,"id":"part-02","fname":"calibrate_linear.launch.py","enTitle":"Program 3 — The Linear Calibration Node","lang":"python","start":27,"end":41,"flags":[],"explain":[{"a":27,"b":28,"text":"<b>তৃতীয় প্রোগ্রামের ঘোষণা — পথ এবার সম্পূর্ণ আলাদা<\/b>: banner <code># --- PROGRAM 3: THE LINEAR CALIBRATION NODE ---<\/code> জানিয়ে দেয় এবার কার পালা — linear calibration node, এই folder-এর গল্পের একমাত্র নায়ক। পরের লাইনেই আসল মন্তব্য: <code># Start a single Node directly instead of using a launch file.<\/code> অর্থাৎ Part 1-এর দুই প্রোগ্রাম (IMU filter আর EKF) যেভাবে অন্য package-দের launch file-এর path খুঁজে সেই ফাইলের হাত ধরে এসেছিল, এবার সেই রাস্তা নয় — তৃতীয় প্রোগ্রামটি সরাসরি এই ফাইলের ভেতরেই একটি <code>Node(...)<\/code> কল হয়ে গড়ে উঠছে। কারণ সরল: এই node-এর জন্য আলাদা launch file লিখে তার path খুঁজে বের করার দরকারই নেই — যা লাগবে সব এই কয়েক লাইনেই বলে দেওয়া যায়।"},{"a":29,"b":32,"text":"<b>node-এর পরিচয়পত্র — তিন তলা, এক পরিবার<\/b>: <code>calibrate_linear = Node(<\/code> — line 4-এ import করা <code>Node<\/code> class-ই এখানে কাজে লাগল; node-এর বর্ণনা তৈরি হয়ে <code>calibrate_linear<\/code> ভেরিয়েবলে জমা (এখনই চালু নয় — চালু হবে Part 3-এ)। তারপর তিনটি পরিচয়-লাইন, প্রতিটির পাশে teacher-comment: <code>package='calibration'<\/code> (<code># Look in the 'calibration' package<\/code>) — ROS কোন package-এ খুঁজবে; <code>executable='calibrate_linear'<\/code> (<code># Find the program named 'calibrate_linear'<\/code>) — সেই package-এর ভেতরের প্রোগ্রাম; <code>name='calibrate_linear'<\/code> (<code># Give it this name in the ROS 2 network<\/code>) — <code>ros2 node list<\/code>-এ দেখা যাবে এমন নেটওয়ার্ক-নাম; executable আর name হুবহু একই string, package-নাম মূল রূপ। তবে executable হিসেবে ডাকা প্রোগ্রামটি এই folder-এ নেই — নামে রেফারেন্স মাত্র; folder-এ আছে এই launch file আর config tool।"},{"a":33,"b":36,"text":"<b>parameters-তালিকার ভূমিকা<\/b>: <code>parameters=[<\/code> একটি list খুলে দেয় — node জন্মানোর মুহূর্তে এই মানগুলোই তার হাতে তুলে দেওয়া হবে; node-এর ভেতরের কোড এগুলোকে নিজের setting হিসেবে পড়বে। কী দেওয়া হচ্ছে, তা তিনটি comment সুন্দর করে বুঝিয়ে দেয়: <code># Tell the calibration tool what parts of the robot to measure.<\/code> — calibration tool robot-এর কোন কোন অংশ মাপবে; <code># 'base_frame' is the center of the robot (base_footprint).<\/code> — robot-এর কেন্দ্র; <code># 'odom_frame' is the starting point of the world (odom).<\/code> — বিশ্বের শুরুর বিন্দু। মাপার আসল মানদণ্ড এই দুই প্রান্তের আপেক্ষিক অবস্থান — নিচের দুই লাইনে সেই প্রান্তদুটিই হাতে-হাতে বসানো।"},{"a":37,"b":39,"text":"<b>দুটি আলাদা dictionary — মাপার দুই প্রান্ত<\/b>: <code>{'base_frame': 'base_footprint'},<\/code> এবং <code>{'odom_frame': 'odom'}<\/code>, তারপর <code>],<\/code> দিয়ে তালিকা বন্ধ। একটি বড় dictionary নয় — <b>দুটি পৃথক single-key dictionary<\/b>-র list, প্রথমটির শেষে কমাটাও তাই। কেন ঠিক এই দুই frame? কারণ 'আসলে কতদূর গেল' প্রশ্নের উত্তর TF-এ এই দুই প্রান্তের মাঝেই লুকানো: <code>odom<\/code> যাত্রা শুরুর স্থির world-origin, robot যেখান থেকে ছাড়ল সেই বিন্দু চিরকাল নড়ে না; <code>base_footprint<\/code> robot-কেন্দ্রের মাটির ওপর ছায়া-frame, robot এগোলেই সে এগোয়। Program 2-এর EKF wheel ও IMU-র ডেটা মিশিয়ে ঠিক এই odom থেকে base_footprint transform-টাই প্রকাশ করে, আর calibration node তার দূরত্ব-অংশ পড়ে পায় আসল দূরত্ব — শুরু আর বর্তমান অবস্থানের এই বিয়োগফলকে 'বলা হয়েছিল 1 মিটার'-এর সঙ্গে মেলানোই পুরো calibration-এর প্রশ্ন।"},{"a":40,"b":40,"text":"<b>ফলাফল চোখের সামনে, terminal-এই<\/b>: <code>output='screen'<\/code> — node-এর ছাপা আউটপুট কোনো লুকানো log-এ না গিয়ে সোজা terminal-এ বয়ে আসবে। পাশের comment নিজেই কারণ বলে দেয়: <code># Print the output directly to our terminal screen so we can see the math results<\/code>। এখানে ছোট্ট একটা খুঁত-কৌতূহল লুকিয়ে আছে — comment-টা শেষ হয়েছে <code>the math results<\/code> বলে; folder 04-এর angular launch file-এর একই লাইনে ছিল শুধু <code>the results<\/code>। শব্দটা বাড়তি, কিন্তু ব্যাপারটা মানানসইও: linear calibration-এর ফলাফল তো সত্যিই একরাশ গণিত — বলা দূরত্ব, মাপা দূরত্ব, আর তাদের তুলনা থেকে বেরোনো correction factor সংখ্যা, যা চোখের সামনে না দেখলে কাজ এগোয় না।"},{"a":41,"b":41,"text":"<b>বন্ধনী পূর্ণ — বর্ণনা তৈরি, কিন্তু এখনও কেউ জাগেনি<\/b>: <code>)<\/code> দিয়ে line 29-এর <code>Node(<\/code>-কল সম্পূর্ণ। এই মুহূর্তে <code>calibrate_linear<\/code> ভেরিয়েবলে একটি পূর্ণাঙ্গ node-বর্ণনা বসে আছে — কোন package, কোন executable, কোন নাম, কোন frame-জোড়া, আউটপুট কোথায়: সব বাঁধা। কিন্তু একটু থামো — এখনও একটি প্রোগ্রামও চালু হয়নি; Part 1-এর দুই প্রোগ্রাম ছিল নিছক path-string, এ-ও এখন নিছক বর্ণনা। সবাই একসাথে জেগে উঠবে Part 3-এর চূড়ান্ত তালিকায় — কে কোথায়, কোন ক্রমে বসবে, সেই বিন্যাসের হিসাব ও-ই পার্টের খাতায় সাজিয়ে রাখা।"}],"math":null,"robot":{"correct":"Part 3-এর চূড়ান্ত তালিকা থেকে চালু হলে এই node robot-কে ঠিক 1 মিটার সোজা এগোনোর আদেশ দেয়, তারপর EKF-এর প্রকাশ করা <code>odom<\/code> থেকে <code>base_footprint<\/code> TF-এর দূরত্ব-অংশ পড়ে মাপে আসলে কতদূর গেল — বলা 1 মিটার বনাম মাপা দূরত্বের তুলনা থেকে correction factor ছাপে; <code>output='screen'<\/code> থাকায় সেই সংখ্যা সরাসরি terminal-এ দেখা যায়, আর সেটাই পরে config_robot.py-র linear scale-এ (Part 14) হাতে বসাতে হয়।","incorrect":"<code>base_footprint<\/code> আর <code>odom<\/code>-কে robot-এর গায়ে লাগানো কোনো দূরত্ব-মাপার sensor-এর নাম ভাবলে, বা ধরে নিলে calibration node-এর নিজের কোনো মাপক যন্ত্র আছে — দুটোই ভুল: এরা যন্ত্র নয়, wheel ও IMU-র ডেটা মিশিয়ে EKF-এর তৈরি করা দুটি coordinate frame, আর node শুধু এদের পারস্পরিক transform পড়েই আসল দূরত্ব জানে; frame-এর নাম ভুল লিখলে বা দুই dictionary-র মান সরিয়ে দিলে TF-ই মেলে না, calibration দাঁড়ায় না।"},"animType":null,"hasAnim":false},{"n":3,"id":"part-03","fname":"calibrate_linear.launch.py","enTitle":"The Final List — Three Programs, One Command","lang":"python","start":43,"end":67,"flags":[],"explain":[{"a":43,"b":44,"text":"<b>মঞ্চে ওঠার আগের শেষ ঘোষণা<\/b>: <code># --- THE FINAL LIST ---<\/code> — উপরের তিন পর্বে তিনটে প্রোগ্রামের উপকরণ যেভাবে জমা হচ্ছিল, এই দুই লাইন তার পরিণতির শিরোনাম-ফলক। ঠিক নিচের comment-টা চুক্তিটা খুলে বলে: <code># Hand the list of programs back to ROS 2 to start them all at once.<\/code> — প্রোগ্রামের তালিকা ROS 2-এর হাতে দিয়ে দাও, বাকি সব একসাথে চালু হবে। লক্ষ করো — এই Part-এ কোনো নতুন path খোঁজা হচ্ছে না, কোনো নতুন <code>Node<\/code> বাঁধা হচ্ছে না; Part 1-এ খোঁজা দুটি launch-file-এর path আর Part 2-এ বাঁধা <code>calibrate_linear<\/code> node-কে এক তালিকায় সাজিয়ে ফেরত দেওয়ার পালা কেবল এই Part-এর।"},{"a":45,"b":45,"text":"<code>return LaunchDescription([<\/code> — গোটা ফাইলের চুক্তি এই এক লাইনে পূর্ণ হয়। <code>generate_launch_description()<\/code> ফাংশনের একটাই দায়িত্ব ছিল: ROS 2-কে একটি <code>LaunchDescription<\/code> ফেরত দেওয়া, আর terminal-এ <code>ros2 launch calibration calibrate_linear.launch.py<\/code> চালালে launch-সিস্টেম এই ফাংশনকেই ডাকে — এই লাইনটা তার উত্তর। <b>মন দিয়ে দেখো<\/b> — শুরুর <code>[<\/code> বন্ধনীটা এখানে খুলে গিয়ে line 67-এর <code>])<\/code>-এ গিয়ে বন্ধ হবে; মাঝের প্রতিটি সদস্য এক একটি 'চালু করো' নির্দেশ, কমা দিয়ে আলাদা। আর একটা সূক্ষ্ম সত্য: এই লাইন নিজে কিছুই চালায় না — সে শুধু তালিকাটা গুছিয়ে <b>ফিরিয়ে দেয়<\/b>; line 46-এর আটটা space-এর নিঃশব্দ লাইনটা পেরিয়ে চালানোর ভার পুরোটাই ROS 2-এর হাতে চলে যায়।"},{"a":47,"b":52,"text":"<b>সদস্য ১ — IMU filter, কাঁচা মাপের ছাঁকনি<\/b>: প্রথমে তিন লাইনের comment — <code># 1. Start the IMU filter (/imu)<\/code>, <code># This cleans up the noisy, jittery data coming from the physical IMU chip<\/code> আর <code># so the robot doesn't think it's shaking when it's standing still.<\/code> — দাঁড়িয়ে-থাকা robot যেন কাঁপতে না দেখে। আসল জন্ম পরের তিন লাইনে: <code>IncludeLaunchDescription(<\/code>, <code>PythonLaunchDescriptionSource(imu_filter_madgwick_launch_file)<\/code>, <code>),<\/code>। Part 1-এ এই path-টা ছিল নিছক একটা string — কিছুই চালু হয়নি; Program 1 আসলে জেগে ওঠে <b>এই লাইনেই<\/b>। <code>IncludeLaunchDescription<\/code> অন্যের লেখা পুরো launch file-কে আমাদের launch-এর ভেতর থেকে ডেকে আনে, <code>PythonLaunchDescriptionSource<\/code> শুধু জানায় ডাকা ফাইলটা Python launch file।"},{"a":54,"b":56,"text":"<b>সদস্য ২ — EKF, 'Math Brain', আর লুকিয়ে থাকা খুঁত<\/b>: প্রথম comment-টাই এই ফাইলের সবচেয়ে কৌতূহল-জাগানো লাইন — <code># 2. Start the EKF Localization (ekf，odom-base_rootpringt tf)<\/code>। ভেতরে দুটো খুঁত একসাথে: <code>ekf<\/code>-এর পরের কমাটা সাধারণ ASCII কমা <code>,<\/code> নয় — ওটা CJK full-width কমা <code>，<\/code> (Unicode U+FF0C), চীনা লিপির চওড়া কমা; folder 04-এর সহোদর লাইনে কমাটা ছিল ASCII-ই। আর <code>odom-base_rootpringt<\/code> বানানটা হুবহু এভাবেই লেখা — বোধহয় odom থেকে base_footprint-এর TF-ই লিখতে গিয়ে হাত এঁটে গিয়েছিল। <b>নিয়ম একটাই: হুবহু এভাবে quote করো, কখনোই ঠিক করে ফেলো না<\/b> — এটা নিছক comment, চালানোর সময় এর কোনো প্রভাব নেই। বাকিটা পরিষ্কার: <code># EKF stands for Extended Kalman Filter. This is the \"Math Brain\".<\/code> আর <code># It takes the wheel data AND the IMU data and mixes them together to guess where the robot is.<\/code>"},{"a":57,"b":59,"text":"এবার সদস্য ২-কে চালু করার তিন লাইন — ছাঁচ হুবহু সদস্য ১-এর মতো: <code>IncludeLaunchDescription(<\/code> ... <code>PythonLaunchDescriptionSource(ekf_odom_launch_file)<\/code> ... <code>),<\/code>; বদল শুধু variable-এর নামে, কারণ Part 1-এ এই path-টা আলাদা variable-এ বাঁধা ছিল। বিভাজক দুটিও পাশাপাশি মেলে দেখো: সদস্য ১-এর পরে line 53 একেবারে ফাঁকা, অথচ সদস্য ২-এর পরে line 60-এ কয়েকটা space বসে আছে — চোখে একরকম লাগলেও ফাইলের ভেতরে আলাদা স্বভাব। এখন পুরো নল-চেইনটা চোখের সামনে সাজিয়ে নাও: IMU chip দেয় কাঁচা মাপ; সদস্য ১ সেটা ছেঁকে পরিষ্কার করে; সদস্য ২ সেই পরিষ্কার IMU-কে চাকার odometry-র সঙ্গে মিশিয়ে প্রকাশ করে TF; আর সেই TF-ই পড়বে একদম শেষ সদস্য, মাপার যন্ত্রটি। চেইনের যেকোনো কড়া দুর্বল হলে স্রোতটাই দুর্বল হয়ে যায় — এই তালিকার সৌন্দর্য কিন্তু ঠিক এই নির্ভরতার মধ্যেই।"},{"a":61,"b":64,"text":"<b>সদস্য ৩ — মাপার যন্ত্র, এই folder-এর নায়ক<\/b>: শিরোনাম <code># 3. Start the linear calibration tool<\/code>, তারপর তিন লাইনে কাজের পূর্ণ খতিয়ান — <code># This program tells the robot to drive forward exactly 1 meter.<\/code>; <code># It then measures how far the robot *actually* drove. If the robot only drove 0.9 meters,<\/code>; <code># it calculates a \"correction factor\" to put in the robot's config files so it drives accurately next time!<\/code>। বলা হলো 1 মিটার, robot সরল 0.9 মিটার — বলা-বনাম-সরা-র এই ফারাকটাই হয়ে ওঠে correction factor। আর তার গন্তব্য? পাশের ফাইল config_robot.py — Part 14-এর <code>set_ros_scale_line<\/code> যেখানে ORDER 0x43 ROS_SCALE_LINE-এ linear scale বসায়, আর Part 20-এর <code>main()<\/code> যেখানে ডিফল্ট হিসেবে <code>set_ros_scale_line(1.0)<\/code> লেখে। খেয়াল করো — এই প্রোগ্রামের আসল কোড এই ফাইলে নেই; launch file শুধু বর্ণনা দিয়ে তাকে স্টেজে তুলে দিচ্ছে।"},{"a":65,"b":67,"text":"শেষ সদস্য, তারপর বন্ধনীর শেষ প্রান্ত: <code>calibrate_linear,<\/code> — কোনো <code>IncludeLaunchDescription<\/code> এখানে লাগেনি, কারণ সদস্য ১ ও ২ অন্যের লেখা পুরো launch file ডেকে আনে, আর এটা আমাদের নিজের বানানো <code>Node<\/code> — Part 2-তেই package-নাম থেকে <code>output='screen'<\/code> পর্যন্ত সব বাঁধা ছিল; এখানে কাজ শুধু নামটা তালিকায় বসানো। বিন্যাসটাও অর্থবহ: তালিকায় নায়ক একেবারে শেষে — মাপার যন্ত্র তার খাবার-উৎস (filter, EKF) জেগে ওঠার পরে স্টেজে পা রাখে। তারপর space-ভরা line 66 পেরিয়ে line 67-এ <code>])<\/code> — এক সঙ্গে দুটো দরজা বন্ধ: তালিকা শেষ, <code>LaunchDescription(...)<\/code>-এর ডাকও শেষ। শেষ খুঁতটা মজার: ফাইলের একেবারে শেষ বাইট <code>)<\/code>-এর পরে কোনো newline নেই — 67 লাইনের ফাইলে newline মাত্র 66টা। এরপর object-টা ফেরে launch-সিস্টেমের হাতে, আর ROS 2 তিন সদস্যকে একসাথে জাগিয়ে তোলে — ফাইলের কাজ এখানেই পূর্ণ।"}],"math":null,"robot":{"correct":"terminal-এ <code>ros2 launch calibration calibrate_linear.launch.py<\/code> চালালেই তিনটি প্রোগ্রাম একসাথে জেগে ওঠে: IMU filter কাঁচা IMU-ডেটা ছেঁকে পরিষ্কার করে, EKF সেই মাপ আর চাকার odometry মিশিয়ে odom থেকে base_footprint-এ TF প্রকাশ করে, আর calibrate_linear node robot-কে ঠিক 1 মিটার সামনে চালিয়ে সেই TF থেকেই 'কত বলা হয়েছিল বনাম কত সরেছি' মেপে correction factor ছাপে — <code>output='screen'<\/code> বলে ফল সরাসরি terminal-এ।","incorrect":"line 54-এর comment পড়ে ধরে নাও TF frame-টার আসল নামই <code>odom-base_rootpringt<\/code>, আর <code>tf2_echo<\/code> বা কোডে সেই নাম খুঁজতে বসলে সেই প্রত্যাশা এখানে ভেঙে পড়ে: ওটা টাইপো-মাখা একটা নিছক comment — কমাটা পর্যন্ত full-width — চালানোর সময় এর কোনো অস্তিত্ব নেই। আসল frame-দুটি বাঁধা অন্য জায়গায়: Part 2-এর parameters-এ <code>{'base_frame': 'base_footprint'}<\/code> আর <code>{'odom_frame': 'odom'}<\/code>। comment পড়ে frame-নাম সিদ্ধান্ত করা মানে ভুল মানচিত্র নিয়ে রওনা দেওয়া।"},"animType":"launchFlow","hasAnim":true},{"n":4,"fname":"config_robot.py","enTitle":"config_robot — Imports & the ORDER Menu","explain":[{"a":1,"b":3,"text":"<b>মঞ্চ বদল — আর তিনটি জীবন্ত import<\/b>: এই Part থেকে গল্পের জগৎটাই বদলে গেল — এতক্ষণ আগের Part-গুলোতে আমরা ছিলাম ROS launch-এর জগতে, যেখানে রোবট সামনে গিয়ে মাপজোক চলছিল; এবার হাতে সেই কারখানার টুল, যেটা সোজা রোবটের নিচের বোর্ডের (microcontroller) সঙ্গে তার ধরে কথা বলে আর তার firmware-এর সেটিং বদলায়। প্রথম তিন লাইনে তিনটি হাতিয়ার, আর লক্ষ করো — তিনটিই এই ফাইলে বেঁচে থাকে: <code>serial<\/code> (pyserial) হলো USB/serial তারটাই, Part 5-এর constructor এই নাম ধরেই <code>serial.Serial(...)<\/code> দিয়ে তার খুলবে; <code>struct<\/code> Python-এর সাধারণ সংখ্যাকে বাইনারি byte-এ গুছিয়ে দেয়, পরের setter-রা <code>struct.pack<\/code> দিয়ে ঠিক সেই কাজটাই করবে; আর <code>time<\/code> হলো বিরতি — <code>time.sleep<\/code> পুরো ফাইল জুড়ে তারকে নিঃশ্বাস নেওয়ার সময় দেয়। series-এর আগের কিছু folder-এ import-দের একাংশ কাজেই লাগত না — এই ফাইলে প্রতিটি import-ই রোজগার করে খায়।"},{"a":5,"b":8,"text":"<b>রেস্টুরেন্ট-মেনুর রূপক — পুরো নকশা এক নজরে<\/b>: <code>ORDER<\/code> dictionary-র জন্মের আগে চার লাইনের শিক্ষক-কমেন্ট নকশাটা বুঝিয়ে দেয় — <code># Think of this like a menu at a restaurant.<\/code> অর্থাৎ নিচের বোর্ড এক রেস্টুরেন্ট, প্রতিটা command এক একটা অর্ডার। তারপর নিয়ম: <code>The first number (like 0x22) is the \"Item Number\" the microcontroller understands<\/code> — তালিকার প্রথম সংখ্যাটাই আইটেম-নম্বর বা ঠিকানা, যেটা ছাড়া বোর্ড কিছুই চেনে না; আর <code>empty slots waiting to be filled with data<\/code> — বাকি ঘরগুলো ফাঁকা খামা, পাঠানোর আগে যেগুলোয় আসল ডেটা ভরতে হবে। এই দুই-স্তরের ছাঁচটা (ঠিকানা + payload-ঘর) এখন মাথায় গেঁথে নাও — বাকি পুরো ফাইলের প্রতিটা চিঠি এই একই ছাঁচে যাবে।"},{"a":9,"b":9,"text":"<b>মেনুর জন্ম — আর জন্মস্থানটাই আসল খবর<\/b>: <code>ORDER = {<\/code> — দেখতে সামান্য এক লাইন, কিন্তু এর অবস্থানটাই সবচেয়ে গুরুত্বপূর্ণ সিদ্ধান্ত: dictionary-টা কোনো class-এর ভেতরে নয়, ফাইলের একদম ওপরে, class-এর বাইরে — অর্থাৎ module-level। মানে পুরো প্রোগ্রামে এর <b>একটাই<\/b> কপি, সবাই ভাগ করে ব্যবহার করে; আর Python-এ list mutable হওয়ায় Parts 10-15-এর প্রতিটা setter নিজের মান সরাসরি মূল তালিকার ভেতরেই বসায় (<code>ORDER[...][i] = ...<\/code>), কপি বানিয়ে নয়। এই ভাগাভাগির ফল পরে ধরা পড়বে — Part 13-এ একটা setter এই মূল তালিকাটাকে প্রতি ডাকে বড়ও করে ফেলবে (list-growth quirk)। আপাতত মনে রেখো: মেনুর খাতা সবার হাতে একটাই।"},{"a":10,"b":11,"text":"<b>প্রথম জোড়া — PID টিউনিং, মোটা খামার জোড়া<\/b>: <code>\"MOTOR_PID\": [0x13, 0, 0, 0, 0, 0, 0, 0]<\/code> আর <code>\"IMU_YAW_PID\": [0x14, 0, 0, 0, 0, 0, 0, 0]<\/code> — প্রথম আইটেম দুটিই ঠিকানার পরে <b>সাতটা করে ফাঁকা ঘর<\/b> নিয়ে বসেছে; ARM_MID_VALUE ছাড়া মেনুর সবচেয়ে মোটা খামা এই দুটি। MOTOR_PID চাকার গতি-নিয়ন্ত্রণের টিউনিং সংখ্যার ঠিকানা, IMU_YAW_PID রোবটের yaw-ঘূর্ণন সোজা ধরে রাখার টিউনিংয়ের — কমেন্ট বলছেই <code># Address for Motor PID tuning<\/code>। ঠিক কেন ঘর সাতটা, সে উত্তর setter-রা ঘর ভরতে গিয়ে নিজেই দেখিয়ে দেবে; আপাতত দেখে নাও ঠিকানা-জোড়াটি — 0x13 ও 0x14 পাশাপাশি, মেনুর নম্বর-সারির শুরু এখান থেকেই।"},{"a":12,"b":15,"text":"<b>চ্যাসিস-প্রশ্ন আর হাতের পরিবার<\/b>: <code>\"CAR_TYPE\": [0x15, 0]<\/code> — কী ধাতুর চ্যাসিস এই প্রশ্ন, একটাই ঘর; এরপর হাতের (arm) তিনটা ঠিকানা: <code>\"ARM_TORQUE\": [0x22, 0]<\/code> হাতের মোটরে বিদ্যুৎ অন/অফ (এক ঘর), <code>\"ARM_OFFSET\": [0x24, 0, 0]<\/code> servo-র শূন্য-অবস্থান ক্যালিব্রেশন (দুই ঘর), আর <code>\"ARM_MID_VALUE\": [0x25, 0, 0, 0, ...]<\/code> — ঠিকানার পরে <b>তেরোটা ফাঁকা ঘর<\/b>: মেনুর সবচেয়ে লম্বা তালিকা, হাতের মাঝ-অবস্থানের একঝাঁক মান একসাথে পাঠানোর মোটা খামা। মন দিয়ে দেখো ঠিকানার ছন্দটা — 0x15-এর পরে লাফ দিয়ে 0x22, তারপর 0x24, 0x25: নম্বর-সারি ধারাবাহিক নয়, এই টুল নিজের দরকারের নম্বরগুলো ছাড়িয়ে ছাড়িয়ে বসিয়েছে — ফাঁকের ঘরগুলোতে বোর্ডের অন্য কমান্ড থাকতে পারে।"},{"a":16,"b":19,"text":"<b>ROS 2 পরিবার — আর এই folder-এর আসল নায়ক 0x43<\/b>: <code>\"DOMAIN_ID\": [0x41, 0, 0]<\/code> ROS 2-এর walkie-talkie চ্যানেল (কমেন্টে ভাষাটাও তেমনই), <code>\"ROS_NAMESPACE\": [0x42, 0, 0]<\/code> রোবটের নাম, <code>\"ROS_SCALE_LINE\": [0x43, 0, 0, 0]<\/code> সামনে-পিছনে গতির scaling, আর <code>\"ROS_SCALE_ANGULAR\": [0x44, 0, 0, 0]<\/code> — ঘূর্ণনের scaling, তিন ঘরের খামা। লক্ষ করো — folder-এর নামই linear velocity calibration; মেনুর 0x43 আইটেমটিই সেই ঠিকানা যেখানে সামনে-এগিয়ে-মাপা calibration-এর scaling-সংখ্যা বোর্ডের স্মৃতিতে বসবে — গল্পের কেন্দ্রে এই ছোট্ট তালিকাটিই; পাশের 0x44 ঘূর্ণনের ঘর — একই স্ক্রিপ্ট দুটোই একসারিতে লেখে। আরেকটা ছোট্ট দাগ: line 19-এর কমেন্টটা প্রতিবেশী লাইনের কমেন্ট-কলাম থেকে এক ঘর ডানে সরে বসেছে — সারি মেলানোর এই কাপাকাপি কারো ক্ষতি করে না, শুধু চোখে পড়ে।"},{"a":20,"b":22,"text":"<b>অ্যাডমিনের তাক আর একটা নিঃশব্দ নাম<\/b>: <code>\"ROBOT_REBOOT\": [0x80, 0, 0]<\/code> — বোর্ড রিবুট, <code>\"ROBOT_CONFIG\": [0x81, 0, 0]<\/code> — কনফিগ সেভ/রিসেট; নম্বর-সারির একদম ওপরের দুই ঠিকানা এদেরাই (128 ও 129), যেন ভারী চাবিগুলো সবার ওপরের তাকে। মাঝে <code>\"REQUEST_DATA\": [0x50, 0, 0]<\/code> — ডেটা চেয়ে জিজ্ঞেস করার আইটেম। এখানে একটা কৌতূহল-জাগানো ব্যাপার লক্ষ করো: পুরো ফাইলে খুঁজলে কোনো function-ই <code>ORDER[\"REQUEST_DATA\"]<\/code>-কে ডাকতে দেখা যায় না — পড়ার কাজটা হয় অন্য পথে, সরাসরি 0x50 মানটি নিজের খামায় বসিয়ে (Part 5-এ সেই কোড আলাদা করে গোছানো দেখবে)। নামটা মেনুতে দাঁড়িয়ে আছে, কিন্তু এই নামে অর্ডার কেউ দেয় না — series-এর আগের folder-এর অব্যবহৃত import-দের এক আত্মীয়।"},{"a":23,"b":24,"text":"<b>শেষ আইটেম — নিছক প্রশ্ন, তারপর খাতা বন্ধ<\/b>: <code>\"FIRMWARE_VERSION\": [0x51]<\/code> — পুরো মেনুর একমাত্র এক-ঘরের তালিকা: ঠিকানাটুকু আছে, পরে একটাও ফাঁকা ঘর নেই। কারণটা সুন্দর: বাকি সবাই নির্দেশ — কিছু পাঠাতে হয় বলেই ঘর লাগে; এ একটা বিশুদ্ধ প্রশ্ন, সফটওয়্যারের ভার্সন জানতে চাওয়া — পাঠানোর মতো ডেটাই নেই, উত্তরটা উল্টো দিক থেকে ফেরে। line 24-এর <code>}<\/code> দিয়ে মেনু সম্পূর্ণ: মোট চৌদ্দটি নাম, প্রতিটার প্রথম ঘরে একটা ছোট্ট হেক্স-সংখ্যা — নিচের বোর্ডের পুরো
