<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07. obstacle avoidance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#0a0a0a; --bg2:#111111;
  --card:#151515; --card2:#181818; --card3:#1d1d1d;
  --border:#262626; --border2:#303030; --border3:#3a3a3a;
  --text:#e8e8e8; --muted:#a0a0a0; --faint:#6e6e6e;
  --ex:#4fc3f7; --ex-dim:rgba(79,195,247,.09);
  --math:#7ee787; --math-dim:rgba(126,231,135,.08);
  --rb:#ffb454; --rb-dim:rgba(255,180,84,.08);
  --anim:#d2a8ff; --anim-dim:rgba(210,168,255,.08);
  --code-bg:#0d1117; --code-head:#161b22;
  --gutter-txt:#3d4f63; --gutter-line:#1c2530;
  --ok:#3fb950; --bad:#f85149;
  --ff-title:'Space Grotesk','Inter','Hind Siliguri',sans-serif;
  --ff-ui:'Inter','Hind Siliguri',system-ui,-apple-system,sans-serif;
  --ff-bn:'Hind Siliguri','Inter',sans-serif;
  --ff-mono:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --sb-w:292px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--ff-ui); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(79,195,247,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a}
a{color:var(--ex);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ex);outline-offset:2px;border-radius:4px}
button{font-family:var(--ff-ui)}

/* ============ APP LAYOUT ============ */
#app{display:flex;min-height:100vh}
#main{
  margin-left:var(--sb-w);
  flex:1;
  min-width:0;
  padding:52px 56px 80px;
  max-width:1180px;
}
.intro-banner{
  margin-bottom:48px;padding:30px 34px;
  background:linear-gradient(145deg,#141414,#101010);
  border:1px solid var(--border);border-radius:16px;
  position:relative;overflow:hidden;
}
.intro-banner::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(600px 180px at 12% 0%,rgba(79,195,247,.07),transparent 60%),
    radial-gradient(500px 160px at 88% 100%,rgba(210,168,255,.05),transparent 60%);
  pointer-events:none;
}
.intro-eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ex);margin-bottom:10px;
}
.intro-banner h1{
  font-family:var(--ff-title);font-size:clamp(26px,3.4vw,38px);
  font-weight:700;letter-spacing:-.01em;line-height:1.15;
}
.intro-banner h1 .path{color:var(--faint);font-weight:500}
.intro-desc{margin-top:12px;color:var(--muted);max-width:70ch;font-size:15px}
.intro-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stat-chip{
  font-family:var(--ff-mono);font-size:12px;color:#c9d1d9;
  background:#0d1117;border:1px solid var(--border2);
  padding:6px 12px;border-radius:999px;
}
.stat-chip b{color:var(--ex);font-weight:600}

/* ============ SIDEBAR ============ */
#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);
  background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;z-index:60;
  display:flex;flex-direction:column;
}
.sb-head{
  padding:26px 22px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg2);z-index:2;
}
.sb-folder{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;
  color:var(--text);letter-spacing:-.01em;line-height:1.3;
}
.sb-meta{
  margin-top:6px;font-family:var(--ff-mono);font-size:11.5px;
  color:var(--faint);letter-spacing:.08em;
}
#sb-nav{padding:14px 12px 30px;flex:1}
.sb-item{
  display:flex;align-items:baseline;gap:11px;
  padding:8px 12px;margin:1px 0;border-radius:8px;
  color:#9a9a9a;border-left:2px solid transparent;
  transition:background .18s,color .18s;
}
.sb-item .sb-num{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  min-width:20px;font-weight:500;
}
.sb-item .sb-name{
  font-size:13.2px;font-weight:500;line-height:1.35;
  font-family:var(--ff-ui);
}
.sb-item:hover{background:#181818;color:#d6d6d6;text-decoration:none}
.sb-item.active{
  background:linear-gradient(90deg,rgba(79,195,247,.10),rgba(79,195,247,.02));
  color:#eaf6fe;border-left:2px solid var(--ex);
}
.sb-item.active .sb-num{color:var(--ex)}
.sb-filesep{
  font-family:var(--ff-mono);font-size:10px;letter-spacing:.16em;
  color:#525252;text-transform:uppercase;
  padding:14px 12px 6px;margin-top:4px;
}
#menu-btn{
  display:none;position:fixed;top:14px;left:14px;z-index:80;
  width:42px;height:42px;border-radius:10px;
  background:#181818;border:1px solid var(--border2);color:var(--text);
  font-size:15px;cursor:pointer;line-height:1;
  align-items:center;justify-content:center;padding:0;
}
#sb-overlay{display:none}

/* ============ PART SECTION ============ */
.part{margin-bottom:88px;scroll-margin-top:24px}
.part-head{margin-bottom:22px}
.eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ex);margin-bottom:8px;
}
.part-title{
  font-family:var(--ff-title);font-size:clamp(23px,2.6vw,31px);
  font-weight:700;letter-spacing:-.015em;line-height:1.18;
  margin-bottom:12px;
}
.part-meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-family:var(--ff-mono);font-size:12px;color:var(--muted);
}
.meta-chip{
  background:#101418;border:1px solid var(--border2);
  padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.meta-chip.flag{color:#d8c97a;border-color:#3a3524;background:#17150d}
.meta-chip.lang{color:#8ab4f8}

/* ============ CODE CARD ============ */
.code-card{
  background:var(--code-bg);border:1px solid var(--border2);
  border-radius:13px;overflow:hidden;margin-bottom:30px;
  box-shadow:0 14px 40px rgba(0,0,0,.42);
}
.code-card-head{
  display:flex;align-items:center;gap:14px;
  background:var(--code-head);border-bottom:1px solid #20262e;
  padding:10px 16px;
}
.dots{display:flex;gap:7px;align-items:center}
.dots i{
  width:11px;height:11px;border-radius:50%;display:block;
}
.dots i:nth-child(1){background:#ff5f57}
.dots i:nth-child(2){background:#febc2e}
.dots i:nth-child(3){background:#28c840}
.code-fname{
  font-family:var(--ff-mono);font-size:12.5px;color:#9aa7b4;
  letter-spacing:.02em;
}
.code-lines-chip{
  font-family:var(--ff-mono);font-size:11px;color:#5b6875;
  margin-left:auto;white-space:nowrap;
}
.copy-btn{
  font-family:var(--ff-mono);font-size:11px;letter-spacing:.06em;
  color:#9aa7b4;background:#1c2128;border:1px solid #2d333b;
  border-radius:6px;padding:4px 11px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.copy-btn:hover{color:#e6edf3;border-color:#444c56}
.copy-btn.done{color:var(--ok);border-color:rgba(63,185,80,.4)}
.code-scroll{overflow-x:auto;max-height:640px;overflow-y:auto}
pre.code{display:inline-block;min-width:100%;padding:14px 0;font-family:var(--ff-mono)}
.cl{display:flex;white-space:pre;font-size:13.2px;line-height:1.62}
.cln{
  position:sticky;left:0;flex:0 0 auto;z-index:2;
  min-width:52px;text-align:right;padding-right:16px;
  color:var(--gutter-txt);background:var(--code-bg);
  border-right:1px solid var(--gutter-line);
  user-select:none;-webkit-user-select:none;font-size:11.5px;
  line-height:1.85;letter-spacing:.02em;
}
.cl.target .cln{
  background:#101722;color:#7ba3c9;border-right-color:#234;
}
.clc{flex:0 0 auto;padding-right:24px;tab-size:8;color:#e6edf3}
.tok-kw{color:#ff7b72}
.tok-str{color:#a5d6ff}
.tok-com{color:#8b949e;font-style:italic}
.tok-num{color:#79c0ff}
.tok-fn{color:#d2a8ff}
.tok-blt{color:#ffa657}

/* ============ SECTIONS ============ */
.sec{
  border:1px solid var(--border);border-radius:13px;
  background:var(--card);margin-bottom:26px;overflow:hidden;
}
.sec-head{
  display:flex;align-items:center;gap:12px;
  padding:15px 22px;border-bottom:1px solid var(--border);
  background:var(--card2);
}
.badge{
  font-family:var(--ff-mono);font-weight:700;font-size:12px;
  min-width:34px;height:26px;border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;
  letter-spacing:.03em;flex:0 0 auto;
}
.badge-ex{background:var(--ex-dim);color:var(--ex);border:1px solid rgba(79,195,247,.35)}
.badge-math{background:var(--math-dim);color:var(--math);border:1px solid rgba(126,231,135,.35)}
.badge-rb{background:var(--rb-dim);color:var(--rb);border:1px solid rgba(255,180,84,.35)}
.badge-anim{background:var(--anim-dim);color:var(--anim);border:1px solid rgba(210,168,255,.35)}
.sec-head h3{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;letter-spacing:-.01em;
}
.sec-head h3 .bn-inline{font-family:var(--ff-bn)}
.sec-body{padding:20px 22px 24px}

/* ============ EXPLAIN ENTRIES ============ */
.ex-entry{margin-bottom:26px}
.ex-entry:last-child{margin-bottom:6px}
.ex-snippet{
  background:#0d1117;border:1px solid var(--border2);border-left:3px solid var(--ex);
  border-radius:9px;overflow:hidden;
}
.ex-snippet pre{
  padding:10px 16px;font-family:var(--ff-mono);font-size:12.8px;
  line-height:1.62;color:#dbe4ee;overflow-x:auto;white-space:pre;
}
.ex-lines{
  display:inline-block;font-family:var(--ff-mono);font-size:10.5px;
  color:var(--ex);background:var(--ex-dim);border:1px solid rgba(79,195,247,.3);
  border-radius:5px;padding:1px 8px;margin-bottom:7px;letter-spacing:.06em;
}
.ex-arrow{
  color:#3a471f;font-family:var(--ff-mono);font-size:15px;color:var(--faint);
  padding:3px 2px 3px 12px;
}
.ex-text{
  font-family:var(--ff-bn);font-size:16px;line-height:1.95;color:#d5d5d5;
  padding:2px 4px 0 14px;border-left:2px solid #232d36;
}
.ex-text code, .bn code, .ml-text code, .map-text code, .rb-card code, .anim-caption code{
  font-family:var(--ff-mono);font-size:.86em;color:#9ecbff;
  background:rgba(110,168,254,.10);border:1px solid rgba(110,168,254,.16);
  border-radius:5px;padding:1px 6px;white-space:nowrap;
}
.ex-text ul, .ml-text ul, .rb-card ul, .anim-caption ul{
  margin:8px 0 4px 4px;padding-left:22px;
}
.ex-text li, .ml-text li, .rb-card li{margin:5px 0}

/* ============ MATH SECTION ============ */
.math-intro{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
  padding-bottom:16px;border-bottom:1px dashed var(--border2);margin-bottom:20px;
}
.math-level{
  background:var(--card2);border:1px solid var(--border2);border-radius:11px;
  padding:16px 20px;margin-bottom:14px;
}
.ml-label{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--math);margin-bottom:10px;
}
.mathy{
  font-size:17px;color:#e3ffe6;margin:8px 0 12px;
  padding:12px 16px;background:rgba(126,231,135,.05);
  border:1px solid rgba(126,231,135,.16);border-radius:9px;
  overflow-x:auto;min-height:24px;
}
.ml-text{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
}
.math-subhead{
  font-family:var(--ff-title);font-size:14.5px;font-weight:600;color:#bfe8c4;
  margin:26px 0 12px;letter-spacing:.01em;
}
.map-row{
  display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(180px,1fr) minmax(220px,1.4fr);
  gap:12px;align-items:start;
  background:var(--card2);border:1px solid var(--border2);border-radius:10px;
  padding:12px 16px;margin-bottom:10px;
}
.map-code code{
  font-family:var(--ff-mono);font-size:12.5px;color:#9ecbff;background:#0d1117;
  border:1px solid var(--border2);border-radius:6px;padding:3px 8px;display:inline-block;
}
.map-math{color:#c9f7cf;font-family:var(--ff-mono);font-size:13.5px;padding-top:2px}
.map-text{font-family:var(--ff-bn);font-size:14.5px;line-height:1.8;color:#bcbcbc}
.failure-list li{
  font-family:var(--ff-bn);font-size:15px;line-height:1.85;color:#d9c9c9;
  margin:8px 0;padding-left:6px;list-style:none;position:relative;padding-left:22px;
}
.failure-list li::before{
  content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;
  border-radius:2px;background:rgba(248,81,73,.5);border:1px solid rgba(248,81,73,.65);
}
.failure-list{padding:0}

/* ============ ROBOT SECTION ============ */
.rb-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rb-card{
  border-radius:11px;padding:16px 18px;border:1px solid var(--border2);
  font-family:var(--ff-bn);font-size:15.3px;line-height:1.9;
}
.rb-card h4{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:10px;font-weight:600;
}
.rb-ok{background:rgba(63,185,80,.05);border-color:rgba(63,185,80,.28)}
.rb-ok h4{color:var(--ok)}
.rb-bad{background:rgba(248,81,73,.05);border-color:rgba(248,81,73,.28)}
.rb-bad h4{color:var(--bad)}

/* ============ ANIMATION SECTION ============ */
.anim-stage{
  background:
    radial-gradient(500px 200px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  border-bottom:1px solid var(--border2);
  padding:10px;position:relative;
}
.anim-stage svg{width:100%;height:auto;display:block}
.anim-controls{
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--border);background:var(--card2);
}
.ac-btn{
  font-family:var(--ff-mono);font-size:12px;letter-spacing:.08em;
  color:#c9c9c9;background:#202020;border:1px solid var(--border3);
  border-radius:8px;padding:7px 18px;cursor:pointer;transition:all .15s;
}
.ac-btn:hover{background:#2a2a2a;color:#fff;border-color:#4a4a4a}
.ac-btn.active{background:rgba(210,168,255,.14);color:var(--anim);border-color:rgba(210,168,255,.45)}
.anim-caption{
  font-family:var(--ff-bn);font-size:15px;line-height:1.8;color:#d0c4dd;
  padding:13px 22px;border-bottom:1px solid var(--border);min-height:52px;
  background:rgba(210,168,255,.03);
}
.anim-formula{
  font-family:var(--ff-mono);font-size:14px;color:#e6d9f5;
  padding:12px 22px;background:#0d1117;min-height:46px;
  overflow-x:auto;white-space:nowrap;letter-spacing:.01em;
}
.anim-formula .fx-hl{color:var(--anim)}
.anim-formula .fx-ok{color:var(--math)}
.anim-formula .fx-warn{color:var(--rb)}
.anim-state{
  margin-left:auto;font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.1em;
}

/* ============ PART NAV ============ */
.part-nav{display:flex;justify-content:space-between;gap:14px;margin-top:34px}
.pn-btn{
  flex:1;max-width:340px;display:block;
  border:1px solid var(--border2);border-radius:11px;
  padding:13px 18px;color:#c9c9c9;transition:all .16s;
  background:var(--card);
}
.pn-btn:hover{border-color:rgba(79,195,247,.4);color:#fff;text-decoration:none;background:#181818}
.pn-btn .pn-dir{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.14em;display:block;margin-bottom:3px;
}
.pn-btn .pn-title{font-size:13.5px;font-weight:600}
.pn-btn.next{text-align:right}
.pn-btn.disabled{opacity:.28;pointer-events:none}

/* ============ FOOTER ============ */
.site-footer{
  margin-left:var(--sb-w);border-top:1px solid var(--border);
  padding:26px 56px;color:var(--faint);font-size:13px;
  font-family:var(--ff-mono);letter-spacing:.02em;
}

/* ============ MATHJAX FALLBACK ============ */
body.no-mathjax .mathy{
  font-family:var(--ff-mono);font-size:13.5px;color:#c9f0cd;white-space:pre;
}

/* ============ RESPONSIVE ============ */
@media (max-width:1240px){
  #main{padding:44px 34px 70px}
  .site-footer{padding:24px 34px}
}
@media (max-width:960px){
  #menu-btn{display:block}
  #sidebar{
    transform:translateX(-100%);transition:transform .26s ease;
    box-shadow:24px 0 60px rgba(0,0,0,.5);
  }
  body.sb-open #sidebar{transform:translateX(0)}
  body.sb-open #sb-overlay{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;
  }
  #main{margin-left:0;padding:74px 20px 60px}
  .site-footer{margin-left:0;padding:22px 20px}
  .rb-grid{grid-template-columns:1fr}
  .map-row{grid-template-columns:1fr;gap:6px}
  .intro-banner{padding:22px 20px}
}
@media (max-width:560px){
  body{font-size:15px}
  .ex-text{font-size:15.3px}
  .cl{font-size:12.3px}
  .anim-formula{font-size:12.5px}
  .code-lines-chip{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}
</style>


<style id="refine-style">
/* ==================================================================
   SURGICAL REFINEMENT LAYER v2 — appended (UI-UX & animation refinement)
   Does not override any existing rule except where explicitly noted;
   all original bytes above this block are untouched.

   INTENTIONAL LAYER ARCHITECTURE (documented z-index scale)
   ---------------------------------------------------------
     --z-ground  0   page ground, card backgrounds
     --z-scene  10   base SVG scene inside .anim-stage / .exec-robot
     --z-objects 20  moving SVG marks (updated in place by the engine)
     --z-labels 30   SVG text labels — halo-stroked so they can never
                     become unreadable under moving objects
     --z-panel  40   overlay panels (formula bar, debug chips)
     --z-head   50   section headers, captions
     --z-debug  60   live debug readouts
     --z-ctrl   70   control bars (always clickable, never covered)
     --z-nav    80   sidebar / menu
     --z-focus  90   focus outlines (never overlapped)
   HTML layers take these values; inside a single <svg> stacking is by
   paint order, and readability of labels is guaranteed by the
   paint-order halo rule below rather than by z-index.
   ================================================================== */
:root{
  --z-ground:0; --z-scene:10; --z-objects:20; --z-labels:30;
  --z-panel:40; --z-head:50; --z-debug:60; --z-ctrl:70; --z-nav:80; --z-focus:90;
}

/* ---- Fix: full-width application shell (#56-57).
        #main keeps its sidebar margin but drops the narrow max-width;
        prose blocks below keep a readable measure so lines never run
        wall-to-wall — only layout containers use the full width. ---- */
#main{max-width:none}
.intro-desc{max-width:none}          /* hero paragraph: full hero width */
.ex-text, .ml-text, .math-intro, .map-text, .rb-card, .exec-note,
.anim-caption{
  max-width:105ch;
}
@media (min-width:1800px){
  #main{padding-left:88px; padding-right:88px}
}

/* ---- Fix: SVG text labels stay readable over moving objects.
        Halo = stage-ground-coloured stroke painted UNDER the fill. ---- */
.anim-stage svg text,
.exec-robot svg text{
  paint-order:stroke; stroke:#0b0e13; stroke-width:3px;
  stroke-linejoin:round; stroke-linecap:round;
  pointer-events:none; user-select:none;
}
.anim-stage, .exec-robot{position:relative; z-index:var(--z-scene)}
.anim-controls{position:relative; z-index:var(--z-ctrl)}
.anim-caption{position:relative; z-index:var(--z-head)}
.anim-formula{position:relative; z-index:var(--z-panel)}
.anim-state{z-index:var(--z-debug)}

/* ---- Fix: icon control buttons (professional inline SVG, no text) ---- */
.anim-controls{gap:8px}
.ac-btn.ic{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:32px; padding:0; border-radius:8px;
}
.ac-btn.ic svg{width:16px; height:16px; display:block; fill:currentColor}
.ac-btn.ic svg *{vector-effect:non-scaling-stroke}
.ac-btn:focus-visible{
  outline:2px solid var(--anim); outline-offset:2px; z-index:var(--z-focus);
}
.ac-btn.ic[disabled]{opacity:.35; cursor:not-allowed}
.anim-controls .ac-sep{
  width:1px; height:20px; background:var(--border3); margin:0 3px; flex:0 0 auto;
}
.anim-controls .ac-step{
  font-family:var(--ff-mono); font-size:11px; color:var(--anim);
  letter-spacing:.08em; padding:6px 10px; border:1px solid rgba(210,168,255,.28);
  border-radius:7px; background:var(--anim-dim); white-space:nowrap;
}

/* ---- Complete Execution — Code → Debug → Robot (v2 row layout) ----
   Row 1: COMPLETE SOURCE CODE | LIVE DEBUG   (the two walk together)
   Row 2: ROBOT / SYSTEM STATE (full width)
   Then:  complete banner → formula → explanation → controls      */
.exec-sec{margin-top:56px}
.exec-sec .sec-head .exec-sub{
  font-family:var(--ff-mono); font-size:11px; color:var(--faint);
  letter-spacing:.06em; margin-left:auto; padding-right:18px; white-space:nowrap;
}
.exec-note{
  font-family:var(--ff-bn); font-size:14.5px; line-height:1.8; color:var(--muted);
  padding:14px 22px; border-bottom:1px solid var(--border); background:var(--card);
}
.exec-note code{
  font-family:var(--ff-mono); font-size:.86em; color:#9ecbff;
  background:rgba(110,168,254,.10); border:1px solid rgba(110,168,254,.16);
  border-radius:5px; padding:1px 6px;
}
.exec-frame{
  display:grid; gap:14px; padding:16px 18px;
  grid-template-columns:minmax(0,1.42fr) minmax(330px,.72fr);
}
.exec-col{min-width:0; display:flex; flex-direction:column; gap:14px}
.exec-col>.exec-panel{flex:1}
/* robot/system row spans the full frame width, below code+debug */
.exec-col.rob-col{grid-column:1 / -1}
.exec-panel{
  background:var(--code-bg); border:1px solid var(--border2); border-radius:12px;
  overflow:hidden; display:flex; flex-direction:column; min-height:0;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}
/* scroll affordance: right-edge fade says "more code this way" without
   covering anything interactive (head stays above it via z-index) */
.exec-col.code-col .exec-panel{position:relative}
.exec-col.code-col .exec-panel::after{
  content:""; position:absolute; top:0; right:0; bottom:0; width:26px;
  z-index:1; pointer-events:none;
  background:linear-gradient(90deg, rgba(13,17,23,0), #0d1117 92%);
}
.exec-panel-head{
  position:relative; z-index:2;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--code-head); border-bottom:1px solid #20262e; padding:9px 14px;
}
.exec-panel-head .ep-title{
  font-family:var(--ff-title); font-size:13px; font-weight:600; color:#c9d1d9;
  letter-spacing:.01em;
}
.exec-panel-head .ep-chip{
  font-family:var(--ff-mono); font-size:10px; letter-spacing:.05em;
  border-radius:999px; padding:2.5px 9px; white-space:nowrap;
}
.ep-chip.live{color:var(--anim); background:var(--anim-dim); border:1px solid rgba(210,168,255,.3)}
.ep-chip.concept{color:var(--rb); background:var(--rb-dim); border:1px solid rgba(255,180,84,.3)}
.ep-chip.src{color:var(--ex); background:var(--ex-dim); border:1px solid rgba(79,195,247,.3)}
/* kind legend in the code panel head: exec / structural / event */
.exec-legend{
  margin-left:auto; display:inline-flex; align-items:center; gap:5px;
  font-family:var(--ff-mono); font-size:9.5px; color:var(--faint); white-space:nowrap;
}
.exec-legend .lg{
  width:9px; height:9px; border-radius:3px; display:inline-block;
  margin-left:6px;
}
.exec-legend .lg-exec{background:#d2a8ff}
.exec-legend .lg-struct{background:#ffb454}
.exec-legend .lg-event{background:#4fc3f7}
.exec-code{
  position:relative; overflow:auto; flex:1; min-height:0;
  max-height:620px; margin:0; padding:10px 0 28px;
  font-family:var(--ff-mono); font-size:12.3px; line-height:1.6; color:#dbe4ee;
  background:var(--code-bg); tab-size:4;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.exec-code .exl{
  display:block; white-space:pre; min-height:1.6em;
  padding:0 12px 0 0; border-left:3px solid transparent;
  transition:background .2s, border-color .2s;
}
/* line-number gutter stays pinned when long lines scroll horizontally */
.exec-code .eln{
  position:sticky; left:0;
  display:inline-block; width:3.6em; padding-right:10px;
  text-align:right; color:#3d4f63; user-select:none;
  background:var(--code-bg);
}
/* current line, by kind: exec = purple (default), structural = amber,
   event = cyan; grouped companion lines get the tint without the edge */
.exec-code .exl.cur{
  background:rgba(210,168,255,.14); border-left-color:var(--anim);
}
.exec-code .exl.cur .eln{color:var(--anim); background:#241d38}
.exec-code .exl.cur-struct{
  background:rgba(255,180,84,.13); border-left-color:var(--rb);
}
.exec-code .exl.cur-struct .eln{color:var(--rb); background:#2e2416}
.exec-code .exl.cur-event{
  background:rgba(79,195,247,.14); border-left-color:var(--ex);
}
.exec-code .exl.cur-event .eln{color:var(--ex); background:#12283a}
.exec-code .exl.cur-g{background:rgba(210,168,255,.06)}
.exec-code .exl.cur-g.cur-struct{background:rgba(255,180,84,.07)}
.exec-code .exl.cur-g.cur-event{background:rgba(79,195,247,.07)}
/* ---- BEFORE → OPERATION → AFTER debug (#52) ---- */
.exec-op{
  margin:10px 12px 0; padding:8px 12px; border-radius:9px;
  border:1px solid rgba(126,231,135,.32); background:rgba(126,231,135,.07);
  font-family:var(--ff-mono); font-size:11.8px; line-height:1.65; color:#7ee787;
  overflow-wrap:anywhere;
}
.exec-op::before{
  content:"OPERATION";
  display:block; font-size:9px; letter-spacing:.14em; color:#58a65f;
  margin-bottom:3px;
}
.exec-dbg-body{
  padding:10px 14px 14px; overflow:auto; max-height:620px; flex:1; min-height:0;
  font-family:var(--ff-mono); font-size:12px;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.dbg-row{
  display:flex; align-items:baseline; gap:10px; padding:5.5px 8px;
  border-bottom:1px dashed #1c2530; animation:dbgIn .3s ease;
}
.dbg-row:last-child{border-bottom:none}
.dbg-k{color:var(--muted); white-space:nowrap; flex:0 0 auto}
.dbg-v{color:#9ecbff; text-align:right; flex:1; overflow-wrap:anywhere;
  padding-right:2px}
.dbg-v.n{color:#7ee787}
.dbg-v.err{color:var(--bad)}
/* value changed by this line: old (dim) → new (green) */
.dbg-row.chg .dbg-v{color:#7ee787}
.dbg-old{color:#6e7681; text-decoration:line-through;
  text-decoration-color:rgba(110,118,129,.6)}
.dbg-arrow{color:#7ee787; font-weight:600}
.dbg-ill{
  flex:0 0 auto; font-size:9.5px; letter-spacing:.05em; color:var(--rb);
  border:1px solid rgba(255,180,84,.35); border-radius:5px; padding:1px 5px;
}
.dbg-empty{color:var(--faint); font-family:var(--ff-bn); font-size:13px; padding:12px 8px}
@keyframes dbgIn{from{opacity:0; transform:translateX(-4px)}to{opacity:1}}
/* robot row: centered scene, taller than the old side column */
.exec-robot{
  background:
    radial-gradient(500px 220px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  padding:14px; overflow:auto;
  display:flex; justify-content:center;
}
.exec-robot svg{width:100%; max-width:720px; height:auto; max-height:560px;
  display:block; margin:0 auto}
.exec-rob-fade{animation:robFade .4s ease}
@keyframes robFade{from{opacity:0; transform:translateY(4px)}to{opacity:1}}
/* result zone: complete banner → formula row → explanation → controls */
.exec-complete{
  display:none; margin:0 18px 14px; padding:13px 18px; border-radius:11px;
  border:1px solid rgba(63,185,80,.4); background:rgba(63,185,80,.08);
  font-family:var(--ff-mono); font-size:12.5px; letter-spacing:.04em; color:#7ee787;
}
.exec-complete.show{display:block; animation:robFade .4s ease}
.exec-complete .bn{font-family:var(--ff-bn); font-size:14px; color:#c9d1d9;
  letter-spacing:0; margin-top:5px; line-height:1.75}
.exec-fx-row{margin:0 18px 14px; max-width:none}
.exec-sec .anim-caption{margin:0 18px 4px}
.exec-sec .anim-controls{margin:0 18px 18px}
.exec-progress{
  height:3px; margin:0 18px 22px; border-radius:2px; overflow:hidden;
  background:rgba(255,255,255,.06);
}
.exec-progress i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--anim),#7ee787);
  transition:width .3s ease;
}

/* responsive: code+debug share row 1 until 960px, robot row always full
   width; below 960px everything stacks vertically (#59 mobile order) */
@media (max-width:1240px){
  .exec-frame{grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr)}
  .exec-code{max-height:540px}
  .exec-dbg-body{max-height:540px}
}
@media (max-width:960px){
  .exec-frame{grid-template-columns:minmax(0,1fr); padding:12px}
  .exec-code{max-height:430px}
  .exec-dbg-body{max-height:300px}
  .exec-robot svg{max-height:440px}
  .exec-legend{display:none}
}
@media (max-width:560px){
  .exec-sec .sec-head .exec-sub{display:none}
  .exec-frame{padding:10px}
  .anim-controls{padding:11px 14px}
}
@media (prefers-reduced-motion:reduce){
  .exec-rob-fade, .dbg-row{animation:none}
  .exec-code .exl{transition:none}
  .exec-progress i{transition:none}
}

</style>

the AI thinking","    )","","    # --- THE FINAL LIST ---","    # Hand the list of programs back to ROS 2 to start them all at once.","    return LaunchDescription([","        ","        # 1. Start the IMU filter","        # This cleans up the noisy, jittery data coming from the physical IMU chip.","        IncludeLaunchDescription(","            PythonLaunchDescriptionSource(imu_filter_madgwick_launch_file)","        ),","","        # 2. Start the EKF Localization","        # EKF stands for Extended Kalman Filter. This is the \"Math Brain\".","        # It takes the wheel data AND the IMU data and mixes them together to figure out exactly where the robot is on a map.","        IncludeLaunchDescription(","            PythonLaunchDescriptionSource(ekf_odom_launch_file)","        ),","        ","        # 3. Start the patrol AI","        # This program contains a list of waypoints (GPS-like coordinates on your map).","        # It tells the robot: \"Drive to point A, then drive to point B, then turn around and do it again!\"","        patrol,","","    ])"]};
const PARTS = [{"n":1,"id":"part-01","fname":"README.md","enTitle":"Launch & Observation Commands","lang":"bash","start":1,"end":7,"flags":[],"explain":[{"a":1,"b":1,"text":"প্রথম ধাপ, আর এই series-এর প্রতিটি folder-এর মতোই পুরোনো বন্ধু: <code>sh start_agent.sh<\/code> — <code>sh<\/code> মানে shell দিয়ে script চালানো, আর নাম বলছে এটি robot-এর agent-পর্দা তোলে। script-টি নিজে এই folder-এ নেই (এখানে মাত্র দুটি file: patrol.launch.py আর README.md), তাই ভেতরের কাজ আমাদের দৃষ্টির বাইরে। ক্রমটা চুক্তি: আগে agent, তারপর ln 3-এর <code>ros2 launch<\/code>, শেষে দুই দর্শক-চোখ (ln 5, 7)। একটা জিনিস এখনই খেয়াল করো — এই README-তে robot-এর নিজের কোনো প্রোগ্রাম আলাদা <code>ros2 run<\/code>-এ চালানোর লাইন নেই; দুটি <code>ros2 run<\/code>-ই নিছক নজরদারির জানালা। মূল জন্ম একটাই কমান্ডে, পরের লাইনে।"},{"a":3,"b":3,"text":"<code>ros2 launch patrol patrol.launch.py<\/code> — এই app-এর প্রাণ-কমান্ড। তিন টুকরো: <code>launch<\/code> (ROS 2-এর orchestrator), <code>patrol<\/code> (package-র নাম), <code>patrol.launch.py<\/code> (এই 66-line file-টি নিজে)। চাপার পর যা ঘটে তা দুই পর্বে: launch service আগে file-টিকে import করে <code>generate_launch_description<\/code>-কে একবার ডাকে (Part 3) — function-টি দুটি path-string আর একটি Node object বানিয়ে একটি LaunchDescription ফেরত দেয়; তারপর সেই তালিকা ধরে তিনটি প্রোগ্রাম পরপর জন্মায় — IMU filter, তারপর EKF, তারপর patrol (Part 7-8)। মনে গেঁথে নাও: এই file নিজে কিছুই চালায় না, শুধু রেসিপি হাতে ধরিয়ে দেয় — এক কমান্ডে গোটা থিয়েটার দাঁড়ায়।"},{"a":5,"b":5,"text":"<code>ros2 run rqt_reconfigure rqt_reconfigure<\/code> — চলমান node-এর parameter বসে-বসেই বদলানোর GUI। এর সবচেয়ে কাছের আত্মীয় এই app-এ Part 6-এর ln 34-40: launch file-টি patrol node-কে <code>parameters=[...]<\/code> দিয়ে দুটি frame-parameter পাঠায় — <code>base_frame<\/code> আর <code>odom_frame<\/code>। node চালু থাকলে এই টুল তার parameter-তালিকা খুলে দেয়; মান ঘষে বদলালে node সঙ্গে সঙ্গে নতুন মান পায়, robot থামানোর দরকার নেই। সীমাটাও আগেই বুঝে নাও: বদল চলে runtime-এ — patrol.launch.py-র লেখায় এক বিন্দুও আঁকা পড়ে না; পরের launch-এ file-এর মানই আবার ফেরে। চলন্ত robot টিউন করার জানালা এটি।"},{"a":7,"b":7,"text":"শেষ চোখ: <code>ros2 run rqt_graph rqt_graph<\/code> — চালু ROS graph-এর মানচিত্র, কোন node কোন topic-এ কথা বলছে তার নকশা। এই launch-এর ফল এখানেই চোখে পড়বে: এক কমান্ড থেকে জন্মানো <b>তিনটি<\/b> প্রোগ্রাম তিন node হয়ে graph-এ ভাসবে — IMU filter, EKF, আর <code>patrol<\/code> (নামটা আসবে Part 6-এর ln 33-এর <code>name='patrol'<\/code> থেকে)। আর launch file-টি নিজে? graph-এ তার নাম খুঁজে পাবে না — সে কোনো node নয়, রাঁধুনি মাত্র; পদ পাবে না, সন্তানরাই পাবে। EKF যে চাকা আর IMU-র তথ্য মেশায় (Part 7-এর comment বলবে), সেই আদান-প্রদানের রেখাগুলো এই মানচিত্রেই ফুটে উঠবে — পুরো দল এক পাতায়।"}],"math":null,"robot":{"correct":"সঠিক ক্রমে (agent, তারপর launch) চালালে terminal-এ একে একে তিন প্রোগ্রামের উত্থান দেখা যায় — <code>output='screen'<\/code>-এর দরুন patrol-এর নিজের ছাপা সরাসরি এই terminal-এ পড়ে; rqt_graph-এ IMU filter, EKF আর <code>patrol<\/code> তিন node ভেসে ওঠে, rqt_reconfigure-এ patrol-এর frame-parameter দুটি তালিকাভুক্ত হয়। কিছুক্ষণের মধ্যে patrol waypoint-তালিকা ধরে robot-কে A-তে, তারপর B-তে চালাতে শুরু করে।","incorrect":"প্রথম ফাঁদ: <code>ros2 launch<\/code>-কে <code>ros2 run<\/code>-এর মতো ভাবা — launch কোনো executable সরাসরি চালায় না, বরং file-টির <code>generate_launch_description<\/code>-কে একবার ডেকে তালিকা নিয়ে তবে প্রোগ্রাম চালু করে। দ্বিতীয় ফাঁদ: agent বাদ দিয়ে সরাসরি launch দিলে node-রা উঠেও নিচের স্তর না থাকায় চাকা-বাহিনী সাড়া দেবে না। আর <code>rqt_reconfigure<\/code>-এ মান বদলালেই file-এ সেটা লেখা পড়ে গেছে ভাবা — বদল শুধু runtime-এ, পরের launch-এ পুরোনো মানই ফেরে।"},"animType":null},{"n":2,"id":"part-02","fname":"patrol.launch.py","enTitle":"Launch Toolkit — Five Imports & a Banner","lang":"python","start":1,"end":7,"flags":[],"explain":[{"a":1,"b":1,"text":"দরজার ওপরেই সাইনবোর্ড: <code># --- IMPORTING ROS 2 LAUNCH TOOLS ---<\/code> — ড্যাশ-ঘেরা এই banner ঘোষণা করে নিচের ছয় line হাতিয়ার-গোছানোর তাক। কী <i>নেই<\/i>, সেটাই আসল খবর: কোনো shebang-লাইন নেই — দরকারও নেই, কারণ এই file নিজে চালানোর জিনিস নয়, ROS 2-এর launch service একে import করবে; আর কোনো <code>rclpy<\/code>-ও নেই — node বানানোর library এখানে বৃথা, কারণ এই file নিজে কোনো node নয়, শুধু কোন প্রোগ্রামগুলো জন্মাবে তার বর্ণনা সাজাবে। ছয়টি import-ই রান্নাঘরের যন্ত্রপাতি — কোনটা কোন কাজে নামবে, তার ম্যাপ পরের Part-গুলোয়।"},{"a":2,"b":2,"text":"প্রথম হাতিয়ার সবচেয়ে বিনয়ী: <code>import os<\/code> — Python-এর নিজস্ব standard library, ROS-এর কোনো জিনিস নয়। পুরো file-এ এর কাজ ঠিক দুই জায়গায়: ln 14-18 (Part 4) আর ln 22-26 (Part 5)-এর <code>os.path.join<\/code> — দুটি প্রোগ্রামের launch-file path জোড়া লাগানো। খেয়াল করো 'path' শব্দের এখানকার অর্থ ফাইল খোলা নয় — <code>os<\/code>-এর বিশাল ক্ষমতার থেকে এই file কেবল string-জোড়ার সুবিধাটুকু ধার করবে। যে launch file-এ একটি অপ্রয়োজনীয় import-ও বসানো হয়নি, লেখকের গোছানো মেজাজ বোঝা যায় — প্রতিটি নামের পেছনে একটি করে নির্দিষ্ট কাজের চুক্তি।"},{"a":3,"b":3,"text":"<code>from launch import LaunchDescription<\/code> — এই file-এর চূড়ান্ত ফলনের খাম: শুরু করার সব বিষয়ের তালিকা যে ক্লাসে বাঁধা যায়। ব্যবহার হবে মাত্র একবার, একদম শেষে — ln 46-এর <code>return LaunchDescription([<\/code> (Part 7) — যেখানে তিনটি প্রোগ্রাম-অ্যাকশনের তালিকা এই খামে ভরে launch service-এর হাতে ফেরত যাবে। Part 3-এ দেখবে, চুক্তিই এমন: <code>generate_launch_description<\/code>-কে ফেরত দিতে হবে ঠিক এই ক্লাসের একটি object। ওপরের যত কাজ — path-খোঁজা, Node-বানানো — সবের শেষ গন্তব্য এই এক ফেরত-দেওয়া; খাম ছাড়া পুরো চিঠি অর্থহীন।"},{"a":4,"b":4,"text":"<code>from launch_ros.actions import Node<\/code> — সরাসরি একটি প্রোগ্রাম জন্মানোর অ্যাকশন-ক্লাস; launch_ros শাখাটি ROS-নির্দিষ্ট: package আর executable-এর নাম ধরে খুঁজে নিয়ে process চালু করার ভাষা এদের। কাজে নামবে একবারই — ln 30-এর <code>patrol = Node(<\/code> (Part 6), যেখানে package, executable, name, parameters দিয়ে patrol প্রোগ্রামের জন্ম-সনদ লেখা হবে। পরের line-এর <code>IncludeLaunchDescription<\/code>-এর সঙ্গে পার্থক্যটা এখনই মাথায় গাঁথো: Node মানে একটি প্রোগ্রাম, Include মানে আরেকটি পুরো launch file — দুই দরজা, দুই জগৎ; তিন সন্তানের মধ্যে দুই জন্মাবে দ্বিতীয় দরজায়, একজন এই প্রথম দরজায়।"},{"a":5,"b":5,"text":"<code>from launch.actions import IncludeLaunchDescription<\/code> — 'এক launch-এর ভেতরে আরেক launch' চালানোর অ্যাকশন। দুইবার কাজে নামবে, ln 50 আর ln 57-এ (Part 7): IMU filter আর EKF-এর launch file-দুটি এভাবেই ডাকা হবে। কীভাবে কাজ করে এই যন্ত্র? এই file-টিকে launch service যেভাবে import করে তার <code>generate_launch_description<\/code>-কে ডাকে, ঠিক সেই একই আপ্যায়ন ওই দুই file-ও পাবে — তাদের নিজেদের function ডাক পেয়ে তাদের প্রোগ্রাম জন্মাবে। খেয়াল করো এটি <code>Node<\/code> নয়: কোনো package/executable-এর নাম এখানে যায় না, যায় একটি তৈরি-করা path-string (Part 4-5 থেকে)। অর্কেস্ট্রার বাঁশি — এক ফুঁ দিলেই আরেক দল সঙ্গীত শুরু।"},{"a":6,"b":7,"text":"শেষ দুই line, দুই গুরুত্বপূর্ণ দূত। <code>from ament_index_python.packages import get_package_share_directory<\/code> — ament মানে ROS 2-এর বিল্ড-নথির ভাণ্ডার; ফাংশনটি জানায় install-হওয়া কোনো package-র <code>share/<\/code> ফোল্ডার কোথায় বসে আছে। কাজে নামবে দু'বার — <code>'imu_filter_madgwick'<\/code> (Part 4) আর <code>'ekf_bringup'<\/code> (Part 5) খুঁতে। পাশে <code>from launch.launch_description_sources import PythonLaunchDescriptionSource<\/code> — IncludeLaunchDescription-কে বলে দেবে সোর্সটি একটি Python launch file; ব্যবহার ln 51 ও ln 58-এ (Part 7)। ছয়টি নাম, ছয়টি নির্দিষ্ট কাজ — এই তাক থেকেই নিচের পুরো রান্নাঘরের যন্ত্র ধার হবে; একটিরও বাড়তি অস্তিত্ব নেই।"}],"math":null,"robot":{"correct":"<code>ros2 launch<\/code> চাপলে launch service প্রথমে এই file-টিকে module হিসেবে import করে — মানে এই ছয় import-line তখনই চলে যায়, <code>generate_launch_description<\/code>-এর ডাক পড়ার আগেই; LaunchDescription, Node, IncludeLaunchDescription-সহ সব নাম বাঁধা পড়ে বসে থাকে। এই file-এর তরফ থেকে terminal-এ কোনো ছাপ পড়ে না — নীরব গোছানো। এরপরই Part 3-এর function ডাক পায়, আর তার ফেরত-তালিকা থেকে তিন প্রোগ্রামের বার্তা terminal-এ উঠতে শুরু করে।","incorrect":"ROS 2-এর পরিবেশ ছাড়া (workspace source না করা খালি Python-এ) এই file ছোঁয়ামাত্রই <code>ModuleNotFoundError<\/code> — <code>launch<\/code> নামের module পাওয়া যাবে না, robot তো দূরের কথা। আরেকটি প্রচলিত ভ্রান্তি: এখানে <code>rclpy<\/code>-র দৌড় খোঁজা — এই file কোনো node নয়; যে প্রোগ্রাম সত্যিই node হবে (patrol) সে জন্মাবে <code>patrol<\/code> package-র ভেতর থেকে, এই file শুধু তার জন্ম-ঘোষণা লিখবে।"},"animType":null},{"n":3,"id":"part-03","fname":"patrol.launch.py","enTitle":"The Contract — generate_launch_description","lang":"python","start":9,"end":10,"flags":[],"explain":[{"a":9,"b":9,"text":"Comment-টা দাবি নিয়ে এসেছে: <code># Every ROS 2 Python launch file MUST have this exact function.<\/code> — MUST আর exact শব্দদুটো এখানে অলংকার নয়, চুক্তির ভাষা। ROS 2-এর launch service যেকোনো Python launch file-কে import করে তার ভেতর ঠিক এই নামের একটি function খোঁজে; নাম একটু বদলালেই (যেমন <code>make_launch<\/code> লিখলে) file-টি অচল — কেউ ডাকই দেবে না। সাধারণ Python প্রোগ্রামে যেমন <code>main()<\/code> বা <code>if __name__ == '__main__'<\/code> দরজা থাকে, launch-জগতে সেই দরজার নাম ও প্রকৃতি আগে থেকেই নির্ধারিত। পুরো 66 line উল্টে দেখো — পরিচিত সেই দরজা কোথাও নেই; একমাত্র entry point হিসেবে দাঁড়িয়ে পরের line-টি।"},{"a":10,"b":10,"text":"<code>def generate_launch_description():<\/code> — এই app-এর সবচেয়ে গুরুত্বপূর্ণ এক line, গোটা file-টির কেন্দ্রবিন্দু। আর্গুমেন্ট শূন্য, কারণ ডাকনেওয়া launch service নিজে; ফেরত যাবে একটি <code>LaunchDescription<\/code>। এই line-টিই দুই-পর্বের মডেলের কব্জা: <b>পর্ব এক<\/b> — function-টি <b>একবারই<\/b> চলে, ওপর থেকে নিচে: Part 4-5 দুটি path-string বানায়, Part 6 একটি Node object গড়ে, Part 7-8 তালিকা সাজিয়ে return করে। <b>পর্ব দুই<\/b> — launch service ফেরত-পাওয়া তালিকা ধরে তিনটি প্রোগ্রাম চালু করে; এই file-এর কাজ তখন ফুরোয়। কোনো spin নেই, কোনো loop নেই — recipe একবার পড়া হয়, রান্না হয় অন্যত্র। launchCall animation দেখায় ঠিক এই ডাকের মুহূর্তটি।"}],"math":null,"robot":{"correct":"launch service file-টিকে import করে এই function-কে খুঁজে ডাকে — body একবার চলে: দুটি path-string, একটি Node object, একটি LaunchDescription তৈরি হয়ে ফেরত যায়; তালিকা থেকে IMU filter, তারপর EKF, তারপর patrol জন্মায়। এই file-এর ভূমিকা তখন শেষ — সে আর কিছু করে না, robot-এর প্রতিটি নড়াচড়া তিন সন্তান-প্রোগ্রামের হাতে। terminal-এ ওদেরই বার্তা ওঠে, এই file-টির নিজের নাম কোথাও ছাপা হয় না।","incorrect":"এই file-টিকে সরাসরি <code>python3 patrol.launch.py<\/code> দিয়ে চালালে robot চালু হবে ভাবা — হবে না; এখানে function-টি শুধু <i>সংজ্ঞায়<\/i> আছে, কোথাও ডাকা হয়নি, <code>__main__<\/code> guard-ও নেই, তাই import সেরে script চুপচাপ বেরিয়ে আসবে। আরেকটি ভ্রম: function-টি বারবার ঘুরবে ভাবা — ডাক একবারই; ঘুরতে থাকে জন্মানো প্রোগ্রামগুলো। রেসিপি আর রান্না গুলিয়ে ফেললে বাগ খুঁজতে গিয়ে ভুল জায়গায় ঘাঁটবে।"},"animType":"launchCall"},{"n":4,"id":"part-04","fname":"patrol.launch.py","enTitle":"Program 1 Path — ament Index & the IMU Filter","lang":"python","start":12,"end":18,"flags":[],"explain":[{"a":12,"b":13,"text":"ফাংশনের ভেতরে প্রথম অধ্যায়ের দুই সাইনবোর্ড। <code># --- PROGRAM 1: THE IMU FILTER ---<\/code> — তিন প্রোগ্রামের প্রথমজনের নাম-ফলক; নিচের comment কাজ ঘোষণা করে: <code>imu_filter_madgwick<\/code> package-র path <i>খোঁজা<\/i>। ক্রিয়াটা লক্ষ করো — 'চালানো' নয়, 'খোঁজা'; generate_launch_description-এর এই পর্বে কোনো প্রোগ্রাম জন্মায় না, শুধু ঠিকানার হিসাব হয়। IMU filter নিজে কী করে — physical IMU chip থেকে আসা কাঁচা, কাঁপা তথ্য পরিষ্কার করা — সে কথা এই file বলবে অনেক নিচে, Part 7-এর ln 49-এর comment-এ; এখানে পাওয়া যাচ্ছে নাম, আর ঠিকানা-খোঁজার প্রস্তাবনা। দুই comment-ই ৪-স্পেস ইন্ডেন্টে ফাংশন-ভেতরের নাগরিক।"},{"a":14,"b":14,"text":"<code>imu_filter_madgwick_launch_file = os.path.join(<\/code> — বাম পাশের দীর্ঘ নামটিই গন্তব্য: variable-এ জমা হবে এমন একটি string, যেমন <code>.../share/imu_filter_madgwick/launch/imu_filter.launch.py<\/code>। <code>os.path.join<\/code> (Part 2-এর <code>os<\/code>-এর কাছে ধার) টুকরোগুলো <code>/<\/code> দিয়ে জোড়ে — কিন্তু সাবধান, এ নিছক string-রাঁধুনি: ফাইলটি আসলে আছে কিনা join একবারও যাচাই করে না; বানান ভুল হলে ভুল ঠিকানাও নির্বিঘ্নে তৈরি হয়ে যাবে, বিস্ফোরণ পিছিয়ে যাবে Part 7-এর include-মুহূর্ত পর্যন্ত। খোলা বন্ধনী রইল ln 18 পর্যন্ত — মাঝের তিন line এর উপাদান; লম্বা কল-কে ভেঙে সাজানোর এই ভঙ্গিই পাঠযোগ্যতার রহস্য।"},{"a":15,"b":15,"text":"প্রথম উপাদানটিই সবচেয়ে ক্ষমতাধর: <code>get_package_share_directory('imu_filter_madgwick')<\/code> — ament index-কে সরাসরি প্রশ্ন: এই নামের install-হওয়া package-র <code>share/<\/code> ফোল্ডার কোথায়? উত্তর আসে একটি আসল ডিরেক্টরি-পথ। আর package-টি install-ই হয়নি, বা terminal-এ workspace source করা হয়নি — তাহলে এই line-এই <code>PackageNotFoundError<\/code>; কখন মরবে লক্ষ করো: <code>generate_launch_description<\/code> চলার মাঝে, অর্থাৎ একটি প্রোগ্রামও জন্মানোর আগেই পুরো launch-এর মৃত্যু। নামের বানান ln 13-এর comment-এর সঙ্গে হুবহু মিলবে — underscore বা ছোট-বড় হাতের এক ফাঁকেই এই ধারা নেমে আসে।"},{"a":16,"b":18,"text":"বাকি টুকরো দুটি আর পর্দা-নামা: <code>'launch'<\/code> মানে share-ফোল্ডারের ভেতরের launch সাব-ফোল্ডার, আর <code>'imu_filter.launch.py'<\/code> — সেই ফোল্ডারে থাকা IMU filter-এর নিজের launch file, যার নিজস্ব একটি জীবন আছে (নিজের <code>generate_launch_description<\/code>-সহ)। ln 18-এর <code>)<\/code> খোলা join-কে বন্ধ করে string-জন্ম সম্পূর্ণ করে। ফসল এখন <code>imu_filter_madgwick_launch_file<\/code> নামে বাঁধা — খরচ হবে অনেক পরে, Part 7-এর ln 50-52-এ <code>PythonLaunchDescriptionSource<\/code>-এর হাতে। এই ছাঁচ হুবহু ফিরবে ln 22-26-এ (Part 5), শুধু নাম বদলে — <code>ekf_bringup<\/code> আর <code>ekf.launch.py<\/code>; একই যন্ত্র, দ্বিতীয় গ্রাহক।"}],"math":null,"robot":{"correct":"launch-মুহূর্তে এই সাত line একবারই চলে: ament index থেকে <code>imu_filter_madgwick<\/code>-এর share-ফোল্ডার মিলে যায়, join করে তৈরি হয় <code>.../share/imu_filter_madgwick/launch/imu_filter.launch.py<\/code> — string-টি চুপচাপ variable-এ জমে থাকে, terminal-এ এই ধাপের নিজের কোনো ছাপ নেই। এর ফল ফুটবে Part 7-এ: এই পথ ধরেই IMU filter প্রসেস জন্মাবে আর physical IMU chip-এর কাঁচা তথ্য পরিষ্কার করা শুরু হবে।","incorrect":"workspace source না করেই launch দিলে ঠিক এই অংশে <code>PackageNotFoundError<\/code> — IMU, EKF, patrol কেউ জন্মাবে না, robot সম্পূর্ণ চুপ; আর যেহেতু join অস্তিত্ব যাচাই করে না, ফাইলের নামে টাইপো থাকলে এই ধাপ সফল-ই দেখাবে — বোমাটা পিছিয়ে যাবে Part 7-এর include-এ, সেখানে গিয়ে launch ছত্রভঙ্গ হবে। কোথায় ভুল, তা এই আগাম-মৃত্যু আর বিলম্বিত-মৃত্যুর পার্থক্য থেকেই পড়ে নিতে হবে।"},"animType":"sharePath"},{"n":5,"id":"part-05","fname":"patrol.launch.py","enTitle":"Program 2 Path — EKF Localization Lookup","lang":"python","start":20,"end":26,"flags":[],"explain":[{"a":20,"b":21,"text":"<b>দ্বিতীয় অধ্যায়ের সাইনবোর্ড<\/b>: ln 20-এর banner জানিয়ে দিচ্ছে <code>PROGRAM 2: THE EXTENDED KALMAN FILTER (EKF)<\/code>, আর ln 21-এর comment কাজের নির্দেশ — <code>'ekf_bringup'<\/code> package-এর path খোঁজো। তিন প্রোগ্রামের এই দ্বিতীয়জনের চরিত্র আলাদা: IMU filter কাঁচা সেন্সর-ডেটা ধুয়ে দেয়, আর এই EKF হবে অবস্থান-হিসাবের মস্তিষ্ক — ln 55-56-এর comment যাকে 'Math Brain' বলে ডেকেছে, সেই গল্প Part 7-এ। মনে রেখো এই মুহূর্তে কেউ চালু হচ্ছে না; চলছে শুধু ঠিকানা-খোঁজার নাটক — function-টির একবারের দৌড়ের (Part 3) একটি অঙ্ক মাত্র।"},{"a":22,"b":22,"text":"এই line-টি Part 4-এর ln 14-এর হুবহু যমজ — শুধু নাম বদলেছে। এবার variable-এর নাম <code>ekf_odom_launch_file<\/code>; নামের ভেতরের 'ekf_odom' জোড়া লেখকের নিজের টীকা, এই launch file কোন কাজের দরজা সেই ইঙ্গিত বহন করে। <code>os.path.join<\/code> মানে টুকরো-টুকরো path-অংশ জুড়ে একটি পূর্ণ ঠিকানা বানানো; বন্ধনী খোলা হলো, আর্গুমেন্ট তিনটি পরের তিন line-এ সাজবে। আর সময়-হিসাবে মনে রেখো: generate_launch_description() একবারই চলে, তাই এই string-ও তৈরি হবে ঠিক একবার — তারপর নিঃশব্দে বসে থাকবে Part 7-এর <code>PythonLaunchDescriptionSource<\/code>-এর ডাকের অপেক্ষায়।"},{"a":23,"b":23,"text":"প্রথম আর্গুমেন্ট <code>get_package_share_directory('ekf_bringup')<\/code> — ament index-এর হিসাবখাতা ঘেঁটে install-হওয়া package-টির <code>share/<\/code> directory-র পথ ফেরত দেওয়া। Part 4-এ এই একই যন্ত্র 'imu_filter_madgwick'-এর নামে চেয়েছিল পথ; চাবি এবার অন্য নামের, তালা একই। সতর্কতাটাও Part 4-এর শিক্ষা এখানে খাটে: <code>ekf_bringup<\/code> যদি এই মেশিনে install-ই করা না থাকে, তুললেই <code>PackageNotFoundError<\/code> — এবং সেটি ঘটবে generate_launch_description() চলার মধ্যেই, অর্থাৎ launch ব্যর্থ হবে একটি প্রোগ্রামও জন্মানোর আগেই। string-এ অস্তিত্বের কোনো সিলমোহর নেই — নথির এই ফাঁকই প্রথম পাহারা।"},{"a":24,"b":26,"text":"শেষ দুই আর্গুমেন্ট আর বন্ধনীর ডগা: <code>'launch'<\/code> আর <code>'ekf.launch.py'<\/code> — অর্থাৎ ঠিকানা হলো share directory-র ভেতরে launch নামের folder, তার গভীরে ekf.launch.py নামের file। ফলাফল একটি নিছক <b>string<\/b>, যেমন <code>.../share/ekf_bringup/launch/ekf.launch.py<\/code> — Part 4-এর ফর্মুলার সঙ্গে তুলনো: package-নাম আর file-নাম, মাত্র দুই শব্দ বদলেছে, বাকি যন্ত্রপাতি হুবহু এক। আর <code>os.path.join<\/code>-এর প্রকৃতি মনে করো: ফাইলটি আসলে আছে কি নেই কেউ এখানে দেখে না — মিলিয়ে দেখার দায় পড়বে পরে, launch service-এর হাতে, Part 7-এর include আদেশে। এখন শুধু ঠিকানা-কাগজ তৈরি; চিঠি যাবে অনেক পরে।"}],"math":null,"robot":{"correct":"generate_launch_description()-এর একবারের দৌড়ে ln 22-26 একটি পূর্ণ path string বানিয়ে জমা রাখে — ekf_bringup install-থাকলে ফলাফল দাঁড়ায় <code>.../share/ekf_bringup/launch/ekf.launch.py<\/code>-এর মতো একটি ঠিকানা। এই string পরে Part 7-এর include আদেশে কাজে লাগে: launch service ওই file-টি ঠিক এই file-টির মতোই load করে EKF প্রসেস জন্মায় — robot পায় তখন চাকা-IMU মিশ্রিত অবস্থান-সেবা।","incorrect":"ekf_bringup install না থাকলে ln 23-ই মার খায় — get_package_share_directory সঙ্গে সঙ্গে <code>PackageNotFoundError<\/code> তোলে, function-এর দৌড় সেখানেই থেমে যায়; ফলে ros2 launch কমান্ড IMU filter-ও চালু করতে পারে না, terminal-এ শুরুর আগেই traceback — একটি প্রোগ্রামও জন্মায় না। আর ভুল file-নাম দিয়ে string বানালে সমস্যা এখানে ধরা পড়বে না — পড়বে অনেক পরে include চলার সময়।"},"animType":null},{"n":6,"id":"part-06","fname":"patrol.launch.py","enTitle":"Program 3 — patrol Node & Frame Parameters","lang":"python","start":28,"end":42,"flags":[],"explain":[{"a":28,"b":29,"text":"<code># --- PROGRAM 3: THE PATROL NODE ---<\/code> — তৃতীয় অধ্যায়ের ঘোষণা। এবার প্রথম দুই প্রোগ্রামের মতো অন্যের launch file-এর দরজায় টোকা নয়; এবার নিজ হাতে সরাসরি একটি <code>Node<\/code> বানানো হবে — Part 2-এ import-হয়ে অলস বসে থাকা <code>launch_ros.actions.Node<\/code> অবশেষে কাজে নামছে। পরের line-এর comment এই প্রোগ্রামের পরিচয় জোরেশোরে দিচ্ছে: এ হলো 'AI brain', যে মস্তিষ্ক robot-কে নিজে নিজে চালায়। IMU filter সেন্সর-ধোয়ার কাজে, EKF অবস্থান-হিসাবের কাজে — আর এই তৃতীয়জন সেই সব সেবা কিনে চালাবে গাড়ি। তবে এখনও কেউ চালু নয়; আমরা শুধু Node-এর জন্ম-সনদ লিখছি।"},{"a":30,"b":33,"text":"নামের পরে চেহারা: <code>patrol = Node(<\/code> — variable-এর নামই patrol, আর নিচের এক একটি আর্গুমেন্ট এক এক ভূমিকায়। <code>package='patrol'<\/code> বলে কোন package-এ খুঁজবে, <code>executable='patrol'<\/code> বলে সেই package-এর কোন প্রোগ্রাম চালাবে — দুই চাবিতে ঠিক যে কাজটা Part 4-5 বাইরের launch file ধরে করেছিল, এখানে নিজেই করা হচ্ছে। <code>name='patrol'<\/code> ROS 2 network-এ এই node-এর নাম-টিকেট — rqt_graph (README-র ln 7, Part 1) ঠিক এই নামটাই দেখাবে। তিনটি নাম এক হলেও তিন জন আলাদা ব্যক্তিত্ব: কোথায় আছে, কী চালাবে, কার নামে চলবে।"},{"a":34,"b":37,"text":"এবার সবচেয়ে দামি উপহার: <code>parameters=[<\/code> — এই list-টি AI-মস্তিষ্ককে দেওয়া চিরকুটের খাম, আর পরের তিনটি comment চিরকুটের মর্ম ব্যাখ্যা করছে: robot-এর কোন অংশ মাপবে তা বলা হচ্ছে; <code>'base_frame'<\/code> হলো robot-এর কেন্দ্র — <code>base_footprint<\/code>; আর <code>'odom_frame'<\/code> হলো জগতের শুরুবিন্দু — <code>odom<\/code>। এই দুই নাম ROS 2-এর TF জগতের দুই খুঁটি: একটি robot-এর সাথে চলে, অন্যটি মাটিতে গেঁথে থাকে। খেয়াল করো — এই মানগুলো এই file নিজে ব্যবহার করবে না; এগুলো উপহার, গন্তব্য patrol প্রোগ্রাম।"},{"a":38,"b":40,"text":"চিরকুটের ভেতরের দুই লাইনে একটা কৌতূহল-জাগানো ছাপ: মানগুলো <b>দুটি আলাদা single-key dict<\/b>-এ বসেছে — <code>{'base_frame': 'base_footprint'}<\/code> এবং <code>{'odom_frame': 'odom'}<\/code>। ROS 2 চাইলে একটি মিলিত dict-ও নিত (দুই key একসাথে); দুই ভাগ করা এখানে শুধু লেখকের সাজ-পছন্দ, ফল একই। ln 40-এর <code>],<\/code> list-টি বন্ধ করে জানিয়ে দেয় উপহারের পার্সেল গোছানো শেষ। এই দুই নামই পরে patrol-কে বলবে কোন frame থেকে কোন frame-এ তাকাতে হবে — সেই ব্যবহারের গল্প Part 8-এর waypoint-হিসাবে আসবে।"},{"a":41,"b":42,"text":"শেষ আর্গুমেন্ট <code>output='screen'<\/code> — পাশের comment নিজেই ব্যাখ্যা: patrol-এর খরচ সরাসরি আমাদের terminal-এ ছাপা হবে, যাতে AI-এর ভাবনা চোখের সামনে চলে। ln 42-এর <code>)<\/code> দিয়ে Node-নির্মাণ সম্পূর্ণ — কিন্তু সাবধান, <b>এই মুহূর্তে কিছুই চালু হয়নি<\/b>। Python এখন শুধু একটি object বানিয়ে <code>patrol<\/code> নামে তুলে রেখেছে; প্রসেস জন্মাবে অনেক পরে, যখন launch service এই object-কে Part 8-এর list-এ দেখে কাজে নামাবে। রেসিপি লেখা আর রান্না করা — এই file-এর গল্পের সেই বিভাজন এখানে চোখে আঙুল দিয়ে দেখানো যায়।"}],"math":{"intro":"Part 6-এর দুই parameter আসলে দুটি frame-এর নাম — base_frame হিসেবে <code>base_footprint<\/code>, odom_frame হিসেবে <code>odom<\/code>। নিচের স্তরগুলো দেখায় দুই নামের মাঝের সম্পর্ক গাণিতিকভাবে কেমন করে দাঁড়ায়: odom-এ বর্ণনা করা base_footprint-এর ভঙ্গি, অর্থাৎ একটি 2D homogeneous transform। সৎ কথা আগেই বলা যাক — এই matrix কেউ এই file-এ গুণ করে না; এখানে শুধু দুই প্রান্তের নাম পাঠানো হয়েছে, রূপান্তর রান-সময়ে সেবা দেয় ROS 2-এর TF ব্যবস্থা।","levels":[{"label":"Level 1 — robot মানে একটি বিন্দু","latex":"\\[ \\mathbf{p}^{odom} = \\begin{bmatrix} x \\\\ y \\end{bmatrix} \\]","text":"odom frame-কে মূলবিন্দু ধরলে robot-এর কেন্দ্র (base_footprint) ওই জগতে একটি সাধারণ বিন্দু (x, y)। ln 37-এর comment যাকে বলেছে 'starting point of the world' — সেই জগতের ভাষায় robot-এর ঠিকানা এই দুই সংখ্যাই। patrol-এর প্রথম প্রশ্ন তাই দাঁড়ায় একটাই: আমি কোথায় দাঁড়িয়ে আছি?"},{"label":"Level 2 — ভঙ্গি মানে অবস্থান আর মুখ","latex":"\\[ \\mathbf{x} = \\begin{bmatrix} x & y & \\theta \\end{bmatrix}^{T} \\]","text":"শুধু বিন্দু হলে অর্ধেক তথ্য; robot কোন দিকে মুখ করে আছে সেটাও লাগে। 2D-তে পূর্ণ পরিচয় তিন সংখ্যায় — কোথায় (x, y), কোন দিকে (theta)। এই তিন-সংখ্যার ভঙ্গিই EKF-র হিসাবের বিষয় (Part 7), আর patrol-এর স্টিয়ারিং-সিদ্ধান্তের ভিত্তি।"},{"label":"Level 3 — দুই frame-এর সেতু: homogeneous transform","latex":"\\[ T^{odom}_{base} = \\begin{bmatrix} \\cos\\theta & -\\sin\\theta & x \\\\ \\sin\\theta & \\cos\\theta & y \\\\ 0 & 0 & 1 \\end{bmatrix} \\]","text":"frame-দুইয়ের সম্পর্ক একটি 3x3 matrix-এ গাঁথা যায়: উপরের-বাঁয়ের 2x2 অংশ ঘূর্ণন (মুখ theta), ডানের কলাম স্থানান্তর (অবস্থান x, y), নিচের সারি ছাঁচ-মাত্র মাত্র। প্রতীকের নামেই দুই প্রান্ত লেখা — odom আর base_footprint, ঠিক যে দুই নাম ln 38-39 পাঠায়।"},{"label":"Level 4 — এক জগতের মাপ অন্য জগতে","latex":"\\[ \\begin{bmatrix} x^{odom} \\\\ y^{odom} \\\\ 1 \\end{bmatrix} = T^{odom}_{base} \\begin{bmatrix} x^{base} \\\\ y^{base} \\\\ 1 \\end{bmatrix} \\]","text":"robot-এর নিজের (base_footprint) মাপাকাঠিতে মাপা কোনো বিন্দুকে odom-এর মানচিত্র-ভাষায় আনতে হলে একটি matrix-গুণই যথেষ্ট। patrol যখন সামনে কোনো লক্ষ্যের দূরত্ব ভাবে, এই রূপান্তরই তার নিজের-মাপকে জগতের-মাপে তোলে।"},{"label":"Level 5 — পূর্ণ শৃঙ্খল: map, odom, base_footprint","latex":"\\[ T^{map}_{base} = T^{map}_{odom} \\, T^{odom}_{base} \\]","text":"patrol আসলে তিন-frame-এর শৃঙ্খল ধরে চলে — map, odom, base_footprint; আমাদের দুই parameter শৃঙ্খলের শেষ দুই ধাপের নাম। প্রতিটি ধাপ আলাদা matrix, পুরো সম্পর্ক তাদের গুণফল। শেষ সতর্কতা: এই গুণ কেউ এই file-এ করে না — TF ব্যবস্থা রান-সময়ে সব সেবা দেয়; এই file-এর অবদান কেবল নাম-দুটি পাঠানো।"}]},"robot":{"correct":"launch চালালে এই বর্ণনা অনুযায়ী 'patrol' নামে একটি প্রসেস জন্মায় — rqt_graph-এ ঠিক ওই নামের node ফুটে ওঠে; node-টি base_frame আর odom_frame দুই parameter পেয়ে যায়, আর output='screen'-এর দৌতে তার ভাবনা সরাসরি terminal-এ ছাপা হতে থাকে। এই file-এর কাজ কিন্তু সেখানেই শেষ — Node-এর ভেতরের বুদ্ধি পুরো patrol প্রোগ্রামের, চালানোর দায়ও তার।","incorrect":"frame দুটি সোয়াপ করে দিলে (base_frame='odom', odom_frame='base_footprint') launch নির্বিঘ্নে চলবে, error-ও আসবে না — কিন্তু patrol-এর চোখে robot-এর কেন্দ্র আর জগতের শুরু একে অন্যের জামাকাপড় পরে যাবে, সব দূরত্ব-হিসাব অর্থহীন। আরেকটি ভ্রম: launch-এর পরে এই file সম্পাদনা করে parameter বদলানো যাবে ভাবা — মান একবারই patrol-এর হাতে চলে গেছে; চালু অবস্থায় বদলাতে চাইলে rqt_reconfigure (Part 1) লাগবে।"},"animType":"nodeCard"},{"n":7,"id":"part-07","fname":"patrol.launch.py","enTitle":"The Final List I — Two Include Actions","lang":"python","start":44,"end":59,"flags":[],"explain":[{"a":44,"b":46,"text":"<b>সমাপনী অঙ্ক<\/b>: দুই comment সাইনবোর্ড হয়ে ঘোষণা করছে — প্রোগ্রামের চূড়ান্ত list, যা ROS 2-কে ফেরত দিয়ে সবাইকে একসাথে চালু করতে বলা হবে। আর <code>return LaunchDescription([<\/code> — এই একটি শব্দেই পুরো file-এর দর্শনের চাবিকাঠি: generate_launch_description() <b>কিছু চালায় না, ফিরিয়ে দেয়<\/b>। Function-টি একবারই চলে (Part 3), আর এই return-ই তার শেষ কাজ — দুই path string আর এক Node বহনকারী একটি LaunchDescription object হাতে হাতে দিয়ে সে অবসর নেয়। এরপর মঞ্চ launch service-এর: সে list-টি পড়বে ক্রম ধরে, আর এই file-এর দায় সেখানেই সত্যিই শেষ।"},{"a":48,"b":49,"text":"list-এর প্রথম সদস্যের পরিচিতি দেওয়া হলো দুই comment-এ: <code># 1. Start the IMU filter<\/code>, আর পরের line কাজটি বলে — IMU chip থেকে আসা 'noisy, jittery' কাঁচা ডেটা পরিষ্কার করা। সংখ্যা '1.' শুধু গোছানোর অলংকার নয়, ইঙ্গিতও বট: list-এর ক্রমই দাঁড়াবে চালু হওয়ার ক্রম। শারীরিক IMU-র মাপা কাঁপা-কাঁপা সংখ্যা এই প্রোগ্রামের ছাঁকনি না পেরোলে EKF-র কাঁচামালই দূষিত — তাই সবার আগে এই ধোয়া-কাপড়ের দোকান। মনে রেখো, এরা এখনো কেবল মন্তব্য; আসল আদেশ পরের তিন line-এ (ln 50-52)।"},{"a":50,"b":52,"text":"<code>IncludeLaunchDescription(PythonLaunchDescriptionSource(imu_filter_madgwick_launch_file))<\/code> — তিন line-এ দুটি নতুন মুখোশ, দুটোই Part 2-এ import হয়ে অপেক্ষায় ছিল। ভেতরেরটি আগে কাজে নামে: <code>PythonLaunchDescriptionSource<\/code> Part 4-এ বানানো path string-কে একটি launch-file-উৎসে রূপ দেয়। বাইরেরটি তার গায়ে আদেশের মোড়ক: <code>IncludeLaunchDescription<\/code> বলে — এই বর্ণনার ভেতরে আরেকটি পুরো launch file-কে আমন্ত্রণ। এটাই <b>launch-in-launch<\/b>: এই object কোনো Node নয়, একটি নির্দেশমাত্র — launch service পরে imu_filter.launch.py-কে ঠিক এই file-টির মতোই load করবে (তার নিজের generate_launch_description ডেকে), আর IMU filter-এর প্রসেস জন্মাবে।"},{"a":54,"b":56,"text":"দ্বিতীয় সদস্যের তিন comment সমৃদ্ধ পরিচয়পত্র: এটি EKF Localization — Extended Kalman Filter, source নিজেই যাকে ডেকেছে 'Math Brain'। কাজের বয়ানও ওখানেই: wheel-এর ডেটা <b>আর<\/b> IMU-র ডেটা একসাথে মিশিয়ে মানচিত্রে robot-এর অবস্থান বের করা। চাকা একা হলে স্লিপ-পিছলানিতে হিসাব বেঁকে যায়, IMU একা হলে কাঁপা ছাড়া অবস্থান জানেই না — দুজনের মিলনেই বিশ্বাসযোগ্য অবস্থান। এই মিশ্রণের গণিত এই file-এর নয়; নিচের math-অংশে সেটি দেখব কেবল ধারণাগতভাবে — আসল হিসাব বাস করে ekf_bringup package-এ, যার ঠিকানা Part 5-এ বাঁধা।"},{"a":57,"b":59,"text":"তৃতীয় প্রোগ্রামের দরজা হুবহু একই ছাঁচে: <code>IncludeLaunchDescription(PythonLaunchDescriptionSource(ekf_odom_launch_file))<\/code> — Part 5-এ বানানো path string এবার উৎস হয়ে include-আদেশে বসল। ln 50-52-এর সঙ্গে পার্থক্য কেবল variable-এর নামে; যন্ত্র এক, তাই আবার পুরো ব্যাখ্যা নয়। নতুন খবর হলো <b>ক্রম<\/b>: IMU filter আগে, EKF পরে — list-এর এই সাজের কারণ পরিষ্কার, EKF-র কাঁচামাল (পরিষ্কার IMU স্রোত) আগে দাঁড়িয়ে থাকুক। দুই সদস্য এখন নথিভুক্ত; বাকি তৃতীয়জন — সেই গল্প পরের Part-এ।"}],"math":{"intro":"এই অংশের গণিত সম্পূর্ণ <b>ধারণাগত<\/b> — predict/update আর Kalman gain-এর আসল হিসাব চলে বাইরের ekf_bringup package-এ; এই file-এর কাজ কেবল ln 57-59-এ সেই প্রোগ্রামকে চালু করা। উদ্দেশ্য একটাই: ln 55-56-এর comment ('takes the wheel data AND the IMU data and mixes them together') যে কাজের কথা বলছে, সেই কাজের আদলটুকু বোঝা — চশমা এখানে, চোখ অন্য গ্রামে।","levels":[{"label":"Level 1 — EKF-র সন্ধানী বিষয়: ভঙ্গি","latex":"\\[ \\mathbf{x} = \\begin{bmatrix} x \\\\ y \\\\ \\theta \\end{bmatrix} \\]","text":"অবস্থান (x, y) আর মুখ (theta) — এই তিন সংখ্যাই EKF-র খোঁজার বস্তু, আর সব হিসাব আমাদের odom_frame parameter-এর জগতে। ধারণাগত শুরু এখানেই: প্রশ্ন 'robot এখন কোথায়, কোন দিকে তাকিয়ে?'"},{"label":"Level 2 — predict: চাকা আর IMU দিয়ে অনুমান এগোনো","latex":"\\[ \\mathbf{x}_{k|k-1} = f(\\mathbf{x}_{k-1},\\, \\mathbf{u}_{k}), \\qquad \\mathbf{u}_{k} = \\begin{bmatrix} v_{wheel} & \\omega_{IMU} \\end{bmatrix}^{T} \\]","text":"চাকার গতি আর IMU-র ঘূর্ণন-হার মিলে সময়ের এক ধাপ এগিয়ে ভঙ্গির অনুমান দাঁড়ায় — এই মডেলে sin আর cos বসে বলেই সম্পর্কটি সরলরেখায় নয় (Level 5 দেখো)। মনে রেখো, এই অনুমান সস্তা কিন্তু পুরোনো ভুল বয়ে বেড়ায়।"},{"label":"Level 3 — সন্দেহের হিসাব: covariance","latex":"\\[ P_{k|k-1} = F\\, P_{k-1}\\, F^{T} + Q \\]","text":"প্রতিটি অনুমানের সঙ্গে ঘুরে একটি সন্দেহের মাপ P; predict করলে সন্দেহ বাড়ে — Q হলো মডেল-নয়েজের ভাতা। চাকা স্লিপ করলে Q বড়, সন্দেহও বড়; এই বাড়তি সন্দেহই পরে মাপাকে মূল্য দিতে শেখায়।"},{"label":"Level 4 — update: Kalman gain আর সংশোধন","latex":"\\[ K = P_{k|k-1} H^{T} \\left( H P_{k|k-1} H^{T} + R \\right)^{-1}, \\qquad \\mathbf{x}_{k} = \\mathbf{x}_{k|k-1} + K \\left( \\mathbf{z}_{k} - h(\\mathbf{x}_{k|k-1}) \\right) \\]","text":"নতুন মাপ z এলে বাকি অঙ্ক: K ঠিক করে মাপ কতটা বিশ্বাস পাবে বনাম অনুমান — সেন্সর কাঁপা মানে R বড়, K ছোট, মাপের দাম কমে। z আর অনুমানের ফার্ক যতটা সঠিক অনুপাতে ভাগ হয়, ভঙ্গি ততটা শুদ্ধ হয় — এই ভাগের বাঁটনিদার K।"},{"label":"Level 5 — কেন 'Extended', আর কোথায় চলে","latex":"\\[ F = \\frac{\\partial f}{\\partial \\mathbf{x}}, \\qquad H = \\frac{\\partial h}{\\partial \\mathbf{x}} \\]","text":"সরল Kalman filter সোজা রেখার জগতের সন্তান; এখানে f আর h বাঁকা (nonlinear), তাই তাদের ঢালু — Jacobian F আর H — ধরে হিসাব চালানো হয়, নামের 'Extended' শব্দের জন্ম এখানেই। আর স্মরণ: এই পুরো যন্ত্র ঘোরে ekf_bringup-এর ভেতরে; এই file-এর অবদান শুধু একটি include-আদেশ।"}]},"robot":{"correct":"phase 2-তে launch service এই list পড়ে প্রথমে imu_filter.launch.py-এর দরজা ধরে — সেখানেও একই নিয়মে তার generate_launch_description ডাক পড়ে, IMU filter প্রসেস জন্মায়; তারপর ekf.launch.py একই পথে EKF চালু করে। ফলে কাঁপা কাঁচা IMU মাপ আগে ছেঁকে সেই পরিষ্কার স্রোত EKF পায়, আর EKF চাকা-IMU মিশ্রিত অবস্থান হিসাবতে থাকে। এই file ততক্ষণে কাজ শেষ করে অবসর নিয়েছে — terminal-এ চলতে থাকে launch-এর নিজের প্রতিবেদন।","incorrect":"এই অংশের নিজের হাতে কিছু চালু হয়ে যায় ভাবা — এখানে কেবল বর্ণনা তৈরি হয়, object-গুলো জন্মায় generate_launch_description()-এর একবারের দৌড়ে; প্রসেস আসে অনেক পরে। আর ক্রম নিয়ে ভুল বিপদজনক: EKF-কে যদি IMU filter-এর আগে সাজানো হতো, চালু হওয়ার মুহূর্তে EKF এখনো-না-ছেঁকে কাঁপা IMU ডেটাই গিলত — শুরুর অবস্থান-হিসাব দূষিত হয়ে যেতে পারত।"},"animType":"ekfFusion"},{"n":8,"id":"part-08","fname":"patrol.launch.py","enTitle":"The Final List II — patrol AI & Waypoint Loop","lang":"python","start":61,"end":66,"flags":[],"explain":[{"a":61,"b":61,"text":"তৃতীয় আর শেষ সদস্যের সাইনবোর্ড: <code># 3. Start the patrol AI<\/code> — সংখ্যাটি আবারও শুধু সাজানোর নয়; list-এর তৃতীয় স্থান মানেই তৃতীয় প্রোগ্রাম। Part 6-এ যে Node object এত যত্নে সাজানো হয়েছিল (package, executable, name, দুই frame parameter, output) — তার ডাক এখানে এসে পড়ল। IMU filter সেন্সর-ধোয়া, EKF অবস্থান-হিসাব — দুই সহায়ক সেবা তখন তালিকায় আগেই দাঁড়িয়ে; এবার বসল সেই মস্তিষ্ক, যে এই সেবাগুলো ধার করে গাড়ি চালাবে। ক্রমের ইঙ্গিতও স্পষ্ট: localization প্রস্তুত হওয়ার পরেই চালকের জন্ম।"},{"a":62,"b":63,"text":"দুই comment এই প্রোগ্রামের কাজের খসড়া: ভেতরে waypoint-দের একটি list — source-এর ভাষায় 'GPS-like coordinates on your map'; আর নির্দেশ — 'Drive to point A, then drive to point B, then turn around and do it again!'। মানে গন্তব্য দুটি বিন্দু, কাজ একটি চক্র: A, তারপর B, তারপর ঘুরে আবার শুরু — রক্ষীর পাহারা-চক্রের মতো অনন্ত। এই বিন্দুগুলো বোঝানো odom frame-এর জগতে, আর robot নিজে base_footprint — দুই জগত মেলানোর চাবিই Part 6-এ পাঠানো দুই parameter। waypoint-এর আসল হিসাব patrol package-এর ভেতরের; এখানে কেবল স্বপ্নের নকশা।"},{"a":64,"b":64,"text":"এক শব্দের line, সম্ভবত পুরো file-এর সবচেয়ে ছোট অথচ সবচেয়ে ভারী entry: <code>patrol,<\/code>। এটি নতুন কিছু বানায় না — Part 6-এর ln 30-42-এ যে Node object তৈরি হয়ে <code>patrol<\/code> নামে বসে ছিল, সেই <b>একই object-এর reference<\/b> এখানে list-এ বসল; দ্বিতীয়বার কোনো নির্মাণ নেই, কোনো কপি নেই। ঠিক যেমন দুই path string আগে বানিয়ে রাখা হয়েছিল আর list-এ শুধু নাম ধরা হয়েছে — এই file-এর পুরো স্থাপত্যের স্বরূপ এটাই: আগে তৈরি করো, শেষে return /* ---------------- utilities ---------------- */
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const pad2 = n => String(n).padStart(2, '0');

/* ---------------- syntax highlighting (presentation-only) --------
   A single-pass scanner over the RAW line that groups characters into
   tokens and only afterwards escapes them. The underlying text is
   never altered — spans are purely cosmetic.                        */
const PY_KW = new Set(['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield']);
const PY_BLT = new Set(['print','input','range','float','int','str','len','open','sorted','super','set','list','dict','type','abs','min','max','round','enumerate','isinstance','self']);
const SH_KW = new Set(['if','then','else','elif','fi','for','while','do','done','case','esac','function','export','return','in','local']);
const SH_CMD = new Set(['docker','ros2','gnome-terminal','bash','sh','python3','sleep','source','export','echo','cat','run','launch','pub','topic','start','stop','exec']);

function tokenizeLine(line, lang) {
  if (lang === 'text') return line === '' ? [] : [{ t: line, c: '' }];
  const toks = [];
  const push = (t, c) => { if (t) toks.push({ t: t, c: c }); };
  let i = 0;
  const n = line.length;
  while (i < n) {
    const c = line[i];
    if (c === '#') { push(line.slice(i), 'com'); break; }
    if (c === '\'' || c === '"') {
      let j = i + 1;
      while (j < n && line[j] !== c) j++;
      const end = Math.min(j + 1, n);
      push(line.slice(i, end), 'str');
      i = end; continue;
    }
    if (/[0-9]/.test(c) && !(i > 0 && /[A-Za-z0-9_]/.test(line[i - 1]))) {
      let j = i;
      while (j < n && /[0-9a-fA-FxXoObB._]/.test(line[j])) j++;
      push(line.slice(i, j), 'num');
      i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const word = line.slice(i, j);
      if (/^[fFrRbBuU]{1,2}$/.test(word) && j < n && (line[j] === '\'' || line[j] === '"')) {
        const q = line[j];
        let k = j + 1;
        while (k < n && line[k] !== q) k++;
        const end = Math.min(k + 1, n);
        push(line.slice(i, end), 'str');
        i = end; continue;
      }
      let cls = '';
      const KW = lang === 'python' ? PY_KW : SH_KW;
      const BLT = lang === 'python' ? PY_BLT : SH_CMD;
      if (KW.has(word)) cls = 'kw';
      else if (BLT.has(word)) cls = 'blt';
      else if (lang === 'python' && j < n && line[j] === '(') cls = 'fn';
      push(word, cls);
      i = j; continue;
    }
    let j = i;
    while (j < n && !/[#'"0-9A-Za-z_]/.test(line[j])) j++;
    if (j === i) j = i + 1;
    push(line.slice(i, j), '');
    i = j;
  }
  return toks;
}
function hl(line, lang) {
  if (line === '') return '';
  return tokenizeLine(line, lang).map(t =>

/* ================================================================
   ANIMATION SYSTEM
   Engine: cancellable, speed-scaled, pause-aware rAF scheduler.
   Every animation renders inline SVG, updates a live Bangla caption
   and a live formula bar. No animation libraries are used.
   ================================================================ */

const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBounce = t => {
  const n1 = 7.5625, d1 = 2.75;
  if (t < 1 / d1) return n1 * t * t;
  if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + .75;
  if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + .9375;
  return n1 * (t -= 2.625 / d1) * t + .984375;
};
const fmt = (v, d) => Number(v).toFixed(d === undefined ? 3 : d);

/* ---------------- small SVG string helpers ---------------- */
function rrect(x, y, w, h, rx, fill, stroke, extra) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
    '" rx="' + (rx === undefined ? 8 : rx) + '" fill="' + fill + '"' +
    (stroke ? ' stroke="' + stroke + '" stroke-width="1"' : '') +
    (extra || '') + '/>';
}
function txt(x, y, s, o) {
  o = o || {};
  return '<text' + (o.id ? ' id="' + o.id + '"' : '') + ' x="' + x + '" y="' + y + '" fill="' + (o.fill || '#c9d1d9') +
    '" font-size="' + (o.size || 13) + '"' +
    ' font-family="' + (o.mono ? "'JetBrains Mono',monospace" : "'Hind Siliguri','Inter',sans-serif") + '"' +
    (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') +
    (o.weight ? ' font-weight="' + o.weight + '"' : '') +
    (o.op !== undefined ? ' opacity="' + o.op + '"' : '') + '>' + s + '</text>';
}
function line(x1, y1, x2, y2, stroke, w, extra) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
    '" stroke="' + stroke + '" stroke-width="' + (w || 1.5) + '"' +
    (extra || '') + '/>';
}
function circ(x, y, r, fill, extra) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill + '"' + (extra || '') + '/>';
}
function arrow(x1, y1, x2, y2, color, marker, w) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
    '" stroke="' + color + '" stroke-width="' + (w || 2) +
    '" marker-end="url(#' + marker + ')"' + '/>';
}
function path(d, stroke, w, extra) {
  return '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '/>';
}

/* ---------------- host ---------------- */
function createAnimHost(part) {
  const id = part.id;
  const host = {
    part: part,
    stageEl: document.getElementById('stage-' + id),
    capEl: document.getElementById('cap-' + id),
    fxEl: document.getElementById('fx-' + id),
    stateEl: document.getElementById('state-' + id),
    secEl: document.getElementById('anim-' + id),
    speed: 1, running: false, stopFlag: false, started: false,
    staticOnly: false, inView: false, autoPaused: false, userPaused: false,
    _raf: null
  };
  host.setStage = function (inner, w, h) {
    host.stageEl.innerHTML = '<svg viewBox="0 0 ' + (w || 900) + ' ' + (h || 460) +
      '" preserveAspectRatio="xMidYMid meet" role="img">' + inner + '</svg>';
    return host.stageEl.querySelector('svg');
  };
  host.caption = t => { host.capEl.innerHTML = t; };
  host.formula = t => { host.fxEl.innerHTML = t; };
  host.setState = t => { host.stateEl.textContent = t; };
  host._sched = function (dur, onFrame) {
    return new Promise((res, rej) => {
      let elapsed = 0, last = null;
      const step = t => {
        if (host.stopFlag) { rej(new Error('anim-stopped')); return; }
        if (!host.running) { last = null; host._raf = requestAnimationFrame(step); return; }
        if (last === null) last = t;
        elapsed += t - last; last = t;
        const k = Math.min(1, elapsed / (dur / host.speed));
        try { onFrame(k, elapsed); } catch (e) { rej(e); return; }
        if (k >= 1) { res(); return; }
        host._raf = requestAnimationFrame(step);
      };
      host._raf = requestAnimationFrame(step);
    });
  };
  host.sleep = ms => host._sched(ms, () => {});
  host.tween = (dur, fn) => host._sched(dur, k => fn(k));
  host.start = function (speed) {
    if (speed) host.speed = speed;
    if (host.started) { host.stopFlag = true; }
    host.started = true; host.stopFlag = false; host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
    setTimeout(() => {
      ANIMS[part.animType](host).catch(e => {
        if (e && e.message === 'anim-stopped') host.setState('STOPPED');
        else console.error('anim error', part.id, e);
      });
    }, 30);
  };
  host.pause = function () {
    if (!host.started) return;
    host.running = false; host.userPaused = true;
    host.setState('PAUSED');
  };
  host.resume = function () {
    if (!host.started || !host.userPaused) return;
    host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
  };
  host.stop = function () {
    host.stopFlag = true; host.running = false; host.started = false; host.userPaused = false;
    if (host._raf) cancelAnimationFrame(host._raf);
    host.setState('IDLE');
    host.renderStatic();
  };
  host.renderStatic = function () {
    host.staticOnly = true;
    try { ANIMS[part.animType](host); } catch (e) { /* static render is best-effort */ }
    host.staticOnly = false;
  };
  host.setSpeed = function (s) {
    host.speed = s;
    if (!host.started) { host.start(s); return; }
    if (host.userPaused) { host.running = true; host.userPaused = false; }
    host.setState('RUN ' + s + 'x');
  };
  /* controls */
  host.secEl.querySelectorAll('.ac-btn').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.ac;
      host.secEl.querySelectorAll('.ac-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if (a === 'play') host.userPaused ? host.resume() : host.start(1);
      else if (a === 'slow') host.setSpeed(0.5);
      else if (a === 'fast') host.setSpeed(1.5);
      else if (a === 'pause') host.pause();
      else if (a === 'stop') { host.stop(); b.classList.remove('active'); }
    });
  });
  /* auto start / auto pause with visibility */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      host.inView = en.isIntersecting;
      if (en.isIntersecting) {
        if (host.autoPaused && host.started) {
          host.running = true; host.autoPaused = false; host.setState('RUN ' + host.speed + 'x');
        } else if (!host.started && !host.autoStarted && !window.__prefersReducedMotion) {
          host.autoStarted = true; host.start(1);
        }
      } else if (host.started && host.running) {
        host.running = false; host.autoPaused = true; host.setState('HOLD');
      }
    });
  }, { threshold: 0.25 });
  io.observe(host.secEl);
  return host;
}

const ANIMS = {};
const HOSTS = {};

function setupAnimations() {
  window.__prefersReducedMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  PARTS.forEach(p => {
    if (p.animType && ANIMS[p.animType]) {
      HOSTS[p.id] = createAnimHost(p);
      HOSTS[p.id].renderStatic();
    }
  });
}

  /* ---------- 1. retrofit existing animation control bars ---------- */
  function retrofitControls() {
    if (typeof HOSTS === 'undefined') return;
    document.querySelectorAll('.anim-controls').forEach(function (bar) {
      try {
        var sec = bar.closest('.sec-anim');
        if (!sec || !sec.id) return;
        var pid = sec.id.replace(/^anim-/, '');
        var host = HOSTS[pid];
        if (!host) return;
        bar.querySelectorAll('.ac-btn').forEach(function (n) { n.remove(); });
        bar.insertAdjacentHTML('afterbegin', iconRow());
        bar.querySelectorAll('.ac-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            var a = b.dataset.ac;
            setActive(bar, a === 'stop' ? null : b);
            if (a === 'play') { host.userPaused ? host.resume() : host.start(1); }
            else if (a === 'slow') { host.setSpeed(0.5); }
            else if (a === 'fast') { host.setSpeed(1.5); }
            else if (a === 'pause') { host.pause(); }
            else if (a === 'stop') { host.stop(); }
          });
        });
      } catch (e) { console.error('control retrofit failed', e); }
    });
  }
