<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02. joystick controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#0a0a0a; --bg2:#111111;
  --card:#151515; --card2:#181818; --card3:#1d1d1d;
  --border:#262626; --border2:#303030; --border3:#3a3a3a;
  --text:#e8e8e8; --muted:#a0a0a0; --faint:#6e6e6e;
  --ex:#4fc3f7; --ex-dim:rgba(79,195,247,.09);
  --math:#7ee787; --math-dim:rgba(126,231,135,.08);
  --rb:#ffb454; --rb-dim:rgba(255,180,84,.08);
  --anim:#d2a8ff; --anim-dim:rgba(210,168,255,.08);
  --code-bg:#0d1117; --code-head:#161b22;
  --gutter-txt:#3d4f63; --gutter-line:#1c2530;
  --ok:#3fb950; --bad:#f85149;
  --ff-title:'Space Grotesk','Inter','Hind Siliguri',sans-serif;
  --ff-ui:'Inter','Hind Siliguri',system-ui,-apple-system,sans-serif;
  --ff-bn:'Hind Siliguri','Inter',sans-serif;
  --ff-mono:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --sb-w:292px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--ff-ui); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(79,195,247,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a}
a{color:var(--ex);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ex);outline-offset:2px;border-radius:4px}
button{font-family:var(--ff-ui)}

/* ============ APP LAYOUT ============ */
#app{display:flex;min-height:100vh}
#main{
  margin-left:var(--sb-w);
  flex:1;
  min-width:0;
  padding:52px 56px 80px;
  max-width:1180px;
}
.intro-banner{
  margin-bottom:48px;padding:30px 34px;
  background:linear-gradient(145deg,#141414,#101010);
  border:1px solid var(--border);border-radius:16px;
  position:relative;overflow:hidden;
}
.intro-banner::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(600px 180px at 12% 0%,rgba(79,195,247,.07),transparent 60%),
    radial-gradient(500px 160px at 88% 100%,rgba(210,168,255,.05),transparent 60%);
  pointer-events:none;
}
.intro-eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ex);margin-bottom:10px;
}
.intro-banner h1{
  font-family:var(--ff-title);font-size:clamp(26px,3.4vw,38px);
  font-weight:700;letter-spacing:-.01em;line-height:1.15;
}
.intro-banner h1 .path{color:var(--faint);font-weight:500}
.intro-desc{margin-top:12px;color:var(--muted);max-width:70ch;font-size:15px}
.intro-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stat-chip{
  font-family:var(--ff-mono);font-size:12px;color:#c9d1d9;
  background:#0d1117;border:1px solid var(--border2);
  padding:6px 12px;border-radius:999px;
}
.stat-chip b{color:var(--ex);font-weight:600}

/* ============ SIDEBAR ============ */
#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);
  background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;z-index:60;
  display:flex;flex-direction:column;
}
.sb-head{
  padding:26px 22px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg2);z-index:2;
}
.sb-folder{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;
  color:var(--text);letter-spacing:-.01em;line-height:1.3;
}
.sb-meta{
  margin-top:6px;font-family:var(--ff-mono);font-size:11.5px;
  color:var(--faint);letter-spacing:.08em;
}
#sb-nav{padding:14px 12px 30px;flex:1}
.sb-item{
  display:flex;align-items:baseline;gap:11px;
  padding:8px 12px;margin:1px 0;border-radius:8px;
  color:#9a9a9a;border-left:2px solid transparent;
  transition:background .18s,color .18s;
}
.sb-item .sb-num{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  min-width:20px;font-weight:500;
}
.sb-item .sb-name{
  font-size:13.2px;font-weight:500;line-height:1.35;
  font-family:var(--ff-ui);
}
.sb-item:hover{background:#181818;color:#d6d6d6;text-decoration:none}
.sb-item.active{
  background:linear-gradient(90deg,rgba(79,195,247,.10),rgba(79,195,247,.02));
  color:#eaf6fe;border-left:2px solid var(--ex);
}
.sb-item.active .sb-num{color:var(--ex)}
.sb-filesep{
  font-family:var(--ff-mono);font-size:10px;letter-spacing:.16em;
  color:#525252;text-transform:uppercase;
  padding:14px 12px 6px;margin-top:4px;
}
#menu-btn{
  display:none;position:fixed;top:14px;left:14px;z-index:80;
  width:42px;height:42px;border-radius:10px;
  background:#181818;border:1px solid var(--border2);color:var(--text);
  font-size:15px;cursor:pointer;line-height:1;
  align-items:center;justify-content:center;padding:0;
}
#sb-overlay{display:none}

/* ============ PART SECTION ============ */
.part{margin-bottom:88px;scroll-margin-top:24px}
.part-head{margin-bottom:22px}
.eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ex);margin-bottom:8px;
}
.part-title{
  font-family:var(--ff-title);font-size:clamp(23px,2.6vw,31px);
  font-weight:700;letter-spacing:-.015em;line-height:1.18;
  margin-bottom:12px;
}
.part-meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-family:var(--ff-mono);font-size:12px;color:var(--muted);
}
.meta-chip{
  background:#101418;border:1px solid var(--border2);
  padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.meta-chip.flag{color:#d8c97a;border-color:#3a3524;background:#17150d}
.meta-chip.lang{color:#8ab4f8}

/* ============ CODE CARD ============ */
.code-card{
  background:var(--code-bg);border:1px solid var(--border2);
  border-radius:13px;overflow:hidden;margin-bottom:30px;
  box-shadow:0 14px 40px rgba(0,0,0,.42);
}
.code-card-head{
  display:flex;align-items:center;gap:14px;
  background:var(--code-head);border-bottom:1px solid #20262e;
  padding:10px 16px;
}
.dots{display:flex;gap:7px;align-items:center}
.dots i{
  width:11px;height:11px;border-radius:50%;display:block;
}
.dots i:nth-child(1){background:#ff5f57}
.dots i:nth-child(2){background:#febc2e}
.dots i:nth-child(3){background:#28c840}
.code-fname{
  font-family:var(--ff-mono);font-size:12.5px;color:#9aa7b4;
  letter-spacing:.02em;
}
.code-lines-chip{
  font-family:var(--ff-mono);font-size:11px;color:#5b6875;
  margin-left:auto;white-space:nowrap;
}
.copy-btn{
  font-family:var(--ff-mono);font-size:11px;letter-spacing:.06em;
  color:#9aa7b4;background:#1c2128;border:1px solid #2d333b;
  border-radius:6px;padding:4px 11px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.copy-btn:hover{color:#e6edf3;border-color:#444c56}
.copy-btn.done{color:var(--ok);border-color:rgba(63,185,80,.4)}
.code-scroll{overflow-x:auto;max-height:640px;overflow-y:auto}
pre.code{display:inline-block;min-width:100%;padding:14px 0;font-family:var(--ff-mono)}
.cl{display:flex;white-space:pre;font-size:13.2px;line-height:1.62}
.cln{
  position:sticky;left:0;flex:0 0 auto;z-index:2;
  min-width:52px;text-align:right;padding-right:16px;
  color:var(--gutter-txt);background:var(--code-bg);
  border-right:1px solid var(--gutter-line);
  user-select:none;-webkit-user-select:none;font-size:11.5px;
  line-height:1.85;letter-spacing:.02em;
}
.cl.target .cln{
  background:#101722;color:#7ba3c9;border-right-color:#234;
}
.clc{flex:0 0 auto;padding-right:24px;tab-size:8;color:#e6edf3}
.tok-kw{color:#ff7b72}
.tok-str{color:#a5d6ff}
.tok-com{color:#8b949e;font-style:italic}
.tok-num{color:#79c0ff}
.tok-fn{color:#d2a8ff}
.tok-blt{color:#ffa657}

/* ============ SECTIONS ============ */
.sec{
  border:1px solid var(--border);border-radius:13px;
  background:var(--card);margin-bottom:26px;overflow:hidden;
}
.sec-head{
  display:flex;align-items:center;gap:12px;
  padding:15px 22px;border-bottom:1px solid var(--border);
  background:var(--card2);
}
.badge{
  font-family:var(--ff-mono);font-weight:700;font-size:12px;
  min-width:34px;height:26px;border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;
  letter-spacing:.03em;flex:0 0 auto;
}
.badge-ex{background:var(--ex-dim);color:var(--ex);border:1px solid rgba(79,195,247,.35)}
.badge-math{background:var(--math-dim);color:var(--math);border:1px solid rgba(126,231,135,.35)}
.badge-rb{background:var(--rb-dim);color:var(--rb);border:1px solid rgba(255,180,84,.35)}
.badge-anim{background:var(--anim-dim);color:var(--anim);border:1px solid rgba(210,168,255,.35)}
.sec-head h3{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;letter-spacing:-.01em;
}
.sec-head h3 .bn-inline{font-family:var(--ff-bn)}
.sec-body{padding:20px 22px 24px}

/* ============ EXPLAIN ENTRIES ============ */
.ex-entry{margin-bottom:26px}
.ex-entry:last-child{margin-bottom:6px}
.ex-snippet{
  background:#0d1117;border:1px solid var(--border2);border-left:3px solid var(--ex);
  border-radius:9px;overflow:hidden;
}
.ex-snippet pre{
  padding:10px 16px;font-family:var(--ff-mono);font-size:12.8px;
  line-height:1.62;color:#dbe4ee;overflow-x:auto;white-space:pre;
}
.ex-lines{
  display:inline-block;font-family:var(--ff-mono);font-size:10.5px;
  color:var(--ex);background:var(--ex-dim);border:1px solid rgba(79,195,247,.3);
  border-radius:5px;padding:1px 8px;margin-bottom:7px;letter-spacing:.06em;
}
.ex-arrow{
  color:#3a471f;font-family:var(--ff-mono);font-size:15px;color:var(--faint);
  padding:3px 2px 3px 12px;
}
.ex-text{
  font-family:var(--ff-bn);font-size:16px;line-height:1.95;color:#d5d5d5;
  padding:2px 4px 0 14px;border-left:2px solid #232d36;
}
.ex-text code, .bn code, .ml-text code, .map-text code, .rb-card code, .anim-caption code{
  font-family:var(--ff-mono);font-size:.86em;color:#9ecbff;
  background:rgba(110,168,254,.10);border:1px solid rgba(110,168,254,.16);
  border-radius:5px;padding:1px 6px;white-space:nowrap;
}
.ex-text ul, .ml-text ul, .rb-card ul, .anim-caption ul{
  margin:8px 0 4px 4px;padding-left:22px;
}
.ex-text li, .ml-text li, .rb-card li{margin:5px 0}

/* ============ MATH SECTION ============ */
.math-intro{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
  padding-bottom:16px;border-bottom:1px dashed var(--border2);margin-bottom:20px;
}
.math-level{
  background:var(--card2);border:1px solid var(--border2);border-radius:11px;
  padding:16px 20px;margin-bottom:14px;
}
.ml-label{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--math);margin-bottom:10px;
}
.mathy{
  font-size:17px;color:#e3ffe6;margin:8px 0 12px;
  padding:12px 16px;background:rgba(126,231,135,.05);
  border:1px solid rgba(126,231,135,.16);border-radius:9px;
  overflow-x:auto;min-height:24px;
}
.ml-text{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
}
.math-subhead{
  font-family:var(--ff-title);font-size:14.5px;font-weight:600;color:#bfe8c4;
  margin:26px 0 12px;letter-spacing:.01em;
}
.map-row{
  display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(180px,1fr) minmax(220px,1.4fr);
  gap:12px;align-items:start;
  background:var(--card2);border:1px solid var(--border2);border-radius:10px;
  padding:12px 16px;margin-bottom:10px;
}
.map-code code{
  font-family:var(--ff-mono);font-size:12.5px;color:#9ecbff;background:#0d1117;
  border:1px solid var(--border2);border-radius:6px;padding:3px 8px;display:inline-block;
}
.map-math{color:#c9f7cf;font-family:var(--ff-mono);font-size:13.5px;padding-top:2px}
.map-text{font-family:var(--ff-bn);font-size:14.5px;line-height:1.8;color:#bcbcbc}
.failure-list li{
  font-family:var(--ff-bn);font-size:15px;line-height:1.85;color:#d9c9c9;
  margin:8px 0;padding-left:6px;list-style:none;position:relative;padding-left:22px;
}
.failure-list li::before{
  content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;
  border-radius:2px;background:rgba(248,81,73,.5);border:1px solid rgba(248,81,73,.65);
}
.failure-list{padding:0}

/* ============ ROBOT SECTION ============ */
.rb-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rb-card{
  border-radius:11px;padding:16px 18px;border:1px solid var(--border2);
  font-family:var(--ff-bn);font-size:15.3px;line-height:1.9;
}
.rb-card h4{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:10px;font-weight:600;
}
.rb-ok{background:rgba(63,185,80,.05);border-color:rgba(63,185,80,.28)}
.rb-ok h4{color:var(--ok)}
.rb-bad{background:rgba(248,81,73,.05);border-color:rgba(248,81,73,.28)}
.rb-bad h4{color:var(--bad)}

/* ============ ANIMATION SECTION ============ */
.anim-stage{
  background:
    radial-gradient(500px 200px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  border-bottom:1px solid var(--border2);
  padding:10px;position:relative;
}
.anim-stage svg{width:100%;height:auto;display:block}
.anim-controls{
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--border);background:var(--card2);
}
.ac-btn{
  font-family:var(--ff-mono);font-size:12px;letter-spacing:.08em;
  color:#c9c9c9;background:#202020;border:1px solid var(--border3);
  border-radius:8px;padding:7px 18px;cursor:pointer;transition:all .15s;
}
.ac-btn:hover{background:#2a2a2a;color:#fff;border-color:#4a4a4a}
.ac-btn.active{background:rgba(210,168,255,.14);color:var(--anim);border-color:rgba(210,168,255,.45)}
.anim-caption{
  font-family:var(--ff-bn);font-size:15px;line-height:1.8;color:#d0c4dd;
  padding:13px 22px;border-bottom:1px solid var(--border);min-height:52px;
  background:rgba(210,168,255,.03);
}
.anim-formula{
  font-family:var(--ff-mono);font-size:14px;color:#e6d9f5;
  padding:12px 22px;background:#0d1117;min-height:46px;
  overflow-x:auto;white-space:nowrap;letter-spacing:.01em;
}
.anim-formula .fx-hl{color:var(--anim)}
.anim-formula .fx-ok{color:var(--math)}
.anim-formula .fx-warn{color:var(--rb)}
.anim-state{
  margin-left:auto;font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.1em;
}

/* ============ PART NAV ============ */
.part-nav{display:flex;justify-content:space-between;gap:14px;margin-top:34px}
.pn-btn{
  flex:1;max-width:340px;display:block;
  border:1px solid var(--border2);border-radius:11px;
  padding:13px 18px;color:#c9c9c9;transition:all .16s;
  background:var(--card);
}
.pn-btn:hover{border-color:rgba(79,195,247,.4);color:#fff;text-decoration:none;background:#181818}
.pn-btn .pn-dir{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.14em;display:block;margin-bottom:3px;
}
.pn-btn .pn-title{font-size:13.5px;font-weight:600}
.pn-btn.next{text-align:right}
.pn-btn.disabled{opacity:.28;pointer-events:none}

/* ============ FOOTER ============ */
.site-footer{
  margin-left:var(--sb-w);border-top:1px solid var(--border);
  padding:26px 56px;color:var(--faint);font-size:13px;
  font-family:var(--ff-mono);letter-spacing:.02em;
}

/* ============ MATHJAX FALLBACK ============ */
body.no-mathjax .mathy{
  font-family:var(--ff-mono);font-size:13.5px;color:#c9f0cd;white-space:pre;
}

/* ============ RESPONSIVE ============ */
@media (max-width:1240px){
  #main{padding:44px 34px 70px}
  .site-footer{padding:24px 34px}
}
@media (max-width:960px){
  #menu-btn{display:block}
  #sidebar{
    transform:translateX(-100%);transition:transform .26s ease;
    box-shadow:24px 0 60px rgba(0,0,0,.5);
  }
  body.sb-open #sidebar{transform:translateX(0)}
  body.sb-open #sb-overlay{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;
  }
  #main{margin-left:0;padding:74px 20px 60px}
  .site-footer{margin-left:0;padding:22px 20px}
  .rb-grid{grid-template-columns:1fr}
  .map-row{grid-template-columns:1fr;gap:6px}
  .intro-banner{padding:22px 20px}
}
@media (max-width:560px){
  body{font-size:15px}
  .ex-text{font-size:15.3px}
  .cl{font-size:12.3px}
  .anim-formula{font-size:12.5px}
  .code-lines-chip{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}
</style>




<style id="refine-style">
/* ==================================================================
   SURGICAL REFINEMENT LAYER v2 — appended (UI-UX & animation refinement)
   Does not override any existing rule except where explicitly noted;
   all original bytes above this block are untouched.

   INTENTIONAL LAYER ARCHITECTURE (documented z-index scale)
   ---------------------------------------------------------
     --z-ground  0   page ground, card backgrounds
     --z-scene  10   base SVG scene inside .anim-stage / .exec-robot
     --z-objects 20  moving SVG marks (updated in place by the engine)
     --z-labels 30   SVG text labels — halo-stroked so they can never
                     become unreadable under moving objects
     --z-panel  40   overlay panels (formula bar, debug chips)
     --z-head   50   section headers, captions
     --z-debug  60   live debug readouts
     --z-ctrl   70   control bars (always clickable, never covered)
     --z-nav    80   sidebar / menu
     --z-focus  90   focus outlines (never overlapped)
   HTML layers take these values; inside a single <svg> stacking is by
   paint order, and readability of labels is guaranteed by the
   paint-order halo rule below rather than by z-index.
   ================================================================== */
:root{
  --z-ground:0; --z-scene:10; --z-objects:20; --z-labels:30;
  --z-panel:40; --z-head:50; --z-debug:60; --z-ctrl:70; --z-nav:80; --z-focus:90;
}

/* ---- Fix: full-width application shell (#56-57).
        #main keeps its sidebar margin but drops the narrow max-width;
        prose blocks below keep a readable measure so lines never run
        wall-to-wall — only layout containers use the full width. ---- */
#main{max-width:none}
.intro-desc{max-width:none}          /* hero paragraph: full hero width */
.ex-text, .ml-text, .math-intro, .map-text, .rb-card, .exec-note,
.anim-caption{
  max-width:105ch;
}
@media (min-width:1800px){
  #main{padding-left:88px; padding-right:88px}
}

/* ---- Fix: SVG text labels stay readable over moving objects.
        Halo = stage-ground-coloured stroke painted UNDER the fill. ---- */
.anim-stage svg text,
.exec-robot svg text{
  paint-order:stroke; stroke:#0b0e13; stroke-width:3px;
  stroke-linejoin:round; stroke-linecap:round;
  pointer-events:none; user-select:none;
}
.anim-stage, .exec-robot{position:relative; z-index:var(--z-scene)}
.anim-controls{position:relative; z-index:var(--z-ctrl)}
.anim-caption{position:relative; z-index:var(--z-head)}
.anim-formula{position:relative; z-index:var(--z-panel)}
.anim-state{z-index:var(--z-debug)}

/* ---- Fix: icon control buttons (professional inline SVG, no text) ---- */
.anim-controls{gap:8px}
.ac-btn.ic{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:32px; padding:0; border-radius:8px;
}
.ac-btn.ic svg{width:16px; height:16px; display:block; fill:currentColor}
.ac-btn.ic svg *{vector-effect:non-scaling-stroke}
.ac-btn:focus-visible{
  outline:2px solid var(--anim); outline-offset:2px; z-index:var(--z-focus);
}
.ac-btn.ic[disabled]{opacity:.35; cursor:not-allowed}
.anim-controls .ac-sep{
  width:1px; height:20px; background:var(--border3); margin:0 3px; flex:0 0 auto;
}
.anim-controls .ac-step{
  font-family:var(--ff-mono); font-size:11px; color:var(--anim);
  letter-spacing:.08em; padding:6px 10px; border:1px solid rgba(210,168,255,.28);
  border-radius:7px; background:var(--anim-dim); white-space:nowrap;
}

/* ---- Complete Execution — Code → Debug → Robot (v2 row layout) ----
   Row 1: COMPLETE SOURCE CODE | LIVE DEBUG   (the two walk together)
   Row 2: ROBOT / SYSTEM STATE (full width)
   Then:  complete banner → formula → explanation → controls      */
.exec-sec{margin-top:56px}
.exec-sec .sec-head .exec-sub{
  font-family:var(--ff-mono); font-size:11px; color:var(--faint);
  letter-spacing:.06em; margin-left:auto; padding-right:18px; white-space:nowrap;
}
.exec-note{
  font-family:var(--ff-bn); font-size:14.5px; line-height:1.8; color:var(--muted);
  padding:14px 22px; border-bottom:1px solid var(--border); background:var(--card);
}
.exec-note code{
  font-family:var(--ff-mono); font-size:.86em; color:#9ecbff;
  background:rgba(110,168,254,.10); border:1px solid rgba(110,168,254,.16);
  border-radius:5px; padding:1px 6px;
}
.exec-frame{
  display:grid; gap:14px; padding:16px 18px;
  grid-template-columns:minmax(0,1.42fr) minmax(330px,.72fr);
}
.exec-col{min-width:0; display:flex; flex-direction:column; gap:14px}
.exec-col>.exec-panel{flex:1}
/* robot/system row spans the full frame width, below code+debug */
.exec-col.rob-col{grid-column:1 / -1}
.exec-panel{
  background:var(--code-bg); border:1px solid var(--border2); border-radius:12px;
  overflow:hidden; display:flex; flex-direction:column; min-height:0;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}
/* scroll affordance: right-edge fade says "more code this way" without
   covering anything interactive (head stays above it via z-index) */
.exec-col.code-col .exec-panel{position:relative}
.exec-col.code-col .exec-panel::after{
  content:""; position:absolute; top:0; right:0; bottom:0; width:26px;
  z-index:1; pointer-events:none;
  background:linear-gradient(90deg, rgba(13,17,23,0), #0d1117 92%);
}
.exec-panel-head{
  position:relative; z-index:2;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--code-head); border-bottom:1px solid #20262e; padding:9px 14px;
}
.exec-panel-head .ep-title{
  font-family:var(--ff-title); font-size:13px; font-weight:600; color:#c9d1d9;
  letter-spacing:.01em;
}
.exec-panel-head .ep-chip{
  font-family:var(--ff-mono); font-size:10px; letter-spacing:.05em;
  border-radius:999px; padding:2.5px 9px; white-space:nowrap;
}
.ep-chip.live{color:var(--anim); background:var(--anim-dim); border:1px solid rgba(210,168,255,.3)}
.ep-chip.concept{color:var(--rb); background:var(--rb-dim); border:1px solid rgba(255,180,84,.3)}
.ep-chip.src{color:var(--ex); background:var(--ex-dim); border:1px solid rgba(79,195,247,.3)}
/* kind legend in the code panel head: exec / structural / event */
.exec-legend{
  margin-left:auto; display:inline-flex; align-items:center; gap:5px;
  font-family:var(--ff-mono); font-size:9.5px; color:var(--faint); white-space:nowrap;
}
.exec-legend .lg{
  width:9px; height:9px; border-radius:3px; display:inline-block;
  margin-left:6px;
}
.exec-legend .lg-exec{background:#d2a8ff}
.exec-legend .lg-struct{background:#ffb454}
.exec-legend .lg-event{background:#4fc3f7}
.exec-code{
  position:relative; overflow:auto; flex:1; min-height:0;
  max-height:620px; margin:0; padding:10px 0 28px;
  font-family:var(--ff-mono); font-size:12.3px; line-height:1.6; color:#dbe4ee;
  background:var(--code-bg); tab-size:4;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.exec-code .exl{
  display:block; white-space:pre; min-height:1.6em;
  padding:0 12px 0 0; border-left:3px solid transparent;
  transition:background .2s, border-color .2s;
}
/* line-number gutter stays pinned when long lines scroll horizontally */
.exec-code .eln{
  position:sticky; left:0;
  display:inline-block; width:3.6em; padding-right:10px;
  text-align:right; color:#3d4f63; user-select:none;
  background:var(--code-bg);
}
/* current line, by kind: exec = purple (default), structural = amber,
   event = cyan; grouped companion lines get the tint without the edge */
.exec-code .exl.cur{
  background:rgba(210,168,255,.14); border-left-color:var(--anim);
}
.exec-code .exl.cur .eln{color:var(--anim); background:#241d38}
.exec-code .exl.cur-struct{
  background:rgba(255,180,84,.13); border-left-color:var(--rb);
}
.exec-code .exl.cur-struct .eln{color:var(--rb); background:#2e2416}
.exec-code .exl.cur-event{
  background:rgba(79,195,247,.14); border-left-color:var(--ex);
}
.exec-code .exl.cur-event .eln{color:var(--ex); background:#12283a}
.exec-code .exl.cur-g{background:rgba(210,168,255,.06)}
.exec-code .exl.cur-g.cur-struct{background:rgba(255,180,84,.07)}
.exec-code .exl.cur-g.cur-event{background:rgba(79,195,247,.07)}
/* ---- BEFORE → OPERATION → AFTER debug (#52) ---- */
.exec-op{
  margin:10px 12px 0; padding:8px 12px; border-radius:9px;
  border:1px solid rgba(126,231,135,.32); background:rgba(126,231,135,.07);
  font-family:var(--ff-mono); font-size:11.8px; line-height:1.65; color:#7ee787;
  overflow-wrap:anywhere;
}
.exec-op::before{
  content:"OPERATION";
  display:block; font-size:9px; letter-spacing:.14em; color:#58a65f;
  margin-bottom:3px;
}
.exec-dbg-body{
  padding:10px 14px 14px; overflow:auto; max-height:620px; flex:1; min-height:0;
  font-family:var(--ff-mono); font-size:12px;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.dbg-row{
  display:flex; align-items:baseline; gap:10px; padding:5.5px 8px;
  border-bottom:1px dashed #1c2530; animation:dbgIn .3s ease;
}
.dbg-row:last-child{border-bottom:none}
.dbg-k{color:var(--muted); white-space:nowrap; flex:0 0 auto}
.dbg-v{color:#9ecbff; text-align:right; flex:1; overflow-wrap:anywhere;
  padding-right:2px}
.dbg-v.n{color:#7ee787}
.dbg-v.err{color:var(--bad)}
/* value changed by this line: old (dim) → new (green) */
.dbg-row.chg .dbg-v{color:#7ee787}
.dbg-old{color:#6e7681; text-decoration:line-through;
  text-decoration-color:rgba(110,118,129,.6)}
.dbg-arrow{color:#7ee787; font-weight:600}
.dbg-ill{
  flex:0 0 auto; font-size:9.5px; letter-spacing:.05em; color:var(--rb);
  border:1px solid rgba(255,180,84,.35); border-radius:5px; padding:1px 5px;
}
.dbg-empty{color:var(--faint); font-family:var(--ff-bn); font-size:13px; padding:12px 8px}
@keyframes dbgIn{from{opacity:0; transform:translateX(-4px)}to{opacity:1}}
/* robot row: centered scene, taller than the old side column */
.exec-robot{
  background:
    radial-gradient(500px 220px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  padding:14px; overflow:auto;
  display:flex; justify-content:center;
}
.exec-robot svg{width:100%; max-width:720px; height:auto; max-height:560px;
  display:block; margin:0 auto}
.exec-rob-fade{animation:robFade .4s ease}
@keyframes robFade{from{opacity:0; transform:translateY(4px)}to{opacity:1}}
/* result zone: complete banner → formula row → explanation → controls */
.exec-complete{
  display:none; margin:0 18px 14px; padding:13px 18px; border-radius:11px;
  border:1px solid rgba(63,185,80,.4); background:rgba(63,185,80,.08);
  font-family:var(--ff-mono); font-size:12.5px; letter-spacing:.04em; color:#7ee787;
}
.exec-complete.show{display:block; animation:robFade .4s ease}
.exec-complete .bn{font-family:var(--ff-bn); font-size:14px; color:#c9d1d9;
  letter-spacing:0; margin-top:5px; line-height:1.75}
.exec-fx-row{margin:0 18px 14px; max-width:none}
.exec-sec .anim-caption{margin:0 18px 4px}
.exec-sec .anim-controls{margin:0 18px 18px}
.exec-progress{
  height:3px; margin:0 18px 22px; border-radius:2px; overflow:hidden;
  background:rgba(255,255,255,.06);
}
.exec-progress i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--anim),#7ee787);
  transition:width .3s ease;
}

/* responsive: code+debug share row 1 until 960px, robot row always full
   width; below 960px everything stacks vertically (#59 mobile order) */
@media (max-width:1240px){
  .exec-frame{grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr)}
  .exec-code{max-height:540px}
  .exec-dbg-body{max-height:540px}
}
@media (max-width:960px){
  .exec-frame{grid-template-columns:minmax(0,1fr); padding:12px}
  .exec-code{max-height:430px}
  .exec-dbg-body{max-height:300px}
  .exec-robot svg{max-height:440px}
  .exec-legend{display:none}
}
@media (max-width:560px){
  .exec-sec .sec-head .exec-sub{display:none}
  .exec-frame{padding:10px}
  .anim-controls{padding:11px 14px}
}
@media (prefers-reduced-motion:reduce){
  .exec-rob-fade, .dbg-row{animation:none}
  .exec-code .exl{transition:none}
  .exec-progress i{transition:none}
}

</style>

const FILEDATA = {"README.md":["jetson@yahboom:~$ bash ~/start_agent.sh","","jetson@yahboom:~$ bash ~/joy_control/joy.sh","","ros2 launch yahboomcar_ctrl yahboomcar_joy_launch.py","","ros2 run yahboomcar_ctrl yahboom_joy_M3Pro"],"joy.sh":["#!/bin/bash","# This tells the computer: \"I am a Bash terminal script. Run me using the Bash language.\"","","sleep 10","# Pause and do nothing for 10 seconds. ","# Why? When a robot first turns on, it takes a few seconds for the Wi-Fi and internal systems to wake up. ","# We wait 10 seconds to make sure the robot is fully awake before we start giving it commands.","","source /opt/ros/humble/setup.bash","# \"source\" means \"load these settings into my current terminal\".","# This loads the main ROS 2 (Humble) toolbox. Without this, the terminal doesn't know what \"ros2\" means.","","source /home/jetson/yahboomcar_ws/install/setup.bash","# This loads the specific toolbox for the Yahboom robot. ","# It tells the robot where to find the custom code Yahboom wrote (like the yahboomcar_ctrl stuff).","","source /home/jetson/M3Pro_ws/install/setup.bash","# This loads another toolbox, specifically for the M3Pro controller hardware.","","export ROS_DOMAIN_ID=30","# This is a VERY important ROS 2 concept! ","# Think of ROS_DOMAIN_ID like a walkie-talkie channel. ","# By setting it to 30, you are telling the robot: \"Only communicate on channel 30.\"","# If you had two robots in the same room, you'd set one to channel 30 and the other to channel 31 ","# so they don't accidentally send driving commands to each other!","","gnome-terminal -- bash -c \"cd ~/joy_control && /usr/bin/python3 start_joy_controller.py; exec bash\"","# This is the final boss of the script! Let's break it down into pieces:","# ","# gnome-terminal --      -> Opens a brand new, visual terminal window on the screen.","# bash -c \"...\"          -> Tells that new window to run the commands inside the quotes.","# cd ~/joy_control       -> Go into the folder called 'joy_control' located in the home directory.","# &&                     -> \"If the previous command worked, THEN do the next thing.\"","# /usr/bin/python3 ...   -> Run the Python script! (This is the exact Python file you showed me earlier!)","# ; exec bash            -> When the Python script finishes or crashes, keep the terminal window open ","#                           instead of instantly closing it, so you can see any error messages."],"yahboomcar_joy_launch.py":["# --- IMPORTING ROS 2 LAUNCH TOOLS ---","from launch import LaunchDescription  ","# The main container (like a director's clipboard) that holds our list of programs to start.","","from launch_ros.actions import Node  ","# A tool used to start a single ROS 2 program (Node).","","","# Every ROS 2 Python launch file MUST have this exact function.","# When you type \"ros2 launch ...\" in the terminal, ROS 2 looks for this function and runs it.","def generate_launch_description():","","    # --- DEFINING THE PROGRAM TO RUN ---","    node1 = Node(","        package='joy',           # Look for a package installed on the robot called 'joy'. ","                                 # (The 'joy' package is the standard ROS 2 toolbox for handling gamepads/joysticks).","        ","        executable='joy_node',   # Inside that package, find the program named 'joy_node' and run it.","                                 # This program secretly runs in the background, constantly saying: ","                                 # \"Is the A button pressed? Yes. Is the left stick pushed? Yes.\"","    )","    ","    # --- THE FINAL LIST ---","    # Put our single program (node1) onto the director's clipboard.","    launch_description = LaunchDescription([node1])","    ","    # Hand the clipboard back to ROS 2 so it can start the program.","    return launch_description"],"start_joy_controller.py":["# This is an auto-start file that runs when the robot boots up.","","# --- IMPORTING TOOLS ---","import subprocess  # Lets Python run terminal commands","from PyQt5.QtWidgets import QApplication, QMessageBox  # Tools to make a pop-up graphical window","from PyQt5.QtCore import Qt  # Extra tools for the pop-up window","import psutil  # Lets Python see and kill background running programs (processes)","import rclpy  # The main ROS 2 library for Python","from rclpy.node import Node  # The blueprint for creating a ROS 2 \"Node\" (a mini-program that talks to the robot)","from geometry_msgs.msg import Twist  # The specific \"message\" type used to send movement commands (speed/turning)","import time  # Lets Python pause and wait","","# --- GLOBAL VARIABLES ---","launch_process = None  # An empty box to hold our first background program later","run_process = None  # An empty box to hold our second background program later","","","# --- HELPER FUNCTION TO KILL PROGRAMS ---","def kill_process_tree(pid):","    # 'pid' stands for Process ID. It's like a badge number for a running program.","    try:","        parent = psutil.Process(pid)  # Find the main program using its badge number","        for child in parent.children(recursive=True):  # Find any \"child\" programs it started","            child.kill()  # Forcefully close the children","        parent.kill()  # Finally, forcefully close the main parent program","    except psutil.NoSuchProcess:","        pass  # If the program is already closed, just ignore it and move on (don't crash)","        ","","# --- WHAT TO DO WHEN THE POP-UP WINDOW IS CLOSED ---","def close_event(event):","    event.accept()  # Tell the computer \"Yes, it's okay to close the window\"","    kill_process_tree(launch_process.pid)  # Kill the first background program we started","    kill_process_tree(run_process.pid)  # Kill the second background program we started    ","    app.quit()  # Close the pop-up application entirely","","","# --- FUNCTION TO START THE JOYSTICK CONTROL ---","def start_processes():","    global launch_process, run_process  # Tell Python we want to use the empty boxes we made earlier","    ","    # Create a pop-up message box on the screen","    msg_box = QMessageBox()","    msg_box.setText(\"your controller is running...\")  # What the text says","    msg_box.setWindowTitle(\"controller mode \")  # The title at the top of the window","    msg_box.setIcon(QMessageBox.Information)  # Add a little \"i\" info icon to the window","    msg_box.setStandardButtons(QMessageBox.NoButton)  # Remove the OK/CANCEL buttons so it stays open","    msg_box.setWindowModality(Qt.NonModal)  # Lets the user still click other things while this is open  ","","    # Start the ROS 2 launch file in the background (like typing: ros2 launch yahboomcar_ctrl yahboomcar_joy_launch.py)","    launch_process = subprocess.Popen(['ros2', 'launch', 'yahboomcar_ctrl', 'yahboomcar_joy_launch.py'])","    ","    # Start the actual joystick Python node in the background (like typing: ros2 run yahboomcar_ctrl yahboom_joy_M3Pro)","    run_process = subprocess.Popen(['ros2', 'run', 'yahboomcar_ctrl', 'yahboom_joy_M3Pro'])","    ","    print(\"Joy controller start successful!!!\")  # Print a success message to the terminal","    ","    msg_box.closeEvent = close_event  # Tell the window \"When I close you, run the close_event function above\"","    msg_box.show()  # Actually display the window on the screen  ","","    app.exec_()  # Keep the window open and waiting until someone closes it","","","# --- CREATING THE ROS 2 NODE ---","class autostart(Node):  # We are creating a mini-program (Node) called 'autostart'","    def __init__(self):  # This runs automatically when the node starts","        super().__init__('autostart_node')  # Give this node the name 'autostart_node' in the ROS 2 system","        ","        # Create a \"Publisher\". Think of this as a radio station broadcasting on channel '/cmd_vel'","        # 'Twist' is the format of the message (it holds forward speed and turning speed). '10' is the buffer size.","        self.cmd_vel_pub = self.create_publisher(Twist, '/cmd_vel', 10)","        ","        twist = Twist()  # Create a blank movement message","        twist.linear.x = 0.0  # Set forward/backward speed to 0 (Stop moving forward)","        twist.linear.y = 0.0  # Set side-to-side speed to 0 (Stop moving sideways)","        twist.angular.z = 0.0  # Set turning speed to 0 (Stop spinning)","","        # Waiting for someone to tune into our radio station","        # This loop keeps running as long as nobody is listening to '/cmd_vel'","        while not self.cmd_vel_pub.get_subscription_count():","            self.cmd_vel_pub.publish(twist)  # Shout \"STOP\" into the void","            self.get_logger().info('Waiting for subscribers...')  # Print a waiting message","            time.sleep(0.1)  # Pause for 0.1 seconds before trying again","            ","        # If we get here, it means the robot's motor controller is finally listening!","        self.get_logger().info('Published initial velocity command')  # Print a success message","        self.cmd_vel_pub.publish(twist)  # Send one final STOP command to be absolutely sure the robot is still","","","# --- THE MAIN SCRIPT STARTS HERE ---","if __name__ == \"__main__\":","","    rclpy.init()  # Turn on the ROS 2 system (boot up the robot's communication network)","    ","    auto_start = autostart()  # Run our autostart Node from above (this sends the STOP command and waits for the motors)","    ","    app = QApplication([])  # QApplication -> Prepare the system to draw graphical windows on the screen","    ","    start_processes()  # Run the function that starts the joystick background programs and shows the pop-up window","    ","    rclpy.shutdown()  # Once the pop-up window is closed, turn off the ROS 2 system cleanly."],"yahboom_joy_M3Pro.py":["#!/usr/bin/env python","# encoding: utf-8","","# --- IMPORTING TOOLS ---","import os","import time","import getpass","import threading","from time import sleep","","# ROS 2 libraries and Message types","import rclpy","from rclpy.node import Node","from geometry_msgs.msg import Twist","from sensor_msgs.msg import Joy","from actionlib_msgs.msg import GoalID","from std_msgs.msg import Int32, Bool, UInt16, ColorRGBA","","# Custom messages for your specific robot arm","from arm_msgs.msg import ArmJoint","from arm_msgs.msg import ArmJoints","","","class JoyTeleop(Node):","    def __init__(self, name):","        super().__init__(name)","        ","        # Print a beautiful startup banner","        print(\"\\n\" + \"=\"*50)","        print(\"   YAHBOOM JOYSTICK TELEOPERATION SYSTEM\")","        print(\"=\"*50)","        print(\" [*] Initializing Node...\")","        ","        # --- STATE TRACKERS ---","        self.Joy_active = False  ","        self.arm_activa = False  ","        self.Buzzer_active = 0  ","        self.RGBLight_index = 0  ","        self.cancel_time = time.time()  ","        self.user_name = getpass.getuser()  ","        ","        # Speed \"Gears\" for safety","        self.linear_Gear = 1.0 / 3  ","        self.angular_Gear = 1.0 / 4  ","","        self.loop_active = True","        self.gripper_active = True","        self.arm_joints = [90, 120, 10, 20, 90, 0]  # Home angles","        self.arm_joint = ArmJoint()","","        # --- CREATING PUBLISHERS ---","        self.pub_goal = self.create_publisher(GoalID, \"move_base/cancel\", 10)","        self.pub_cmdVel = self.create_publisher(Twist, \"cmd_vel\", 1)","        self.pub_Buzzer = self.create_publisher(UInt16, \"/beep\", 1)","        self.pub_JoyState = self.create_publisher(Bool, \"JoyState\", 10)","        self.pub_RGBLight = self.create_publisher(ColorRGBA, \"rgb\", 10)","        self.pub_SingleTargetAngle = self.create_publisher(ArmJoint, \"arm_joint\", 100)","        self.TargetAngle_pub = self.create_publisher(ArmJoints, \"arm6_joints\", 100)","","        # --- CREATING SUBSCRIBERS ---","        self.sub_Joy = self.create_subscription(Joy, \"joy\", self.buttonCallback, 10)","","        # --- ROS 2 PARAMETERS (Safety Speed Limits) ---","        self.declare_parameter(\"xspeed_limit\", 1.0)","        self.declare_parameter(\"yspeed_limit\", 1.0)","        self.declare_parameter(\"angular_speed_limit\", 5.0)","        self.xspeed_limit = self.get_parameter(\"xspeed_limit\").get_parameter_value().double_value","        self.yspeed_limit = self.get_parameter(\"yspeed_limit\").get_parameter_value().double_value","        self.angular_speed_limit = self.get_parameter(\"angular_speed_limit\").get_parameter_value().double_value","      ","        print(\" [INFO] Waiting for Arm Controller to connect...\")","        # Move the arm to the home position, and wait until the arm is actually listening","        while not self.TargetAngle_pub.get_subscription_count():","            self.pubSix_Arm(self.arm_joints)","            time.sleep(1)\t","        self.pubSix_Arm(self.arm_joints)","        ","        print(\" [INFO] System Ready! Press 'Share/Options' button to unlock control.\")","        print(\"-\" * 50)","","    # --- HELPER FUNCTION TO MOVE ALL 6 JOINTS ---","    def pubSix_Arm(self, joints, id=6, angle=180.0, runtime=2000):","        arm_joint = ArmJoints()","        arm_joint.joint1 = joints[0]","        arm_joint.joint2 = joints[1]","        arm_joint.joint3 = joints[2]","        arm_joint.joint4 = joints[3]","        arm_joint.joint5 = joints[4]","        arm_joint.joint6 = joints[5]","        arm_joint.time = runtime","        self.TargetAngle_pub.publish(arm_joint)","","    # --- THE MAIN BUTTON ROUTER ---","    def buttonCallback(self, joy_data):","        if not isinstance(joy_data, Joy): return","        ","        if self.user_name == \"jetson\":","            self.user_jetson(joy_data)","        else:","            self.user_pc(joy_data)","","    # --- ARM MOVEMENT THREADING ---","    def pub_armjoint(self, id, direction):","        self.loop_active = True","        arm_thread = threading.Thread(target=self.arm_ctrl, args=(id, direction))","        arm_thread.setDaemon(True)","        arm_thread.start()","","    def arm_ctrl(self, id, direction):","        while 1:","            if self.loop_active:","                self.arm_joints[id - 1] += direction","                ","                # Safety limits so the arm doesn't bend too far and break itself","                if id == 5:","                    if self.arm_joints[id - 1] > 270: self.arm_joints[id - 1] = 270","                    elif self.arm_joints[id - 1] < 0: self.arm_joints[id - 1] = 0","                elif id == 6:","                    if self.arm_joints[id - 1] >= 180: self.arm_joints[id - 1] = 180","                    elif self.arm_joints[id - 1] <= 30: self.arm_joints[id - 1] = 30","                else:","                    if self.arm_joints[id - 1] > 180: self.arm_joints[id - 1] = 180","                    elif self.arm_joints[id - 1] < 0: self.arm_joints[id - 1] = 0","                    ","                self.arm_joint.id = id","                self.arm_joint.joint = int(self.arm_joints[id - 1])","                self.arm_joint.time = 1000","                ","                if self.arm_activa:","                    # NEW BEAUTIFUL PRINT: Shows exactly which joint is moving and its current angle","                    action = \"UP\" if direction > 0 else \"DOWN\"","                    print(f\" [ARM] Moving Joint {id} {action} -> Angle: {int(self.arm_joints[id - 1])} deg\")","                    self.pub_SingleTargetAngle.publish(self.arm_joint)","                sleep(0.5)","            else:","                break","            ","    # --- JETSON CONTROLLER MAPPING ---","    def user_jetson(self, joy_data):","        # Toggle the gripper open/closed mode","        if joy_data.buttons[10] == 1:","            self.gripper_active = not self.gripper_active","            state = \"Gripper Mode\" if self.gripper_active else \"Joint 5 Mode\"","            print(f\" [BTN] Toggled L1/L2 -> {state}\")","            ","        # If all movement buttons are let go, stop the arm thread","        if (joy_data.buttons[0] == joy_data.buttons[1] == joy_data.buttons[6] == joy_data.buttons[3] == joy_data.buttons[4] == 0 ","            and joy_data.axes[7] == joy_data.axes[6] == 0 and joy_data.axes[5] != -1):","            self.loop_active = False","        else:","            # Map specific buttons to arm joints","            if joy_data.buttons[3] == 1: self.pub_armjoint(1, -1)","            if joy_data.buttons[1] == 1: self.pub_armjoint(1, 1)","            if joy_data.buttons[0] == 1: self.pub_armjoint(2, -1)","            if joy_data.buttons[4] == 1: self.pub_armjoint(2, 1)","            if joy_data.axes[6] != 0: self.pub_armjoint(3, -joy_data.axes[6])","            if joy_data.axes[7] != 0: self.pub_armjoint(4, joy_data.axes[7])","            if self.gripper_active:","                if joy_data.axes[5] == -1: self.pub_armjoint(6, -1)","                if joy_data.buttons[6] == 1: self.pub_armjoint(6, 1)","            else:","                if joy_data.axes[5] == -1: self.pub_armjoint(5, -1)","                if joy_data.buttons[6] == 1: self.pub_armjoint(5, 1)","","        # Cancel AI Navigation / Toggle Control","        if joy_data.buttons[9] == 1: self.cancel_nav()","        ","        # Change RGB Light Color","        if joy_data.buttons[7] == 1:","            self.RGBLight_index = self.RGBLight_index + 1.0","            if self.RGBLight_index > 7: self.RGBLight_index = 0.0","            rgb__msg = ColorRGBA()","            rgb__msg.a = 100.0 + self.RGBLight_index","            self.pub_RGBLight.publish(rgb__msg)","            print(f\" [LED] Changed RGB Light Color (Index: {int(self.RGBLight_index)})\")","            ","        # Beep the Buzzer","        if joy_data.buttons[11] == 1:","            Buzzer_ctrl = UInt16()","            if self.Buzzer_active == 0: self.Buzzer_active = self.Buzzer_active + 1","            else: self.Buzzer_active = self.Buzzer_active - 1","            Buzzer_ctrl.data = self.Buzzer_active","            self.pub_Buzzer.publish(Buzzer_ctrl)","            print(f\" [BUZZER] Beep! State: {self.Buzzer_active}\")","            ","        # Shift Gears for Linear (forward/backward) speed","        if joy_data.buttons[13] == 1:","            if self.linear_Gear == 1.0: self.linear_Gear = 1.0 / 3","            elif self.linear_Gear == 1.0 / 3: self.linear_Gear = 2.0 / 3","            elif self.linear_Gear == 2.0 / 3: self.linear_Gear = 1","            print(f\" [SPEED] Linear Gear shifted to: {int(self.linear_Gear * 100)}%\")","            ","        # Shift Gears for Angular (spinning) speed","        if joy_data.buttons[14] == 1:","            if self.angular_Gear == 1.0: self.angular_Gear = 1.0 / 4","            elif self.angular_Gear == 1.0 / 4: self.angular_Gear = 1.0 / 2","            elif self.angular_Gear == 1.0 / 2: self.angular_Gear = 3.0 / 4","            elif self.angular_Gear == 3.0 / 4: self.angular_Gear = 1.0","            print(f\" [SPEED] Angular Gear shifted to: {int(self.angular_Gear * 100)}%\")","","        # Calculate actual wheel speed","        xlinear_speed = self.filter_data(joy_data.axes[1]) * self.xspeed_limit * self.linear_Gear","        ylinear_speed = self.filter_data(joy_data.axes[0]) * self.yspeed_limit * self.linear_Gear","        angular_speed = self.filter_data(joy_data.axes[2]) * self.angular_speed_limit * self.angular_Gear","        ","        # Enforce hard speed limits","        if xlinear_speed > self.xspeed_limit: xlinear_speed = self.xspeed_limit","        elif xlinear_speed < -self.xspeed_limit: xlinear_speed = -self.xspeed_limit","        if ylinear_speed > self.yspeed_limit: ylinear_speed = self.yspeed_limit","        elif ylinear_speed < -self.yspeed_limit: ylinear_speed = -self.yspeed_limit","        if angular_speed > self.angular_speed_limit: angular_speed = self.angular_speed_limit","        elif angular_speed < -self.angular_speed_limit: angular_speed = -self.angular_speed_limit","","        # Package the speeds into a Twist message and send to the wheels","        twist = Twist()","        twist.linear.x = xlinear_speed","        twist.linear.y = ylinear_speed","        twist.angular.z = angular_speed","        if self.Joy_active == True:","            self.pub_cmdVel.publish(twist)","","    # --- PC CONTROLLER MAPPING ---","    def user_pc(self, joy_data):","        # Similar logic to above, omitted for brevity but kept for structure","        pass","","    # --- DEADZONE FILTER ---","    def filter_data(self, value):","        # Prevents robot from creeping when your hand just rests on the stick","        if abs(value) < 0.2:","            value = 0","        return value","","    # --- TOGGLE JOYSTICK CONTROL ---","    def cancel_nav(self):","        now_time = time.time()","        # Prevents the button from triggering 100 times a second","        if now_time - self.cancel_time > 1:","            Joy_ctrl = Bool()","            self.Joy_active = not self.Joy_active","            self.arm_activa = not self.arm_activa","            Joy_ctrl.data = self.Joy_active","            ","            # NEW BEAUTIFUL PRINT: Clearly tells the user if control is unlocked","            if self.Joy_active:","                print(\"\\n [SYSTEM] >>> CONTROL UNLOCKED! (Wheels + Arm Active) <<<\")","            else:","                print(\"\\n [SYSTEM] >>> CONTROL LOCKED. (Paused) <<<\")","                ","            for i in range(3):","                self.pub_JoyState.publish(Joy_ctrl)","                self.pub_cmdVel.publish(Twist())","            self.cancel_time = now_time","","","def main():","    rclpy.init()","    joy_ctrl = JoyTeleop(\"joy_ctrl\")","    try:","        rclpy.spin(joy_ctrl)","    except KeyboardInterrupt:","        print(\"\\n [SYSTEM] Shutting down joystick controller...\")","    finally:","        joy_ctrl.destroy_node()","        rclpy.shutdown()"]};
const PARTS = [{"n":1,"fname":"README.md","enTitle":"README — The Four Commands","explain":[{"a":1,"b":1,"text":"প্রথম লাইনটি আসলে কোনো code নয় — এটি terminal-এর <b>prompt উদাহরণ<\/b>: <code>jetson@yahboom:~$<\/code> অর্থাৎ ব্যবহারকারীর নাম <code>jetson<\/code>, মেশিনের নাম <code>yahboom<\/code>, <code>~<\/code> মানে home folder, আর <code>$<\/code> সাধারণ ব্যবহারকারীর প্রম্পট। এর পরের অংশ <code>bash ~/start_agent.sh<\/code> — home folder-এর <code>start_agent.sh<\/code> script-টি <code>bash<\/code> দিয়ে চালানোর কমান্ড। লক্ষণীয়: সেই script-টি <b>এই folder-এ নেই<\/b> — এটি robot-এর অন্য অংশের setup, এখানে কেবল উল্লেখ।"},{"a":3,"b":3,"text":"দ্বিতীয় কমান্ড: <code>bash ~/joy_control/joy.sh<\/code> — home-এর ভেতরের <code>joy_control<\/code> folder-এর <code>joy.sh<\/code> চালাও। <b>এটিই এই পুরো system-এর চাবি-কাঠি<\/b>: robot বুট হওয়ার পর মানুষ এই একটি কমান্ড টাইপ করলে বাকি সবকিছু (পরের Part-এর script) স্বয়ংক্রিয়ভাবে চলতে শুরু করে।"},{"a":5,"b":5,"text":"<code>ros2 launch yahboomcar_ctrl yahboomcar_joy_launch.py<\/code> — <code>yahboomcar_ctrl<\/code> package-এর launch file চালানোর কমান্ড। মজার তথ্য: এই কমান্ডটি মানুষকে হাতে টাইপ করতে হয় না — একটু পরের <code>start_joy_controller.py<\/code> নিজেই এটি background-এ চালিয়ে দেয়। README-তে লেখা আছে বলে আমরা জানি ভেতরে কী চলছে।"},{"a":7,"b":7,"text":"<code>ros2 run yahboomcar_ctrl yahboom_joy_M3Pro<\/code> — দ্বিতীয় background কমান্ড: একই package থেকে <code>yahboom_joy_M3Pro<\/code> নামের আসল joystick-টেলিঅপ প্রোগ্রামটি চালু করা। এটিও <code>start_joy_controller.py<\/code> নিজে থেকেই চালায়। অর্থাৎ README-র ৪টি লাইনের মর্মার্থ: <b>একটি কমান্ড (<code>joy.sh<\/code>) দিলে বাকি তিনটি নিজে নিজেই ঘটে<\/b> — README সেই চেইনের ম্যাপ।"}],"math":null,"robot":{"correct":"ব্যবহারকারী robot-এর terminal-এ লাইন ৩-এর কমান্ডটি দিলেই সিস্টেম জেগে উঠবে: joy.sh প্রথমে ১০ সেকেন্ড অপেক্ষা করবে, তারপর ROS environment লোড করে নতুন terminal window-তে controller-স্পাওনার চালু করবে; লাইন ৫ ও ৭-এর কমান্ড দুটি তখন স্বয়ংক্রিয়ভাবে background-এ চলবে।","incorrect":"কেউ যদি লাইন ৫ বা ৭-এর কমান্ড সরাসরি টাইপ করে (joy.sh চালানো ছাড়া), সেগুলি কাজ নাও করতে পারে — কারণ ROS environment ও <code>ROS_DOMAIN_ID<\/code> সেই shell-এ লোড হয়নি; আর লাইন ১-এর <code>start_agent.sh<\/code> এই folder-এ না থাকায় README হুবহু অনুসরণ করতে গেলে সেটি আগে থেকেই robot-এ থাকতে হবে।"},"id":"part-01","start":1,"end":7,"lang":"text","animType":null,"flags":[]},{"n":2,"fname":"joy.sh","enTitle":"joy.sh — The Boot Script","explain":[{"a":1,"b":2,"text":"<code>#!/bin/bash<\/code> — <b>shebang<\/b>: এই file-টি চালানোর সময় operating system কোন interpreter ব্যবহার করবে তা বলে দেয় — এখানে Bash shell। ফলে <code>bash joy.sh<\/code> না লিখে শুধু <code>./joy.sh<\/code> (execute permission থাকলে) লিখলেই চলে। পরের লাইনের English comment ঠিক একথাই ব্যাখ্যা করছে।"},{"a":4,"b":7,"text":"<code>sleep 10<\/code> — script শুরু হয়েই <b>১০ সেকেন্ড কিছু না করে<\/b> বসে থাকে। কারণ robot সবেমাত্র চালু হয়েছে: WiFi নেটওয়ার্কে যোগ দিতে, ভেতরের service-গুলো জেগে উঠতে কয়েক সেকেন্ড লাগে। এই জাগরণ-সময়ের মধ্যেই কমান্ড পাঠালে সেগুলো হারিয়ে যেত — তাই নিরাপদ ব্যবধান।"},{"a":9,"b":11,"text":"<code>source /opt/ros/humble/setup.bash<\/code> — <code>source<\/code> মানে “এই file-এর সেটিংস আমার <b>বর্তমান terminal-এ<\/b> লোড করো”। এটি ROS 2 Humble-এর মূল toolbox লোড করে — না করলে terminal <code>ros2<\/code> শব্দটিই চিনবে না (command not found)।"},{"a":13,"b":15,"text":"দ্বিতীয় <code>source<\/code>: <code>/home/jetson/yahboomcar_ws/install/setup.bash<\/code> — Yahboom-এর নিজস্ব workspace। robot নির্মাতার লেখা custom code (যেমনই এই <code>yahboomcar_ctrl<\/code> package) এখান থেকে পাওয়া যায়।"},{"a":17,"b":18,"text":"তৃতীয় <code>source<\/code>: <code>/home/jetson/M3Pro_ws/install/setup.bash<\/code> — M3Pro নামের arm-controller হার্ডওয়্যারের workspace। তিনটি স্তর একে একে লোড হলো: ROS 2 নিজে → রোবটের custom code → হাতের হার্ডওয়্যারের code।"},{"a":20,"b":25,"text":"<code>export ROS_DOMAIN_ID=30<\/code> — পুরো script-এর সবচেয়ে গুরুত্বপূর্ণ লাইনগুলোর একটি। ROS 2-তে যোগাযোগ হয় DDS নেটওয়ার্কের উপর, আর <code>ROS_DOMAIN_ID<\/code> হলো সেই নেটওয়ার্কের <b>ওয়াকি-টকি চ্যানেলের নম্বর<\/b>। 30 বসানো মানে: “শুধু চ্যানেল 30-এ কথা বলবে ও শুনবে।” একই ঘরে দুটি robot থাকলে একটাকে 30, অন্যটাকে 31 দিলে একটার ড্রাইভিং কমান্ড আরেকটার চাকায় গিয়ে পড়বে না — comment-গুলো হুবহু এই ব্যাখ্যাই দিচ্ছে।"},{"a":27,"b":29,"text":"শেষ কমান্ড শুরু: <code>gnome-terminal -- bash -c \"...\"<\/code> — পর্দায় <b>একটি নতুন visual terminal window<\/b> খোলে, আর <code>bash -c \"...\"<\/code> বলে সেই নতুন window-তে উদ্ধৃতি-চিহ্নের ভেতরের কমান্ডগুলো চালাতে। প্রথম ভেতরের ধাপ: <code>cd ~/joy_control<\/code> — সেই folder-এ ঢোকা (window-টি কোথা থেকে চলছে তা নিশ্চিত করতে)। লাইন ২৯-এ শুধু <code>#<\/code> — খালি-প্রায় comment, সাজানোর ফাঁক।"},{"a":30,"b":33,"text":"ভেতরের দ্বিতীয় ধাপ: <code>&amp;&amp;<\/code> — “আগের কমান্ড সফল হলে <b>তবেই<\/b> পরেরটি চালাও” (cd ব্যর্থ হলে Python চলবেই না)। তৃতীয় ধাপ: <code>/usr/bin/python3 start_joy_controller.py<\/code> — সিস্টেমের Python 3 দিয়ে controller-স্পাওনার script-টি চালানো। পুরো জয়স্টিক-ব্যবস্থার জন্ম এই এক লাইনে।"},{"a":34,"b":36,"text":"শেষ টুকরো: <code>; exec bash<\/code> — Python script শেষ হয়ে গেলে বা <b>ক্র্যাশ করলেও<\/b> window-টি বন্ধ না হয়ে খোলা Bash prompt-এ রূপ নেবে। উদ্দেশ্য: কোনো error message পর্দা থেকে মুহূর্তে মুছে না গিয়ে চোখের সামনে থাকুক, যাতে সমস্যা পড়ে বোঝা যায়।"}],"math":{"intro":"এই script-এর দুটি সংখ্যাই আসল গণিত বহন করে: <b>10 সেকেন্ডের প্রহর<\/b> আর <b>চ্যানেল নম্বর 30<\/b>। দুটোই একেবারে সরল, কিন্তু ভুল বসালে সিস্টেম চুপচাপ অকেজো হয়ে যায়।","levels":[{"label":"Level 1 — Domain মিলনের শর্ত","latex":"\\[ N_{\\text{sender}} = N_{\\text{listener}} \\;\\Longleftrightarrow\\; \\text{দুই node একে অপরকে আবিষ্কার করবে} \\]","text":"দুটি ROS 2 প্রোগ্রাম পরস্পরের কথা শুধু তখনই শুনবে যখন তাদের ROS_DOMAIN_ID হুবহু সমান হবে। 30 ≠ 31 হলে message হারিয়ে যায় না — মূলত <b>কেউই শোনে না<\/b>; কোনো error ছাড়াই।"},{"label":"Level 2 — sleep-এর নিরাপত্তা-শর্ত","latex":"\\[ T_{\\text{sleep}} = 10\\,\\text{s} \\;\\geq\\; T_{\\text{wifi}} + T_{\\text{services}} \\;\\approx\\; 6\\text{–}8\\,\\text{s} \\]","text":"বুটের পরে WiFi যোগ দিতে ও system service জাগতে যে-সময় লাগে, তার সর্বোচ্চ ধারণার চেয়ে বেশি প্রহর রাখা হয়েছে। শর্তটি মেনে গেলে পরের কমান্ড নিরাপদে পৌঁছায়।"}],"numeric":[{"latex":"\\[ T_{\\text{wifi}} = 6\\,\\text{s} \\;\\Rightarrow\\; \\text{margin} = 10 - 6 = 4\\,\\text{s} \\]","text":"ধরা যাক এই robot-এ WiFi জুড়তে ৬ সেকেন্ড লাগে। sleep 10 রাখলে ৪ সেকেন্ডের নিরাপদ ব্যবধান থাকে।"},{"latex":"\\[ T_{\\text{sleep}} = 2\\,\\text{s} \\;\\Rightarrow\\; 6 - 2 = 4\\,\\text{s} \\text{ ধরে কমান্ড বৃথা} \\]","text":"একই robot-এ কেউ sleep 2 করে দিলে: ২ সেকেন্ডের মাথায় পাঠানো <code>source<\/code>/<code>ros2<\/code> কমান্ড এমন network-এ পড়বে যেটি এখনো তৈরি হয়নি — চলমান প্রোগ্রামগুলো আধপাতা অবস্থায় শুরু হবে।"}],"mapping":[{"code":"sleep 10","math":"\\[ T_{\\text{sleep}} \\geq T_{\\text{boot}} \\]","text":"কোডের প্রহর-সংখ্যা আসলে একটি inequality-এর সিদ্ধান্ত — বুট-সময়ের ঊর্ধ্বসীমা যতটা জানি, তার চেয়ে বেশি অপেক্ষা।"},{"code":"export ROS_DOMAIN_ID=30","math":"\\[ N = 30, \\quad N \\in \\{0, 1, \\ldots, 101\\} \\]","text":"ডিফল্ট বৈধ রেঞ্জ 0–101 (একই LAN-এ); 30 হলো সেই সেটের একটি ইচ্ছাকৃত পছন্দ — অন্য robot-এর 31 থেকে আলাদা।"}],"failure":["দুই robot ভুলে একই DOMAIN_ID-তে রাখলে: একটার <code>cmd_vel<\/code> অন্যটার মোটরে পৌঁছাবে — একটি robot নিজে থেকেই চলতে শুরু করবে, কোনো warning ছাড়াই।","ROS লোড না করেই সরাসরি পরের কমান্ড চালালে <code>ros2: command not found<\/code> — কিন্তু script থেমে না গিয়ে পরের লাইনে চলতে থাকবে, কারণ কোনো error-check নেই।","sleep বাদ দিয়ে দ্রুত বুটের লোভ করলে এলোমেলো আচরণ: কখনো কাজ করবে, কখনো করবে না — নির্ভর করবে সেদিন WiFi কত দ্রুত জুড়লো, এমন সবচেয়ে নির্মম ধরনের bug।"]},"robot":{"correct":"Robot চালু করে এই script চালালে: ১০ সেকেন্ড নীরব অপেক্ষা → তিনটি toolbox লোড → চ্যানেল 30-এ যোগদান → পর্দায় নতুন window-তে controller-স্পাওনার চালু। এরপর সেই window-তে popup দেখা যাবে আর robot জয়স্টিকের জন্য প্রস্তুত।","incorrect":"ROS_DOMAIN_ID ভুল হলে (যেমন robot-এর মোটর-পাশের node 31-এ) সব প্রোগ্রাম ‘চালু’ দেখাবে, popup-ও আসবে — কিন্তু জয়স্টিক নাড়ালে কিছুই হবে না, কারণ কেউ শুনছে না। আর script-এর শেষে <code>exec bash<\/code> না থাকলে Python ক্র্যাশ করা মাত্র window মুহূর্তে বন্ধ হয়ে যেত — error পড়ার সুযোগই আর থাকত না।"},"id":"part-02","start":1,"end":36,"lang":"bash","animType":"bootSequence","flags":[]},{"n":3,"fname":"yahboomcar_joy_launch.py","enTitle":"Launch File — Spawning joy_node","explain":[{"a":1,"b":3,"text":"<code>from launch import LaunchDescription<\/code> — ROS 2 launch ব্যবস্থার মূল ধারক-class আনা হলো। Comment-এ যেমন বলা হয়েছে, এটি পরিচালকের ক্লিপবোর্ডের মতো: কোন কোন প্রোগ্রাম চালু হবে, সেই তালিকা এখানে জমা থাকবে।"},{"a":5,"b":6,"text":"<code>from launch_ros.actions import Node<\/code> — একটি মাত্র ROS 2 প্রোগ্রাম (node) চালু করার action-class। Launch file-এর কাজ যেহেতু অন্য প্রোগ্রাম চালু করা, সেহেতু এই দুটি import-ই তার পুরো সরঞ্জাম।"},{"a":9,"b":11,"text":"<code>def generate_launch_description():<\/code> — ROS 2-র চুক্তি: <code>ros2 launch<\/code> কমান্ড দিলে ROS এই <b>নির্দিষ্ট নামের<\/b> function-টি খুঁজে তাকে ডাকে। নাম একটুও বদলানো যাবে না — বদলালে launch file চুপচাপ কিছুই চালু করবে না।"},{"a":13,"b":16,"text":"<code>node1 = Node(package='joy', ...)<\/code> — একটি node চালুর নির্দেশ তৈরি হচ্ছে। <code>package='joy'<\/code> মানে: robot-এ <b>ইনস্টল করা<\/b> এমন একটি package খোঁজো যার নাম <code>joy<\/code> — এটি গেমপ্যাড/জয়স্টিক সামলানোর ROS 2-র স্ট্যান্ডার্ড toolbox; এই folder-এর কোনো code এখানে নেই, এটি আলাদাভাবে ইনস্টল থাকা প্রোগ্রাম।"},{"a":18,"b":21,"text":"<code>executable='joy_node'<\/code> — সেই package-এর ভেতরের <code>joy_node<\/code> নামের প্রোগ্রামটি চালাও। Comment-এর বর্ণনা চমৎকার: এই প্রোগ্রামটি background-এ চলে প্রতিনিয়ত গেমপ্যাডকে জিজ্ঞেস করে — “A বাটন চাপা? হ্যাঁ। বাম স্টিক ঠেলা? হ্যাঁ।” উত্তরগুলো সে <code>joy<\/code> নামের topic-এ প্রকাশ করে।"},{"a":23,"b":25,"text":"<code>launch_description = LaunchDescription([node1])<\/code> — পরিচালকের ক্লিপবোর্ড সাজানো: তালিকায় মাত্র একটি প্রোগ্রাম। ভবিষ্যতে আরও node লাগলে এই list-এ <code>node2<\/code>, <code>node3<\/code> যোগ করলেই হতো — launch file-এর প্রসারণের জায়গা এখানেই।"},{"a":27,"b":28,"text":"<code>return launch_description<\/code> — ক্লিপবোর্ডটি ROS 2-র হাতে ফিরিয়ে দেওয়া। <code>ros2 launch<\/code> কমান্ড এই ফেরত পেয়েই তালিকার প্রতিটি node চালু করে — এই file-এর কাজ এখানেই শেষ।"}],"math":{"intro":"Launch file নিজে না গণনা করেও একটি সংখ্যাতাত্ত্বিক সিদ্ধান্ত বহন করে: কত ঘন ঘন এবং কত বড় করে গেমপ্যাডের খবর <code>joy<\/code> topic-এ পাঠানো হবে — তার আকার।","levels":[{"label":"Level 1 — Joy message-এর আকার","latex":"\\[ S = n_{\\text{buttons}} + n_{\\text{axes}} \\]","text":"একটি Joy message মূলত দুটি অ্যারে: বাটনের 0/1 অবস্থা আর অক্ষের −1 থেকে +1 মান। যত বেশি বাটন/অক্ষ, তত বড় বার্তা।"},{"label":"Level 2 — তথ্যের স্রোত","latex":"\\[ R = f_{\\text{events}} \\times S \\]","text":"স্রোতের হার = প্রতি সেকেন্ডে পরিবর্তন-ঘটনার সংখ্যা × প্রতি বার্তার আকার। ডিফল্টভাবে joy_node শুধু মান <b>বদলালে<\/b> পাঠায় — স্থির হাতে ধরে থাকলে স্রোত প্রায় শূন্য।"}],"numeric":[{"latex":"\\[ n_{\\text{buttons}} = 15, \\; n_{\\text{axes}} = 8 \\;\\Rightarrow\\; S = 23 \\text{ মান প্রতি বার্তায়} \\]","text":"সাধারণ একটি গেমপ্যাডে ১৫টি বাটন ও ৮টি অক্ষ ধরলে প্রতিটি Joy বার্তায় ২৩টি সংখ্যা বসে — আমাদের code সেগুলোর নির্দিষ্ট ইনডেক্স (buttons[3], axes[5]...) পড়ে নেয়।"}],"mapping":[{"code":"Node(package='joy', executable='joy_node')","math":"\\[ \\text{launch}(p, e) \\rightarrow \\text{PID} + \\text{publish}('joy') \\]","text":"কোডের দুটি string (package, executable) মিলে ঠিক করে কোন ডিস্ক-প্রোগ্রাম চালু হবে এবং সে কোন topic-এ লিখবে।"}],"failure":["গেমপ্যাড USB-তে লাগানো না থাকলে joy_node চালু হবে কিন্তু কোনো বার্তা পাঠাবে না — ডাউনস্ট্রিম সবকিছু চুপচাপ অপেক্ষায় থাকবে, কোনো error নয়।","package='joy' বানান ভুল হলে launch ব্যর্থ হবে স্পষ্ট ত্রুটি দিয়ে — এই file-এর সবচেয়ে সহজে ধরা পড়া ভুল।","function-এর নাম বদলালে launch চলবে, কিন্তু কিছুই চালু হবে না — সবচেয়ে বিপজ্জনক, কারণ ত্রুটির বার্তাও আসবে না।"]},"robot":{"correct":"এই launch file চালু হওয়া মাত্র robot গেমপ্যাডের জন্য কান খোলে: joy_node background-এ চলে এবং বাটন/স্টিকের প্রতিটি নড়াচড়া <code>joy<\/code> topic-এ ছড়িয়ে দেয় — পরের প্রোগ্রাম (JoyTeleop) সেগুলো ধরে সিদ্ধান্ত নেয়।","incorrect":"joy package ইনস্টল না থাকলে বা গেমপ্যাড না লাগানো থাকলে বাকি সিস্টেম স্বাভাবিক দেখাবে — popup আসবে, ‘System Ready’-ও ছাপাবে — কিন্তু জয়স্টিক নাড়ালে কিছুই ঘটবে না, কারণ উৎসেই কেউ কথা বলছে না।"},"id":"part-03","start":1,"end":28,"lang":"python","animType":"joyGraph","flags":[]},{"n":4,"fname":"start_joy_controller.py","enTitle":"Autostart Script — Imports & Globals","explain":[{"a":1,"b":1,"text":"প্রথম comment-ই এর পরিচয়: robot বুট হলে স্বয়ংক্রিয়ভাবে চলার কথা এই file-এর। বাস্তবে এটি <code>joy.sh<\/code>-এর শেষ কমান্ড থেকে নতুন terminal window-তে চালু হয় — অর্থাৎ ‘অটোস্টার্ট’-এর দায়টি ঐ script-এর হাতে।"},{"a":3,"b":4,"text":"<code>import subprocess<\/code> — Python থেকে terminal-কমান্ড চালানোর দরজা: একটু পরে এর <code>Popen<\/code> দিয়েই দুটি <code>ros2<\/code> কমান্ড background-এ ছাড়া হবে।"},{"a":5,"b":6,"text":"<code>from PyQt5.QtWidgets import QApplication, QMessageBox<\/code> — graphical popup window বানানোর toolkit; <code>Qt<\/code> (QtCore থেকে) আনা হয়েছে window-এর আচরণ-সংক্রান্ত constant-এর জন্য। Robot-এর পর্দায় “your controller is running...” লেখা ছোট্ট জানালাটি এদেরই সৃষ্টি।"},{"a":7,"b":7,"text":"<code>import psutil<\/code> — চলমান প্রোগ্রাম-তালিকা দেখা ও বন্ধ করার library। কেন দরকার, তা পরের Part-এ: <code>ros2 launch<\/code>-এর মতো প্রোগ্রাম বন্ধ করতে হলে তার <b>পুরো পরিবার<\/b> (child process) মারতে হয়।"},{"a":8,"b":10,"text":"ROS 2-র Python লাইব্রেরি তিনটি: <code>rclpy<\/code> (মূল), <code>Node<\/code> (mini-program-এর নকশা), আর <code>Twist<\/code> — চলার গতি/ঘোরার গতির বার্তা-ফরম্যাট। শেষের file-টি আমাদের robot-ওয়ালা <code>yahboom_joy_M3Pro.py<\/code>-তেও দেখা যাবে — এখানে এটি শুধু শূন্য-গতির ‘থামো’ বার্তা পাঠাতে ব্যবহৃত হবে।"},{"a":11,"b":11,"text":"<code>import time<\/code> — অপেক্ষা করার সরঞ্জাম। একটু পরের ‘subscriber-এর জন্য অপেক্ষা’ লুপে <code>time.sleep(0.1)<\/code> হিসেবে কাজে লাগবে।"},{"a":13,"b":15,"text":"<b>Global দুটি খালি বাক্স<\/b>: <code>launch_process = None<\/code> আর <code>run_process = None<\/code>। এখন খালি, কিন্তু <code>start_processes()<\/code> যখন দুটি ros2 কমান্ড চালু করবে, তখন সেই চলমান প্রোগ্রামের হাতল (handle) এই বাক্সে জমা হবে — পরে popup বন্ধ করার সময় এই হাতল ধরেই তাদের মারতে হবে, তাই module-এর শীর্ষে রাখা হয়েছে যাতে সব function দেখতে পায়।"}],"math":null,"robot":{"correct":"এই অংশ নিজে কিছু না করে অস্ত্রাগার গোছায়: কমান্ড চালানোর দরজা (subprocess), পর্দার জানালা (PyQt5), প্রোগ্রাম-শিকারি (psutil) আর কথা বলার ভাষা (rclpy/Twist) — সব হাতের কাছে রাখে।","incorrect":"এখানে কোনো ভুল না ঘটলেও missing import হলে script প্রথম লাইনেই মারা যেত — কিন্তু <code>joy.sh<\/code>-এর <code>; exec bash<\/code>-এর দৌলতে terminal খোলা থাকবে, তাই ত্রুটিটা অন্তত চোখের সামনে থাকবে।"},"id":"part-04","start":1,"end":16,"lang":"python","animType":null,"flags":[]},{"n":5,"fname":"start_joy_controller.py","enTitle":"Killing the Process Tree","explain":[{"a":18,"b":20,"text":"<code>def kill_process_tree(pid):<\/code> — নামেই কাজের কথা: একটি প্রোগ্রামকে <b>গাছসহ<\/b> মারা। <code>pid<\/code> (Process ID) হলো চলমান প্রোগ্রামের ব্যাজ-নম্বর — operating system প্রতিটি চলমান প্রোগ্রামকে একটি সংখ্যা দিয়ে চেনে।"},{"a":21,"b":23,"text":"<code>try:<\/code> দিয়ে ঝুঁকিপূর্ণ কাজ শুরু; <code>parent = psutil.Process(pid)<\/code> — ব্যাজ-নম্বর ধরে মূল প্রোগ্রামকে খুঁজে বের করা। তারপর <code>parent.children(recursive=True)<\/code> — এই প্রোগ্রাম যাদের জন্ম দিয়েছে (child), আর <code>recursive=True<\/code> মানে নাতি-নাতনিসহ <b>সব প্রজন্ম<\/b>। উদাহরণ: <code>ros2 launch<\/code> নিজে joy_node-কে জন্ম দেয় — তাই launch-কে মারতে হলে joy_node-ও মরতে হবে।"},{"a":24,"b":25,"text":"<code>child.kill()<\/code> লুপের ভেতরে — প্রতিটি child-কে জোর করে বন্ধ; সব বাচ্চা শেষ হলে <code>parent.kill()<\/code> — এবার মূল প্রোগ্রাম। <b>ক্রম ইচ্ছাকৃত<\/b>: আগে বাবাকে মারলে বাচ্চারা এতিম হয়ে পিছনে রয়ে যেত (init-এর কাছে গিয়ে লুকিয়ে প্রাণে বাঁচত)।"},{"a":26,"b":27,"text":"<code>except psutil.NoSuchProcess: pass<\/code> — প্রোগ্রামটি আগেই মরে থাকলে psutil এই ত্রুটি ছোড়ে; সেটাকে নীরবে গিলে <code>pass<\/code> — অর্থাৎ ‘যাক, ইতিমধ্যেই কাজ হয়ে গেছে’। এই ছোট্ট লাইনটিই script-কে দ্বিতীয়বার চালানো বা অর্ধেক-মরা অবস্থায় বন্ধ করার সময় ক্র্যাশ থেকে বাঁচায়।"},{"a":30,"b":32,"text":"<code>def close_event(event):<\/code> — popup জানালাটি <b>বন্ধ করা হলে<\/b> Qt যে ঘটনা-বার্তা পাঠায় তার হ্যান্ডলার। <code>event.accept()<\/code> — “হ্যাঁ, বন্ধ হতে দাও” — ছাড়া জানালা বন্ধই হতো না।"},{"a":33,"b":35,"text":"তারপর সংহার-ক্রম: <code>kill_process_tree(launch_process.pid)<\/code> ও <code>kill_process_tree(run_process.pid)<\/code> — Part 4-এর দুটি বাক্সে জমানো হাতল থেকে ব্যাজ-নম্বর নিয়ে দুই প্রোগ্রাম-পরিবার শেষ। শেষে <code>app.quit()<\/code> — Qt-র event loop বন্ধ, স্ক্রিপ্টের প্রাণ ফুরালো। লক্ষ করো: এখানে <code>try/except<\/code> নেই — কোনো প্রোগ্রাম আগেই মরে থাকলে <code>launch_process.pid<\/code> নিলেই psutil ভেতরে থাকা রক্ষাকবচে ধরা পড়বে।"}],"math":{"intro":"প্রসেস-গাছ হলো গ্রাফ-তত্ত্বের tree — parent-child সম্পর্কে বাঁধা। কেন আগে child মারতে হয়, সেটাই এই অংশের গণিত।","levels":[{"label":"Level 1 — গাছের আকার","latex":"\\[ |T| = 1 + \\sum_{c \\in \\text{children}} |T_c| \\]","text":"একটি প্রোগ্রামের গাছ = নিজে + প্রতিটি child-এর নিজস্ব গাছ। <code>recursive=True<\/code> এই সূত্রটিকেই কোডে বাস্তবায়ন করে।"},{"label":"Level 2 — ক্রমের শর্ত","latex":"\\[ \\text{kill(children first)} \\;\\Rightarrow\\; \\text{orphans} = 0 \\]","text":"আগে parent মারলে বাচ্চারা orphan হয়ে init-এর দত্তক হয় — কিন্তু <b>চলতে থাকে<\/b>। উল্টো ক্রমে গেলে গাছ শেষ হওয়ার পর এতিম থাকে না।"}],"numeric":[{"latex":"\\[ \\text{launch}(1) + \\text{joy\\_node}(1) + \\text{run}(1) + \\text{M3Pro node}(1) = 4 \\text{ প্রসেস} \\]","text":"সাধারণ চালু অবস্থায় কমপক্ষে ৪টি প্রসেস: দুটি যেটি Popen চালু করেছে, আর তাদের গর্ভে জন্ম নেওয়া দুটি আসল node। popup বন্ধ করলে চারটিই মরবে।"}],"mapping":[{"code":"parent.children(recursive=True)","math":"\\[ V_{\\text{desc}}(r) = \\{v : r \\to^{*} v\\} \\]","text":"কোডের এক লাইন = গাছের root থেকে পৌঁছানো যায় এমন সব vertex-এর সেট (descendants)।"}],"failure":["শুধু <code>parent.kill()<\/code> করলে (children ছাড়া) joy_node পিছনে বেঁচে থাকত — গেমপ্যাডের শ্রোতা রয়ে যেত, পরের বার চালু করলে দুটি কপি একসাথে কথা বলত।","<code>except NoSuchProcess<\/code> না থাকলে: কোনো প্রোগ্রাম আগেই ক্র্যাশ করে থাকলে popup বন্ধ করার মুহূর্তেই এই স্ক্রিপ্ট নিজে ক্র্যাশ করত — বন্ধ করার কাজ অসম্পূর্ণ থেকে যেত।","দুটি হাতলের (<code>launch_process<\/code>/<code>run_process<\/code>) কোনোটি এখনো <code>None<\/code> থাকা অবস্থায় যদি কেউ জানালা বন্ধ করত — তাহলে <code>None.pid<\/code> ত্রুটি হতো; বাস্তবে বন্ধ করার সুযোগ আসে খুব দেরিতে, তাই ঘটে না।"]},"robot":{"correct":"ব্যবহারকারী popup-টি বন্ধ করা মাত্র robot পরিষ্কারভাবে থেমে যাবে: joy_node, টেলিঅপ node — কেউই পিছনে রয়ে যাবে না; ROS বন্ধ হবে পরের Part-এর শেষ লাইনে।","incorrect":"যদি কোনোভাবে child মারা না হতো, robot ‘বন্ধ’ হয়েও চুপটি করে গেমপ্যাড শুনত থাকত — পরের সেশনে দুই শ্রোতার কানেক্টারে কমান্ড দুবার পড়ত, রোবট অদ্ভুত জোড়া-আচরণ করত।"},"id":"part-05","start":17,"end":35,"lang":"python","animType":"processTree","flags":[]},{"n":6,"fname":"start_joy_controller.py","enTitle":"start_processes — Popup & Subprocesses","explain":[{"a":38,"b":40,"text":"<code>def start_processes():<\/code> — এই file-এর হৃদয়। <code>global launch_process, run_process<\/code> — Part 4-এর খালি বাক্স দুটিতে এই function-এর ভেতর থেকে জিনিস ঢালব বলে আগেই ঘোষণা; না করলে Python ঢালার বদলে নতুন স্থানীয় বাক্স বানিয়ে ফেলত (বাইরের বাক্স খালিই থেকে যেত)।"},{"a":42,"b":48,"text":"Popup জানালা তৈরির পরম্পরা: <code>QMessageBox()<\/code> বানানো → লেখা <code>\"your controller is running...\"<\/code> → শিরোনাম <code>\"controller mode \"<\/code> → Information আইকন। তারপর দুটি কৌশলী সিদ্ধান্ত: <code>setStandardButtons(QMessageBox.NoButton)<\/code> — OK/CANCEL বাটনই থাকবে না, ফলে জানালাটি হঠাৎ বন্ধ হওয়ার পথ বন্ধ; আর <code>setWindowModality(Qt.NonModal)<\/code> — জানালা খোলা থাকলেও পর্দার অন্য কোথাও ক্লিক করা যাবে, সিস্টেম অচল হবে না।"},{"a":50,"b":51,"text":"<code>subprocess.Popen(['ros2', 'launch', 'yahboomcar_ctrl', 'yahboomcar_joy_launch.py'])<\/code> — মানুষের হাতে টাইপ করা কমান্ডের ঠিক সমতুল্য, কিন্তু background-এ: list-এর প্রথম শব্দটি program, বাকিগুলো তার arguments। ফেরত আসা হাতল <code>launch_process<\/code> বাক্সে জমা — এটিই Part 3-এর launch file চালু করে joy_node জাগালো।"},{"a":53,"b":54,"text":"দ্বিতীয় <code>Popen(['ros2', 'run', 'yahboomcar_ctrl', 'yahboom_joy_M3Pro'])<\/code> — আসল টেলিঅপ প্রোগ্রাম; এর হাতল <code>run_process<\/code>-এ। দুটি প্রোগ্রামই এখন সমান্তরালে চলছে, আর এই script তাদের তদারকি করছে।"},{"a":56,"b":56,"text":"<code>print(\"Joy controller start successful!!!\")<\/code> — terminal-এ সাফল্য-বার্তা। উৎসহীন দেখালেও দরকারি: নতুন window-টি যেখানে খোলা, সেখানে চোখ রাখলে এই লাইনই বলে দেয় দুটি প্রোগ্রাম ছাড়া হয়েছে।"},{"a":58,"b":59,"text":"<code>msg_box.closeEvent = close_event<\/code> — Python-এর বিখ্যাত <b>monkey-patching<\/b>: Qt-র জানালার ভেতরের ফাংশন-স্লটে আমাদের নিজের <code>close_event<\/code> (আগের Part) বসিয়ে দেওয়া — ফলে জানালার X বোতাম চাপলেই সংহার-ক্রম চলবে। তারপর <code>msg_box.show()<\/code> — জানালাটি আসলেই পর্দায় আসলো।"},{"a":61,"b":61,"text":"<code>app.exec_()<\/code> — Qt-র event loop: এখানেই script <b>অপেক্ষায় জমে<\/b> যায়, ঘটনার (ক্লিক, বন্ধ) পরম্পরা সামলাতে থাকে। ব্যবহারকারী জানালা বন্ধ না করা পর্যন্ত এই লাইন ফেরে না — আর ফিরলেই পরের লাইনে (Part 8) ROS বন্ধ হবে।"}],"math":null,"robot":{"correct":"Robot এই function চালানো মাত্র দুই স্তরে জেগে ওঠে: গেমপ্যাডের ড্রাইভার (joy_node) আর টেলিঅপ-মস্তিষ্ক (M3Pro), আর পর্দায় ভাসে ছোট্ট একটি জানালা — ‘চালক চালু আছে’। জানালা খোলা থাকা পর্যন্ত সবকিছু চলতেই থাকে।","incorrect":"NoButton না থাকলে ভুল হাতের টোকাতেই জানালা বন্ধ হয়ে পুরো নিয়ন্ত্রণ বন্ধ হয়ে যেত; NonModal না হলে জানালাটি পর্দার বাকি সব কাজ আটকে দিত। আর <code>closeEvent<\/code> বসানো না গেলে X চাপলে জানালা মুছে যেত ঠিকই, কিন্তু background-এর দুই প্রোগ্রাম অবিকল বেঁচে থেকে যেত — ভূতুড়ে নিয়ন্ত্রণ।"},"id":"part-06","start":36,"end":62,"lang":"python","animType":"guiSpawn","flags":[]},{"n":7,"fname":"start_joy_controller.py","enTitle":"autostart Node — The STOP Loop","explain":[{"a":64,"b":67,"text":"<code>class autostart(Node):<\/code> — নিজস্ব ROS 2 node-এর জন্ম। দুটি কথা মনে রাখো: Python-রীতিতে class-নাম বড় হাতের হয় (<code>Autostart<\/code>), এখানে ছোট হাতের <code>autostart<\/code> — চলে, কিন্তু রীতিভঙ্গ। <code>__init__<\/code> node জন্মের মুহূর্তেই চলে; <code>super().__init__('autostart_node')<\/code> ROS-এর খাতায় নাম লেখায় — বাইরে থেকে সবাই এটিকে <code>/autostart_node<\/code> নামে চিনবে।"},{"a":69,"b":71,"text":"<code>self.create_publisher(Twist, '/cmd_vel', 10)<\/code> — একটি রেডিও-স্টেশন খোলা যেটি <code>/cmd_vel<\/code> চ্যানেলে গান ছাড়বে; গানের ধরন Twist (সামনে-পিছনে গতি, ঘোরার গতি)। শেষের 10 হলো বার্তা-সারির ধারণক্ষমতা (queue depth) — এখানে বড় না হলেও চলে, কারণ পাঠানো বার্তা মাত্র এক-রকম।"},{"a":73,"b":76,"text":"শূন্যের বার্তা: <code>Twist()<\/code> বানিয়ে তিনটি ঘর স্পষ্টভাবে শূন্য করা — <code>linear.x<\/code> (সামনে/পিছনে), <code>linear.y<\/code> (ডানে-বাঁয়ে), <code>angular.z<\/code> (ঘূর্ণন)। অর্থাৎ <b>“একদম থামো”<\/b> — Twist-এর সব ঘর আদতে ডিফল্টই শূন্য, এখানে বোঝার সুবিধার জন্য লেখা হয়েছে।"},{"a":78,"b":83,"text":"এই file-এর সবচেয়ে চরিত্রগত লুপ: <code>while not self.cmd_vel_pub.get_subscription_count():<\/code> — <b>যতক্ষণ এই চ্যানেলে কেউ শুনছে না<\/b> ততক্ষণ: শূন্য-Twist ছাড়ো (“শূন্যে থামো” চিৎকার), লগ ছাপাও <code>Waiting for subscribers...<\/code>, 0.1 সেকেন্ড দম নাও — আবার শুরু। মোটর-নিয়ন্ত্রক যখন জেগে <code>/cmd_vel<\/code>-এ কান পাতবে, তখনই শর্ত ভঙ্গ।"},{"a":85,"b":87,"text":"লুপ ভাঙার পরেও একটি চূড়ান্ত <code>publish(twist)<\/code> — এবার শ্রোতা আছে, তাই এই ‘থামো’ সত্যিই পৌঁছাবে। এটি নিরাপত্তা-স্বভাব: নিয়ন্ত্রণ হাতবদলের আগে robot স্থির আছে নিশ্চিত করা। লগ-বার্তাটিও সেই ঘটনার সাক্ষ্য।"}],"math":{"intro":"এই লুপটি আসলে একটি <b>spinlock<\/b>-এর রোবট-সংস্করণ: কাউন্টার শূন্য থাকা পর্যন্ত ঘুরতে থাকা। এর খরচ ও আয়ু
