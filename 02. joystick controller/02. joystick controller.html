.’ বলতে থাকবে — কোনো সতর্কবার্তা নেই, timeout নেই; রোবট সাড়া দেবে না আর কারণ পর্দায় লুকিয়ে থাকবে লগের ভিড়ে।"},"id":"part-07","start":63,"end":88,"lang":"python","animType":"stopLoop","flags":[]},{"n":8,"fname":"start_joy_controller.py","enTitle":"Main — The Boot Sequence","explain":[{"a":90,"b":91,"text":"<code>if __name__ == \"__main__\":<\/code> — এই file-টি সরাসরি চালানো হলেই নিচের অংশ চলবে; অন্য কোনো file এটিকে import করলে নয়। ছোট script-এ এটি প্রথাগত স্বাস্থ্যকর অভ্যাস।"},{"a":93,"b":93,"text":"<code>rclpy.init()<\/code> — ROS 2-র যোগাযোগ-জগৎ চালু। এর আগে কোনো publisher/subscriber বানানো যায় না — তাই এটিই প্রথম কাজ।"},{"a":95,"b":95,"text":"<code>auto_start = autostart()<\/code> — আগের Part-এর node-এর জন্ম। মনে রাখো: এই এক লাইনের ভেতরেই পুরো STOP-লুপ ঘুরে গিয়েছিল — constructor শেষ হয়ই না, যতক্ষণ না মোটর-নিয়ন্ত্রক শ্রোতা হয়। অর্থাৎ এই লাইনে এসে script ‘রোবটকে থামিয়ে, নিয়ন্ত্রকের জন্য অপেক্ষা’ — দুই কাজ একসাথে শেষ করে।"},{"a":97,"b":97,"text":"<code>app = QApplication([])<\/code> — পর্দায় জানালা আঁকার ব্যবস্থাপনা তৈরি। খেয়াল করো ক্রমটির সৌন্দর্য: আগে ROS-এর কাজ (থামানো), <b>তারপর<\/b> পর্দার কাজ — ফলে popup দেখা যাওয়ার মুহূর্তেই রোবট নিশ্চিত স্থির।"},{"a":99,"b":99,"text":"<code>start_processes()<\/code> — Part 6-এর কেন্দ্রীয় function: দুটি ros2 প্রোগ্রাম ছাড়বে, popup দেখাবে, আর <code>app.exec_()<\/code>-এ অপেক্ষায় আটকে থাকবে। ব্যবহারকারী popup বন্ধ না করা পর্যন্ত এই লাইন ফেরে না — এখানেই পুরো স্ক্রিপ্টের সময়ের সিংহভাগ কাটে।"},{"a":101,"b":101,"text":"<code>rclpy.shutdown()<\/code> — popup বন্ধ, প্রোগ্রাম-গাছ মৃত (Part 5), এবার ROS-এর যোগাযোগ-জগৎও লুটিয়ে পড়লো। সাফ-সুতরো বিদায় — কোনো অবশিষ্ট থাকল না। ছোট্ট একটি পর্যবেক্ষণ: <code>auto_start<\/code> node-টির জন্য আলাদা <code>destroy_node()<\/code> ডাকা হয়নি — প্রোগ্রাম শেষ হয়ে যাচ্ছে বলে এখানে তার ক্ষতি নেই।"}],"math":null,"robot":{"correct":"পুরো জীবনচক্র এক নজরে: ROS চালু → থামা-বার্তা ও শ্রোতার প্রতীক্ষা → পর্দার প্রস্তুতি → দুই প্রোগ্রাম ছড়ানো ও popup প্রদর্শন → (ব্যবহারকারীর ইচ্ছায় দীর্ঘ নিয়ন্ত্রণ-সময়) → popup বন্ধ → সবকিছুর পরিষ্কার বিদায়।","incorrect":"ক্রম বদলালেই বিপদ: <code>rclpy.init()<\/code>-এর আগে node বানাতে গেলে সাথে সাথে ক্র্যাশ; <code>QApplication<\/code> ছাড়া popup দেখালে Qt অস্বীকার করত; আর shutdown না ডাকলে প্রোগ্রাম শেষ হলেও DDS-র নেটওয়ার্ক-সুতো ঝুলে থেকে পরের সেশনে গোলমাল করত।"},"id":"part-08","start":89,"end":101,"lang":"python","animType":null,"flags":[]},{"n":9,"fname":"yahboom_joy_M3Pro.py","enTitle":"Teleop Imports — The Toolbox","explain":[{"a":1,"b":2,"text":"<code>#!/usr/bin/env python<\/code> — একটি সূক্ষ্ম বিষয়: এখানে <code>python3<\/code> নয়, শুধু <code>python<\/code> লেখা। আধুনিক সিস্টেমে ভাগ্যিস <code>python<\/code> নামটি Python 3-ই নির্দেশ করে বলে সব চলে যায়; কিন্তু এমন পরিবেশে যেখানে <code>python<\/code> মানে Python 2 (বা নাম-ই নেই), সেখানে এই file সরাসরি চালাতে বিপদ। পরের লাইন <code># encoding: utf-8<\/code> — file-টি UTF-8 অক্ষরে লেখা বলে ঘোষণা।"},{"a":4,"b":5,"text":"<code>import os<\/code> — আমাদের খুঁজে দেখা গেল পুরো file-এ <code>os<\/code> আর <b>কোথাও ব্যবহৃত হয়নি<\/b>। নীরব যাত্রী — ক্ষতি নেই, তবে বাদ দিলেও কিছু যেত না।"},{"a":6,"b":9,"text":"<code>import time<\/code>, <code>import getpass<\/code>, <code>import threading<\/code> — সময় মাপা, বর্তমান ব্যবহারকারীর নাম জানা (একটু পরেই এটিই ঠিক করবে ম্যাপিং কোনটা চলবে), আর থ্রেড চালানো (হাত নাড়ানোর গোপন ইঞ্জিন)। সঙ্গে <code>from time import sleep<\/code> — একই সময়-toolbox থেকে সরাসরি <code>sleep<\/code> নামটি আনা: অর্থাৎ file-এ এখন <code>time.sleep(...)<\/code> ও খালি <code>sleep(...)<\/code> দুই রকমই লেখা যায় — দুটোই একই কাজ, দুই স্টাইল পাশাপাশি চলে।"},{"a":11,"b":15,"text":"ROS 2-র মূল সারি: <code>rclpy<\/code> ও <code>Node<\/code>; বার্তা-ফরম্যাট হিসেবে <code>Twist<\/code> (চাকার গতি), <code>Joy<\/code> (গেমপ্যাডের বাটন-অক্ষের তালিকা), <code>GoalID<\/code> (নেভিগেশনের লক্ষ্য-বাতিলের বার্তা)।"},{"a":16,"b":17,"text":"<code>from std_msgs.msg import Int32, Bool, UInt16, ColorRGBA<\/code> — চারটি সাধারণ বার্তা: পূর্ণসংখ্যা, সত্য/মিথ্যা, ১৬-বিট সংখ্যা, রঙ। পরের অংশে দেখা যাবে <code>Bool<\/code> (নিয়ন্ত্রণ-চালু পতাকা), <code>UInt16<\/code> (বাজার), <code>ColorRGBA<\/code> (LED) কাজে লাগছে — কিন্তু <code>Int32<\/code> কোথাও ব্যবহৃত হয়নি; আরেক নীরব যাত্রী।"},{"a":19,"b":21,"text":"<code>from arm_msgs.msg import ArmJoint<\/code> ও <code>ArmJoints<\/code> — এগুলো ROS-এর সাধারণ ভাণ্ডারের নয়, robot নির্মাতার নিজস্ব <b>custom message<\/b>: একটি একক হাত-জয়েন্টের কমান্ড, আর ছয় জয়েন্ট একসাথে। দুই লাইনে দুইবার import হয়েছে — এক লাইনেও চলত।"}],"math":null,"robot":{"correct":"প্রোগ্রাম শুরুর আগেই এই তালিকা ঠিক করে দেয় রোবট কী কী বুঝবে: গেমপ্যাডের ভাষা (Joy), চলার ভাষা (Twist), হাতের ভাষা (ArmJoint/ArmJoints), আর আলো-শব্দ-পতাকার ছোট ভাষাগুলো (ColorRGBA, UInt16, Bool, GoalID)।","incorrect":"একটাও দরকারি import বাদ গেলে প্রোগ্রাম শুরুতেই মারা যেত; আবার উল্টো দিকে অতিরিক্ত <code>os<\/code>/<code>Int32<\/code> জমে আছে — ক্ষতি নেই, শুধু পাঠকের চোখে ধোঁয়া। আর shebang-এর <code>python<\/code>-ছড়ি ভুল পরিবেশে ধরা পড়ত Python 2-তে — যেখানে এই code-এর বাক্যগত দেখতে-ঠিকই কিছু আচরণ অদ্ভুত হয়ে যেত।"},"id":"part-09","start":1,"end":23,"lang":"python","animType":null,"flags":[]},{"n":10,"fname":"yahboom_joy_M3Pro.py","enTitle":"Node Birth — Banner, State & Gears","explain":[{"a":24,"b":26,"text":"<code>class JoyTeleop(Node):<\/code> — টেলিঅপের মস্তিষ্ক, ROS 2 node হিসেবে। <code>def __init__(self, name):<\/code> বাইরে থেকে নাম নেবে, আর <code>super().__init__(name)<\/code> সেই নামেই ROS-এর খাতায় নথিভুক্ত করবে (পরে <code>main<\/code> থেকে নাম আসবে: <code>\"joy_ctrl\"<\/code>)।"},{"a":28,"b":32,"text":"শুরুর ব্যানার — terminal-এ সাজানো ঘোষণা: <code>\"=\"*50<\/code> মানে সমান-চিহ্নের ৫০টি প্রতিরূপ, তার নিচে শিরোনাম আর <code>Initializing Node...<\/code>। কাজে লাগে এইটুকুই: পর্দায় দেখেই বোঝা যায় প্রোগ্রামটা জেগেছে।"},{"a":34,"b":40,"text":"<b>অবস্থার খাতা<\/b> — এই ছয়টি চলকই পুরো node-এর স্মৃতি: <code>Joy_active = False<\/code> (চাকা-নিয়ন্ত্রণ শুরুতে <b>লক<\/b>, unlock করতে হবে), <code>arm_activa = False<\/code> (হাতও শুরুতে লক), <code>Buzzer_active = 0<\/code> (বাজার বন্ধ), <code>RGBLight_index = 0<\/code> (LED-র রঙ-নম্বর শূন্য), <code>cancel_time = time.time()<\/code> (debounce-র কাল-স্মৃতি: জন্মের মুহূর্তের ঘড়ি), আর <code>user_name = getpass.getuser()<\/code> — এই কম্পিউটারে বসে আছে কে? নামটাই পরে ঠিক করবে গেমপ্যাড-ম্যাপিং কোন ধরনের হবে।"},{"a":42,"b":44,"text":"নিরাপত্তা-গিয়ার দুটি: <code>linear_Gear = 1.0 / 3<\/code> আর <code>angular_Gear = 1.0 / 4<\/code> — চলার গতির এক-তৃতীয়াংশ, ঘোরার গতির এক-চতুর্থাংশ। নতুন চালক যতই স্টিক ঠেলুক, robot ধীরেই চলবে — গিয়ার বাড়ালে তবেই পুরো গতি।"},{"a":46,"b":47,"text":"আরও দুটি পতাকা: <code>loop_active = True<\/code> — হাত-চালানোর থ্রেডের প্রাণ-সুইচ (False হলে থ্রেড নিজেই বন্ধ হয়ে যাবে); <code>gripper_active = True<\/code> — একই ট্রিগার-বাটন দিয়ে গ্রিপার (Joint 6) নাকি Joint 5 (এই ধরনের হাতে সাধারণত কবজি) চলবে, তার বর্তমান মোড।"},{"a":48,"b":49,"text":"<code>self.arm_joints = [90, 120, 10, 20, 90, 0]<\/code> — ছয় জয়েন্টের <b>Home কোণ<\/b>। মন দিয়ে দেখো শেষ মানটি: Joint 6-এর (গ্রিপার) 0° — অথক একটু পরে দেখব এই জয়েন্টের নিজের অনুমোদিত সীমা 30° থেকে শুরু! অর্থাৎ Home-মানটি নিজের সীমার <b>নিচে<\/b> — প্রথম নড়াচড়ার সময় clamp এটিকে 30-এ টেনে তুলবে। শেষ লাইনে <code>self.arm_joint = ArmJoint()<\/code> — এক-জয়েন্ট কমান্ডের খালি বার্তা, বারবার পূরণ করে ব্যবহৃত হবে।"}],"math":{"intro":"এই অংশের দুটি সংখ্যা-সিদ্ধান্ত পুরো সিস্টেমের স্বভাব গড়ে: গিয়ারের ভগ্নাংশ আর Home-কোণের ভেক্টর।","levels":[{"label":"Level 1 — গিয়ার মানে গুণিতক","latex":"\\[ v_{\\text{actual}} = v_{\\text{stick}} \\times g, \\quad g_{\\text{linear}} = \\tfrac{1}{3}, \\; g_{\\text{angular}} = \\tfrac{1}{4} \\]","text":"স্টিক যতই পূর্ণ-ঠেলা দিক (±1) হোক, প্রকৃত গতি তার ভগ্নাংশ — গিয়ার একটি সাধারণ গুণিতক ছাড়া আর কিছু নয়।"},{"label":"Level 2 — Home ভেক্টর ও সীমা-জগৎ","latex":"\\[ \\mathbf{h} = (90, 120, 10, 20, 90, 0) \\in \\mathbb{R}^6, \\quad \\text{কিন্তু } h_6 = 0 < 30 = \\ell_6^{\\min} \\]","text":"Home-কোণ ছয় মাত্রার একটি বিন্দু; কিন্তু ষষ্ঠ মাত্রায় সে অনুমোদিত লেখচিত্রের (30–180) <b>বাইরে<\/b> — ভেক্টরটি প্রযোজ্য সীমার বহুভুজের বাইরের বিন্দু।"}],"numeric":[{"latex":"\\[ g_{\\text{linear}} = \\tfrac{1}{3} = 0.\\overline{3} \\approx 33\\%, \\quad g_{\\text{angular}} = \\tfrac{1}{4} = 25\\% \\]","text":"টার্মিনালে ছাপানো শতকরা মানগুলো এই ভগ্নাংশেরই দশমিক রূপ: চলার গতি ৩৩%, ঘোরা ২৫%।"},{"latex":"\\[ h_6 = 0 \\;\\xrightarrow{\\text{clamp}}\\; 30 \\quad (\\Delta = 30^{\\circ}) \\]","text":"প্রথম হাত-নির্দেশেই গ্রিপার-কোণ 0 থেকে লাফিয়ে 30 — সীমার একেবারে নিচের প্রান্তে গিয়ে বসবে; ‘Home’ নামের সঙ্গা আর সত্য অবস্থার মধ্যে ৩০ ডিগ্রির ফাঁক।"}],"mapping":[{"code":"self.linear_Gear = 1.0 / 3","math":"\\[ g := \\tfrac{1}{3} \\]","text":"কোডের ভগ্নাংশ-লেখা হুবহু গণিতের মান; Python-এ এটি float — পরে গিয়ার-চক্রে একই রকম লেখার সাথে তুলনা করা হবে (ভাগ্যিস একই অভিব্যক্তি, তাই হুবহু মিলবে)।"},{"code":"self.arm_joints = [90, 120, 10, 20, 90, 0]","math":"\\[ \\mathbf{h} \\in \\mathbb{R}^6 \\]","text":"তালিকা = ৬-মাত্রিক ভেক্টর; সূচক 0–5 মানে জয়েন্ট 1–6।"}],"failure":["গিয়ার 1.0 দিয়ে শুরু করলে প্রথমবারই স্টিক-ঠেলায় robot পূর্ণ গতিতে ছুটত — নতুন হাতে দুর্ঘটনার সবচেয়ে সহজ পথ।","Home-কোণের 0 বদলে 30 লেখা না থাকলে: প্রথম চালুতে গ্রিপার ঠিক করে অবস্থান নিত; এখন সে প্রতি বুটে ৩০°-র একটি লাফ দেয়।","<code>cancel_time<\/code> জন্মের ঘড়ি দিয়ে শুরু না হলে প্রথম unlock-চাপ debounce-তে গিলে যেত — ব্যবহারকারী ভাবত বোতাম নষ্ট।"]},"robot":{"correct":"Node জন্মানোর সাথে সাথে robot নিজের অবস্থা গুছিয়ে নেয়: চাকা-হাত দুই-ই লক, গিয়ার সবচেয়ে ধীর, বাজার বন্ধ, LED প্রথম রঙে, আর মনে রাখে কে চালাচ্ছে — সবই পরের Part-গুলোর কাজে লাগবে।","incorrect":"Home-তালিকার শেষ মান 0-এর কারণে চালু হওয়ার প্রথম হাত-নির্দেশে গ্রিপার একটুখানি লাফ দেবে; আর কেউ গিয়ার বাড়িয়ে রেখে বন্ধ করলে পরের বার চালু হলে স্মৃতি মুছে গিয়ে গিয়ার আবার ধীর — যা অভ্যস্ত চালকের চোখে ‘গতি কমে গেছে’ মনে হবে।"},"id":"part-10","start":24,"end":49,"lang":"python","animType":null,"flags":[]},{"n":11,"fname":"yahboom_joy_M3Pro.py","enTitle":"Publishers, Subscriber & Parameters","explain":[{"a":51,"b":52,"text":"প্রথম রেডিও-স্টেশন: <code>GoalID<\/code>-ধর্মী বার্তা <code>\"move_base/cancel\"<\/code> চ্যানেলে — নেভিগেশন-সিস্টেমকে ‘চলমান লক্ষ্য বাতিল করো’ বলার পথ। queue depth 10। কিন্তু কৌতূহলের খাতা খুললে দেখা যায়: পুরো file-এ এই স্টেশনে <b>আর কোথাও কিছু পাঠানো হয়নি<\/b> — publisher-টি তৈরি হয়ে অব্যবহৃতই থেকে যায় (ডেড কোড; শেষ Part-এর ফাংশনটির নাম এনেও একে ডাকে না)।"},{"a":53,"b":53,"text":"<code>self.pub_cmdVel = self.create_publisher(Twist, \"cmd_vel\", 1)<\/code> — সবচেয়ে গুরুত্বপূর্ণ স্টেশন: চাকার গতির আদেশ। লক্ষ করো depth মাত্র <b>1<\/b> — ইচ্ছাকৃত: গতির আদেশে পুরনোটা জমিয়ে রাখার দরকার নেই, নতুনটা এলেই সেটাই যাক (একে coalescing বলে)।"},{"a":54,"b":56,"text":"তিনটি ছোট স্টেশন: <code>UInt16<\/code> টাইপের <code>\"/beep\"<\/code> (বাজার, depth 1), <code>Bool<\/code> টাইপের <code>\"JoyState\"<\/code> (নিয়ন্ত্রণ চালু-বন্ধের ঘোষণা, depth 10), আর <code>ColorRGBA<\/code> টাইপের <code>\"rgb\"<\/code> (LED-র রঙ, depth 10)।"},{"a":57,"b":58,"text":"দুটি হাত-স্টেশন: <code>ArmJoint<\/code> টাইপের <code>\"arm_joint\"<\/code> (এক জয়েন্টের আদেশ) আর <code>ArmJoints<\/code> টাইপের <code>\"arm6_joints\"<\/code> (ছয় জয়েন্ট একসাথে) — দুটোরই depth <b>100<\/b>। কেন এত বড়? একটু পরে দেখব হাত-চালানোর থ্রেড প্রতি 0.5 সেকেন্ডে ধাপে ধাপে আদেশ পাঠায় — প্রতিটি ধাপ হারালে হাত থেমে থেমে যাবে, তাই লম্বা সারি।"},{"a":60,"b":61,"text":"একমাত্র কান: <code>create_subscription(Joy, \"joy\", self.buttonCallback, 10)<\/code> — <code>joy<\/code> চ্যানেলে গেমপ্যাড-ড্রাইভারের (Part 3-এর joy_node) প্রতিটি বার্তা এসে ঠিক <code>buttonCallback<\/code>-এ পৌঁছাবে। পুরো টেলিঅপ জন্মায় এই এক লাইন থেকে।"},{"a":63,"b":69,"text":"তিনটি <b>ROS parameter<\/b> ঘোষণা ও পঠন: <code>xspeed_limit=1.0<\/code>, <code>yspeed_limit=1.0<\/code>, <code>angular_speed_limit=5.0<\/code> — সর্বোচ্চ অনুমোদিত চলার/ঘোরার গতি, একক যথাক্রমে m/s ও rad/s। <code>declare_parameter<\/code> ডিফল্ট বসায়, launch file বা কমান্ড-লাইন থেকে চাইলে ওভাররাইড করা যায়; <code>get_parameter(...).get_parameter_value().double_value<\/code> সেই মানকে দশমিক সংখ্যায় তুলে নেয়। নিরাপত্তার সীমানা-প্রাচীর এখানেই দাঁড়ালো।"},{"a":71,"b":76,"text":"এবার <b>হাতের জন্য অপেক্ষার লুপ<\/b> — Part 7-এর STOP-লুপের আত্মীয়: <code>while not self.TargetAngle_pub.get_subscription_count():<\/code> — যতক্ষণ <code>arm6_joints<\/code>-এ কেউ শুনছে না, প্রতি চক্রে <code>pubSix_Arm(self.arm_joints)<\/code> দিয়ে Home-কোণের আদেশ পাঠিয়ে <code>time.sleep(1)<\/code> — প্রতি সেকেন্ডে একবার। হাত-নিয়ন্ত্রক জাগলে লুপের বাইরে এসে আরেকবার <code>pubSix_Arm<\/code> — এবার সেটি <b>পৌঁছাবে<\/b>: হাত Home-ভঙ্গিতে সজ্জিত।"},{"a":78,"b":79,"text":"সমাপ্তি-ঘোষণা: ‘System Ready! Press Share/Options button to unlock control.’ — অর্থাৎ <code>buttons[9]<\/code> (Share/Options) চাপলে নিয়ন্ত্রণ খুলবে (শেষ Part-এর cancel_nav); আর একটি ৫০-দাঁড়ির রেখা দিয়ে ব্যানার-অধ্যায় শেষ।"}],"math":{"intro":"Publisher-এর queue depth কেবল সাজসজ্জার সংখ্যা নয় — বার্তা কতটা জমতে পারবে তার গাণিতিক সিদ্ধান্ত। দুই জায়গায় সম্পূর্ণ বিপরীত মান বসানোয় কারণ আছে।","levels":[{"label":"Level 1 — সারির ক্ষমতার শর্ত","latex":"\\[ b \\;\\geq\\; \\lambda \\cdot \\tau \\]","text":"প্রেরক প্রতি সেকেন্ডে λটি বার্তা দেয়, গ্রাহক ব্যস্ত থাকলে τ সেকেন্ড পার করে — সারির গভীরতা b তখনই যথেষ্ট যখন জমা বার্তা তার মধ্যে আঁটে।"},{"label":"Level 2 — দুই চ্যানেলে দুই নীতি","latex":"\\[ b_{\\text{cmd}} = 1 \\;(\\text{নতুনটিই জয়ী),} \\quad b_{\\text{arm}} = 100 \\;(\\text{একটিও হারাবে না)} \\]","text":"গতির আদেশে পুরনো মানের মূল্য নেই — depth 1; হাতের ধাপে-ধাপে আদেশে প্রতিটি ধাপ মূল্যবান — depth 100।"}],"numeric":[{"latex":"\\[ \\lambda_{\\text{arm}} = 2\\,\\text{s}^{-1}, \\; \\tau = 1\\,\\text{s} \\;\\Rightarrow\\; \\lambda\\tau = 2 \\ll 100 \\]","text":"হাত-থ্রেড প্রতি সেকেন্ডে ২টি ধাপ-আদেশ দেয়; গ্রাহক এক সেকেন্ড ব্যস্ত থাকলেও জমে মাত্র ২টি — ১০০-এর সারি অনেক নিরাপদ প্রান্তে।"},{"latex":"\\[ T_{\\text{home-wait}} = n \\times 1\\,\\text{s}, \\quad n = \\text{চক্র-সংখ্যা} \\]","text":"হাত-নিয়ন্ত্রক ৪ সেকেন্ডে জাগলে Home-আদেশ ৪ বার শূন্যে যায়, পঞ্চমবার পৌঁছায় — অপেক্ষা মোটা দাগে সেকেন্ড-ঘড়িতেই গোনা যায়।"}],"mapping":[{"code":"create_publisher(Twist, \"cmd_vel\", 1)","math":"\\[ b = 1 \\Rightarrow \\text{keep-last} \\]","text":"সংখ্যাটি সরাসরি নীতির নাম — পুরনো বার্তা নতুনের কাছে স্থান ছাড়ে।"},{"code":"while not self.TargetAngle_pub.get_subscription_count():","math":"\\[ \\text{repeat until } c > 0 \\]","text":"লুপ-শর্তটি প্রাপ্যতার বুলিয়ান-ফাংশন; প্রতি চক্রে ১ সেকেন্ড ব্যয় — স্রোত-নিয়ন্ত্রিত পোলিং।"}],"failure":["হাত-নিয়ন্ত্রক node না চললে এই লুপও অসীম — terminal-এ আটকে থাকবে node, গেমপ্যাডের কোনো সাড়া আসবে না, কারণ constructor-ই শেষ হয়নি।","cmd_vel-এর depth বড় করে দিলে বিপদ: নিয়ন্ত্রণ বন্ধ করার পরেও সারিতে জমা পুরনো আদেশ পরপর কার্যকর হতে থাকত — robot থেমে যাওয়ার বদলে একটু এদিক-ওদিক করত।","গতি-সীমার parameter বড় করে দিলে (যেমন 5.0) সর্বোচ্চ গতি সরাসরি বেড়ে যাবে — নিরাপত্তা-প্রাচীর এক লাইনেই ভেঙে পড়ে।"]},"robot":{"correct":"এই অংশ শেষে robot সম্পূর্ণ সংযুক্ত: গেমপ্যাডের কথা শুনছে, চাকা-হাত-আলো-শব্দ-নেভিগেশন সব চ্যানেলে কথা বলার স্টেশন খোলা, হাত Home-ভঙ্গিতে অপেক্ষায় — টার্মিনালে ‘System Ready’ জ্বলজ্বল করছে।","incorrect":"হাত-নিয়ন্ত্রক না জাগলে robot কোনো অভিযোগ না করে চিরকাল ‘ওয়েটিং’-এ ডুবে থাকবে; আর সীমার parameter চুপচাপ বদলে গেলে robot হঠাৎ দ্রুত ছুটতে শুরু করবে — গিয়ার-স্টোরি যতই ধীর হোক, সীমাই শেষ প্রাচীর।"},"id":"part-11","start":50,"end":79,"lang":"python","animType":null,"flags":[]},{"n":12,"fname":"yahboom_joy_M3Pro.py","enTitle":"Arm Movement — Threads & Clamps","explain":[{"a":81,"b":82,"text":"<code>def pubSix_Arm(self, joints, id=6, angle=180.0, runtime=2000):<\/code> — ছয় জয়েন্ট একসাথে পাঠানোর সহায়ক। কৌতূহল: signature-এর <code>id<\/code> ও <code>angle<\/code> প্যারামিটার দুটি ফাংশনের ভেতরে <b>কোথাও ব্যবহৃতই হয়নি<\/b> — শুধু <code>joints<\/code> আর <code>runtime<\/code> কাজে লাগে। মৃত শোভা; ক্ষতি নেই, তবে পাঠক বিভ্রান্ত হতে পারে।"},{"a":83,"b":90,"text":"<code>ArmJoints()<\/code> বার্তা বানিয়ে তার ছয়টি ঘরে <code>joints<\/code> তালিকার ছয়টি মান বসানো (joint1 ← joints[0] ... joint6 ← joints[5]) — বাইরের তালিকার সূচক এক কমে ভেতরের নাম্বার-ঘরে; শেষে <code>arm_joint.time = runtime<\/code> — এই ভঙ্গিতে পৌঁছাতে হাতকে দেওয়া সময় (মিলিসেকেন্ড; ডিফল্ট 2000 = ২ সেকেন্ড)।"},{"a":91,"b":91,"text":"<code>self.TargetAngle_pub.publish(arm_joint)<\/code> — পূর্ণ-বার্তা ছাড়ালো <code>arm6_joints<\/code> চ্যানেলে। Part 11-এর অপেক্ষা-লুপ যেখানে বারবার এই ফাংশনই ডেকেছিল, এখানেই তার প্রাণ।"},{"a":93,"b":95,"text":"<code>def buttonCallback(self, joy_data):<\/code> — গেমপ্যাডের প্রতিটি বার্তা যেখানে ভিড় করে। প্রথম প্রহরী: <code>if not isinstance(joy_data, Joy): return<\/code> — বার্তাটি সত্যিই Joy প্রকারের কি না, না হলে নীরবে ফেরত। এক ধরনের টিকা: ভুল ধরনের ডেটা এলে নিচের লাইনগুলো ভেঙে পড়ত।"},{"a":97,"b":100,"text":"দ্বিতীয় প্রহরী — ব্যবহারকারীর নামে বিভাজন: <code>self.user_name == \"jetson\"<\/code> হলে <code>user_jetson(joy_data)<\/code> (robot-এর গায়ে বসে থাকা গেমপ্যাডের ম্যাপিং — পরের Part), নাহলে <code>user_pc(joy_data)<\/code>। একই প্রোগ্রাম, দুই চালনার আসন — নাম দেখে রুট বেছে নেয়।"},{"a":102,"b":107,"text":"<code>def pub_armjoint(self, id, direction):<\/code> — এক জয়েন্ট চালানোর ইঞ্জিন-ছাড়ার মুহূর্ত। প্রথমে <code>self.loop_active = True<\/code> (নতুন থ্রেডের প্রাণ-সুইচ জ্বালানো), তারপর <code>threading.Thread(target=self.arm_ctrl, args=(id, direction))<\/code> — আলাদা সূত্রে (thread) <code>arm_ctrl<\/code> চালুর ব্যবস্থা; <code>setDaemon(True)<\/code> — এটি daemon সূত্র: প্রধান প্রোগ্রাম মরলে এরাও আপনা-আপনি মরবে, পিছনে আটকে থাকবে না; <code>.start()<\/code> — ছুটলো।"},{"a":109,"b":112,"text":"<code>def arm_ctrl(self, id, direction):<\/code> — হাতের হৃৎস্পন্দন। <code>while 1:<\/code> অসীম লুপ; ভেতরে <code>if self.loop_active:<\/code> — সুইচ জ্বলছে তো চলো: <code>self.arm_joints[id - 1] += direction<\/code> — এই জয়েন্টের কোণ <b>প্রতি চক্রে ১ ডিগ্রি<\/b> বাড়ুক বা কমুক (direction অনুযায়ী)। সূচক <code>id - 1<\/code> — কারণ তালিকার গণনা শূন্য থেকে, জয়েন্টের নাম্বার এক থেকে।"},{"a":114,"b":123,"text":"<b>নিরাপত্তা-বেড়া<\/b> (clamp) — তিন শ্রেণিতে: জয়েন্ট 5 হলে কোণ 270-এর বেশি হলে 270, 0-এর কম হলে 0; জয়েন্ট 6 হলে 180 বা তার বেশি হলে 180 (গ্রিপার; সমতা-চিহ্নটি এখানে আচরণ বদলায় না — 180-এ দাঁড়ালে ওঠার দিকে ঠেকে যায়, নামার দিকে নয়), 30 বা তার কম হলে 30; বাকি সব (1–4) 0 থেকে 180। ভুল হাতের নাড়ি না পেরোনোই এই চার-সারির কাজ — হাত নিজেকে ভাঙতে পারবে না।"},{"a":125,"b":127,"text":"একক-জয়েন্ট বার্তা প্রস্তুতি: <code>self.arm_joint.id = id<\/code> (কোন জয়েন্ট), <code>self.arm_joint.joint = int(self.arm_joints[id - 1])<\/code> (লক্ষ্য-কোণ, পূর্ণসংখ্যায় নামানো), <code>self.arm_joint.time = 1000<\/code> — এই ধাপের জন্য ১ সেকেন্ড। একই বার্তা-বাক্স বারবার পূরণ হয় — নতুন করে বানানোর খরচ বাঁচানো।"},{"a":129,"b":133,"text":"<code>if self.arm_activa:<\/code> — <b>লক-পরীক্ষা<\/b>: নিয়ন্ত্রণ খোলা থাকলেই দুটো কাজ হবে — সুন্দর ছাপা (<code>UP<\/code>/<code>DOWN<\/code> direction-এর চিহ্ন অনুযায়ী, সঙ্গে বর্তমান কোণ) আর <code>self.pub_SingleTargetAngle.publish(self.arm_joint)<\/code> — আদেশ বাইরে যাবে। লক থাকলে? কোণের হিসাব <b>চলতেই থাকবে<\/b>, কেবল প্রকাশ বন্ধ — পরে খুললে হাত তৎক্ষণাৎ বর্তমান হিসাব-কোণে চলে যাবে।"},{"a":134,"b":136,"text":"লুপের হার-নিয়ন্ত্রণ ও মৃত্যু: <code>sleep(0.5)<\/code> — প্রতি অর্ধ-সেকেন্ডে এক ধাপ (অর্থাৎ জয়েন্ট-গতি ২°/সেকেন্ড); <code>else: break<\/code> — <code>loop_active<\/code> নিভে গেলে (পরের Part-এর সব-ছাড়া শর্ত) লুপ ভেঙে থ্রেডের দেহত্যাগ। বোতাম ছাড়া পর্যন্ত এই স্পন্দন চলতেই থাকে।"}],"math":{"intro":"হাত-চালনার তিনটি গাণিতিক স্তম্ভ: ধাপে-ধাপে বৃদ্ধি (সংখ্যাতত্ত্বে arithmetic progression), সীমা-বেড়া (clamp বা projection), আর সময়-নিয়ম (প্রতি ধাপে ১°, প্রতি ০.৫ সে)।","levels":[{"label":"Level 1 — কোণের প্রগতি","latex":"\\[ \\theta_{k+1} = \\theta_k + d, \\quad d \\in \\{-1, +1\\} \\;\\Rightarrow\\; \\theta_k = \\theta_0 + k\\,d \\]","text":"প্রতি চক্রে ±১ ডিগ্রি — কোণ সমান্তর প্রগতিতে এগোয়; k ধাপ পরে সরে ঠিক k ডিগ্রি।"},{"label":"Level 2 — clamp বা অভিক্ষেপ","latex":"\\[ \\theta \\mapsto \\Pi_{[\\ell, u]}(\\theta) = \\min(\\max(\\theta, \\ell), u) \\]","text":"অনুমোদিত ব্যবধি [ℓ, u]-এর বাইরের মান সবচেয়ে-কাছের প্রান্তে আঁটা হয় — জয়েন্ট 6-এর জন্য [ℓ, u] = [30, 180], 5-এর জন্য [0, 270], বাকিদের [0, 180]।"},{"label":"Level 3 — গতির স্তর","latex":"\\[ \\omega = \\frac{\\Delta\\theta}{\\Delta t} = \\frac{1^{\\circ}}{0.5\\,\\text{s}} = 2^{\\circ}/\\text{s} \\]","text":"প্রতি ধাপে দেওয়া সময়-মান 1000 ms-ও একই ছন্দ বলে — হাত-নিয়ন্ত্রক প্রতি সেকেন্ডে মাত্র ২° ঘোরার আদেশ পায়: মন্থর, নিয়ন্ত্রিত, নিরাপদ।"}],"numeric":[{"latex":"\\[ \\theta_0 = 120, \\; d = +1, \\; k = 60 \\;\\Rightarrow\\; \\theta_{60} = 180 \\;(\\text{বেড়ায় ঠেকে}) \\]","text":"গ্রিপার-জয়েন্ট 120° থেকে উপরের দিকে: ৬০ ধাপ × ০.৫ সে = <b>৩০ সেকেন্ডে<\/b> 180°-র দেয়ালে; এরপর প্রতিটি চক্রে হিসাব বলে 181, বেড়া তাকে 180-তেই ফিরিয়ে আনে।"},{"latex":"\\[ k_{\\text{সর্বোচ্চ}} = u - \\ell = 180 - 30 = 150 \\text{ ধাপ} = 75\\,\\text{s} \\]","text":"জয়েন্ট 6-এর পুরো পরিসর পাড়ি দিতে লাগে দেড়শো ধাপ — এই গতিতে ৭৫ সেকেন্ডেরও বেশি: ধীর হাত, বড় নিরাপত্তা।"}],"mapping":[{"code":"self.arm_joints[id - 1] += direction","math":"\\[ \\theta_{k+1} = \\theta_k + d \\]","text":"কোডের += চিহ্নই পুনরাবৃত্তি-সম্পর্ক; এক লাইনের পার্থক্য-সমীকরণ।"},{"code":"if self.arm_joints[id - 1] >= 180: self.arm_joints[id - 1] = 180","math":"\\[ \\Pi_{[30,180]}(\\theta) \\]","text":"শর্ত-সহ বরাদ্দ দুটি মিলেই min-max অভিক্ষেপ; ≥ লিখুক বা > — 180-প্রান্তে দাঁড়ানো মানের জন্য ফল একই।"}],"failure":["clamp না থাকলে: বোতাম চেপে ধরে থাকলে কোণ 180 পেরিয়ে 200, 300... হিসাবে বাড়তেই থাকত — হার্ডওয়্যার হয় মোটরের ক্ষমতায় আটকে গরম হতো, নয়তো দাঁত-ভাঙা গিয়ারের শব্দ করত।","<code>arm_activa<\/code> লক থাকা অবস্থায় বোতাম চেপে রাখলে অদৃশ্য ঋণ জমে: ভেতরের কোণ বদলাতে থাকে, বাইরে কিছু নড়ে না — খুললেই হাত হঠাৎ লাফিয়ে সেই জমা-কোণে যাবে (‘থেমে থেমে যাবে’ নয়, এক টানে)।","daemon না করলে (<code>setDaemon<\/code> ছাড়া) প্রোগ্রাম বন্ধের সময় জীবিত থ্রেড Python-এর প্রস্থান আটকে দিত — প্রসেস ঝুলে থেকে পরের সেশনে গোলমাল করত।","sleep(0.5) ছোট করলে গতি বাড়ে ঠিকই, কিন্তু হাত-নিয়ন্ত্রকের প্রতি সেকেন্ডের আদেশ-সংখ্যাও বাড়ে — সারির ১০০-ধারণক্ষমতা আর নিয়ন্ত্রকের হজম-ক্ষমতা দুই-ই চাপে পড়ে।"]},"robot":{"correct":"বোতাম চেপে ধরে থাকলে robot-এর হাত অদৃশ্য নিয়মে চলে: প্রতি অর্ধ-সেকেন্ডে ১° করে, নিজের সীমা-বেড়ায় আটকে, প্রতিটি ধাপ টার্মিনালে ছাপা হয় (লক খোলা থাকলে) — ছেড়ে দিলে অর্ধ-সেকেন্ডের মধ্যে থেমে যায়।","incorrect":"লক করা অবস্থায় হাত নড়বে না ঠিকই, কিন্তু ভেতরের হিসাব চুপচাপ বেড়েই চলে — খোলা মাত্র হাত জমা-পুরো পথ এক নিঃশ্বাসে পাড়ি দেবে; আর কোণ সীমা-প্রান্তে (যেমন 180) পৌঁছে থাকলে সেখানেই আটকে থাকবে — সেদিকে ঠেলা বৃথা যাবে, উল্টো দিকে নামলে আবার চলবে।"},"id":"part-12","start":80,"end":136,"lang":"python","animType":"armClamp","flags":[]},{"n":13,"fname":"yahboom_joy_M3Pro.py","enTitle":"Jetson Button Map — Joints 1–6","explain":[{"a":138,"b":139,"text":"<code>def user_jetson(self, joy_data):<\/code> — robot-এর গায়ে লাগানো গেমপ্যাডের জন্য ম্যাপিং-কক্ষ। প্রতিটি Joy বার্তার জন্য এই ফাংশন প্রাণপণে প্রশ্ন করে: কোন বোতাম/অক্ষ জেগে আছে, আর তার মানে কোন জয়েন্ট-নির্দেশ?"},{"a":140,"b":144,"text":"<code>buttons[10]<\/code> চাপা পেলে মোড-টগল: <code>self.gripper_active = not self.gripper_active<\/code> — একই ট্রিগার-বোতাম এবার থেকে গ্রিপারের (Joint 6) বদলে Joint 5-কে (এই হাতে সাধারণত কবজি-ঘূর্ণক) চালাবে, বা উল্টোটা। টার্মিনালে ছাপাও হয়: কোন মোডে ঢাললাম (লক্ষণীয়: প্রিন্টে বোতামের নাম ‘L1/L2’ বলা হয়েছে — গেমপ্যাডের ঘরানাগত নাম)।"},{"a":146,"b":149,"text":"<b>সমস্ত-নিস্তব্ধতার পরীক্ষা<\/b> — এই অংশটি মন দিয়ে পড়া সাপেক্ষে। শর্তটি হলো: বোতান 0, 1, 6, 3, 4 — <b>সবগুলোই<\/b> 0, এবং অক্ষ 7 ও 6 উভয়ই 0, এবং অক্ষ 5 ঠিক <b>−1 নয়<\/b> (অর্থাৎ ট্রিগার চেপে ধরা নেই)। সব মিললে <code>self.loop_active = False<\/code> — চলমান হাত-থ্রেডকে থামার নির্দেশ। চেইন-সমতার নিয়মে <code>a == b == c == 0<\/code> মানে (a=b) এবং (b=c) — অর্থাৎ সবাই 0; Python-এর এই সরুরী বাক্যরীতি চোখে পড়া দরকার।"},{"a":150,"b":150,"text":"<code>else:<\/code> — নিস্তব্ধতা পূর্ণ হয়নি, অর্থাৎ অন্তত একটি নিয়ন্ত্রণ চালু; এবার ম্যাপিং-তালিকা মেলানো হবে।"},{"a":151,"b":155,"text":"বোতাম-চতুষ্টয়: <code>buttons[3]<\/code> → জয়েন্ট 1 নিচে (<code>pub_armjoint(1, -1)<\/code>), <code>buttons[1]<\/code> → জয়েন্ট 1 উপরে, <code>buttons[0]<\/code> → জয়েন্ট 2 নিচে, <code>buttons[4]<\/code> → জয়েন্ট 2 উপরে। প্রতিটি চাপ আগের Part-এর থ্রেড-ইঞ্জিনকে ডাকে — মনে রাখো, বোতাম ধরে থাকলে প্রতিটি Joy বার্তায় নতুন থ্রেড ছুটবে, সবাই একই কোণে ±1 ধাক্কা দেবে।"},{"a":156,"b":157,"text":"D-pad-এর দুই অক্ষ মান-প্রদানকারী: <code>axes[6]<\/code> শূন্য না হলে জয়েন্ট 3, দিক <b>উল্টো<\/b> (<code>-joy_data.axes[6]<\/code>); <code>axes[7]<\/code> শূন্য না হলে জয়েন্ট 4, দিক সোজা। বোতামের মতো 0/1 নয় — অক্ষের জগতে −1 থেকে +1-এর ধারাবাহিক মান সম্ভব, আর <code>pub_armjoint<\/code> সেটিকে দিক হিসেবে কোণে যোগ করে (<code>+= direction<\/code>); তবে D-pad বাস্তবে কেবল ±1 বা 0 দেয় বলে কার্যত চিহ্নটিই দিক ঠিক করে।"},{"a":158,"b":163,"text":"ট্রিগার-জোড়া, মোড-অনুযায়ী: <code>gripper_active<\/code> সত্য হলে — <code>axes[5] == -1<\/code> (ট্রিগার পূর্ণ-চাপা) জয়েন্ট 6-কে dir −1 (টার্মিনাল-ছাপায় DOWN) দেয়, <code>buttons[6]<\/code> dir +1 (UP); মোড উল্টো হলে ঠিক একই দুই আঙুল জয়েন্ট 5 চালায়। অর্থাৎ হাতের আঙুল এক, লক্ষ্য-জয়েন্ট বদলায় উপরের টগলের ইশারায় — কম বোতামে বেশি কাজ, এই নকশার মূল কৌশল।"}],"math":{"intro":"এই Part-এর গণিত বুলিয়ান বীজগণিতের খেলা: চেইন-সমতা, সংযোজন (and), নিষেধ (≠), আর De Morgan-এর নিয়মে ‘চলন্ত অবস্থা’-র পূরক-রূপ।","levels":[{"label":"Level 1 — চেইন-সমতার বিস্তার","latex":"\\[ b_0 = b_1 = b_6 = b_3 = b_4 = 0 \\;\\equiv\\; (b_0 = 0) \\wedge (b_1 = 0) \\wedge \\cdots \\wedge (b_4 = 0) \\]","text":"Python-এর শৃঙ্খলিত তুলনা আসলে পাশাপাশি অনেকগুলো সমতার AND — পাঁচটি বোতামের একসাথে-নিস্তব্ধ থাকা।"},{"label":"Level 2 — সম্পূর্ণ থামার শর্ত S","latex":"\\[ S \\;=\\; \\underbrace{\\bigwedge_{i \\in \\{0,1,3,4,6\\}} (b_i = 0)}_{\\text{বোতাম}} \\;\\wedge\\; (a_7 = 0) \\wedge (a_6 = 0) \\;\\wedge\\; (a_5 \\neq -1) \\]","text":"S সত্য হলেই থ্রেড থামে। শেষ জোড়টি সূক্ষ্ম: ট্রিগার চাপা <b>থাকলে<\/b> (a₅ = −1) থামা হবে না — কারণ ট্রিগার নিজেই একটি চালনা-নিয়ন্ত্রণ।"},{"label":"Level 3 — De Morgan-এ চলন্ত অবস্থা","latex":"\\[ M = \\neg S = \\bigvee_{i} (b_i = 1) \\;\\vee\\; (a_7 \\neq 0) \\vee (a_6 \\neq 0) \\vee (a_5 = -1) \\]","text":"‘থামো’-র উল্টো পড়লেই ‘চলো’: যে-কোনো একটি বোতাম/অক্ষ জাগলেই হাত চলমান থাকবে — নিষেধ-চিহ্নগুলো উল্টে যায়, or-গুলো জোটে।"}],"numeric":[{"latex":"\\[ (b_3{=}1,\\; \\text{বাকি } 0;\\; a_7{=}0, a_6{=}0, a_5{=}1) \\;\\Rightarrow\\; S = \\bot, \\; M = \\top \\]","text":"শুধু বোতাম 3 চাপা: প্রথম সংযোগই মিথ্যা — S মিথ্যা, চলন্ত; জয়েন্ট 1 নিচের দিকে ধাপ দেবে।"},{"latex":"\\[ (\\text{সব } b_i = 0;\\; a_7{=}0, a_6{=}0;\\; a_5 = -1) \\;\\Rightarrow\\; S = \\bot \\]","text":"সব ছেড়ে দেওয়া হলেও <b>ট্রিগার চেপে থাকলে<\/b> থামা হবে না — একমাত্র এই অক্ষটিই −1 মানে ‘পূর্ণ-চাপা’, আর তা নিজেই হাতের হুক।"}],"mapping":[{"code":"joy_data.buttons[3] == 1: self.pub_armjoint(1, -1)","math":"\\[ (b_3 = 1) \\mapsto (\\text{id}, d) = (1, -1) \\]","text":"প্রতিটি বোতাম একটি (জয়েন্ট, দিক)-জোড়ার ফাংশন — ম্যাপিং মানেই এই অনুবন্ধন।"},{"code":"self.pub_armjoint(3, -joy_data.axes[6])","math":"\\[ d = -a_6 \\]","text":"অক্ষের মান ঋণাত্মক হওয়ায় দিক-উল্টানো — বাম-ঠেলা যেন জয়েন্টকে একই অনুভূতিতে নামায়।"}],"failure":["ট্রিগার চেপে ঘুমিয়ে পড়লে হাত থামবে না (S-এর শেষ ধারা) — জয়েন্ট 5/6 বেড়ায় ঠেকে অবধি ধাক্কা খেতেই থাকবে, চোখের সামনেই।","বোতাম-সূচি এক একান্তর করে লিখতে হয়েছে; নতুন গেমপ্যাডে বোতাম-নম্বর ভিন্ন হলে (যেমন কারও 0 আর কারও 2) একই আঙুল অন্য জয়েন্ট নাড়াবে — ম্যাপিং হার্ডকোডেড, শেখানো নয়।","বোতাম ধরে রাখলে প্রতিটি Joy বার্তায় নতুন থ্রেড: ১০ Hz হালে সেকেন্ডে দশটি থ্রেড একই কোণে ধাক্কা — গতি দশগুণ (২০°/সে), clamp বাঁচায় ঠিকই কিন্তু নকশা-গতির ধারণা ভেঙে যায়।"]},"robot":{"correct":"চালকের হাতের প্রতিটি ইশারা রোবটের হাতে পৌঁছায়: চার বোতামে জয়েন্ট 1–2, D-pad-এ 3–4, ট্রিগার-জোড়ায় (মোড-অনুযায়ী) গ্রিপার বা কনুই — সব আঙুল ছাড়ার সাথে সাথে অর্ধ-সেকেন্ডের মধ্যে হাত স্থির।","incorrect":"ট্রিগার আধো-চাপা রেখে অন্য সব ছেড়ে দিলে হাত থামবে না; আর ভিন্ন-নকশার গেমপ্যাড লাগালে একই বোতাম-নম্বর অন্য কাজ ডাকবে — রোবটের হাত অপ্রত্যাশিত জয়েন্ট নাড়াতে শুরু করবে, কোনো সতর্কবার্তা ছাড়াই।"},"id":"part-13","start":137,"end":163,"lang":"python","animType":"buttonMap","flags":[]},{"n":14,"fname":"yahboom_joy_M3Pro.py","enTitle":"Nav Cancel, RGB, Buzzer & Gears","explain":[{"a":165,"b":166,"text":"<code>if joy_data.buttons[9] == 1: self.cancel_nav()<\/code> — Share/Options বোতাম: নিয়ন্ত্রণ লক/আনলক-টগলের একমাত্র দরজা (Part 11-এর ‘System Ready’ ছাপাও এই বোতামের কথা বলেছিল)। ফাংশনের নাম <i>cancel_nav<\/i> হলেও ভেতরে নেভিগেশন-বাতিলের কোনো বার্তা পাঠানো নেই — সেই publisher (Part 11) কোথাও ব্যবহৃতই হয়নি। ভেতরের হিসাব শেষ Part-এর কেন্দ্রবিন্দু।"},{"a":168,"b":171,"text":"RGB LED রং-বদল: <code>buttons[7]<\/code> চাপা মাত্র <code>RGBLight_index<\/code> এক বাড়ে; কিন্তু ৭ পেরিয়ে গেলে আবার <b>০-তে ফিরে<\/b> যায় — আটটি রঙের বৃত্তাকার চাকা। সূচকটি ভাগফল নয়, শূন্যে রিসেট — ফলাফল একই, পথ ভিন্ন।"},{"a":172,"b":175,"text":"বার্তা-প্রস্তুতি ও প্রেরণ: <code>ColorRGBA()<\/code> বানিয়ে <code>rgb__msg.a = 100.0 + self.RGBLight_index<\/code> (নামটিতে দুই আন্ডারস্কোর — টাইপো-ঘরানার, তবু ধারাবাহিকভাবে ব্যবহৃত বলে নির্দোষ) — r,g,b ঘর ছাড়াই <b>শুধু a ঘর<\/b> ভরা হয়; অর্থাৎ রঙের নির্দেশ এই ক্ষেত্রে সূচক-সংখ্যা হিসেবেই যায় (ক্রমে 101…107, অষ্টম চাপে ঘুরেফিরে 100 — মোট আটটি মান), রং-মিশ্রণ হিসেবে নয়। তারপর publish আর ছাপা।"},{"a":177,"b":184,"text":"বাজার: <code>buttons[11]<\/code> চাপলে <code>Buzzer_active<\/code> 0↔1 টগল (0 হলে +1, নাহলে −1 — দুই-অবস্থার দোলন), সেই মান <code>UInt16<\/code> বার্তায় ভরে <code>/beep<\/code>-এ পাঠানো, টার্মিনালে ‘Beep!’। সরল দ্বি-অবস্থা সুইচ — চাপলে বাজে, আবার চাপলে থামে।"},{"a":186,"b":191,"text":"<b>চলার গিয়ার-চক্র<\/b>: <code>buttons[13]<\/code> চাপলে linear_Gear এক ধাপ বদলায় — বর্তমান মান যেটি হোক, চক্রটি 1 → 1/3 → 2/3 → আবার 1। খেয়াল করো তুলনাগুলো: <code>== 1.0<\/code>, <code>== 1.0 / 3<\/code>, <code>== 2.0 / 3<\/code> — ভাগশেষ-নয়, মান মিলিয়ে মিলিয়ে ধাপ; আর টার্মিনালে শতকরা ছাপা যায় (<code>int(gear × 100)<\/code>)।"},{"a":193,"b":199,"text":"<b>ঘোরার গিয়ার-চক্র<\/b>: <code>buttons[14]<\/code> — 1 → 1/4 → 1/2 → 3/4 → আবার 1, চার ধাপের বৃত্ত। দুই চক্র স্বাধীন: চলা ধীরে রেখেও ঘোরা দ্রুত করা যায়, বা উল্টোটা। এই দুই ভগ্নাংশই পরের Part-এ প্রকৃত গতির হিসাবে ঢুকবে।"}],"math":{"intro":"এই Part-এ তিনটি স্বতন্ত্র গাণিতিক ছক: রঙের চাকা (মডুলো-সদৃশ মোড়ানো), বাজারের দ্বি-অবস্থা দোলন, আর গিয়ারের চক্র-অবস্থা যন্ত্র (finite state machine)।","levels":[{"label":"Level 1 — রঙ-সূচকের মোড়ানো","latex":"\\[ i \\mapsto \\begin{cases} i + 1, & i \\leq 6 \\\\ 0, & i = 7 \\end{cases} \\;\\equiv\\; (i + 1) \\bmod 8 \\]","text":"কোডের if-রিসেট আর মডুলো-৮ একই ফল দেয় — আট রঙের বৃত্তে হাঁটা; বার্তায় যায় a = 100 + i।"},{"label":"Level 2 — বাজারের দোলন","latex":"\\[ z_{k+1} = 1 - z_k, \\quad z \\in \\{0, 1\\} \\]","text":"if/else-এর +1/−1 শুধু 0↔1 দুই অবস্থার মধ্যেই দোলে — একে <b>XOR-টগল<\/b>-ও বলা যায় (z ← z ⊕ 1)।"},{"label":"Level 3 — গিয়ার-চক্র","latex":"\\[ g_{\\ell}: 1 \\to \\tfrac{1}{3} \\to \\tfrac{2}{3} \\to 1, \\qquad g_{a}: 1 \\to \\tfrac{1}{4} \\to \\tfrac{1}{2} \\to \\tfrac{3}{4} \\to 1 \\]","text":"দুটি স্বাধীন চক্র-গ্রাফ: প্রতিটি চাপ বর্তমান শীর্ষ থেকে পরের শীর্ষে যায়; চক্রের দৈর্ঘ্য যথাক্রমে ৩ ও ৪।"}],"numeric":[{"latex":"\\[ i = 6 \\mapsto 7, \\quad i = 7 \\mapsto 0, \\quad a \\in \\{100, \\ldots, 107\\} \\]","text":"সূচক সাত ছাড়িয়ে শূন্যে পড়ে; a-মান ১০০ থেকে ১০৭ — আটটি চেনা রঙ, সূচক-হিসেবে পাঠানো।"},{"latex":"\\[ \\text{linear: } 100\\% \\to 33\\% \\to 66\\% \\to 100\\%, \\quad \\text{angular: } 100\\% \\to 25\\% \\to 50\\% \\to 75\\% \\to 100\\% \\]","text":"চাপে-চাপে টার্মিনালে ছাপানো যাত্রাপথ — int(gear×100) এই সংখ্যাগুলোই দেখায়; int() নিচের দিকে ছেঁটে দেয় (2/3 → 66, 1/3 → 33)।"}],"mapping":[{"code":"self.RGBLight_index = self.RGBLight_index + 1.0","math":"\\[ i \\leftarrow i + 1 \\;(\\text{mod } 8) \\]","text":"বৃদ্ধি-লাইন রৈখিক, প্রান্তে রিসেট-শর্তই মোড়ানো আনে — গণিতের মডুলো দুই লাইনে ভাগ করে লেখা।"},{"code":"elif self.linear_Gear == 2.0 / 3: self.linear_Gear = 1","math":"\\[ g \\mapsto \\sigma(g), \\; \\sigma = \\text{চক্র-পরবর্তী} \\]","text":"মান-মিলানো শৃঙ্খল আসলে অবস্থা-স্থানান্তর ফাংশন σ-এর শর্ত-ভিত্তিক রূপ।"}],"failure":["ভাসমান-সংখ্যার সমতা-তুলনা নাজুক: চক্রের মান সবসময় একই অভিব্যক্তি (1.0/3 ইত্যাদি) থেকে আসতে বলে হুবহু মেলে; কেউ গিয়ার বাইরে থেকে 0.333333 করে বসালে কোনো শাখাই মিলবে না — বোতাম চাপলে শুধু ছাপা হবে, গিয়ার বদলাবে না (নীরব অচল বোতাম)।","RGB-এ r/g/b ঘর ফাঁকা — পার্শ্বে রং-ব্যাখ্যা অন্যরকম হলে (যেমন কেউ a-কে উজ্জ্বলতা 0–1 ধরে) ১০০+ মান অদ্ভুত আচরণ করতে পারে; এখানে প্রোটোকলটি ‘সূচক-সংখ্যা’ হিসেবে স্থির।","দুই গিয়ার-বোতামের নম্বর (13/14) হার্ডকোডেড — অন্য গেমপ্যাডে একই আঙুল অন্য কাজে গেলে চালক হঠাৎ অজান্তেই গতি বদলে ফেলবে।"]},"robot":{"correct":"চালকের বোতামে রোবটের মেজাজ বদলায়: Share চাপলে নিয়ন্ত্রণ লক/আনলক, এক বোতামে LED আট রঙে ঘোরে, আরেকটিতে বাজার বাজে-থামে; দুই গিয়ার-বোতামে চলা ও ঘোরা আলাদা আলাদা ধাপে ধীর থেকে দ্রুত হয় — পরের Part-এ এই গিয়ারই গতির হিসাবে বসবে।","incorrect":"গিয়ারের ভাসমান-সমতা ভেঙে গেলে বোতাম চাপলে টার্মিনালে শতকরা ছাপা হবে অথচ গতি বদলাবে না — চালক ভাববে রোবট অবাধ্য; আর গেমপ্যাড বদলালে 13/14 নম্বর বোতাম অন্য কাজে গিয়ে মাঝ-চালনায় হঠাৎ গিয়ার লাফাবে।"},"id":"part-14","start":164,"end":199,"lang":"python","animType":"gearShift","flags":[]},{"n":15,"fname":"yahboom_joy_M3Pro.py","enTitle":"Speed Math — Deadzone to Twist","explain":[{"a":201,"b":204,"text":"<b>গতির মূল সমীকরণ-ত্রয়<\/b>: <code>xlinear_speed = filter_data(axes[1]) × xspeed_limit × linear_Gear<\/code> (সামনে-পিছনে — বাম স্টিকের উল্লম্ব অক্ষ), <code>ylinear_speed<\/code> একই সূত্রে <code>axes[0]<\/code> (অনুভূমিক) ও <code>yspeed_limit<\/code> দিয়ে, <code>angular_speed<\/code> = <code>filter_data(axes[2]) × angular_speed_limit × angular_Gear<\/code> (ঘূর্ণন — ডান স্টিক/অক্ষ 2)। অর্থাৎ: চালকের ঠেলা × নিরাপত্তা-সীমা × নির্বাচিত গিয়ার — তিনটি গুণিতকের গুণফল।"},{"a":206,"b":212,"text":"<b>শক্ত-সীমা (hard clamp)<\/b>: প্রতিটি গতিকে আবার তার সীমার ভেতরে জোর করে আনা — বেশি হলে সীমায়, কম (ঋণাত্মক প্রান্ত) হলে −সীমায়; তিন গতির জন্য জোড়ায় জোড়ায় if/elif। পরের মতলুগুলো দেখাবে: গাণিতিকভাবে এই জাল কখনও ধরাই দেয় না — তবু এটি ডিফেন্স-ইন-ডেপথ: কেউ সীমার মান বা গিয়ার ভুল করে বসিয়ে দিলে শেষ প্রাচীর হিসেবে কাজ করবে।"},{"a":214,"b":218,"text":"ফলাফল বার্তায় ভরা: <code>Twist()<\/code> বানিয়ে <code>linear.x ← xlinear<\/code>, <code>linear.y ← ylinear<\/code>, <code>angular.z ← angular<\/code> — তিনটি হিসাব-গতি তিন ঘরে বসে চাকার ভাষায় অনুবাদ হলো।"},{"a":219,"b":220,"text":"প্রকাশের শর্ত: <code>if self.Joy_active == True:<\/code> — নিয়ন্ত্রণ <b>আনলক<\/b> থাকলেই কেবল <code>pub_cmdVel.publish(twist)<\/code>। লক থাকলে হিসাব পুরো হবে (নিষ্প্রভ নয়), কেবল পাঠানো হবে না — রোবট নির্বিকার দাঁড়িয়ে থাকবে। শেষ Part-এর টগল-ই এই পতাকার মালিক।"},{"a":222,"b":225,"text":"<code>def user_pc(self, joy_data): pass<\/code> — PC-আসনের ম্যাপিং: <b>সত্যিই ফাঁকা<\/b>। Comment বলছে ‘সংক্ষেপের জন্য বাদ’ — কাঠামো রাখা, কাজ নেই। অর্থাৎ এই প্রোগ্রাম PC-তে চালালে গেমপ্যাডের কোনো নড়াচড়ায় গতি বা হাত কিছুই হবে না (Part 12-এর রাউটার ঠিক এখানেই পৌঁছাবে)।"},{"a":227,"b":232,"text":"<b>মৃত-অঞ্চল (deadzone) ছাঁকনি<\/b>: <code>filter_data(value)<\/code> — মানের পরম মান 0.2-এর কম হলে তাকে শূন্য করে দেওয়া, নাহলে অপরিবর্তিত ফেরানো। কাজ: হাত স্টিকের ঘাঁটিতে আলগা রাখলে যে ক্ষুদ্র তির্যক-মান (যেমন 0.03) ছড়ায়, তা রোবটকে অলস-ক্রমশ-চলতে বাধ্য করত — ছাঁকনি সেই হামাগুড়ি গিলে খায়।"}],"math":{"intro":"টেলিঅপারেশনের সম্পূর্ণ গতি-গণিত এই Part-এই: একটি টুকরো-টুকরো (piecewise) ছাঁকনি, তিনটি গুণিতক, একটি প্রকৃতপক্ষে-অতিরিক্ত বেড়া — আর সবশেষে একটি শর্ত-প্রকাশ।","levels":[{"label":"Level 1 — মৃত-অঞ্চল ফাংশন","latex":"\\[ f(v) = \\begin{cases} 0, & |v| < 0.2 \\\\ v, & |v| \\geq 0.2 \\end{cases} \\]","text":"সংজ্ঞা-অঞ্চল দুই টুকরো: ব্যান্ডের ভেতরে শূন্য, বাইরে অপরিবর্তিত — অবিচ্ছিন্ন কিন্তু প্রান্তে ছোট লাফওয়ালা (0.2 থেকে 0)।"},{"label":"Level 2 — গতির গুণফল","latex":"\\[ v_x = f(a_1) \\cdot L_x \\cdot g_{\\ell}, \\quad v_y = f(a_0) \\cdot L_y \\cdot g_{\\ell}, \\quad \\omega = f(a_2) \\cdot L_{\\omega} \\cdot g_{a} \\]","text":"প্রতিটি গতি তিন গুণিতকের গুণফল: চালকের অক্ষ-মান, নিরাপত্তা-সীমা, গিয়ার-ভগ্নাংশ। চালক প্রতিটি Joy বার্তায় এই গুণফল নতুন করে পায়।"},{"label":"Level 3 — বেড়ার প্রকৃত অবস্থা","latex":"\\[ |a| \\leq 1, \\; g \\leq 1 \\;\\Rightarrow\\; |v| = |f(a)| \\cdot L \\cdot g \\leq L \\]","text":"অক্ষের মান −1..+1 আর গিয়ার ≤ 1 — তাই গুণফল কখনোই সীমা ছাড়াতে পারে না; clamp-এর শর্ত (v &gt; L) গাণিতিকভাবে <b>অসম্ভব<\/b>, জালটি অব্যবহৃতই থাকে (তবু রাখা হয়েছে — ভবিষ্যতের ভুল সীমা/গিয়ারের বিপক্ষে শেষ-প্রাচীর)।"}],"numeric":[{"latex":"\\[ a_1 = 0.15: \\; |0.15| < 0.2 \\Rightarrow f = 0 \\Rightarrow v_x = 0 \\]","text":"সামান্য-কাত স্টিক: ছাঁকনিই শূন্য করে দিল — গুণফলের দরকারই হলো না; রোবট স্থির।"},{"latex":"\\[ a_1 = 0.8, \\; L_x = 1.0, \\; g_{\\ell} = \\tfrac{1}{3}: \\; v_x = 0.8 \\times 1.0 \\times 0.\\overline{3} = 0.267\\ \\text{m/s} \\]","text":"পূর্ণ-না-ঠেলা স্টিক, ডিফল্ট গিয়ার: গতি মাত্র ০.২৬৭ m/s — গিয়ার না বাড়ালে রোবট জোর করেই ধীর।"},{"latex":"\\[ a_2 = 0.9, \\; L_{\\omega} = 5.0, \\; g_a = \\tfrac{1}{4}: \\; \\omega = 0.9 \\times 5.0 \\times 0.25 = 1.125\\ \\text{rad/s} \\]","text":"ঘূর্ণনের হিসাবও একই ছাঁচ: সীমা বড় (5.0) বলে গিয়ার-ভগ্নাংশই তাকে সভ্য রাখে — আধা-ঘূর্ণন-অক্ষে প্রতি সেকেন্ডে এক-একটু বেশি রেডিয়ান।"}],"mapping":[{"code":"self.filter_data(joy_data.axes[1])","math":"\\[ f(a_1) \\]","text":"ফাংশন-কল মানেই টুকরো-ফাংশন প্রয়োগ — কোডের নামই গণিতের নাম।"},{"code":"xlinear_speed > self.xspeed_limit: xlinear_speed = self.xspeed_limit","math":"\\[ v \\leftarrow \\Pi_{[-L, L]}(v) \\]","text":"দুই শাখার if/elif মিলেই min-max অভিক্ষেপ — Part 12-এর কোণ-বেড়ার গতি-রূপ।"}],"failure":["মৃত-অঞ্চল বাদ দিলে (0.2 → 0): ঘাঁটিতে আলগা হাতের 0.03-ও গতি হয়ে যেত — রোবট চালক-অজান্তেই মিলিমিটার-মিলিমিটার এঁকেবেঁকে সরতে থাকত।","মৃত-অঞ্চল বড় করে দিলে (যেমন 0.5): সূক্ষ্ম নিয়ন্ত্রণ মরে — হালকা ঠেলায় সাড়া নেই, হঠাৎ বড় ঠেলায় লাফ; চালকের হাতে ‘খালি ঘূর্ণনের’ অনুভূতি।","Joy_active-পরীক্ষা ভুলে গেলে: লক করা অবস্থাতেও গতি যেত — ‘Share চেপে থামালাম’-এর নিরাপত্তা-অর্থ পুরো উঠে যেত।","user_pc ফাঁকা থাকায় PC-তে চালালে সব নীরব: কোনো গতি নয়, কোনো ত্রুটি-বার্তাও নয় — চালকের চোখে ‘কিছুই কাজ করছে না’-র নীরব কারণ এই স্টাব।"]},"robot":{"correct":"প্রতিটি গেমপ্যাড-মুহূর্তে রোবট এই নল-পথ পার করে: স্টিকের মান → মৃত-অঞ্চলে ছাঁকা → সীমা ও গিয়ারে গুণ → Twist-এ ভরা → আনলক থাকলে চাকায় পাঠানো। হাত সরালে মান ব্যান্ডে পড়ে শূন্যে — রোবট থামে।","incorrect":"লক অবস্থায় স্টিক ঠেললে রোবট নড়বে না ঠিকই, কিন্তু আনলকের মুহূর্তে স্টিক একই জায়গায় থাকলে সে-ই মুহূর্তে ছুটতে শুরু করবে; আর PC-তে চালালে কিছুই ঘটবে না — কারণ সেই রাস্তার ম্যাপিং ইচ্ছাকৃতভাবে খালি (pass)।"},"id":"part-15","start":200,"end":232,"lang":"python","animType":"speedPipeline","flags":[]},{"n":16,"fname":"yahboom_joy_M3Pro.py","enTitle":"Control Toggle & Shutdown","explain":[{"a":234,"b":238,"text":"<code>def cancel_nav(self):<\/code> — একটি বোতামের নামে দুটি সত্যিকারের দায়িত্ব: নিয়ন্ত্রণের লক/আনলক টগল আর স্থির-করা (শূন্য-গতি ব্রডকাস্ট)। নেভিগেশন-বাতিল কেবল <b>নামে<\/b> — Part 11-এ তৈরি <code>move_base/cancel<\/code>-এর publisher পুরো file-এ কোথাও ব্যবহৃত হয়নি, এই ফাংশনও তাকে ডাকে না। প্রথমেই <code>now_time = time.time()<\/code> (এখন-ক্ষণ), তারপর <b>debounce-র দুয়ার<\/b>: <code>if now_time - self.cancel_time > 1:<\/code> — আগের কার্যকর চাপের পর এক সেকেন্ড পার হয়নি তো পুরো ফাংশন নীরবে ফেরত। এক বোতাম সেকেন্ডে অনেকবার বার্তা দিলেও (Joy-প্রবাহে) কার্যকর হবে মাত্র প্রথমটি।"},{"a":239,"b":242,"text":"দুয়ার পেরোলে: <code>Joy_ctrl = Bool()<\/code> বার্তা; <code>self.Joy_active = not self.Joy_active<\/code> ও <code>self.arm_activa = not self.arm_activa<\/code> — <b>দুই পতাকা একসাথে উল্টে<\/b> (চাকা ও হাত একই তালে খোলে/বন্ধ হয়); <code>Joy_ctrl.data = self.Joy_active<\/code> — নতুন অবস্থা বার্তায় ভরা।"},{"a":244,"b":248,"text":"টার্মিনালে স্পষ্ট ঘোষণা: খুললে <code>CONTROL UNLOCKED! (Wheels + Arm Active)<\/code>, বন্ধ করলে <code>CONTROL LOCKED. (Paused)<\/code> — চালকের চোখে এই লাইনই নিশ্চয়তা যে টগল হয়েছে, না হয়েছে না।"},{"a":250,"b":253,"text":"তারপর <b>তিনবারের ব্রডকাস্ট<\/b>: লুপে তিনবার <code>pub_JoyState.publish(Joy_ctrl)<\/code> (‘নিয়ন্ত্রণের নতুন অবস্থা’ — নেভিগেশন-পাইলটসহ যে-কেউ শুনুক) এবং তিনবার <code>pub_cmdVel.publish(Twist())<\/code> — খালি Twist মানে শূন্য-শূন্য-শূন্য: রোবটকে তাৎক্ষণিক স্থির করা। শেষে <code>self.cancel_time = now_time<\/code> — দুয়ারের কাল-স্মৃতি এই মুহূর্তে রাখা, পরের চাপের এক-সেকেন্ড গণনা এখান থেকেই।"},{"a":256,"b":258,"text":"<code>def main():<\/code> — প্রোগ্রামের প্রবেশদ্বার: <code>rclpy.init()<\/code> ROS-জগৎ চালু, তারপর <code>JoyTeleop(\"joy_ctrl\")<\/code> — নাম-সহ node-এর জন্ম (Part 11-এর অপেক্ষা-লুপসহ পুরো constructor এই লাইনেই সম্পন্ন হয়)।"},{"a":259,"b":262,"text":"<code>rclpy.spin(joy_ctrl)<\/code> — হৃদয়-স্পন্দনের কেন্দ্র: থ্রেডকে অপেক্ষায় রেখে প্রতিটি আগত Joy বার্তা <code>buttonCallback<\/code>-এ পৌঁছে দেয় — Ctrl+C (KeyboardInterrupt) না আসা পর্যন্ত এই লাইনই প্রোগ্রামের ঘড়ি। ছোট অসামঞ্জস্য: এখানকার <code>joy_ctrl<\/code> হলো node-বস্তু, আর constructor-এর name-ও একই নামের string — দুই জিনিস, এক বানান।"},{"a":263,"b":265,"text":"<code>finally:<\/code> — যেভাবেই শেষ হোক (Ctrl+C বা ত্রুটি), বিদায়ের দুই ধাপ: <code>joy_ctrl.destroy_node()<\/code> (নোডের সম্পদ ফেরত দেওয়া — publisher-সাবস্ক্রিপশনের হিসাব মেলানো) এবং <code>rclpy.shutdown()<\/code> (ROS-জগতের দীপ নেভানো)। প্রিন্ট-করা বিদায়-বার্তাটি KeyboardInterrupt-শাখায় — টার্মিনালে ‘Shutting down...’ দেখলেই বোঝো কেউ Ctrl+C চেপেছে।"}],"math":{"intro":"শেষ Part-এর গণিত একটি সময়-দুয়ার (debounce gate) আর একটি দ্বি-স্থির টগল (flip-flop) — সঙ্গে নির্ভরযোগ্যতার জন্য তিনবার-পুনরাবৃত্তির প্রাথমিক হিসাব।","levels":[{"label":"Level 1 — দুয়ারের শর্ত","latex":"\\[ \\text{কার্যকর} \\iff t_{\\text{now}} - t_{\\text{last}} > 1\\,\\text{s} \\]","text":"কঠোর অসমতা: ঠিক এক সেকেন্ড পরেও (>) নয়, তার বেশি হলেই কেবল দুয়ার খোলে।"},{"label":"Level 2 — দ্বি-স্থির টগল","latex":"\\[ J_{k+1} = \\neg J_k, \\quad A_{k+1} = \\neg A_k \\;\\Rightarrow\\; (J, A) \\in \\{(\\top,\\top), (\\bot,\\bot)\\} \\]","text":"দুই পতাকা সবসময় একসাথে উল্টে বলে জোড়াটি কেবল দুই অবস্থায় থাকে — চাকা-হাত আলাদা হয়ে যায় কখনও না।"},{"label":"Level 3 — তিনবারের প্রেরণ","latex":"\\[ P(\\text{সব কপি হারা}) = q^3, \\quad 0 \\leq q < 1 \\]","text":"এক কপি হারার সম্ভাবনা q হলে তিন কপির সব-হারা সম্ভাবনা q³ — q = 0.1 হল /* ---------------- utilities ---------------- */
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const pad2 = n => String(n).padStart(2, '0');

/* ---------------- syntax highlighting (presentation-only) --------
   A single-pass scanner over the RAW line that groups characters into
   tokens and only afterwards escapes them. The underlying text is
   never altered — spans are purely cosmetic.                        */
const PY_KW = new Set(['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield']);
const PY_BLT = new Set(['print','input','range','float','int','str','len','open','sorted','super','set','list','dict','type','abs','min','max','round','enumerate','isinstance','self']);
const SH_KW = new Set(['if','then','else','elif','fi','for','while','do','done','case','esac','function','export','return','in','local']);
const SH_CMD = new Set(['docker','ros2','gnome-terminal','bash','sh','python3','sleep','source','export','echo','cat','run','launch','pub','topic','start','stop','exec']);

function tokenizeLine(line, lang) {
  if (lang === 'text') return line === '' ? [] : [{ t: line, c: '' }];
  const toks = [];
  const push = (t, c) => { if (t) toks.push({ t: t, c: c }); };
  let i = 0;
  const n = line.length;
  while (i < n) {
    const c = line[i];
    if (c === '#') { push(line.slice(i), 'com'); break; }
    if (c === '\'' || c === '"') {
      let j = i + 1;
      while (j < n && line[j] !== c) j++;
      const end = Math.min(j + 1, n);
      push(line.slice(i, end), 'str');
      i = end; continue;
    }
    if (/[0-9]/.test(c) && !(i > 0 && /[A-Za-z0-9_]/.test(line[i - 1]))) {
      let j = i;
      while (j < n && /[0-9a-fA-FxXoObB._]/.test(line[j])) j++;
      push(line.slice(i, j), 'num');
      i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const word = line.slice(i, j);
      if (/^[fFrRbBuU]{1,2}$/.test(word) && j < n && (line[j] === '\'' || line[j] === '"')) {
        const q = line[j];
        let k = j + 1;
        while (k < n && line[k] !== q) k++;
        const end = Math.min(k + 1, n);
        push(line.slice(i, end), 'str');
        i = end; continue;
      }
      let cls = '';
      const KW = lang === 'python' ? PY_KW : SH_KW;
      const BLT = lang === 'python' ? PY_BLT : SH_CMD;
      if (KW.has(word)) cls = 'kw';
      else if (BLT.has(word)) cls = 'blt';
      else if (lang === 'python' && j < n && line[j] === '(') cls = 'fn';
      push(word, cls);
      i = j; continue;
    }
    let j = i;
    while (j < n && !/[#'"0-9A-Za-z_]/.test(line[j])) j++;
    if (j === i) j = i + 1;
    push(line.slice(i, j), '');
    i = j;
  }
  return toks;
}
function hl(line, lang) {
  if (line === '') return '';
  return tokenizeLine(line, lang).map(t =>
    t.c ? '<span class="tok-' + t.c + '">' + escHtml(t.t) + '</span>' : escHtml(t.t)
  ).join('');
}
function rawLines(fname, a, b) {
  return FILEDATA[fname].slice(a - 1, b);
}

/* ---------------- sidebar ---------------- */
function renderSidebar() {
  const total = PARTS.length;
  const files = Object.keys(FILEDATA).length;
  document.getElementById('sb-meta').textContent = files + ' files · ' + total + ' Parts';
  const nav = document.getElementById('sb-nav');
  nav.innerHTML = PARTS.map(p =>
    '<a class="sb-item" href="#' + p.id + '" data-target="' + p.id + '">' +
      '<span class="sb-num">' + pad2(p.n) + '</span>' +
      '<span class="sb-name">' + escHtml(p.enTitle) + '</span>' +
    '</a>'
  ).join('');
}

/* ---------------- part sections ---------------- */
function codeCard(p) {
  const lines = rawLines(p.fname, p.start, p.end);
  const rows = lines.map((ln, i) => {
    const no = p.start + i;
    return '<div class="cl"><span class="cln">' + no + '</span><span class="clc">' + hl(ln, p.lang) + '</span></div>';
  }).join('');
  const raw = lines.join('\n');
  return '' +
  '<div class="code-card" data-copy-src="' + p.id + '">' +
    '<div class="code-card-head">' +
      '<span class="dots"><i></i><i></i><i></i></span>' +
      '<span class="code-fname">' + escHtml(p.fname) + '</span>' +
      '<button class="copy-btn" data-copy="' + p.id + '">Copy</button>' +
      '<span class="code-lines-chip">L' + p.start + (p.end > p.start ? '–' + p.end : '') + '</span>' +
    '</div>' +
    '<div class="code-scroll"><pre class="code"><code>' + rows + '</code></pre></div>' +
  '</div>';
}

function explainBlock(p) {
  if (!p.explain || !p.explain.length) return '';
  const entries = p.explain.map(e => {
    const snippetLines = rawLines(p.fname, e.a, e.b);
    const rendered = snippetLines.map(ln => hl(ln, p.lang)).join('\n');
    const label = e.a === e.b ? ('L ' + e.a) : ('L ' + e.a + '–' + e.b);
    return '' +
    '<div class="ex-entry">' +
      '<div class="ex-snippet"><span class="ex-lines">' + label + '</span>' +
        '<pre>' + rendered + '</pre></div>' +
      '<div class="ex-arrow">↓</div>' +
      '<div class="ex-text bn">' + e.text + '</div>' +
    '</div>';
  }).join('');
  return '' +
  '<div class="sec sec-ex">' +
    '<div class="sec-head"><span class="badge badge-ex">EX</span><h3>Line-by-Line Explanation</h3></div>' +
    '<div class="sec-body">' + entries + '</div>' +
  '</div>';
}

function mathBlock(p) {
  const m = p.math;
  if (!m) return '';
  const levels = (m.levels || []).map(v =>
    '<div class="math-level">' +
      '<div class="ml-label">' + v.label + '</div>' +
      '<div class="mathy">' + v.latex + '</div>' +
      '<div class="ml-text bn">' + v.text + '</div>' +
    '</div>'
  ).join('');
  const numeric = (m.numeric || []).map(v =>
    '<div class="math-level">' +
      '<div class="mathy">' + v.latex + '</div>' +
      '<div class="ml-text bn">' + v.text + '</div>' +
    '</div>'
  ).join('');
  const mapping = (m.mapping || []).map(v =>
    '<div class="map-row">' +
      '<div class="map-code"><code>' + escHtml(v.code) + '</code></div>' +
      '<div class="map-math mathy">' + v.math + '</div>' +
      '<div class="map-text bn">' + v.text + '</div>' +
    '</div>'
  ).join('');

/* ================================================================
   ANIMATION SYSTEM
   Engine: cancellable, speed-scaled, pause-aware rAF scheduler.
   Every animation renders inline SVG, updates a live Bangla caption
   and a live formula bar. No animation libraries are used.
   ================================================================ */

const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBounce = t => {
  const n1 = 7.5625, d1 = 2.75;
  if (t < 1 / d1) return n1 * t * t;
  if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + .75;
  if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + .9375;
  return n1 * (t -= 2.625 / d1) * t + .984375;
};
const fmt = (v, d) => Number(v).toFixed(d === undefined ? 3 : d);

/* ---------------- small SVG string helpers ---------------- */
function rrect(x, y, w, h, rx, fill, stroke, extra) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
    '" rx="' + (rx === undefined ? 8 : rx) + '" fill="' + fill + '"' +
    (stroke ? ' stroke="' + stroke + '" stroke-width="1"' : '') +
    (extra || '') + '/>';
}
function txt(x, y, s, o) {
  o = o || {};
  return '<text' + (o.id ? ' id="' + o.id + '"' : '') + ' x="' + x + '" y="' + y + '" fill="' + (o.fill || '#c9d1d9') +
    '" font-size="' + (o.size || 13) + '"' +
    ' font-family="' + (o.mono ? "'JetBrains Mono',monospace" : "'Hind Siliguri','Inter',sans-serif") + '"' +
    (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') +
    (o.weight ? ' font-weight="' + o.weight + '"' : '') +
    (o.op !== undefined ? ' opacity="' + o.op + '"' : '') + '>' + s + '</text>';
}
function line(x1, y1, x2, y2, stroke, w, extra) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
    '" stroke="' + stroke + '" stroke-width="' + (w || 1.5) + '"' +
    (extra || '') + '/>';
}
function circ(x, y, r, fill, extra) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill + '"' + (extra || '') + '/>';
}
function arrow(x1, y1, x2, y2, color, marker, w) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
    '" stroke="' + color + '" stroke-width="' + (w || 2) +
    '" marker-end="url(#' + marker + ')"' + '/>';
}
function path(d, stroke, w, extra) {
  return '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '/>';
}

/* ---------------- host ---------------- */
function createAnimHost(part) {
  const id = part.id;
  const host = {
    part: part,
    stageEl: document.getElementById('stage-' + id),
    capEl: document.getElementById('cap-' + id),
    fxEl: document.getElementById('fx-' + id),
    stateEl: document.getElementById('state-' + id),
    secEl: document.getElementById('anim-' + id),
    speed: 1, running: false, stopFlag: false, started: false,
    staticOnly: false, inView: false, autoPaused: false, userPaused: false,
    _raf: null
  };
  host.setStage = function (inner, w, h) {
    host.stageEl.innerHTML = '<svg viewBox="0 0 ' + (w || 900) + ' ' + (h || 460) +
      '" preserveAspectRatio="xMidYMid meet" role="img">' + inner + '</svg>';
    return host.stageEl.querySelector('svg');
  };
  host.caption = t => { host.capEl.innerHTML = t; };
  host.formula = t => { host.fxEl.innerHTML = t; };
  host.setState = t => { host.stateEl.textContent = t; };
  host._sched = function (dur, onFrame) {
    return new Promise((res, rej) => {
      let elapsed = 0, last = null;
      const step = t => {
        if (host.stopFlag) { rej(new Error('anim-stopped')); return; }
        if (!host.running) { last = null; host._raf = requestAnimationFrame(step); return; }
        if (last === null) last = t;
        elapsed += t - last; last = t;
        const k = Math.min(1, elapsed / (dur / host.speed));
        try { onFrame(k, elapsed); } catch (e) { rej(e); return; }
        if (k >= 1) { res(); return; }
        host._raf = requestAnimationFrame(step);
      };
      host._raf = requestAnimationFrame(step);
    });
  };
  host.sleep = ms => host._sched(ms, () => {});
  host.tween = (dur, fn) => host._sched(dur, k => fn(k));
  host.start = function (speed) {
    if (speed) host.speed = speed;
    if (host.started) { host.stopFlag = true; }
    host.started = true; host.stopFlag = false; host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
    setTimeout(() => {
      ANIMS[part.animType](host).catch(e => {
        if (e && e.message === 'anim-stopped') host.setState('STOPPED');
        else console.error('anim error', part.id, e);
      });
    }, 30);
  };
  host.pause = function () {
    if (!host.started) return;
    host.running = false; host.userPaused = true;
    host.setState('PAUSED');
  };
  host.resume = function () {
    if (!host.started || !host.userPaused) return;
    host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
  };
  host.stop = function () {
    host.stopFlag = true; host.running = false; host.started = false; host.userPaused = false;
    if (host._raf) cancelAnimationFrame(host._raf);
    host.setState('IDLE');
    host.renderStatic();
  };
  host.renderStatic = function () {
    host.staticOnly = true;
    try { ANIMS[part.animType](host); } catch (e) { /* static render is best-effort */ }
    host.staticOnly = false;
  };
  host.setSpeed = function (s) {
    host.speed = s;
    if (!host.started) { host.start(s); return; }
    if (host.userPaused) { host.running = true; host.userPaused = false; }
    host.setState('RUN ' + s + 'x');
  };
  /* controls */
  host.secEl.querySelectorAll('.ac-btn').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.ac;
      host.secEl.querySelectorAll('.ac-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if (a === 'play') host.userPaused ? host.resume() : host.start(1);
      else if (a === 'slow') host.setSpeed(0.5);
      else if (a === 'fast') host.setSpeed(1.5);
      else if (a === 'pause') host.pause();
      else if (a === 'stop') { host.stop(); b.classList.remove('active'); }
    });
  });
  /* auto start / auto pause with visibility */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      host.inView = en.isIntersecting;
      if (en.isIntersecting) {
        if (host.autoPaused && host.started) {
          host.running = true; host.autoPaused = false; host.setState('RUN ' + host.speed + 'x');
        } else if (!host.started && !host.autoStarted && !window.__prefersReducedMotion) {
          host.autoStarted = true; host.start(1);
        }
      } else if (host.started && host.running) {
        host.running = false; host.autoPaused = true; host.setState('HOLD');
      }
    });
  }, { threshold: 0.25 });
  io.observe(host.secEl);
  return host;
}

const ANIMS = {};
const HOSTS = {};

function setupAnimations() {
  window.__prefersReducedMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  PARTS.forEach(p => {
    if (p.animType && ANIMS[p.animType]) {
      HOSTS[p.id] = createAnimHost(p);
      HOSTS[p.id].renderStatic();
    }
  });
}

  await host.sleep(1800);
};

  const xOf = deg => X0 + (deg - 0) * (X1 - X0) / DEGMAX;
  const svg = host.setStage(
    txt(450, 44, 'daemon thread — বাটন চেপে ধরে থাকলে জয়েন্ট চলতেই থাকে', { anchor: 'middle', size: 15, weight: 600, fill: '#ffb454' }) +

    txt(180, 114, 'গ্রিপার মোড · Joint 6 · dir = +1', { anchor: 'middle', size: 11, fill: '#8b949e' }) +
    arrow(285, 97, 350, 97, '#4fc3f7', 'mArr', 2) +
    rrect(355, 70, 200, 54, 8, '#0d1f14', '#7ee787') +
    txt(455, 94, 'arm_ctrl thread', { anchor: 'middle', size: 12, mono: true, fill: '#7ee787' }) +
    txt(455, 114, 'প্রতি 0.5s-এ এক ধাপ', { anchor: 'middle', size: 11, fill: '#8b949e' }) +
    arrow(560, 97, 625, 97, '#7ee787', 'mArrG', 2) +
    rrect(630, 70, 230, 54, 8, '#151515', '#2a3442') +
    txt(745, 94, 'loop_active == True?', { anchor: 'middle', size: 12, mono: true }) +
    txt(745, 114, 'বাটন ছাড়া মাত্র False', { anchor: 'middle', size: 11, fill: '#8b949e' }) +
    txt(450, 170, 'Joint 6 কোণ (ডিগ্রি)', { anchor: 'middle', size: 12, fill: '#8b949e' }) +
    txt(450, 232, '120', { anchor: 'middle', size: 44, mono: true, fill: '#4fc3f7', weight: 700, id: 'ac-deg' }) +
    line(X0, 270, X1, 270, '#30363d', 3) +
    [0, 45, 90, 135, 180, 225, 270].map(d =>
      line(xOf(d), 264, xOf(d), 276, '#30363d', 1.5) +
      txt(xOf(d), 292, String(d), { anchor: 'middle', size: 10, fill: '#8b949e' })
    ).join('') +
    rrect(xOf(180) - 3, 258, 6, 24, 2, '#1f0d0d', '#f85149', ' id="ac-wall"') +
    txt(xOf(180), 250, 'max 180', { anchor: 'middle', size: 10, fill: '#f85149', weight: 600 }) +
    circ(xOf(120), 270, 9, '#4fc3f7', ' id="ac-ptr"') +
    rrect(80, 320, 430, 116, 10, '#151515', '#2a3442') +
    txt(100, 348, 'clamp নিয়ম (id অনুযায়ী):', { size: 12, weight: 600 }) +
    txt(100, 372, 'id 1–4:  0 থেকে 180', { size: 12, mono: true, fill: '#8b949e' }) +
    txt(100, 394, 'id 5:    0 থেকে 270', { size: 12, mono: true, fill: '#8b949e' }) +
    txt(100, 416, 'id 6:    30 থেকে 180', { size: 12, mono: true, fill: '#8b949e' }) +
    rrect(530, 320, 330, 116, 10, '#0d1b24', '#4fc3f7') +
    txt(548, 348, 'publish — ArmJoint', { size: 12, weight: 600, fill: '#4fc3f7' }) +
    txt(548, 372, 'id: 6 · joint: 120', { size: 12, mono: true, fill: '#8b949e', id: 'ac-msg' }) +
    txt(548, 394, 'time: 1000 ms', { size: 12, mono: true, fill: '#8b949e' }) +
    txt(548, 416, '[ARM] Moving Joint 6 UP -> 120 deg', { size: 10, mono: true, fill: '#7ee787', id: 'ac-print' })
  );
  const degEl = svg.querySelector('#ac-deg');
  const ptr = svg.querySelector('#ac-ptr');
  const msg = svg.querySelector('#ac-msg');
  const prn = svg.querySelector('#ac-print');
  let ang = 120;
  const render = () => {
    degEl.textContent = String(ang);
    ptr.setAttribute('cx', xOf(ang));
    msg.textContent = 'id: 6 · joint: ' + ang;
    prn.textContent = '[ARM] Moving Joint 6 UP -> Angle: ' + ang + ' deg';
  };
  host.caption('বাটন চেপে রাখলে <code>pub_armjoint</code> একটি <b>daemon thread</b> চালু করে — প্রতি 0.5 সেকেন্ডে কোণ ±1° করে বাড়ে/কমে (অর্থাৎ গতি 2°/s)।');
  host.formula('angle = angle + direction &nbsp;(প্রতি 0.5s)');
  await host.sleep(1300);
  for (let i = 0; i < 60; i++) {
    if (host.stopFlag) throw new Error('anim-stopped');
    ang = Math.min(180, ang + 1);
    render();
    if (ang >= 180) break;
    await host.sleep(300);
  }
  const wall = svg.querySelector('#ac-wall');
  wall.setAttribute('stroke', '#ffb454');
  wall.setAttribute('stroke-width', 3);
  host.caption('কোণ <b>180</b>-এ পৌঁছেছে — Joint 6-এর সর্বোচ্চ সীমা। <code>min(max(angle, 30), 180)</code>-এর বেড়ায় ঠেকে কোণ আর বাড়বে না, তবে thread চলতেই থাকবে — বাটন ছাড়া পর্যন্ত।');

    function pause() { if (!X.started) return; X.running = false; X.paused = true; setState('PAUSED'); }
    function resume() {
      if (!X.started || !X.paused) return;
      X.running = true; X.paused = false; setState('RUN ' + X.speed + 'x');
    }
    function setSpeed(s) {
      X.speed = s;
      if (!X.started) { start(s); return; }
      if (X.paused) { X.running = true; X.paused = false; }
      setState('RUN ' + X.speed + 'x');
    }
    function stop() { X.gen++; X.stopFlag = true; resetIdle(); }

    el.controls.querySelectorAll('.ac-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.dataset.ac;
        setActive(el.controls, a === 'stop' ? null : b);
        if (a === 'play') { X.paused ? resume() : start(1); }
        else if (a === 'slow') setSpeed(0.5);
        else if (a === 'fast') setSpeed(1.5);
        else if (a === 'pause') pause();
        else if (a === 'stop') stop();
      });
    });
  }

  /* ---------- boot -------------------------------------------------- */
  function boot() {
    try { fixHero(); } catch (e) { console.error(e); }
    try { retrofitControls(); } catch (e) { console.error(e); }
    try { buildExec(); } catch (e) { console.error('exec build failed', e); }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else { boot(); }
})();

</script>
</body>
</html>
