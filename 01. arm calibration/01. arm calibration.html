<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01. arm calibration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#0a0a0a; --bg2:#111111;
  --card:#151515; --card2:#181818; --card3:#1d1d1d;
  --border:#262626; --border2:#303030; --border3:#3a3a3a;
  --text:#e8e8e8; --muted:#a0a0a0; --faint:#6e6e6e;
  --ex:#4fc3f7; --ex-dim:rgba(79,195,247,.09);
  --math:#7ee787; --math-dim:rgba(126,231,135,.08);
  --rb:#ffb454; --rb-dim:rgba(255,180,84,.08);
  --anim:#d2a8ff; --anim-dim:rgba(210,168,255,.08);
  --code-bg:#0d1117; --code-head:#161b22;
  --gutter-txt:#3d4f63; --gutter-line:#1c2530;
  --ok:#3fb950; --bad:#f85149;
  --ff-title:'Space Grotesk','Inter','Hind Siliguri',sans-serif;
  --ff-ui:'Inter','Hind Siliguri',system-ui,-apple-system,sans-serif;
  --ff-bn:'Hind Siliguri','Inter',sans-serif;
  --ff-mono:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
  --sb-w:292px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--ff-ui); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(79,195,247,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3a3a3a}
a{color:var(--ex);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ex);outline-offset:2px;border-radius:4px}
button{font-family:var(--ff-ui)}

/* ============ APP LAYOUT ============ */
#app{display:flex;min-height:100vh}
#main{
  margin-left:var(--sb-w);
  flex:1;
  min-width:0;
  padding:52px 56px 80px;
  max-width:1180px;
}
.intro-banner{
  margin-bottom:48px;padding:30px 34px;
  background:linear-gradient(145deg,#141414,#101010);
  border:1px solid var(--border);border-radius:16px;
  position:relative;overflow:hidden;
}
.intro-banner::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(600px 180px at 12% 0%,rgba(79,195,247,.07),transparent 60%),
    radial-gradient(500px 160px at 88% 100%,rgba(210,168,255,.05),transparent 60%);
  pointer-events:none;
}
.intro-eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ex);margin-bottom:10px;
}
.intro-banner h1{
  font-family:var(--ff-title);font-size:clamp(26px,3.4vw,38px);
  font-weight:700;letter-spacing:-.01em;line-height:1.15;
}
.intro-banner h1 .path{color:var(--faint);font-weight:500}
.intro-desc{margin-top:12px;color:var(--muted);max-width:70ch;font-size:15px}
.intro-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stat-chip{
  font-family:var(--ff-mono);font-size:12px;color:#c9d1d9;
  background:#0d1117;border:1px solid var(--border2);
  padding:6px 12px;border-radius:999px;
}
.stat-chip b{color:var(--ex);font-weight:600}

/* ============ SIDEBAR ============ */
#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);
  background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;z-index:60;
  display:flex;flex-direction:column;
}
.sb-head{
  padding:26px 22px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg2);z-index:2;
}
.sb-folder{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;
  color:var(--text);letter-spacing:-.01em;line-height:1.3;
}
.sb-meta{
  margin-top:6px;font-family:var(--ff-mono);font-size:11.5px;
  color:var(--faint);letter-spacing:.08em;
}
#sb-nav{padding:14px 12px 30px;flex:1}
.sb-item{
  display:flex;align-items:baseline;gap:11px;
  padding:8px 12px;margin:1px 0;border-radius:8px;
  color:#9a9a9a;border-left:2px solid transparent;
  transition:background .18s,color .18s;
}
.sb-item .sb-num{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  min-width:20px;font-weight:500;
}
.sb-item .sb-name{
  font-size:13.2px;font-weight:500;line-height:1.35;
  font-family:var(--ff-ui);
}
.sb-item:hover{background:#181818;color:#d6d6d6;text-decoration:none}
.sb-item.active{
  background:linear-gradient(90deg,rgba(79,195,247,.10),rgba(79,195,247,.02));
  color:#eaf6fe;border-left:2px solid var(--ex);
}
.sb-item.active .sb-num{color:var(--ex)}
.sb-filesep{
  font-family:var(--ff-mono);font-size:10px;letter-spacing:.16em;
  color:#525252;text-transform:uppercase;
  padding:14px 12px 6px;margin-top:4px;
}
#menu-btn{
  display:none;position:fixed;top:14px;left:14px;z-index:80;
  width:42px;height:42px;border-radius:10px;
  background:#181818;border:1px solid var(--border2);color:var(--text);
  font-size:15px;cursor:pointer;line-height:1;
  align-items:center;justify-content:center;padding:0;
}
#sb-overlay{display:none}

/* ============ PART SECTION ============ */
.part{margin-bottom:88px;scroll-margin-top:24px}
.part-head{margin-bottom:22px}
.eyebrow{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ex);margin-bottom:8px;
}
.part-title{
  font-family:var(--ff-title);font-size:clamp(23px,2.6vw,31px);
  font-weight:700;letter-spacing:-.015em;line-height:1.18;
  margin-bottom:12px;
}
.part-meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-family:var(--ff-mono);font-size:12px;color:var(--muted);
}
.meta-chip{
  background:#101418;border:1px solid var(--border2);
  padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.meta-chip.flag{color:#d8c97a;border-color:#3a3524;background:#17150d}
.meta-chip.lang{color:#8ab4f8}

/* ============ CODE CARD ============ */
.code-card{
  background:var(--code-bg);border:1px solid var(--border2);
  border-radius:13px;overflow:hidden;margin-bottom:30px;
  box-shadow:0 14px 40px rgba(0,0,0,.42);
}
.code-card-head{
  display:flex;align-items:center;gap:14px;
  background:var(--code-head);border-bottom:1px solid #20262e;
  padding:10px 16px;
}
.dots{display:flex;gap:7px;align-items:center}
.dots i{
  width:11px;height:11px;border-radius:50%;display:block;
}
.dots i:nth-child(1){background:#ff5f57}
.dots i:nth-child(2){background:#febc2e}
.dots i:nth-child(3){background:#28c840}
.code-fname{
  font-family:var(--ff-mono);font-size:12.5px;color:#9aa7b4;
  letter-spacing:.02em;
}
.code-lines-chip{
  font-family:var(--ff-mono);font-size:11px;color:#5b6875;
  margin-left:auto;white-space:nowrap;
}
.copy-btn{
  font-family:var(--ff-mono);font-size:11px;letter-spacing:.06em;
  color:#9aa7b4;background:#1c2128;border:1px solid #2d333b;
  border-radius:6px;padding:4px 11px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.copy-btn:hover{color:#e6edf3;border-color:#444c56}
.copy-btn.done{color:var(--ok);border-color:rgba(63,185,80,.4)}
.code-scroll{overflow-x:auto;max-height:640px;overflow-y:auto}
pre.code{display:inline-block;min-width:100%;padding:14px 0;font-family:var(--ff-mono)}
.cl{display:flex;white-space:pre;font-size:13.2px;line-height:1.62}
.cln{
  position:sticky;left:0;flex:0 0 auto;z-index:2;
  min-width:52px;text-align:right;padding-right:16px;
  color:var(--gutter-txt);background:var(--code-bg);
  border-right:1px solid var(--gutter-line);
  user-select:none;-webkit-user-select:none;font-size:11.5px;
  line-height:1.85;letter-spacing:.02em;
}
.cl.target .cln{
  background:#101722;color:#7ba3c9;border-right-color:#234;
}
.clc{flex:0 0 auto;padding-right:24px;tab-size:8;color:#e6edf3}
.tok-kw{color:#ff7b72}
.tok-str{color:#a5d6ff}
.tok-com{color:#8b949e;font-style:italic}
.tok-num{color:#79c0ff}
.tok-fn{color:#d2a8ff}
.tok-blt{color:#ffa657}

/* ============ SECTIONS ============ */
.sec{
  border:1px solid var(--border);border-radius:13px;
  background:var(--card);margin-bottom:26px;overflow:hidden;
}
.sec-head{
  display:flex;align-items:center;gap:12px;
  padding:15px 22px;border-bottom:1px solid var(--border);
  background:var(--card2);
}
.badge{
  font-family:var(--ff-mono);font-weight:700;font-size:12px;
  min-width:34px;height:26px;border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;
  letter-spacing:.03em;flex:0 0 auto;
}
.badge-ex{background:var(--ex-dim);color:var(--ex);border:1px solid rgba(79,195,247,.35)}
.badge-math{background:var(--math-dim);color:var(--math);border:1px solid rgba(126,231,135,.35)}
.badge-rb{background:var(--rb-dim);color:var(--rb);border:1px solid rgba(255,180,84,.35)}
.badge-anim{background:var(--anim-dim);color:var(--anim);border:1px solid rgba(210,168,255,.35)}
.sec-head h3{
  font-family:var(--ff-title);font-size:16.5px;font-weight:600;letter-spacing:-.01em;
}
.sec-head h3 .bn-inline{font-family:var(--ff-bn)}
.sec-body{padding:20px 22px 24px}

/* ============ EXPLAIN ENTRIES ============ */
.ex-entry{margin-bottom:26px}
.ex-entry:last-child{margin-bottom:6px}
.ex-snippet{
  background:#0d1117;border:1px solid var(--border2);border-left:3px solid var(--ex);
  border-radius:9px;overflow:hidden;
}
.ex-snippet pre{
  padding:10px 16px;font-family:var(--ff-mono);font-size:12.8px;
  line-height:1.62;color:#dbe4ee;overflow-x:auto;white-space:pre;
}
.ex-lines{
  display:inline-block;font-family:var(--ff-mono);font-size:10.5px;
  color:var(--ex);background:var(--ex-dim);border:1px solid rgba(79,195,247,.3);
  border-radius:5px;padding:1px 8px;margin-bottom:7px;letter-spacing:.06em;
}
.ex-arrow{
  color:#3a471f;font-family:var(--ff-mono);font-size:15px;color:var(--faint);
  padding:3px 2px 3px 12px;
}
.ex-text{
  font-family:var(--ff-bn);font-size:16px;line-height:1.95;color:#d5d5d5;
  padding:2px 4px 0 14px;border-left:2px solid #232d36;
}
.ex-text code, .bn code, .ml-text code, .map-text code, .rb-card code, .anim-caption code{
  font-family:var(--ff-mono);font-size:.86em;color:#9ecbff;
  background:rgba(110,168,254,.10);border:1px solid rgba(110,168,254,.16);
  border-radius:5px;padding:1px 6px;white-space:nowrap;
}
.ex-text ul, .ml-text ul, .rb-card ul, .anim-caption ul{
  margin:8px 0 4px 4px;padding-left:22px;
}
.ex-text li, .ml-text li, .rb-card li{margin:5px 0}

/* ============ MATH SECTION ============ */
.math-intro{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
  padding-bottom:16px;border-bottom:1px dashed var(--border2);margin-bottom:20px;
}
.math-level{
  background:var(--card2);border:1px solid var(--border2);border-radius:11px;
  padding:16px 20px;margin-bottom:14px;
}
.ml-label{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--math);margin-bottom:10px;
}
.mathy{
  font-size:17px;color:#e3ffe6;margin:8px 0 12px;
  padding:12px 16px;background:rgba(126,231,135,.05);
  border:1px solid rgba(126,231,135,.16);border-radius:9px;
  overflow-x:auto;min-height:24px;
}
.ml-text{
  font-family:var(--ff-bn);font-size:15.5px;line-height:1.9;color:#c9c9c9;
}
.math-subhead{
  font-family:var(--ff-title);font-size:14.5px;font-weight:600;color:#bfe8c4;
  margin:26px 0 12px;letter-spacing:.01em;
}
.map-row{
  display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(180px,1fr) minmax(220px,1.4fr);
  gap:12px;align-items:start;
  background:var(--card2);border:1px solid var(--border2);border-radius:10px;
  padding:12px 16px;margin-bottom:10px;
}
.map-code code{
  font-family:var(--ff-mono);font-size:12.5px;color:#9ecbff;background:#0d1117;
  border:1px solid var(--border2);border-radius:6px;padding:3px 8px;display:inline-block;
}
.map-math{color:#c9f7cf;font-family:var(--ff-mono);font-size:13.5px;padding-top:2px}
.map-text{font-family:var(--ff-bn);font-size:14.5px;line-height:1.8;color:#bcbcbc}
.failure-list li{
  font-family:var(--ff-bn);font-size:15px;line-height:1.85;color:#d9c9c9;
  margin:8px 0;padding-left:6px;list-style:none;position:relative;padding-left:22px;
}
.failure-list li::before{
  content:"";position:absolute;left:2px;top:11px;width:8px;height:8px;
  border-radius:2px;background:rgba(248,81,73,.5);border:1px solid rgba(248,81,73,.65);
}
.failure-list{padding:0}

/* ============ ROBOT SECTION ============ */
.rb-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rb-card{
  border-radius:11px;padding:16px 18px;border:1px solid var(--border2);
  font-family:var(--ff-bn);font-size:15.3px;line-height:1.9;
}
.rb-card h4{
  font-family:var(--ff-mono);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:10px;font-weight:600;
}
.rb-ok{background:rgba(63,185,80,.05);border-color:rgba(63,185,80,.28)}
.rb-ok h4{color:var(--ok)}
.rb-bad{background:rgba(248,81,73,.05);border-color:rgba(248,81,73,.28)}
.rb-bad h4{color:var(--bad)}

/* ============ ANIMATION SECTION ============ */
.anim-stage{
  background:
    radial-gradient(500px 200px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  border-bottom:1px solid var(--border2);
  padding:10px;position:relative;
}
.anim-stage svg{width:100%;height:auto;display:block}
.anim-controls{
  display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--border);background:var(--card2);
}
.ac-btn{
  font-family:var(--ff-mono);font-size:12px;letter-spacing:.08em;
  color:#c9c9c9;background:#202020;border:1px solid var(--border3);
  border-radius:8px;padding:7px 18px;cursor:pointer;transition:all .15s;
}
.ac-btn:hover{background:#2a2a2a;color:#fff;border-color:#4a4a4a}
.ac-btn.active{background:rgba(210,168,255,.14);color:var(--anim);border-color:rgba(210,168,255,.45)}
.anim-caption{
  font-family:var(--ff-bn);font-size:15px;line-height:1.8;color:#d0c4dd;
  padding:13px 22px;border-bottom:1px solid var(--border);min-height:52px;
  background:rgba(210,168,255,.03);
}
.anim-formula{
  font-family:var(--ff-mono);font-size:14px;color:#e6d9f5;
  padding:12px 22px;background:#0d1117;min-height:46px;
  overflow-x:auto;white-space:nowrap;letter-spacing:.01em;
}
.anim-formula .fx-hl{color:var(--anim)}
.anim-formula .fx-ok{color:var(--math)}
.anim-formula .fx-warn{color:var(--rb)}
.anim-state{
  margin-left:auto;font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.1em;
}

/* ============ PART NAV ============ */
.part-nav{display:flex;justify-content:space-between;gap:14px;margin-top:34px}
.pn-btn{
  flex:1;max-width:340px;display:block;
  border:1px solid var(--border2);border-radius:11px;
  padding:13px 18px;color:#c9c9c9;transition:all .16s;
  background:var(--card);
}
.pn-btn:hover{border-color:rgba(79,195,247,.4);color:#fff;text-decoration:none;background:#181818}
.pn-btn .pn-dir{
  font-family:var(--ff-mono);font-size:11px;color:var(--faint);
  letter-spacing:.14em;display:block;margin-bottom:3px;
}
.pn-btn .pn-title{font-size:13.5px;font-weight:600}
.pn-btn.next{text-align:right}
.pn-btn.disabled{opacity:.28;pointer-events:none}

/* ============ FOOTER ============ */
.site-footer{
  margin-left:var(--sb-w);border-top:1px solid var(--border);
  padding:26px 56px;color:var(--faint);font-size:13px;
  font-family:var(--ff-mono);letter-spacing:.02em;
}

/* ============ MATHJAX FALLBACK ============ */
body.no-mathjax .mathy{
  font-family:var(--ff-mono);font-size:13.5px;color:#c9f0cd;white-space:pre;
}

/* ============ RESPONSIVE ============ */
@media (max-width:1240px){
  #main{padding:44px 34px 70px}
  .site-footer{padding:24px 34px}
}
@media (max-width:960px){
  #menu-btn{display:block}
  #sidebar{
    transform:translateX(-100%);transition:transform .26s ease;
    box-shadow:24px 0 60px rgba(0,0,0,.5);
  }
  body.sb-open #sidebar{transform:translateX(0)}
  body.sb-open #sb-overlay{
    display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;
  }
  #main{margin-left:0;padding:74px 20px 60px}
  .site-footer{margin-left:0;padding:22px 20px}
  .rb-grid{grid-template-columns:1fr}
  .map-row{grid-template-columns:1fr;gap:6px}
  .intro-banner{padding:22px 20px}
}
@media (max-width:560px){
  body{font-size:15px}
  .ex-text{font-size:15.3px}
  .cl{font-size:12.3px}
  .anim-formula{font-size:12.5px}
  .code-lines-chip{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
}
</style>





<style id="refine-style">
/* ==================================================================
   SURGICAL REFINEMENT LAYER v2 — appended (UI-UX & animation refinement)
   Does not override any existing rule except where explicitly noted;
   all original bytes above this block are untouched.

   INTENTIONAL LAYER ARCHITECTURE (documented z-index scale)
   ---------------------------------------------------------
     --z-ground  0   page ground, card backgrounds
     --z-scene  10   base SVG scene inside .anim-stage / .exec-robot
     --z-objects 20  moving SVG marks (updated in place by the engine)
     --z-labels 30   SVG text labels — halo-stroked so they can never
                     become unreadable under moving objects
     --z-panel  40   overlay panels (formula bar, debug chips)
     --z-head   50   section headers, captions
     --z-debug  60   live debug readouts
     --z-ctrl   70   control bars (always clickable, never covered)
     --z-nav    80   sidebar / menu
     --z-focus  90   focus outlines (never overlapped)
   HTML layers take these values; inside a single <svg> stacking is by
   paint order, and readability of labels is guaranteed by the
   paint-order halo rule below rather than by z-index.
   ================================================================== */
:root{
  --z-ground:0; --z-scene:10; --z-objects:20; --z-labels:30;
  --z-panel:40; --z-head:50; --z-debug:60; --z-ctrl:70; --z-nav:80; --z-focus:90;
}

/* ---- Fix: full-width application shell (#56-57).
        #main keeps its sidebar margin but drops the narrow max-width;
        prose blocks below keep a readable measure so lines never run
        wall-to-wall — only layout containers use the full width. ---- */
#main{max-width:none}
.intro-desc{max-width:none}          /* hero paragraph: full hero width */
.ex-text, .ml-text, .math-intro, .map-text, .rb-card, .exec-note,
.anim-caption{
  max-width:105ch;
}
@media (min-width:1800px){
  #main{padding-left:88px; padding-right:88px}
}

/* ---- Fix: SVG text labels stay readable over moving objects.
        Halo = stage-ground-coloured stroke painted UNDER the fill. ---- */
.anim-stage svg text,
.exec-robot svg text{
  paint-order:stroke; stroke:#0b0e13; stroke-width:3px;
  stroke-linejoin:round; stroke-linecap:round;
  pointer-events:none; user-select:none;
}
.anim-stage, .exec-robot{position:relative; z-index:var(--z-scene)}
.anim-controls{position:relative; z-index:var(--z-ctrl)}
.anim-caption{position:relative; z-index:var(--z-head)}
.anim-formula{position:relative; z-index:var(--z-panel)}
.anim-state{z-index:var(--z-debug)}

/* ---- Fix: icon control buttons (professional inline SVG, no text) ---- */
.anim-controls{gap:8px}
.ac-btn.ic{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:32px; padding:0; border-radius:8px;
}
.ac-btn.ic svg{width:16px; height:16px; display:block; fill:currentColor}
.ac-btn.ic svg *{vector-effect:non-scaling-stroke}
.ac-btn:focus-visible{
  outline:2px solid var(--anim); outline-offset:2px; z-index:var(--z-focus);
}
.ac-btn.ic[disabled]{opacity:.35; cursor:not-allowed}
.anim-controls .ac-sep{
  width:1px; height:20px; background:var(--border3); margin:0 3px; flex:0 0 auto;
}
.anim-controls .ac-step{
  font-family:var(--ff-mono); font-size:11px; color:var(--anim);
  letter-spacing:.08em; padding:6px 10px; border:1px solid rgba(210,168,255,.28);
  border-radius:7px; background:var(--anim-dim); white-space:nowrap;
}

/* ---- Complete Execution — Code → Debug → Robot (v2 row layout) ----
   Row 1: COMPLETE SOURCE CODE | LIVE DEBUG   (the two walk together)
   Row 2: ROBOT / SYSTEM STATE (full width)
   Then:  complete banner → formula → explanation → controls      */
.exec-sec{margin-top:56px}
.exec-sec .sec-head .exec-sub{
  font-family:var(--ff-mono); font-size:11px; color:var(--faint);
  letter-spacing:.06em; margin-left:auto; padding-right:18px; white-space:nowrap;
}
.exec-note{
  font-family:var(--ff-bn); font-size:14.5px; line-height:1.8; color:var(--muted);
  padding:14px 22px; border-bottom:1px solid var(--border); background:var(--card);
}
.exec-note code{
  font-family:var(--ff-mono); font-size:.86em; color:#9ecbff;
  background:rgba(110,168,254,.10); border:1px solid rgba(110,168,254,.16);
  border-radius:5px; padding:1px 6px;
}
.exec-frame{
  display:grid; gap:14px; padding:16px 18px;
  grid-template-columns:minmax(0,1.42fr) minmax(330px,.72fr);
}
.exec-col{min-width:0; display:flex; flex-direction:column; gap:14px}
.exec-col>.exec-panel{flex:1}
/* robot/system row spans the full frame width, below code+debug */
.exec-col.rob-col{grid-column:1 / -1}
.exec-panel{
  background:var(--code-bg); border:1px solid var(--border2); border-radius:12px;
  overflow:hidden; display:flex; flex-direction:column; min-height:0;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}
/* scroll affordance: right-edge fade says "more code this way" without
   covering anything interactive (head stays above it via z-index) */
.exec-col.code-col .exec-panel{position:relative}
.exec-col.code-col .exec-panel::after{
  content:""; position:absolute; top:0; right:0; bottom:0; width:26px;
  z-index:1; pointer-events:none;
  background:linear-gradient(90deg, rgba(13,17,23,0), #0d1117 92%);
}
.exec-panel-head{
  position:relative; z-index:2;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--code-head); border-bottom:1px solid #20262e; padding:9px 14px;
}
.exec-panel-head .ep-title{
  font-family:var(--ff-title); font-size:13px; font-weight:600; color:#c9d1d9;
  letter-spacing:.01em;
}
.exec-panel-head .ep-chip{
  font-family:var(--ff-mono); font-size:10px; letter-spacing:.05em;
  border-radius:999px; padding:2.5px 9px; white-space:nowrap;
}
.ep-chip.live{color:var(--anim); background:var(--anim-dim); border:1px solid rgba(210,168,255,.3)}
.ep-chip.concept{color:var(--rb); background:var(--rb-dim); border:1px solid rgba(255,180,84,.3)}
.ep-chip.src{color:var(--ex); background:var(--ex-dim); border:1px solid rgba(79,195,247,.3)}
/* kind legend in the code panel head: exec / structural / event */
.exec-legend{
  margin-left:auto; display:inline-flex; align-items:center; gap:5px;
  font-family:var(--ff-mono); font-size:9.5px; color:var(--faint); white-space:nowrap;
}
.exec-legend .lg{
  width:9px; height:9px; border-radius:3px; display:inline-block;
  margin-left:6px;
}
.exec-legend .lg-exec{background:#d2a8ff}
.exec-legend .lg-struct{background:#ffb454}
.exec-legend .lg-event{background:#4fc3f7}
.exec-code{
  position:relative; overflow:auto; flex:1; min-height:0;
  max-height:620px; margin:0; padding:10px 0 28px;
  font-family:var(--ff-mono); font-size:12.3px; line-height:1.6; color:#dbe4ee;
  background:var(--code-bg); tab-size:4;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.exec-code .exl{
  display:block; white-space:pre; min-height:1.6em;
  padding:0 12px 0 0; border-left:3px solid transparent;
  transition:background .2s, border-color .2s;
}
/* line-number gutter stays pinned when long lines scroll horizontally */
.exec-code .eln{
  position:sticky; left:0;
  display:inline-block; width:3.6em; padding-right:10px;
  text-align:right; color:#3d4f63; user-select:none;
  background:var(--code-bg);
}
/* current line, by kind: exec = purple (default), structural = amber,
   event = cyan; grouped companion lines get the tint without the edge */
.exec-code .exl.cur{
  background:rgba(210,168,255,.14); border-left-color:var(--anim);
}
.exec-code .exl.cur .eln{color:var(--anim); background:#241d38}
.exec-code .exl.cur-struct{
  background:rgba(255,180,84,.13); border-left-color:var(--rb);
}
.exec-code .exl.cur-struct .eln{color:var(--rb); background:#2e2416}
.exec-code .exl.cur-event{
  background:rgba(79,195,247,.14); border-left-color:var(--ex);
}
.exec-code .exl.cur-event .eln{color:var(--ex); background:#12283a}
.exec-code .exl.cur-g{background:rgba(210,168,255,.06)}
.exec-code .exl.cur-g.cur-struct{background:rgba(255,180,84,.07)}
.exec-code .exl.cur-g.cur-event{background:rgba(79,195,247,.07)}
/* ---- BEFORE → OPERATION → AFTER debug (#52) ---- */
.exec-op{
  margin:10px 12px 0; padding:8px 12px; border-radius:9px;
  border:1px solid rgba(126,231,135,.32); background:rgba(126,231,135,.07);
  font-family:var(--ff-mono); font-size:11.8px; line-height:1.65; color:#7ee787;
  overflow-wrap:anywhere;
}
.exec-op::before{
  content:"OPERATION";
  display:block; font-size:9px; letter-spacing:.14em; color:#58a65f;
  margin-bottom:3px;
}
.exec-dbg-body{
  padding:10px 14px 14px; overflow:auto; max-height:620px; flex:1; min-height:0;
  font-family:var(--ff-mono); font-size:12px;
  scrollbar-width:thin; scrollbar-color:#30363d #0d1117;
}
.dbg-row{
  display:flex; align-items:baseline; gap:10px; padding:5.5px 8px;
  border-bottom:1px dashed #1c2530; animation:dbgIn .3s ease;
}
.dbg-row:last-child{border-bottom:none}
.dbg-k{color:var(--muted); white-space:nowrap; flex:0 0 auto}
.dbg-v{color:#9ecbff; text-align:right; flex:1; overflow-wrap:anywhere;
  padding-right:2px}
.dbg-v.n{color:#7ee787}
.dbg-v.err{color:var(--bad)}
/* value changed by this line: old (dim) → new (green) */
.dbg-row.chg .dbg-v{color:#7ee787}
.dbg-old{color:#6e7681; text-decoration:line-through;
  text-decoration-color:rgba(110,118,129,.6)}
.dbg-arrow{color:#7ee787; font-weight:600}
.dbg-ill{
  flex:0 0 auto; font-size:9.5px; letter-spacing:.05em; color:var(--rb);
  border:1px solid rgba(255,180,84,.35); border-radius:5px; padding:1px 5px;
}
.dbg-empty{color:var(--faint); font-family:var(--ff-bn); font-size:13px; padding:12px 8px}
@keyframes dbgIn{from{opacity:0; transform:translateX(-4px)}to{opacity:1}}
/* robot row: centered scene, taller than the old side column */
.exec-robot{
  background:
    radial-gradient(500px 220px at 50% 0%,rgba(210,168,255,.05),transparent 70%),
    #0b0e13;
  padding:14px; overflow:auto;
  display:flex; justify-content:center;
}
.exec-robot svg{width:100%; max-width:720px; height:auto; max-height:560px;
  display:block; margin:0 auto}
.exec-rob-fade{animation:robFade .4s ease}
@keyframes robFade{from{opacity:0; transform:translateY(4px)}to{opacity:1}}
/* result zone: complete banner → formula row → explanation → controls */
.exec-complete{
  display:none; margin:0 18px 14px; padding:13px 18px; border-radius:11px;
  border:1px solid rgba(63,185,80,.4); background:rgba(63,185,80,.08);
  font-family:var(--ff-mono); font-size:12.5px; letter-spacing:.04em; color:#7ee787;
}
.exec-complete.show{display:block; animation:robFade .4s ease}
.exec-complete .bn{font-family:var(--ff-bn); font-size:14px; color:#c9d1d9;
  letter-spacing:0; margin-top:5px; line-height:1.75}
.exec-fx-row{margin:0 18px 14px; max-width:none}
.exec-sec .anim-caption{margin:0 18px 4px}
.exec-sec .anim-controls{margin:0 18px 18px}
.exec-progress{
  height:3px; margin:0 18px 22px; border-radius:2px; overflow:hidden;
  background:rgba(255,255,255,.06);
}
.exec-progress i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--anim),#7ee787);
  transition:width .3s ease;
}

/* responsive: code+debug share row 1 until 960px, robot row always full
   width; below 960px everything stacks vertically (#59 mobile order) */
@media (max-width:1240px){
  .exec-frame{grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr)}
  .exec-code{max-height:540px}
  .exec-dbg-body{max-height:540px}
}
@media (max-width:960px){
  .exec-frame{grid-template-columns:minmax(0,1fr); padding:12px}
  .exec-code{max-height:430px}
  .exec-dbg-body{max-height:300px}
  .exec-robot svg{max-height:440px}
  .exec-legend{display:none}
}
@media (max-width:560px){
  .exec-sec .sec-head .exec-sub{display:none}
  .exec-frame{padding:10px}
  .anim-controls{padding:11px 14px}
}
@media (prefers-reduced-motion:reduce){
  .exec-rob-fade, .dbg-row{animation:none}
  .exec-code .exl{transition:none}
  .exec-progress i{transition:none}
}

</style>

const FILEDATA = {"README.md":["ros2 topic pub /arm6_joints arm_msgs/msg/ArmJoints {\"joint1: 90, joint2: 90, joint3: 90, joint4: 90, joint5: 90, joint6: 180, time: 1500\"} --once","","","python3 ~/calibrate_arm.py","","","sh start_agent.sh","","","ros2 launch M3Pro_demo camera_arm_kin.launch.py","","","ros2 run M3Pro_demo arm_offset"],"calibrate_arm.py":["import serial    # Lets Python talk to hardware over a serial connection (usually a USB cable)","import struct    # Used to pack data into binary format (1s and 0s) so the hardware can understand it","import time      # Lets Python pause and wait","from config_robot import MicroROS_Robot  # Imports the custom \"blueprint\" for your specific robot","","if __name__ == \"__main__\":","    # Create the robot object. 'debug=False' means \"don't print out all the hidden background data to my screen\"","    bot = MicroROS_Robot(debug=False)","    ","    # Ask the robot's circuit board what software version it is running","    version = bot.read_version()","    print(\"version:\", version)  # Print it to the screen so you can see it","    ","    # Turn ON the arm's torque (Torque = motor power/muscle). ","    # '1' means ON. The motors will now lock in place and resist being moved by hand.","    bot.set_arm_torque(1)","    time.sleep(.5)  # Wait half a second for the motors to lock","    ","    # Turn OFF the arm's torque. ","    # '0' means OFF. The motors relax and become \"floppy\" so you can physically move the arm by hand.","    bot.set_arm_torque(0)","    time.sleep(.5)  # Wait half a second for the motors to relax","    ","    # *** THIS IS WHERE YOU MOVE THE ARM BY HAND ***","    # The script pauses here and waits for you to type something on your keyboard.","    # While it waits, you are supposed to manually move the robot arm into its perfect \"zero\" starting position.","    adjust = input(\"Input y for end of adjusting:\")","    ","    # Check what you typed.","    # (Note for advanced learners: There is a tiny bug in this original code. It says 'adjust == 'y' or 'Y''. ","    # In Python, 'Y' by itself is always considered \"True\", so it will actually accept ANY key you press, ","    # not just 'y'. But the programmer's *intention* was to only proceed if you typed 'y' or 'Y'!)","    if adjust == 'y' or 'Y':","        ","        # Loop through the numbers 1 to 6 (your arm has 6 joints/motors)","        for i in range(1,7):","            ","            # Tell joint number 'i': \"Whatever angle you are currently at, save that as your new Zero!\"","            state = bot.set_arm_calib_offset(i)","            ","            # If the robot replies with a negative number (like -1), it means the save failed.","            if state < 0:","                # So, we try saving it one more time!","                state = bot.set_arm_calib_offset(i)","                ","            # Print out which joint we just calibrated and if it worked (state variable)","            print(\"state=\", i, state)","            ","        print(\"Calibration successfully!\")  # Yay! The robot's brain has officially learned its new zero position.","        ","        # Turn the motor power/torque back ON ('1') so the arm locks into its newly calibrated starting position.","        bot.set_arm_torque(1)","        ","        # Delete the 'bot' object from Python's memory. ","        # This is like turning off the lights and locking the door when you leave. ","        # It cleanly closes the serial connection so other programs can use the robot.","        del bot"],"start_agent.sh":["#!/bin/bash","# Tells the computer this is a Bash terminal script.","","# ---------------------------------------------------------","# THESE ARE COMMENTED OUT (DISABLED) ALTERNATIVE OPTIONS","# The '#' symbol means \"ignore this line\". ","# The programmer left these here as notes on how to run the translator using Docker (a tool for running apps in containers).","# ---------------------------------------------------------","# WIFI","#docker run -it --rm -v /dev:/dev -v /dev/shm:/dev/shm --privileged --net=host microros/micro-ros-agent:humble udp4 --port 8090 -v4","# This disabled line shows how you could start the translator using Wi-Fi (udp4) instead of a wire.","","# serial","#docker run -it --rm -v /dev:/dev -v /dev/shm:/dev/shm --privileged --net=host 192.168.2.51:5000/micro-ros-agent:humble serial --dev /dev/myserial -b 2000000 -v4","# This disabled line shows how to start it using Docker over a serial (USB) wire.","","# serial","#docker start -i 7026de7b7d9b","#docker stop 7026de7b7d9b","# These disabled lines show how to start/stop a specific Docker container using its ID number.","# ---------------------------------------------------------","","","sleep 5","# Pause for 5 seconds when the robot turns on. ","# This gives the hardware time to wake up before we ask the translator to start working.","","gnome-terminal --title=mircoROS_Agent -- bash -c \"export ROS_DOMAIN_ID=30 && source /opt/ros/humble/setup.bash && source /home/jetson/mircoROS_agent/install/setup.bash && ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/myserial -b 2000000\"","# This is the main event! Let's break down what is inside the quotes:","#","# gnome-terminal --title=mircoROS_Agent --  ","# Opens a new terminal window on the screen and names it \"mircoROS_Agent\".","#","# bash -c \"...\"  ","# Tells the new terminal window to run all the commands inside the quotes.","#","# export ROS_DOMAIN_ID=30  ","# Set the walkie-talkie channel to 30! (Just like in the previous script, so all programs talk on the same channel).","#","# &&  ","# Means \"AND THEN DO THIS NEXT THING\".","#","# source /opt/ros/humble/setup.bash  ","# Load the main ROS 2 toolbox.","#","# source /home/jetson/mircoROS_agent/install/setup.bash  ","# Load the specific micro-ROS Agent toolbox that was installed on this Jetson computer.","#","# ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/myserial -b 2000000  ","# FINALLY! Start the translator. ","# \"serial\" means we are talking over a physical wire (USB), not Wi-Fi.","# \"--dev /dev/myserial\" tells it exactly which USB port the robotic arm is plugged into.","# \"-b 2000000\" sets the speed limit (baud rate) of the wire to 2,000,000 bits per second. ","# (That is a very fast data speed, which makes sense because robotic arms need to send a lot of joint data very quickly!)"],"camera_arm_kin.launch.py":["# --- IMPORTING ROS 2 LAUNCH TOOLS ---","from launch import LaunchDescription  # The main container that holds our list of programs to start","from launch_ros.actions import Node  # A tool to start a single ROS 2 program (Node)","import os  # Lets Python interact with computer folders and file paths","from launch.actions import IncludeLaunchDescription  # A tool to run ANOTHER launch file inside this one","from launch.launch_description_sources import PythonLaunchDescriptionSource  # Tells ROS the other launch file is written in Python","from ament_index_python.packages import get_package_share_directory  # A ROS 2 tool that finds where a package is installed on the robot","","","# Every ROS 2 Python launch file MUST have this exact function.","# When you type \"ros2 launch ...\" in the terminal, ROS 2 secretly calls this function to figure out what to do.","def generate_launch_description():","","    # --- PROGRAM 1: THE CAMERA ---","    # We want to turn on the robot's camera. ","    # Instead of writing all the camera setup code here, we use a shortcut and load an existing launch file.","    camera_driver_launch = IncludeLaunchDescription(","        PythonLaunchDescriptionSource([os.path.join(","        # Find the folder where the 'orbbec_camera' package lives on the robot.","        get_package_share_directory('orbbec_camera'), 'launch'),","         # Inside that folder, look for a file called 'dabai_dcw2.launch.py' and run it.","         '/dabai_dcw2.launch.py'])","    )","    # \"dabai\" is likely the model name of your camera. This starts the camera driver so the robot can \"see\".","","","    # --- PROGRAM 2: THE MATH BRAIN ---","    # Here we define a single ROS 2 Node (a mini-program) to start.","    kin_node = Node(","     package='arm_kin',       # Look in the 'arm_kin' package (Kinematics = the math of robot arm movement).","     executable='kin_srv',   # Find the program inside it called 'kin_srv' (srv = service).","     name='kin_ik_fk',       # Give this running program the nickname 'kin_ik_fk' so other programs can talk to it.","                             # \"ik\" stands for Inverse Kinematics, \"fk\" stands for Forward Kinematics!","    )","","    ","    # --- THE FINAL LIST ---","    # Hand the \"Director's Clapperboard\" back to ROS 2.","    # It contains a list of everything we just defined: [Turn on the camera, Turn on the math brain]","    return LaunchDescription([camera_driver_launch, kin_node])"],"arm_offset.py":["#!/usr/bin/env python3","# -*- coding: utf-8 -*-","","# --- IMPORTING TOOLS ---","import cv2  # OpenCV: The main library for computer vision (looking at camera images)","import os","import numpy as np  # Math tool for handling arrays and matrices (grids of numbers)","from sensor_msgs.msg import Image  # ROS 2 message type for camera pictures","import message_filters  # Tool to sync two camera feeds (color and depth) so they happen at the exact same millisecond","from M3Pro_demo.vutils import draw_tags  # Custom tool to draw boxes around AprilTags on the screen","from M3Pro_demo.compute_joint5 import *  # Custom math for the arm","from dt_apriltags import Detector  # The actual AprilTag detection engine","from cv_bridge import CvBridge  # Translates ROS image messages into OpenCV images Python can understand","import cv2 as cv","from arm_interface.srv import ArmKinemarics  # The ROS 2 \"Service\" to ask the arm's brain to do math","from arm_interface.msg import AprilTagInfo,CurJoints  # Custom message types for your robot","from arm_msgs.msg import ArmJoints","from std_msgs.msg import Float32,Bool,Int16","encoding = ['16UC1', '32FC1']  # Formats for depth image data","import time","import transforms3d as tfs  # Advanced math library for 3D transformations (moving things in 3D space)","import tf_transformations as tf  # More 3D math (quaternions and rotations)","import yaml  # Lets Python read and write YAML config files","import math","from M3Pro_demo.Robot_Move import *  # Custom movement tools","from rclpy.node import Node  # The ROS 2 Node blueprint","import rclpy","from message_filters import Subscriber, TimeSynchronizer, ApproximateTimeSynchronizer  # Syncs camera feeds","from sensor_msgs.msg import Image","from geometry_msgs.msg import Twist  # Message type for moving the robot base","","","# --- READING THE CALIBRATION OFFSET FILE ---","# This loads a settings file. It contains little tweaks (offsets) to fix minor inaccuracies in the camera's math.","offset_file = \"/home/jetson/yahboomcar_ws/src/arm_kin/param/offset_value.yaml\"","with open(offset_file, 'r') as file:","    offset_config = yaml.safe_load(file)","print(offset_config)","print(\"----------------------------\")","print(\"x_offset: \",offset_config.get('x_offset'))","print(\"y_offset: \",offset_config.get('y_offset'))","print(\"z_offset: \",offset_config.get('z_offset'))","","print('init done')","","# --- CREATING THE ROBOT NODE ---","class AprilTagDetectNode(Node):","    def __init__(self, name):","        super().__init__(name)  # Give this node a name in the ROS 2 system","        ","        # The \"Home\" position for the 6 joints of the robotic arm (in degrees)","        self.init_joints = [90, 90, 0, 0, 90, 90]","        ","        # Tools to convert ROS images to OpenCV images","        self.rgb_bridge = CvBridge()","        self.depth_bridge = CvBridge()","        ","        # Flags and timers to keep track of what the robot is doing","        self.pubPos_flag = False","        self.pr_time = time.time()","        ","        # --- THE APRILTAG DETECTOR ENGINE ---","        # This sets up the brain that looks for the black and white squares.","        self.at_detector = Detector(searchpath=['apriltags'], ","                                    families='tag36h11',  # The specific \"language\" of the AprilTags","                                    nthreads=8,  # Use 8 CPU cores to make it super fast","                                    quad_decimate=2.0,","                                    quad_sigma=0.0,","                                    refine_edges=1,","                                    decode_sharpening=0.25,","                                    debug=0)","        ","        self.Center_x_list = []","        self.Center_y_list = []","        ","        # Where is the arm's claw right now? [x, y, z, roll, pitch, yaw]","        self.CurEndPos = [0.1279, 0.00023, 0.1674, 0.00036, 1.3962, 0.00033]","        ","        # Camera calibration numbers (how the camera lens bends light)","        self.camera_info_K = [477.57, 0.0, 319.38, 0.0, 477.55, 238.64, 0.0, 0.0, 1.0]","        ","        # --- THE TRANSLATION MATRIX ---","        # This is super important! It is the physical measurement (in meters) from the arm's claw to the camera lens.","        # It tells the computer: \"The camera is mounted 10.1cm to the left, 0.2cm forward, and 4.8cm above the claw.\"","        self.EndToCamMat = np.array([[ 0 ,0 ,1 ,-0.101],","                                     [-1  ,0 ,0  ,0.002],","                                     [0  ,-1  ,0 ,0.0482],","                                     [ 0.0 , 0.0 , 0.0 , 1.0]])","        ","        # --- COMMUNICATION SETUP (Publishers & Subscribers) ---","        # Publishers = Radio stations the robot broadcasts on","        self.pos_info_pub = self.create_publisher(AprilTagInfo,\"PosInfo\",1)  # Tell others where the tag is","        self.CmdVel_pub = self.create_publisher(Twist,\"cmd_vel\",1)  # Tell the robot wheels to move","        self.TargetAngle_pub = self.create_publisher(ArmJoints, \"arm6_joints\", 10)  # Tell the arm to move its 6 joints","        self.TargetJoint5_pub = self.create_publisher(Int16, \"set_joint5\", 10)","        self.pub_cur_joints = self.create_publisher(CurJoints,\"Curjoints\",1)","        ","        # Subscribers = Radio stations the robot listens to","        self.sub_grasp_status = self.create_subscription(Bool,\"grasp_done\",self.get_graspStatusCallBack,100)  # Listen for \"I grabbed it!\"","        ","        # Listen to the camera's color and depth video feeds","        self.rgb_image_sub = Subscriber(self, Image, '/camera/color/image_raw')","        self.depth_image_sub = Subscriber(self, Image, '/camera/depth/image_raw')","        ","        # --- ROS 2 SERVICE CLIENT ---","        # Ask the arm's math brain to calculate Forward Kinematics (FK)","        self.client = self.create_client(ArmKinemarics, 'get_kinemarics')","        ","        # Wait here until the math brain service is awake and ready to do math","        while not self.client.wait_for_service(timeout_sec=1.0):","            self.get_logger().info('Service not available, waiting again...')\t\t","        ","        # Move the arm to the home position, and wait until the arm is actually listening","        while not self.TargetAngle_pub.get_subscription_count():","            self.pubSix_Arm(self.init_joints)","            time.sleep(0.1)\t","        self.pubSix_Arm(self.init_joints)  # Send the command one last time to be sure","        ","        # --- SYNCING THE CAMERAS ---","        # This is brilliant. A depth camera sends two pictures: a color one and a distance one.","        # If the robot is moving, the two pictures might be taken a millisecond apart, causing the math to be wrong.","        # ApproximateTimeSynchronizer forces Python to wait until it has a matching pair of pictures taken at the exact same time.","        self.ts = ApproximateTimeSynchronizer([self.rgb_image_sub, self.depth_image_sub], 1, 0.5)","        # When a matched pair arrives, run the 'callback' function below","        self.ts.registerCallback(self.callback)","","        # Load the offset settings from the YAML file earlier","        self.x_offset = offset_config.get('x_offset')","        self.y_offset = offset_config.get('y_offset')","        self.z_offset = offset_config.get('z_offset')","        ","        # --- PID CONTROLLER FOR DRIVING ---","        # A PID controller is a math algorithm that helps a robot drive smoothly to a target distance without overshooting.","        # (P=Proportional, I=Integral, D=Derivative). Here, it is tuned to slow down as it gets closer.","        self.adjust_dist = True","        self.prev_dist = 0","        self.linearx_PID = (0.5, 0.0, 0.2)","        self.linearx_pid = simplePID(self.linearx_PID[0] / 1000.0, self.linearx_PID[1] / 1000.0, self.linearx_PID[2] / 1000.0)","        ","        self.grasp_Dist = 220.0  # The ideal distance (in mm) to stop the robot from the target","        self.joint5 = Int16()","        ","    # --- HELPER FUNCTIONS ---","","    def pubCurrentJoints(self):","        # Broadcast where the arm currently is so other programs know","        cur_joints = CurJoints()","        cur_joints.joints = self.init_joints","        self.pub_cur_joints.publish(cur_joints) ","    ","    def get_graspStatusCallBack(self,msg):","        # This triggers when the robot finishes grabbing the object.","        if msg.data == True:","            self.pubPos_flag = True","            self.adjust_dist = True","            time.sleep(3.0)  # Wait 3 seconds before looking for another tag","","    def pubSix_Arm(self, joints, id=6, angle=180.0, runtime=2000):","        # Package the 6 joint angles into a message and send it to the arm motors.","        arm_joint =ArmJoints()","        arm_joint.joint1 = joints[0]","        arm_joint.joint2 = joints[1]","        arm_joint.joint3 = joints[2]","        arm_joint.joint4 = joints[3]","        arm_joint.joint5 = joints[4]","        arm_joint.joint6 = joints[5]","        arm_joint.time = runtime  # Tell the motors to take 2000 milliseconds (2 seconds) to reach this pose","        self.TargetAngle_pub.publish(arm_joint)","","    def pubVel(self,vx,vy,vz):","        # Send driving commands to the robot's wheels","        vel = Twist()","        vel.linear.x = float(vx)  # Forward/backward speed","        vel.linear.y = float(vy)  # Side to side speed","        vel.angular.z = float(vz)  # Spin speed","        self.CmdVel_pub.publish(vel)"," ","    def get_current_end_pos(self):","        # Ask the math brain: \"Based on my current joint angles, where is my claw?\"","        request = ArmKinemarics.Request()","        request.cur_joint1 = float(self.init_joints[0])","        # ... send joint angles ...","        request.kin_name = \"fk\"  # \"fk\" means Forward Kinematics","        future = self.client.call_async(request)  # Send the request in the background","        future.add_done_callback(self.get_fk_respone_callback)  # When the math is done, run the callback below","","    def get_fk_respone_callback(self, future):","        # Catch the math brain's answer and save the claw's X, Y, Z, Roll, Pitch, Yaw into our memory","        try:","            response = future.result()","            self.CurEndPos[0] = response.x ","            self.CurEndPos[1] = response.y","            self.CurEndPos[2] = response.z ","            self.CurEndPos[3] = response.roll","            self.CurEndPos[4] = response.pitch","            self.CurEndPos[5] = response.yaw","        except Exception as e:","            self.get_logger().error(f'Service call failed: {e}')","","    # --- THE MAIN CAMERA LOOP ---","    # This function runs automatically every time a matched pair of color and depth images arrives.","    def callback(self, color_frame, depth_frame):","        ","        # 1. Convert images into OpenCV format","        rgb_image = self.rgb_bridge.imgmsg_to_cv2(color_frame,'rgb8')","        result_image = np.copy(rgb_image)","        result_image = cv.resize(result_image, (640, 480))  # Make it fit on the screen","        ","        # 2. Process the depth image (this tells us how far away every single pixel is in millimeters)","        depth_image = self.depth_bridge.imgmsg_to_cv2(depth_frame, encoding[1])","        depth_to_color_image = cv2.applyColorMap(cv2.convertScaleAbs(depth_image, alpha=1.0), cv2.COLORMAP_JET) # Make it colorful so humans can see the distances","        frame = cv.resize(depth_image, (640, 480))","        depth_image_info = frame.astype(np.float32)","        ","        # 3. Look for AprilTags! ","        # Convert to grayscale first, because color confuses the tag detector.","        tags = self.at_detector.detect(cv2.cvtColor(rgb_image, cv2.COLOR_RGB2GRAY), False, None, 0.025)","        # Sort them by their ID number","        tags = sorted(tags, key=lambda tag: tag.tag_id) ","        # Draw boxes around the tags so we can see them on screen","        draw_tags(result_image, tags, corners_color=(0, 0, 255), center_color=(0, 255, 0))","        ","        # Draw a red rectangle in the center of the screen (probably a target zone for the camera)","        cv2.rectangle(result_image, (307, 241), (409, 338), (0, 0, 255), 3)","        ","        key = cv2.waitKey(10)  # Listen for keyboard presses","","        # 4. If we found a tag, AND we haven't grabbed it yet...","        if len(tags) > 0  and self.pubPos_flag == False:","            for i in range(len(tags)):","                # Get the X, Y pixel coordinates of the center of the tag","                center_x, center_y = tags[i].center","                cx = center_x","                cy = center_y","                # Look up that exact pixel in the depth image to find out how far away it is!","                # Divide by 1000 to convert millimeters to meters.","                cz = depth_image_info[int(cy),int(cx)]/1000","                ","                # Calculate the exact 3D position of the tag in the real world","                pose = self.compute_heigh(cx,cy,cz)","                ","                # How far off is the tag from where we actually want it to be? (Calibration math)","                x_offset_value = 0.145 - pose[0]","                y_offset_value = 0.0 - pose[1]","                z_offset_value = 0.04 - pose[2]","                ","                # If the user presses the SPACEBAR (key code 32)","                if key == 32:","                    self.pubPos_flag = True","                    # Save these new offset numbers into our YAML config file to make the robot more accurate next time!","                    offset_config['x_offset'] = x_offset_value.item()","                    offset_config['y_offset'] = y_offset_value.item()","                    offset_config['z_offset'] = z_offset_value.item()","                    with open(offset_file, 'w') as file:","                        yaml.dump(offset_config, file, default_flow_style=False)\t","                    print(\"Finish calibrate offset.\")","                    ","        # 5. Show the image on the screen and calculate the FPS (Frames Per Second)","        result_image = cv2.cvtColor(result_image, cv2.COLOR_RGB2BGR)  # Convert back to BGR for OpenCV display","        cur_time = time.time()","        fps = str(int(1/(cur_time - self.pr_time)))","        self.pr_time = cur_time","        cv2.putText(result_image, fps, (10, 30), cv2.FONT_HERSHEY_SIMPLEX, 1, (0, 255, 0), 2)","        cv2.imshow(\"result_image\", result_image)","        key = cv2.waitKey(1)","","    def move_dist(self, dist):","        # Use the PID controller to calculate how fast to drive the wheels to reach the target distance","        linear_x = self.linearx_pid.compute(dist, 200)","        self.pubVel(linear_x, 0, 0)","","    # --- THE 3D MATH SECTION ---","    # (This is where it gets very complex, but here is the simple version of what's happening)","","    def compute_heigh(self, x, y, z):","        # Step 1: We have a pixel (x,y) and a distance (z). Convert this into a 3D coordinate in the Camera's world.","        camera_location = self.pixel_to_camera_depth((x,y), z)","        ","        # Step 2: Use the translation matrix to figure out where the tag is relative to the Arm's Claw.","        PoseEndMat = np.matmul(self.EndToCamMat, self.xyz_euler_to_mat(camera_location, (0, 0, 0)))","        ","        # Step 3: We know where the claw is relative to the robot's base. Do more matrix math to combine them all!","        EndPointMat = self.get_end_point_mat()","        ","        # Step 4: Final calculation! Where is the tag relative to the robot's main body?","        WorldPose = np.matmul(EndPointMat, PoseEndMat) ","        ","        # Break the final matrix back down into X, Y, Z coordinates and angles","        pose_T, pose_R = self.mat_to_xyz_euler(WorldPose)","        print(\"pose_T: \", pose_T) # pose_T contains the final [X, Y, Z] location of the tag in the real world!","        return pose_T","","    def get_end_point_mat(self):","        # Convert the arm's current position (Euler angles) into a 4x4 Matrix for the math above","        end_w, end_x, end_y, end_z = self.euler_to_quaternion(self.CurEndPos[3], self.CurEndPos[4], self.CurEndPos[5])","        endpoint_mat = self.xyz_quat_to_mat([self.CurEndPos[0], self.CurEndPos[1], self.CurEndPos[2]], [end_w, end_x, end_y, end_z])","        return endpoint_mat","        ","    def pixel_to_camera_depth(self, pixel_coords, depth):","        # This is the camera math. It uses the camera lens properties (fx, fy, cx, cy) to turn a 2D pixel + distance ","        # into a real 3D X, Y, Z coordinate. ","        fx, fy, cx, cy = self.camera_info_K[0], self.camera_info_K[4], self.camera_info_K[2], self.camera_info_K[5]","        px, py = pixel_coords","        x = (px - cx) * depth / fx","        y = (py - cy) * depth / fy","        z = depth","        return np.array([x, y, z])","        ","    # --- MATH HELPER FUNCTIONS ---","    # These functions convert data back and forth between different 3D math formats. ","    # (Euler angles = pitch/roll/yaw. Matrices = grids of numbers. Quaternions = a 4-part number system that avoids gimbal lock).","    # You don't need to memorize these, they are just translating languages for the robot's brain!","    ","    def xyz_euler_to_mat(self, xyz, euler, degrees=False):","        if degrees:","            mat = tfs.euler.euler2mat(math.radians(euler[0]), math.radians(euler[1]), math.radians(euler[2]))","        else:","            mat = tfs.euler.euler2mat(euler[0], euler[1], euler[2])","        mat = tfs.affines.compose(np.squeeze(np.asarray(xyz)), mat, [1, 1, 1])","        return mat ","        ","    def euler_to_quaternion(self, roll, pitch, yaw):","        quaternion = tf.quaternion_from_euler(roll, pitch, yaw)","        qw = quaternion[3]","        qx = quaternion[0]","        qy = quaternion[1]","        qz = quaternion[2]","        return np.array([qw, qx, qy, qz])","        ","    def xyz_quat_to_mat(self, xyz, quat):","        mat = tfs.quaternions.quat2mat(np.asarray(quat))","        mat = tfs.affines.compose(np.squeeze(np.asarray(xyz)), mat, [1, 1, 1])","        return mat","        ","    def mat_to_xyz_euler(self, mat, degrees=False):","        t, r, _, _ = tfs.affines.decompose(mat)","        if degrees:","            euler = np.degrees(tfs.euler.mat2euler(r))","        else:","            euler = tfs.euler.mat2euler(r)","        return t, euler","","           ","def main():","    # Turn on ROS 2","    print('----------------------')","    rclpy.init()","    ","    # Create our AprilTag Detection Node","    apriltag_detect = AprilTagDetectNode('ApriltagDetect_node')","    ","    # Ask for the arm's starting position","    apriltag_detect.get_current_end_pos()","    ","    # Keep the node running forever until you press Ctrl+C","    rclpy.spin(apriltag_detect)"]};
const PARTS = [{"n":1,"fname":"README.md","enTitle":"System Startup Workflow","explain":[{"a":1,"b":1,"text":"<p>Startup sequence-র প্রথম ধাপ: <code>ros2 topic pub<\/code> tool দিয়ে <code>/arm6_joints<\/code> topic-এ <code>arm_msgs/msg/ArmJoints<\/code> type-এর একটি message publish করে 6-DOF arm-কে home pose-এ পাঠানো হয়। Payload-এ <code>joint1<\/code> থেকে <code>joint6<\/code> পর্যন্ত ছয়টি joint-এর target angle degree-এ দেওয়া আছে, আর <code>time: 1500<\/code> মানে motion-এর সময়কাল 1500 ms — এই 1.5 second-এর মধ্যে সব joint smoothly target-এ পৌঁছায়, ফলে arm ঝটকা না খেয়ে home pose-এ স্থির হয়। <code>--once<\/code> flag-এর অর্থ message ঠিক একবার publish হয়ে tool নিজেই exit করবে — এটি একটি one-shot command; flag-টি না দিলে <code>ros2 topic pub<\/code> default হিসেবে প্রতি সেকেন্ডে বারবার publish করতে থাকে এবং terminal block হয়ে থাকে।<\/p><p>আরেকটি বাস্তব শর্ত: এটি কোনো acknowledged request নয়, fire-and-forget style — ওই মুহূর্তে topic-টি subscribe করার কেউ না থাকলে message-টি চিরতরে হারিয়ে যায়। <code>/arm6_joints<\/code>-এর subscriber থাকে arm-এর MCU পাশে micro-ROS bridge-এর ওপারে (implementation এই folder-এ নেই), আর publish করা terminal আর সেই subscriber-এর মধ্যে <code>ROS_DOMAIN_ID=30<\/code> মিলতে হবে, নাহলে DDS discovery-ই ঘটবে না।<\/p><p>এখানে README-র নিজস্ব একটি quirk লক্ষ করুন: payload-এ quote-এর অবস্থান ভুল — opening double-quote-টি <code>{<\/code>-এর পরে বসেছে কিন্তু closing double-quote-টি <code>}<\/code>-এর আগে, ফলে লেখা অবস্থায় command-টি দিলে <code>ros2 topic pub<\/code> payload parse করতে ব্যর্থ হয়। Intended সঠিক রূপ হলো পুরো payload এক জোড়া quote-এর ভেতরে রেখে দেওয়া: <code>'{joint1: 90, joint2: 90, joint3: 90, joint4: 90, joint5: 90, joint6: 180, time: 1500}'<\/code> — সংশোধিত রূপটি শুধুই এই prose-এ, README-র মূল লাইন অপরিবর্তিত থাকবে। এই ধাপটি সবার আগে কারণ পরের <code>calibrate_arm.py<\/code> বর্তমান pose-কেই zero reference বানাবে; home না গিয়ে calibration হলে বা payload parse fail করলে zero পড়ে যাবে ভুল জায়গায়।<\/p>"},{"a":4,"b":4,"text":"<p>দ্বিতীয় ধাপ: home pose-এ স্থির হওয়া arm-এর joint zero calibration। <code>python3<\/code> interpreter দিয়ে <code>~/calibrate_arm.py<\/code> চালানো হয়, যেখানে <code>~<\/code>-কে shell home directory-তে expand করে — অর্থাৎ script-টি এই project folder-এর বাইরে home directory-তে রাখা, তাই এর ভেতরের implementation এই folder থেকে দেখা যায় না এবং এখানে শুধু ব্যবহার থেকে reasoning করা হচ্ছে। কাজ হলো arm-এর বর্তমান joint পড়াগুলোকে reference zero হিসেবে স্থির করা, যাতে এই মুহূর্তের home pose-টিই পরবর্তী সব joint reading, FK আর AprilTag offset হিসাবের ভিত্তি-reference হয়।<\/p><p>ক্রম-নির্ভরতা এখানেই: line 1 ছাড়া আগে এটি চালালে arm-এর তখনকার এলোমেলো অবস্থানটিই zero হয়ে যাবে, আর তখন পুরো chain-জুড়ে joint angle-গুলোতে একটি constant bias বহন করতে হবে। একটি জানা সতর্কতাও আছে: script-টির confirmation লজিক <code>if adjust == 'y' or 'Y':<\/code> আকারে লেখা বলে non-empty string <code>'Y'<\/code> truthy হওয়ায় condition-টি সবসময় True — y ছাড়া অন্য কিছু টাইপ করলেও calibration চলে যাবে; source-এর নিজের comment-ই বলে উদ্দেশ্য ছিল শুধু <code>y<\/code>/<code>Y<\/code> accept করা, তাই interactive prompt-এ এই আচরণ মাথায় রাখুন।<\/p>"},{"a":7,"b":7,"text":"<p>তৃতীয় ধাপ: micro-ROS agent চালু করা। <code>sh<\/code> shell interpreter দিয়ে <code>start_agent.sh<\/code> script-টি চালানো হয় — <code>sh<\/code> দিয়ে চালালে executable permission (<code>chmod +x<\/code>) ছাড়াই চলে, কিন্তু path-টি relative বলে current working directory অবশ্যই সেই folder হতে হবে যেখানে script-টি আছে, নাহলে shell এটি খুঁজে পাবে না; line 4-এর absolute <code>~/calibrate_arm.py<\/code> path-এর সঙ্গে এটাই পার্থক্য। Script-টির কাজ USB serial <code>/dev/myserial<\/code> device-এ 2,000,000 baud-এ micro-ROS agent bridge তৈরি করা — এর মাধ্যমেই Jetson-এর ROS 2 graph আর arm-এর MCU firmware তথ্য বিনিময় করে; 8N1 serial framing-এ প্রতি byte-এ 10 bit (1 start + 8 data + 1 stop) লাগে বলে এই হারে সর্বোচ্চ 200,000 bytes/s পরিবহন সম্ভব।<\/p><p>ধাপটি calibration-এর পরে এসেছে কারণ zero reference স্থির হয়ে যাওয়ার পরই এই bridge-ই একমাত্র channel হয়ে দাঁড়ায় যা দিয়ে ROS 2 side-এর command বা firmware-এর joint state চলাচল করবে। Agent বন্ধ থাকলে পরের দুই ধাপ যত সঠিকই হোক, কোনো ROS 2 message বা service call MCU পর্যন্ত পৌঁছাবে না — terminal-এ সব ঠিকঠাক দেখাবে, অথচ arm নিথর থাকবে।<\/p>"},{"a":10,"b":10,"text":"<p>চতুর্থ ধাপ: <code>ros2 launch<\/code> দিয়ে <code>M3Pro_demo<\/code> package-এর <code>camera_arm_kin.launch.py<\/code> launch file চালানো হয়। <code>ros2 run<\/code> একটি মাত্র executable চালায়, কিন্তু <code>ros2 launch<\/code> launch file-এর বর্ণনা অনুযায়ী একাধিক node একসঙ্গে তুলে আনে — এখানে ঠিক তাই হয়। Launch file-টির প্রথম কাজ <code>orbbec_camera<\/code> package-এর <code>dabai_dcw2.launch.py<\/code>-কে <code>IncludeLaunchDescription<\/code> দিয়ে include করা, যা Orbbec DaBai DCW2 RGB-D camera driver চালু করে এবং <code>/camera/color/image_raw<\/code> ও <code>/camera/depth/image_raw<\/code> topic-এ 640x480 color ও depth image publish করে; দ্বিতীয় কাজ <code>arm_kin<\/code> package-এর <code>kin_srv<\/code> executable (node name <code>kin_ik_fk<\/code>) চালু করা, যা kinematics service serve করে — service-এর নাম <code>get_kinemarics<\/code> এবং message type <code>ArmKinemarics<\/code>; এই দুটি বানান project-এর নিজস্ব quirk, client আর server দুই পাশে হুবহু এভাবেই ব্যবহার করতে হবে, নাহলে request match করবে না।<\/p><p><code>kin_srv<\/code>-এর implementation এই folder-এ নেই — ব্যবহার থেকে বোঝা যায় এটি joint angle থেকে forward kinematics হিসাব করে end-effector-এর pose জানায়, যা পরের ধাপের calibration node কাজে লাগাবে। line 13-এর node camera image আর এই service — দুটোর উপরেই নির্ভরশীল, তাই এই launch ছাড়া শেষ ধাপ অর্থহীন।<\/p>"},{"a":13,"b":13,"text":"<p>শেষ ধাপ: <code>ros2 run M3Pro_demo arm_offset<\/code> দিয়ে calibration node-টি চালু করা হয় — <code>arm_offset.py<\/code>-র <code>AprilTagDetectNode<\/code> এখানে executable হিসেবে চলে। Node-টি যা করে তার সারমর্ম: <code>tag36h11<\/code> family-র AprilTag detect করে (tag size 0.025 m), tag-এর center pixel-এ depth পড়ে pixel-টিকে camera intrinsics দিয়ে 3D point-এ back-project করে, <code>EndToCamMat<\/code> transform দিয়ে সেই point-কে end-effector frame-এ এবং kinematics service-এর জবাবে পাওয়া pose দিয়ে base frame-এ নেয়, desired pose (0.145, 0, 0.04) m-এর সঙ্গে তুলনা করে offset বের করে, আর SPACE (key code 32) চাপলে <code>x_offset<\/code>, <code>y_offset<\/code>, <code>z_offset<\/code> মানগুলো <code>/home/jetson/yahboomcar_ws/src/arm_kin/param/offset_value.yaml<\/code> file-এ লেখে (<code>yaml.dump<\/code> with <code>default_flow_style=False<\/code>)। একটি সূক্ষ্ম বিষয়: <code>main()<\/code>-এ spin-এর আগে <code>get_current_end_pos<\/code> ঠিক একবারই call হয়, তাই service থেকে পাওয়া <code>CurEndPos<\/code> আসলে একটি startup snapshot — এবং FK request-এ শুধু <code>cur_joint1<\/code> field-টিই set হয়, বাকি joint-গুলোর মান service-এর default-এর ওপর নির্ভর করে।<\/p><p>এটি পুরো chain-এর শেষ consumer বলেই সবার শেষে চালাতে হয়: camera driver, kinematics service আর micro-ROS bridge — তিনটিই চালু থাকা চাই; শেষ দুটি command long-running বলে সাধারণত আলাদা terminal-এ চালানো হয়। আগে চালালে node-টি কোনো synchronized color-depth image পাবে না, FK service-ও খুঁজে পাবে না, ফলে detection বা offset কিছুই হবে না; আর এই ধাপে লেখা offset file পরে <code>arm_kin<\/code>-এর হিসাবে ঢুকে যায় বলে এখানকার ভুল পুরো kinematics-এ ছড়িয়ে পড়ে।<\/p>"}],"math":null,"robot":{"correct":"পাঁচটি command সঠিক ক্রমে, একই <code>ROS_DOMAIN_ID=30<\/code>-এর terminal-গুলোতে চালালে: arm প্রথমে 1500 ms-এ home pose-এ যায়, <code>calibrate_arm.py<\/code> সেই pose-কে joint zero reference বানায়, <code>start_agent.sh<\/code> <code>/dev/myserial<\/code> USB serial-এ 2,000,000 baud-এ micro-ROS bridge খোলে যার মাধ্যমে ROS 2 command MCU firmware পর্যন্ত পৌঁছায়, <code>camera_arm_kin.launch.py<\/code> Orbbec DaBai DCW2 driver (640x480 color ও depth stream) এবং <code>kin_ik_fk<\/code> node একসঙ্গে চালু করে, আর শেষে <code>arm_offset<\/code> node AprilTag detect করে base frame-এ রূপান্তরিত tag pose desired pose-এর সঙ্গে তুলনা করে যে correction offset বের করে তা SPACE চাপলে <code>offset_value.yaml<\/code>-এ সেভ করে — পুরো hand-eye calibration chain সচল থাকে।","incorrect":"ক্রম এলোমেলো করলে ধারাবাহিক ব্যর্থতা: calibration-এর আগে home না করলে এলোমেলো pose-টিই zero হয়ে যায়, ফলে পরবর্তী সব FK ও offset হিসাবে constant error ঢোকে; <code>arm_offset<\/code> আগে চালালে কোনো camera image বা <code>get_kinemarics<\/code> service পাওয়া যায় না এবং node অকেজো থাকে; script-টি যেখানে আছে সেই folder-এ না দাঁড়িয়ে <code>sh start_agent.sh<\/code> চালালে file-ই পাওয়া যায় না; কোনো terminal-এ <code>ROS_DOMAIN_ID<\/code> না মিললে সেই terminal-এর message কখনো arm পর্যন্ত যায় না; agent বন্ধ থাকলে terminal-এ সব স্বাভাবিক দেখালেও arm নিথর থাকে; আর line 1-এর payload ভুল quote-অবস্থানে হুবহু টাইপ করলে <code>ros2 topic pub<\/code> YAML parse করতেই ব্যর্থ হয়, arm ঘরে ফেরে না।"},"id":"part-01","start":1,"end":13,"lang":"text","animType":"startupSequence","flags":[]},{"n":2,"fname":"calibrate_arm.py","enTitle":"Serial Link & Torque Control","explain":[{"a":1,"b":3,"text":"তিনটি Python standard/library <code>import<\/code>, প্রতিটির নিজস্ব ভূমিকা: <code>serial<\/code> (pyserial library) hardware-এর সাথে serial connection-এ কথা বলার পথ দেয়, <code>struct<\/code> Python-এর number-গুলোকে board-এর বোঝার মতো binary format-এ pack করার জন্য, আর <code>time<\/code> script-কে নির্দিষ্ট সময়ের জন্য pause করার সুবিধা দেয়। একটি সৎ observation: এই file-এর নিজের কোড আসলে কোথাও সরাসরি <code>serial<\/code> বা <code>struct<\/code> call করে না — serial port খোলা ও binary frame বানানোর আসল কাজ <code>config_robot<\/code> module-এর ভিতরে (এই folder-এর বাইরে) হয়, তাই এখানে এই দুটি import কার্যত অব্যবহৃতই থেকে যায়। কেবল <code>time<\/code> সত্যিই ব্যবহৃত হবে — line 17 ও 22-এ <code>time.sleep(.5)<\/code> হিসেবে।"},{"a":4,"b":4,"text":"এই পুরো script-এর মূল ভিত্তি: local module <code>config_robot<\/code> থেকে <code>MicroROS_Robot<\/code> class-টি import করা হচ্ছে — এটি এই নির্দিষ্ট robot-এর জন্য লেখা একটি custom blueprint, যার implementation এই folder-এ নেই। এই class-এর ভিতরেই serial protocol-এর সব low-level কাজ (frame গঠন, checksum, পাঠানো-গ্রহণ) লুকানো থাকে, ফলে calibration script-টি শুধু high-level method call করে কাজ করতে পারে। Project-এর setup অনুযায়ী arm-এর controller board-এর serial link-টি <code>/dev/myserial<\/code>-এ 2,000,000 baud-এ চলে (8N1 হলে প্রায় 200,000 bytes/s), তবে সেই port খোলার প্রকৃত কোডও <code>config_robot<\/code>-এর ভিতরে, তাই আমরা এখান থেকে শুধু ব্যবহার-ভিত্তিক reasoning করতে পারি। একটি গুরুত্বপূর্ণ timing তথ্য: README-র pipeline-এ <code>calibrate_arm.py<\/code> চলে step 2-তে — <code>start_agent.sh<\/code> (micro-ROS bridge) চালু হওয়ার <i>আগে<\/i> — তাই এই মুহূর্তে serial port-টি এই script-এর একার দখলে থাকে, এবং script-এর শেষে port ছেড়ে দেওয়া না হলে পরের step শুরু করা যাবে না।"},{"a":6,"b":6,"text":"<code>if __name__ == \"__main__\":<\/code> guard-টি নিশ্চিত করে যে নিচের কোড তখনই চলবে যখন file-টি সরাসরি execute করা হয় (README-র step 2 অনুযায়ী <code>python3 ~/calibrate_arm.py<\/code>); কেউ যদি এই file-কে module হিসেবে import করে, তখন এই block আর চলবে না। Hardware-এর সাথে কথা বলা ও motor-এর torque toggle করার মতো side-effect বোঝা কোড হঠাৎ import-এর সুযোগে চলে গেলে বিপজ্জনক হতো, তাই ROS-জগতে এটি একটি প্রোয়োজনীয় অভ্যাস।"},{"a":7,"b":7,"text":"Source-এর নিজস্ব মন্তব্য: robot object তৈরি করা হচ্ছে, আর <code>debug=False<\/code> মানে “লুকানো background data আমার পর্দায় ছাপিস না” — পরের লাইনের constructor call-এর উদ্দেশ্য এক লাইনে বলে দেওয়া।"},{"a":8,"b":8,"text":"<code>bot = MicroROS_Robot(debug=False)<\/code> — constructor call, যা <code>bot<\/code> নামের object তৈরি করে; এই object-টিই এরপর পুরো script-এ robot-এর একমাত্র handle। ব্যবহার থেকে অনুমান করা যায় constructor-এর ভিতরেই serial connection খোলা হয়, কারণ এর ঠিক পরের <code>bot.read_version()<\/code> call-ই board-এর সাথে কথা বলে — তবে সঠিক implementation এই folder-এ দেখা যাচ্ছে না। <code>debug=False<\/code> মানে background-এর raw protocol data (কোন command frame পাঠানো হলো, board কী ফেরত দিল) terminal-এ print হবে না; debugging-এর দরকার হলে <code>debug=True<\/code> করলে সেই ভেতরের আড়াই-আড়াই কথা দেখা যেত। মনে রাখুন, script-এর একদম শেষে <code>del bot<\/code> দিয়ে এই object মুছে serial port ছেড়ে দেওয়া হয়, যাতে step 3-এর <code>start_agent.sh<\/code> সেই port নিতে পারে।"},{"a":10,"b":12,"text":"মন্তব্য বলছে কাজটা: board-কে জিজ্ঞেস করা হচ্ছে সে কোন software version চালাচ্ছে। <code>version = bot.read_version()<\/code> একটি handshake, অর্থাৎ liveness check: উত্তরটি <code>version<\/code> variable-এ জমা হয়। এর implementation এই folder-এ নেই, কিন্তু উদ্দেশ্যটি স্পষ্ট: serial wiring, baud rate বা device path ভুল হলে সবার আগে এই call-ই fail করবে বা garbage value ফেরত দেবে — অর্থাৎ torque-এর মতো শক্তিশালী command পাঠানোর <i>আগেই<\/i> operator বুঝে যাবে link-টি বেঁচে আছে কি না। পরের লাইনে <code>print(\"version:\", version)<\/code> সেই উত্তর terminal-এ দেখায়, যাতে চোখে দেখে confirm করা যায় — এটি README pipeline-এর চোখের সামনে থাকা প্রথম প্রমাণ যে Jetson আর arm-এর board-এর মধ্যে যোগাযোগ স্বাভাবিক।"},{"a":14,"b":16,"text":"<code>bot.set_arm_torque(1)<\/code> arm-এর 6-টি motor-এর torque (motor-এর পেশি-শক্তি) চালু করে — argument <code>1<\/code> মানে ON। Torque ON হলে motor-গুলো তাদের বর্তমান position-এ lock হয়ে যায় এবং হাত দিয়ে নাড়ালে resistance দেখায়। প্রথমে ON করার কারণ দুটি: board-টি একটি পরিচিত energized state-এ আসে (আগের কোনো session-এ কী অবস্থা ছিল তার উপর নির্ভর করা বন্ধ হয়), আর এটি নিজেই একটি physical liveness check — arm হঠাৎ শক্ত হয়ে গেলেই বোঝা যায় command গুলো সত্যিই board পর্যন্ত পৌঁছাচ্ছে, শুধু version string-এর বদলে বাস্তব মেকানিক্যাল প্রতিক্রিয়া দিয়ে। লক্ষ রাখুন, ঠিক পরেই script torque আবার OFF করবে, কারণ calibration-এর জন্য arm-কে হাতে নাড়াতে হবে।"},{"a":17,"b":17,"text":"<code>time.sleep(.5)<\/code> অর্ধ সেকেন্ড অপেক্ষা — এটি settling time। Serial-এ command পাঠানো এবং motor-এর মেকানিক্যালভাবে lock হয়ে যাওয়া একই মুহূর্তে ঘটে না; motor-কে অবস্থান ধরে শক্ত হতে সামান্য সময় লাগে। এই pause না থাকলে পরের command (torque OFF) খুব দ্রুত এসে board-এর state-এর সাথে race করতে পারত — বিশেষ করে 6টি motor একসাথে energize হওয়ার সময় বর্তমান টান বেশি হয়, তাই একটু সময় দেওয়াই নিরাপদ।"},{"a":19,"b":21,"text":"<code>bot.set_arm_torque(0)<\/code> torque বন্ধ করে দেয় — argument <code>0<\/code> মানে OFF। Motor-গুলো এখন relax হয়ে floppy হয়ে যায়, ফলে operator robot arm-টিকে হাত দিয়ে physically নাড়াতে পারে — এটিই এই পুরো calibration-এর মূল প্রস্তুতি ধাপ: পরের অংশে (Part 3) <code>input()<\/code> prompt-এ pause করার সময়টুকুতে ব্যবহারকারী arm-কে manually তার perfect zero starting position-এ ধরে রাখবে। Torque ON অবস্থায় হাতের চাপে motor resistance দেখাত, এমনকি জোর করে নাড়ানোর চেষ্টা করলে gear বা motor-এর ক্ষতির ঝুঁকিও থাকত — তাই হাতে নাড়ানোর আগে torque ছেড়ে দেওয়া hardware-এর নিরাপত্তার দিক থেকেও জরুরি।"},{"a":22,"b":22,"text":"আবার <code>time.sleep(.5)<\/code> — এবার motor-গুলো relax হওয়ার জন্য অর্ধ সেকেন্ড settling time দেওয়া হচ্ছে। এরপর script তার পরের ধাপে যাবে: operator-কে arm হাতে সরিয়ে zero position-এ নেওয়ার সুযোগ দিতে একটি <code>input()<\/code> prompt-এ এসব অপেক্ষা করবে (line 27 হতে শুরু হওয়া অংশ Part 3-এ বিস্তারিত ব্যাখ্যা করা হয়েছে)। ছোট এই pause-টুকুও একই যুক্তিতে দরকার: torque বন্ধ হওয়ার physical effect ঘটার আগেই অপারেটরকে হাত দিয়ে টানতে শুরু করলে motor-এর অবস্থা নিয়ে বিভ্রান্তি তৈরি হতে পারত।"}],"math":null,"robot":{"correct":"সঠিকভাবে চালালে (README-র step 2: <code>ros2 topic pub<\/code> দিয়ে arm-কে home pose [90,90,90,90,90,180]-এ পাঠানোর পর, <code>start_agent.sh<\/code> চালুর আগে) Jetson-এ এই script <code>bot<\/code> object বানিয়ে <code>/dev/myserial<\/code>-এর serial link দখল করে, terminal-এ board-এর version print করে (2,000,000 baud link বেঁচে আছে এর প্রমাণ), তারপর 6-DOF arm-এর motor-গুলো আধা সেকেন্ডের জন্য lock হয়ে শক্ত হয়, এরপর relax হয়ে হাতে নড়ানোর মতো নরম হয়ে যায় — এবং script অপেক্ষা করতে থাকে, যতক্ষণ না ব্যবহারকারী arm-কে zero position-এ ধরে পরের prompt-এ ইনপুট দেয়। এই ধাপ শেষে <code>del bot<\/code> port ছেড়ে দেয়, তাই step 3-এর micro-ROS agent স্বাভাবিকভাবে একই serial line দিয়ে ROS 2 (ROS_DOMAIN_ID 30) নেটওয়ার্কে arm-কে যোগ করতে পারে।","incorrect":"Serial device path বা baud rate ভুল হলে — বা <code>start_agent.sh<\/code> আগেই চালু থাকলে port busy হয়ে যাবে — constructor বা <code>bot.read_version()<\/code> fail করবে বা garbage ফেরত দেবে, terminal-এ version হয় ছাপাই হবে না, নয়তো অর্থহীন সংখ্যা দেখাবে। Torque command board-এ পৌঁছালে না পৌঁছালে arm শক্ত বা নরম হবে না: locked arm জোর করে নাড়াতে গিয়ে motor/gear-এ চাপ পড়বে, আবার relax না হলে operator ভুল zero position-এ calibration করে ফেলবে যার ফলে পরে সব joint-এর offset একদিকে সরে যাবে এবং AprilTag-ভিত্তিক <code>arm_offset<\/code> calibration-ও ভুল ভিত্তির উপর দাঁড়াবে। <code>time.sleep(.5)<\/code> বাদ পড়লে পরপর দুটি torque command-এর মাঝে motor settle হওয়ার আগেই পরের ধাপে এগিয়ে যাওয়ার race তৈরি হতে পারে।"},"id":"part-02","start":1,"end":22,"lang":"python","animType":"torqueControl","flags":[]},{"n":3,"fname":"calibrate_arm.py","enTitle":"Manual Zero-Position Calibration","explain":[{"a":23,"b":23,"text":"Line 23 নিজে কোনো code নয় — source-এর একটি blank/whitespace-only line, যা ঠিক আগের দুই line-এর (<code>bot.set_arm_torque(0)<\/code>, তারপর <code>time.sleep(.5)<\/code>) পরে একটি নীরব বিভাজক হিসেবে বসে আছে। তবে এই জায়গাটিতেই ওই settle-এর কথা বলা দরকার: command পাঠানো আর hardware সেটা execute করে শেষ করা একই ব্যাপার নয় — 2,000,000 baud-এর serial link যত দ্রুতই হোক, torque OFF command-এর পরে driver circuit-কে সম্পূর্ণ নিষ্ক্রিয় হতে সামান্য সময় লাগে, আর line 22-এর অর্ধ সেকেন্ডের ছোট settle-time ঠিক সেই সুযোগটাই দেয়। এই wait শেষ হলেই script-এর পরের মূল ধাপ — arm-কে হাতে সরিয়ে zero position-এ মেলে ধরা — শুরু করার প্রস্তুতি তৈরি হয়; পরের line থেকেই সেই manual অংশের comment শুরু।"},{"a":24,"b":27,"text":"Comment-গুলো যেমন বলছে, এটাই script-এর manual অংশ: <code>adjust = input(\"Input y for end of adjusting:\")<\/code> একটি blocking prompt — <code>input()<\/code> terminal-এ message-টি ছেপে main thread-কে সম্পূর্ণ থামিয়ে রাখে যতক্ষণ না user কিছু টাইপ করে Enter চাপে। এই অপেক্ষার সময়টাই আসল কাজের সময়: torque OFF থাকায় 6-DOF arm-টি হাতে সরানো যায়, আর user প্রতিটি joint কাঙ্ক্ষিত zero pose-এ মেলে ধরেন — এখানে কোনো sensor feedback বা timeout নেই, মানুষের চোখ-হাতই position sensor-এর ভূমিকায় (human-in-the-loop)। যা-ই টাইপ করা হোক (এমনকি কিছু না লিখে শুধু Enter চাপলেও), trailing newline বাদ দিয়ে সেই string-টি <code>adjust<\/code> variable-এ জমা হয় — এই মানটিই পরের condition-এ ব্যবহৃত হবে।"},{"a":29,"b":33,"text":"এই condition-টি পুরো file-এর সবচেয়ে গুরুত্বপূর্ণ শিক্ষণীয় জায়গা, আর source-এর নিজের comment (lines 30-32) বিশ্লেষণসহ স্বীকার করে যে এখানে একটি bug আছে। <code>if adjust == 'y' or 'Y':<\/code> দেখতে সরল, কিন্তু Python-এ comparison operator <code>==<\/code>-এর precedence <code>or<\/code>-এর চেয়ে বেশি, তাই expression-টি আসলে <code>(adjust == 'y') or ('Y')<\/code> হিসেবে parse হয় — দ্বিতীয় operand-এ <code>'Y'<\/code>-এর সাথে কোনো comparison-ই হয় না। Python-এ যেকোনো non-empty string truthy, অর্থাৎ একা <code>'Y'<\/code> সবসময় True হিসেবে গণ্য হয়, আর <code>or<\/code> একটি truthy operand পেলেই পুরো condition-কে truthy করে তোলে (short-circuit)। ফলাফল: <code>adjust<\/code>-এ যা-ই থাক — <code>'n'<\/code>, <code>'x'<\/code>, এমনকি ফাঁকা string <code>''<\/code> — condition-টি কখনো False হতে পারে না, তাই branch-টি সবসময় execute হয় এবং এই script-এ abort করার কোনো রাস্তাই নেই। Programmer-এর intent ছিল শুধু <code>y<\/code> বা <code>Y<\/code> accept করা; সঠিক লেখা হতো <code>if adjust == 'y' or adjust == 'Y':<\/code>, অথবা আরও পরিষ্কারভাবে <code>if adjust in ('y', 'Y'):<\/code> — সংশোধিত form শুধু এই prose-এ, source সর্বদা verbatim। বাস্তব পরিণতি: user ভুলবশত খালি Enter চেপে ফেললেও calibration শুরু হয়ে যাবে এবং arm-এর তখনকার যেকোনো pose-ই নতুন zero হয়ে যাবে — নিচের Math section-এ এর সম্পূর্ণ boolean derivation দেওয়া হলো।"},{"a":35,"b":36,"text":"<code>for i in range(1,7):<\/code> loop-টি <code>i<\/code> = 1, 2, 3, 4, 5, 6 মানগুলোর উপর চলে — <code>range<\/code>-এর stop value exclusive, তাই 7 কখনো আসে না, এটি নতুন programmer-দের কাছে সবচেয়ে কমন ভুলের একটি। এই ছয়টি মান ঠিক এই 6-DOF serial arm-এর joint 1 থেকে joint 6-এর সাথে এক-এক করে মিলে যায়, অর্থাৎ loop-এর প্রতিটি iteration একটি নির্দিষ্ট joint-এর calibration সম্পন্ন করে এবং পুরো zero-position save করার কাজটি ছয় ধাপে সম্পন্ন হয়।"},{"a":38,"b":39,"text":"<code>state = bot.set_arm_calib_offset(i)<\/code> হলো calibration-এর আসল command: joint <code>i<\/code>-কে বলা হয় — তোমার এই মুহূর্তের encoder reading-ই তোমার নতুন zero হিসেবে save করো। <code>set_arm_calib_offset<\/code> method-টি <code>config_robot<\/code> module-এর <code>MicroROS_Robot<\/code> class-এ define করা — এই folder-এর বাইরের code, তাই এর ভেতরের implementation এখান থেকে দেখা যাচ্ছে না; ব্যবহার থেকে জানা যায় এটি serial link-এর ওপর দিয়ে firmware-কে একটি message পাঠায় এবং একটি status code return করে। কাজটি বোঝা যায় <code>physical = raw - offset<\/code> সম্পর্ক দিয়ে: firmware প্রতিটি joint-এর raw encoder angle জানে, calibration-এর পরে সেই raw মান থেকে save করা offset বিয়োগ করে প্রকাশ করা angle বের করে — তাই save করার মুহূর্তে joint-টি যেখানে দাঁড়িয়ে সেখানেই তার পড়া 0 degree হয়ে যায়। ফলে পরে <code>/arm6_joints<\/code> দিয়ে home pose <code>[90,90,0,0,90,90]<\/code> পাঠালে সেই target angle-গুলো এই নতুন zero থেকে মাপা হবে।"},{"a":41,"b":44,"text":"Return করা <code>state<\/code> negative হলে (যেমন firmware <code>-1<\/code> দিলে) বোঝায় save command-টি ব্যর্থ হয়েছে, আর তখন <code>state &lt; 0<\/code> condition ঠিক একটি retry দেয় — আবার একই <code>bot.set_arm_calib_offset(i)<\/code> call করে <code>state<\/code> নতুন করে আপডেট হয়। খেয়াল করুন এটি loop নয়, কোনো delay বা backoff-ও নেই: দ্বিতীয় চেষ্টাটিও fail করলে code কোনো error raise করে না, শান্তভাবে পরের line-এ চলে যায়। ফলে একটি joint বারবার fail করলে সেই joint পুরনো zero-তেই থেকে যায় কিন্তু বাকি পাঁচটি নতুন zero পেয়ে যায় — arm-এর পুরো coordinate frame তখন অসঙ্গত হয়ে যায়।"},{"a":46,"b":47,"text":"<code>print(\"state=\", i, state)<\/code> প্রতিটি joint-এর জন্য joint নম্বর আর সর্বশেষ status code terminal-এ ছাপায় — এটাই এই script-এর calibration-সংক্রান্ত একমাত্র
