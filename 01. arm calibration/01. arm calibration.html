 operator-visible diagnostics। <code>print<\/code>-এ একাধিক argument space দিয়ে জোড়া লাগে, তাই আউটপুট দেখাবে <code>state= 1 0<\/code>-এর মতো। এই script-এর নিজের convention অনুযায়ী negative মান মানে retry-সহ দুটি চেষ্টাই fail; calibration আসলে হয়েছে কিনা তার একমাত্র সূত্র এই ছোট print-টিই, তাই এই সময়ে terminal-এর দিকে নজর রাখা জরুরি।"},{"a":49,"b":49,"text":"<code>print(\"Calibration successfully!\")<\/code> message-টি নির্বিচারে সবসময়ই ছাপা হয় — এর আগে কোনো check নেই যে সব ছয়টি joint-এর <code>state<\/code> আসলে non-negative ছিল কিনা। অর্থাৎ এটি verified confirmation নয়, শুধু একটি cosmetic message; আসল সত্য জানতে হলে আগের line-এ ছাপা <code>state=<\/code> আউটপুটগুলোই আবার দেখে নিতে হবে।"},{"a":51,"b":52,"text":"Calibration শেষে <code>bot.set_arm_torque(1)<\/code> দিয়ে motor torque আবার ON করা হয় — motor গুলো আবার lock হয়ে যায় এবং হাতে সরাতে গেলে resist করবে। এই ধাপটি কেবল পরিচ্ছন্নতা নয়: arm-টি এই মুহূর্তে তার নতুন zero position-এ দাঁড়িয়ে আছে, আর torque ON থাকলে সেই pose-টি স্থির থাকে। এখান থেকেই পরবর্তী সব pipeline ধাপ — micro-ROS agent, <code>/arm6_joints<\/code>-এর home command (joint time 1500 ms), আর FK service node <code>kin_ik_fk<\/code> — এই নতুন zero-কে reference ধরে কাজ করবে।"},{"a":54,"b":57,"text":"সবশেষে <code>del bot<\/code> লিখে <code>bot<\/code> নামটির reference মুছে দেওয়া হয় — comment-এ বলা হয়েছে এটা অফিস ছেড়ে বেরোনোর সময় আলো নিভিয়ে দরজায় তালা লাগানোর মতো। CPython-এ কোনো object-এর শেষ reference মুছে গেলে object-টি ধ্বংস হয়, আর <code>MicroROS_Robot<\/code> class (এই folder-এর বাইরে define করা, implementation দেখা যাচ্ছে না) সম্ভবত তখন serial port <code>/dev/myserial<\/code> close করে দেয়। ব্যাপারটি গুরুত্বপূর্ণ, কারণ একটি serial port দুটি program-এর হাতে গেলে ঝামেলা নিশ্চিত — অথবা দ্বিতীয়টি ওইটা খুলতেই ব্যর্থ হয় (port যদি exclusive mode-এ খোলা থাকে), অথবা দুজনে একই byte stream থেকে byte ছোঁয় নিয়ে যোগাযোগ garbage করে ফেলে; <code>MicroROS_Robot<\/code>-এর implementation এই folder-এর বাইরে, তাই দুটির মধ্যে কোনটি ঘটবে তা এখান থেকে নিশ্চিত করা যায় না। Port release না হলে পরের ধাপ <code>start_agent.sh<\/code>-এর micro-ROS bridge-টি ওই একই <code>/dev/myserial<\/code> নিয়ে ঠিক এই সমস্যায় পড়ত এবং পুরো pipeline আটকে যেত।"}],"math":{"intro":"Line 33-এর condition কেন কখনো False হতে পারে না এবং সঠিক form-টি দেখতে কেমন — সেটা boolean algebra দিয়ে ধাপে ধাপে প্রমাণ করা হলো। <code>adjust<\/code> variable-টিকে a ধরে নিয়ে দুটি operand আলাদা করে বিশ্লেষণ করলেই domination law থেকে ফল বেরিয়ে আসে।","levels":[{"label":"Step 1 — Operator precedence অনুযায়ী parse","latex":"\\[ a == \\text{'y'} \\;\\text{or}\\; \\text{'Y'} \\;\\Longleftrightarrow\\; (a == \\text{'y'}) \\;\\lor\\; \\text{'Y'} \\]","text":"Comparison operator <code>==<\/code>-এর precedence <code>or<\/code>-এর চেয়ে বেশি, তাই Python প্রথমে <code>a == 'y'<\/code> অংশটিকে একটি সম্পূর্ণ comparison হিসেবে গড়ে নেয়, আর একা <code>'Y'<\/code> থেকে যায় দ্বিতীয় operand হিসেবে — <code>'Y'<\/code> কোনো comparison-এর ভেতরেই নেই। এই ভুল parse-ই পুরো bug-এর শুরু।"},{"label":"Step 2 — Non-empty string-এর truthiness","latex":"\\[ B(s) = \\top \\iff s \\neq \\epsilon \\;\\;\\Rightarrow\\;\\; B(\\text{'Y'}) = \\top \\]","text":"Python-এর truthiness rule: শুধু empty string <code>''<\/code> (এখানে ε দিয়ে লেখা) falsy, বাকি সব string truthy। <code>'Y'<\/code> একটি non-empty string, সুতরাং এটি একা দাঁড়িয়ে থেকেও সর্বদা True — <code>bool('Y')<\/code> হলো <code>True<\/code>, এমনকি <code>bool('n')<\/code>-ও আসলে <code>True<\/code>।"},{"label":"Step 3 — Domination law প্রয়োগ","latex":"\\[ X \\lor \\top \\equiv \\top \\;\\;\\Longrightarrow\\;\\; (a == \\text{'y'}) \\lor \\top \\equiv \\top \\quad \\forall a \\]","text":"Boolean algebra-এর domination law: disjunction-এর একটি operand যদি চির-⊤ হয়, তাহলে অন্য operand যা-ই হোক না কেন ফল সর্বদা ⊤। <code>or<\/code>-এর short-circuit আচরণও তাই: বাম operand False হলে ফল হয় ডান operand, আর ডান operand এখানে truthy constant <code>'Y'<\/code> — তাই condition-টি a-এর যেকোনো মানের জন্য সত্য, অর্থাৎ line 33-এর branch কখনো skip-ই হয় না।"},{"label":"Step 4 — Programmer-এর intended সঠিক form","latex":"\\[ (a = \\text{'y'}) \\lor (a = \\text{'Y'}) \\;\\equiv\\; a \\in \\{\\text{'y'},\\, \\text{'Y'}\\} \\]","text":"Intent অনুযায়ী সঠিক condition হলো দুটি সম্পূর্ণ comparison-এর disjunction, যা code-এ লিখতে হয় <code>if adjust == 'y' or adjust == 'Y':<\/code> — অথবা set membership দিয়ে আরও পরিষ্কারভাবে <code>if adjust in ('y', 'Y'):<\/code>। এতে বাম operand-এর মতো ডান operand-ও <code>adjust<\/code>-এর উপর নির্ভর করবে, চির-সত্য constant নয়।"}],"numeric":[{"latex":"\\[ a = \\text{'n'}: \\; (\\text{'n'} == \\text{'y'}) = \\bot, \\;\\; B(\\text{'Y'}) = \\top \\;\\;\\Rightarrow\\;\\; \\bot \\lor \\top = \\top \\]","text":"User স্পষ্টভাবে <code>n<\/code> (না) টাইপ করলেও: প্রথম operand False, কিন্তু দ্বিতীয় operand <code>'Y'<\/code> চির-truthy — তাই branch তবুও run করে। অর্থাৎ এই script-এ user-এর হাতে 'না' বলার আসলে কোনো উপায়ই নেই।"},{"latex":"\\[ a = \\epsilon \\;\\text{(Enter only)}: \\; (\\epsilon == \\text{'y'}) = \\bot, \\;\\; B(\\text{'Y'}) = \\top \\;\\Rightarrow\\; \\top \\]","text":"User কিছু না লিখে শুধু Enter চাপলে <code>input()<\/code> empty string <code>''<\/code> (ε) return করে — এমনকি তখনও condition True এবং calibration শুরু হয়ে যায়। এটাই সবচেয়ে বিপজ্জনক বাস্তব ক্ষেত্র: ভুল চাপা একটি Enter-ই arm-এর একটি ভুল pose-কে নতুন zero বানিয়ে কমিট করে দিতে পারে।"},{"latex":"\\[ \\text{correct form:} \\; a = \\text{'Y'}: \\; \\bot \\lor (\\text{'Y'} == \\text{'Y'}) = \\top; \\qquad a = \\text{'n'}: \\; \\bot \\lor \\bot = \\bot \\]","text":"সঠিক form-এ দেখুন: <code>Y<\/code> accept হয়, কিন্তু <code>n<\/code> reject হয় — ঠিক যেটা programmer চেয়েছিলেন। Source-এর নিজের comment (lines 30-32)-ও এই intent-ই স্বীকার করে।"}],"mapping":[{"code":"adjust","math":"a — stdin থেকে আসা যেকোনো string","text":"<code>input()<\/code>-এর return value; এটি <code>'y'<\/code>, <code>'Y'<\/code>, <code>'n'<\/code>, <code>''<\/code> — যা-ই হতে পারে, আর পুরো বিশ্লেষণ এই একটি মানের উপরই দাঁড়িয়ে।"},{"code":"adjust == 'y'","math":"(a = 'y') — equality predicate","text":"প্রথম operand, একটি সম্পূর্ণ comparison; এর মান <code>adjust<\/code>-এর উপর নির্ভর করে বলেই এটাকে condition-এর অর্থবহ অংশ বলা যায়।"},{"code":"'Y' (একা, দ্বিতীয় operand)","math":"B('Y') = ⊤","text":"কোনো comparison নয় — একটি constant truthy string operand; <code>or<\/code>-এর ডান দিকে এটি বসে থাকাই পুরো condition-কে চির-সত্য করে তোলে, আর এটিই bug-এর মূল।"},{"code":"or","math":"∨ (disjunction), short-circuit","text":"বাম operand falsy হলে Python ফল হিসেবে ডান operand-টিকেই return করে; <code>if<\/code> সেই ফলাফলের truthiness পরীক্ষা করে — ডান operand truthy object হলে branch নেওয়া হয়।"}],"failure":["Condition যেহেতু কখনো False হয় না, ভুলবশত খালি Enter চাপলেও calibration commit হয়ে যায় — arm-এর তখনকার random pose-ই নতুন zero হয়ে যায়, আর সেই ভুল পরে সব FK output এবং <code>arm_offset.py<\/code>-এর AprilTag offset গণনায় স্থায়ী bias হিসেবে ঢুকে যায়।","উল্টো দিকের ভুল 'fix' আরও বিপদ: <code>adjust == ('y' or 'Y')<\/code> লিখলে <code>('y' or 'Y')<\/code> প্রথম truthy operand <code>'y'<\/code>-কেই return করে, ফলে বড় হাতের <code>Y<\/code> চিরকাল reject হয় — প্রথম bug-এর ঠিক উল্টো সমস্যা তৈরি হয়।","যদি <code>state &lt; 0<\/code>-এর sign convention উল্টো বোঝা হতো, failed save-কেই success ধরা হতো; আর <code>physical = raw - offset<\/code> সম্পর্কটির sign উল্টে গেলে প্রতিটি joint-এর reported angle mirror হয়ে যেত এবং পরে সব kinematics ভুল দিকে যেত।"]},"robot":{"correct":"Jetson-এ script-টি চালানোর পর যখন সবঠিক থাকে: torque OFF অবস্থায় user হাত দিয়ে 6-DOF arm-টিকে কাঙ্ক্ষিত zero pose-এ মেলে ধরে <code>y<\/code> টাইপ করে Enter চাপলে ছয়টি joint-ই নিজের তখনকার encoder angle নতুন zero হিসেবে save করে, terminal-এ <code>state= i 0<\/code>-এর মতো ছাপা দেখা যায়, তারপর <code>bot.set_arm_torque(1)<\/code> arm-টিকে নতুন home-এ lock করে দেয়। Serial port ছেড়ে দেওয়ায় পরের ধাপ <code>start_agent.sh<\/code> <code>/dev/myserial<\/code>-এ 2,000,000 baud-এ micro-ROS agent চালু করতে পারে, আর ROS_DOMAIN_ID 30-এর বাকি pipeline — <code>/arm6_joints<\/code>-এর home command (joint time 1500 ms) থেকে FK node <code>kin_ik_fk<\/code> পর্যন্ত — এই calibrated zero থেকে মাপা angle নিয়েই কাজ করে।","incorrect":"Line 33 যেহেতু সবসময় True, user ভুল করে খালি Enter বা যেকোনো key চাপলেও calibration কমিট হয়ে যায় — অগোছালো যেকোনো pose নতুন zero হয়ে সেখান থেকে সব FK pose ও AprilTag ভিত্তিক offset গণনা biased হয়ে যায়। কোনো joint-এর <code>set_arm_calib_offset<\/code> একটি retry-সহ দুই চেষ্টাতেও fail করলে সেই joint পুরনো zero-তেই থেকে যায় (অর্ধেক নতুন, অর্ধেক পুরনো frame), অথচ <code>Calibration successfully!<\/code> message-টি তখনও নির্দ্বিধায় ছাপা হয়। আর শেষে serial port যদি release না হতো, <code>start_agent.sh<\/code>-এর <code>/dev/myserial<\/code> হয় খোলাই যেত না, নয়তো একই byte stream দুই process-এ ভাগ হয়ে serial যোগাযোগ নষ্ট করত — camera-kinematics launch-এর আগেই পুরো ROS 2 pipeline আটকে যেত।"},"id":"part-03","start":23,"end":57,"lang":"python","animType":"zeroCalibration","flags":[]},{"n":4,"fname":"start_agent.sh","enTitle":"micro-ROS Agent Bridge","explain":[{"a":1,"b":2,"text":"<p>এই file-এর প্রথম line-টি <b>shebang<\/b>: <code>#!/bin/bash<\/code>। Operating system script-টিকে executable হিসেবে চালানোর সময় প্রথম দুই byte (<code>#!<\/code>) দেখেই বুঝে নেয় বাকি পুরো text কোন program দিয়ে interpret করতে হবে — এখানে সেটি <code>/bin/bash<\/code>, মানে GNU Bash shell। Line 2-এর comment-টি ঠিক এটাই ব্যাখ্যা করে: এটি একটি Bash terminal script। README-র pipeline অনুযায়ী এই script-টি step 3-এ চালানো হয় — home pose publish ও <code>calibrate_arm.py<\/code>-এর পরে, camera ও kinematics node-গুলো চালানোর আগে। উল্লেখ্য, এই script-এ bash-only কোনো feature (array, <code>[[ ]]<\/code> ইত্যাদি) নেই, তাই <code>sh start_agent.sh<\/code> দিয়ে চালালেও ফলাফল একই হবে।<\/p>"},{"a":4,"b":8,"text":"<p>Line 4 থেকে 8 একটি comment block — শুরু ও শেষে <code># ---<\/code> দিয়ে আলাদা করা একটি <i>options ledger<\/i>, অর্থাৎ developer-এর রেখে যাওয়া বিকল্প-সমাধানের খাতা। Line 5-6 বলছে এই line-গুলো <code>#<\/code> দিয়ে comment-out করা, তাই shell এগুলোকে সম্পূর্ণ ignore করে — runtime-এ এদের কোনো প্রভাব নেই। Line 7 বলছে এগুলো Docker (container-এ program চালানোর tool) দিয়ে translator চালানোর নোট। Robotics deployment-এ transport পরিবর্তন (USB wire বনাম WiFi) খুব সাধারণ, তাই কাজ করা command মুছে না ফেলে comment করে রাখা হয় — পরে দরকার হলে শুধু <code>#<\/code> সরিয়ে সরাসরি ব্যবহার করা যায়। নিচের তিনটি বিকল্প (line 10, 14 ও 18-19) এভাবেই সংরক্ষিত।<\/p>"},{"a":9,"b":11,"text":"<p>Line 9-এর <code># WIFI<\/code> label-টি পরের disabled command-টির transport নির্দেশ করে। Line 10-এর commented-out command-টি হলো Docker দিয়ে agent চালানোর WiFi বিকল্প: <code>docker run<\/code> একটি নতুন container তৈরি ও চালু করে, image হলো <code>microros/micro-ros-agent:humble<\/code> (Docker Hub-এর official micro-ROS agent image, এই project-এর ROS 2 Humble-এর সাথে মিলিয়ে)। Flag-গুলোর মানে: <code>-it<\/code> interactive terminal দেয় যাতে log দেখা ও <code>Ctrl+C<\/code> করা যায়, <code>--rm<\/code> container বন্ধ হলে সেটিকে মুছে দেয়, <code>-v /dev:/dev -v /dev/shm:/dev/shm<\/code> host-এর device file-গুলো container-এর ভেতরে mount করে, <code>--privileged<\/code> hardware access-এর জন্য বাড়তি permission দেয়, আর <code>--net=host<\/code> container-কে host-এর নিজস্ব network stack ব্যবহার করতে দেয় যাতে DDS discovery কাজ করে। শেষে <code>udp4 --port 8090 -v4<\/code> মানে agent WiFi/UDP দিয়ে port 8090-এ client-এর অপেক্ষা করবে — arm-এর MCU-side micro-ROS client যদি wireless হতো তাহলে এটাই কাজে লাগত। Line 11-এর comment সংক্ষেপে এটাই বলে। বর্তমান setup-এ arm আসলে USB serial-এ যুক্ত, তাই এই line disabled থেকে গেছে।<\/p>"},{"a":13,"b":15,"text":"<p>Line 13-এর <code># serial<\/code> label-এর পরে line 14-এ আরেকটি disabled Docker বিকল্প, কিন্তু এবার image-টি Docker Hub থেকে নয় — <code>192.168.2.51:5000/micro-ros-agent:humble<\/code> মানে image-টি টানা হবে টিমের নিজস্ব <b>private Docker registry<\/b> থেকে, যেটি LAN-এর 192.168.2.51 ঠিকানার 5000 port-এ চলে। Lab environment-এ ধীর internet বা নিজস্বভাবে build করা image-এর ক্ষেত্রে এটি প্রচলিত পদ্ধতি। Transport অংশটি তবে active line 28-এর সাথে হুবহু এক: <code>serial --dev /dev/myserial -b 2000000<\/code>। মনে রাখতে হবে এই registry ঠিকানাটি এই নির্দিষ্ট network ও machine-এর জন্য — অন্য কোথাও এই command চালালে registry খুঁজে পাওয়া যাবে না। Line 15-এর comment এটিকে serial (USB) wire দিয়ে চালানোর বিকল্প বলে চিহ্নিত করে।<\/p>"},{"a":17,"b":21,"text":"<p>Line 17-এর <code># serial<\/code> label-এর পর line 18-19-এ তৃতীয় বিকল্প: আগে থেকে তৈরি একটি container তার ID দিয়ে চালু/বন্ধ করা। <code>docker run<\/code> প্রতিবার নতুন container বানায়, কিন্তু <code>docker start -i 7026de7b7d9b<\/code> আগে বানানো container-টিকেই তার 12-অঙ্কের hex ID দিয়ে আবার চালু করে (<code>-i<\/code> মানে interactive mode-এ attach করা), আর <code>docker stop 7026de7b7d9b<\/code> সেটিকে বন্ধ করে — প্রথমে বন্ধ হওয়ার সুযোগ দিয়ে (SIGTERM), না থামলে জোর করে শেষ করে (SIGKILL)। পুরনো container পুনরায় ব্যবহার করা দ্রুত ও তার আগের configuration বজায় রাখে। Line 20-এর comment ব্যাখ্যা করে এগুলো নির্দিষ্ট ID-র container start/stop করার নোট, আর line 21-এর <code># ---<\/code> দিয়ে পুরো options ledger block শেষ হয়। এই container ID-ও এই Jetson-এ তৈরি — অন্য machine-এ অর্থহীন।<\/p>"},{"a":24,"b":26,"text":"<p>এই script-এর প্রথম সক্রিয় command: <code>sleep 5<\/code> — ঠিক 5 সেকেন্ডের জন্য script-টিকে থামিয়ে রাখে। কারণ robot power-on হওয়ার সাথে সাথেই Linux kernel USB device-টিকে <i>enumerate<\/i> করে এবং এরপর <code>/dev/myserial<\/code> alias তৈরি হয় — এই পুরো ধারায় কয়েক সেকেন্ড লাগতে পারে। Line 25-26-এর comment বলছে ঠিক এটাই: hardware-কে জেগে উঠতে সময় দেওয়া। যদি এই অপেক্ষা না থাকত এবং agent device তৈরি হওয়ার আগেই চালু হতো, তাহলে serial port open করতে না পেয়ে fail করত। 5 সেকেন্ড কোনো derived সংখ্যা নয় — এটি অভিজ্ঞতালব্ধ (empirical) একটি safety margin। এরপরের মূল command এই 5 সেকেন্ড পার হলেই চালু হয়।<\/p>"},{"a":28,"b":28,"text":"<p>এই একটি line-ই পুরো script-এর মূল কাজ — line 29-এর comment-এর ভাষায় the main event। এটি চারটি ধাপের একটি chain একটি নতুন terminal window-তে চালায়: environment variable <code>ROS_DOMAIN_ID=30<\/code> সেট করা, ROS 2 Humble-এর main setup source করা, Jetson-এ build করা micro-ROS agent workspace-এর overlay source করা, এবং সবশেষে <code>ros2 run<\/code> দিয়ে agent-কে serial transport-এ চালু করা। প্রতিটি ধাপ <code>&amp;&amp;<\/code> দিয়ে যুক্ত, তাই একটি ব্যর্থ হলে পরেরটি আর চলে না। ফলাফল: Jetson-এর desktop-এ <code>mircoROS_Agent<\/code> শিরোনামের একটি window-তে micro-ROS agent চালু হয়ে <code>/dev/myserial<\/code>-এর ওপর দিয়ে 6-DOF arm-এর সাথে কথা বলা শুরু করে — এটিই সেই translator bridge, যা ছাড়া <code>/arm6_joints<\/code>-এর মতো command arm পর্যন্ত পৌঁছায় না। ঠিক পরের comment block (line 29 থেকে 54) এই line-টিকেই টুকরো টুকরো করে ব্যাখ্যা করে — নিচে আমরা অংশ ধরে অংশ ধরে দেখব।<\/p>"},{"a":29,"b":32,"text":"<p>Line 29-30-এর comment বলছে এটাই main event এবং quote-এর ভেতরের অংশগুলো ভেঙে দেখানো হবে; line 31-32 প্রথম অংশ। <code>gnome-terminal<\/code> হলো Jetson-এর desktop environment-এর terminal emulator, যা একটি নতুন window খোলে, আর <code>--title=mircoROS_Agent<\/code> সেই window-টির শিরোনাম ঠিক করে দেয় যাতে একাধিক terminal খোলা থাকলেও agent-টিকে চেনা যায়। খেয়াল করুন বানানটি <code>mircoROS_Agent<\/code> — <code>micro<\/code> নয়, <code>mirco<\/code>; এটি এই project-এর নিজস্ব spelling quirk (workspace path <code>/home/jetson/mircoROS_agent<\/code>-এও একই), তাই verbatim রাখা হয়েছে। এটি শুধু window-এর label — functionality-র ওপর কোনো প্রভাব নেই, কারণ আসল ROS package-এর নাম line 28-এ সঠিক বানানেই <code>micro_ros_agent<\/code>। শেষের <code>--<\/code> চিহ্নটি gnome-terminal-এর নিজের option তালিকার শেষ নির্দেশ করে; এর পরের পুরো অংশ window-টিতে চালানোর command হিসেবে বিবেচিত হয়। উল্লেখ্য, line 29 থেকে 54-এর এই breakdown block-টির ভেতরে খালি <code>#<\/code> line-গুলো (30, 33, 36, 39, 42, 45, 48) শুধু দল-ভাগ করার separator — shell এদেরও comment হিসেবেই ignore করে।<\/p>"},{"a":33,"b":35,"text":"<p>নতুন খোলা terminal window সাধারণত একটি interactive shell চালু করে ব্যবহারকারীর command-এর অপেক্ষা করে; কিন্তু <code>bash -c<\/code> দিয়ে shell-কে বলা হচ্ছে — double quote-এর ভেতরের পুরো string-টিকে একটি single command sequence হিসেবে এক্ষুনি execute করো। ফলে quote-এর ভেতরের <code>export<\/code>, <code>source<\/code> ও <code>ros2 run<\/code> সব একটি নতুন (non-interactive) bash process-এর ভেতরে পরপর চলে। এখানে দুটি গুরুত্বপূর্ণ পরিণতি: প্রথমত, ভেতরের <code>&amp;&amp;<\/code> chain-টিকে এই inner bash-ই একটি argument হিসেবে পেয়ে parse করে; দ্বিতীয়ত, chain শেষ হয়ে গেলে (বা agent বন্ধ হলে) shell exit করে, তখন window-টিও বন্ধ হয়ে যায় — অর্থাৎ window-টি ততক্ষণই বেঁচে থাকে যতক্ষণ agent চলে।<\/p>"},{"a":36,"b":38,"text":"<p>Chain-এর প্রথম command: <code>export ROS_DOMAIN_ID=30<\/code>। ROS 2-র কথোপকথন চলে DDS নামের middleware দিয়ে, আর <code>ROS_DOMAIN_ID<\/code> হলো সেই <b>isolation domain<\/b>-এর নম্বর — line 38-এর comment-এর walkie-talkie channel-এর উপমা একদম সঠিক: একই network-এ থেকেও ভিন্ন domain number-এর দুটি program একে অপরকে কখনো দেখতে পায় না, কারণ DDS-এর discovery message-গুলো domain অনুযায়ী আলাদা হয়। <code>export<\/code> keyword-টি variable-কে shell-এর environment-এর অংশ বানায়, ফলে এই shell থেকে চালু হওয়া <code>ros2<\/code> process এবং agent-এর সব ROS communication domain 30-এ হবে। এই project-এর বাকি সব node — <code>kin_srv<\/code>, <code>arm_offset<\/code>, RViz — একই domain 30-এ থাকতে হবে; একটিও ভিন্ন হলে সবকিছু চলছে মনে হবে কিন্তু কেউ কারো topic পাবে না — এটি ROS 2-র সবচেয়ে বিভ্রান্তিকর silent failure-গুলোর একটি। বাইরের কোনো laptop থেকে Jetson-এর node দেখতে চাইলে সেটিকেও domain 30-এ রাখতে হবে।<\/p>"},{"a":39,"b":41,"text":"<p>Line 40-41-এর comment chain-এর যোগচিহ্ন <code>&amp;&amp;<\/code>-কে AND THEN হিসেবে ব্যাখ্যা করে — টেকনিক্যালি এটি bash-এর <b>AND-list<\/b>: বাম পাশের command আগে চলে, শুধুমাত্র তার <i>exit status<\/i> শূন্য (success) হলে ডান পাশের command চলে। এখানে চারটি command এভাবে শৃঙ্খলবদ্ধ: <code>export<\/code> সফল হলে প্রথম <code>source<\/code>, সেটি সফল হলে দ্বিতীয় <code>source<\/code>, তারপরই <code>ros2 run<\/code>। এর সুবিধা: কোনো setup file না পাওয়া গেলে বা <code>source<\/code> fail করলে agent আদৌ চালু হয় না — অর্ধেক তৈরি environment-এ agent চালু হয়ে অদ্ভুত আচরণ করার সুযোগই থাকে না। বিপরীতে semicolon (<code>;<\/code>) দিয়ে যুক্ত করলে সব command অবস্থা নির্বিশেষে চলত।<\/p>"},{"a":42,"b":44,"text":"<p>Chain-এর দ্বিতীয় command: <code>source /opt/ros/humble/setup.bash<\/code> — line 44-এর comment একে main ROS 2 toolbox বলেছে। <code>source<\/code> একটি script-কে বর্তমান shell-এর ভেতরেই চালায় (নতুন child process-এ নয়), ফলে সেই script-এর ভেতরে <code>export<\/code> করা সব variable বর্তমান shell-এ স্থায়ী হয়ে যায়। ROS 2 Humble-এর installation থেকে তৈরি এই setup file-টি <code>PATH<\/code>, <code>PYTHONPATH<\/code>, <code>LD_LIBRARY_PATH<\/code>, <code>AMENT_PREFIX_PATH<\/code> ইত্যাদি environment variable-এ ROS-এর path-গুলো যোগ করে। এটি না করলে <code>ros2<\/code> command-টিই shell খুঁজে পেত না, ROS message library-গুলোও load হতো না। যেহেতু নতুন gnome-terminal fresh environment নিয়ে শুরু হয়, তাই <code>bash -c<\/code>-এর ভেতরে এই sourcing বাধ্যতামূলক। ROS 2-র ভাষায় এটি <b>underlay<\/b> — সব ROS 2 installation-এর ভিত্তি-স্তর।<\/p>"},{"a":45,"b":47,"text":"<p>Chain-এর তৃতীয় command: <code>source /home/jetson/mircoROS_agent/install/setup.bash<\/code>। এটি Jetson-এ colcon দিয়ে build করা একটি workspace-এর generated hook file, যা ওই workspace-এর <code>install/<\/code> ফোল্ডারের package-গুলোকে আগে source করা underlay-এর ওপরে <b>overlay<\/b> হিসেবে যোগ করে। এখানে এর কাজ হলো <code>micro_ros_agent<\/code> package-টিকে পরের ধাপের <code>ros2 run<\/code> command-এর জন্য খুঁজে পাওয়া যায় এমন করা। Sourcing-এর ক্রম গুরুত্বপূর্ণ: underlay আগে, overlay পরে — কারণ overlay-এর setup script underlay-কে প্রস্তুত অবস্থায় আশা করে; ক্রম উল্টালে <code>ros2 run<\/code> package-টি না-ও খুঁজে পেত। Path-এর বানানে আবার সেই পরিচিত quirk — <code>mircoROS_agent<\/code> — verbatim রাখা হয়েছে; আর অন্য কোনো machine-এ চালাতে হলে এই path-টি সেখানকার workspace-এর প্রকৃত অবস্থান অনুযায়ী বদলাতে হবে।<\/p>"},{"a":48,"b":54,"text":"<p>Chain-এর শেষ ও আসল command, যা line 49-54-এর comment ব্যাখ্যা করে: <code>ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/myserial -b 2000000<\/code>। <code>ros2 run<\/code>-এর প্রথম argument package-এর নাম, দ্বিতীয়টি executable-এর নাম — এখানে কাকতালীয়ভাবে দুটোই <code>micro_ros_agent<\/code>। Argument <code>serial<\/code> বলছে transport হবে USB serial wire (line 51-এর comment-এও তাই), WiFi নয়। এই agent-টিই source-এর ভাষায় <b>translator<\/b>: arm-এর MCU-তে চলা micro-ROS client serial line-এ সংক্ষিপ্ত wire protocol (DDS-XRCE) ব্যবহার করে, আর agent সেটিকে পূর্ণ ROS 2 graph-এর topic/service-তে রূপান্তর করে — ফলে <code>/arm6_joints<\/code>-এ publish করা command 6-DOF arm পর্যন্ত পৌঁছায়। <code>--dev /dev/myserial<\/code> (line 52) arm-এর USB port চিহ্নিত করে — এটি <code>/dev/ttyUSB0<\/code>-এর মতো ভঙ্গুর kernel নামের বদলে একটি স্থায়ী alias, সাধারণত udev rule দিয়ে তৈরি, যাতে replug বা reboot করলেও নাম বদলায় না। <code>-b 2000000<\/code> (line 53) baud rate সেট করে — প্রতি সেকেন্ডে 2,000,000 bit; comment-টিও বলছে bits per second, যা সঠিক। দুই প্রান্তের (MCU firmware ও agent) baud এক না হলে byte পুরোপুরি নষ্ট হয়ে যায় — হিসাবটি Math অংশে দেওয়া হলো। Line 54-এর comment ঠিকই বলে: joint data দ্রুত ও প্রচুর পাঠাতে হয় বলেই এত দ্রুত link দরকার।<\/p>"}],"math":{"intro":"<p>Line 28-এর <code>-b 2000000<\/code> মানে serial link-টি প্রতি সেকেন্ডে 2,000,000 bit বহন করতে পারে। কিন্তু আসল প্রশ্ন হলো — সেটা byte-এ কত? উত্তরটি লুকিয়ে আছে UART ফ্রেমিং-এর গঠনে।<\/p>","levels":[{"label":"Level 1 — baud মানে bit-rate","latex":"\\[ B = 2{,}000{,}000 \\ \\text{bit/s} \\]","text":"<code>-b 2000000<\/code> flag-টি agent-কে এই হার জানায়; সূত্রের <code>B<\/code> হলো ওই সংখ্যা। এই link-এ একটি baud বহন করে একটি bit, তাই baud rate আর bit rate একই জিনিস।"},{"label":"Level 2 — 8N1 ফ্রেমে প্রতি byte-এ 10 bit","latex":"\\[ N_{\\text{frame}} = 1 + 8 + 0 + 1 = 10 \\ \\text{bit} \\]","text":"UART 8N1 মানে 8টি data bit, No parity bit, 1টি stop bit — আর প্রতিটি byte-এর আগে থাকে 1টি start bit। যোগ করলে একটি byte পাঠাতে wire-এ দিতে হয় ঠিক 10 bit।"},{"label":"Level 3 — byte throughput","latex":"\\[ R = \\frac{B}{N_{\\text{frame}}} = \\frac{2{,}000{,}000 \\ \\text{bit/s}}{10 \\ \\text{bit/byte}} = 200{,}000 \\ \\text{byte/s} \\]","text":"মোট bit-কে প্রতি byte-এর bit দিয়ে ভাগ করলেই পাওয়া যায় এই link-এর তাত্ত্বিক সর্বোচ্চ গতি — প্রতি সেকেন্ডে 200,000 byte। এটিই সব XRCE message, joint command ও telemetry-এর জন্য উপরের সিলিং।"},{"label":"Level 4 — bit time ও byte time","latex":"\\[ T_{\\text{bit}} = \\frac{1}{B} = 0.5\\ \\mu\\text{s}, \\qquad T_{\\text{byte}} = 10 \\cdot T_{\\text{bit}} = 5\\ \\mu\\text{s} \\]","text":"একটি একক bit wire-এ ঠিক 0.5 microsecond জায়গা নেয়, আর একটি সম্পূর্ণ byte frame নেয় 5 microsecond — receiver-কে ঠিক এই rhythm-এ bit-গুলো sample করতে হয়, নইলে data এলোমেলো হয়ে যায়।"},{"label":"Level 5 — framing efficiency","latex":"\\[ \\eta = \\frac{8}{10} = 80\\% \\]","text":"10 bit-এর মধ্যে মাত্র 8 bit-ই আসল data — বাকি 20% হলো start/stop bit-এর framing overhead। এই কারণেই কার্যকর গতি 250,000 নয়, বরং 200,000 byte/s।"}],"numeric":[{"latex":"\\[ R = \\frac{2{,}000{,}000}{10} = 200{,}000 \\ \\text{byte/s} \\approx \\frac{200{,}000}{1024} \\approx 195.3 \\ \\text{KiB/s} \\]","text":"হিসাব: প্রতি সেকেন্ডে 2,000,000 bit, প্রতি 10 bit-এ 1 byte, তাই 2,000,000 ÷ 10 = 200,000 byte/s; 1024 দিয়ে ভাগ করলে প্রায় 195.3 KiB/s।"},{"latex":"\\[ T_{\\text{bit}} = \\frac{1}{2{,}000{,}000}\\ \\text{s} = 0.0000005\\ \\text{s} = 0.5\\ \\mu\\text{s} \\]","text":"প্রতি bit-এর সময়: 1 ÷ 2,000,000 সেকেন্ড = 5 &times; 10<sup>-7<\/sup> সেকেন্ড = 0.5 microsecond; একটি সম্পূর্ণ byte (10 bit) তাই ঠিক 5 microsecond নেয়।"}],"mapping":[{"code":"-b 2000000","math":"\\( B \\)","text":"command-line flag-টি সরাসরি সূত্রের <code>B<\/code> — agent এই মান দিয়েই serial port-এর clock configure করে।"},{"code":"serial transport (8N1 framing)","math":"\\( N_{\\text{frame}} = 10 \\)","text":"file-এ 8N1 কথাটি লেখা নেই — এটি এই project-এর serial link যে standard UART framing ব্যবহার করে সেই ধারণা; এই 10-ই throughput সূত্রের হর (denominator)।"},{"code":"--dev /dev/myserial","math":"channel with capacity \\( R \\)","text":"device-টি হলো সেই ভৌত channel যার capacity উপরের <code>R<\/code>; সব joint command ও response এই সীমার ভেতরে দিয়েই যেতে হয়।"}],"failure":["MCU firmware যদি ভিন্ন baud (যেমন 115200) এ থাকে, receiver প্রতিটি byte-এর bit-গুলো ভুল সময়ে sample করবে — byte-গুলো garbage হয়ে যাবে, DDS-XRCE handshake কখনো সফল হবে না, ফলে agent চালু থেকেও arm-এর কোনো topic বা response পাওয়া যাবে না।","হিসাবে 8N1-এর বদলে প্রতি byte-এ 8 bit ধরলে bandwidth পাওয়া যাবে 250,000 byte/s — অর্থাৎ আসল ceiling-এর চেয়ে 25% বেশি প্রত্যাশা করা হবে এবং latency budget ভুল হয়ে যাবে; সঠিক মান 200,000 byte/s।","Baud ঠিক থাকলেও <code>ROS_DOMAIN_ID<\/code> ভুল হলে (যেমন default 0 থেকে গেলে) সব node নিজে নিজেই চলবে কিন্তু কেউ কাউকে discover করবে না — কোনো error message ছাড়াই নীরব বিপর্যয়।","<code>sleep 5<\/code> বাদ দিলে USB device enumerate হওয়ার আগেই agent চালু হয়ে <code>/dev/myserial<\/code> open করতে ব্যর্থ হতে পারে — <code>&amp;&amp;<\/code> chain সেখানেই থেমে যাবে, bridge আর তৈরি হবে না।"]},"robot":{"correct":"Robot power-on-এর পরে script-টি 5 সেকেন্ড অপেক্ষা করে, তারপর Jetson-এর desktop-এ <code>mircoROS_Agent<\/code> শিরোনামের নতুন terminal window-তে domain 30 সেট করে underlay ও overlay source করে, শেষে <code>/dev/myserial<\/code> দিয়ে 2,000,000 baud-এ micro-ROS agent চালু করে। Arm-এর MCU-side micro-ROS client serial line-এ নিজের session স্থাপন করে এবং arm-এর topics/services ROS 2 graph-এ দৃশ্যমান হয় — এরপর camera launch, <code>kin_srv<\/code> ও <code>arm_offset<\/code> calibration node অবাধে arm-কে command দিতে পারে, আর 200,000 byte/s-এর link যথেষ্ট মাথার জায়গা রাখে।","incorrect":"Baud না মিললে বা <code>sleep 5<\/code> ছাড়া device তৈরি হওয়ার আগেই চালু হলে agent serial port open করতে ব্যর্থ হয়ে বসে থাকে — <code>/arm6_joints<\/code> publish করলেও arm নড়ে না, calibration ও grasp পাইপলাইন পুরো বন্ধ। <code>ROS_DOMAIN_ID<\/code> ভুল হলে agent নিজে ঠিকই চলবে কিন্তু <code>kin_srv<\/code>/<code>arm_offset<\/code> তাকে দেখবেই না — কোনো error ছাড়াই সব নীরব। আর agent-এর নিজের terminal window-টি হঠাৎ বন্ধ করে ফেললে bridge মারা যায়: arm graph থেকে হারিয়ে যায়, grasp-এর মাঝপথে হলে arm শেষ পাঠানো command-অনুযায়ী আটকে থাকতে পারে।"},"id":"part-04","start":1,"end":54,"lang":"bash","animType":"microRosBridge","flags":[]},{"n":5,"fname":"camera_arm_kin.launch.py","enTitle":"ROS 2 Launch Orchestration","explain":[{"a":1,"b":8,"text":"Launch file-এর import-গুলো (প্রতিটির পাশের ইংরেজি মন্তব্য source-এর নিজস্ব): <code>LaunchDescription<\/code> হলো সেই container যার ভেতরে কোন কোন program চালু হবে তার list থাকে; <code>Node<\/code> দিয়ে একটি মাত্র ROS 2 program start করা যায়; <code>os<\/code> file path জোড়া লাগাতে সাহায্য করে; <code>IncludeLaunchDescription<\/code> দিয়ে <b>অন্য একটা launch file-কে<\/b> এই launch-এর ভেতরে চালানো যায়; <code>PythonLaunchDescriptionSource<\/code> জানিয়ে দেয় সেই launch file-টি Python-এ লেখা; আর <code>get_package_share_directory<\/code> হলো ROS 2-র path-resolver — install করা package-এর share folder খুঁজে দেয়।"},{"a":10,"b":12,"text":"<code>generate_launch_description()<\/code> — এই নামটি ঠিক এভাবেই থাকতে হবে, এটা ROS 2-র চুক্তি (contract)। Terminal-এ <code>ros2 launch M3Pro_demo camera_arm_kin.launch.py<\/code> লিখলে ROS 2 নিজে থেকেই এই function-কে ডেকে জানতে চায়: “কী কী চালাতে হবে?” Function-টি parameter নেয় না আর একটি <code>LaunchDescription<\/code> ফেরত দেয়।"},{"a":14,"b":18,"text":"প্রথম program: camera। Camera-র পুরো setup নিজে লেখার বদলে এখানে shortcut নেওয়া হয়েছে — আগে থেকে থাকা একটা launch file reuse করা হচ্ছে <code>IncludeLaunchDescription<\/code> দিয়ে।"},{"a":19,"b":23,"text":"Path বানানোর ধাপ: <code>get_package_share_directory('orbbec_camera')<\/code> orbbec_camera package কোথায় install হয়েছে সেই folder দেয় → <code>os.path.join(..., 'launch')<\/code> তার ভেতরের launch folder-এ যায় → শেষে string-এর সাথে <code>'/dabai_dcw2.launch.py'<\/code> যোগ হয়। খেয়াল করো slash-টি path-এর শুরুতেই জোড়া লাগানো — ফলে পুরো path হয় <i>&lt;share&gt;/launch/dabai_dcw2.launch.py<\/i>। এই include চালু করলে Orbbec DaBai DCW2 camera-র driver উঠে আসে আর <code>/camera/color/image_raw<\/code>, <code>/camera/depth/image_raw<\/code> topic-দুটি publish হতে শুরু করে।"},{"a":24,"b":24,"text":"Source-এর নিজস্ব মন্তব্য: “dabai” সম্ভবত camera-র model নাম — এই file-টি চালু হলেই robot “দেখতে” পারে।"},{"a":27,"b":34,"text":"দ্বিতীয় program: একটি একক <code>Node<\/code>। <code>package='arm_kin'<\/code> — kinematics মানে arm-এর গতির গণিত; <code>executable='kin_srv'<\/code> — সেই package-এর ভেতরের প্রোগ্রামের নাম (srv মানে service); <code>name='kin_ik_fk'<\/code> — চালু হওয়ার পর এই node-এর ডাকনাম। এই ডাকনামটাই গুরুত্বপূর্ণ: arm_offset.py পরে <code>get_kinemarics<\/code> service-কে খুঁজবে, আর সেই service এই <code>kin_ik_fk<\/code> node-ই provide করে। <b>ik<\/b> = Inverse Kinematics (জানা অবস্থান থেকে joint angle বের করা), <b>fk<\/b> = Forward Kinematics (জানা joint angle থেকে claw-এর অবস্থান বের করা)।"},{"a":37,"b":40,"text":"শেষে সব action-এর list-টি <code>LaunchDescription([camera_driver_launch, kin_node])<\/code> হিসেবে ফেরত দেওয়া হয় — এটাই “director-এর clapboard”: [camera চালু করো, math brain চালু করো]। ros2 launch এই list পেয়ে দুটোকেই একসাথে চালু করে; কেউ ক্র্যাশ করলে বাকিদের আচরণ launch system নিয়ন্ত্রণ করে। লক্ষ্য করো এই file-এ arm_offset node <b>নেই<\/b> — calibration node আলাদাভাবে <code>ros2 run<\/code> দিয়ে চালাতে হয় (README-র ধাপ ৫)।"}],"math":null,"robot":{"correct":"Jetson-এ এই launch চালু হলে প্রথমে Orbbec DaBai DCW2 camera driver উঠবে (color+depth stream শুরু), তারপর <code>kin_ik_fk<\/code> node উঠে <code>get_kinemarics<\/code> service অফার করবে — এরপরই arm_offset.py-র <code>wait_for_service<\/code> loop আটকে থাকা অবস্থা থেকে মুক্তি পেয়ে calibration শুরু করতে পারবে।","incorrect":"orbbec_camera package install না থাকলে বা share folder-এ dabai_dcw2.launch.py না পাওয়া গেলে launch সাথে সাথেই fail করবে; আর arm_kin/kin_srv না উঠলে camera চালু হয়েও arm_offset চিরকাল <i>Service not available, waiting again...<\/i> লুপে আটকে থাকবে — kinemarics math brain ছাড়া node-এর সামনে এগোনোর পথ নেই।"},"id":"part-05","start":1,"end":40,"lang":"python","animType":"launchGraph","flags":[]},{"n":6,"fname":"arm_offset.py","enTitle":"Imports & ROS Ecosystem","explain":[{"a":1,"b":2,"text":"<code>#!/usr/bin/env python3<\/code> — shebang: terminal থেকে সরাসরি <code>./arm_offset.py<\/code> চালালে Linux কোন interpreter ব্যবহার করবে তা এটি জানিয়ে দেয়। <code># -*- coding: utf-8 -*-<\/code> — এই file-এ Bangla/special character থাকলেও Python ফাইলটিকে UTF-8 হিসেবে পড়বে (Python 3-এ এটি এখন ডিফল্ট, তবু tradition হিসেবে রাখা হয়েছে)।"},{"a":4,"b":9,"text":"<code># --- IMPORTING TOOLS ---<\/code> মন্তব্যের নিচে মূল import-গুলো: <code>cv2<\/code> — OpenCV, computer vision-এর মূল লাইব্রেরি (ছবি পড়া, resize, রং conversion); <code>os<\/code> — folder/path নিয়ে কাজ; <code>numpy as np<\/code> — matrix-array গণিত, পরে pixel-এর 3D point বের করতে এটিই লাগবে; <code>from sensor_msgs.msg import Image<\/code> — ROS 2-র camera-ছবি message-এর ধরন; <code>message_filters<\/code> — দুটি stream (color + depth) <b>একই মুহূর্তের<\/b> frame জোড়া লাগানোর tool।"},{"a":10,"b":14,"text":"Robot-নির্দিষ্ট import: <code>from M3Pro_demo.vutils import draw_tags<\/code> — tag-এর চারপাশে বাক্স আঁকার নিজস্ব tool; <code>from M3Pro_demo.compute_joint5 import *<\/code> — arm-এর ৫নং joint-এর গণিত (এই file-এর বাইরের package); <code>from dt_apriltags import Detector<\/code> — AprilTag শনাক্তকরণের আসল engine; <code>from cv_bridge import CvBridge<\/code> — ROS image message-কে OpenCV ছবিতে অনুবাদক; <code>import cv2 as cv<\/code> — খেয়াল করো, <b>ওই একই OpenCV আবার <code>cv<\/code> নামে import হয়েছে<\/b>! এজন্যই পরের code-এ কোথাও <code>cv2.resize<\/code>, কোথাও <code>cv.resize<\/code> — দুটোই একই লাইব্রেরি। Harmless, কিন্তু একটাই নাম রাখলে code পড়া সহজ হতো।"},{"a":15,"b":19,"text":"ROS message/service-এর ধরনগুলো: <code>ArmKinemarics<\/code> (source-তে বানানটি এরকমই — Kinematics নয়) হলো <b>service<\/b>-এর ধরন যা দিয়ে arm-এর math-brain-কে জিজ্ঞেস করা হয়; <code>AprilTagInfo, CurJoints<\/code> — এই robot-এর custom message; <code>ArmJoints<\/code> — ৬টি joint-এর অবস্থা; <code>Float32, Bool, Int16<\/code> std_msgs থেকে — এদের মধ্যে <code>Float32<\/code> পরে এই file-এ আর ব্যবহৃত হয়নি (import হয়ে অব্যবহৃত থেকে গেছে); শেষে <code>encoding = ['16UC1', '32FC1']<\/code> — depth ছবির দুটি সম্ভাব্য data-format: 16-bit unsigned (millimeter একক) এবং 32-bit float (meter একক)। পরে callback-এ <code>encoding[1]<\/code> অর্থাৎ <code>'32FC1'<\/code> ব্যবহার হবে।"},{"a":20,"b":24,"text":"গণিত ও utility: <code>time<\/code> — সময় মাপা; এই file-এ এর ব্যবহার দুই জায়গায় — <code>pr_time<\/code> তৈরিতে (line 60) আর callback-এর শেষে FPS ছাপাতে (line 260-262)। (সতর্ক পর্যবেক্ষণ: এখানকার PID-ভাবনা নিজে time module ব্যবহার করে না — ধাপ-পার্থক্য অন্যভাবে আসে); <code>transforms3d as tfs<\/code> — 3D transformation-এর উন্নত লাইব্রেরি (Euler ↔ quaternion); <code>tf_transformations as tf<\/code> — quaternion/rotation গণিতের আরেকটি সেট (দুটো লাইব্রেরিতে overlapping সুবিধা, দুটোই রাখা হয়েছে); <code>yaml<\/code> — config file পড়ার tool (পরের Part-এ offset file পড়তে); <code>math<\/code> — Python-এর মৌলিক গণিত (sin, cos, atan2...)।"},{"a":25,"b":30,"text":"শেষ দফা: <code>from M3Pro_demo.Robot_Move import *<\/code> — arm-এর চলাচলের নিজস্ব tool-set; <code>from rclpy.node import Node<\/code> — ROS 2 Node-এর blueprint (class বানাতে লাগবে); <code>import rclpy<\/code> — ROS 2 Python client নিজে; <code>from message_filters import Subscriber, TimeSynchronizer, ApproximateTimeSynchronizer<\/code> — line 9-এর <code>import message_filters<\/code>-এর সাথে overlap, এখানে নাম ধরে ধরে আনা হয়েছে — এর মধ্যে <code>TimeSynchronizer<\/code> পরে ব্যবহৃত হয়নি (exact-match sync ছেড়ে <code>ApproximateTimeSynchronizer<\/code> নেওয়া হয়েছে); তারপর <code>from sensor_msgs.msg import Image<\/code> — <b>আবারও!<\/b> Line 8-এ এটি এসেছিল — দ্বিতীয়বার import ক্ষতি করে না, Python চুপচাপ ignore করে, কিন্তু এটি এই file-এর আরেকটি redundant লাইন। শেষে <code>Twist<\/code> — robot base-এর চাকা নড়ানোর message ধরন; এটি পরে এই node-ই ব্যবহার করবে — line 93-এ <code>cmd_vel<\/code> publisher আর line 172-এ <code>vel = Twist()<\/code> তৈরি করে base-কে গতি দেওয়ার জন্য।"}],"math":null,"robot":{"correct":"এই অংশের ২৯টি খালি-নয় লাইন চালু হলে Jetson-এ Python সব লাইব্রেরি মেমরিতে তুলবে — camera vision (cv2), tag detector (dt_apriltags), ROS 2 communication (rclpy), arm math (tfs, tf) সব প্রস্তুত। Robot নিজে এখনও নড়ে না; এটি শুধু stage-setter — পরের Part-গুলোতে এসব tool দিয়েই দেখা, হিসাব ও নড়াচড়া হবে।","incorrect":"যেকোনো একটি package পাওয়া না গেলে (যেমন <code>dt_apriltags<\/code> বা <code>M3Pro_demo<\/code> install না থাকলে) script শুরু হওয়ামাত্র <i>ModuleNotFoundError<\/i> দিয়ে মারা যাবে — robot একটুও নড়বে না, camera-ও আসবে না। আর ভুল environment (ROS 2 sourcing ছাড়া) থেকে চালালে <code>rclpy<\/code>/message import-গুলোই খুঁজে পাওয়া যাবে না।"},"id":"part-06","start":1,"end":31,"lang":"python","animType":null,"flags":[]},{"n":7,"fname":"arm_offset.py","enTitle":"Loading the Offset YAML","explain":[{"a":33,"b":35,"text":"এবার calibration-এর আসল উদ্দেশ্য: offset file পড়া। মন্তব্য বলছে — এই settings file-এ camera-র গণিতের ছোট ছোট ভুল ঠিক করার tweak (offset) থাকে। <code>offset_file<\/code> হলো <b>hardcoded absolute path<\/b>: <code>/home/jetson/yahboomcar_ws/src/arm_kin/param/offset_value.yaml<\/code> — অর্থাৎ robot-এর <code>jetson<\/code> নামের user-এর home folder-এর ভেতরে yahboomcar_ws workspace-র arm_kin package-এর param folder-এ একটি YAML file। লক্ষণীয়: এই path এই script-এর নিজের folder-এর সাথে সম্পর্কিত নয়, মেশিনের উপর নির্ভরশীল — অন্য কম্পিউটারে চালালে path-টি বদলাতে হবে।"},{"a":36,"b":38,"text":"<code>with open(offset_file, 'r') as file:<\/code> — file-টি read-mode-এ খোলা হলো; <code>with<\/code> ব্যবহার করায় কাজ শেষে file নিজে থেকেই বন্ধ হয়ে যাবে। ভেতরে <code>offset_config = yaml.safe_load(file)<\/code> — YAML-এর ভেতরের সব key-value একটি Python dictionary-তে রূপান্তর (<code>safe_load<\/code> নিরাপদ সংস্করণ: YAML-এ লুকানো কোনো ক্ষতিকর কমান্ড execute করে না)। তারপর <code>print(offset_config)<\/code> — পুরো dictionary terminal-এ ছেপে দেখানো হচ্ছে, যাতে চালানোর সময় offset-গুলোর মান চোখে দেখা যায়।"},{"a":39,"b":39,"text":"<code>print(\"----------------------------\")<\/code> — terminal-এ একটা আলাদা করার রেখা; এর উপরে পুরো dictionary, নিচে আলাদা করে প্রতিটি offset-এর মান ছাপানো হবে।"},{"a":40,"b":42,"text":"তিনটি মান আলাদা করে ছাপা হলো: <code>offset_config.get('x_offset')<\/code>, <code>.get('y_offset')<\/code>, <code>.get('z_offset')<\/code> — <code>.get()<\/code> মেথডের সুবিধা: key-টি file-এ না থাকলেও error নয়, <code>None<\/code> ছাপাবে। এই তিনটিই হলো calibration-এর ফল: camera-র পরিমাপকে x/y/z অক্ষে কতটুকু ঠেলে দিলে বাস্তব arm-এর অবস্থানের সাথে মিলবে তার সংখ্যা। <b>এই লাইনগুলো নিজে শুধু ছাপায়<\/b> — কিন্তু <code>offset_config<\/code>-এর গল্প এখানেই শেষ নয়, বরং দুই দিকে গড়ায়: (১) পরে node-এর ভেতরে line 128-130-এ এই একই dictionary থেকে <code>self.x_offset<\/code>, <code>self.y_offset<\/code>, <code>self.z_offset<\/code> নেওয়া হয় (সৎ পর্যবেক্ষণ: এই তিনটি attribute-এর পরে আর কোথাও ব্যবহার দেখা যায় না), আর (২) সবচেয়ে গুরুত্বপূর্ণ — calibration শেষে SPACEBAR চাপলে line 251-255 নতুন হিসাব-করা offset-গুলো <b>এই একই file-এই<\/b> লিখে দেয় (<code>yaml.dump<\/code>)। অর্থাৎ এই YAML একদিকে calibration-এর <i>ইনপুট<\/i> (আগের দিনের মান), অন্যদিকে তার <i>আউটপুট<\/i> — প্রতিবার calibration চালালে নিজের মান নিজেই আপডেট করে সেরা হতে হতে যায়।"},{"a":44,"b":44,"text":"<code>print('init done')<\/code> — import আর file-পড়া সফলভাবে শেষ; terminal-এ এই বার্তা দেখলে বোঝা যাবে script-এর ভূমিকা অংশ ঠিকমতো চলেছে, এবার Node class শুরু হবে।"}],"math":null,"robot":{"correct":"Robot চালু হওয়ার শুরুতেই terminal-এ দেখা যাবে offset dictionary-টি, তার নিচে আলাদা করে <code>x_offset<\/code>, <code>y_offset<\/code>, <code>z_offset<\/code>-এর মান, একটা রেখা, আর শেষে <code>init done<\/code> — অর্থাৎ “সেটআপ ঠিক আছে, এবার camera-র জন্য প্রস্তুত”। পরে calibration শেষে SPACEBAR চাপলে এই file-এই নতুন offset লেখা হবে, ফলে পরের বার চালু হলে এই ছাপাগুলোই দেখাবে হাল-আপডেট মান।","incorrect":"File-টি সেই path-এ না থাকলে (নতুন মেশিন, ভুল user, বা ws-এর নাম বদলে গেলে) script শুরুতেই <i>FileNotFoundError<\/i> দিয়ে বন্ধ হয়ে যাবে — কোনো error-message বা recovery নেই, কারণ <code>open()<\/code>-কে কোনো try/except-এ মোড়া হয়নি। আর file-টি খালি বা ভুল ফরম্যাটের হলে <code>safe_load<\/code> <code>None<\/code> বা আধা-dictionary ফেরত দিতে পারে — তখন <code>.get()<\/code>-গুলো <code>None<\/code> ছাপাবে, যা দেখে বোঝা যাবে calibration data-ই নেই।"},"id":"part-07","start":33,"end":44,"lang":"python","animType":"yamlLoad","flags":[]},{"n":8,"fname":"arm_offset.py","enTitle":"Node Init & AprilTag Detector","explain":[{"a":46,"b":49,"text":"এবার মূল ক্লাস: <code>class AprilTagDetectNode(Node)<\/code> — ROS 2-এর <code>Node<\/code> blueprint থেকে নিজের node বানানো হলো; নাম বলে দিচ্ছে কাজ কী: AprilTag শনাক্ত করা। <code>def __init__(self, name):<\/code> — জন্মের সময় একটি নাম নেবে; <code>super().__init__(name)<\/code> — parent class <code>Node<\/code>-কে ডেকে সেই নামে ROS 2 system-এ নিবন্ধন করানো (এরপর <code>ros2 node list<\/code>-এ নামটি দেখা যাবে)।"},{"a":51,"b":52,"text":"<code>self.init_joints = [90, 90, 0, 0, 90, 90]<\/code> — ৬টি joint-এর “Home” অবস্থা, একক <b>degree<\/b>। ক্লাসিক ৬-DOF arm-এর base থেকে claw পর্যন্ত ক্রমে: base ঘোরা 90°, কাঁধ 90°, কনুই 0°, wrist roll 0°, wrist pitch 90°, gripper 90°। পরে arm-কে এই অবস্থায় ফেরত পাঠাতে এই list কাজে লাগবে।"},{"a":54,"b":56,"text":"দুটি আলাদা translator: <code>self.rgb_bridge = CvBridge()<\/code> রঙিন ছবির জন্য, <code>self.depth_bridge = CvBridge()<\/code> গভীরতার ছবির জন্য। কাজ একই (ROS message → OpenCV array), দুটি আলাদা object রাখা হয়েছে যাতে দুই stream-এর রূপান্তর একে অপরকে ব্যাঘাত না করে — যদিও <code>CvBridge<\/code> stateless হওয়ায় একটাই যথেষ্ট হতো; এটি style-বিষয়, ভুল নয়।"},{"a":58,"b":60,"text":"অবস্থা-ট্র্যাকিং দুটি: <code>self.pubPos_flag = False<\/code> — “এখনও claw দিয়ে ধরার কমান্ড পাঠানো হয়নি” মানে; একবার position publish করার পর এটি <code>True<\/code> হবে যাতে একই tag-এর জন্য বারবার grab-চেষ্টা না চলে (লক্ষ রাখো: পরের code-এ এটি আর <code>False<\/code>-এ ফেরানো হয়নি — একবার ধরার পরে node-এ আর নতুন grab আসে না)। <code>self.pr_time = time.time()<\/code> — এই মুহূর্তের সময়টি মনে রাখা; পরে callback-এর শেষে ঠিক এটি দিয়েই FPS ছাপানো হবে (line 260-262: পরের frame-এর সময়ের সাথে পার্থক্য নিয়ে ১/Δt)। একটি সৎ পর্যবেক্ষণ: এই file-এর PID-ভাবনা নিজে <code>pr_time<\/code> ব্যবহার করে না।"},{"a":62,"b":71,"text":"AprilTag engine-এর setup — <code>self.at_detector = Detector(...)<\/code>, প্রতিটি parameter: <code>searchpath=['apriltags']<\/code> — tag library খোঁজার path; <code>families='tag36h11'<\/code> — কোন “ভাষার” tag খুঁজবে (36h11 মানে 36-bit কোড, ন্যূনতম দূরত্ব 11 — সবচেয়ে জনপ্রিয় পরিবার); <code>nthreads=8<\/code> — ৮টি CPU thread একসাথে খুঁজবে (Jetson-এর মতো multi-core-এ জরুরি); <code>quad_decimate=2.0<\/code> — ছবি খুঁজার আগে ২ গুণ ছোট করে নেওয়া: গতি বাড়ে, খুঁটিনাটি কিছুটা কমে (speed-accuracy trade-off); <code>quad_sigma=0.0<\/code> — খোঁজার আগে কোনো blur নয়; <code>refine_edges=1<\/code> — পাওয়া tag-এর কোণগুলো আরেকবার সূক্ষ্ম করে ঠিক করা হবে; <code>decode_sharpening=0.25<\/code> — কোড পড়ার সময় ছবি কতটা sharpen করা হবে; <code>debug=0<\/code> — debug ছবি চাই না।"},{"a":73,"b":74,"text":"<code>self.Center_x_list = []<\/code> ও <code>self.Center_y_list = []<\/code> — নাম দেখে মনে হয় tag-কেন্দ্রের ইতিহাস জমা হবে (time-series বিশ্লেষণের জন্য), কিন্তু <b>এই file-এ কোথাও এদের ভেতরে কিছু যোগ বা পড়া হয়নি<\/b> — দুটি খালি list হয়ে বসে থাকে। সম্ভবত আগের সংস্করণের রেশ; ক্ষতি করে না, শুধু অব্যবহৃত।"},{"a":76,"b":77,"text":"<code>self.CurEndPos = [0.1279, 0.00023, 0.1674, 0.00036, 1.3962, 0.00033]<\/code> — arm-এর claw-এর <b>বর্তমান অনুমিত<\/b> অবস্থা: [x, y, z, roll, pitch, yaw] = [0.1279 m, 0.00023 m, 0.1674 m, 0.00036 rad, 1.3962 rad, 0.00033 rad]। লক্ষ করো প্রায়-শূন্য y ও roll/yaw — অর্থাৎ claw সোজা সামনে, কেবল নিচের দিকে ঝুঁকে (pitch 1.3962 rad ≈ 80.0°)। এটি hardcode করা শুরুর মান — পরে camera-র পরিমাপ এসে এটিকে আপডেট করবে।"},{"a":79,"b":80,"text":"<code>self.camera_info_K = [477.57, 0.0, 319.38, 0.0, 477.55, 238.64, 0.0, 0.0, 1.0]<\/code> — camera-র calibration matrix K-এর <b>flat (৯-সংখ্যার এক লাইনের)<\/b> রূপ: প্রথম দুই focal length (pixel এককে), তারপর principal point, শেষ সারি অক্ষত। মন্তব্য বলছে এগুলো “lens কীভাবে আলো বাঁকায়” তার সংখ্যা — Part 15-এ ঠিক এই মানগুলো দিয়ে pixel → meter হিসাব হবে। নিচের Math অংশে এই flat list-টি যে 3×3 matrix খাড়া করে, তা-ই দেখানো হলো।"}],"math":{"intro":"Line 80-এর ৯টি সংখ্যা এলোমেলো নয় — এটি camera-র <b>intrinsic matrix<\/b> K-এর flat সংস্করণ। Camera যখন কোনো point-এর ছবি তোলে, তখন 3D পৃথিবী থেকে 2D pixel-এ যে রূপান্তর ঘটায় তার সব গুপ্তসংখ্যা এই matrix-তেই লুকানো।","levels":[{"label":"Level 1 — Matrix-এর চেহারা","latex":"\\[K=\\begin{bmatrix}f_x&0&c_x\\\\[2pt]0&f_y&c_y\\\\[2pt]0&0&1\\end{bmatrix}\\]","text":"মাত্র তিনটি অর্থবান সংখ্যা: <code>f_x, f_y<\/code> — focal length (lens-এর ফোকাস-দূরত্ব, pixel এককে); আর <code>c_x, c_y<\/code> — principal point, অর্থাৎ ছবির ঠিক কোন pixel-এর উপর দিয়ে lens-এর মূল অক্ষ যায়। বাকি শূন্যগুলো বলছে: কোনো আঁকাবাঁকা (skew) নেই।"},{"label":"Level 2 — Flat list থেকে matrix","latex":"\\[K=\\begin{bmatrix}K[0]&K[1]&K[2]\\\\[2pt]K[3]&K[4]&K[5]\\\\[2pt]K[6]&K[7]&K[8]\\end{bmatrix}=\\begin{bmatrix}f_x&0&c_x\\\\[2pt]0&f_y&c_y\\\\[2pt]0&0&1\\end{bmatrix}\\]","text":"Python-এর flat list row-by-row পড়ে ৩×৩ হয়ে যায়: index 0,1,2 প্রথম সারি; 3,4,5 দ্বিতীয়; 6,7,8 তৃতীয়। অর্থাৎ <code>K[0]=f_x<\/code>, <code>K[2]=c_x<\/code>, <code>K[4]=f_y<\/code>, <code>K[5]=c_y<\/code>।"},{"label":"Level 3 — Camera কী করে (pinhole model)","latex":"\\[\\begin{bmatrix}u\\\\[2pt]v\\\\[2pt]1\\end{bmatrix}\\;\\propto\\;K\\,\\begin{bmatrix}X\\\\[2pt]Y\\\\[2pt]Z\\end{bmatrix}\\]","text":"বিপরীত দিক থেকে দেখলে বোঝা সহজ: 3D পৃথিবীর কোনো point (X,Y,Z) camera-র সামনে থাকলে তার ছবি পড়ে (u,v) pixel-এ। আমাদের code পরে ঠিক উল্টো পথ হাঁটবে — pixel + depth থেকে 3D point বের করবে (Part 15)। সেই হিসাবের সব উপাদান এই K-ই।"}],"numeric":[{"latex":"\\[K=\\begin{bmatrix}477.57&0&319.38\\\\[2pt]0&477.55&238.64\\\\[2pt]0&0&1\\end{bmatrix}\\]","text":"Code-এর মান বসালে: <code>f_x=477.57<\/code>, <code>f_y=477.55<\/code> (প্রায় সমান — lens কার্যত বর্গাকার pixel), <code>c_x=319.38<\/code>, <code>c_y=238.64<\/code>।"},{"latex":"\\[(c_x,\\,c_y)=(319.38,\\;238.64)\\;\\approx\\;\\left(\\tfrac{640}{2},\\,\\tfrac{480}{2}\\right)=(320,\\;240)\\]","text":"Principal point কার্যত ছবির ঠিক মাঝখানে (640×480 ছবির কেন্দ্র 320,240) — একটু এদিক-ওদিক হওয়াই স্বাভাবিক; এই সামান্য তফাতই calibration-এর মূল কারণ।"},{"latex":"\\[f\\approx477.6\\text{ px},\\quad \\text{FOV}_h\\approx2\\arctan\\!\\left(\\tfrac{320}{477.6}\\right)\\approx67.7^{\\circ}\\]","text":"Focal length থেকে দৃষ্টিকোণের অনুমান: 640-px প্রস্থের অর্ধেক (320) আর f=477.6 দিয়ে অনুভূমিক field-of-view ≈ 68° — এই camera-র জন্য যুক্তিসঙ্গত চওড়া দৃষ্টি।"}],"mapping":[{"code":"self.camera_info_K[0] → 477.57","math":"f_x","text":"অনুভূমিক focal length — X-অক্ষের হিসাবে (Part 15-এ ভাগ হবে)।"},{"code":"self.camera_info_K[4] → 477.55","math":"f_y","text":"উল্লম্ব focal length — Y-অক্ষের হিসাবে।"},{"code":"self.camera_info_K[2] → 319.38","math":"c_x","text":"ছবির কেন্দ্রের x — pixel থেকে কেন্দ্র-প্রস্থ বের করতে বিয়োগ হবে।"},{"code":"self.camera_info_K[5] → 238.64","math":"c_y","text":"ছবির কেন্দ্রের y — একইভাবে বিয়োগ হবে।"},{"code":"K[1]=K[3]=K[6]=K[7]=0, K[8]=1","math":"\\text{skew}=0,\\;\\text{homogeneous row}","text":"আঁকাবাঁকা নেই; শেষ সারি শুধু গণিতের সুবিধার জন্য (homogeneous coordinate)।"}],"failure":["<b>c_x আর c_y সোয়াপ করলে<\/b> (319.38-কে y-কেন্দ্র ধরলে) পরে বের করা 3D point-এর X/Y দুই-ই ভুল দিকে সরে যাবে — tag সোজা দেখলেও হিসাব বলবে সে পাশে; claw ভুল জায়গায় যাবে।","<b>ভুল camera-এর K ব্যবহার করলে<\/b> (অন্য একটি DaBai DCW2-এর calibration) f-এর সামান্য পার্থক্যও দূরের tag-এ বড় ভুল হয় — যেমন f-এ ১% ভুল হলে 0.5 m দূরের point-এ ~5 mm এর বেশি সরে যাওয়া সম্ভব।","<b>f-এর একক pixel না রেখে<\/b> (যেমন mm ধরে নিলে) সম্পূর্ণ scale-ই ভেঙে পড়ে — সব দূরত্ব শত-গুণ ভুল হবে এবং claw কাজের জায়গার বহু দূরে গিয়ে থামবে।"]},"robot":{"correct":"Node জন্মালে ROS 2-তে নাম নিবন্ধিত হবে, arm-এর Home অবস্থা (90,90,0,0,90,90) স্মৃতিতে থাকবে, AprilTag detector ৮ thread-এ প্রস্তুত হবে, আর claw-এর শুরুর অনুমিত অবস্থা ও camera-র calibration সংখ্যা গুছিয়ে রাখা হবে — পরের অংশে subscriber বসানোর সব উপকরণ তৈরি।","incorrect":"Detector-এর <code>families<\/code> ভুল হলে (যেমন tagStandard41h12 লিখলে) robot 36h11-এর tag-এর সামনে দাঁড়িয়েও কিছুই দেখবে না — “চোখ খোলা কিন্তু অন্ধ”। <code>quad_decimate<\/code> খুব বাড়িয়ে দিলে ছোট/দূরের tag মিস হবে; আর K-র কোনো মান ভুল হলে সব পরের হিসাব গণ্ডগোল — claw সবসময় সামান্য (বা অনেক) পাশে গিয়ে claw খুলবে।"},"id":"part-08","start":46,"end":80,"lang":"python","animType":"detectorParams","flags":[]},{"n":9,"fname":"arm_offset.py","enTitle":"End-to-Camera Transform Matrix","explain":[{"a":82,"b":84,"text":"<p>এই তিনটি লাইন শুধু comment — runtime-এ কিছু চালায় না — কিন্তু নিচের matrix-টি কী বোঝায় তার মানচিত্র এখানেই। Source নিজেই একে 'THE TRANSLATION MATRIX' বলে ডাকছে, যা terminology হিসেবে অসম্পূর্ণ: পরের লাইনের <code>np.array<\/code> আসলে একটি 4x4 homogeneous transformation matrix, যার ভেতরে rotation-ও আছে, translation-ও। Line 84 জানাচ্ছে Camera-টি claw-এর সাপেক্ষে 10.1 cm এক পাশে, 0.2 cm সামনে এবং 4.8 cm উপরে বসানো ('left' শব্দটি comment-এ থাকলেও বাঁ না ডান সেটি end-frame-এর axis convention-এর উপর নির্ভর করে; এই folder থেকে শুধু সংখ্যা আর sign-ই verify করা যায়) — এই মাপগুলোই নিচের matrix-এর চতুর্থ column-এ meter এককে <code>-0.101<\/code>, <code>0.002<\/code>, <code>0.0482<\/code> হিসেবে বসে আছে। Variable-এর নাম <code>EndToCamMat<\/code> হলেও ব্যবহার অন্য দিকে: <code>compute_heigh<\/code>-এ (line 280) একে camera frame-এ পাওয়া point-এর উপর বাম দিক থেকে গুণ করা হয়, অর্থাৎ এটি camera frame-এর সংখ্যাকে end-effector (claw) frame-এ নিয়ে যায় — নাম পড়ে দিক আন্দাজ করা বিপজ্জনক। মানগুলো hard-coded, কোনো code এগুলো automaticভাবে শেখে না, তাই camera নতুন করে mount করলে বা bracket বদলালে এই সংখ্যাগুলোই আর বাস্তবতার সাথে মিলবে না। এই একটি constant-ই পুরো calibration pipeline-এর সবচেয়ে গুরুত্বপূর্ণ ধ্রুবক, কারণ <code>pixel_to_camera_depth<\/code> যত নিখুঁতই হোক, camera আর claw-এর মধ্যকার এই জ্যামিতিক সম্পর্ক ভুল হলে tag-এর final অবস্থানও ভুল হবে।<\/p>"},{"a":85,"b":87,"text":"<p>এই তিনটি লাইন মিলে 4x4 matrix-এর প্রথম তিনটি row তৈরি করে — প্রতিটি row-এর প্রথম তিনটি entry নিয়ে গঠিত rotation অংশ R = [[0, 0, 1], [-1, 0, 0], [0, -1, 0]], আর চতুর্থ entry-গুলো (<code>-0.101<\/code>, <code>0.002<\/code>, <code>0.0482<\/code>) হলো translation vector t, একক meter। এটি <code>__init__<\/code>-এর ভেতরে node তৈরির সময় ঠিক একবারই বানানো হয় (numpy-র <code>np.array<\/code>, line 7-এর import-এর উপর নির্ভরশীল), কারণ camera আর claw-এর সম্পর্ক একটি স্থায়ী mounting সত্য — তারপর প্রতিটি image callback-এ <code>compute_heigh<\/code> বারবার একই matrix ব্যবহার করে। R-এর প্রতিটি column বলে দেয় camera frame-এর একেকটি axis end-frame-এ কোথায় যায়: তৃতীয় column (1, 0, 0) মানে camera-র optical axis (+Z, যে দিকে সে তাকিয়ে আছে) হয়ে যায় end-এর +X; প্রথম column (0, -1, 0) মানে camera-র +X হয়ে যায় end-এর -Y; দ্বিতীয় column (0, 0, -1) মানে camera-র +Y (ছবির নিচের দিক) হয় end-এর -Z — অর্থাৎ এটি বিশুদ্ধ 90-degree axis remapping, কোনো তির্যক কোণ নেই, এজন্যই entry-গুলো ঠিক 0, 1, -1। R orthonormal (প্রতিটি column-এর দৈর্ঘ্য 1, column-গুলো পরস্পর লম্ব) এবং det(R) = +1, তাই এটি proper rotation — mirror নয়, এজন্যই বাঁ-ডান handedness ঠিক থাকে এবং দূরত্ব-আকার অপরিবর্তিত থাকে। পুরো রূপান্তর তাই p_end = R p_cam + t: আগে axis বদল, পরে claw থেকে camera-র mounting offset যোগ — একটি সুন্দর যাচাই হলো p_cam = (0, 0, 0) বসালে ফল হুবহু t আসে, অর্থাৎ t নিজেই camera lens-এর অবস্থান claw frame-এ।<\/p><p>এখানে একটি sign বা column ভুল থাকলে tag-এর অবস্থান বাঁ-ডান বা উপর-নিচ উল্টে যাবে, আর calibration-এর সময় SPACE (key code 32) চেপে <code>offset_value.yaml<\/code>-এ লেখা <code>x_offset<\/code>-জাতীয় মানগুলোও ভুল হয়ে জমা হবে — তাই এই তিন লাইনই এই file-এর সবচেয়ে স্পর্শকাতর অংশ।<\/p>"},{"a":88,"b":88,"text":"<p>শেষ row <code>[ 0.0 , 0.0 , 0.0 , 1.0 ]<\/code> rotation বা translation কিছুই যোগ করে না — এটি homogeneous coordinate-এর কাঠামোগত অংশ। 4x4 আকারে লেখার লাভ হলো ঘোরানো আর সরানো দুটো কাজ একটি একক matrix multiplication-এ সম্পন্ন হয়, যদি বিন্দুকেও চতুর্থ উপাদান 1-সহ লেখা হয়। ঠিক এ কারণেই <code>compute_heigh<\/code>-এর line 280-এ <code>self.xyz_euler_to_mat(camera_location, (0, 0, 0))<\/code> দিয়ে camera point-টিকে (0, 0, 0) euler rotation অর্থাৎ identity rotation-সহ একটি 4x4 pose matrix বানিয়ে নেওয়া হয়, যাতে সেটি সরাসরি <code>self.EndToCamMat<\/code>-এর সাথে গুণ করা যায় — shape না মিললে numpy সরাসরি error দিত। নিচের row-টি ভুল হলে (যেমন শেষ 1.0-এর জায়গায় অন্য সংখ্যা) গুণফলের চতুর্থ উপাদান আর 1 থাকবে না — পরের ধাপে <code>get_end_point_mat<\/code>-এর সাথে জোড়া দিয়ে <code>mat_to_xyz_euler<\/code> দিয়ে ভাঙলে সব মান স্কেল-এ এলোমেলো হয়ে যাবে। আর row 85-87-এ <code>-0.101<\/code>-এর মতো float মান থাকায় numpy type promotion-এ পুরো matrix-টিই float হয়ে যায়, তাই depth থেকে আসা float দূরত্বের সাথে গুণে integer rounding-এ মান নষ্ট হয় না।<\/p>"}],"math":{"intro":"এই matrix-টিই পুরো arm calibration-এর হৃদয়। <code>pixel_to_camera_depth<\/code> pixel আর depth থেকে camera-frame-এর একটি 3D বিন্দু বানায়; তারপর <code>self.EndToCamMat<\/code> সেই বিন্দুকে end-effector-এর চোখে দেখা বিন্দুতে রূপান্তর করে। নিচে ধাপে ধাপে — 2D rotation থেকে শুরু করে 3D rotation-এর বিধি, এই code-এর নির্দিষ্ট 90-degree axis remapping, সবশেষে 4x4 homogeneous রূপ ও তার প্রয়োগ পর্যন্ত — পুরো পথটা derivation আকারে দেখানো হলো, সাথে বাস্তব সংখ্যায় হিসাব (numeric), code-to-math mapping এবং ভুল হলে কী নষ্ট হয় (failure) তার কথা।","levels":[{"label":"Level 1 — 2D rigid transform","latex":"\\[ p' = R_{2D}\\,p + t, \\qquad R_{2D} = \\begin{bmatrix} \\cos\\theta & -\\sin\\theta \\\\ \\sin\\theta & \\cos\\theta \\end{bmatrix} \\]","text":"সবচেয়ে সহজ শুরু: 2D plane-এ একটি rigid transform মানে <b>আগে ঘোরানো, পরে সরানো<\/b>। Point p-কে কোণ θ ঘুরিয়ে R p পাওয়া হয়, তারপর t যোগ করে চূড়ান্ত অবস্থান p'। প্রথম row-এর -sin আর দ্বিতীয় row-এর +sin-এর এই বিন্যাসই ঘূর্ণনের দিক ঠিক রাখে। এই 'আগে ঘোরানো, পরে সরানো' ক্রমটাই 3D-তেও অটুট থাকে — <code>EndToCamMat<\/code>-এর প্রতিটি প্রয়োগের মূলে এই সমীকরণটিই আছে।"},{"label":"Level 2 — 3D rotation matrix-এর বিধি","latex":"\\[ R^{\\top} R = I, \\qquad \\det(R) = +1, \\qquad R\\,e_i = c_i \\;(\\text{R-এর } i\\text{-তম column}) \\]","text":"3D-তে কোনো matrix-কে rotation বলতে দুটি শর্ত লাগে: column-গুলো orthonormal হতে হবে (প্রতিটির দৈর্ঘ্য 1 এবং পরস্পরের উপর লম্ব), যার সংক্ষিপ্ত রূপ R-transpose R = I; আর det(R) = +1 হলে proper rotation, det = -1 হলে mirror/reflection। সবচেয়ে কাজের সূত্র: R-এর i-তম column c_i আসলে পুরনো frame-এর i-তম basis vector e_i নতুন frame-এ যেখানে গিয়ে পড়ে তার ঠিকানা — অর্থাৎ column-গুলো পড়লেই বোঝা যায় axis-গুলো কোথায় ম্যাপ হচ্ছে। পরের Level-এ ঠিক এইভাবেই R পড়া হবে।"},{"label":"Level 3 — এই code-এর R: 90-degree axis remapping","latex":"\\[ R = \\begin{bmatrix} 0 & 0 & 1 \\\\ -1 & 0 & 0 \\\\ 0 & -1 & 0 \\end{bmatrix} \\;\\Rightarrow\\; R e_3 = \\begin{bmatrix} 1 \\\\ 0 \\\\ 0 \\end{bmatrix}, \\quad R e_1 = \\begin{bmatrix} 0 \\\\ -1 \\\\ 0 \\end{bmatrix}, \\quad R e_2 = \\begin{bmatrix} 0 \\\\ 0 \\\\ -1 \\end{bmatrix} \\]","text":"এখন এই code-এর নির্দিষ্ট R (line 85-87-এর প্রথম তিনটি column): camera-র +Z অর্থাৎ optical axis যায় end-effector-এর +X-এ; camera-র +X (image-এর ডান দিক) যায় end-এর -Y-তে; camera-র +Y (image-এর নিচের দিক) যায় end-এর -Z-এ। কোনো axis বাঁকানো নেই, শুধু axis-এর লেবেল বদলানো — এ কারণেই entry-গুলো ঠিক 0, 1, -1। det(R) = +1 (নিচের numeric-এ হিসাব) নিশ্চিত করে এটি rotation, mirror নয় — তাই camera-র বাঁ-ডান আর end-frame-এর বাঁ-ডান একই থাকে।"},{"label":"Level 4 — 4x4 homogeneous রূপ","latex":"\\[ T = \\left[ \\begin{array}{cc} R & t \\\\ 0\\;0\\;0 & 1 \\end{array} \\right] = \\begin{bmatrix} 0 & 0 & 1 & -0.101 \\\\ -1 & 0 & 0 & 0.002 \\\\ 0 & -1 & 0 & 0.0482 \\\\ 0 & 0 & 0 & 1 \\end{bmatrix} \\]","text":"3x3 rotation আর 3x1 translation-কে একটি 4x4 homogeneous matrix-এ প্যাক করা হয়: উপরের-বাঁয়ে block-এ R, উপরের-ডানে column-এ t, নিচের row-এ (0, 0, 0, 1)। Line 85-88-এর <code>np.array<\/code> হুবহু এই বিন্যাস, যেখানে t = (-0.101, 0.002, 0.0482) meter — camera claw-এর সাপেক্ষে 10.1 cm পাশে, 0.2 cm সামনে, 4.8 cm উপরে। একক meter, কারণ <code>pixel_to_camera_depth<\/code> (line 299-307)-ও meter-এ ফেরত দেয় — দুটোর একক না মিললে ফল 1000 গুণ ভুল হয়ে যাবে।"},{"label":"Level 5 — code যা করে: p_end = R p_cam + t","latex":"\\[ \\begin{bmatrix} p_{end} \\\\ 1 \\end{bmatrix} = T \\begin{bmatrix} p_{cam} \\\\ 1 \\end{bmatrix} \\;\\Longleftrightarrow\\; p_{end} = R\\,p_{cam} + t \\]","text":"চূড়ান্ত রূপ: camera frame-এর বিন্দুকে চতুর্থ উপাদান 1-সহ লিখে T দিয়ে বাম-গুণ করলে ঘোরানো আর সরানো এক ধাক্কায় সম্পন্ন হয়। <code>compute_heigh<\/code>-এর line 280 ঠিক এটাই করে: <code>np.matmul(self.EndToCamMat, self.xyz_euler_to_mat(camera_location, (0, 0, 0)))<\/code> — <code>camera_location<\/code> (line 277-এ <code>pixel_to_camera_depth<\/code>-এর ফেরত দেওয়া মান) হয়ে যায় end-effector frame-এর pose, যাকে পরে <code>get_end_point_mat<\/code>-এর সাথে গুণ করে base frame-এ নেওয়া হয়। খেয়াল রাখুন গুণের ক্রম: বাম দিকে T, কারণ আগে rotation-পরে translation এই ক্রমেই camera-র সংখ্যাকে claw-এর ভাষায় অনুবাদ হয়।"}],"numeric":[{"latex":"\\[ \\det(R) = 0\\big(0 \\cdot 0 - 0 \\cdot (-1)\\big) - 0\\big((-1) \\cdot 0 - 0 \\cdot 0\\big) + 1\\big((-1)(-1) - 0 \\cdot 0\\big) = 1 \\cdot 1 = +1 \\]","text":"প্রথম row বরাবর cofactor expansion: প্রথম দুটি entry শূন্য হওয়ায় শুধু তৃতীয় entry (মান 1) বেঁচে থাকে, তার minor হলো [[-1, 0], [0, -1]]-এর determinant = (-1)(-1) - (0)(0) = 1। ফল det(R) = +1: proper rotation নিশ্চিত। সাথে orthonormality-ও যাচাই করা যায়: প্রতিটি column-এর দৈর্ঘ্য 1 (যেমন প্রথম column: 0^2 + (-1)^2 + 0^2 = 1), আর যেকোনো দুই column-এর dot product শূন্য (যেমন col1·col2 = (0)(0) + (-1)(0) + (0)(-1) = 0)।"},{"latex":"\\[ p_{cam} = \\begin{bmatrix} 0.03 \\\\ -0.02 \\\\ 0.45 \\end{bmatrix} \\Rightarrow \\begin{aligned} x_{end} &= 0(0.03) + 0(-0.02) + 1(0.45) - 0.101 = 0.349 \\\\ y_{end} &= -1(0.03) + 0(-0.02) + 0(0.45) + 0.002 = -0.028 \\\\ z_{end} &= 0(0.03) - 1(-0.02) + 0(0.45) + 0.0482 = 0.0682 \\end{aligned} \\]","text":"এই verified উদাহরণ দেখায় প্রতিটি row ঠিক একটাই কাজ করে: প্রথম row camera-র Z নেয় (x_end = 0.45 - 0.101 = 0.349), দ্বিতীয় row camera-র X-এর উল্টো নেয় (y_end = -0.03 + 0.002 = -0.028), তৃতীয় row camera-র Y-এর উল্টো নেয় (z_end = 0.02 + 0.0482 = 0.0682)। ফল (0.349, -0.028, 0.0682) meter — claw frame-এ tag-টি camera-র তাকানো দিকে (এই frame-এর +X) 34.9 cm দূরে, Y-তে -2.8 cm, Z-তে +6.8 cm। বাঁ-ডান বা উপর-নিচ কোন শব্দ বসবে সেটি end-frame-এর axis convention-এর উপর নির্ভর করে — line 84-এর comment নিজে থেকেই -X-কে 'left' আর +Z-কে 'above' ধরে নিয়েছে; এই folder থেকে সংখ্যা আর sign-ই শুধু verify করা যায়। এখানেই 90-degree remapping-এর সৌন্দর্য: প্রতিটি সংখ্যা একবারেই এক axis থেকে আরেক axis-এ চলে যায়।"},{"latex":"\\[ p_{cam} = (0, 0, 0.5): \\quad x_{end} = 0.5 - 0.101 = 0.399, \\quad y_{end} = 0 + 0.002 = 0.002, \\quad z_{end} = 0 + 0.0482 = 0.0482 \\]","text":"Camera-র ঠিক সামনে optical axis-এর উপরে 50 cm দূরের একটি বিন্দু claw frame-এ যায় (0.399, 0.002, 0.0482) — অর্থাৎ camera-র 'সামনে 50 cm' মানেই end-frame-এ +X দিকে 39.9 cm (50 cm থেকে 10.1 cm mounting offset বাদ), আর y, z-তে থাকে শুধু camera-র নিজের mounting offset। এটাই বোঝায় কেন camera-র সামনের দিক (optical axis) এই frame-ে +X হয়ে যায়, আর কেন depth-এর মান সবচেয়ে বেশি প্রভাব ফেলে x_end-এর উপর।"}],"mapping":[{"code":"self.EndToCamMat = np.array([...])","math":"T (4x4 homogeneous transform)","text":"পুরো matrix-এর নাম — code-এ একটাই object, math-এ R আর t-এর সংযুক্ত রূপ; <code>compute_heigh<\/code>-এর line 280-এ এটিই বাম দিক থেকে গুণ হয়।"},{"code":"[[ 0 ,0 ,1 ], [-1 ,0 ,0 ], [0 ,-1 ,0 ]]","math":"R (উপরের-বাঁয়ে 3x3 block)","text":"Camera axis-গুলোর end-frame-এ গন্তব্য: column 3 = optical Z থেকে end +X, column 1 = camera X থেকে end -Y, column 2 = camera Y থেকে end -Z।"},{"code":"-0.101, 0.002, 0.0482","math":"t (চতুর্থ column-এর প্রথম তিনটি entry)","text":"Claw থেকে camera-র mounting offset, একক meter — 10.1 cm পাশে, 0.2 cm সামনে, 4.8 cm উপরে; p_cam = 0 বসালে ফল হিসেবে এটাই ফেরত আসে।"},{"code":"[ 0.0 , 0.0 , 0.0 , 1.0 ]","math":"নিচের row (0 0 0 1)","text":"Homogeneous কাঠামোর অংশ — বিন্দুর চতুর্থ উপাদান 1 রাখে অপরিবর্তিত, যাতে rotation+translation একটি গুণেই সম্পন্ন হয়।"},{"code":"np.matmul(self.EndToCamMat, self.xyz_euler_to_mat(camera_location, (0, 0, 0)))","math":"p_end = R p_cam + t","text":"<code>pixel_to_camera_depth<\/code>-এর ফলাফলকে identity rotation-সহ 4x4 বানিয়ে T দিয়ে গুণ — সমীকরণটির হুবহু implementation, line 280-এ।"}],"failure":["R-এর কোনো -1-এর sign উল্টে গেলে (যেমন দ্বিতীয় row-এর -1 হয়ে 1) বাঁ-ডান বা উপর-নিচ mirror হয়ে যায়: tag যদি claw-এর বাঁয়ে থাকে হিসাব তাকে ডানে বসাবে, আর det(R) = -1 হয়ে গিয়ে সেটি আর proper rotation থাকবে না — claw প্রতিবার ভুল পাশে নামবে।","Column swap হলে (যেমন প্রথম আর তৃতীয় column অদল-বদল) camera-র X-কে depth ভেবে বসবে: pixel-এর আনুভূমিক offset-ই 'দূরত্ব' হয়ে যাবে, tag কাছে গেলে হিসাব দূরে দেখাবে — ফল পুরোপুরি অর্থহীন এবং <code>x_offset_value = 0.145 - pose[0]<\/code> ধরনের offset-গুলো বিশাল হয়ে যাবে।","t-এর কোনো উপাদান ভুল হলে প্রতিটি grasp সেই ভুল বরাবর ধ্রুবক পরিমাণ সরে যাবে: যেমন <code>-0.101<\/code>-এর জায়গায় <code>-0.0101<\/code> লেখা মাত্র সব টার্গেট 9 cm এগিয়ে যাবে, claw বারবার object-এর 9 cm আগে থেমে বন্ধ হবে।","একক গোলমাল হলে (t meter-এ কিন্তু depth mm-এ, বা উল্টো) ফল 1000 গুণ স্কেল হয়ে যাবে — tag আসলে 45 cm দূরে থাকলেও হিসাবে 450 m-এর মতো অসম্ভব মান আসবে এবং <code>move_dist<\/code> ভুল দিকে চালাবে।","নাম দেখে <code>EndToCamMat<\/code>-কে উল্টো দিকে (end থেকে camera) ভেবে inverse হিসেবে ব্যবহার করলে, বা গুণের ক্রম উল্টে দিলে (আগে camera-র matrix, পরে T) ফল ভিন্ন হবে — matrix multiplication commutative নয়, এবং calibration-এর SPACE-চাপে ভুল মান <code>offset_value.yaml<\/code>-এ স্থায়ীভাবে লেখা হয়ে যাবে।"]},"robot":{"correct":"Matrix-টি ঠিক থাকলে Jetson-এ চলা এই node-এ Orbbec DaBai DCW2 camera-র depth থেকে পাওয়া tag-এর camera-frame বিন্দু 90-degree ঘুরে হুবহু claw (end-effector) frame-এ বসে, তারপর <code>CurEndPos<\/code>-এ থাকা FK snapshot-এর সাথে মিলে (line 283-286) tag-এর base-frame অবস্থান বের হয়। ফলে tag কোথায় সেটা নির্ভুলভাবে জানা যায়, <code>x_offset_value = 0.145 - pose[0]<\/code>-এর মতো offset-গুলো ছোট মানে আসে, SPACE (key code 32) চাপলে <code>offset_value.yaml<\/code>-এ সূক্ষ্ম সংশোধনী লেখা হয়, এবং পরে 6-DOF arm micro-ROS agent-এর (2,000,000 baud serial) বন্ধনে নির্ভুলভাবে tag-এর উপর claw নামাতে পারে।","incorrect":"R-এর sign বা column ভুল হলে claw tag-এর আয়না-ছবির দিকে যাবে — বাঁ হয়ে ডান, উপর হয়ে নিচ — আর serial bridge যত দ্রুতই command পাঠাক, লক্ষ্য নিজেই ভুল থাকবে; t ভুল হলে প্রতিটি grasp ধ্রুবক সংখ্যক centimeter-এ পাশ কাটাবে (যেমন 9-10 cm এগিয়ে বা পিছিয়ে থেমে যাবে)। সবচেয়ে বিপজ্জনক দিক: calibration চালানোর সময় SPACE চাপলে এই ভুলটাই <code>offset_value.yaml<\/code>-এ স্থায়ী হয়ে যায়, ফলে পরের বার node চালু হলেও ভুল offset-ই load হবে এবং arm বারবার একই ভুল জায়গায় থেমে object ফেলে দেবে।"},"id":"part-09","start":82,"end":88,"lang":"python","animType":"endToCamFrames","flags":[]},{"n":10,"fname":"arm_offset.py","enTitle":"Publishers, Subscribers & Time Sync","explain":[{"a":90,"b":91,"text":"এই দুইটি comment <code>__init__<\/code>-এর সবচেয়ে গুরুত্বপূর্ণ section-এর শিরোনাম — এখানে node-টির পুরো ROS 2 communication graph তৈরি হয়: কোন topic-এ data পাঠাবে (publisher), কোন topic থেকে শুনবে (subscriber), আর কোন service-কে জিজ্ঞেস করবে (client)। Comment-এ publisher-দের এমন radio station-এর সাথে তুলনা করা হয়েছে যাতে robot broadcast করে (নিচের line 98-এর comment subscriber-দেরও একই রকম বলে বর্ণনা করে: 'radio stations the robot listens to') — এটি pub/sub model-এর বেশ ভালো analogy, কারণ publisher জানে না কে শুনছে, subscriber-ও জানে না কে বলছে; মাঝখানে ROS 2-এর DDS layer দুই পক্ষকে match করে দেয়। মনে রাখবেন, এই পুরো setup constructor-এ অর্থাৎ node object তৈরির সময়ই একবার চলে; এরপর <code>rclpy.spin<\/code> শুধু message চালাচালি করে।"},{"a":92,"b":92,"text":"<code>self.pos_info_pub<\/code> একটি publisher তৈরি করে যা <code>AprilTagInfo<\/code> type-এর message <code>PosInfo<\/code> topic-এ পাঠাবে, QoS depth 1 সহ — মানে নতুন message এলে পুরনোটা buffer থেকে বাদ পড়ে (keep-last-1)। <code>AprilTagInfo<\/code> এই project-এর নিজস্ব custom message (package <code>arm_interface<\/code>); উদ্দেশ্য ছিল tag-এর অবস্থান অন্য কোনো node-কে জানানো। কিন্তু একটি সৎ পর্যবেক্ষণ: পুরো file-এ <code>self.pos_info_pub<\/code> আর কোথাও ব্যবহৃত হয়নি — এই channel-এ কোনো message publish-ই হয় না। ROS 2-এ zero-subscriber topic-এ publish করাও বৈধ হওয়ায় এতে কোনো error আসে না, তাই object-টি নীরবে অব্যবহৃত পড়ে থাকে।"},{"a":93,"b":93,"text":"<code>self.CmdVel_pub<\/code> তৈরি করে <code>geometry_msgs/Twist<\/code> message <code>cmd_vel<\/code> topic-এ, QoS depth 1 সহ। <code>Twist<\/code> হলো linear ও angular velocity-র standard container, আর <code>cmd_vel<\/code> হলো robot chassis/wheel চালানোর ROS জগতের সবচেয়ে পরিচিত topic-এর নাম। এই publisher-টি পরে <code>self.pubVel()<\/code> helper-এ ব্যবহৃত হয়, যাকে ডাকে <code>move_dist()<\/code> — base-কে target-এর দিকে নিয়ে যাওয়ার PID chain। তবে খেয়াল করুন: এই file-এ <code>move_dist<\/code>-কে আর কেউ call করে না, তাই calibration flow-তে এই channel-এও শেষ পর্যন্ত কোনো message যায় না। Depth 1 নীতিটি velocity command-এর জন্য সঠিক — পুরনো speed command দেরিতে execute হলে robot অজান্তেই এগিয়ে যেতে পারে, তাই প্রতিটি নতুন command আগেরটাকে replace করে।"},{"a":94,"b":94,"text":"<code>self.TargetAngle_pub<\/code> হলো arm-এর নিজের channel: <code>arm_msgs/ArmJoints<\/code> message <code>arm6_joints<\/code> topic-এ, QoS depth 10 সহ। README-র step 1-এ যে <code>ros2 topic pub /arm6_joints arm_msgs/msg/ArmJoints ... --once<\/code> command দিয়ে home pose পাঠানো হয়, এই publisher ঠিক সেই একই topic-এ publish করে — অর্থাৎ node-টি নিজেই সেই কাজটা code দিয়ে করে। Depth 10 মানে publisher পক্ষ থেকে পাঠানো সর্বশেষ ১০টি অব্যক্ত message পর্যন্ত জমিয়ে রাখা যায়; joint command ছোট ও দ্রুত আসে বলে reliability-র জন্য এই buffer তুলনামূলক বড় রাখা হয়েছে। নিচের line 114-117-এর home-pose loop এবং <code>pubSix_Arm()<\/code> helper — সবই এই এক publisher-এর উপর দাঁড়িয়ে; এই node থেকে arm-কে নাড়ানোর একমাত্র রাস্তা এটিই।"},{"a":95,"b":96,"text":"দুইটি ছোট publisher: <code>self.TargetJoint5_pub<\/code> <code>std_msgs/Int16<\/code> message <code>set_joint5<\/code> topic-এ (depth 10) পাঠানোর জন্য — নাম থেকে বোঝা যায় gripper-বহনকারী joint 5 আলাদা করে নিয়ন্ত্রণের পরিকল্পনা ছিল; আর <code>self.pub_cur_joints<\/code> custom <code>CurJoints<\/code> message <code>Curjoints<\/code> topic-এ (depth 1) arm-এর বর্তমান joint state জানানোর জন্য। দুটি সৎ পর্যবেক্ষণ: <code>self.TargetJoint5_pub<\/code>-এ এই file-এ কখনো publish করা হয়নি (line 141-এ শুধু <code>self.joint5 = Int16()<\/code> object তৈরি হয়, সেটিও আর কোথাও ব্যবহৃত হয় না), আর <code>self.pub_cur_joints<\/code>-কে ডাকে শুধু <code>pubCurrentJoints()<\/code> method — যা এই file-এর কোথাও থেকেই call হয় না। অর্থাৎ দুই channel-ই এই file-এর জীবনে সম্পূর্ণ নীরব; সম্ভবত বড় demo stack-এর অন্য node-দের সাথে interface মিলিয়ে রাখা হয়েছে (সেসব এই folder-এর বাইরে)।"},{"a":98,"b":99,"text":"<code>self.sub_grasp_status<\/code> একটি subscription খোলে: <code>std_msgs/Bool<\/code> message, topic <code>grasp_done<\/code>, QoS depth 100, আর প্রতিটি message এলেই চলবে <code>self.get_graspStatusCallBack<\/code> (method-টি এই file-এই পরে define করা আছে)। অর্থাৎ gripper নিয়ন্ত্রণকারী node ধরা শেষ করে এখানে <code>data=True<\/code> পাঠালে এই node জানবে pick ধাপ সম্পন্ন। Depth 100 একটি একবারের event-এর জন্য অস্বাভাবিক রকমের বড় queue — তবে callback-এর ভেতরে <code>time.sleep(3.0)<\/code> থাকায় ওই callback-এর executor কিছুক্ষণ block থাকে, বড় queue জমা message হারানোর ঝুঁকি কমায়। গুরুত্বপূর্ণ ফল: callback-টি <code>self.pubPos_flag = True<\/code> করে দেয়, ফলে পরের <code>callback()<\/code>-এ দ্বিতীয় শর্ত <code>self.pubPos_flag == False<\/code> আর মেলে না — আর এই file-এর ভেতরে <code>pubPos_flag<\/code> কখনো <code>False<\/code>-এ ফেরানোও হয় না।"},{"a":101,"b":103,"text":"এই তিন line-এ Orbbec DaBai DCW2 camera-র দুই stream subscribe করা হচ্ছে — color <code>/camera/color/image_raw<\/code> এবং depth <code>/camera/depth/image_raw<\/code>, দুটোই <code>sensor_msgs/Image<\/code> (640x480)। লক্ষ্য করুন: এখানে <code>self.create_subscription<\/code> নয়, বরং <code>message_filters.Subscriber<\/code> — প্রথম argument হিসেবে node-টি নিজে (<code>self<\/code>) দেওয়া হয়েছে। কারণটা হলো color আর depth frame আলাদা আলাদা আসে, তাদের <code>header.stamp<\/code> হুবহু এক না-ও হতে পারে, কিন্তু আমাদের দরকার একই মুহূর্তের জোড়া। দুইটি সাধারণ subscription আর দুইটি আলাদা callback দিলে কোন color-এর সাথে কোন depth মেলাতে নিজে একটা buffer-logic লিখতে হতো; <code>message_filters<\/code> package সেই কাজটাই করে দেয়। এই <code>Subscriber<\/code>-রা নিজেরা কোনো processing callback চালায় না — তারা পাওয়া frame নিচের line 123-এর synchronizer-কে সরবরাহ করে।"},{"a":105,"b":107,"text":"এই block একটি ROS 2 service client তৈরি করে: message type <code>arm_interface/srv/ArmKinemarics<\/code>, আর service-এর নাম <code>'get_kinemarics'<\/code> — বানানটি source-এ যেমন, তেমনই verbatim রাখা হয়েছে (kinematics নয়, kinemarics)। ROS 2-তে service নাম string-হুবহু match হতে হয়, তাই server পক্ষ — <code>kin_srv<\/code> node (package <code>arm_kin<\/code>, node name <code>kin_ik_fk<\/code>, <code>camera_arm_kin.launch.py<\/code> থেকে চালু হয়) — ঠিক এই নামেই service offer করে; নামে একটি অক্ষর এদিক-ওদিক হলেও client কখনো খুঁজে পেত না। এই service-টিই arm-এর মাথার হিসাবের 'brain' — পরে <code>get_current_end_pos()<\/code> এখানে শুধু <code>cur_joint1<\/code> আর <code>kin_name = 'fk'<\/code> পাঠিয়ে Forward Kinematics দিয়ে end-effector-এর pose নিয়ে আসবে, যা <code>CurEndPos<\/code>-এ জমা হবে।"},{"a":109,"b":111,"text":"এটি একটি blocking wait loop: <code>self.client.wait_for_service(timeout_sec=1.0)<\/code> প্রতি পাকে ১ সেকেন্ড পর্যন্ত অপেক্ষা করে দেখে service-টি available কি না; না পেলে <code>False<\/code> ফেরত দেয়, <code>while not<\/code> শর্ত থাকায় আবার ঘোরে, আর প্রতি ব্যর্থ পাকে <code>self.get_logger().info('Service not available, waiting again...')<\/code> log-টি terminal-এ ছাপে। ছোট একটি verbatim detail: source-এ এই line-টির শেষে, closing parenthesis-এর পরে দুইটি trailing tab আছে — কোনো functional প্রভাব নেই, শুধু এতটুকু জেনে রাখা ভালো যে source যেমন, তেমনই দেখানো হচ্ছে। Constructor তাই service না ওঠা পর্যন্ত শেষই হয় না — এটি একটি সচেতন design সিদ্ধান্ত: <code>kin_srv<\/code> ছাড়া FK response কখনো আসত না, <code>CurEndPos<\/code> startup-এর পুরনো মানেই আটকে থাকত, আর পুরো tag-to-base geometry ভুল হয়ে যেত।"},{"a":113,"b":117,"text":"এখন একটি বাস্তব-হার্ডওয়্যার গুরুত্বপূর্ণ loop: <code>self.TargetAngle_pub.get_subscription_count()<\/code> জিজ্ঞেস করে <code>arm6_joints<\/code> topic-এ এই মুহূর্তে কোনো subscriber আছে কি না — ব্যবহারকারী না থাকলে 0 (falsy) ফেরত দেয় আর <code>while not<\/code> চলতে থাকে। subscriber না থাকলে publish করা message অন্ধকারে হারিয়ে যায়: default QoS-এর durability VOLATILE হওয়ায় পরে যোগ দেওয়া subscriber আগের message কখনো ফিরে পায় না — QoS depth 10 থাকলেও সেটা শুধু already-matched subscriber-দের জন্য। তাই loop-টি প্রতি <code>time.sleep(0.1)<\/code> অন্তর <code>self.pubSix_Arm(self.init_joints)<\/code> দিয়ে home pose <code>[90, 90, 0, 0, 90, 90]<\/code> degree বারবার পাঠায়, যতক্ষণ না <code>start_agent.sh<\/code>-এ ওঠা micro-ROS bridge (USB serial <code>/dev/myserial<\/code>, 2,000,000 baud) subscribe করে গণনাটি nonzero হয়; তারপর line 117-এ নিশ্চিত হতে আরেকবার final send। <code>pubSix_Arm<\/code>-এর default <code>runtime=2000<\/code> মানে arm পাবে ২০০০ ms সময় (README-র manual command-এ time ছিল 1500 ms)। দুটি পরিণতি মনে রাখুন: node চালু করার সাথে সাথেই সত্যিকারের arm নড়ে home pose-এ যাবে, আর agent না চালু থাকলে এই loop চিরকাল নীরবে ঘুরবে — উপরের service-wait অন্তত log ছাপে, এটি ছাপে না।"},{"a":119,"b":123,"text":"Comment-গুলো ব্যাখ্যা করে কেন sync দরকার: depth camera একসাথে দুই ছবি পাঠায় — color আর distance — কিন্তু robot বা arm নড়ছে থাকলে দুই frame সামান্য ভিন্ন মুহূর্তে তোলা হতে পারে, আর তখন একই pixel-এর রঙ ও দূরত্ব আসলে ভিন্ন দুই বিন্দুর তথ্য হয়ে যায়। <code>ApproximateTimeSynchronizer([self.rgb_image_sub, self.depth_image_sub], 1, 0.5)<\/code> দুই stream-এর frame-এর <code>header.stamp<\/code> মিলিয়ে দেখে: পার্থক্য 0.5 সেকেন্ডের (slop) মধ্যে থাকলে জোড়া হিসেবে ধরা হয়; দ্বিতীয় argument 1 হলো queue size — প্রতি stream-এ বাফারে শুধু সর্বশেষ frame থাকে, নতুন এলে পুরনোটা বাদ পড়ে। নামেই 'Approximate': timestamp হুবহু সমান চাইলে <code>TimeSynchronizer<\/code> লাগত (যেটি import হয়েও অব্যবহৃত), কিন্তু দুই স্বাধীন sensor stream-এ দুই timestamp প্রায় কখনোই অক্ষরে অক্ষরে সমান হয় না — তাই tolerance দিয়ে মেলানো হয়। সংখ্যাটা বেশ উদার: 30 FPS color stream-এ পরপর দুই frame-এর ব্যবধান মাত্র প্রায় 0.033 s, মানে স্বাভাবিক jitter-এর জন্য 0.5 s-এর ছাতাটি অনেক বড়।"},{"a":124,"b":125,"text":"শুধু synchronizer বানালে হয় না — কে জোড়া পেলে কাজ করবে, সেটাও নিবন্ধন করতে হয়। <code>self.ts.registerCallback(self.callback)<\/code> লিখে দেয়: একটি matched color+depth pair যখনই সম্পূর্ণ হবে, <code>message_filters<\/code> নিজেই <code>self.callback(color_frame, depth_frame)<\/code>-কে ডেকে দেবে — argument-দুটির ক্রম উপরের list-এর ক্রমেই (আগে color, পরে depth)। এই একটি registration-ই পুরো node-এর main processing loop-এর প্রবেশদ্বার: AprilTag detection, depth read, 3D হিসাব, image display — সবকিছু ওই <code>callback<\/code>-এর ভেতরে ঘটে। আরেকটি সূক্ষ্ম ফল: registration-টি ঘটছে home-pose loop-এর পরে — অর্থাৎ home command পাঠানোর পরে, কিন্তু arm পৌঁছানো শেষ হওয়ার অপেক্ষা না নিয়েই: loop তো শুধু subscriber-এর উপস্থিতি দেখেই বেরিয়ে যায়, আর <code>pubSix_Arm<\/code> motion-কে 2000 ms সময় দেয়। তাই একদম প্রথম কয়েকটি pair এমন অবস্থাতেও আসতে পারে যখন arm এখনো home pose-এর পথে নড়ছে; স্থির হয়ে যাওয়ার পরের pair-গুলোই calibration-এর প্রকৃত কাজের শর্ত পূরণ করে।"},{"a":127,"b":130,"text":"Constructor-এর শেষ ধাপ: file-এর শুরুতে (module level) পড়ে রাখা <code>offset_config<\/code> dictionary থেকে তিনটি পুরনো calibration মান নামিয়ে attribute হিসেবে জমানো হচ্ছে — <code>self.x_offset<\/code>, <code>self.y_offset<\/code>, <code>self.z_offset<\/code> (<code>offset_config.get('x_offset')<\/code> ইত্যাদি; key না থাকলে <code>None<\/code> আসত — আসল file-টি robot-এর <code>/home/jetson/...<\/code> path-এ, এই folder-এ নেই, তাই মান আসলেই আছে কি না এখান থেকে যাচাই করা যায় না; module level-এর <code>print<\/code>-গুলোই terminal-এ একমাত্র প্রমাণ)। সৎ স্বীকারোক্তি: এই তিনটি attribute এই file-এ আর কোথাও ব্যবহৃত হয় না — কোনো pose-এর সাথে যোগও হয় না, বিয়োগও হয় না। মূল হিসাব (line 243-245) সবসময় বর্তমান পর্যবেক্ষণ থেকে নতুন <code>x_offset_value<\/code> ইত্যাদি বানায় এবং SPACE চাপলে সেগুলোই <code>offset_value.yaml<\/code>-এ লেখে। অর্থাৎ এই node পুরনো offset পড়ে নিজের ভেতরে শুধু জমিয়ে রাখে (module level-এর <code>print<\/code>-গুলোতে অবশ্যই দেখা যায়); সঞ্চিত মান ব্যবহার করার কথা সম্ভবত stack-এর অন্য কোনো component-এর (এই folder-এর বাইরে), কিন্তু এই file-এর নিজের হিসাবে এদের কোনো ভূমিকা নেই।"}],"math":{"intro":"এই অংশের একমাত্র গাণিতিক সিদ্ধান্ত লুকিয়ে আছে <code>ApproximateTimeSynchronizer([rgb, depth], 1, 0.5)<\/code>-এর তিনটি argument-এর মধ্যে: কোন color frame-এর সাথে কোন depth frame জোড়া হিসেবে গ্রহণ করা হবে। নিচে সেই শর্তটি ধাপে ধাপে গড়ে তোলা হলো।","levels":[{"label":"দুই frame-এর timestamp","latex":"\\[ t_{c}, \\; t_{d} \\]","text":"<code>t_c<\/code> হলো color frame-এর <code>header.stamp<\/code>-এর সেকেন্ড-মান, <code>t_d<\/code> হলো depth frame-এর সেটি। প্রতিটি ROS message নিজের জন্মমুহূর্ত এভাবে বয়ে বেড়ায় — synchronizer-এর কাছে এই দুই সংখ্যাই একমাত্র মেলানোর উপকরণ।"},{"label":"stamp থেকে সেকেন্ড","latex":"\\[ t = \\mathrm{sec} + \\mathrm{nanosec} \\times 10^{-9} \\]","text":"ROS 2-এর <code>header.stamp<\/code> আসলে দুই অংশে থাকে — <code>stamp.sec<\/code> (পূর্ণ সেকেন্ড) ও <code>stamp.nanosec<\/code> (ভগ্নাংশ, nanosecond এককে)। তুলনা করার আগে এদুটোকে একটাই সেকেন্ড-সংখ্যায় মেশাতে হয়।"},{"label":"পার্থক্য","latex":"\\[ \\Delta t = t_{c} - t_{d} \\]","text":"কতটা আগে-পরে তোলা হয়েছে, তার মাপ হলো দুই timestamp-এর ব্যবধান <code>Δt<\/code>। color আগে হলে এটি ধনাত্মক, depth আগে হলে ঋণাত্মক — কিন্তু আমাদের কাছে দেরিটা কোন দিকে সেটা গুরুত্বপূর্ণ নয়, শুধু এর মান।"},{"label":"জোড়ার শর্ত (slop)","latex":"\\[ \\left| \\Delta t \\right| = \\left| t_{c} - t_{d} \\right| \\leq \\mathrm{slop} \\]","text":"ApproximateTimeSynchronizer একটি জোড়া তখনই গ্রহণ করে যখন দুই frame-এর timestamp-পার্থক্যের পরম মান <code>slop<\/code> নামের tolerance-এর মধ্যে থাকে। এই শর্ত ভঙ্গ হলে frame জোড় হয় না, callback চলে না।"},{"label":"Code-এ বসানো মান","latex":"\\[ \\left| t_{c} - t_{d} \\right| \\leq 0.5\\ \\mathrm{s} \\]","text":"Code-এর তৃতীয় argument <code>0.5<\/code>-ই হলো slop — ০.৫ সেকেন্ড। মানে color ছবি আর depth ছবির জন্মমুহূর্ত আধা সেকেন্ডের মধ্যে হলেই সেগুলো একই মুহূর্ত ধরে নেওয়া হয়।"},{"label":"queue = 1 বাদ-দেওয়ার নীতি","latex":"\\[ q = 1: \\quad t_{\\mathrm{buf}} \\leftarrow t_{\\mathrm{new}} \\]","text":"দ্বিতীয় argument <code>1<\/code> হলো প্রতি stream-এর buffer-এর ধারণক্ষমতা। নতুন frame এলে buffer-এ থাকা পুরনো frame-টি বাদ পড়ে — buffer সর্বদা ওই stream-এর সর্বশেষ frame-টিই ধরে রাখে। ফলে জোড় না-হওয়া frame জমতে জমতে memory ভরাবে না; মূল্য হলো পুরনো frame চিরতরে হারায়।"}],"numeric":[{"latex":"\\[ \\Delta t = 12.400 - 12.150 = 0.250\\ \\mathrm{s} \\;\\leq\\; 0.5\\ \\mathrm{s} \\;\\Rightarrow\\; \\mathrm{pair!} \\]","text":"ধরুন color frame-এর stamp 12.400 s এবং depth frame-এর stamp 12.150 s। ব্যবধান 0.250 s, যা 0.5 s-এর কম — শর্ত পূরণ, তাই synchronizer দুটোকে জোড়া করে <code>self.callback(color_frame, depth_frame)<\/code> চালু করে দেয়।"},{"latex":"\\[ |20.000 - 20.700| = 0.700 > 0.5, \\qquad |20.033 - 20.700| = 0.667 > 0.5 \\]","text":"এবার depth stream ধ্রুবকভাবে 0.7 s দেরিতে আসছে ধরুন। color frame 20.000 s buffer-এ জমা; depth 20.700 s এলে পার্থক্য 0.700 s — slop ছাড়িয়ে গেছে, জোড় হয় না। এরপর 30 FPS হারে পরের color frame (20.033 s) এলে queue = 1 নীতিতে পুরনো 20.000 s frame-টি বাদ পড়ে, buffer এখন 20.033 s ধরেছে — কিন্তু |20.033 − 20.700| = 0.667 s এখনও বড়। দেরিটা যদি স্থায়ী হয়, কোনো frame-জোড়ই কখনো শর্ত ছুঁতে পারে না: কোনো error message নেই, শুধু callback চলে না।"},{"latex":"\\[ T = \\frac{1}{30} \\approx 0.033\\ \\mathrm{s}, \\qquad \\frac{0.5}{0.033} \\approx 15 \\]","text":"30 FPS color stream-এ পরপর দুই frame-এর ব্যবধান T = 1/30 ≈ 0.033 s। সুতরাং slop = 0.5 s প্রায় ১৫টি frame-ব্যবধানের সমান — স্বাভাবিক কয়েক millisecond-এর jitter-এর জন্য এই tolerance বিশাল ছাতা; 0.5 বেছে নেওয়া হয়েছে নিরাপত্তার জন্য, সূক্ষ্মতার জন্য নয়।"}],"mapping":[{"code":"color_frame.header.stamp","math":"t_c","text":"Color image message-এর জন্মমুহূর্ত, সেকেন্ড এককে।"},{"code":"depth_frame.header.stamp","math":"t_d","text":"Depth image message-এর জন্মমুহূর্ত, সেকেন্ড এককে।"},{"code":"ApproximateTimeSynchronizer(..., 1, 0.5) — দ্বিতীয় argument 1","math":"q = 1","text":"প্রতি stream-এ buffer-এ শুধু একটিই frame; নতুন এলে পুরনোটি বাদ যায়।"},{"code":"ApproximateTimeSynchronizer(..., 1, 0.5) — তৃতীয় argument 0.5","math":"slop = 0.5 s","text":"জোড় হওয়ার সর্বোচ্চ অনুমোদিত timestamp-পার্থক্য।"},{"code":"self.ts.registerCallback(self.callback)","math":"|t_c - t_d| ≤ 0.5 s ⟹ callback(color_frame, depth_frame)","text":"শর্ত পূরণ হওয়া প্রতিটি জোড়ার জন্যই এই firing।"}],"failure":["slop খুব ছোট করা হলে (যেমন 0.001 s): Orbbec-এর color ও depth stream আলাদা trigger হওয়ায় জোড় প্রায় কখনোই হয় না — কোনো error ছাপা হয় না, শুধু callback চলে না, detection window খোলেই না।","slop খুব বড় করা হলে (যেমন 5 s): সত্যিই ভিন্ন মুহূর্তের দুই frame জোড়ে যেতে পারে — arm নড়ার মাঝের depth মান ভুল pixel-এর তথ্য দেয়, tag-এর 3D অবস্থান লাফিয়ে যায়, আর SPACE চেপে সেই ভুল থেকেই offset গুলো YAML-এ লেখা পড়ে।","দুই stream দুই ভিন্ন clock (যেমন একটি system clock, অন্যটি steady clock) ব্যবহার করলে |Δt| সবসময় বিশাল থাকে — slop যত বড়ই হোক, কোনো pair হয় না।","queue = 1 এবং color 30 FPS কিন্তু depth কম হারে থাকলে: বেশিরভাগ color frame জোড় না-পেয়েই পরের frame-এর কাছে বাদ পড়তে থাকে — node-এর processing rate শেষ পর্যন্ত slower stream-টির হার মেনে চলে।"]},"robot":{"correct":"Pipeline ঠিক ক্রমে চালু হলে — calibrate_arm.py দিয়ে joint zero, start_agent.sh দিয়ে /dev/myserial-এ 2,000,000 baud-এ micro-ROS bridge ওঠা, তারপর camera_arm_kin.launch.py দিয়ে Orbbec driver ও kin_srv (kin_ik_fk) চালু — এই constructor প্রথমে wait loop-এ service-এর জন্য অপেক্ষা করে, তারপর arm6_joints-এ subscriber দেখা মাত্র 6-DOF arm-কে 2000 ms সময়ে [90, 90, 0, 0, 90, 90] home pose-এ পাঠায় (ROS_DOMAIN_ID=30 একই দুনিয়ায় সব পক্ষকে রাখে)। এরপর থেকে DaBai DCW2-এর প্রতিটি মিলন্ত color+depth জোড়ায় callback চলে — detection window খোলে, FPS ছাপা হয়, আর SPACE চাপলে নতুন offset-গুলো offset_value.yaml-এ লেখা হয়।","incorrect":"start_agent.sh না চালালে get_subscription_count() কখনো nonzero হয় না — node প্রতি 0.1 s-এ নীরবে home command পাঠাতে থাকে, কোনো log নেই, window খোলে না; মনে হয় node hang করেছে। kin_srv না চালালে আগেই 'Service not available, waiting again...' loop-এ আটকে যায়। দুই camera stream-এর timestamp-পার্থক্য 0.5 s ছাড়িয়ে গেলে ros2 topic hz-এ data দেখা গেলেও কোনো জোড় হয় না — callback চলে না, calibration হওয়া অসম্ভব। আর সব ঠিক থাকলেও মনে রাখতে হবে: node চালু করার সাথে সাথেই সত্যিকারের arm home pose-এ ছুটে যাবে — arm-এর ঘেঁষে কিছু (হাত বা টেবিলের কোণ) থাকলে ধাক্কা লাগতে পারে।"},"id":"part-10","start":90,"end":130,"lang":"python","animType":"timeSync","flags":[]},{"n":11,"fname":"arm_offset.py","enTitle":"PID Controller & Command Helpers","explain":[{"a":132,"b":134,"text":"এই তিনটি লাইন শুধু comment — Python এগুলো execute করে না, কিন্তু নিচের code-এর design-intent এখানে ব্যাখ্যা করা আছে। PID মানে <b>P<\/b>roportional-<b>I<\/b>ntegral-<b>D<\/b>erivative — একটি feedback control algorithm, যেটা এই stack-এ robot base-কে AprilTag টার্গেটের দিকে এমনভাবে এগিয়ে দেওয়ার কথা যেন নির্দিষ্ট দূরত্বে পৌঁছে থেমে যায়, overshoot না করে। শেষ comment লাইনটি tuning-এর মূল দর্শন বোঝায়: robot যত কাছে আসবে, error তত ছোট হবে, ফলে speed নিজে থেকেই কমে আসবে। Line 137-138-এ এই controller-এর হিসাব আসলে তৈরি হয়েছে।"},{"a":135,"b":136,"text":"দুটি state variable initialize হচ্ছে। <code>self.adjust_dist = True<\/code> একটি flag যা line 155-এ আবার <code>True<\/code>
