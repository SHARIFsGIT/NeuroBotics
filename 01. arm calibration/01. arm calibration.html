{"correct":"সব ঠিক থাকলে এই Function-টিই পুরো calibration ও grasp chain-এর প্রথম মিটার-স্কেল গণনা: Orbbec DaBai DCW2-এর <code>ApproximateTimeSynchronizer<\/code>-দিয়ে-জোড়া-লাগা color+depth frame থেকে নেওয়া AprilTag center pixel আর তার depth এখানে camera optical frame-এর একটি নির্ভুল 3D point-এ রূপ নেয়। সেটি <code>EndToCamMat<\/code> আর <code>get_kinemarics<\/code> service-এর FK উত্তর থেকে আসা <code>CurEndPos<\/code> দিয়ে base frame-এ গেলে ভালো calibration-এ প্রায় (0.145, 0, 0.04) m পাওয়ার কথা; SPACE (key 32) চাপলে তখন <code>offset_value.yaml<\/code>-এ প্রায় শূন্য offset লেখা হয়, Jetson-এর terminal-এ <code>Finish calibrate offset.<\/code> দেখা যায়, আর পরের run-এ 6-DOF arm micro-ROS serial bridge হয়ে পাঠানো command অনুযায়ী tag-এর দিকে নির্ভুলভাবে reach করে।","incorrect":"ভুল হলে ব্যর্থতা নীরব অথচ স্থায়ী: ভুল <code>fx<\/code>/<code>cx<\/code> বা depth-এর mm/m একক-গোলমালে tag-এর base-frame position সরে যায় বা হাজার গুণ ছোট/বড় হয়, কিন্তু SPACE চাপলে সেই ভুলই YAML-এ লেখা হয়ে যায় — এরপর প্রতিটি run-এ arm ধারাবাহিকভাবে ভুল জায়গায় যাবে: gripper tag-এর পাশ দিয়ে মিস করবে, উপরে-নিচে গিয়ে ধাক্কা মারবে, বা 0.0004 m-এর মতো অসম্ভব দূরত্ব দেখে জড়সড় হয়ে বসবে; Y-sign উল্টে থাকলে joint-গুলো ভুল দিকে ঘুরবে। যেহেতু arm-এর command 2,000,000 baud-এর serial bridge দিয়ে সশরীরে hardware-এ পৌঁছায়, ভুল offset শুধু পর্দার সংখ্যা হয়ে থাকে না — recovery করতে হয় <code>offset_value.yaml<\/code> ঠিক করে বা পুরো calibration আবার চালিয়ে।"},"id":"part-15","start":299,"end":307,"lang":"python","animType":"pinholeProjection","flags":[]},{"n":16,"fname":"arm_offset.py","enTitle":"Rotation Helpers & main()","explain":[{"a":309,"b":312,"text":"লাইন 309 থেকে 312 পর্যন্ত একটি comment block, যা নিচের চারটি function-কে একটি conversion toolbox হিসেবে পরিচয় করিয়ে দেয়। এখানে 3D orientation-এর তিনটি ভিন্ন representation-এর কথা বলা হয়েছে: Euler angles (roll, pitch, yaw তিনটি আলাদা angle), rotation matrix (3x3 সংখ্যার grid), আর quaternion (চার-অংশের একটি সংখ্যা-ব্যবস্থা যা gimbal lock এড়ায়)। Comment অবশ্যই execute হয় না, কিন্তু লেখকের design intent স্পষ্ট করে: একই orientation কেন তিনভাবে রাখতে হয় — কারণ কাজের ধাপ অনুযায়ী একেকটি format একেক জায়গায় সুবিধাজনক, আর এই file-এর pipeline তিনটিই ব্যবহার করে।"},{"a":314,"b":318,"text":"<code>xyz_euler_to_mat<\/code> function-টি input নেয় একটি translation <code>xyz<\/code> আর তিনটি Euler angle-এর tuple <code>euler<\/code>, আর output দেয় একটি 4x4 homogeneous matrix। Optional parameter <code>degrees=False<\/code> মানে default হিসেবে angle-গুলো radian ধরা হয়; <code>degrees=True<\/code> দিলে <code>math.radians<\/code> প্রতিটি angle-কে degree থেকে radian-এ রূপান্তর করে (যেমন 80 degree হয়ে যায় 1.3963 radian)। মূল কাজটি করে <code>tfs.euler.euler2mat<\/code> — এটি transforms3d library-র function, এই folder-এর বাইরে সংজ্ঞাত — তিনটি angle থেকে 3x3 rotation matrix বানায়। লক্ষ করুন, এই file-এ এর একটিই call site আছে: <code>compute_heigh<\/code>-এর ভেতরে <code>self.xyz_euler_to_mat(camera_location, (0, 0, 0))<\/code> — তিনটি angle-ই zero, তাই tag detection-এর পুরো pipeline-এ <code>degrees<\/code> branch-টি আসলে কখনোই execute হয় না; zero-angle Euler মানে identity rotation, অর্থাৎ সেখানে শুধু translation-ই কার্যকর থাকে।"},{"a":319,"b":320,"text":"এই দুই লাইনে <code>tfs.affines.compose<\/code> দিয়ে 3x3 rotation matrix-টিকে পূর্ণ 4x4 homogeneous transformation matrix-এ রূপ দেওয়া হয়: translation <code>xyz<\/code> বসে matrix-এর শেষ column-এ, rotation বসে উপরের-বাম 3x3 block-এ। <code>np.asarray(xyz)<\/code> Python list-কে numpy array বানায় আর <code>np.squeeze<\/code> বাড়তি single-entry dimension (যেমন shape (1,3)) সরিয়ে (3,) shape নিশ্চিত করে — না করলে <code>compose<\/code> এরর দিতে পারত। তৃতীয় argument <code>[1, 1, 1]<\/code> হলো unit scale, অর্থাৎ frame-এ কোনো stretching নেই। Return হওয়া matrix-টি পরে <code>compute_heigh<\/code>-এ <code>np.matmul(self.EndToCamMat, ...)<\/code>-এর ডান পাশে বসে camera-frame-এর point-কে end-effector frame-এ নিয়ে যায়, তাই এখানে ভুল হলে tag-এর সব পরবর্তী world position ভুল হবে।"},{"a":322,"b":323,"text":"<code>euler_to_quaternion<\/code> function-টি তিনটি Euler angle — <code>roll, pitch, yaw<\/code> — নিয়ে সেগুলোকে quaternion-এ রূপান্তর করে। কাজটি করে <code>tf.quaternion_from_euler<\/code>, যা tf_transformations package থেকে import হয়েছে (এই folder-এর বাইরে সংজ্ঞাত)। সবচেয়ে গুরুত্বপূর্ণ তথ্য: এই function return করে একটি tuple যার ক্রম <b>(x, y, z, w)<\/b> — অর্থাৎ scalar part w শেষে, যা ROS 2-এর geometry_msgs Quaternion convention-এর সাথে মেলে। এই file-এ এর একটিই call site: <code>get_end_point_mat<\/code>-এ <code>self.euler_to_quaternion(self.CurEndPos[3], self.CurEndPos[4], self.CurEndPos[5])<\/code>, যেখানে input হিসেবে আসে FK service থেকে পাওয়া end-effector-এর roll, pitch, yaw (radian-এ)।"},{"a":324,"b":328,"text":"এই পাঁচ লাইন একটি সূক্ষ্ম কিন্তু জরুরি reordering। <code>tf.quaternion_from_euler<\/code>-এর output-এ index 3 হলো w (scalar part) আর index 0, 1, 2 হলো x, y, z — তাই <code>qw = quaternion[3]<\/code>, <code>qx = quaternion[0]<\/code> ইত্যাদি লিখে ক্রমটাকে <b>w-first<\/b> বানানো হয়েছে, এবং <code>return np.array([qw, qx, qy, qz])<\/code> ঠিক সেই ক্রমেই ফেরায়। কারণটা পরের function-এ: transforms3d-র <code>quat2mat<\/code> w-first আশা করে, তাই এই reorder ছাড়া rotation নিঃশব্দে ভুল হয়ে যেত। Verified উদাহরণ: <code>CurEndPos[4] = 1.3962<\/code> rad (প্রায় 80 degree) pure pitch হলে এই function ফেরাবে q = (qw, qx, qy, qz) = (0.766, 0, 0.6428, 0) — নিচের math section-এ ধাপে ধাপে দেখানো হয়েছে। সতর্কতা: ROS 2 message-এ quaternion পাঠাতে (x, y, z, w) ক্রম লাগে, তাই এই w-first array সরাসরি message-এ বসালে ভুল হতো — এই file-এ কিন্তু সেটা করা হয়নি, শুধু matrix বানানোর কাজেই এটি ব্যবহৃত।"},{"a":330,"b":331,"text":"<code>xyz_quat_to_mat<\/code> হলো আগের function-এর জোড়া: translation <code>xyz<\/code> আর quaternion <code>quat<\/code> নিয়ে সরাসরি 4x4 matrix বানায়। <code>tfs.quaternions.quat2mat<\/code> (transforms3d library, এই folder-এর বাইরে) quaternion-কে 3x3 rotation matrix-এ রূপান্তর করে এবং এটি w-first ক্রম আশা করে — সৌভাগ্যক্রমে <code>euler_to_quaternion<\/code> ঠিক সেই ক্রমেই <code>[qw, qx, qy, qz]<\/code> ফেরায়, তাই দুটি function মিলে একটি সঙ্গতিপূর্ণ chain তৈরি করে। <code>np.asarray(quat)<\/code> list-কে numpy array-তে রূপান্তর করে library-কে দেওয়ার আগে। Call site একটিই: <code>get_end_point_mat<\/code>-এ <code>self.xyz_quat_to_mat([self.CurEndPos[0], self.CurEndPos[1], self.CurEndPos[2]], [end_w, end_x, end_y, end_z])<\/code> — অর্থাৎ arm-এর claw-এর বর্তমান position আর orientation থেকে তার 4x4 base-frame matrix।"},{"a":332,"b":333,"text":"<code>tfs.affines.compose<\/code> আবার সেই একই কাজ করে যা <code>xyz_euler_to_mat<\/code>-এ করেছিল: rotation matrix-এর সাথে translation জুড়ে 4x4 homogeneous transform বানানো, সাথে <code>[1, 1, 1]<\/code> unit scale। ফলে Euler পথ আর quaternion পথ — দুটোই একই জায়গায় একই রকম matrix-এ পৌঁছায়, দুটি আলাদা representation একই সত্য প্রকাশ করে। এই function-এ ভুল হলে <code>get_end_point_mat<\/code>-এর return value ভুল হবে, ফলে <code>compute_heigh<\/code>-এর <code>WorldPose<\/code> মানে tag-এর base-frame position ভুল হবে এবং SPACE চেপে calibration করলে <code>offset_value.yaml<\/code>-এ ভুল offset লেখা হবে।"},{"a":335,"b":336,"text":"<code>mat_to_xyz_euler<\/code> হলো বিপরীত দিকের যাত্রা: একটি 4x4 homogeneous matrix নিয়ে তাকে ভেঙে translation আর Euler angle বের করে। <code>tfs.affines.decompose<\/code> (transforms3d) একটি matrix-কে চারটি অংশে ফেরায় — translation <code>t<\/code>, rotation <code>r<\/code>, scale (zoom), shear — এবং শেষ দুটি underscore (<code>_, _<\/code>) দিয়ে বাদ দেওয়া হয়েছে, কারণ এই pipeline-এর matrix-গুলো সবসময় unit scale ও shear-free। এর একটিই call site: <code>compute_heigh<\/code>-এর শেষে <code>self.mat_to_xyz_euler(WorldPose)<\/code> — চূড়ান্ত tag pose-কে মানুষের পড়ার উপযোগী (x, y, z) আর angle-এর আকারে ফেরানোর জন্য।"},{"a":337,"b":341,"text":"<code>degrees<\/code> flag-টি এখানে output-এর unit ঠিক করে: <code>degrees=True<\/code> হলে <code>tfs.euler.mat2euler<\/code>-এর radian ফলাফল <code>np.degrees<\/code> দিয়ে degree-তে রূপান্তরিত হয়, নাহলে সরাসরি radian ফেরানো হয়। <code>mat2euler<\/code> 3x3 rotation matrix থেকে তিনটি Euler angle উল্টো বের করে — যে <code>euler2mat<\/code> দিয়ে matrix বানানো হয়েছিল তার inverse কাজ। এই file-এ call-টি default অবস্থায় অর্থাৎ radian-এ হয় (কোনো flag পাঠানো হয়নি), ফলে angle অংশ radian-এ থাকে — <code>CurEndPos<\/code>-এর pitch 1.3962 rad-এর সাথে এককতা বজায় থাকে। শেষ লাইন tuple হিসেবে <code>t, euler<\/code> ফেরায়, যার প্রথম অংশই (<code>pose_T<\/code>) callback-এ tag-এর বিশ্ব-অবস্থান হিসেবে ব্যবহৃত হয়।"},{"a":344,"b":347,"text":"<code>main()<\/code> হলো program-এর entry function — সব প্রস্তুতি শেষে execution এখান থেকেই শুরু হয়। <code>print('----------------------')<\/code> terminal-এ একটি দৃশ্যমান separator আঁকে, যাতে log-এর ভিড়ে নতুন session শুরুর জায়গাটা চোখে পড়ে (লক্ষ করুন, module-এর শুরুতে offset মান print করার পরও একই রকম একটি separator ছাপা হয়েছিল — লেখকের একই ভিজ্যুয়াল অভ্যাস)। <code>rclpy.init()<\/code> ROS 2-র global state initialize করে — এটি ছাড়া কোনো Node, publisher বা service client তৈরি করা যায় না; ROS_DOMAIN_ID 30-এর context-এ এই call-ই process-টিকে সেই domain-এর সদস্য করে তোলে।"},{"a":349,"b":350,"text":"লাইন 349-এর ছোট comment (<code># Create our AprilTag Detection Node<\/code>) ঘোষণা করে দেয় এরপর কী হতে চলেছে, আর লাইন 350-এর একটি লাইনই পুরো program-এর সবচেয়ে ভারী কাজটি করে: <code>AprilTagDetectNode('ApriltagDetect_node')<\/code> constructor ডাকলে <code>__init__<\/code>-এর ভেতরের পুরো স্তর পরপর চলে যায় — AprilTag <code>Detector<\/code> তৈরি হয়, publisher আর subscriber-গুলো বসে, তারপর <code>while not self.client.wait_for_service(timeout_sec=1.0)<\/code> loop-টি <code>get_kinemarics<\/code> service (arm_kin package-এর <code>kin_srv<\/code> executable, node name <code>kin_ik_fk<\/code>) না পাওয়া পর্যন্ত প্রতি সেকেন্ডে message লিখে অপেক্ষা করে — মানে <code>ros2 launch M3Pro_demo camera_arm_kin.launch.py<\/code> আগে চালু না থাকলে program এখানেই আটকে থাকবে। এরপর home pose publish loop arm-কে [90, 90, 0, 0, 90, 90] degree ভঙ্গিতে পাঠায় এবং camera sync callback নিবন্ধিত হয়। তৈরি object-টি <code>apriltag_detect<\/code> variable-এ রাখা হয়েছে যাতে পরের লাইনে তার method ডাকা যায়।"},{"a":352,"b":353,"text":"লাইন 352-এর comment (<code># Ask for the arm's starting position<\/code>) যা বলছে সেটাই ঘটছে: <code>get_current_end_pos()<\/code> পুরো program-এ ঠিক একবারই ডাকা হয় — <code>rclpy.spin<\/code> শুরুর আগে, তাই <code>CurEndPos<\/code> আসলে একটি startup snapshot: arm home pose-এ যাওয়ার পরের এক মুহূর্তের FK ফলাফল। মনে রাখতে হবে, request-এ শুধু <code>request.cur_joint1<\/code> set করা হয় (line 181) এবং line 182 আক্ষরিকভাবে একটি comment — বাকি joint-গুলোর মান service definition-এর default (এই folder-এর বাইরে) যা-ই হোক, ফেরত আসা (x, y, z, roll, pitch, yaw) সেই default-এর উপর নির্ভরশীল। Call-টি asynchronous (<code>call_async<\/code> + <code>add_done_callback<\/code>), তাই উত্তরটি <code>get_fk_respone_callback<\/code> থেকে পরে <code>CurEndPos<\/code>-এ বসবে; arm এরপর নড়লেও এই মান আর কখনো আপডেট হয় না — tag-এর base-frame গণনা চিরকাল এই একটি snapshot-এর উপর দাঁড়িয়ে থাকে।"},{"a":355,"b":356,"text":"লাইন 355-এর comment (<code># Keep the node running forever until you press Ctrl+C<\/code>) ঠিক যা বলে তাই করে: <code>rclpy.spin(apriltag_detect)<\/code> node-টিকে জীবিত রাখে: এটি একটি অসীম blocking loop যা executor-কে নতুন message, service response আর event handle করতে দেয় — camera callback, FK response callback, <code>grasp_done<\/code> subscription সবই এই loop-এর ভেতরে চলে। Ctrl+C (SIGINT) চাপলে spin ব্যাহত হয়ে process শেষ হয়। দুটি সতর্কতা: প্রথমত, এখানে কোনো explicit cleanup নেই — <code>destroy_node()<\/code> বা <code>rclpy.shutdown()<\/code> call করা হয়নি, তাই বন্ধ হওয়ার সময় terminal-এ rclpy-র default handler-ই কাজ করবে, warning দেখা যেতে পারে। দ্বিতীয়ত, এই লাইনটিই file-এর শেষ লাইন — কোনো <code>if __name__ == '__main__': main()<\/code> guard নেই; তবুও <code>ros2 run M3Pro_demo arm_offset<\/code> কাজ করে, কারণ executable-টি package-এর entry point configuration (setup, এই folder-এর বাইরে) থেকে এই <code>main()<\/code>-কেই ডাকে — সেই configuration এই folder-এ দেখা যাচ্ছে না।"}],"math":{"intro":"এই অংশের চারটি function একটি সাধারণ 2D rotation ধারণা থেকে শুরু করে 4x4 homogeneous transform পর্যন্ত একটি পূর্ণ সিঁড়ি ব্যবহার করে। নিচে Level 1 থেকে Level 6 পর্যন্ত derivation-এর অগ্রগতি দেওয়া হলো: প্রথমে 2D rotation matrix, তারপর তিনটি 3D elementary rotation, তারপর Euler composition R = Rz Ry Rx, এরপর quaternion-এর সংজ্ঞা, quaternion থেকে rotation matrix, এবং সবশেষে homogeneous transform ও তার বিপরীত decompose। প্রতিটি চিহ্ন কোন code identifier-এর সাথে মিলে তা mapping অংশে দেখানো হয়েছে, আর numeric অংশে এই project-এর নিজের মান (pitch = 1.3962 rad) দিয়ে হিসাব করা হয়েছে।","levels":[{"label":"Level 1: 2D rotation matrix","latex":"\\[ R(\\theta)=\\begin{bmatrix}\\cos\\theta & -\\sin\\theta \\\\ \\sin\\theta & \\cos\\theta\\end{bmatrix} \\]","text":"plane-এ কোনো vector-কে মূলবিন্দুর চারদিকে ঘড়ির কাঁটার বিপরীত দিকে θ কোণে ঘোরানোর matrix। দুটি column আসলে দুটি প্রশ্নের উত্তর: ঘোরানোর পর পুরোনো x-axis আর y-axis এখন কোথায় — তাদের cos আর sin জোড়াই column ভরে। 3D-র সব formula এই একই cos/sin জোড়ের বিস্তার মাত্র; <code>tfs.euler.euler2mat<\/code>-এর প্রতিটি element-এর উৎস এখানেই।"},{"label":"Level 2: 3D elementary rotations","latex":"\\[ R_x(\\phi)=\\begin{bmatrix}1&0&0\\\\0&\\cos\\phi&-\\sin\\phi\\\\0&\\sin\\phi&\\cos\\phi\\end{bmatrix}\\quad R_y(\\theta)=\\begin{bmatrix}\\cos\\theta&0&\\sin\\theta\\\\0&1&0\\\\-\\sin\\theta&0&\\cos\\theta\\end{bmatrix}\\quad R_z(\\psi)=\\begin{bmatrix}\\cos\\psi&-\\sin\\psi&0\\\\\\sin\\psi&\\cos\\psi&0\\\\0&0&1\\end{bmatrix} \\]","text":"3D-তে একবারে একটি নির্দিষ্ট অক্ষের চারদিকে ঘোরানো হয়: φ হলো x-axis-এর চারদিকে roll, θ হলো y-axis-এর চারদিকে pitch, ψ হলো z-axis-এর চারদিকে yaw। <code>euler2mat<\/code>-এর তিনটি input <code>euler[0], euler[1], euler[2]<\/code> যথাক্রমে এই φ, θ, ψ। খেয়াল করুন <code>R_y<\/code>-এর চেহারা <code>R_x<\/code> আর <code>R_z<\/code>-এর থেকে সামান্য আলাদা — sin-দের জায়গা উল্টো কোণায় বসেছে; y-axis rotation-এর প্রচলিত সাইন-নিয়ম এটাই, আর এই sign একবার ভুল হলে camera-র দিগংশ উল্টে যায়।"},{"label":"Level 3: Euler composition R = Rz Ry Rx","latex":"\\[ R=R_z(\\psi)\\,R_y(\\theta)\\,R_x(\\phi)=\\begin{bmatrix}\\cos\\psi\\cos\\theta & \\cos\\psi\\sin\\theta\\sin\\phi-\\sin\\psi\\cos\\phi & \\cos\\psi\\sin\\theta\\cos\\phi+\\sin\\psi\\sin\\phi\\\\ \\sin\\psi\\cos\\theta & \\sin\\psi\\sin\\theta\\sin\\phi+\\cos\\psi\\cos\\phi & \\sin\\psi\\sin\\theta\\cos\\phi-\\cos\\psi\\sin\\phi\\\\ -\\sin\\theta & \\cos\\theta\\sin\\phi & \\cos\\theta\\cos\\phi\\end{bmatrix} \\]","text":"transforms3d-র default axes convention হলো extrinsic X-Y-Z ('sxyz') — মানে তিনটি rotation জোড়া লাগানো হয় R = Rz·Ry·Rx ক্রমে, আর ম্যাট্রিক্স গুণনে ডান দিকেরটা আগে প্রযোজ্য, তাই আগে x-axis ঘোরে, তারপর y, সবশেষে z। এই 9টি element-ই <code>euler2mat<\/code> হিসাব করে এবং <code>mat2euler<\/code> উল্টো পথে এদের থেকে φ, θ, ψ ফেরায়। বিপদ: θ যদি ±90 degree-র দিকে যায় তবে cosθ প্রায় শূন্য হয়ে প্রথম column-এর উপরের দুটি element শূন্যমুখী হয়, ফলে φ আর ψ আর আলাদা করা যায় না — এই অবস্থাই gimbal lock, আর এটা এড়াতেই quaternion রাখা হয়েছে।"},{"label":"Level 4: quaternion-এর সংজ্ঞা","latex":"\\[ q=\\cos\\frac{\\theta}{2}+\\sin\\frac{\\theta}{2}\\,(u_x\\mathbf{i}+u_y\\mathbf{j}+u_z\\mathbf{k})=(w,x,y,z),\\quad w=\\cos\\frac{\\theta}{2},\\ (x,y,z)=\\sin\\frac{\\theta}{2}\\,(u_x,u_y,u_z) \\]","text":"Euler-এর rotation theorem বলে, 3D-র যেকোনো rotation-কে একটি একক axis (u<sub>x<\/sub>, u<sub>y<\/sub>, u<sub>z<\/sub>) আর একটি একক angle θ দিয়ে প্রকাশ করা যায়। Quaternion সেই axis-angle জোড়াকে চারটি সংখ্যায় গুটিয়ে রাখে: scalar part w = cos(θ/2), vector part = sin(θ/2) গুণ axis। কোনো তিন-ক্রম নির্ভরতা নেই বলে pitch যতই 90 degree-র কাছে যাক, quaternion তখনও ভালোভাবে সংজ্ঞাত থাকে — gimbal lock হয় না। <code>tf.quaternion_from_euler<\/code> Euler থেকে এই q বানিয়ে (x, y, z, w) ক্রমে ফেরায়।"},{"label":"Level 5: quaternion থেকে rotation matrix","latex":"\\[ R(q)=\\begin{bmatrix}1-2(y^2+z^2) & 2(xy-wz) & 2(xz+wy)\\\\ 2(xy+wz) & 1-2(x^2+z^2) & 2(yz-wx)\\\\ 2(xz-wy) & 2(yz+wx) & 1-2(x^2+y^2)\\end{bmatrix} \\]","text":"এই সূত্র অনুসরণ করে <code>tfs.quaternions.quat2mat<\/code> quaternion-কে 3x3 rotation matrix-এ রূপান্তর করে, এবং এটি w-first ক্রম (w, x, y, z) ধরে হিসাব করে — ঠিক এজন্যই <code>euler_to_quaternion<\/code> ক্রম সাজিয়ে ফেরায়। শর্ত হলো q অবশ্যই unit quaternion (চার অংশের বর্গের যোগফল 1)। লক্ষণীয়, সূত্রে কোণের cos/sin সরাসরি নেই — অর্ধ-কোণের cos/sin ঘুরেফিরে ঠিক Level 3-এর element-দের মতোই মান দেয়, নিচের numeric উদাহরণে সেটাই মিলিয়ে দেখানো হয়েছে।"},{"label":"Level 6: homogeneous transform ও decompose","latex":"\\[ T=\\begin{bmatrix}R & t\\\\ 0 & 1\\end{bmatrix},\\quad \\mathrm{decompose}(T)=(t,R,Z,S),\\quad \\phi=\\operatorname{atan2}(r_{21},r_{22}),\\ \\theta=\\arcsin(-r_{20}),\\ \\psi=\\operatorname{atan2}(r_{10},r_{00}) \\]","text":"rotation আর translation একসাথে রাখতে 4x4 homogeneous transform ব্যবহৃত হয়: উপরের-বাম 3x3 block-এ R, শেষ column-এ t, শেষ row-এ (0 0 0 1)। <code>tfs.affines.compose(np.squeeze(np.asarray(xyz)), mat, [1, 1, 1])<\/code> ঠিক এই T-ই বানায়, scale identity রেখে। উল্টো দিকে <code>tfs.affines.decompose<\/code> থেকে translation <code>t<\/code> আর rotation <code>r<\/code> বের হয় (shear আর scale এই pipeline-এ বাদ), আর <code>tfs.euler.mat2euler<\/code> ডান দিকের তিনটি সূত্রে r-এর element থেকে তিনটি angle ফেরায়।"}],"numeric":[{"latex":"\\[ 80^\\circ\\times\\frac{\\pi}{180^\\circ}=1.3963\\ \\mathrm{rad},\\qquad R_y(1.3962)=\\begin{bmatrix}\\cos 1.3962&0&\\sin 1.3962\\\\0&1&0\\\\-\\sin 1.3962&0&\\cos 1.3962\\end{bmatrix}=\\begin{bmatrix}0.1737&0&0.9848\\\\0&1&0\\\\-0.9848&0&0.1737\\end{bmatrix} \\]","text":"FK snapshot-এর pitch <code>CurEndPos[4] = 1.3962<\/code> rad, যা প্রায় 80.0 degree — <code>degrees<\/code> flag দিয়ে আনতে চাইলে <code>math.radians(80)<\/code> মান 1.3963 আসত। ক্যালকুলেটরে cos(1.3962) = 0.1737 আর sin(1.3962) = 0.9848 (1.3962 rad ঠিক 80 degree-এর চেয়ে সামান্য কম বলে cos-এর চতুর্থ দশমিক 80°-এর মান 0.1736 থেকে এক ঘর এগিয়ে); Level 2-এর eneous transform, scale identity রেখে।"},{"code":"<code>tf.quaternion_from_euler(roll, pitch, yaw)<\/code>","math":"\\( q=\\cos\\frac{\\theta}{2}+\\sin\\frac{\\theta}{2}\\,(u_x\\mathbf{i}+u_y\\mathbf{j}+u_z\\mathbf{k}) \\)","text":"Euler থেকে quaternion; return ক্রম (x, y, z, w) — w শেষে।"},{"code":"<code>qw = quaternion[3]<\/code> থেকে <code>return np.array([qw, qx, qy, qz])<\/code>","math":"\\( (x,y,z,w)\\rightarrow(w,x,y,z) \\)","text":"index সরিয়ে ক্রম w-first করা; transforms3d এই ক্রমই চায়।"},{"code":"<code>tfs.quaternions.quat2mat(np.asarray(quat))<\/code>","math":"\\( R(q):\\ R_{00}=1-2(y^2+z^2),\\ \\ldots \\)","text":"unit quaternion (w-first) থেকে 3x3 rotation matrix, Level 5-এর সূত্র মেনে।"},{"code":"<code>t, r, _, _ = tfs.affines.decompose(mat)<\/code>","math":"\\( \\mathrm{decompose}(T)=(t,R,Z,S) \\)","text":"4x4 matrix ভেঙে translation, rotation, scale (Z), shear (S); শেষ দুটি underscore দিয়ে বাদ।"},{"code":"<code>np.degrees(tfs.euler.mat2euler(r))<\/code>","math":"\\( \\theta_{\\mathrm{deg}}=\\theta_{\\mathrm{rad}}\\times\\frac{180^\\circ}{\\pi} \\)","text":"radian Euler-কে degree-তে রূপান্তর; <code>degrees=True<\/code> হলেই এটি চালু হয়।"}],"failure":["quaternion ক্রমের ভুল: <code>tf.quaternion_from_euler<\/code>-এর (x, y, z, w) output-কে সরাসরি w-first ভেবে <code>quat2mat<\/code>-এ পাঠালে rotation ভুল হবে — ঠিক এটাই এড়াতে lines 324-328-এর reordering আছে। এই ভুল হলে tag-এর base-frame position ভুল দিকে ঘুরে যাবে, SPACE চেপে calibration করলে <code>offset_value.yaml<\/code>-এ বড় ভুল offset লেখা হবে এবং পরের grasp কয়েক সেন্টিমিটার মিস করবে — terminal-এ কোনো error-ই দেখা যাবে না।","degree আর radian-এর গোলমাল: <code>degrees=True<\/code> ছাড়া 80-এর মতো degree মান পাঠালে <code>euler2mat<\/code> সেটাকে 80 radian ধরে নেবে — প্রায় 12.7 পূর্ণ ঘূর্ণন — ফলে এলোমেলো rotation তৈরি হবে। উল্টো দিকে <code>np.degrees<\/code> না দিয়ে degree আশা করলে মান ভুল হবে।","gimbal lock: pitch (θ) ±90 degree-র খুব কাছে গেলে cosθ প্রায় শূন্য হয়ে <code>mat2euler<\/code>-এর /* ---------------- utilities ---------------- */
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const pad2 = n => String(n).padStart(2, '0');

/* ---------------- syntax highlighting (presentation-only) --------
   A single-pass scanner over the RAW line that groups characters into
   tokens and only afterwards escapes them. The underlying text is
   never altered — spans are purely cosmetic.                        */
const PY_KW = new Set(['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield']);
const PY_BLT = new Set(['print','input','range','float','int','str','len','open','sorted','super','set','list','dict','type','abs','min','max','round','enumerate','isinstance','self']);
const SH_KW = new Set(['if','then','else','elif','fi','for','while','do','done','case','esac','function','export','return','in','local']);
const SH_CMD = new Set(['docker','ros2','gnome-terminal','bash','sh','python3','sleep','source','export','echo','cat','run','launch','pub','topic','start','stop','exec']);

function tokenizeLine(line, lang) {
  if (lang === 'text') return line === '' ? [] : [{ t: line, c: '' }];
  const toks = [];
  const push = (t, c) => { if (t) toks.push({ t: t, c: c }); };
  let i = 0;
  const n = line.length;
  while (i < n) {
    const c = line[i];
    if (c === '#') { push(line.slice(i), 'com'); break; }
    if (c === '\'' || c === '"') {
      let j = i + 1;
      while (j < n && line[j] !== c) j++;
      const end = Math.min(j + 1, n);
      push(line.slice(i, end), 'str');
      i = end; continue;
    }
    if (/[0-9]/.test(c) && !(i > 0 && /[A-Za-z0-9_]/.test(line[i - 1]))) {
      let j = i;
      while (j < n && /[0-9a-fA-FxXoObB._]/.test(line[j])) j++;
      push(line.slice(i, j), 'num');
      i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i;
      while (j < n && /[A-Za-z0-9_]/.test(line[j])) j++;
      const word = line.slice(i, j);
      if (/^[fFrRbBuU]{1,2}$/.test(word) && j < n && (line[j] === '\'' || line[j] === '"')) {
        const q = line[j];
        let k = j + 1;
        while (k < n && line[k] !== q) k++;
        const end = Math.min(k + 1, n);
        push(line.slice(i, end), 'str');
        i = end; continue;
      }
      let cls = '';
      const KW = lang === 'python' ? PY_KW : SH_KW;
      const BLT = lang === 'python' ? PY_BLT : SH_CMD;
      if (KW.has(word)) cls = 'kw';
      else if (BLT.has(word)) cls = 'blt';
      else if (lang === 'python' && j < n && line[j] === '(') cls = 'fn';
      push(word, cls);
      i = j; continue;
    }
    let j = i;
    while (j < n && !/[#'"0-9A-Za-z_]/.test(line[j])) j++;
    if (j === i) j = i + 1;
    push(line.slice(i, j), '');
    i = j;
  }
  return toks;
}
function hl(line, lang) {
  if (line === '') return '';
  return tokenizeLine(line, lang).map(t =>
    t.c ? '<span class="tok-' + t.c + '">' + escHtml(t.t) + '</span>' : escHtml(t.t)
  ).join('');
}
function rawLines(fname, a, b) {
  return FILEDATA[fname].slice(a - 1, b);
}

function codeCard(p) {
  const lines = rawLines(p.fname, p.start, p.end);
  const rows = lines.map((ln, i) => {
    const no = p.start + i;
    return '<div class="cl"><span class="cln">' + no + '</span><span class="clc">' + hl(ln, p.lang) + '</span></div>';
  }).join('');
  const raw = lines.join('\n');
  return '' +
  '<div class="code-card" data-copy-src="' + p.id + '">' +
    '<div class="code-card-head">' +
      '<span class="dots"><i></i><i></i><i></i></span>' +
      '<span class="code-fname">' + escHtml(p.fname) + '</span>' +
      '<button class="copy-btn" data-copy="' + p.id + '">Copy</button>' +
      '<span class="code-lines-chip">L' + p.start + (p.end > p.start ? '–' + p.end : '') + '</span>' +
    '</div>' +
    '<div class="code-scroll"><pre class="code"><code>' + rows + '</code></pre></div>' +
  '</div>';
}

function explainBlock(p) {
  if (!p.explain || !p.explain.length) return '';
  const entries = p.explain.map(e => {
    const snippetLines = rawLines(p.fname, e.a, e.b);
    const rendered = snippetLines.map(ln => hl(ln, p.lang)).join('\n');
    const label = e.a === e.b ? ('L ' + e.a) : ('L ' + e.a + '–' + e.b);
    return '' +
    '<div class="ex-entry">' +
      '<div class="ex-snippet"><span class="ex-lines">' + label + '</span>' +
        '<pre>' + rendered + '</pre></div>' +
      '<div class="ex-arrow">↓</div>' +
      '<div class="ex-text bn">' + e.text + '</div>' +
    '</div>';
  }).join('');
  return '' +
  '<div class="sec sec-ex">' +
    '<div class="sec-head"><span class="badge badge-ex">EX</span><h3>Line-by-Line Explanation</h3></div>' +
    '<div class="sec-body">' + entries + '</div>' +
  '</div>';
}

  return html;

function fallbackCopy(txt, done) {

  ta.value = txt;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { /* noop */ }
  document.body.removeChild(ta);
}

}
function setupMathJaxWatchdog() {
  window.__mathFailed = false;
  const s = document.getElementById('Mathjax-script');
  if (s) s.addEventListener('error', () => { window.__mathFailed = true; });

/* ================================================================
   ANIMATION SYSTEM
   Engine: cancellable, speed-scaled, pause-aware rAF scheduler.
   Every animation renders inline SVG, updates a live Bangla caption
   and a live formula bar. No animation libraries are used.
   ================================================================ */

const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBounce = t => {
  const n1 = 7.5625, d1 = 2.75;
  if (t < 1 / d1) return n1 * t * t;
  if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + .75;
  if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + .9375;
  return n1 * (t -= 2.625 / d1) * t + .984375;
};
const fmt = (v, d) => Number(v).toFixed(d === undefined ? 3 : d);

/* ---------------- small SVG string helpers ---------------- */
function rrect(x, y, w, h, rx, fill, stroke, extra) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
    '" rx="' + (rx === undefined ? 8 : rx) + '" fill="' + fill + '"' +
    (stroke ? ' stroke="' + stroke + '" stroke-width="1"' : '') +
    (extra || '') + '/>';
}
function txt(x, y, s, o) {
  o = o || {};
  return '<text' + (o.id ? ' id="' + o.id + '"' : '') + ' x="' + x + '" y="' + y + '" fill="' + (o.fill || '#c9d1d9') +
    '" font-size="' + (o.size || 13) + '"' +
    ' font-family="' + (o.mono ? "'JetBrains Mono',monospace" : "'Hind Siliguri','Inter',sans-serif") + '"' +
    (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') +
    (o.weight ? ' font-weight="' + o.weight + '"' : '') +
    (o.op !== undefined ? ' opacity="' + o.op + '"' : '') + '>' + s + '</text>';
}
function line(x1, y1, x2, y2, stroke, w, extra) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
    '" stroke="' + stroke + '" stroke-width="' + (w || 1.5) + '"' +
    (extra || '') + '/>';
}
function circ(x, y, r, fill, extra) {
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill + '"' + (extra || '') + '/>';
}
function arrow(x1, y1, x2, y2, color, marker, w) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
    '" stroke="' + color + '" stroke-width="' + (w || 2) +
    '" marker-end="url(#' + marker + ')"' + '/>';
}
function path(d, stroke, w, extra) {
  return '<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '/>';
}

/* ---------------- host ---------------- */
function createAnimHost(part) {
  const id = part.id;
  const host = {
    part: part,
    stageEl: document.getElementById('stage-' + id),
    capEl: document.getElementById('cap-' + id),
    fxEl: document.getElementById('fx-' + id),
    stateEl: document.getElementById('state-' + id),
    secEl: document.getElementById('anim-' + id),
    speed: 1, running: false, stopFlag: false, started: false,
    staticOnly: false, inView: false, autoPaused: false, userPaused: false,
    _raf: null
  };
  host.setStage = function (inner, w, h) {
    host.stageEl.innerHTML = '<svg viewBox="0 0 ' + (w || 900) + ' ' + (h || 460) +
      '" preserveAspectRatio="xMidYMid meet" role="img">' + inner + '</svg>';
    return host.stageEl.querySelector('svg');
  };
  host.caption = t => { host.capEl.innerHTML = t; };
  host.formula = t => { host.fxEl.innerHTML = t; };
  host.setState = t => { host.stateEl.textContent = t; };
  host._sched = function (dur, onFrame) {
    return new Promise((res, rej) => {
      let elapsed = 0, last = null;
      const step = t => {
        if (host.stopFlag) { rej(new Error('anim-stopped')); return; }
        if (!host.running) { last = null; host._raf = requestAnimationFrame(step); return; }
        if (last === null) last = t;
        elapsed += t - last; last = t;
        const k = Math.min(1, elapsed / (dur / host.speed));
        try { onFrame(k, elapsed); } catch (e) { rej(e); return; }
        if (k >= 1) { res(); return; }
        host._raf = requestAnimationFrame(step);
      };
      host._raf = requestAnimationFrame(step);
    });
  };
  host.sleep = ms => host._sched(ms, () => {});
  host.tween = (dur, fn) => host._sched(dur, k => fn(k));
  host.start = function (speed) {
    if (speed) host.speed = speed;
    if (host.started) { host.stopFlag = true; }
    host.started = true; host.stopFlag = false; host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
    setTimeout(() => {
      ANIMS[part.animType](host).catch(e => {
        if (e && e.message === 'anim-stopped') host.setState('STOPPED');
        else console.error('anim error', part.id, e);
      });
    }, 30);
  };
  host.pause = function () {
    if (!host.started) return;
    host.running = false; host.userPaused = true;
    host.setState('PAUSED');
  };
  host.resume = function () {
    if (!host.started || !host.userPaused) return;
    host.running = true; host.userPaused = false;
    host.setState('RUN ' + host.speed + 'x');
  };
  host.stop = function () {
    host.stopFlag = true; host.running = false; host.started = false; host.userPaused = false;
    if (host._raf) cancelAnimationFrame(host._raf);
    host.setState('IDLE');
    host.renderStatic();
  };
  host.renderStatic = function () {
    host.staticOnly = true;
    try { ANIMS[part.animType](host); } catch (e) { /* static render is best-effort */ }
    host.staticOnly = false;
  };
  host.setSpeed = function (s) {
    host.speed = s;
    if (!host.started) { host.start(s); return; }
    if (host.userPaused) { host.running = true; host.userPaused = false; }
    host.setState('RUN ' + s + 'x');
  };
  /* controls */
  host.secEl.querySelectorAll('.ac-btn').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.ac;
      host.secEl.querySelectorAll('.ac-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if (a === 'play') host.userPaused ? host.resume() : host.start(1);
      else if (a === 'slow') host.setSpeed(0.5);
      else if (a === 'fast') host.setSpeed(1.5);
      else if (a === 'pause') host.pause();
      else if (a === 'stop') { host.stop(); b.classList.remove('active'); }
    });
  });
  /* auto start / auto pause with visibility */
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      host.inView = en.isIntersecting;
      if (en.isIntersecting) {
        if (host.autoPaused && host.started) {
          host.running = true; host.autoPaused = false; host.setState('RUN ' + host.speed + 'x');
        } else if (!host.started && !host.autoStarted && !window.__prefersReducedMotion) {
          host.autoStarted = true; host.start(1);
        }
      } else if (host.started && host.running) {
        host.running = false; host.autoPaused = true; host.setState('HOLD');
      }
    });
  }, { threshold: 0.25 });
  io.observe(host.secEl);
  return host;
}

const ANIMS = {};
const HOSTS = {};

function setupAnimations() {
  window.__prefersReducedMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  PARTS.forEach(p => {
    if (p.animType && ANIMS[p.animType]) {
      HOSTS[p.id] = createAnimHost(p);
      HOSTS[p.id].renderStatic();
    }
  });
}

    txt(690, 40, '6-DOF Arm — Torque', { anchor: 'middle', size: 11, fill: '#5b6875', mono: 1 }) +

    '<g id="tc-arm" transform="translate(600,380)">' +
      rrect(-70, -12, 140, 26, 6, 'url(#gMetal)') +
      '<path id="tc-s1" d="" stroke="url(#gMetalH)" stroke-width="16" stroke-linecap="round" fill="none"/>' +
      '<path id="tc-s2" d="" stroke="url(#gMetalH)" stroke-width="12" stroke-linecap="round" fill="none"/>' +
      '<path id="tc-s3" d="" stroke="url(#gMetalH)" stroke-width="9" stroke-linecap="round" fill="none"/>' +
      '<path id="tc-claw" d="" stroke="#8f98a3" stroke-width="4.5" fill="none"/>' +
      circ(0, 0, 17, 'url(#gJoint)', ' stroke="#3a2c14" stroke-width="2.5"') +
      '<circle id="tc-j2" r="13" fill="url(#gJoint)" stroke="#3a2c14" stroke-width="2"/>' +
      '<circle id="tc-j3" r="10" fill="url(#gJoint)" stroke="#3a2c14" stroke-width="2"/>' +
      '<circle id="tc-glow" r="60" fill="url(#gGlowO)" opacity="0"/>' +
    '</g>' +
    /* hand push arrow */
    '<g id="tc-hand" opacity="0">' +
      arrow(812, 150, 742, 150, '#ffb454', 'mArrO', 4) +
      txt(826, 154, 'hand', { size: 11, fill: '#ffb454' }) +
    '</g>' +
    /* torque badge */
    '<g id="tc-badge">' +
      rrect(640, 84, 150, 34, 17, '#15130d', '#3a3524') +
      txt(715, 106, 'TORQUE ?', { anchor: 'middle', size: 13, fill: '#d8c97a', mono: 1, weight: 700 }) +
    '</g>';
  host.setStage(stage, 900, 460);
  if (host.staticOnly) { host.caption('Play চাপলে serial handshake আর torque ON/OFF-এর প্রভাব দেখা যাবে।'); return; }
  const $ = s => host.stageEl.querySelector(s);
  const A = { a1: -1.15, a2: 1.05, a3: 0.55 };
  function drawArm() {
    const L = [95, 78, 58];
    let x = 0, y = 0, ang = A.a1;
    const pts = [[x, y]];
    for (let i = 0; i < 3; i++) {
      ang += (i === 0 ? 0 : A['a' + (i + 1)]);
      x += Math.cos(ang) * L[i]; y += Math.sin(ang) * L[i];
      pts.push([x, y]);
    }
    $('#tc-s1').setAttribute('d', 'M ' + pts[0][0] + ' ' + pts[0][1] + ' L ' + pts[1][0] + ' ' + pts[1][1]);
    $('#tc-s2').setAttribute('d', 'M ' + pts[1][0] + ' ' + pts[1][1] + ' L ' + pts[2][0] + ' ' + pts[2][1]);
    $('#tc-s3').setAttribute('d', 'M ' + pts[2][0] + ' ' + pts[2][1] + ' L ' + pts[3][0] + ' ' + pts[3][1]);
    $('#tc-claw').setAttribute('d', 'M ' + pts[3][0] + ' ' + pts[3][1] + ' l 10 12 M ' + pts[3][0] + ' ' + pts[3][1] + ' l -10 12');
    $('#tc-j2').setAttribute('cx', pts[1][0]); $('#tc-j2').setAttribute('cy', pts[1][1]);
    $('#tc-j3').setAttribute('cx', pts[2][0]); $('#tc-j3').setAttribute('cy', pts[2][1]);
    $('#tc-glow').setAttribute('cx', pts[3][0]); $('#tc-glow').setAttribute('cy', pts[3][1]);
    return pts[3];
  }
  drawArm();
  async function byteStream(from, to, labels, color) {
    const g = $('#tc-bytes');
    g.innerHTML = labels.map((lb, i) =>
      '<text x="' + from.x + '" y="' + from.y + '" font-size="10" font-family="\'JetBrains Mono\',monospace" fill="' + color + '" data-bt="' + i + '">' + lb + '</text>'
    ).join('');
    const els = g.querySelectorAll('text');
    await host.tween(1300, k => {
      const e = easeInOutCubic(k);
      els.forEach((el, i) => {
        const kk = Math.max(0, Math.min(1, e * 1.25 - i * 0.06));
        el.setAttribute('x', from.x + (to.x - from.x) * kk);
        el.setAttribute('y', from.y + (to.y - from.y) * kk - Math.sin(kk * Math.PI) * 16);
        el.setAttribute('opacity', kk > 0 && kk < 1 ? 1 : (kk >= 1 ? 0.9 : 0));
      });
    });
  }
  const log = (sel, s) => host.stageEl.querySelector(sel).textContent = s;

  while (true) {
    /* version handshake */
    host.caption('<code>bot = MicroROS_Robot(debug=False)</code> object তৈরির পর <code>read_version()</code> দিয়ে board-কে handshake — সerial link বেঁচে আছে কি না যাচাই।');
    host.formula('request → <span class="fx-hl">0x01 VER</span> · response ← <span class="fx-ok">fw version</span>');
    await byteStream({ x: 178, y: 124 }, { x: 316, y: 198 }, ['0x01', 'VER'], '#4fc3f7');
    await byteStream({ x: 316, y: 212 }, { x: 178, y: 138 }, ['v1.2'], '#7ee787');
    log('#tc-log1', 'version: v1.2');
    log('#tc-log2', '');
    await host.sleep(900);

    /* torque ON */
    host.caption('<code>bot.set_arm_torque(1)</code> — motor-এ power ON, সব joint lock হয়ে যায়; হাতে ঠেললেও নড়বে না। <code>time.sleep(.5)</code> দিয়ে lock হওয়ার সময় দেওয়া হয়।');
    host.formula('set_arm_torque(<span class="fx-ok">1</span>)  →  motors energized');
    await byteStream({ x: 178, y: 124 }, { x: 316, y: 198 }, ['0x02', '01'], '#ffb454');
    $('#tc-badge').querySelector('text').textContent = 'TORQUE ON';
    $('#tc-badge').querySelector('rect').setAttribute('stroke', '#7ee787');
    $('#tc-badge').querySelector('text').setAttribute('fill', '#7ee787');
    await host.tween(500, k => $('#tc-glow').setAttribute('opacity', 0.5 * k));
    await host.sleep(700);
    $('#tc-hand').setAttribute('opacity', 1);
    await host.tween(600, k => {
      const w = Math.sin(k * Math.PI) * 10;
      A.a2 = 1.05 + w * 0.004;
      drawArm();
    });
    host.caption('Torque ON অবস্থায় hand push — arm প্রায় নড়েই না; motor-গুলো নিজের position hold করে।');
    host.formula('holding torque &gt; external push → position stable');
    await host.sleep(1000);
    $('#tc-hand').setAttribute('opacity', 0);

    /* torque OFF */
    host.caption('<code>bot.set_arm_torque(0)</code> — motor floppy, এখন হাত দিয়ে arm-কে physical zero position-এ সাজানো যাবে।');
    host.formula('set_arm_torque(<span class="fx-warn">0</span>)  →  motors released');
    await byteStream({ x: 178, y: 124 }, { x: 316, y: 198 }, ['0x02', '00'], '#ffb454');
    $('#tc-badge').querySelector('text').textContent = 'TORQUE OFF';
    $('#tc-badge').querySelector('text').setAttribute('fill', '#f85149');
    $('#tc-badge').querySelector('rect').setAttribute('stroke', '#5a2b28');
    await host.tween(500, k => $('#tc-glow').setAttribute('opacity', 0.5 * (1 - k)));
    await host.tween(1600, k => {
      const e = easeOutBounce(k);
      A.a1 = -1.15 + 0.35 * e; A.a2 = 1.05 - 0.55 * e; A.a3 = 0.55 - 0.2 * e;
      drawArm();
    });
    host.caption('Torque OFF-এ gravity droop — arm নিজের ভারে ঝুলে যায়; এখন hand-এর চাপে সহজেই বাঁকানো যায় (পরের Part-এ দেখা যাবে)।');
    $('#tc-hand').setAttribute('opacity', 1);
    await host.tween(900, k => {
      const e = easeInOutCubic(Math.min(1, k * 1.6));
      A.a2 = 0.5 - 0.4 * e;
      drawArm();
    });
    await host.sleep(1100);
    $('#tc-hand').setAttribute('opacity', 0);
    /* restore */
    await host.tween(700, k => {
      A.a1 = -0.8 + (-1.15 + 0.8) * k; A.a2 = 0.1 + (1.05 - 0.1) * k; A.a3 = 0.35 + (0.55 - 0.35) * k;
      drawArm();
    });
    log('#tc-log1', ''); log('#tc-log2', '');
  }
};

  while (true) {

    host.caption('Operator arm-কে হাতে করে perfect zero position-এ আনল — <code>input()</code> এখন block অবস্থায় wait করছে।');
    host.formula('adjust = input("Input y for end of adjusting:")');

    const keys = ['n', '7', 'Q'];
    for (const key of keys) {
      const t = $('#zc-typed');
      host.caption("যেকোনো key চাপলেই চলবে — কারণ <code>'Y'</code> নিজে একটা truthy string, তাই <code>or</code>-এর ডান পাশ সবসময় True। <code>'" + key + "'</code> চাপা হলো…");
      await host.tween(240, k => t.textContent = key.slice(0, Math.ceil(k * key.length)));
      host.formula("adjust = '" + key + "'  →  ('" + key + "'=='y') or 'Y'  →  <span class='fx-warn'>False or truthy = True</span>");
      await host.sleep(820);
    }
    $('#zc-typed').textContent = '';

    for (let i = 1; i <= 6; i++) {
      const g = regEls[i - 1];
      host.caption('Joint ' + i + ': <code>set_arm_calib_offset(' + i + ')</code> — এই motor-এর বর্তমান encoder reading-কে নতুন zero হিসেবে save।');
      host.formula('offset<sub>' + i + '</sub> = raw<sub>' + i + '</sub>  →  বর্তমান position-ই zero');
      g.querySelector('rect').setAttribute('stroke', '#7ee787');
      g.querySelector('text').setAttribute('fill', '#7ee787');
      await host.tween(450, k => g.setAttribute('opacity', 0.4 + 0.6 * Math.sin(k * Math.PI) + 0.4));
      g.setAttribute('opacity', 1);
      if (i === 4) {
        g.querySelectorAll('text')[1].textContent = 'state -1';
        g.querySelectorAll('text')[1].setAttribute('fill', '#f85149');
        host.caption('Joint 4 প্রথমবার <code>state = -1</code> ফেরত দিলো — save fail! Code একবার retry করে…');
        host.formula('state &lt; 0  →  <span class="fx-warn">retry: set_arm_calib_offset(4)</span>');
        await host.sleep(1000);
      }
      g.querySelectorAll('text')[1].textContent = 'zero saved';
      g.querySelectorAll('text')[1].setAttribute('fill', '#7ee787');
      conLog(['state= ' + i + ' 0', 'Calibration successfully!'.slice(0, i * 3)]);
      await host.sleep(520);
    }
    host.caption('সব joint-এর zero save হয়ে গেছে — <code>set_arm_torque(1)</code> দিয়ে arm আবার lock, তারপর <code>del bot</code> দিয়ে serial port ছেড়ে দেওয়া।');
    host.formula('print("Calibration successfully!")  →  set_arm_torque(1)  →  del bot');
    await host.tween(600, k => drawArm());
    await host.sleep(1500);
    /* reset registers */
    regEls.forEach(g => {
      g.querySelector('rect').setAttribute('stroke', '#263040');
      g.querySelector('text').setAttribute('fill', '#c9d1d9');
      g.querySelectorAll('text')[1].textContent = 'zero?';

      g.setAttribute('opacity', 1);
    });
    conLog(['', '']);
    await host.tween(800, k => { A.a1 = -0.6 + (-1.35 + 0.6) * k; A.a2 = 0.3 + (0.85 - 0.3) * k; drawArm(); });
  }
};

      circ(46, 28, 19, 'url(#gLens)', ' stroke="#20334a" stroke-width="3"') +
    '</g>' +
    txt(O1.x, O1.y + 118, 'Camera frame', { anchor: 'middle', size: 12.5, fill: '#c9d1d9' }) +
    txt(O1.x, O1.y + 136, '(optical: Z সামনে, Y নিচে)', { anchor: 'middle', size: 10.5, fill: '#5b6875' }) +
    axisGroup(O1, camAxes, 'ec-c', 0.95) +
    /* end effector pictogram */
    '<g transform="translate(' + (O2.x - 40) + ',' + (O2.y + 20) + ')">' +
      rrect(0, 0, 80, 18, 4, 'url(#gMetal)') +
      path('M 24 18 L 24 44 M 56 18 L 56 44 M 24 44 L 14 58 M 24 44 L 34 58 M 56 44 L 46 58 M 56 44 L 66 58', '#8f98a3', 5) +
    '</g>' +
    txt(O2.x, O2.y + 118, 'End-effector frame', { anchor: 'middle', size: 12.5, fill: '#c9d1d9' }) +
    txt(O2.x, O2.y + 136, '(claw-এর frame)', { anchor: 'middle', size: 10.5, fill: '#5b6875' }) +
    axisGroup(O2, endAxes, 'ec-e', 0.95) +
    /* traveling ghost axes */
    '<g id="ec-ghost"></g>' +
    /* translation arrow */
    '<path id="ec-t" d="" stroke="#ffb454" stroke-width="3" fill="none" stroke-dasharray="7 5" marker-end="url(#mArrO)"/>' +
    txt(445, 150, '', { id: 'ec-tlabel', size: 11.5, fill: '#ffb454', mono: 1, anchor: 'middle' }) +
    /* matrix panel */
    rrect(30, 340, 840, 100, 12, '#0d1117', '#263040') +
    '<g font-family="JetBrains Mono,monospace" font-size="12.5" fill="#556070">' +
      '<text x="58" y="368">R = |  0   0   1 |</text>' +
      '<text x="58" y="388">    | -1   0   0 |</text>' +
      '<text x="58" y="408">    |  0  -1   0 |</text>' +
      '<text x="300" y="368">t = (-0.101, 0.002, 0.0482) m</text>' +
      '<text x="300" y="390">det(R) = +1 → proper rotation</text>' +
    '</g>' +
    '<g id="ec-colhl"></g>' +
    txt(620, 375, 'camera 10.1 cm বাঁয়ে, 0.2 cm সামনে, 4.8 cm উপরে', { size: 11.5, fill: '#8b949e' }) +
    txt(620, 397, '— claw থেকে দেখা camera-র অবস্থান', { size: 11.5, fill: '#8b949e' });
  host.setStage(stage, 900, 460);
  if (host.staticOnly) {

    host.formula('p_end = R · p_cam + t');
    return;
  }
  const $ = s => host.stageEl.querySelector(s);
  const ghost = $('#ec-ghost');
  const colBox = $('#ec-colhl');
  const MAPS = [
    { from: 'z', to: 'x', col: 3, cap: 'Column 3 = (1, 0, 0): Camera-র optical axis <b>Zc</b> সোজা End-effector-এর <b>+Xe</b> হয়ে যায় — camera যেদিকে তাকায়, claw-এর “সামনে” সেদিকেই।', hl: 'column 3 → (1, 0, 0): Zc ⇒ +Xe' },
    { from: 'x', to: 'y', col: 1, cap: 'Column 1 = (0, −1, 0): Camera-র ডানদিক <b>Xc</b> হলো End frame-এর <b>−Ye</b> — অর্থাৎ উল্টো দিক।', hl: 'column 1 → (0, −1, 0): Xc ⇒ −Ye' },
    { from: 'y', to: 'z', col: 2, cap: 'Column 2 = (0, 0, −1): Camera-র নিচের দিক <b>Yc</b> (image-এ y বাড়ে নিচে) হলো End frame-এর <b>−Ze</b>।', hl: 'column 2 → (0, 0, −1): Yc ⇒ −Ze' }
  ];
  while (true) {
    host.caption('এই 4×4 homogeneous matrix-টাই hand-eye calibration: উপরের 3×3 block <b>R</b> (axis remap), ডানের column <b>t</b> (meter-এ দূরত্ব)।');
    host.formula('EndToCamMat = [ R  t ; 0  1 ]  →  p_end = R·p_cam + t');
    await host.sleep(2200);

    $('#ec-tlabel').textContent = 't = (−0.101, 0.002, 0.0482) m';
    await host.tween(900, k => {
      $('#ec-t').setAttribute('d', 'M ' + O2.x + ' ' + O2.y + ' L ' + (O2.x + (O1.x - O2.x) * easeInOutCubic(k) * 0.92) + ' ' + (O2.y + (O1.y - O2.y) * 0.92 * easeInOutCubic(k)));
    });

    host.formula('t = (−0.101, 0.002, 0.0482) — claw → camera offset (m)');
    await host.sleep(2000);
    $('#ec-tlabel').textContent = '';
    $('#ec-t').setAttribute('d', '');
    /* axis mapping ghosts */
    for (const m of MAPS) {
      const ca = camAxes[m.from], ea = endAxes[m.to];
      ghost.innerHTML = '<line x1="' + O1.x + '" y1="' + O1.y + '" x2="' + (O1.x + ca.dx * AX) + '" y2="' + (O1.y + ca.dy * AX) +
        '" stroke="' + ca.c + '" stroke-width="4" stroke-linecap="round" opacity="0.9"/>';
      const g0 = { x: O1.x + ca.dx * AX, y: O1.y + ca.dy * AX };
      const g1 = { x: O2.x + ea.dx * AX, y: O2.y + ea.dy * AX };
      const mid = { x: (g0.x + g1.x) / 2, y: g0.y - 70 };
      host.caption(m.cap);
      host.formula(m.hl);
      colBox.innerHTML =
        rrect(46 + (m.col - 1) * 0, 0, 0, 0, 0, 'none') +
        '<rect x="' + (m.col === 3 ? 160 : m.col === 1 ? 100 : 130) + '" y="352" width="22" height="62" fill="rgba(126,231,135,.15)" stroke="#7ee787" stroke-width="1" rx="3"/>';
      await host.tween(1300, k => {
        const e = easeInOutCubic(k);
        /* quadratic bezier g0 -> mid -> g1 */
        const bx = (1 - e) * (1 - e) * g0.x + 2 * (1 - e) * e * mid.x + e * e * g1.x;
        const by = (1 - e) * (1 - e) * g0.y + 2 * (1 - e) * e * mid.y + e * e * g1.y;
        const ln = ghost.querySelector('line');
        ln.setAttribute('x2', bx); ln.setAttribute('y2', by);
        ln.setAttribute('opacity', String(0.9 - 0.35 * e));
      });
      await host.sleep(1400);
      ghost.innerHTML = '';
      colBox.innerHTML = '';
    }
    /* numeric example */
    host.caption('এখন বাস্তব হিসাব: camera frame-এ tag-এর position <b>(0.03, −0.02, 0.45)</b> m হলে matrix multiply করে claw frame-এ position বের হয়।');
    host.formula('X = 0·x + 0·y + <b>1·z</b> − 0.101 = 0.45 − 0.101 = <span class="fx-ok">0.349</span>');
    await host.sleep(1900);
    host.formula('Y = <b>−1·x</b> + 0 + 0 + 0.002 = −0.03 + 0.002 = <span class="fx-ok">−0.028</span>');
    await host.sleep(1900);
    host.formula('Z = 0 + <b>−1·y</b> + 0 + 0.0482 = 0.02 + 0.0482 = <span class="fx-ok">0.0682</span> m');
    await host.sleep(2200);
    host.caption('ফল: camera-তে (0.03, −0.02, 0.45) → claw-এর frame-এ <b>(0.349, −0.028, 0.0682)</b> m। একটাও sign উল্টো হলে পুরো grasp মিশে যেত।');
    host.formula('p_end = (0.349, −0.028, 0.0682) m — verified');
    await host.sleep(2600);
  }
};

    '<rect id="pid-barD" x="560" y="154" width="0" height="16" rx="8" fill="#ffb454" opacity="0.85"/>' +
    txt(540, 200, 'discrete PID (compute(dist, 200))', { size: 10.5, fill: '#8b949e', mono: 1 }) +
    txt(540, 236, 'move_dist(dist):', { size: 11, fill: '#c9d1d9', mono: 1 }) +
    txt(560, 254, 'linear_x = pid.compute(dist, 200)', { size: 10.5, fill: '#8b949e', mono: 1 }) +
    txt(560, 272, 'pubVel(linear_x, 0, 0)', { size: 10.5, fill: '#8b949e', mono: 1 }) +
    txt(540, 306, 'Kp=0 হলে robot জমে থাকে; Kp অনেক বড় হলে oscillate করে', { size: 10, fill: '#5b6875' }) +

  if (host.staticOnly) { host.caption('Play চাপলে PID-র P আর D term কীভাবে মিলে smooth approach বানায় তা দেখা যাবে।'); host.formula('u(t) = Kp·e + Ki·∫e dt + Kd·de/dt'); return; }
  const $ = s => host.stageEl.querySelector(s);
  /* simulate discrete PID intuition: dt = 200 ms, gains /1000,
     e = dist − target (কতদূর বাকি, mm), u = Kp·e + Kd·Δe (m/s)।
     base-এ সামান্য inertia (first-order lag) রাখা হয়েছে যাতে
     high-Kp overshoot দৃশ্যমান হয় — এটা intuition demo, না দেখে
     simplePID-র ভেতরের sign convention দাবি করা হচ্ছে না। */
  function simulate(Kp, Kd, dist0, target, steps) {
    const pts = [];
    let d = dist0, prevE = dist0 - target, v = 0;
    for (let i = 0; i < steps; i++) {
      const e = d - target;
      const u = Kp * e + Kd * (e - prevE);
      prevE = e;
      v = v + (u - v) * 0.35;
      v = Math.max(-0.6, Math.min(0.6, v));
      d = d - v * 0.2 * 1000; /* m/s × s → mm */
      pts.push({ e: e, u: v, d: d });
    }
    return pts;
  }
  const N = 40;
  const sim = simulate(0.0005, 0.0002, 420, 220, N);
  const simG = simulate(0.0025, 0.0002, 420, 220, N);
  const px = i => 60 + (i / (N - 1)) * 420;
  const py = d => 290 - d * 0.35;
  while (true) {
    $('#pid-curve').setAttribute('d', '');
    $('#pid-ghost').setAttribute('d', '');
    $('#pid-ghost').setAttribute('opacity', 0);
    host.caption('Robot এখনো 420 mm দূরে। প্রতি 200 ms-এ <code>compute(dist, 200)</code> ডাকা হয়: error e = dist − 220 (কতদূর বাকি, mm)। sign convention-টা simplePID-র ভেতরের ব্যাপার — ওই folder-এ নেই, তাই এখানে intuition হিসেবে দেখানো হলো।');
    host.formula('e = dist − grasp_Dist = ' + Math.round(sim[0].d) + ' − 220 = <span class="fx-hl">' + Math.round(sim[0].d - 220) + ' mm বাকি</span>');
    await host.sleep(1600);
    let d = '';
    let botX = 110;
    for (let i = 0; i < N; i++) {
      const st = sim[i];
      d += (i === 0 ? 'M ' : 'L ') + px(i) + ' ' + py(st.d) + ' ';
      $('#pid-curve').setAttribute('d', d);
      $('#pid-barP').setAttribute('width', String(Math.min(280, Math.abs(st.e) * 1.1)));
      $('#pid-barD').setAttribute('width', String(Math.max(0, Math.min(280, i ? Math.abs((sim[i].e - sim[i - 1].e)) * 6 : 0))));
      botX = 110 + (1 - (st.d - 220) / (420 - 220)) * 560;
      $('#pid-bot').setAttribute('transform', 'translate(' + botX + ',388)');
      if (i % 4 === 0) {
        host.formula('e = ' + Math.round(st.e) + ' mm → u = Kp·e + Kd·Δe = ' +
          '<span class="fx-hl">' + (st.u * 1000).toFixed(1) + ' mm/s = ' + st.u.toFixed(4) + ' m/s</span>');
      }
      await host.sleep(90);
    }
    host.caption('D term (Kd = 0.0002) দ্রুত কমে যাওয়া error দেখে brake মারে — তাই curve আলতো করে 220-এ থিমথিমে stop করে, overshoot হয় না।');
    host.formula('u → 0 as e → 0 · derivative term damps the approach');
    await host.sleep(2400);
    /* ghost bad tuning */
    host.caption('একই system-এ Kp পাঁচগুণ বাড়ালে (0.0025) কী হতো: লাল dashed curve — overshoot আর oscillation (এই code-এর tuning নয়, শুধু intuition)।');
    host.formula('Kp = 0.0025 → overshoot → দুলতে থাকে — “aggressive P, weak D”');
    let dg2 = '';
    for (let i = 0; i < N; i++) {
      dg2 += (i === 0 ? 'M ' : 'L ') + px(i) + ' ' + py(Math.max(80, simG[i].d)) + ' ';
      $('#pid-ghost').setAttribute('d', dg2);
      $('#pid-ghost').setAttribute('opacity', 0.9);
      await host.sleep(45);
    }
    await host.sleep(2200);
  }
};

    '</g>' +

    '<g id="pp-obj">' +
      circ(P1.x, P1.y, 8, '#ffb454') +

      txt(P1.x, O.y + 18, 'X', { size: 10.5, fill: '#8b949e', mono: 1, anchor: 'middle' }) +
    '</g>' +
    /* ray */
    '<path id="pp-ray" d="" stroke="#ffb454" stroke-width="2.5" fill="none" opacity="0.9"/>' +
    /* projected pixel */
    '<g id="pp-pix">' +
      circ(O.x - F, 0, 6, '#7ee787') +
    '</g>' +
    /* similar triangles shading */
    '<path id="pp-tri1" d="" fill="rgba(255,180,84,.10)" stroke="none"/>' +
    '<path id="pp-tri2" d="" fill="rgba(126,231,135,.10)" stroke="none"/>' +
    /* pixel bar */
    rrect(60, 376, 800, 58, 10, '#0d1117', '#263040') +
    '<rect x="80" y="392" width="760" height="26" rx="6" fill="#101820" stroke="#1c2530"/>' +
    /* principal point marker at cx=319.38 of 640 -> x = 80 + 319.38/640*760 */
    line(80 + 319.38 / 640 * 760, 388, 80 + 319.38 / 640 * 760, 422, '#7ee787', 2) +
    txt(80 + 319.38 / 640 * 760, 384, 'cx = 319.38', { anchor: 'middle', size: 9.5, fill: '#7ee787', mono: 1 }) +
    txt(80, 384, 'px = 0', { size: 9.5, fill: '#5b6875', mono: 1 }) +
    txt(840, 384, '639', { size: 9.5, fill: '#5b6875', mono: 1, anchor: 'end' }) +
    '<circle id="pp-marker" cx="0" cy="405" r="8" fill="none" stroke="#4fc3f7" stroke-width="2.5" opacity="0"/>';
  host.setStage(stage, 900, 460);
  if (host.staticOnly) {
    /* static: draw a default projection for P1 at Z=0.5 */
    host.caption('Play চাপলে similar triangles দিয়ে pinhole projection আর তার inverse দেখা যাবে।');
    host.formula('px = fx·X/Z + cx · py = fy·Y/Z + cy');
    return;
  }
  const $ = s => host.stageEl.querySelector(s);
  const fx = 477.57, fy = 477.55, cx = 319.38, cy = 238.64;
  function proj(P, Zm) {
    /* scene coords: X_m lateral, Y_m vertical(down+), Z_m depth */
    const px = fx * P.X / Zm + cx, py = fy * P.Y / Zm + cy;
    return { px: px, py: py };
  }
  while (true) {
    /* Phase A: forward projection intuition */
    const Z = 0.5;
    const P = { X: 0.0635, Y: -0.0405 }; /* matches the 380,200 example */
    host.caption('Pinhole model-এর মূল কথা একটাই: আলোর রশ্মি P বিন্দু থেকে ছুটে এসে pinhole O দিয়ে পেরিয়ে image plane-এ পড়ে — দুটো similar triangle তৈরি হয়।');
    host.formula('triangle: X/Z = (px − cx)/fx  ⇔  px = fx·X/Z + cx');
    /* animate: point slides, ray draws, pixel dot appears */
    await host.tween(1400, k => {
      const e = easeInOutCubic(k);
      const objY = O.y - (1 - e) * 40 - P.Y * 300;
      $('#pp-obj').querySelector('circle').setAttribute('cy', objY);
      $('#pp-obj').querySelector('text').setAttribute('y', objY - 14);
      $('#pp-obj').querySelectorAll('line')[0].setAttribute('y2', objY);
      $('#pp-obj').querySelectorAll('text')[1].setAttribute('y', O.y + 18);
      /* image-plane hit: scale by f/Z in px */
      const ix = (O.x - F) - (P.X / Z) * F;
      const iy = O.y + (P.Y / Z) * F;
      $('#pp-ray').setAttribute('d', 'M ' + P1.x + ' ' + objY + ' L ' + O.x + ' ' + O.y + ' L ' + ix + ' ' + iy);
      $('#pp-pix').querySelector('circle').setAttribute('cx', ix);
      $('#pp-pix').querySelector('circle').setAttribute('cy', iy);
      $('#pp-tri1').setAttribute('d', 'M ' + O.x + ' ' + O.y + ' L ' + P1.x + ' ' + objY + ' L ' + P1.x + ' ' + O.y + ' Z');
      $('#pp-tri2').setAttribute('d', 'M ' + O.x + ' ' + O.y + ' L ' + ix + ' ' + iy + ' L ' + ix + ' ' + O.y + ' Z');
      $('#pp-pix').setAttribute('opacity', k);
    });
    host.caption('বাম বড় triangle (দৃশ্যে) আর ডান ছোট triangle (camera-র ভেতরে) — একই কোণ, তাই অনুপাত সমান: <code>X/Z = (px−cx)/fx</code>।');
    host.formula('fx = 477.57 px · cx = 319.38 px · fy = 477.55 · cy = 238.64');
    await host.sleep(2400);
    /* Phase B: inverse — what the code does */
    host.caption('Code করে উল্টো পথ: pixel (380, 200) আর depth Z = 0.5 m জানা আছে; camera frame-এর বাস্তব X, Y চাই।');
    host.formula('X = (px − cx)·Z/fx = (380 − 319.38)·0.5/477.57 = <span class="fx-hl">0.0635 m</span>');
    const marker = $('#pp-marker');
    marker.setAttribute('opacity', 1);
    await host.tween(800, k => marker.setAttribute('cx', 80 + (380 / 640) * 760 * easeInOutCubic(k)));
    await host.sleep(1700);
    host.formula('Y = (py − cy)·Z/fy = (200 − 238.64)·0.5/477.55 = <span class="fx-hl">−0.0405 m</span>');
    await host.sleep(1700);
    host.caption('Image-এর y-অক্ষ নিচের দিকে বাড়ে (pixel convention) — তাই image-এর উপরের দিকের pixel-এর Y ঋণাত্মক হয়। Sign ভুল হলে up/down উল্টে যাবে।');

      return (spec.dbg0 && spec.dbg0.length)
        ? dbgRows(spec.dbg0.slice(), {})
        : '<div class="dbg-empty">Play চাপলে প্রতিটি line-এর variable value এখানে দেখা যাবে — লাল চিহ্নিত <span class="dbg-old">পুরনো</span> → <span class="dbg-arrow">→</span> নতুন value আকারে।</div>';
    }

    var codeHtml = '';
    for (var i = 1; i <= NL; i++) {
      codeHtml += '<span class="exl" id="exl-' + i + '"><span class="eln">' + i +
        '</span>' + esc(lines[i - 1]) + '</span>';
    }

    var sec = document.createElement('section');
    sec.className = 'sec exec-sec';
    sec.id = 'exec-final';
    sec.innerHTML =
      '<div class="sec-head">' +
        '<span class="badge badge-anim">EXE</span>' +
        '<h3>Complete Execution — Code → Debug → Robot</h3>' +
        '<span class="exec-sub">' + esc(spec.file) + ' · ' + N + ' steps · ' + NL + ' lines · conceptual simulation</span>' +
      '</div>' +
      '<div class="exec-note bn">' + (spec.note || '') + '</div>' +
      '<div class="exec-frame">' +
        '<div class="exec-col code-col">' +
          '<div class="exec-panel">' +
            '<div class="exec-panel-head">' +
              '<span class="ep-title">COMPLETE SOURCE CODE</span>' +
              '<span class="ep-chip src">' + esc(spec.file) + '</span>' +
              '<span class="ep-chip live" id="exec-live">LINE —</span>' +
              '<span class="exec-legend" aria-hidden="true">' +
                '<i class="lg lg-exec"></i>exec' +
                '<i class="lg lg-struct"></i>structural' +
                '<i class="lg lg-event"></i>event' +
              '</span>' +
            '</div>' +
            '<pre class="exec-code" id="exec-code">' + codeHtml + '</pre>' +
          '</div>' +
        '</div>' +
        '<div class="exec-col dbg-col">' +
          '<div class="exec-panel">' +
            '<div class="exec-panel-head">' +
              '<span class="ep-title">LIVE DEBUG</span>' +
              '<span class="ep-chip concept">conceptual values</span>' +
            '</div>' +
            '<div class="exec-op" id="exec-op" hidden></div>' +
            '<div class="exec-dbg-body" id="exec-dbg">' + dbgIdle() + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="exec-col rob-col">' +
          '<div class="exec-panel">' +
            '<div class="exec-panel-head"><span class="ep-title">ROBOT / SYSTEM STATE</span>' +
            '<span class="ep-chip live" id="exec-phase">IDLE</span></div>' +
            '<div class="exec-robot" id="exec-rob"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="exec-complete" id="exec-done">EXECUTION COMPLETE' +
        '<div class="bn" id="exec-done-bn"></div></div>' +
      '<div class="exec-fx-row" id="exec-fx-row" hidden><div class="anim-formula" id="exec-fx"></div></div>' +
      '<div class="anim-caption bn" id="exec-cap">Play চাপলে line-by-line execution শুরু হবে।</div>' +
      '<div class="anim-controls" id="exec-controls">' + iconRow() +
        '<span class="ac-sep" aria-hidden="true"></span>' +
        '<span class="ac-step" id="exec-step">STEP 000 / ' + N + '</span>' +
        '<span class="anim-state" id="exec-state">IDLE</span>' +
      '</div>' +
      '<div class="exec-progress" aria-hidden="true"><i id="exec-bar"></i></div>';

    var main = document.getElementById('main');
    if (!main) return;
    main.appendChild(sec);

    var el = {
      code: sec.querySelector('#exec-code'),
      dbg: sec.querySelector('#exec-dbg'),
      op: sec.querySelector('#exec-op'),
      rob: sec.querySelector('#exec-rob'),
      cap: sec.querySelector('#exec-cap'),
      fxRow: sec.querySelector('#exec-fx-row'),
      fx: sec.querySelector('#exec-fx'),
      state: sec.querySelector('#exec-state'),
      phase: sec.querySelector('#exec-phase'),
      step: sec.querySelector('#exec-step'),
      live: sec.querySelector('#exec-live'),
      done: sec.querySelector('#exec-done'),
      doneBn: sec.querySelector('#exec-done-bn'),
      bar: sec.querySelector('#exec-bar'),
      controls: sec.querySelector('#exec-controls')
    };

    function robSvg(inner) {
      return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img">' +
        (spec.defs || '') + inner + '</svg>';
    }
    function setRob(inner) {
      if (!inner) return;
      el.rob.innerHTML = robSvg(inner);
      el.rob.classList.remove('exec-rob-fade');
      void el.rob.offsetWidth;
      el.rob.classList.add('exec-rob-fade');
    }
    setRob(spec.rob0 || (spec.steps[0] && spec.steps[0].rob) || '');

    /* ---- one coherent exec state machine ---- */
    var X = {
      started: false, running: false, paused: false, done: false,
      stopFlag: false, speed: 1, _raf: null, gen: 0
    };
    var shadow = {};   /* accumulated variable state for BEFORE→AFTER   */
    function setState(t) { el.state.textContent = t; }
    function clearCur() {
      el.code.querySelectorAll('.exl.cur,.exl.cur-g').forEach(function (n) {
        n.classList.remove('cur', 'cur-g', 'cur-struct', 'cur-event');
      });
    }
    function lineChip(st) {
      var grp = st.lns && st.lns.length > 1;
      return grp
        ? 'LINES ' + st.lns[0] + '–' + st.lns[st.lns.length - 1] + ' / ' + NL
        : 'LINE ' + st.ln + ' / ' + NL;
    }
    function applyStep(idx) {
      var st = spec.steps[idx];
      clearCur();
      var primary = el.code.querySelector('#exl-' + st.ln);
      var kcls = st.kind === 'struct' ? 'cur-struct' : (st.kind === 'event' ? 'cur-event' : '');
      (st.lns || [st.ln]).forEach(function (n) {
        var row = el.code.querySelector('#exl-' + n);
        if (!row) return;
        /* classList.add() THROWS on an empty token (exec steps have no
           kind class) — pass it conditionally, never as '' */
        var base = n === st.ln ? 'cur' : 'cur-g';
        if (kcls) { row.classList.add(base, kcls); }
        else { row.classList.add(base); }
      });
      if (primary) {
        try {
          el.code.scrollTop = primary.offsetTop - el.code.clientHeight / 2 + primary.offsetHeight / 2;
        } catch (e) { /* keep going without scroll */ }
      }
      el.live.textContent = lineChip(st);
      el.phase.textContent = KIND_BN[st.kind] || 'exec';
      el.step.textContent = 'STEP ' + (idx + 1 < 10 ? '00' : idx + 1 < 100 ? '0' : '') + (idx + 1) +
        ' / ' + N + ' · ' + lineChip(st);
      el.bar.style.width = ((idx + 1) / N * 100).toFixed(2) + '%';
      if (st.op) { el.op.hidden = false; el.op.textContent = st.op; }
      else { el.op.hidden = true; }
      el.dbg.innerHTML = dbgRows(st.dbg, shadow);
      el.cap.innerHTML = st.cap || '';
      if (st.fx) { el.fxRow.hidden = false; el.fx.innerHTML = st.fx; }
      else { el.fxRow.hidden = true; }
      if (st.rob) setRob(st.rob);
    }
    function complete() {
      X.done = true; X.running = false; X.started = false;
      clearCur();
      setState('COMPLETE');
      el.phase.textContent = 'DONE';
      el.step.textContent = 'EXECUTION COMPLETE · ' + N + ' STEPS · ' + NL + ' LINES';
      el.live.textContent = 'LINE —';
      el.bar.style.width = '100%';
      el.doneBn.innerHTML = spec.finalCap || '';
      el.done.classList.add('show');
      if (spec.finalOp) { el.op.hidden = false; el.op.textContent = spec.finalOp; }
      if (spec.finalDbg) el.dbg.innerHTML = dbgRows(spec.finalDbg, shadow);
      if (spec.finalRob) setRob(spec.finalRob);
      if (spec.finalFx !== undefined && spec.finalFx !== null) {
        el.fxRow.hidden = false; el.fx.innerHTML = spec.finalFx;
      }
      setActive(el.controls, null);
    }
    function sched(ms) {
      return new Promise(function (resolve) {
        var g = X.gen;
        var total = ms / X.speed, elapsed = 0, last = null;
        /* QA hook (#qa-vt): headless Chrome's virtual-time clock drives
           timers but never issues BeginFrames, so requestAnimationFrame
           stalls and automated runs freeze on step 1. Under the hash the
           identical accumulator runs on a 40ms interval instead. Real
           pages never carry the hash, so they always use rAF below. */
        if (/qa-vt/.test(location.hash)) {
          var iv = setInterval(function () {
            if (X.stopFlag || X.gen !== g) { clearInterval(iv); resolve('stopped'); return; }
            if (X.running) elapsed += 40;
            if (elapsed >= total) { clearInterval(iv); resolve(); }
          }, 40);
          return;
        }
        function tick(t) {
          if (X.stopFlag || X.gen !== g) { resolve('stopped'); return; }
          if (!X.running) { last = null; X._raf = requestAnimationFrame(tick); return; }
          if (last === null) last = t;
          elapsed += t - last; last = t;
          if (elapsed >= total) { resolve(); return; }
          X._raf = requestAnimationFrame(tick);
        }
        X._raf = requestAnimationFrame(tick);
      });
    }
    function resetIdle() {
      X.started = false; X.running = false; X.paused = false;
      X.stopFlag = false; X.done = false;
      if (X._raf) cancelAnimationFrame(X._raf);
      clearCur();
      shadow = {};
      setState('IDLE');
      el.phase.textContent = 'IDLE';
      el.step.textContent = 'STEP 000 / ' + N;
      el.live.textContent = 'LINE —';
      el.bar.style.width = '0%';
      el.op.hidden = true;
      el.done.classList.remove('show');
      el.cap.innerHTML = 'Play চাপলে line-by-line execution শুরু হবে।';
      el.fxRow.hidden = true; el.fx.innerHTML = '';
      el.dbg.innerHTML = dbgIdle();
      setRob(spec.rob0 || (spec.steps[0] && spec.steps[0].rob) || '');
      setActive(el.controls, null);
    }
    async function run() {
      var g = X.gen;
      for (var idx = 0; idx < N; idx++) {
        if (X.stopFlag || X.gen !== g) return;
        try { applyStep(idx); } catch (e) { console.error('exec step failed', idx, e); }
        var st = spec.steps[idx];
        var base = st.dur != null ? st.dur : (DUR[st.kind] != null ? DUR[st.kind] : (spec.stepDur || 2200));
        await sched(base);
        if (X.stopFlag || X.gen !== g) return;
      }
      if (X.gen !== g) return;
      complete();
    }
    function start(speed) {
      X.gen++;
      X.done = false;
      if (speed) X.speed = speed;
      X.started = true; X.stopFlag = false; X.running = true; X.paused = false;
      shadow = {};
      el.done.classList.remove('show');
      setState('RUN ' + X.speed + 'x');
      setTimeout(function () {
        run().catch(function (e) {
          console.error('exec run error', e);
          setState('ERROR');
        });
      }, 30);
    }
    function pause() { if (!X.started) return; X.running = false; X.paused = true; setState('PAUSED'); }
    function resume() {
      if (!X.started || !X.paused) return;
      X.running = true; X.paused = false; setState('RUN ' + X.speed + 'x');
    }
    function setSpeed(s) {
      X.speed = s;
      if (!X.started) { start(s); return; }
      if (X.paused) { X.running = true; X.paused = false; }
      setState('RUN ' + X.speed + 'x');
    }
    function stop() { X.gen++; X.stopFlag = true; resetIdle(); }

    el.controls.querySelectorAll('.ac-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.dataset.ac;
        setActive(el.controls, a === 'stop' ? null : b);
        if (a === 'play') { X.paused ? resume() : start(1); }
        else if (a === 'slow') setSpeed(0.5);
        else if (a === 'fast') setSpeed(1.5);
        else if (a === 'pause') pause();
        else if (a === 'stop') stop();
      });
    });
  }

  /* ---------- boot -------------------------------------------------- */
  function boot() {
    try { fixHero(); } catch (e) { console.error(e); }
    try { retrofitControls(); } catch (e) { console.error(e); }
    try { buildExec(); } catch (e) { console.error('exec build failed', e); }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else { boot(); }
})();

</script>
</body>
</html>
