 করা হয়, কিন্তু সতর্কতা: এই file-এর ভেতরে এটিকে আর কোথাও read করা হয় না — সম্ভবত এই folder-এর বাইরের কোনো module এটি ব্যবহার করার কথা ছিল, নয়তো এটি পুরোনো logic-এর অবশিষ্টাংশ। <code>self.prev_dist = 0<\/code>-এর নাম থেকে মনে হয় এটি আগের distance-এর মান মনে রাখবে (Derivative term-এর জন্য দরকার), কিন্তু এটিও এই file-এ আর কোথাও read হয় না — প্রকৃত previous-error memory-টি <code>simplePID<\/code> object-এর ভেতরে থাকে, যে class-টি এই folder-এর বাইরে defined।"},{"a":137,"b":138,"text":"<code>self.linearx_PID = (0.5, 0.0, 0.2)<\/code> হলো raw gain triple — (P, I, D) ক্রমে 0.5, 0.0, 0.2। এরপর <code>simplePID<\/code> class-এর একটি instance বানানো হচ্ছে; এই class-টি <code>from M3Pro_demo.Robot_Move import *<\/code> (line 25) থেকে এসেছে — অর্থাৎ এই folder-এর বাইরে defined, তাই আমরা কেবল usage থেকেই এর আচরণ অনুমান করতে পারি (constructor-এর তিনটি argument সম্ভবত Kp, Ki, Kd ক্রমে)। প্রতিটি gain-কে <code>1000.0<\/code> দিয়ে ভাগ করার ফলে প্রকৃত gains দাঁড়ায় (0.0005, 0.0, 0.0002)। কেন ভাগ: error টি millimeter unit-এ আসে বলেই ধরা হয়েছে (line 140-এর comment নিজেই grasp_Dist-কে mm বলে দেয়; আর code ধরে নেয় depth value mm-তে আসে — line 237-এ /1000 করা হয়, যদিও driver সত্যিই mm পাঠায় কি না তা এই folder থেকে যাচাইযোগ্য নয়), কিন্তু wheel-এর জন্য দরকার m/s unit-এ velocity — এই ভাগটাই mm-scale error-কে m/s-scale output-এ রূপান্তর করে। খেয়াল করুন <code>self.linearx_PID<\/code> (raw tuple) আর <code>self.linearx_pid<\/code> (object) নামে কেবল case-এ আলাদা — Python case-sensitive, তাই এরা দুটি সম্পূর্ণ আলাদা attribute।"},{"a":140,"b":141,"text":"<code>self.grasp_Dist = 220.0<\/code> হলো PID-র setpoint: AprilTag টার্গেট থেকে base ঠিক কত millimeter দূরে থেমে grasp করবে — আদর্শ থামার দূরত্ব। Error হিসাব হবে এই 220 mm আর measured distance-এর পার্থক্য থেকে, তাই এই একটি সংখ্যা পুরো approach behavior নির্ধারণ করে। <code>self.joint5 = Int16()<\/code> একটি <code>Int16<\/code> message object আগে থেকে তৈরি করে রাখে (নাম অনুযায়ী wrist/gripper joint-এর জন্য), কিন্তু সতর্কতা: এই file-ে <code>self.joint5<\/code> আর কোথাও ব্যবহার বা fill করা হয় না — line 95-এর <code>TargetJoint5_pub<\/code> publisher-ও কখনো publish করা হয় না।"},{"a":143,"b":143,"text":"Section header comment — ঘোষণা করে যে এর নিচে arm command, base velocity command ও service call-এর মতো ছোট ছোট helper function-গুলো আসছে; execute হয় না।"},{"a":145,"b":149,"text":"<code>pubCurrentJoints<\/code> arm-এর বর্তমান joint state অন্য program-দের জানানোর helper। প্রথমে একটি <code>CurJoints<\/code> message তৈরি হয়, তার <code>joints<\/code> field-এ <code>self.init_joints<\/code> (home pose [90, 90, 0, 0, 90, 90] degree) বসানো হয়, তারপর <code>self.pub_cur_joints<\/code> publisher দিয়ে <code>Curjoints<\/code> topic-এ publish হয় (queue size 1 — নতুন message এলে পুরনোটা ফেলে দেওয়া হয়, কেবল সর্বশেষ state-ই গুরুত্বপূর্ণ)। দুটি সতর্কতা: এখানে arm-এর আসল measured joint angle নয়, commanded home pose-টাই পাঠানো হয়; আর এই পুরো file-এ <code>pubCurrentJoints<\/code> কোথাও call করা হয় না — এই demo-র জন্য এটি dead code, শুধু message-packaging pattern শেখার উদাহরণ হিসেবে দেখুন।"},{"a":151,"b":153,"text":"<code>get_graspStatusCallBack<\/code> নামের callback-টি line 99-এর subscription-এর সাথে যুক্ত — <code>grasp_done<\/code> topic-এ <code>Bool<\/code> message এলে executor এটিকে চালায় (queue 100)। এটি grasp-শেষ সংকেত গ্রহণকারী: gripper যখন object ধরে ফেলে তখন অন্য কোনো node এখানে <code>True<\/code> পাঠায়। <code>if msg.data == True:<\/code> শর্তটি নিচের body-কে কেবল সত্যিকারের grasp-শেষ সংকেতেই চালায়; <code>False<\/code> এলে কিছুই হয় না।"},{"a":154,"b":156,"text":"Grasp শেষ হলে তিনটি কাজ হয়। <code>self.pubPos_flag = True<\/code> — এতে <code>callback()<\/code>-এর line 229-এর শর্ত (<code>self.pubPos_flag == False<\/code>) মিথ্যা হয়ে যায়, ফলে tag-detection ও calibration block চলা বন্ধ হয়। <code>self.adjust_dist = True<\/code> — PID-র সাথে সম্পর্কিত flag, যদিও এই file-এ এটি আর read হয় না। সবচেয়ে সূক্ষ্ম বিষয়: <code>time.sleep(3.0)<\/code> — পরের tag খোঁজার আগে 3 second অপেক্ষা, কিন্তু একটি node-এর সব callback একই executor thread-এ চলে, তাই এই sleep পুরো node-কে 3 second-এর জন্য ব্লক করে দেয়: ওই সময়ে camera sync callback চলতে পারে না, image frame গুলো queue-তে জমা হয়ে drop হয় এবং terminal-এর OpenCV window ফ্রিজ হয়ে যাওয়ার মতো দেখায়। আরেকটি সতর্কতা: <code>pubPos_flag<\/code> এই file-এ আর কখনো <code>False<\/code> করা হয় না — অর্থাৎ একবার grasp হলে node আর পুনরায় calibration mode-এ ফিরে আসে না।"},{"a":158,"b":160,"text":"<code>pubSix_Arm<\/code> arm-এ command পাঠানোর মূল helper: 6টি joint angle একটি <code>ArmJoints<\/code> message-এ pack করে publish করে। Signature-এ চারটি parameter — <code>joints<\/code> ছাড়া <code>id=6<\/code>, <code>angle=180.0<\/code>, <code>runtime=2000<\/code> সবই default মান; এই file-এ function-টি শুধু <code>joints<\/code> argument দিয়ে call হয় (line 115 ও 117), তাই বাকি তিনটি parameter এখানে কখনো override হয় না — সম্ভবত অন্য কোনো demo file সেগুলো ব্যবহার করে। <code>ArmJoints()<\/code> দিয়ে প্রথমে সব field-default মানসহ খালি message তৈরি হয় — এটি সেই <code>arm_msgs/msg/ArmJoints<\/code> type, যেটি README-র প্রথম ধাপে <code>ros2 topic pub<\/code> দিয়ে home pose পাঠাতেও ব্যবহৃত হয়।"},{"a":161,"b":167,"text":"<code>joints<\/code> list-এর ছয়টি angle পরপর message-এর <code>joint1<\/code> থেকে <code>joint6<\/code> field-এ বসানো হয় — list-এর index 0 মানে <code>joint1<\/code>, index 5 মানে <code>joint6<\/code>; মানগুলো degree unit-এ (home pose [90, 90, 0, 0, 90, 90])। <code>arm_joint.time = runtime<\/code> হলো trajectory-র সময় millisecond-এ — default 2000 ms মানে arm-কে এই pose-এ পৌঁছতে ঠিক 2 second সময় দেওয়া হচ্ছে; README-র home command-এ এই একই field-এ 1500 ms ব্যবহৃত হয়েছিল। এই <code>time<\/code> বড় হলে movement ধীর ও smooth, ছোট হলে দ্রুত কিন্তু jerk-y হয় — motor-এর জন্য খুব ছোট সময়ে বড় joint change চাপানো বিপজ্জনক।"},{"a":168,"b":168,"text":"ভরা message-টি <code>self.TargetAngle_pub<\/code> publisher দিয়ে <code>arm6_joints<\/code> topic-এ publish হয় (queue depth 10)। এই topic-ই arm-এর প্রধান command channel: message-টি micro-ROS stack-এ গিয়ে serial bridge-এর মাধ্যমে <code>/dev/myserial<\/code> (2,000,000 baud, মোটামুটি 200,000 byte/s) হয়ে arm-এর controller-এ পৌঁছায়। <code>__init__<\/code>-এর line 114-117-এ এই function-টাই বারবার call হয়ে নিশ্চিত করে যে subscriber যুক্ত হওয়ার আগে-পরে home pose command হারিয়ে যায় না।"},{"a":170,"b":176,"text":"<code>pubVel<\/code> base-এর চাকার জন্য velocity command পাঠায়। একটি <code>Twist<\/code> message বানিয়ে তিনটি field ভরা হয়: <code>vel.linear.x = float(vx)<\/code> সামনে-পিছনের speed (m/s), <code>vel.linear.y = float(vy)<\/code> ডানে-বাঁয়ের speed, আর <code>vel.angular.z = float(vz)<\/code> yaw ঘূর্ণনের rate — লক্ষ করুন তৃতীয় parameter-এর নাম <code>vz<\/code> হলেও এটি কোনো linear z-axis velocity নয়, এটি <code>angular.z<\/code> field-এ যায়; নামকরণটি একটু বিভ্রান্তিকর। <code>float()<\/code> cast নিশ্চিত করে যে numpy scalar (যেমন PID-র ফেরত দেওয়া মান) থেকে ROS message field-এ কোনো type-এর গোলমাল না লাগে। Message-টি <code>self.CmdVel_pub<\/code> দিয়ে <code>cmd_vel<\/code> topic-এ যায় (queue 1) — line 269-এ <code>move_dist<\/code> যেই PID output বানায়, সেটিই এই path দিয়ে base-কে চালায়।"},{"a":178,"b":180,"text":"<code>get_current_end_pos<\/code> kinematics service-কে জিজ্ঞেস করে: বর্তমান joint angle থেকে end-effector এখন কোথায় — এটাই Forward Kinematics (FK)। প্রথমে <code>ArmKinemarics.Request()<\/code> দিয়ে request object তৈরি হয় (service-টির নাম <code>get_kinemarics<\/code> এবং message-টির নাম <code>ArmKinemarics<\/code> — দুটোতেই এই প্রকল্পের নিজস্ব spelling আছে, ঠিক এই বানানেই ব্যবহার করতে হবে)। Request-এর field-গুলোর structure .srv definition-এ থাকে যা এই folder-এর বাইরে defined।"},{"a":181,"b":183,"text":"এখানে কেবল একটি field সেট করা হয়: <code>request.cur_joint1 = float(self.init_joints[0])<\/code> অর্থাৎ 90.0 — home pose-এর প্রথম joint। Line 182 আসলে source-এর নিজেরই comment <code># ... send joint angles ...<\/code>: বাকি joint-গুলোর request field এই file-এ কোথাও সেট করা হয় না, ফলে সেগুলোর মান .srv definition-এর default যা-ই হোক সেটিই যাবে (সেটি এই folder-এ দেখা সম্ভব নয়)। এটি একটি গুরুত্বপূর্ণ সতর্কতা: আসল arm যদি home-এ না থাকে, তবুও request home-এর joint1 ধরে যাবে। <code>request.kin_name = \"fk\"<\/code> service-কে বলে এটি FK হিসাব চাই — একই service সম্ভবত <code>\"ik\"<\/code> (Inverse Kinematics) মোডও দেয়, kin_name string-ই সেই switch-এর কাজ করে।"},{"a":184,"b":185,"text":"এখানে ROS 2-এর asynchronous service pattern ব্যবহৃত হয়েছে। <code>self.client.call_async(request)<\/code> request-টি পাঠিয়ে সাথে সাথেই একটি <code>future<\/code> object ফেরত দেয় — code এখানে থেমে অপেক্ষা করে না (blocking <code>call()<\/code>-এর বিপরীতে)। <code>future.add_done_callback(self.get_fk_respone_callback)<\/code> নিবন্ধ করে যে কাজটি service-এর উত্তর এসে <code>future<\/code> complete হওয়ার পর executor নিজে থেকেই চালবে, আর তখন <code>future<\/code>-কেই argument হিসেবে পাঠাবে। এর সুবিধা: node অপেক্ষা না করে বাকি কাজে (camera callback, subscription) ফিরে যেতে পারে; service-এর উত্তর দেরিতে এলেও কিছু যায় আসে না। <code>main()<\/code>-এ line 353-এ এই function-টি ঠিক একবারই, <code>rclpy.spin()<\/code>-এর আগে call হয় — অর্থাৎ <code>CurEndPos<\/code> একটি startup snapshot।"},{"a":187,"b":190,"text":"<code>get_fk_respone_callback<\/code> service-এর উত্তর গ্রহণ করে (নামের spelling-টি এখানেও প্রকল্পের নিজস্ব)। <code>try<\/code> block-এর ভেতরে <code>future.result()<\/code> call করা হয় — সফল হলে এটি <code>ArmKinemarics.Response<\/code> object দেয়; কিন্তু service call ব্যর্থ হলে (server নেই, timeout, serialization error) ঠিক এই লাইনেই exception ওঠে, যেটা নিচের <code>except<\/code> ধরে ফেলে। এই pattern-এর কারণ: callback-এর ভেতরে unhandled exception উঠলে পুরো executor-এর কাজ বিপন্ন হতে পারত, তাই future থেকে ফল বের করার কাজটি সবসময় <code>try/except<\/code>-এ মোড়া উচিত।"},{"a":191,"b":196,"text":"Response-এর ছয়টি মান পরপর <code>self.CurEndPos<\/code> list-এ বসানো হয়: <code>response.x<\/code>, <code>response.y<\/code>, <code>response.z<\/code> (meter-এ position) index 0, 1, 2-তে, আর <code>response.roll<\/code>, <code>response.pitch<\/code>, <code>response.yaw<\/code> (radian-এ orientation) index 3, 4, 5-এ। এতে line 77-এর হাতে-লেখা initial snapshot ([0.1279, 0.00023, 0.1674, 0.00036, 1.3962, 0.00033] — pitch 1.3962 rad মানে 80 degree) আসল FK ফলাফল দিয়ে overwrite হয়ে যায়। এই <code>CurEndPos<\/code>-ই পরে <code>get_end_point_mat()<\/code> (line 293) হয়ে <code>compute_heigh<\/code>-এর camera-to-base transform chain-এ base transform হিসেবে কাজ করে — অর্থাৎ পুরো AprilTag calibration-এর সঠিকতা এই একটি response-এর উপর দাঁড়িয়ে আছে। মনে রাখুন: request-এ শুধু <code>cur_joint1<\/code> সেট হয়েছিল, তাই এই pose আসলে \"joint1 = 90, বাকি joint default\" configuration-এর FK — arm সত্যিই home-এ আছে ধরেই এই snapshot ব্যবহারযোগ্য।"},{"a":197,"b":198,"text":"উপরের কোথাও exception উঠলে <code>except Exception as e<\/code> সেটি ধরে <code>self.get_logger().error(f'Service call failed: {e}')<\/code> দিয়ে terminal-এ error message ছাপায় — node বেঁচে থাকে, crash করে না। কিন্তু পার্শ্বপ্রভাবটি খেয়াল করুন: exception ঘটলে <code>CurEndPos<\/code>-এ কোনো আপডেট হয় না, ফলে line 77-এর initial hardcoded মানতেই থেকে যায় — কোনো বাড়তি warning ছাড়াই stale data দিয়ে পরবর্তী সব হিসাব চলতে থাকে, যা calibration-এ noise ঢোকাতে পারে। Broad <code>Exception<\/code> catch সব ধরে ফেলে বলে debug-এর সময় আসল কারণ আলাদা করে বের করা কঠিন হয়, তবে demo-র মতো uninterrupted run-এর জন্য এটি robust পছন্দ।"}],"math":{"intro":"এই section-এ <code>simplePID<\/code>-র ভেতরের হিসাব ধাপে ধাপে তৈরি করা হয়েছে। Class-টি <code>M3Pro_demo.Robot_Move<\/code>-এ defined — এই folder-এ নেই — তাই আমরা কেবল usage (line 138-এর constructor, line 269-এর <code>self.linearx_pid.compute(dist, 200)<\/code>) থেকে এর গাণিতিক রূপ standard PID theory দিয়ে ব্যাখ্যা করছি। Control loop-টি এমন: depth camera AprilTag পর্যন্ত দূরত্ব মাপে, PID সেই error থেকে একটি velocity বানায়, <code>pubVel<\/code> সেই velocity base-এর <code>cmd_vel<\/code>-এ পাঠায়, base চললে দূরত্ব বদলে যায় — আবার নতুন মাপ, নতুন হিসাব। নিচে প্রতিটি ধাপে প্রতিটি symbol-এর সাথে code-এর identifier মিলিয়ে দেওয়া হলো।","levels":[{"label":"ধাপ ১: Error-এর সংজ্ঞা","latex":"\\[ e(t) = y(t) - r(t) \\]","text":"এখানে <code>r(t)<\/code> হলো setpoint — code-এ <code>self.grasp_Dist<\/code> = 220.0 mm (টার্গেট থেকে কত দূরে থামবে), <code>y(t)<\/code> হলো measured distance — camera যে দূরত্ব মাপল, আর <code>e(t)<\/code> হলো error — এখনো কতটা এগোতে বাকি। e বড় মানে অনেক দূরে, e শূন্য মানে ঠিক থামার জায়গায়। Textbook-এ প্রায়ই error লেখা হয় r − y হিসেবে, কিন্তু সেই নিয়মে দূরে থাকলে error ঋণাত্মক হয়ে যায়; সামনে এগোনোর ধনাত্মক velocity বের করতে হলে measured − setpoint দিকটাই কাজ করে। আসল চিহ্ন-রীতি <code>simplePID<\/code> ও তার caller-এর ভেতরে — এই folder-এ <code>move_dist<\/code>-কে কেউ call করে না, তাই <code>dist<\/code> ঠিক কোন দিকে তৈরি হয় তা সরাসরি দেখা যায় না। এই বিয়োগের চিহ্নই feedback loop-এর দিক নির্ধারণ করে।"},{"label":"ধাপ ২: Continuous PID","latex":"\\[ u(t) = K_p\\, e(t) + K_i \\int_0^t e(\\tau)\\, d\\tau + K_d\\, \\frac{de(t)}{dt} \\]","text":"<code>u(t)<\/code> হলো controller-এর output — এখানে base-এর velocity (m/s)। P-term বর্তমান error-এর সমানুপাতিক ধাক্কা: দূরে থাকলে জোরে, কাছে এলে ধীরে। I-term অতীতের পুরো error-এর যোগফল — ছোট ছোট স্থায়ী error জমা করে তা দূর করে, কিন্তু actuator saturate থাকলে integral windup-এর ঝুঁকি আনে। D-term হলো error-এর পরিবর্তনের হার — error দ্রুত কমছে মানে robot জোরে এগোচ্ছে, তখন এটি brake হিসেবে velocity কমিয়ে দেয়, ফলে overshoot আটকায়। এই code-এ K_i = 0, তাই এটি কার্যত একটি PD controller।"},{"label":"ধাপ ৩: Discrete form — robot যা হিসাব করে","latex":"\\[ u_k = K_p\\, e_k + K_i \\sum_{i=0}^{k} e_i\\, \\Delta t + K_d\\, \\frac{e_k - e_{k-1}}{\\Delta t} \\]","text":"Computer continuous integral বা derivative সরাসরি হিসাব করতে পারে না; নির্দিষ্ট সময় পর পর sample নেয়। k নম্বর cycle-এর error হলো <code>e_k<\/code>, আগের cycle-এরটি <code>e_{k-1}<\/code>, আর দুটি sample-এর সময়ের ব্যবধান <code>Δt<\/code>। Integral তাই আয়তক্ষেত্রের ক্ষেত্রফলের যোগফল — Riemann sum (প্রতিটি error-কে Δt দিয়ে গুণ করে যোগ), derivative হয় finite difference (পার্থক্যকে Δt দিয়ে ভাগ)। Line 269-এর <code>compute(dist, 200)<\/code>-এর প্রথম argument হলো বর্তমান error, দ্বিতীয় argument 200 সম্ভবত Δt = 200 ms — সঠিক convention-টি <code>simplePID<\/code>-র ভেতরে, এই folder-এ দেখা যায় না। আর এই file-এ <code>move_dist<\/code>-কে কোথাও call করা হয়নি — কে <code>dist<\/code> পাঠায় তাও এই folder-এর বাইরের ব্যাপার।"},{"label":"ধাপ ৪: Code-এর প্রকৃত gains ও unit-এর সেতু","latex":"\\[ K_p = \\frac{0.5}{1000} = 0.0005, \\qquad K_i = \\frac{0.0}{1000} = 0, \\qquad K_d = \\frac{0.2}{1000} = 0.0002 \\]","text":"Line 137-এ <code>self.linearx_PID = (0.5, 0.0, 0.2)<\/code> raw gains, আর line 138-এ প্রতিটি উপাদানকে <code>1000.0<\/code> দিয়ে ভাগ করে <code>simplePID<\/code>-কে দেওয়া হয়েছে। কেন ভাগ: grasp_Dist-এর comment অনুযায়ী error আসে millimeter unit-এ, কিন্তু <code>pubVel<\/code>-এর <code>Twist.linear.x<\/code> চায় m/s — তাই gain-এর কার্যকর unit হয় (m/s)/mm, আর 1 mm = 1/1000 m হওয়ায় ঠিক 1000 দিয়ে ভাগ এই দুই unit-এর মধ্যে সেতু বাঁধে। এই একটি ভাগই tuning আর unit-consistency দুটোরই দায় বহন করে।"},{"label":"ধাপ ৫: Closed loop — কেন robot থেমে যায়","latex":"\\[ y_{k+1} \\approx y_k - u_k\\, \\Delta t, \\qquad e_{k+1} \\approx e_k - K_p\\, e_k\\, \\Delta t \\]","text":"Base সামনে গেলে (u_k &gt; 0) measured দূরত্ব y কমে — তাই প্রথম সমীকরণে ঋণাত্মক চিহ্ন। e-এর সংজ্ঞা y − r (measured − setpoint) এবং K_p &gt; 0 হলে প্রতিটি cycle-এ error আগেরটার চেয়ে ছোট হয়: এটাই negative feedback। সঙ্গে সঙ্গে u = K_p e-ও ছোট হয়, তাই robot কাছে আসতে আসতে নিজে থেকেই ধীর হয়ে ঠিক 220 mm-এ প্রায় থেমে যায় — কোনো বাইরের brake ছাড়াই। চিহ্নের কোনো একটি উল্টে গেলে এটি positive feedback হয়ে যায়: error যত বাড়ে speed তত বাড়ে, robot টার্গেট ছেড়ে দূরে ছুটতে থাকে।"}],"numeric":[{"latex":"\\[ e_k = 100\\ \\mathrm{mm} \\;\\Rightarrow\\; u_k = K_p\\, e_k = 0.0005 \\times 100 = 0.05\\ \\mathrm{m/s} \\]","text":"এখনো 100 mm এগোতে বাকি আছে ধরুন। P-term একা দেয় 0.05 m/s = সেকেন্ডে 5 cm — একটি বাস্তবসম্মত, ধীর এগোনোর গতি। যদি <code>/1000.0<\/code> ভাগটি না থাকত, ফল হতো 0.5 × 100 = 50 m/s (ঘণ্টায় প্রায় 180 km) — একটি ছোট robot base-এর জন্য সম্পূর্ণ অসম্ভব command। 1000 দিয়ে ভাগটাই mm-error-কে মানব-বাস্তব m/s-output-এ নামিয়ে আনে।"},{"latex":"\\[ u_k = 0.0005 \\times 100 + 0.0002 \\times \\frac{100 - 130}{0.2} = 0.05 - 0.03 = 0.02\\ \\mathrm{m/s} \\]","text":"ধরুন এই cycle-এ error 100 mm, আগের cycle-এ ছিল 130 mm, আর Δt = 0.2 s (<code>compute(dist, 200)<\/code>-এর 200 ms-কে second-এ নিয়ে)। Error প্রতি cycle-এ 30 mm করে কমছে, তাই D-term ঋণাত্মক হয়ে brake-এর কাজ করে: শুধু P হলে 0.05 m/s হতো, D এসে তা নামিয়ে 0.02 m/s করে দেয় — এটাই overshoot আটকানোর ব্যবস্থা। সতর্কতা: <code>simplePID<\/code> যদি 200-কে ms হিসেবেই ভাগে ব্যবহার করে, D-term হতো 0.0002 × (−30)/200 = −0.00003 m/s — প্রায় শূন্য; ms না second, সেই convention-এর পার্থক্যই D-term-কে বাতিল করে দিতে পারে, আর সেটি এই folder-এর বাইরে defined।"},{"latex":"\\[ d_k = 0 \\;\\Rightarrow\\; u_k = 0\\ \\mathrm{m/s}; \\qquad d_k = 440 - 220 = 220\\ \\mathrm{mm} \\;\\Rightarrow\\; u_k = 0.0005 \\times 220 = 0.11\\ \\mathrm{m/s} \\]","text":"<code>move_dist(dist)<\/code>-এর <code>dist<\/code> caller প্রস্তুত করে (সেই call এই file-এ নেই)। যদি dist হয় measured − <code>grasp_Dist<\/code>: tag থেকে 440 mm দূরে দাঁড়িয়ে থাকলে dist = 440 − 220 = 220 mm, ফলে u = +0.11 m/s — সামনে এগিয়ে দূরত্ব কমায়; ঠিক 220 mm-এ পৌঁছালে dist = 0, তাই u = 0 m/s — base থেমে যায়, এটাই grasp-এর প্রস্তুত অবস্থান। মূল সূত্র: error-এর সংজ্ঞা আর movement-এর দিক সংগতিপূর্ণ হলে loop negative feedback হয়; উল্টো হলে robot টার্গেট ছেড়ে দূরে ছুটতে থাকে।"}],"mapping":[{"code":"self.grasp_Dist = 220.0","math":"r (setpoint)","text":"PID-র লক্ষ্য-দূরত্ব, millimeter unit-এ; প্রতিটি error এই মান থেকেই মাপা হয়।"},{"code":"self.linearx_PID = (0.5, 0.0, 0.2)","math":"(K_p, K_i, K_d) raw values","text":"Tuning constants — কোন term কতটা জোরালো হবে; এখানে I বন্ধ, অর্থাৎ কার্যত PD controller।"},{"code":"simplePID(self.linearx_PID[0] / 1000.0, ...)","math":"K_p = 0.5/1000 = 0.0005, K_d = 0.2/1000 = 0.0002","text":"mm-scale error থেকে m/s-scale output-এ যাওয়ার unit-রূপান্তর এই ভাগেই ঘটে।"},{"code":"self.linearx_pid.compute(dist, 200)","math":"u_k = K_p e_k + K_d (e_k - e_{k-1})/Δt","text":"প্রতি control cycle-এ velocity বের করার call; প্রথম argument বর্তমান error, দ্বিতীয়টি সম্ভবত Δt = 200 ms; e_{k-1} মনে রাখার কাজ object-এর ভেতরের।"},{"code":"self.pubVel(linear_x, 0, 0)","math":"u_k যায় plant input হিসেবে","text":"Controller-এর output সরাসরি base-এর forward velocity হয়ে প্রয়োগ হয় (cmd_vel topic-এ)।"},{"code":"self.prev_dist = 0","math":"e_{k-1} এর প্রাথমিক মান","text":"নাম অনুযায়ী আগের মান রাখার জায়গা, কিন্তু এই file-এ আর read হয় না — আসল previous-error memory <code>simplePID<\/code>-র ভেতরে থাকে।"}],"failure":["Error-এর চিহ্ন উল্টে গেলে (measured − setpoint-এর বদলে উল্টো দিকে বিয়োগ) loop হয়ে যায় positive feedback: base টার্গেটের দিকে না এসে তার থেকে দ্রুত দূরে ছুটতে থাকে, 220 mm-এ কখনো থামে না।","<code>/1000.0<\/code> ভাগটি বাদ পড়লে gains (0.5, 0, 0.2) অক্ষত থাকে: 100 mm error-তে output 50 m/s — অবাস্তব; wheel driver saturate করে বা message reject করে, base হঠাৎ লাফিয়ে ওঠে।","Error যদি meter unit-এ দেওয়া হয় অথচ gains একই থাকে (যেমন e = 0.1) তবে output 0.00005 m/s — base এত ধীরে চলে যে demo-র সময়ে <code>grasp_Dist<\/code>-এ পৌঁছায়ই না; mm/m unit mismatch-এর classical লক্ষণ এটি।","<code>compute(dist, 200)<\/code>-এ ms-এর বদলে second আশা করা implementation-কে 200 পাঠালে Δt = 200 s ধরা হয়: D-term প্রায় শূন্য হয়ে braking হারিয়ে যায়, base 220 mm পেরিয়ে এগিয়ে যায় (overshoot)।","<code>grasp_Dist<\/code> ভুলে 22.0 লিখলে (centimeter ভেবে) error হয় 440 − 22 = 418 mm — বড় ধনাত্মক output (0.0005 × 418 ≈ 0.21 m/s), base টার্গেটের দিকে দ্রুত ছুটতে থাকে এবং থামে কেবল 22 mm দূরত্বে — gripper বা tag-এর সাথে ধাক্কা লাগার আগে থামানো যায় না।","K_i-কে বড় করে actuator অনেকক্ষণ saturate থাকলে integral windup: জমা অংক বিশাল হয়ে যায়, টার্গেট পার হয়েও robot অনেকদূর এগিয়ে যাওয়ার পর উল্টো দিকে ফেরে।"]},"robot":{"correct":"Jetson-এ সব সঠিক চললে: <code>pubSix_Arm<\/code> home pose (90, 90, 0, 0, 90, 90) degree, runtime 2000 ms-এ <code>arm6_joints<\/code> topic-এ পাঠায় — micro-ROS agent সেটি 2,000,000 baud-এর serial লিংক (<code>/dev/myserial<\/code>) হয়ে arm-এর controller-এ পৌঁছায়, আর 6-DOF arm 2 second-এ smoothly home অবস্থায় ফেরে। <code>get_current_end_pos<\/code>-এর FK response <code>CurEndPos<\/code>-এ আসল মান বসায়, ফলে SPACE (key code 32) চাপলে tag-এর position সঠিক base frame-এ তুলনা হয় এবং offset_value.yaml-এ সঠিক x/y/z_offset লেখা হয়। PID চালু থাকলে base AprilTag-এর দিকে ধীরে এগিয়ে ঠিক <code>grasp_Dist<\/code> = 220 mm দূরত্বে থেমে grasp-এর জন্য প্রস্তুত হয়, আর <code>grasp_done<\/code> এলে node 3 second অপেক্ষা করে — যদিও <code>pubPos_flag<\/code> এই file-এ আর কখনো False না হওয়ায় calibration block পুনরায় খোলে না, source comment-এর 'নতুন tag খোঁজা' পরিকল্পনাটি সম্ভবত এই folder-এর বাইরে সম্পন্ন হওয়ার কথা।","incorrect":"চিহ্ন বা unit ভুল হলে (error-এর দিক উল্টো, বা <code>/1000.0<\/code> ভাগ বাদ) base হয় টার্গেট থেকে দূরে ছুটে যায়, নয়তো 50 m/s-এর মতো অসম্ভব command নিয়ে চাকা jerk করে বা driver message ফেলে দেয়। FK request-এ শুধু <code>cur_joint1<\/code> সেট হয় বলে arm যদি home-এ না থাকে, service-এর ফেরত দেওয়া pose ভুল হবে — সেই ভুল <code>CurEndPos<\/code> দিয়ে বানানো offset আসল ত্রুটির উল্টো চিহ্নে yaml-এ লেখা পড়ে, পরের calibration আরও খারাপ হয় এবং gripper tag-এর পাশে মিস করে। <code>time.sleep(3.0)<\/code> executor thread আটকে রাখায় ওই 3 second camera callback জমা হয়ে drop হয়, terminal-এর image window ফ্রিজ হয়ে যাওয়ার মতো লাগে। আর service call fail করলে node নীরবে stale <code>CurEndPos<\/code> দিয়েই সব হিসাব চালিয়ে যায় — কেউ খেয়ালও করতে পারে না যতক্ষণ না terminal-এ ছোট্ট একটা error line চোখে পড়ে।"},"id":"part-11","start":132,"end":198,"lang":"python","animType":"pidController","flags":[]},{"n":12,"fname":"arm_offset.py","enTitle":"Camera Callback & Tag Detection","explain":[{"a":200,"b":202,"text":"মূল camera loop: <code>def callback(self, color_frame, depth_frame):<\/code> — এই function-কে কেউ সরাসরি ডাকে না; আগের Part-এর <code>ApproximateTimeSynchronizer<\/code> যখন সময়-মিল আছে এমন একটি রঙিন + একটি depth frame-এর <b>জোড়া<\/b> খুঁজে পায়, তখনই নিজে থেকে ডেকে দেয়। Camera 30 fps হলে সেকেন্ডে ~৩০ বার এই function চলে।"},{"a":204,"b":207,"text":"ধাপ ১ — রূপান্তর: <code>self.rgb_bridge.imgmsg_to_cv2(color_frame,'rgb8')<\/code> ROS message-কে OpenCV array-তে অনুবাদ, format <code>'rgb8'<\/code> (রং-ক্রম R-G-B); <code>np.copy<\/code> দিয়ে একটি নিরাপদ কপি নেওয়া হলো <code>result_image<\/code>-এ — original <code>rgb_image<\/code> অক্ষত রেখে এর উপর বাক্স-রেখা আঁকা হবে; তারপর <code>cv.resize(result_image, (640, 480))<\/code> — প্রদর্শনীর ছবিকে ঠিক 640×480 করা (camera যদি ভিন্ন resolution দেয়)।"},{"a":209,"b":213,"text":"ধাপ ২ — depth প্রক্রিয়াকরণ: <code>self.depth_bridge.imgmsg_to_cv2(depth_frame, encoding[1])<\/code> — depth frame-কে <code>'32FC1'<\/code> (32-bit float) ধরে অনুবাদ; একক meter। <code>depth_to_color_image<\/code> — মানুষের চোখে দেখার জন্য depth-কে রঙিন করা: <code>convertScaleAbs<\/code> float-কে দৃশ্যমান range-এ টেনে 8-bit করে, <code>applyColorMap(..., COLORMAP_JET)<\/code> তাতে নীল-লাল রংমালা লাগায় — JET মানচিত্রে ছোট মান = নীল, বড় মান = লাল, আর এখানে মানটি হলো দূরত্ব, তাই দূরের জিনিস লাল, কাছের জিনিস নীল দেখাবে — <b>এটি শুধু প্রদর্শনী, হিসাবে ব্যবহৃত হয় না<\/b>। আসল কাজের খাত: <code>frame = cv.resize(depth_image, (640, 480))<\/code> — মূল depth-ও 640×480 করা, তারপর <code>depth_image_info = frame.astype(np.float32)<\/code> — গণিতের সুবিধার জন্য float32-এ ঢালা; পরের Part-গুলোতে এই <code>depth_image_info<\/code> থেকেই tag-এর দূরত্ব পড়া হবে।"},{"a":215,"b":217,"text":"ধাপ ৩ — tag খোঁজা: AprilTag রঙ বোঝে না, বোঝে শুধু উজ্জ্বলতা — তাই <code>cv2.cvtColor(rgb_image, cv2.COLOR_RGB2GRAY)<\/code> দিয়ে রঙিন ছবিকে ধূসর করা হলো (লক্ষ করো: resize-করা <code>result_image<\/code> নয়, original <code>rgb_image<\/code>)। তারপর <code>self.at_detector.detect(..., False, None, 0.025)<\/code> — engine ছবি জুড়ে সব tag খুঁজে তালিকা দেবে; <code>False<\/code> মানে সাথে চিহ্নিত-ছবি ফেরত চাই না; শেষ দুটি হলো dt-apriltags wrapper-এর optional মান — <code>None<\/code> camera-র parameter/intrinsics-এর placeholder (pose-estimate করতে বাধ্য করছি না), আর <code>0.025<\/code> হলো tag-এর প্রত্যাশিত পার্শ্বদৈর্ঘ্য <b>মিটার এককে<\/b> (2.5 cm) — detector এই আকারের প্রেক্ষিতে কাজ করে।"},{"a":218,"b":221,"text":"<code>sorted(tags, key=lambda tag: tag.tag_id)<\/code> — পাওয়া tag-গুলো ID অনুযায়ী সাজানো, যাতে একাধিক tag দেখা গেলে সবসময় একই ক্রমে প্রক্রিয়া হয় (ID 0 আগে, তারপর 1...)। তারপর <code>draw_tags(result_image, tags, corners_color=(0,0,255), center_color=(0,255,0))<\/code> — vutils থেকে আনা নিজস্ব tool: প্রতিটি tag-এর চার কোণে <b>লাল<\/b> বাক্স আর কেন্দ্রে <b>সবুজ<\/b> বিন্দু এঁকে দেয়, যাতে পর্দায় দেখে বোঝা যায় robot কী দেখছে।"},{"a":223,"b":224,"text":"<code>cv2.rectangle(result_image, (307, 241), (409, 338), (0,0,255), 3)<\/code> — পর্দায় লাল আয়তক্ষেত্র: উপরের-বাম কোণ (307,241), নিচের-ডান (409,338), লাল রং, 3-px মোটা। মন্তব্য বলছে সম্ভবত target zone। <b>কিন্তু একটা মজার সত্য:<\/b> এর কেন্দ্র = ((307+409)/2, (241+338)/2) = <b>(358, 289.5)<\/b> — অথচ 640×480 ছবির আসল কেন্দ্র (320, 240)। অর্থাৎ rectangle-টি স্ক্রিনের কেন্দ্রে <i>নেই<\/i>; ডানে ~38 px আর নিচে ~50 px সরে বসে আছে। এটি কাকতালীয় না-হলে ইচ্ছাকৃত (tag-কে frame-এর একপাশে ধরার পরিকল্পনা), নয়তো একটি সূক্ষ্ম ভুল — code নিজে এই কেন্দ্রকে কোথাও ব্যবহার করে না, তাই হিসাবে কোনো ক্ষতি হয় না; শুধু পর্দায় দেখতে একটু অফ-সেন্টার লাগে।"},{"a":226,"b":226,"text":"<code>key = cv2.waitKey(10)<\/code> — 10 ms-এর জন্য keyboard শোনা এবং OpenCV-র প্রদর্শনী-window রিফ্রেশ করা। ফেরত আসা মান <code>key<\/code>-তে জমা হলো — আর এটিই <b>এই পুরো script-এর সবচেয়ে গুরুত্বপূর্ণ keypress<\/b>: পরের Part-এ line 248-এ <code>if key == 32:<\/code> পরীক্ষা করা হয়েছে (32 = SPACEBAR-এর key code)। অর্থাৎ operator tag-ধরা অবস্থায় <b>SPACEBAR চাপলেই<\/b> calibration-এর হিসাব-করা নতুন offset-গুলো YAML file-এ সেভ হয় (line 249-256) — এই <code>waitKey(10)<\/code>-এর ফেরত-মানটিই calibration-এর ট্রিগার। সঙ্গে আরেকটি পর্যবেক্ষণ: callback-এর একদম শেষে line 265-এ <b>দ্বিতীয়<\/b> একটি <code>key = cv2.waitKey(1)<\/code> আছে (প্রদর্শনী window রিফ্রেশের জন্য) — একই function-এ দুই বার waitKey চলা একটি redundancy, ক্ষতিকর নয়।"}],"math":null,"robot":{"correct":"Robot প্রতি সেকেন্ডে ~৩০ বার করে দেখবে: color+depth frame-এর জোড়া এলেই রঙিন ছবি ধূসর করে tag খুঁজবে, পাওয়া tag-এর গায়ে লাল বাক্স-সবুজ বিন্দু এঁকে পর্দায় দেখাবে, depth-কে JET রঙে সাজিয়ে দূরত্বের মানচিত্রও দেখাবে, tag পাওয়া গেলেই (আর আগে ধরা হয়নি মানে <code>pubPos_flag == False<\/code> — line 229) পরের ধাপে ধরার হিসাব চলবে, আর operator SPACEBAR চাপলে সেই হিসাব হুবহু নতুন offset হিসেবে YAML-এ সেভ হবে।","incorrect":"Tag-এর পরিবার বা threshold না মিললে robot চশমা পরেও কিছু দেখবে না — পর্দায় শুধু ফাঁকা দৃশ্য আর লাল আয়তক্ষেত্র। Depth stream বন্ধ হয়ে গেলে sync-জোড়া মিলবে না, callback-ই ডাকা হবে না — সব window জমে থেকে যাবে। আর <code>encoding[1]<\/code> ধরে নেওয়া হয়েছে যে depth meter-এ float; camera যদি 16UC1 (mm) দেয় তাহলে সংখ্যা ১০০০ গুণ বড় পড়বে — পরের হিসাবে claw অগণিত দূরে চলে যাওয়ার চেষ্টা করবে।"},"id":"part-12","start":200,"end":227,"lang":"python","animType":"aprilTagDetect","flags":[]},{"n":13,"fname":"arm_offset.py","enTitle":"Offset Computation & YAML Save","explain":[{"a":228,"b":229,"text":"<p>এই <code>if<\/code>-টি হলো পুরো calibration routine-এর <b>gate<\/b>: <code>len(tags) &gt; 0<\/code> মানে এই frame-এ অন্তত একটি tag36h11 AprilTag detect হয়েছে (<code>detect()<\/code> call আগের অংশে line 217-তে হয়ে গেছে, এবং line 219-এ <code>tags<\/code>-কে <code>tag_id<\/code> অনুযায়ী sort করা হয়েছে), আর <code>self.pubPos_flag == False<\/code> মানে এখনো কোনো offset save হয়নি। Source-এর নিজের comment বলছে <i>\"If we found a tag, AND we haven't grabbed it yet...\"<\/i> — কারণ <code>pubPos_flag<\/code> শুধু SPACE চাপলে বা <code>grasp_done<\/code> topic-এ <code>True<\/code> এলে set হয়। এই file-এর ভেতরে <code>pubPos_flag<\/code> কখনো আবার <code>False<\/code> হয় না, তাই এটি একটি <b>one-shot latch<\/b>: একবার save হয়ে গেলে node restart না করা পর্যন্ত এই block আর চলবে না। এতে বারবার file write-এর ঝুঁকি নেই, কিন্তু ভুল মুহূর্তে SPACE চেপে ফেললে আগের ভালো offset-ও overwrite হয়ে যায়।<\/p>"},{"a":230,"b":230,"text":"<p><code>for i in range(len(tags))<\/code> — detect করা প্রতিটি tag-এর জন্য নিচের depth lookup ও offset computation চালানো হচ্ছে। এক frame-এ একাধিক tag থাকলে loop-এর প্রতিটি iteration একই <code>key<\/code> value দেখে, তাই SPACE চাপা থাকলে <b>প্রতিটি tag-এর জন্যই<\/b> file write হয় — একই frame-ে পরের tag আগেরটাকে overwrite করে, অর্থাৎ file-এ শেষ পর্যন্ত <b>last tag-এর value-ই থেকে যায়<\/b>। Calibration-এর সময় frame-এ একটাই tag রাখা নিরাপদ।<\/p>"},{"a":231,"b":232,"text":"<p><code>tags[i].center<\/code> হলো এই tag-এর center pixel coordinate (dt_apriltags library-এর detection result object)। Tuple unpack করে <code>center_x<\/code> পাওয়া গেল column মান (image-এর বাম থেকে ডানে, 640x480 frame-এ 0-639) আর <code>center_y<\/code> হলো row মান (উপর থেকে নিচে, 0-479)। Center সাধারণত sub-pixel float হয় (যেমন 287.5), কারণ detector corner-গুলোর গড় থেকে এটি বের করে — পরের লাইনে <code>int()<\/code> cast-এর কারণ এটাই।<\/p>"},{"a":233,"b":234,"text":"<p>শুধু নাম copy: <code>cx = center_x<\/code>, <code>cy = center_y<\/code> — pixel coordinate-কে ছোট নামে নেওয়া হচ্ছে যাতে <code>compute_heigh<\/code>-কে ডাকা সহজ হয়। একটি সূক্ষ্ম বিভ্রান্তি এড়িয়ে চলুন: এই <code>cx<\/code>/<code>cy<\/code> হলো <b>pixel<\/b> coordinate, কিন্তু <code>pixel_to_camera_depth<\/code>-এর ভেতরে <code>cx<\/code>/<code>cy<\/code> নামের variable হলো camera intrinsics-এর <b>principal point<\/b> (319.38, 238.64) — একই নাম, সম্পূর্ণ ভিন্ন অর্থ।<\/p>"},{"a":235,"b":237,"text":"<p><code>cz = depth_image_info[int(cy),int(cx)]/1000<\/code> — synced depth frame থেকে tag center pixel-এর depth পড়া হচ্ছে। <code>depth_image_info<\/code> হলো এই callback-এর একটি <b>local<\/b> variable (line 210-213-এ <code>32FC1<\/code> encoding-এ convert, 640x480-তে resize, <code>np.float32<\/code>-এ cast হয়েছে), <code>self.<\/code> নয়। numpy indexing row-major, অর্থাৎ <code>[row, col] = [y, x]<\/code> — সঠিক ক্রমেই লেখা হয়েছে <code>[int(cy),int(cx)]<\/code>; ক্রম উল্টে দিলে ভুল pixel-এর depth নীরবে পড়া হতো, আর যদি tag center-এর x 479-এর বেশি হয় তাহলে <code>IndexError<\/code>। <code>int()<\/code> দরকার কারণ array index অবশ্যই integer। <code>/1000<\/code> মানে depth-কে millimeter ধরে meter-এ convert করা — <b>সৎ সতর্কতা:<\/b> এই folder থেকে যাচাই করা যায় না DaBai DCW2-এর <code>32FC1<\/code> stream সত্যিই mm নাকি meter দেয়; অনেক driver সরাসরি meter দেয়, তখন এই ভাগ depth-কে 1000 গুণ ছোট করে ফেলবে (0.40 m এর বদলে 0.0004 m) এবং সব offset অর্থহীন হবে। Python 3-এ <code>/<\/code> true division, তাই ফল float-ই আসে।<\/p>"},{"a":238,"b":240,"text":"<p><code>pose = self.compute_heigh(cx,cy,cz)<\/code> — এই method একই file-এর শেষের দিকে define করা (line 275): প্রথমে <code>pixel_to_camera_depth<\/code> দিয়ে pixel+depth থেকে camera-frame 3D point, তারপর <code>EndToCamMat<\/code> দিয়ে camera-&gt;end-effector, শেষে <code>CurEndPos<\/code> থেকে বানানো matrix দিয়ে end-&gt;base transform। ফেরত আসা <code>pose<\/code> (ভেতরে নাম <code>pose_T<\/code>) হলো tag-এর <b>base frame-এ measured position<\/b> (x, y, z) meter-এ — পুরো calibration-এর ভিত্তি-measurement এখানেই তৈরি। <code>pose<\/code> একটি numpy array (<code>tfs.affines.decompose<\/code> থেকে আসে), তাই এর element-গুলো numpy scalar — পরে <code>.item()<\/code> লাগার কারণ এটাই।<\/p>"},{"a":241,"b":245,"text":"<p>তিনটি offset বের হচ্ছে <b>desired − measured<\/b> সূত্রে: <code>x_offset_value = 0.145 - pose[0]<\/code>, <code>y_offset_value = 0.0 - pose[1]<\/code>, <code>z_offset_value = 0.04 - pose[2]<\/code>। Desired target হলো base frame-এ <b>(0.145, 0, 0.04) m<\/b> — অর্থাৎ base-এর সামনে 14.5 cm, ঠিক মাঝরেখায়, উচ্চতায় 4 cm। Positive offset মানে system যা দেখছে তা target-এর চেয়ে দূরে, negative মানে কাছে; এই sign convention consumer-রা ( <code>arm_kin<\/code> package-এর kinematics node, যার param folder-এ এই file যায়) ধরে নেবে — এই file শুধু value লিখে দেয়, কীভাবে ব্যবহৃত হবে তা এই folder-এর বাইরে। বিয়োগের ক্রম জরুরি: target আগে, measured পরে।<\/p>"},{"a":246,"b":249,"text":"<p><code>key<\/code> variable-টি এসেছে এই callback-এর আগের অংশের <code>key = cv2.waitKey(10)<\/code> (line 226) থেকে — এই range-এ কোনো নতুন key poll হয়নি। <code>ord(' ') == 32<\/code>, তাই <code>if key == 32:<\/code> মানে user SPACE bar চেপেছে — এটিই calibration-এর <b>commit button<\/b>: এই মুহূর্তের measurement-ই final। সঙ্গে সঙ্গে <code>self.pubPos_flag = True<\/code> latch হয়ে যায়, ফলে পরের frame থেকে gate-ই আর খোলে না — একবার SPACE, একবার save, তারপর শুধু display। লক্ষ করুন SPACE তখনই কাজ করে যখন <b>gate খোলা<\/b>, অর্থাৎ frame-এ tag আছে এবং আগে কখনো save হয়নি — tag ছাড়া frame-এ চাপা SPACE নীরবে হারিয়ে যায়।<\/p>"},{"a":250,"b":253,"text":"<p>শুরুতে (line 36-37) <code>yaml.safe_load<\/code> করা module-level <code>offset_config<\/code> dictionary-র তিনটি key update করা হচ্ছে — <code>x_offset<\/code>, <code>y_offset<\/code>, <code>z_offset<\/code> নামগুলো হুবহু সেই নাম, যা line 128-130-এ <code>self.x_offset<\/code> ইত্যাদি হিসেবে load হয়েছিল (সেগুলো এই file-এ আর কোথাও ব্যবহৃত হয়নি — একটি পরিচিত অব্যবহৃত load)। ডান পাশে <code>x_offset_value.item()<\/code> — <code>pose[0]<\/code> numpy scalar হওয়ায় <code>x_offset_value<\/code>-ও numpy scalar, আর <code>.item()<\/code> সেটিকে plain Python <code>float<\/code>-এ convert করে; এটি ছাড়া <code>yaml.dump<\/code> numpy scalar ঠিকমতো serialize করতে পারে না।<\/p>"},{"a":254,"b":255,"text":"<p><code>with open(offset_file, 'w') as file:<\/code> — <code>offset_file<\/code> হলো hard-coded absolute path <code>/home/jetson/yahboomcar_ws/src/arm_kin/param/offset_value.yaml<\/code>, mode <code>'w'<\/code> অর্থাৎ প্রতিবার আগের content পুরো overwrite হয় (append নয়)। <code>yaml.dump(offset_config, file, default_flow_style=False)<\/code> পুরো dictionary-টিকে (তিনটি offset ছাড়াও file-এ থাকা অন্য কোনো key থাকলে সেটিও) YAML text-এ লেখে। <code>default_flow_style=False<\/code> জোর করে <b>block style<\/b> লেখায় — প্রতিটি key নিজের লাইনে <code>key: value<\/code> আকারে, <code>{x_offset: ...}<\/code>-এর মতো flow/JSON style নয়; ফলে file মানুষের পড়ার জন্য পরিষ্কার এবং পরিবর্তন git diff-এ লাইন ধরে দেখা যায়। Path ঠিক না মিললে <code>FileNotFoundError<\/code> আসবে — এটি এই Jetson-এর workspace layout-এর অনুমানে বাঁধা।<\/p>"},{"a":256,"b":256,"text":"<p>Terminal-এ confirmation: <code>Finish calibrate offset.<\/code> — user দেখতে পায় save সম্পন্ন। এরপর loop-এর পরের tag-এ গেলে (যদি থাকে) আবার একই block চলবে এবং file আবার overwrite হবে; তাই একাধিক tag থাকলে terminal-এ একাধিকবার এই message দেখা যেতে পারে, কিন্তু file-এ থাকবে শেষ tag-এর value।<\/p>"},{"a":257,"b":259,"text":"<p>Display-এর প্রস্তুতি: <code>cv2.cvtColor(result_image, cv2.COLOR_RGB2BGR)<\/code> — line 205-এ <code>imgmsg_to_cv2(color_frame,'rgb8')<\/code> image-টিকে RGB ক্রমে এনেছিল, কিন্তু OpenCV-র <code>imshow<\/code> BGR প্রত্যাশা করে; এই channel swap না করলে লাল আর নীল স্থান বিনিময় হয়ে যেত (লাল box নীল দেখাত)। লক্ষ করুন overlay-গুলো (tag box, red rectangle) আগেই <code>result_image<\/code>-এ আঁকা হয়ে গেছে, তাই এখানে শুধু রঙের ক্রম ঠিক করা হচ্ছে — এই range-এ offset value-গুলো পর্দায় আঁকা হয় না, শুধু terminal/File-এ যায়।<\/p>"},{"a":260,"b":262,"text":"<p>FPS গণনা: <code>cur_time = time.time()<\/code> দিয়ে এই frame-এর সময় নেওয়া হচ্ছে, <code>self.pr_time<\/code> হলো আগের frame-এর সময় (node তৈরির সময় line 60-এ initialize হয়েছিল), তাই <code>cur_time - self.pr_time<\/code> = দুই frame-এর ব্যবধান, আর <code>int(1/(cur_time - self.pr_time))<\/code> = আনুমানিক frames per second। <code>str()<\/code> দিয়ে wrap করা হয়েছে কারণ <code>cv2.putText<\/code>-কে text লাগে। তারপর <code>self.pr_time = cur_time<\/code> দিয়ে পরের frame-এর জন্য reference রেখে দেওয়া হলো। Camera+depth sync+AprilTag detection-এর সম্মিলিত গতির এটি একটি সস্তা live indicator — সংখ্যাটি ধারাবাহিকভাবে ছোট হলে বোঝা যায় pipeline-এ কোথাও ধীরতা এসেছে।<\/p>"},{"a":263,"b":263,"text":"<p><code>cv2.putText<\/code> FPS text-টি image-এর উপরে আঁকছে — text হলো <code>fps<\/code> string, origin pixel <code>(10, 30)<\/code> (উপরে-বাম কোণ), font <code>cv2.FONT_HERSHEY_SIMPLEX<\/code>, scale 1, রং সবুজ <code>(0, 255, 0)<\/code>, thickness 2। এটি প্রতি frame-এ আঁকা হয় — gate খোলা থাকুক বা বন্ধ, calibration শেষ হয়ে গেলেও display চলতে থাকে।<\/p>"},{"a":264,"b":265,"text":"<p><code>cv2.imshow(\"result_image\", result_image)<\/code> window-তে frame-টি দেখায় এবং <code>key = cv2.waitKey(1)<\/code> 1 ms অপেক্ষা করে window-কে refresh করে — এটি এই callback-এর <b>দ্বিতীয়<\/b> <code>waitKey<\/code> call (প্রতি frame-এ দুটি: line 226-এরটি আর এটি)। একটি সূক্ষ্ম বিষয়: এখানে <code>key<\/code>-তে যা ফেরত আসে তা <b>কোথাও ব্যবহৃত হয় না<\/b> — SPACE check করে আগের <code>waitKey(10)<\/code>-এর <code>key<\/code>, আর পরের frame-এ line 226 আবার <code>key<\/code> overwrite করে ফেলে; তাই line 265-এর assignment কার্যত display refresh আর event pump-এর জন্যই, input-এর জন্য নয়।<\/p>"}],"math":{"intro":"এই অংশের গণিত মূলত একটি সরল বিয়োগ: calibration মানে \"target যেখানে হওয়া উচিত\" থেকে \"system যেখানে দেখছে\" বাদ দিয়ে প্রতিটি axis-এ কতটুকু শোধরানো দরকার তা বের করা। নিচে ধাপে ধাপে সেই সূত্র, code identifier-দের সঙ্গে মিল, একটি যাচাইকৃত সংখ্যাসূচক উদাহরণ এবং কোন ভুলে কী নষ্ট হয়।","levels":[{"label":"মূল ধারণা","latex":"\\[ \\text{offset} = \\text{target} - \\text{measured} \\]","text":"সবচেয়ে সাধারণ রূপ: <code>target<\/code> হলো desired মান, <code>measured<\/code> হলো sensor chain যা পরিমাপ করেছে, আর তাদের পার্থক্যই হলো correction term।"},{"label":"প্রতিটি axis-এ আলাদা","latex":"\\[ o_x = x_{\\text{target}} - x_{\\text{measured}}, \\quad o_y = y_{\\text{target}} - y_{\\text{measured}}, \\quad o_z = z_{\\text{target}} - z_{\\text{measured}} \\]","text":"Vector-এর প্রতিটি উপাদানে আলাদাভাবে বিয়োগ: <code>o_x = x_offset_value<\/code>, <code>o_y = y_offset_value<\/code>, <code>o_z = z_offset_value<\/code>।"},{"label":"Vector form","latex":"\\[ \\mathbf{o} = \\mathbf{p}_{\\text{desired}} - \\mathbf{p}_{\\text{tag}} = \\begin{bmatrix} 0.145 \\\\ 0 \\\\ 0.04 \\end{bmatrix} - \\mathbf{p}_{\\text{tag}} \\]","text":"<code>p_desired<\/code> হলো এই project-এর hard-coded target (0.145, 0, 0.04) m base frame-এ, আর <code>p_tag<\/code> হলো <code>pose<\/code> — <code>compute_heigh<\/code> থেকে ফেরত আসা tag-এর measured position, যা pixel-&gt;camera-&gt;end-&gt;base পুরো transform chain-এর ফলাফল।"},{"label":"Code-এ যেভাবে লেখা","latex":"\\[ \\mathbf{o} = \\begin{bmatrix} 0.145 - \\text{pose}[0] \\\\ 0.0 - \\text{pose}[1] \\\\ 0.04 - \\text{pose}[2] \\end{bmatrix} \\]","text":"এই রূপটিই line 243-245: <code>0.145 - pose[0]<\/code>, <code>0.0 - pose[1]<\/code>, <code>0.04 - pose[2]<\/code>। বিয়োগের ক্রম খেয়াল করুন — <b>desired আগে, measured পরে<\/b> — উল্টে গেলে প্রতিটি offset-এর sign উল্টে যায় এবং consumer node ভুল দিকে শুধরাতে যায়।"}],"numeric":[{"latex":"\\[ o_x = 0.145 - 0.1487 = -0.0037 \\ \\text{m} \\]","text":"যাচাইকৃত উদাহরণ: tag-এর measured <code>pose[0] = 0.1487<\/code> m হলে <code>x_offset_value = 0.145 - 0.1487 = -0.0037<\/code> m — অর্থাৎ system বর্তমানে target-এর চেয়ে 3.7 mm বেশি সামনের দিকে দেখছে, তাই <code>.item()<\/code> convert করে YAML file-এ লেখা হবে <code>x_offset: -0.0037<\/code>।"},{"latex":"\\[ \\mathbf{o} = \\begin{bmatrix} 0.145 - 0.1487 \\\\ 0.0 - 0.0012 \\\\ 0.04 - 0.0431 \\end{bmatrix} = \\begin{bmatrix} -0.0037 \\\\ -0.0012 \\\\ -0.0031 \\end{bmatrix} \\ \\text{m} \\]","text":"ধরা যাক measured <code>pose = (0.1487, 0.0012, 0.0431)<\/code> m (x-মানটি যাচাইকৃত উদাহরণ থেকে, বাকি দুটি স্রেফ প্রদর্শনের জন্য)। প্রতিটি axis-এ আলাদা বিয়োগ করে তিনটি offset পাওয়া যায়; দুটি পক্ষেরই একক meter, কারণ desired আর measured দুটোই meter-এ — এখানেই <code>cz<\/code>-এর <code>/1000<\/code> (mm-&gt;m) conversion-এর সঠিকতা নির্ণায়ক।"}],"mapping":[{"code":"0.145 - pose[0]","math":"o_x = x_{\\text{target}} - x_{\\text{measured}}","text":"<code>pose[0]<\/code> হলো tag-এর base-frame X (সামনের দিক), <code>0.145<\/code> হলো desired X।"},{"code":"0.0 - pose[1]","math":"o_y = y_{\\text{target}} - y_{\\text{measured}}","text":"Y target শূন্য মানে tag arm-এর ঠিক মাঝরেখায় থাকা উচিত; <code>pose[1]<\/code> হলো বাম/ডান বিচ্যুতি।"},{"code":"0.04 - pose[2]","math":"o_z = z_{\\text{target}} - z_{\\text{measured}}","text":"Z target 4 cm উচ্চতায়; <code>pose[2]<\/code>-এর নির্ভরযোগ্যতা সরাসরি depth মান ও <code>/1000<\/code> conversion-এর উপর।"},{"code":"depth_image_info[int(cy),int(cx)]/1000","math":"z_{\\text{m}} = z_{\\text{mm}} \\cdot 10^{-3}","text":"millimeter-কে meter-এ রূপান্তর; unit-এর অনুমান ভুল হলে সব offset একই স্কেলে ভুল হয়ে যায়।"},{"code":"x_offset_value.item()","math":"\\text{float}(o_x)","text":"numpy scalar থেকে plain Python float — <code>yaml.dump<\/code> serialize করার জন্য প্রয়োজনীয় রূপান্তর, মান অপরিবর্তিত থাকে।"}],"failure":["বিয়োগের ক্রম উল্টে গেলে (<code>measured - target<\/code>) প্রতিটি offset-এর sign উল্টে যায় — consumer node ভুল দিকে শুধরাতে গিয়ে বিচ্যুতি দ্বিগুণ করে ফেলবে, কারণ YAML file-এ শুধু সংখ্যা থাকে, sign-এর অর্থ consumer-এর assumption-এ বাঁধা।","Depth stream যদি আসলে meter হয় (অনেক ROS depth driver-এর <code>32FC1<\/code> এমনই), তাহলে <code>/1000<\/code> ভাগ depth-কে 1000 গুণ ছোট করে ফেলবে (0.40 m এর বদলে 0.0004 m) — <code>z_offset<\/code>-এ বিশাল ভুল মান save হবে এবং arm ভুল উচ্চতায় reach করবে; এই ভুল চোখে পড়বে না যতক্ষণ না value-গুলোর পরিসর আলাদাভাবে যাচাই করা হয়।","Index-এর ক্রম উল্টে গেলে (<code>[x, y]<\/code> বদলে <code>[y, x]<\/code> — row-major convention ভুলে) ভুল pixel-এর depth পড়া হবে; 640x480 image-এ <code>int(cx)<\/code> মান 479-এর বেশি হলে <code>IndexError<\/code>-এ callback crash করবে, নাহলে নীরবে ভুল measurement।","<code>.item()<\/code> বাদ দিলে <code>yaml.dump<\/code> numpy scalar serialize করতে ব্যর্থ হয়ে exception দিতে পারে — ফলে SPACE চাপার পরও file-এ পুরনো বা আংশিক মান থেকে যেতে পারে।","এক frame-এ একাধিক tag থাকলে loop প্রতিটির জন্যই file লেখে, কিন্তু শেষ পর্যন্ত থাকে শেষ tag-এর value (<b>last tag wins<\/b>) — অন্য tag-গুলোর measurement চুপচাপ হারিয়ে যায়।","SPACE চাপলেও gate বন্ধ থাকলে (tag নেই, বা <code>pubPos_flag<\/code> আগেই <code>True<\/code> — যেমন <code>grasp_done<\/code> এসেছে) কিছুই save হবে না, আর একবার ভুল measurement-এ save হলে এই file-এ reset-এর কোনো পথ নেই — node আবার চালু করতে হয়।"]},"robot":{"correct":"Jetson-এ এই code সঠিক চললে synced color+depth frame থেকে tag36h11 tag-টি শনাক্ত হয়, tag center pixel-এর depth <code>depth_image_info[int(cy),int(cx)]<\/code> থেকে পড়ে (mm ধরে) <code>/1000<\/code>-এ meter-এ রূপান্তরিত হয়, <code>compute_heigh<\/code> pixel-টিকে camera frame-&gt;end-effector-&gt;base frame-এ নিয়ে গিয়ে tag-এর base-frame position <code>pose<\/code> দেয়, আর <code>target - measured<\/code> বিয়োগে তিনটি offset বের হয়। User SPACE (key code 32, line 226-এর <code>waitKey(10)<\/code> থেকে) চাপলে <code>pubPos_flag<\/code> latch হয়, block-style YAML আকারে <code>/home/jetson/yahboomcar_ws/src/arm_kin/param/offset_value.yaml<\/code> file-এ <code>x_offset<\/code>/<code>y_offset<\/code>/<code>z_offset<\/code> লেখা হয়, terminal-এ <code>Finish calibrate offset.<\/code> দেখা যায়, আর পরবর্তী <code>arm_kin<\/code> kinematics node এই file পড়ে arm-এর grasp position শোধরায় — ফলে arm পরের বার tag-এর ঠিক উপরে (0.145, 0, 0.04) m target-এ যেতে পারে। সাথে প্রতি frame-ে RGB-&gt;BGR convert করে FPS overlay সহ <code>result_image<\/code> window-টি দেখা যায়, যাতে user SPACE চাপার আগে measurement দৃশ্যত যাচাই করতে পারে।","incorrect":"ভুল হলে: depth unit আসলে meter হলে <code>/1000<\/code> ভাগে সব offset অর্থহীন স্কেলে ছোট হবে এবং arm ভুল জায়গায় reach করবে; index <code>[y, x]<\/code> উল্টালে ভুল depth বা <code>IndexError<\/code>-এ callback crash — micro-ROS serial bridge (2,000,000 baud, ROS_DOMAIN_ID 30) চালু থাকলেও display আটকে যাবে ও calibration থেমে থাকবে; <code>.item()<\/code> ছাড়া <code>yaml.dump<\/code> exception করলে file-এ পুরনো offset থেকে যাবে; hard-coded path না মিললে <code>FileNotFoundError<\/code>; tag-ছাড়া frame-এ চাপা SPACE হারিয়ে যাবে আর একবার ভুল measurement-এ SPACE চাপলেই ভালো offset overwrite হবে (latch reset নেই, node restart ছাড়া পথ নেই); একাধিক tag থাকলে শেষ tag-এর value-ই save হবে — ফলে arm ধারাবাহিকভাবে ভুল জায়গায় যাবে এবং grasp ব্যর্থ হবে।"},"id":"part-13","start":228,"end":265,"lang":"python","animType":"offsetCalibration","flags":[]},{"n":14,"fname":"arm_offset.py","enTitle":"Transform Chain to World Pose","explain":[{"a":267,"b":269,"text":"<code>move_dist(dist)<\/code> method-টি এই file-এর ভেতরে কোথাও call হয় না — এটি external বা ভবিষ্যৎ caller-দের জন্য রাখা একটি utility, যার কাজ robot base-কে একটি লক্ষ্য-দূরত্বে পৌঁছানোর জন্য wheel velocity হিসাব করা। <code>self.linearx_pid<\/code> হলো <code>simplePID<\/code> class-এর একটি instance, যা <code>from M3Pro_demo.Robot_Move import *<\/code> (line 25) এর মাধ্যমে এসেছে — <code>simplePID<\/code>-এর implementation এই folder-এ নেই, তাই শুধু usage থেকে যুক্তি করা যায়। Constructor-এ <code>self.linearx_PID = (0.5, 0.0, 0.2)<\/code>-কে 1000.0 দিয়ে ভাগ করার পর প্রকৃত gain হলো (0.0005, 0.0, 0.0002) — অর্থাৎ প্রায় pure P সাথে সামান্য D। <code>compute(dist, 200)<\/code>-এর প্রথম argument <code>dist<\/code> সম্ভবত millimeter-এ কোনো দূরত্ব/error (কারণ <code>self.grasp_Dist = 220.0<\/code> mm এককে লেখা), আর দ্বিতীয় argument 200 সম্ভবত millisecond-এ dt — implementation বাইরে থাকায় এটি নিশ্চিত করে বলা যাবে না।"},{"a":270,"b":270,"text":"<code>self.pubVel(linear_x, 0, 0)<\/code> PID-এর output-কে সরাসরি motion command-এ পরিণত করে। <code>pubVel<\/code> এই file-এর line 170-এ define করা helper, যা একটি <code>Twist<\/code> message বানিয়ে <code>CmdVel_pub<\/code> publisher-এর \"cmd_vel\" topic-এ publish করে; এখানে <code>linear.x = linear_x<\/code>, <code>linear.y = 0<\/code>, <code>angular.z = 0<\/code> — অর্থাৎ robot শুধু সোজা সামনে-পিছনে চলবে, কোনো ঘূর্ণন বা side-slip নেই। Gain যেহেতু অত্যন্ত ছোট, error কমার সাথে সাথে velocity প্রায় শূন্যে নেমে আসবে — এটিই smooth approach-এর উদ্দেশ্য। মনে রাখুন: এই file-এ \"cmd_vel\"-এর কোনো subscriber নেই, তাই base controller node না চললে command কেউ গ্রহণ করবে না।"},{"a":272,"b":273,"text":"এই দুই line শুধু comment — কোনো code execute হয় না। এর কাজ পরবর্তী section-টিকে \"THE 3D MATH SECTION\" নামে চিহ্নিত করা: এর পরের <code>compute_heigh<\/code>, <code>get_end_point_mat<\/code> প্রভৃতি function-গুলোই এই node-এর geometry-র মূল ইঞ্জিন, যেখানে camera pixel থেকে robot base frame-এর world coordinate তৈরি হয়। লেখক নিজেই স্বীকার করেছেন বিষয়টি জটিল, তাই comment-টি পাঠককে একটি mental checkpoint দেয়।"},{"a":275,"b":277,"text":"<code>compute_heigh(self, x, y, z)<\/code> — নামটি source-এ ঠিক এভাবেই আছে (সম্ভবত compute_height হওয়ার কথা ছিল, কিন্তু identifier verbatim রাখা হয়েছে)। এটি step 1: <code>self.pixel_to_camera_depth((x,y), z)<\/code> (line 299) একটি pixel ও তার depth থেকে camera optical frame-এ 3D point বানায়। Input-এর নাম দেখে বিভ্রান্ত হবেন না: <code>x<\/code>, <code>y<\/code> এখানে AprilTag-এর center-এর PIXEL coordinate (line 232-এ <code>tags[i].center<\/code> থেকে এসেছে), আর <code>z<\/code> সেই pixel-এর depth মিটারে (line 237-এ 1000 দিয়ে ভাগ করা হয়েছিল)। Output হলো <code>camera_location<\/code> — একটি numpy 3-vector, pinhole model অনুযায়ী ((px−cx)Z/fx, (py−cy)Z/fy, Z)। Camera optical convention-টি মুখস্থ রাখুন: +Z সামনের দিকে, +X ডানে, +Y নিচে — এই convention না বুঝলে পরের step-এর rotation-এর পুরো অর্থ পড়ে যাবে।"},{"a":279,"b":280,"text":"এই line-টিই chain-এর প্রথম composition, এবং ডান দিক আগে evaluate হয়। <code>self.xyz_euler_to_mat(camera_location, (0, 0, 0))<\/code>-এ দ্বিতীয় argument হলো (roll, pitch, yaw) = (0, 0, 0), তাই <code>tfs.euler.euler2mat(0,0,0)<\/code> identity rotation দেয় এবং <code>tfs.affines.compose<\/code> একটি pure-translation 4x4 homogeneous matrix বানায় — উপরের-বামে 3x3 identity block, ডান column-এ <code>camera_location<\/code>। Tag-এর নিজস্ব orientation এখানে ইচ্ছাকৃতভাবে বাদ, কারণ line 217-এ detector-কে camera_params = None দিয়ে <code>detect<\/code> করা হয়েছিল, ফলে dt_apriltags কোনো 6-DoF pose হিসাবই করেনি — আমাদের হাতে শুধু একটি point আছে। তারপর <code>np.matmul<\/code> দিয়ে <code>self.EndToCamMat<\/code> (line 85-88) প্রয়োগ হয়: rotation R = <code>[[0,0,1],[-1,0,0],[0,-1,0]]<\/code>, translation t = (−0.101, 0.002, 0.0482) মিটার। R orthonormal এবং det = +1, অর্থাৎ proper 90 degree rotation (reflection নয়): camera-র Z অর্থাৎ optical axis যায় end-effector-এর +X এ, camera-র X যায় end-এর −Y এ, camera-র Y যায় end-এর −Z এ। Verified উদাহরণ: camera point (0.03, −0.02, 0.45) হলে end point (0.349, −0.028, 0.0682)। ফলাফল <code>PoseEndMat<\/code> মানে T_end_tag — tag-এর অবস্থান end-effector frame থেকে দেখা।"},{"a":282,"b":283,"text":"Step 3: <code>EndPointMat = self.get_end_point_mat()<\/code> end-effector-এর অবস্থান robot base frame থেকে দেখা 4x4 matrix বানায় (হিসাবের বিস্তারিত line 293-297-এ)। এখানে একটি গুরুত্বপূর্ণ সতর্কতা: <code>CurEndPos<\/code> আসলে startup-এর একবারের FK snapshot — <code>get_current_end_pos()<\/code> শুধু <code>main()<\/code>-এ <code>rclpy.spin<\/code>-এর আগে একবার call হয়েছে, আর সেই service request-এ শুধু <code>request.cur_joint1<\/code> set হয়েছিল (line 182-তে source-এর নিজের একটি comment ছাড়া আর কিছু নেই), বাকি joint-গুলো srv-এর default মান নেয় যা এই folder-এর বাইরে। তাই এই পুরো world-pose হিসাবের নীরব অনুমান: arm startup-এর home pose ([90,90,0,0,90,90] degree) থেকে সরেনি। Arm নড়লে (যেমন grasp-এর পরে) এই matrix পুরনো হয়ে যাবে এবং tag-এর world position ভুল frame-এ ঘুরে যাবে।"},{"a":285,"b":286,"text":"Step 4: <code>WorldPose = np.matmul(EndPointMat, PoseEndMat)<\/code> — দুটি 4x4 matrix-এর গুণফল, গাণিতিকভাবে T_world_tag = T_world_end · T_end_cam · T_cam_tag। Matrix multiplication non-commutative হওয়ায় order অর্থবহ: ডানদিকের transform আগে প্রয়োগ হয়, বাম দিকেরটা বাইরের frame। উল্টো ক্রমে লিখলে dimension 4x4-ই থাকবে বলে Python কোনো error দেবে না — ফল হবে জ্যামিতিকভাবে অর্থহীন একটি transform, মানে নীরব bug। অন্যদিকে associativity-র কারণে grouping নির্বিচার: code যেমন আগে <code>EndToCamMat<\/code> @ T_cam_tag করে পরে <code>EndPointMat<\/code> দিয়ে গুণ করে, আর তিনটিকে একবারে বাম থেকে গুণ করলে ফল হুবহু একই। একবার compose করা matrix-এ নতুন frame যোগ করা মাত্র আরেকটি <code>np.matmul<\/code> — আলাদা আলাদা trigonometric identity মনে রাখার চেয়ে এটি অনেক নির্ভরযোগ্য এবং nested rotation-এ numerical error-ও কম জমে।"},{"a":288,"b":289,"text":"<code>pose_T, pose_R = self.mat_to_xyz_euler(WorldPose)<\/code> (implementation line 335-341) ফলাফল matrix-কে মানুষের পড়ার রূপে ফিরিয়ে আনে: <code>tfs.affines.decompose<\/code> দিয়ে translation, rotation, scale, shear আলাদা করে, তারপর <code>tfs.euler.mat2euler(r)<\/code> দিয়ে rotation matrix থেকে euler angle বের করে। <code>degrees<\/code> parameter-এর default False হওয়ায় <code>pose_R<\/code> radian-এ আসবে। লক্ষ করুন এখানে শুধু <code>pose_T<\/code> ব্যবহৃত হয় — <code>pose_R<\/code> (tag-এর orientation) ফেলে দেওয়া হয়েছে, কারণ এই calibration-এ আগ্রহ শুধু position-এ। ভেতরের সব হিসাব quaternion ও matrix দিয়ে হয়েছে (gimbal lock এড়াতে), শুধু শেষ প্রদর্শনের জন্য euler-এ রূপান্তর — এটি একটি শিক্ষণীয় pattern।"},{"a":290,"b":290,"text":"<code>print(\"pose_T: \", pose_T)<\/code> প্রতিটি synced frame-এ tag-এর world [X, Y, Z] terminal-এ ছাপে। Calibration চালানোর সময় এটিই আপনার প্রধান observability window: tag সরালে সংখ্যা সাথে সাথে বদলাবে, আর সংখ্যা এলোমেলো লাফালে বুঝবেন depth noise বা stale <code>CurEndPos<\/code> সমস্যা করছে। খরচের দিক: প্রতি frame-এ একটি blocking print, যা উচ্চ frame-rate এ pipeline-কে সামান্য ধীর করতে পারে।"},{"a":291,"b":291,"text":"<code>return pose_T<\/code> শুধু translation vector (মিটারে) ফেরত দেয়, rotation নয়। Caller হলো line 240-এর <code>pose = self.compute_heigh(cx,cy,cz)<\/code>, এবং পরের line-গুলোর <code>x_offset_value = 0.145 - pose[0]<\/code> ইত্যাদি হিসাব এই vector-এর উপরেই দাঁড়িয়ে; line 251-এ <code>.item()<\/code> call-ও প্রমাণ যে element-গুলো numpy scalar। অর্থাৎ এই return value-ই <code>offset_value.yaml<\/code>-এ লেখা সংখ্যার একমাত্র উৎস — এখানে 1 mm error মানে calibration file-এ 1 mm error।"},{"a":293,"b":295,"text":"<code>get_end_point_mat()<\/code> <code>CurEndPos<\/code>-এর ছয়টি উপাদান ([x, y, z, roll, pitch, yaw]) কে একটি 4x4 rigid transform-এ রূপান্তর করে। Line 295-এ <code>self.euler_to_quaternion(self.CurEndPos[3], self.CurEndPos[4], self.CurEndPos[5])<\/code> rotation অংশটি quaternion হিসেবে বানায়। <code>euler_to_quaternion<\/code> (line 322-328) ভেতরে <code>tf.quaternion_from_euler<\/code> ব্যবহার করে যা (x, y, z, w) ক্রমে return করে, কিন্তু সেটিকে [qw, qx, qy, qz] অর্থাৎ w আগে রেখে সাজিয়ে দেয় — কারণ পরের ধাপে <code>transforms3d<\/code> লাইব্রেরির convention w-first। Startup snapshot অনুযায়ী roll = 0.00036, pitch = 1.3962 rad (= 80.0 degree), yaw = 0.00033 — প্রায় pure pitch; verified quaternion হলো (w, x, y, z) = (0.766, 0, 0.6428, 0)। এই reorder না করলে ভুল quaternion ভুল rotation matrix বানাত এবং tag-এর world position একেবারে অন্য জায়গায় চলে যেত।"},{"a":296,"b":297,"text":"Line 296: <code>self.xyz_quat_to_mat<\/code> (line 330-333) দুটি তালিকা নেয় — translation [0.1279, 0.00023, 0.1674] মিটার এবং w-first quaternion — তারপর <code>tfs.quaternions.quat2mat<\/code> দিয়ে 3x3 rotation বানিয়ে <code>tfs.affines.compose<\/code> দিয়ে চূড়ান্ত 4x4 matrix গঠন করে। এখানে scale হিসেবে [1, 1, 1] দেওয়া হয়েছে: rigid transform-এ scale অবশ্যই 1 হতে হবে, নাহলে পরে <code>tfs.affines.decompose<\/code> ভিন্ন scale বের করবে এবং euler extraction বিকৃত হবে। <code>return endpoint_mat<\/code> — এই matrix-ই step 3-এর <code>EndPointMat<\/code> হিসেবে <code>compute_heigh<\/code>-এ ফেরে এবং chain-এর শেষ গুণফলের বাম প্রান্ত হয়।"}],"math":{"intro":"নিচে <code>compute_heigh<\/code>-এর তিন-ধাপ matrix chain-এর সম্পূর্ণ derivation: সবচেয়ে সরল সমীকরণ থেকে শুরু করে ঠিক সেই রূপ পর্যন্ত যেটি code গণনা করে; তারপর বাস্তব সংখ্যায় প্রতিটি arithmetic step, code expression থেকে গাণিতিক term-এর mapping, এবং শেষে কোন ভুলে কী ভেঙে পড়ে।","levels":[{"label":"Level 1 — একটি rigid transform-এর মূল সমীকরণ","latex":"\\[p_{end} = R_{ec}\\,p_{cam} + t_{ec}\\]","text":"যেকোনো rigid (দূরত্ব-সংরক্ষক) transform মানে আগে rotation, পরে translation। এখানে <code>R_ec<\/code> = <code>self.EndToCamMat<\/code>-এর উপরের-বাম 3x3 block <code>[[0,0,1],[-1,0,0],[0,-1,0]]<\/code>, <code>t_ec<\/code> = তার চতুর্থ column-এর প্রথম তিন সংখ্যা (−0.101, 0.002, 0.0482) মিটার, আর <code>p_cam<\/code> = step 1-এর <code>camera_location<\/code>।"},{"label":"Level 2 — Homogeneous coordinate-এ একটি গুণফল","latex":"\\[\\tilde{p}=\\begin{bmatrix}p\\\\1\\end{bmatrix},\\qquad T_{ec}=\\begin{bmatrix}R_{ec}&t_{ec}\\\\0&0&0&1\\end{bmatrix},\\qquad \\tilde{p}_{end}=T_{ec}\\,\\tilde{p}_{cam}\\]","text":"point-এর শেষে 1 যোগ করে 4-element vector বানালে affine সম্পর্কটি একটি single matrix multiplication-এ পরিণত হয়। <code>self.EndToCamMat<\/code> (line 85-88) ঠিক এই 4x4 আকারেই hard-coded — শেষ row (0, 0, 0, 1) হলো homogeneous structure-এর চিহ্ন।"},{"label":"Level 3 — Tag point-এর pure-translation matrix","latex":"\\[T_{ct}=\\begin{bmatrix}I_3&p_{cam}\\\\0&0&0&1\\end{bmatrix}\\]","text":"<code>self.xyz_euler_to_mat(camera_location, (0, 0, 0))<\/code> ঠিক এই matrix বানায়: euler (0,0,0) মানে <code>tfs.euler.euler2mat(0,0,0)<\/code> = identity, তাই rotation block-এ I_3 এবং translation column-এ <code>p_cam<\/code>। Tag-এর orientation অজানা রাখা হয়েছে কারণ detector call-এ camera_params None ছিল।"},{"label":"Level 4 — CurEndPos থেকে EndPointMat (euler → quaternion → matrix)","latex":"\\[q=(w,x,y,z),\\quad R(q)=R_z(\\psi)\\,R_y(\\theta)\\,R_x(\\phi),\\qquad T_{we}=\\begin{bmatrix}R(q)&t_{we}\\\\0&0&0&1\\end{bmatrix}\\]","text":"<code>get_end_point_mat()<\/code> প্রথমে <code>euler_to_quaternion<\/code> দিয়ে (phi, theta, psi) = (<code>CurEndPos[3]<\/code>, <code>CurEndPos[4]<\/code>, <code>CurEndPos[5]<\/code>) কে w-first quaternion-এ নেয়, তারপর <code>xyz_quat_to_mat<\/code> সেটিকে rotation matrix-এ পরিণত করে এবং <code>tfs.affines.compose<\/code> দিয়ে unit scale সহ 4x4 matrix বানায়; <code>t_we<\/code> = (<code>CurEndPos[0]<\/code>, <code>CurEndPos[1]<\/code>, <code>CurEndPos[2]<\/code>) মিটার।"},{"label":"Level 5 — Composition: পুরো chain এক সমীকরণে","latex":"\\[T_{wt}=T_{we}\\,T_{ec}\\,T_{ct},\\qquad T_{et}=\\begin{bmatrix}R_{ec}&R_{ec}\\,p_{cam}+t_{ec}\\\\0&0&0&1\\end{bmatrix}\\]","text":"<code>PoseEndMat = np.matmul(self.EndToCamMat, T_ct)<\/code> মানে T_et, আর <code>WorldPose = np.matmul(EndPointMat, PoseEndMat)<\/code> মানে T_wt। Associativity: (T_we T_ec) T_ct = T_we (T_ec T_ct) — code-এর grouping যেকোনো ভাগে করলেও ফল অভিন্ন, কিন্তু ভেতরের order বদলালেই ফল ভুল।"},{"label":"Level 6 — Decomposition: matrix থেকে আবার X, Y, Z","latex":"\\[T_{wt}=\\begin{bmatrix}R_w&t_w\\\\0&0&0&1\\end{bmatrix}\\;\\Longrightarrow\\; t_w=(X,Y,Z),\\qquad (\\phi,\\theta,\\psi)=\\mathrm{mat2euler}(R_w)\\]","text":"<code>mat_to_xyz_euler(WorldPose)<\/code> প্রথমে <code>tfs.affines.decompose<\/code> দিয়ে t_w আলাদা করে, তারপর <code>tfs.euler.mat2euler<\/code> দিয়ে rotation-কে euler-এ ফেরায়; <code>return pose_T<\/code> শুধু t_w অর্থাৎ মিটারে [X, Y, Z] ফেরত দেয়।"}],"numeric":[{"latex":"\\[\\begin{aligned}x_{end}&=0(0.03)+0(-0.02)+1(0.45)-0.101=0.45-0.101=0.349\\\\y_{end}&=-1(0.03)+0(-0.02)+0(0.45)+0.002=-0.03+0.002=-0.028\\\\z_{end}&=0(0.03)-1(-0.02)+0(0.45)+0.0482=0.02+0.0482=0.0682\\end{aligned}\\]","text":"camera_location = (0.03, −0.02, 0.45) নিলে <code>PoseEndMat<\/code>-এর translation হয় (0.349, −0.028, 0.0682) — এটি verified উদাহরণ। প্রতিটি row-এ দেখুন কোন camera axis কোথায় যাচ্ছে: camera-র Z (0.45) সরাসরি end-এর X হয়েছে, camera-র X (0.03) চিহ্ন উল্টে end-এর −Y হয়েছে, camera-র Y (−0.02) চিহ্ন উল্টে end-এর +Z হয়েছে।"},{"latex":"\\[T_{we}=\\begin{bmatrix}1&0&0&0.1279\\\\0&1&0&0.00023\\\\0&0&1&0.1674\\\\0&0&0&1\\end{bmatrix}\\;\\Longrightarrow\\;\\begin{aligned}X_w&=0.1279+0.349=0.4769\\\\Y_w&=0.00023-0.028=-0.0278\\\\Z_w&=0.1674+0.0682=0.2356\\end{aligned}\\]","text":"স্পষ্ট assumption: পাটিগণিত সহজ রাখতে এখানে <code>EndPointMat<\/code>-এর rotation অংশ identity ধরা হয়েছে এবং translation অংশ <code>CurEndPos<\/code>-এর বাস্তব মান (0.1279, 0.00023, 0.1674) মিটার নেওয়া হয়েছে। Identity rotation হলে world translation নিছক দুই translation-এর যোগফল, ফলে <code>pose_T<\/code> = (0.4769, −0.0278, 0.2356)। Caller তখন পেত <code>x_offset_value = 0.145 − 0.4769 = −0.3319<\/code> — বাস্তব rotation সাপেক্ষে সংখ্যাগুলো ভিন্ন হবে, যা পরের উদাহরণে।"},{"latex":"\\[\\theta=1.3962\\ \\mathrm{rad}=80.0^{\\circ},\\quad q=(w,x,y,z)=(0.766,\\;0,\\;0.6428,\\;0),\\quad R_y(\\theta)=\\begin{bmatrix}0.1736&0&0.9848\\\\0&1&0\\\\-0.9848&0&0.1736\\end{bmatrix}\\]","text":"এবার বাস্তব <code>CurEndPos<\/code> rotation: pitch = 1.3962 rad, roll ও yaw প্রায় শূন্য (0.00036 ও 0.00033), তাই rotation প্রায় pure Y-rotation (cos 1.3962 ≈ 0.1736, sin 1.3962 ≈ 0.9848)। <code>euler_to_quaternion<\/code> দেবে verified (0.766, 0, 0.6428, 0), আর <code>quat2mat<\/code> উপরের R_y দেবে। Reference-এর জন্য: R_y প্রয়োগ করলে step 2-এর (0.349, −0.028, 0.0682) হয় (0.1277, −0.028, −0.3319), তারপর <code>t_we<\/code> যোগ করলে <code>pose_T<\/code> ≈ (0.2556, −0.0278, −0.1645) — 80 degree pitch থাকায় সরল যোগফলের ফল থেকে এটি সম্পূর্ণ আলাদা; এটাই rotation-এর প্রভাব।"}],"mapping":[{"code":"self.pixel_to_camera_depth((x,y), z)","math":"p_cam = ((px − cx)·Z/fx, (py − cy)·Z/fy, Z)","text":"Step 1-এর pinhole back-projection; output হলো <code>camera_location<\/code>, বিস্তারিত পরের Part-এ।"},{"code":"self.xyz_euler_to_mat(camera_location, (0, 0, 0))","math":"T_ct = [I_3, p_cam; 0 0 0 1]","text":"euler (0,0,0) থেকে identity rotation, অর্থাৎ pure-translation homogeneous matrix।"},{"code":"self.EndToCamMat","math":"T_ec = [R_ec, t_ec; 0 0 0 1]","text":"Hand-eye calibration matrix, line 85-88-এ hard-coded; R_ec orthonormal, det = +1।"},{"code":"np.matmul(self.EndToCamMat, ...)","math":"T_et = T_ec · T_ct","text":"Composition-এর ফলে translation হয় R_ec·p_cam + t_ec — এটিই Level 1-এর সমীকরণ।"},{"code":"self.euler_to_quaternion(self.CurEndPos[3], self.CurEndPos[4], self.CurEndPos[5])","math":"q = (w, x, y, z), w-first","text":"<code>tf.quaternion_from_euler<\/code>-এর (x,y,z,w) কে [qw,qx,qy,qz] ক্রমে reorder করা হয়।"},{"code":"self.xyz_quat_to_mat([self.CurEndPos[0], self.CurEndPos[1], self.CurEndPos[2]], [end_w, end_x, end_y, end_z])","math":"T_we = [R(q), t_we; 0 0 0 1], scale = (1,1,1)","text":"<code>tfs.affines.compose<\/code> unit scale সহ rigid transform বানায়।"},{"code":"np.matmul(EndPointMat, PoseEndMat)","math":"T_wt = T_we · T_ec · T_ct","text":"পুরো chain; order বদলালে ফল বদলে যায়, grouping বদলালে যায় না।"},{"code":"self.mat_to_xyz_euler(WorldPose)","math":"(t_w, euler) = decompose(T_wt)","text":"Translation ও rotation আলাদা করে; এই code-এ শুধু t_w ব্যবহৃত হয়।"},{"code":"return pose_T","math":"t_w = (X, Y, Z) m","text":"Caller line 240-এ যায় এবং (0.145, 0, 0.04) টার্গেটের সাথে তুলনা হয়।"},{"code":"self.linearx_pid.compute(dist, 200)","math":"u = Kp·e + Ki·∫e·dt + Kd·(de/dt)","text":"Gain (0.0005, 0.0, 0.0002); 200 সম্ভবত ms-এ dt, <code>simplePID<\/code> এই folder-এর বাইরে defined।"}],"failure":["Unit ভুল: <code>z<\/code> যদি মিটার না হয়ে millimeter থেকে যায় (line 237-এর 1000 দিয়ে ভাগ বাদ পড়লে), <code>camera_location<\/code> প্রায় 1000 গুণ বড় হয়ে <code>pose_T<\/code> শত মিটারে চলে যায় এবং <code>offset_value.yaml<\/code>-এ অর্থহীন সংখ্যা লেখা হয়।","Sign ভুল: <code>t_ec<\/code>-এর −0.101-এর জায়গায় +0.101 হলে X-এ প্রায় 20.2 cm স্থায়ী bias ঢুকবে; tag সব সময় এক দিকে সরে দেখাবে এবং calibration কখনো শূন্যে converge করবে না।","det(R) = −1 হলে (reflection) coordinate mirror হয়ে যায় — ডানের বস্তু বামে দেখাবে; এখানকার R verifiedভাবে det = +1, কিন্তু নতুন hand-eye matrix লেখার সময় এটি যাচাই করা আবশ্যক।","Quaternion convention উল্টালে: (x, y, z, w)-কে (w, x, y, z) ভেবে <code>quat2mat<\/code>-এ দিলে সম্পূর্ণ ভিন্ন rotation তৈরি হয় — tag-এর world position অন্য কোথাও চলে যায়, কোনো error message ছাড়াই।","Multiplication order উল্টালে (আগে <code>PoseEndMat<\/code> না দিয়ে পরে): dimension 4x4 থাকায় Python নীরবে গুণ করে দেবে, ফল জ্যামিতিকভাবে অর্থহীন — সবচেয়ে বিপজ্জনক silent bug।","Stale <code>CurEndPos<\/code>: arm নড়ার পরেও startup snapshot ব্যবহার হলে <code>EndPointMat<\/code> পুরনো থাকে এবং tag-এর world pose ভুল frame-এ ঘোরে; আর FK request-এ শুধু <code>cur_joint1<\/code> set ছিল, বাকি joint srv default-এ থাকে (এই folder-এর বাইরে)।","Scale ভুল: <code>tfs.affines.compose<\/code>-এ [1,1,1]-এর বদলে অন্য scale দিলে <code>decompose<\/code> ভিন্ন scale ফেরত দেবে এবং <code>mat2euler<\/code>-এর ফল বিকৃত হবে।","PID-তে gain-এর 1000 দিয়ে ভাগ বাদ গেলে wheel velocity প্রায় 1000 গুণ বেড়ে যাবে (jerk ও overshoot), আর dt হিসেবে 200 ভুল হলে D-term ভুল হিসাব করবে।"]},"robot":{"correct":"সব ঠিক থাকলে Jetson-এর terminal-এ প্রতিটি synced frame-এ <code>pose_T<\/code> লাইনে AprilTag-এর base-frame [X, Y, Z] ছাপা হয়; SPACE (key code 32) চাপলে (0.145, 0, 0.04) মিটার টার্গেটের সাথে তুলনা করে <code>x_offset<\/code>/<code>y_offset<\/code>/<code>z_offset<\/code> <code>offset_value.yaml<\/code>-এ লেখা হয়, ফলে পরের run-এ arm_kin package-এর kinematics camera-আর্ম ব্যবধান ঠিক করে সামলাতে পারে এবং grasp-এর সময় claw ট্যাগের প্রকৃত অবস্থানে পৌঁছায়। 6-DOF arm home pose-এ স্থির থাকা অবস্থায় Orbbec DaBai DCW2-এর color ও depth frame <code>ApproximateTimeSynchronizer<\/code> দিয়ে জোড়া লাগায়, তাই terminal-এর সংখ্যাগুলো স্থির দাঁড়ায় — এটিই calibration করার আগে বিশ্বাসযোগ্যতার পরীক্ষা।","incorrect":"Depth unit-এর অনুমান ভুল হলে (DaBai-এর 32FC1 stream প্রকৃতপক্ষে millimeter কি না তা এই folder থেকে যাচাই করা যায় না) ছাপা সংখ্যাগুলো হাজার গুণ এদিক-ওদিক সরে যাবে — মিলিমিটারকে 1000 দিয়ে ভাগ না করলে pose_T শত মিটারে উঠবে, আবার স্রোত যদি আসলে মিটারে থাকে তাহলে ভাগ করায় সাব-মিলিমিটারে নেমে যাবে — এবং লেখা offset-ও অর্থহীন হবে; <code>EndToCamMat<\/code>-এর sign বা quaternion order ভুল হলে tag terminal-এ ভুল দিকে দেখাবে; arm home থেকে সরে গেলেও <code>CurEndPos<\/code> stale থাকায় world pose ভুল হবে; এসব অবস্থায় SPACE দিয়ে লেখা offset ভুল হবে বলে arm বারবার টার্গেটের পাশ কাটিয়ে grasp ব্যর্থ করবে। <code>move_dist<\/code>-এর PID gain বা dt ভুল হলে base হয় এক লাফে 220 mm (<code>grasp_Dist<\/code>) লক্ষ্য পার হয়ে যাবে, নয়তো একদমই নড়বে না।"},"id":"part-14","start":267,"end":297,"lang":"python","animType":"transformChain","flags":[]},{"n":15,"fname":"arm_offset.py","enTitle":"Pinhole Inverse Projection","explain":[{"a":299,"b":299,"text":"<p>Function-এর signature: <code>pixel_to_camera_depth(self, pixel_coords, depth)<\/code> — পুরো File-এর একমাত্র pure camera-math Function; কোনো ROS topic, publisher বা service ছুঁয়ে দেখে না, এর ভরসা শুধু Input-এর উপরে আর <code>self.camera_info_K<\/code>-এর উপরে। Input দুটি: <code>pixel_coords<\/code> হলো AprilTag center-এর (x, y) pixel tuple, আর <code>depth<\/code> হলো সেই pixel-এর দূরত্ব meter এককে (line 237-এ 1000 দিয়ে ভাগ করা হয়ে গেছে)। একমাত্র call site হলো line 277, <code>compute_heigh<\/code>-এর ভেতর থেকে — অর্থাৎ প্রতিটি synchronized color+depth frame-এ tag পাওয়া গেলে আর <code>self.pubPos_flag<\/code> তখনও False থাকলে (line 229-এর guard) এটি চলে, আর return করে camera optical frame-এ একটি 3D point। Function-টি কোনো state বদলায় না, তাই একই Input সব সময় একই Output দেয় — Jetson-এ camera না চালিয়েও Python shell থেকে একে আলাদা করে test করা যায়, এটাই debugging-এর সবচেয়ে নিরাপদ জায়গা।<\/p>"},{"a":300,"b":301,"text":"<p>দুই লাইনের Comment, একটিই বক্তব্য: camera lens-এর property <code>(fx, fy, cx, cy)<\/code> ব্যবহার করে 2D pixel + distance থেকে real 3D <code>X, Y, Z<\/code> coordinate বানানো হবে। Comment-এ যাকে সংক্ষেপে camera math বলা হয়েছে, তার প্রকৃত নাম pinhole camera model-এর inverse projection — নিচের Math section-এ similar triangle থেকে শুরু করে এর পূর্ণ derivation দেওয়া হয়েছে। যে চারটি symbol-এর কথা এখানে বলা হয়েছে, ঠিক পরের লাইনেই সেগুলো unpack হয়ে যায়।<\/p>"},{"a":302,"b":302,"text":"<p>Line 80-এ hardcode করা flat list <code>self.camera_info_K<\/code> থেকে intrinsic parameter-গুলো unpack হয়। এই 9-সংখ্যার list আসলে 3x3 camera matrix <b>K<\/b>-এর row-major flattened রূপ <code>[fx, 0, cx, 0, fy, cy, 0, 0, 1]<\/code>, তাই দরকারি চারটি মান index ধরে তোলা হয়েছে: <code>self.camera_info_K[0]<\/code> = fx = 477.57, <code>self.camera_info_K[4]<\/code> = fy = 477.55, <code>self.camera_info_K[2]<\/code> = cx = 319.38, <code>self.camera_info_K[5]<\/code> = cy = 238.64 — লক্ষ্য করুন index-এর ক্রম 0, 4, 2, 5, ascending নয়, কারণ flat layout-এ দুটি focal length main diagonal-এ (index 0 ও 4) বসে থাকে অথচ দুটি principal point আলাদা row-এর তৃতীয় ঘরে (index 2 ও 5)। fx, fy-এর একক pixel — focal length-কে এক pixel-এর আসল দৈর্ঘ্য দিয়ে ভাগ করা রূপ — আর (cx, cy) হলো principal point, 640x480 image-এর জন্য যার (319.38, 238.64) মান প্রায় কেন্দ্রেই আছে। জরুরি সীমাবদ্ধতা: value-গুলো <code>/camera/color/camera_info<\/code> topic থেকে runtime-এ পড়া হয় না, কোডে লেখা আছে — camera বদলালে বা lens adjust হলে এই line আর line 80 দুটোই হাতে edit করতে হবে, নাহলে এর পরের প্রতিটি গণনা নীরবে ভুল হবে।<\/p>"},{"a":303,"b":303,"text":"<p><code>px, py = pixel_coords<\/code> — tuple unpacking। Caller পাঠায় AprilTag detector-এর দেওয়া tag center, যা sub-pixel float value হতে পারে, তাই <code>px<\/code>, <code>py<\/code> integer নাও হতে পারে; পক্ষের বিপরীতে depth image-ে মান পড়া হয়েছে <code>int()<\/code> দিয়ে truncate করা pixel-এ (line 237) — projection-এ float center আর depth-এ truncated pixel, sub-pixel পার্থক্যটা সামান্য হলেও convention-টা মনে রাখা ভালো। আরেকটি নাম-নিয়ে সতর্কতা: callback-এর <code>cx<\/code>, <code>cy<\/code> (line 233-234) হলো tag center pixel, কিন্তু এই Function-এর ভেতরের <code>cx<\/code>, <code>cy<\/code> হলো camera-র principal point — একই নাম, সম্পূর্ণ ভিন্ন অর্থ; Python-এর function scope দুটিকে আলাদা রাখে বলে bug হয় না, কিন্তু পড়ার সময় line number দেখে বুঝে নিতে হবে কোনটা কোনটা।<\/p>"},{"a":304,"b":304,"text":"<p>X-অক্ষের inverse projection: <code>x = (px - cx) * depth / fx<\/code> — এটি forward projection <code>px = fx * X / Z + cx<\/code>-কে rearrange করার রূপ, পূর্ণ derivation Math section-এ। প্রথমে <code>px - cx<\/code> pixel-এর অবস্থানকে image-এর উপরের-বাম corner-origin থেকে optical center (principal point) থেকে দূরত্বে নিয়ে যায়, কারণ pinhole geometry ধরে রশ্মি lens-এর কেন্দ্র দিয়ে যায়, corner দিয়ে নয়। এরপর <code>depth<\/code> (মানে Z, meter-এ) দিয়ে গুণ আর <code>fx<\/code> (pixel-এ) দিয়ে ভাগ করলে pixel/pixel আর m-এর একক-কাটাকাটি হয়ে ফলাফল meter-এ আসে। এই <code>x<\/code> হলো camera optical frame-এর X (ডানে ধনাত্মক), যা পরে <code>EndToCamMat<\/code> দিয়ে end-effector frame-এ যাবে — তাই এই এক লাইনের ভুল পুরো calibration chain জুড়ে বহন হবে।<\/p>"},{"a":305,"b":305,"text":"<p>Y-অক্ষের সারি: <code>y = (py - cy) * depth / fy<\/code>, গঠন আগের লাইনের মতোই, শুধু <code>fy = 477.55<\/code> আর <code>cy = 238.64<\/code> ব্যবহৃত হয়। <code>fx<\/code> আর <code>fy<\/code> প্রায় সমান (477.57 বনাম 477.55) কারণ sensor-এর pixel প্রায় বর্গাকার, তবে lens calibration-এর সূক্ষ্ম পার্থক্য ধরার জন্য দুটি আলাদা রাখা হয়েছে। ভেতরে একটি convention লুকানো: image coordinate-এ <code>py<\/code> নিচের দিকে বাড়ে (row index নিচে বাড়ে), আর এই সূত্র সেই অনুযায়ী camera frame-এর Y-কেও নিচে ধনাত্মক ধরে নেয় — এটাই standard optical convention (X ডানে, Y নিচে, Z সামনে)। Verified উদাহরণে <code>py = 200<\/code> যেহেতু <code>cy = 238.64<\/code>-এর উপরে, <code>py - cy = -38.64<\/code> ঋণাত্মক এবং সেই ঋণাত্মকতা <code>y = -0.0405<\/code> m-এ অটুট থাকে। এই sign convention ইচ্ছে করে বদলালে পরের <code>EndToCamMat<\/code>-এর তৃতীয় row <code>[0, -1, 0]<\/code>-ও বদলাতে হবে, নাহলে tag-এর অবস্থান উপর-নিচ mirror হয়ে যাবে।<\/p>"},{"a":306,"b":306,"text":"<p><code>z = depth<\/code> — Camera frame-এর Z (optical axis বরাবর দূরত্ব) কোনো গণনা ছাড়াই depth image থেকে pass-through হয়। Pinhole projection নিজে থেকে depth দিতে পারে না: একটি pixel আসলে optical center থেকে বেরিয়ে যাওয়া একটি পুরো রশ্মির প্রক্ষেপ, সেই রশ্মির যেকোনো দূরত্বেই বস্তুটি থাকতে পারে — এ কারণেই এই প্রকল্পে Orbbec DaBai DCW2-এর active depth sensor আর <code>ApproximateTimeSynchronizer<\/code> দিয়ে color+depth frame জোড়া লাগানো হয়েছে। Z-এর একমাত্র উৎস line 237: <code>depth_image_info[int(cy),int(cx)]/1000<\/code> — অর্থাৎ stream-কে millimeter ধরে meter-এ রূপান্তর করা হয়েছে। সৎ সতর্কতা: driver-এর <code>32FC1<\/code> depth stream আসলে mm নাকি meter এককে পাঠায় তা এই folder-এর ভেতরের কোড দেখে যাচাই করা যায় না — যদি driver আগে থেকেই meter পাঠায়, তবে এই 1000 দিয়ে ভাগ <code>z<\/code>-কে হাজার গুণ ছোট করে দেবে, আর সেই ভুল <code>x<\/code>, <code>y<\/code>-তেও সমানভাবে ঢুকে যাবে।<\/p>"},{"a":307,"b":307,"text":"<p>তিনটি মান <code>np.array([x, y, z])<\/code> হিসেবে return হয় — shape <code>(3,)<\/code> এর একটি numpy array, camera optical frame-এ tag center-এর 3D coordinate meter-এ। <code>compute_heigh<\/code> এটিকে <code>xyz_euler_to_mat<\/code>-এর ভেতরে <code>np.squeeze(np.asarray(xyz))<\/code> দিয়ে 4x4 homogeneous matrix-এর translation অংশ বানায়, তারপর <code>EndToCamMat<\/code> ও FK থেকে আসা <code>EndPointMat<\/code> দিয়ে পরপর গুণ হয়ে base frame-এ tag-এর pose বের হয়। একটি পরোক্ষ ফলাফল: depth image থেকে আসার দরুন return-এর element-গুলো numpy scalar হতে পারে, আর ঠিক এই কারণেই line 251-253-এ <code>.item()<\/code> দিয়ে plain Python float বানানো দরকার হয় <code>yaml.dump<\/code>-এর আগে। এই array-ই পুরো calibration chain-এর ভিত্তি — এখানকার ত্রুটি থাকলে SPACE (key code 32) চাপলে সেটি <code>offset_value.yaml<\/code>-এ স্থায়ী ভুল offset হিসেবে লেখা হয়ে যাবে।<\/p>"}],"math":{"intro":"<p>এই নয় লাইনের Function-টি pinhole camera model-এর inverse projection। Camera নিজে forward দিকে কাজ করে: 3D পৃথিবীর একটি point থেকে lens-এর কেন্দ্র দিয়ে একটি সরলরেখা টেনে image plane-এ pixel ফেলে, আর এই projection-এ depth হারিয়ে যায়। এই Function উল্টো পথে হাঁটে — একটি pixel আর তার depth থেকে 3D coordinate ফেরায়। নিচে ধাপে ধাপে দেখানো হলো similar triangle থেকে শুরু করে ঠিক সেই সমীকরণ পর্যন্ত পৌঁছানো, যা line 304-306 হুবহু ব্যবহার করে।<\/p>","levels":[{"label":"ধাপ ১ — Pinhole model ও similar triangle","latex":"\\[ \\frac{X}{Z} \\;=\\; \\frac{p_x - c_x}{f_x} \\]","text":"<p>Pinhole camera-তে optical center (lens-এর ছিদ্র) দিয়ে যাওয়া রশ্মি 3D point <code>(X, Y, Z)<\/code> থেকে image plane পর্যন্ত যায়। Optical center-এর দুই পাশে দুটি <b>similar right triangle<\/b> তৈরি হয়: বড় triangle-এর লম্ব ভুজ <code>X<\/code> ও ভূমি <code>Z<\/code> (দুটোই meter-এ), ছোট triangle-এর লম্ব ভুজ <code>px - cx<\/code> ও ভূমি <code>fx<\/code> (দুটোই pixel-এ)। কোণ একই হওয়ায় ভুজের অনুপাত সমান — দুই দিকের একক নিজেদের মধ্যেই কাটাকাটি হয়ে উভয়পক্ষ dimensionless থাকে। এটিই সব pinhole গণিতের ভিত্তি।<\/p>"},{"label":"ধাপ ২ — Forward projection: Camera যা করে","latex":"\\[ p_x = f_x\\,\\frac{X}{Z} + c_x, \\qquad p_y = f_y\\,\\frac{Y}{Z} + c_y \\]","text":"<p>ধাপ ১-এর অনুপাত সাজিয়ে pixel-এর দিকে আনলে forward projection পাওয়া যায় — এটিই camera sensor-এ প্রতি frame-এ ঘটে থাকা গণনা। <code>cx<\/code>, <code>cy<\/code> যোগ করতে হয় কারণ pixel coordinate-এর origin image-এর উপরের-বাম corner (index (0,0)), অথচ প্রক্ষেপণ ঘটে principal point <code>(cx, cy)<\/code> কেন্দ্র করে — optical axis (Z axis) image plane যে pixel-এ আঘাত করে সেটিই principal point। <code>fx<\/code>-এর সংজ্ঞাও এখানে: lens-এর focal length (meter) কে এক pixel-এর আসল দৈর্ঘ্য (meter/pixel) দিয়ে ভাগ করলে যে সংখ্যা আসে সেটাই pixel-এককের focal length — এ কারণেই <code>fx<\/code> দিয়ে ভাগ করলে একক pixel থেকে meter-এ ফিরে আসে।<\/p>"},{"label":"ধাপ ৩ — Inverse projection: এই কোডের রূপ","latex":"\\[ X = \\frac{(p_x - c_x)\\,Z}{f_x}, \\qquad Y = \\frac{(p_y - c_y)\\,Z}{f_y}, \\qquad Z = Z_{\\text{depth}} \\]","text":"<p>Forward সমীকরণকে rearrange করে <code>X<\/code>, <code>Y<\/code>-কে একা রাখলেই line 304 ও line 305-এর হুবহু রূপ: principal point বাদ দাও, <code>Z<\/code> গুণ করো, <code>fx<\/code>/<code>fy<\/code> দিয়ে ভাগ করো। একটি pixel দিয়ে মাত্র দুটি সমীকরণ মেলে অথচ অজানা তিনটি (<code>X, Y, Z<\/code>) — তাই একা pinhole দিয়ে depth বের করা অসম্ভব, সমাধান হয় একটি পুরো রশ্মি। এই কোড <code>Z<\/code> depth image থেকে জেনে নেয় (line 306, মান line 237 থেকে), তখন রশ্মির উপর অবস্থিত একটি নির্দিষ্ট 3D point নির্ধারণ হয়ে যায়।<\/p>"},{"label":"ধাপ ৪ — Homogeneous matrix রূপ: যেই K টা flat করে রাখা","latex":"\\[ \\begin{bmatrix} X \\\\ Y \\\\ Z \\end{bmatrix} = Z\\,K^{-1}\\begin{bmatrix} p_x \\\\ p_y \\\\ 1 \\end{bmatrix}, \\qquad K^{-1} = \\begin{bmatrix} \\frac{1}{f_x} & 0 & -\\frac{c_x}{f_x} \\\\[4pt] 0 & \\frac{1}{f_y} & -\\frac{c_y}{f_y} \\\\[4pt] 0 & 0 & 1 \\end{bmatrix} \\]","text":"<p>একই গণনা matrix আকারে: <code>K<\/code> হলো line 80-এর flat list-এর পূর্ণ 3x3 intrinsic matrix <code>[[fx, 0, cx], [0, fy, cy], [0, 0, 1]]<\/code>। <code>K<\/code> inverse দিয়ে pixel-এর homogeneous রূপ <code>(px, py, 1)<\/code>-কে গুণ করলে রশ্মির দিক পাওয়া যায়, বাইরে থেকে <code>Z<\/code> দিয়ে scale করলেই concrete 3D point। <code>K<\/code> inverse-এর <code>-cx/fx<\/code>, <code>-cy/fy<\/code> entry-গুলো আসলে <code>px - cx<\/code> বিয়োগেরই আরেক পোশাক। কোডে scalar রূপটি রাখা হয়েছে কারণ চারটি স্বতন্ত্র হিসাব হিসেবে সেটি বেশি পাঠযোগ্য ও দ্রুত, কিন্তু গণিতে দুই রূপ সম্পূর্ণ সমান।<\/p>"},{"label":"ধাপ ৫ — এই Camera-র প্রকৃত সংখ্যা বসিয়ে","latex":"\\[ X = \\frac{(p_x - 319.38)\\,Z}{477.57}, \\qquad Y = \\frac{(p_y - 238.64)\\,Z}{477.55} \\]","text":"<p>শেষ ধাপে এই Orbbec DaBai DCW2-এর calibrated মান বসালে সমীকরণ এই রূপ নেয়। একক পরীক্ষা করলে দেখা যায়: <code>(p_x - c_x)<\/code> ও <code>f_x<\/code> দুটোই pixel, তাই pixel/pixel কেটে যায়; <code>Z<\/code> meter-এ থাকায় Output <code>X<\/code>, <code>Y<\/code> meter-এ আসে — ফলে <code>EndToCamMat<\/code>-এর translation <code>(-0.101, 0.002, 0.0482)<\/code> m আর desired pose <code>(0.145, 0, 0.04)<\/code> m-এর সাথে একক একেবারে মিলে যায়।<\/p>"}],"numeric":[{"latex":"\\[ \\begin{aligned} x &= \\frac{(320 - 319.38)\\times 0.40}{477.57} = \\frac{0.62 \\times 0.40}{477.57} = \\frac{0.248}{477.57} \\approx 0.000519\\ \\text{m} \\\\[4pt] y &= \\frac{(240 - 238.64)\\times 0.40}{477.55} = \\frac{1.36 \\times 0.40}{477.55} = \\frac{0.544}{477.55} \\approx 0.001139\\ \\text{m} \\\\[4pt] z &= 0.40\\ \\text{m} \\end{aligned} \\]","text":"<p><b>Verified উদাহরণ ১<\/b> — image-কেন্দ্রের কাছের pixel: <code>(px, py) = (320, 240)<\/code>, <code>depth = 0.40<\/code> m। বিয়োগের পর অবশিষ্ট মাত্র 0.62 ও 1.36 pixel, তাই <code>x<\/code>, <code>y<\/code> দুটোই মিলিমিটারের ভগ্নাংশ। অর্থাৎ এই pixel-এর পেছনের বিন্দু optical axis-এর একদম গা ঘেঁষে — সামান্য ডানে ও সামান্য নিচে (image-এ নিচে মানে camera frame-এ Y ধনাত্মক)। Final ফল: <code>(0.000519, 0.001139, 0.40)<\/code> m।<\/p>"},{"latex":"\\[ \\begin{aligned} x &= \\frac{(380 - 319.38)\\times 0.50}{477.57} = \\frac{60.62 \\times 0.50}{477.57} = \\frac{30.31}{477.57} \\approx 0.0635\\ \\text{m} \\\\[4pt] y &= \\frac{(200 - 238.64)\\times 0.50}{477.55} = \\frac{(-38.64)\\times 0.50}{477.55} = \\frac{-19.32}{477.55} \\approx -0.0405\\ \\text{m} \\\\[4pt] z &= 0.50\\ \\text{m} \\end{aligned} \\]","text":"<p><b>Verified উদাহরণ ২<\/b> — কেন্দ্র থেকে দূরের pixel: <code>px = 380<\/code> মানে principal point থেকে 60.62 pixel ডানে, আর <code>py = 200<\/code> মানে 38.64 pixel উপরে। উপরে বলে <code>py - cy<\/code> ঋণাত্মক, আর সেই ঋণাত্মকতা <code>y = -0.0405<\/code> m-এ অটুট থাকে — এটাই image-এর Y-down convention-এর সরাসরি সংখ্যাগত প্রমাণ। Final ফল: <code>(0.0635, -0.0405, 0.50)<\/code> m।<\/p>"}],"mapping":[{"code":"self.camera_info_K[0], self.camera_info_K[4]","math":"\\( f_x,\\; f_y \\)","text":"x ও y দিকের focal length, pixel এককে (477.57 ও 477.55); flat list-এ এদের index 0 ও 4, কারণ 3x3 matrix-এর main diagonal-এ বসে।"},{"code":"self.camera_info_K[2], self.camera_info_K[5]","math":"\\( c_x,\\; c_y \\)","text":"Principal point: image plane-এ যে pixel-এ optical axis লাগে; 640x480 image-এ তা প্রায় (320, 240) হওয়ার কথা, এখানে (319.38, 238.64)।"},{"code":"(px - cx), (py - cy)","math":"\\( p_x - c_x,\\; p_y - c_y \\)","text":"Corner-origin থেকে optical-center-origin-এ স্থানান্তর; এই বিয়োগ না করলে প্রতিটি পয়েন্ট তার দূরত্বের সাথে সমানুপাতিক হয়ে কোণাকুণি সরে যায়।"},{"code":"depth","math":"\\( Z \\)","text":"Depth image থেকে আসা দূরত্ব, meter এককে (line 237-এ 1000 দিয়ে ভাগ করা) — inverse projection-এর একমাত্র scale-উৎস।"},{"code":"x = (px - cx) * depth / fx","math":"\\( X = \\frac{(p_x - c_x)\\,Z}{f_x} \\)","text":"pixel থেকে meter-এ রূপান্তরের মূল লাইন: <code>depth<\/code> দিয়ে গুণ আর <code>fx<\/code> দিয়ে ভাগ মিলে pixel একক কাটে, ফল হয় camera frame-এর X (ডানে ধনাত্মক)।"},{"code":"return np.array([x, y, z])","math":"\\( (X, Y, Z) \\in \\mathbb{R}^3 \\)","text":"Camera optical frame-এ 3D vector; পরের ধাপে <code>EndToCamMat<\/code> এটিকে end-effector frame-এ নেয়, তারপর FK-এর <code>CurEndPos<\/code> মিলে base frame পর্যন্ত যায়।"}],"failure":["ভুল <code>fx<\/code>/<code>fy<\/code> (যেমন অন্য একটি camera unit-এর calibration থেকে নেওয়া) পুরো দুনিয়াকে ভুল scale-এ মাপে: 10% ছোট <code>fx<\/code> মানে <code>x<\/code>, <code>y<\/code> 10% বড় — দিক ঠিক থাকে কিন্তু দূরত্ব ভুল হয়, arm সঠিক দিকে তাক করেও কাছে বা দূরে থেমে যায়। এবং SPACE চেপে save করলে সেই ভুল <code>offset_value.yaml<\/code>-এ স্থায়ী হয়ে যায়।","ভুল <code>cx<\/code>/<code>cy<\/code> হলে lateral shift, আর ত্রুটি <code>Z<\/code>-এর সাথে সরলরৈখিক বাড়ে: 10 pixel ভুল <code>cx<\/code> মানে 0.45 m দূরত্বে <code>10 × 0.45 / 477.57 ≈ 0.0094<\/code> m অর্থাৎ প্রায় 9.4 mm পার্শ্ব-ত্রুটি — কাছের object-এ কম, দূরের object-এ বেশি, তাই একটানা offset দিয়ে সব দূরত্বের ভুল ঠিক করা যায় না।","Depth এককের mm/m গোলমাল: line 237-এর <code>/1000<\/code> ধরে নেওয়া হয়েছে stream millimeter-এ; যদি driver ইতিমধ্যে meter পাঠায়, তবে <code>z<\/code> সহ সব coordinate হাজার গুণ ছোট হয়ে যাবে — 0.40 m দূরের tag-কে 0.0004 m দূরে মনে হবে, <code>x_offset_value<\/code> প্রায় 0.145-ই থেকে যাবে আর calibration অর্থহীন হবে; উল্টো দিকে ভুল হলে (mm-এ ভাগ না করা) সব হাজার গুণ বড়।","Y-axis convention উল্টে গেলে tag-এর অবস্থান উপর-নিচ mirror হয়ে যায়: gripper tag-এর ঠিক উপরে না গিয়ে নিচে নামবে বা উল্টো। এই প্রকল্পে optical convention (Y নিচে ধনাত্মক) ইচ্ছাকৃতভাবে <code>EndToCamMat<\/code>-এর তৃতীয় row <code>[0, -1, 0]<\/code>-এ encode করা আছে — এক জায়গায় sign বদলালে অন্যটাও বদলাতে হবে, নাহলে দুই বদল এসে মিলে নীরবে ভুল দিক তৈরি করবে।","Invalid depth pixel (ঝকঝকে পৃষ্ঠ, depth range-এর বাইরে বা sensor hole-এ <code>depth = 0<\/code> বা NaN) হলে গণনা কোনো exception ছাড়াই নীরবে ভেঙে যায়: <code>z = 0<\/code> হলে <code>x = y = 0<\/code> এসে tag একদম camera-র কেন্দ্রে বসে থাকবে, NaN হলে পুরো matrix chain NaN হয়ে terminal-এর <code>pose_T<\/code> print অর্থহীন হবে — তাই SPACE চাপার আগে depth map ঠিক আছে কি না নিশ্চিত হয়ে নেওয়া জরুরি।"]},"robot":
